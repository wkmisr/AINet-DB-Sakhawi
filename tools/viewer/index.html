<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ḍawʾ mARkdown Viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='9.5 10.5 47 47' > <g stroke='%23F1C400' stroke-width='2' stroke-linecap='round'> <line x1='32' y1='31' x2='15' y2='18'/> <line x1='32' y1='31' x2='49' y2='16'/> <line x1='32' y1='31' x2='20' y2='49'/> <line x1='32' y1='31' x2='47' y2='45'/> <line x1='15' y1='18' x2='20' y2='49'/> <line x1='49' y1='16' x2='47' y2='45'/> </g> <circle cx='32' cy='31' r='6.5' fill='%23F1C400' stroke='%23001E62' stroke-width='0.8'/> <circle cx='15' cy='18' r='4.2' fill='%236F9BFF' stroke='%23001E62' stroke-width='0.8'/> <circle cx='49' cy='16' r='4.2' fill='%236F9BFF' stroke='%23001E62' stroke-width='0.8'/> <circle cx='20' cy='49' r='4.2' fill='%236F9BFF' stroke='%23001E62' stroke-width='0.8'/> <circle cx='47' cy='45' r='4.2' fill='%236F9BFF' stroke='%23001E62' stroke-width='0.8'/> </svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet philologist's workbench — calm, exact, nothing decorative
   IDEA: a public-service reading tool in the Digital Agency design system; Arabic in Amiri as in OpenITI
   PICTURE: the tagged biography itself, coloured by entity type, with its mARkdown source below
   COLOUR and TYPE: DADS tokens (key blue #0017c1, gray-900 text, 4px black + yellow focus); Noto Sans JP + Amiri + Noto Sans Mono
   LAYOUT: entry list | text + editor | card panel; stacks below 900px */
:root{color-scheme:light dark;
/* Digital Agency Design System tokens (@digital-go-jp/design-tokens 2.1.0) */
--lat:'Noto Sans JP',system-ui,sans-serif;--ar:Amiri,Lateef,"Geeza Pro",serif;--mono:'Noto Sans Mono',Monaco,Consolas,monospace;
--bg:light-dark(#f2f2f2,#1a1a1a);--paper:light-dark(#ffffff,#262626);--ink:light-dark(#1a1a1a,#f2f2f2);
--mute:light-dark(#4d4d4d,#cccccc);--line:light-dark(#cccccc,#4d4d4d);--line2:light-dark(#949494,#7f7f7f);--link:light-dark(#0017c1,#9db7f9);--key:#0017c1;--key-h:#00118f;
--per:light-dark(#0017c1,#9db7f9);--perbg:light-dark(#e8f1fe,#00118f);
--pla:light-dark(#197a4b,#9bd4b5);--plabg:light-dark(#e6f5ec,#0c472a);
--ono:light-dark(#5c10be,#ddc2ff);--onobg:light-dark(#f1eafa,#41048e);
--nas:light-dark(#8b008b,#ffd0ff);--nasbg:light-dark(#f3e5f4,#500050);
--lqb:light-dark(#006173,#c8f8ff);--lqbbg:light-dark(#e9f7f9,#004c59);
--shr:light-dark(#806300,#fff0b3);--shrbg:light-dark(#fbf5e0,#604b00);
--nis:light-dark(#3e5a00,#d0f5a2);--nisbg:light-dark(#ebfad9,#2c4100);
--oth:light-dark(#4d4d4d,#cccccc);--othbg:light-dark(#f2f2f2,#333333);
--yr:light-dark(#ac3e00,#ffc199);--yrbg:light-dark(#ffeee2,#6d2700);
--nid:light-dark(#ec0000,#ff5454);--acc:light-dark(#ce0000,#ff5454);--focus:#ffd43d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--lat);overflow-x:clip;display:flex;flex-direction:column;height:100vh}
button,input,select{font:inherit;color:inherit}
button{min-height:40px;padding:6px 14px;border:1px solid var(--key);color:var(--key);background:var(--paper);border-radius:8px;cursor:pointer;font-weight:700}
button:hover{background:var(--perbg);text-decoration:underline}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:4px solid #000;outline-offset:2px;box-shadow:0 0 0 2px var(--focus)}
button:disabled{border-color:var(--line);color:var(--line2);cursor:default;background:var(--paper);text-decoration:none}
button.pri{background:var(--key);color:#fff;border-color:var(--key)}button.pri:hover{background:var(--key-h)}
input,select{min-height:48px;padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--paper);font-size:16px}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--paper)}
header h1{font-size:20px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px}
header h1 svg{width:34px;height:34px;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
.sp{flex:1}
#status{font-size:13px;color:var(--mute)}
main{display:grid;grid-template-columns:290px minmax(0,1fr) 370px;flex:1;min-height:0}
#list,#panel{overflow:auto;border-inline-end:1px solid var(--line)}
#panel{border-inline-end:0;border-inline-start:1px solid var(--line);padding:14px 16px;background:var(--paper)}
.lhead{position:sticky;top:0;background:var(--bg);padding:10px;display:grid;gap:6px;border-bottom:1px solid var(--line);z-index:1}
.lhead label{font-size:13px;display:flex;gap:6px;align-items:center}
.item{display:block;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:8px 12px;min-height:48px;color:var(--ink);font-weight:400}
.item:hover{background:var(--perbg);text-decoration:none}
.item.on{background:var(--perbg);box-shadow:inset 4px 0 0 var(--key)}
.item .id{font-size:14px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px}
.item .nm{font-family:var(--ar);direction:rtl;text-align:right;font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;padding:0 6px;border-radius:4px;border:1px solid var(--line2);color:var(--mute)}
.badge.ed{border-color:var(--key);color:var(--link);font-weight:700;letter-spacing:.04em}
.cand.cur0{border:2px solid var(--key)}
.badge.v-ok{border-color:#197a4b;color:#197a4b;font-weight:700}.badge.v-hm{border-color:#ac3e00;color:#ac3e00;font-weight:700}.badge.v-ng{border-color:var(--acc);color:var(--acc);font-weight:700}
ul.rs{margin:4px 0 0;padding-inline-start:1.2em;font-size:14px}
#warnbar{background:#fdeeee;color:#ce0000;border-bottom:2px solid #ce0000;padding:8px 16px;font-size:15px}
.fz{color:#ac3e00;font-weight:700}
.inev{text-decoration:underline 2px dotted #4d4d4d;text-underline-offset:10px}
.evn{font-size:12px;color:#4d4d4d;font-family:var(--sans,system-ui);margin-inline-end:2px}
.evhl{outline:3px solid #ffd43d!important;background:#fff6cc!important}
button.mini{font-size:12px;padding:1px 6px;min-height:0;border-radius:4px}
.ent.fzt{outline:2px dashed #ac3e00;outline-offset:2px}
.chk{color:var(--link);font-weight:700;letter-spacing:.04em}
#center{overflow:auto;padding:18px clamp(14px,3vw,40px)}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px;color:var(--mute);margin-bottom:10px}
.meta b{color:var(--ink);font-size:16px}
#text{font-family:var(--ar);direction:rtl;text-align:justify;font-size:24px;line-height:2.4;background:var(--paper);border:1px solid var(--line2);border-radius:8px;padding:20px 24px;user-select:text}
.ent{border-radius:4px;padding:2px 3px;cursor:pointer;border-bottom:2px solid currentColor}
.ent.P{color:var(--per);background:var(--perbg)}.ent.T{color:var(--pla);background:var(--plabg)}
.ent.O{color:light-dark(#00428c,#9ddcff);background:light-dark(#dcf0ff,#00316a);border-bottom-style:double;border-bottom-width:4px}
.ent.S{color:var(--oth);background:var(--othbg)}
.ent.S.s-ism{color:var(--ono);background:var(--onobg)}.ent.S.s-nasab{color:var(--nas);background:var(--nasbg)}
.ent.S.s-laqab{color:var(--lqb);background:var(--lqbbg)}.ent.S.s-shuhrah{color:var(--shr);background:var(--shrbg)}
.ent.S.s-nisbah{color:var(--nis);background:var(--nisbg)}
.ent.Y{color:var(--yr);background:var(--yrbg)}
.ent.nid{outline:2px dashed var(--nid);outline-offset:1px;border-bottom-color:transparent}
.ent.sel{outline:3px solid #000;outline-offset:1px;box-shadow:0 0 0 5px var(--focus);position:relative}
.grip{position:absolute;top:50%;width:12px;height:28px;margin-top:-14px;background:#000;border:2px solid var(--focus);border-radius:4px;cursor:ew-resize;z-index:2}
.grip.s{right:-12px}.grip.e{left:-12px}
body.gripping,body.gripping *{cursor:ew-resize!important;user-select:none}
.tg{display:none;font:11px/1 var(--mono);direction:ltr;unicode-bidi:isolate;color:var(--mute);vertical-align:super;margin-inline:2px}
body.raw .tg{display:inline}
.hemi{color:var(--mute)}
#tip{position:fixed;z-index:20;max-width:400px;pointer-events:none;background:var(--paper);color:var(--ink);border:1px solid var(--line2);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);padding:10px 12px;font-size:14px;line-height:1.5;display:none}
#tip .h{font-weight:700;margin-bottom:4px}
#tip code{font:12px var(--mono);direction:ltr;unicode-bidi:isolate;background:var(--bg);padding:1px 4px;border-radius:3px}
#tip .ar{font:18px/1.7 var(--ar);direction:rtl;text-align:right}
#tip dl{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:2px 8px;margin:6px 0 0}#tip dt{color:var(--mute)}#tip dd{margin:0;overflow-wrap:anywhere}
#tbar{position:fixed;display:none;gap:6px;padding:6px;background:var(--paper);border:1px solid var(--line2);border-radius:8px;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#tbar button{background:var(--bg);min-height:34px}
.card h2{font-size:15px;margin:0 0 6px}
.card .big{font-family:var(--ar);direction:rtl;text-align:right;font-size:20px;line-height:1.8}
.kv{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 8px;font-size:14px;margin:8px 0}
.kv dt{color:var(--mute)}.kv dd{margin:0;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.cand{border:1px solid var(--line);border-radius:6px;padding:8px;margin:6px 0;background:var(--bg)}
.cand .ar{font-family:var(--ar);direction:rtl;text-align:right;font-size:17px}
.cand .sn{font-family:var(--ar);direction:rtl;text-align:right;font-size:14px;color:var(--mute);line-height:1.8}
.cand .hd{display:flex;gap:8px;align-items:center;font-size:12px}
.cand .hd .sp{flex:1}
.mlist a,.lk{color:var(--link);cursor:pointer;text-decoration:underline}
.mlist{font-size:14px;max-height:260px;overflow:auto;padding:0;margin:4px 0;list-style:none}
.mlist li{padding:3px 0;border-bottom:1px solid var(--line)}
.mlist .ar{font-family:var(--ar)}
.note{font-size:14px;color:var(--mute)}
.step{display:inline-flex;align-items:center;gap:6px}
textarea{width:100%;min-height:160px;font:13px var(--mono);direction:rtl}
.ed{margin-top:16px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.edbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
.edbar b{font-family:var(--mono);font-size:13px}
#dirty{color:var(--acc);font-size:13px}
#md{display:block;border:0;border-radius:0 0 8px 8px;min-height:200px;padding:14px 16px;font:19px/2 var(--ar);background:var(--paper);color:var(--ink);resize:vertical;unicode-bidi:plaintext}
.trs{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 20px}
.trta{width:100%;min-height:110px;font:16px/1.8 var(--lat);direction:ltr;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;margin:2px 0 8px;background:var(--paper);color:var(--ink)}
.lkb{min-height:28px;padding:0 8px;font-size:13px;font-weight:400}
.aibox{margin-top:8px}.ai{border:2px solid var(--line2);border-radius:8px;padding:8px 12px;background:var(--paper)}
.ai.ok{border-color:var(--pla)}.ai.hm{border-color:var(--yr)}.ai.ng{border-color:var(--nid)}
.ai .aih{font-size:15px}.ai ul{margin:4px 0;padding-inline-start:1.2em;font-size:14px}.ai-wait{font-size:14px;color:var(--mute)}
.trs h3{font-size:14px;margin:8px 0 2px;color:var(--mute)}.trs p{margin:0 0 6px;font-size:16px;line-height:1.8}
.js summary{cursor:pointer;padding:10px 12px;list-style-position:inside}
#jta{display:block;width:100%;border:0;border-top:1px solid var(--line);border-radius:0 0 8px 8px;min-height:360px;padding:12px 16px;font:13px/1.6 var(--mono);direction:ltr;unicode-bidi:plaintext;background:var(--paper);color:var(--ink);resize:vertical}
.ent.drop,#text [data-w].drop{outline:3px solid #000;outline-offset:1px;box-shadow:0 0 0 5px var(--focus)}
.mlist li[draggable=true]{cursor:grab}.mlist li[draggable=true]:hover{background:var(--perbg)}
.js pre{margin:0;padding:12px 16px;max-height:60vh;overflow:auto;font:13px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);unicode-bidi:plaintext}
#md:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.bad{text-decoration:wavy underline var(--nid);text-decoration-skip-ink:none}
.tg{font-family:var(--mono)}
.load{padding:40px;text-align:center;color:var(--mute)}
@media(max-width:900px){body{height:auto;display:block}main{grid-template-columns:1fr}#list{max-height:40vh}#panel{border:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1><svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 10.5 47 47" aria-hidden="true" focusable="false">
<g stroke="#F1C400" stroke-width="2" stroke-linecap="round">
<line x1="32" y1="31" x2="15" y2="18"/>
<line x1="32" y1="31" x2="49" y2="16"/>
<line x1="32" y1="31" x2="20" y2="49"/>
<line x1="32" y1="31" x2="47" y2="45"/>
<line x1="15" y1="18" x2="20" y2="49"/>
<line x1="49" y1="16" x2="47" y2="45"/>
</g>
<circle cx="32" cy="31" r="6.5" fill="#F1C400" stroke="#001E62" stroke-width="0.8"/>
<circle cx="15" cy="18" r="4.2" fill="#6F9BFF" stroke="#001E62" stroke-width="0.8"/>
<circle cx="49" cy="16" r="4.2" fill="#6F9BFF" stroke="#001E62" stroke-width="0.8"/>
<circle cx="20" cy="49" r="4.2" fill="#6F9BFF" stroke="#001E62" stroke-width="0.8"/>
<circle cx="47" cy="45" r="4.2" fill="#6F9BFF" stroke="#001E62" stroke-width="0.8"/>
</svg><span>al-Ḍawʾ al-Lāmiʿ — mARkdown Viewer</span></h1>
  <label style="font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="raw" style="min-height:0"> タグ記号を表示</label>
  <span class="sp"></span>
  <span id="status">読み込み中…</span>
</header>
<main>
  <nav id="list">
    <div class="lhead">
      <input id="q" type="search" placeholder="AIND番号・名前で検索" aria-label="検索">
      <label><input type="checkbox" id="qfull" style="min-height:0"> 本文も検索</label>
      <select id="flt" aria-label="絞り込み">
        <option value="all">すべての見出し</option>
        <option value="x">XMLあり（タグ付き）</option>
        <option value="nid">未同定タグあり</option>
        <option value="ed">CHECKED（このビューアーで確認・編集済み）</option>
        <option value="no">XMLなし（未処理）</option>
        <option value="oth">その他・転送</option>
        <option value="rm">取り除いたもの</option>
      </select>
      <div class="note" id="cnt"></div>
    </div>
    <div id="items"></div>
  </nav>
  <section id="center"><div class="load">ダウの全見出しを読み込んでいます（約16MB）…</div></section>
  <aside id="panel"></aside>
</main>
<div id="tip" role="tooltip"></div>
<script src="js-yaml.min.js"></script>
<div id="tbar"><button data-t="P">人物</button><button data-t="T">地名</button><button data-t="S">名前要素</button><button data-t="O">官職・職業</button><button data-t="Y">年・月</button></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=s=>s.replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
const ENT=/^@(P|T|S|O|E|PER|TOP|SOC|SRC)(\d)(\d+)(?:\[([^\]]*)\])?$/, YR=/^@(Y[BDYA])(\d+)(?:-(\d+))?(?:\[(\d+)\])?$/, LM=/^@L(\d+)X(\d\d)L$/;
const isTag=w=>ENT.test(w)||YR.test(w)||LM.test(w);
const MON=['','ムハッラム（1月）','サファル（2月）','ラビーウ・アウワル（3月）','ラビーウ・サーニー（4月）','ジュマーダー・ウーラー（5月）','ジュマーダー・アーヒラ（6月）','ラジャブ（7月）','シャアバーン（8月）','ラマダーン（9月）','シャウワール（10月）','ズー・アルカアダ（11月）','ズー・アルヒッジャ（12月）'];
const NUMW=new Set('واحد احدى إحدى اثنتين اثنين ثنتين ثلاث ثلاثة أربع اربع أربعة خمس خمسة ست ستة سبع سبعة ثمان ثماني ثمانية تسع تسعة عشر عشرة عشرين ثلاثين أربعين اربعين خمسين ستين سبعين ثمانين تسعين مائة مئة مائتين ثلاثمائة أربعمائة اربعمائة خمسمائة ستمائة سبعمائة ثمانمائة ثمانمئة تسعمائة بضع بضعة'.split(' '));
const yLabel=m=>m[3]?`${+m[2]}〜${+m[3]}年（おおよそ）`:`${+m[2]}年`, yCE=m=>m[3]?`${Math.round(+m[2]*0.970229+621.5643)}〜${Math.round(+m[3]*0.970229+621.5643)}年ごろ`:`${Math.round(+m[2]*0.970229+621.5643)}年ごろ`;
const isNum=w=>NUMW.has(w)||(w[0]==='و'&&NUMW.has(w.slice(1)));
const KIND={M:'男性 $',F:'女性 $$',R:'転送 $$$',O:'その他',X:'取り除いた'};
let KINDS={};try{KINDS=JSON.parse(localStorage.getItem('dawKinds')||'{}')}catch{}
const kindOf=e=>KINDS[e.k]?.m||e.m;
async function setKind(k,m){const e=BY.get(k);
  const rec=m&&m!==e.m?{m,was:e.m,at:Date.now(),...(uid?{by:uid}:{})}:null;
  if(rec)KINDS[k]=rec;else delete KINDS[k];
  if(db){try{rec?await db.doc('kinds/'+k).set(rec):await db.doc('kinds/'+k).delete()}catch(err){warnLocal(err.code)}}else warnLocal();
  try{localStorage.setItem('dawKinds',JSON.stringify(KINDS))}catch{}
  status(rec?`${k} を「${KIND[m]}」に振り分けました`:`${k} の振り分けを元に戻しました`);openEntry(k);renderList()}
const OSUB={'office':'官職・職業','office/deputy':'代理職','status':'身分・地位'};
let OFFS={},IDMJ={};
let ABS={};try{ABS=JSON.parse(localStorage.getItem('dawAbsent')||'{}')}catch{}
const uKey=u=>['u',u.k,u.typ||'',u.id||'',u.lab].join('|'),oKey=o=>['o',o.typ,o.id||'',o.lab].join('|');
const isAbs=(k,key)=>!!ABS[k]?.[key];
async function setAbs(k,key,on){const d={...(ABS[k]||{})};if(on)d[key]={at:Date.now(),...(uid?{by:uid}:{})};else delete d[key];
  if(Object.keys(d).length)ABS[k]=d;else delete ABS[k];
  if(db){try{Object.keys(d).length?await db.doc('absent/'+k).set({items:d}):await db.doc('absent/'+k).delete()}catch(err){warnLocal(err.code)}}else warnLocal();

const normT=s=>N(s||'').split(' ').map(w=>w.replace(/^(و|ب|ف|ل)(?=ال)/,'')).filter(w=>w.length>1&&!['بن','ابن','بنت','ابي','ابو'].includes(w));
const baseRole=r=>(r||'').split('/')[0].split('+')[0];
function mergeCandidate(e,toId,words,role){
  if(!toId||!/^(AIND-|wd:)/.test(toId))return null;
  const w=new Set(normT(words.join(' ')));if(!w.size)return null;
  const cs=(e.r||[]).filter(r=>/^TMP-P-/.test(r.o)&&!r.nm&&!isMerged(r.o)&&!(MERGES[r.o]?.undone)&&canon(r.o)!==canon(toId)&&(!role||!r.role||baseRole(r.role)===baseRole(role)))
    .map(r=>{const n=normT(r.txt||label0(r.o));const ov=n.filter(x=>w.has(x)).length;return {r,ov,need:Math.min(2,w.size)}}).filter(x=>x.ov>=x.need);
  if(!cs.length)return null;cs.sort((a,b)=>b.ov-a.ov);
  if(cs.length>1&&cs[0].ov===cs[1].ov)return null;
  return cs[0].r;
}
async function autoMerge(e,toId,words,role,how){
  const r=mergeCandidate(e,toId,words,role);if(!r)return null;
  const rec={to:toId,at:Date.now(),entry:e.k,how,role:r.role||null};if(uid)rec.by=uid;
  await persistMerge(r.o,rec);reindexAll();status(`${r.o} を ${toId} に統合しました`);return r.o;
}
async function scanMerges(e,t){
  const toks=t.split(' ');let n=0;
  for(let i=0;i<toks.length;i++){const m=ENT.exec(toks[i]);if(!m||m[1][0]!=='P')continue;const pb=parseBr(m[4]);if(!pb.id)continue;
    const words=toks.slice(i+1,i+1+(+m[3]));if(await autoMerge(e,pb.id,words,splitRole(pb.sub).roles,'auto'))n++}
  return n;
}

        reindexAll();if(cur&&!mode&&document.activeElement?.tagName!=='TEXTAREA')openEntry(cur.k,false);
        if(firstM&&!snap.metadata.fromCache){firstM=false;for(const k in EDITS){const e=BY.get(k);if(e)await scanMerges(e,EDITS[k].t)}}},()=>{});
      db.collection('absent').onSnapshot(snap=>{for(const ch of snap.docChanges()){if(ch.type==='removed')delete ABS[ch.doc.id];else ABS[ch.doc.id]=ch.doc.data().items||{}}try{localStorage.setItem('dawAbsent',JSON.stringify(ABS))}catch{}if(cur&&!mode&&document.activeElement?.tagName!=='TEXTAREA')openEntry(cur.k,false)},()=>{});
      db.collection('kinds').onSnapshot(snap=>{for(const ch of snap.docChanges()){if(ch.type==='removed')delete KINDS[ch.doc.id];else KINDS[ch.doc.id]=ch.doc.data()}
        try{localStorage.setItem('dawKinds',JSON.stringify(KINDS))}catch{}renderList();if(cur&&!mode&&document.activeElement?.tagName!=='TEXTAREA')openEntry(cur.k,false)},()=>{});
      db.collection('jedits').onSnapshot(snap=>{for(const ch of snap.docChanges()){if(ch.type==='removed')delete JEDITS[ch.doc.id];else JEDITS[ch.doc.id]=ch.doc.data();applyJTr(ch.doc.id)}
        if(cur&&!mode&&document.activeElement?.tagName!=='TEXTAREA')openEntry(cur.k,false)},()=>{});
    }
  }catch{}
})();
}
</script>
