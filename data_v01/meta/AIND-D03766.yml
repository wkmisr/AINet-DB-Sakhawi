translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ナッシャーバ・アル＝アシュアリー・アル＝アリーシー・アル＝ヤマニー・アッ＝シャーフィイー。彼の父の伝記は後述される。ヒジュラ暦774年に生まれ、父およびマウル（Mawr）のムフティーであるアフマドに法学を学んだ。そして父の跡を継いだ。アル＝アフダルは、ヒジュラ暦830年以降にアビヤート・フサイン（Abyāt Ḥusayn）で彼と会ったと述べており、彼は故郷のムフティー、マドラサ教授、および裁判官代理を務めていた。
  en: ʿAbd al-Raḥmān b. Muḥammad b. ʿAbd Allāh b. Nashshāba al-Ashʿarī al-ʿArīshī al-Yamānī al-Shāfiʿī, whose father is mentioned below. He was born in the year 774 AH. He studied jurisprudence (fiqh) under his father and under Aḥmad, the mufti of Mawr, and succeeded his father. Al-Ahdal stated that he met him after the year 830 AH at Abyāt Ḥusayn, where he was serving as the mufti, teacher, and deputy judge of his town.
