translation:
  ja: イドリース・ブン・ヤフヤー・ブン・アビー・アル＝ファフド・ブン・アブド・アル＝カウィー・アッ＝スィッリー、アブー・アル＝アラー。ビジャーヤ（ブジー）出身の家系のマッカの人。その父、祖父、兄弟たち等については後述する。846年サファル月にマッカで生まれ、クルアーンと、イブン・アビー・ザイドの『リサーラ』（の全部）あるいはその大部分を暗記した。生計を求めてカイロ、シャーム、イエメンに赴き、預言者の町マディーナを訪れた。
  en: Idrīs b. Yaḥyā b. Abī al-Fahd b. ʿAbd al-Qawī al-Sirrī Abū al-ʿAlāʾ, of Bijāyan (Bougie) origin, al-Makkī. His father, grandfather, brothers, and others will be mentioned later. He was born in Ṣafar in the year 846 in Mecca. He memorized the Qurʾān and al-Risāla of Ibn Abī Zayd, or most of it. He entered Cairo, al-Shām, and al-Yaman to seek livelihood and visited al-Madīna al-Nabawiyya.
