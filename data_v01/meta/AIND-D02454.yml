translation:
  ja: ジャウハル・サフィー・アッ＝ディーン、アッ＝ザフーリーの解放奴隷（アティーク）、アル＝ミスリー、アッ＝ダッラール（仲買人）。アル＝ジャマール・アル＝ハンバリーから『サマーニーヤート・アン＝ナジーブ』を聴聞し、自らも（ハディースを）伝え、俊秀たちが彼から聴聞した。ヒジュラ暦840年代に没した。バーブ・アル＝ハルクでワキール（代理人）を務め、時には仲買人の仕事もした。
  en: Jawhar Ṣafī al-Dīn, freedman (ʿatīq) of al-Zahūrī, al-Miṣrī al-Dallāl. He heard the Thamāniyyāt al-Najīb from al-Jamāl al-Ḥanbalī and transmitted it, and the learned heard from him. He died in the (8)40s AH. He served as a wakīl (agent) at Bāb al-Kharq, and sometimes worked as a broker.
