translation:
  ja: アリー・ブン・アフマド・アッ＝ズィヤーディー。ズィヤード地区（ガルビーヤ地方の村落）に由来するズィヤーディーのニスバ（促音を伴う）を持つ。彼は、ムハンマド、アフマド、アズィーザの父親であり、サイード・アッ＝スアダー（ハーンカー）のスーフィーの一人であった。848年に死去した。徳のある人物であった。
  en: ʿAlī b. Aḥmad al-Ziyādī. His nisbah is derived from Maḥallat Ziyād in al-Gharbiyya. He was the father of Muḥammad, Aḥmad, and ʿAzīza, and was one of the Sufis of Saʿīd al-Suʿadāʾ. He died in the year 848 AH, and was a good man.
