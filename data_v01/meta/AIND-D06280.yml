translation:
  ja: カーンバク・アッ＝ザーヒリー・バルクーク。彼（バルクーク）のハーッサキーヤの一人で、その死後に蜂起し、あの内乱の日々に実力でアミールとなった者の一人。順調に進み、ついにムカッダム、次いでラアス・ナウバト・アン＝ヌワブとなったが、その在任は長く続かず、アン＝ナースィルが彼を捕えて814年に殺した。その行状は褒められたものではなかった。アル＝アイニーが彼について簡潔に記している。
  en: 'Qānbak al-Ẓāhirī Barqūq. He was one of his (Barqūq''s) khāṣṣakiyya and among those who rose up after his death and seized an amirate by force in the days of those disturbances. He went on prospering until he became a muqaddam and then raʾs nawbat al-nuwab, but his tenure was not long: al-Nāṣir seized him and killed him in the year 814. His conduct was not praiseworthy. Al-ʿAynī mentioned him briefly.'
