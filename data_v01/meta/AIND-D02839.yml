translation:
  ja: フシュカルディー・アン＝ナースィリー・ファラジュ。アッ＝ザーヒル・ジャクマクの治世における十人長（アミール・アシャラ）およびラアス・ナウバの一人で、アル＝バフラワーンとして知られた。850年頃、おおよそのところ、カイロで没した。
  en: Khushkaldī al-Nāṣirī Faraj, one of the amīrs of ten and of the ruʾūs al-nuwab (heads of the guard) in the days of al-Ẓāhir Jaqmaq; he was known as al-Bahlawān. He died in Cairo around the year 850, approximately.
