translation:
  ja: ファーリフ・ブン・マフディー・アル＝マリーニー、カーイド。アブー・サイード・ウスマーン・ブン・アフマド・ブン・イブラーヒームのフェズにおけるスルタン治世下で、マリーン朝の国政を執る者であった。806年の末に同地（フェズ）で没した。我らの師（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Fāriḥ b. Mahdī al-Marīnī, the qāʾid. He was the administrator (mudabbir) of the Marinid state during the sultanate of Abū Saʿīd ʿUthmān b. Aḥmad b. Ibrāhīm in Fez, and he died there at the end of the year six (806). Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
