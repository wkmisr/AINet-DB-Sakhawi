translation:
  ja: 我らがサーヒブである後述のシハーブの父方叔父であるカスカラーニー家出身のエジプト人秤量人アブー・バクル・ブン・アブド・アルマリク・ブン・アハマド・ブン・ムハンマド・ブン・ムハンマド・ブン・フサイン・ブン・アッ＝タージュ・アリー・ブン・アハマドは、ヒジュラ暦830年に生まれた。私（＝サハーウィー）からマッカでハディースを聴聞した一人である。クルアーンを朗誦し、秤量業で生計を立て、80年代以降はマッカに滞在した。ヒジュラ暦894年に70歳余りで亡くなった。
  en: Aḥmad b. Abī Bakr b. ʿAbd al-Malik b. Aḥmad b. Muḥammad b. Muḥammad b. Ḥusayn b. al-Tāj ʿAlī al-Qasṭalānī al-Miṣrī al-Qabbānī, the paternal uncle of our sahib al-Shihāb (who will be mentioned later), was born in 830 H. He was among those who heard from me (al-Sakhāwī) in Mecca. He was one of those who recited the Qurʾān, earned his living as a weigh-man, and resided in Mecca after the eighties. He died in 894 H at approximately over seventy years old.
