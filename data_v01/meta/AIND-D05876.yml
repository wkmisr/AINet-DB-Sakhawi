translation:
  ja: ウマル・ブン・アル＝ムヒユィー・アブドゥルカーディル・ブン・アブドゥッラフマーン・アッ＝シャイバーニー・アル＝マッキー。アブー・ル＝ガイス・ムハンマドの同母兄弟で、イブン・ズィブリクとして知られる。マッカで私から『アル＝カウル・アル＝バディーウ』などを聴聞し、（8）88年に同地で没した。
  en: ʿUmar b. al-Muḥyawī ʿAbd al-Qādir b. ʿAbd al-Raḥmān al-Shaybānī al-Makkī, full brother of Abū al-Ghayth Muḥammad, known as Ibn Zibriq. He heard from me al-Qawl al-badīʿ and other works in Mecca, and died there in (8)88.
