translation:
  ja: ムハンマド・ブン・ジャーッラー・ブン・ハムザ・ブン・ラージフ・ブン・アビー・ヌマイ・アル＝ハサニー・アル＝マッキー。アブー・ヌマイ家のシャリーフたちの有力者の一人であった。816年ズー・アル＝カアダ月7日の末にマッカで没し、アル＝マアラー（墓地）に葬られた。30歳かそれ以上であった。アル＝ファースィーが彼に言及している。
  en: Muḥammad b. Jār Allāh b. Ḥamza b. Rājiḥ b. Abī Numayy al-Ḥasanī al-Makkī. He was one of the notables of the sharīfs of the house of Abū Numayy. He died at the end of 7 Dhū al-Qaʿda 816 in Mecca and was buried at al-Muʿallā, aged thirty or more. Al-Fāsī mentioned him.
