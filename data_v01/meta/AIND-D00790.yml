translation:
  ja: ナスィリー・ヤマニー派シャーフィイー学派のアフマド・ブン・アル＝タイイブ・ムハンマド・ブン・アフマド・ブン・アブー・バクル・ブン・アル＝シハーブ・ブン・アル＝ジャマール。彼は『ミンハージュ』を暗記し、父の下で法学を学び、父からファトワー発行の許可を得たが、生前も死後もそれを慎んだ。彼は諸学問（ فضائل ）に参加し、多くの書物を手に入れ、講義を行い、人々を教益した。彼は謙虚で良い性格であり、名声から離れていた。ヒジュラ暦876年に亡くなった。アッラーが彼を憐れむように。
  en: Aḥmad b. al-Ṭayyib Muḥammad b. Aḥmad b. Abī Bakr b. al-Shihāb b. al-Jamāl al-Nāshirī al-Yamānī al-Shāfiʿī. He memorized al-Minhāj and studied fiqh under his father, who granted him permission to issue fatwas, but he abstained from this during his lifetime and even after his death. He participated in various sciences (faḍāʾil), acquired many books, taught, and imparted knowledge. He was humble, of good character, and shunned fame. He died in the year 876 H. May Allah have mercy on him.
