translation:
  ja: アリー・ブン・アッ＝シャムス・ムハンマド・ブン・アフマド・ブン・ムハンマド、アル＝ハイリー出自のアル＝マッキー。後述するムハンマドの兄弟で、マッカとジッダの薬種商。私（サハーウィー）からマッカで聴聞した者の一人。
  en: ʿAlī b. al-Shams Muḥammad b. Aḥmad b. Muḥammad, of Khayrī origin, al-Makkī, the brother of Muḥammad, who follows, and perfumer (ʿaṭṭār) in Mecca and Jidda. He was among those who heard from me in Mecca.
