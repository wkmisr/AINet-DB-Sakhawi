    ja: '見出しナサブから復元（ラカブ الشمس＋祖父名まで＝規則3）。corpus に「الخيري」の本伝なし（「الخيري」は D02994 رجب … الخيري のみで別人）、ID-Master 未登録。【集約 §D123-5 自己裁定】本項「أخو محمد الآتي」の指す既出項は #AIND-D08664「محمد بن محمد بن أحمد بن محمد الجيزي المكي الماضي أبوه . ممن سمع مني في سنة ست وثمانين بمكة … إتهم بقتل」しかなく（名・ナサブ4代一致、規則26「الآتي で名が一致」）、その「الماضي أبوه」は #AIND-D06957「محمد بن أحمد بن محمد الشمس الجيزي … ونزيل مكة … وامتحن بعد التسعين بسبب ولد له اتهم بقتل امرأة」（ラカブ الشمس 一致、子の殺人嫌疑で父子が閉合）。相互参照の連鎖で父＝D06957 と読み、ニスバの綴り（الخيري／الجيزي、点2つの差）が一致しないため cert medium。persName・desc の「الخيري」は原文どおり改めない（規則25）。校閲時の「職が異なる」は本項主（العطار）と父候補（الناسخ）を比べた誤り（内容B M）。校閲時の仮番号 取り下げた仮番号 B123-P09 は取り下げ。'
