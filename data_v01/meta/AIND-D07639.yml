translation:
  ja: ムハンマド・ブン・アブドゥッラヒーム・ブン・アリー、アブー・アル＝ハイル・アル＝ウクビー・アル＝カーヒリー、シャーフィイー派。およそ八百年に生まれ、クルアーンなどを暗記し、アッ＝シャムス・アッ＝シャーミーのもとで『ムスナド・アフマドの三伝承者ハディース集（スラースィーヤート）』などを聴聞させられた。一群の人々が彼にイジャーザを与えた。アッ＝ザイン・アル＝ブーティージーのもとで法学などに励み、我らがシャイフ（イブン・ハジャル）の口述講義（イムラー）で筆記したが、大成しなかった。晩年にハディースを伝えたと私（サハーウィー）は聞いている。物静かな人であった。〔八百〕九十四年に没した。神よ彼を憐れみたまえ。
  en: Muḥammad b. ʿAbd al-Raḥīm b. ʿAlī, Abū al-Khayr al-ʿUqbī al-Qāhirī al-Shāfiʿī. He was born in approximately the year 800, memorised the Qurʾān and other texts, and was made to hear the Thulāthiyyāt of Musnad Aḥmad and other works from al-Shams al-Shāmī. A group [of scholars] granted him ijāzas. He studied jurisprudence and other subjects under al-Zayn al-Būtījī, and wrote down the dictations of our shaykh (Ibn Ḥajar), but he did not distinguish himself. I (al-Sakhāwī) was informed that he transmitted [ḥadīth] late in life. He was a quiet man. He died in the year [8]94; may God have mercy on him.
