notes:
- text: '転送見出し（原文「مضى فيمن جده عبد الله」による）。転送先は #AIND-D06513「محمد بن إبراهيم بن عبد الله الشمس الكردي الأصل ثم المقدسي ثم القاهري المكي الشافعي وسمى المقريز جده أحمد لا عبد الله . ولد سنة سبع وأربعين وسبعمائة ببيت المقدس … ومات بمكة في ذي القعدة سنة إحدى عشرة … وسمى التقي بن فهد في معجمه جده علي بن إبراهيم ، وبيض لترجمته」（未受領）。本見出しのナサブ「بن علي بن إبراهيم」は D06513 末尾が伝える التقي بن فهد の異説形そのもので、ニスバ（الكردي ثم المقدسي）も一致する（ブリーフ候補を本文で確認）。同じ D06513 へ向く転送見出しに #AIND-D06484（「بن أحمد」＝المقريزي の異説形、収録済み REF）と #AIND-D06590（「محمد بن إبراهيم الكردي . فيمن جده عبد الله」、本バッチ B171）がある。'
  type: reference
  target: AIND-D06513
translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アリー・ブン・イブラーヒーム・アル＝クルディー、のちアル＝マクディスィー。祖父がアブド・アッラーである者たち（の部）で前述した。
  en: Muḥammad b. Ibrāhīm b. ʿAlī b. Ibrāhīm al-Kurdī, then al-Maqdisī. He has been mentioned above among those whose grandfather is ʿAbd Allāh.
