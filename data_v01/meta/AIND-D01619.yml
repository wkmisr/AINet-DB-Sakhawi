translation:
  ja: アフマド・ブン・ムハンマド・アッ＝シハーブ・アル＝ヤグムーリー（Aḥmad b. Muḥammad al-Shihāb al-Yaghmūrī） 彼は侍従長の職に就き、ダマスカスの行政官庁（ディーワーン）を統括した。直接管理の知識で有名だった。我らがシャイフ（イブン・ハジャル）は彼の『アンバーウ・アル＝グムル』の中で彼について述べた。彼がジャマールッディーン・アル＝ウスターダールのもとにいるのを見たが、彼は学者たちへの愛を示し、彼らとの議論を楽しみ、よく理解する人物であった。彼はジュマーダー・アル＝ウーラー11年に亡くなった。
  en: Aḥmad b. Muḥammad al-Shihāb al-Yaghmūrī. He held the office of chamberlain (ḥujūbīya) and administered the dīwāns in Damascus. He was known for his knowledge of direct administration. Our shaykh (Ibn Ḥajar) mentioned him in his 『Inbāʾ al-Ghumr』. I saw him with Jamāl al-Dīn al-Ustādār; he showed affection for scholars, enjoyed their discussions, and understood well. He died in Jumādā al-Ūlā in the year 'eleven' (811 AH).
