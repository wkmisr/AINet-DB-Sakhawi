translation:
  ja: アブドゥルカーディル・アル＝ムラーヒリー・アル＝ジャービー。892年ラビーウ・アッ＝サーニー月（第4月）の初頭に没した。アブー・アッ＝サアーダート・アル＝ブルキーニーに仕え、その後、アル＝ヒッリーとアッ＝ザーヒルのワクフ管理に携わった（一時期アル＝ザイニーの配下にいた）。活動的な人物であった。
  en: ʿAbd al-Qādir al-Murāḥilī al-Jābī. He died in early Rabīʿ al-Thānī 892 AH. He was in the service of Abū al-Saʿādāt al-Bulqīnī, then managed the Waqf of al-Ḥillī and al-Ẓāhir during some of the days of al-Zaynī, and he was active.
