translation:
  ja: アフマド・ブン・ユースフ・ブン・アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アブド・アル＝カリーム・ブン・ユースフ・ブン・サーリム・ブン・ドゥライム・アッ＝ダミーリー・アル＝バスリー、のちマッカ居住となり、イブン・ドゥライムとして知られる。既述のアフマド（アッ＝シハーブ・ドゥライム）の甥である。866年ズー・アル＝カアダ月に没し、アル＝ムアッラーに埋葬された。イブン・ファフドが彼の没年を記録した。
  en: Aḥmad b. Yūsuf b. Aḥmad b. Muḥammad b. Muḥammad b. ʿAlī b. ʿAbd al-Karīm b. Yūsuf b. Sālim b. Dulaym al-Damīrī, al-Baṣrī, then al-Makkī, nephew of the aforementioned Aḥmad (al-Shihāb Dulaym), and known as Ibn Dulaym. He died in Dhū al-Qaʿda in the year 866 H and was buried in al-Muʿallā. Ibn Fahd recorded his obituary.
