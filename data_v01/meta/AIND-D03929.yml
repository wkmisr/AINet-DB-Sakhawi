translation:
  ja: アブドゥッサラーム・ブン・ムハンマド・ブン・アビー・アル＝ハイル・ムハンマド・ブン・アリー・ブン・アブドゥッラー・ブン・アリー・イブン・アブドゥッサラーム。アブー・アル＝ハイル・アル＝カーザルーニー・アル＝マッキーの兄弟。ヒジュラ暦844年ジュマーダー・アル＝ウーラー月にメッカで生まれ、そこで育ってクルアーンを暗記した。857年に彼ら（兄弟）の父の後を継いでマスジド・アル＝ハラームのムアッズィン長職に就いた。子はなかった。865年または868年のズー・アル＝カアダ月に没したが、前者（865年）の方が近い。
  en: ʿAbd al-Salām b. Muḥammad b. Abī al-Khayr Muḥammad b. ʿAlī b. ʿAbd Allāh b. ʿAlī ibn ʿAbd al-Salām, the brother of Abū al-Khayr al-Kāzarūnī al-Makkī. He was born in Mecca in Jumādā I 844 AH, grew up there and memorized the Qurʾān. In 857 AH he succeeded their father as chief of the muezzins (riyāsat al-muʾadhdhinīn) of the Masjid al-Ḥarām. He had no children. He died in Dhū al-Qaʿda of the year 865 or 868 AH, the former being closer to the truth.
