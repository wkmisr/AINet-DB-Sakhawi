translation:
  ja: アブドゥルバースィト・ブン・アフマド・ブン・アブドゥルラティーフ・ブン・ザーイド・アッ＝スンブスィー・アル＝マッキー。後述のアブー・アル＝ファトフの兄弟。メッカで私（サハーウィー）からハディースを聴聞した。893年サファル月の末に没。アスル（午後）の礼拝の後に葬儀礼拝が行われ、マアラー墓地の彼ら（スンブス一族）の墓に埋葬された。アッラーが彼に天国で報いんことを。
  en: ʿAbd al-Bāsiṭ b. Aḥmad b. ʿAbd al-Laṭīf b. Zāyad al-Sunbasī al-Makkī, the brother of Abū al-Fatḥ (mentioned below). He was among those who heard (ḥadīth) from me in Mecca. He died in the latter part of Ṣafar, 893 AH. The funeral prayer was performed after the afternoon (ʿaṣr) prayer, and he was buried in their graves at al-Muʿallā. May Allah reward him with Paradise.
