translation:
  ja: ハサン・アル＝バドル・アル＝ハサニー・アル＝カーヒリー・アル＝ワーイズ（説教師）。少々学問に従事したのち、説教をして村々などを巡った。私が彼に虚偽の伝承などを語ることを禁じてから、彼は私のところでしばらく修学（師事）した。彼はその（説教の）やり方を続け、ヒジュラ暦896年ジュマーダー・アル＝ウーラー（第5月）に没した。享年は70歳、あるいはそれを超えていたと思われる。神の慈悲と赦しあれ。
  en: Ḥasan al-Badr al-Ḥasanī al-Qāhirī, the preacher. He was a shaykh who studied a little and went around the villages and the like preaching. He associated with me (al-Sakhāwī) as a disciple for a short time after I forbade him from citing fabrications and the like. He continued on his way until he died in Jumādā al-Ūlā, the year 896 [AH]. I believe he had reached seventy years of age or exceeded it. May God have mercy on him and forgive him.
