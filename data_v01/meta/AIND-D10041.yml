notes:
- text: '転送見出し（原文末尾「فيمن جده موسى بن عبد الله」による）。転送先は #AIND-D10048「موسى بن أحمد بن موسى بن عبد الله بن سليمان الشرف السبكي ثم القاهري الشافعي ويعرف في بلده كما بلغني بابن سيد الدار」（762年頃生、未受領）。名・父名・祖父名 موسى بن عبد الله・ラカブ الشرف・ニスバ السبكي が一致。同名の #AIND-D10047「موسى بن أحمد بن موسى بن عبد الله بن أيوب الشرف الكناني المقدسي الجماعيلي ثم الدمشقي الصالحي الحنبلي」はニスバ・学派が異なる別人。'
