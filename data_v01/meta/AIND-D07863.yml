notes:
- text: '「وهو أفضل من فقيه مكة الأخر مكي」＝マッカのもう一人の「فقيه」（子供の教師）مكي。候補は #AIND-D10001「مكي بن سليمان السندي الهندي الأصل المكي المولد والدار مؤدب الأطفال بها … ويعرف بالعياشي」（索引 #AIND-D11871「تلميذه الفقيه مكي بن سليمان」）で、名・職（مؤدب الأطفال）・地（مكة）が一致する。ただし原文は比較評価であって関係の記述ではないので relation は立てず（初版の colleague #NEEDID を除去）、同定は本 note に留める。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・アブドゥッラー、アッ＝シャムス・アッ＝サイーディー・アッ＝シャーフィイー。二聖都に住み、マッカのバーブ・ハルーラで子供の教師を務め、またそこ（マッカ）のムアッズィン代理の一人であった。アル＝マダニーとして知られる。子供たちを世代を次いで教えた者の一人で、書を能くして多くを書写し、私はそのうち『アッ＝シファー』の見事な一本を見た。人々のために書写することもあった。徳が高く敬虔な人物で、称賛が広く行き渡っていた。891年サファル月に没し、私の思うところ70歳に近かった。彼はマッカのもう一人のファキーフ（子供の教師）マッキーより優れていた。
  en: Muḥammad b. ʿAbd Allāh, al-Shams al-Ṣaʿīdī al-Shāfiʿī, resident of the Two Sanctuaries, teacher of children in Mecca at Bāb Kharūra and one of its deputy muezzins; known as al-Madanī. He was among those who taught the children generation after generation; he wrote a fine hand and copied many works, among which I saw a magnificent copy of al-Shifāʾ, and he sometimes copied for others. He was a virtuous and righteous man, widely praised. He died in Ṣafar of the year 891, and I think he was approaching seventy. He was better than the other faqīh (children's teacher) of Mecca, Makkī.
