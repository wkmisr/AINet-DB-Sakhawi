translation:
  ja: アブドゥッラフマーン・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アル＝ファフル・アブドゥッラフマーン・ブン・ユースフ・ブン・ナスル・ブン・アビル＝カースィム・ブン・アブドゥッラフマーン・アル＝バアリー・アッ＝ディマシュキー・アル＝ハンバリー。ハーフイズ・アル＝ミッズィー、アブー・アル＝アッバース・アル＝ジャザリー、およびムハンマド・ブン・イスマーイール・ブン・ウマル・アル＝ハマウィーに聴聞し、伝承した。我らがシャイフ（イブン・ハジャル）がダマスクスで彼に読誦し、その没年を803年ラジャブ月と記録し、マクリーズィーもその『ウクード』において彼に従った。
  en: ʿAbd al-Raḥmān b. ʿAbd Allāh b. Muḥammad b. al-Fakhr ʿAbd al-Raḥmān b. Yūsuf b. Naṣr b. Abī al-Qāsim b. ʿAbd al-Raḥmān al-Baʿlī al-Dimashqī al-Ḥanbalī. He heard hadith from al-Ḥāfiẓ al-Mizzī, Abū al-ʿAbbās al-Jazarī, and Muḥammad b. Ismāʿīl b. ʿUmar al-Ḥamawī, and transmitted hadith. Our shaykh (Ibn Ḥajar) read to him in Damascus and recorded his death in Rajab 803 AH, and al-Maqrīzī followed him in his work al-ʿUqūd.
