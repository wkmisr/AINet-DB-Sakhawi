translation:
  ja: フサイン・ブン・アリー・ブン・フサイン・アッ＝シャーミー、別名イブン・マクサブ。マッカで私（サハーウィー）から聴聞した者の一人であり、優れた商人であった。セイイド・ヌール・アッ＝ディーン・ブン・アッ＝サフィー・アル＝イージーが最後にマッカへ来た際、彼からまとまった額の借金をした。ヌール・アッ＝ディーンが没したため、フサインはその遺産から回収するために現地へと旅立ち、無事に回収を済ませた後の896年に同地で亡くなった。アッラーの慈悲あれ。
  en: Ḥusayn b. ʿAlī b. Ḥusayn al-Shāmī, known as Ibn Maksab. He was among those who heard from me (al-Sakhāwī) in Mecca, and was an excellent merchant. Sayyid Nūr al-Dīn b. al-Ṣafī al-Ījī borrowed a sum of money from him during his last visits to Mecca. When Nūr al-Dīn died, Ḥusayn traveled there to collect the debt from his estate. He passed away there after successfully recovering the money in the year 896 AH. May Allah have mercy on him.
