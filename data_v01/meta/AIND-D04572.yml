  en: ʿAbd Allāh b. Muḥammad b. al-Ḥājj Khalīl b. Saʿīd, al-Jamāl al-Ṭarābulusī al-Shāfiʿī, known as Ibn al-Ḥājj Khalīl. He was born around the year 800 in Tripoli. Al-Biqāʿī met him but recorded nothing of his affairs.
