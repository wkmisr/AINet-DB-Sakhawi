translation:
  ja: ムハンマド・ブン・アブド・アル＝マジード・ブン・アル＝カーディー・アビー・アル＝ハサン・アリー・ブン・アビー・バクル、アル＝ジャマール・アン＝ナーシリー・アル＝ヤマーニー。839年に生まれ、『シャーティビーヤ』『ミンハージュ・アル＝ファルイー』『イブン・マーリクのアルフィーヤ』を暗記し、真剣に努めてそれらを理解し、頭角を現して名が立った。彼の時間は、暗記書の反復、それらの読解、書写、各種の礼拝行為に配分され、知性と理解力、敬虔と学識を兼ね備えていた。871年ラビーウ第2月に没した。私に学んだ碩学の一人が私に伝えてくれた。
  en: Muḥammad b. ʿAbd al-Majīd b. al-Qāḍī Abī al-Ḥasan ʿAlī b. Abī Bakr, al-Jamāl al-Nāshirī al-Yamānī. He was born in 839 and memorized al-Shāṭibiyya, the Minhāj al-farʿī and the Alfiyya of Ibn Mālik, and understood them with earnestness and diligence until he became distinguished and prominent. His time was divided between repeating his memorized texts, studying them, writing, and various acts of devotion, together with intelligence, understanding, piety and learning. He died in Rabīʿ II [8]71. One of the learned men who studied under me informed me of this.
