translation:
  ja: アブド・アッ＝ラティーフ・ブン・ムハンマド・ブン・ユースフ・アル＝ウスユーティー・アル＝カーヒリー、布商（バッザーズ）。後述の、私（サハーウィー）の妻の父アリーの兄弟。ひどく困窮したのち、873年にインバーバの近くで襲われて没し、アル＝ワッラークに葬られた。神の慈悲がありますように。
  en: ʿAbd al-Laṭīf b. Muḥammad b. Yūsuf al-Usyūṭī al-Qāhirī, the cloth merchant, brother of ʿAlī, the father of my wife (mentioned below). He died — after having become very poor — assaulted near Inbāba, in the year 873, and was buried at al-Warrāq. May God have mercy on him.
