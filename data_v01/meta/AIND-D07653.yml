translation:
  ja: ムハンマド・ブン・アブドゥッラッザーク、カーディー、バドル・アッ＝ディーン・アル＝クラシー・アル＝バーリスィー・アル＝ミスリー、シャーフィイー派。後述のアッ＝タージュ・ムハンマドの父で、イブン・ムスリムとして知られる。裁判代理官の一人。アル＝ワースィティーと我らがシャイフ（イブン・ハジャル）に聴聞した者の一人で、一部の学生が彼から聴聞した。物静かな人であった。〔八百〕八十九年ラジャブ月に没した。
  en: Muḥammad b. ʿAbd al-Razzāq, the judge (al-qāḍī) Badr al-Dīn al-Qurashī al-Bālisī al-Miṣrī al-Shāfiʿī, the father of al-Tāj Muḥammad, who is mentioned below; he is known as Ibn Muslim. One of the deputy judges. He was among those who heard from al-Wāsiṭī and from our shaykh (Ibn Ḥajar), and some students heard from him. He was a quiet man. He died in Rajab of the year [8]89.
