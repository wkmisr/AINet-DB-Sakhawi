translation:
  ja: アブドゥンナースィル・ブン・ムハンマド・ブン・アビー・バクル・ブン・アブドゥルワッハーブ・ブン・アフマド、アブー・アッ＝タイイブ、アル＝マハッリー。その父は後述する。イブン・アッ＝シャイフとして知られる。824年ズー・アル＝ヒッジャ月に生まれ、『アブー・シュジャーウの摘要』『ラフビーヤ』とクルアーンの一部を暗記した。証人（公証）業で生計を立て、信仰心と善良さをもってその分野で頭角を現した。彼は今なお存命である。
  en: ʿAbd al-Nāṣir b. Muḥammad b. Abī Bakr b. ʿAbd al-Wahhāb b. Aḥmad, Abū al-Ṭayyib al-Maḥallī; his father will be mentioned below. He is known as Ibn al-Shaykh. He was born in Dhū al-Ḥijja 824, memorized the Mukhtaṣar of Abū Shujāʿ, the Raḥabiyya and part of the Qurʾān, earned his living as a notary witness and distinguished himself in it, with piety and goodness. He is now among the living.
