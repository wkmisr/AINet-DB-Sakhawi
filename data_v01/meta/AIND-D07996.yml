  en: Muḥammad b. ʿAlī b. Aḥmad b. ʿAbd al-Mujīb; his father was mentioned above. He succeeded him at al-Maqām al-Aḥmadī in Ṭanṭadā while still very young, (and remained so) until he died in the year 842.
