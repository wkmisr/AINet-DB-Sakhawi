translation:
  ja: イブラーヒーム・ブン・イブラーヒーム・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・マスウード。カイロ生まれ、カイロ居住。その父は後述される。彼も父も「イブン・サービク」として知られる。860年以降に生まれ、クルアーンを暗記し、『ミンハージュ』（の解説）を暗唱や理解によって少し学んだ。その後、父が彼を結婚させ、彼はマンクータムリーヤ学院でのアザーンや夜警などの仕事に専念した。むしろ、父の死後、イマーム職やサラーヒーヤ学院などの他の職務を引き継いだ。ハッジを行い、バブ・アル＝カンタラ近くのいくつかの店で生計を立て、時には仕立て屋として働いたり、会計士の仕事もした。アッラーが彼に法学の知識を授けられた。
  en: Ibrāhīm b. Ibrāhīm b. Muḥammad b. ʿAbd Allāh b. Muḥammad b. Masʿūd al-Qāhirī by birth and residence. His father will be mentioned later. Both he and his father were known as Ibn Sābiq. He was born after 860 H., memorized the Qurʾān, and studied a little of al-Minhāj (likely *Minhāj al-ṭālibīn*) by memorization or explanation. Then his father married him, and he became preoccupied with the call to prayer (adhān) and night watchman (waqīd) duties, and similar roles at al-Mankūtamurīya. Indeed, he took its imamate and other offices, such as at al-Ṣalāḥīya and others, after his father. He performed the Hajj and earned a living in some shops near Bāb al-Qanṭara, sometimes working as a tailor and as an accountant. May God grant him understanding of jurisprudence.
