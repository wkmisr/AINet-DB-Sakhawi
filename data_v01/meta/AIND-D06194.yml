translation:
  ja: フィールーズ・シャー、クトゥブ・アッ＝ディーン・ブン・タハムタム・ブン・ジュルダン・シャー・ブン・トゥグルク・ブン・タバク・シャー。ホルムズ、バハライン、アル＝ハサー、アル＝カティーフの君主。（8）39年に没した。われらがシャイフ（イブン・ハジャル）が『インバー』で彼の没年を記している。
  en: Fīrūz Shāh, Quṭb al-Dīn b. Tahamtam b. Jurdan Shāh b. Ṭughluq b. Ṭabaq Shāh, lord of Hormuz, al-Baḥrayn, al-Ḥasā and al-Qaṭīf. He died in the year [8]39. Our shaykh (Ibn Ḥajar) recorded his death date in his Inbāʾ.
