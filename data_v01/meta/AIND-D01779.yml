translation:
  ja: アフマド・アブー・ターキーヤは、およそ90歳まで生きた。829年に死去し、シャイフ・アブドゥッラー・アル＝ムヌーフィーの傍らに葬られた。彼の住居はアル＝ザーヒリーヤ・アル＝カディーマであった。というのも、彼はそこの居住者である盲目のアフマド・アン＝ナフリーリーの母と結婚していたためである。サラージュ・アル＝ワルーリーやアル＝イッズ・アッ＝スンバーティーといった一団が彼に随従した。彼（アブー・ターキーヤ）が私（サハーウィー）に語ったところでは、彼はシャイフ・ユースフ・アル＝アジャミーに数ヶ月付き従った。またシャラフ・ブン・アル＝ハッシャーブも彼（アル＝アジャミー）から礼拝時刻学（ミーカート）を学んだ。
  en: Aḥmad Abū Ṭāqiyya lived to about ninety. He died in 829 H and was buried near Shaykh ʿAbd Allāh al-Munūfī. His residence was at al-Ẓāhiriyya al-Qadīma, as he was married to the mother of Aḥmad al-Naḥrīrī al-Ḍarīr, a resident there. A group accompanied him (as students), such as al-Sirāj al-Warūrī and al-ʿIzz al-Sunbāṭī. He (Abū Ṭāqiyya) told me that he had accompanied Shaykh Yūsuf al-ʿAjamī for several months; al-Sharaf b. al-Khashshāb also took the science of timing (al-mīqāt) from him (al-ʿAjamī).
