notes:
- text: '名のみの項（転送指示なし＝実項、規則13）。本文はないが、父の本伝 #AIND-D02585 に「واستقر بعده ابنه الأكبر خليل فحاربه أخوه المشار إليه يعقوب وقتل ذلك بعد هذا الآن بيسير」、兄弟の本伝 #AIND-D10389 に「قتل أخاه أبا الفتح خليلا المستقر في السلطنة بعد أبيهما حسن بك」とあり、父 حسن بك（882没）の後を継いで即位し、弟 يعقوب بك に殺された（アク・コユンル朝の خليل）。これらは他項の情報なので属性（没年・クンヤ أبو الفتح・職）にしない（規則23）。兄弟 #AIND-D10389 يعقوب بك・#AIND-D10462 يوسف بك（شقيق يعقوب）は本項に名指しがないため relation を立てない。'
