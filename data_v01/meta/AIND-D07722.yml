translation:
  ja: ムハンマド・ブン・アブド・アル＝カリーム・ブン・ダーウード、アル＝ムヒッブ、アブー・アル＝ジュード、エルサレムの読誦学の長にしてアル＝アクサー（モスク）のイマームであるカリーム・アッ＝ディーン・アル＝バドリー・ブン・アビー・アル＝ワファー、アル＝マクディスィー、アッ＝シャーフィイーの息子。父は前述。（私の）3回目の隣住の際にマッカで私（サハーウィー）から『ムサルサル』を聴聞し、暗記したテクストを私に提示した。
  en: Muḥammad b. ʿAbd al-Karīm b. Dāwūd, al-Muḥibb, Abū al-Jūd, son of the shaykh of Qurʾān readings in Jerusalem and imam of al-Aqṣā, Karīm al-Dīn al-Badrī b. Abī al-Wafāʾ, al-Maqdisī, al-Shāfiʿī; his father has been mentioned above. He heard al-Musalsal from me (al-Sakhāwī) in Mecca during the (my) third mujāwara, and presented to me the texts he had memorized.
