    ja: '「الماضي أبوه」。父＝#AIND-D04253「عبد الكريم بن داود بن سليمان بن داود بن التاج أبي الوفاء محمد بن علي ابن أحمد زين الدين وكريم الدين الحسيني المقدسي الشافعي المقري البدري الوفائي إمام الأقصى ووالد المحب أبي الجود محمد」（未受領）。父側が「والد المحب أبي الجود محمد」と本項主を名指し（規則37）。父の職「شيخ القراآت بالقدس وإمام الأقصى」は父のものなので本項主の state・placeName にしない。初版は #NEEDID。'
