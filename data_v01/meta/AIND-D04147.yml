translation:
  ja: アブドゥルカーディル・ブン・アリー・ブン・ラマダーン・ブン・アリー・ムヒュッディーン・アッ＝トゥーヒー・アル＝カーヒリー・アッ＝シャーフィイー（彼の父の伝記は後述される）。『ミフニーの姉妹の息子』として知られる。カイロで私（サハーウィー）からハディースを聴聞し、少し学問に従事した。また、一時期イブン・カーディー・アジュルーンに師事（同伴）した。シハーブ・アル＝ファリーヒーのもとで公証人（シャーヒド）として生計を立てた。
  en: ʿAbd al-Qādir b. ʿAlī b. Ramaḍān b. ʿAlī Muḥyī al-Dīn al-Ṭūkhī al-Qāhirī al-Shāfiʿī (his father's biography is forthcoming below), known as the son of Mihnī's sister. He heard ḥadīth from me (al-Sakhāwī) in Cairo, engaged briefly in studies, accompanied Ibn Qāḍī ʿAjlūn for a time, and earned his living as a notary witness under al-Shihāb al-Falīḥī.
