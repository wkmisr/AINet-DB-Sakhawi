translation:
  ja: アブド・アッラー・ブン・アフマド・ブン・アブド・アッラー・ブン・アブド・アッ＝ラフマーン・アッ＝ラフミー・アッ＝トゥーニスィー・アル＝フィルヤーニー・アル＝マーリキー。後述のムハンマド・ブン・ハマド・ブン・ムハンマド・ブン・アブド・アッ＝ラフマーンの親族。我らがシャイフ（イブン・ハジャル）は『ムシュタビフ・アン＝ニスバ』で彼に言及し、「我々の仲間の幾人かから学んだ」と述べている。812年、巡礼からの帰途に没した。
  en: ʿAbd Allāh b. Aḥmad b. ʿAbd Allāh b. ʿAbd al-Raḥmān al-Lakhmī al-Tūnisī al-Firyānī al-Mālikī, a relative of Muḥammad b. Ḥamad b. Muḥammad b. ʿAbd al-Raḥmān (mentioned below). Our shaykh (Ibn Ḥajar) mentioned him in Mushtabih al-nisba and said that he studied under some of our companions. He died in the year 812 while returning from the pilgrimage.
