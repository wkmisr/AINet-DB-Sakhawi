translation:
  ja: アリー・ブン・ムハンマド・ブン・ヤアクーブ、アル＝ハワージャ、ヌール・アッ＝ディーン・アッ＝タフターウィー・アル＝マッキー。アブー・バクルとその兄弟たちの父親。資産家で商業に従事し、マッカに複数の邸宅を所有していた。881年ムハッラム月にマッカで没した。イブン・ファフドがその没年を記録している。
  en: ʿAlī b. Muḥammad b. Yaʿqūb, al-Khawājā Nūr al-Dīn al-Ṭahṭāwī al-Makkī, the father of Abū Bakr and his brothers. He was wealthy, engaged in commerce, and owned multiple houses in Mecca. He died there in al-Muharram, the year 881 AH. Ibn Fahd recorded his death.
