translation:
  ja: クムシュブガー・アッ＝ザーヒリー・バルクーク。アレッポのアミールの一人で、「アミール・アシャラ（十人長）」の通称で知られた。アミール職や地方の官職を転々とし、ついにアターベクのジャーンバク・アッ＝スーフィーの一党に身を寄せて共に蜂起し、840年ムハッラム月に殺害された。悪事が多く、騒乱（フィトナ）を好む人物であった。
  en: Kumushbughā al-Ẓāhirī Barqūq. One of the amirs of Aleppo, known by the nickname "Amīr ʿAshara" (amir of ten). He moved through amirates and governorships until he attached himself to the atābak Jānbak al-Ṣūfī and rose with him; then he was killed in Muḥarram of the year 840. He was much given to evil and fond of strife.
