  en: ʿAlī b. Muḥammad b. ʿAlī al-Ghazūlī, full brother of the aforementioned Aḥmad, known as al-Hunaydī. He died in Jumādā II 895. He was a commoner who was dissolute toward himself; may God pardon him.
