    ja: '原文「نقل عنه … شيئا」＝الناشري が本項主から伝承（本項主＝師）。الناشري ＝ العفيف الناشري（عثمان بن عمر، #AIND-D04864「… العفيف الناشري المقري الشافعي … له تصنيف في الناشريين سماه البستان الزاهر في طبقات علماء بني ناشر طالعته」、生804/805・没848）と判断: 本項主が834年にザビードの「彼ら（ナーシリー家）」を訪れた際に成人として面会・伝承しうるのは العفيف で、حمزة الناشري（#AIND-D02778、生833）は年齢上不可。ID-Master の TMP-P-000694（العفيف الناشري、「言及者専用」）は corpus 本伝 D04864 を持つため規約4(a)により #AIND-D04864 を採用（pending_B80 に名寄せ提案）。初版は passive にニスバ番号 TMP-N-00138 を誤用。'
