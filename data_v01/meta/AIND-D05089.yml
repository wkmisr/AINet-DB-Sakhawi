translation:
  ja: アリー・ブン・アブー・バクル・ブン・ムハンマド・ブン・アリー・アル＝アシュハル。アン＝ナーシリーは彼を「敬虔な法学者」と評し、彼から、彼の祖父である唯一無二の大学者ムハンマドの伝として若干の事柄を伝えている。また伝記の主は834年にザビードの彼らのもとにやって来た、と述べている。
  en: ʿAlī b. Abī Bakr b. Muḥammad b. ʿAlī al-Ashkhar. Al-Nāshirī described him as a righteous jurist, transmitted from him some material on the authority of his grandfather, the unique scholar Muḥammad, and stated that the subject of this entry came to them in Zabīd in the year 834 AH.
