translation:
  ja: アブー・ザカリーヤー・アハマド・ブン・ザカリーヤー・アハマド・ブン・ムハンマド・ブン・ムハンマド・ブン・アブー・バクル・アル＝キラーニー・アル＝サマーミー・アル＝マーリキー。彼はイブン・マルズーク・アル＝ハフィードから学び、法学原理と論理学に秀で、法学やその他にも携わった。彼は90年に生きており、年齢は約70歳であった。彼の学生の中には、我らがシャイフ(イブン・ハジャル)の友人であるアブドゥッラー・アル＝ハサナーウィーがいる。アブー・アル＝ファドル・アル＝バジャーイーの項にも彼の記述がある。
  en: Aḥmad b. Zakarīyā al-Tilimsānī al-Maghribī al-Mālikī. He acquired knowledge from Ibn Marzūq al-Ḥafīd and excelled in Uṣūl al-Fiqh and Logic. He also participated in Fiqh and other fields. He was alive in the year 890 H and was approximately seventy years old. Among those who took from him was our companion ʿAbd Allāh al-Ḥasanāwī. He is also mentioned in the biography of Abū al-Faḍl al-Bijāʾī.
