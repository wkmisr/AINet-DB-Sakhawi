translation:
  ja: ムハンマド・ブン・アリー・ブン・アフマド、ナースィル・アッ＝ディーン・アル＝ハティーリー、のちアル＝カーヒリー、サーリヒーヤの寄留者。アル＝バドル・アル＝バグダーディーに仕えた者の一人で、諸々の職位に就き、ハンバリー派のワクフなどを管理した。善良で、クルアーンの読誦に励む人であり、ウンム・ハーニ・アル＝ハウリーニーヤと、我々が彼女と共に同席させた者たちをはじめとする一団からハディースを聴聞した者の一人である。息子のムハンマドが彼と一緒であった。
  en: Muḥammad b. ʿAlī b. Aḥmad, Nāṣir al-Dīn al-Khaṭīrī, then al-Qāhirī, resident of al-Ṣāliḥiyya. He is among those who served al-Badr al-Baghdādī; he was installed in various posts and administered the endowments of the Ḥanbalīs and others. He was a good man, much given to recitation, and among those who heard ḥadīth from a group including Umm Hāniʾ al-Hūrīniyya and those whom we brought to attend with her; his son Muḥammad was with him.
