translation:
  ja: アリー・ブン・フサイン・ブン・マフムード、ヌール・アッ＝ディーン・アル＝フサイニー、バルフ出自のマッカ人、シャーフィイー派、アッ＝タイイビーとして知られる。少し学問に従事し、アッ＝スーハーイーに読んで学び、また私（サハーウィー）の第3回マッカ滞在（ムジャーワラ）の際に私からいくつかのものを学んだ。そのうちには『アル＝カウル・アル＝バディーウ』があり、彼はこれを自分用と他人用に書写したうえで学んだ。バーブ・アッ＝サラームに公証人（シャーヒド）として座し、「八日（アイヤーム・アッ＝サマーン）」の頃などには彼の傍らにウムラの証書（アウラーク・アル＝ウマル）が置かれていた。
  en: ʿAlī b. Ḥusayn b. Maḥmūd Nūr al-Dīn al-Ḥusaynī, of Balkhī origin, the Meccan, Shāfiʿī, known as al-Ṭayyibī. He was among those who studied a little; he read under al-Sūhāʾī and likewise took from me (al-Sakhāwī), during my third stay (mujāwara) in Mecca, several things, among them al-Qawl al-Badīʿ, after he had copied it for himself and for others. He sat at Bāb al-Salām as a notary (shāhid), and in the "days of the eight" and the like the ʿumra papers (awrāq al-ʿumar) would be at his side.
