    ja: 'السوهائي ＝ #AIND-D09056（محمد بن محمد بن محمد بن إسماعيل فتح الدين أبو الفتح … السوهائي … القاهري الشافعي。857・882・885〜887年にマッカに滞在し「أقرأ هناك الفقه والأصول وغيرهما」）と同定。ニスバ索引 D11746「السوهائي … أبو الفتح محمد بن محمد بن محمد بن إسماعيل」が唯一の該当。本項主はマッカ在住者で時期も符合するが、原文がニスバのみのため cert medium。初版はニスバ番号 TMP-N-00772 を person 位置に流用。'
