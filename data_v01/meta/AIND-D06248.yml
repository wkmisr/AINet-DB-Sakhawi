translation:
  ja: カースィム・ブン・バハー・アッ＝ディーン・アル＝マーティー、クルアーン朗誦家（アル＝ムクリ）。アッ＝ザイン・アブドゥルガニー・アル＝ハイサミーに諸読誦法（キラーアート）を朗誦（して学習）した者の一人で、アル＝ムアイヤディーヤの隣のアル＝マーティイーンにある店で生計を立てた。ムハッラム月に没した。
  en: Qāsim b. Bahāʾ al-Dīn al-Māṭī al-Muqriʾ. He was among those who recited the qirāʾāt (Qurʾānic readings) to al-Zayn ʿAbd al-Ghanī al-Haythamī, and he earned his living with a shop in al-Māṭiyyīn next to al-Muʾayyadiyya. He died in Muḥarram.
