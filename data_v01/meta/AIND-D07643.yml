translation:
  ja: ムハンマド・ブン・アブドゥッラヒーム・ブン・ムハンマド、アブー・アブドゥッラー、アル＝マウスィリー・アッ＝ディマシュキー、ウマイヤ・モスクのムアッズィン。父から、ザイドゥーニーヤ（イブン・ザイドゥーンの詩）に擬した父の詩句を伝承した。 「時は我らの隔たりゆえに我らの上に泣いた／かつては我らの近しさにしばし笑っていたのに」 イジャーザを与えた。ただし〔イジャーザの〕依頼状（イスティドアー）から検証を要する。アル＝アジュルーニーの言葉には混同があるからである。
  en: 'Muḥammad b. ʿAbd al-Raḥīm b. Muḥammad, Abū ʿAbd Allāh, al-Mawṣilī al-Dimashqī, the muezzin of the Umayyad Mosque. He transmitted from his father the latter''s verses composed in imitation of the Zaydūniyya: "Time wept over us for our separation, / whereas once it laughed at our closeness." He granted an ijāza; but this must be verified from the request for ijāza (istidʿāʾ), for there is confusion in what al-ʿAjlūnī says.'
