translation:
  ja: アブドゥッサマド・ブン・アブドゥッラフマーン・ブン・マスウード、ルーフ・アッ＝ディーン・ブン・サアド・アッ＝ディーン・イブン・アッ＝サドル・アッ＝シーラーズィー。828年には存命で、その年にアッ＝ザヒール・アブドゥッラフマーン・ブン・アブドゥルカーディル・アッ＝ターウースィーのもとで（ハディースを）読誦し、聴聞させた師（ムスミウ）の甥アフマド・ブン・アブドゥッラー・ブン・アブドゥルカーディルが彼とともに聴聞した。（その記録では）本項の人物は「学識あるハディース学者」、その父は「朗誦家（カーリウ）」、その祖父は「神の言葉（クルアーン）における我らの師」と評されている。
  en: ʿAbd al-Ṣamad b. ʿAbd al-Raḥmān b. Masʿūd Rūḥ al-Dīn b. Saʿd al-Dīn Ibn al-Ṣadr al-Shīrāzī. He was alive in the year 828 AH, in which he read under al-Ẓahīr ʿAbd al-Raḥmān b. ʿAbd al-Qādir al-Ṭāwūsī, and the nephew of the transmitter, Aḥmad b. ʿAbd Allāh b. ʿAbd al-Qādir, heard along with him. The subject was described (in that record) as "the learned hadith scholar", his father as "the reciter (al-qāriʾ)", and his grandfather as "our master in the Word of God".
