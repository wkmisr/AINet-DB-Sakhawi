translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・サダカ・ブン・アリー・ブン・ムハンマド・ブン・アブドゥッラフマーン、アル＝ムヒッブ・ブン・アッ＝ザキー、マナーウィー出身でミスルの人、ハナフィー派。父については後述する。諸学問に従事して多方面に通じ、優れた学識を得た。諸職（ジハート）の俸給を得、時に学生たちに教授した。イマームたるアル＝ブルハーン・アル＝カラキーと親しく結びついた。彼は、ハナフィー派カーディーのアル＝アムシャーティーがバルクーキーヤのシャイフ職に就任した際、同人から職務を授けられて恩恵を受けた者の一人である。（8）80年シャウワール月に、父の死からほどなくして没した。神が二人に慈悲を垂れたまわんことを。
  en: Muḥammad b. Abī Bakr b. Ṣadaqa b. ʿAlī b. Muḥammad b. ʿAbd al-Raḥmān, al-Muḥibb b. al-Zakī, of Manāwī origin, al-Miṣrī, the Ḥanafī; his father is mentioned below. He occupied himself with the sciences, became versatile in them and attained excellence. He obtained stipends in various posts and sometimes taught the students. He was closely attached to al-Burhān al-Karakī, the imām, and he was one of those on whom the Ḥanafī qāḍī al-Amshāṭī bestowed offices when the latter was appointed to the shaykhship of the Barqūqiyya. He died in Shawwāl (8)80, shortly after his father; may God have mercy on them both.
