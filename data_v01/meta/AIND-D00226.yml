translation:
  ja: イブラーヒーム・ブン・カーミル・アル＝バルシャーニー、次いでアル＝ワーディヤーシー、アル＝マーリキー。 彼はワーディヤーシュの教師の一人であり、イマーム職も兼任した。多くの人々が彼から恩恵を受けた。889年頃、60代半ばで急死した。彼は法学、アラビア語学、相続法、算術において傑出していた。彼から学んだ者の一人にアフマド・アブー・ヤフヤーがおり、彼が私（サハーウィー）に（イブラーヒームの）伝記を教えてくれた。
  en: Ibrāhīm b. Kāmil al-Barshānī, then al-Wādyāshī al-Mālikī. He was one of the teachers in Wadiash, along with serving as imām. A group of people benefited from him. He died suddenly around 889 AH at the age of sixty-something. He excelled in fiqh, Arabic language, inheritance law, and arithmetic. Among those who studied from him was Aḥmad Abū Yaḥyā, who informed me (al-Sakhāwī) of his biography.
