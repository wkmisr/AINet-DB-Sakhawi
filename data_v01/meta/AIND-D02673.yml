translation:
  ja: ハサン・アッ＝サッカー。上エジプトのタンバズィーの定住者。「アル＝ウリヤーン（裸の者）」の名で知られる。神聖な恍惚（ジャズブ）と奇跡（カラーマート）で言及される。その奇跡の中には、将来王位に就くことをスルタンに直接（口頭で）予言したことがあり、スルタンは即位すると、ハサンの没後、前述の地（タンバズィー）に彼のザーウィヤ（修道場）を建設した。その没年は873年で、享年は70余歳であった。
  en: Ḥasan al-Saqqā, a resident of Ṭanbadhī in Upper Egypt, known as al-ʿUryān. He was noted for his ecstatic state (jadhab) and miracles (karāmāt), among which was his oral prediction to the Sultan that the latter would attain sovereignty. Consequently, when the Sultan came to power, he built a zāwiya for him, after his death, in the aforementioned place. He died in the year 873 AH at the age of seventy-some.
