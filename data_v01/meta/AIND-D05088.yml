translation:
  ja: アリー・ブン・アッ＝リダー・アブー・バクル・ブン・ムハンマド・ブン・アブドゥッラティーフ・アル＝ヤマニー、のちにアル＝マッキー。アッ＝リダーとして知られる。アッ＝シラージュ・ウマルの兄弟。ジッダで少しの間書記を務めたが、のちにそれを辞めた。892年ラビーウ・アル＝アウワル月に亡くなった。
  en: ʿAlī b. al-Riḍā Abū Bakr b. Muḥammad b. ʿAbd al-Laṭīf al-Yamanī, then al-Makkī, known as al-Riḍā. He was the brother of al-Sirāj ʿUmar. He worked as a scribe in Jidda for a short while and then gave it up, and he died in Rabīʿ al-Awwal in the year 892 AH.
