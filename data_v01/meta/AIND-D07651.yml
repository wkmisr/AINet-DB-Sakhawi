translation:
  ja: ムハンマド・ブン・アブドゥッラッザーク、シャムス・アッ＝ディーン。直前の人物およびアル＝ファフル・イブン・アビー・アル＝ファラジュの兄弟。伝えられるところでは、カティヤーの監督職（ナザル）を執行したのち、二人の兄弟の存命中に没した。
  en: Muḥammad b. ʿAbd al-Razzāq, Shams al-Dīn, the brother of the preceding one and of al-Fakhr b. Abī al-Faraj. He died during the lifetime of his two brothers, after having exercised the supervision (naẓar) of Qaṭyā, according to what is said.
