translation:
  ja: アリー・アル＝ハッバーズ、盲目の（アッ＝ダリール）クルアーン読誦家。イブン・アサドのもとで七読誦法によって読誦し、学生たちに読誦を教えた。カーニム・モスクのイマームであるウマル・ブン・カースィムは彼のもとで読誦を学んだ者の一人である。（8）60年頃、あるいはそれ以後に没した。
  en: ʿAlī al-Khabbāz, the blind (al-Ḍarīr) Qurʾān reciter. He recited according to the seven readings under Ibn Asad and taught recitation to students. Among those who recited under him was ʿUmar b. Qāsim, imam of the Mosque of Qānim. He died around the year (8)60 or after it.
