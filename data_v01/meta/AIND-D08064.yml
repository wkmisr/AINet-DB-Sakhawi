translation:
  ja: ムハンマド・ブン・アリー・ブン・フサイン、エジプト出自、アル＝マッキー、そこ（マッカ）の商人の一人で、イブン・ジャウシャンとして知られる。（8）06年に、ハッダ・バニー・ジャービルとして知られるワーディー・アル＝ハッダで殺害されて没し、莫大な不動産を遺した。アル＝ファースィーが『マッカ（史）』で彼に言及している。
  en: Muḥammad b. ʿAlī b. Ḥusayn, of Egyptian origin, al-Makkī, one of the merchants there (in Mecca), known as Ibn Jawshan. He died in the year (80)6, killed in Wādī al-Hadda, known as Haddat Banī Jābir, leaving extensive real estate. Al-Fāsī mentioned him in (his history of) Mecca.
