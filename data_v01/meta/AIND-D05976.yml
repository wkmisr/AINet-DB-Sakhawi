translation:
  ja: ウマル・ブン・ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アブド・アル＝ワーヒド、アッ＝シラージュ・ブン・アル＝バドル・ブン・ナースィル・アッ＝ディーン・ブン・アッ＝ライース（医師頭）・アル＝アラー、アル＝カーヒリー、医師。先祖と同様にイブン・サギールとして知られ、母は女奴隷であった。叔父とアル＝イッズ・ブン・ジャマーアから学び、アル＝バドル・アッ＝タンバディーに随伴した者の一人。医学の有用な部分を暗記して医学に秀で、病人を治療した。いや、ハディルとイブン・アル＝アフィーフの処刑（胴斬り）の後、短期間、医師頭の職に就いたとも言われる。洗練されていて交際において穏やかな人であり、失明した後に金針術を受けて視力を回復し、96年生きたが白髪が一本も生えず、巡礼は叶わなかった。（8）67年ムハッラム月に没した。彼はアル＝カマール・ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アブド・アル＝カーフィー・ブン・サギールの親族である。
  en: ʿUmar b. Muḥammad b. Muḥammad b. ʿAlī b. ʿAbd al-Wāḥid, al-Sirāj b. al-Badr b. Nāṣir al-Dīn b. al-Raʾīs al-ʿAlāʾ al-Qāhirī, the physician, known like his forebears as Ibn Ṣaghīr; his mother was a slave woman. He was among those who studied with his paternal uncle and with al-ʿIzz b. Jamāʿa, and kept the company of al-Badr al-Ṭanbadī. He distinguished himself in medicine by memorizing useful portions of it and treated the sick; indeed it is said that he briefly held the headship (of the physicians) after the execution by cutting in half of Khaḍir and Ibn al-ʿAfīf. He was refined and of gentle company; he lost his sight, then was treated by couching and saw again. He lived ninety-six years without a single hair turning grey, and the pilgrimage was never granted to him. He died in Muḥarram (8)67. He is a relative of al-Kamāl Muḥammad b. Muḥammad b. ʿAlī b. ʿAbd al-Kāfī b. Ṣaghīr.
