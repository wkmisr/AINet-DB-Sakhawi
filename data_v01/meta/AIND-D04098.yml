translation:
  ja: アブドゥルカーディル・ブン・アフマド・ブン・フサイン・ブン・ハサン・ブン・アリー・ブン・ラスラーン・アッ＝ラムリー・アッ＝シャーフィイー。彼の父（の伝記）は前に出ている。イブン・ラスラーンとして知られる。ヒジュラ暦795年ラビー・アル＝アウワル月10日の木曜日の夜に生まれた。アブー・アル＝ハイル・ブン・アル＝アラーイーが、彼の父の求めによって彼に（伝承の）イジャーザを与えた。彼は善良な人物であった。彼の父の没後数年して、我らがシャイフ（イブン・ハジャル）の会合で彼を見かけた。彼は、アブー・ダーウードの（シャリーフの）注釈書やその著作に関連する事柄について、彼の父が適切な箇所に補入するよう尋ねて送ってきた小冊子をシャイフに手渡した。彼がそれらの箇所を見出せたかどうかは定かではないが、彼はそれを行わなかったと思う。神の慈悲が彼と我らにあらんことを、おそらくヒジュラ暦856年の初めに亡くなった。
  en: ʿAbd al-Qādir b. Aḥmad b. Ḥusayn b. Ḥasan b. ʿAlī b. Raslān al-Ramlī al-Shāfiʿī. His father was mentioned previously. He was known as Ibn Raslān. He was born on the night of Thursday, the 10th of Rabīʿ al-Awwal in the year 795 AH. Abū al-Khayr b. al-ʿAlāʾī granted him an ijāza at the request of his father. He was a good man. I saw him several years after his father's death at the gathering of our shaykh (Ibn Ḥajar), to whom he gave a booklet containing queries his father had sent regarding Ibn Ḥajar's commentary on Abū Dāwūd, so that they might be appended in their proper places. I do not think he did so, even if he knew where those places were. He died, presumably, in the early part of the year 856 AH. May God have mercy on him and on us.
