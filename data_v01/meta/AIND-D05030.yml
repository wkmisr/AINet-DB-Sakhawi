translation:
  ja: アリー・ブン・アフマド・ブン・ムハンマド・ブン・シュアイブ・アル＝ガムリー、のちにアル＝マハッリー。その父は既述。クルアーンを読誦し、スーフィーの貧者たち（フカラー）と交わった。長い髭で気さくな人物であり、アブー・アル＝アッバース・イブン・アル＝ガムリーの門人の一人。父は、彼が所有するとは誰も思わなかったほどの財産を彼に残した。私（サハーウィー）から聴聞した者の一人である。
  en: ʿAlī b. Aḥmad b. Muḥammad b. Shuʿayb al-Ghamrī, then al-Maḥallī; his father has been mentioned above. He recited the Qurʾān and kept company with the Sufi poor (fuqarāʾ). He was long-bearded and light-hearted, one of the companions of Abū al-ʿAbbās b. al-Ghamrī. His father left him more than anyone would have supposed he owned. He is among those who heard from me (al-Sakhāwī).
