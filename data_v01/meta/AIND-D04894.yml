translation:
  ja: アル＝アジュル・ブン・アジュラーン・ブン・ヌアイル・ブン・マンスール・ブン・ジャンマーズ・ブン・マンスール・ブン・ジャンマーズ・ブン・シーハ・ブン・ハーシム・アル＝アラウィー・アル＝フサイニー。父については少し前に既述。マーニウ・ブン・アリーの殺害後、（8）39年に彼とアリー・ブン・マーニウとがマディーナのアミール職をめぐって争ったが、どちらも手にすることはなく、彼（マーニウ）の後にはそのもう一人の息子アミヤーンが（アミール職に）確定した。
  en: al-ʿAjl b. ʿAjlān b. Nuʿayr b. Manṣūr b. Jammāz b. Manṣūr b. Jammāz b. Shīḥa b. Hāshim al-ʿAlawī al-Ḥusaynī; his father was mentioned shortly above. After the killing of Māniʿ b. ʿAlī, he and ʿAlī b. Māniʿ contended for the emirate of Medina in (8)39, but neither of them obtained it; rather, his (Māniʿ's) other son Amyān was confirmed in it after him.
