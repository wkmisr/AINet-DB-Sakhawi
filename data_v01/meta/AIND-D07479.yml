translation:
  ja: ムハンマド・ブン・シュアイブ・アル＝ガムリー。前述のアフマドの父。敬虔で、神に従順で、礼拝に励む、篤信の人であり、（神秘的な）境地とカラーマ（奇跡）を有し、シャイフ・ムハンマド・アル＝ガムリーと特別な結びつきがあった。それどころか彼はその弟子たちの中で最も傑出した者であり、シャイフは彼を弟子たちの上に立つ代理（ハリーファ）としたほどである。彼はアル＝マハッラのシャイフのもとに長く滞在した。私は彼らのうちの確かな者たちの一人ならぬ人から、彼への称賛を聞いた。［ヒジュラ暦8］53年頃、あるいはその翌年に没した。
  en: Muḥammad b. Shuʿayb al-Ghamrī, the father of Aḥmad, mentioned above. A righteous, devout, worshipful and scrupulous man who had spiritual states and miracles (karāmāt), and a special attachment to Shaykh Muḥammad al-Ghamrī; indeed he was the most eminent of his companions, so much so that the Shaykh appointed him as his deputy over them, and he stayed with him in al-Maḥalla for long periods. I heard praise of him from more than one of their reliable men. He died approximately in the year [8]53 or the following one.
