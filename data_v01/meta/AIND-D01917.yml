translation:
  ja: イスマーイール・ブン・イブラーヒーム・ブン・アビー・ラフマ・アル＝イマード・アブー・アル＝フィダー・ブン・アル＝ブルハーン・アル＝ジャアバリーは、ブルハーン・アル＝ハラビーのもとで『シーラト・イブン・サイイド・アル＝ナース』を朗誦した者の一人である。アル＝ハラビーは彼を「有徳で、敬虔で、善良で、熟達したシャイフ」と評し、その朗誦を836年ラビーウ・アル＝サーニーに記録し、「アッラーが彼を通して益を与え、また彼に益を与えんことを」と彼のために祈願した。
  en: Ismāʿīl b. Ibrāhīm b. Abī Raḥma al-ʿImād Abū al-Fidāʾ b. al-Burhān al-Jaʿbarī, who died in 892 H, was among those who read Sīrat Ibn Sayyid al-Nās under al-Burhān al-Ḥalabī. Al-Ḥalabī described him as a 'virtuous, righteous, good, and accomplished shaykh,' dated his reading in Rabīʿ al-Thānī of the year 836 H, and prayed for him, saying, 'May God benefit through him and benefit him.'
