translation:
  ja: イブラーヒーム・アル＝サトゥーヒー・アル＝メイダーニーは、（篤信の徒として）人々に敬信された者の一人であった。863年ジュマーダー・アル＝ウーラー月18日金曜日に死去し、カイロのアル＝カンタラ門の外側にあるコムギ広場の彼のザウィーヤに埋葬された。アル＝ムニールが彼の没年を記録した。
  en: Ibrāhīm al-Saṭūḥī al-Mīdanī was one of those held in pious esteem. He died on Friday, the 18th of Jumādā al-Ūlā in the year 863 H and was buried in his zawiya in Wheat Square, outside Bāb al-Qanṭara in Cairo. al-Munīr recorded the date of his death.
