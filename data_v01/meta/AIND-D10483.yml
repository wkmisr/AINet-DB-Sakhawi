translation:
  ja: ユースフ・ブン・アブドゥルハミード・ブン・ウマル・ブン・ユースフ・ブン・アブドゥッラー、トゥーフの出、カイロの人、アズハリー、シャーフィイー派。既出のヤフヤーとアフマドの父で、その父も既出。イブン・アブドゥルハミードの名で知られる。クルアーンを暗記してその読誦を修め、『ミンハージュ』も暗記した。ハーリド・アル＝ムヌーフィーらのもとで学んだ。幾度も巡礼し、（聖地に）寄留し、一時期子どもたちに教えた。アシュラフ・カーイトバーイの墓廟に席を与えられた者の一人である。
  en: Yūsuf b. ʿAbd al-Ḥamīd b. ʿUmar b. Yūsuf b. ʿAbd Allāh, al-Ṭūkhī by origin, al-Qāhirī al-Azharī al-Shāfiʿī, father of the aforementioned Yaḥyā and Aḥmad; his own father has also been mentioned. He is known as Ibn ʿAbd al-Ḥamīd. He memorised the Qurʾān and perfected its recitation, and [memorised] the Minhāj, and studied under Khālid al-Munūfī and others. He made the pilgrimage more than once and sojourned [in the holy cities], and for a time he taught boys. He is one of those holding a place in the tomb complex (turba) of al-Ashraf Qāytbāy.
