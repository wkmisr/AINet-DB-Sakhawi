translation:
  ja: ジュルバーン・アル＝ウマリー・アッ＝ザーヒリー・バルクーク。十人長（アミール・アシャラ）の一人にしてハージブの一人であり、宗教心と善行を好む人物であった。およそ830年より後にガザのハージブ職に就き、その数年後に同地で亡くなった。
  en: Julbān al-ʿUmarī al-Ẓāhirī Barqūq was one of the amirs of ten and one of the ḥājibs, inclined towards religion and goodness. He was appointed to the chamberlainship of Gaza after approximately 830 H and died there a few years later.
