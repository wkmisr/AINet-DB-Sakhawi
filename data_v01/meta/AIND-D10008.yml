notes:
- text: '通称索引 #AIND-D12242「ابن الجيعان ذكرت منهم الفخر عبد الغني والتاج عبد اللطيف والجمال عبد الله وناصر الدين منصور بني العلم شاكر بن ماجد」は本項主を「ناصر الدين منصور」と呼ぶ（本項の見出しは سعد الدين）。ラカブの食い違いは原文どおりに留め、同定には用いない。索引はもう一人の兄弟 الجمال عبد الله も挙げるが本項に言及がないので relation は立てない。「كان ومات」の「كان」は原文どおり（訳では「存命し」）。'
