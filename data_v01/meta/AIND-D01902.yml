translation:
  ja: 878年没、イスハーク・ブン・ムハンマド・ブン・イブラーヒーム、通称タージュ・アブー・アル＝バラカート、タミーミー家出身、ハリーリー出身、シャーフィイー派。アブー・アル＝ハイル・ブン・アル＝アラーイーから『アル＝サヒーフ』を聴聞し、これをハディースとして伝えた。彼から聴聞した者の中には、以前に言及されたアフマド・ブン・アブド・アル＝アーリーがいる。また、スヌバートでは、後に言及されるアル＝イズ・アブド・アル＝アジーズ・ブン・ユーサフが彼から聴聞した。
  en: Isḥāq b. Muḥammad b. Ibrāhīm, al-Tāj Abū al-Barakāt al-Tamīmī al-Khalīlī al-Shāfiʿī, died in 878. He heard al-Ṣaḥīḥ from Abū al-Khayr b. al-ʿAlāʾī and transmitted it. Among those who heard from him was Aḥmad b. ʿAbd al-ʿĀlī, who was mentioned previously. Similarly, al-ʿIzz ʿAbd al-ʿAzīz b. Yūsuf heard from him in Sunbāṭ, as will be mentioned later.
