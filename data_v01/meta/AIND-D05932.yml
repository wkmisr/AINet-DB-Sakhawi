translation:
  ja: ウマル・ブン・ムハンマド・ブン・アフマド・ブン・アブドゥルハーディー・ブン・アブドゥルハミード、アッ＝ザイン・ブン・アル＝ハーフィズ・アッ＝シャムス、アル＝マクディスィー、のちにアッ＝サーリヒー、ハンバリー派。ムハンマド・ブン・アブドゥルハーディーの娘ファーティマの姉妹の息子であり、イブン・アブドゥルハーディーとして知られる。739年ズー・アル＝カアダ月に生まれ、ザイナブ・イブナト・アル＝カマールのもとで『マジュリス・アッ＝ルーヤーニー』などの聴講に連れて行かれ（幼少時に出席し）、アフマド・ブン・アリー・アル＝ジャザリーおよびアブドゥッラヒーム・ブン・アビー・アル＝ヤサルのもとで聴聞させられた。ハディースを伝え、我らがシャイフ（イブン・ハジャル）らが彼のもとで読誦した。アル＝マクリーズィーが『ウクード』で彼に言及している。（80）3年シャアバーン月、大事件（ティムールのダマスクス包囲）のなかダマスクスで没した。
  en: ʿUmar b. Muḥammad b. Aḥmad b. ʿAbd al-Hādī b. ʿAbd al-Ḥamīd, al-Zayn b. al-Ḥāfiẓ al-Shams, al-Maqdisī, then al-Ṣāliḥī, the Ḥanbalī, son of the sister of Fāṭima bint Muḥammad b. ʿAbd al-Hādī, known as Ibn ʿAbd al-Hādī. He was born in Dhū al-Qaʿda of the year 739. He was brought as a child to hear the Majlis al-Rūyānī and other works before Zaynab bint al-Kamāl, and was made to hear from Aḥmad b. ʿAlī al-Jazarī and ʿAbd al-Raḥīm b. Abī al-Yasar. He transmitted ḥadīth; our shaykh (Ibn Ḥajar) and others read to him. Al-Maqrīzī mentioned him in his ʿUqūd. He died in Damascus during the great calamity (Tīmūr's siege), in Shaʿbān of the year (80)3.
