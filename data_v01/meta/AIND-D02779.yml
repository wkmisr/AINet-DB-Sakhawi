translation:
  ja: ハムザ・ブン・アブドゥルラッザーク・ブン・アル＝バカリー。ヤフヤーの兄弟で、アッ＝シャラフとアル＝マジドの従兄弟。厩舎（イスティブル）の管理職などを務めた。890年ズー・アル＝カアルダ月（1485年11月頃）に死去。彼らの中で最年長であったと言われる。
  en: Ḥamza b. ʿAbd al-Razzāq b. al-Baqarī. Brother of Yaḥyā and cousin of al-Sharaf and al-Majd. He managed the stable and other administrations. He died in Dhu al-Qaʿda, the year 890 AH, and it is said that he was the oldest of them.
