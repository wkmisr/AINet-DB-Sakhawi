translation:
  ja: アリー・ブン・ムハンマド・ブン・アフマド・ブン・アリー・アル＝マッキー・アル＝アッタール。アル＝ヒジャーリーとして知られる。837年にイブン・ファハドとともにイブン・アッ＝タッハーンらから聴聞した。ミスルやシャームなどに繰り返し入った。
  en: ʿAlī b. Muḥammad b. Aḥmad b. ʿAlī al-Makkī al-ʿAṭṭār, known as al-Ḥijārī. In the year 837 he heard from Ibn al-Ṭaḥḥān and others together with Ibn Fahd, and he repeatedly entered Egypt, Syria and elsewhere.
