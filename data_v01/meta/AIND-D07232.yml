notes:
- text: '転送見出し（原文「صوابه ابن أبي بكر محمد بدون ابن بينهما وسيأتي」による）。転送先は #AIND-D07167「محمد بن أبي بكر محمد بن أحمد بن محمد بن محمد بن عثمان بن موسى المحب ابن التاج الكناني العسقلاني الطوخي ثم القاهري الشافعي الماضي في المحمدين أبوه وعمه المحب」（877年没、ジッダ。未受領）。ナサブ（أبي بكر محمد بن أحمد بن محمد بن محمد بن عثمان）・ラカブ المحب・ニスバ الطوخي が一致。'
  type: reference
translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ウスマーン、アル＝ムヒッブ・アッ＝トゥーヒー。正しくは「イブン・アビー・バクル・ムハンマド」であって両者（アブー・バクルとムハンマド）の間に「ブン」を入れない。後述する。
  en: Muḥammad b. Abī Bakr b. Muḥammad b. Aḥmad b. Muḥammad b. Muḥammad b. ʿUthmān al-Muḥibb al-Ṭūkhī. The correct form is Ibn Abī Bakr Muḥammad, without "ibn" between the two; he will come below.
