notes:
- text: '転送見出し（原文「صوابه ابن أبي بكر محمد بدون ابن بينهما وسيأتي」による）。転送先は #AIND-D07167「محمد بن أبي بكر محمد بن أحمد بن محمد بن محمد بن عثمان بن موسى المحب ابن التاج الكناني العسقلاني الطوخي ثم القاهري الشافعي الماضي في المحمدين أبوه وعمه المحب」（877年没、ジッダ。未受領）。ナサブ（أبي بكر محمد بن أحمد بن محمد بن محمد بن عثمان）・ラカブ المحب・ニスバ الطوخي が一致。'
