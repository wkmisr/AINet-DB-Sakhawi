translation:
  ja: ターヒル・ブン・アフマド・ブン・ムハンマド・サフィー・アッ＝ディーン・ブン・ファフル・アッ＝ディーン・ブン・アッ＝シャイフ・シャムス・アッ＝ディーン・アル＝カーザルーニー。後述のムハンマドの兄弟。アル＝ターウースィーと面会し、彼から（学問を）得た。アル＝ターウースィーは彼の没年月日を848年ムハッラム月19日金曜日と記録している。
  en: Ṭāhir b. Aḥmad b. Muḥammad Ṣafī al-Dīn b. Fakhr al-Dīn b. al-Shaykh Shams al-Dīn al-Kāzarūnī, the brother of Muḥammad who is mentioned below. Al-Ṭāwūsī met him and benefited from him, and recorded his death as Friday, the 19th of al-Muharram in the year 848 AH.
