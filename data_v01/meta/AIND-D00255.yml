translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・アフマド・アル＝アジール・アル＝ヤマニー。 彼から学んだのは、父、さらにその父がアン＝ナフィース・アル＝アラウィーから学んだ者である。彼の姉妹の息子、アフマド・ブン・ムーサー・ブン・アフマド・ブン・アジールが彼から学んだ。
  en: Ibrāhīm b. Muḥammad b. Aḥmad al-ʿAjīl al-Yamānī. Among those who acquired knowledge from his father, who in turn acquired it from al-Nafīs al-ʿAlawī. His sister's son, Aḥmad b. Mūsā b. Aḥmad b. ʿAjīl, acquired knowledge from him.
