    ja: '「سمع من فاطمة ابنة العز وغيرها」。候補は二人いて原文からは決まらない（規則26・61 (c)）: (a) 既登録 TMP-P-000543「فاطمة ابنة العز إبراهيم」（#AIND-D01198「وفاطمة ابنة العز إبراهيم」で登録。corpus #AIND-D04093「حبيبة ابنة العز إبراهيم بن عبد الله بن أبي عمر وأسمع على أختها فاطمة ابنة العز」・#AIND-D03134「فاطمة ابنة العز إبراهيم بن أبي عمر」の8世紀のムスニダ）／(b) 女性部 #AIND-D13481「فاطمة ابنة محمد بن أحمد بن محمد بن عثمان بن المنجا أم الحسن ابنة العز التنوخية الدمشقية , ولدت سنة اثنتي عشرة وسبعمائة تقريبا」（見出しに「ابنة العز」を持つダマスクスの女性伝承者）。サハーウィーの裸の「فاطمة ابنة العز」は corpus の他の用例（#AIND-D01059・#AIND-D03754・#AIND-D04875・#AIND-D08561・#AIND-D13479）では8世紀前半〜半ばの師で (a) とみられるが、本項は聴講の年代が書かれていない＝#NEEDID のまま候補を記す（ISSUES §D170-6）。「وغيرها」は人物を立てない。'
