translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・アブドゥッラー・ブン・イブラーヒーム・ブン・ムハンマド、アル＝ウルマウィー、のちアッ＝サーリヒー。ファーティマ・ビント・アル＝イッズらから聴き、ハディースを伝えた。我らの師（イブン・ハジャル）らが彼から聴いた。（80）4年にダマスクスで没した。（我らの師は）彼を『ムウジャム』と『インバー』で挙げている。
  en: Muḥammad b. Ibrāhīm b. Muḥammad b. ʿAbd Allāh b. Ibrāhīm b. Muḥammad al-Urmawī, then al-Ṣāliḥī. He heard from Fāṭima bt. al-ʿIzz and others, and transmitted ḥadīth; our shaykh (Ibn Ḥajar) and others heard from him. He died in Damascus in the year [80]4. He (our shaykh) mentioned him in the Muʿjam and the Inbāʾ.
