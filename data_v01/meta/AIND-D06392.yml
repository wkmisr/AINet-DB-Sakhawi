translation:
  ja: クズル・アル＝アルグーンシャーウィー——（主人は）アミール・マジュリスのアルグーン・シャー。アル＝ムアイヤドの時代に昇進してアミールとなり、次いで彼（アル＝ムアイヤド）は妻の父ナースィリー・イブン・アル＝バーリズィーの仲介により彼をカラクの副官に任じ、次いで解任してダマスクスのムカッダムとしたが、シリアに到着する前に長患いの末、822年ムハッラム月に没した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及し、カラク、次いでアレクサンドリアの副官を務めてのち解任されたと述べている。
  en: Kuzul al-Arghūnshāwī, (mamlūk of) Arghūn Shāh the amīr majlis. He rose in the days of al-Muʾayyad until he became an amir; then he (al-Muʾayyad) appointed him governor (nāʾib) of al-Karak through the mediation of his father-in-law al-Nāṣirī b. al-Bārizī, then dismissed him and made him a muqaddam in Damascus, but he died before reaching Syria, after a long illness, in Muḥarram of the year 822. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said that he served as governor of al-Karak, then of Alexandria, and was then dismissed.
