translation:
  ja: アブドゥルカーディル・ブン・ムハンマド・ブン・アブー・アブドゥッラー・ムハンマド・ブン・アリー・ブン・アフマド・ブン・アブドゥルアズィーズ、アブー・アル＝ファラジュ・アル＝ヌワイリー。母はハワージャ・ダーウード・ブン・アリー・アル＝キーラーニーの娘ザイナブ。ヒジュラ暦850年ズー・アル＝ヒッジャ（12月）にマッカで生まれた。イブン・ファハドは（彼の今後の記述のために）余白を残した。
  en: ʿAbd al-Qādir b. Muḥammad b. Abī ʿAbd Allāh Muḥammad b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz, Abū al-Faraj al-Nuwayrī. His mother was Zaynab, daughter of al-Khawājā Dāwūd b. ʿAlī al-Kīlānī. He was born in Dhu al-Hijjah in the year 850 AH in Mecca. Ibn Fahd left a blank space for him (to record his death or subsequent biography).
