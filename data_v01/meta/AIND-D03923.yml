translation:
  ja: アブドゥッサラーム・ブン・ハサン、アル＝イッズ、アル＝ハーリディー。前述のアブドゥッラフマーンの兄弟で、「アル＝カッザーブ（嘘つき）」として知られる。843年ムハッラム月にメッカで没した。イブン・ファフドがその没年を記録している。
  en: ʿAbd al-Salām ibn Ḥasan al-ʿIzz al-Khālidī, the brother of the aforementioned ʿAbd al-Raḥmān, known as al-Kadhdhāb (the Liar). He died in Mecca in Muḥarram of the year 843 AH. Ibn Fahd recorded the date of his death.
