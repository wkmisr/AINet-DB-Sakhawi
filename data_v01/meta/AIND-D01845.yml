translation:
  ja: アディカー（またはアダカー。点なしのダール（د）にカスラまたはファトハを付して読む）。ダシュト（キプチャク草原）王国の君主。822年に殺害され、彼の後にはチンギス・ハーンの裔であるムハンマド・ハーンが（位に）就いた。
  en: Adikā (or Adakā; with a kasra or fatḥa on the undotted dāl), ruler of the Kingdom of al-Dast (i.e. the Dasht [-i Qipchāq]). He was killed in 822 H, and after him Muḥammad Khān, from the progeny of Genghis Khan (Jinkiz Khān), was established in his place.
