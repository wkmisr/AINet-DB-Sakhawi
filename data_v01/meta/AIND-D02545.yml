translation:
  ja: ハサン・ブン・ズバイリー・ブン・カイス・ブン・サービト・ブン・ヌガイル・ブン・マンスール、アル＝バドル・アル＝フサイニー。マディーナのアミール（知事）。前任であった父親（後述）の後を継ぎ、シャリーフ・ムハンマド・ブン・バラカートのもとでヒジュラ暦888年にマディーナの支配者となった。彼は年少でありながら聡明であると評されており、私（サハーウィー）はヒジュラ暦898年にマディーナで彼に会った。
  en: Ḥasan b. Zubayrī b. Qays b. Thābit b. Nughayr b. Manṣūr, al-Badr al-Ḥusaynī, the Emir of Medina. He assumed its governorship after his father (who is mentioned below) in the year 888 AH, under the authority of al-Sharīf Muḥammad b. Barakāt. Despite his youth, he was described as being intelligent. I (al-Sakhāwī) saw him in Medina in the year 898 AH.
