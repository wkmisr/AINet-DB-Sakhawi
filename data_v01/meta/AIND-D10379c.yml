translation:
  ja: ヤシュバク・アン＝ナウルーズィー、〔ナウルーズ・〕アル＝ハーフィズィーの〔マムルーク〕。主人の後、転々として、ダマスクスのアミールの一人となり、次いでトリポリの侍従長職、次いでダマスクスの〔侍従長職〕、次いでトリポリの副王職を務めた。これらはすべてザーヒル・ジャクマクの時代に、資格がないため金銭を納めて〔得たもの〕であった。次いで逮捕されて投獄され、次いでエルサレムに追放され、しばらく後の863年ムハッラム月に同地で没した。
  en: Yashbak al-Nawrūzī, mamluk of (Nawrūz) al-Ḥāfiẓī. After his master he moved from post to post until he became one of the amirs of Damascus, then chamberlain of Tripoli, then of Damascus, then governor of Tripoli — all in the days of al-Ẓāhir Jaqmaq, by payment, as he was unqualified. Then he was arrested and imprisoned, then sent to Jerusalem, where he died after a time in Muḥarram 863.
