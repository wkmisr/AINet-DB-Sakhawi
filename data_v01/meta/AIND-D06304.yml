translation:
  ja: カーニム、ナアジャ（牝羊）と渾名された者、アル＝アシュラフィー・バルスバーイ。主人の近侍（ハーッサキーヤ）の一人であり、ついでイーナールの治世に十人長（アミール・アシャラ）となり、871年ジュマーダー第一月に没するまでその地位にあった。60歳に近づいていたか、少し超えていた。自らに対して放縦であった。アッラーが彼を赦したまわんことを。
  en: Qānim, nicknamed Naʿja (ewe), al-Ashrafī Barsbāy. He was one of the khāṣṣakiyya of his master, then was made an amīr of ten in the days of Īnāl, until he died in Jumādā I of the year 871, having approached sixty or passed it by a little. He was dissolute with himself; may God pardon him.
