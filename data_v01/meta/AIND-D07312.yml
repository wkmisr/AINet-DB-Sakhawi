translation:
  ja: ムハンマド、前の三人に続く四人目で、同じくウンム・ワラドの子。同年（853年）サファル月22日水曜日に、同じくペストで6歳にて没した。
  en: Muḥammad, the fourth after the three preceding him, likewise by an umm walad. He died on Wednesday, 22 Ṣafar of that year (853), also of the plague, at the age of six.
