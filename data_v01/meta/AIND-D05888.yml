notes:
- text: '転送見出し（「فيمن لم يسم أبوه」）。転送先は #AIND-D06025「عمر الكمال البلخي الحنفي نزيل القدس」（826年没。عمر 部の父名なし見出しで البلخي を持つ唯一の項）。D06025 本文に「وممن أخذ عنه الشمس بن عمر قاضي غزة وسمي والده يعقوب وغيره وسمى والده عبد الله」とあり、父名 عبد الله は伝承者の一人の呼称として記録されている。同じ D06025 へ向く転送見出し D06013「عمر بن يعقوب الكمال البلخي الحنفي . يأتي فيمن لم يسم أبوه」（父名 يعقوب）も存在する。'
