translation:
  ja: フェズおよびマグリブのその周辺地域の支配者（サーヒブ）であるアブドゥルハック・ブン・ムハンマド・ブン・ウスマーン・ブン・マリーン・アル＝マリーニー。このように彼を系譜づける者もいるが、別の者は、前述の通り、彼をウスマーン・ブン・アフマドの息子であるとした。
  en: ʿAbd al-Ḥaqq bin Muḥammad bin ʿUthmān bin Marīn al-Marīnī, the ruler of Fez and its surrounding regions in the Maghrib. Thus I saw some lineage-makers trace his ancestry, while others said that he was the son of ʿUthmān bin Aḥmad, as mentioned previously.
