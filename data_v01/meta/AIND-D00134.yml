translation:
  ja: イブラーヒーム・ブン・サダカ・ブン・イブラーヒーム・ブン・イスマーイール、ハディース伝承者にして多作なブルハーン・アッ＝ディーン・アブー・イスハーク・ブン・ファトフ・アッ＝ディーン。出身はエルサレム、ニスバからダマスカスのサーリヒーヤに属し、カイロで生まれ育ったハンバル派の人物。彼の父は金細工師 (アッ＝サーイグ) または布地商 (アル＝バッザール) として知られ、サーリヒー派に属した。 彼は772年にカイロで生まれ、母はムハンマド・ブン・アフマド・アル＝マクディシーの娘ハディージャ。ハディージャは彼の祖父、カーディーのイッズ・アッ＝ディーン・アフマド・ブン・イブラーヒーム・アル＝キナーニー(彼の母方)の母方の叔母にあたる。 彼は育ち、クルアーン、ハディースに関する『アル＝ウムダ』、および自派のフクール学における『ムフタサル・アル＝ヒラキー』を暗記した。イブン・アル＝ムラッキン、アル＝アブナーシー、イブン・ハーティム、アル＝イラーキーに提出し、彼らからイジャーザを授与された。また、最初の師(イブン・アル＝ムラッキン)以外の者たち、および母、ジャマール・アル＝バージー、ナジュム・イブン・ラズィーン、サドル・アブー・ハフス・イブン・ラズィーン、イッズ・アブー・アル＝ヤマン・イブン・アル＝クーワイク、その息子シャラフ・アブー・アッ＝ターヒル、三人のクルアーン朗誦者であるシャムス・アル＝アスカラーニー、アブー・アル＝バカー・イブン・アル＝カーシフ、ザイン・アブー・アル＝ファラジュ・アブドゥルラフマーン・アッ＝サルマーシー・アル＝ハナフィー、さらにザイン・イブン・アッ＝シャイハ、両サラーフ・アル＝バルバイシー、ムハンマド・ブン・ムハンマド・ブン・ハサン・アッ＝シャーズィリー、四人のシハーブであるイブン・アル＝ムクリー、イブン・バニーン、アッ＝スワイダーウィー、アル＝ジャウハリー、四人のシャムスであるアッ＝リファー、イブン・アブー・ザバー、イブン・ヤーシーン・アル＝ジャズーリー、タキー・アッ＝ダジュウィー、ファフル・アル＝カーヤーティー、その他多くの人々から聴聞した。 また、彼らから直接の聴聞は確認できないが、多くの人々からイジャーザを授与された。その中にはマグリブ出身のアブー・アブドゥッラー・アッ＝サッラーウィー、そして彼自身の学派(ハンバル派)の学者ではカーディー・ナーシル・アッ＝ディーン・イブン・アラファ、アブー・アル＝カーシム・アル＝バルザリー、カーディー・イブン・ハルドゥーン、ファフル・アブー・ウマル・ウスマーン・ブン・アフマド・アル＝カイラワーニー、さらに再びアブー・アブドゥッラー・アッ＝サッラーウィー、カーディー・ナーシル・アッ＝ディーン・ナスルッラー・ブン・アフマド・アル＝キナーニー、ジャラール・ナスルッラー・ブン・アフマド・アル＝バグダーディーらがいる。
    その他、広く一般の人々の中にはシラージ・アル＝クーミー、アッ＝タヌーヒー、イッズ・ブン・アル＝マリージー、イブン・アブー・アル＝マジド、イブン・アル＝ファシーフ、タージュ・アッ＝サルディー、シャムス・アル＝ファルスィーシー、サドル・ブン・アル＝アブシーティー、アル＝マナーウィー、ナーシル・アッ＝ディーン・イブン・アル＝マイラク、アブドゥルカリーム・ブン・ムハンマド・イブン・アル＝クティブ・アル＝ハラビー、シャムス・アル＝ハリーリー、アラー・ブン・アッ＝サバアらがいる。 彼は法学などを学び、シャラフ・アブドゥルムンイム・アル＝バグダーディーから教授職の許可を得て、賞賛された。彼はシャイフーニーヤなどの職位を歴任し、一時的に証人職で生計を立て、その職で熟達したが、後に無力となり自宅で療養することになった。多くの学生が彼に聴聞を求めて訪れ、多くの賢者たちが彼から学んだ。私(サハーウィー)も彼から多くのことを学び、私の事典の彼の伝記にそれらを記した。 彼は善良で信頼できる人物であり、ハディース伝達に忍耐強く、倦むことも嫌がることもなく、ハディースとその担い手を深く愛した。その点では類を見ないほどであり、また静かで威厳があった。時折、逸話や珍しい話も語った。彼の親戚であるイッズ・アル＝キナーニーは、彼がひどく偏屈で引きこもりがち、疑い深く、人付き合いが下手だと評した。真相はアッラーのみぞ知る。総じて、彼は優れたハディース伝承者の一人であった。 852年のジュマーダー・アル＝ウーラー26日の日曜日に亡くなった。死亡前に多少の精神的な変化があったと言われるが、私には確認できなかった。翌日、アズハル・モスクで彼の葬儀の礼拝が行われた。アッラーが彼と私たちを憐れんでくださるように。 アル＝ビカーイーが「842年の初めから脳卒中で半身不随となり、死に至るまで精神錯乱を起こした」と述べたことは、全くの誇張である。
  en: 'Ibrāhīm b. Ṣadaqa b. Ibrāhīm b. Ismāʿīl, the prolific transmitter (al-Musnid al-Mukthir), Burhān al-Dīn Abū Isḥāq b. Fatḥ al-Dīn. Of Jerusalemite origin, affiliated with Ṣāliḥiyya of Damascus by nisbah, born and raised in Cairo, a Hanbalī. His father was known as al-Ṣāʾigh (the goldsmith) and al-Bazzār (the cloth merchant), and he was also al-Ṣāliḥī. He was born in 772 AH in Cairo. His mother was Khadīja, daughter of Muḥammad b. Aḥmad al-Maqdisī, who was the maternal aunt of his maternal grandfather, al-Qāḍī ʿIzz al-Dīn Aḥmad b. Ibrāhīm al-Kinānī. He grew up and memorized the Qurʾān, al-ʿUmda fī al-Ḥadīth, and Mukhtaṣar al-Kharqī (in their school''s legal branches). He presented these works to Ibn al-Mulaqqin, al-Abnāsī, Ibn Ḥātim, and al-ʿIrāqī, and they granted him ijāza. He also heard from all of them except the first (Ibn al-Mulaqqin), as well as from his mother, al-Jamāl al-Bājī, al-Najm Ibn Razīn, al-Ṣadr Abū Ḥafṣ b. Razīn, al-ʿIzz Abū al-Yaman b. al-Kuwayk and his son al-Sharaf
    Abū al-Ṭāhir, the three reciters al-Shams al-ʿAsqalānī, Abī al-Baqāʾ b. al-Qāṣiḥ, and al-Zayn Abū al-Faraj ʿAbd al-Raḥmān al-Salmāsī al-Ḥanafī, also al-Zayn b. al-Shaykha, the two Ṣalāḥs al-Bulbaysī, Muḥammad b. Muḥammad b. Ḥasan al-Shādhilī, the four Shihābs: Ibn al-Muqrī, Ibn Banīn, al-Suwaydāwī, and al-Jawharī, and the four Shumūs: al-Rifāʾ, Ibn Abī Zabā, Ibn Yāsīn al-Jazūlī, al-Taqī al-Dajwī, and al-Fakhr al-Qāyātī, among others. Many others, from whom he did not have recorded hearings, granted him ijāza, including among the Maghrebis Abū ʿAbd Allāh al-Sallāwī, and among other scholars of his madhhab, al-Qāḍī Nāṣir al-Dīn b. ʿArafa, Abū al-Qāsim al-Barzalī, al-Qāḍī Ibn Khaldūn, al-Fakhr Abū ʿUmar ʿUthmān b. Aḥmad al-Qayrawānī, and Abū ʿAbd Allāh al-Sallāwī. Among other scholars of his madhhab, al-Qāḍī Nāṣir al-Dīn Naṣr Allāh b. Aḥmad al-Kinānī and al-Jalāl Naṣr Allāh b. Aḥmad al-Baghdādī. From among other people were al-Sirāj al-Kūmī, al-Tanūkhī, al-ʿIzz b. al-Malījī, Ibn Abī al-Majd,
    Ibn al-Faṣīḥ, al-Tāj al-Ṣardī, al-Shams al-Farsīsī, al-Ṣadr b. al-Abshīṭī, al-Manāwī, Nāṣir al-Dīn b. al-Maylaq, ʿAbd al-Karīm b. Muḥammad Ibn al-Quṭb al-Ḥalabī, al-Shams al-Ḥarīrī, and al-ʿAlāʾ b. al-Sabʿ. He engaged in fiqh and other fields. Al-Sharaf ʿAbd al-Munʿim al-Baghdādī permitted him to teach and praised him. He held various positions, such as at al-Shaykhūniyya. He earned a living for a time as a witness, in which he excelled, but later became incapacitated and confined to his home. Students sought him out for hearing, and many scholars learned from him. I (al-Sakhāwī) was among those who took many things from him, which I recorded in his biography in my dictionary. He was a good and trustworthy person, patient in transmitting ḥadīth, never tiring or annoyed, and deeply loved ḥadīth and its people, being unparalleled in that, all with calmness and dignity. He would sometimes relate anecdotes and rare stories. His relative, al-ʿIzz al-Kinānī, described him as excessively eccentric,
    reclusive, suspicious, and lacking social graces. Allah knows best. In summary, he was among the virtues of the ḥadīth transmitters. He died on Sunday, the 26th of Jumada al-Thani in 852 AH, after being said to have undergone a slight change (mentally or physically), though this was not confirmed by me. His funeral prayer was performed the next day at al-Azhar Mosque. May Allah have mercy on him and us. Al-Biqāʿī''s statement that he became confused from the beginning of 842 AH due to a stroke that paralyzed one side until he died is a clear exaggeration.'
