translation:
  ja: アリー・ブン・アビー・アブディッラー・ブン・アフマド・ブン・アブド・アル＝アズィーズ・アン＝ヌワイリー・アル＝マッキー。824年、アル＝ワリー・アル＝イラーキー、アル＝フウウィー、アル＝ファフル・アッ＝ダンディーリー、アッ＝シャムス・ムハンマド・ブン・ハサン・アル＝バイジューリーほかが彼にイジャーザを与えた。幼くして没した。
  en: ʿAlī b. Abī ʿAbd Allāh b. Aḥmad b. ʿAbd al-ʿAzīz al-Nuwayrī al-Makkī. In the year 824 al-Walī al-ʿIrāqī, al-Fuwwī, al-Fakhr al-Dandīlī and al-Shams Muḥammad b. Ḥasan al-Bījūrī, among others, granted him an ijāza. He died young.
