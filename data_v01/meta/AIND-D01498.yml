translation:
  ja: アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ダマルダーシュ、ラカブはアッ＝シハーブ、ガッザ出身のハナフィー派。ハナフィー派カーディーであったアッ＝シャムス・ブン・アル＝マグリビーの姉妹の子（甥）であり、イブン・ダマルダーシュとして知られる。彼はフィクフを母方の伯父（＝アッ＝シャムス・ブン・アル＝マグリビー）から学び、アラビア語学・意味論・修辞学・スーフィズムを、アッ＝シャムス・アル＝ヒムスィーおよび彼のもとを訪れた他の者たちから学んだ。諸学に秀で、篤信・巧みな詩文・美しい伝記（行状）を備え、証言（シャハーダ）で生計を立て、故郷ではその道の第一人者となった。
  en: Aḥmad b. Muḥammad b. Muḥammad b. Damardāsh, al-Shihāb al-Ghazzī al-Ḥanafī, sister's son (nephew) of the Ḥanafī judge al-Shams b. al-Maghribī, known as Ibn Damardāsh. He took jurisprudence (fiqh) from his maternal uncle, and Arabic, semantics (maʿānī), rhetoric (bayān) and Sufism from al-Shams al-Ḥimṣī, among others who came to him. He excelled in various fields, with piety, fine poetry and prose and a beautiful character, and earned his living by testimony (al-shahāda), in which he became the foremost figure of his hometown.
