translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・フサイン、アル＝ジャマール・アブー・アブドゥッラー・ブン・アル＝アフィーフ・アル＝ハサニー・アル＝ヤマーニー。アル＝バドル・アル＝アフダルの孫で、フサイン・ブン・スィッディークの従兄弟。（8）86年にマッカで私（サハーウィー）からいくつかのものを聴聞した。カイロには幾度か来ており、そのうちの一回は888年で、そこから上エジプト（サイード）へ旅してわずかな糧を得てから戻った。善良さ・物静かさ・寡欲において実に立派な人物である。その後894年にもマッカで私と再会した。
  en: Muḥammad b. ʿAbd Allāh b. Ḥusayn, al-Jamāl Abū ʿAbd Allāh b. al-ʿAfīf al-Ḥasanī al-Yamānī, grandson of al-Badr al-Ahdal and cousin of Ḥusayn b. Ṣiddīq. He heard some things from me (al-Sakhāwī) in Mecca in (8)86. He came to Cairo more than once, including in 888, and travelled from there to Upper Egypt (al-Ṣaʿīd), where he obtained a small livelihood, and then returned. What a fine man he is in goodness, tranquillity and contentment. He then met me again in Mecca in 894.
