translation:
  ja: アブー・アル＝ヤマン・ムハンマド・ブン・アフマド・ブン・アッ＝ラディー・イブラーヒーム・ブン・ムハンマド・ブン・イブラーヒーム・アッ＝タバリー・アル＝マッキーの息子アフマド・ブン・アフマド。彼の母は、ザイヌ・アッ＝ディーン・アフマド・ブン・アル＝ジャマール・ムハンマド・ブン・アル＝ムヒッブ・アッ＝タバリーの娘ザイナブである。彼はヒジュラ暦814年にアッ＝ザイン・アル＝マラーギーから聴聞し、それ以前のヒジュラ暦805年には、彼の祖父、アッ＝ザイン・アル＝イラーキー、アル＝ハイサミー、その他からイジャーザ（学術的許可）を与えられた。彼は亡くなった。
  en: Aḥmad b. Aḥmad b. Abī al-Yaman Muḥammad b. Aḥmad b. al-Raḍī Ibrāhīm b. Muḥammad b. Ibrāhīm al-Ṭabarī al-Makkī. His mother was Zaynab, daughter of ʿAbd Allāh b. al-Zayn Aḥmad b. al-Jamāl Muḥammad b. al-Muḥibb al-Ṭabarī. He heard from al-Zayn al-Marāghī in the year 814 H. Before that, in the year 805 H, he was granted ijāza by his grandfather, al-Zayn al-ʿIrāqī, al-Haythamī, and others. He died.
