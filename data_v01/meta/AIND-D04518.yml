translation:
  ja: アブドゥッラー・ブン・ウマル・ブン・アビー・バクル・ブン・アリー・ブン・ムハンマド・ブン・アビー・バクル・ブン・アブドゥッラー・イブン・ウマル・ブン・アブドゥッラフマーン・アン＝ナーシリー・アル＝ヤマーニー。『ナーシリー家の人々』の著者アル＝アフィーフ・ウスマーンの兄弟。幼少期に学問に励み、青年期に巡礼（ハッジ）を行った。その後クルアーン朗誦に専念し、非常に哀愁を帯びた美しい声の持ち主であった。ヒジュラ暦818年に没し、ザビードの父の傍らに埋葬された。
  en: ʿAbd Allāh b. ʿUmar b. Abī Bakr b. ʿAlī b. Muḥammad b. Abī Bakr b. ʿAbd Allāh b. ʿUmar b. ʿAbd al-Raḥmān al-Nāshirī al-Yamānī, brother of al-ʿAfīf ʿUthmān, the author of the work on the Nāshirīs. In his youth he occupied himself with learning and performed the pilgrimage as a young man, then devoted himself to recitation. He had a very plaintive, beautiful voice. He died in the year 818 AH and was buried beside his father at Zabīd.
