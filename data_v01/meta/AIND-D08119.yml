translation:
  ja: ムハンマド・ブン・アリー・ブン・アブドゥッラー、アッ＝シャムス・アル＝ハルフィー（ハーは無点でファトハ、ラーはスクーン、その後にファー）・アル＝マアッリー。806年シャウワール月に没した。アッ＝ザーヒル・バルクークの側近であった。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。他の者は、彼が文字の学（イルム・アル＝ハルフ）に通じ、他の諸学にも良く参与していたと付け加えている。
  en: Muḥammad b. ʿAlī b. ʿAbd Allāh, al-Shams al-Ḥarfī (with fatḥa on the undotted ḥāʾ, sukūn on the rāʾ, then fāʾ) al-Maʿarrī. He died in Shawwāl [80]6 and had been a close associate of al-Ẓāhir Barqūq. Our shaykh mentioned him in his Inbāʾ. Someone else added that he was versed in the science of letters, with a good share in other sciences as well.
