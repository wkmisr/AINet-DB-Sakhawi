translation:
  ja: ムハンマド・ブン・アリー・ブン・アビー・バクル・ブン・アフマド・ブン・アッルーシュ・アッ＝ディマシュキー、アッ＝サーリヒーヤの寄留者、アッ＝ズフリー、織工。770年より前に生まれ、アル＝ムヒッブ・アッ＝サーミトの口から、アブー・ヤアラー（の『ムスナド』）のうちウスマーンのムスナドの一部を聴聞し、（ハディースを）伝えた。アン＝ナジュム・ブン・ファフドが彼から学んだ。840年頃、あるいはそれ以前に没した。
  en: Muḥammad b. ʿAlī b. Abī Bakr b. Aḥmad b. ʿAllūsh al-Dimashqī, resident of al-Ṣāliḥiyya, al-Zuhrī, the weaver. He was born before the year 770, heard from the lips of al-Muḥibb al-Ṣāmit a portion of the Musnad of ʿUthmān from [the Musnad of] Abū Yaʿlā, and transmitted hadith; al-Najm b. Fahd took from him. He died around [the year] forty or before it.
