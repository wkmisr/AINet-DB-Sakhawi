translation:
  ja: ラマダーン・アル＝マンファルーティー、のちにアル＝カーヒリー。アル＝ミフタール（給仕長）。粗野な庶民であった。マンファルート管轄下のバニー・ガーリブ村で生まれた。彼の主人が彼を引き立て、（カアバ神殿の）キスワ（被覆）などの管理に携わるようになった。
  en: Ramaḍān al-Manfalūṭī, later al-Qāhirī, known as al-Mihtār (the steward). He was a rude commoner. He was born in Banī Ghālib, a village in the district of Manfalūṭ. His master promoted him, and he came to oversee the Kiswah (of the Kaaba) and other matters.
