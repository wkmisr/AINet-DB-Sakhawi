translation:
  ja: ムーサー・ブン・イブラーヒーム、アッ＝シャラフ・ブン・アル＝ブルハーン、アッ＝サカーザルーニー、のちアル＝カーヒリー、アル＝バドル・ムハンマドとアブド・アッ＝ラフマーンの父。アッ＝ザイン・アブド・アル＝バースィトのもとで実務（ムバーシャラ）と書記の仕事によって頭角を現し、その諸事すべてを取り仕切る者となった。（8）42年とそれ以後の彼（アブド・アル＝バースィト）の受難の際には、彼とともに多額の財産を没収された。彼は…であった（欠）。…に没した（以下欠）。
  en: Mūsā b. Ibrāhīm, al-Sharaf b. al-Burhān, al-Sakāzarūnī, then al-Qāhirī, father of al-Badr Muḥammad and ʿAbd al-Raḥmān. He was among those who advanced through administration (mubāshara) and secretarial work under al-Zayn ʿAbd al-Bāsiṭ, so that he became the one in charge of all his affairs; he was subjected to confiscation together with him in his ordeal in the year [8]42 and afterwards, for a large sum. He was ... (text lacking). He died ... (text lacking).
