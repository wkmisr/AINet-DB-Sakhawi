translation:
  ja: アブド・アッ＝ラティーフ・アッ＝ルーミー・アル＝イーナーリー・アッ＝タワーシー（宦官）。854年サファル月に100歳ほどで没した。解放主の二人の孫、アミール・アリー・ブン・イーナールの息子たちアフマドとムハンマドが彼を相続した。
  en: ʿAbd al-Laṭīf al-Rūmī al-Īnālī, the eunuch. He died in Ṣafar of the year 854 at about a hundred years of age, and his manumitter's two grandsons, Aḥmad and Muḥammad, the sons of Amīr ʿAlī b. Īnāl, inherited from him.
