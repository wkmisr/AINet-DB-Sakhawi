- text: '「في ابن محمد بن خضر بن أيوب」＝転送見出し。転送先は #AIND-D05429（علي بن محمد بن خضر بن أيوب بن زياد العلاء بن الناصري بن الزين المحلي الحنفي القاهري ويعرف في بلده بابن الجندي نقيب زكريا、生840）。ナサブ・العلاء・المحلي الحنفي・ابن الجندي・نقيب の全てが一致。'
