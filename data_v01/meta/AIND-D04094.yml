translation:
  ja: アブドゥルカーディル・ブン・イブラーヒーム、イブン・アル＝イマームとして知られる。シャーフィイー派の有能な学者の一人で、イブン・アル＝ブルキーニーやその同類に学び、次いでアル＝バーミーに学んで彼に近侍し、さらにアッ＝サアド・ブン・アッ＝ディーリーのもとでハディースを読誦した。有能な人物で、アッ＝サブウ・カーアートに住み、『マカーマート』をそらんじていた。893年ラジャブ月にビーマーリスターン（病院）で没した。
  en: ʿAbd al-Qādir b. Ibrāhīm, known as Ibn al-Imām. One of the accomplished Shāfiʿī scholars; he studied under Ibn al-Bulqīnī and the like, then under al-Bāmī, whom he attended assiduously, and read ḥadīth under al-Saʿd b. al-Dīrī. A learned man, he lived in al-Sabʿ Qāʿāt and could recite the Maqāmāt from memory. He died in the Bīmāristān (hospital) in Rajab 893.
