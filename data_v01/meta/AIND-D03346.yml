translation:
  ja: シーフキー・イマーム・アッディーン。彼はアラビア語学においてきわめて博学であり、アッ＝サイイド・アル＝ジュルジャーニーから（学問を）受け取った人物の一人である。彼からはアブドゥルアウワル・アル＝ムルシディーがマッカで（学問を）受け取り、彼（アル＝ムルシディー）が彼の伝記を執筆した。
  en: Shīfkī Imām al-Dīn. He was deeply learned in Arabic philology, being among those who acquired knowledge from al-Sayyid al-Jurjānī. From him, ʿAbd al-Awwal al-Murshidī acquired knowledge in Mecca, and the latter wrote his biography.
