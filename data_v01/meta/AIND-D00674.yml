translation:
  ja: アフマド・ブン・ハサン・アッ＝シハーブ・アル＝ハナフィー、アル＝マンジャキーヤのシャイフ。881年シャウワール月に亡くなったが、麻痺によって長期間活動を停止した後であった。シャイフ職は、スルターンのイマームの一人であるナーシルッディーン・アル＝アフミーミーに引き継がれた。
  en: Aḥmad b. Ḥasan al-Shihāb al-Ḥanafī, shaykh of al-Manjakīya. He died in Shawwāl 881 AH, after having been incapacitated by paralysis for a period. The shaykhdom was then transferred to Nāṣir al-Dīn al-Akhmīmī, one of the Sultan's imams.
