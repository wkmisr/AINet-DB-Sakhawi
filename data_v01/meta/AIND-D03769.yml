translation:
  ja: アブド・アッ＝ラフマーン・ブン・ムハンマド・ブン・アブド・アル＝マリク・ブン・アッ＝シャイフ・アビー・ムハンマド・アブドゥッラー・ブン・ムハンマド・ブン・ムハンマド、アッ＝ザイン・アブー・アル＝ファラジュ・アル＝クラシー・アル＝バクリー、マルジャーン家出自のマッカの人、マーリキー派。カイロで、アッ＝シャラフ・イブン・アル＝クワイク、アッ＝シャムス・アッ＝シャーミー、アッ＝ザラーティーティー、さらにアッ＝シハーブ・イブン・ザヒーラらから聴聞した。イブン・ファハドが彼に言及し、その死をヒジュラ暦837年シャアバーン月11日マッカでのこととして記録している。アル＝ビカーイーは彼のために（伝記の）空欄を残し、アッ＝ザイン・リドワーンは「学問を受けるに足る者たち」のうちに彼を登載した。
  en: ʿAbd al-Raḥmān b. Muḥammad b. ʿAbd al-Malik b. al-Shaykh Abī Muḥammad ʿAbd Allāh b. Muḥammad b. Muḥammad, al-Zayn Abū al-Faraj al-Qurashī al-Bakrī, of Marjānī origin, al-Makkī al-Mālikī. He heard in Cairo from al-Sharaf b. al-Kuwayk, al-Shams al-Shāmī, and al-Zaratītī, among others such as al-Shihāb b. Ẓahīra. Ibn Fahd mentioned him and dated his death at Mecca to 11 Shaʿbān 837. Al-Biqāʿī left a blank space for him, and al-Zayn Riḍwān entered him among those from whom knowledge is to be taken.
