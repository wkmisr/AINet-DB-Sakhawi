  en: Muḥammad b. Ibrāhīm al-ʿAjamī. Al-Muḥibb b. Abī al-Saʿādāt b. Ẓuhayra presented al-Nawawī’s Forty [Ḥadīths] to him from memory, and he granted him an ijāza in the year [8]39.
