    ja: '「عرض عليه المحب بن أبي السعادات بن ظهيرة أربعي النووي」＝المحب が本項主に暗誦を提示した（本項主が試問者＝active）。المحب＝#AIND-D01525「523 أحمد بن محمد بن محمد بن محمد بن حسين بن علي بن أحمد بن عطية بن ظهيرة المحب أبو الطيب بن الجلال أبي السعادات … ولد في صفر سنة خمس وعشرين وثمانمائة بمكة」、その本文「وعرض في سنة تسع وثلاثين فما بعدها على التقي المقريزي … ومحمد بن إبراهيم العجمي … وأجازوه إلا الثاني والثالث」が本項主を名指しする（ラカブ・父クンヤ・家名・書名・年で閉合。ブリーフの ★候補どおり）。相手側は عرض の年を「839年とそれ以後」と記す。初版は passive #NEEDID・subtype student（旧規約）、原文にない field الحديث、event の @when にヒジュラ年「0839」。'
