    ja: 'Pattern A。「أرخهم」の複数形「هم」（3人以上）は、情報源を記さない直前の連続項＝#AIND-D10119（ناصر بن يشبك、897没、没地の記載なし）・#AIND-D10120（ناصر النوبي، 849 مكة 没）と本項（842 مكة 没）を指すと読んだ（その前の #AIND-D10118 は「ذكره الفاسي」で区切られる）。最も遅い没年 897（＞885）で振り分けて العز بن فهد＝#AIND-D03985（規則60(a)・43）。ただし D10119 が含まれるかは確実でなく、含まれなければ本項と D10120 は没年 ≤871 で #AIND-D09211 cert low になる＝cert medium（event 側、規則43・58）。ISSUES §D164-1。初版の統制外 subtype「historian」relation（#AIND-D09211）を event に変換。【集約 2026-11-10】範囲を D10119〜D10121 の3項で確定し、cert medium を外した（規則43: 没年＞885→#AIND-D03985 は cert なし。オーケストレーター決定13）。根拠: サハーウィーは2人なら双数「أرخهما」を使う（D06453 の「أرخهم」は「ذكره الفاسي」で区切られた3項）。ابن فهد はマッカ外の死も「أرخهم」で記録する（#AIND-D07606「مات وإبناه في الطاعون بالقاهرة … أرخهم ابن فهد」、#AIND-D07375「مات في اسكندرية … أرخهم ابن فهد」）。直前の #AIND-D10118 は「ذكره الفاسي」で区切られる。'
