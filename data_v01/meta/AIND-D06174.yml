translation:
  ja: ファラジュ、アッ＝ザイン・アル＝ハラビー。諸々の勤めを転々とした末に、アッ＝ザーヒル・バルクークが彼を王領と宝物庫のアスターダール（ustādār al-amlāk wa-l-dhakhīra）に任じ、次いで（8）01年ジュマーダー・アル＝ウーラー月にクトゥルーブガー・アル＝ハリーリーの後任としてアレクサンドリア代官職に転任させた。彼は（8）03年ラビーウ・アル＝アウワル月末に同地で没するまでその職にあり、後任にはラアス・ナウバのアルスターイが就いた。アル＝マクリーズィーが彼の没年を記している。
  en: Faraj, al-Zayn al-Ḥalabī. He moved from one service to another until al-Ẓāhir Barqūq appointed him ustādār of the royal estates and the treasury (ustādār al-amlāk wa-l-dhakhīra), then transferred him to the governorship (niyāba) of Alexandria in Jumādā al-Ūlā of the year [8]01, after Quṭlūbughā al-Khalīlī. He remained there until he died in that city at the end of Rabīʿ al-Awwal of the year [8]03, and Arisṭāy, the raʾs nawba, was installed after him. Al-Maqrīzī recorded his death date.
