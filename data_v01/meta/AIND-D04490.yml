translation:
  ja: アブドゥッラー・ブン・アブドゥルマリク・ブン・イブラーヒーム、アル＝ジャマール、アッ＝ダミーリー、のちにアル＝カーヒリー、アル＝マーリキー、公正証書作成人（アッ＝シュルーティー）。我らがシャイフ（イブン・ハジャル）からアッ＝ラーイーらとともに幾つかのものを聴聞し、歴史家イブン・ファハドの申請により、ヒジュラ暦836年ラジャブ月19日付で多数の人々が彼にイジャーザを与えた。彼はサーリヒーヤ学院の公証人の一人で、さらにはその古参の書記官の一人となったが、精確ではなかった。
  en: ʿAbd Allāh b. ʿAbd al-Malik b. Ibrāhīm al-Jamāl al-Damīrī, then al-Qāhirī, al-Mālikī, the notary (al-Shurūṭī). He heard several things from our shaykh (Ibn Ḥajar) together with al-Rāʿī and others, and a multitude granted him an ijāza at the request of the historian Ibn Fahd, dated the 19th of Rajab 836. He was one of the notary-witnesses of the Ṣāliḥiyya and indeed became one of its senior clerks (muwaqqiʿ), though he was not meticulous.
