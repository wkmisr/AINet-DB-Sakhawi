translation:
  ja: アブドゥルカーディル・ブン・アブドゥルラヒーム・ブン・アフマド・ブン・アン＝ナースィリー・ムハンマド・ブン・ムハンマド・ブン・ウトマーン・アッ＝ザイン・ブン・アン＝ナジュミー・ブン・アル＝バーリズィー。ムハンマドとユースフの兄弟、またファーティマの同母兄弟（彼ら二人の母はトルコ人女性で、父方の異母兄弟）である。カイロで私（サハーウィー）からハディースを聴聞した。またクルアーン、『アル＝ウムダ』、『アル＝ミンハージ』、およびアラビア語文法の『アルフィーヤ』を暗記し、学者たち（ジャマーア）に提示した。少しの間勉学に勤しみ、アッ＝タキー・ブン・カーディー・アジュルーンのもとで『アッ＝タクスィーム』の講義を聴講した。身を慎むことはなかった（行儀が良くなかった）。
  en: Abd al-Qadir ibn Abd al-Rahim ibn Ahmad ibn al-Nasiri Muhammad ibn Muhammad ibn Uthman al-Zayn ibn al-Najmi ibn al-Barizi. He was the brother of Muhammad and Yusuf, and the full brother of Fatima; their mother was a Turkish woman, and they were half-brothers from his father's side. He is among those who heard Hadith from me (al-Sakhawi) in Cairo. He memorized the Qur'an, al-Umda, al-Minhaj, and Alfiyyat al-Nahw, presented them to a group of scholars, studied a little, and attended the classes of al-Taqsim under al-Taqi ibn Qadi Ajlun. He did not maintain a self-controlled lifestyle.
