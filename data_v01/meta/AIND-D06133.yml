translation:
  ja: ファーリス・ブン・マイラブ・ブン・アリー・ブン・ムバーラク・ブン・ルマイサ・ブン・アビー・ヌマイイ、アッ＝シャリーフ・アル＝ハサニー。母はシャリーフ・アナーン・ブン・ムガーミス・ブン・ルマイサの娘ファーティマ。876年ラジャブ月にメッカ郊外で没し、運ばれてメッカに埋葬された。母の死は818年のことで、それは父が彼女と離別し、シャリーフ・ハサン・ブン・アジュラーンが彼女を娶ってアリーをもうけた後のことであった。イブン・ファハドが彼に言及している。
  en: Fāris b. Maylab b. ʿAlī b. Mubārak b. Rumaytha b. Abī Numayy, al-Sharīf al-Ḥasanī. His mother was Fāṭima, daughter of al-Sharīf ʿAnān b. Mughāmis b. Rumaytha. He died in Rajab of the year 876 outside Mecca and was carried there and buried. His mother's death was in the year 818, after his father had separated from her and al-Sharīf Ḥasan b. ʿAjlān had married her and had by her ʿAlī. Ibn Fahd mentioned him.
