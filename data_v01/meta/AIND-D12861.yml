translation:
  ja: アーミナ、またの名をマッキーヤ。イーサー・ブン・ムハンマド・アッ＝シャーミー・アル＝マッキーの娘で、「イブナ・アル＝クースィー」（クースィーの娘）の名で知られる。（8）63年シャアバーン月にマッカで没した。イブン・ファハドがその没年を記している。
  en: Āmina, also called Makkiyya, daughter of ʿĪsā b. Muḥammad al-Shāmī al-Makkī, known as Ibnat al-Qūṣī. She died in Shaʿbān of the year [8]63 in Mecca. Ibn Fahd recorded her death.
