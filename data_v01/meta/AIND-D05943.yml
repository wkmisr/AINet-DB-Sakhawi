notes:
- text: '転送見出し（原文末尾「يأتي فيمن لم يسم جده」による）。転送先は #AIND-D06001（عمر بن محمد المرشدي المكي المقرئ والد أبي حامد محمد الآتي … مات في ليلة الخميس سادس عشر ذي القعدة سنة اثنتين وستين … أرخه ابن فهد وسمى جده أبا بكر بن علي بن يوسف）。相手側が祖父名を「أبا بكر بن علي بن يوسف」と明記し本項の見出しナサブと一致＝確実。兄 #AIND-D03359（صالح بن محمد بن أبي بكر بن علي بن يوسف المرشدي المكي أخو عمر الآتي）も同一人物を指す。同バッチの #AIND-D05942（عمر بن محمد أبي بكر بن علي بن يوسف الأنصاري الذروي … ابن الجمال المصري、823年没）はナサブの名が同形だが別家（الأنصاري الذروي）の別人であり、本項の転送先ではない。'
