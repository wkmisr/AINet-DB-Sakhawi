translation:
  ja: アブドゥルラフマーン・ブン・アン＝ヌール・ムハンマド・ブン・アビー・アブドゥッラー・ムハンマド・ブン・ムハンマド・ブン・アビル・カースィム・ワジーフ・アッ＝ディーン・アル＝ミズジャーディー・アッ＝ザビーディー・アル＝ヤマーニー。その父の伝記は後述される。彼らの祖先はアル＝アシャーイル（アシュアル族）の出身で、その祖父がザビード渓谷の下流にあるミズジャーガという村に移住した。被伝者はザビードに定住し、法学、文学、スーフィズムにおいて熟達するまで学問に励んだ。その実力を認めた祖父によってシャイフ職に任命され、優れた品行を保った。ハジュラ暦847年に没した。
  en: ʿAbd al-Raḥmān b. al-Nūr Muḥammad b. Abī ʿAbd Allāh Muḥammad b. Muḥammad b. Abī al-Qāsim Wajīh al-Dīn al-Mizjājī al-Zabīdī al-Yamānī, whose father is mentioned below. Their origin is from the Ashʿarites; their grandfather moved to al-Mizjāja, which is a village at the lower part of Wādī Zabīd. He settled in Zabīd and engaged in studies until he mastered jurisprudence (fiqh), literature (adab), and Sufism (taṣawwuf). His grandfather appointed him to the mashyakhat after verifying his competence, and he maintained an excellent conduct. He died in the year 847 AH.
