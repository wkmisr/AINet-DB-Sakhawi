notes:
- text: '転送見出し（「هو ابن عبد العزيز بن عبد الواحد . مضى」＝父名を訂正して前出の項へ送る）。転送先は #AIND-D05871（B105）「عمر بن الزين عبد العزيز بن عبد الواحد بن عمر بن عياذ بتحتانية ومعجمة الأنصاري المغربي الأصل المدني المالكي والد حسن الماضي ويعرف بابن زين الدين」（858年またはその前年没）。本見出しの「عياد」は転送先の「عياذ」（原文に綴り注記あり）の刊本上の揺れ。初版は転送指示を father relation（#NEEDID）にしていたため除去。'
