translation:
  ja: アフマド・ブン・アル＝ワラウィー・ムハンマド・ブン・アフマド・ブン・ユースフ・ブン・ハッジャージュ・アッ＝サフティー（旧名）、アッ＝カーヒリー 父は彼が幼い頃に亡くなり、彼は特に叔父のアブド・アル＝バッル・ブン・アッ＝シャフナやその親族から指導を受けたが、礼儀をわきまえない人間として育ち、妹などと争った。 亡くなった。
  en: Aḥmad b. al-Walawī Muḥammad b. Aḥmad b. Yūsuf b. Ḥajjāj al-Safaṭī (originally), al-Qāhirī. His father died when he was young, and he grew up undisciplined, especially having been trained by his maternal uncle ʿAbd al-Barr b. al-Shaḥna and his relatives, but he quarrelled with his sister and others. He died.
