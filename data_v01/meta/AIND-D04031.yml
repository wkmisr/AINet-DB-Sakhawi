translation:
  ja: アブドゥルアズィーム・ブン・アフマド・アル＝ブルキーニー。父は説教師（ハティーブ）。彼は同地で私（サハーウィー）から聴聞した者の一人で、カイロで絹（の商い）で生計を立て、無償奉仕としてガムリー・モスクでムアッズィンを務め、ときに金曜日には『洞窟章』を朗誦した。
  en: ʿAbd al-ʿAẓīm b. Aḥmad al-Bulqīnī, whose father was the preacher (khaṭīb). He was there among those who heard from me; he earned his living in Cairo in the silk trade, gave the call to prayer at the Ghamrī Mosque voluntarily, and would sometimes recite Sūrat al-Kahf on Fridays.
