translation:
  ja: ムハンマド・ブン・スライマーン・ブン・ダーウード、アッ＝ターイフィー、アル＝ガムリー、のちにアル＝カーヒリー。カイロのガムリー・モスクの寄寓者。アブー・アル＝アッバースに仕え、彼によって知られ、彼とともにハッジを行った者の一人で、私（サハーウィー）から諸々を聴聞した。悪くない人物である。
  en: Muḥammad b. Sulaymān b. Dāwūd al-Ṭāʾifī al-Ghamrī, then al-Qāhirī, a resident of the Ghamrī Mosque there. He was among those who served Abū al-ʿAbbās and became known through him; he performed the pilgrimage with him, and he heard various things from me (al-Sakhāwī). There is nothing wrong with him.
