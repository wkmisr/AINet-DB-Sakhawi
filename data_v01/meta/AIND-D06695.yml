notes:
- text: '転送見出し（原文末尾「وهو بكنيته أشهر يأتي هناك」による）。転送先はクンヤ部の #AIND-D10975「أبو السعادات جلال الدين بن الشهاب أحمد بن المحيوي عبد القادر ابن أبي القسم بن أبي العباس بن عبد المعطي الأنصاري المكي المالكي الماضي أبوه وجده … ويسمى محمدا ولد … سنة سبع وستين وثمانمائة بمكة … وقرأ علي في سنة خمس وثمانين القول البديع من نسخة حصلها ولازمني في غير ذلك」（クンヤ・ラカブ・父祖・ニスバ・学派が一致、「ويسمى محمدا」。未受領。ブリーフの番号を本文で確認）。本項の「ممن قرأ علي بمكة」は相手側にも「قرأ علي」とあり、相手にない内容ではない＝規則66 (k) の例外に当たらず REF。相手側は祖父を「عبد القادر ابن أبي القسم بن أبي العباس」とし、本項（「عبد القادر بن أبي العباس」）より1段多い。'
