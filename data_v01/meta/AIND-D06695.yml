translation:
  ja: ムハンマド・ブン・アフマド・ブン・アブド・アル＝カーディル・ブン・アビー・アル＝アッバース・ブン・アブド・アル＝ムウティー、アル＝ジャラール・アブー・アッ＝サアーダート、アッ＝シハーブの子、アル＝ムフヤウィー・アル＝アンサーリー、マーリク派。マッカで私（サハーウィー）に読んだ者の一人。彼はクンヤのほうでよく知られており、そちらで後述する。
  en: Muḥammad b. Aḥmad b. ʿAbd al-Qādir b. Abī al-ʿAbbās b. ʿAbd al-Muʿṭī, al-Jalāl Abū al-Saʿādāt b. al-Shihāb, al-Muḥyawī al-Anṣārī, the Mālikī. One of those who read to me in Mecca. He is better known by his kunya, and will come there.
