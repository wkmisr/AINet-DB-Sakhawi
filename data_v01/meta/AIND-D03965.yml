translation:
  ja: アブドゥルアズィーズ・ブン・ダーニヤール・ブン・アブドゥルアズィーズ・ブン・アリー・ブン・ウthマーン・アル＝アスバハーニー・アル＝マッキー。アジャミー（ペルシア人）として知られる。善良な若者であり、ワディ・アル＝ハッダ等に財産を有していたが、その大部分は親族からの相続であった。ヒジュラ暦811年ズル・カアダ月にマッカで没した。アル＝ファースィーが彼について言及している。
  en: ʿAbd al-ʿAzīz b. Dāniyāl b. ʿAbd al-ʿAzīz b. ʿAlī b. ʿUthmān al-Aṣbahānī, of Meccan residence, known as al-ʿAjamī. He was a good young man who owned properties in Wādī al-Hadda and elsewhere, most of which were inherited from his relatives. He died in Mecca in Dhu al-Qaʿda, the year 811 AH. He was mentioned by al-Fāsī.
