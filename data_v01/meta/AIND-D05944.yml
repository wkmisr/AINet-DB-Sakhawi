translation:
  ja: ウマル・ブン・ムハンマド——（この父ムハンマドは）ムザッファルと呼ばれる——ブン・アビー・バクル、トルクメン出自、アル＝カーヒリー、ハンバリー派、クルアーン読誦家。先述のアフマドの兄弟で、二人の父は後述する。イブン・アル＝ムザッファルとして知られる。父やほかの者のもとで諸伝承（読誦法）の大半を読誦した。彼はいくつかの職位を手にしており、設立者（ワーキフ）自身によってアル＝アシュラフィーヤのハンバリー派スーフィー（定員）に、またヤシュバクのハーンカーなどにも就いた。アッ＝タージュ・アブドゥルワッハーブ・ブン・シャラフが彼から学び、彼の後にアル＝アシュラフィーヤ（の職）を得ようと望んだが、シャーフィイー派であったためにできなかった。（8）60年近くに没した。その前か後かである。
  en: 'ʿUmar b. Muḥammad — (the father) called Muẓaffar — b. Abī Bakr, of Turkmen origin, al-Qāhirī, the Ḥanbalī, the Qurʾān reciter, brother of the aforementioned Aḥmad; their father is mentioned below. He is known as Ibn al-Muẓaffar. He read most of the transmissions (of the readings) with his father and others. He held several posts: he was appointed by the founder himself among the Ḥanbalī Sufis of al-Ashrafiyya, and (also held posts) in the Khānqāh of Yashbak and elsewhere. Al-Tāj ʿAbd al-Wahhāb b. Sharaf studied under him and wished to obtain the Ashrafiyya (post) after him, but could not, since he was a Shāfiʿī. He died around (8)60, either shortly before or after it.'
