translation:
  ja: タグリー・ビルミシュ。シャイフ［・アル＝マフムーディー］のウスターダール（家政長官）であったが、彼に反旗を翻して［スルタン・］アン＝ナースィル［・ファラジュ］に寝返った。アン＝ナースィルは彼をシャーム（シリア）のウスターダールに任命したが、彼は極めて過酷な圧政を行った。そのため、神はシャイフに彼に対する権力を与え、シャイフは彼を糾問して財産を没収し、処罰し続けた結果、彼は［ヒジュラ暦］813年に没した。我らがシャイフ（イブン・ハジャル）がその著作『インバー・アル＝ゴムル』において彼について言及している。
  en: Taghrī Birmish. He was the ustādār (majordomo) of Shaykh [al-Maḥmūdī], but rebelled against him and joined al-Nāṣir [Faraj], who appointed him to the ustādāriyya (office of majordomo) in Syria. He was excessively oppressive in his rule, so God empowered Shaykh over him, who confiscated his wealth and punished him until he died in the year 813 AH. Our shaykh (Ibn Ḥajar) mentioned him in his work Inbāʾ [al-Ghumr].
