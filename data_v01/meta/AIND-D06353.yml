translation:
  ja: クトルバーイ・アル＝マフムーディー・アル＝アズィーズィー・アル＝アシュラフィー・バルスバーイ。彼（バルスバーイ）が購入し、その子（アル＝アズィーズ・ユースフ）が解放したマムルークの一人。ハースィキーとなり、次いでイーナール時代にサーキー（酌人）、次いでフシュカダム時代に舅アッ＝ザーヒル・ヤルバーイ（原文の綴りはビルバーイ）の口添えによって十人長（アミール・アシャラ）およびラアス・ナウバの一人となり、872年のスワール戦（アル＝ワクア・アッ＝スワーリーヤ）で戦死するまで（その地位にあった）。70歳には達していなかった。
  en: Quṭlubāy al-Maḥmūdī al-ʿAzīzī al-Ashrafī Barsbāy. He was one of those he (Barsbāy) had purchased and whom his son (al-ʿAzīz Yūsuf) manumitted. He became a khāṣṣakī, then a cupbearer (sāqī) in the days of Īnāl, then an amir of ten and one of the ruʾūs al-nuwab in the days of Khushqadam through the intercession of his father-in-law al-Ẓāhir Yalbāy (spelled Bilbāy in the text), until he was killed in the battle against Suwār (al-waqʿa al-Suwāriyya) in the year 872, not having completed seventy years.
