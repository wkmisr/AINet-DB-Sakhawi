translation:
  ja: アリー・ブン・スライマーン・アッ＝タイイビー。アル＝ワリー・アル＝イラーキーから学んだ者の一人。アル＝ミフマンダーリーヤ学院で教授し、アル＝バヤーティラ区に住んでいた。彼のもとで、アッ＝シャムス・アル＝ファーリスクーリー・アッ＝ザリーフが845年に読誦学習を行った。
  en: ʿAlī b. Sulaymān al-Ṭībī. He was among those who studied under al-Walī al-ʿIrāqī; he used to teach at al-Mihmandāriyya and lived in al-Bayāṭira. Al-Shams al-Fāriskūrī al-Ẓarīf read under him in the year 845 AH.
