translation:
  ja: ザイガム・ブン・ハシュラム・ブン・ナジャード・アル＝フサイニー、マディーナのアミール。私（サハーウィー）は、彼が少し前に言及されたドガイムの兄弟ではないかと思う。従兄弟のマーニウの後にマディーナのアミールに就任し、しばらくの間そこに留まった。その後、ハジュラ暦850年に、前述のマーニウの息子ウムヤーンによって免職された。彼は、後任者が支払ったディルハムを受け取るまでは免職に従わなかったが、それを受け取るとマディーナを出発し、間もなくして殺害された。
  en: Ḍaygham b. Khashram b. Najād al-Ḥusaynī, Amir of Medina. I believe he is the brother of Ḍughaym, who was mentioned recently above. He was appointed to the emirate of Medina after his cousin Māniʿ and remained in office for a period of time. He was then dismissed in the year 850 AH by Umyān b. Māniʿ, the son of the aforementioned cousin. He did not yield to his dismissal until he was paid a sum of dirhams by the newly appointed ruler; he accepted the money and departed, only to be killed shortly thereafter.
