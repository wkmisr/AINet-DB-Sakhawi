translation:
  ja: ムハンマド・ブン・アル＝アシュラフ・イーナール・アル＝アラーイー、ナースィル・アッ＝ディーン、前述のアル＝ムアイヤド・アフマドの同父母弟。866年ズー・アル＝ヒッジャ月の初日にアレクサンドリアで、およそ17歳で没した。その遺骸はカイロへ運ばれ、父の墓廟の、父が埋葬されている水盤（ファスキーヤ）に埋葬された。
  en: Muḥammad b. al-Ashraf Īnāl al-ʿAlāʾī, Nāṣir al-Dīn, full brother of the aforementioned al-Muʾayyad Aḥmad. He died in Alexandria on the first of Dhū al-Ḥijja 866, aged about seventeen. His remains were carried to Cairo and he was buried in his father's turba, in the basin (fasqiyya) in which he (the father) is buried.
