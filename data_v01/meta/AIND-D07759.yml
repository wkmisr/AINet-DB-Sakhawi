translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ズハイラ・ブン・アフマド・ブン・アティーヤ・ブン・ズハイラ・アル＝クラシー・アル＝マッキー。母はザビードの女性で、ナフィーサ・ビント・イブラーヒーム・ブン・アビー・バクル・ブン・アブド・アル＝ムウティー・アル＝イサーミーである。836年以降、先述のアブー・アル＝ファドル・ムハンマド・ブン・アフマド・ブン・アビー・アル＝ファドル・ブン・アフマド・ブン・ズハイラにイジャーザを与えた人々（の一団）が彼にもイジャーザを与えた。（8）66年シャウワール月にジッダで没し、（遺体は）運ばれてアル＝マアラーに埋葬された。
  en: Muḥammad b. ʿAbd Allāh b. Abī Bakr b. ʿAbd Allāh b. Ẓuhayra b. Aḥmad b. ʿAṭiyya b. Ẓuhayra al-Qurashī al-Makkī. His mother was a woman of Zabīd, Nafīsa bt. Ibrāhīm b. Abī Bakr b. ʿAbd al-Muʿṭī al-ʿIṣāmī. In 836 and thereafter he was granted ijāza by a group who had granted ijāza to the aforementioned Abū al-Faḍl Muḥammad b. Aḥmad b. Abī al-Faḍl b. Aḥmad b. Ẓuhayra. He died in Shawwāl (8)66 in Jidda and was carried and buried at al-Muʿallā.
