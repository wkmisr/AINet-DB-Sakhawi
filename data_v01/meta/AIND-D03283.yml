translation:
  ja: シャーヒーン・アッ＝ザルダカーシュ。カイロの千人長（ムカッダム）の一人であった。その後ダマスカスの侍従長（ハージブ・アル＝フッジャーブ）となり、次いでハマー、次いでトリポリの副王（ナーイブ）となったが、タタルが彼を解任した。以後無官のままトリポリに留まり、840年頃に没した。アッ＝シハーブ・アフマド・ブン・アリー・ブン・イーナールが、彼がその父または祖父の解放奴隷であったことを理由に遺産を相続した。
  en: Shāhīn al-Zardakāsh. He was one of the commanders (muqaddams) in Cairo, then became grand chamberlain (ḥājib al-ḥujjāb) of Damascus, then governor (nāʾib) of Ḥamāh, then of Tripoli, until Ṭaṭar dismissed him from it. He remained in Tripoli without office until he died around 840 AH. Al-Shihāb Aḥmad b. ʿAlī b. Īnāl inherited from him, since he had been a client (mawlā) of Aḥmad's father or grandfather.
