translation:
  ja: ウスマーン・ブン・ムハンマド・ブン・イスハーク・ブン・イブラーヒーム、アル＝ファフル・ブン・カーディー・ル＝クダート・アッ＝タージュ・アル＝ムナーウィー。前出のアル＝バハー・アフマドの父。766年に生まれ、教授（タドリース）し、補講（イアーダ）を務め、カイロとミスルおよびその管区の一部でカーディー代理を務めた。（8）07年ラジャブ月に没した。
  en: ʿUthmān b. Muḥammad b. Isḥāq b. Ibrāhīm, al-Fakhr b. the chief judge al-Tāj al-Munāwī, the father of al-Bahāʾ Aḥmad, mentioned above. He was born in 766; he taught, served as repetitor (muʿīd) and acted as deputy judge in Cairo and Miṣr (Fusṭāṭ) and in some of their districts. He died in Rajab of the year [8]07.
