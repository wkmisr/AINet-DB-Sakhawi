translation:
  ja: マンカリー・ブガー・カラージャー、アッ＝ザーヒリー（アッ＝ザーヒル・バルクークのマムルーク）、エジプトにおけるタブルハーナ級アミールの一人。（8）01年ラジャブ月に30歳余で没し、サフラー（カイロ郊外の砂漠墓地）の自身の墓廟に葬られた。娘一人のほかには（子を）残さなかった。アル＝アイニーが彼に言及している。
  en: Mankalī Bughā Qarājā al-Ẓāhirī (mamlūk of al-Ẓāhir Barqūq), one of the amirs of ṭablkhānāh in the Egyptian lands. He died in Rajab of the year [8]01, aged a little over thirty, and was buried in his tomb (turba) in al-Ṣaḥrāʾ (the desert cemetery outside Cairo). He left no one but a daughter. Al-ʿAynī mentioned him.
