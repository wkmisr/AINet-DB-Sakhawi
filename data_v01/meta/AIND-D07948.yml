translation:
  ja: ムハンマド・ブン・ウスマーン・ブン・アリー、アッ＝シャムス、アッ＝ディマシュキー、アッ＝シャーフィイー。イブン・アル＝ハリーリーとして知られる。イブン・アン＝ナッジャールとアル＝カバーキビーらから読誦学（キラーアート）を学び、アル＝アラー・アル＝ブハーリー、我らがシャイフ（イブン・ハジャル）、イブン・アル＝ムハンマラ、イブン・ナースィル・アッ＝ディーン、アッ＝シャムス・アッ＝サファディー・アル＝ハナフィー、アブー・アル＝アッバース・アル＝クドゥスィーから学んだと自ら言った。（8）66年にアン＝ヌービーがダマスクスで彼に会い、彼に（テクストを）読んだ。同じくイブン・アル＝カサビーもマディーナで少しを彼に読んだ。
  en: Muḥammad b. ʿUthmān b. ʿAlī, al-Shams, al-Dimashqī, al-Shāfiʿī, known as Ibn al-Ḥarīrī. He took the Qurʾānic readings from Ibn al-Najjār, al-Qabāqibī and others, and he said that he had studied under al-ʿAlāʾ al-Bukhārī, our shaykh (Ibn Ḥajar), Ibn al-Muḥammara, Ibn Nāṣir al-Dīn, al-Shams al-Ṣafadī al-Ḥanafī and Abū al-ʿAbbās al-Qudsī. Al-Nūbī met him in Damascus in the year [8]66 and read to him, as did Ibn al-Qaṣabī, a little, in Medina.
