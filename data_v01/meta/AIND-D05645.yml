translation:
  ja: アリー・ブン・マフムード・アッ＝ディヤースト・アッ＝キルマーニー・アッ＝シャーフィイー。アブー・アル＝フトゥーフ・アッ＝ターウースィー、アル＝ムイン・ナスル・アッラー・ブン・アッ＝ザヒール・アブー・アン＝ナジャーシー・アブド・アッ＝ラフマーン、アル＝マジュド・アル＝ルガウィーおよびその他の人々から学問を修めた。彼は『アル＝ムシャーリク（マシャーリク・アル＝アンワール）』の4巻にわたる注釈書を著し、それを『ダウ・アル＝ムシャーリク』と名付けた。また、キルマーンのシャーフィイー派判事（カーディー）を務めた。830年にはアッ＝ターウースィーが彼に面会し、彼から知識を得て、イジャーザ、さらにはファトワー授与（イフター）の許可を与えられた。その時、彼は90歳を超えており、アッ＝ターウースィーから「最も偉大で最も博学なハディースの主、高潔なるムフティー、著作の著者」と称賛された。
  en: ʿAlī b. Maḥmūd al-Ḍiyāʾ al-Kirmānī al-Shāfiʿī. He studied under Abū al-Futūḥ al-Ṭāwūsī, al-Muʿīn Naṣr Allāh b. al-Ẓahīr Abī al-Najāshī ʿAbd al-Raḥmān, al-Majd al-Lughawī, and others. He wrote a four-volume commentary on 『al-Mashāriq』 (Mashāriq al-Anwār), which he titled 『Ḍawʾ al-Mashāriq』. He held the office of Shafi'i judge (qāḍī) in Kirmān. In the year 830 AH, al-Ṭāwūsī met him and benefited from his knowledge, and Ali granted him an ijāza and even permitted him to issue fatwas. At that time, Ali was over ninety years old, and al-Ṭāwūsī described him as 'the greatest and most knowledgeable master, the godly mufti, and author'.
