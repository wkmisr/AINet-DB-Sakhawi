translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アブド・アル＝カーフィー・ブン・アリー・ブン・アブド・アル＝ワーヒド・ブン・ムハンマド・ブン・サギール、カマール〔・ッディーン〕・イブン・アッ＝シャムス・イブン・アル＝アラー、カイロの人、ハンバル派、医師、医師頭の孫で、先祖同様「イブン・サギール」（「カビール」に倣った形）として知られる。クルアーン、『ウムダ』、『ヒラキー』、『文法のアルフィーヤ』、『医学のムージャズ』、医学の病因と徴候に関する『ルムハ・アフィーフィーヤ』、『ヒポクラテスのフスール』と彼の『マカッディマ・アル＝マアリファ』、『諸器官の解剖』、『医学のズバド』を暗記し、816年にイッズ・イブン・ジャマーアらに提示してイジャーザを得た。それ以前の811年にも提示している。先祖同様に医学に従事し、それを父とイッズ・イブン・ジャマーアから学んで秀で、一団が彼のもとで修練した。いくつかの学芸にも通じ、長年患者を治療し、病院とバルクーク廟の当番医となり、スルタンの行軍に他の医師たちとともに医師頭に随行してアーミドまで赴いた。幾度も巡礼しマッカに滞在した。召使の少年が彼を襲って妻を殺し家財の一部を盗み、それが衰えの始まりとなって失明したが、症状が重くなって寝たきりになるまで当番などの職務を絶やさなかった。それでも忍耐強く神に報いを求め、クルアーンの誦読を非常に多くした。891年サファル月に96歳で没した——弟のアラー〔・ッディーン〕・アリーが私に語ったところによる。彼が妻とともに相続した。811年の提示は800年以前の生まれであることの傍証となる。私は父と同様、その熟練、沈着、温和、話しぶりの良さ、威厳、軽やかな足取りと学識ゆえに、その治療を信頼する者の一人であった。彼は我らの師〔イブン・ハジャル〕をその死の病でわずかに治療したが、その知見を惜しむ人だったと言われる。彼の後任はシャムス・アッ＝タファフニーであった。
  en: Muḥammad b. Muḥammad b. ʿAlī b. ʿAbd al-Kāfī b. ʿAlī b. ʿAbd al-Wāḥid b. Muḥammad b. Ṣaghīr, al-Kamāl b. al-Shams b. al-ʿAlāʾ, Cairene, Ḥanbalī, physician, grandson of the chief of physicians, known like his forebears as Ibn Ṣaghīr. He memorised the Qurʾān, the ʿUmda, al-Khiraqī, the Alfiyya, al-Mūjaz fī al-ṭibb, al-Lamḥa al-ʿAfīfiyya on causes and symptoms, the Aphorisms of Hippocrates and his Prognostics, the Anatomy of the Organs and al-Zubad fī al-ṭibb, presenting them in 816 to al-ʿIzz Ibn Jamāʿa and others, who gave him ijāza (he had presented earlier in 811). He practised medicine like his forebears, taking it from his father and al-ʿIzz Ibn Jamāʿa, excelled and trained a group, treated the sick for a long time, held a shift at the hospital and at Barqūq's mausoleum, and travelled with the sultan's expedition to Āmid with other physicians under their chief. He performed the pilgrimage several times and resided in Mecca. A servant boy attacked him, killed his wife and stole some
    of his goods — the beginning of his decline; he went blind but did not cease his duties until bedridden, patient and much given to Qurʾān recitation, until he died in Ṣafar 891 aged ninety-six, as his brother al-ʿAlāʾ ʿAlī, who inherited from him with his wife, told me. Like my father I trusted his treatment for his skill, calm, gentleness, fine address and dignity; he treated our shaykh briefly in his final illness, but was said to be sparing with his knowledge. Al-Shams al-Tafahnī succeeded him.
