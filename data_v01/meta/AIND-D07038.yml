translation:
  ja: ムハンマド・ブン・アフマド・アル＝ジャマール・アル＝キーラーニー・アル＝マッキー・アル＝ハンバリー、ハンバリー派のマカームにおけるイマーム代理で、前述のアブド・アッ＝ラフマーンの父。善良で物静かな人物。カイロに来訪し、886年にマッカで私から少しばかり聴聞し、894年の途中に生計を求めてインドへ旅立った。私は彼が役立てることを願うものを書いて持たせた。彼は〔損失を〕埋め合わせて帰還したが、それ以前にも一度そこへ旅していた。その後さらにカイロとダマスクスにも入った。
  en: Muḥammad b. Aḥmad al-Jamāl al-Kīlānī al-Makkī al-Ḥanbalī, deputy of the imam at the Ḥanbalī station (al-Maqām al-Ḥanbalī) and the father of ʿAbd al-Raḥmān, mentioned above. A good, quiet man. He came to Cairo, and heard a little from me in Mecca in the year 886. In the course of the year 894 he travelled to India in search of a livelihood, and I wrote for him to take along something I hoped would be of use to him. He returned with his losses made good, having travelled there once before that; then he also entered Cairo and Damascus.
