translation:
  ja: バラカート・ブン・アッ＝タキー・アブドゥッラフマーン・ブン・ヤフヤー・アル＝アサースィー・アッ＝サマッヌーディー。後述する優秀な兄、アッ＝シャムス・ムハンマドの弟である。彼は兄よりも年下であり、品行方正や善徳からはかけ離れていたため、かつて彼の父と兄は彼に手を焼いていた。彼はカイロで私（サハーウィー）から（ハディースを）聴聞した者の一人である。
  en: Barakāt b. al-Taqī ʿAbd al-Raḥmān b. Yaḥyā al-ʿAsāsī al-Samannūdī. The brother of the virtuous al-Shams Muḥammad, who is mentioned below. He was younger and further from righteousness and goodness, to the point that his father and brother had been weary of him before. He was among those who heard from me (al-Sakhāwī) in Cairo.
