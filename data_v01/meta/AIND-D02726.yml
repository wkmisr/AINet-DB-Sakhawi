  ja: フサイン・ブン・アリー・ブン・ムハンマド・アル＝ムヌーフィー、のちにアル＝カーヒリー。アル＝ジーアーニーヤに寄寓した。私（サハーウィー）から（学問を）得た者の一人である。彼は、夢の中でブハーリーが私の姿で現れたのを見たと私に告げた。アッラーぞ知る。
  en: Ḥusayn b. ʿAlī b. Muḥammad al-Munūfī, then al-Qāhirī, a resident of al-Jīʿāniyya. He was among those who took (knowledge) from me, and he informed me that he saw al-Bukhārī in a dream in my likeness. And God knows best.
