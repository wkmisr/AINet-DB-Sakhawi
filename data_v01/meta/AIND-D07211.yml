translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アリー・ブン・アビー・アル＝バラカート、アミーン・アッ＝ディーン、アブー・アン＝ナスルまたアブー・アル＝ヤマン、ブン・アル＝ファフル・ブン・ザヒーラ、アル＝クラシー・アル＝マッキー、ハナフィー派。アブドゥルアズィーズとアブドゥルムウティーの兄弟。母は父の女奴隷である黒人女性カダム・アル＝ハイル。（空白）に生まれ、（空白）クルアーンと『マジュマウ』またはその大部分を（暗記し）、アル＝アラー・ブン・アル＝ジュンディー——ザカリヤーのナキーブ——が隣留していた折に彼のもとで、また他の者のもとで少しばかり学んだ。イスマーイール・ブン・アビー・ヤズィードから文法学を、アブドゥンナビー・アル＝マグリビーから神学（ウスール・アッ＝ディーン）を学んだ。（8）97年に『ブハーリー』などで私に師事した。それどころか、父の存命中の（8）86年に私に聴聞しており、従兄弟にも聴聞した。
  en: Muḥammad b. Abī Bakr b. ʿAlī b. Abī al-Barakāt, Amīn al-Dīn Abū al-Naṣr and Abū al-Yaman, b. al-Fakhr b. Ẓahīra, al-Qurashī al-Makkī al-Ḥanafī, brother of ʿAbd al-ʿAzīz and ʿAbd al-Muʿṭī; his mother was Qadam al-Khayr, a Zanjī slave-girl of his father. He was born [blank] … the Qurʾān and al-Majmaʿ, or most of it; he studied a little under al-ʿAlāʾ b. al-Jundī, the naqīb of Zakariyyā, during the latter's sojourn, and under others; he took grammar from Ismāʿīl b. Abī Yazīd and uṣūl al-dīn from ʿAbd al-Nabī al-Maghribī. He attended me assiduously in the year (8)97 for al-Bukhārī and other works; indeed he had heard from me in his father's lifetime in the year (8)86, and he heard from his paternal cousin.
