translation:
  ja: 今後記述されるアリーの父。ヒジュラ暦839年シャアバーン月3日火曜日に生まれた。しばしば私（＝サハーウィー）の許を訪れ、ハディースの聴聞や口述筆記の集会に参加し、また（イスナードの）伝承者の残存者から聴聞し、アル＝カーミリーヤ学院のイマームのもとで朗誦した。彼には威厳と愛想があった。
  en: The father of the forthcoming ʿAlī. He was born on Tuesday, 3 Shaʿbān 839 AH. He often frequented me (al-Sakhāwī) for listening to Hadith and dictation sessions, and he also heard from the remaining transmitters (musnadūn) and recited to the Imam of al-Kamiliyya. He possessed dignity and amiability.
