translation:
  ja: ムハンマド・ブン・ウスマーン・ブン・ムーサー・ブン・ムハンマド、ナースィル・アッ＝ディーン、アブー・アブド・アッラー、出自はアル＝イスハーキー——ガルビーヤの町マハッラト・イスハークに由来——、アル＝カーヒリー、アル＝マーリキー。アル＝ハンバリーの姻戚であるアッ＝ラディー・ムハンマド・ブン・ムハンマドの祖父。アル＝イスハーキーとして知られる。シャイフ・ハリールらのもとで学んだ者の一人で、自筆で多くを書写し、さらに法源学の書を一冊編んだ。巡礼し、裁判の代理官を務めた。それどころか、アッ＝シャムス・アル＝マダニーが不在の際に何度か彼を代理に立てたという。（8）10年頃に、90歳を超えて没した。その孫が私に伝えた。
  en: Muḥammad b. ʿUthmān b. Mūsā b. Muḥammad, Nāṣir al-Dīn, Abū ʿAbd Allāh, al-Isḥāqī by origin—after Maḥallat Isḥāq in al-Gharbiyya—, al-Qāhirī, al-Mālikī; grandfather of al-Raḍī Muḥammad b. Muḥammad, the in-law of al-Ḥanbalī. He is known as al-Isḥāqī. He was among those who studied under al-Shaykh Khalīl and others; he copied much in his own hand and even compiled a book on legal theory. He made the pilgrimage and served as deputy judge; indeed it is said that al-Shams al-Madanī appointed him as his deputy during some of his absences. He died around the year [8]10, aged over ninety. His grandson told me this.
