translation:
  ja: バルドバク・アル＝ハリーリー。カスカ（Qaṣqā）と渾名されるが、これはトルコ語で「背の低い者（al-Qaṣīr）」を意味する。サファドの副知事を務め、821年ラジャブ月の中旬に没した。人々からの評判は良くなかった。我らがシャイフ（イブン・ハジャル）がその歴史書『インバー・アル＝グムル（Inbāʾ al-Ghumr）』において彼を記録している。
  en: Bardbak al-Khalīlī, nicknamed Qaṣqā, which means 'the short one' (al-Qaṣīr) in Turkish. He served as the deputy governor of Safad and died in the middle of Rajab in the year 821 AH. He was not well-regarded. Our shaykh (Ibn Ḥajar) recorded his biography in his history book Inbāʾ al-Ghumr.
