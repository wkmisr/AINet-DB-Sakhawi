translation:
  ja: ムハンマド・ブン・アフマド・アッ＝シャムス、アッザーズ出身でハラブの人、イブン・スィフリースとして知られる。クルアーンを読み、学問に携わり、自らハディースを求めて旅し、修得して、ハラブでそれによって有名になり、他の分野にも参与し、善良で信心深く、商いで生計を立てていたが、837年ラビーウ・アル＝アーヒル月19日木曜の夜に没した。アル＝ビカーイーはそこ〔ハラブ〕で彼に会い、彼から次の言葉を書き留めた。「ハッサーン・ブン・サービトは預言者――神の祝福と平安あれ――の息子イブラーヒーム――神が彼を嘉したまえ――を悼み、預言者――神の祝福と平安あれ――に呼びかけてこう詠んだ。『あなたの息子は、称えられる結末のうちに逝った、欠点に汚されず／言葉でも行いでも非難されることなく。彼は、もし生きながらえて高みであなたと並べば〔と考え〕／あなたが比類なく唯一のままであることを選んだのだ』」。
  en: 'Muḥammad b. Aḥmad al-Shams, of ʿAzāz by origin, of Aleppo, known as Ibn Siflīs. He read the Qurʾān, occupied himself with learning, sought ḥadīth on his own, travelled and acquired [it], so that he became famous for it in Aleppo, with participation in other [fields] as well; he was good and pious, earning his living by trade, until he died on the night of Thursday, 19 Rabīʿ al-Ākhir of the year 837. Al-Biqāʿī met him there and wrote down from him his words: "Ḥassān b. Thābit said, mourning Ibrāhīm, the son of the Prophet (God bless him and grant him peace), may God be pleased with him, and addressing the Prophet (God bless him and grant him peace) with this: ''Your son has passed away, praised in his ends, unstained / by fault, and unblamed in word or deed. / He saw that were he to live and equal you in eminence, / [so] he preferred that you remain unique, without peer.''"'
