  ja: アフマド・ブン・シャムス・アル=アインマ・アッ=サラーイー・アル=ワーイズ（説教師）。イブン・アラブシャーがホラズムで彼に会い、彼から（知識を）学んだ。そしてイブン・アラブシャーは、彼が「ペルシア語・トルコ語・アラビア語の言葉の王」と呼ばれていたと述べた。
  en: Aḥmad b. Shams al-Aʾimma al-Sarāʾī al-Wāʿiẓ (the Preacher). Ibn ʿArabshāh met him in Khwārazm and took (knowledge) from him, and said that he was called the 'King of Persian, Turkish, and Arabic speech'.
