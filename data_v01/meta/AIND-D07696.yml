    ja: '二重立項: #AIND-D07099（刊本 325 番「محمد بن إسماعيل بن إبراهيم محي الدين بن المجد المكراني أخو أحمد الماضي … نشأ وقطن مكة … ولازمني بها في سنة ست وثمانين وبعدها وفهم مع عقل」）と、ラカブ محيي الدين・父のラカブ مجد الدين・祖父 إبراهيم・ニスバ المكراني المكي・「لازمني في سنة ست وثمانين وبعدها」・「فهم وعقل」がすべて一致し、父名の揺れ（عبد القادر／إسماعيل）はサハーウィー自身が D00544a で記す揺れと同一。$$$ 索引項「محمد بن مجد الدين المكراني المكي . في ابن إسماعيل بن إبرهيم وفي ابن عبد القادر بن إبرهيم」も両項を同一人物として並記する。いずれの項にも転送指示がないため両項とも実項のまま双方向 possible_identity（cert high）。D07099 側の逆方向 relation は要追記（要判断 §Dd-3）。'
