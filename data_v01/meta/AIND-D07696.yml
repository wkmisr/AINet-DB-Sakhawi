translation:
  ja: ムハンマド・ブン・アブドゥルカーディル――あるいはイスマーイールともいうが、前者のほうが確からしい――・ブン・イブラーヒーム、ムヒー・アッ＝ディーン・イブン・マジュド・アッ＝ディーン、マクラーンを本貫とするアル＝マッキー。アブドゥルムフスィンらのもとで絶えず学問に励み、理解力と分別を備えている。886年およびそれ以後、私（サハーウィー）に大いに師事した。
  en: Muḥammad b. ʿAbd al-Qādir — or Ismāʿīl, though the former is more likely — b. Ibrāhīm, Muḥyī al-Dīn b. Majd al-Dīn, of Makrānī origin, al-Makkī. He was constantly engaged in study under ʿAbd al-Muḥsin and others, with understanding and good sense, and he attended me (al-Sakhāwī) assiduously in the year 886 and thereafter.
