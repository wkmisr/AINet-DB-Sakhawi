translation:
  ja: アフマド・ブン・ムハンマド・ブン・アリー・ブン・ウマル・ブン・アリー・ブン・ムハンナー・アッ＝サファディー・アル＝ハナフィー。彼の父の伝記は後述される。アッ＝サラーフ・アッ＝タラーブルシーが849年ラビーウ・アル＝アウワル月に彼（本項）に（暗記物を）提示した。私（サハーウィー）は彼（本項）の伝記を知らない。前述のサラーフは私に、彼自身（サラーフ）がタラーブルス（トリポリ）のカーディー職に就いたと語った。
  en: Aḥmad b. Muḥammad b. ʿAlī b. ʿUmar b. ʿAlī b. Muhannā al-Ṣafadī al-Ḥanafī. His father will be mentioned later. Al-Ṣalāḥ al-Ṭarābulusī presented to him (Aḥmad) in Rabīʿ al-Awwal 849 H. I (al-Sakhāwī) am unaware of his biography. Al-Ṣalāḥ, the aforementioned, told me that he (al-Ṣalāḥ) assumed the qāḍī-ship of Tripoli.
