translation:
  ja: アブドゥルカーディル・ブン・アブドゥルハーディー・ブン・ムハンマド・アル＝ムヒュウィー・アル＝アズハリー・アル＝マダニー、のちにアル＝マッキー。徳性の高い人物の一人であり、その父の伝記は後述される。彼はヒジュラ暦865年にマッカにおいて、マッカのマーリキ派の判事であるアル＝ムヒュウィー・アブドゥルカーディルに『サヒーフ・アル＝ブハーリー』を朗読して学び、彼に密着してアラビア語学などを修めて頭角を現した。また、マディーナにおいてアブー・アル＝ファラジュ・アル＝マラーギーに師事した。ヒジュラ暦878年のラジャブ月にマッカで没した。
  en: Abd al-Qadir b. Abd al-Hadi b. Muhammad al-Muhyawi al-Azhari al-Madani, later al-Makki. One of the virtuous scholars, whose father's biography is forthcoming. In the year 865 AH, he read Sahih al-Bukhari under al-Muhyawi Abd al-Qadir, the Maliki judge of Mecca, and became his close disciple in Arabic grammar and other fields, in which he excelled. In Medina, he also studied under Abu al-Faraj al-Maraghi. He died in Mecca in Rajab, 878 AH.
