translation:
  ja: ムハンマド・ブン・アリー、アル＝ジャマール・アッ＝スーハーイー・アル＝ミスリー、ミスルの公証人（ウドゥール）の一人。我らがシャイフ（イブン・ハジャル）は『インバー』で彼に言及し、「我らがシャイフ、アブー・アリー・アッ＝ザフターウィーのもとでマンスーブ体を書き（習い）、人々はその点で彼から益を得た」と述べた。823年ラジャブ月に、50歳を超えて没した。
  en: 'Muḥammad b. ʿAlī al-Jamāl al-Sūhāʾī al-Miṣrī, one of the notary-witnesses (ʿudūl) of Miṣr. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: he wrote the proportioned (mansūb) script under our shaykh Abū ʿAlī al-Zaftāwī, and people benefited from him in that. He died in Rajab of the year [8]23, having passed fifty.'
