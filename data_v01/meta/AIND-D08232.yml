    ja: '「كتب المنسوب على شيخنا أبي علي الزفتاوي」（イブン・ハジャル『إنباء الغمر』からの引用中なので「شيخنا」はイブン・ハジャルの師＝規則59(f)）。師＝#AIND-D06773「محمد بن أحمد بن علي أبو علي الزفتاوي ثم المصري المكتب . ولد في سنة خمسين وسبعمائة … وتعانى الكتابة … وصنف في أوضاع الخط كتابا سماه منهاج الإصابة في أوضاع الكتابة … وصار غاية في معرفة الخطوط المنسوبة … وممن تعلم منه الكتابة شيخنا」（クンヤ أبو علي・ニスバ الزفتاوي・マンスーブ体の書法師の3点で閉合、規則57）。初版は #NEEDID、method に TMP-S-00026（كتب＝書写）と field「المنسوب」を置いていたが、「書法を学んだ」の意なので先例 D00790「أذن له بالإفتاء」に倣い method を原文句の desc（ref なし）に。'
