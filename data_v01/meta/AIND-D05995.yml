translation:
  ja: ウマル・ブン・ムハンマド・アル＝バアリー、イブン・アッ＝トゥルクマーニーとして知られる。我らがシャイフ（イブン・ハジャル）が『インバー』で彼を挙げて次のように述べている。「バアルバックの証人の一人で、同僚と争わず、報酬を法外に求めない者であり、低調な詩作があった。」（8）01年ムハッラム月18日に、80歳を超えて没した。神が彼を憐れみたまわんことを。
  en: 'ʿUmar b. Muḥammad al-Baʿlī, known as Ibn al-Turkumānī. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: "One of the witnesses of Baʿlabakk, among those who did not quarrel with their colleagues nor overcharge in their fees; he had some poor verse." He died on the eighteenth of Muḥarram of the year (8)01, having passed eighty. May God have mercy on him.'
