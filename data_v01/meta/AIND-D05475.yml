notes:
- text: '転送見出し（原文末尾「فيمن اسم أبيه أحمد」による）。転送先は #AIND-D04991「علي بن أحمد بن علي بن حسين بن محمد … الشرف أبو الحسين … الحسيني الأرموي الأصل نزيل القاهرة ويعرف بابن قاضي العسكر」（821年没、未受領）。D04991 本文に「وسمي بعضهم والده محمدا」とあり、本見出し（父名 محمد）はその異伝に対応する。ナサブ「بن علي بن حسين بن محمد」・ラカブ الشرف・ニスバ الأرموي が一致。'
