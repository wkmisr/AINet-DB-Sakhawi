translation:
  ja: タグリー・ビルディー・アル＝マフムーディー・アン＝ナースィリー。官職を歴任して昇進し、禁衛兵長（ラアス・ナウバ・アン＝ヌワブ）に任命された。キプロスでフランク族を襲撃した遠征軍の総司令官を務めた後、投獄された。その後釈放され、ダマスクスのアミール、さらにはそのアターベクに任命された。836年ズー・アル＝カアダ（1433年6月頃）にカラ・ユルクとの戦闘で没した。
  en: Taghrī Birdī al-Maḥmūdī al-Nāṣirī. He was promoted through various services until he was appointed as Chief of the Corps of Mamluks (Raʾs Nawbat al-Nuwab). After leading the expedition against the Franks in Cyprus, he was imprisoned, but later released and appointed as Amīr of Damascus, and eventually its Atābak. He died in battle against Qarā Yulūk in Dhu al-Qaʿdah, 836 AH.
