translation:
  ja: ウワイド・ブン・マンスール・ブン・ラージフ・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ウマル。マッカの隊長（カーイド）たちの一人。（8）46年サファル月に起きた殺戮のなかで死に、その首は切られてジッダの海岸で引き回され、その後そこで胴体とともに埋葬された。イブン・ファハドがその没年月を記している。
  en: ʿUwayd b. Manṣūr b. Rājiḥ b. Muḥammad b. ʿAbd Allāh b. ʿUmar, one of the commanders (quwwād) of Mecca. He died in a massacre that took place in Ṣafar of the year (8)46; his head was cut off and paraded on the coast of Jidda, then buried there together with his body. Ibn Fahd recorded his death date.
