notes:
- text: '同母の兄弟: #AIND-D02336「جار الله … بن عبد العزيز بن عمر بن محمد بن محمد الهاشمي المكي ويعرف كسلفه بابن فهد سبط عم أبيه أبي بكر بن محمد بن فهد أمه كمالية . ولد … سنة احدى وتسعين وثمانمائة」（本項原文に言及なし、父が AIND で共通＝relation を立てず note、規則23）。祖父 النجم عمر بن فهد・曾祖父 التقي محمد（#AIND-D09211）は見出しのナサブに含まれる。shuhrah「ابن فهد」は見出しの「بن فهد」による。'
  lang: ja
  type: editorial
translation:
  ja: ヤフヤー・ブン・アブド・アル＝アズィーズ・ブン・ウマル・ブン・アッ＝タキー・ムハンマド・ブン・ファハド。（8）95年ズー・アル＝ヒッジャ月に、生後数か月で没した。母はカマーリーヤで、父の父方おじアブー・バクルの娘である。
  en: Yaḥyā b. ʿAbd al-ʿAzīz b. ʿUmar b. al-Taqī Muḥammad b. Fahd. He died in Dhū al-Ḥijja of the year [8]95, aged a few months. His mother is Kamāliyya, daughter of Abū Bakr, his father's paternal uncle.
