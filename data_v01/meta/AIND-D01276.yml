notes:
- text: '校閲: 原文「عرض عليه ابن فهد ... وأجازه」より、ابن فهد（#AIND-D09211، التقي محمد بن فهد المكي）が عرض を行った学習者、本項が إجازة を与えた師。プロジェクト慣行（subtype=student は active=師/passive=弟子の物理方向を保持、D01440先例）に従い、relation1（عرض, n=1）は active=本項(師)/passive=ابن فهد・event を teaching に、relation2（أجاز, n=2）は subtype=teacher・active=本項 に是正。Gemini初版は relation2 の subtype が student で誤り（relation1 の物理方向は元から正）。'
