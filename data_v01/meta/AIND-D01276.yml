translation:
  ja: 295 アフマド・ブン・ムハンマド・ブン・アフマド・アル＝マーリキー。 イブン・ファハドは822年のハッジの季節にマッカで彼に（自分の）暗記したテクストの一部を提示し、彼は（イブン・ファハドに）イジャーザを与えた。彼はイブン・ファハドのシャイフの一覧に記載されているが、イブン・ファハドは彼をよく知らなかったと述べ、先日言及したイブン・アル＝ヌスカであろうと推測している。
  en: 295 Aḥmad b. Muḥammad b. Aḥmad al-Mālikī. Ibn Fahd presented some of his memorized texts to him during the pilgrimage season of the year 822 H in Mecca, and he (Aḥmad b. Muḥammad) granted him ijāza. He is listed among Ibn Fahd's shaykhs, and Ibn Fahd stated that he did not know him well and presumed him to be the son of al-Nuskha mentioned previously (الماضي قريبا).
