translation:
  ja: アリー・ブン・ムーサー、アン＝ヌール、アブー・アル＝ハサン・アル＝カラーフィー、のちにアル＝カーヒリー、アッ＝シャーフィイー、アル＝ムクリ。後述するアル＝アミーン・ムハンマドの父。イブン・アル＝ムシャッバブのもとで（クルアーンの）単独および複数の朗誦法を聴聞によって朗誦し、793年に終えた。830年頃に存命であった。彼の息子が彼から（学問を）受け継ぎ、また、アッ＝シハーブ・イブン・アサドも彼のもとで読誦したと主張している。神が彼を慈しまんことを。
  en: ʿAlī b. Mūsā, al-Nūr, Abū al-Ḥasan al-Qarāfī, then al-Qāhirī, al-Shāfiʿī, the Quran reciter. Father of al-Amīn Muḥammad, who is mentioned below. He recited the Quran by listening under Ibn al-Mushabbab, both individually and collectively, completing it in the year 793 AH. He was alive around 830 AH. His son studied under him, and al-Shihāb Ibn Asad also claimed to have read under him, may Allah have mercy on him.
