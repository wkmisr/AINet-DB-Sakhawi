translation:
  ja: アブド・アッ＝ラティーフ・ブン・アフマド・ブン・ファドル・アッラー・ブン・アビー・バクル・ブン・アブド・アッラー・アン＝ニムラーウィー、のちカイロの人、アル＝アズハリー・アッ＝サウーディー。後述のアリーの兄弟。善良な人物で、徴税（ジバーヤ）などの実務に携わった。
  en: ʿAbd al-Laṭīf b. Aḥmad b. Faḍl Allāh b. Abī Bakr b. ʿAbd Allāh al-Nimrāwī, then al-Qāhirī, al-Azharī al-Saʿūdī, brother of ʿAlī (mentioned below). He was a good man who dealt with tax-collecting and the like.
