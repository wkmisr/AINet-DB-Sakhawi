translation:
  ja: アダム・ブン・サイード・ブン・アビー・バクル・アル＝ジャバルティー・アル＝ハナフィー。マッカの居住者で、若くして同地で亡くなった。彼はマッカに滞在し、高名な学者たちやそこにやって来る学者たちの下で、フィクフ、ウースール・アル＝フィクフ、アラビア語、その他の分野で絶えず学びに励み、また美しく優雅な様式でクルアーンを朗誦した。彼のシャイフの中には、アラビア語のアッ＝シラージュ・ムアンマル・ブン・アブドゥルカウィー、そしてアブドゥンナビー・アル＝マグレビがいた。また、私がマッカにいた時、私から『アル＝サヒーフ』やその他の多くの書物を聴聞した。さらに、彼は私のもとでいくつかの授業に出席した。彼はヒジュラ暦887年ズルヒッジャ月5日の水曜日の夜に亡くなり、翌日彼のために葬儀の礼拝が行われ、アル＝ムアッラーに埋葬された。アッラーが彼に楽園をお与えになるように。
  en: Adam b. Saʿīd b. Abī Bakr al-Jabartī al-Ḥanafī, a resident of Mecca who died there as a young man. He dwelled there, continuously studying under its eminent scholars and those who came to it, in fiqh, its principles (usūl al-fiqh), Arabic, and other subjects, and for recitation in a beautiful and elegant manner. Among his shaykhs were al-Sirāj Muʿammar b. ʿAbd al-Qawī in Arabic, and ʿAbd al-Nabī al-Maghribī. He also heard from me (al-Sakhāwī), while I was in Mecca, much of al-Ṣaḥīḥ and other works. Moreover, he attended some lessons with me. He died on Wednesday night, the fifth of Dhū al-Ḥijja, in the year eight hundred and eighty-seven. Funeral prayers were performed for him the next day, and he was buried in al-Muʿallā. May God compensate him with Paradise.
