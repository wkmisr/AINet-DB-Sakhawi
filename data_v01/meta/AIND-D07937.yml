notes:
- text: '転送見出し（原文末尾「يأتي فيمن جده عبد الله」による）。転送先は #AIND-D07945「محمد بن عثمان بن عبد الله ويقال أيوب بدل عبد الله وهو أصح أصيل الدين أبو عبد الله بن الفخر أبي عمرو بن النجم العمري فيما قيل الإشليمي ثم القاهري الشافعي والد الشهاب أحمد بن أصيل الماضي」（未受領）。D07945 本文の「ويقال أيوب بدل عبد الله وهو أصح」が本見出しの祖父名 أيوب と閉合する。同じ人物への転送見出し D07959「محمد بن عثمان أصيل الدين الإشليمي . فيمن جده عبد الله」（B148）あり。'
