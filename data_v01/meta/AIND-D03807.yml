translation:
  ja: アブー・アル＝ファドル、アル＝ムヒッブ（・アッ＝ディーン）の息子、アッ＝シャラフ（・アッ＝ディーン）の息子。バクトゥムル家系、カイロ出身。既述のアフマドとヤフヤーの兄弟。彼らの父と、ハナフィー派の叔父アッ＝サイフも同様。ハジュリー暦874年ジュマーダー・アッ＝サーニー（第2ジュマーダー月）に生まれ、我が（サハーウィーの）サルガトミシュィーヤ・マドラサにおける講義に出席し、さらにハジュリー暦890年には『カンズ（・アッ＝ダカーイク）』を私に提示（暗誦）した。
  en: Abd al-Rahman b. Muhammad b. Yunus b. Muhammad b. Umar, Abu al-Fadl, the son of al-Muhibb and al-Sharaf, of Buktumuri origin, of Cairo. He is the brother of the aforementioned Ahmad and Yahya, and their father and their uncle al-Sayf al-Hanafi. He was born in Jumada al-Thaniyah, the year 874 H. He attended my lectures at the Sarghatmashiyya Madrasah, and presented (recited) the book 『al-Kanz』 to me in the year 890 H.
