translation:
  ja: アフマド・シャー、イブン・アフマド・シャー、イブン・ファンド・ワ・カーシュ（ムザッファル・シャハーブッディーン、ベンガル王）。私（サハーウィー）は、自筆で書かれた『アンバー』の欄外に839年にこれを見出した。カルバルガの支配者アフマド・イブン・アフマド・イブン・ハサン・イブン・バフマズについては既に言及したので、彼ら二人のことについては明確にする必要がある。
  en: Aḥmad Shāh b. Aḥmad Shāh b. Fund wa Kāsh, al-Muẓaffar Shihāb al-Dīn, King of Bengal. I (al-Sakhāwī) found this in my own handwriting in the year 839 H on the margin of 『Inbāʾ al-Ghumr』 (TMP-T-00034). Reference to Aḥmad b. Aḥmad b. Ḥasan b. Bahmaz, the ruler of Kalbargā, has already been made (cross-ref to an earlier entry); so their matters should be clarified.
