translation:
  ja: 185 アフマド・ブン・グラームアッラー・ブン・アフマド・ブン・ムハンマド、ラカブはアッ＝シハーブ、ニスバはアッ＝リーシー、アッ＝カーヒリー、アル＝ミーカーティー。我らがシャイフ（イブン・ハジャル）は『インバー・アル＝グムル』のなかで、「彼は星の学（天文学・占星術）に熱心に取り組み、（占星術の）アフカーム（判断）に多く通じ、天文表（ズィージュ）を解き暦（タカーウィーム）を作成するようになり、そのことによって有名になった。836年サファル月に50歳を超えて亡くなった」と述べた。
  en: '185 Aḥmad b. Ghulām Allāh b. Aḥmad b. Muḥammad, al-Shihāb al-Rīshī al-Qāhirī al-Mīqātī. Our shaykh (Ibn Ḥajar) said in his Inbāʾ [al-Ghumr]: ''He engaged in the art of the stars (fann al-nujūm), knew much of astrological judgments (aḥkām), became skilled at calculating astronomical tables (zīj) and writing calendars (taqāwīm), and became famous for it. He died in Ṣafar of the year 836 H, having exceeded fifty years of age.'''
