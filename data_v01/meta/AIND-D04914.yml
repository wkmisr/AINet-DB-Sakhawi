  ja: アキール・ブン・ワビール・ブン・ナフバール・ブン・ムクビル・ブン・ムハンマド・ブン・ラージフ・ブン・イドリース・ブン・ハサン・ブン・アビー・アズィーズ・カターダ、アル＝ハサニー、ヤンブウのアミール。842年に前述のサフラに代えられてその職を解かれた。844年に没した。
