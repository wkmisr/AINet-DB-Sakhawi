translation:
  ja: アズダマル・ミン・サルバービク（サルバービクから購われた者）、アル＝アシュラフ・バルスバーイのマムルークで、アミール・マンズィルを務めた。ハーラト・バハーウッディーン地区のバイト・マンスール居住者。895年（ヒジュラ暦）のズー・ル・ヒッジャ月に自身のイクター地から戻る途中、バルシューム付近（の対岸）で死去した。彼は善良な人物で、享年70歳を超えていたと思われる。
  en: Azdumar min Sarbābiq (i.e., purchased from Sarbābiq), al-Ashrafī Barsbāy, who served as amīr manzil. Resident of Bayt Manṣūr in Ḥārat Bahāʾ al-Dīn. He died opposite Barshūm in Dhū al-Ḥijja 895 H, while returning from the land of his *iqṭāʿ*. He was a good person and is thought to have been over seventy years old.
