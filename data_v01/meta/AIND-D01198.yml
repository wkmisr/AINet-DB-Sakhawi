translation:
  ja: アフマド・ブン・ムハンマド・ブン・アフマド・ブン・アル＝サイフ、ラカブはアッ＝シハーブ、出身はアッ＝サーリヒー、法学派はハンバル派。アリー・ブン・アル＝イズ・ウマルやファティマ・イブナト・アル＝イズ・イブラーヒームなどからハディースを聴聞し、伝承した。我らがシャイフ（イブン・ハジャル）は自身の歴史書と列伝集の中で述べた、「彼（アフマド・ブン・ムハンマド）は私（イブン・ハジャル）にイジャーザを与えた」。彼は802年ジュマーダー・アル＝アーヒラ月に死去した。
  en: 'Aḥmad b. Muḥammad b. Aḥmad b. al-Sayf, al-Shihāb, from al-Ṣāliḥī, of the Hanbali madhhab. He heard (ḥadīth) from ʿAlī b. al-ʿIzz ʿUmar and Fāṭima bint al-ʿIzz Ibrāhīm, among others, and transmitted. Our shaykh (Ibn Ḥajar) stated in his history (Tarīkh) and dictionary (Muʿjam): "He granted me ijāza." He died in Jumada al-Akhira in the year 802 AH.'
