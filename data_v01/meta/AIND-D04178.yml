translation:
  ja: アブドゥルカーディル・ブン・ムハンマド・ブン・ハサン・ブン・アリー・アル＝カーヒリー。イブン・アル＝カマーヒーとして知られる。ヒジュラ暦841年（1437/38年）に生まれ、貧しく育った。私のところ（サハーウィー）へ頻繁に通い、いくつかのハディースを学び、説教を行った。
  en: ʿAbd al-Qādir b. Muḥammad b. Ḥasan b. ʿAlī al-Qāhirī, known as Ibn al-Kamākhī. He was born in the year 841 AH (1437/1438 CE) and grew up poor. He frequented me [al-Sakhāwī] for some hadiths and delivered sermons.
