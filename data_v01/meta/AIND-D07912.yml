translation:
  ja: ムハンマド・ブン・アブドゥルワッハーブ・ブン・サダカ、アッ＝シャムス・アル＝クースーニー、医師、医師の子で、その父は既述。アル＝ジャマール・ブン・アブドゥルハックの姉妹の子。834年に生まれ、父はその翌年に没した。成長するとクルアーンなどを暗記し、医術の修練を積んでそれに秀で、患者を回診し、諸職に就き、ついで（医師の）長（リヤーサ）に昇った。人々は彼の落ち着き・礼節・分別・治療の巧みさを称えた。彼を引き立てた者にアル＝ムザッファル・アル＝アムシャーティーがいる。彼はアル＝ハティーリー・モスクの近くに邸宅を建てたが、のちに売却せざるを得なくなった。同じくハーラト・ズワイラの入口、アル＝ハランフシュの近くにも家を建てた。
  en: Muḥammad b. ʿAbd al-Wahhāb b. Ṣadaqa, al-Shams al-Qūṣūnī, the physician, son of the physician whose entry came above, and sister's son of al-Jamāl b. ʿAbd al-Ḥaqq. He was born in the year 834, and his father died in the following year. He grew up, memorized the Qurʾān and other texts, trained in the craft (of medicine), excelled in it, made the rounds of the sick, held various posts, and then rose to the headship (of the physicians). People praised his composure, manners, intelligence and skill in treatment. Among those who spoke highly of him was al-Muẕaffar al-Amshāṭī. He built a house near the Khaṭīrī mosque but later had to sell it, and likewise built a house at the head of Ḥārat Zuwayla near al-Kharanfish.
