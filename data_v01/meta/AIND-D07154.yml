translation:
  ja: ムハンマド・アン＝ナースィリー・ブン・アル＝アシュラフ・バルスバーイ。彼の母はフワンド・アル＝クブラーで、彼の父がその名に帰されるドゥクマーク・アル＝ムハンマディーの妻であった。父が即位したとき、彼はおよそ5歳であった。その後829年、アミール・スィラーフのイーナール・アン＝ナウルーズィーの後にタクディマ（指揮官位）を授けられ、彼のもとに幾人ものマムルークが雇われ、アミールやハーッサキーヤからなる役職者が彼に付けられ、彼らには、歴代スルタンの子息たちの先例に従って、饗宴（アスミタ）や馬などに関して彼に仕えるよう命じられたので、彼らはそれに従った。そして彼は、ナイル増水の際に、慣例どおりナイロメーターに香を塗り堰を切るために、華やかに、高位のアミールやハーッサキーヤを前に従えて出御するようになった。やがて833年ジュマーダー・アル＝アーヒラの半ばに、成年に近づいた頃にペストで没し、父のマドラサに埋葬された。彼は父の後のスルタン位に指名されていたが、神は彼を安らわせた。母も彼より前に、同じく父のマドラサで没した。我らの師（イブン・ハジャル）は『インバー』で彼に簡潔に言及している。
  en: Muḥammad al-Nāṣirī b. al-Ashraf Barsbāy. His mother was Khawand al-Kubrā, the wife of Duqmāq al-Muḥammadī, to whom his father's nisba is attributed. His father became sultan when he was about five years old. Then, in the year 829, he was granted a taqdima after the Amīr Silāḥ Īnāl al-Nawrūzī; several mamlūks were taken into his service, office-holders from among the amīrs and the khāṣṣakiyya were assigned to him, and they were ordered to conduct themselves with him according to the way of previous sons of sultans in banquets, horses and the like, which they did. He used to go down at the Nile's plenitude to perfume the Nilometer and to cut the dam according to custom, in splendour, with the senior amīrs and the khāṣṣakiyya before him, until he died of the plague in the middle of Jumādā al-Ākhira 833, having nearly reached puberty, and was buried in his father's madrasa. He had been designated for the sultanate after his father, but God gave him rest. His mother had died before him,
    also in his father's madrasa. Our shaykh mentioned him briefly in his Inbāʾ.
