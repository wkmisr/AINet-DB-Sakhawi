translation:
  ja: ムハンマド・ブン・バフティー・ブン・ムハンマド・ブン・ユースフ・ブン・ムーサー、アッ＝サトゥースィー（部族名）、ティリムサーン出身でチュニスの人、マーリク派。838年頃チュニスに生まれた。アフマド・アン＝ナフリー、イブラーヒーム・アル＝アフダリー、カーディー・アル＝ジャマーア（大法官）のムハンマド・アル＝カルシャーニー、アフマド・ブン・ハルールーから法学を学び、最初の二人から二つのウスール（法源学と神学）と論理学を、最初の一人とムハンマド・アッ＝ラッサーウらから意味論と修辞学を、三人目からナワウィーの『ハディース諸学の近道（アッ＝タクリーブ）』を学んだ。アラビア語学を二人のアフマド、すなわちアッ＝サラーウィーとアル＝ムナスティーリーから、相続法と算術をアフマド・アル＝ハウワーリーから学んだ。七つの読誦法を修め、ついでこれにヤアクーブの読誦法を加えて、イブラーヒーム・ザアブーブ、アフマド・ブン・アル＝ハーッジャ、ムハンマド・ブン・アル＝アジャミーのもとで読んだ。866年に巡礼し、カイロに戻ってそこにしばらく滞在した。アル＝ビカーイーが彼に会い、彼は完全な学徳と多才さ、聡明さ、優れた理解力の持ち主であると述べた。神が最もよく知りたもう。
  en: Muḥammad b. Bakhtī b. Muḥammad b. Yūsuf b. Mūsā al-Satūsī (a tribal nisba), of Tilimsān origin, al-Tūnisī, the Mālikī. He was born in about 838 in Tunis. He took fiqh from Aḥmad al-Nakhlī, Ibrāhīm al-Akhḍarī, the qāḍī al-jamāʿa Muḥammad al-Qalshānī and Aḥmad b. Ḥulūlū; from the first two he took the two uṣūl and logic, from the first and Muḥammad al-Raṣṣāʿ and others maʿānī and bayān, and from the third al-Nawawī's al-Taqrīb fī ʿulūm al-ḥadīth. He took Arabic from the two Aḥmads, al-Salāwī and al-Munastīrī, and inheritance law and arithmetic from Aḥmad al-Hawwārī. He mastered the seven readings and then added to them the reading of Yaʿqūb, under Ibrāhīm Zaʿbūb, Aḥmad b. al-Ḥājja and Muḥammad b. al-ʿAjamī. He performed the pilgrimage in 866, then returned to Cairo and stayed there for a while. Al-Biqāʿī met him and said that he was a man of complete excellence, versatility, intelligence and sound conception; but God knows best.
