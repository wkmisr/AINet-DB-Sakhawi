    ja: '父 التاج عبد الرزاق بن البقري（コプト系書記官家 ابن البقري）。本伝のある兄弟3人（#AIND-D10264 يحيى・#AIND-D02779 حمزة・#AIND-D10991 أبو سعيد）と共有される父であり、ニスバ索引 #AIND-D12193「ابن البقري … وابن عمهما العلم يحيى بن التاج عبد الرزاق وهو أكبر منهما وله ثلاثة اخوة حمزة وفرج وأبو سعيد」で裏付けられるため TMP-P を発行（規則3）。corpus に父自身の本伝なし・ID-Master 未登録（الشرف TMP-P-000768・المجد TMP-P-000769 は従兄弟）。初版 #NEEDID を解消。'
