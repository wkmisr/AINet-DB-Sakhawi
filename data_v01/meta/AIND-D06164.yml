translation:
  ja: ファラジュ・ブン・アブドゥッラッザーク、サアド・アッディーン・ブン・タージュ・アッディーン・ブン・アル＝バカリー。ヤフヤー、ハムザ、アブー・サイードの兄弟。行政実務（ムバーシャラート）の訓練を受け、ある時は国庫（アッ＝ダウラ）で、またある時はスルターン私領庁（アル＝ムフラド）で実務官を務めた。
  en: Faraj b. ʿAbd al-Razzāq, Saʿd al-Dīn b. Tāj al-Dīn b. al-Baqarī, brother of Yaḥyā, Ḥamza and Abū Saʿīd. He trained in administrative service (mubāsharāt) and served at times in the Dawla (state treasury) and at times in the Mufrad (the sultan's private bureau).
