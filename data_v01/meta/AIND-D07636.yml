translation:
  ja: ムハンマド・ブン・アブドゥッラヒーム・ブン・アル＝フサイン・ブン・アブドゥッラフマーン、アル＝ムヒッブ・アブー・ハーティム・イブン・アッ＝ザイン・アビー・アル＝ファドル、イラクを本貫とするアル＝カーヒリー、シャーフィイー派。前述のアル＝ワリー・アブー・ズルア・アフマドの兄弟。我らがシャイフ（イブン・ハジャル）は『インバー』で彼に言及して言った、「父は彼に多くを聴聞させ、彼は学問に励み教授したが、その後やめた。徳があり容姿端正だったが、学問への従事は少なかった」と。〔八百〕二年サファル月に没した。ラジャブ月にマッカへ向かったが、病を得て巡礼の前に戻り、その病が続いて没した。
  en: 'Muḥammad b. ʿAbd al-Raḥīm b. al-Ḥusayn b. ʿAbd al-Raḥmān, al-Muḥibb Abū Ḥātim b. al-Zayn Abī al-Faḍl, of ʿIrāqī origin, al-Qāhirī al-Shāfiʿī, the brother of al-Walī Abū Zurʿa Aḥmad, mentioned above. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: "His father had him hear a great deal; he studied and taught, then gave it up. He was learned and of handsome appearance, but of little scholarly application." He died in Ṣafar of the year [8]02. He had set out for Mecca in Rajab, then returned before the pilgrimage because of an illness that befell him and persisted until he died.'
