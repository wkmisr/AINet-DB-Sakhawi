translation:
  ja: ムハンマド・ブン・アブド・アル＝カーディル・ブン・アビー・アル＝ハイル——その名はアブド・アル＝ハック——・ブン・アブド・アル＝カーディル・アル＝ハキーム、ギヤース・アッ＝ディーン、アブー・アル＝ファドル・ブン・アビー・アル＝フトゥーフ・アッ＝ターウースィー、アブラクーフ出自でシーラーズの人、シャーフィイー派。既述のアフマド・ブン・アブドゥッラーの父方の叔父。父その他から多くを聴聞し、イブン・ウマイラ、アッ＝サラーフ・ブン・アビー・ウマル、アッ＝シハーブ・アフマド・ブン・アブド・アル＝カリーム・アル＝バアリー、アッ＝ザイターウィー、アッ＝タキー・イブン・ラーフィウ、アル＝イッズ・ブン・ジャマーア、アル＝ヤーフィイーほか多数が彼にイジャーザを与えた。甥が彼から伝承した。812年ラジャブ月22日にシーラーズで没した。
  en: Muḥammad b. ʿAbd al-Qādir b. Abī al-Khayr—whose name is ʿAbd al-Ḥaqq—b. ʿAbd al-Qādir al-Ḥakīm, Ghiyāth al-Dīn Abū al-Faḍl b. Abī al-Futūḥ al-Ṭāwūsī, of Abarqūh origin, of Shīrāz, Shāfiʿī; paternal uncle of the aforementioned Aḥmad b. ʿAbd Allāh. He heard much from his father and others, and Ibn Umayla, al-Ṣalāḥ b. Abī ʿUmar, al-Shihāb Aḥmad b. ʿAbd al-Karīm al-Baʿlī, al-Zaytāwī, al-Taqī Ibn Rāfiʿ, al-ʿIzz b. Jamāʿa, al-Yāfiʿī and a multitude granted him ijāza. His brother's son transmitted from him. He died on 22 Rajab 812 in Shīrāz.
