translation:
  ja: ムハンマド・ブン・アル＝カーディル・ブン・ウマル・ブン・フサイン・ブン・アリー、アル＝ムヒッブ、アブー・アル＝バラカート、ザフター出自、アル＝マクス在住。父と祖父は前述。父は彼に多くの（師の）もとで多く聴聞させ、同様に彼は私（サハーウィー）からも聴聞した。彼は父に先立って没した。
  en: Muḥammad b. al-Qādir b. ʿUmar b. Ḥusayn b. ʿAlī, al-Muḥibb, Abū al-Barakāt, of Zaftā origin, of al-Maqs. His father and grandfather have been mentioned above. His father had him hear much from a number of scholars, and likewise he heard from me (al-Sakhāwī). He died before his father, leaving him bereaved.
