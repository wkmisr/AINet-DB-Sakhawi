notes:
- text: 「أسمعه أبوه الكثير على جماعة」＝父が多くの師に聴聞させた（師の名なし＝relation を立てない）。「وأثكل أباه」＝父（883 年シャウワール月没、D04161）に先立って没した＝没年は原文にないので death を立てない（父の没年からの上限は他項由来のため note 留め、規則23）。叔父 علي（#AIND-D05300「علي بن عمر بن حسين بن علي بن شرف الزفتاوي … أخو عبد القادر وأحمد」）・従兄弟 أحمد（#AIND-D00504「أحمد بن أحمد بن عمر بن حسين الزفتاوي … وعمه عبد القادر」）は本項に言及なし（note のみ）。
