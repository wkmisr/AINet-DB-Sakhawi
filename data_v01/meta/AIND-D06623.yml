translation:
  ja: ムハンマド・ブン・アフマド・ブン・ビッティーフ、バドル・アッ＝ディーン・アル＝カーヒリー、同地の医師頭。その術ではアル＝バハードゥリーのほうが先んじていたのに、頭職でアル＝バハードゥリーより先に立てられた者である。（8）48年シャウワール月4日に同地で没した。
  en: Muḥammad b. Aḥmad b. Biṭṭīkh, Badr al-Dīn al-Qāhirī, chief of the physicians there. He was one who was given precedence in the headship over al-Bahādurī, despite the latter’s precedence in the art. He died there on 4 Shawwāl of the year [8]48.
