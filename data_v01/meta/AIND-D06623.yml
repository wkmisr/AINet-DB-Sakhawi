  active: AIND-D06006
  passive: AIND-D06623
  quote: البهادري
  note:
    ja: 「ممن قدم في الرياسة على البهادري مع تقدم ذلك في الفن」＝医術では البهادري のほうが優れていたのに、医師頭の職では本項主が彼より先に立てられた。البهادري＝#AIND-D06006「432 عمر بن منصور بن عبد الله السراج القاهري الحنفي ويعرف بالبهادري … انتهت إليه الرياسة في الطب … وقد ترشح للرياسة في الأيام المؤيدية فتعصب ناصر الدين بن البارزي عليه … ومع هذا فأخرجت الرياسة عنه لابن بطيخ」（834年没、repo 未収録）。相手側本文が「ابن بطيخ」を名指しして閉合（ブリーフ ★どおり）。初版はニスバ番号 TMP-N-01555 を人物位置に置いていた（precheck カテゴリ不一致）。
