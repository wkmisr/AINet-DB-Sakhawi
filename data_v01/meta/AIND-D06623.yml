  note:
    ja: '規則3 (c'')。父の本伝は corpus にない。同家の医師 #AIND-D01287「305 أحمد بن محمد بن بطيخ شهاب الدين . أحد فضلاء الأطباء وخيارهم تنزل في الجهات … مات في وله ذكر في أخيه على ابن بطيخ .」は名が「أحمد بن محمد」で、本項主の父（أحمد بن بطيخ）とは決められない（#AIND-D04181 によれば الشهاب بن بطيخ の死は871年の少し前で、本項主の子の世代の可能性もある）。同定せず note に留める（規則26）。'
- id: r2
