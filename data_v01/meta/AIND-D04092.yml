translation:
  ja: アブドゥルカーディル・ブン・イブラーヒーム・ブン・アリー、ムヒー・アッ＝ディーン、イブン・アル＝ブルハーン、アル＝カーヒリー、マーリキー派、クルアーン朗誦家。父は先述で、彼も父と同じくイブン・アル＝ファウワールとして知られる。法学とアラビア語学を少し学んで理解し、写本を行い、父とともに朗誦団（ジャウク）で読誦し、さらに子供たちへの朗誦教授を父と分担した。いくつかのスーフィー（扶持）職を得、ときに一部のムスニド（ハディース伝承家）のもとで読誦し、私（サハーウィー）からもわずかに学んだ。悪くない人物である。
  en: ʿAbd al-Qādir b. Ibrāhīm b. ʿAlī, Muḥyī al-Dīn b. al-Burhān, al-Qāhirī, al-Mālikī, the Qurʾān reciter; his father was mentioned above, and he, like him, is known as Ibn al-Fawwāl. He studied a little fiqh and Arabic, understood, copied manuscripts, recited with his father in the jawq (recitation group), and even shared with him the teaching of children. He obtained some Sufi stipends, occasionally read under some musnids, and took a little from me (al-Sakhāwī); he is acceptable.
