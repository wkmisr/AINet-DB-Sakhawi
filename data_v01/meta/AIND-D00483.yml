translation:
  ja: アハマド・ブン・アハマド・ブン・アハマド・シハーブッディーン・アッ＝ディマシュキー。裁判署名者の一人。「イブン・アン＝ナッシャール」として知られた。我らがシャイフ（イブン・ハジャル）は『アンバーウフ』において彼について、ダマスクスの名士の一人で、書道と弁論術に優れていたと述べた。815年ラマダーン月に死去。彼は父と祖父の名前が一致していた人物の一人である。
  en: Ahmad b. Ahmad b. Ahmad Shihāb al-Dīn al-Dimashqī, one of the signatories of judgments, known as Ibn al-Nashshār. Our shaykh (Ibn Hajar) mentioned in his Anbāʾ that he was among the notables of Damascus, distinguished by his good calligraphy and eloquence. He died in the month of Ramaḍān in the year 815 H. He was among those whose name matched his father's and grandfather's names.
