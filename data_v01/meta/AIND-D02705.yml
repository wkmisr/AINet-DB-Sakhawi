translation:
  ja: フサイン・ブン・アブドゥルムウミン・ブン・アル＝ムザッファル・アル＝ジャマール・ブン・アル＝サドル・ブン・アル＝イッズ・アッ＝シーラーズィー。アッ＝ターウースィーは827年にシーラーズで彼に会い、彼がアル＝ミッズィーとイブナト・アル＝カマールの一般イジャーザ（授権）に含まれていることから、彼にイジャーザを求めた。ラビー・アル＝アウワル月の最初（1日）、833年に160歳で没した。
  en: Ḥusayn bin ʿAbd al-Muʾmin bin al-Muẓaffar al-Jamāl bin al-Ṣadr bin al-ʿIzz al-Shīrāzī. Al-Ṭāwūsī met him in the year 827 AH in Shiraz and requested his ijāza, as he was included in the general ijāza of al-Mizzī and Ibnat al-Kamāl. He died on the first of Rabīʿ al-Awwal in the year 833 AH at the age of one hundred and sixty.
