translation:
  ja: アフマド・ブン・ウマル・ブン・ムハンマド、シャハーブ・アッ＝ディーン。ニシーリー出身、後にカイロ定住のシャーフィイー派法学者。書籍仲買人ムハンマドの兄弟。アル＝ハイダリーやそれに類する人びと、またアン＝ナシャーウィーやアブドゥッ＝サマド・アル＝ハルサーニーのもとで学習し、彼らから（書物を）読んだ人びとのひとりである。
  en: Aḥmad b. ʿUmar b. Muḥammad, Shihāb al-Dīn al-Nashīlī, then al-Qāhirī, al-Shāfiʿī, brother of Muḥammad the bookseller. He was among those who engaged in study and read under al-Khayḍarī and similar figures, as well as under al-Nashāwī and ʿAbd al-Ṣamad al-Hrsānī.
