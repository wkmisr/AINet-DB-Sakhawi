translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アリー・ブン・アビー・バクル・ブン・イスマーイール、アル＝ミスリー・アル＝マッキー。父は聖モスクのファッラーシュ（敷物係）兼ムアッズィンであり、彼自身はアル＝カバービー〔と呼ばれ〕、子供の訓導（ムアッディブ）であった。（8）28年、マッカ管区のワーディー・アル＝ジウラーナで、アル＝ジャマール・アル＝ムルシディーからイブン・ファハド編の彼の『マシュヤハ』の一部を、またアリー・イブン・サラーマから『ブハーリー』の読了（ハトム）、『アブー・ダーウード』、『アッ＝シファー』を聴聞した。
  en: ʿAbd Allāh b. Muḥammad b. ʿAlī b. Abī Bakr b. Ismāʿīl, al-Miṣrī al-Makkī. His father was a carpet-spreader (farrāsh) and muezzin at the Sacred Mosque; he himself was al-Qabābī and a teacher of children. In (8)28, at Wādī al-Jiʿrāna in the district of Mecca, he heard from al-Jamāl al-Murshidī part of his Mashyakha compiled by Ibn Fahd, and from ʿAlī Ibn Salāma the concluding session (khatm) of al-Bukhārī, Abū Dāwūd and al-Shifāʾ.
