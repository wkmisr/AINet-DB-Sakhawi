translation:
  ja: アハマド・ブン・イブラーヒーム・ブン・アリー・ブン・アハマド・ブン・ムハンマド、アッ＝シハーブ・イブン・アル＝ブルハーン・アル＝アブナーシー・アル＝サフラウィー・アッ＝シャーフィイー。彼の父は過去に言及された人物であった。彼は善良で物静かな人であり、乏しいなかにも寛大で、人当たりがよく、クルアーンの朗誦と神への専心を多く行い、敬虔な人々を好んだ。彼は時にアッ＝ザイン・アル＝アブナーシーのもとで学業に励んだ。また私（サハーウィー）に『ブハーリー』の一部を読誦した。彼は兄弟であるワリー・アッ＝ディーンとともにアル＝アシュラフ・イナールの廟におけるスーフィーのシャイフ職を務めた。彼はヒジュラ暦889年サファル月9日に死去した。これはハッジから帰国直後のことであった。彼は徒歩で旅をしたが、マディーナに到着すると動けなくなり、乗り物に乗せられた。彼は腹痛を患い、間もなくして亡くなった。その日の午後に彼のために葬儀が執り行われ、彼は父の傍ら、アル＝ザイン・アブドゥルバーシトの廟に埋葬された。私（サハーウィー）は彼が50歳未満であったとは思わない。彼と私たちにアッラーの慈悲がありますように。
  en: Ahmad b. Ibrahim b. Ali b. Ahmad b. Muhammad, Shihāb al-Dīn b. al-Burhān al-Abnāsī al-Ṣaḥrāwī al-Shafi'i. His father was mentioned previously. He was a good, quiet man, generous despite his modest means, sociable, frequently recited the Qurʾān, was devout, and fond of righteous people. He sometimes studied under al-Zayn al-Abnāsī, and he recited part of al-Bukhārī to me (al-Sakhāwī). He was appointed to the shaykhdom of the Sufis at Turbat al-Ashraf Īnāl in partnership with his brother, Walī al-Dīn. He died on the 9th of Ṣafar in the year 889 AH, shortly after his return from the Hajj. He had traveled on foot, but upon reaching Medina, he became incapacitated and had to be mounted (on an animal). He suffered from stomach pain and did not live long thereafter. Funeral prayers were performed for him in the afternoon of the same day, and he was buried next to his father at Turbat al-Zayn ʿAbd al-Bāsiṭ. I do not consider him to have been less than fifty years old. May God have mercy on
    him and us.
