translation:
  ja: アフマド・アッ＝シハーブ・アル＝カーシフ。庶民の出で、諸々の職務を転々とした後、アル＝ガルビーヤ（本文表記アル＝グリーヤ）で「土砂掘削監督（カシュフ・アッ＝トゥラーブ）」の職に就いた。非常に富裕となり、アスターダーリーヤ職を求めた。そのためアスターダール（宮廷管理官）に謀られ、スルターンによってダマスカスへ追放された。ダマスカスで長居することなく、852年ラマダーン月にそこで死去した。
  en: Aḥmad al-Shihāb al-Kāshif. A commoner, he moved from post to post until he was appointed supervisor of dredging (kashf al-turāb) at al-Gharbiyya (written al-Ghurīya in the text). He became very wealthy and sought the office of Ustādār, which led the Ustādār to plot against him. As a result, the Sultan exiled him to Damascus, where he soon died in Ramaḍān 852 H.
