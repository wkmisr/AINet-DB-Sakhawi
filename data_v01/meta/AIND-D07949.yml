translation:
  ja: ムハンマド・ブン・アル＝ファフル・ウスマーン・ブン・アリー、アッ＝シャムス、アル＝マーリディーニー、のちアル＝ハラビー、アッ＝シャーフィイー、アル＝アッバール（針職人。これが彼の生業であった）。前述のアブド・アル＝カーディルの父。彼（アブド・アル＝カーディル）が私に語ったところでは、その父（本項主）は『タンビーフ』の後に『ハーウィー』などを暗記し、法学を修め、アル＝バドル・イブン・サラーマとその兄弟シハーブ・アッ＝ディーンからアラビア語学などを学び、アル＝ブルハーン・アル＝ハラビーから聴聞した。『ミンハージュ』に14巻の注釈を書いたが、そのうち約1巻が残っている。また『ワラカート』（法源学）にも注釈を書き、さらに『ブハーリー』に3巻のハーシヤ（注釈）を著した。敬虔で善良、心の清い人であった。巡礼からの帰途、バドルで没し、アル＝ファーリアに運ばれてそこに埋葬された。（8）71年のことで、50歳を超えていた。神よ彼を憐れみ給え。
  en: Muḥammad b. al-Fakhr ʿUthmān b. ʿAlī, al-Shams, al-Māridīnī, then al-Ḥalabī, al-Shāfiʿī, al-Abbār (the needle-maker, which was his trade); father of the aforementioned ʿAbd al-Qādir. He (ʿAbd al-Qādir) told me that his father memorized al-Ḥāwī after al-Tanbīh and other works, studied jurisprudence, took Arabic and other subjects from al-Badr b. Salāma and his brother Shihāb al-Dīn, and heard from al-Burhān al-Ḥalabī. He wrote a commentary on al-Minhāj in fourteen volumes, of which about one volume survives, and one on al-Waraqāt in legal theory; he even composed a gloss on al-Bukhārī in three volumes. He was a righteous, good and pure-hearted man. He died at Badr on his way back from the pilgrimage and was carried to al-Fāriʿa, where he was buried, in the year [8]71, having passed fifty. May God have mercy on him.
