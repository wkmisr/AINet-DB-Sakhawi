translation:
  ja: アリー・アル＝マハッリー、のちにアル＝マッキー。バーブ・アッ＝サラームの薬種商（アッタール）で、リバート・アル＝アッバースに住んでいた。祝福された人であった。（8）82年ズー・アル＝カアダ月にマッカで没した。イブン・ファハドがその没年月を記録している。
  en: ʿAlī al-Maḥallī, then al-Makkī, the druggist (al-ʿaṭṭār) at Bāb al-Salām, who resided in Ribāṭ al-ʿAbbās. He was a blessed man. He died in Mecca in Dhū al-Qaʿda (8)82. Ibn Fahd recorded his death.
