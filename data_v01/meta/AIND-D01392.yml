translation:
  ja: 399. アハマド・ブン・ムハンマド・ブン・ウスマーン・ブン・アイユーブ、シャハーブ・アッ＝ディーン、アシュリーミー出身、後にカーヒリーの人。 アシュリーミー出身のシャラフ・ムハンマド・アル＝アスィーリーとヌール・アリーの兄弟。ナジュム・ムハンマドの父である。 彼は育ち、クルアーンを暗唱し、兄弟のワクフについて意見を述べ、その采配が称賛され、彼の事柄は順調であった。総じて、勉学においては二人の兄弟に劣り、年齢も彼らよりも若かった。彼は集団での礼拝に熱心で、自分の仕事に傾倒し、スーフィズムと職務に専念した。
  en: 399. Aḥmad b. Muḥammad b. ʿUthmān b. Ayyūb, Shihāb al-Dīn, originally from al-Ashlīmī, then al-Qāhirī. He was the brother of al-Sharaf Muḥammad al-Aṣīlī and al-Nūr ʿAlī al-Ashlīmī, and the father of al-Najm Muḥammad. He grew up and recited the Qur'an, and spoke concerning his brother's endowments, and his management was praised and his affairs were good, despite his shortcomings compared to his two brothers in terms of overall diligence in studies and being younger than them. He was eager for congregational prayer, devoted to his own affairs, and adhered to his Sufism and his duties.
