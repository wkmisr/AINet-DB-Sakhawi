translation:
  ja: ムハンマド・ブン・アフマド・ブン・ユースフ・ブン・アブドゥルマジード、アル＝バドル・アル＝マハッリー、のちにアル＝カーヒリー、マーリキー派、カラークジャー・アル＝ハサニー・モスクのイマーム。一時期、法学やアラビア語学などに励み、概ね一通り修めた。アッ＝タキー・アッ＝シュムンニーに師事し、彼のもとで『ムスナド』などを伝承として読誦した。同じく、アル＝イッズ・アル＝ハンバリーとアブドゥルカーフィー・ブン・アッ＝ザハビーほか一団から、私（サハーウィー）の朗読で聴聞した。学問への関与とともに、彼には信仰心と善良さがあった。〔8〕60年より後に若くして没した。神が彼と我々に慈悲を垂れたまわんことを。
  en: Muḥammad b. Aḥmad b. Yūsuf b. ʿAbd al-Majīd, al-Badr al-Maḥallī, then al-Qāhirī, the Mālikī, imam of the mosque of Qarāqujā al-Ḥasanī. For a time he occupied himself with jurisprudence, Arabic, and the like, and acquired a general share in them; he attended al-Taqī al-Shumunnī closely and read with him the Musnad and other works by way of transmission. He likewise heard from al-ʿIzz al-Ḥanbalī, ʿAbd al-Kāfī b. al-Dhahabī, and a group of others with me (al-Sakhāwī) as reader. Along with his share in learning he had piety and goodness. He died young, after the [8]60s began. May God have mercy on him and on us.
