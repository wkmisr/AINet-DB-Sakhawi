translation:
  ja: ウマル・ブン・ムハンマド・ブン・ウマル、バルフ出身、アル＝マハッリー、アル＝マーリキー、鍛冶屋、文人。830年頃に生まれ、クルアーンの一部と『ウムダ』の全部を暗記し、我らの師（イブン・ハジャル）らにシャイフ・ハリールの『ムフタサル』の抜粋などを提示した。しかし学問に従事することはなく、詩作にたずさわる庶民である。私はマハッラで彼からその詩を書き取り、『ムウジャム』などに収めた。
  en: ʿUmar b. Muḥammad b. ʿUmar, of Balkhī origin, al-Maḥallī al-Mālikī, the blacksmith, the man of letters. He was born around the year 830, memorized part of the Qurʾān and the whole of al-ʿUmda, and presented to our shaykh and others a selection from the Mukhtaṣar of al-Shaykh Khalīl and other works. He did not, however, pursue study; rather he is a commoner who engages in composing poetry. I wrote down from him in al-Maḥalla verses which I have included in the Muʿjam and elsewhere.
