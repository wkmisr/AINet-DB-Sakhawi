translation:
  ja: スライマーン・ブン・イーサー・ブン・ユースフ・ブン・ウマル・ブン・アブドゥルアズィーズ・アル＝ハウワーリー・アル＝バンダーリー、ハウワーラ・アラブのアミールたちの一人。従兄弟ユーヌス・ブン・イスマーイールの解任ののちアミール職に就いたが、やがて兄弟のアフマドに替えられた。（8）81年にアル＝ブルジュで没した。
  en: Sulaymān b. ʿĪsā b. Yūsuf b. ʿUmar b. ʿAbd al-ʿAzīz al-Hawwārī al-Bandārī, one of the amīrs of the Hawwāra Arabs. He was installed in the emirate after the dismissal of his cousin Yūnus b. Ismāʿīl, then was removed in favour of his brother Aḥmad. He died at al-Burj in the year [8]81.
