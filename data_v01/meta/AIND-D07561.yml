translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・アリー・ブン・イスハーク、アッ＝シャムス・ブン・アッ＝ザイン、アッ＝タミーミー・アル＝ハリーリー・アッ＝シャーフィイー。父は先述。イブン・シュカイルとして知られる。アッ＝ザイン・アル＝カムニーから聴聞し、アル＝ハーフィーからヒルカ（スーフィーの衣）を授けられたと自ら述べる者の一人で、学識（ファディーラ）があった。889年シャアバーン月に自らの町で、およそ70歳で没した。アッラーが彼を憐れみたまえ。
  en: Muḥammad b. ʿAbd al-Raḥmān b. ʿAlī b. Isḥāq, al-Shams b. al-Zayn, al-Tamīmī al-Khalīlī al-Shāfiʿī, whose father was mentioned previously; known as Ibn Shuqayr. He was among those who stated that they had heard from al-Zayn al-Qamanī and received the khirqa (Sufi cloak) from al-Khāfī, and he possessed some learning. He died in his home town in Shaʿbān 889, aged about seventy. May God have mercy on him.
