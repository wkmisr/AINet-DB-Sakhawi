translation:
  ja: アリ・ブン・ムハンマド・アル＝マルフームィー、のちにアル＝カーヒリー。シャーフィイー派。ムースキー橋（カンタラト・アル＝ムースキー）の公証人の一人であるクルアーン朗誦家。イブン・アサドおよびジャアファル（・アッ＝サンフーリー）に就いてクルアーン朗誦（諸伝承）を学んだ。
  en: ʿAlī b. Muḥammad al-Marḥūmī, later al-Qāhirī, al-Shāfiʿī. A Quran reciter and one of the notary witnesses at the Mūskī Bridge (Qanṭarat al-Mūskī). He studied the Quranic readings (al-qirāʾāt) under Ibn Asad and Jaʿfar (al-Sanhūrī).
