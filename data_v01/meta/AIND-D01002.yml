translation:
  ja: カイロのサーリヒーヤ学院のイマームを務めたアフマド・ブン・アリー・ブン・アイユーブ、シャハーブ・アル＝ムヌーフィー。 彼は熱心に学究に励み、また冗談好きな人物であったため、ある者たちから背教者であると非難された。 彼が師である我らがシャイフ（イブン・ハジャル）の『アンバー（の書）』で述べたところによると、彼は802年のサファル月に60歳で死去した。 またアル＝マクリーズィーも著書『ウクード（の書）』で述べたところによると、彼はシャーフィイー派の法学者で学究に励み、彼がふざけて口にした言葉が記録されており、もし彼が（その言葉について）追及されていたら、彼は滅びていただろう。
  en: Aḥmad b. ʿAlī b. Ayyūb, al-Shihāb al-Munūfī, served as Imām of al-Ṣalāḥīya in al-Qāhira. He devoted himself considerably to scholarly pursuits and was known for his frequent jesting, to the extent that some accused him of heresy. Our shaykh (Ibn Ḥajar) mentioned him in his Anbāʾ, stating that he died in the month of Ṣafar in the year 802 H at the age of sixty. Al-Maqrīzī also stated in his ʿUqūd that he was a Shafi'i who applied himself diligently to study, and words were recorded from him which his jesting led him to say, and for which, had he been questioned, he would have perished.
