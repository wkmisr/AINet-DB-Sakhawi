translation:
  ja: アブド・アル＝カリーム・ブン・ウマル・ブン・ムハンマド・ブン・ウマル、ナジュム・アッ＝ディーン・アッ＝ディマシュキー。後述のアル＝ハワージャ・シャムス・アッ＝ディーン・ムハンマドの兄弟で、前述のイブラーヒームの父。イブン・アッ＝ザマンとして知られる。名の知られた商人であった。子供たちを残して、879年ラジャブ月にダマスクスで37歳で没した。
  en: ʿAbd al-Karīm b. ʿUmar b. Muḥammad b. ʿUmar, Najm al-Dīn al-Dimashqī, brother of al-Khawājā Shams al-Dīn Muḥammad (mentioned below) and father of Ibrāhīm (mentioned above); he is known as Ibn al-Zaman. He was a merchant of note. He died in Rajab of the year 879 at the age of thirty-seven in Damascus, having left children.
