translation:
  ja: ムハンマド、ジャマール〔・ッディーン〕またはバハー〔・ッディーン〕、アブー・アブドゥッラー。前項〔カマール・アブー・ル＝ファドル・イブン・アル＝バハー・アッ＝ダルカーリー〕の弟。769年、父がカイロで没したという知らせが届いた後にマッカで生まれた。4歳のときジャマール・イブン・アブド・アル＝ムウティーのもとで『イブン・ヒッバーン』の一部を聴講し、アミユーティー、ナシャーワリー、アリー・アン＝ヌワイリーらから聴聞した。幾度もカイロに入り、タヌーヒー、イブン・アッ＝シャイハ、ハラーウィーら一団から聴聞し、さらに没年のラビーウ第2月にはカイロでファウィーのもと、クルータ―ティーの朗読により『ダーラクトニーのスナン』の大部分を聴聞した。同様にダマスクスにも入り、アブー・フライラ・イブン・アッ＝ザハビーらから聴聞した。アリー・アッ＝ザランディー、キーラーティー、アフマド・ブン・サーリム・アル＝ムアッズィンらがイジャーザを与えた。生計を求めて繰り返しイエメン地方に入り、ついに827年、おそらくその末頃に同地で没した。
  en: Muḥammad, al-Jamāl or al-Bahāʾ, Abū ʿAbd Allāh, brother of the preceding entry (al-Kamāl Abū al-Faḍl Ibn al-Bahāʾ al-Darkālī, of Mecca, Mālikī). Born in Mecca in 769 after news arrived of his father's death in Cairo. At age four he attended al-Jamāl Ibn ʿAbd al-Muʿṭī for part of Ibn Ḥibbān, and heard from al-Amyūṭī, al-Nashāwarī, ʿAlī al-Nuwayrī and others. He entered Cairo several times, hearing from al-Tanūkhī, Ibn al-Shaykha, al-Ḥallāwī and a group; in Rabīʿ II of the year of his death he heard there, from al-Fuwwī through the recitation of al-Kulūtātī, much of the Sunan of al-Dāraquṭnī. He also entered Damascus and heard from Abū Hurayra Ibn al-Dhahabī and others. ʿAlī al-Zarandī, al-Qīrāṭī, Aḥmad b. Sālim al-Muʾadhdhin and others gave him ijāza. He repeatedly travelled to Yemen in search of livelihood until he died there in 827, probably towards its end.
