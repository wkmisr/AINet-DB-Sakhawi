translation:
  ja: タグリー・ビルディー・サイフ・アッ＝ディーン・アッ＝ザーヒリー・バルクーク・アッ＝バシュブガーウィー。アレッポ、次いでダマスクスのナーイブ（総督）を務めた。ダマスクス総督への任命はヒジュラ暦813年ズー・アル＝ヒッジャ月であり、815年ムハッラム月に没するまでその職に留まった。たいへん慎み深く物静かで、寛容かつ聡明な人物であった。イブン・ハティーブ・アン＝ナースィリーヤが詳細に言及しており、マクリーズィーもその伝記集『ウクード』で言及している。
  en: Taghrī Birdī Sayf al-Dīn al-Ẓāhirī Barqūq al-Bashbughāwī. He was the deputy (governor) of Aleppo, then Damascus. His appointment over Damascus began in Dhu al-Hijjah, the year 813 AH, and he remained in this office until his death in al-Muharram, the year 815 AH. He was highly modest, tranquil, clement, and intelligent. Ibn Khatib al-Nasiriyya mentioned him at length, as did al-Maqrizi in his al-Uqud.
