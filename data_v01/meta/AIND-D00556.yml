translation:
  ja: アフマド・ブン・イスマーイール・ブン・ムハンマド・ブン・アフマド、アル=シハーブ・アル=ワナーイー・アル=カーヒリー・アル=シャーフィイー。後述するアル=シャムスという兄弟がいた。我らがシャイフ、イブン・ヒドルは彼について「彼はその兄弟よりも学究に専念していた」と語っていたと私に伝わった。彼は我らがシャイフ（イブン・ハジャル）の許に出席した人物であり、アル=ガーヤーティーに朗読し、おそらく自らも教えたと聞いている。彼の死は兄弟よりも遅かった。彼には存命の息子がいるので、もし彼が学識を持つなら、彼から彼の事情を確認できるだろう。
  en: Aḥmad b. Ismāʿīl b. Muḥammad b. Aḥmad al-Shihāb al-Wanāʾī al-Qāhirī al-Shāfiʿī. He had a brother, al-Shams (forthcoming). Our shaykh, Ibn Khiḍr, used to say about him, 'He was more settled in his studies than his brother.' He was among those who attended lessons with our shaykh (Ibn Ḥajar). I heard that he read to al-Qāyātī and perhaps even taught others. His death occurred later than his brother's. He has a son who is alive, from whom his affairs can be verified, if he is knowledgeable.
