translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アブドゥッラフマーン、アッ＝シャムス・アル＝ハラビー・アッ＝サースクーニー——これ（サースクーン）はそこ（ハラブ）の村である——、シャーフィイー派。アッ＝ザーキル（唱念者）として知られ、崇敬される聖者の一人。カイロに来て、そこで礼拝と唱念（ズィクル）の良き道を歩んで暮らし、二か月余りの病の末、（8）86年シャウワール月5日火曜日の夜、日没後に没した。翌日、盛大な参列のもとアズハル（・モスク）のマクスーラの外で葬礼が行われ、その後イブン・ムズヒルの廟に埋葬された。神が彼と我々に慈悲を垂れたまわんことを。
  en: Muḥammad b. Abī Bakr b. ʿAbd al-Raḥmān, al-Shams al-Ḥalabī al-Sāskūnī (Sāskūn being a village of Aleppo), al-Shāfiʿī, known as al-Dhākir, one of the venerated holy men. He came to Cairo and lived there in a fine manner of worship and dhikr until he died, after an indisposition of more than two months, after sunset on the night of Tuesday 5 Shawwāl (8)86. The funeral prayer was performed for him the next day outside the maqṣūra of al-Azhar in a well-attended gathering, and he was then buried in the turba of Ibn Muzhir; may God have mercy on him and on us.
