translation:
  ja: アフマド・ブン・ハファージャ、あだ名はシハーブ、ナスブはサファド出身（アル＝サファディー）。サファドのシャイフであり、隠修士であった。彼は善良で、敬虔で、慈悲深く、禁欲的で、信仰篤い人物であり、故郷の人々から大きな信頼を得ていた。特に彼は誰からも何も受け取らなかった。初めは織物職人であったが、後にそれをやめ、自分のブドウ園で自活した。
  en: Aḥmad b. Khafāja, nicknamed al-Shihāb, from Safad (al-Ṣafadī). He was its shaykh and ascetic. He was a good, righteous, benevolent, ascetic, devout, and pious person, greatly esteemed by the people of his hometown. Notably, he accepted nothing from anyone. In his early life, he was a weaver, but he later abandoned that profession and contented himself with his vineyards.
