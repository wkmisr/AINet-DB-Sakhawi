translation:
  ja: ハラフ・アル＝ミスリー。857年ラビーウ・アル＝アウワル月8日にダマスクスのアン＝ナワウィー（ヌーリー）施療院で没した。20年以上ダマスクスの大モスクに滞在（ムジャーウィル）し、学者や敬虔者たちに仕えていた。神が彼に慈悲を垂れ、我々に彼の恩恵を与えてくださるように。
  en: Khalaf al-Miṣrī. He died in the Nawawī (Nūrī) hospital in Damascus on the 8th of Rabīʿ al-Awwal of the year 857. He had been a resident (mujāwir) at the Mosque of Damascus for more than twenty years, serving the scholars and the righteous. May God have mercy on him and benefit us through him.
