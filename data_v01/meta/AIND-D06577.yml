translation:
  ja: ムハンマド・ブン・イブラーヒーム、アッ＝シャムス・アッ＝タルージー・アル＝ハーンキー、商人。後出のアブー・アル＝バラカート・ムハンマドの父。ジュハーとして知られる（ジームにダンマ、次に無点字〔ハー〕）。（8）88年シャアバーン月に没した。神が彼を赦したまわんことを。
  en: Muḥammad b. Ibrāhīm, al-Shams al-Tarūjī al-Khānkī, the merchant, father of Abū al-Barakāt Muḥammad who comes below. He was known as Juḥā (with ḍamma on the jīm, then an undotted letter [ḥāʾ]). He died in Shaʿbān of the year [8]88; may God pardon him.
