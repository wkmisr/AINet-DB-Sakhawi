translation:
  ja: アブド・アル＝カリーム、カリーム・アッ＝ディーン・イブン・フハイラ（ファー、次いで点付きハー、ラー、ハーの縮小形）。前述のアブド・アッ＝ラッザークの父で、コプト出身の書記の一人、というよりむしろ内帑（ハーッス）の会計官（ムスタウフィー）であった。855年ラジャブ月に没した。
  en: ʿAbd al-Karīm, Karīm al-Dīn Ibn Fukhayra (with fāʾ, then khāʾ, rāʾ and hāʾ, in the diminutive), father of ʿAbd al-Razzāq mentioned above, one of the Coptic clerks — indeed the mustawfī of the khāṣṣ. He died in Rajab of the year 855.
