translation:
  ja: ハディル、アッ＝ザイン、あるいはハイル・アッ＝ディーン、アッ＝ルーミー、カイロ在住、ハナフィー派。カアブ・アル＝アフバールとして知られるモスクのシャイフで、アル＝ブルハーン・アル＝ハナフィーの父。アッ＝ザーヒル・ジャクマクが厚遇した者の一人で、教授した。彼から学んだ者にアッ＝ザイン・アブドゥッラヒーム・アル＝ミンシャーウィーがおり、彼（アル＝ミンシャーウィー）は、彼がアッ＝ザーヒルの時代の後にバイト・アル＝マクディス（エルサレム）で没したと述べ、彼を称賛した。同じくタグリー・バルディー・ブン・アビー・バクルも彼のもとで読誦した。
  en: Khaḍir, al-Zayn or Khayr al-Dīn, al-Rūmī, resident of Cairo, the Ḥanafī. Shaykh of a mosque known as Kaʿb al-Aḥbār and father of al-Burhān al-Ḥanafī. He was among those whom al-Ẕāhir Jaqmaq honoured, and he taught. Among those who studied under him was al-Zayn ʿAbd al-Raḥīm al-Minshāwī, who said that he died in Bayt al-Maqdis (Jerusalem) after the days of al-Ẕāhir, and praised him. Likewise Taghrī Birdī b. Abī Bakr read under him.
