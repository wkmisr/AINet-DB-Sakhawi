translation:
  ja: ムハンマド、前項の人物の兄弟。母はアル＝ムヒッブ・イブン・ザヒーラの娘アルマー。842年ズー・アル＝ヒッジャ月に生まれ、彼もまた幼くして没した者の一人である。イブン・ファハドは彼のために（記載を）空白のままにした。
  en: Muḥammad, brother of the preceding. His mother was ʿAlamā, daughter of al-Muḥibb b. Ẓahīra. He was born in Dhū al-Ḥijja 842, and he too was among those who died young. Ibn Fahd left his entry blank.
