translation:
  ja: ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・イーサー・アル＝クトゥビー、盲目の人、既述のイブラーヒームの兄弟。二人は817年に双子として生まれた。クルアーンを読み、兄弟とともにアル＝イッズ・アブドゥッサラーム・アル＝バグダーディーから学んだ——あちら（兄の項）に述べたとおりである。巡礼し、子供たちに（クルアーンを）教え、サイード・アッ＝スアダーのスーフィーの職を得た。兄弟とともに、また単独で、聴聞などのために私のもとに通った。
  en: Muḥammad b. ʿAlī b. Muḥammad b. ʿĪsā al-Quṭbī, the blind, the brother of the aforementioned Ibrāhīm. The two were born as twins in the year 817. He read the Qurʾān and, together with his brother, studied under al-ʿIzz ʿAbd al-Salām al-Baghdādī, as (stated) there. He performed the pilgrimage, taught children (the Qurʾān), obtained a Sufi post at Saʿīd al-Suʿadāʾ, and frequented me for audition (of ḥadīth) and other things, both with his brother and on his own.
