translation:
  ja: ムハンマド・ブン・アフマド・ブン・イスマーイール、アッ＝シャムス・アッ＝ディマシュキー、クルアーン読誦の師。イブン・アッ＝サイーディー、またアル＝アフダブとして知られる。数年のあいだマッカに寄留し、読誦の教授に当たった。善良で祝福された人であった。（80）9年ジュマーダー第一月にそこで没し、50歳に達していたか、それに近かった。アル＝ファースィーが『マッカ〔史〕』で彼に言及している。
  en: Muḥammad b. Aḥmad b. Ismāʿīl, al-Shams al-Dimashqī, the Qurʾān reciter, known as Ibn al-Ṣaʿīdī and as al-Aḥdab. He sojourned in Mecca for some years and set himself up to teach recitation; he was a good and blessed man. He died there in Jumādā I of the year [80]9, having reached fifty or come close to it. Al-Fāsī mentioned him in [his history of] Mecca.
