translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ジャラール・アッ＝ディーン——しばしば略してジャラールと言われる——・ブン・シャムス・アッ＝ディーン、アル＝アスアルディー・アッ＝ディマシュキー・アッ＝サーリヒー、同地（サーリヒーヤ）の製材職人（ナッシャール）。イブン・アル＝ハイヤータとして知られる。本人が私に告げたところでは、777年ムハッラム月初めに——翌年とも言われる——アスアルドで生まれた。幼少期に先祖とともに同地から移り、ダマスクスのサーリヒーヤに定住した。そこでアブー・アル＝ハウル・アル＝ジャザリーから聴聞し、（のちに）伝承して学者たちが彼から聴聞した。私はそこで彼に会い、いくつかのジュズウを彼に読誦した。彼は製材で生計を立て、カラーニスィーヤ・ハーンカーでムアッズィンを務めるとともに同ハーンカーの管理人（カイイム）でもあった。その後失明し、老いて隠棲し、（8）66年ラビーウ・アル＝アウワル月にサーリヒーヤで没した。ムザッファリー・モスクで葬礼が行われ、（カースィユーン）山麓（サフフ）に埋葬された。神が彼に慈悲を垂れたまわんことを。彼は私に、先祖の一部がアスアルドにマドラサを持っていたと語り、また語った（原文ここで途切れる）。
  en: Muḥammad b. Abī Bakr b. ʿAbd Allāh b. Jalāl al-Dīn — often shortened to Jalāl — b. Shams al-Dīn, al-Asʿardī al-Dimashqī al-Ṣāliḥī, the sawyer (al-nashshār) there, known as Ibn al-Khayyāṭa. He was born, as he told me, at the beginning of Muḥarram 777 — or, it is said, in the following year — at Asʿard. He moved from there in his childhood with his forebears and settled in the Ṣāliḥiyya of Damascus, where he heard from Abū al-Hawl al-Jazarī; he transmitted, and the learned heard from him. I met him there and read some ajzāʾ to him. He had earned his living by sawing, and he served as muezzin at the Qalānisiyya khānqāh while also being its custodian (qayyim). Then he went blind, grew old and withdrew, until he died in Rabīʿ al-Awwal (8)66 at al-Ṣāliḥiyya; the funeral prayer was performed for him at the Muẓaffarī mosque and he was buried at al-Safḥ (the foot of the mountain); may God have mercy on him. He told me that some of his forebears had a madrasa in Asʿard, and he mentioned [text
    breaks off].
