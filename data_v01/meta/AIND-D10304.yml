translation:
  ja: ヤフヤー、アル＝マスウードとあだ名されるアミール・ムハンマドの子。ムハンマドはマグリブの君主アブー・アムル・ウスマーン（アミール・アブー・アブド・アッラー・ムハンマド・ブン・アビー・ファーリスの子）の子。893年シャウワール月に、祖父の後を継いでマグリブを治めた。
  en: Yaḥyā, son of the amir Muḥammad, who bore the title al-Masʿūd and was the son of the ruler of the Maghrib Abū ʿAmr ʿUthmān, son of the amir Abū ʿAbd Allāh Muḥammad b. Abī Fāris. He assumed rule over the Maghrib after his grandfather in Shawwāl 893.
