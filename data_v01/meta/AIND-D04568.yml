translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・ハサン、アル＝ジャマール・アル＝アフサースィー（あるいはアル＝フスースィー）・アル＝カーヒリー・アッ＝シャーフィイー。読誦学（キラーアート）をアン＝ヌール・アル＝イマーム、アッ＝シャムス・ブン・アル＝フスリー、ジャアファルから、合同読誦（ジャムウ）の一部をアッ＝シハーブ・アッ＝サカンダリーから学んだ。
  en: ʿAbd Allāh b. Muḥammad b. Ḥasan, al-Jamāl al-Akhṣāṣī or al-Khuṣūṣī, al-Qāhirī, al-Shāfiʿī. He took the Qurʾānic readings (qirāʾāt) from al-Nūr al-Imām, al-Shams b. al-Ḥuṣrī and Jaʿfar, and part of the combined recitation (al-jamʿ) from al-Shihāb al-Sakandarī.
