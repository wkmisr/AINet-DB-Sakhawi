translation:
  ja: マーミヤ・アッ＝サイフィー・バイブガー・アル＝ムザッファリー。アッ＝ザーヒル・ジャクマクの時代に第三ダワーダールであり、彼の追放または死の後にカーイトバーイ・アル＝マフムーディーがその職に就いた。アル＝ガンナーミーヤの近くに住み、善良さと騎士ぶりで知られた者の一人。アッ＝タンバズィーの娘の一人を娶って子をもうけ、その中にはアル＝アイニーの孫アッ＝シハービーの妻（彼の子らの母）がいる。
  en: Māmiya al-Sayfī Baybughā al-Muẓaffarī. He was third dawādār in the days of al-Ẓāhir Jaqmaq, and after his exile or death Qāytbāy al-Maḥmūdī was installed in that office. He lived near al-Ghannāmiyya and was among those remembered for goodness and horsemanship. He married one of the daughters of al-Ṭanbadhī and had children by her, among them the wife of al-Shihābī, the grandson of al-ʿAynī, the mother of his children.
