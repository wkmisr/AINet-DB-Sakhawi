translation:
  ja: アフマド・ブン・アッ＝タキー・アビー・アル＝ワファー・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・アル＝ハサン・ブン・ムハンマド・アル＝ジャアファリー・アル＝カーヒリー。彼の父、伯父、そして同母の兄弟ムハンマドは後述（別項）。八五七年にカイロで生まれ、『アル＝ミンハージ』などを暗記した。証言（職）と歌唱団の朗誦によって生計を立て、私（サハーウィー）から聴聞した者の一人である。
  en: Aḥmad b. al-Taqī Abī al-Wafā Muḥammad b. Muḥammad b. Muḥammad b. al-Ḥasan b. Muḥammad al-Jaʿfarī al-Qāhirī. His father, paternal uncle, and full brother Muḥammad are mentioned later (separately entered). He was born in 857 H in al-Qāhira and memorized al-Minhāj and other works. He earned his living through the office of legal witnessing and through choral recitation, and was among those who heard from me (al-Sakhāwī).
