translation:
  ja: バドル・アル＝ハバシー。アブー・ジャマール・アッ＝ディーン・アル＝マグリビーの奴隷（マウラー）。主人は彼を育て、クルアーンと様々な書体を、雄弁さとともに教えた。その後イブン・ウライバの所有となり、さらにスルターンの所有となった。スルターンは彼を大いに気に入り、諸事を彼に頼った。彼は分別と沈着さを備え、交易のためにマッカやアレクサンドリアへ頻繁に旅するようになった。
  en: Badr al-Ḥabashī, the slave (mawlā) of Abū Jamāl al-Dīn al-Maghribī. His master raised him and taught him the Qur'an and various styles of calligraphy along with eloquent speech. Later, he came into the possession of Ibn ʿUlayba, and then of the Sultan, who was highly pleased with him and relied upon him in many matters. He traveled frequently to Mecca and Alexandria for trade, possessing intelligence and deliberate calmness.
