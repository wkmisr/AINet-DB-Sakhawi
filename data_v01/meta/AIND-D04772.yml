translation:
  ja: アブドゥルワッハーブ・ブン・アブドゥッラフマーン・ブン・アル＝ハワージャー・シャムス・アル＝アクアク・ムハンマド・ブン・ムハンマド・ブン・ユースフ、バスラ出自のマッカ人。同地（マッカ）で生まれ育ち、クルアーンと『ミンハージュ』などを暗記した。生計のためダール・アル＝イマーラに店を構え、交易のため旅をしてシャーム（シリア）やハラブ（アレッポ）などに入った。おそらく（8）85年ムハッラム月に、アル＝バンダル・アル＝ジャディードとザイラウ港の間で没した。イブン・ファハドがその没年月を記録している。
  en: ʿAbd al-Wahhāb b. ʿAbd al-Raḥmān b. al-Khawājā Shams al-ʿAqʿaq Muḥammad b. Muḥammad b. Yūsuf, of Baṣran origin, al-Makkī. He was born and grew up there (in Mecca), and memorized the Qurʾān, the Minhāj and other works. He set up in the Dār al-Imāra to earn his living, and travelled for trade, entering Syria (al-Shām), Aleppo and other places. He died, probably in Muḥarram (8)85, between al-Bandar al-Jadīd and the port of Zaylaʿ. Ibn Fahd recorded his death.
