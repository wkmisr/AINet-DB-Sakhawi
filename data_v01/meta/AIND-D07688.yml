notes:
- text: '原文冒頭の「ولد」は、生年を導く「وُلد」（生まれた）ではなく「ولدٌ」（＝子ども・幼児）と読む。直後の「سمع علي بقراءة أبيه」＝父の朗読による聴聞は幼少者の描写であり、同バッチ #AIND-D07345 に「وله ولد عرض علي كتبا」（彼には子がいて、私に書物を提示した）の用例がある。したがって刊本に生年の脱落は存在せず、生年に関する date 要素・birth 要素は置かない。父 #AIND-D04033 は858年生で、896年の聴聞時に本項主が幼少であったことと整合する。初版・校閲の「刊本の脱落」とする記述は撤回する（裁定 §D-29）。'
