translation:
  ja: ムハンマド・ブン・アブドゥルアズィーム・ブン・ヤフヤー・ブン・アフマド・ブン・アブドゥルアズィーム・アル＝ハーンキー。〔まだ〕幼い子であった。896年ラビーウ・アッ＝サーニー月に、父の朗読によって私（サハーウィー）から『ブハーリーの三伝承者ハディース集（スラースィヤート）』を聴聞し、私は彼にイジャーザを与えた。
  en: Muḥammad b. ʿAbd al-ʿAẓīm b. Yaḥyā b. Aḥmad b. ʿAbd al-ʿAẓīm al-Khānkī. He was a young child. He heard from me (al-Sakhāwī), through his father's recitation, the Thulāthiyyāt of al-Bukhārī in Rabīʿ al-Thānī of the year 896, and I granted him an ijāza.
