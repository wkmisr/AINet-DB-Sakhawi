  ja: ヤフヤー・ブン・ウマル・ブン・アスラム。父と兄弟アフマドは既出。母は女奴隷であった。892年ジュマーダー第一月の上旬に没し、父の後わずかしか生きなかった。
  en: Yaḥyā b. ʿUmar b. Aṣlam; his father and his brother Aḥmad have been mentioned above. His mother was a slave woman. He died in the first days of Jumādā I 892, having outlived his father only briefly.
