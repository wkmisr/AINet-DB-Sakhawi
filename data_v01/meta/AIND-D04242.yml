  ja: アブド・アル＝カリーム・ブン・イブラーヒーム・ブン・アブド・アル＝カリーム・ブン・バラカ、カリーム・アッ＝ディーン・ブン・サアド・アッ＝ディーン・ブン・カリーム・アッ＝ディーン・アル＝キブティー・アル＝ミスリー。父は前述、祖父はまもなく後述。イブン・カーティブ・ジャカムとして知られる。848年ラビーウ・アル＝アウワル月に没した。
