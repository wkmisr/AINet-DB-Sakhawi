translation:
  ja: クワイル（無点のラーで、クールの縮小形）・ブン・アビー・サアド・ブン・ハーズィム・ブン・アブドゥルカリーム・アル＝ハサニー。844年ムハッラム月にジッダで没し、運ばれてマアラー墓地に葬られた。イブン・ファハドがその没年を記している。
  en: Kuwayr (with undotted rāʾ, a diminutive of Kūr) b. Abī Saʿd b. Ḥāzim b. ʿAbd al-Karīm al-Ḥasanī. He died in Muḥarram of the year 844 at Jidda, and was carried and buried at al-Muʿallā. Ibn Fahd dated his death.
