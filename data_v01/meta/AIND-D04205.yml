  note:
    ja: 父（الشمس محمد）の母方祖父＝医師 علم الدين（マルサファー出身。ニスバ المرصفي の由来）。「كان في خدمة القطبية صاحب المدرسة التي برأس حارة زويلة」の القطبية ＝ マドラサ al-Madrasa al-Quṭbiyya（#TMP-I-00009、ハーラト・ズワイラの入口）で、علم الدين はその学院に仕えた（Waka 判断 2026-09-08。初版・校閲初稿の「マドラサの主＝人物 القطبية」読みは退ける。「صاحب المدرسة …」はその学院を説明する句）。corpus に本伝なし → 新規 TMP-P-001035。曾祖父にあたるため subtype は relative。
states:
- id: s1
  type: office
  ref: TMP-O-00108
  quote: الطبيب
  note:
    ja: 「فدرب العلم ابن ابنته البدر في الطب ونشأ صاحب الترجمة كذلك حتى تميز ومشى للناس بعقل ودربة」。原文で علم الدين が医学を仕込んだ「ابن ابنته البدر」は父（الشمس）とラカブが食い違う（البدر／الشمس）が、本項主も同様に医師として育ったと読める。
translation:
  ja: アブド・アル＝カーディル・ブン・ムハンマド・ブン・ムハンマド、ムヒー・アッ＝ディーン・ブン・アッ＝シャムス・ブン・アル＝ジャラール。マルサファー出身の家系であるのは、父の母方の祖父である医師アラム・アッ＝ディーンが（同地出身で）、ハーラト・ズワイラの入口にあるマドラサ、アル＝クトビーヤ学院に仕えていたためである。（本項主の）祖父はアル＝カバービーとして知られ、アル＝ジャマーリー・アル＝ウスターダールに仕えていた。アラム・アッ＝ディーンは娘の息子アル＝バドルに医学を仕込み、本項主も同様に育って頭角を現し、理性と熟練をもって人々を診療した。
  en: ʿAbd al-Qādir b. Muḥammad b. Muḥammad, Muḥyī al-Dīn b. al-Shams b. al-Jalāl, of Marṣafā origin — because his father's maternal grandfather, the physician ʿAlam al-Dīn, (came from there and) was in the service of al-Quṭbiyya, the madrasa at the head of Ḥārat Zuwayla. His grandfather was known as al-Qabābī and was in the service of al-Jamālī the ustādār. ʿAlam al-Dīn trained his daughter's son al-Badr in medicine, and the subject of this entry grew up likewise, until he distinguished himself and treated people with sense and skill.
