notes:
- text: '「يأتي فيمن جده يوسف بن علي قريبا」＝転送見出し。転送先は #AIND-D04514（刊本第132項 عبد الله بن علي بن يوسف بن علي بن محمد بن البدر بن علي بن عثمان الجمال بن الإمام الرباني … النور أبي الحسن الدمشقي ثم القاهري الشافعي القادري الآتي أبوه ويعرف بابن أيوب وهو لقب لجده لكثرة بلاياه وربما ينسب له فيقال عبد الله بن علي بن أيوب）。同項本文が「ابن أيوب は祖父のラカブで、しばしば『عبد الله بن علي بن أيوب』と呼ばれる」と本見出しの形をそのまま説明しており、祖父 يوسف بن علي・11項後＝「قريبا」も一致。'
