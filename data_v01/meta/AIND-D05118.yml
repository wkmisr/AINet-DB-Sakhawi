translation:
  ja: アリー・ブン・ハサン・ブン・アリー・アル＝マハッリー・アル＝ハイサミー、のちアル＝カーヒリー、アル＝カスィール（短躯）。後述のシャイフ・ムハンマド・ブン・サーリフの従僕（ハーディム）で、スーフィー（フカラー）やその類の間では「カーティム・アッ＝スィッル（秘密を守る者）」として知られた。前記の人物への奉仕に専心し、名士たちのもとに出入りし、いくつかの職禄（ジハート）を得た。私（サハーウィー）の朗読によって幾人かのシャイフたちから聴聞し、さらに私自身から口述講義（イムラー）などにおいて聴聞した。
  en: ʿAlī b. Ḥasan b. ʿAlī al-Maḥallī al-Haythamī, then al-Qāhirī, al-Qaṣīr (the Short). He was the servant (khādim) of Shaykh Muḥammad b. Ṣāliḥ (mentioned below), and was known among the Sufis (fuqarāʾ) and their like as Kātim al-Sirr (the keeper of secrets). He devoted himself to the service of the aforementioned, frequented the notables, and obtained some stipendiary posts (jihāt). He heard from some shaykhs through my (al-Sakhāwī's) reading, and indeed heard from me in the dictation sessions (imlāʾ) and elsewhere.
