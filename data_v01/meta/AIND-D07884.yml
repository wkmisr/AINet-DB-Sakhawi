translation:
  ja: ムハンマド・ブン・アブドゥッラー・アル＝ミスリー、のちアル＝マッキー、医師、アル＝フダリー（点のある二字で、最初がダンマ、次がファトハ）として知られる。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及して言う、「彼は医学・錬金術・幻術（ナーランジヤート）・星学を業とし、マッカにしばらく隣住者として滞在した。私は（80）6年にそこで彼に会った。その後イエメンに入り、同地のスルターン・アン＝ナースィルが彼を厚遇した。アン＝ナースィルの侍医が彼に毒を仕込んで（80）8年に死んだと言われる。人々の噂では、彼は頭領（ラーイース）の商人アッ＝シハーブ・アル＝マハッリーに毒を仕込み、（80）6年末に彼を殺したという」。
  en: 'Muḥammad b. ʿAbd Allāh al-Miṣrī, then al-Makkī, the physician, known as al-Khuḍarī (with two dotted letters, the first with ḍamma and the second with fatḥa). Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: "He practised medicine, alchemy, illusionism (nāranjiyyāt) and astrology, and stayed in Mecca for a time as a mujāwir; I met him there in [80]6. Then he entered Yemen, and its sultan al-Nāṣir received him favourably. It is said that al-Nāṣir''s physician had him poisoned, and he perished in [80]8. People murmured that he had administered poison to the chief merchant al-Shihāb al-Maḥallī and killed him at the end of [80]6."'
