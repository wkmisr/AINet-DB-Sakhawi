translation:
  ja: ヤフヤー・ブン・アブドゥッラー、アラム・アッ＝ディーン・アル＝ミスリー、アブー・クンム。市場監督（ナザル・アル＝アスワーク）を務め、ついでアン＝ナースィル・ファラジュの治世にアル＝ファフル・ブン・グラーブに代わって宰相職に、ついでその兄弟サアド・アッ＝ディーン・ブン・グラーブに代わって（ナザル・）アル＝ハーッスに就き、同じくアル＝バドル・ブン・ナスル・アッラーより前に軍務監督（ナザル・アル＝ジャイシュ）にも就いたが、のち不遇となった。何度も巡礼を行い、一度マッカに滞留（ムジャーワラ）して、キリスト教からの離脱を表明し、義人たちへの参詣をさかんに行った。（8）35年ラマダーン月22日にカイロで没し、70歳を越えていた。そのイスラームは良好であった。我らがシャイフ（イブン・ハジャル）が『インバー』で、ここに記したより簡略に、彼に言及している。
  en: Yaḥyā b. ʿAbd Allāh, ʿAlam al-Dīn al-Miṣrī, Abū Kumm. He served as supervisor of the markets (naẓar al-aswāq), then was appointed to the vizierate in the reign of al-Nāṣir Faraj in place of al-Fakhr b. Ghurāb, then to the (supervision of the) privy purse (al-khāṣṣ) in place of the latter's brother Saʿd al-Dīn b. Ghurāb; he likewise held the supervision of the army (naẓar al-jaysh) before al-Badr b. Naṣr Allāh; then he fell into obscurity. He performed the pilgrimage more than once and sojourned in Mecca once, making a show of renouncing the Christian religion, and he frequently visited the righteous. He died on 22 Ramaḍān of the year [8]35 in Cairo, having passed seventy, and his Islam was good. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ, more briefly than here.
