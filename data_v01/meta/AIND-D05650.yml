translation:
  ja: アリー・ブン・マスウード・ブン・ムハンマド・ブン・アビール＝ファラジュ・アッ＝シャラフ・アル＝アブラクーヒー。アル＝カーディー・アブー・ナスルの外孫。ハジュラ暦745年ズル・カアダ月に生まれる。ハジュラ暦819年ジュマーダー・アル＝アーヒラ月にアブラクーにてアッ＝ターウースィーが彼に面会し、彼はアッ＝ターウースィーにイジャーザを授けた。
  en: ʿAlī b. Masʿūd b. Muḥammad b. Abī al-Faraj al-Sharaf al-Abraqūhī, the maternal grandson of al-Qāḍī Abū Naṣr. He was born in Dhu al-Qaʿdah 745 AH. Al-Ṭāwūsī met him in Abraqūh in Jumādā al-Ākhirah 819 AH and he (ʿAlī) granted him an ijāza.
