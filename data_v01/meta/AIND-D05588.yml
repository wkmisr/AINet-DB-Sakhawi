translation:
  ja: アリー・ブン・ムハンマド・ブン・ヤフヤー・ブン・ムスリフ・アル＝マンジリー、著名なアフマドの兄弟。アル＝マンジラ地方のミニヤト・ラーディーに住み、人々に崇敬され尊ばれた人物で、クルアーンを誦し、自らの信仰実践に関わる事柄を探究し、諸問題をよく心得ていた。巡礼を行った者の一人。郷里でズー・アル＝ヒッジャ月上旬、（年欠）年に没し、70歳を超えていた。
  en: ʿAlī b. Muḥammad b. Yaḥyā b. Muṣliḥ al-Manzilī, brother of the famous Aḥmad. He resided at Minyat Rāḍī in al-Manzila, revered and venerated, reciting the Qurʾān and inquiring into the matters of worship that concerned him, with a good command of the (legal) questions; he was among those who performed the pilgrimage. He died in his home town in the first ten days of Dhū al-Ḥijja of the year [blank], having passed seventy.
