translation:
  ja: ヤフヤー・ブン・ルーバク、アブー・ムハンマド。その時代のイエメンにおける文法学者たちの長。サヌアーで法学を修め、ついでタイッズに住みついた。諸王を詩で称え、彼らのもとで重きをなした。アラブの流儀で即興に詩を詠む人であった。（8）35年にワーディー・ザビードの椰子園（ナフル）で没し、そこに葬られた。アル＝アフィーフがこれを述べている。
  en: Yaḥyā b. Rūbak, Abū Muḥammad, the shaykh of the grammarians of his age in Yemen. He studied law in Ṣanʿāʾ and then settled in Taʿizz. He praised the kings and attained a position of eminence with them, and he followed the manner of the Arabs in improvising poetry. He died in the year [8]35 in the palm groves (nakhl) of Wādī Zabīd and was buried there. Al-ʿAfīf said this.
