translation:
  ja: イブラーヒーム・ブン・イーサー・ブン・イブラーヒーム・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ウマル・ブン・アブドゥッラフマーン・ブン・アブドゥッラー、アブー・イスハーク・アン＝ナーシリ。アル＝アフィーフが彼について述べた。「彼は善良で敬虔な人物で、諸学問に携わり、父親の清廉潔白、禁欲、そして高潔な品性といった生き方を踏襲していた」。ヒジュラ暦817年のタシュリークの月の3日目にアル＝カダラーで亡くなった。
  en: Ibrāhīm b. ʿĪsā b. Ibrāhīm b. Abī Bakr b. ʿAbd Allāh b. ʿUmar b. ʿAbd al-Raḥmān b. ʿAbd Allāh, Abū Isḥāq al-Nāshirī. Al-ʿAfīf mentioned him, saying, 'He was a good, righteous man, participating in various sciences, and following his father's path in abstinence, asceticism, and noble character.' He died on the third of the Days of Tashrīq in the year 817 H in al-Kadarā.
