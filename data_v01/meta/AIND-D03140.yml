translation:
  ja: スライマーン・ブン・ジャーラッラー・ブン・ザーイド・アッ＝スンブスィー・アル＝マッキー。788年に、アル＝アフィーフ・アン＝ナシャーワリー、イブン・ハーティム、アル＝イラーキー、アル＝ハイサミー、イブン・アラファ、イブン・ハルドゥーンらが彼にイジャーザを与えた。（8）37年シャウワール月にマッカの外で没し、運ばれてアル＝マアラーに葬られた。イブン・ファハドがその没年を記している。
  en: Sulaymān b. Jār Allāh b. Zāʾid al-Sunbusī al-Makkī. In the year 788 al-ʿAfīf al-Nashāwarī, Ibn Ḥātim, al-ʿIrāqī, al-Haythamī, Ibn ʿArafa, Ibn Khaldūn and others granted him ijāza. He died in Shawwāl [8]37 outside Mecca; he was carried [back] and buried at al-Maʿlāh. Ibn Fahd recorded the date of his death.
