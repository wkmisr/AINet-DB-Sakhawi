notes:
- text: '「أظنه ابن الإمام الآتي فيمن لم يسم أبوه」＝転送見出し（D04395「يأتي فيمن لم يسم أبوه فأظن أنه …」と同型）。転送先は #AIND-D03891（عبد الرحيم بن الامام الحنفي زين الدين أحد النواب、項番481、没845）。D03891 本文でサハーウィーは شيخنا（イブン・ハジャル）の記述を引いて「عبد الرحيم بن محمد بن أبي بكر الرومي الحنفي زين الدين نائب الحكم」と本項の見出しナサブをそのまま挙げ、「وما أظنه إلا ابن الامام」と同一視するが、両項とも أظن による推測のため cert medium。父 محمد بن أبي بكر الرومي الحنفي（TMP-P-000890）は D03891 受領時に同項へ付す。'
