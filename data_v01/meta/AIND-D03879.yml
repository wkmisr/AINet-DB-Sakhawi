translation:
  ja: アブドゥッラヒーム・ブン・ムハンマド・ブン・アビー・バクル・アッ＝ルーミー・アル＝ハナフィー。私は、彼が、後に父親の名前が挙げられていない人物の章で言及される「シャイフ（イマーム）」の息子（イブン・アル＝イマーム）ではないかと思う。
  en: ʿAbd al-Raḥīm b. Muḥammad b. Abī Bakr al-Rūmī al-Ḥanafī. I think he is Ibn al-Imām (the son of the Imam), who is mentioned below under those whose father was not named.
