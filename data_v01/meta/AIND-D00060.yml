translation:
  ja: イブラーヒーム・ブン・イスマーイール・ブン・イブラーヒーム・ブン・グナイム、ブルハーン・アッ＝ディーン・ブン・イマード・アッ＝ディーン・アッ＝バアリー。彼は763年にカリーム・イブナト・マアバドから『サヒーフ』のイブン・タイミーヤによる選集100箇所を聴講した。彼女は「私はアル＝ハッジャールから(聴いた)」と言った。アッ＝サラーフ・ブン・アビー・ウマル、アッ＝シハーブ・アフマド・ブン・アブド・アル＝カリーム・アル＝マアリーらが彼に(伝承)許可を与えた。彼はハディースを伝え、ハーフィズ・イブン・ムーサーが彼に会い、バヌー・ファハドらのために(伝承)許可を求めた。私たちの師であるアル＝ムワッファク・アル＝アビーらが彼から(ハディースを)聴講した。アン＝ナجم・ウマルが自身の『ムアジャム』(伝承師名簿)および父親の『ムアジャム』に彼を記載している。私たちの師(=イブン・ハジャル・アル=アスカラーニー)も同様に述べ、自身の『ムアジャム』の第二部に彼を記載している。「彼は私の子供たちに(伝承)許可を与えた」と。
  en: 'Ibrāhīm b. Ismāʿīl b. Ibrāhīm b. Ghunaym, Burhān al-Dīn b. ʿImād al-Dīn al-Baʿlī. In the year 763, he heard from Kalīm Ibnat Maʿbad the hundred selections from the *Ṣaḥīḥ* chosen by Ibn Taymiyya. She said, "I (heard from) al-Ḥajjār." Al-Ṣalāḥ b. Abī ʿUmar, al-Shihāb Aḥmad b. ʿAbd al-Karīm al-Maʿlī, and others granted him license (to transmit). He transmitted hadith; al-Ḥāfiẓ Ibn Mūsā met him and requested license from him for the Banū Fahd and others. Our shaykh al-Muwaffaq al-Abī and others heard (hadith) from him. Al-Najm ʿUmar included him in his *Muʿjam* (lexicon of teachers) and in his father''s *Muʿjam*. Our shaykh (Ibn Ḥajar al-ʿAsqalānī) said similarly and mentioned him in the second part of his *Muʿjam*: "He granted license to my children."'
