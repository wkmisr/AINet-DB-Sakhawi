translation:
  ja: アブドゥッラー・アッ＝サフーリー・アル＝マッキー。祝福された人々の一人で、同地（マッカ）のリバート・ラビーウに籠って世を離れていた。860年サファル月に同地で没した。イブン・ファハドがその没年を記録している。
  en: ʿAbd Allāh al-Saḥūlī al-Makkī, one of the blessed men, who lived in seclusion at Ribāṭ Rabīʿ there [in Mecca]. He died there in Ṣafar of the year 860. Ibn Fahd recorded his death date.
