translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ユースフ・ブン・ハッジャージュ・ブン・クライシュ、アッ＝シャムス・アル＝マフズーミー・アル＝カーヒリー・アッ＝シャーフィイー。我らがシャイフ（イブン・ハジャル）の従者で、イブン・クライシュとして知られる。クルアーンを読誦する老師。我らがシャイフに密着して、彼の口述（イムラー）や、『アル＝ムカッディマ』『バズル・アル＝マーウーン』などその他の著作を書写することを望み、一同とともに彼のもとでそれらを校合した。ラマダーン月には彼の会合に欠かさずやって来たばかりか、毎夜、祈祷用の敷物などを敷き、蝋燭を整えるために通った。イエメン地方などの土地に詳しかったので、おそらくそこに入り、巡礼し、タワーフを行ったのであろう。私の思うところ、彼は（8）60年以後に没し、70に近づいていた。
  en: Muḥammad b. ʿAbd Allāh b. Yūsuf b. Ḥajjāj b. Quraysh, al-Shams al-Makhzūmī al-Qāhirī al-Shāfiʿī, the servant of our shaykh (Ibn Ḥajar), known as Ibn Quraysh; a shaykh who recited the Qurʾān. He sought to attend closely upon our shaykh in writing down his dictations and his other works, such as al-Muqaddima and Badhl al-māʿūn, and collated them with the group before him. He never failed to come to his session in Ramaḍān, and indeed every night, to spread the prayer rug and the like and to trim the candle. He had knowledge of the lands of Yemen and similar places, so it seems he had entered them, performed the pilgrimage and circumambulated. I think he died after [8]60 and was approaching seventy.
