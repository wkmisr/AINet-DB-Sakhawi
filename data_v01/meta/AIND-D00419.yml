translation:
  ja: アフマド・イブン・イブラーヒーム・イブン・アフマド・イブン・サービト、ラカブはアッ＝シハーブ、ニスバはアン＝ナーブルスィー。彼の父は先に言及された。彼は成長し、ミンハージュとジャムウ・アル＝ジャワーミウ、そしてイブン・マーリクのアルフィーヤを暗記し、アッ＝ザイン・ハッターブらに提示した。またアブー・アル＝アズム・アル＝ハラーウィーの下でアラビア語学に精を出し、ハッターブとアン＝ナジュム・イブン・カーディー・アジュルーンに師事した。彼は美しい容貌と共に自制心を保って育った。彼の父が代理官職に就くと、彼自身はダマスクスのスルタン代理人となり、その任務において、ダマスクスの副官以下が彼に口出しできないほどに権勢を振るい、父に匹敵するほど、あるいは財貨収集などにおいては父を凌ぐこともあった。だが、父が捕縛される数日前、彼も捕縛され、鉄の鎖に繋がれ、殴打などによって計り知れないほどの財産が没収された。そして882年ラビーウ・アル＝アーヒル月に死去した。自ら腹を刺して25歳に満たずに亡くなったとも言われている。
  en: Ahmad b. Ibrāhīm b. Aḥmad b. Thābit, al-Shihāb al-Nābulusī. His father was mentioned previously. He grew up, memorized Minhāj al-Ṭālibīn, Jamʿ al-Jawāmiʿ, and Ibn Mālik's Alfiyya. He presented these works to al-Zayn Khaṭṭāb and others. He studied Arabic under Abū al-ʿAzm al-Ḥalāwī and closely associated with Khaṭṭāb and al-Najm b. Qāḍī ʿAjlūn. He was raised with modesty and a handsome countenance. When his father settled into the deputyship, he himself became the Sultan's deputy in Damascus. His influence in this role became so pronounced that neither the deputy of Damascus nor anyone below him could gainsay him, and he rivaled his father, even surpassing him in collecting wealth and other matters. However, a few days before his father's capture, he was seized, imprisoned in iron, and an incalculable amount of wealth was extracted from him through beating and other means. He died during Rabīʿ al-Ākhir in the year 882 AH. It was also said that he stabbed himself and did not reach twenty-five
    years of age.
