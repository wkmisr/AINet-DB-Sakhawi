translation:
  ja: アブド・アッ＝ラティーフ・ブン・ヒバト・アッラー・ブン・ムハンマド、ザヒール・アッ＝ディーン・ブン・アルシャド・アッ＝ディーン・ブン・ヌール・アッ＝ディーン・アル＝バクリー・アル＝カトキー・アッ＝シーラーズィー、マッカ寓居の人。アッ＝ターウースィーは「私は800年より前に彼のもとでクルアーンと諸学の入門書を読み、彼は私にイジャーザを与えた」と述べている。彼はシーラーズからマッカへ移り、そこに滞在して830年に没した。（アッ＝ターウースィーは）彼を大いに尊んだ。
  en: 'ʿAbd al-Laṭīf b. Hibat Allāh b. Muḥammad, Ẓahīr al-Dīn b. Arshad al-Dīn b. Nūr al-Dīn al-Bakrī al-Katakī al-Shīrāzī, resident of Mecca. Al-Ṭāwūsī said: "I read to him the Qurʾān and the introductory texts of the sciences before the year 800, and he granted me ijāza." He moved from Shīrāz to Mecca and sojourned there until he died in the year [8]30; and he (al-Ṭāwūsī) held him in high esteem.'
