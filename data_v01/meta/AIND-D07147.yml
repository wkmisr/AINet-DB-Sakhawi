translation:
  ja: ムハンマド・ブン・アイユーブ・ブン・アブド・アル＝カーディル・ブン・アビー・アル＝バラカート・ブン・アビー・アル＝ファトフ、アル＝バドル、ハナフィー派。我らがシャイフ（イブン・ハジャル）が『インバー』の（8）05年の項で彼に言及し、彼のために空欄を残したが、彼は（『インバー』の）収録条件に該当しない。というのも彼の没年は705年であって805年ではなく、また彼の祖父は（アブド・アル＝カーディルではなく）アブド・アル＝カーヒルだからである。
  en: Muḥammad b. Ayyūb b. ʿAbd al-Qādir b. Abī al-Barakāt b. Abī al-Fatḥ, al-Badr, the Ḥanafī. Our shaykh (Ibn Ḥajar) mentioned him under the year (8)05 of his Inbāʾ and left a blank for him, but he does not fall within its scope, for his death was in fact in 705, not 805, and his grandfather was ʿAbd al-Qāhir, not ʿAbd al-Qādir.
