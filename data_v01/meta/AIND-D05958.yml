translation:
  ja: ウマル・ブン・ムハンマド・ブン・ウスマーン、アッ＝シラージュ、アル＝フスバーニー。威厳ある人物として言及される。アブー・アッ＝サアーダート・アル＝ブルキーニーは彼を「シャイフ、イマーム」と評し、本項主が（8）25年に自分を連れてタワーフを一巡（7周）したと述べている。
  en: ʿUmar b. Muḥammad b. ʿUthmān, al-Sirāj al-Ḥusbānī. He is mentioned as a man of dignity. Abū al-Saʿādāt al-Bulqīnī described him as "the shaykh, the imām" and stated that the subject carried him around in a full circuit (usbūʿ) of ṭawāf in the year (8)25.
