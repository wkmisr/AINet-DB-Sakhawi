translation:
  ja: ムハンマド・ブン・アッ＝タキー・アビー・バクル・ブン・アッ＝シャイフ・アッ＝サーリフ・ムハンマド・ブン・アリー・ブン・ジュムア、アル＝ハラビー・アッ＝シャーフィイー、クルアーン読誦師。『ハトム・アル＝ブハーリー』と『アル＝カラーム・アラー・アル＝ミーザーン』──いずれも私の著作──を、彼自身の手による写本2部から私に朗読し、私は彼にイジャーザを与えた。
  en: Muḥammad b. al-Taqī Abī Bakr b. al-Shaykh al-Ṣāliḥ Muḥammad b. ʿAlī b. Jumʿa al-Ḥalabī al-Shāfiʿī, the Qurʾān reciter. He read to me 'Khatm al-Bukhārī' and 'al-Kalām ʿalā al-Mīzān', both of my own composition, from two copies in his own hand, and I granted him an ijāza.
