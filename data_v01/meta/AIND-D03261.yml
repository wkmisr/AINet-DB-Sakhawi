translation:
  ja: シャーズ・バク・ミン・スィッディーク・アル＝アシュラフィー・バルスバーイ。スルターン造営事業の監督官（シャーッド・アル＝アマーイル・アッ＝スルターニーヤ）で、バルドバク・アル＝ムハンマディー・アッ＝タウィールの後任として十人長の一人となった。アル＝アシュラフ・カーイトバーイがアミール職などに引き上げた者の一人で、幾度も遠征に出た。
  en: Shādh Bak min Ṣiddīq al-Ashrafī Barsbāy, superintendent of the royal buildings (shādd al-ʿamāʾir al-sulṭāniyya) and one of the amirs of ten, in place of Bardbak al-Muḥammadī al-Ṭawīl. He was among those whom al-Ashraf Qāytbāy promoted to an amirate and other posts, and he went out on expeditions more than once.
