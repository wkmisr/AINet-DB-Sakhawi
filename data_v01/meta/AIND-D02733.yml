translation:
  ja: フサイン・ブン・アビー・ファーリス・アブド・アル＝アズィーズ・アル＝ハフスィー。イマーム、大学者、ムフティーにしてアミール、「ムスリムたちの司令官（アミール・アル＝ムスリミーン）」〔＝ハフス朝君主〕の息子。兄弟の息子（甥）が〔フサインの〕父の後を継いで王位に就くと、彼はこれに対する反乱を企てたが、甥は彼を捕らえて殺し、彼の二人の兄弟も殺した。フサインの殺害による災いは甚大で、それは839年のことであった。彼は優れた人物で、討論に長け、聡明であった。「我らの友ザイン・アブド・アッ＝ラフマーン・アル＝バルシャキーが私に彼のことを語った」——以上はわがシャイフ（イブン・ハジャル）が『インバー〔・アル＝グムル〕』で述べたものである。
  en: Ḥusayn b. Abī Fāris ʿAbd al-ʿAzīz al-Ḥafṣī, the imam, the eminent scholar, the mufti, the amir, son of the Commander of the Muslims [the Ḥafṣid ruler]. He sought to rise against his brother's son when the latter was established in the kingdom after his [Ḥusayn's] father; the nephew seized him, killed him, and killed two of his brothers as well. The calamity of Ḥusayn's killing was immense; that was in the year 839 AH. He was accomplished, a skilled disputant, and intelligent. 'Our companion al-Zayn ʿAbd al-Raḥmān al-Barashkī mentioned him to me' — thus our shaykh (Ibn Ḥajar) in his Inbāʾ [al-Ghumr].
