translation:
  ja: バルドバク・アル＝ムハンマディー・アル＝タウィール。アル＝アシュラフ・バルスバーイの従兄弟。10人長のアミール（アミール・アシャラ）に任じられ、ヒジュラ暦889年にアシュラフィーヤのワクフ管理官（シャード）を務めた。彼のアミール職は息子のシャーズバク・ミン・サディークが、ワクフ監督職（シャーディーヤ）はカーンスーフ・アッ＝タウィール・アル＝アシュラフィー・バルスバーイが、それぞれ引き継いだ。
  en: Bardbak al-Muḥammadī al-Ṭawīl, the cousin of al-Ashraf Barsbāy. He was appointed as an emir of ten and served as the supervisor (shādd) of the endowments of the Ashrafiyya in the year 889 AH. His son Shādhbak succeeded him in his emirate, and Qānṣūh al-Ṭawīl al-Ashrafī Barsbāy succeeded him in the supervisorship (shādiyya).
