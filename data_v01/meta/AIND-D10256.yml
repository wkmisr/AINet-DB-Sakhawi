translation:
  ja: ヤフヤー・ブン・アブドゥッラー、アッ＝シャラフ・ブン・サアド・アッ＝ディーン。書記で、軍務庁（ディーワーン・アル＝ジャイシュ）の長。ユースフとイブラーヒームの父、アブド・アル＝ガニーの兄弟で、イブン・ビント・アル＝マリキーとして知られる。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及してこう述べている。「（8）41年ズー・アル＝カアダ月にペストで没し、50歳に満たなかった」。彼の職には、兄弟が彼の二人の息子と共同で就いた。
  en: 'Yaḥyā b. ʿAbd Allāh, al-Sharaf b. Saʿd al-Dīn, the secretary, head of the army bureau (ṣāḥib dīwān al-jaysh), father of Yūsuf and Ibrāhīm and brother of ʿAbd al-Ghanī, known as Ibn Bint al-Malikī. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: "He died in Dhū al-Qaʿda of the year [8]41 of the plague, not having completed fifty years." His brother was installed in his post jointly with his two sons.'
