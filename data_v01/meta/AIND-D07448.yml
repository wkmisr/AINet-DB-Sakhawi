translation:
  ja: ムハンマド・ブン・スライマーン・ブン・ハンマード、アッ＝シャムス、アッ＝サカンダリー（アレクサンドリア人）、シャーフィイー派。「イブン・ハンマード」として知られる。相続法（ファラーイド）と算術に卓越しており、この二つをアッ＝シャムス・ジュナイバートから取得した。また礼拝時刻学（ミーカート）および公証文書学（シュルート）を、自分の師であるアッ＝シャムスの息子シャアバーンから取得し、これらで生計を立てた。サフワーン・モスクで職務に従事し、さらにそこで『ブハーリー（サヒーフ）』を読誦した。善良な人物で、ハッジを行いマッカに滞在（ムジャーワラ）した後、帰還したが、自宅に到着するや否や没した。それは875年ジュマーダー・アル＝アーヒラ月の朔日であった。神よ彼に慈悲を。
  en: Muḥammad b. Sulaymān b. Ḥammād, al-Shams al-Sakandarī al-Shāfiʿī, known as Ibn Ḥammād. He excelled in the law of inheritance and in arithmetic, both of which he took from al-Shams Junaybāt; and he took the science of timekeeping (mīqāt) as well as notarial drafting (shurūṭ) from Shaʿbān, the son of al-Shams, his teacher, and earned his living by them. He held a post in the Ṣafwān Mosque, and indeed used to read al-Bukhārī there. He was a good man; he performed the pilgrimage and sojourned (in Mecca), then returned, and died the moment he reached his home, at the beginning of Jumādā al-Ākhira of the year 875; may God have mercy on him.
