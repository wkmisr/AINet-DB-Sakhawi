  note:
    ja: '「أخو الشمس محمد الآتي لأبيه」＝同父異母の兄弟 #AIND-D08351「محمد بن عمر بن محمد بن أحمد بن عزم الشمس أبو عبد الله التميمي التونسي ثم المكي المالكي … ويعرف بابن عزم」（生816チュニス。サハーウィーが没年情報源として多用する「ابن عزم」本人）。初版の汚染番号 TMP-P-000063（登録＝AIND-D0031 の兄弟 الشمس محمد＝別実体）を差し替え。'
