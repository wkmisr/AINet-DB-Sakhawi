    ja: '父＝#AIND-D05937「عمر بن محمد بن أحمد بن محمد أبو حفص التميمي الداري التونسي والد الشمس محمد نزيل مكة ويعرف بابن عزم」（846年チュニス没）。ナサブ3代・عزم・التميمي が一致（規則37）。ニスバ索引 #AIND-D12540「ابن عزم … عمر بن محمد بن أحمد وابنه محمد وابنه محمد」。初版は father relation 欠落。'
