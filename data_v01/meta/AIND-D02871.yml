    ja: '829-01-21＝1425-12-12（h2g.py、月曜）。初版 @when="1426" は誤年（829年ムハッラムは1425年12月）・年精度。「بالحمام」（浴場で）は固有の地名でないので placeName にしない。埋葬地 الصحراء＝TMP-L-00289（カイロ北墓地、頻出確定ID。初版 #NEEDID を置換）。初版の没地 القاهرة（原文になし、ニスバ الأزهري からの補完）を除去（規則22(1)）。 / 「بالجامع」は照応代名詞でも固有名でもない（規則22(1)・26）＝ref なし。文脈上は الأزهر（wd:Q312342、ニスバ الأزهري・隠遁の場）を指すとも読めるが候補に留める。【集約 2026-11-05】校閲の wd:Q312342 cert medium を外した（内容A L、決定6）。隠遁 event n=1 の「انقطع به」（به の照応、ニスバのみが先行詞＝B149-153 D08129 の扱い）の cert medium は維持（§D154-3）。 / 葬儀（صلاة الجنازة 等）は出来事にしない規則（アプリ v20.2）により、event subtype="funeral" から死亡の欄に移した。場所は type="funeral"、人物は role="funeral_prayer"／"funeral_attendee"（Waka 裁定 2026-11-22）'
