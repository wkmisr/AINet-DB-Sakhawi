translation:
  ja: ハリーファ、アル＝マグリビー、のちアル＝アズハリー。人々に崇敬されたシャイフで、そこ（アズハル）に籠って40年余り礼拝に専心した。829年ムハッラム月21日に浴場で急逝し、ジャーミウで葬礼が行われ、サフラー（砂漠墓地）に埋葬された。彼のもとには多くの財が見つかった。尊敬され畏敬され、きわめて慎み深い人物であった。神が彼に慈悲を垂れるように。
  en: Khalīfa al-Maghribī, then al-Azharī. A venerated shaykh who secluded himself there for worship for forty-odd years. He died suddenly in the bathhouse on the 21st of Muḥarram of the year 829; the funeral prayer was performed over him at the mosque, and he was buried in the Ṣaḥrāʾ (desert cemetery). A great deal of property was found to be his. He was respected and held in awe, and extremely modest. May God have mercy on him.
