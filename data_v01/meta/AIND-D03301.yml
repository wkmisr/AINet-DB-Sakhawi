translation:
  ja: シャラバシュ・ブン・アブドゥッラー・ブン・アリー・ブン・ジャサール・ブン・アブドゥッラー・ブン・ウマル・ブン・マスウード・アル＝ウマリー。彼は860年ジュマーダー・アッ＝サーニヤ（第2ジュマーダー月）にマッカ（メッカ）の郊外で没し、マッカへと運ばれてそのマアラー墓地に埋葬された。イブン・ファハドが彼の没年を記録している。なお、彼の名は2つの点付き文字（シーン）と3つのファトハで綴られる（＝シャラバシュ）。
  en: Sharabash b. ʿAbd Allāh b. ʿAlī b. Jasār b. ʿAbd Allāh b. ʿUmar b. Masʿūd al-ʿUmarī. He died in Jamādā al-Thāniya, in the year 860, outside Mecca, and was carried and buried in its al-Muʿallā cemetery. Ibn Fahd recorded his biography. His name is spelled with two dotted letters [shīn] and three fatḥas (i.e. Sharabash).
