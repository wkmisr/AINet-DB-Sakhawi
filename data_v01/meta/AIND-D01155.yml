translation:
  ja: アフマド・ブン・アッ＝シャラフ・イーサー・アル＝カイマリー・アル＝ハリーリー・アル＝ガッズィー。756年生まれ。多くを聴聞し、ハディースを伝え・語り、そして我々（＝サハーウィー）にイジャーザを与えた。イブン・アビー・ウザイバがこれを述べた。
  en: Aḥmad b. al-Sharaf ʿĪsā al-Qaymarī al-Khalīlī al-Ghazzī. Born in 756 AH. He listened much, transmitted and narrated ḥadīth, and granted us (al-Sakhāwī) ijāza. Ibn Abī ʿUdhayba said this.
