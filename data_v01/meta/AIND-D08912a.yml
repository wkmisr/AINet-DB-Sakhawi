translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アフマド・ブン・アブド・アル＝アズィーズ・ブン・アル＝カースィム、ジャマール〔・ッディーン〕・アブー・ル＝マハーミド・イブン・アル＝ワラウィー・アビー・アブドゥッラー・アル＝ハーシミー・アル＝ウカイリー・アン＝ヌワイリー・アル＝マッキー、マーリク派。前項〔アミーン・アブー・ル＝ヤマン〕の従弟で、後出のアブー・アブドゥッラー・ムハンマドの父。母はアーイシャ・ビント・アリー・ブン・アブド・アル＝アズィーズ・ブン・アブド・アル＝カーフィー・アッ＝ダクーキー。マッカに生まれ育ち、ナジュム・アル＝マルジャーニー、タキー・アル＝ファースィー、ジャマール・アル＝ムルシディー、イブン・アル＝ジャザリーらから聴聞し、アーイシャ・ビント・イブン・アブド・アル＝ハーディー、アブド・アル＝カーディル・アル＝ウルマウィー、イブン・トゥールーブガーら多数がイジャーザを与えた。幾度もカイロに入り、同地でザイン・ウバーダの講席に出席した。父の代理としてカーディー職とマーリク派マカームのイマーム職を務め、次いでイマーム職の半分を独立して得、次いで罷免され、次いで復職し、853年ラビーウ第1月23日金曜の朝に没するまで在職した。彼が保持していたイマーム職には息子が就いた。神が彼を憐れみたまえ。
  en: Muḥammad b. Muḥammad b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz b. al-Qāsim, al-Jamāl Abū al-Maḥāmid Ibn al-Walawī Abī ʿAbd Allāh al-Hāshimī al-ʿUqaylī al-Nuwayrī al-Makkī al-Mālikī, cousin (ibn ʿamm) of the preceding entry and father of Abū ʿAbd Allāh Muḥammad (below). His mother was ʿĀʾisha bt. ʿAlī b. ʿAbd al-ʿAzīz b. ʿAbd al-Kāfī al-Daqūqī. Born and raised in Mecca, he heard from al-Najm al-Marjānī, al-Taqī al-Fāsī, al-Jamāl al-Murshidī, Ibn al-Jazarī and others; ʿĀʾisha bt. Ibn ʿAbd al-Hādī, ʿAbd al-Qādir al-Urmawī, Ibn Ṭūlūbughā and many others gave him ijāza. He entered Cairo several times and attended the session of al-Zayn ʿUbāda there. He deputised for his father as judge and as imam at the Mālikī station, then held half the imamate independently, was dismissed, then reinstated until he died on the morning of Friday 23 Rabīʿ I 853; his son succeeded to the imamate he held.
