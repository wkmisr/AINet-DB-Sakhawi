translation:
  ja: ムハンマド・ブン・アル＝ジュナイド・ブン・アフマド・ブン・ムハンマド・ブン・ウマル・ブン・ムハンマド・ブン・ウマル、アン＝ヌール・ブン・アビー・アル＝カースィム、アル＝カーザルーニー、バリヤーン出身、アッ＝シーラーズィー。その父は前述、その祖父は第8（世紀の部）に記されている。848年、東方の王の使節としてカアバの覆布（キスワ）を携えてカイロに来た。フサイン・アル＝ファトヒーに伴われて我らのシャイフ（イブン・ハジャル）と面会し、彼のために『アズカール（祈願句）に関する一部』と、イブン・アル＝ジャザリーが編んだ父のマシュヤハ（師承録）の訂正に関する一部を著した。（イブン・ハジャルは）彼に自分からの伝承を許可し、（彼は）「アッラーマ（大学者）」と評された。
  en: Muḥammad b. al-Junayd b. Aḥmad b. Muḥammad b. ʿUmar b. Muḥammad b. ʿUmar, al-Nūr b. Abī al-Qāsim, al-Kāzarūnī, of Balyānī origin, al-Shīrāzī. His father has been mentioned above and his grandfather is recorded in the eighth [century]. He came to Cairo in the year 848 as an envoy of the King of the East, bringing the covering of the Kaʿba. He met our shaykh (Ibn Ḥajar) in the company of Ḥusayn al-Fatḥī and composed for him a fascicle on the adhkār and another on the correction of his father's mashyakha compiled by Ibn al-Jazarī. He (Ibn Ḥajar) authorised him to transmit on his authority, and he was described as al-ʿAllāma.
