translation:
  ja: ムハンマド・ブン・ウスマーン・ブン・ユースフ、アッ＝シャムス、アル＝アースィフィー、のちアル＝カーヒリー、アル＝アズハリー、アッ＝シャーフィイー。アズハルのリワーク・アッ＝ラヤーファのシャイフ。アル＝アースィフィーとして知られる。イブラーヒーム・アル＝アドカーウィーからズィクルを伝授され、彼にターキーヤ（帽子）を着せられ、許可を与えられた——私が彼（本項主）の自筆で読んだとおりである。さらにアル＝カマール・イブン・ハイルから『シファー』を聴聞し、同じくナースィル・アッ＝ディーン・アル＝ファークースィーとアーイシャ・アル＝キナーニーヤらからも聴聞した。学問に励み、サイード・アッ＝スアダー（ハーンカー）のスーフィーの一人で、祝福された善良な人であった。私は彼にしばしば会い、彼からズィクルを伝授された。思うに70歳を超えて、（8）74年シャアバーン月に、しばらく病みシャイフ職から身を退いたのちに没した。神よ彼と我らを憐れみ給え。
  en: Muḥammad b. ʿUthmān b. Yūsuf, al-Shams, al-ʿĀṣifī, then al-Qāhirī, al-Azharī, al-Shāfiʿī, shaykh of the Riwāq al-Rayyāfa at al-Azhar, known as al-ʿĀṣifī. He received the dhikr from Ibrāhīm al-Adkāwī, who invested him with the ṭāqiya and authorized him, as I read in his own hand; moreover he heard al-Shifāʾ from al-Kamāl b. Khayr, and likewise heard from Nāṣir al-Dīn al-Fāqūsī, ʿĀʾisha al-Kināniyya and others. He studied and was one of the Sufis of Saʿīd al-Suʿadāʾ, a blessed and good man. I met him often and received the dhikr from him. He died, having passed seventy I think, in Shaʿbān of the year [8]74, after a period of illness and after withdrawing from the shaykhship. May God have mercy on him and on us.
