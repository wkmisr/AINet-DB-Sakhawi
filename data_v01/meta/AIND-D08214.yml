notes:
- text: '転送見出し（原文「فيمن جده أحمد بن هبة الله」による）。転送先は #AIND-D08007「399 محمد بن علي بن أحمد بن هبة الله الأموي السكندري ابن أخي الجمال محمد بن أحمد بن هبة الله … ويعرف بابن البوري . ولد في رمضان سنة أربع وعشرين وسبعمائة … وذكره المقريزي في عقوده فقال : محمد بن علي بن هبة الله … ومات بالثغر سنة اثنتين」。ナサブ（محمد بن علي بن [أحمد بن] هبة الله）と祖父 أحمد بن هبة الله が一致し、D08007 本文中の المقريزي の表記「محمد بن علي بن هبة الله」が本見出しの短縮形と同じ。corpus で「محمد بن علي」＋「هبة الله」の見出しは D08007 と本項のみ（hw.py）。ブリーフの候補番号と一致（規則60(h) で本文を確認）。'
  type: reference
- text: 初版の grandfather relation（#NEEDID）・name_only は REF のため除去（REF には実伝由来要素を置かない）。
