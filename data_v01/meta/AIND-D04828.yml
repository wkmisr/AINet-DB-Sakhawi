translation:
  ja: アティーク・ブン・アティーク・ブン・カースィム、アブー・バクル、アル＝カラーイー。グラナダのハティーブ（説教師）にして同地の文法学者。852年ズー・ル＝カアダ月22日に没した。イブン・アズムが彼の没年を記録している。
  en: ʿAtīq b. ʿAtīq b. Qāsim, Abū Bakr, al-Kalāʿī, the preacher (khaṭīb) of Granada and its grammarian. He died on 22 Dhu al-Qaʿda 852. Ibn ʿAzm recorded his death date.
