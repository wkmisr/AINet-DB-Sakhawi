translation:
  ja: アブドゥルカーディル・ブン・アル＝シャイフ・アル＝クドワ・イブラーヒーム・ブン・アル＝シャイフ・アル＝クドワ・アル＝カビール・アル＝シャヒール・アブー・バクル・ブン・ムハンマド・ブン・アブー・バクル、モースル出自、ダマスクス在住、シャーフィイー派。本人の自筆によれば、ヒジュラ暦788年に誕生した。『サヒーフ・アル＝ブハーリー』と『ダーリミーの三ハディース（スラースィイヤート）』をアーイシャ・ビント・イブン・アブドゥルハーディーから聴聞した。ヒジュラ暦808年には預言者の町マディーナにてアブー・アブドゥッラー・ムハンマド・アル＝マグリビーに面会して彼からハディースを聴聞し、のちに伝承した。父の後を継ぎ、極めて善良な人物であった。私（サハーウィー）にイジャーザ（伝承認可）を与えてくれた。ヒジュラ暦862年のムハッラム月半ばに逝去した。神が彼と我らを慈しまんことを。
  en: Abd al-Qadir b. al-Shaykh al-Qudwa Ibrahim b. al-Shaykh al-Qudwa al-Kabir al-Shahir Abu Bkhr b. Muhammad b. Abu Bakr, of Mosul origin, of Damascus, al-Shafi'i. He was born, as I read in his own handwriting, in the year 788 AH. He heard al-Sahih (Sahih al-Bukhari) and the Thulathiyyat of al-Darimi from Aisha bint Ibn Abd al-Hadi. In the year 808 AH, he met Abu Abd Allah Muhammad al-Maghribi in Medina, heard hadith from him, and transmitted it. He succeeded his father and was one of the best of people. He granted me (al-Sakhawi) an ijaza. He died in the middle of Muharram in the year 862 AH. May Allah have mercy on him and on us.
