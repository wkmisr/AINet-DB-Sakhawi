translation:
  ja: アリー・ブン・ムハンマド、ヌール・アッ＝ディーン、朗誦学者（アル＝ムクリー）、イブン・アル＝カースィフ。我らがシャイフ（イブン・ハジャル）は『インバー』でこのように記したが、正しくはウスマーン・ブン・ムハンマド・ブン・アフマドの子で、既述。
  en: ʿAlī b. Muḥammad, Nūr al-Dīn, the reader (al-muqriʾ), Ibn al-Qāṣiḥ. Thus our shaykh (Ibn Ḥajar) named him in his Inbāʾ, but correctly he is (ʿAlī) b. ʿUthmān b. Muḥammad b. Aḥmad, already mentioned.
