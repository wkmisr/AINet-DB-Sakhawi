notes:
- text: '「صوابه ابن عثمان بن محمد بن أحمد وقد مضى」＝誤名（イブン・ハジャル『إنباء الغمر』の表記）の転送見出し。転送先は #AIND-D05281（علي بن عثمان بن محمد بن أحمد نور الدين أبو البقاء العذري المقرئ ويعرف بابن القاصح、生716）。ラカブ・通称・職能（المقرئ）が一致する唯一の項。※「كذا ذكره شيخنا في إنبائه」は誤名の典拠であり本項主への言及 event（Pattern A）は転送先側の事柄のため立てない。'
