translation:
  ja: ファラジュ・ブン・アフマド・ブン・アビー・バクル・ブン・ムハンマド・ブン・フライズ・アル＝マンファルーティー・アル＝マーリキー。アル＝フサームとアッ＝スィラージュの甥で、彼の父は三人のうちの末弟である。彼自身も二人の兄イスマーイールとムハンマドの末弟で、イスマーイールが（三人のうち）最も有力である。詩作があり、そのうちに『ブルダ』のタフミースがあって、それは我らの友アル＝ムヒーウィー・アル＝クラシーのもとにある。自分の地方とその周辺で裁判代理を務めている。899年の時点で存命である。
  en: Faraj b. Aḥmad b. Abī Bakr b. Muḥammad b. Ḥurayz al-Manfalūṭī al-Mālikī, nephew of al-Ḥusām and al-Sirāj; his father was the youngest of the three. He himself is the youngest of his two brothers Ismāʿīl and Muḥammad, Ismāʿīl being the most notable. He has poetry, including a takhmīs of al-Burda, which is in the possession of our friend al-Muḥyawī al-Qurashī. He acts as deputy judge in his district and its surroundings. In the year 899 he is among the living.
