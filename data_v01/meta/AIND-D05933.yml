translation:
  ja: ウマル・ブン・ムハンマド・ブン・アフマド・ブン・アリー・ブン・アル＝ハサン・ブン・ジャーミウ、アッ＝シラージュ・ブン・アッ＝シャムス・アブー・アル＝マアーリー、アッ＝ディマシュキー、クルアーン読誦家。イブン・アッ＝ラッバーンとして知られる。父から諸読誦法を取得し、イブン・アル＝ジャザリーが伝えるところでは、アッ＝シャムス・アル＝アスカラーニーのもとで十読誦法により朗誦した。読誦教授の座に就き、穏やかで心の清い人で、チェス（シャトランジ）に長じていた。（8）30年シャアバーン月に約80歳で没した。我らがシャイフ（イブン・ハジャル）は『インバー』で彼に言及し、『ムウジャム』にも簡略に収めて、彼がアフマド・ブン・アブドゥルカリーム・アル＝バアリーのもとで『サヒーフ・ムスリム』を聴聞したと述べている。彼（本項主）は我々にイジャーザを与えた。
  en: ʿUmar b. Muḥammad b. Aḥmad b. ʿAlī b. al-Ḥasan b. Jāmiʿ, al-Sirāj b. al-Shams Abū al-Maʿālī, al-Dimashqī, the Qurʾān reciter, known as Ibn al-Labbān. He took the readings from his father and recited according to the ten readings to al-Shams al-ʿAsqalānī, as Ibn al-Jazarī reports. He presided over the teaching of recitation; he was calm and pure of heart, and excelled at chess. He died in Shaʿbān of the year (8)30, aged about eighty. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and included him briefly in his Muʿjam, saying that he heard Ṣaḥīḥ Muslim from Aḥmad b. ʿAbd al-Karīm al-Baʿlī. He granted us (Ibn Ḥajar) an ijāza.
