translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・アフマド、チュニス出自のマッカの人。イブン・アル＝マルジャーニーとして知られる。イブン・スィッディークらから聴聞し、法学とアラビア語学に励んでその分野で頭角を現し、詩作と優れた筆跡（それにより多くを書き写した）、信仰心・善良さ・物静かさを備えていた。（8）10年ズー・アル＝ヒッジャ月2日の土曜の夜、マッカにておよそ24歳で没し、アル＝マアラー墓地に埋葬された。アル＝ファースィーが彼に言及している。
  en: Muḥammad b. ʿAbd Allāh b. Aḥmad, of Tunisian origin, the Meccan, known as Ibn al-Marjānī. He heard from Ibn Ṣiddīq and others, occupied himself with jurisprudence and Arabic, and distinguished himself in these, along with poetry, a fine hand with which he copied a great deal, piety, goodness and tranquillity. He died on the night of Saturday, 2 Dhū al-Ḥijja (8)10, in Mecca, aged about twenty-four, and was buried at al-Muʿallā. Al-Fāsī mentioned him.
