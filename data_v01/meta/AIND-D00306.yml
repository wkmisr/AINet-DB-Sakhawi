translation:
  ja: イブラーヒーム・ブン・アル＝ハワージャ・シャムス・アル＝ディーン・ムハンマド・ブン・ムハンマド・ブン・ユースフ・アル＝アアカーク・アル＝バスリー。マッカ在住。856年にアブー・アル＝ファトフ・アル＝マラーギーのもとで我々と共に（ハディースを）聴聞した者の一人。彼はクルアーンと『アル＝ミンハージュ・アル＝ファルイー』のような書物を暗記しており、生計を立てることに従事した。現在（897年）は存命中である。
  en: Ibrāhīm b. al-Khawāja Shams al-Dīn Muḥammad b. Muḥammad b. Yūsuf al-ʿAqʿaq al-Baṣrī, a resident of Mecca. He was among those who heard with us from Abū al-Fatḥ al-Marāghī in the year 856 H. He had memorized the Qurʾān and books such as al-Minhāj al-Farʿī. He then engaged in earning a living. He is alive now in the year 897 H.
