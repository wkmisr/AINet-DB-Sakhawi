translation:
  ja: カースィム・アッ＝ルーミー、スルターンの商人で、ダワーダール・ヤシュバクの寵臣。そのためヤシュバクは、彼のもとに届く品について関税（マクス）の免除を許していた。威厳のある善良な人物であった。880年のジュマーダー両月のいずれかにマッカで没した。彼は前述のズィーラクの主人（ウスターズ）である。
  en: Qāsim al-Rūmī, the Sultan's merchant and the favourite of the dawādār Yashbak, so much so that he allowed him to forgo the customs duty (maks) on what came in for him. He was a dignified and good man. He died in Mecca in one of the two Jumādās of the year 880. He was the master (ustādh) of Zīrak, mentioned above.
