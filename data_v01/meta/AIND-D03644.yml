translation:
  ja: アブドゥル・ラフマーン・ブン・アブドゥル・ラヒーム・ブン・ナースィル・アッ＝ディーン・ムハンマド・ブン・ジャマール・アッ＝ディーン・アブドゥッラー。バーブ・アッ＝ナスル（凱旋門）にあるマドラサとその隣接する邸宅の所有者であったバクトゥムル・アル＝ハージブ（その父の伝記は後述）の末裔であり、先祖と同様に「イブン・アル＝ハージブ」として知られる。ヒジュラ暦850年ラジャブ月8日の金曜日に没した。一部の者は彼が853年のペスト（タアウーン）の年に没したと記録しているが、最初の説（850年没）の方がより正しいようである。彼はアル＝バドル・アル＝ビルマーウィーに遺言を託し、前述の祖父（先祖）のマドラサの近くにある彼らの墓所に埋葬された。彼は精神的な執着（ワスワース）において父親に似ており、一時期アミール・カーニバーイ・アル＝ジャルカスィーの側近であった。アッラーが彼を赦されますように。
  en: ʿAbd al-Raḥmān b. ʿAbd al-Raḥīm b. Nāṣir al-Dīn Muḥammad b. Jamāl al-Dīn ʿAbd Allāh, a descendant of Baqtumur al-Ḥājib (whose father's biography is forthcoming), the owner of the madrasa and its adjacent house at Bāb al-Naṣr. Like his predecessors, he was known as Ibn al-Ḥājib. He died on Friday, 8 Rajab 850 AH, though some dated his death to the plague of 853 AH; the first date seems more correct. He entrusted his will to al-Badr al-Birmāwī and was buried in their family tomb near his ancestor's aforementioned madrasa. He succeeded his father in having obsessive thoughts (al-waswās) and was closely associated with the Emir Qānibāy al-Jarkasī for a time. May Allah forgive him.
