translation:
  ja: クルトバーイ・アル＝アシュラフィー・バルスバーイ。アッ＝ザーヒル・フシュカダムの時代に十人長となったが、次いで彼（フシュカダム）は彼を追放し、次いでトリポリにイクターを与えた。そして872年、スワール（との）戦役で戦死した。横暴な人物であった。
  en: Kurtbāy al-Ashrafī Barsbāy. He became an amir of ten in the days of al-Ẓāhir Khushqadam, who then exiled him and then gave him an iqṭāʿ in Tripoli, until he was killed in the Suwār campaign (al-waqʿa al-Suwāriyya) in the year 872. He was a tyrannical man.
