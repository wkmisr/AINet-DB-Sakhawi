translation:
  ja: アリー・ヌール・アッ＝ディーン、児童の教師。前に述べた盲人（の同名者）とは別の人物。カイロのハーラト・アッ＝ルームの入口にあるシャイフ・アリー・アル＝バターイヒー・アッ＝サッダールのザーウィヤで、ミーアード（定例集会）のシャイフを務めていた。852年ズー・アル＝ヒッジャ月に没した。神が彼を憐れみたまわんことを。
  en: ʿAlī Nūr al-Dīn, a teacher of children, another one, distinct from the blind man mentioned before him. He was the shaykh of the mīʿād (regular teaching session) at the zāwiya of Shaykh ʿAlī al-Baṭāʾiḥī al-Saddār at the head of Ḥārat al-Rūm in Cairo. He died in Dhū al-Ḥijja of the year 852, may God have mercy on him.
