translation:
  ja: ムハンマド・ブン・ビールバク・アッ＝シャムス・アッ＝トゥルキー、アッ＝ザーヒル・バルクークの親族であるバイバルスのハーズィンダール（宝庫管理官）アフマドの兄弟。（8）03年サファル月に没した。判決書記（ムワッキウ・アル＝フクム）であった。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Muḥammad b. Bīlbak al-Shams al-Turkī, brother of Aḥmad, the khāzindār of Baybars the relative of al-Ẓāhir Barqūq. He died in Ṣafar of the year (8)03. He was a muwaqqiʿ al-ḥukm (judicial clerk). Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
