- text: '【集約 2026-10-25】「أخو أحمد خازندار بيبرس قريب الظاهر برقوق」の「قريب الظاهر برقوق」は直前の بيبرس を限定し、どのバイバルスかを示す句と読む（イブン・ハジャルの同型表現 D06270／D06271「قانباي قريب بيبرس ابن أخت الظاهر برقوق」）。該当人物は #AIND-D02232「بيبرس ابن أخت الظاهر برقوق … أتابك」（兄弟 أحمد の主人の候補。他の بيبرس 見出し D02230・D02233〜36 は年代・属性が合わない）。よって校閲時の relative relation（#AIND-D02178 الظاهر برقوق、cert medium）は本項主の関係ではないとして削除した（内容B[6]、§D132-2）。'
