    ja: '父 علي بن عثمان بن محمد は識別要素のない汎用名、corpus に本伝なし（hw.py「الفومني」は本項・D08932・D09872・索引 D11902 のみ）（規則3 (c'')）。【集約 2026-11-03】機械照合候補（父ナサブ3代一致）#AIND-D05281「علي بن عثمان بن محمد بن أحمد نور الدين أبو البقاء العذري المقرئ ويعرف بابن القاصح … ولد في ثالث رجب سنة ست عشرة وسبعمائة」・#AIND-D05282「علي بن عثمان بن محمد بن الشمس لولو الحلبي ثم الدمشقي … ولد في سنة ست وعشرين وسبعمائة … ومات ببيت لهيا في المحرم سنة إحدى」を原文で確認: 8世紀の読誦家・アレッポ/ダマスクスの伝承者で、ニスバ الفومني（ギーラーン）・職 الخواجا（商人）とも閉合しない＝別人（機械 L）。'
