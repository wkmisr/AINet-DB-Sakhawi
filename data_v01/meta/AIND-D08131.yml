translation:
  ja: ムハンマド・ブン・アリー・ブン・ウスマーン・ブン・ムハンマド、アル＝ハワージャ・アル＝フーマニー。859年ラビーウ・アッ＝アウワル月にマッカで没した。イブン・ファハドが彼の没年を記している。彼はアル＝ジャマール・ムハンマドの父で、マッカに住み、そこで家を買って修築し、子らと相当な遺産を残した。
  en: Muḥammad b. ʿAlī b. ʿUthmān b. Muḥammad, al-Khawājā al-Fūmanī. He died in Rabīʿ al-Awwal [8]59 in Mecca; Ibn Fahd dated him. He was the father of al-Jamāl Muḥammad, one of those who settled in Mecca, where he bought a house and restored it, and he left children and an estate of some size.
