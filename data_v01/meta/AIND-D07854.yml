  note:
    ja: '学生 إبراهيم بن محمد بن إبراهيم＝#AIND-D00235「إبراهيم بن محمد بن إبراهيم بن عبد الله بن محمد بن أبي الوفاء عز الدين أبو الفضل … الباسكندري … الهرموزي المولد الشافعي」（824年ホルムズ生、未収録）。同項本文「فأخذ في الفقه وغيره عن قاضيها نور الدين يوسف بن صلاح الدين محمد بن نور الدين يوسف وابن عمه المولى صدر الدين محمد بن تاج الدين عبد الله وقرأ عليه الحصن الحصين لابن الجزري في سنة اثنتين وخمسين」で本項主（صدر الدين محمد بن تاج الدين عبد الله）とその従兄弟 يوسف の2人を師とすることが閉合。「وكان بعد الخمسين」は学習の時期（850年以後、repo 先例どおり notBefore-custom=850＝年初 1446-04-07）で、D00235 側は852年と明記。初版の passive #NEEDID・event「when="after 850"」を置換。'
