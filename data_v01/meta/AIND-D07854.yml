translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ユースフ、アッ＝サドル・ブン・アッ＝タージュ・ブン・アン＝ヌール、アル＝バースカンディー・アル＝フルムーズィー・アッ＝シャーフィイー。そこ（ホルムズ）のカーディーで、後出のユースフ・ブン・ムハンマド・ブン・ユースフの従兄弟。イブラーヒーム・ブン・ムハンマド・ブン・イブラーヒームは彼ら二人から学んだ者の一人で、それは（8）50年より後のことであった。
  en: Muḥammad b. ʿAbd Allāh b. Yūsuf, al-Ṣadr b. al-Tāj b. al-Nūr, al-Bāskandī al-Hurmūzī al-Shāfiʿī, its (Hormuz's) qāḍī, and the paternal cousin of Yūsuf b. Muḥammad b. Yūsuf, who follows. Ibrāhīm b. Muḥammad b. Ibrāhīm was among those who studied under the two of them, and that was after [8]50.
