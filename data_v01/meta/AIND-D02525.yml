translation:
  ja: ハサン・ブン・アフマド・アル＝バアリー（シャーフィイー派）、イブン・アル＝ファキーフとして知られる。756年シャアバーン中旬に生まれ、アフマド・ブン・アブドゥルカリーム・アル＝バアリーから『サヒーフ・ムスリム』を、ユースフ・ブン・アル＝ハッバールから『イブン・イスハークの預言者伝』を聴聞した。
  en: Al-Ḥasan b. Aḥmad al-Baʿlī, the Shāfiʿī, known as Ibn al-Faqīh. He was born in mid-Shaʿbān in the year 756. He heard *Ṣaḥīḥ Muslim* from Aḥmad b. ʿAbd al-Karīm al-Baʿlī, and the *Sīra* of Ibn Isḥāq from Yūsuf b. al-Ḥabbāl.
