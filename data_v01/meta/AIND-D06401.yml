translation:
  ja: カスバーイ・アン＝ナウルーズィー。ダマスクスの十人隊アミールの一人で、のちタブルハーナ級（アミール）となったが、その年が終わらぬうちに（8）42年シャアバーン月に没した。イブン・アッ＝ラッブーディーがその没年を記している。
  en: Kasbāy al-Nawrūzī, one of the amirs of ten in Damascus; he was then established among the ṭablkhānāh [amirs], but the year had not ended before he died, in Shaʿbān of the year [8]42. Ibn al-Labbūdī recorded his death.
