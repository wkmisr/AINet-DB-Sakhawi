notes:
- text: '転送見出し（原文末尾「فيمن جده محمد بن محمد بن محمد بن علي」による）。転送先は #AIND-D07256「محمد بن أبي بكر بن محمد بن محمد بن محمد بن علي التاج السمنودي الأصل القاهري الشافعي المقرئ أخو أحمد الماضي ويعرف بابن تمرية」（生780前、未収録）。祖父以下のナサブ「محمد بن محمد بن محمد بن علي」とニスバ السمنودي が一致し、D07256 本文に「وولي الخطابة بمدرسة السلطان حسن وبجامع بشتاك」とあるので見出し語 الخطيب とも整合（兄 #AIND-D00616「أحمد بن أبي بكر بن محمد بن محمد الشهاب بن الزين الأنصاري السمنودي ثم القاهري الشافعي الخطيب」も同家）。corpus の السمنودي 見出し（34件）で該当するナサブは D07256 のみ。'
