translation:
  ja: アブドゥッサーディク・ブン・ムハンマド・アッ＝ディマシュキー・アル＝ハンバリー。アッ＝タキー・ブン・アル＝ムンジャーの門人の一人であった。トリポリのカーディー職を務め、その行状は称賛された。その後ダマスカスに来て、主人であるアッ＝タキーの妻であったアッ＝サッラーウィーの娘と結婚し、ダマスカスのカーディー職を求めて奔走した。806年ムハッラム月、自宅の屋根が崩落して瓦礫の下で命を落とし、殉教者として没した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: ʿAbd al-Ṣādiq b. Muḥammad al-Dimashqī al-Ḥanbalī. He was one of the companions of al-Taqī b. al-Munajjā. He held the judgeship of Tripoli, where his conduct was praised. He then came to Damascus, married the daughter of al-Sallāwī, the (former) wife of his master al-Taqī, and sought the judgeship of Damascus. He died a martyr in Muḥarram 806 AH when the roof of his house fell on him and he perished under the rubble. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
