translation:
  ja: 我らがシャイフ（イブン・ハジャル）は『インバー』において彼について、まず毛皮商の仕事をしていたが、その後しばらく勤め、スルタンの庁舎で働き、それからワズィール職に就いたと述べた。彼がワズィールであった時にティムールの騒乱（803年）が起こり、彼はティムールに伴われて彼の故郷へ連行されたが、間もなく解放され、ダマスクスに帰還した。そこでシャアバーン月に軍事監督職などに就任した。そして803年に亡くなった。
  en: Our shaykh (Ibn Ḥajar) said in his 『Inbāʾ』 that he first engaged in the furrier's craft, then worked for a short time and served in the Sultan's chancellery, and then became a vizier. When the fitna of Timur (803 AH) occurred, he was a vizier, and Timur took him with him to his lands. He was released after a short period, then arrived in Damascus, where he undertook the supervision of the army and other duties in Shaʿbān. He died in the year 803 AH.
