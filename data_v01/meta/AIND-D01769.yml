  ja: アフマド・アッ＝シハーブ・アル＝ムアッラキー・アル＝マーリキー。イマーム、大碩学（アッラーマ）、ムスナド（ハディース伝承の権威）、長寿者（ムアンマル）。829年に、およそ70歳あるいは90歳で死去した。これは彼が長寿であったという評と符合する。
  en: Aḥmad al-Shihāb al-Muʿalliqī al-Mālikī, the imam, the great scholar (al-ʿallāma), the musnid (authority in hadith transmission), the long-lived (al-muʿammar). He died in the year 829 H at around seventy or ninety years of age, in keeping with his description as long-lived.
