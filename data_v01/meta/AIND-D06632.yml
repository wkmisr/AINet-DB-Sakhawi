  note:
    ja: 「الماضي أبوه」＝#AIND-D00609「أحمد بن أبي بكر بن محمد بن أبي بكر بن أحمد الشهاب الدمشقي الأصل القاهري الشافعي والد صلاح الدين أبي اليمن محمد ويعرف بابن الحزمي وبابن حبيلات . ولد في ذي الحجة سنة سبع عشرية وثمانمائة … مات في ربيع الثاني سنة أربع وتسعين」（repo 未収録）。ナサブ・ラカブ الشهاب・家名 ابن الحزمي・通称が一致し、相手側が子「صلاح الدين أبي اليمن محمد」を挙げる＝閉合、cert 不要（規則37）。ブリーフは「父の本伝は自分で引く。見出し検索では『جبيلات』は本項のみ」＝全文検索「الحزمي」で見つかる（相手側の綴りは「حبيلات」）。初版は零番号 TMP-P-000000。
