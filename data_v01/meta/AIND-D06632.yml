notes:
- text: '名と「前出の父」と通称だけの項で、転送の語はない＝実項（ブリーフどおり）。通称の綴りは本項「ابن جبيلات」、父の項「ابن حبيلات」で点が違う（刊本どおり、規則25）。本項主のラカブ・クンヤ（صلاح الدين أبو اليمن）は父の項にしか出ないので persName に補わない（規則23）。父 الشهاب أحمد الحزمي の代理人の項 #AIND-D06580（B171、「محمد بن إبراهيم صلاح الدين وكيل ابن الحزمي … ثم عمل وكيلا لشهاب الدين أحمد الحزمي」）は別人。'
