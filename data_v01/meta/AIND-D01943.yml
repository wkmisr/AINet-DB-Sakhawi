translation:
  ja: イスマーイール・ブン・アブー・バクル、彼のイスムはムハンマド、ブン・アリー・アル＝ハワーフィー。彼の父は後述される。 824年に彼と共にカイロにやって来て、我らがシャイフに言った： 「あなた様はエジプトの各地に滞在されました、おお、高位のサドルよ。 あなた様の声望は諸世界において隠れることなく、 世代から世代へと人類を飾り立てていらっしゃいます。 それゆえ、高官たちとアル＝ハワーフィー家を栄えさせました。」
  en: 'Ismāʿīl b. Abī Bakr (whose given name was Muḥammad) b. ʿAlī al-Khawāfī, whose father will be mentioned later. He came to Cairo with him in 824 H. He said to our shaykh (Ibn Ḥajar al-ʿAsqalānī): "You resided in Egypt, O Ṣadr al-Aʿālī, Your fame is not hidden in the worlds. And you adorned humanity generation after generation, So you honored the forebears and the Khawāfī." Father, Abū Bakr al-Khawāfī, is marked with الآتي, indicating a cross-reference to a later entry.'
