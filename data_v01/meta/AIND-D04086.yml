- text: 「اللجمي … بلدة بالساحل قرب سفاقس」＝ニスバの由来（スファックス近郊の海岸の町 اللجم）。初版はこれを出生地としていたが原文に出生の記載はないため birth を除去。
  lang: ja
translation:
  ja: アブドゥルガニー・アッ＝ラジュミー（ラーム・ジームともに開音。スファックス近くの海岸の町）、アッ＝トゥーニシー。イーサー・アル＝グブリーニー、ヤアクーブ・アッ＝ズウビー、アブドゥッラー・アル＝バージー、アフマド・アッ＝シャンマーウらに学んだ。学派（の法学）において頭角を現し、アル＝カラーフィーの法源論の諸著作に完全に通暁し、同輩に比べてきわめて寡欲で現世に対して控えめであった。我らの友人カーディー・アル＝ラクブが私に彼のことを教えてくれ、60年（860年）よりやや後に没したと言った。彼（カーディー・アル＝ラクブ）は本人から学んだ者の一人である。
  en: ʿAbd al-Ghanī al-Lajmī (with fatḥa on the lām and the jīm, then mīm—a town on the coast near Sfax), al-Tūnisī. He studied under ʿĪsā al-Ghubrīnī, Yaʿqūb al-Zuʿbī, ʿAbd Allāh al-Bājī and Aḥmad al-Shammāʿ, among others. He excelled in the madhhab, with complete expertise in al-Qarāfī's works on uṣūl, and was exceedingly abstemious and behind his peers in worldly matters. Our companion Qāḍī al-Rakb informed me about him and said that he died approximately after [8]60; he (Qāḍī al-Rakb) was among those who studied under him.
