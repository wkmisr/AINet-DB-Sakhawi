translation:
  ja: アブドゥッラー・アル＝ハバシー・アル＝マッキー。アル＝アドゥールの奴隷の少年。主人は彼を立派に育て、クルアーンと数多くの書物を教授し、彼はそれらを見事に暗記して、集団の一員として私（サハーウィー）にそれらを暗誦提示し、さらには私からいくつかのものを聴聞した。聡明であった。895年ジュマーダー・アッ＝サーニヤ月6日火曜の夜、成年に達した頃に没した。神が彼とその主人に楽園をもって報われんことを。
  en: ʿAbd Allāh al-Ḥabashī al-Makkī, the slave-boy (fatā) of al-ʿAdhūl. His master brought him up well and taught him the Qurʾān and a great many books, which he memorized excellently and recited from memory (ʿaraḍa) to me [al-Sakhāwī] among the group; indeed he also heard several things from me. He was intelligent. He died on the eve of Tuesday, the sixth of Jumādā II of the year 895, on reaching maturity. May God compensate him and his master with Paradise.
