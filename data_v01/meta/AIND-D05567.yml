translation:
  ja: アリー・ブン・ムハンマド・ブン・ムハンマド・ブン・ヤフヤー・ブン・サーリム・アル＝ハシャビー・アル＝マダニー。781年ジュマーダー・アル＝アーヒラ月にマディーナで生まれた。797年、兄弟たちとともに、ムハンマド・ブン・アブドゥッラー・アル＝バフナシー、ムハンマド・ブン・アビー・アル＝バカー・アッ＝スブキー、サアド・ブン・ユースフ・アン＝ナワウィー、ムハンマド・ブン・イスハーク・アル＝アブラクーヒー、ムハンマド・ブン・アビー・バクル・アル＝バクリーらからイジャーザを授けられた。833年のペストでカイロで没した。イブン・ファフドがその『ムウジャム』に没年を記録している。
  en: ʿAlī b. Muḥammad b. Muḥammad b. Yaḥyā b. Sālim al-Khashabī al-Madanī. He was born there in Jumādā II 781. In 797, together with his brothers, he was granted ijāza by Muḥammad b. ʿAbd Allāh al-Bahnasī, Muḥammad b. Abī al-Baqāʾ al-Subkī, Saʿd b. Yūsuf al-Nawawī, Muḥammad b. Isḥāq al-Abraqūhī, Muḥammad b. Abī Bakr al-Bakrī and others. He died in Cairo in the plague of 833. Ibn Fahd recorded his death in his Muʿjam.
