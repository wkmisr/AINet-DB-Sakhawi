translation:
  ja: アブド・アル＝カリーム・ブン・アブド・アル＝ガニー・ブン・ヤアクーブ、カリーム・アッ＝ディーン・ブン・ファフル・アッ＝ディーン・ブン・シャラフ・アッ＝ディーン・アル＝カーヒリー。ナーズィル・アル＝ハーッス（内帑監督官）の代理を務めた者の一人で、父のラカブの縮小形であるイブン・フハイラの名で知られる。850年ラジャブ月6日に没した。前述のアブド・アッ＝ラッザークの父である。
  en: ʿAbd al-Karīm b. ʿAbd al-Ghanī b. Yaʿqūb, Karīm al-Dīn b. Fakhr al-Dīn b. Sharaf al-Dīn al-Qāhirī, one of those who deputized for the nāẓir al-khāṣṣ; he is known as Ibn Fukhayra, a diminutive of his father's laqab. He died on the sixth of Rajab of the year 850. He is the father of ʿAbd al-Razzāq, mentioned above.
