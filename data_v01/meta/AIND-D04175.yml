translation:
  ja: アブドゥルカーディル・ブン・ムハンマド・ブン・イスマーイール・アッ＝ディマシュキー・アル＝カファルバトナーウィー。シャイフ。ヒジュラ暦850年付の要請（イスティドアー）において、私（サハーウィー）にイジャーザを（書簡で）送ってきた。彼はアブー・フライラ・ブン・アッ＝ザハビーの従者であったと言われている。ヒジュラ暦802年ラマダーン月に、我らがシャイフ（イブン・ハジャル）の朗読により、前述のムハンマド・ブン・アビー・フライラ（アブー・フライラの子）のもとで、アブー・ヤアラー・アル＝マウシリーの『アマーリー（口述録）』のうち3つのマジュリスを含む一部（ジュズウ）を聴聞した。彼がハディースを伝承したことは知られていない。ヒジュラ暦850年代（50数年）に没した。
  en: Abd al-Qadir b. Muhammad b. Isma'il al-Dimashqi al-Kafarbattnawi, shaykh. He wrote to me (al-Sakhawi) with an ijaza in a request (istid'a) dated to the year 850 AH. It is said that he was in the service of Abu Hurayra b. al-Dhahabi. He listened, through the reading of our shaykh (Ibn Hajar), under the aforementioned Muhammad b. Abi Hurayra, to a portion (juz') containing three sessions (majalis) from the 'Amali' of Abu Ya'la al-Mawsili in Ramadan 802 AH. I do not know of him transmitting hadith. He died in the 850s AH.
