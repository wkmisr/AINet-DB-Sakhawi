notes:
- text: '「يأتي بزيادة محمد بعد جده قريبا」＝転送見出し。転送先は #AIND-D05213（علي بن عبد الرحمن بن محمد بن محمد بن إسماعيل بن سلطان نور الدين أبو الحسن بن الكمال الشلقامي بضمتين ثم القاهري الشافعي、生746頃）。祖父 محمد の後に محمد を加えた形＝「بن محمد بن محمد بن إسماعيل」で一致、2項後（قريبا）。ニスバ索引 D11773「الشلقامي بضمتين علي بن عبد الرحمن بن محمد بن اسمعيل」も同人。'
