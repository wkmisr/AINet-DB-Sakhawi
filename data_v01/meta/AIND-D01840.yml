translation:
  ja: アフマド。魅了状態（ジャズブ）にあると言われ、庶民のあいだで篤く信奉されていた人物。868年ズー・アル＝ヒッジャ月末日の日曜日に死去し、カイロのバーブ・アル＝シャアリーヤ門内にあるハリーマ・アル＝ムバルカアのザーウィヤの傍らに埋葬された。生前は常に首に太鼓を提げていた。アル＝ムニールが彼の没年を記録している。
  en: Aḥmad, known for his state of *jadhb* (spiritual attraction) and revered among the common people, died on a Sunday, the last day of Dhū al-Ḥijja in the year 868 H. He was buried next to the Zāwiya of Ḥalīma al-Mubarqaʿa inside Bāb al-Shaʿriyya in Cairo. He always had a drum around his neck. al-Munīr recorded his death date.
