translation:
  ja: アリー・ブン・ムハンマド・ブン・アフマド・ブン・アリー・ブン・ムハンマド・ブン・ダウ、アル＝アラー・ブン・アル＝カマール・ブン・アッ＝シハーブ、サファド出自のアル＝マクディスィー、ハナフィー派。父は後述、祖父は前述。先祖と同様にイブン・アン＝ナキーブとして知られる。810年に生まれ、父の後にタンキズィーヤのシャイフ職などに就いた。880年ジュマーダー・アッ＝サーニヤ月20日土曜に没した。
  en: ʿAlī b. Muḥammad b. Aḥmad b. ʿAlī b. Muḥammad b. Ḍawʾ, al-ʿAlāʾ b. al-Kamāl b. al-Shihāb, of Ṣafadī origin, al-Maqdisī, al-Ḥanafī; his father follows and his grandfather has been mentioned; known like his forebears as Ibn al-Naqīb. He was born in the year 810 and held the mashyakha of al-Tankiziyya and other posts after his father. He died on Saturday, the 20th of Jumādā al-Thāniya of the year 880.
