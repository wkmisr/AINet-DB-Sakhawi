translation:
  ja: ハサン・ブン・バドル・アッ＝ディーン・アッ＝シャリーフ。アレクサンドリアの商人の一人。同地にて854年ズー・アル＝カアダ月に没した。多額の遺産を残した。世俗の事柄に極めて精通しており、自らの目的を達成するための手段の講じ方に長けていた。彼はホワージャ・ファフル・アッ＝ディーン・アッ＝タウリーズィーを（スルタンに）告発し、その結果スルタンは彼から10万ディナールを超える額を没収した。彼の品行は褒められたものではなかった。神が彼を赦されんことを。
  en: Hasan b. Badr al-Din al-Sharif, one of the merchants in Alexandria. He died there in Dhu al-Qa'dah, the year 854, leaving behind a vast fortune. He was highly experienced in worldly affairs and extremely persistent in employing means to achieve his goals. He denounced Khawaja Fakhr al-Din al-Tawrizi to the Sultan, resulting in the Sultan confiscating over a hundred thousand dinars from him. His conduct was not praiseworthy, may God forgive him.
