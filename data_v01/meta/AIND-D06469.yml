translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アビー・アル＝アッバース・アフマド・ブン・アブドゥッラー、原籍はチュニス、マッカの人。父はアッ＝ザアバリーとして知られる。マッカで生まれ、そこでクルアーンを暗記し、アル＝ジャラール・アル＝ムルシディーのもとで文法学の講義に数多く出席した。しばらく学問に従事し、善良な人であった。825年ズー・アル＝カアダ月にマッカで没し、アル＝マアラーに葬られた。父は彼の死に打ちひしがれた。アル＝ファーシーが『マッカ（史）』で彼に言及している。
  en: Muḥammad b. Ibrāhīm b. Abī al-ʿAbbās Aḥmad b. ʿAbd Allāh, of Tunisian origin, al-Makkī; his father is known as al-Zaʿbalī. He was born in Mecca, memorised the Qurʾān there, and attended many lessons in grammar with al-Jalāl al-Murshidī. He devoted himself to study for a time, and there was goodness in him. He died in Dhū al-Qaʿda of the year 825 in Mecca and was buried at al-Muʿallā; his father was stricken by his loss. Al-Fāsī mentioned him in [his history of] Mecca.
