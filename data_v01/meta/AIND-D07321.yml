translation:
  ja: ムハンマド・ブン・ハーッジー・ブン・アフマド、アッ＝シャムス・ブン・ハワージャ・シハーブ・アッ＝ディーン・ブン・アッ＝シハーブ、ホルムズ出身、アル＝マッキー、アル＝ハナフィー。第4次ムジャーワラ（マッカ滞在）の際にマッカで私から、ナワウィーの『四十ハディース』、『マサービーフ』の多く、『マシャーリク』や『ブハーリー』などの若干、次いで『シファー』の全部を聴聞し、聞き逃した箇所を朗読した者の一人。彼は聡明で理解力のある人物で、私のもとで『ブハーリーの三伝承者ハディース集（スラースィッヤート）』などを朗読した。
  en: Muḥammad b. Ḥājjī b. Aḥmad, al-Shams b. Khawājā Shihāb al-Dīn b. al-Shihāb, of Hormuzī origin, al-Makkī, al-Ḥanafī. He is among those who heard from me there (in Mecca), during the fourth period of residence (mujāwara), al-Nawawī's Forty Ḥadīths, much of al-Maṣābīḥ, some parts of works such as al-Mashāriq and al-Bukhārī, then the whole of al-Shifāʾ, and he read what he had missed. He is intelligent and sensible; he read to me the Thulāthiyyāt of al-Bukhārī and other things.
