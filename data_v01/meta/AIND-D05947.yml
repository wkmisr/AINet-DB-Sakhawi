translation:
  ja: ウマル・ブン・ムハンマド・ブン・ハサン・ブン・シャアバーン・ブン・アビー・バクル、バーウール出自、アル＝ハラビー。父については後述する。イブン・アッ＝サウワとして知られる。父が殺害された後、スルターンは彼を召し出し、アレッポ地方において彼（スルターン）の代理（ワカーラ）を務めるよう求めたが、彼は辞退した。帰還後も名望を保ったまま過ごし、（8）86年シャアバーン月に没した。彼のターバンは、兄弟たちと違って丸型であった。
  en: ʿUmar b. Muḥammad b. Ḥasan b. Shaʿbān b. Abī Bakr, of Bāʿūr origin, al-Ḥalabī; his father is mentioned below, and he is known as Ibn al-Ṣawwa. After his father was killed, the Sultan summoned him and asked him to act as his (the Sultan's) agent (wakāla) in the Aleppo region, but he asked to be excused. After his return he remained in his position of prestige until he died in Shaʿbān of the year (8)86. His turban was round, unlike those of his brothers.
