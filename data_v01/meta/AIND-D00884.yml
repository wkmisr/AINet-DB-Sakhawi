translation:
  ja: アフマド・ブン・アブドゥッラー・ブン・アフマド、ラカブはアッ・シハーブ、クンヤはアブー・アル・アッバース。アル・ジャマール家の子孫。アル・アキーリー、アッ・ザイライー、アル・ヤマニー、ハナフィー派。880年代以降、私がマッカにいた時、彼はイジャーザを求めて私に書簡を送ってきた。そのため私は彼に（イジャーザの）書簡を書き、私の許に届いた彼に関する諸情報のうち、私が『大年代記』に記した通りに書き記したものをその中に述べた。
  en: Aḥmad b. ʿAbd Allāh b. Aḥmad, al-Shihāb Abū al-ʿAbbās, of the Banū al-Jamāl, al-ʿAqīlī, al-Zaylaʿī, al-Yamānī, al-Ḥanafī. He corresponded with me while I was in Mecca after the 880s, requesting an ijāza. So, I wrote to him, mentioning in it what reached me concerning his descriptions, as I had recorded them in *al-Tārīkh al-Kabīr*.
