translation:
  ja: ウマル・ブン・アブドゥルムウミン・ブン・ウマル、アッ＝ザイン・アル＝ハリーリー・アル＝マクディスィー・アッ＝シャーフィイー。（7）89年に生まれ、アッ＝シハーブ・アフマド・ブン・サアドゥッラー・アル＝ハッラーニーのちアル＝アーミディー（ハンバリー派）と、イブン・アル＝ハラビーヤとして知られるアッ＝ザイン・アブー・ル＝ファダーイル・アブドゥッラフマーン・ブン・アビー・バクル・ブン・シュジャーウ・アル＝ハッラーニーのちアッ＝ラフーニー（シャーフィイー派）から『ブハーリー』を伝承した。二人は「アル＝ハッジャールが我々に伝えた」と言っており、それは（7）56年のことである。アブー・ル＝ファドル・ブン・アビー・ッ＝ルトフが彼から聴聞し、彼は長命であったと述べている。彼は…に没した。
  en: ʿUmar b. ʿAbd al-Muʾmin b. ʿUmar, al-Zayn al-Khalīlī al-Maqdisī al-Shāfiʿī. He was born in (7)89 and transmitted al-Bukhārī from al-Shihāb Aḥmad b. Saʿd Allāh al-Ḥarrānī then al-Āmidī al-Ḥanbalī and from al-Zayn Abū al-Faḍāʾil ʿAbd al-Raḥmān b. Abī Bakr b. Shujāʿ al-Ḥarrānī then al-Rahūnī al-Shāfiʿī, known as Ibn al-Ḥalabiyya; both said "al-Ḥajjār informed us", and that was in (7)56. Abū al-Faḍl b. Abī al-Luṭf heard from him and said that he lived to an old age. He died in ...
