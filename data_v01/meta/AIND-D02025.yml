translation:
  ja: アクバーイ・アッ＝ザーヒリー・フシュカダム。アッ＝タウィール（背高）とも呼ばれた。イブン・ハルサクの事件における戦闘の際に勇敢さを示したことにより、アシュラフ・カーイトバーイが彼をアターバク軍団旗手のアミール・アシャラ（十人長）に任じるまでは無名であったが、そののち895年にはムジャッラド（出征に派遣される軍団）の一員となった。
  en: Aqbay al-Ẓāhirī Khushqadam, also known as al-Ṭawīl. He remained obscure until al-Ashraf Qāytbāy appointed him as an amīr ʿashara (commander of ten) for the banners of the Atābak, after he demonstrated courage during the battle of Ibn Ḥarsak. He continued until he became one of the mujarradīn (troops dispatched on campaign) in the year 895 AH.
