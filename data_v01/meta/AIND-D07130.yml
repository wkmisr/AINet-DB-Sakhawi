translation:
  ja: ムハンマド・ブン・イスマーイール、アッ＝シャムス・アル＝ハサニー・アル＝カーヒリー。サイード・アッ＝スアダーの廟（トゥルバ）——というよりその廟——の寄寓者で、同ハーンカーのスーフィーの一人。アル＝カラースンクリーヤで私（サハーウィー）の朗読によって『シャマーイル』などを聴聞した者の一人。伝えられるところでは80歳余りで、884年ラビーウ・アッ＝サーニー月に没した。イブン・アラビーの信条を奉じていたこと、また自分に入る利得を求めてスーフィー以外の者を廟に入れたことが語られる。アッラーが彼を赦したまわんことを。
  en: Muḥammad b. Ismāʿīl, al-Shams al-Ḥasanī al-Qāhirī, resident of the turba of Saʿīd al-Suʿadāʾ — rather, of its turba — and one of the Sufis of the khānqāh. He was among those who heard, through my reading, al-Shamāʾil and other works at al-Qarāsunqurīya. He died, aged over eighty as was said, in Rabīʿ al-Thānī 884. He is spoken of for holding the beliefs of Ibn ʿArabī and for admitting non-Sufis into the turba out of desire for what would come to him from it. May God pardon him.
