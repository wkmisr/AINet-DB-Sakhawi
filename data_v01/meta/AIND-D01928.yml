translation:
  ja: 901 イズマーイール・イブン・イブラーヒーム・イブン・ムーサー・イブン・サイード・イブン・アリー、アブー・アッ＝スウード・アル＝ムヌーフィー・アッ＝シャーフィイー。カイロの居住者で、各地で言及されるムハンマド、アフマド、ラマダーンの父である。彼は高潔な学者であり、アル＝アブナーシーから学び、アル＝ビラーリーやアッ＝ザーヒド、その他のサイイドたちに師事した。サイード・アッ＝スアダー学院に住み込み、教鞭を執り、ファトワを発し、詩を詠んだ。彼に対する称賛を、シャイフ・マディーンなど多くの人から聞いた。およそ920年に亡くなった。
  en: 901 Ismāʿīl b. Ibrāhīm b. Mūsā b. Saʿīd b. ʿAlī, al-Shaykh Abū al-Suʿūd al-Munūfī al-Shāfiʿī. He was a resident of Cairo and the father of Muḥammad, Aḥmad, and Ramaḍān, who are mentioned in their respective entries. He was a righteous scholar who studied under al-Abnāsī and accompanied al-Bilālī, al-Zāhid, and other Sayyids. He resided in Saʿīd al-Suʿadāʾ, taught, issued fatwas, and composed poetry. I heard praise for him from more than one person, such as al-Shaykh Madyan. He died around the year 920 AH.
