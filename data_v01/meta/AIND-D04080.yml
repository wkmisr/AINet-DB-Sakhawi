translation:
  ja: アブドゥルガニー・ブン・ヤアクーブ、アル＝ファフル・ブン・アッ＝シャラフ。マムルーク登録書記（クッターブ・アル＝ママーリーク）の一人で、それぞれの項で言及されるアブドゥルカリーム、ヤフヤー、ナスルッラー、ハムザの父。彼らは父のラカブ（アル＝ファフル）の縮小形に由来する「イブン・フハイラ」の通称で知られる。
  en: ʿAbd al-Ghanī b. Yaʿqūb, al-Fakhr b. al-Sharaf. One of the clerks of the Mamluks (kuttāb al-mamālīk), and the father of ʿAbd al-Karīm, Yaḥyā, Naṣr Allāh and Ḥamza, who are mentioned in their respective places and are known as Ibn Fukhayra, a diminutive of their father's laqab (al-Fakhr).
