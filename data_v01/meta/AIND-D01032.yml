translation:
  ja: アフマド・ブン・アリー・ブン・アブドゥッラー・アル＝ナフヤーニー（出身地名）生まれでカイロ出身者。アル＝マンクートゥムリーヤに住んだ。彼は若くしてクルアーンを暗記し、アル＝バドル・ハサン・アル＝アアライと、二人のアル＝ザイン・アル＝アブナーシーと親交を結び、また（我らがシャイフ＝著者サハーウィーの）私と私の兄弟に（イマーム）アル＝ナワウィーの『タクリーブ』やその他の書物について師事した。彼はスーフィー教団に入った。
  en: Aḥmad b. ʿAlī b. ʿAbd Allāh al-Nafyānī by origin, al-Qāhirī by residence, settled in al-Mankūtamurīya. He was a young man who memorized the Qurʾān and associated with al-Badr Ḥasan al-Aʿraj and the two al-Zayn al-Abnāsī. He maintained discipleship to me (al-Sakhāwī) and my brother regarding al-Nawawī's *Taqrīb* and other works, and he joined the Sufi order.
