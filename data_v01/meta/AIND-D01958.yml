translation:
  ja: イスマーイール・ブン・アブドゥッラー・アル＝マグフリビー・アル＝マーリキー。ダマスカス定住者。彼はその学派において傑出しており、シリアの人々は彼から法学を学んだ。彼はファトワを発行し、判事代理を務めた。シャアバーン月3年（ヒジュラ暦803年）、70歳頃で死去し、その時すでに視力は衰えていた。これは我らがシャイフ（イブン・ハジャル）が『アンバー』で述べたことである。
  en: Ismāʿīl b. ʿAbd Allāh al-Maghribī al-Mālikī, a resident of Damascus. He was outstanding in his madhhab, and Syrians studied fiqh under him. He issued fatwas and served as a deputy judge. He died in Shaʿbān in the year 803 AH, at around seventy years of age, and his eyesight had already weakened. Our shaykh (Ibn Ḥajar) mentioned this in his *Anbāʾ*.
