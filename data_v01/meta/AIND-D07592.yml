translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ウマル・ブン・アビー・バクル・ブン・ウマル・ブン・アブドゥッラフマーン・ブン・アブドゥッラー・アン＝ナーシリー。父は先述。805年に生まれ、諸学に通じ、善き人柄と寛大さを備え、（クルアーンの）読誦を怠らなかった。832年シャウワール月にアル＝ファッハで若くして没し、父のそばに葬られた。アン＝ナーシリーが彼の父の項で彼に言及している。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. ʿAbd Allāh b. ʿUmar b. Abī Bakr b. ʿUmar b. ʿAbd al-Raḥmān b. ʿAbd Allāh al-Nāshirī, whose father was mentioned previously. He was born in 805, had a share in the sciences, together with good character, generosity and constant recitation. He died young in Shawwāl 832 at al-Fakhkha and was buried beside his father. Al-Nāshirī mentioned him in (the entry of) his father.
