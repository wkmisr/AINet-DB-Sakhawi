  note:
    ja: 父の候補＝#AIND-D00327「إبراهيم بن محمد برهان الدين الكردي ثم المكي نزيل الحرمين والد محمد مؤدب الأبناء بمكة ويعرف والده بشمس العقري … مات بمكة في يوم الثلاثاء ثاني عشري المحرم سنة ثلاث وخمسين」（repo 未収録）。相手側が「والد محمد مؤدب الأبناء بمكة」と子 محمد を挙げ、名・父名・ニスバの連なり「الكردي ثم المكي」・マッカ在住が本項主と一致する。corpus でこのニスバの連なりを持つ محمد بن إبراهيم は本項のみ（もう一人の الكردي … المكي ＝#AIND-D06513 は祖父 عبد الله・811年没の別人）。ただし本項は「مؤدب الأبناء」に触れず、相手側も「الآتي」と言わない＝ナサブとニスバによる同定なので cert medium（ISSUES §D171-4）。ID-Master には D00327 の子として TMP-P-001336「محمد」（Note「AIND-D00327の息子でマッカの子供たちの教師」）が登録されており、同定が正しければ本項と名寄せになる。初版は父 relation なし。
