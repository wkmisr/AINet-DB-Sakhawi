translation:
  ja: クサイト・ブン・アシュアール・アル＝ジュッディー（ジッダの人）。841年シャアバーン月12日の金曜の夜にそこ（ジッダ）で没し、マッカに運ばれてそこに埋葬された。イブン・ファハドがその没年を記している。
  en: Qusayṭ b. Ashʿār al-Juddī. He died there (in Jidda) on the night of Friday, the 12th of Shaʿbān of the year 841, and was carried to Mecca and buried there. Ibn Fahd recorded his death date.
