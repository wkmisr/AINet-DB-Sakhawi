translation:
  ja: ムーサー・ブン・アフマド・ブン・ムーサー・ブン・アフマド・アッ＝ラッダード。イブン・アッ＝ザイン（父のラカブ、ザイン・アル＝アービディーンによる）として知られる。897年に存命のイエメンの法学者の一人で、法学を教え、クルアーン読誦法を教授しており、『イルシャード』の注釈に取り組んでいる。
  en: Mūsā b. Aḥmad b. Mūsā b. Aḥmad al-Raddād, known as Ibn al-Zayn (after his father's laqab Zayn al-ʿĀbidīn). One of the jurists of Yemen alive in the year 897, who teaches jurisprudence and gives instruction in the Qurʾānic readings, and he is engaged in writing a commentary on al-Irshād.
