  cert: medium
  note:
    ja: '#AIND-D10091「799 موسى بن محمد بن موسى بن أحمد بن أبي بكر بن محمد الكمال بن زين العابدين الصديقي البكري المكي الأصل اليماني الزبيدي الشافعي الشهير جده بابن الرداد المشهور ويعرف هو بابن زين العابدين لقب أبيه … وكتب على الإرشاد شرحا لم يبرزه إلى الآن … ولم يكمل إلى الآن الخمسين」（未収録＝本バッチにも Individuals にもない）と、①通称 ابن (الـ)زين＝父のラカブ زين العابدين、②家名 ابن الرداد、③『الإرشاد』の注釈執筆中、④イエメンの法学者で9世紀末に存命、の4点が一致し、父名（أحمد／محمد）だけが食い違う。転送指示がないので両項とも実項（二重立項型、Waka 裁定 2026-09-08）とし possible_identity cert medium。鏡像は不要（片方向）。【集約 2026-11-05】corpus の傍証: #AIND-D10289「وعن الفقيه موسى بن زين العابدين أحمد بن موسى بن أحمد الرداد ويعرف بابن الزين ، ممن هو الآن حي مشتغل بشرح الإرشاد」は本項のナサブ（父＝أحمد）をそのまま裏づけ、#AIND-D01356「اشتغل في الفقه عند الكمال موسى ابن زين العابدين بن الرداد」は D10091 のラカブ الكمال と父のラカブ زين العابدين を併せ持つ＝同一人物の二重立項の可能性が高く cert medium を維持。父名の食い違い（أحمد／محمد）は D10289 が أحمد 側を支持。D10091 は未収録のため片方向のまま＝D10091 収録時に鏡像の possible_identity を立て、父 TMP-P-001690 の共用を検討する（HANDOVER 申し送り、内容B L、決定18）。'
