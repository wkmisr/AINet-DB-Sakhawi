  note:
    ja: '見出しナサブから1段ずらして復元（規則3）。「ويعرف بابن الزين لقب أبيه زين العابدين」＝父のラカブ زين العابدين。ラカブ＋家名 ابن الرداد（ザビードの ابن الرداد 家＝#AIND-D00617 أحمد بن أبي بكر بن محمد … ويعرف بابن الرداد の子孫）で識別できるので TMP-P を発行。corpus に本伝なし（hw.py「الرداد」の見出しに أحمد بن موسى はない）。ID-Master 未登録（idsearch「زين العابدين」「الرداد」該当なし）。⚠ 次の possible_identity（#AIND-D10091）が成立するなら、その父「زين العابدين محمد بن موسى بن أحمد بن أبي بكر」と同一人物（名が أحمد／محمد で食い違う）＝ISSUES に記録。【集約 2026-11-05】父のナサブ「زين العابدين أحمد بن موسى بن أحمد الرداد」は #AIND-D10289「موسى بن زين العابدين أحمد بن موسى بن أحمد الرداد ويعرف بابن الزين」で裏づけられる（ラカブ زين العابدين＝識別要素、規則3）＝TMP-P 維持（決定18）。'
