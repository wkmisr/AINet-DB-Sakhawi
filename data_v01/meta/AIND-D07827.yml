translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・アビー・アブドゥッラー・ムハンマド・ブン・アッ＝ラディー・ムハンマド・ブン・アビー・バクル・ブン・ハリール・アル＝クラシー・アル＝ウマウィー・アル＝ウスマーニー・アル＝マッキー。その孫は少し前に前述。805年にアル＝イラーキー、アル＝ハイサミー、イブン・スィッディーク、アッ＝ザイン・アル＝マラーギー、アーイシャ・ビント・イブン・アブドゥルハーディーが彼にイジャーザを与えた。831年ムハッラム月朔日の夜の終わりに、あるいはその前年に、マッカで没した。イブン・ファハドはあるとき「830年代の某年」と言った。
  en: 'Muḥammad b. ʿAbd Allāh b. Abī ʿAbd Allāh Muḥammad b. al-Raḍī Muḥammad b. Abī Bakr b. Khalīl al-Qurashī al-Umawī al-ʿUthmānī al-Makkī; his grandson was mentioned shortly above. In the year [8]05 al-ʿIrāqī, al-Haythamī, Ibn Ṣiddīq, al-Zayn al-Marāghī and ʿĀʾisha bt. Ibn ʿAbd al-Hādī granted him ijāza. He died in Mecca at the end of the night of the first of Muḥarram 831, or the year before; Ibn Fahd once said: in [eight hundred and] thirty-odd.'
