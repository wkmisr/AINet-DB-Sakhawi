translation:
  ja: アサンブガー・アン＝ナージー、ハージブ（侍従）。彼は803年ジュマーダー・アル＝ウーラー月の最初の10日間に、アル＝アシュムーナインで亡くなった。彼はスルターン橋梁の建設を監督するために派遣されており、カイロへ船で運ばれ、そこで埋葬された。アル＝アイニーがこれを伝えている。
  en: Asanbughā al-Nājī al-Ḥājib. He died in the first ten days of Jumādā al-Ūlā in the year 803 H in al-Ashmūnayn. He had gone to supervise the construction of the Sultanic bridges, so he was brought by boat to al-Qāhira and was buried there. al-ʿAynī related this.
