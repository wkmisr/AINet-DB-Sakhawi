translation:
  ja: ムハンマド・ブン・アフマド・ブン・ユースフ、アル＝バドル・アル＝カーヒリー、シャーフィイー派、アミール・アル＝ジュユーシュ市場の商人で、イブン・ユースフとして知られる。学問に励んで頭角を現し、ハディースを少しく聴聞した者の一人で、彼が聴聞したものには、ウンム・ハーニ・アル＝ハウリーニーヤとその同席者たちのもとでの『ブハーリー』読了（ハトム）がある。思慮深く物静かで、身なりがよかった。若くして、おそらく〔8〕70年より前に没した。
  en: Muḥammad b. Aḥmad b. Yūsuf, al-Badr al-Qāhirī, the Shāfiʿī, the merchant in Sūq Amīr al-Juyūsh, known as Ibn Yūsuf. He was among those who studied and distinguished themselves, and he heard a little ḥadīth; among what he heard was the completion (khatm) of al-Bukhārī with Umm Hāniʾ al-Hawrīniyya and her fellow transmitters. He was sensible, quiet, and well dressed. He died young, before [8]70, I suppose.
