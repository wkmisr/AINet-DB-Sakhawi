translation:
  ja: ユースフ・ブン・サールージャー・ブン・アブド・アッラー、ジャマール・アッ＝ディーン、アル＝ヒジャーズィーとして知られる。さまざまな奉公先を転々とし、ウスターダールを務め、諸事に通じていた。アン＝ナースィルの治世の末期に、ダワーダールのトゥーガーンのもとで頭角を現した。トゥーガーンは彼の娘の夫で、彼を「父上」と呼んでおり、それが度重なったので、彼は「アブー・トゥーガーン」と呼ばれるようになった。（8）36年に没した。我らの師（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Yūsuf b. Ṣārūjā b. ʿAbd Allāh, Jamāl al-Dīn, known as al-Ḥijāzī. He passed through various positions in service and acted as ustādār, and he was knowledgeable in affairs. He rose to prominence at the end of al-Nāṣir's reign under the dawādār Ṭūghān, who was the husband of his daughter and used to call him "my father"; this happened so often that he came to be called Abū Ṭūghān. He died in the year [8]36. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
