    ja: '「وتقدم في أواخر دولة الناصر عند الدوادار طوغان」＝طوغان のもとで重用された（仕えた型、規則56）。الدوادار طوغان＝corpus 本伝 #AIND-D03440「طوغان الحسني الظاهري برقوق الدوادار وكان يعرف بالمجنون . ممن رقاه الناصر ابنه حتى عمله مقدما ثم دوادارا كبيرا … حتى قتل في المحرم سنة ثمان عشرة」（未収録）。名・職（الدوادار）・時期（الناصر فرج の治世末）で閉合（規則57）。他の طوغان: #AIND-D03442（دوادار طوخ الأبو بكري、848／849年没）・#AIND-D03443（الظاهر جقمق 期の دوادار السلطان بدمشق、856年没）は時期が合わない。#AIND-D03444（السيفي تغري بردي نائب الشام、主人 تغري بردي の私的ダワーダール。الناصر فرج 期のダマスクスで مقدم）は時期が重なるが、限定語のない「الدوادار」＋「دولة الناصر」での重用は、見出しに「الدوادار」を持ちスルターンの大ダワーダールだった D03440 に合う（ISSUES §D167-6 に確認依頼）。ブリーフが別人とした #AIND-D00789（أحمد بن طوغان）は不使用。初版 #NEEDID。'
