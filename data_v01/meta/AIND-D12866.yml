translation:
  ja: アーミナ・ビント・（欠）。シャムス・イブン・アル＝アフナースィーの妻で、その息子たち、すなわちワズィールのアラーとその兄弟たちの母。長命で、（8）88年ラジャブ月10日の前夜（9日の夜）に没した。翌日に葬礼が行われ、ナスル門外のスーク・アッ＝ダリースにある息子アラーの学院に葬られた。
  en: Āmina, daughter of [lacuna], wife of al-Shams Ibn al-Ahnāsī and mother of his sons, al-ʿAlāʾ the vizier and his brothers. She lived long and died on the eve of 10 Rajab of the year [8]88; the prayer over her was held the next day, and she was buried in the madrasa of her son al-ʿAlāʾ in Sūq al-Darīs outside Bāb al-Naṣr.
