notes:
- text: '転送見出し（原文「في الذي قبله」による）。転送先は直前の項 #AIND-D07910「محمد بن عبد الوهاب بن سليمان بن ابراهيم الشمس البلبيسي الأصل الخانكي الشافعي الزيات … ويعرف بابن عبد الوهاب . ولد سنة إحدى وأربعين وثمانمائة تقريبا بالخانقاه」（未受領）。D07910 本文に「وكنت لقيته قديما ببلده وترجمته وسميت جده العلم شاكر وقلت الزيات هو والده」とあり、「بن شاكر」はサハーウィーが以前の伝記で祖父として記した別名＝同一人物。'
