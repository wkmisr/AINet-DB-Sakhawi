translation:
  ja: アブド・アル＝カーディル・ブン・ムハンマド・ブン・ヤアクーブ・アル＝マダニー。後述のアブド・アル＝ワッハーブの兄弟で、マッカのマーリキー派カーディーであるアン＝ナジュム・ムハンマドの叔父。ムハンマド・ブン・ウマル・ブン・アル＝ムヒッブ・アッ＝ザランディーの姉妹を娶って姻戚となり、寛大さと品位によって人々の長となった。マディーナのワクフの代理職（タワックル）のためにエジプトとシャームに入った後、ルームへ旅し、両聖都（ハラマイン）のワクフをアジャムに引き渡さなかった。そして同地で、毒殺されたとも言われるが、870年代（873〜879年）に没した。
  en: ʿAbd al-Qādir b. Muḥammad b. Yaʿqūb al-Madanī, brother of ʿAbd al-Wahhāb (mentioned below) and paternal uncle of al-Najm Muḥammad, the Mālikī qadi of Mecca. He became related by marriage to Muḥammad b. ʿUmar b. al-Muḥibb al-Zarandī through his sister, and was a leading man in generosity and dignity. After entering Egypt and Syria on account of the agency (tawakkul) for the endowments of Medina, he travelled to Rūm and did not surrender the endowments of the two Sanctuaries to the ʿAjam; he died there, reportedly poisoned, in the year seventy-odd.
