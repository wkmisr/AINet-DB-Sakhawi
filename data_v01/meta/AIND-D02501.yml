translation:
  ja: フサーム・ブン・アブドゥッラー・フサーム・アッ＝ディーン・アッ＝サファディーは、その町（サファド）で崇敬されていた人物の一人で、ヤアクーブ区画に彼が所有するザーウィヤがあった。816年ラビーウ・アル＝アウワルに死去した。我らがシャイフ（イブン・ハジャル）が彼について言及している。
  en: Ḥusām b. ʿAbd Allāh Ḥusām al-Dīn al-Ṣafadī was among those who were held in esteem in his hometown (Ṣafad), and he had a zawiya in the Yaʿqūb quarter there. He died in Rabīʿ al-Awwal in the year 816 H. Our shaykh (Ibn Ḥajar al-ʿAsqalānī) mentioned him.
