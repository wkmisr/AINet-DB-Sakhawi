translation:
  ja: アブドゥルワッハーブ・ブン・アル＝ムヒッブ・ムハンマド・ブン・アン＝ヌール・アリー・ブン・ユースフ、アッ＝タージュ、アッ＝ザランディー、アル＝マダニー、父と同じくシャーフィイー派。後出のウマルとムハンマドの兄弟。アッ＝ザイン・アブー・バクル・アル＝マラーギーに聴聞した。
  en: ʿAbd al-Wahhāb b. al-Muḥibb Muḥammad b. al-Nūr ʿAlī b. Yūsuf, al-Tāj al-Zarandī al-Madanī, a Shāfiʿī like his father, brother of ʿUmar and Muḥammad, both mentioned below. He heard (ḥadīth) from al-Zayn Abū Bakr al-Marāghī.
