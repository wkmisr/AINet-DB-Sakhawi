translation:
  ja: アブドゥルラフマーン・ブン・ウスマーン・ブン・アミール。シャイルワーンに出自を持ち、マフムード・アーバードに住んだ後、ルーム地方（アナトリア）に移った。ハナフィー派。優れた学者である。海路でマッカに来航し、一部の学生が彼から学問を修め、また彼は私のところへ通ってきた。彼が私から聴聞したものの中には、ムサルサル・ハディース（『アル＝ムサルサル』）があった。彼はハディース学の術語についていくつか疑問を提起したので、私は彼にそれらを明快に説明した。彼は熱心に師事し続けることを望んだが、彼の故郷の人々はハディース学やその関連諸学に全く馴染みがなかったため、帰郷のために旅立った。彼は、自らが理知科学（アクリーヤート）に関する複数の著作や、多くの難解な書籍に対する注釈（ハワーシー）を執筆したと私に語った。
  en: ʿAbd al-Raḥmān ibn ʿUthmān ibn Amīr, of Shirwani origin, from Mahmudabad, then of Rum, Hanafi. He was a virtuous scholar. He arrived in Mecca by sea, and some students studied under him. He frequented my company and among the texts he heard from me was al-Musalsal. He raised some difficult points regarding terminology (al-iṣṭilāḥ), which I clarified for him. He traveled back despite his strong desire to remain in close discipleship, because the people of his region had no knowledge of Hadith and its related fields. He mentioned to me that he had authored works in the rational sciences (al-ʿaqliyyāt) and glosses (ḥawāshī) on many difficult books.
