translation:
  ja: ジャンバク・アル＝ヤフヤーウィー・アッ＝ザーヒリー、アレッポのアターバク・アル＝アサーキル（諸軍の総帥）。「ジャンバク」は「ジャーニバク」の短縮形である。802年シャウワール月半ば、アレッポ近郊のサージューラー（サージュール）でのアレッポの戦いにおいて、アフマド・ブン・ウワイスおよびカラ・ユースフ（の軍）との戦闘で殺害された。
  en: Janbak al-Yaḥyāwī al-Ẓāhirī, atābak al-ʿasākir in Aleppo — Janbak being a lightened form of Jānibak. He was killed in mid-Shawwāl of the year 802 in the battle of Aleppo at al-Sājūr, in the encounter with Aḥmad b. Uways and Qarā Yūsuf.
