translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・ウスマーン・ブン・スライマーン・ブン・ラスール、バドル〔・ッディーン〕・イブン・アル＝ムヒッブ・イブン・アル＝アシュカル。旧ザーヒリーヤ学院での『ブハーリー』読了会を聴聞した者の一人。父の後にサルヤークースのナーシリーヤ・ハーンカーのシャイフ職とナーズィル職に、兄シハーブ〔・ッディーン〕・アフマドと共同で就いた。その後ザーヒル・フシュカダムの時代にジャーニバク・アル＝ジャッダーウィーがナーズィル職を奪い、シハーブ・アル＝アイニーがこれに続き、さらに4年後に〔本人は〕モスクから追われたが、本項の主が約1000ディナールを支払い、スーフィーたちの助力もあって〔職を取り戻し〕しばらく独占した。無名で困窮が甚だしく、慎みを欠いていた。
  en: Muḥammad b. Muḥammad b. ʿUthmān b. Sulaymān b. Rasūl, al-Badr b. al-Muḥibb Ibn al-Ashqar. One of those who attended the completion (khatm) of al-Bukhārī at the old Ẓāhiriyya. He succeeded his father as shaykh and nāẓir of the Nāṣiriyya khānqāh at Siryāqūs, jointly with his brother al-Shihāb Aḥmad. Then, in the days of al-Ẓāhir Khushqadam, Jānibak al-Jaddāwī seized the supervision, followed by al-Shihāb al-ʿAynī; four years later he was expelled from the mosque, until the subject paid about a thousand dinars, with the help of the Sufis, and held it alone for a time — despite his obscurity, great poverty and lack of caution.
