translation:
  ja: アブドゥルラフマーン・ブン・ウマル・ブン・ムハンマド・ブン・アフマド・ブン・ウマル・アル＝ハウラーニー・アル＝マッキー。後述のヤフヤーの兄弟。ヒジュラ暦886年ジュマーダー・アル＝ウーラー（第5月）にジッダで生まれた。マッカにて、ファキーフ（法学者）であるハサン・アル＝タルハーウィーのもとでクルアーンを朗読し、またマッカにて、彼の兄弟の朗読によって私（サハーウィー）から『サヒーフ（・アル＝ブハーリー）』の一部を聴聞し、さらに私から『アル＝ムサッサル』などを聴聞した。
  en: ʿAbd al-Raḥmān b. ʿUmar b. Muḥammad b. Aḥmad b. ʿUmar al-Ḥawrānī al-Makkī, the brother of Yaḥyā who is mentioned below. He was born in Jumādā al-Ūlā, the year 886 AH, in Jidda. He recited the Qurʾān under the jurist Ḥasān al-Ṭalkhāwī in Mecca, and heard from me [al-Sakhāwī] there, through the recitation of his brother, a portion of al-Ṣaḥīḥ, as well as al-Musalsal and other works directly from me.
