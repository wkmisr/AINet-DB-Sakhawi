translation:
  ja: イーサー・ブン・イブラーヒーム・ブン・イーサー・ブン・イブラーヒーム・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ウマル・ブン・アブド・アッ＝ラフマーン・ブン・アブドゥッラー、アブー・イブラーヒーム・アン＝ナーシリー。優れた、善良で敬虔な人物で、良い品性と立派な行状の持ち主であった。兄弟ウマルの後を受けてザビードのサラーヒーヤの傍らにあるジュライジャーン・モスクのイマームを務め、クルアーンを教えて、（8）37年に没するまで続けた。
  en: ʿĪsā b. Ibrāhīm b. ʿĪsā b. Ibrāhīm b. Abī Bakr b. ʿAbd Allāh b. ʿUmar b. ʿAbd al-Raḥmān b. ʿAbd Allāh, Abū Ibrāhīm al-Nāshirī. He was learned, good and pious, of fine character and good conduct. He served as imam of the Mosque of Julayjān, beside the Ṣalāḥiyya of Zabīd, after his brother ʿUmar, and taught the Qurʾān until he died in the year (8)37.
