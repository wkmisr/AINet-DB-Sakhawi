translation:
  ja: ムハンマド・ブン・ハリール（無点字で、カビールと同じ型）、ジャマール・アッ＝ディーン。港町アデンに住んでいた。アル＝ジャマール・ムハンマド・ブン・カッバンは彼を篤く信頼していた。というのも、彼（イブン・カッバン）が罷免されていたある時期に、彼が翌日には復職すると吉報を告げ、その通りになったからである。そこで彼（イブン・カッバン）は彼に俸給を定め、彼に祈願（ドゥアー）を求めていた。842年に没した。
  en: Muḥammad b. Ḥarīr (with undotted letters, on the pattern of kabīr), Jamāl al-Dīn. He resided in the port of Aden. Al-Jamāl Muḥammad b. Kabban had great faith in him, because during one of his (Ibn Kabban's) dismissals from office he gave him the good tidings that he would be restored the next day, and so it came to pass; so he assigned him a stipend and used to ask him for his prayers. He died in the year 842.
