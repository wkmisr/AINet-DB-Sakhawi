translation:
  ja: アブドゥルカーディル・ブン・サラーフ・アッ＝ディーン・アッ＝ラハビー。カラムターイの外孫。母はファーティマ（カースィム・アル＝ブルキーニーの妻）。彼は放縦のうちに母の庇護下で育ったが、後に慎ましやかな生活（少欲知足）へとわずかに改心し、そのまま889年あるいはその翌年（890年）に没した。
  en: ʿAbd al-Qādir b. Ṣalāḥ al-Dīn al-Raḥabī, grandson of Qalamṭāī. His mother was Fāṭima, the wife of Qāsim al-Bulqīnī. He was raised under his mother's care in an unrestrained manner, but later reformed slightly, adopting a modest and ascetic lifestyle until he died in the year 889 AH or the following year (890 AH).
