notes:
- text: '転送見出し（原文「صوابه محمد بن أبي بكر بن محمد بن أبي الفتح وسيأتي」による）。転送先は #AIND-D07250「464 محمد بن أبي بكر بن محمد بن أبي الفتح الشمس البيري الشافعي الضرير ويعرف بابن الحداد . ولد بالبيرة بشاطئ الفرات … مات بالبيرة في ثاني عشر رجب سنة تسع عشرة ودفن بزاويته . ذكره ابن خطيب الناصرية وشيخنا في أنبائه ، وسماه بعضهم محمد بن أحمد بن أبي بكر والصواب ما هنا .」（repo 未収録）。訂正後のナサブ4代・ニスバ البيري・学派・通称 ابن الحداد が一致し、相手側も「ある者は彼を محمد بن أحمد بن أبي بكر と呼んだが、正しいのはここに記したほうである」と本項の見出しの形を名指しして退けている（ブリーフどおり）。相手側にない内容を本項は持たない＝規則66 (k) の例外に当たらない。'
  type: reference
translation:
  ja: ムハンマド・ブン・アフマド・ブン・アビー・バクル・アル＝ビーリー・アッ＝シャーフィイー、イブン・アル＝ハッダード。正しくはムハンマド・ブン・アビー・バクル・ブン・ムハンマド・ブン・アビー・アル＝ファトフであり、後出。
  en: Muḥammad b. Aḥmad b. Abī Bakr al-Bīrī al-Shāfiʿī, Ibn al-Ḥaddād. The correct form is Muḥammad b. Abī Bakr b. Muḥammad b. Abī al-Fatḥ, and he will come below.
