translation:
  ja: アハマド・アル＝ハーリディー、サファドのクルアーン朗誦家の一人。彼は敬虔で徳があり、名声があった。810年ズー・アル＝カアダ月に同地（サファド）で死去した。我らがシャイフ（イブン・ハジャル）は彼の伝記を『インバーウ・アル＝グムル』で言及している。
  en: Ahmad al-Khālidī, one of the Qurʾān reciters in Safad. He possessed piety and goodness, and was renowned. He died there (Safad) in Dhū al-Qaʿda in the year 810 H. Our shaykh (Ibn Ḥajar) mentioned him in his 『Inbāʾ al-Ghumr』.
