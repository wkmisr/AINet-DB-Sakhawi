translation:
  ja: アリー・ブン・ムハンマド・ブン・アフマド、ヌール・アッ＝ディーン・アブー・アル＝ハサン、フィーシャ出自のアル＝カーヒリー、マーリキー派。祖父がアリー・ブン・ムハンマド・ブン・イブラーヒームである者の項で後述する。
  en: ʿAlī b. Muḥammad b. Aḥmad, Nūr al-Dīn Abū al-Ḥasan, of Fīshī origin, al-Qāhirī al-Mālikī. He will come below among those whose grandfather is ʿAlī b. Muḥammad b. Ibrāhīm.
