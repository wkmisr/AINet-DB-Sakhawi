notes:
- text: '転送見出し（原文末尾「يأتي فيمن جده علي بن محمد بن إبراهيم」による）。転送先は #AIND-D05488「علي بن محمد بن علي بن محمد بن إبراهيم نور الدين أبو الحسن الفيشي الحناوي القاهري المالكي نزيل مكة」（刊本 1069 番、未受領）。名・父名・ラカブ・クンヤ・ニスバ・学派が一致し、祖父 علي بن محمد بن إبراهيم も一致。本見出しの父名「محمد بن أحمد」は転送先の「محمد بن علي」と祖父名が食い違う（転送先のナサブが正とみて転送指示に従う）。'
