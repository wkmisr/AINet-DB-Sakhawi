translation:
  ja: ムハンマド・ブン・アブー・バクル、ガザ出自（アル＝ガッザーウィー・アル＝アスル）でアブーティージュの人、のちカイロの人、日雇い労働者（アル＝ファーイル）で庶民の一人、建築職人サイイドの子スライマーンの従兄弟で、アル＝ムアッズィンとして知られた。アル＝キダーシーンのシャイフ・トゥルキーのザーウィヤの奉仕者。892年の二つのラビーウ月のいずれかに施療院（ビーマーリスターン）で没した。彼は一度ならず巡礼し滞留した。
  en: Muḥammad b. Abī Bakr, of Gazan origin, al-Būtījī then al-Qāhirī, a day-labourer (al-fāʿil), one of the common people, cousin of Sulaymān b. Sayyid the builder, and known as al-Muʾadhdhin. Servant (khādim) of the zāwiya of Shaykh Turkī at al-Kidāshīn. He died in the Bīmāristān in one of the two Rabīʿ months of 892. He had performed the pilgrimage and sojourned more than once.
