translation:
  ja: アブドゥルカーディル・ブン・ムハンマド・ブン・アブドゥッラー・アッ＝ダムィーリー・アッ＝ディマシュキー・アル＝ハンバリー。アル＝イッズ・イブン・ファハドが彼に面会し、彼が創作した預言者賛美詩（その最初の句は「ヤ・サアド、お前にとって幸福がある…」）を書き写した。また、彼はイジャーザを与え、アン＝ナワウィーの「四十のハディース」の注釈書を著して『アッ＝ドゥラル・アル＝ムディーヤ・ワ・アル＝クトゥビーヤ』と名付け、さらに『アル＝ブルダ』への唱和詩（ムアーラダ）として預言者に対する賛美詩『アッ＝ザフル・フィー・アル＝アーカーム・フィー・マドヒ・アン＝ナビー・アライヒ・アッ＝サラーム』を著し、さらに『バーナト・スアード』の唱和詩などを作ったと述べた。
  en: 'ʿAbd al-Qādir b. Muḥammad b. ʿAbd Allāh al-Dhamīrī al-Dimashqī al-Ḥanbalī. Al-ʿIzz b. Fahd met him and copied from him a prophetic praise poem of his own composition, beginning with: ''O Saʿd, happiness is yours if you strive...'' He also granted him an ijāza and mentioned that he wrote a commentary on al-Nawawī''s Forty Hadiths, naming it ''al-Durar al-Muḍiyya wa-l-Quṭrubiyya'', and composed a poem in opposition (muʿāraḍa) to the ''Burda'' named ''al-Zahr fī al-Akām fī Madḥ al-Nabī ʿAlayhi al-Salām'', as well as a muʿāraḍa of ''Bānat Suʿād'' and other works.'
