translation:
  ja: ムハンマド・ブン・アリー・ブン・ウバイド、アブー・アブドゥッラー・アッ＝サンハーヒー・アッ＝トゥーニスィー、クルアーン読誦家にして訓導、アル＝アラビー、多芸（アル＝ムファンナン）で、とくに読誦学に長け、他の学にも参与した。868年ラビーウ・アッ＝アウワル月に同地（チュニス）で没した。イブン・アズムが彼に言及している。
  en: Muḥammad b. ʿAlī b. ʿUbayd, Abū ʿAbd Allāh al-Ṣanhāḥī al-Tūnisī, the Qurʾān reciter and teacher of children, al-ʿArabī, versed in many disciplines (al-mufannan), the Qurʾān readings predominating in him, with a share in other fields. He died there (in Tunis) in Rabīʿ al-Awwal [8]68. Ibn ʿAzm mentioned him.
