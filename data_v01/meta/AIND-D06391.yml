translation:
  ja: クルルブガー。フィールーズ・アッ＝サーキーのもとで仕え、のち礼拝と（クルアーン）読誦に専念し、ハーキム運河沿いのシャック・アッ＝スウバーンとスンクル橋の近くにモスクを建ててそこに籠った。アッ＝ザーヒル・ジャクマクの時代に没した。
  en: Kurulbughā. He served under Fīrūz al-Sāqī, then devoted himself to worship and recitation, and built a mosque on al-Khalīj al-Ḥākimī near Shaqq al-Thuʿbān and Qanṭarat Sunqur, where he secluded himself. He died in the days of al-Ẓāhir Jaqmaq.
