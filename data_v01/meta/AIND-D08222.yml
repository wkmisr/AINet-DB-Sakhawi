translation:
  ja: ムハンマド・ブン・アリー・ブン・ユースフ・ブン・サーリム・ブン・アティーヤ・ブン・サーリフ・ブン・アブド・アン＝ナビー、アル＝ジャマール・アル＝ジュハニー・アル＝マッキー、イブン・アビー・アル＝イスバウとして知られる。アル＝ファーシーは言う、「彼はマッカで我々のシャイフたちの幾人かから聴講し、ヤルブガー講座の学生の一人で、商いのためにイエメンを行き来していた。815年サファル月にマッカで没し、アル＝マアラーに葬られた」。
  en: 'Muḥammad b. ʿAlī b. Yūsuf b. Sālim b. ʿAṭiyya b. Ṣāliḥ b. ʿAbd al-Nabī, al-Jamāl al-Juhanī al-Makkī, known as Ibn Abī al-Iṣbaʿ. Al-Fāsī said: he heard from some of our shaykhs in Mecca, was one of the students of the Yalbughā lesson (dars), and used to travel back and forth to Yemen for trade. He died in Ṣafar of the year 815 in Mecca and was buried at al-Muʿallā.'
