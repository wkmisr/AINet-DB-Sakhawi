translation:
  ja: ムハンマド・ブン・アフマド・ブン・ムーサー、アル＝バドル・アブー・アブドゥッラー・アッ＝ラムサーウィー・アッ＝ディマシュキー、法学者、シャーフィイー派。大いに学問に励んで秀で、自筆で多くを筆写し、アル＝アスルーニーヤとアル＝アクリーヤで教授した。巡礼を行い、（聖地に）滞在した。〔8〕01年ラビーウ第一月に、40歳を過ぎたところで没した。人々から離れて引きこもり、悪事とは無縁で、むしろそれから遠い人であった――兄弟のムーサーとは異なって。我らがシャイフ（イブン・ハジャル）はその『インバー』でこの人物について簡略に記している。
  en: Muḥammad b. Aḥmad b. Mūsā, al-Badr Abū ʿAbd Allāh al-Ramthāwī al-Dimashqī, the jurist, the Shāfiʿī. He studied much, excelled, and copied a great deal in his own hand; he taught at al-ʿAṣrūniyya and al-Akriyya, performed the pilgrimage and sojourned (in the Holy City). He died in Rabīʿ I of the year [8]01, having passed forty. He kept apart from people and was of little harm—indeed far from it—unlike his brother Mūsā. Our shaykh (Ibn Ḥajar) mentioned this man briefly in his Inbāʾ.
