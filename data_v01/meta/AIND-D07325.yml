notes:
- text: |-
    転送見出し（原文の「في ابن عبد الله بن حجاج」による）。転送先は #AIND-D07764（刊本 175 番「محمد بن عبد الله بن حجاج بدر الدين البرماوي الأصل القاهري الماضي أبوه . رجل سيئ الطباع بغيض متساهل في الديانة والأمانة …」）。閉合根拠: (1) 指示ナサブ「محمد بن عبد الله بن حجاج」と D07764 の見出しが**逐語一致**（世代の増減なし）。(2) D07764 は corpus の محمد بن عبد الله 部の祖父名アルファベット順（… بن جار الله → بن حجاج → بن حسن …）の正位置にある。(3) 父 #AIND-D04437「عبد الله بن حجاج بن أحمد بن موسى البرماوي القاهري المكتب **والد البدر محمد الآتي** ويعرف بابن حجاج」と「الماضي أبوه」で双方向に閉合する。
    校閲版が充てていた #AIND-D07851（محمد بن عبد الله بن **يوسف بن** حجاج بن قريش）は يوسف が1段多い別人で、その短縮形は شهرة 索引 #AIND-D12637（ابن قريش）が担う。
