    ja: '「مضادة لابن عبد السلام فصار بزبيد قاضيان」。ابن عبد السلام ＝ #AIND-D07655「74 محمد بن عبد السلام ويسمى أيضا عمر بن أبي بكر بن محمد الجمال أبو عبد الله … الناشري الشافعي أحد قضاة زبيد」（ザビードのカーディーの一人）。父名 عبد السلام＋職（قاضي زبيد）＋家名 الناشري で閉合するが父名のみの呼称なので cert medium。「مضادة」（対抗して）は repo 統制語彙 rival（27件）に合わせた。'
