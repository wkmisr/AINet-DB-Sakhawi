  note:
    ja: '父 أحمد بن محمد الناشري。本項主は「ابن عم صاحبنا حمزة بن عبد الله بن محمد الماضي」＝#AIND-D02778（حمزة بن عبد الله بن محمد بن علي بن أبي بكر … الناشري الزبيدي）の従兄弟で、D02778 本文に「وعن عمه أحمد بن محمد الناشري」（حمزة の父方の叔父）が出る。この叔父＝ #AIND-D01408「414 أحمد بن محمد بن علي بن أبي بكر بن علي بن محمد بن أبي بكر … الفقيه العالم المفتي الشهاب … اليماني الناشري … ولد سنة خمس عشرة وثمانمائة … ومات في حياة أبويه سنة سبع وخمسين」（حمزة の祖父 محمد بن علي بن أبي بكر の子）。ナサブ（أحمد بن محمد）・家名 الناشري الزبيدي・「حمزة の従兄弟」の3点で閉合するが、本項主自身の名が D01408 側に出ないため cert medium（規則23・57）。ISSUES §D157 に記録。'
