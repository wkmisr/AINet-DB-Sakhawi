translation:
  ja: ムーサー・ブン・アフマド・ブン・ムハンマド、アル＝カマール・アッ＝ザビーディー・アン＝ナーシリー・アッ＝シャーフィイー。我らの友人ハムザ・ブン・アブドゥッラー・ブン・ムハンマド（既述）の従兄弟。イエメンの頭領である法学者ユースフ・ブン・ユーヌス・アル＝ムクリーが、イブン・アブド・アッ＝サラームに対抗させてザビードのカーディー職に彼を推したため、ザビードには二人のカーディーが並立することになった。
  en: Mūsā b. Aḥmad b. Muḥammad, al-Kamāl al-Zabīdī al-Nāshirī al-Shāfiʿī, the paternal cousin of our companion Ḥamza b. ʿAbd Allāh b. Muḥammad (mentioned above). The jurist Yūsuf b. Yūnus al-Muqrī, the chief of Yemen, put him forward for the office of judge in Zabīd in opposition to Ibn ʿAbd al-Salām, so that there came to be two judges in Zabīd.
