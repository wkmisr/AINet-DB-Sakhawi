  note:
    ja: '「ابن عم صاحبنا حمزة بن عبد الله بن محمد الماضي」＝#AIND-D02778（حمزة بن عبد الله بن محمد بن علي بن أبي بكر التقي أبو العباس … الناشري الزبيدي الشافعي、833生）。名・父・祖父が一致（規則26「الماضي」＋名の一致）。初版の #NEEDID を置換。'
