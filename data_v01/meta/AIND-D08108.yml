  ja: ムハンマド・ブン・アリー・ブン・アブドゥッラッザーク・ブン・ムハンマド・ブン・アフマド・ブン・ユースフ、ダマンフール出自、アッ＝サカンダリー、マーリク派、イブン・マルズークとして知られる。775年頃にアッ＝サグル（アレクサンドリア）で生まれた。アル＝ビカーイーが名のみを挙げている。
  en: Muḥammad b. ʿAlī b. ʿAbd al-Razzāq b. Muḥammad b. Aḥmad b. Yūsuf, of Damanhūrī origin, al-Sakandarī, al-Mālikī, known as Ibn Marzūq. He was born in about the year 775 at al-Thaghr (Alexandria). Al-Biqāʿī mentioned him by name only.
