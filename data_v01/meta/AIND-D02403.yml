translation:
  ja: ジャジクブガー。シャーム（シリア）におけるスルターン付ダワーダール。アッ＝ザーヒル・ジャクマクは彼を、マー・ワラー・アン＝ナフルの王シャー・ルフ・ブン・ティムールのもとへ派遣した。彼の語るところでは、シャー・ルフはイブン・ハジャル、イブン・アッ＝ダイリー、イブン・カーディー・シュフバ、イブン・アル＝ムザッリクの一人一人について個別に尋ね、「私は『息災です』『元気です』と答えた」。シャー・ルフは彼ら以外の誰についても尋ねず、そして「アッラーに讃えあれ、人々の中にはまだ（善き者の）名残がある」と言ったという。彼（ジャジクブガー）はその後に死去した。
  en: 'Jajikbughā, the Sultan''s dawādār in al-Shām. Al-Ẓāhir Jaqmaq dispatched him to Shāhrukh b. Timur, the ruler of Transoxiana. He related that Shāhrukh asked about Ibn Ḥajar, Ibn al-Dayrī, Ibn Qāḍī Shuhba, and Ibn al-Muzalliq, each one individually, "and I would say: fine, or well." He asked about no one else, and then said, "Praise be to God — there is still a remnant (of good men) among the people." He (Jajikbughā) died after that.'
