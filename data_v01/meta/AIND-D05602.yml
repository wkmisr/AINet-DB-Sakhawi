translation:
  ja: アリー・ブン・ムハンマド、アル＝アラー・アル＝ハラビー、のちにアル＝カーヒリー、ジャマーリーヤ（・ハーンカー）の居留者で、イブン・シャムスとして知られる。ペルシア風の書法に秀で、自筆で多くを書写した。父の存命中、856年に没した。神の慈悲あれ。
  en: ʿAlī b. Muḥammad, al-ʿAlāʾ, al-Ḥalabī then al-Qāhirī, resident of the Jamāliyya (khānqāh), known as Ibn Shams. He was highly skilled in calligraphy in the Persian style and copied many works in his own hand. He died during his father's lifetime in the year 856 AH. May God have mercy on him.
