translation:
  ja: ムハンマド・ブン・アリー・ブン・スィナーン・ブン・アブドゥッラー・ブン・ウマル・ブン・マスウード・アル＝ウマリー、隊長（カーイド）。843年ラジャブ月にマッカの外で没し、運ばれてマッカのアル＝マアラーに葬られた。イブン・ファハドが没年を記している。
  en: Muḥammad b. ʿAlī b. Sinān b. ʿAbd Allāh b. ʿUmar b. Masʿūd al-ʿUmarī, the qāʾid (commander). He died in Rajab of the year 843 outside Mecca and was carried (there) and buried in its al-Muʿallā cemetery. Ibn Fahd recorded his date of death.
