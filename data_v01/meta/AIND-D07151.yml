translation:
  ja: ムハンマド・ブン・バダル・ブン・ムハンマド、アッ＝シャムス・ブン・アル＝バドル・アル＝アルダビーリー・アッ＝タブリーズィー、シャーフィイー派。クルアーン、『シャーティビーヤ』、バガウィーの『マサービーフ』、『ハーウィー・サギール』、ともにバイダーウィーの『ミンハージュ』と『タワーリウ』、『タルヒース』とその注釈『ムフタサル』を暗記し、843年ラマダーン月にそれらを我らがシャイフ（イブン・ハジャル）ら一団に提示（暗誦試問）した。それどころか彼（イブン・ハジャル）のもとで『ブハーリー』の冒頭のかなりの部分を読み、彼（イブン・ハジャル）は彼を「徳高きシャイフ、完全なる記憶者、傑出して熟達した学者、その町の人々の誇り、その時代の星々の輝き」と評し、「神が彼に、暗記したものを活かす助けを与え、神が彼に託し保持させたものについて神の恩恵への感謝を授けたまわんことを」と述べた。
  en: 'Muḥammad b. Badal b. Muḥammad, al-Shams b. al-Badr al-Ardabīlī al-Tabrīzī, the Shāfiʿī. He memorised the Qurʾān, al-Shāṭibiyya, al-Baghawī''s al-Maṣābīḥ, al-Ḥāwī al-Ṣaghīr, al-Minhāj and al-Ṭawāliʿ (both by al-Bayḍāwī), al-Talkhīṣ and its commentary al-Mukhtaṣar, and presented them to a group including our shaykh (Ibn Ḥajar) in Ramaḍān 843; indeed he also read with him a good portion of the beginning of al-Bukhārī. He (Ibn Ḥajar) described him as "the excellent shaykh, the perfect memoriser, the brilliant and skilled scholar, the pride of the people of his town and the brightest of the stars of his age", and said: "May God help him to profit from what he has memorised, and inspire him to give thanks for His favour in what He has entrusted to him and had him preserve."'
