translation:
  ja: 924. イスマーイール。タージル家のアブー・トゥーラーブのシャイフ、アブド・アッラフマーンの息子。両者（イスマーイールとその父）は、アブシーヤ・アルムラッグのシャイフを殺害した罪で871年シャアバーン月に両者とも皮を剥がれた。彼らは文字通り、また比喩的にも、時代の悪しき者たちの一人であった。
  en: 924. Ismāʿīl b. ʿAbd al-Raḥmān, son of the merchant Shaykh Abū Turāb. Both he and his father were flayed in Shaʿbān 871 H, accused of killing the shaykh of Abshīh al-Mulaqq. They were, literally and figuratively, among the evils of their time.
