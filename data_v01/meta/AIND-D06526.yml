notes:
- text: '転送見出し（原文末尾「يأتي في الكنى」による）。転送先はクンヤ部の #AIND-D10633「أبو بكر بن إبرهيم بن علي بن أحمد بن بريد المحب بن البرهان الحليمي الأصل الدمشقي الشافعي القادري الماضي أبوه وأمه هي ابنة خال السيد الشمس محمد بن حسن القادري الماضي . ولد سنة خمس وخمسين بدمشق … وأسممه والده على وتكرر قدومه للقاهرة بعد موت والده … وبيده مشيخة تصوف بالصالحية」（未受領）。クンヤ名 أبو بكر・ラカブ المحب・父 إبراهيم（البرهان、#AIND-D00182）で閉合（ブリーフ候補を本文で確認）。'
  type: reference
- text: '「أخو الذي قبله وهو الأكبر」＝直前の項 #AIND-D06525（عفيف الدين أبو الطاهر محمد、幼くして没）の兄で、本項主のほうが年長（本項の記述）。D06525 の本文は兄に触れないので、D06525 側に兄弟 relation は立てていない。兄弟関係は転送先 D10633 の受領時に、共通の父 #AIND-D00182 と本見出しによって立てる。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・イブラーヒーム、アル＝ムヒッブ・アブー・バクル。前項の人物の兄弟で、こちらが年長である。クンヤの部で後述する。
  en: Muḥammad b. Ibrāhīm, al-Muḥibb Abū Bakr, brother of the preceding, and he is the elder. He will come below among the kunyas.
