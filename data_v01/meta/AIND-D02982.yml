translation:
  ja: ズン・ヌーン・アル＝ガッズィー、名はムハンマド・ブン・アブドゥッラー・ブン・サーリフ。彼は交易を営む偉大な人物であった。ザイン・アブドルラフマーン・アル＝カルカシャンディーがその父シャムスから聞いた話として、彼はあの地域の守護者（ハフィール）であったと語っている。我らがシャイフ（イブン・ハジャル）は彼にアーミド（への旅）の年に出会っている。
  en: 'Dhu al-Nun al-Ghazzi, his name is Muhammad b. Abd Allah b. Salih. He was a great man who engaged in trade. Zayn al-Din Abd al-Rahman al-Qalqashandi related from his father, al-Shams, that he said: ''He is the protector of those lands.'' Our shaykh (Ibn Hajar) met him in the year of Amid.'
