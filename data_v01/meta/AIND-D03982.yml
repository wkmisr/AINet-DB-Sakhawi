translation:
  ja: アブドゥルアズィーズ・ブン・アリー・ブン・ムハンマド・ブン・マフムード・ブン・（大学者ヌール・アッ＝ディーン）アリー・ブン・ファルフーン、アル＝イッズ・アル＝ヤアムリー・アル＝マダニー・アル＝マーリキー。製本師（アル＝ムジャッリド）として知られ、それは彼と父の職であった。マディーナで私（サハーウィー）から聴聞した者の一人。
  en: ʿAbd al-ʿAzīz b. ʿAlī b. Muḥammad b. Maḥmūd b. (the eminent scholar Nūr al-Dīn) ʿAlī b. Farḥūn, al-ʿIzz al-Yaʿmurī al-Madanī al-Mālikī. He was known as al-Mujallid (the bookbinder), which was his craft and his father's. He was among those who heard from me in Medina.
