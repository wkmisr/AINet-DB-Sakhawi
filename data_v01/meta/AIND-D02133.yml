translation:
  ja: バドル・ブン・アリー・アル＝クワイスィニー・アル＝カーヒリー・アッ＝シャーフィイー。学識ある敬虔な人物で、教授しファトワーを発した。私たちが出会った者のうち一人ならぬ人々が彼から学んだ。アン＝ヌール・アル＝ビルバイスィーにイジャーザを与え、（ヒジュラ暦80）6年の披露（アルド）に書き付けた。私は彼を立伝した者を見たことがない。「バドル」は彼のラカブ（通称）であると同時にイスム（本名）でもあったようである。
  en: Badr b. ʿAlī al-Quwaysinī al-Qāhirī al-Shāfiʿī. He was a pious scholar who taught and issued fatwas, and more than one of those we met acquired knowledge from him. He granted an ijāza to al-Nūr al-Bilbaysī and wrote his approbation on a presentation (ʿarḍ) in the year [80]6 AH. I have not seen anyone who wrote a biography of him. It seems that Badr was both his title and his proper name.
