    ja: 'النور البلبيسي=#AIND-D05465(علي بن محمد بن عثمان بن عبد الرحمن بن عثمان نور الدين البلبيسي ثم القاهري الأزهري、إمام الأزهرとして著名、生797)。D05465は797年生まれで806年の披露(عرض)と整合。D07999(息子المحب)の相互参照でも閉合。 / 名寄せ監査（2026-11-05）要修正4: 「وأجاز النور البلبيسي وكتب في عرض سنة ست」の النور البلبيسي＝#AIND-D05083（علي بن أبي بكر … نور الدين … البلبيسي、782 生）。その本伝「وعرض في سنة إحدى وتسعين فما بعدها على … وبدر الدين القويسنس」に本項主が出る＝سنة ست は 796 年と読む。裸の「النور البلبيسي」なので cert medium（D09544「النور البلبيسي」も候補になりうる）。上の note の #AIND-D05465（797 生）は 796 年の عرض が不可能で誤り（旧判断の記録）。'
