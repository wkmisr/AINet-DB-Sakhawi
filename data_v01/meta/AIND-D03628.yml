translation:
  ja: アブドゥルラフマーン・ブン・ハリーファ・ブン・アフマド・アッ＝タハターウィー・アッ＝サイードィー・アッ＝シャーフィイー。マッカに居住し、その地のバーブ・アッ＝サラーム（平和の門）において公証人（シャーヒド）の職に就いていた。ハティーブ（説教師）として知られる。マッカとマディーナにおいて私（サハーウィー）からハディースを聴聞した。
  en: ʿAbd al-Raḥmān b. Khalīfa b. Aḥmad al-Ṭahṭāwī al-Ṣaʿīdī al-Shāfiʿī. He resided in Mecca and sat for notary testimony (shahāda) at Bāb al-Salām there, and was known as al-Khaṭīb. He heard (ḥadīth) from me (al-Sakhāwī) in Mecca and in Medina.
