translation:
  ja: ムハンマド・ブン・アフマド・アル＝キーラーニー・アル＝バジャールビニフ——バーにカスラ、次いでジーム、末尾がラーで、ある町の名であり、「某町の子」と言ったようなものである——アル＝アズハリー・アッ＝シャーフィイー。カイロに来てアズハルに隣住（ジワール）した。精緻な学者にして善人であり、俊英たちが彼から学んだ。アッ＝ザイン・ザカリヤーが彼について、アル＝ジャーラバルディーの『シャーフィヤ注釈』とアッ＝タフターザーニーの『イッズィーの語形論注釈』を読んだ。（8）50年頃にカイロで没した。
  en: Muḥammad b. Aḥmad al-Kīlānī al-Bijārbinih — with kasra on the bāʾ, then jīm, ending in rāʾ; it is the name of a town, as if one said "the son of such-and-such a town" — al-Azharī al-Shāfiʿī. He came to Cairo and sojourned at al-Azhar. He was a learned, meticulous and pious scholar; men of merit took knowledge from him, and al-Zayn Zakariyyā read with him the commentary on al-Shāfiya by al-Jārabardī and the commentary on Taṣrīf al-ʿIzzī by al-Taftāzānī. He died in Cairo around the year (8)50.
