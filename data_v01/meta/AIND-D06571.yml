translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ユースフ・ブン・ハーリド・ブン・アイユーブ・ブン・ムハンマド、アル＝イッズ、アブー・アル＝バカー、アッ＝ラバイー、アル＝ハスファーウィー、アル＝ハラビー、アッ＝シャーフィイー。父は既出、父方おじアブー・バクル・ブン・ユースフは後出。アル＝アシュラフ・カーイトバーイの治世に、大半を借金でまかなった献金によって、繰り返しアレッポのカーディー職に就いた者の一人。彼の祖父もまた同地のカーディー職に就いた者の一人である。
  en: Muḥammad b. Ibrāhīm b. Yūsuf b. Khālid b. Ayyūb b. Muḥammad, al-ʿIzz Abū al-Baqāʾ, al-Rabaʿī al-Ḥasfāwī al-Ḥalabī al-Shāfiʿī, whose father has been mentioned above and whose paternal uncle Abū Bakr b. Yūsuf will come below. He was among those who held the judgeship of Aleppo in the days of al-Ashraf Qāytbāy, time after time, by means of payments most of which were borrowed. His grandfather, too, was among those who held its judgeship.
