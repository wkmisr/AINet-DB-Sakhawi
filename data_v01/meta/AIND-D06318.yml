translation:
  ja: カラーブガー・アル＝アスナブガーウィー、エジプトの小ハージブ。トルコ人かトルクメン人であった。（8）02年ラビーウ第一月16日の日曜日、アイタミシュの戦いで負った傷がもとで没した。アル＝アイニーが彼に言及しており、別の者は「アッ＝ザーヒル・バルクークの治世のムカッダムの一人で、カイロでのアイタミシュの戦いで殺された」と述べている。
  en: 'Qarābughā al-Asanbughāwī, the lesser chamberlain (al-ḥājib al-ṣaghīr) in Egypt. He was a Turk or a Turkmen. He died on Sunday the 16th of Rabīʿ I of the year [80]2 from wounds he sustained in the battle of Aytamish. Al-ʿAynī mentioned him, and someone else said: one of the muqaddams in the reign of al-Ẓāhir Barqūq, killed in the battle of Aytamish in Cairo.'
