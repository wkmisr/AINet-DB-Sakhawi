translation:
  ja: ハタト（点のない文字で、第1・第2母音はファトハ、チェルケス系の名前）。アル＝バクラミシー（バクラミシュ・アル＝アラーイーの（マムルーク））。主人の死後、スルタン・アル＝ナースィル・ファラジュのもとで取り立てられ、エジプト（カイロ）の十人頭（アミール・アシャラ）に昇進した。ハジュラ暦841年に約70歳で没。人柄は悪くなかった。
  en: Ḥuṭuṭ (written with unpointed letters, with fatha on its first and second) is a Circassian name; he is al-Baklamishī, the mamluk of Baklamish al-ʿAlāʾī. He advanced after his master under Sultan al-Nāṣir Faraj, until he became one of the Amirs of Ten in Egypt, where he died in the year 841 H at around seventy years of age. He was a decent man.
