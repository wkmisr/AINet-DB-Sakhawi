notes:
- text: '「وعني بالعلم فتنبه」＝学問に励んで（法学に）目覚めた。兄 #AIND-D05882「عمر بن عبد الله بن محمد بن أحمد بن قاسم … السراج ابن العفيف … مات في ربيع الأول سنة خمسين بدولات باد من بلاد كلبرجة من الهند」（repo 収録済、本項主を note で兄弟候補として記載）は本項に言及がないため relation を立てない（規則23）。 子・妻の候補（集約 2026-10-26、内容B L）: #AIND-D01376「أحمد بن أبي الفضل محمد بن العفيف عبد الله بن القاضي تقي الدين أبي اليمن محمد بن أحمد بن قاسم … الشهاب بن الجمال」（814年に聴聞、859没）と女性部 #AIND-D13323「عائشة ابنة علي … الدقوقي . تزوجها أبو الفضل ابن عبد الله الحرازي فولدت له أحمد」。クンヤ أبو الفضل は D07806（التقي أبو الفضل）と一致するが、D01376 のラカブ「بن الجمال」は D07807（الجمال）と合うため、父をどちらとも確定できない＝relation は立てない（規則26）。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・アブド・アッラー・ブン・ムハンマド・ブン・アフマド・ブン・カースィム・ブン・アブド・アッ＝ラフマーン・ブン・アビー・バクル、アッ＝タキー、アブー・アル＝ファドル・イブン・アル＝アフィーフ・ブン・アッ＝タキー、アル＝クラシー、アル＝アダウィー、アル＝ガムリー、アル＝ハラーリー、マーリク派。アル＝ファースィーは言う：「私の思うところでは、彼は叔父のもとで聴講し、イブン・スィッディークらから聴聞した。学問に励んで目覚め、生計を求めてイエメンとインドに赴いたが、810年、インドのクルバルジャで30歳余りで寿命が尽きた。その訃報は814年にマッカに届いた。」
  en: 'Muḥammad b. ʿAbd Allāh b. Muḥammad b. Aḥmad b. Qāsim b. ʿAbd al-Raḥmān b. Abī Bakr, al-Taqī, Abū al-Faḍl Ibn al-ʿAfīf b. al-Taqī, al-Qurashī, al-ʿAdawī, al-Ghamrī, al-Ḥarārī, the Mālikī. Al-Fāsī said: he attended, as I believe, the lessons of his paternal uncle, and heard from Ibn Ṣiddīq and others; he applied himself to learning and became alert, and went to Yemen and India in search of livelihood, where death overtook him at Kulbarja in the land of India in the year 810, aged thirty-odd; the news of his death reached Mecca in the year 814.'
