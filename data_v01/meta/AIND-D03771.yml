translation:
  ja: アブドゥッラフマーン・ブン・ムハンマド・ブン・アブドゥルワッハーブ・ブン・アブドゥッラー・ブン・アスアド・アル＝ワジーフ・ブン・アル＝ジャマール。アル＝アフィーフ・アル＝ヤーフィイーの末裔で、メッカの生まれ。父と祖父の伝記は後述される。ヒジュラ暦831年ズー・アル＝ヒッジャ月にミナーで生まれ、文法の『アルフィーヤ』を暗記し、844年にアブー・ハーミド・ブン・アッ＝ディヤーーに提示（暗誦確認）した。インドに入り、現地の人々が彼の祖先に対して抱く信仰心によって富を築いた。その後メッカに戻り、そこでヒジュラ暦878年サファル月に死去した。神が彼を赦されますように。イブン・ファハドが彼の没年を記録している。
  en: ʿAbd al-Raḥmān b. Muḥammad b. ʿAbd al-Wahhāb b. ʿAbd Allāh b. Asʿad al-Wajīh b. al-Jamāl, a descendant of al-ʿAfīf al-Yāfiʿī, originally from Mecca. His father and grandfather are mentioned below. He was born in Dhu al-Ḥijja, the year 831, in Minā. He memorized the Alfiyya on grammar and presented it to Abū Ḥāmid b. al-Ḍiyāʾ in the year 844. He entered India and became wealthy due to their devotion to his ancestors, then returned to Mecca where he resided until his death in Ṣafar, the year 878. May God forgive him. His obituary was recorded by Ibn Fahd.
