  cert: medium
  note:
    ja: '「سبط القاضي فتح الدين بن صالح」＝本項主の母は فتح الدين بن صالح の娘。女性部 #AIND-D13881「ابنة القاضي فتح الدين محمد بن عبد الرحمن بن صالح المدني . تزوجها الشمس محمد بن عبد الوهاب بن أحمد بن زبالة قاضي الينبوع فولدت له ومات عنها فتأيمت حتى ماتت في سنة سبع وثمانين ودفنت بالبقيع」（未収録）が父 D07908 の妻として子を産んだと記す（D07908 側に spouse #AIND-D13881 あり）。本項主を名指しはしないため規則23 により cert medium（先例 B150 D08114 の母）。父の項 D07908 は「على أخته」（فتح الدين の姉妹）とするが、本項・D13881・兄弟 D10977 はいずれも娘とする（食い違いは D07908 側 ISSUES §D146-3 で既出）。初版なし。'
