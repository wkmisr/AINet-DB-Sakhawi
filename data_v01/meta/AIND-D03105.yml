  active: AIND-D07586
  passive: AIND-D03105
  summary:
    ar: فتح الدين محمد بن عبد الرحمن بن صالح
  note:
    ja: 「سبط القاضي فتح الدين بن صالح」＝母方祖父。#AIND-D07586「محمد بن عبد الرحمن بن محمد بن صالح بن إسمعيل … فتح الدين أبو الفتح بن ناصر الدين أبي الفرج … المصري الأصل المدني الشافعي … ويعرف كسلفه بابن صلح … وناب في القضاء والخطابة والإمامة ببلده طيبة عن أبيه ثم استقل」（799生、未収録）。ラカブ فتح الدين・家名 ابن صالح・マディーナのカーディー職で閉合（規則57）。D07908 側は同人を relative（向き未確定）とする。初版は統制外 subtype「grandfather」#NEEDID（父方祖父と混同）→ maternal_grandfather（repo 統制語彙 43件）。desc から称号「القاضي」を除去（規則31）。
- id: r4
  type: kin
  subtype: brother
  active: AIND-D10977
  passive: AIND-D03105
  summary:
    ar: أبو السعادات بن الشمس محمد بن زبالة
  cert: medium
  note:
    ja: 'クンヤ部 #AIND-D10977「أبو السعادات بن القاضي الشمس محمد بن أحمد بن زبالة أخو سعيد الماضي وسبط ابن صالح قاضي طيبة ممن سمع علي بها」（未収録）が本項主を「أخو سعيد الماضي」と名指し（規則23 の条件を満たす）。ただし同項のクンヤ أبو السعادات は本項主のクンヤと同一で、父の職・母方祖父・サハーウィーへのマディーナでの聴講まで一致するため、同一人物の二重立項の可能性がある（ISSUES §D155-2）。原文どおり「兄弟」として立てる。D07908 側は son #AIND-D10977 を cert medium で置く。【集約 2026-11-05】本項原文に兄弟の言及はなく、相手側 D10977「أخو سعيد الماضي」による補完（規則23）なので cert="medium"（内容A L・決定5）。クンヤ أبو السعادات・父・母方祖父・マディーナでの聴講の4点が一致し二重立項の可能性もある（ISSUES §D155-2）が、原文が「أخو」と明言するので brother のまま（規則25）、possible_identity は併置しない。'
