translation:
  ja: サイード・ブン・ムハンマド・ブン・アブドゥルワッハーブ・ブン・アフマド、アル＝ジャマール、アブー・アッ＝サアーダート。ヤンブウのカーディー、アッ＝シャムス・イブン・ズバーラの子で、カーディーのファトフ・アッ＝ディーン・イブン・サーリフの娘方の孫。マディーナで私から聴聞した者の一人。
  en: Saʿīd b. Muḥammad b. ʿAbd al-Wahhāb b. Aḥmad, al-Jamāl Abū al-Saʿādāt, son of the qāḍī of Yanbuʿ al-Shams Ibn Zabāla, and grandson through his mother of the qāḍī Fatḥ al-Dīn Ibn Ṣāliḥ. He was among those who heard from me in Medina.
