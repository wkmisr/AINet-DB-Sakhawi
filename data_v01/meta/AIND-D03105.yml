  note:
    ja: '「بن قاضي الينبوع الشمس بن زبالة」＋見出しナサブ「محمد بن عبد الوهاب بن أحمد」＝#AIND-D07908「محمد بن عبد الوهاب بن أحمد بن محمد الشمس بن التاج الهواري الأصل القاهري ثم الينبوعي الشافعي أخو قاسم الماضي ويعرف بابن زبالة ولي قضاء الينبوع بعد وفاة ابن عمه … وصاهر فتح الدين بن صلح قاضي المدينة النبوية على أخته واستولدها . وقدرت وفاته بها في سنة ثلاث وسبعين」（収録済み B146。相手側に son #AIND-D03105 あり）。ナサブ3代・ラカブ・職（قاضي الينبوع）・通称 ابن زبالة で閉合（規則37・57）。初版の #NEEDID を置換。'
