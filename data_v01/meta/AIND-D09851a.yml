  en: Maḥmūd b. ʿAlī b. Abī Bakr, a long-lived shaykh known as Maḥmūd Jand ʿAlī. Al-Ṭāwūsī met him in Shiraz in 828; he said he was then 116 years old, so al-Ṭāwūsī asked him for ijāza.
