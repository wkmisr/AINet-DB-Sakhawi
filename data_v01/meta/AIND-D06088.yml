translation:
  ja: イーサー・ブン・イーサー・ブン・ムハンマド・アル＝アッラービー（無点のアインにファトハ、無点のラーにシャッダ、次に一点の文字［バー］）・アッ＝ディマシュキー・アッ＝サーリヒー、その父は篩職人（ムガルビル）。アル＝ムヒッブ・アッ＝サーミトとアブー・アル＝ハウル・アル＝ジャザリーから、アッ＝ディヤーゥが編んだ、アブド・アル＝ワッハーブ・ブン・アターらにおけるアフマドの一致伝承（ムワーファカート）を収めた一巻を聴聞し、ルスラーン・アッ＝ザハビーから『ジュズウ・アル＝バイトゥータ』の一部を聴聞した。彼は伝承を語り、有徳の学者たちが彼から聴聞した。サーリヒーヤにおけるワーリーのナキーブであった。
  en: ʿĪsā b. ʿĪsā b. Muḥammad al-ʿArrābī (with fatḥa on the undotted ʿayn and a doubled undotted rāʾ, then a letter with one dot [bāʾ]) al-Dimashqī al-Ṣāliḥī; his father was a sifter (al-mugharbil). He heard from al-Muḥibb al-Ṣāmit and Abū al-Hawl al-Jazarī a juzʾ containing the muwāfaqāt of Aḥmad regarding ʿAbd al-Wahhāb b. ʿAṭāʾ and others, compiled by al-Ḍiyāʾ, and from Ruslān al-Dhahabī part of the Juzʾ al-Baytūta. He transmitted ḥadīth, and men of merit heard from him. He was the naqīb of the governor (wālī) in al-Ṣāliḥiyya.
