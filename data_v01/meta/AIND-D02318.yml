translation:
  ja: タンナム・アル＝ハサニー・アル＝アシュラフィー・バルスバーイ。彼は師の特別な側近兼給仕係であったが、師の死後、投獄され試練を受けた。その後釈放され、彼の状況はイーナール（イナール）の時代に十人長に昇進し、次いで親衛隊長官の一人となった。さらにフシュカダム（ホシュカダム）の治世の初めには、第二親衛隊長官を務めた後、ハマーの副総督となり、その後は無職となった。そしてアレッポに赴き、そこで73歳頃のジュマーダー・アル＝アーヒラ（イスラーム暦第6月）873年に死去した。
  en: Tanam al-Ḥasanī al-Ashrafī Barsbāy. He was among the special confidantes and cup-bearers of his master. After his master's death, he underwent hardship by being imprisoned, but was later released. His affairs progressed to the point where he became an amir of ten during the days of Inal, and then became one of the heads of the nawba (military shifts). Then, in the early days of Khushqadam, he served as a second head of the nawba, then as nāʾib (deputy governor) of Ḥamā, after which he became unemployed. He then arrived in Ḥalab and died there in Jumādā al-Ākhira 873 AH, being in his seventies.
