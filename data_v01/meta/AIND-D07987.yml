notes:
- text: '学派は本項原文に明記なし。初版の affiliation Shafiʿi は直前の項（兄弟 #AIND-D07986「… القاهري الشافعي」）と父 #AIND-D04954（الشافعي）・『المنهاج』の暗記からの補完とみられるため除去し、ここに留める（規則23: 他項由来の属性は補わない）。「وأجازوه في آخرين」の「آخرين」（その他の師たち）は人物を立てない（規則55）。兄弟: 父 D04954 を共有する #AIND-D03683「عبد الرحمن بن علي بن أحمد بن أبي بكر بن أحمد الزين … بن النور أبي الحسن الأدمي」（780年頃生）は相手側に本項主の名指しがないため relation は立てない（規則23）。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド、アッ＝シャムス、アブー・アル＝ファトフ、前項の人物の兄弟で、彼のほうが年長。彼もまた『ミンハージュ』を暗記し、797年にバドル・アル＝クワイスィニー、アッ＝ザイン・アル＝イラーキー、アル＝ブルキーニーとその両人の息子たち、アル＝ハイサミー、アブー・アル＝ファラジュ・イブン・アッ＝シャイハ、アル＝バルシャンスィー、アブドゥッラティーフ・アル＝イスナーイー、アフマド・アル＝ハナフィー・アッ＝サウーディーに提示（暗誦）し、彼らはほかの人々とともに彼にイジャーザを与えた。学問に励んで頭角を現し、父の存命中に没したと思われる。
  en: Muḥammad al-Shams Abū al-Fatḥ, brother of the preceding, and the elder of the two. He too memorized al-Minhāj and presented it in the year 797 to Badr al-Quwaysinī, al-Zayn al-ʿIrāqī, al-Bulqīnī and the sons of both, al-Haythamī, Abū al-Faraj b. al-Shaykha, al-Barshansī, ʿAbd al-Laṭīf al-Isnāʾī and Aḥmad al-Ḥanafī al-Saʿūdī, who, among others, granted him ijāza. He studied and distinguished himself, and died, presumably, during his father's lifetime.
