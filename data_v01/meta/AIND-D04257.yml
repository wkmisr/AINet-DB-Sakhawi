translation:
  ja: アブド・アル＝カリーム・ブン・サアドゥーン・アル＝マッキー。アル＝イッズ・ブン・ジャマーアとアル＝ファフル・ウスマーン・ブン・アビー・バクル・アン＝ヌワイリーから『ナサーイー（のスナン）』の一部を聴聞した。アル＝ファースィーは「彼がハディースを伝えたことは知らないが、商業に従事していた」と述べている。815年にマッカで没し、ムアッラー墓地に葬られた。
  en: 'ʿAbd al-Karīm b. Saʿdūn al-Makkī. He heard part of al-Nasāʾī from al-ʿIzz b. Jamāʿa and al-Fakhr ʿUthmān b. Abī Bakr al-Nuwayrī. Al-Fāsī said: "I do not know that he transmitted hadith, but he engaged in trade." He died in the year 815 in Mecca and was buried in al-Muʿallā.'
