translation:
  ja: スライマーン・ブン・アフマド・ブン・スライマーン・ブン・ラーシド・アッ＝サーリミー・アル＝マッキー。アブー・アル＝ヤマン・アッ＝タバリーらに聴聞した。預言者――神の祝福と平安あれ――への参詣に出立したが、病を得て戻り、そのまま（8）10年ジュマーダー・アル＝アーヒラ月に没してアル＝マアラー墓地に埋葬された。およそ20歳であった。アル＝ファースィーが彼に言及している。
  en: Sulaymān b. Aḥmad b. Sulaymān b. Rāshid al-Sālimī al-Makkī. He heard from Abū al-Yaman al-Ṭabarī and others. He set out to visit the Prophet (God bless him and grant him peace) but returned ill, and remained so until he died in Jumādā al-Ākhira of the year [8]10 and was buried in al-Muʿallā, at about twenty years of age. Al-Fāsī mentioned him.
