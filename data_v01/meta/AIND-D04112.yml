translation:
  ja: アブドゥルカーディル・ブン・アブー・バクル・ブン・アリー・ブン・アブー・バクル・ブン・アブドゥルマリク・ブン・アブー・バクル・イブン・アブドゥルハック・アル＝マクディスィー・アル＝サーリヒー・アル＝ハンバリー。ハディージャの兄弟で、後述のアリー・ブン・ガーズィーの従兄弟である。アル＝クーリー（カフにダンマ、後半に点のないラー）として知られる。ヒジュラ暦763年に生まれ、アル＝ムヒッブ・アッ＝サーミトから『サヒーフ・アル＝ブハーリー』を聴聞したと述べ、我々の同僚の何人かが彼から書写した。恐らく（ヒジュラ暦）850年より前に亡くなった。
  en: ʿAbd al-Qādir b. Abī Bakr b. ʿAlī b. Abī Bakr b. ʿAbd al-Malik b. Abī Bakr b. ʿAbd al-Ḥaqq al-Maqdisī al-Ṣāliḥī al-Ḥanbalī. He was the brother of Khadīja and the cousin of ʿAlī b. Ghāzī (both mentioned below). He was known as al-Kūrī (with a damma on the kāf and an undotted rāʾ). He was born in the year 763 AH. It is mentioned that he heard the Ṣaḥīḥ al-Bukhārī from al-Muḥibb al-Ṣāmit, and some of our companions wrote from him. He is thought to have died before 850 AH.
