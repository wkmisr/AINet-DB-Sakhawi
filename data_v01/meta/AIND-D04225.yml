translation:
  ja: アブド・アル＝カーディル・アル＝ムラフヒム・アル＝マジュズーブ。足の壊疽（壊死）を患い、そこから虫がこぼれ落ちるほどになり、そのまま869年ズー・アル＝ヒッジャ月7日に亡くなるまでその状態が続いた。遺体は、彼が隠遁生活を送っていた場所、すなわち廃墟の中にあるアンタル・アル＝ブルハーニーの墓の隣、アル＝バカフリー・モスクの近くに埋葬された。アッラーの慈悲あれ。アル＝ムニールが彼の没年を記録している。
  en: Abd al-Qadir al-Murakhkhim al-Majdhub. He was afflicted with gangrene in his leg until worms fell from it, and he remained in this state until he died on the 7th of Dhu al-Hijja, the year 869 AH. He was buried in the place where he lived in seclusion, near al-Bakahri Mosque, next to the grave of 'Antar al-Burhani in the middle of the ruins, may Allah have mercy on him. His death date was recorded by al-Munir.
