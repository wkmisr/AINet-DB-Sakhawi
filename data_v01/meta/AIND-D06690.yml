    ja: '二重立項。#AIND-D06870「محمد بن أحمد بن محمد بن عبد العزيز بن عبد الله بن الفضل العماد الهاشمي الحلبي . ولي مشيخة الشيوخ بحلب بعد أبي الخير الميهني فباشرها عدة سنين ، وكان إنسانا حسنا من ذوي البيوت الأعيان وله ثروة . مات أسيرا بأيدي التتارفي سنة ثلاث ودفن بمشهد الحسين ظاهر حلب . ذكره ابن خطيب الناصرية」（未収録）は、ラカブ・ニスバ・職（アレッポの مشيخة الشيوخ）・前任者（أبو الخير الميهني）・死に方（捕虜として）・没年（سنة ثلاث）が本項と一致＝同一人物。ナサブは「بن محمد」1段の差（本項はイブン・ハジャル『إنباء』、相手は ابن خطيب الناصرية に拠る）。両項とも転送指示がないので実項のまま（絶対基準）。サハーウィー自身の同定の言はなく、校閲者の判断による cert high（先例 #AIND-D08133⇄#AIND-D08233、#AIND-D10247⇄#AIND-D12832。ISSUES §D173-3）。鏡像は D06870 受領時に。相手側にのみある属性（الحلبي・埋葬地 مشهد الحسين）は本項に補わない（規則23）。'
