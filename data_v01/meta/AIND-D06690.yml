translation:
  ja: ムハンマド・ブン・アフマド・ブン・アブド・アル＝アズィーズ・ブン・アブド・アッラー・ブン・アル＝ファドル、アル＝イマード・アル＝ハーシミー。アレッポのシャイフ・アッ＝シュユーフ。アブー・アル＝ハイル・アル＝マイハニーの後にその職に就き、しばらく務めた。アレッポの名家の出で、その名士の一人であった。ティムール軍との大災禍のなか、捕らわれの身で（80）3年に没した。私たちの師（イブン・ハジャル）がその『インバー』でこう述べている。
  en: Muḥammad b. Aḥmad b. ʿAbd al-ʿAzīz b. ʿAbd Allāh b. al-Faḍl, al-ʿImād al-Hāshimī. Shaykh al-shuyūkh in Aleppo; he took the office after Abū al-Khayr al-Mayhanī and exercised it for a time. He was of the great houses of the Aleppans and one of its notables. He died in captivity during the great catastrophe with the forces of Timur, in the year [80]3. Our shaykh (Ibn Ḥajar) said this in his Inbāʾ.
