translation:
  ja: アフマド・ブン・アブドゥルバーシト・ブン・ハリールのシャハーブ・アッ＝ディーン・ブン・アッ＝ザイニー。軍務長官（彼の父については後述）。833年シャアバーン月はじめに疫病で亡くなった。成年後、父の代理として文書作成職を務めた。彼の葬儀は盛大であった。
  en: Aḥmad b. ʿAbd al-Bāsiṭ b. Khalīl Shihāb al-Dīn b. al-Zaynī. Nāẓir al-Jaysh, whose father's biography will follow. He died of the plague at the beginning of Shaʿbān in the year 833, after he came of age. He served as his father's deputy in the office of kitābat al-ʿalāma. His funeral was grand.
