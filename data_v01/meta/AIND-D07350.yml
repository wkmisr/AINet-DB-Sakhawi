translation:
  ja: ムハンマド・ブン・ハサン・ブン・アブド・アッラヒーム・アッ＝サーリー・アッ＝ダッカーク。我らが師（イブン・ハジャル）はその『ムウジャム』で述べている。「私は彼にサーリヒーヤで会い、彼に『イブラーヒーム・ブン・アドハム伝』その他を読んだ。（それらは）彼が（数え）3歳のときにアル＝ハッジャールのもとで聴講したものである。彼はヒジュラ暦803年の大災厄（ティムールのダマスクス侵攻）の際に没した」。アル＝マクリーズィーも『ウクード』でこれ（イブン・ハジャルの記述）に従っている。
  en: 'Muḥammad b. Ḥasan b. ʿAbd al-Raḥīm al-Ṣālī al-Daqqāq. Our shaykh (Ibn Ḥajar) said in his Muʿjam: "I met him in al-Ṣāliḥiyya and read to him the Akhbār Ibrāhīm b. Adham and other works, which he had attended [as a child] in his third year under al-Ḥajjār. He died in the great calamity (Tīmūr''s sack of Damascus) in the year 803." Al-Maqrīzī followed him in this in his ʿUqūd.'
