translation:
  ja: アフマド・アル＝ガムリー・アル＝マラーキビー。イブン・ハッルーブとして知られる。彼はムハンマド・アル＝ガムリーのシャイフの仲間たちの中で、自身の集団の者たちの間では悪くない人物であった。私（＝サハーウィー）からわずかに聴聞し、886年サファル月1日の夜に死去した。
  en: Aḥmad al-Ghamrī al-Marākibī, known as Ibn Kharrūb. He was not a bad person among the members of his group from the circle of Shaykh Muḥammad al-Ghamrī. He heard a little from me (al-Sakhāwī), and died on the night of the first of Safar in the year 886.
