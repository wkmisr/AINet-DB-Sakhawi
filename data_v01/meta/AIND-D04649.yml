translation:
  ja: アブドゥッラー・ブン・ムハンマド・アル＝ハムダーニー・アッ＝ディマシュキー・アル＝ハナフィー、ダマスカスのジャウハリーヤの教授。善人で、自派の法学とクルアーン読誦諸法に通じ、読誦を教授していた。810年ジュマーダー・アル＝ウーラー月に、70歳に達して没した。我らの師（イブン・ハジャル）が『インバー』でそう述べている。
  en: ʿAbd Allāh b. Muḥammad al-Hamdānī al-Dimashqī al-Ḥanafī, professor at al-Jawhariyya in Damascus. He was a good man, versed in his madhhab and in the Qurʾānic readings, and he taught recitation. He died in Jumādā al-Ūlā of the year 810, having reached seventy. Our shaykh (Ibn Ḥajar) said so in his Inbāʾ.
