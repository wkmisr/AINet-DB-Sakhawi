translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・ムハンマド・ブン・スライマーン、アル＝バドル・ブン・アル＝ブルハーン、アル＝バアリー、アッ＝シャーフィイー。父と同じくイブン・アル＝ムラッヒルの名で知られた。父の後、バアルベックのヌーリーヤ学院で教えた。79年に没し、その年に姉妹の子アル＝バハー・ブン・アル＝ファッスィーが彼からその半分を受け継いだ。
  en: Muḥammad b. Ibrāhīm b. Muḥammad b. Muḥammad b. Sulaymān, al-Badr b. al-Burhān, al-Baʿlī al-Shāfiʿī, known, like his father, as Ibn al-Muraḥḥil. He taught, after his father, at the Nūriyya madrasa in Baalbek. He died in the year 79, and in it his sister's son al-Bahāʾ Ibn al-Faṣṣī took over half of it from him.
