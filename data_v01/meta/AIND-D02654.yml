translation:
  ja: ハサン・ブン・ユースフ・ブン・ハサン・ブン・サーリフ・アル＝アンサーリー・アル＝マルウィー。アンダルスのアル・マリーヤに由来する。マーリキ派。アフマド・アル＝カッサールの下で、医学、天文学、およびこれらに類する法学や文法学などを学んだ。ヒジュラ暦890年頃に［カイロに］到着し、ダマスクスからハッジ（大巡礼）に赴き、［マッカに］隣接滞在（ジャーワラ）した。その後カイロに戻り、ヒジュラ暦896年の半ばに私（サハーウィー）と出会い、私から聴聞するまでそこに留まった。
  en: Ḥasan b. Yūsuf b. Ḥasan b. Ṣāliḥ al-Anṣārī al-Marwī, named after Almería (al-Mariyya) in al-Andalus. He was a Maliki. He occupied himself with medicine, astronomy, and similar subjects, as well as jurisprudence and grammar, under Aḥmad al-Qaṣṣār. He arrived [in Cairo] around the year 890 AH, performed Hajj from Damascus, and stayed as a neighbor [in Mecca]. He then returned to Cairo and remained there until he met me during the year 896 AH and heard from me.
