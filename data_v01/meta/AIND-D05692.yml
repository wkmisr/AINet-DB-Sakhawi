translation:
  ja: アリ・ブン・ユースフ・ブン・アル＝アッバース・ブン・イーサー。アンダルスに出自を持つマッカの人。父親は教育者（ムアッディブ）であった。アル＝ジヤーディーとして知られる。ヒジュラ暦847年ズー・アル＝ヒッジャ月にマッカで没した。イブン・ファハドがその死を記録している。
  en: ʿAlī b. Yūsuf b. al-ʿAbbās b. ʿĪsā, of Andalusian origin, of Mecca. His father was a tutor (al-Muʾaddib). He was known as al-Jayyādī. He died in Mecca in Dhu al-Hijjah, in the year 847 AH. Ibn Fahd recorded his death.
