translation:
  ja: アブドゥッラフマーン・ブン・アブドゥッラー・ブン・ムハンマド・ブン・ダーウード、アッ＝サドル・アル＝クファイリー・アッ＝ディマシュキー・アッ＝シャーフィイー。我らがシャイフ（イブン・ハジャル）は『インバーウ（・アル＝グムル）』において、彼が法学に専心し、ダマスクスで副判事を務め、同地にて801年（ヒジュラ暦）のアル＝ムハッラム月に40歳で没したと述べている。また、彼には地位向上（主導権）を求める強い熱意があった。これはイブン・ヒッジーの言葉である。
  en: Abd al-Rahman b. Abd Allah b. Muhammad b. Dawud, al-Sadr al-Kufayri al-Dimashqi al-Shafi'i. Our shaykh (Ibn Hajar) mentioned in Inba' al-Ghumr that he was devoted to fiqh and served as a deputy judge in Damascus, where he died in Muharram 801 AH at the age of forty. He possessed a strong ambition for leadership, as reported by Ibn Hijji.
