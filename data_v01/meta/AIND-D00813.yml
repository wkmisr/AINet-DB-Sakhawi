translation:
  ja: アフマド・ブン・アブドゥッラフマーン・ブン・アフマド・ブン・ムハンマド・ブン・イブラーヒーム。出自はダマスクス人でメッカ在住。父と同様にイブン・カイイム・アル＝ジャウズィーヤとして有名であった。父の遺産を受け継ぎ、アブー・アル＝バカー・ブン・アル＝ディヤーウの娘と結婚して子どもをもうけたが、彼女は彼の在世中に亡くなった。その後、彼の状況は悪化し、バブ・アッ＝サラームで香料商となった。やがて、息子二人と兄弟と共にカイロへと移り、カイロからシャームへと入った後、神よ彼を赦したまえ、873年の疫病で彼らはカイロで亡くなった。
  en: Aḥmad b. ʿAbd al-Raḥmān b. Aḥmad b. Muḥammad b. Ibrāhīm, originally from Damascus, residing in Mecca, famous like his father, Ibn Qayyim al-Jawziyya. He inherited from his father and married the daughter of Abū al-Baqāʾ b. al-Ḍiyāʾ, by whom he had children, but she died while he was still alive. His circumstances then deteriorated, and he became a perfumer at Bāb al-Salām. Eventually, he traveled with his two sons and his brother to Cairo. After his journey from Cairo to Syria, they died in Cairo in the plague of 873 H. May God have mercy on him.
