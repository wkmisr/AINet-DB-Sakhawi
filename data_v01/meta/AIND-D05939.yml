translation:
  ja: ウマル・ブン・アビー・バクル・ムハンマド・ブン・アフマド、アッ＝サカンダリー、のちにアル＝カーヒリー。我らがシャイフ（イブン・ハジャル）のダワーダール（侍従・秘書）。彼（我らがシャイフ）の読み上げによって、アッ＝シャムス・アル＝ビージューリーのもとで『ジュズウ・アッ＝ディムヤーティー』を聴聞し、またほかの者のもとでも聴聞した。我らがシャイフは彼の奉仕ぶりをほめなかったので、彼はシャイフの没後に大したものを得られなかった。彼は一般人（アーンミー）であった。我々にイジャーザを与えた。（8）63年ラジャブ月に没した。60歳を越えていたと私は思う。神が彼を赦されるように。
  en: ʿUmar b. Abī Bakr Muḥammad b. Aḥmad al-Sakandarī, then al-Qāhirī, the dawādār of our shaykh (Ibn Ḥajar). He heard the Juzʾ al-Dimyāṭī from al-Shams al-Bījūrī as read aloud by him (our shaykh), and heard from others as well. Our shaykh did not praise his service, and therefore he obtained nothing of consequence after him. He was an ordinary layman. He granted us an ijāza. He died in Rajab of the year (8)63; I think he had passed sixty. May God pardon him.
