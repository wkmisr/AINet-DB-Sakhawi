translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・ヤフヤー・ブン・ウスマーン・ブン・イーサー・ブン・ウマル・ブン・アリー・ブン・サラーマ、アル＝バイトリーディー・アル＝マクディスィー、のちアッ＝サーリヒー、アッ＝ディヤーイーヤの寄留者。776年に生まれ、アル＝ムヒッブ・アッ＝サーミトの口述からアブー・アッ＝ターヒル・アッ＝ズフリーのハディースによる『ムスナド・アル＝ムキッリーン・ミン・アッ＝サハーバ』第9部を聴聞し、それを伝承して、優れた学者たちが彼からそれを聴聞した。840年頃に没したと思われる。
  en: ʿAbd Allāh b. Muḥammad b. Yaḥyā b. ʿUthmān b. ʿĪsā b. ʿUmar b. ʿAlī b. Salāma, al-Baytlīdī al-Maqdisī, then al-Ṣāliḥī, resident of al-Ḍiyāʾiyya. He was born in the year 776. He heard from the dictation of al-Muḥibb al-Ṣāmit the ninth part of the Musnad al-Muqillīn min al-Ṣaḥāba from the ḥadīth of Abū al-Ṭāhir al-Dhuhlī, and he transmitted it; the eminent scholars heard it from him. He died around the year 840, presumably.
