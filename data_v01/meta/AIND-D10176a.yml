translation:
  ja: ヒラール、ザイン〔・ッディーン〕・アッ＝ルーミー・アッ＝ザーヒリー（バルクークの奴隷）、宦官。アシュラフ・バルスバーイの時代にしばらくシャーッド・アル＝ハウシュとなり、次いでジャウハル・アル＝カンカバーイーの死後、金銭を納めてズィマームとなったが、846年に罷免された。老齢で失明寸前、大した地位に達しなかったにもかかわらず、その体面を損なうほど甚だしく世俗に没頭して、農業と水車に従事し続けた。864年ジュマーダー第1月に90代でペストで没した。
  en: Hilāl, al-Zayn al-Rūmī al-Ẓāhirī (mamluk of Barqūq), the eunuch. In the days of al-Ashraf Barsbāy he was shādd al-ḥawsh for a time, then zimām after the death of Jawhar al-Qunqubāʾī, by paying money; he was dismissed in 846 and remained occupied with farming and waterwheels, so absorbed in worldly affairs as to disgrace his standing, despite his advanced age, near-blindness and failure to attain any real rank. He died of plague in Jumādā I 864, in his nineties.
