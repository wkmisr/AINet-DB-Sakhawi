translation:
  ja: アフマド・ブン・ハールーン、シャハーブ・アッ＝シャルワーニー、シャーフィイー派。70年頃カイロに来て、いくつかの講義に出席し、私（＝サハーウィー）から少し学んだ。彼の卓越性は、信仰と慈善と孤高の様々な学芸において明らかだった。彼に教授職とファトワー職のイジャーザを与えた者の中には、ファフル・ウスマーン・アル＝マクスィーがいる。彼はエルサレムへ旅し、そこで自らの蔵書を寄付した直後に亡くなった。そしてその蔵書はジャーミウ・アル＝アズハルに運ばれたが、後には前述の人物がこれを受け取った。彼に神の慈悲あれ。彼は良き人物であった。
  en: Ahmad b. Hārūn al-Shihāb al-Shirwānī al-Shāfiʿī. He came to Cairo around the year 870 H and attended some lessons, taking a little from me (al-Sakhāwī). His excellence became apparent in various disciplines, along with his piety, goodness, and reclusiveness. Among those who granted him permission (ijāza) to teach and issue legal opinions (fatwā) was al-Fakhr ʿUthmān al-Maqsī. He traveled to Jerusalem and died shortly thereafter, having endowed his books. These were then brought to Jāmiʿ al-Azhar, after which the aforementioned person took possession of them. May God have mercy on him. Indeed, he was a good man.
