translation:
  ja: アブドゥルアズィーズ・ブン・ムハンマド・ブン・ムハンマド・ブン・フサイン・ブン・アリー・ブン・アフマド・ブン・アティーヤ・ブン・ザヒーラ、アブー・アル＝バカー・ブン・アビー・アル＝ハイル・ブン・アビー・アッ＝スウード、アル＝クラシー・アル＝マッキー。母は父のハバシャ（アビシニア）人の奴隷女であった。809年ラジャブ月に生まれた。イブン・アル＝クワイク、アーイシャ・ビント・イブン・アブド・アル＝ハーディー、アル＝マジュド・アッ＝シーラーズィーらを含む人々が彼にイジャーザを与えた。
  en: ʿAbd al-ʿAzīz b. Muḥammad b. Muḥammad b. Ḥusayn b. ʿAlī b. Aḥmad b. ʿAṭiyya b. Ẓahīra, Abū al-Baqāʾ b. Abī al-Khayr b. Abī al-Suʿūd, al-Qurashī al-Makkī. His mother was an Abyssinian slave-girl of his father. He was born in Rajab 809 AH. A number of scholars granted him ijāza, among them Ibn al-Kuwayk, ʿĀʾisha bint Ibn ʿAbd al-Hādī and al-Majd al-Shīrāzī.
