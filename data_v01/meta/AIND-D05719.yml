notes:
- text: 'corpus レコード末尾に転送見出し1本（『علي العلاء عصفور المكتب . في ابن محمد ابن عبد النصير .』）が連結されている。本項主の記述ではなく登録対象外（$$$ 型と同じ扱い）。転送先は #AIND-D05462（علي بن محمد بن عبد النصير العلاء السخاوي الأصل الدمشقي ثم المصري الكاتب ويلقب بعصفور）。B101 の REF D05721「علي العلاء المكتب . أشير إليه قريبا」はこの見出しを指す（§D100-7・§D101-1）。source note は本項主の実伝部分のみ（B94-98 の★連結4件の先例に統一）。'
  lang: ja
  type: editorial
translation:
  ja: アリー、シャイフ・ハダンダルとして知られる。我らがシャイフ（イブン・ハジャル）もその『インバー（・アル＝グムル）』で彼に言及し、「崇敬される者の一人で、マジュズーブ（神に魅せられた恍惚者）であった。（8）24年サファル月に没した」と述べている。以上（引用終わり）。私（サハーウィー）は、彼がバーブ・アン＝ナスル外のラウダにある霊廟の主ではないかと思う。
  en: 'ʿAlī, known as al-Shaykh Ḥadandal. Our shaykh (Ibn Ḥajar) also mentioned him in his Inbāʾ (al-Ghumr), saying: "He was one of those who were venerated, and he was a majdhūb (one rapt in God). He died in Ṣafar (8)24." End of quotation. I (al-Sakhāwī) think that he is the occupant of the shrine at al-Rawḍa outside Bāb al-Naṣr.'
