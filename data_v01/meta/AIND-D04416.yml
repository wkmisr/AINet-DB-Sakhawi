translation:
  ja: アブドゥッラー・ブン・アフマド・ブン・ムーサー・ブン・イブラーヒーム。アル＝ジャマール、アブー・アル＝ファドル、イブン・アッ＝シハーブ。ハラブ（アレッポ）に起源を持ち、カイロに在住したハナフィー派の学者。先に言及されたアブドゥッラヒームの兄弟であり、カイロにおける彼の師たちの学友、またハラブ（アレッポ）の出身として知られる。私（サハーウィー）にイジャーザ（授権）を与えた。851年シャアバーン（第8月）に約60歳で没した。彼は（カイロの）サーリヒーヤ・マドラサにおいて使者（ラスィル）の職務にあたっていた。
  en: ʿAbd Allāh b. Aḥmad b. Mūsā b. Ibrāhīm, al-Jamāl Abū al-Faḍl b. al-Shihāb. He was of Aleppo origin, Cairo-based, and of the Hanafi school. He was the brother of the aforementioned ʿAbd al-Raḥīm, and his companion in studying under his teachers there, and was known as al-Ḥalabī. He granted me (al-Sakhāwī) an ijāza. He died in Shaʿbān, the year 851 AH, at around sixty years of age. He used to serve as an envoy (al-rusuliyya) at al-Ṣāliḥiyya.
