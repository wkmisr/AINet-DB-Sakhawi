translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・ガーニム、のちにアル＝マッキー（マッカの人）。マッカに在住し、同地のムフタスィブ（市場監督官）を務め、イブン・ガーニムとして知られた。848年に、その権限を委ねられていたアミール・アブー・アル＝カースィム・ブン・ハサン・ブン・アジュラーンより、アル＝ムヒッブ・ブン・イッズ・アッ＝ディーンの後任としてムフタスィブ職に任命された。862年サファル月にマッカで没した。
  en: ʿAbd al-Raḥmān b. Muḥammad b. Ghānim, later al-Makkī. He resided in Mecca, served as its market inspector (muḥtasib), and was known as Ibn Ghānim. He was appointed as the muḥtasib of Mecca in the year 848 AH by al-Sayyid Abū al-Qāsim b. Ḥasan b. ʿAjlān, who was authorized to do so, replacing al-Muḥibb b. ʿIzz al-Dīn. He died in Mecca in the Hijri month of Ṣafar, in the year 862 AH.
