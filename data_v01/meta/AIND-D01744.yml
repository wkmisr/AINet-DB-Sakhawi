translation:
  ja: アフマド、ラカブはシハーブ、アル＝アブシーヒー、クルアーン読誦師（ムクリ）。アッ＝タッバーフ・モスク界隈に居住した。彼はシャムス・アッ＝ディーン・イブン・タルトゥール・アル＝ムクリの母方の（乳）叔父であった。というのも彼はイブン・タルトゥールの母の乳兄弟だったからである。彼（アフマド）が私（＝サハーウィー）に語ったところによれば、アル＝マドゥーリーが彼のもとでアッ＝スースィー伝によるクルアーン読誦を二度の通読（ハトマ）で完成させた。しかし彼（アフマド）自身は、誰から（読誦を）学んだのかは分からなかった。
  en: Aḥmad, al-Shihāb al-Abshīhī, a Qurʾān reciter (muqriʾ), resided in the vicinity of Jāmiʿ al-Ṭabbākh. He was the maternal (milk-)uncle of Shams al-Dīn b. Ṭarṭūr al-Muqriʾ, because he was his mother's milk-brother. As he (Aḥmad) informed me (al-Sakhāwī), al-Madūrī perfected under him the recitation in the transmission of al-Sūsī over two complete readings. However, he (Aḥmad) himself did not know from whom he had received his own recitation.
