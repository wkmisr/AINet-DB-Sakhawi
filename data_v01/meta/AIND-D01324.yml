translation:
  ja: アハマド・ブン・ムハンマド・ブン・サイード・アル＝ヒムスィー・アッ＝シャーフィイー。 816年ズー・アル＝カアダ月12日に生まれた。彼は、我らがシャイフ（イブン・ハジャル）から『アル＝ムサルサル』を聴聞し、またシャラフ・アル＝マナーウィーと、同郷のシャムス・ブン・アル＝アースィヤーティーから学んだと述べた。シャムス・ブン・ムサッダド・アル＝マダニーは880年以降に彼に会い、彼から学んだ。
  en: Aḥmad b. Muḥammad b. Saʿīd al-Ḥimṣī al-Shāfiʿī. He was born on the 12th of Dhū al-Qaʿda in the year 816 H. He stated that he heard al-Musalsal from our shaykh (Ibn Ḥajar), and that he acquired knowledge from al-Sharaf al-Manāwī and his fellow countryman al-Shams b. al-ʿAṣyātī. Al-Shams b. Musaddad al-Madīnī met him after 880 H and acquired knowledge from him.
