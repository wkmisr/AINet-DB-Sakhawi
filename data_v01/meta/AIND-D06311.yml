translation:
  ja: クジャク（第1字にダンマ、第2字にファトハ）、アッ＝ザーヒリー・バルクーク。主人（バルクーク）の年少のマムルークの一人で、アル＝ムアイヤドの治世まで生き残った者の一人。十人長（アミール・アシャラ）およびラアス・ナウバとなったが、ついにアル＝アシュラフが彼をサファドへ追放し、ついで同地で小さなイクターを与えた。その後間もなく、830年代のある年に没した。髭のない者（アトラス）で、槍術に通じ、数年にわたりバーシュ（隊長）としてマフマルを率いた者の一人であった。
  en: Qujaq (with ḍamma on the first letter, then fatḥa), al-Ẓāhirī Barqūq. He was one of the junior mamlūks of his master and one of those who survived into the days of al-Muʾayyad; he became an amīr of ten and a raʾs nawba, until al-Ashraf exiled him to Ṣafad and then granted him a modest iqṭāʿ there. He died shortly afterwards, in the year [8]30-something. He was beardless (aṭlas), skilled in lance-play, and one of those who led the maḥmal as bāsh for some years.
