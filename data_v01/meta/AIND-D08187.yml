translation:
  ja: ムハンマド・ブン・アリー・ブン・ムハンマド、アッ＝シャムス・ブン・アン＝ヌール、スーク・アミール・アル＝ジュユーシュ近くのシーディー・ジャアファル（廟）の奉仕者。ハディースを読んだ者の一人で、我らがシャイフ（イブン・ハジャル）らから聴聞し、その息子ほかを伴って私のもとに通った。教育で生計を立て、諸ジハート（俸給職）に就き、さらにビーマーリスターン（病院）のいくつかの職務にも携わった。世俗の事柄に精通していた。おそらく（8）70年頃に没した。
  en: Muḥammad b. ʿAlī b. Muḥammad, al-Shams b. al-Nūr, servant (khādim) of (the shrine of) Sīdī Jaʿfar near Sūq Amīr al-Juyūsh. He was among those who read ḥadīth and heard from our shaykh (Ibn Ḥajar) and others, and he frequented me together with a son of his and others. He earned his living by teaching, held stipendiary posts (jihāt), and even served in some offices of the hospital (bīmāristān). He was well-versed in worldly affairs. He died around [8]70, presumably.
