translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー・ブン・アビー・アブドゥッラー・ムハンマド・ブン・アッ＝ラディー・ムハンマド・ブン・アビー・バクル・アブドゥッラー・ブン・ハリール、アフィーフ・アッ＝ディーン・アブー・アッ＝タイイブ・アル＝クラシー・アル＝ウスマーニー・アル＝マッキー。バーブ・アッ＝サラームの公証人（ウドゥール）の一人。809年サファル月にマッカで生まれ、（8）82年ジュマーダー・アル＝ウーラー月に同地で没した。
  en: ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh b. Abī ʿAbd Allāh Muḥammad b. al-Raḍī Muḥammad b. Abī Bakr ʿAbd Allāh b. Khalīl, ʿAfīf al-Dīn Abū al-Ṭayyib al-Qurashī al-ʿUthmānī al-Makkī, one of the notary witnesses (ʿudūl) at Bāb al-Salām. He was born in Mecca in Ṣafar 809 and died there in Jumādā I (8)82.
