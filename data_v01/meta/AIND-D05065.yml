    ja: 校閲者推定の同一人物候補。#AIND-D05686「143 علي بن يوسف بن إسماعيل الخواجا بن البهلوان . مات سنة بضع وخمسين」は名の3要素（علي／إسماعيل／يوسف）が順序違いで一致し、称号 الخواجا・通称 (ابن) البهلوان・没年（853 ⊂ بضع وخمسين）も一致。転送見出し REF D05702「علي بن يوسف الخواجا نور الدين البهلوان . مضى فيمن جده إسماعيل」（→D05686）はラカブ نور الدين を持ち本項と同じ。ナサブの一方が底本の転倒と考えられる。原文に同一視の明示はないため cert medium、Waka 裁定待ち（pending_B80）。
