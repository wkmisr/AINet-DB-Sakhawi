translation:
  ja: アリー・ブン・イスマーイール・ブン・ユースフ、アル＝ハワージャ・ヌール・アッ＝ディーン・アッ＝ルーミー・アル＝マッキー。イブン・アル＝バフラワーンとして知られる。彼はマッカに家屋を所有してそれを整備（開発）した。853年シャアバーン月に死去した。イブン・ファハドがその逝去日を記録している。
  en: ʿAlī b. Ismāʿīl b. Yūsuf, al-Khawājā Nūr al-Dīn al-Rūmī al-Makkī, famous as Ibn al-Bahlawān. He owned and developed properties in Mecca. He died in Shaʿbān, the year 853 AH, as recorded by Ibn Fahd.
