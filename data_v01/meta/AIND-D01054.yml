translation:
  ja: アフマド・ブン・アリー・ブン・ムハンマド・ブン・アブドゥルカリーム・ブン・ハサン・アル＝キーラーニー・アル＝マッキー。彼の父はアル＝カワージャ・シャイフ・アリーとして知られている。807 Hにマッカで生まれ、そこで育ち、804 Hにアズ・ザイン・アブー・バクル・アル・マラーギーから『ムスリム』、『アブー・ダーウード』、『イブン・ヒッバーン』の完全な聴聞を行った。イエメンで亡くなったと思われる。
  en: Aḥmad b. ʿAlī b. Muḥammad b. ʿAbd al-Karīm b. Ḥasan al-Kīlānī al-Makkī. His father was known as al-Khawāja Shaykh ʿAlī. He was born in Mecca in 797 H and grew up there. In 804 H, he heard the complete transmission of Muslim, Abū Dāwūd, and Ibn Ḥibbān from al-Zayn Abū Bakr al-Marāghī. He is thought to have died in Yemen.
