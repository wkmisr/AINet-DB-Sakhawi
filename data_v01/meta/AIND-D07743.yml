translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・イブラーヒーム、アル＝バドル、アル＝カーヒリー・アル＝アズハリー。アル＝ミスリーとして知られる。アル＝イッズ・ブン・ファハドが彼から、彼がアル＝ファフリー・ブン・グルバクを称えて詠んだ自作のカスィーダを書き取った。その冒頭は「わが二人の友よ、心はすっかり恋い焦がれ…」。またいくつかの短詩（マカーティーウ）も（書き取った）。彼は…（原文欠落）。
  en: Muḥammad b. ʿAbd Allāh b. Ibrāhīm, al-Badr, al-Qāhirī al-Azharī, known as al-Miṣrī. Al-ʿIzz b. Fahd wrote down from him a poem of his own composition in praise of al-Fakhrī b. Ghulbak, beginning "My two friends, the heart is wholly enamoured…", as well as several short pieces (maqāṭīʿ). He had … (the printed text breaks off).
