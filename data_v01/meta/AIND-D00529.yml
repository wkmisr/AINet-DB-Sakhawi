translation:
  ja: アフマド・ブン・アフマド、シハーブ・アッ＝ディーン。碩学シハーブ・アッ＝ディーン・アッ＝サイーディー・アル＝クドスィー・アル＝ハナフィー（原文「الحنقي」は「الحنفي」の誤記）の子で、アッ＝スーダーニーと渾名された。父はサイード地方の出で、エルサレムに来て証人職により学識をもって生計を立て、本人や他の子をもうけた。本人はマカーディサ（エルサレムの人々）の長、ムアッザミーヤ学院のムイード（復習担当）となった。802年に没した。
  en: Aḥmad b. Aḥmad Shihāb al-Dīn al-Ṣaʿīdī al-Qudsī al-Ḥanafī (the source spells it al-Ḥanqī, a scribal error for al-Ḥanafī), nicknamed al-Sūdānī. His father came from al-Ṣaʿīd, then settled in Jerusalem and earned a living through testifying, with distinction (maʿa al-faḍl). This one (the subject of the biography) and others were born to him. The subject became the shaykh of the Jerusalemites (al-Maqādisa) and a repetitor (muʿīd) at al-Muʿaẓẓamiyya. He died in the year 802.
