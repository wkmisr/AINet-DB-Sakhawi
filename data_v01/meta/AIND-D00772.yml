translation:
  ja: アハマド・ブン・シュアイブ。バイト・リヒヤーのフトバ（説教師）を務めた人物で、敬虔な信徒であり、多くのタハッジュド（夜間礼拝）とディクル（神名唱和）を行った。シャイフのイブン・ハッジーは、彼に匹敵する者はほとんどいなかったと述べたほどである。ムハッラム月（第1月）の801年に亡くなった。我らがシャイフ（イブン・ハジャル）がその著書『アンバー』で彼について記している。
  en: Aḥmad b. Shuʿayb was the khaṭīb (preacher) of Bayt Lihyā. He was a devout and obedient servant (of God), frequently performing tahajjud (night vigil prayers) and dhikr (remembrance of God), to the extent that al-Shihāb b. Ḥajjī said that few could equal him in this. He died in Muḥarram of the year 801 AH. Our shaykh (Ibn Ḥajar) mentioned him in his Anbāʾ.
