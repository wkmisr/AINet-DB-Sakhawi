translation:
  ja: アリー・ブン・ジャーラッラー・ブン・ザーイド・ブン・ヤフヤー・アッ＝スンブスィー・アル＝マッキー。前述のアフマドの兄弟で、イブン・ザーイドとして知られる。782年頃に生まれ、その少し後に一団の人々が彼にイジャーザを与えた。その中には〔底本欠落〕。837年シャアバーン月にマッカで没した。イブン・ファハドがその死を記録している。
  en: ʿAlī b. Jār Allāh b. Zāʾid b. Yaḥyā al-Sunbisī al-Makkī. He was the brother of the aforementioned Aḥmad and was known as Ibn Zāʾid. He was born approximately in the year 782 AH, and shortly thereafter a group of scholars granted him an ijāza, among them [names missing in the edition]. He died in Mecca in Shaʿbān, 837 AH. His death was recorded by Ibn Fahd.
