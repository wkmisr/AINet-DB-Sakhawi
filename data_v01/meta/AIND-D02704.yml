translation:
  ja: フサイン・ブン・アブドゥッラー・ナジュム・アッ＝ディーン。アッ＝サーミリー（サマリア教徒系）の出自。ダマスクスの機密書記長（カーティブ・アッ＝スィッル）を務めた。彼の姻戚（妻の連れ娘の夫）であるアズバク・アッ＝ダワーダールの引き立てによって、機密書記長職と軍事監督職（ナザル・アル＝ジャイシュ）を兼任した。諸学問には全く無知であったが、アシュラフィーヤ・ダール・アル＝ハディース（アシュラフィーヤ・ハディース学校）の教授職（タドリース）は彼の名義になっていた。ヒジュラ暦831年ジュマーダー・アル＝アーヒラ（第6月）に没した。
  en: Ḥusayn b. ʿAbd Allāh Najm al-Dīn, of Samaritan (al-Sāmirī) origin. He served as the Chief Secretary (Kātib al-Sirr) of Damascus. He combined this office with the military administration oversight (Naẓar al-Jaysh) through the patronage of his relative by marriage (the husband of his wife's daughter), Azbak al-Dawādār. He was completely devoid of scholarly knowledge, yet the professorship (tadrīs) at the Ashrafiyya Dār al-Ḥadīth was held in his name. He died in Jumādā al-Ākhira, in the year 831 AH.
