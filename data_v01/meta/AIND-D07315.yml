translation:
  ja: ムハンマド・ブン・ジュルバーン、ナースィル・アッ＝ディーン。シリアのアミールの一人で、その（シリアの）総督アル＝ムアイヤディー（ジュルバーン）の息子。872年、スワール戦役（シャー・スワールとの戦い）で、青春の盛りに没した。
  en: Muḥammad b. Julbān, Nāṣir al-Dīn, one of the amirs of Syria and the son of its viceroy, al-Muʾayyadī. He died in the Suwārī campaign (the battle against Shāh Suwār) in the year 872, in the prime of his youth.
