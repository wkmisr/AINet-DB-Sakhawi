translation:
  ja: アブド・アッ＝ラフマーン・ブン・アビー・バクル・ブン・アブド・アッ＝ラフマーン・アル＝ハマウィー・アル＝ハンバリー、クルアーン読誦家（ムクリ）、アル＝カーディリー・アル＝ワファーイー。ヒジュラ暦889年にカイロに来た。そこでアル＝ファフル・ウスマーン・アル＝マクスィーの甥が彼のもとで、アブー・アムル伝承による「二つの輝けるスーラ」（アッ＝ザハラーワーン＝バカラ章とイムラーン家章）を、またカーディーのアル＝アミーン・アブド・アル＝ワッハーブ・ブン・アフマド・ブン・ワフバーン・アル＝ハナフィー作の『ガーヤト・アル＝イフティサール（アブー・アムルの読誦原則の要約）』およびイブン・アル＝ジャザリーのタジュウィード詩（アル＝ジャザリーヤ）を読誦した。彼（本項主）は、この二詩を後出のアル＝アラー・アブー・アル＝ハサン・アリー・ブン・アフマド・アル＝ハマウィー・イブン・アル＝ヒドルのもとで読んだと語り、前者には注釈を書いたという。
  en: Abd al-Rahman b. Abi Bakr b. Abd al-Rahman al-Hamawi al-Hanbali, the Qur'an reciter, al-Qadiri, al-Wafa'i. He arrived in Cairo in the year 889 AH, and the nephew of al-Fakhr 'Uthman al-Maqsi read to him al-Zahrawayn by Abu 'Amr, along with the poem of al-Amin 'Abd al-Wahhab b. Ahmad b. Wahban al-Hanafi al-Qadi, entitled 'Ghayat al-Ikhtisar fi usul qira'at Abi 'Amr', and the poem of Ibn al-Jazari on Tajwid (al-Jazariyya). He said that he studied both of them under al-'Ala' Abu al-Hasan 'Ali b. Ahmad al-Hamawi b. al-Khidr, who will be mentioned later, and that he wrote a commentary on the first poem.
