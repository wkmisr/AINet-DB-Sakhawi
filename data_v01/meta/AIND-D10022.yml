translation:
  ja: マンスール・アル＝ジャズィーリー・アル＝マグリビー、文人（アディーブ）、マグリブの歴史家。（8）51年には存命であった。彼にはアブドゥルカリーム・ブン・アブドゥルガニー・ブン・イブラーヒームに関わる詩があり〔同人の項に、同人が伝えたものとして引かれる詩とも、同人について詠んだ詩とも読める〕、その一部は次のとおり。 「あなた方の門の従僕たちのもとで私の低い身分（ハフド）が長引き、彼らが（私を）引き上げる（ラフウ）ためには私の蔵（財）しか顧みないのなら、 私は彼らの時代の勘定（ヒサーブ）に我が生涯を費やし、諸学の修得に対して私の蔵を閉ざすであろう。」
  en: 'Manṣūr al-Jazīrī al-Maghribī, the litterateur (adīb), historian of the Maghrib. He was alive in the year [8]51. He has verses connected with ʿAbd al-Karīm b. ʿAbd al-Ghanī b. Ibrāhīm [either cited in the latter''s entry as transmitted by him, or composed about him], among them: "If my lowly standing (khafḍ) at the servants of your gate is prolonged, and for raising (rafʿ) they favour nothing but my storerooms, then I shall spend my life in the reckoning (ḥisāb) of their time, and shut my storerooms against the acquisition of the sciences."'
