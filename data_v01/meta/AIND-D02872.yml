translation:
  ja: ハリーファ・アッ＝ダリール（盲目の）。マシュハド・アン＝ナフィーシー（ナフィーサ廟）の住人でそのイマーム。サルガトミシーヤ（学院）で私のもとに出席していた者の一人。説教に類することに多少の知識があったが、精密さも正確さもなかった。893年サファル月に没した。
  en: Khalīfa al-Ḍarīr (the blind). Resident of al-Mashhad al-Nafīsī and its imām. He was among those who attended my sessions at al-Ṣarghatmashiyya. He had some acquaintance with something resembling preaching, but without mastery or accuracy. He died in Ṣafar of the year 893.
