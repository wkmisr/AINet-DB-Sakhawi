translation:
  ja: アブドゥッラフマーン・ブン・ファフル・アッ＝ディーン・ブン・タキー・アッ＝ディーン・アル＝ハサニー。ナキーブ・アル＝アシュラーフ（聖裔会総監）の兄弟であり、彼らのナキーブの息子。803年ラビーウ・アル＝アウワル月に没した。我らがシャイフ（イブン・ハジャル）が彼に言及している。
  en: Abd al-Rahman bin Fakhr al-Din bin Taqi al-Din al-Hasani. He was the brother of the Naqib al-Ashraf (marshal of the nobility) and the son of their Naqib. He died in Rabi' al-Awwal in the year 803 AH. Our shaykh (Ibn Hajar) mentioned him.
