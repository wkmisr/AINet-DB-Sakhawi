notes:
- text: '転送見出し（原文末尾「مضى فيمن جده أحمد بن أبي الفتح」による）。転送先は #AIND-D07165「محمد بن أبي بكر بن أحمد بن أبي الفتح بن إدريس بن سلامة أمين الدين أو شمس الدين بن المحدث العماد أو الكمال الدمشقي المذكور أبوه في الثامنة ويعرف بابن السراج … ومات في رمضان أو شوال سنة ثلاث」（803年没、未受領）。本見出しは祖父 أحمد を飛ばした短縮ナサブ（規則38）。ID-Master TMP-P-001485（父 العماد أبو بكر بن أحمد بن أبي الفتح … والد أمين الدين محمد ابن السراج）とも整合。'
