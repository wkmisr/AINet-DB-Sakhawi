translation:
  ja: ウマル・ブン・アリー・ブン・ウマル・アル＝イバーディー、のちアル＝ガムリー。アル＝バウワーブ（門番）として知られる。シャイフ・アル＝ガムリー、次いでその息子アブー・アル＝アッバースに仕えて育った者の一人で、彼とともにカイロに住み、ほかの地にも往来し、一時期結婚した。乏しく窮していながらも、私の口述（イムラー）の席に出席していた。（8）90年の少し後か少し前に没した。
  en: ʿUmar b. ʿAlī b. ʿUmar al-ʿIbādī then al-Ghamrī, known as al-Bawwāb (the doorkeeper). He was among those who grew up in the service of the Shaykh al-Ghamrī and then of his son Abū al-ʿAbbās; he lived with him in Cairo, travelled to other places, and was married for a time. He used to attend my dictation sessions despite his poverty and want. He died shortly after (8)90 or shortly before it.
