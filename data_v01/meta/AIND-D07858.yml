translation:
  ja: ムハンマド・ブン・アブドゥッラー、アッ＝タージュ・ブン・アル＝ジャマール、アル＝カリユービー・アル＝ハーンキー・アッ＝シャーフィイー。スィルヤークースのナースィリーヤ・ハーンカーのイマームで、アッ＝シャムス・アル＝カリユービーの外孫（娘の子）。880年代に没し、兄弟のアフマドが他の者と共同でイマーム職を継いだ。彼は父や兄弟たちと同様に弁舌の立つ人物で、そこの証人（公証人）の一人であり、人々が気を遣って接するたぐいの者であった。
  en: Muḥammad b. ʿAbd Allāh, al-Tāj b. al-Jamāl, al-Qalyūbī al-Khānkī al-Shāfiʿī, imam of al-Khānqāh al-Nāṣiriyya at Siryāqūs and the daughter's son of al-Shams al-Qalyūbī. He died in the [8]80s, and his brother Aḥmad succeeded him in the imamate, sharing it with another. He was sharp-tongued like his father and his brothers, one of the notarial witnesses there, and one of those whom people humoured.
