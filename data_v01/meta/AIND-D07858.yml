  note:
    ja: '父「الجمال عبد الله القليوبي الخانكي」（見出し「التاج بن الجمال」、本文「كوالده وإخوته」）。ラカブ الجمال という識別要素があり、الشمس القليوبي（#AIND-D07761）の娘婿で雄弁な人物として描かれる → 規則3・12 により仮番号 TMP-P-001625 を発行。corpus の عبد الله 部に本伝なし（#AIND-D04638 عبد الله بن محمد الجمال القاهري ثم الخانكي قاضيها「ويعرف بالوفائي」は840年頃生で世代が合わず別人）、ニスバ索引 #AIND-D11948 にも見えない。ID-Master 未登録。初版の汚染番号 TMP-P-000490 を置換。【集約 2026-10-31】候補 #AIND-D04662「عبد الله الجمال الخانكي تربية السالمي . … وقف عليه وعلى ابنين له في جهات بر عقارات بالخانقاه … مات عن سن تزيد على التسعين أو دونها في رجب سنة إحدى وتسعين」（名・ラカブ الجمال・ニスバ الخانكي が一致、子が複数）。ただし D04662 には القليوبي のニスバも الشمس القليوبي との姻戚も出ず（規則57 の閉合はラカブ＋ニスバの見かけ上の一致のみ）、本項主（88X 没）の没後 891 まで生存した計算になるため同定しない＝仮番号維持（内容A M、オーケストレーター決定8、★1 候補）。'
