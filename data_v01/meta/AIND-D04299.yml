translation:
  ja: アブド・アッ＝ラティーフ・ブン・イブラーヒーム・ブン・フサイン・ブン・ムハンマド、アッ＝ザイン・アル＝ジャバルティー・アル＝ジャワータリー・アッ＝タワーシー、預言者の聖域（ハラム）の奉仕者（宦官）の一人。マディーナで私（サハーウィー）から聴聞した者の一人で、891年に同地で没した。
  en: ʿAbd al-Laṭīf b. Ibrāhīm b. Ḥusayn b. Muḥammad, al-Zayn al-Jabartī al-Jawātirī al-Ṭawāshī, one of the servants (eunuchs) of the Prophet's Sanctuary. He was among those who heard from me in Medina, and he died there in the year 891.
