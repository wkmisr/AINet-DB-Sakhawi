translation:
  ja: 886番伝。 イスカンダル・ダッラール・アル＝アカーラートは878年シャアバーン月11日の金曜の夜に亡くなった。彼はその同業者の最後の人物であったが、ムスリムのワクフに対する大胆な行為や尊重しなかったこと、そしてその態度の軽蔑や彼の職業の独占性から、彼の死は安堵をもたらした。彼を継いだのはタルマースであった。
  en: No. 886. Iskandar Dallāl al-ʿAqārāt died on Friday night, the 11th of Shaʿbān in the year 878. He was the last of his kind/group. However, his death brought relief due to his audacity regarding Muslim waqfs and his lack of respect for them, along with his disdainful appearance and monopolization of his craft. He was succeeded by Talmās.
