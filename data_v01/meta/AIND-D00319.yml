translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブルハーン・アッ＝ディーン・ブン・タージ・アッ＝ディーン・アル＝カルバシー、カルバシャーはガルビーヤ州ミリージュの近くに位置する。シャafi派。百歳を超えたと言われる長老シャイフで、『アッ＝タンビーフ』などを暗記し、法学（フィクフ）と相続法（ファラーイド）に精通していた。師にはアル＝アブナースィー・アル＝カビールがいたと言われる。その地域でムフティーとなり、その分野では彼が頼りにされていた。自身の町のカーディー職と説教師職も兼任し、知識の収集と習得に熱心であったため、莫大な遺産を残したが、残されたのは娘と彼女の母親、そしてアブド・アル＝ガッファールという名の兄弟のみであった。彼はイブラーヒームの死後、カーディー職と説教師職を引き継いだ。890年ラビーウ・アッ＝サーニー月に亡くなった。父と祖父もその町の説教師とカーディーを務めていた。
  en: Ibrāhīm b. Muḥammad Burhān al-Dīn b. Tāj al-Dīn al-Kalbashi. Kilbishā is located near Malīj in al-Gharbiyya. Shafi'i. He was a long-lived shaykh said to have lived over a hundred years. He had memorized 『al-Tanbīh』 and other works, and was engaged in fiqh (Islamic jurisprudence) and farāʾiḍ (inheritance law). It is said that among his teachers was al-Abnāsī al-Kabīr. He became the mufti of his region and was relied upon in that capacity, in addition to holding the position of judge and khaṭīb (preacher) in his town. His intense eagerness for collecting and acquiring knowledge was such that it was said he left behind a huge estate. He left behind only a daughter, her mother, and a brother named ʿAbd al-Ghaffār, who succeeded him in the positions of judge and khaṭīb. He died in Rabīʿ al-Thānī in the year 890 AH. His father and grandfather were also khaṭībs and judges of the town.
