translation:
  ja: ディヤー・ブン・イマードゥッディーン・ディヤー・アッディーン・アッタブリーズィー。ディヤーというのは彼のラカブ（尊称）の略称であると思われる。熱心な信者であり、徳が高く、ハディースを愛し、知的学問（合理科学）への従事から強く身を退けていた。善行に励み、伝承鎖が低いものであっても、ハディースの朗読、聴聞、および聴講（伝授）に専念した。801年に没した。我らがシャイフ（イブン・ハジャル）は、彼の友人であるアブドゥッラフマーン・アッタブリーズィーの報告を引用して、自著『インバー・アル＝ゴムル』において彼について言及している。
  en: Ḍiyāʾ b. ʿImād al-Dīn Ḍiyāʾ al-Dīn al-Tabrīzī. I think 'Ḍiyāʾ' is an abbreviation of his laqab. He was a pious and virtuous man who loved hadith and strictly avoided engaging in the rational sciences. He was devoted to goodness and to the reading, hearing, and teaching of hadith despite the lower chains of narrations. He died in the year 801 AH. Our shaykh (Ibn Ḥajar) mentioned him in his *Inbāʾ al-Ghumr*, transmitting from the reports of his companion ʿAbd al-Raḥmān al-Tabrīzī.
