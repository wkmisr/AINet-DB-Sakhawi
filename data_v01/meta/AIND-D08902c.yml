translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・ウスマーン・ブン・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・アビー・バクル・ブン・イーサー・イブン・バドラーン・ブン・ラフマ、シャムス〔・ッディーン〕・アブー・アブドゥッラー・アッ＝サアディー・アル＝アフナーイー・アッ＝ディマシュキー、シャーフィイー派。757年ダマスクスに生まれ、ファーティマ朝の宰相シャーワルの子孫であると語っていた。成長して少し学問に励み、ブルハーン〔・ッディーン〕・イブン・ジャマーアの代理としていくつかの町で裁判を行い、次いでダマスクスで代理を務め、ガッザのカーディー職、次いで797年にナースィル・ッディーン・ハティーブ・ヌカイリーンの後任としてアレッポの〔カーディー職〕を2年余り、次いでザーヒル・バルクークとその子〔ナースィル・ファラジュ〕の時代にダマスクスの、次いでエジプトの〔大カーディー職〕を幾度も務めた。その後ジャマール〔・ッディーン〕・アル＝ビーリー・アル＝ウスターダールが彼をダマスクスへ追い出したので、同地の〔カーディー職〕をまた幾度も務めた。幾度も受難した。堂々たる体躯で愛想よく明朗、学生に施しを惜しまず、蓄財に通じ、官職のためにそれを惜しみなく使い、有力者に取り入ったが、法学の学識は乏しく、しばしば会合で恥をかいた。しかしその施しと恩恵がそれを覆っていた。我らの師〔イブン・ハジャル〕は『インバー』で彼に言及し、「サーリミーとクトルブガー・アル＝カルキーのもとでのハディース集会で彼と会ったが、私がダマスクスに滞在中に彼がそのカーディーであったにもかかわらず、ダマスクスでもカイロでもその邸宅で会う機会はなかった。彼は『私は寛大なカーディー、ブルキーニーは学識あるカーディーだ』と言っていた」と述べた。816年ラジャブ月、60歳に満たずに没した。イブン・ハティーブ・アン＝ナースィリーヤはその『歴史』で「美しい風貌の、高い志と威厳を備えた長であった」と述べ、他の者も同様に称賛した。マクリーズィーは『ウクード』で「学問においては裸であった。ダマスクスで幾度も私のもとに通い、同地で交際した。処世の道に通じた時代の男だったが、来世については、我が主が何かを望まれない限り、彼の取り分はないと思う。主は寛容にして慈悲深い。神が彼を赦したまえ」と述べた。
  en: 'Muḥammad b. Muḥammad b. ʿUthmān b. Muḥammad b. Aḥmad b. Muḥammad b. Abī Bakr b. ʿĪsā Ibn Badrān b. Raḥma, al-Shams Abū ʿAbd Allāh al-Saʿdī al-Akhnāʾī al-Dimashqī al-Shāfiʿī. Born in Damascus in 757; he used to claim descent from Shāwar, vizier of the Fatimids. He studied a little, served as deputy judge in some towns for al-Burhān Ibn Jamāʿa, then as deputy in Damascus, held the judgeship of Gaza, then of Aleppo in 797 in place of Nāṣir al-Dīn Khaṭīb Nuqayrīn for two years or more, then of Damascus in the days of al-Ẓāhir Barqūq and his son, then of Egypt several times; then al-Jamāl al-Bīrī the ustādār expelled him to Damascus, whose judgeship he held again several times. He suffered adversity more than once. He was imposing, affable and generous to students, skilled at amassing money and lavish in spending it on offices and on courting the great, but of scant learning in fiqh and sometimes embarrassed in gatherings, though his generosity covered for him. Our shaykh (Ibn Ḥajar) mentioned
    him in the Inbāʾ: "I met him at the ḥadīth session at al-Sālimī''s and Quṭlūbughā al-Karakī''s ... he used to say: I am a generous judge and al-Bulqīnī a learned judge." He died in Rajab 816, not having completed sixty. Ibn Khaṭīb al-Nāṣiriyya in his history called him a handsome, dignified chief of lofty ambition; al-Maqrīzī in his ʿUqūd said he was devoid of learning, a worldly man skilled in the ways of advancement, with little share in the hereafter unless God wills.'
