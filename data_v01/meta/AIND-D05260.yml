translation:
  ja: アリー・ブン・アブドゥッラー・ブン・アッ＝シャキーフ。アッ＝ザイン・アル＝マラーギーから『アル＝ムササール』を聴聞し、『サヒーハ・アル＝ブハーリー』の講読完了（ハトム）に立ち会った。ハジュル暦861年ムハッラム月にマッカで没した。イブン・ファハドがその死を記録している。
  en: ʿAlī b. ʿAbd Allāh b. al-Shaqīf. He heard 『al-Musalsal』 and the conclusion of the reading of 『al-Bukhārī』 from al-Zayn al-Marāghī. He died in Mecca in al-Muḥarram, the year 861 AH, as recorded by Ibn Fahd.
