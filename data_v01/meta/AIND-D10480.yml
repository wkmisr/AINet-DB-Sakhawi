translation:
  ja: ユースフ・ブン・アブドゥッラー・アル＝ブースィーリー。カイロに住みついた人で、人々がその聖性を信じたマジュズーブ（神に惹かれた者）の一人。（8）20年シャウワール月26日に没した。カイロの人々のなかには彼の奇蹟（カラーマ）を語り伝える者がいる。我らがシャイフ（イブン・ハジャル）が『インバー』でそう述べている。彼の奇蹟を私たちに語った者の一人にジャラール・アル＝クムスィーがおり、同人はイブン・ナスルッラーの墓廟で彼の隣に葬られた。
  en: Yūsuf b. ʿAbd Allāh al-Būṣīrī, a settler in Cairo and one of the ecstatics (majdhūbs) in whom the people believed. He died on 26 Shawwāl of the year [8]20, and some of the people of Cairo relate miracles of him. Our shaykh (Ibn Ḥajar) said this in his Inbāʾ. Among those who related some of his miracles to us was al-Jalāl al-Qumṣī, who was buried beside him in the tomb (turba) of Ibn Naṣr Allāh.
