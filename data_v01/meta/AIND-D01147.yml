translation:
  ja: アフマド・ブン・イーサー・ブン・アフマド、ラカブはアッ＝シハーブ。スンハージャ族でマグリブ出身、カイロに移り、アズハル・モスクに居住したマーリキー法学派のクルアーン朗誦師。クルアーン朗誦学、アラビア語学、法学に熟達し、一日中クルアーン朗誦の教授に専念した。シャムス・アル＝カラーフィーは彼から学んだ一人である。827年ムハッラム月7日に亡くなり、大いに悼まれた。我らがシャイフ（イブン・ハジャル）は『インバー・アル＝グムル』で彼の伝記を記した。
  en: Aḥmad b. ʿĪsā b. Aḥmad, al-Shihāb, al-Ṣanhājī al-Maghribī, then al-Qāhirī, al-Azharī, al-Mālikī, al-Muqriʾ, resident of al-Azhar Mosque. He was skilled in Qurʾanic recitations, Arabic language, and Fiqh, devoting himself to teaching recitation throughout the day. Al-Shams al-Qarāfī was one of those who studied under him. He died on the 7th of Muḥarram in the year 827 H, and his passing was widely mourned. Our shaykh (Ibn Ḥajar) wrote his biography in Inbāʾ al-Ghumr.
