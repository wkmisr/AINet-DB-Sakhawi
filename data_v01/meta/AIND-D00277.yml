translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・アブドゥルカーディル・ブン・ムハンマド・ブン・アブドゥルカーディル、渾名ブルハーン、ナスブ名ナーブルシー、ハンバル法学派。父と兄弟のアル＝カマール・ムハンマドは後述する。クルアーン六書の一部などを聴聞し、またアマーリーの講義を書き留めた。イェルサレムなどでカーディー職を務めた。
  en: Ibrāhīm b. Muḥammad b. ʿAbd al-Qādir b. Muḥammad b. ʿAbd al-Qādir, known as al-Burhān al-Nābulusī al-Ḥanbalī. His father (unnamed in this entry) and his brother al-Kamāl Muḥammad are mentioned later. He heard some of the Six Books (of Hadith) and other works, and copied a session of dictations (majlis min al-amālī). He served as qadi in Bayt al-Maqdis and other places.
