notes:
- text: '転送見出し（原文末尾「يأتي فيمن جده محمد بن حسين」による）。転送先は #AIND-D06857「محمد بن أحمد بن أبي الخير محمد بن حسين الزين محمد بن الأمين محمد ابن القطب أبي بكر محمد بن أحمد بن علي … الكمال أبو البركات القيسي القسطلاني المكي الشافعي والد المحمدين الكمال أبي الفضل والنجم والأمين والمحب الآتيين ويعرف بابن الزين . ولد في المحرم سنة إحدى وثمانمائة بمكة … مات في جمادى الأولى سنة خمس وستين بمكة」（祖父＝أبو الخير محمد بن حسين、ラカブ・クンヤ・ニスバが一致。未受領）。#AIND-D08643「محمد بن محمد بل أحمد بن أبي الخير محمد بن حسين … القطب أبو بكر بن الكمال أبي البركات القسطلاني … الماضي أبوه」は D06857 の子で、転送先ではない（ブリーフの判定を本文で確認）。'
