translation:
  ja: ムハンマド・ブン・アフマド・ブン・アビー・アル＝ハイル・ブン・フサイン・ブン・アッ＝ザイン・ムハンマド、アル＝カマール・アブー・アル＝バラカート、出自はアル＝カスタッラーニー、アル＝マッキー、シャーフィイー派。祖父がムハンマド・ブン・フサインである者たちのところで後述する。
  en: Muḥammad b. Aḥmad b. Abī al-Khayr b. Ḥusayn b. al-Zayn Muḥammad, al-Kamāl Abū al-Barakāt, al-Qasṭallānī by origin, al-Makkī, the Shāfiʿī. He will come among those whose grandfather is Muḥammad b. Ḥusayn.
