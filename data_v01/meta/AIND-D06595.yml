notes:
- text: '転送見出し（原文「يأتي بدون إبراهيم」による）。転送先は #AIND-D06631「994 محمد بن أحمد بن أبي بكر بن محمد الشمس الطائي البياني الحموي الشافعي ويعرف بابن الأشقر . ولد سنة سبع وستين وسبعمائة وقيل سبعين والأول أثبت بحماة … ورأيت من سمى جده إبراهيم بن أبي بكر فالله أعلم … مات في ثامن عشري أو رابع عشري شوال سنة خمسين」（repo 未収録、本バッチ B172 の帯の未受領項）。ナサブから「إبراهيم」を除いた形・ラカブ・ニスバ3つ・通称 ابن الأشقر が一致し、相手側本文も祖父を「إبراهيم بن أبي بكر」とする異伝を記す。'
  type: reference
  target: AIND-D06631
