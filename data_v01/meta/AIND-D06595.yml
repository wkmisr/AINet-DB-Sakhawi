  en: Muḥammad b. Aḥmad b. Ibrāhīm b. Abī Bakr b. Muḥammad, al-Shams al-Ṭāʾī al-Bayānī al-Ḥamawī, known as Ibn al-Ashqar. He will come below without “Ibrāhīm” [in his lineage].
