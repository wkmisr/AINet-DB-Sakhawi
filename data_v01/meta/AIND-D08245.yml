notes:
- text: '転送見出し（原文末尾「فيمن جده محمد بن عثمان بن إسمعيل」による）。転送先は #AIND-D08595「محمد بن علي بن محمد بن عثمان بن إسماعيل الشمس أبو المعالي الصالحي الأصل المكي . ولد في ذي القعدة سنة تسع وستين وسبعمائة بمكة … مات بمكة في جمادي الأخرة سنة ست وأربعين」（祖父ナサブ محمد بن عثمان بن إسماعيل・ラカブ الشمس・ニスバ الصالحي المكي が一致。「إسمعيل」は刊本の綴り）。'
