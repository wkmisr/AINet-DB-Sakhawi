translation:
  ja: ムハンマド・ブン・サイード・アル＝マグリビー・アッ＝ダリール（盲人）。彼もまた888年にマッカで没した。私の聞くところでは、彼はリバート・フーズィーに住み、法学・文法学・形態論などの美点を備え、現世に背を向けて至高なる神に向かい、〔世を〕離れ、畏れ、泣きながら、没するまでそのように過ごしたという。80歳近くであった。
  en: Muḥammad b. Saʿīd al-Maghribī al-Ḍarīr (the blind). He too died in Mecca in the year 888. It reached me that he resided at Ribāṭ Khūzī, possessing merits in jurisprudence, grammar, morphology and other subjects, and that he turned away from this world and turned to God Most High, detached, fearful and weeping, until he died, having approached eighty.
