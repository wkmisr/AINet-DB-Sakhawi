translation:
  ja: アブドゥッラヒーム・ブン・ムハンマド・ブン・ハサン・バハー・アッ＝ディーン・ハワージャ。カーディー・アル＝ファードィル・アッ＝シャムスの息子、ファフル・アル＝クダート・ワ・アル＝アカービル・カーディー・イマーム・アッ＝ディーンの息子。メッカを起源とし、アルディスターンに帰属する。シャーフィイー派。後述のファドル・アッラーの弟子。徳高き若者であり、メッカにおいて私から、また私の前で、彼の前述の師が聴聞し読誦したものを聴聞し、私は彼の画巻（マジュムーウ）に署名を記した。
  en: Abd al-Rahim bin Muhammad bin Hasan Baha' al-Din Khawaja, son of the virtuous judge al-Shams, son of the pride of judges and notables, Judge Imam al-Din. Originally of Meccan origin, from Ardistan, and of the Shafi'i school. He was a student of Fadl Allah, who is mentioned below. He was a virtuous youth who heard from me and recited to me in Mecca what his aforementioned teacher had heard and recited, and I wrote a certification for him in his compilation (majmuʿ).
