translation:
  ja: カジャラートの支配者（クッブ・アッ＝ディーン）ムザッファル家のアフマド・イブン・ムハンマド・イブン・アフマドは、カジャラートの支配者であった。彼の家系はカジャラートのケハン（司祭）に由来する。現在の支配者マフムード・シャーの兄弟。彼はクッブの後に定着したと思われる。血なまぐさく、権力に没頭していたため、彼の死因は刀の柄が足に当たるなどであったとされる。
  en: Aḥmad ibn Muḥammad ibn Aḥmad ibn Muẓaffar, Quṭb al-Dīn, master of Kajarāt, which is where his family was associated with priesthood. He was the brother of its current master Maḥmūd Shāh. It seems he became established after al-Quṭb. He was so bloodthirsty and deeply absorbed (in conflict/power) that the cause of his death was a blow from his sword hilt to his leg or similar.
