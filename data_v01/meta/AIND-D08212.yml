translation:
  ja: ムハンマド・ブン・アリー・ブン・ヌール・アッ＝ディーン、アブー・アブドゥッラー・アル＝マウザイー。イマームにして法源学者（ウスーリー）で、イブン・ヌール・アッ＝ディーンとして知られる。820年頃に没した。当時のスーフィーたちとの間に諸事があり、そこで彼の優れた学識が明らかになった。
  en: Muḥammad b. ʿAlī b. Nūr al-Dīn, Abū ʿAbd Allāh al-Mawzaʿī, the imam and scholar of legal theory (uṣūlī), known as Ibn Nūr al-Dīn. He died around the year 820. Certain matters occurred between him and the Sufis of his time in which his excellence became apparent.
