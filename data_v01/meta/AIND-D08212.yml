  note:
    ja: '見出し「محمد بن علي بن نور الدين … ويعرف بابن نور الدين」。刊本どおり父＝علي、祖父＝نور الدين と読む（規則25。項の配列も「بن نجم」D08211 と「بن هاشم」D08213 の間で、第三要素「نور」で並ぶ）。通称「ابن نور الدين」は祖父名から来たと読めば足りる。父のラカブ連結（「نور الدين علي」）と読む余地は、corpus の同型 #AIND-D03371「صدقة بن علي بن محمد فتح الدين بن النور أبي الحسن … ويعرف بابن نور الدين」（父のラカブ由来の通称）があるので note に留める。corpus に本伝なし（hw.py「الموزعي」の該当は #AIND-D04433・D04911・D07974 と本項のみ）、ID-Master 未登録。【集約 2026-11-05】父 علي 自身にラカブ・クンヤ・職・珍しい名がなく（نور الدين は祖父）、名＋父名＋ニスバ（الموزعي）のみで本伝のある兄弟とも共有しない＝規則3 (c'') により #NEEDID。校閲の 取り下げた仮番号 B157-P03（「نور الدين علي الموزعي」）は取り下げ（内容B L、オーケストレーター決定10・3）。'
