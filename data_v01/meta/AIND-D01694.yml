translation:
  ja: アフマド・ブン・ヤフヤー・ブン・ヤシュバク الفقيه الشهاب 彼の父と祖父は後述される。彼は父の死の時にすでに成人しており、彼の立派な人柄と、父の名を彼に付け加えることによって守られることはなかった。むしろ彼は祖父の遺産を継承した。彼は895年のジュマーダー・アル＝サーニー月に亡くなった。
  en: Aḥmad b. Yaḥyā b. Yashbak, al-Faqīh al-Shihāb. His father and grandfather will be mentioned later. He had already reached puberty at the time of his father's death. He was not protected by his good character and the addition of his father's name to his own; rather, he inherited from his grandfather. He died in Jumādā al-Thāniya in the year 895 AH.
