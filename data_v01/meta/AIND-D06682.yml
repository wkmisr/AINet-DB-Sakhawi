translation:
  ja: ムハンマド・ブン・アフマド・ブン・アブド・アル＝ハミード・ブン・ムハンマド・ブン・グシュム、アッ＝シャムス・アル＝マルダーウィー・アル＝マクディスィー、のちアッ＝サーリヒー。アブー・アル＝アッバース・アル＝マルダーウィー、アブド・アッ＝ラヒーム・ブン・イブラーヒーム・イブン・アル＝ムラッキン、ザイナブ・ビント・アル＝カマール、その他の人々から聴聞した。伝承を行ない、学識ある人々が彼から聴聞した。私たちの師の幾人かが彼からの伝承を私たちに伝えた。それどころか彼は私たちの師（イブン・ハジャル）にイジャーザを与え、師は彼をその『ムウジャム』その他に載せた。（80）1年シャウワール月に没した。アル＝マクリーズィーもその『ウクード』でこれに従っている。
  en: Muḥammad b. Aḥmad b. ʿAbd al-Ḥamīd b. Muḥammad b. Ghushm, al-Shams al-Mardāwī al-Maqdisī then al-Ṣāliḥī. He heard from Abū al-ʿAbbās al-Mardāwī, ʿAbd al-Raḥīm b. Ibrāhīm Ibn al-Mulaqqin, Zaynab bt. al-Kamāl and a group of others. He transmitted, and learned men heard from him; some of our shaykhs related to us on his authority. Indeed he granted an ijāza to our shaykh (Ibn Ḥajar), who included him in his Muʿjam and elsewhere. He died in Shawwāl of the year [80]1; al-Maqrīzī followed him [i.e. our shaykh] in his ʿUqūd.
