    ja: '「سمع من أبي العباس المرداوي」。既登録 TMP-P-001146「الشهاب أبو العباس أحمد بن عبد الرحمن المرداوي」（8世紀ダマスクス・サーリヒーヤのハンバリー派伝承者、al-Ḍawʾ 立項なし）を充てた。根拠: 登録の初出 #AIND-D04507「عبد الله بن علي … القباقبي الصالحي . سمع من أبي العباس المرداوي مجالس المخلدي الثلاثة」と呼び方が同じ（規則62）、本項主も المرداوي … ثم الصالحي、併記の師 زينب ابنة الكمال はダマスクスの人（#AIND-D06599「أجاز له … وزينب ابنة الكمال والمزي والبرزالي وآخرون من دمشق」）で土地が合う。同じ呼び方の別人候補: ハマーのカーディー「قاضيها الشهاب أبي العباس المرداوي」（#AIND-D00579「ولد تقريبا … سنة ثلاث وسبعين وسبعمائة أو ثلاث وستين … بحماة」の師）＝確認依頼（ISSUES §D173-4）。初版は #NEEDID。'
