translation:
  ja: イブラーヒーム・ブン・イブラーヒーム・ブン・ムハンマド・ブン・アブドゥルカーディル・ブン・ムハンマド・ブン・アブドゥルカーディル・アル＝ムヒッブ・アブー・アル＝ファドル。ナスブはアル＝ブルハーン・ブン・アル＝バドラニー・アブドゥッラー・アル＝ジャアファリー・アル＝マクディシーで、後にアル＝ナーブルシーとなり、ハンバリー派の人物。彼の父、祖父、そして叔父のアル＝カマール・ムハンマドについては後述する。彼の家は裁判官職と尊敬の家系であった。彼はアル＝ヒラキーに提示し、888年に（ハディースの）一部を朗誦し、また（アル＝ブハーリーの）いくつかの部分を朗誦した。これらは彼（アル＝ヒラキー？）から聞いたものや他の者から聞いたものとは別に、全て888年に行われた。その後、バイト・アル＝マクディスに戻った。
  en: Ibrāhīm b. Ibrāhīm b. Muḥammad b. ʿAbd al-Qādir b. Muḥammad b. ʿAbd al-Qādir al-Muḥibb Abū al-Faḍl, al-Jaʿfarī al-Maqdisī, then al-Nābulusī, of the Hanbali madhhab, whose nasab extends to al-Burhān b. al-Badrānī ʿAbd Allāh. His father, grandfather, and his uncle al-Kamāl Muḥammad will be mentioned later. His family was from a lineage of judgeship and esteemed position. He presented to al-Khiraqī and recited parts of al-Bukhārī (al-Ṣaḥīḥ), in addition to what he heard from him (unnamed teacher) and from others, all in the year 888 H. Afterwards, he returned to Bayt al-Maqdis.
