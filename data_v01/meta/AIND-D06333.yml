notes:
- text: '転送見出し（原文「هو عثمان بن قطلبك بن طرغلي」＝「هو الذي قبله」型の同一指示。転送動詞はないがブリーフ指示により REF）。転送先は本伝 #AIND-D04868「عثمان بن قطلوبك بن طور غلى الفخر التركي الأصل التركماني أمير التركمان بديار بكر … ويعرف بقرايلوك」（アク・コユンル朝のカラ・ユルク・ウスマーン）。同じ人物を指す索引見出し #AIND-D11331「قرا يلوك عثمان بن قطلوبك بن طر علي」もある。父名・祖父名の綴り（قطلبك／قطلوبك、طرغلي／طور غلى／طر علي）は見出しごとに揺れる。'
