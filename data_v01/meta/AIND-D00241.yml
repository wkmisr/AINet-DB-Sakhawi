translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・イブラーヒーム・ブン・マンジャク・アル＝ユースフィー・アッ＝ディマシュキー。父親の伝記は後述。母親はアビシニア人で、彼自身は色黒であった。ザーヒル・フシュカダムは彼にシャームにおける十人長職からの解任を命じた（869年）。彼はその直後、アシュラフ・カーイトバーイの統治初期に死去した。
  en: Ibrāhīm b. Muḥammad b. Ibrāhīm b. Manjak al-Yūsufī al-Dimashqī. His father's biography will be mentioned later. His mother was Abyssinian, and he himself was dark-skinned. Al-Ẓāhir Khushqadam dismissed him from the command of ten in al-Shām in the year 869. He died shortly thereafter, in the early days of al-Ashraf Qāytbāy's reign.
