  ja: アリー・ブン・アフマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・イブラーヒーム・ブン・ナスル・ブン・ファハド、アッ＝ディーラースティヤーリー。（7）67年にアッ＝サラーフ・ブン・アビー・ウマルから聴聞した。私（サハーウィー）は彼が今世紀（ヒジュラ暦9世紀）に達した可能性を認めた。
  en: ʿAlī b. Aḥmad b. ʿAbd Allāh b. Muḥammad b. Ibrāhīm b. Naṣr b. Fahd al-Dīrāsṭiyārī. He heard from al-Ṣalāḥ b. Abī ʿUmar in the year (7)67, and I (al-Sakhāwī) deemed it possible that he lived into this century.
