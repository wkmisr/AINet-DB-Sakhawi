translation:
  ja: イブラーヒーム・ブン・サアド・ブン・イブラーヒーム・ブン・ムハンマド、アブー・アル＝マカーリム、ブン・アビー・アル＝ハサン・アル＝ハドラマウィー、アル＝アンダルスィー、アル＝マグフリビー、アル＝マーリキー。アル＝ハルビー、およびイブン・アル＝サッバーグとして知られる。彼はしばしばアル＝スンバーティーと会い、彼に読み聞かせをし、彼から(ハディースの)一部を受け取り、それをシャイフ・ユースフ・アル＝アジャミーの孫らに読み聞かせた。彼はこの時代に伝承者の範疇に入らない人々に(イジャーザを)広げたため、私が知らない署名が記された招聘状を私のもとに持って来たので、私はそれに書き記すことを拒否した。彼は用語に関する問題を私に尋ねたので、私はそれを彼に明快にした。彼は、アル＝スヌフーリーとニザームからアラビア語を学び、アル＝デイミーのもとでアル＝アルフィーヤ・アル＝ハディースィーヤの注釈に関する集団に参加した。その後、彼は私に師事し、様々なことを私に読み聞かせ、私のアル＝アルフィーヤ注釈などを手に入れ、それを区分ごとに一部読み聞かせた。私は彼を理解力があり、賢く、学生たちと親しみ、学問への意欲がある者と見た。そして彼は熱心に私のもとを訪れて言った。「今、私たちは何も達成していなかったことを知りました」。彼の父が裕福な商人であったが亡くなったとき、彼は苦労し、懸命にアレクサンドリアに入ったが、何も得られず、893年のはじめに急死し、遺産は分散した。父と同様に、彼の財産保持や熱心さも彼のためにはならなかった。アッラーが彼らと私たちに慈悲を与えられんことを。
  en: Ibrāhīm b. Saʿd b. Ibrāhīm b. Muḥammad Abū al-Makārim b. Abī al-Ḥasan al-Ḥaḍramī al-Andalusī al-Maghribī al-Mālikī, also known as al-Ḥarbī and Ibn al-Ṣabbāgh. He frequently met with al-Sunbāṭī, read to him, and received parts from him, which he then read to the grandson of Shaykh Yūsuf al-ʿAjamī and others. He extended [ijāza-granting] to people who were not counted among the narrators of this era, such that he brought me a summons with signatures of those I did not know, so I refused to write on it. He asked me about a matter of terminology, and I clarified it for him. He was among those who studied Arabic under al-Sanahūrī and Niẓām, and participated with a group at al-Daymī's in a commentary on al-Alfīya al-Ḥadīthīya. Afterward, he adhered to me, read various things to me, and acquired my commentary on al-Alfīya and other works, reading a portion of it by section. I found him to be intelligent, astute, affable with students, and inclined towards scholarly achievement. He diligently
    frequented my presence and said, 'Now we realize that we have achieved nothing.' When his father, who was a wealthy merchant, passed away, he struggled and entered Alexandria with great effort, but achieved nothing substantial. Instead, he died quickly in the first year of 893, and his estate was dispersed. His careful management and diligence, like his father's, did not benefit him. May Allah have mercy on them both and on us.
