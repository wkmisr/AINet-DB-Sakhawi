notes:
- text: 父親がマンスーリー病院の財産管理官（خازن）だったことから、ابن خازنの名で知られた。
  lang: ja
  type: personalia
- text: He was known as Ibn al-Khāzin because his father, as mentioned earlier, was the treasurer (khāzin) of the revenue of the Manṣūrī hospital.
  lang: en
  type: personalia
translation:
  ja: アハマド・ブン・イブラーヒーム・ブン・アブドゥルムハイミン、ラカブはシハーブッディーン、そしてその父がファフルッディーン、出身ニスバはアル＝カルユービー、次いでアル＝カーヒリー、学派はシャーフィイー派。後述するシャラフ・ムハンマドの兄弟である。父がかつてマンスーリー病院の財産管理責任者であったことから、イブン・アル＝ハーゼン（管理責任者の息子）という通称で知られていた。804年、我らがシャイフ（イブン・ハジャル）が朗読するアブー・ズルア・アッ＝ディマシュキーの歴史の第4巻を、サーラ・ビント・アッ＝タキー・アッ＝サブキーから聴聞した。彼はそれを伝承し、一部の学生が彼から聴聞した。しかし、私（サハーウィー）は彼が携わっていた事柄のために、彼から聴聞することに気が進まなかった。それにもかかわらず、彼はカーミリヤ学院の門で証人として生計を立てていたが、イジャーザを授与した。その後、私は彼が、アブー・アッ＝サナー・マフムード・アル＝マンビジーらの代行により、ジャマール・ブン・アッ＝シャラーイヒーから伝えられた首位性の伝承が連鎖するハディースの章を聴聞していた記録を見つけた。彼は857年に亡くなった。アッラーが彼を赦されますように。
  en: Aḥmad b. Ibrāhīm b. ʿAbd al-Muhaymin, whose laqab was Shihāb al-Dīn, son of Fakhr al-Dīn. His nisbahs were al-Qalyūbī, then al-Qāhirī, and he belonged to the Shāfiʿī madhhab. He was the brother of al-Sharaf Muḥammad, who will be mentioned later. He was known by the nickname Ibn al-Khāzin because his father, as previously stated, was the treasurer of the Manṣūrī Hospital. In 804 H, he listened, through our shaykh (Ibn Ḥajar) reading to Sāra bint al-Taqī al-Subkī, to the fourth volume of Abū Zurʿa al-Dimashqī’s History. He transmitted it, and some students heard it from him. However, I (al-Sakhāwī) was disinclined to hear from him due to what he was involved in, even though he earned a living by giving testimony at the gate of al-Kāmiliyya. Nevertheless, he granted ijāza. I later found a record of him hearing a chapter containing the Musalsal bi-l-Awwaliyya ḥadīth, transmitted from al-Jamāl b. al-Sharāʾiḥī, with Abū al-Thanāʾ Maḥmūd al-Manbijī and others acting as deputies. He died in
    857 H. May God forgive him.
