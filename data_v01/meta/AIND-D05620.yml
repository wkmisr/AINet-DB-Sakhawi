translation:
  ja: アリー・ブン・ムハンマド・アル＝カーティブ、別名ムシャイミシュ。マールィダーニー・モスクの近くに暮らす高齢のシャイフ。書（カリグラフィー）において傑出しており、シタデル（城塞）出身のスンブリー・クラスの法学者（ファキーフ）の一人。カリグラフィーの指導に専念し、イブン・アッ＝スハィリーをはじめとする多くの人々が彼から学んで恩恵を受けた。
  en: ʿAlī b. Muḥammad al-Kātib, nicknamed Mushaymish. An elderly shaykh who lived near the Māridānī Mosque, distinguished in calligraphy. He was among the jurists of the Sunbuliyya class from the Citadel, and one of those who devoted themselves to teaching calligraphy, from which a group benefited, including Ibn al-Suhaylī.
