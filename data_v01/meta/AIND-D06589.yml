translation:
  ja: ムハンマド・ブン・イブラーヒーム・アル＝ガッズィー。自分はイブラーヒーム・ブン・ズッカーアの子孫だと称していたが、それは正しくなく、同郷の人々の言うところでは、彼の父は理髪師であった。（8）56年ムハッラム月にマッカで没した。イブン・ファハドが彼の没年を記した。
  en: 'Muḥammad b. Ibrāhīm al-Ghazzī. He used to say that he was one of the descendants of Ibrāhīm b. Zuqqāʿa, but this was not correct: his father, according to what the people of his town said, was a barber. He died in al-Muḥarram of the year [8]56 in Mecca. Ibn Fahd recorded the date of his death.'
