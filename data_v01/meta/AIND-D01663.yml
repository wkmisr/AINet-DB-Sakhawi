translation:
  ja: アハマド・ブン・ムーサー・ブン・ラジャブ、ラカブはアッ＝シハーブ、ニスバはアッ＝ディマシュキー、アル＝ファークーリー。彼は一時職を求めて、837年に我らがシャイフ、イブン・ヒドルが朗誦するのを聞いて『スンアン・アッ＝ダーラクートニー』をアル＝バドル・フサイン・アル＝ブーシーリーから聞き、またその前年にはアッ＝シャームでアリーから聞き、そして死去した。
  en: Ahmad b. Mūsā b. Rajab, al-Shihāb al-Dimashqī al-Fākhūrī. He sought employment for a time and heard, by the reading of our shaykh Ibn Khiḍr, in the year 837, Sunan al-Dāraquṭnī from al-Badr Ḥusayn al-Būṣīrī. Likewise, he heard in al-Shām in the year prior to that (836) from ʿAlī, and then he died.
