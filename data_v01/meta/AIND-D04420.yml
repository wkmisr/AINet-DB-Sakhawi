translation:
  ja: アブドゥッラー・ブン・アフマド。出自はファルナウ、のちマッカの人。アミーン・アッ＝ディーンに仕えたことから、アル＝アクサラーイーの名で知られた。880年シャアバーン月にカイロで没した。カイロやその他の地へ足繁く通い、奔走と蓄財に熱心で、人びと、とりわけ俗世の権勢家たちと深く交わった。私（サハーウィー）のもとにもよく訪ねてきた。彼に神の慈悲がありますように。
  en: ʿAbd Allāh b. Aḥmad, of Farnawī origin, al-Makkī, well known as al-Aqṣarāʾī because of his service to Amīn al-Dīn. He died in Shaʿbān of the year eighty [880 AH] in Cairo. He used to travel frequently to Cairo and elsewhere, being most energetic in striving and acquiring, and closely mixing with people, especially the worldly elite. He used to come to me often. May God have mercy on him.
