translation:
  ja: アリー・ブン・アフマド・ブン・アリー・ブン・フサイン・ブン・アル＝バドル・ムハンマド、サイフ・アッ＝ディーン・ブン・アン＝ナジュム・ブン・アッ＝リファーイー・アッ＝サフラーウィー。その父は前述した。（8）80年ジュマーダー・アル＝ウーラー月10日に生まれ、父の庇護のもとで育ち、クルアーンと『ミンハージュ』を読んで、（8）96年にそれを私（サハーウィー）に提示した。私は彼に『ムサルサル』を伝えた。（8）97年の疫病で没した。神が彼に天国を代償として与えられますように。
  en: ʿAlī b. Aḥmad b. ʿAlī b. Ḥusayn b. al-Badr Muḥammad, Sayf al-Dīn b. al-Najm b. al-Rifāʿī al-Ṣaḥrāwī. His father was mentioned above. He was born on 10 Jumādā al-Ūlā (8)80 and grew up under the care of his father. He read the Qurʾān and al-Minhāj and presented them to me (al-Sakhāwī) in (8)96, and I transmitted the Musalsal to him. He died in the plague of (8)97; may God grant him Paradise in recompense.
