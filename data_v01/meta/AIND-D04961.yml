    ja: '見出しナサブから復元（規則3）。corpus の أحمد 部に「أحمد بن حمزة بن راجح」の本伝なし・ID-Master 未登録 → 新規 TMP-P-001359。候補（【集約】内容検証A L-10 により訂正）: マッカのシャリーフ آل أبي نمي で、ナサブ「أحمد بن حمزة بن راجح」に正確に合うのは حمزة بن راجح（بن أبي نمي）の子、すなわち جار الله بن حمزة بن راجح（ID-Master TMP-P-000766。その子 #AIND-D07297、孫 #AIND-D02774）の兄弟にあたる人物。校閲時に挙げた「أحمد بن حمزة بن جار الله بن راجح」（#AIND-D04898・#AIND-D02421 の祖父）は1世代下で合わない。原文は الحسني 等の識別語を欠くため同定しない（規則26、→ISSUES §D99-2）。'
