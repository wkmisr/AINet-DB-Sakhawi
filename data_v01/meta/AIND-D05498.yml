translation:
  ja: アリー・ブン・ムハンマド・ブン・アリー・ブン・フバイス・ブン・ガイラーン、アン＝ヌール、アブー・アル＝ハサン・アル＝ガイリー・アッ＝シャジャリー・アル＝ヤマーニー。彼は私から『アル＝ヒダーヤ・アル＝ジャザリーヤ』の一部を討究の形で聴聞し、私は彼に長文の数葉にわたるイジャーザを与えた。
  en: ʿAlī b. Muḥammad b. ʿAlī b. Hubayṣ b. Ghaylān al-Nūr Abū al-Ḥasan al-Ghaylī al-Shajarī al-Yamānī. He heard part of al-Hidāya al-Jazariyya from me by way of study-discussion, and I granted him an ijāza in lengthy sheets.
