translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・イブラーヒーム、アッ＝シャムス・ブン・アル＝ムウタミド、アッ＝ディマシュキー。既出のイブラーヒームの父。73年ラビーウ第二月にダマスクスで、59歳で没した。
  en: Muḥammad b. Ibrāhīm b. Muḥammad b. ʿAlī b. Muḥammad b. Ibrāhīm, al-Shams Ibn al-Muʿtamid, al-Dimashqī, father of the Ibrāhīm mentioned above. He died in Rabīʿ II of the year 73 in Damascus, aged fifty-nine.
