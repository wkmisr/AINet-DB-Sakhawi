translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・イブラーヒーム・ブン・アフマド、アブー・アル＝ファトフ・ブン・アル＝ブルハーン、アル＝マクディスィー、アッ＝シャーフィイー。父と祖父は既出。先祖と同じくイブン・アル＝フッスの名で知られる。父とともにザーヒリーヤで『ブハーリー』の読了を聴いた者の一人で、私のもとにも少し出席した。証人業で生計を立て、説教（フトバ）を行い、バイバルスィーヤのスーフィーの席を得た。
  en: Muḥammad b. Ibrāhīm b. Muḥammad b. Ibrāhīm b. Aḥmad, Abū al-Fatḥ b. al-Burhān, al-Maqdisī al-Shāfiʿī, whose father and grandfather have been mentioned above; known, like his forebears, as Ibn al-Khuṣṣ. He was among those who heard, together with his father, the completion (khatm) of al-Bukhārī at the Ẓāhiriyya, and he attended my sessions a little. He earned his living as a notary witness, delivered the Friday sermon, and was given a place among the Sufis of the Baybarsiyya.
