translation:
  ja: シャクルーン・アル＝ジャバリー・アル＝マグリビー。敬虔で禁欲的な人物であった。ヒジュラ暦860年頃に没した。彼の詩には以下のようなものがある： 『私は古酒を飲み、その秘密によって私の心は輝き、その香りを私の五体に送った。 それゆえ私は、人々の間で燦然と輝く、魂なき身となった。それもひとえに、私の内なる光の輝きによるものにほかならない。』 我々のマグリブ人同輩の何人かが、この詩を私に伝えてくれた。
  en: 'Shaqrun al-Jabali al-Maghribi. He was a righteous and ascetic man. He died approximately in the year 860 AH. Among his poetry is the following: ''I drank an aged wine, and my heart was illuminated by its secret, sending its fragrance throughout my limbs. Thus I became as one without a soul, radiating among humankind; and that is none other than from the flashes of my inner light.'' Some of our Maghribi companions communicated these verses to me.'
