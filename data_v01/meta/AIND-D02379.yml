translation:
  ja: ジャンバク・アル＝ムアイヤディー・シャイフ。ジャンバク・シャイフとして知られる。彼の兵士としての暮らしは長く続いたが、やがて同輩（フジュダーシュ）であったアッ＝ザーヒル・フシュカダムが、兵士の身分に近い弱小のアミール職を彼に授けた。そのまま873年ムハッラム月（第1月）に、老いて無職のまま亡くなった。彼は怠惰で快楽に耽溺する者の一人であった。
  en: Jānbak al-Muʾayyadī Shaykh, also known as Jānbak Shaykh. His service as a common soldier was prolonged until his khujdāsh (fellow mamluk) al-Ẓāhir Khushqadam granted him a weak amirate close to a soldier's rank. He remained so until he died in Muḥarram 873 AH, old and out of office. He was one of the negligent and self-indulgent.
