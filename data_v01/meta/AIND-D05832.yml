translation:
  ja: ウマル・ブン・アッ＝ルバート・ハサン・ブン・アリー・ブン・アビー・バクル・アル＝ビカーイー、あの所業の主イブラーヒームの父。その息子によれば、彼は（7）80年より後の頃に、バアラバック管区のビカー・アル＝アズィーズィーにある村ヒルバト・ルーハーで生まれた。息子は彼に大仰な伝記を書き、彼が（8）21年シャアバーン月に、兄弟や従兄弟の一団とともに殺されたと記している。
  en: ʿUmar b. al-Rubāṭ Ḥasan b. ʿAlī b. Abī Bakr al-Biqāʿī, the father of Ibrāhīm, the author of those notorious doings. His son said that he was born approximately after the year (7)80 in the village of Khirbat Rūḥā in al-Biqāʿ al-ʿAzīzī, in the district of Baʿlabakk. The son wrote a grandiloquent biography of him and stated that he was killed in Shaʿbān (8)21 together with a group of his brothers and cousins.
