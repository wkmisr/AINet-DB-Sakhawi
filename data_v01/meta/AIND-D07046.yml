notes:
- text: '転送見出し（原文末尾「فيمن جده يوسف بن محمد بن معالي」による）。転送先は #AIND-D07017「محمد بن أحمد بن يوسف بن محمد بن معالي بن محمد الشمس أبو الفتح بن الشهاب أبي العباس بن أبي المحاسن القرشي المخزومي الزعيفريني الأصل ثم الدمشقي ثم القاهري الشافعي」（813年カイロ生、未受領）。祖父名 يوسف بن محمد بن معالي・ラカブ الشمس・ニスバ الزعيفريني が一致。本バッチ D07018「محمد المحب أبو بكر … أخو الذي قبله」の「الذي قبله」も同じ D07017 を指す。'
