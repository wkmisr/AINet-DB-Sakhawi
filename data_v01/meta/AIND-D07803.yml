notes:
- text: '転送見出し（原文末尾「يأتون فيمن جدهم محمد بن عبد الوهاب」による）。転送先は3件: 第1候補 #AIND-D07821「محمد بن عبد الله بن محمد بن عبد الوهاب بن علي بن يوسف المجد بن الجمال بن فتح الدين الأنصاري الزرندي المدني الحنفي الماضي أبوه وهو أكبر إخوته」（مجد الدين、未受領）。第2・第3候補は editorial note に記す。'
  type: reference
- text: '転送先3件（兄弟、父 عبد الله بن محمد بن عبد الوهاب الزرندي＝「ابن أبي الفتح」の「أبو الفتح」は見出しの人物の祖父 محمد بن عبد الوهاب（فتح الدين أبو الفتح、#AIND-D04598「عبد الله بن محمد بن عبد الوهاب الجمال بن القاضي فتح الدين أبي الفتح」による。集約 2026-10-26 で「曾祖父」を訂正））: #AIND-D07821（مجد الدين、長兄）・#AIND-D07822「محمد نجم الدين أخو الذي قبله . حفظ القدوري」（نجم الدين、B143）・#AIND-D07823「محمد شمس الدين أخو الأولين . ممن سمع مني بالمدينة أيضا」（شمس الدين、B143）。初版の grandfather relation（#NEEDID）は REF のため除去。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・アブド・アッラー・ブン・アビー・アル＝ファトフ。三人：マジュド・アッ＝ディーン、ナジュム・アッ＝ディーン、シャムス・アッ＝ディーン。祖父がムハンマド・ブン・アブド・アル＝ワッハーブである者たち（の部）で後述する。
  en: 'Muḥammad b. ʿAbd Allāh b. Abī al-Fatḥ: three persons, Majd al-Dīn, Najm al-Dīn and Shams al-Dīn. They will come below among those whose grandfather is Muḥammad b. ʿAbd al-Wahhāb.'
