translation:
  ja: アブド・アッ＝ラフマーン、アッ＝ザイン・アブー・アル＝ファラジュ・アル＝アズラーリー（紐ボタン結い）・アッ＝スーフィー・アッ＝スフラワルディー・アル＝カーディリー・アッ＝シャーフィイー。敬虔なしもべ（アブド・サーリフ）で、シャイフ・ユースフ・アッ＝サッフィーやムハンマド・アル＝アッタールら、アル＝ジャマール・ユースフ・アル＝アジャミーの門人たちから（道を）受けた。私は彼をたびたび見かけた。私の師（ファキーヒー）で叔母の夫でもあるファキーフ・フサインが彼に随従し、彼のもとで紐ボタン結い（アクド・アル＝アズラール）を修めた。彼はアル＝ハーキム・モスク門前の店でボタン結いを生業とし、その店で851年ラビーウ・アル＝アウワル月に没した。アッラーの慈悲あれ。
  en: ʿAbd al-Raḥmān al-Zayn Abū al-Faraj al-Azrārī al-Ṣūfī al-Suhrawardī al-Qādirī al-Shāfiʿī. A righteous servant, he took [knowledge] from al-Shaykh Yūsuf al-Ṣafī, Muḥammad al-ʿAṭṭār, and others among the companions of al-Jamāl Yūsuf al-ʿAjamī. I saw him frequently. My jurist and the husband of my aunt, the jurist Ḥusayn, accompanied him and trained under him in button-making (ʿaqd al-azrār). He used to earn his living by making buttons in a shop near the gate of al-Ḥākim Mosque, where he died in Rabīʿ al-Awwal, the year 851 H. May God have mercy on him.
