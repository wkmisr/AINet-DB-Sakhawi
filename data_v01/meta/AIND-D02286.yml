translation:
  ja: ティムラーズ・アル＝ムアイヤディー。サファドの副知事、のちにガザの副知事。ヒジュラ暦841年ジュマーダー・アル＝アーヒラ月23日、アレクサンドリアの獄中にて絞殺された。アル＝マクリーズィーの記述においては、彼は好意的に評価されていなかった。
  en: Timrāz al-Muʾayyadī, the deputy governor of Safad, then Gaza. He was strangled to death in the prison of Alexandria on the 23rd of Jumada al-Akhira, in the year 841 AH. He was not praised in what al-Maqrizi wrote about him.
