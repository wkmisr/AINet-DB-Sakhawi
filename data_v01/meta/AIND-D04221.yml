translation:
  ja: アブドゥルカーディル・アッ＝タッバーフ。イブン・イブラーヒームとして知られる。城塞（カルア）の料理人であったが、アル＝ビバーウィーが彼の姉妹を娶り、彼をナザル・アッ＝ダウラ（国家財務監督職）に就かせた。アル＝ビバーウィーはその姉妹との間に息子のサラーフ・アッ＝ディーン・ムハンマドを儲け、スレイマーン・アル＝ハーズィンは父の死からしばらくして、その娘をサラーフ・アッ＝ディーンに娶らせた。スレイマーンが亡くなると、その婿（サラーフ・アッ＝ディーン）が代わってその職（ハーズィン職）に就いた。
  en: ʿAbd al-Qādir al-Ṭabbākh, known as Ibn Ibrāhīm. He was a cook in the Citadel (al-Qalʿa), then al-Bībāwī married his sister and established him in the office of Naẓar al-Dawla. Al-Bībāwī had a son with his sister named Ṣalāḥ al-Dīn Muḥammad, whom Sulaymān al-Khāzin married to his daughter some time after his father's death. When Sulaymān died, his son-in-law (Ṣalāḥ al-Dīn) was established in his place.
