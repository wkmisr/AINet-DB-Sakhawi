notes:
- text: 貧者（スーフィー）の道に入り、数名のシャイフのもとに参席し、のち自ら聴聞した。独身行（تجرد）を修めたが、その後結婚し、諸マドラサに俸禄口を得た。
  lang: ja
  type: personalia
- text: He followed the path of the Sufi poor (fuqarāʾ), was brought as a child to the sessions of some shaykhs, and later heard [ḥadīth] himself; he practised celibate asceticism (tajarrud), then married and received stipendiary places in the madrasas.
  lang: en
  type: personalia
translation:
  ja: アブドゥッラー・ブン・サーリム・ブン・スライマーン・ブン・ウマル、アル＝ジャマール・イブン・アル＝バスラウィー、のちアッ＝ディマシュキー。746年に生まれ、貧者（スーフィー）の道に入った。数名のシャイフのもとに〔幼くして〕参席し、のち自ら〔ハディースを〕聴聞した。独身行を修め、その後結婚して、諸マドラサに俸禄口を得た。803年シャアバーン月に没した。我らがシャイフ（イブン・ハジャル）がその『インバーウ〔・アル＝グムル〕』でこう述べている。
  en: ʿAbd Allāh b. Sālim b. Sulaymān b. ʿUmar, al-Jamāl b. al-Baṣrawī, then al-Dimashqī. He was born in the year 746 AH and followed the path of the Sufi poor. He was brought as a child to the sessions of some shaykhs, then heard [hadith] himself; he practised celibate asceticism (tajarrud), then married and received stipendiary places in the madrasas. He died in Shaʿbān of the year three [803 AH]. Our shaykh (Ibn Ḥajar) said so in his Inbāʾ [al-Ghumr].
