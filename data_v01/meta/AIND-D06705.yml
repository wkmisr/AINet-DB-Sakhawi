  note:
    ja: '見出しナサブ（規則37）。父＝corpus 本伝 #AIND-D00908「أحمد بن عبد الله بن محمد بن إبراهيم السخاوي ثم البلقيني نزيل القاهرة ثم مكة ويعرف بالشاذلي . ولد بسخا وقدم مع أبيه إلى بلقينة … ثم تحول إلى مكة فقدمها في سنة إحدى … فقطنها حتى مات في شوال سنة سبع وأربعين ، وكان خيرا يخطب بوادي المبارك من نخله」（ナサブ4代・ニスバ البلقيني・الشاذلي・マッカ・ナフラの谷で閉合。ブリーフに記載なし）。初版は父 relation なし。'
- id: r2
  type: personal
  subtype: relative
  active: AIND-D04977
  passive: AIND-D06705
  cert: medium
  quote: علي بن الجمال المصري
  note:
    ja: '「صهر علي بن الجمال المصري」。「صهر」は婿・舅・義兄弟のいずれか原文から決まらない＝subtype relative（規則52）。相手: corpus の「ابن الجمال المصري」家で علي の名をもつ本伝は #AIND-D04977「علي بن أحمد بن عبد الرحمن بن محمد بن أبي بكر بن علي بن يوسف النور الأنصاري المكي الشافعي … ويعرف كل منهم بابن الجمال المصري . ولد في سنة اثنتين أو ثلاث وثلاثين بمكة」のみ（名＋本文明記の通称＋マッカの3点。الجمال المصري 本人 #AIND-D07214 の子で本伝のあるのは الطاهر・عبد الرحمن・أحمد・عمر・أبو بكر で علي はいない。#AIND-D05408 علي は النجم المرجاني の子で別系）。ただし D04977 は 832〜833年生で、本項主の没年（867）には30代半ば＝「婿」の読みには若く、الجمال المصري の本伝のない子 علي である可能性が残る＝cert medium（ISSUES §D173-5）。初版は subtype other・#NEEDID。'
