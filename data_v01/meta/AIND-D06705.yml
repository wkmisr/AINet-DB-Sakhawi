translation:
  ja: ムハンマド・ブン・アフマド・ブン・アブド・アッラー・ブン・ムハンマド・ブン・イブラーヒーム、出自はアル＝ブルキーニー、アル＝マッキー・アッ＝シャーズィリー。アリー・ブン・アル＝ジャマール・アル＝ミスリーの姻戚（スィフル）。クルアーンを暗記していた者の一人で、ワーディー・ナフラのサウラ村でイマームを務め、村では彼に祝福が求められ、それどころか人々はザカートその他を彼に施していた。（8）67年シャウワール月にマッカで没した。イブン・ファハドがその没年を記している。
  en: Muḥammad b. Aḥmad b. ʿAbd Allāh b. Muḥammad b. Ibrāhīm, al-Bulqīnī by origin, al-Makkī al-Shādhilī, relative by marriage (ṣihr) of ʿAlī b. al-Jamāl al-Miṣrī. One of those who knew the Qurʾān by heart; he led the prayer in the village of Sawla in Wādī Nakhla, where people sought blessing through him and indeed treated him kindly with zakāt and other gifts. He died in Mecca in Shawwāl of the year [8]67. Ibn Fahd recorded his death date.
