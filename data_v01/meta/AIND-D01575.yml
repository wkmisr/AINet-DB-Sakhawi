translation:
  ja: アフマド・ブン・ムハンマド・ブン・ナスル・アッ＝ダイルーティー。ダミエッタで『アッ＝シファー』により、我らがシャイフのアン＝ヌール・ブン・ヤフタフ・アッラーから伝聞した。アル＝ジャラール・ブン・アッ＝ラッダーディーが彼から学んだ。
  en: Aḥmad b. Muḥammad b. Naṣr al-Dayrūṭī. He transmitted ḥadīth in Damietta, [reciting] al-Shifā, on the authority of our shaykh al-Nūr b. Yaftaḥ Allāh. al-Jalāl b. al-Raddādī acquired [knowledge] from him.
