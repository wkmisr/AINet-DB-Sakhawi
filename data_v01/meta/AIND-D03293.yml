translation:
  ja: シャーヒーン・アル＝ファーリスィー。アル＝ムアイヤド（・シャイフ）に取り立てられた者の一人で、ついには軍司令官（ムカッダム）の一人に任じられた。その後、タタルが摂政（ニザーム・アル＝ムルク）であった時期に彼に逮捕され、824年ムハッラム月にアレクサンドリアに投獄された。おそらく（勇敢な）騎士の一人であった。
  en: Shāhīn al-Fārisī. He was one of those whom al-Muʾayyad (Shaykh) raised, until he made him one of the commanders (muqaddams). Then Ṭaṭar seized him during the days of his regency and imprisoned him in Alexandria in Muḥarram of the year 824. He was, it is thought, one of the horsemen (fursān).
