translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・ウマル・ブン・アリー・ブン・アフマド・ブン・ムハンマド、ナースィル・ッディーン・イブン・アル＝ジャマール・アビー・アブドゥッラー・アル＝クラシー・アッ＝タンバディー・アル＝カーヒリー、シャーフィイー派、前出の兄ウマルと父〔と同じく〕先祖のようにイブン・アラブとして知られる。878年ジュマーダー第1月に没した。90歳を超えていたと言われ、幼時に『タンビーフ』を暗記して提示し、少し学問に励んだ後、ジャラール・アル＝ブルキーニーとその後の〔カーディーたち〕の代理を務めたと言われる。兄や大半の親族と同様に人を避け、自宅に籠りきりであった。
  en: Muḥammad b. Muḥammad b. ʿUmar b. ʿAlī b. Aḥmad b. Muḥammad, Nāṣir al-Dīn b. al-Jamāl Abī ʿAbd Allāh al-Qurashī al-Ṭanbadī al-Qāhirī al-Shāfiʿī; his brother ʿUmar and their father have been mentioned; known like his forebears as Ibn ʿArab. He died in Jumādā I 878, said to have passed ninety, and to have deputised for al-Jalāl al-Bulqīnī and his successors, after memorising al-Tanbīh in his youth, presenting it and studying a little. Like his brother and most of his relatives he kept apart from people, staying always at home.
