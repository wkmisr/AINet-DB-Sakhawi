translation:
  ja: アハマド・ブン・ウマル・ブン・ムハンマド・ブン・アビー・バクル・アル＝ムルシディー・アル＝マッキー。 アハマド・ブン・サーリフ・ブン・ムハンマド・アル＝マーディーの父方の従兄弟であり、アブー・ハーミドとムハンマド・アル＝アーティーの兄弟である。 クルアーンと『アル＝ミンハージュ』を暗記し、そのほかは子どもたちにクルアーンを教えることやウムラによって生計を立てた。時にはターイフなどへの旅行もした。 マッカでの3回目のムジャーワラ（長期滞在）中に私（＝サハーウィー）からハディースを聴聞した。 彼は良い人物であった。
  en: Aḥmad b. ʿUmar b. Muḥammad b. Abī Bakr al-Murshidī al-Makkī, paternal cousin of Aḥmad b. Ṣāliḥ b. Muḥammad al-Māḍī and brother of Abū Ḥāmid and Muḥammad al-Ātī. He memorized the Qurʾān and 『al-Minhāj』, and earned his livelihood by teaching children the Qurʾān and through ʿumra. He also sometimes traveled to al-Ṭāʾif and other places. He heard from me (al-Sakhāwī) in Mecca during his third period of jāwara. He was a good person.
