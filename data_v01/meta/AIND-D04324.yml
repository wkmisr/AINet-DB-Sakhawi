translation:
  ja: アブド・アッ＝ラティーフ・ブン・アブド・アル＝カーディル・ブン・アル＝ムワッファク・ブン・アル＝ムヒーウィー・アッ＝シャーリイー・アル＝カーヒリー・アル＝ハナフィー・アッ＝スーフィー。両カラーファ墓地のザーウィヤのシャイフの一人で、イブン・ウスマーンとして知られる。793年に生まれ、868年ジュマーダー・アル＝ウーラー月に没した。イブン・アル＝ムニールがその没年を記録している。
  en: ʿAbd al-Laṭīf b. ʿAbd al-Qādir b. al-Muwaffaq b. al-Muḥyawī al-Shāriʿī al-Qāhirī al-Ḥanafī al-Ṣūfī, one of the shaykhs of the zāwiyas in the two Qarāfas, known as Ibn ʿUthmān. He was born in the year 793 and died in Jumādā al-Ūlā of the year 868. Ibn al-Munīr recorded his death.
