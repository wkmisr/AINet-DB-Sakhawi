translation:
  ja: アリー・ブン・アブドゥッラー・ヌール・アッディーン・アル＝ミスリー・アル＝カラーフィー・アル＝ハナフィー。彼は副カーディー（裁判代理官）を務めてその職務に熟達し、自身の法学派（ハナフィー派）に貢献した。ヒジュラ暦816年ラマダーン月に没した。我らがシャイフ（イブン・ハジャル）がその著作『インバー・アル＝グムル』で言及している。
  en: ʿAlī b. ʿAbd Allāh Nūr al-Dīn al-Miṣrī al-Qarāfī al-Ḥanafī. He served as a deputy judge, excelled in it, and participated in his school (the Hanafi madhhab). He died in Ramadan in the year 816 AH. Our shaykh (Ibn Ḥajar) mentioned him in his work Inbāʾ al-Ghumr.
