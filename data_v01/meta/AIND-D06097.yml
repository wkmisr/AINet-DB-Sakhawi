notes:
- text: '末尾「والسابق عنه في أحمد بن محمد بن محمد بن عبد الله المغراوي كلمات بينه وبين البساطي」＝「المغراوي の項で、彼（本項主）から伝えられた、彼（المغراوي）と البساطي の間のやりとりが先述された」。corpus #AIND-D01384（أحمد بن محمد بن عبد الله الشهاب المغراوي المالكي、820年没）末尾に「وعن الشرف عيسى المالكي القاضي أن المغراوي بحث مع البساطي في مسألة …」とあり、本項主はその逸話の伝え手（عنه）であって論争の当事者ではない。初版の disputant relation（البساطي wd:Q12219083）は誤読のため除去。本項が挙げる المغراوي の父祖名は「محمد بن محمد بن عبد الله」、D01384 の見出しは「محمد بن عبد الله」（محمد 一つ分の違い。検証後訂正 2026-10-10: 校閲の「本項の父名」は誤記で、本項主の父名ではない）。'
  lang: ja
  type: editorial
translation:
  ja: イーサー・ブン・ムハンマド、アッ＝シャラフ・アッ＝ティジャーニー・アル＝マグリビー・アル＝マーリキー。アル＝ジャマール・アル＝ハンバリーのもとで聴聞し、トリポリ、次いでエルサレムのカーディー職に就いた。アッ＝ザイン・リドワーンは学問を受けるべき相手の中に彼を挙げ、「シャイフ、イマーム」と形容した。私は、彼がこのすぐ後に出るイーサー・アル＝マグリビーであると思う。アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・アブドゥッラー・アル＝マグラーウィーの項で、彼（本項主）から伝えられた、彼（アル＝マグラーウィー）とアル＝ビサーティーとの間のやりとりが先に述べられている。
  en: ʿĪsā b. Muḥammad, al-Sharaf al-Tijānī al-Maghribī al-Mālikī. He heard from al-Jamāl al-Ḥanbalī, and held the judgeship of Tripoli, then of Jerusalem. Al-Zayn Riḍwān mentioned him among those from whom knowledge is to be taken and described him as "the shaykh, the imam". I think he is ʿĪsā al-Maghribī who comes shortly below. In the entry of Aḥmad b. Muḥammad b. Muḥammad b. ʿAbd Allāh al-Maghrāwī there was reported earlier, on his (the subject's) authority, an exchange of words between him (al-Maghrāwī) and al-Basāṭī.
