translation:
  ja: イーナール・アン＝ナウルーズィー、アミール・シラーフ（武器長官）。829年ラビーウ・アッ＝サーニー月にカイロで死去し、カラーファ門の外に埋葬された。多くの財を遺し、かつてシャームのナーイブ（総督）であったタグリー・バルディーの娘である妻を身重のまま残したが、彼女は彼の死後に男児を出産した。
  en: Īnāl al-Nawrūzī, amīr silāḥ. He died in Rabīʿ al-Thānī 829 in Cairo and was buried outside Bāb al-Qarāfa. He left great wealth, and left his wife — the daughter of Taghrī Birdī, the former nāʾib al-Shām — pregnant; she gave birth to a boy after his death.
