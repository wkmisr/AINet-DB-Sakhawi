translation:
  ja: ウマル・ブン・ムハンマド・ブン・アフマド・ブン・ムハンマド、アブー・ハフス、アッ＝タミーミー・アッ＝ダーリー・アッ＝トゥーニスィー。マッカ在住のアッ＝シャムス・ムハンマドの父で、イブン・アズムとして知られる。彼の息子は、彼の死を（8）46年ズー・アル＝カアダ月11日、木曜の夜（水曜の夜）、チュニスにおいてと記録し、彼を「大学者（アッラーマ）」と評した。もっとも彼は製本師であり、礼拝時刻計算師（ムワッキト）で、それ（礼拝時刻の計算）に秀でていたのであるが。
  en: ʿUmar b. Muḥammad b. Aḥmad b. Muḥammad, Abū Ḥafṣ al-Tamīmī al-Dārī al-Tūnisī, father of al-Shams Muḥammad, the resident of Mecca; he is known as Ibn ʿAzm. His son dated his death to the night of Thursday, 11 Dhū al-Qaʿda of the year (8)46, in Tunis, and described him as "the great scholar" (al-ʿallāma), although he was a bookbinder and a timekeeper (muwaqqit), skilled in that.
