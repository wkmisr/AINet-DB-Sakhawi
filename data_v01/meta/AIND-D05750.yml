  note:
    ja: '「واستجازه لجماعة كابن شيخنا وبني ابن فهد」＝ابن موسى が本項主に、イブン・ハジャルの子らを含む一団へのイジャーザを求めた。ابن شيخنا＝イブン・ハジャルの子 البدر محمد＝corpus 本伝 #AIND-D06758（محمد بن أحمد بن علي … البدر أبو المعالي ابن شيخنا … ولد في صفر سنة خمس عشرة、815年生＝乳児へのイジャーザ依頼）。初版の TMP-P-000277（ID-Master 登録「ابن شيخنا」、Note「イブン・ハジャルの息子ムハンマドと考えられる」）は本伝 AIND を優先して差し替え（ISSUES §D102-4 で名寄せ提案）。「بنو ابن فهد」（التقي ابن فهد の子ら）は複数・個人名不明のため relation を立てず本 note に留める。'
notes:
- text: 末尾「وأظنه ابن فينظر」は刊本テキストが欠損している可能性が高い（「أظنه ابن ［…］ فينظر」＝「私は彼を［…］の子と思うが、要検討」の名が脱落）。初版 en 訳の「Ẓuhayra」は根拠のない補いのため除去。原文どおり読み、ISSUES §D102-3 に記録。
  lang: ja
  type: editorial
translation:
  ja: アリー・アッ＝ダウルスィー・アル＝ブスターニー（園丁）。ハーフィズのイブン・ムーサーが（8）15年に彼と会い、彼は自分が101歳であると語ったが、体は頑健で五感も鋭く、クルミの木に登るほどであった。そこで（イブン・ムーサーは）一般イジャーザによって彼のもとで読誦し、アル＝ウッビーが聴聞した。また（イブン・ムーサーは）我らが師（イブン・ハジャル）の子やイブン・ファハドの子らなど一団のために彼にイジャーザを求めた。私は彼を［…］の子ではないかと思うが、要検討である。
  en: ʿAlī al-Dawrasī al-Bustānī (the gardener). The ḥāfiẓ Ibn Mūsā met him in the year (8)15, and he told him that he was one hundred and one years old, yet he was of strong build and keen senses, climbing walnut trees. So (Ibn Mūsā) read under him by the general ijāza, and al-Ubbī heard (from him); and he requested from him an ijāza for a group, such as the son of our shaykh (Ibn Ḥajar) and the sons of Ibn Fahd. I think he is the son of [...]; this should be examined.
