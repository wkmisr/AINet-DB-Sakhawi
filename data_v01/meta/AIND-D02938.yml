translation:
  ja: ハイル・アッ＝ザハビー。ジッダのブローカー（競売人）たちの頭領。彼はジッダ副知事ジャーニバクの解放奴隷（マウラー）であった。ハイルが頭領であった時、ジャーニバクが彼に対する所有権を主張したため、造幣局（ダール・アッ＝ダルブ）の職員の一人が彼の主人ジャーニバクからハイルを買い取った。彼はマッカに二つの家を所有しており、生前は放蕩に耽りつつも、弱者への同情を寄せ、そのうちの一軒を自らの被解放奴隷たちのためにワクフ（信託）として遺した。マッカにて868年ムハッラム月に没した。
  en: Khayr al-Dhahabī, the head of brokers in Jeddah. He was a freedman (mawla) of its deputy, Jānibak. When Khayr was serving as the head of brokers, Jānibak claimed ownership of him, prompting a member of the Mint (Dār al-Ḍarb) to purchase him from his master Jānibak. He owned two houses in Mecca, one of which he endowed (made waqf) for his own manumitted slaves, despite his indulgence in worldly pleasures and his kindness toward the weak. He died in Mecca in Muharram, the year 868.
