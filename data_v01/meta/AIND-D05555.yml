translation:
  ja: アリー・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・アブドゥルムンイム・ブン・ウマル・ブン・グダイル、アル＝アラー・ブン・アッ＝シャラフ・ブン・アル＝バドル、アッ＝ターイー・アル＝カウワース。801年ムハッラム月に没した。彼の祖父の叔父ウマル・ブン・アブドゥルムンイムは著名なムスニド（ハディース伝承家）である。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: ʿAlī b. Muḥammad b. Muḥammad b. Muḥammad b. ʿAbd al-Munʿim b. ʿUmar b. Ghudayr, al-ʿAlāʾ b. al-Sharaf b. al-Badr al-Ṭāʾī al-Qawwās. He died in Muḥarram 801. His grandfather's uncle ʿUmar b. ʿAbd al-Munʿim was a famous musnid. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
