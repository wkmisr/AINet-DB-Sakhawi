translation:
  ja: アブドゥルカーディル・ブン・アッ＝シャイフ・ヤフヤー・ブン・ムハンマド・ブン・ヤフヤー・ブン・アフマド・ブン・アリー・アル＝マグリビー・アル＝マッキー・アッ＝シャーズィリー・アル＝マーリキー。ヒジュラ暦840年シャアバーン月にマッカで生まれ、クルアーンを暗記し、学問に励んで優れた境地に達した。若くして、861年ラビーウ・アッ＝サーニー月5日の水曜日の午前中にマッカで死去した。
  en: ʿAbd al-Qādir bin al-Shaykh Yaḥyā bin Muḥammad bin Yaḥyā bin Aḥmad bin ʿAlī al-Maghribī al-Makkī al-Shādhilī al-Mālikī. He was born in Shaʿbān, in the year 840 AH, in Mecca. He memorized the Quran, engaged in studies, and achieved a commendable state. He died as a youth in Mecca in the forenoon of Wednesday, the 5th of Rabīʿ al-Thānī, in the year 861 AH.
