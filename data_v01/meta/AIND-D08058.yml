translation:
  ja: ムハンマド・ブン・アリー・ブン・ハサン・ブン・ムハンマド、アッ＝シャムス・アブー・アブドゥッラー、アル＝マウラー・ヌール・アッ＝ディーン・アッ＝サマルカンディー・アル＝バダフシャーニー──（綴りは）点一つのバー、次いで点なしのダール（ともにファトハ）、次いで点付きの二字（ハーはスクーン、シーン）、末尾はヌーン──の子、アル＝ハナフィー、アッ＝シャリーフ。マッカで私（サハーウィー）から聴聞した。
  en: Muḥammad b. ʿAlī b. Ḥasan b. Muḥammad, al-Shams Abū ʿAbd Allāh, son of al-Mawlā Nūr al-Dīn al-Samarqandī al-Badakhshānī — [spelled] with a single-dotted bāʾ then an undotted dāl, both with fatḥa, then two dotted letters, the first (khāʾ) quiescent, and a nūn at the end — al-Ḥanafī, al-Sharīf. He heard from me in Mecca.
