notes:
- text: '兄 #AIND-D10633「أبو بكر بن إبرهيم بن علي بن أحمد بن بريد المحب بن البرهان … الماضي أبوه … ولد سنة خمس وخمسين بدمشق」（次項の転送見出し #AIND-D06526「أخو الذي قبله وهو الأكبر」の転送先）は本項に名指しがない＝relation は立てない（父が AIND で共通、規則23）。見出しの「الدمشقي القادري」は父のラカブ「البرهان」に続くので父のニスバとも読めるが、父子とも該当するものとして初版どおり本項主の nisbah に保持。初版の friend relation（父がサハーウィーの「صاحبنا」であることを本項主の関係にしたもの、active #NEEDID）は除去。'
