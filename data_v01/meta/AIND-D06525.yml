translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アリー・ブン・アフマド・ブン・ブライド、アフィーフ・アッ＝ディーン・アブー・アッ＝ターヒル。我らの友アル＝ブルハーン・アッ＝ディマシュキー・アル＝カーディリーの息子。父が彼に私から聴かせた者の一人で、父の少し後に、幼くして没した。
  en: Muḥammad b. Ibrāhīm b. ʿAlī b. Aḥmad b. Burayd, ʿAfīf al-Dīn Abū al-Ṭāhir, son of our companion al-Burhān al-Dimashqī al-Qādirī. He was among those whose father had them hear from me; he died shortly after his father, while still a child.
