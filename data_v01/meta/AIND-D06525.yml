  note:
    ja: '「ابن صاحبنا البرهان الدمشقي القادري」。父＝corpus 本伝 #AIND-D00182「إبراهيم بن علي بن أحمد بن بريد تصغير برد صاحبنا الشيخ برهان الدين أبو إسحاق الديري الحلبي ثم القاهري ثم الدمشقي الشافعي القادري وبه يعرف فيقال له الشيخ إبراهيم القادري . ولد في سنة ست عشرة وثمانمائة تقريبا … مات قريبا من نصف ليلة السبت ثامن عشر رجب سنة ثمانين」（未収録）。見出しナサブ4代（بريد まで）＋「صاحبنا」＋ラカブ＋ニスバ2つで閉合（ブリーフ候補を本文で確認。cert なし、規則37）。「صاحبنا」は desc に入れない（規則31）。初版は #NEEDID。'
