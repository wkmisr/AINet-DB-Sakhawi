translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・スライマーン、アッ＝シャラフ・ブン・アル＝イマーム・アッ＝ザキー・アル＝バクリー・アル＝ミスリー・アッ＝シャーフィイー、『アル＝イウティナー・フィー・アル＝ファルク・ワ・アル＝イスティスナー』と『イフヤー・クルーブ・アル＝ガーフィリーン・フィー・スィーラト・サイイド・アル＝アウワリーン』の著者。アッ＝タキー・ブン・ファフドや、我々が学んだ者たち、たとえばアッ＝シャムス・アブー・アブドゥッラー・アル＝バンハーウィー・アル＝アシュブーリーなどが彼から学んだ。私は彼の伝記を見出していない。
  en: Muḥammad b. Abī Bakr b. Sulaymān, al-Sharaf b. al-Imām al-Zakī al-Bakrī al-Miṣrī al-Shāfiʿī, the author of al-Iʿtināʾ fī al-farq wa-l-istithnāʾ and of Iḥyāʾ qulūb al-ghāfilīn fī sīrat sayyid al-awwalīn. Among those who took from him were al-Taqī b. Fahd and others from whom we took, such as al-Shams Abū ʿAbd Allāh al-Banhāwī al-Ashbūlī. I have not come across a biography of him.
