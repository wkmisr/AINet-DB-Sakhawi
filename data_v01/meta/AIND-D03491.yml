translation:
  ja: アブドゥルバースィト・ブン・ウマル・ブン・ムハンマド・ブン・ヒバトゥッラー・アル＝ハマウィー。彼の父と祖父は後述される。先祖と同様にイブン・アル＝バーリズィーとして知られる。若者。父親とともにマッカに隣住（ジャーワラ）した。そこで少し学問に従事し、時に父親とともに私（サハーウィー）の講義に出席した。また、彼の親戚の女性との婚姻契約が彼のために結ばれた。
  en: ʿAbd al-Bāsiṭ b. ʿUmar b. Muḥammad b. Hibat Allāh al-Ḥamawī. His father and grandfather are mentioned below. Like his predecessors, he is known as Ibn al-Bārizī. A young man, he stayed as a neighbor (jāwara) in Mecca alongside his father. He engaged in some minor studies there, and occasionally attended my classes with his father. A marriage contract was also drawn up for him with a female relative of his.
