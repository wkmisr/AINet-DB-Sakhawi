    ja: '規則3 (c'')。父 محمد بن سعيد بن عقبة المنور は corpus に本伝なし（hw.py「عقبة」「المنور」該当は本項と #AIND-D05160「علي بن سعيد بن عقبة المنور مات في مستهل ذي الحجة سنة سبع وستين أرخه ابن فهد」のみ＝祖父 سعيد بن عقبة を共有する父の兄弟とみられるが、本項に名指しはないので relation は立てない）。父自身に識別要素なし → #NEEDID。初版は father relation なし。'
