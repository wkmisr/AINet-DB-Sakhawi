  note:
    ja: '「ممن كان في خدمة أبي السعادات القاضي زائد الوجاهة عنده」＝仕えた型（規則56、patron）。マッカの「القاضي أبو السعادات」はサハーウィーが固定的に用いる呼称（#AIND-D00698「القاضي أبي السعادات بن ظهيرة」・#AIND-D08192「أبي السعادات بن ظهيرة」・repo #AIND-D05183「القاضي أبو السعادات بن ظهيرة」）＝ #AIND-D09082「محمد الجلال أبو السعادات بن ظهيرة شقيق الذي قبله ووالد المحب أحمد وعبد الكريم . ولد … سنة خمس وتسعين وسبعمائة بمكة … وناب في القضاء بمكة عن أبيه … ثم أعيد في محرم التي تليها واستمر حتى مات … مات ببلده في آخر يوم الخميس تاسع صفر سنة إحدى وستين … ودفن بالمعلاة」（マッカのカーディー、861年サファル没＝本項主（861年ジュマーダー第二月没）と同年。repo 未収録）。クンヤ＋職（القاضي）＋マッカ・年代の2点以上で閉合するが、本項は「ابن ظهيرة」を伴わない呼称なので規則26 例外2 により cert medium。同時代のマッカの別の أبو السعادات（#AIND-D04319 السراج عبد اللطيف … القرشي الحنبلي、850没）はカーディーでない。初版は #NEEDID。'
  norm: أبو السعادات
translation:
  ja: ムバーラク・ブン・ムハンマド・ブン・サイード・ブン・ウクバ・アル＝ムナウワル。カーディーのアブー・アッ＝サアーダートに仕えた者の一人で、彼のもとで大いに重んじられた。861年ジュマーダー第二月にマッカで没した。
  en: Mubārak b. Muḥammad b. Saʿīd b. ʿUqba al-Munawwar. He was among those in the service of the Qāḍī Abū al-Saʿādāt and enjoyed great standing with him. He died in Jumādā II 861 in Mecca.
