translation:
  ja: ウマル・ブン・ムハンマド・アン＝ナジュム・アン＝ヌウマーニー——イマーム・アブー・ハニーファ・アン＝ヌウマーンにちなむ——アル＝バグダーディー、のちアッ＝ディマシュキー、アル＝ハナフィー。（8）50年に、ダマスクスのヒスバ（市場監督職）と国庫代理職（ワカーラト・バイト・アル＝マール）およびいくつかの職を手にしたままカイロに来て、城塞の下にあるアッ＝タキー・ラジャブ・アル＝アジャミーのザーウィヤに宿ったが、間もなく同年サファル月4日に没した。スルターンは彼の死を惜しみ、人々にムサッラー・アル＝ムウミニーで彼のための葬礼を行うよう命じ、自ら下って礼拝した。前述のアッ＝タキーの墓廟（小カラーファ）に葬られた。神が彼を赦したまわんことを。彼がカーディーのハミード・アッ＝ディーン・ムハンマド・ブン・タージュ・アッ＝ディーンの親族であるかどうかは検討を要する。
  en: ʿUmar b. Muḥammad al-Najm al-Nuʿmānī—after the Imam Abū Ḥanīfa al-Nuʿmān—al-Baghdādī, then al-Dimashqī, al-Ḥanafī. He came to Cairo in the year (8)50 holding the ḥisba of Damascus, the agency of the treasury (wakālat bayt al-māl) and several other offices, and lodged in the zāwiya of al-Taqī Rajab al-ʿAjamī below the Citadel; but before long he died, on the fourth of Ṣafar of that year. The sultan grieved for him, ordered them to pray over him at the Muṣallā al-Muʾminī, and came down and prayed over him himself. He was buried in the tomb of the aforementioned al-Taqī in the Lesser Qarāfa; may God pardon him. It remains to be examined whether he was a relative of the judge Ḥamīd al-Dīn Muḥammad b. Tāj al-Dīn.
