translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・アリー・アル＝ファキーフ、アブー・アル＝アッバース・アル＝アスラキー。アル＝アサーリク族（イエメンのアラブの部族）のニスバ。学業に励み、父のもとで法学などを修め、法学を始めとする諸学に秀でた。このことで知られる。アル＝アフダルがその著書『ターリーフ』で言及し、彼を「深奥な法学者で、法学に通じ、文法・言語学に通じ、クルアーン注釈に通じ、ハディースに通じた人物。その学問の大部分は法学、ハディース学、クルアーン注釈学であった。それはザビードでイブン・シャッダードから学んだ。人物伝と歴史、預言者伝にも深く通じ、神学原理にも強い腕前を持っていた。神の定めの問題でユダヤ教徒を反駁する見事な詩篇を残し、またサマーウを許す者たちを反駁する300句を超える別の詩篇も残している。彼の常日頃の行いは、法学を教授し、ハディースを聴聞させ、モスクで集団礼拝に欠かさず出席し、夜の最後の三分の一からクルアーンを朗誦することであった。書写は速く、筆致も優れていた。伝えられるところによると、彼は一日に40枚の紙を写本したという。世俗の仕事から離れ、学問と研鑽に専念した。威厳ある人物で、神の至高の御名を知っていたとも言われる。806年に86歳で死去した。彼は盲目であったが、それでもモスクでの集団礼拝を欠かすことはなかった。神が彼を憐れむように。
  en: Aḥmad b. Ibrāhīm b. ʿAlī al-Faqīh Abū al-ʿAbbās al-ʿAslaqī, a nisbah to al-ʿAsāliq, a Yemeni Arab tribe. He devoted himself to knowledge and studied fiqh under his father. He excelled in fiqh and other sciences and became well-known for it. Al-Ahdal mentioned him in his history, stating that "he was a profound jurist, well-versed in fiqh, a grammarian, linguist, exegete, and ḥadīth scholar. His primary fields of study were fiqh, ḥadīth, and tafsīr, which he acquired from Ibn Shaddād in Zabīd. He possessed a thorough knowledge of narrators, history, and sīra (Prophetic biography), and a strong command of the principles of religion. He composed a beautiful poem refuting a Jew on the issue of divine decree, and another, over 300 verses long, refuting those who permit listening (to music/poetry). His usual practice was to teach fiqh, transmit ḥadīth by audition, consistently attend congregational prayers in the mosque, and recite the Qurʾān in the last third of the night. He was a swift
    scribe with excellent calligraphy; it is said that he would copy forty sheets a day. He detached himself from worldly affairs, dedicating himself to learning and scholarship, possessing light and dignity. It is also said that he knew the Greatest Name of God. He died in the year [8]06 H at the age of 86, having lost his sight. Despite this, he never missed congregational prayer in the mosque. May God have mercy on him.
