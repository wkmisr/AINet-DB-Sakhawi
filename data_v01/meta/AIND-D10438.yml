translation:
  ja: ユースフ・ブン・アフマド・ブン・ガーニム、アル＝マクディスィー、アン＝ナーブルスィー、アッ＝タキー・アル＝カルカシャンディーの外孫。長いあいだナーブルスのカーディー職にあり、ついでサファドのカーディー職、ついでアル＝イマード・アル＝カラキーが没したときにエルサレムの説教師職に就いた。その後、ラムラのカーディーであるイブン・アッ＝サーイフが多額の金を使って彼に対して画策したため、解任された。そこで病身でダマスクスに来て、（80）2年ジュマーダー・アル＝ウーラー月に同地で没した。我らの師（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Yūsuf b. Aḥmad b. Ghānim, al-Maqdisī, al-Nābulusī, grandson (through his mother) of al-Taqī al-Qalqashandī. He held the judgeship of Nābulus for a long time, then the judgeship of Ṣafad, then the office of preacher (khiṭāba) of Jerusalem when al-ʿImād al-Karakī died. Then Ibn al-Sāʾiḥ, the qāḍī of al-Ramla, intrigued against him with a large sum of money, and he was dismissed. He then came to Damascus in ill health and died there in Jumādā I of the year [80]2. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
