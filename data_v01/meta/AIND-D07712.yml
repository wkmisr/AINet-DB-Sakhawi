  ja: ムハンマド・ブン・アブド・アル＝カーディル・ブン・ムハンマド・ブン・アブド・アル＝マリク、アル＝バドル、ダミーラ出自、カイロ在住、ハナフィー派。父は前述。父と同じく悪くない若者である。彼もまた学問に従事し、少し頭角を現し、ムハンマドは証人（公証人）たちとともに（店に）座った。
  en: Muḥammad b. ʿAbd al-Qādir b. Muḥammad b. ʿAbd al-Malik, al-Badr, of Damīra origin, of Cairo, the Ḥanafī; his father has been mentioned above. A decent young man like his father. He too engaged in study, distinguished himself a little, and Muḥammad sat with the notary witnesses.
