notes:
- text: '転送見出し（原文末尾「يأتي فيمن جده محمد」による）。転送先は #AIND-D07713「محمد بن عبد القادر بن محمد بن علي بن أحمد بن عبد العزيز أبو البركات ابن المحيوي بن الكمال أبي البركات النويري المكي الحنفي الماضي أبوه . ممن سمع مني بمكة والمدينة」（本バッチ B142 の担当ファイル）。本見出しの「ابن أبي البركات」は祖父 الكمال أبي البركات محمد のクンヤで、ナサブ「علي بن أحمد بن عبد العزيز」が一致。'
