  ja: アブドゥルカーディル・ブン・ムハンマド・サマンタハ・ブン・アブドゥルカリーム・ブン・アフマド・ブン・アブドゥルカリーム・イブン・ズハイラ・アル＝クラシー・アル＝ザビーディー。彼の母親はザビードの出身である。ヒジュラ暦836年に、学者たちの一群（ジャマーア）が彼にイジャーザ（伝承認可）を授けた。
  en: ʿAbd al-Qādir b. Muḥammad Samanṭaḥ b. ʿAbd al-Karīm b. Aḥmad b. ʿAbd al-Karīm Ibn Ẓuhayra al-Qurashī al-Zabīdī. His mother was from the people of Zabīd. In the year 836 AH, a group of scholars granted him an ijāza.
