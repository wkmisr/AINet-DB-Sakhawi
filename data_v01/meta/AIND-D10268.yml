notes:
- text: 'ابن فخيرة 家（コプト系書記、通称索引 #AIND-D12593「ابن فخيرة واشتهروا بذلك للفخر عبد الغني بن الشرف يعقوب … وله أربعة أولاد كريم الدين عبد الكريم نائب ناظر الخاص وعلم الدين يحيى أحد كتاب المماليك وشمس الدين نصر الله … وشرف الدين حمزة أحد كتاب المماليك」）。兄弟: #AIND-D04268 عبد الكريم・#AIND-D02780 حمزة・TMP-P-000898 نصر الله（本項原文に言及なし、父が AIND で共通＝note、規則23）。ラカブは本項の見出しでは「الشرف」だが、索引 D12593 は「علم الدين يحيى」、子の本伝 D09513 は「بن العلم」とする（D12593 で「شرف الدين」は兄弟 حمزة のラカブ）＝本項は原文どおり「الشرف」（規則25）。「ويعرف بابن فخيرة تصغير أبيه」＝父（のラカブ فخر）の縮小形による通称。'
  lang: ja
  type: editorial
translation:
  ja: ヤフヤー・ブン・アブド・アル＝ガニー・ブン・ヤアクーブ、アッ＝シャラフ・ブン・アル＝ファフル・ブン・アッ＝シャラフ。既出のアブー・アル＝ハイル・ムハンマドの父で、父（のラカブ）の縮小形であるイブン・フハイラとして知られる。父や息子と同じく、マムルーク（登録）の書記を務めた者の一人。
  en: Yaḥyā b. ʿAbd al-Ghanī b. Yaʿqūb, al-Sharaf b. al-Fakhr b. al-Sharaf, father of Abū al-Khayr Muḥammad, mentioned earlier, and known as Ibn Fukhayra, a diminutive of his father's (laqab). He was among those who served as secretary of the mamlūks, like his father and his son.
