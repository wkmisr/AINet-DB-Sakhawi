translation:
  ja: アリー・ブン・アフマド・ブン・スィナーン、隊長（カーイド）、アル＝ウマリー・アル＝マッキー。ウマル家の隊長たち（クウワード）の一人。（8）59年ラビーウ・アル＝アウワル月に同地（マッカ）で没した。イブン・ファハドがその没年月を記録している。
  en: ʿAlī b. Aḥmad b. Sinān, the qāʾid, al-ʿUmarī al-Makkī, one of the ʿUmarī qāʾids (commanders of Mecca). He died there (in Mecca) in Rabīʿ al-Awwal (8)59. Ibn Fahd recorded his death.
