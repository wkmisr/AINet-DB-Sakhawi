translation:
  ja: アハマド・ブン・ムーサー・ブン・イブラーヒーム、ラカブはシハーブ、クンヤはアブー・アル＝アッバース。アレッポをルーツとするカイロのハナフィー派法学者で、副官の一人。アブドゥッラヒームとアブドゥッラーの父であり、彼らについては後述する。学識ある人物と評され、多くの面識ある者たちが彼の前で（学問を）提示した。祖父の名が記されていない人々の項で再び登場する予定である。
  en: Aḥmad b. Mūsā b. Ibrāhīm, with the laqab Shihāb and kunyah Abū al-ʿAbbās, of Aleppan origin, a Cairene Ḥanafī jurist, and one of the deputies (nāʾib). He was the father of ʿAbd al-Raḥīm and ʿAbd Allāh, who will be mentioned later. He was described as learned, and a group of those whom we met presented (their learning) to him. He will appear again in the section on those whose grandfathers are not named.
