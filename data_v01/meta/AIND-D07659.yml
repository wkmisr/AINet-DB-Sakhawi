  note:
    ja: '父 عبد السلام بن أبي الفتح محمد الكازروني المدني。見出しナサブから1段ずらして復元（統一規則3）。祖父 فتح الدين أبو الفتح محمد は #AIND-D07660（التقي محمد بن عبد السلام بن محمد بن روزبة الكازروني、815年没「والد المحمدين فتح الدين وأبي حامد」）の子で、一族は「ابن تقي」を通称とする（#AIND-D01529・#AIND-D10861 参照）。corpus に父の本伝なし・ID-Master 未登録 → TMP-P-001191 を新規発行。'
