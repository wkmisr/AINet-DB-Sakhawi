    ja: 'クンヤの部 #AIND-D11049（項番413「أبو الفضل بن عبد السلام بن أبي الفتح بن تقي الكازروني المدني ممن سمع مني بها」）と同一人物（ナサブ・クンヤ・ニスバ・「سمع مني بالمدينة」が完全一致）。双方とも転送指示が無いため二重立項として両項とも実項のまま保持（2026-09-08 Waka 裁定・規則13）。D11049 側は未受領のため逆側 relation は未記入（ISSUES §Dg-1）。'
