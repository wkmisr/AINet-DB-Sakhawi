  ja: ムハンマド・ブン・アブドゥッサラーム・ブン・アビー・アル＝ファトフ・ムハンマド、アブー・アル＝ファドル、アル＝カーザルーニー・アル＝マダニー。イブン・タキーとして知られる。マディーナで私（サハーウィー）から聴聞した者の一人でもある。
  en: Muḥammad b. ʿAbd al-Salām b. Abī al-Fatḥ Muḥammad, Abū al-Faḍl, al-Kāzarūnī al-Madanī, known as Ibn Taqī. He too was among those who heard from me (al-Sakhāwī) in Medina.
