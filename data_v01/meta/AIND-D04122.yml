translation:
  ja: アブドゥルカーディル・ブン・シャーヒーン・アル＝ジャマーリー・アッ＝ザハビー。アッ＝シャムス・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・アフマド・アル＝ビーリー（後述）の外孫であり、その（祖父の）弟（アル＝ジャマール・ユースフ）に因んでジャマーリーと名乗った。彼は善き人で、義人たちへの訪問や、善行の集まりへの出席を好んだ。生計を立て、足ることを知り、自発的に（謝礼を求めず）朗読を行い、また諸廟堂（マシュハド）でも朗読した。彼は私のハディース口述筆記（アマーリー）やその他の集まりに最も頻繁に出席した者の一人である。自身の死を示す夢を見た後、ハジュラ暦880年代に亡くなった。彼に神の慈悲がありますように。
  en: ʿAbd al-Qādir b. Shāhīn al-Jamālī al-Dhahabī, the maternal grandson of al-Shams Muḥammad b. Aḥmad b. Muḥammad b. Aḥmad al-Bīrī (who is mentioned below). He took the nisba al-Jamālī after his (grandfather's) brother, al-Jamāl Yūsuf. He was a virtuous man, eager to visit the righteous and attend gatherings of goodness, while earning his livelihood and being content. He recited voluntarily and chanted at the shrines (mashhads). He was among those who most frequently attended my dictation gatherings (al-Amālī) and others. He died in the Hijri 880s (year eighty-something) after seeing a dream that indicated his approaching death. May Allah have mercy on him.
