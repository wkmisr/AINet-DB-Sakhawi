translation:
  ja: ダッラージュ・ブン・ムアッザー・アル＝ハサニー、ヤンブーの首長。ヒジャーズの支配者が彼に事務を委ねた際、その代理として、前述のサブウの跡を継いで887年の後半にヤンブーの首長に就任した。私はその時、898年に現地で彼に会った。
  en: Darrāj b. Muʿzā al-Ḥasanī, the emir of Yanbuʿ. He was established in this position in the late year 887 H as a deputy of the ruler of Hejaz, who delegated his affairs to him, succeeding the aforementioned Sabaʿ. I saw him then in the year 898 H.
