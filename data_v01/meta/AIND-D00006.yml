translation:
  ja: イブラーヒーム・ブン・イブラーヒーム・ブン・ムハンマド・ブン・アフマド・アル＝バスリー、メッカ定住者。後述する父と兄弟のムハンマドとイスマーイール。イブン・ザクザクとして知られ、メッカに住んだ人々のうちの一人である。私は893年にメッカで彼を見た。彼は数年間マディーナにも滞在した。彼の父と兄のムハンマドはバスラ出身のウラマーであったが、彼（イブラーヒーム自身）は聖者の一人であった。898年のラマダーンに亡くなった。
  en: Ibrāhīm b. Ibrāhīm b. Muḥammad b. Aḥmad al-Baṣrī, a resident of Mecca. His father and his two brothers, Muḥammad and Ismāʿīl, will be mentioned later. Known as Ibn Zaqzaq, he was among those who settled in Mecca, and I saw him there in the year 893 H. He also resided in Medina for several years. His father and his brother Muḥammad were scholars from Basra, but he (Ibrāhīm himself) was one of the righteous. He died in Ramadan of the year 898 H.
