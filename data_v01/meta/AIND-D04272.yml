translation:
  ja: アブド・アル＝カリーム・ブン・アリー・ブン・アブド・アル＝カリーム・ブン・アフマド・ブン・アティーヤ・ブン・ザヒーラ、アブー・ムハンマド・アル＝クラシー・アル＝マッキー。788年およびそれ以後に、アン＝ナシャーワリー、イブン・ハルドゥーン、アッ＝タヌーヒー、イブン・スィッディークほか一群の人々が彼にイジャーザを与えた。インドの地に入ってしばらく不在にしたのちマッカに戻った。ハディースを伝えることはなかったようで、840年シャウワール月に同地で没した。イブン・ファフドが『アッ＝ザヒーリーイーン』でそう述べている。
  en: ʿAbd al-Karīm b. ʿAlī b. ʿAbd al-Karīm b. Aḥmad b. ʿAṭiyya b. Ẓahīra, Abū Muḥammad al-Qurashī al-Makkī. In the year 788 and thereafter, al-Nashāwarī, Ibn Khaldūn, al-Tanūkhī, Ibn Ṣiddīq and others granted him ijāza. He entered India and was absent for a time, then came (back) to Mecca; it does not seem that he transmitted hadith. He died there in Shawwāl of the year [8]40. Ibn Fahd said so in al-Ẓahīriyyīn.
