translation:
  ja: ムハンマド・ブン・アティーヤ。ジャーニム・アル＝アシュラフィーのもとでバルッダール（門衛・取次役）として、ハラブで、次いでシャーム（ダマスクス）で仕え、彼（ジャーニム）の後にはやはりそこでタナム・アル＝ムアイヤディーのもとに落ち着いた。素行が悪くなり、彼（タナム）の後に捕らえられ、不信仰にあたる事柄で告発され、証人尋問のために連れ出されたところ、民衆が襲いかかって彼を護送人の手から引きずり出し、その一人が刃物で刺して殺し、ついで（遺体は）焼かれた。それは868年ジュマーダー・アル＝アーヒラ月のことで、誰にも惜しまれなかった。彼は時代の悪徳、時世の醜行の一つであった。
  en: Muḥammad b. ʿAṭiyya. He served as barddār (doorkeeper-usher) under Jānim al-Ashrafī in Aleppo and then in Syria (Damascus), and after him he likewise settled there under Tanam al-Muʾayyadī. His conduct deteriorated; after the latter's death he was arrested and charged with something entailing unbelief. When he was brought out so that evidence could be given, the mob attacked him, dragged him away from his escorts, one of them stabbed him with a knife and killed him, and he was then burned. That was in Jumādā II of the year 868, unlamented, for he was one of the evils of the age and the abominations of the time.
