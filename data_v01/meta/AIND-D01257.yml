translation:
  ja: アハマド・ブン・ムハンマド・ブン・アハマド、ラカブはアッ＝シハーブ、ニスバはアッ＝ザハビー。父はアッ＝サーリヒーで、バヌー・アル＝アルマウィーの末裔である。イブン・アル＝ザハビーとして知られる。およそヒジュラ暦777年に生まれ、アブー・アル＝ハウール・アル＝ジャザリーから（一部欠落を伴って＝بفوت）聴聞し、それを伝えた。イブン・ファハドといった優れた人々が彼からそれを聴聞した。彼はシャームに入る前に亡くなった。
  en: Aḥmad b. Muḥammad b. Aḥmad, al-Shihāb al-Dhahabī. His father was al-Ṣāliḥī, from the progeny of Banū al-Armawī, and he (the subject) was known as Ibn al-Dhahabī. He was born approximately in 777 H. He heard from Abū al-Hawl al-Jazarī (with some lacunae, bi-fawt) and transmitted from him. Distinguished scholars like Ibn Fahd heard from him. He died before entering al-Shām.
