translation:
  ja: ハズマーン・アル＝ヤシュバキー。（主人は）ヤシュバク・アッ＝シャアバーニー。主人の（死んだ）後に昇進を重ね、アル＝ムアイヤドの治世末期、あるいはその子の治世にアミールとなった。しかしその日々は長く続かず、824年に没し、砂漠（カイロ北郊の墓地）にある主人の廟に埋葬された。
  en: Ḥazmān al-Yashbakī, [mamluk of] Yashbak al-Shaʿbānī. After his master['s death] he rose until he was made an amir late in the reign of al-Muʾayyad or in the reign of his son. His days were not long; he died in 824 H and was buried in his master's turba in the desert [cemetery].
