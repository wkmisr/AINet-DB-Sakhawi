translation:
  ja: ムハンマド・ブン・ジャアファル・ブン・アリー・アル＝バアリー・アル＝ユーニーニー、イブン・アッ＝シュワイフとして知られる。ビシュルとウマルのイブラーヒーム・アル＝バアリーの二子、およびアブー・アッ＝ターヒル・ムハンマド・ブン・アブド・アル＝ガニー・アッ＝ドゥライビーから聴聞した。ハディースを伝え、イブン・ムーサーや我らの師アル＝ウッビーら俊秀が彼から聴聞した。二人の聴聞は815年のことであった。我らの師は『ムウジャム』で「彼は私の娘ラービアのための要請書（イスティドアー）においてイジャーザを与えた」と述べている。彼はバアルバクのアブドゥッラー・アル＝ユーニーニーのザーウィヤのシャイフであった。
  en: 'Muḥammad b. Jaʿfar b. ʿAlī al-Baʿlī al-Yūnīnī, known as Ibn al-Shuwaykh. He heard from Bishr and ʿUmar, the two sons of Ibrāhīm al-Baʿlī, and from Abū al-Ṭāhir Muḥammad b. ʿAbd al-Ghanī al-Duraybī. He transmitted, and eminent scholars such as Ibn Mūsā and our shaykh al-Ubbī heard from him; their hearing was in the year 815. Our shaykh said in his Muʿjam: "He granted an ijāza in the request (istidʿāʾ) for my daughter Rābiʿa." He was the shaykh of the zāwiya of ʿAbd Allāh al-Yūnīnī in Baalbek.'
