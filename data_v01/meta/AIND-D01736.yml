translation:
  ja: アフマド・アッ=シハーブ・アル=キーラーニー・アル=アスル・アル=マッキー、イブン・ハワージャーの名で知られる。ヒジュラ暦892年ズー・アル=ヒッジャ月最終日（日曜日の夜）にメッカで死去し、翌日彼のために葬儀の礼拝が行われた。カーディーやその他の者に遺贈した。彼はアブー・アル=カースィム・ブン・ムヒッブ・アッ=ディーンの同母（母方）の兄弟であり、父の名はアブー・バクル・ブン・アリーである。
  en: Aḥmad al-Shihāb al-Kīlānī al-Aṣl al-Makkī, renowned as Ibn Khawājā. He died in Mecca on Sunday night, the last day of Dhū al-Ḥijja in 892 H. Funeral prayers were held for him the next day. He bequeathed to the qāḍī and others. He was the maternal half-brother of Abū al-Qāsim b. Muḥibb al-Dīn, and his father's name was Abū Bakr b. ʿAlī.
