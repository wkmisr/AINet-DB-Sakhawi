translation:
  ja: アブドゥルアズィーズ・ブン・アビー・アル＝バラカート・ムハンマド・ブン・アリー・ブン・アフマド・ブン・アブドゥルアズィーズ・アル＝ハーシミー・アン＝ヌワイリー・アル＝マッキー。ヒジュラ暦831年にメッカで生まれた。母はウンム・アル＝ハイル・ビント・アリー・イブン・アブドゥッラティーフ・ブン・サーリム。成長してザイナブ・ビント・アッ＝シャーフィイーから聴聞し、836年とそれ以降に一団の人々が彼にイジャーザを与えた。
  en: ʿAbd al-ʿAzīz b. Abī al-Barakāt Muḥammad b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz al-Hāshimī al-Nuwayrī al-Makkī. He was born in Mecca in the year 831 AH; his mother was Umm al-Khayr bint ʿAlī b. ʿAbd al-Laṭīf b. Sālim. He grew up and heard from Zaynab bint al-Shāfiʿī, and in 836 AH and thereafter a number of scholars granted him ijāza.
