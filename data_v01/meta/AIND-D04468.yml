  en: ʿAbd Allāh b. ʿAbd al-Raḥmān, al-ʿAfīf Abū Muḥammad al-Ḥaḍramī al-Tarīmī al-Yamānī al-Shāfiʿī, known, like his forebears, as Afḍal. He is among those who heard from me in Mecca.
