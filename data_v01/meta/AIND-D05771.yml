translation:
  ja: アンマール・ブン・アブド・アッ＝ラヒーム・ブン・ハサン・アル＝ギルヤーニー——タファフナー近郊のバヌー・ギルヤーンに因むニスバで、点付きのガイン（カスラ）、次に点なしのラー（スクーン）、その後に下に二点のヤー、次にヌーン——、のちにアル＝カーヒリー、アッ＝シャーフィイー。サルガトミシーヤの向かいにあるサリーバの公証人（ウドゥール）の古参の一人で、むしろ同マドラサの学生の一人である。『アルフィーヤ・アル＝イラーキー』の作者自身による注釈を、自ら書写したうえで私から受けた。
  en: ʿAmmār b. ʿAbd al-Raḥīm b. Ḥasan al-Ghiryānī — a nisba to Banū Ghiryān, near Tafahnā, spelt with a dotted ghayn with kasra, then an undotted rāʾ with sukūn, then a yāʾ with two dots below, then nūn — then al-Qāhirī al-Shāfiʿī. One of the senior notaries (ʿudūl) of al-Ṣalība, opposite the Ṣarghatmishiyya; indeed he was one of its students. He received from me the commentary on the Alfiyya of al-ʿIrāqī by its author, after having copied it out himself.
