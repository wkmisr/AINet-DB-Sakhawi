- text: 通称「الحاجبي」について原文は「كأنه لمعرفته ابن الحاجب أو حفظه له أو نحو ذلك」（イブン・アル＝ハージブ（の著作）に通じていたか、それを暗記していたか、その類いのためらしい）とサハーウィー自身の推測を記す＝著作・人物の relation にはしない。「لا يأنف من الحضور عند بعض طلبته」は人物描写＝訳のみ。
  lang: ja
  type: editorial
translation:
  ja: ムーサー・アル＝マグリビー・アル＝マーリキー、マッカの寄留者。「アル＝ハージビー」の名で知られるが、それはイブン・アル＝ハージブ（の著作）に通じていたためか、それを暗記していたためか、あるいはその類いのことによるらしい。マッカに住み、そこで教授した。学識ある善良な法学者で、自分の学生の誰かのもとに出席することを厭わなかった。（8）88年サファル月朔日、火曜日の前夜（月曜の夜）にマッカで没した。推測では60歳を超えていた。
  en: Mūsā al-Maghribī al-Mālikī, a resident (nazīl) of Mecca, known as al-Ḥājibī, apparently because of his knowledge of Ibn al-Ḥājib, or his having memorized him, or something of the kind. He stayed in Mecca and taught there. He was a learned and good jurist who did not disdain to attend the sessions of some of his own students. He died in Mecca on the eve of Tuesday, the first of Ṣafar, of the year [8]88, having passed sixty, by conjecture.
