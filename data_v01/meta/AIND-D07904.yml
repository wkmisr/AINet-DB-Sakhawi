notes:
- text: '「وهو من بيت فضل وعلم ورياسة」＝الأخنائي 家（アレクサンドリア近郊 أخنا 出身のカーディー一族、ニスバ索引 #AIND-D11417「البهاء محمد بن العلم محمد بن أحمد بن محمد بن أبي بكر بن عيسى …」）。本項主のナサブ（… بن العلم أحمد بن أبي بكر）は索引側の「أحمد بن محمد بن أبي بكر」と1段ずれる可能性があるが、原文どおり符号化（規則25）。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・アブドゥルワーヒド・ブン・アル＝イマード・ムハンマド・ブン・アル＝アラム・アフマド・ブン・アビー・バクル、タキー・アッ＝ディーン・イブン・ザキー・アッ＝ディーン・アル＝イフナーイー・アル＝カーヒリー・アル＝マーリキー、法官代理（ナーイブ・アル＝フクム）。優れたカーディーの一人であった。830年ズー・アル＝ヒッジャ月6日にマッカで没した。彼はそこに滞在（ジャーワラ）していたのであり、享年63であった。彼は徳・学問・名望の家の出である。我らがシャイフ（イブン・ハジャル）は『インバー』で彼に簡潔に言及している。
  en: Muḥammad b. ʿAbd al-Wāḥid b. al-ʿImād Muḥammad b. al-ʿAlam Aḥmad b. Abī Bakr, Taqī al-Dīn Ibn Zakī al-Dīn al-Ikhnāʾī al-Qāhirī al-Mālikī, deputy judge. He was among the best of judges. He died on 6 Dhū al-Ḥijja of the year 830 in Mecca, where he had been residing (jāwara), aged sixty-three. He was from a house of virtue, learning and leadership. Our shaykh (Ibn Ḥajar) mentioned him briefly in his Inbāʾ.
