translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・アフマド・ブン・アブドゥルカーディル・ブン・ヤアクーブ・ブン・ムハンマド・アッ＝ダイルーティー。イブン・アッ＝ラッザーズ、あるいはイブン・アル＝バイヤアとして知られる。同郷のハサンに、次いでジャアファル・アッ＝サンフーリーに七大（クルアーン）朗誦法を学んだ（朗誦した）。
  en: ʿAbd al-Raḥmān b. Muḥammad b. Aḥmad b. ʿAbd al-Qādir b. Yaʿqūb b. Muḥammad al-Dayrūṭī, known as Ibn al-Razzāz and Ibn al-Bayyāʿ. He recited the seven Qurʾanic recitations (al-Qirāʾāt al-Sabʿ) to his fellow countryman Ḥasan, and then to Jaʿfar al-Sanhūrī.
