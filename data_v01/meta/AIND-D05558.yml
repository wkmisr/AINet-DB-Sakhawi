translation:
  ja: アリー・ブン・ムハンマド・ブン・ムハンマド・ブン・アビー・アル＝ハイル・ムハンマド・ブン・ファフド、アサド・アッ＝ディーン・アブー・アル＝ハサン・ブン・アッ＝タキー・アル＝ハーシミー・アル＝マッキー。アン＝ナジュム・ウマルおよびその兄弟たちの同母兄弟。840年サファル月にマッカで生まれ、同年ズー・アル＝ヒッジャ月に同地で没した。彼の兄（アン＝ナジュム・ウマル）が彼に言及している。
  en: ʿAlī b. Muḥammad b. Muḥammad b. Abī al-Khayr Muḥammad b. Fahd, Asad al-Dīn Abū al-Ḥasan b. al-Taqī al-Hāshimī al-Makkī, full brother of al-Najm ʿUmar and his brothers. He was born in Ṣafar 840 in Mecca and died there in Dhū al-Ḥijja of the same year. His brother mentioned him.
