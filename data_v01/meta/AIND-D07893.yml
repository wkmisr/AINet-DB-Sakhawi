translation:
  ja: ムハンマド・ブン・アブドゥルマリク・ブン・アブドゥルカリーム・ブン・ヤフヤー、ナースィル・アッ＝ディーン・ブン・アル＝ムヒウィー・イブン・アッ＝タキー・ブン・ムヒー・アッ＝ディーン・ブン・アッ＝ザキー。兄弟の中の最年長。我らがシャイフ（イブン・ハジャル）は『インバー』で彼に言及し、次のように述べた。「750年以後に生まれ、アル＝アルディーやイブン・アル＝ジャウヒーなど、アル＝ファフル（・イブン・アル＝ブハーリー）の弟子たちから聴聞した。信仰心と理性に立ち返る人物であった。アル＝アラー・ブン・アビー・アル＝バカーと共に一部の収穫物を分配するために出かけたところ、彼らは路上で襲われ、この者（本項主）は殺され、もう一人（アル＝アラー）は負傷して倒れた。賊は彼が死んだと思ったが、彼は無事であった。これは（80）6年ムハッラム月のことである。」
  en: 'Muḥammad b. ʿAbd al-Malik b. ʿAbd al-Karīm b. Yaḥyā, Nāṣir al-Dīn b. al-Muḥyawī Ibn al-Taqī b. Muḥyī al-Dīn b. al-Zakī. The eldest of his brothers. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ, saying: "He was born after (7)50 and heard from al-ʿArḍī, Ibn al-Jawkhī, and others among the companions of al-Fakhr (Ibn al-Bukhārī). He was a man of religion and good sense. He went out with al-ʿAlāʾ b. Abī al-Baqāʾ to divide some crop yields, and they were set upon by highwaymen; this one (the subject) was killed, while the other was wounded and fell, so they thought him dead, but he survived. That was in Muḥarram of the year (80)6."'
