  en: ʿAlī b. Aḥmad b. ʿAlī Nūr al-Dīn al-Fāriqī al-Shādhilī. He heard (parts) of Ibn Māja under al-Abnāsī, al-Ghumārī and al-Jawharī, and some of our companions met him.
