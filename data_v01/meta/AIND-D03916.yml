translation:
  ja: アブド・アッ＝ラッザーク・アッ＝シルワーニー。ハラブ（アレッポ）のラワーヒーヤ学院に寄寓し、同地に約20年住んで、ハラブの優れたシャーフィイー派学者の一人となった。アル＝アラー・アル＝ブハーリーから学んだ者であり、理性諸学（アクリーヤート）に秀で、俊才たちが彼から益を得た。そのうちにハナフィー派のアッ＝シャムス・イブン・アミール・ハーッジュがおり、彼から文法学・形態論・意味論・明解論・論理学を学んだ。また、バーブ・キンナスリーンのマドラサを建てたアブド・アル＝カリームの娘を娶り、没するまで（同地に）とどまった。
  en: ʿAbd al-Razzāq al-Shirwānī. A resident of the Rawāḥiyya Madrasa in Aleppo, where he lived for about twenty years, becoming one of its prominent Shafi'i scholars. He studied under al-ʿAlāʾ al-Bukhārī and excelled in the rational sciences. Many scholars benefited from him, among whom was the Hanafi scholar al-Shams ibn Amīr Ḥājj, who studied grammar, morphology, semantics, rhetoric, and logic under him. He married the daughter of ʿAbd al-Karīm, the founder of the madrasa at the Qinnasrin Gate, and remained there until his death.
