translation:
  ja: アリー・ブン・クバイシュ・ブン・アジュラーン・アル＝ハサニー。マッカの代官（ナーイブ）で、同地で威信と権勢を有した者の一人。838年ズー・アル＝ヒッジャ月に没した。イブン・ファハドがその没年を記録した。
  en: ʿAlī b. Kubaysh b. ʿAjlān al-Ḥasanī, deputy (nāʾib) of Mecca and one of those who held respect and power there. He died in Dhū al-Ḥijja of the year 838. Ibn Fahd recorded his death date.
