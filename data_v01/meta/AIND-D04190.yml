translation:
  ja: アブドゥルカーディル・ブン・ムハンマド・ブン・アリー・ブン・アブドゥッラー・ブン・アフマド・ムヒュッディーン・アッ＝シャールムサーヒー・アッ＝ディムヤートィー・アッ＝シャーフィイー・アッ＝アターイー。彼の父については後述される。理解力のある聡明な若者である。彼は私（＝サハーウィー）のもとで『ヌフバ（・アル＝フィクル）の注釈（ヌズハト・アン＝ナザル）』を学問的に（暗誦ではなく）朗読し、また私からいくつかの（ハディースの）講義を聴聞した。彼はきわめて善良かつ誠実に他の多くの師のもとでも研鑽を積んだ。私は彼に（伝承の）イジャーザ（授権）を与えた。
  en: ʿAbd al-Qādir b. Muḥammad b. ʿAlī b. ʿAbd Allāh b. Aḥmad Muḥyī al-Dīn al-Shārmsāḥī al-Dimyāṭī al-Shafiʿī al-ʿAṭāʾī. His father is mentioned below. A young man of understanding, he read to me the commentary on al-Nukhba (Nuzhat al-Naẓar) with comprehension, heard several things from me, and studied under more than one scholar with goodness and uprightness. I have granted him an ijāza.
