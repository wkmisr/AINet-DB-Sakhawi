  note:
    ja: 規則37。父＝#AIND-D08062「محمد بن علي بن حسين بن محمد بن شرشيق الشمس بن النور بن العز بن الشمس الأكحل الحسني القادري واالد الشرف موسى الآتي . مات في رابع صفر سنة أربعين بالطاعون ودفن بزاوية عدي بن مسافر」（相手側が「والد الشرف موسى الآتي」と名指し）。初版の TMP-P-000529（汎用 محمد、関係専用の汚染番号）を除去。
