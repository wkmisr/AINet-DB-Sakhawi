  note:
    ja: '「والد المحمدين زين العابدين وشمس الدين」。شمس الدين محمد＝#AIND-D09473「207 محمد الشمس القادري أخو الذين قبله ووالد عبد العزيز الماضي ، استقر بعده في المشيخة شركة لابن عمهما بعناية صهره تغرى بردى الأستادار … مات في أواخر المحرم سنة ثمان وثمانين」（兄 زين العابدين محمد＝#AIND-D09472 の直後の項）。閉合: ラカブ الشمس・家 القادري・兄 D09472（「أخو الذين قبله」）、子 عبد العزيز＝#AIND-D04013「عبد العزيز بن محمد بن موسى بن محمد بن علي الشريف القادري الآتي أبوه … أخو زوج تغري بردى الاستادار」、娘 #AIND-D12958「حفصة ابنة السيد شمس الدين محمد بن موسى بن محمد بن علي القادري أخت عبد العزيز الماضي」、索引 #AIND-D11908「وابناه زين العابدين محمد وشمس الدين محمد … ولهما شقيقة تغرى بردى الأستادار」（規則57 の3点以上）。【集約 2026-11-05】校閲の新規 取り下げた仮番号 B158-P04 は本伝見落とし（見出しが「محمد الشمس القادري」の短い形で、ナサブ検索に当たらない型）＝取り下げ（内容B H、オーケストレーター決定1）。初版の TMP-P-000520（別人の関係専用番号）は校閲で除去済み。'
