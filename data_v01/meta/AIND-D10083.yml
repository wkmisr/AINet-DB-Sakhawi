translation:
  ja: ムーサー・ブン・ムハンマド・ブン・アリー・ブン・フサイン・ブン・ムハンマド・アル＝アクハル・ブン・シャルシーク、アッ＝シャラフ・ブン・アッ＝シャムス・ブン・アン＝ヌール・ブン・アル＝イッズ、アル＝ハサニー、アル＝カーディリー。二人のムハンマド、ザイン・アル＝アービディーンとシャムス・アッ＝ディーンの父であり、前述のハサンの兄弟で、二人の父も前述した。（8）41年にペストで、父の死の直後に没し、バーブ・アル＝カラーファ近くのアディー・ブン・ムサーフィルのザーウィヤに埋葬された。神が彼を憐れみたまえ。
  en: Mūsā b. Muḥammad b. ʿAlī b. Ḥusayn b. Muḥammad al-Akḥal b. Sharshīq, al-Sharaf b. al-Shams b. al-Nūr b. al-ʿIzz al-Ḥasanī al-Qādirī, father of the two Muḥammads, Zayn al-ʿĀbidīn and Shams al-Dīn, and brother of the aforementioned Ḥasan; their father has also been mentioned. He died of the plague in the year (8)41, very shortly after his father, and was buried in the zāwiya of ʿAdī b. Musāfir near Bāb al-Qarāfa. May God have mercy on him.
