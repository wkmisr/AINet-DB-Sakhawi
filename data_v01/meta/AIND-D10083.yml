    ja: '「والد المحمدين زين العابدين وشمس الدين」。زين العابدين محمد＝#AIND-D09472「محمد بن موسى بن محمد بن علي بن حسين زين العابدين بن الشرف بن الشمس الحسني القرافي الحنبلي القادري شيخ الطائفة القادرية والآتي أبوه」（885没）。ナサブ5代＋ラカブで閉合。ニスバ索引 #AIND-D11908「الشرف موسى بن محمد بن علي بن حسين بن محمد الأكحل بن شرشيق وابناه زين العابدين محمد وشمس الدين محمد」も両子を列挙。初版は #NEEDID。'
