  note:
    ja: '「وأخو حسن الماضيين」。兄弟 حسن بن محمد بن علي بن حسين … الحسني القادري の本伝は corpus に見当たらない（hw.py「حسن بن محمد بن علي بن حسين」「حسن」＋「شرشيق」「القادري」: 該当なし。#AIND-D02627「حسن بن محمد بن عبد القادر بن علي بن محمد بن شرشيق」は祖父が عبد القادر で別系＝別人）。父 D08062 のナサブから復元できる識別要素があるため新規 TMP-P-001696（規則12）。初版の TMP-P-000204（登録＝別人の حسن、関係専用）を除去。【集約 2026-11-05】#AIND-D02627「حسن بن محمد بن عبد القادر بن علي بن محمد بن شرشيق البدر … ابن شمس الدين … كان أسن الجماعة المقيمين بزاوية عدي بن مسافر … ومات في جمادى الآخرة سنة سبع وستين」はシャルシーク家で既出の唯一の حسن で、父名 محمد（ラカブ شمس الدين）と زاوية عدي بن مسافر が一致するが、ナサブ中間（عبد القادر بن علي ⇄ علي بن حسين）が食い違い、索引 D11908 も別の系として列挙する＝候補（別系の可能性）に留め、同定しない（規則57。上の「別系＝別人」は断定しすぎ、内容B L・決定11）。'
