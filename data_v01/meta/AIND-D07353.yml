translation:
  ja: ムハンマド・ブン・ハサン・ブン・アブド・アルワッハーブ、ナースィル・アッディーン、アッ＝タラーブルスィー、のちにアル＝カーヒリー、シャーフィイー派。彼自身の筆跡によれば、ヒジュラ暦764年に生まれた。彼は、トリポリでアッ＝シハーブ・アフマド・ブン・アル＝ハッバールとイブン・アル＝バドルから聴聞したと述べた。カイロに来てアル＝イッズ・ブン・ジャマーアから学び、その諸学の講義に密着し、その後（イッズの没後）その弟子アル＝ジャマール・アル＝アムシャーティーに師事した。イブン・アル＝アスユーティーが870年頃に彼に会い、彼は（学識を）よく記憶していたと述べた。
  en: Muḥammad b. Ḥasan b. ʿAbd al-Wahhāb, Nāṣir al-Dīn, al-Ṭarābulusī, then al-Qāhirī, the Shāfiʿī. He was born, according to his own handwriting, in the year 764 AH. He stated that he heard [hadith] in Tripoli from al-Shihāb Aḥmad b. al-Ḥabbāl and Ibn al-Badr. He came to Cairo and studied under al-ʿIzz b. Jamāʿa, attending his lectures in his various disciplines assiduously, and after him he attached himself to his pupil al-Jamāl al-Amshāṭī. Ibn al-Asyūṭī met him around the year 870 AH and said that he had a ready memory.
