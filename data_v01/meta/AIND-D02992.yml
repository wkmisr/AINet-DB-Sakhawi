translation:
  ja: ラジャブ・ブン・アフマド・ブン・アリー・ブン・ウマル。アブー・アルバラカート・アッ＝ザイン・アッ＝サンフーリー・アル＝マーリキー、またイブン・アル＝ウサイリー（イブン・アル＝アシーリー）として知られる。同郷のジャアファル（アッ＝ザイン・ジャアファル・アッ＝サンフーリー）からクルアーンの諸伝誦（キラーアート）を修得した者の一人である。
  en: Rajab b. Aḥmad b. ʿAlī b. ʿUmar, Zayn Abū al-Barakāt al-Sanhūrī al-Mālikī, known as Ibn al-ʿAsīlī. He was among those who studied the variant Quranic recitations (qirāʾāt) under his fellow countryman Jaʿfar (al-Zayn Jaʿfar al-Sanhūrī).
