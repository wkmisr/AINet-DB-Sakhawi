translation:
  ja: アブドの息子、シャハーブ・アブド・アッラーフ・アフマド・ブン・アービド・アッ＝シャハーブ・アル＝クドゥシー・アッ＝シャーフィイーについて。彼はおそらく祖父に帰属する。アブー・アル＝アッバース・アル＝クドゥシー・アル＝ワーイズが私に語ったところによると、彼は法学などで彼（アフマド）に師事したという。
  en: Ahmad b. ʿĀbid, al-Shihāb al-Qudsī al-Shāfiʿī. I believe he is attributed to his grandfather. Abū al-ʿAbbās al-Qudsī al-Wāʿiẓ informed me that he (Abū al-ʿAbbās) accompanied him (Ahmad) in fiqh and other matters.
