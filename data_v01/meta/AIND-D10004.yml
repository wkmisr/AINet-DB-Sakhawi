translation:
  ja: マムジク（二つのミームのうち最初がファトハ、次いでカスラのジーム）、アッ＝ザーヒリー・バルクーク。彼（バルクーク）の年少のマムルークの一人。アル＝アシュラフ・バルスバーイの時代に十人長（アミール・アシャラ）となり、おそらく833年に没するまでその地位にあった。その信仰には問題がなかった。
  en: Mamjiq (with two mīms, the first with fatḥa, then a jīm with kasra), al-Ẓāhirī Barqūq, one of the junior mamluks of al-Ẓāhir Barqūq. He became an amīr of ten in the days of al-Ashraf Barsbāy, and remained so until he died, presumably in the year 833. There was nothing wrong with his religion.
