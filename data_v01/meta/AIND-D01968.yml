translation:
  ja: 940年生まれ。イスマーイール・ブン・イムラーン・ブン・アリー・アッ＝サッハーフィー、後にカイロのアズハル学院に属するシャーフィイー派法学者で、後述するムーサーの兄弟。クルアーンを朗誦し、私（＝サハーウィー）の許で『ハディース千句の書』の講義のために（アル＝カーヤーティーの孫らとともに）幾度か通って学んだ。子供たちを教え、また書写を行うことで生計を立て、時には革新的なマドラサ教師たちの許で働いた。彼はその兄弟よりも優れていた。
  en: Born in 940 AH. Ismāʿīl b. ʿImrān b. ʿAlī al-Ṣaḥḥāfī, then al-Qāhirī al-Azharī al-Shāfiʿī, brother of Mūsā (mentioned later). He recited the Qurʾān, engaged in study, and frequented me (al-Sakhāwī) a little for the explanation of *Alfiyyat al-Ḥadīth* with al-Qāyātī’s grandson and others. He earned a living by teaching children and by copying manuscripts, and sometimes worked for innovative teachers/professors. He was better than his brother.
