translation:
  ja: アブドゥルカーディル・ブン・アリー・ブン・アブドゥッラフマーン・アル＝ムヌーフィー。ムヌーフ（ミヌーフ）における子供たちの教師であり、彼の父は仕立屋であった。彼はヒジュラ暦892年ジュマーダー・アル＝アーヒラ（第2ジュマーダー月）にムヌーフで私（サハーウィー）に面会し、『ウムダ・アル＝アフカーム』の第1章を優れた朗読で私に読み聞かせたので、彼にイジャーザ（伝承許可）を書いて与えた。彼の善行を称賛する者を目にした。
  en: ʿAbd al-Qādir b. ʿAlī b. ʿAbd al-Raḥmān al-Munūfī. A teacher of children there (in Minūf), whose father was a tailor. He met me (al-Sakhāwī) in Minūf in Jumādā al-Thāniya, year 892, and read to me the first chapter of 『ʿUmdat al-Aḥkām』 with an excellent recitation, for which I wrote him an ijāza. I have seen those who praise his goodness.
