translation:
  ja: アブドゥルアズィーム・ブン・サダカ、アッ＝タージュ・アル＝キブティー・アル＝アスラミー。書記の一人に数えられ、ディーワーン・アル＝ムフラドの監督職に就いた。彼と、後にあの地位に至ったアッ＝ザイン・ヤフヤーとは互いに訴え争い、たいてい本項の人物が勝っていたが、ついに後者がウスターダール職に就いたキズトゥガーンに身を寄せ、ムフラドの監督職に落ち着いた。その時から本項の人物は後退し、信仰の光から遠かったために彼の汚れと不正は増した。キズ（トゥガーン）に、次いで844年に金銭と引き換えにイブン・カーティブ・アル＝マナーハートに引き渡され、没するまで不遇のままであった。
  en: ʿAbd al-ʿAẓīm b. Ṣadaqa, al-Tāj al-Qibṭī al-Aslamī. He was counted among the scribes and held the controllership of the Dīwān al-Mufrad. He and al-Zayn Yaḥyā—who later rose to what he rose to—used to litigate and quarrel with each other, and he generally prevailed, until the latter attached himself to Qizṭughān when he became ustādār and secured the controllership of the Mufrad. From then on he fell back, and his foulness and injustice increased owing to his distance from the light of faith. He was handed over to Qiz[ṭughān], then in 844 AH to Ibn Kātib al-Manākhāt for a sum of money, and remained in obscurity until he died.
