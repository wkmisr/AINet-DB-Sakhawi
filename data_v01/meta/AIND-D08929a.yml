translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アブド・アル＝カーディル、ナースィル・ッディーン・アブー・アブドゥッラー・イブン・ナースィル・ッディーン・イブン・アル＝アラー、マクリーズ出身のカイロの人、シャーフィイー派、前出のタキー〔・ッディーン〕・アフマド・アル＝マクリーズィーの甥。801年シャウワール月にカイロで生まれ、そこで育ってクルアーン、『ウムダ』、『タブリーズィー』を暗記し、後二者をイッズ・イブン・ジャマーア、シハーブ・アル＝アウハディー、ザイン・アル＝クムニーら一団に提示して彼らからイジャーザを得、またビージューリーとビラーリーほかイジャーザを与えなかった者たちにも提示した。『ウムダ』の提示は810年であり、したがってその生年には疑義がある。ハディースを伝え、一部の学生が彼から聴聞し、我々にイジャーザを与えた。サイード・アッ＝スアダーのスーフィーの一人で、その言には誇張があった。867年ムハッラム月6日金曜に没した。神が彼を赦したまえ。
  en: Muḥammad b. Muḥammad b. ʿAlī b. ʿAbd al-Qādir, Nāṣir al-Dīn Abū ʿAbd Allāh b. Nāṣir al-Dīn Ibn al-ʿAlāʾ, of Maqrīz origin, Cairene, Shāfiʿī, nephew of al-Taqī Aḥmad al-Maqrīzī. Born in Shawwāl 801 in Cairo, he memorised the Qurʾān, the ʿUmda and al-Tabrīzī, presenting the latter two to a group including al-ʿIzz Ibn Jamāʿa, al-Shihāb al-Awḥadī and al-Zayn al-Qumnī, who gave him ijāza, and to al-Bījūrī, al-Balālī and others who did not. His presentation of the ʿUmda was in 810, which casts doubt on his birth date. He transmitted; some students heard from him, and he gave us ijāza. He was one of the Sufis of Saʿīd al-Suʿadāʾ, and there was exaggeration in his talk. He died on Friday 6 Muḥarram 867.
