translation:
  ja: ムハンマド・ブン・アブドゥルバーリー、タキー・アッ＝ディーン・アル＝ミスリー・アッ＝シャーフィイー、盲人（アッ＝ダリール）。アッ＝シラージュ・アル＝ブルキーニーに学んだ者の一人である。敬虔な法学者であり、エジプトの人々、とりわけアル＝ジャラール・アル＝バクリーが彼から益を得た。それどころか、〔アル＝ジャラールの〕法学修得の大部分はまさに彼によるものであった。というのも、彼〔アル＝ジャラール〕が彼のために読み上げる役を務めていたからである。そして〔アル＝ジャラールは〕彼が清廉な人々の一人であったと語った。同様に、アブドゥルバースィト街区の住人アッ＝シャラフ・アッ＝タンバディーも彼から学んだ者の一人である。おそらく840年頃に没した。
  en: Muḥammad b. ʿAbd al-Bārī, Taqī al-Dīn al-Miṣrī al-Shāfiʿī, the blind (al-Ḍarīr). He was among those who studied under al-Sirāj al-Bulqīnī. He was a pious jurist from whom the Egyptians benefited, especially al-Jalāl al-Bakrī; indeed, most of the latter's training in jurisprudence was through him, since it was al-Jalāl who used to read aloud for him. He (al-Jalāl) said that he was one of the righteous. Likewise, al-Sharaf al-Ṭanbadī, resident of the quarter of ʿAbd al-Bāsiṭ, was among those who studied under him. He died, presumably, around the year 840.
