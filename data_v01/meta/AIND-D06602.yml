translation:
  ja: ムハンマド・ブン・アフマド・ブン・イブラーヒーム、アル＝ムヒッブ・アブー・アル＝ファドル・アル＝マシュハディー・アル＝カーヒリー・アッ＝シャーフィイー。我らがシャイフの口述を筆記する者の一人であった。ガラス職人街の店でアル＝ブルハーン・アル＝マンスーリーの同僚として証人業で生計を立て、のちアル＝フサーム・ブン・フライズの法廷で署名書記を務めたが、ほどなくして50歳近くで没した。神が彼を赦したまわんことを。
  en: Muḥammad b. Aḥmad b. Ibrāhīm, al-Muḥibb Abū al-Faḍl al-Mashhadī al-Qāhirī al-Shāfiʿī. He was one of those who wrote down the dictation from our shaykh. He earned his living as a notary witness, as a colleague of al-Burhān al-Manṣūrī, in the shop at the Glassmakers’ [quarter]; then he wrote the tawqīʿ at the court of al-Ḥusām b. Ḥurayz, but before long he died, at nearly fifty. May God pardon him.
