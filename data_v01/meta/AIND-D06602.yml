    ja: '「ويتكسب بالشهادة رفيقا للبرهان المنصوري بحانوت الزجاجين」＝証人業の同僚。候補 #AIND-D00114「إبراهيم بن خليل بن إبراهيم بن محمد بن إسماعيل برهان الدين الأنصاري الصنهاجي الأصل المنصوري نسبة للمنصورة بالشرقية ثم القاهري الشافعي الأشعري العدل بالرخاصي … عدلا ثقة ساكنا متكسبا بالشهادة … ومات في رجب سنة ست وخمسين بالقاهرة」（repo 未収録）。ラカブ・ニスバ・生業（証人）・カイロが一致し、corpus の見出しで برهان الدين＋المنصوري はこの1件。ただし相手側の詰所は「بالرخاصي」で本項の「حانوت الزجاجين」と違い、「البرهان المنصوري」という呼び方の用例も本項だけ＝cert medium（ISSUES §D172-4）。初版は零番号 TMP-P-000000。'
