translation:
  ja: アフマド・ブン・ムハンマド・ブン・アビー・アル＝アッバース・アル＝ハフスィー。スルターン・アブー・ファーリスの甥で、ビジャーヤの支配者であった。810年に没し、スルターンは後任に本人の兄弟アル＝ダッバール・ムハンマドを任じた。我らがシャイフ（イブン・ハジャル）が『インバー・アル＝グムル』のなかで言及している。
  en: Aḥmad al-Ḥafṣī, son of Muḥammad, son of Abū al-ʿAbbās. He was the nephew of Sultan Abū Fāris and the ruler of Bijāya. He died in the year 810 H. Consequently, the Sultan appointed his brother, al-Dabbāl Muḥammad, in his place. Our shaykh (Ibn Ḥajar) mentioned this in his *Inbāʾ al-Ghumr*.
