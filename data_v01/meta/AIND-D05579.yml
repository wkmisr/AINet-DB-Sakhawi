translation:
  ja: アリー・ブン・ムハンマド・ブン・マフムード、アル＝アラー・アッ＝ルマイニー（＝アッ＝サルミーニー）、のちにアル＝ハラビー、シャーフィイー派、カイロ居留。息子ムハンマドとその祖父は後述。アッ＝ザイン・アル＝イラーキーらから聴聞した。840年頃に没した。
  en: ʿAlī b. Muḥammad b. Maḥmūd, al-ʿAlāʾ al-Rumaynī (i.e. al-Sarmīnī), then al-Ḥalabī, al-Shāfiʿī, resident of Cairo; his son Muḥammad and the latter's grandfather are mentioned below. He heard from al-Zayn al-ʿIrāqī and others, and died around the year [8]40.
