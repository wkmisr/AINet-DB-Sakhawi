translation:
  ja: ヤフヤー・ブン・アブド・アル＝カーディル・ブン・ムハンマド・ブン・アブド・アル＝ワッハーブ、アッ＝シャラフ、アスユート出自のアル＝カーヒリー、アッ＝ザーヒリー（ザーヒリーヤ・カディーマにちなむニスバ）、シャーフィイー派、シャーズィリー。アッ＝シャムス・アン＝ナフリーリーの娘の子（スィブト）で、そのためアン＝ナフリーリーとして知られる。ザーヒリーヤ・カディーマで生まれ、そこで育ち、クルアーンと『ミンハージュ』の大部分を暗記し、『ミンハージュ』をアル＝バドル・ハサン・アル＝アアラジュとアッ＝サンターウィーのもとで学んだ。子供たちの教育と書写に従事し、スーフィーたちと交わった。巡礼を行い、（8）97年に滞留（ムジャーワラ）して、アッ＝サイイド・アブドゥッラーに『ミンハージュ』を読み、私（サハーウィー）には、自分の手で書き写した写本から『アル＝カウル・アル＝バディーウ』ほかの私の著作を読んだ。さらにカイロでも私からいくつかのものを学んだ。彼は物静かで足るを知る人で、兄弟と、二人の父（＝自分の父）の扶助のもとにある。
  en: Yaḥyā b. ʿAbd al-Qādir b. Muḥammad b. ʿAbd al-Wahhāb, al-Sharaf, of Asyūṭī origin, al-Qāhirī, al-Ẓāhirī (a nisba to al-Ẓāhiriyya al-Qadīma), the Shāfiʿī, the Shādhilī, daughter's son of al-Shams al-Naḥrīrī, and therefore known as al-Naḥrīrī. He was born at al-Ẓāhiriyya al-Qadīma and grew up there; he memorized the Qurʾān and most of the Minhāj, and studied it under al-Badr Ḥasan al-Aʿraj and al-Santāwī. He occupied himself with teaching children and with copying, and kept company with the Sufis. He performed the pilgrimage and sojourned in the year [8]97, and read in the Minhāj under al-Sayyid ʿAbd Allāh, and read to me (al-Sakhāwī) al-Qawl al-badīʿ and others of my works from copies he had written in his own hand; indeed he also took some things from me in Cairo. He is a quiet, contented man, living on the support of his brother and their father.
