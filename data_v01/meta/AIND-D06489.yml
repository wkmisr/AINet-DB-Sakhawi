translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・バラカ、シャムス・アッディーン、シャフタルとして知られる。水運び人の頭（ナキーブ・アッ＝スカート）であった。879年ズー・アル＝ヒッジャ月8日、金曜日の前夜（木曜の夜）に、バイナ・アッ＝スーライン、ジャーミウ・イブン・マイヤーラの向かいにある自宅で没した。隣人のアル＝アッバーディーらが彼の葬礼を行った。神が彼を赦したまわんことを。彼の後任には、同母兄弟の子であるアン＝ナースィリー・ムハンマド・ブン・アブド・アル＝ガニーが就いた。後述する。
  en: Muḥammad b. Ibrāhīm b. Baraka, Shams al-Dīn, known as Shiftar. He was the chief of the water-carriers (naqīb al-suqāt). He died on the eve of Friday, 8 Dhū al-Ḥijja of the year 879, at his house opposite the mosque of Ibn Mayyāla at Bayn al-Sūrayn. His neighbour al-ʿAbbādī and others prayed over him; may God pardon him. He was succeeded by the son of his uterine brother, al-Nāṣirī Muḥammad b. ʿAbd al-Ghanī, who will come below.
