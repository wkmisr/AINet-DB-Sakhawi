translation:
  ja: ムハンマド・ブン・アブー・バクル・ブン・イーサー・アッ＝サフラーウィー・アル＝カーヒリー・アル＝ハルサーニー。アル＝マイドゥーミーから聴聞した者の一人で、我らが師（イブン・ハジャル）らが彼から伝承した。貧者（スーフィーたち）と交わった。（8）08年ムハッラム月に没した。アル＝マクリーズィーが『ウクード』で彼に言及しており、我らが師の『ムウジャム』を参照せよ。
  en: Muḥammad b. Abī Bakr b. ʿĪsā al-Ṣaḥrāwī al-Qāhirī al-Harsānī. He was among those who heard from al-Maydūmī, and our shaykh (Ibn Ḥajar) and others transmitted from him. He kept company with the poor (Sufis). He died in Muḥarram of the year [8]08. Al-Maqrīzī mentioned him in his ʿUqūd; see also the Muʿjam of our shaykh.
