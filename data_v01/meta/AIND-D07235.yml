translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ムハンマド・ブン・アビー・バクル・ブン・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・ナースィル、アル＝ジャマール・アル＝クラシー・アル＝アブダリー・アッ＝シャイビー・アル＝マッキー。838年ズー・アル＝カアダ月9日火曜日にそこ（マッカ）で没した。イブン・ファハドがその没年月日を記している。
  en: Muḥammad b. Abī Bakr b. Muḥammad b. Abī Bakr b. Muḥammad b. Aḥmad b. Muḥammad b. Nāṣir, al-Jamāl al-Qurashī al-ʿAbdarī al-Shaybī al-Makkī. He died there (in Mecca) on Tuesday, 9 Dhū al-Qaʿda 838. Ibn Fahd recorded his death date.
