  note:
    ja: '父（初版は father relation 自体が欠落）。候補＝#AIND-D10825「أبو بكر بن محمد بن أبي بكر بن محمود بن ناصر الفخر القرشي العبدري الشيبي المكي الشافعي والد أحمد وأخو على والد الجمال محمد … ومات في صفر سنة سبع عشرة」（クンヤ部、未受領）。本項主の見出しナサブ（أبي بكر بن محمد بن أبي بكر بن محمد بن أحمد … بن ناصر）と3代一致し、同家の兄弟 #AIND-D05409「علي بن محمد بن أبي بكر محمد بن أحمد بن بحير بن ناصر」のナサブとも整合するが、D10825 の見出しは「بن محمود بن ناصر」と中間を異にし、D10825 本文が挙げる子は أحمد のみ（「الجمال محمد」は兄弟 علي の子＝#AIND-D08047 の転送先）であるため cert medium（規則26、§D131-2）。'
