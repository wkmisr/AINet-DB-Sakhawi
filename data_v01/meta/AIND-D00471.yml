translation:
  ja: アフマド・ブン・イブラーヒーム・アル＝ヒムスィー・アッ＝シャーフィイーは、私（＝サハーウィー）がアレッポ地方に送った自筆の嘆願書（istiduʿā)に、851年付で書き記した。しかし、私には彼についての知識はなかった。
  en: Aḥmad b. Ibrāhīm al-Ḥimṣī al-Shāfiʿī wrote on a petition in my (al-Sakhāwī's) handwriting, which I had sent to the regions of Aleppo, dated to the year 851. However, al-Sakhāwī noted that he had no personal knowledge of him.
