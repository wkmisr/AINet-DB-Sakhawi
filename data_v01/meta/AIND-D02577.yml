translation:
  ja: ハサン・ブン・アリー・ブン・ハサン、アル＝バドル、アル＝ムバーシリー、のちにアル＝シャブラウィー、アル＝マルスィー。同地の公証人の一人。カイロに来て一時期マンクータムリーヤ・マドラサに居住し、私（サハーウィー）および他の者に少し学んだ。公証人たちと同席したのち、帰郷した。
  en: Ḥasan b. ʿAlī b. Ḥasan, al-Badr, al-Mubāshirī, then al-Shabrāwī, al-Malsī. One of its witnesses (notaries). He came to Cairo and resided in al-Mankūtamurīya for a time, and read a little with me and with others. He sat with the witnesses, then returned.
