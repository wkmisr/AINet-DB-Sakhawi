translation:
  ja: イーサー・ブン・アブドゥッラー、アル＝イマード・アル＝クラシー・アル＝マフズーミー・アル＝ヤマニー・アル＝マフジャミー、マッカ居住者、イブン・アル＝フライスとして知られる。有力商人の一人で、イエメンの支配者アル＝アシュラフが彼をアデンの監督官（ナーズィル）に任じた。マッカに数年間滞在（ムジャーワラ）した。（8）02年ラジャブ月にアビヤート・フサインで没した。アル＝ファースィーが彼について記し、次いで我らがシャイフ（イブン・ハジャル）がその『インバー』で記している。
  en: ʿĪsā b. ʿAbd Allāh, al-ʿImād al-Qurashī al-Makhzūmī al-Yamanī al-Mahjamī, resident of Mecca, known as Ibn al-Hulays. He was one of the leading merchants; al-Ashraf, the ruler of Yemen, appointed him supervisor (nāẓir) of Aden. He sojourned in Mecca for some years. He died in Rajab of the year (8)02 at Abyāt Ḥusayn. Al-Fāsī mentioned him, and then our shaykh (Ibn Ḥajar) in his Inbāʾ.
