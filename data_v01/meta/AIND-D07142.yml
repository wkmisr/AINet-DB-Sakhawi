  note:
    ja: '「رفيق فضل الله الماضي」。corpus の فضل الله 項（D06179〜D06185）のうち、#AIND-D06179「فضل الله بن روزبهان … الشيرازي الشافعي الصوفي ويعرف بخواجه ملا … سافر إلى المدينة النبوية فجاور بها أشهرا من سنة سبع وثمانين ولقيني بها … وقرأ على البخاري بالروضة」が、ペルシア系シャーフィイー派・マディーナでサハーウィーに学ぶという本項（「ممن سمع بالمدينة」）の文脈と最も整合する。ただし原文は名のみで候補が複数あるため cert medium（§D119-3）。初版の #NEEDID を差し替え（subtype は repo 先例 D04814「رفيقا لـ…」の colleague）。'
