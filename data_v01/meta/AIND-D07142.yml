  cert: high
  note:
    ja: 二重立項。#AIND-D09609（未収録）「محمد بن القاضي أمين الدين بن الأميرا سليم بن محمد زائد الحصاري السمرقندي الشافعي . سمع مني وعلي بالمدينة النبوية أشياء من تصانيفي وغيرها وكتبت له إجازة」はナサブ（أمين الدين／أمير اسليم／محمد زائد）・ニスバ・学派・マディーナでの聴聞がすべて一致し同一人物（cert high）。どちらにも転送指示がないため両項とも実項（絶対基準）。
