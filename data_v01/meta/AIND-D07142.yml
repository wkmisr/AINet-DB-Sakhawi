translation:
  ja: ムハンマド・ブン・アル＝カーディー・アミーン・アッ＝ディーン・アミーン・ブン・アミール・イスリーム・ブン・ムハンマド・ブン・ザーイド・ブン・マフムード・アル＝ヒサーリー・アッ＝サマルカンディー、シャーフィイー派。前述のファドル・アッラーの同行者で、シャイフ・スルターンに随伴することで知られる。マディーナで聴聞した者の一人で、善良な人であった。
  en: Muḥammad b. al-Qāḍī Amīn al-Dīn Amīn b. Amīr Islīm b. Muḥammad b. Zāʾid b. Maḥmūd al-Ḥiṣārī al-Samarqandī, the Shāfiʿī, companion of the aforementioned Faḍl Allāh, and known for keeping company with al-Shaykh Sulṭān. He was among those who heard [teachers] in Medina, and he was a good man.
