translation:
  ja: イブラーヒーム・ブン・イーサー・ブン・ガナーイム・アル＝マクディスィー・アッ＝サーリヒー・アッ＝ディマシュキー・アッ＝トゥーバースィー・アル＝ハンバリー。 ナブルスで768年にザイターウィーから『イブン・マーヤ』（のハディース集）を聴聞した。また、イブン・ウマイラから『ジャーミウ・アッ＝ティルミズィー』を聴聞した。736年の末か、翌年の初めにカーシユーン山麓で亡くなった。イブン・ファハドが彼の『ムアジャム』で言及している。
  en: Ibrāhīm b. ʿĪsā b. Ghanāʾim al-Maqdisī al-Ṣāliḥī al-Dimashqī al-Ṭūbāsī al-Ḥanbalī. He heard 『Ibn Mājah』 in Nablus in 768 H from al-Zaytāwī. He also heard 『Jāmiʿ al-Tirmidhī』 from Ibn Umayla. He died in late 736 H or early the following year at the foot of Mount Qasioun. Ibn Fahd mentioned him in his dictionary 『Muʿjam』.
