translation:
  ja: アハマド・ブン・アブドゥッラー・アル＝シハーブ・アル＝ナフワリー・アル＝マーリキーは、ダマスクスで副カーディー職を務めた最後の人物であり、その後ハマのカーディー職、次にアレッポのカーディー職を歴任した。彼は840年シャアバーンにアレッポで亡くなった。イブン・ルブーディーがその生涯を記録した。
  en: Aḥmad b. ʿAbd Allāh al-Shihāb al-Naḥrīrī al-Mālikī was the last to serve as deputy qadi in Damascus, then held the qadi's office in Ḥamā, then in Ḥalab. He died there in Shaʿbān of the year 840 H. Ibn al-Labūdī recorded his biography.
