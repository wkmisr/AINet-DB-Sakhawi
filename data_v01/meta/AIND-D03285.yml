translation:
  ja: シャーヒーン。アル＝バースィティーヤの寄宿者で、私（サハーウィー）はその寄進者（ザイン・アッ＝ディーン・アブド・アル＝バースィト）のマムルークであったと思う。善良な人物で、法学を学び、書を能くし、信仰深かった。895年または896年のラマダーン月に没した。
  en: Shāhīn, resident of al-Bāsiṭiyya; I think he was a mamlūk of its founder (Zayn al-Dīn ʿAbd al-Bāsiṭ). He was a good man who studied law, wrote a fine hand, and was pious. He died in Ramaḍān 895 or 896 AH.
