translation:
  ja: アフマド・ブン・ムハンマド・ブン・アブドゥルガニー・アル＝アズディー・アル＝スカンダリー。イブン・シャーフィウとして知られる。彼はヒジュラ暦727年ラマダーン月に生まれた。イブン・アッ＝サファーやその他の人物から（ハディースを）聴聞した。我らがシャイフ（イブン・ハジャル）は自身の伝記集成で「彼に『マシュヤハト・アッ＝ラーズィー』を読んだ」と述べた。彼は世紀の少し後に亡くなった。
  en: Aḥmad b. Muḥammad b. ʿAbd al-Ghanī al-Azdī al-Sakandarī, known as Ibn Shāfiʿ. He was born in Ramaḍān in the year 727 AH. He heard (ḥadīth) from Ibn al-Ṣafā and others. Our shaykh (Ibn Ḥajar) stated in his dictionary, "I read to him Mashyakhat al-Rāzī." He died shortly after the turn of the century.
