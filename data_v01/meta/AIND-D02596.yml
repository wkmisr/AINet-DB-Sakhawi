translation:
  ja: ハサン・ブン・アリー・ブン・マフムード・アッ＝シーラーズィー・アル＝マッキー・アッ＝シャーフィイー。ヒジュラ暦878年サファル月（第2月）に生まれ、成長すると文法学や形態論などを少し学んだ。私（サハーウィー）の4回目と5回目のメッカ逗留（ムジャーワラ）の際に私に親しく師事し、私から多くの講義を聴講した。それどころか、『アル＝ミシュカート』などを私の前で読誦（朗読学習）した。
  en: Ḥasan b. ʿAlī b. Maḥmūd al-Shīrāzī al-Makkī al-Shāfiʿī. He was born in the month of Ṣafar in the year 878 AH. He grew up and studied grammar, morphology, and other subjects a little. He associated closely with me (al-Sakhāwī) during my fourth and fifth stays (mujāwaras) in Mecca, hearing various things from me, and indeed reciting to me al-Mishkāt and other works.
