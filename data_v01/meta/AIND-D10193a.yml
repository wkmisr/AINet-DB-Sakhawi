  lang: ja
translation:
  ja: アル＝ワリード・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・マフムード・イブン・アッ＝シフナ・アル＝ハラビー、ハナフィー派。前出の兄ムヒッブ・アブー・ル＝ファドル・ムハンマドと、二人の父ムヒッブ・ムハンマド——本項の主にちなんでアブー・ル＝ワリードのクンヤをもつ——〔も前出〕。兄が私に語ったところでは、彼は聡明さの模範で、詩と散文をよくした。父の存命中、動乱の直後に若くして没した。
  en: Al-Walīd b. Muḥammad b. Muḥammad b. Muḥammad b. Maḥmūd Ibn al-Shiḥna al-Ḥalabī al-Ḥanafī. His brother al-Muḥibb Abū al-Faḍl Muḥammad and their father al-Muḥibb Muḥammad — whose kunya Abū al-Walīd derives from the subject — have been mentioned. As his brother told me, he was a marvel of intelligence, with verse and prose. He died young, in his father's lifetime, just after the disturbance (fitna).
