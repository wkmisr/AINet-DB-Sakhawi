translation:
  ja: アリー、カマール・アッ＝ディーン・ムハンマドと呼ばれる、ブン・アブド・アッ＝ザーヒル、アッ＝シャリーフ・アル＝アフミーミー・アル＝カーヒリー。アル＝バルダバキーヤの寄留者。アル＝アラー・アル＝ヒスニーとアッ＝ザイニー・ザカリヤーから学んだ者の一人で、善良さ・理性・穏やかさをそなえて頭角を現した。私（サハーウィー）のもとにも少しばかり通った。
  en: ʿAlī, called Kamāl al-Dīn Muḥammad, b. ʿAbd al-Ẕāhir, al-Sharīf al-Akhmīmī al-Qāhirī, resident of al-Bardabakiyya. He was among those who studied under al-ʿAlāʾ al-Ḥiṣnī and al-Zaynī Zakariyyā, and distinguished himself, together with goodness, intelligence and composure. He frequented me (al-Sakhāwī) a little.
