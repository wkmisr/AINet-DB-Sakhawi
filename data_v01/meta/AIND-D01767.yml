translation:
  ja: アフマド・アッ＝シハーブ・アル＝マールディーニー、ついでアッ＝ディマシュキー、アル＝ハンバリー。端麗な容姿と美しい筆跡を持ち、証言（シャハーダ）で生計を立てた。アル＝バドリーがその選集（マジュムーウ）の中で、彼について次の（自作の）詩句を書き留めている。 「私はユーヌス章にかけて我が恋を決意した──彼はガゼルのように逃げ去るふうだったが、やがて馴染んだ。 彼は私の方へと傾き、バラーア（悔悟）章にかけて誓う、私はユーヌスの決意ゆえに逢瀬を得たのだ。」 およそ864年より後に死去した。
  en: 'Aḥmad al-Shihāb al-Mārdīnī, then al-Dimashqī, al-Ḥanbalī. He had a handsome appearance and fine handwriting, and earned his living by giving testimony (shahāda). Al-Badrī recorded him in his compilation, citing (his own) verses about him: “I resolved upon my love by Sūrat Yūnus — though he was skittish like a gazelle, he grew accustomed. He inclined toward me, and by Sūrat Barāʾa I swear, I have indeed won union through the resolve of Yūnus.” He died approximately after the year 864 H.'
