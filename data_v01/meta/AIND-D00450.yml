translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・アブドゥッラー・ブン・アラブ、アッ＝シハーブ・アブー・アル＝アッバース。イエメン出身の家系でルーム（アナトリア）育ちの禁欲者（ザーヒド）、シャイフーニーヤの住人で、イブン・アラブとして知られる。家系はイエメンに発し、父がイエメンからルームの地へ移り住み、本項の人物はそこで生まれた。ブルサの町で育ち、ルームやトルコの人々が、自分たちの出自でないアラブ人をそう名付ける習慣に従って「イブン・アラブ」と呼ばれた。良い素地の上に美しく成長した。その後、若いうちにカイロに来て、アクマル・アッ＝ディーンがシャイフーニーヤに新設した広間（カーア）にスーフィーとして住み込み、そのイマームであるハイル・アッ＝ディーン・スライマーン・ブン・アブドゥッラーらのもとで読誦を学び、しばらくの間、賃仕事で書写を行い、学業に励んだ。やがて人々との交わりを絶って誰とも会わず、金曜礼拝と集団礼拝を守りながらも隠遁を選んだ。冬も夏も冷水で大浄（グスル）をしてから金曜礼拝に早く出かけ、行き帰りに誰とも話さず、その威厳と重々しさのゆえに誰も彼に話しかける勇気を持たなかった。敬虔と崇拝行為は極みに達していた。伝え聞くところでは、疑問が生じるとシャイフーニーヤ・ハーンカーの住人であるシャーフィイー派のシャムス・アル＝ビージューリーに尋ね、疑問が解けると立ち去り、その後は一言も交わさなかったという。それゆえ彼はシャーフィイー派であると言われたが、私（サハーウィー）は自分の筆跡で彼をハナフィー派と記したものを見たことがあり、その際の根拠が何であったかは分からない。彼はまた読誦学（キラーアート）に通じていた。粗末で極めてごわごわした衣服だけで済ませ、わずかな食糧に満足した。極度に慎み深く、誰からも何も受け取らず、商人が彼を知って値引きしたと知れば、その者の店へは二度と行かなかった。それを恐れて変装し、夜の礼拝（イシャー）の後に二、三日分の食糧を買っていた。人々は彼を一目見ようと願ってシャイフーニーヤに泊まり込んだ。彼はこの生き方を三十年以上続けた。彼のカラーマ（奇蹟）は数多く、その道において唯一無二であり、同時代に彼の道に近づく者はいなかった。アル＝アイニーは「彼が二十年以上まったく水を飲まなかったことは衆口一致で確かめられており、昼は斎戒に、夜は徹夜の礼拝に過ごしていた」と述べている。830年ラビーウ・アル＝アウワル月2日の水曜の夜に死去し、アル＝アイニーが人々の先頭に立って葬礼の礼拝を行った。我らがシャイフ（イブン・ハジャル）は言う。「彼の驚くべき事柄の一つは、死去したとき葬列の人出がおびただしかったことである。人々の多くは彼の境涯も行状も知らなかったが、訃報を伝え聞くや駆けつけ、スルターンも城塞から降りてきてルマイラで彼のための礼拝を行った。遺体はハーンカーに戻されてそこに葬られ、アクマル・アッ＝ディーンの傍らに埋葬された。棺は指の上に載せて運ばれ、人々は彼が身につけていた衣類を競って最高値で買い求めた。すると、その代金の総額は、彼が最初に住み込んでから死ぬまでに受け取った俸給の額と、多くも少なくもなく一致した。これも彼のカラーマの一つに数えられた」。アッラーが彼を憐れみ、我々に彼の益を与え給いますように。アル＝マクリーズィーも『ウクード』において彼に言及した者の一人である。
  en: 'Aḥmad b. Ibrāhīm b. Muḥammad b. ʿAbd Allāh b. ʿArab, al-Shihāb Abū al-ʿAbbās, of Yemeni origin, al-Rūmī, the ascetic, resident of the Shaykhūniyya, known as Ibn ʿArab. His family origin was in Yemen; his father moved from there to the lands of Rūm (Anatolia) and settled there, and the subject of this notice was born to him there. He grew up in the city of Bursa and was called Ibn ʿArab according to the custom of the Rūmīs and Turks of so naming those living among them who were Arabs. His upbringing was good, on a sound footing. Then, while still a young man, he came to Cairo and took up residence as a Sufi in the hall (qāʿa) newly built by Akmal al-Dīn at the Shaykhūniyya. He studied recitation under its imam, Khayr al-Dīn Sulaymān b. ʿAbd Allāh, and others, copied manuscripts for hire for a time, and pursued his studies. Then he withdrew from people, meeting no one and choosing seclusion, while keeping strictly to the Friday and congregational prayers. He would go early to the Friday
    prayer after performing the major ablution with cold water, winter and summer alike; he spoke to no one on his way there and back, and no one dared address him because of his awe and dignity. His scrupulousness and devotion reached the utmost. I was told that he used to consult al-Shams al-Bījūrī al-Shāfiʿī, resident of the Shaykhūniyya khānqāh, on questions that perplexed him; once the difficulty was clarified he would depart and not speak another word to him. For this reason it was said that he was a Shāfiʿī in madhhab; yet I (al-Sakhāwī) once saw, in my own handwriting, a description of him as a Ḥanafī, and I do not know what my basis for it was. He also knew the Qurʾānic readings (qirāʾāt). He confined himself to wretched, extremely coarse clothing and was content with little food. He was so scrupulous that he would accept nothing from anyone; if he learned that a vendor had favored him in price because he recognized him, he would never go back to him. For fear of this he would disguise
    himself and buy two or three days’ provisions after the evening prayer. People would spend the night at the Shaykhūniyya in the hope of catching sight of him. He maintained this way of life for more than thirty years. His miracles (karāmāt) were many and he was unique in them; no one in his age came near him in his path. Al-ʿAynī said that it was established by mass transmission (tawātur) that he spent more than twenty years without drinking water at all, passing his days in fasting and his nights in vigil. He died on the night of Wednesday, 2 Rabīʿ I 830, and al-ʿAynī led the people in the funeral prayer over him. Our shaykh (Ibn Ḥajar) said: “Among the wonders of his affair is that when he died, the crowd at his funeral was immense, although most people had known nothing of his state or his conduct; when they heard of his death they hastened to him, and the sultan came down from the Citadel and prayed over him at al-Rumayla. He was returned to the khānqāh and buried there beside Akmal
    al-Dīn. His bier was carried on fingertips, and people competed to buy the clothes he had worn, paying the highest prices; and it so happened that the total raised from their sale, when reckoned, equalled — neither more nor less — the stipend he had drawn from the time he first took up residence there until his death. This was counted among his karāmāt.” May God have mercy on him and benefit us through him. Al-Maqrīzī was among those who mentioned him, in his ʿUqūd.'
