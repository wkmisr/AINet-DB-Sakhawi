translation:
  ja: ムハンマド・ブン・アブドゥルワーヒド・ブン・アッ＝ザイン・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・アル＝ムヒッブ・アフマド・イブン・アブドゥッラー、アブー・ハーミド・アッ＝タバリー・アル＝マッキー。母はアーイシャ、通称サアーダ、ムハンマド・ブン・ファトフ・アッ＝ターイフィーの娘。807年に生まれ、祖父アッ＝ザイン、ファトフ・アッ＝ディーン・アル＝マフズーミー、イブン・アル＝ジャザリー、アッ＝シャムス・アッ＝シャーミー、イブン・サラーマから聴聞し、アル＝マラーギーほかからイジャーザを得た。837年シャアバーン月にマッカで没した。
  en: Muḥammad b. ʿAbd al-Wāḥid b. al-Zayn Muḥammad b. Aḥmad b. Muḥammad b. al-Muḥibb Aḥmad b. ʿAbd Allāh, Abū Ḥāmid al-Ṭabarī al-Makkī. His mother was ʿĀʾisha, called Saʿāda, daughter of Muḥammad b. Fatḥ al-Ṭāʾifī. He was born in the year 807 and heard from his grandfather al-Zayn, Fatḥ al-Dīn al-Makhzūmī, Ibn al-Jazarī, al-Shams al-Shāmī and Ibn Salāma; al-Marāghī and others granted him ijāza. He died in Mecca in Shaʿbān of the year 837.
