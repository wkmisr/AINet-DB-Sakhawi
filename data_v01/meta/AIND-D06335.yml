translation:
  ja: クルダム・アル＝ハサニー。果敢な人物で、大ハーズィンダール（財務官）も務めた。814年に没した。悪くない人物であった。アル＝アイニーがそう述べた。前の世紀にも（別の）クルダム・アル＝ハサニーがいる。
  en: Qurdum al-Ḥasanī. He was bold, and also served as grand khāzindār (treasurer). He died in the year 814; there was nothing wrong with him. So said al-ʿAynī. In the preceding century there is (another) Qurdum al-Ḥasanī.
