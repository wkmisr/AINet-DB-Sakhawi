translation:
  ja: ムハンマド・ブン・アフマド・ハーフィズ・アッ＝ディーン・アル＝アズライー・アッ＝ディマシュキー・アル＝ハナフィー。ダマスクスで機密書記の代理を務めた者の一人で、頭角を現した。891年にハラブで没した。アル＝バドリーがその『マジュムーウ』に彼から〔次の詩を〕書き留めている。「わが雅びな恋人は腰が細い／私はその人とその優美な腰に心奪われた／そして咎める者らにこれとあれについて言った／そうだ、私は優美なるものと雅びなるものを恋い慕う」。
  en: 'Muḥammad b. Aḥmad Ḥāfiẓ al-Dīn al-Adhraʿī al-Dimashqī al-Ḥanafī. One of those who served as deputy in the office of confidential secretary (kitābat al-sirr) in Damascus, and he distinguished himself. He died in Aleppo in the year 891. Al-Badrī wrote down from him in his Majmūʿ: "My elegant beloved is slender of waist, / and I am infatuated with him and with the delicate waist; / and I said to the blamers, about this one and that: / yes, I love the delicate and the elegant."'
