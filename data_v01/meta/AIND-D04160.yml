translation:
  ja: アブドゥルカーディル・ブン・アリー・アル＝ハッバーク。マッカの居住者であり、マスジド・アル＝ハラームのムアッジンのひとり、かつ（マッカの）スルターニーヤ・マドラサのクッブの朗誦者（クッラー・アッ＝スッファ）のひとり。さらに彼は、ムハンマド・ブン・アル＝ムフタシブの後を継いで、諸集会や諸会合、特に墓所における読誦師の長（マシヤハト・アル＝クッラー）の職に就任した。彼がこの職において最初に行った仕事は、私の兄弟の妻の墓前での読誦であった。
  en: ʿAbd al-Qādir b. ʿAlī al-Ḥabbāk. A resident of Mecca, one of the muezzins of the Sacred Mosque, and one of the readers of the Suffa at the Sulṭāniyya Madrasa. Rather, he settled in the position of chief of readers (mashyakhat al-qurrāʾ) in assemblies and gatherings, especially at graves, succeeding Muḥammad b. al-Muḥtasib. The first thing he undertook in this capacity was at the grave of my brother's wife.
