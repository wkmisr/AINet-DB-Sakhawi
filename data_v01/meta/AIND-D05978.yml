  note:
    ja: '見出しナサブから1段ずらして復元（規則3）。قاضي القضاة الكمال أبو البركات محمد بن ظهيرة の孫で、その子（#AIND-D09081 التقي・#AIND-D09082 الجلال أبو السعادات・#AIND-D09083 أبو الفتح・#AIND-D09084 الجمال أبو السعود・النجم أبو المعالي 等）のいずれかの息子「محمد」。原文に父のラカブ・クンヤがなく、どの系統か特定できない（例: #AIND-D09201 الجمال أبو المكارم بن النجم أبي المعالي بن الكمال أبي البركات は同型のナサブだが本項主への言及なし）。corpus に本伝未特定・ID-Master 未登録 → TMP-P-001430（§D109-6）。初版に父 relation なし。候補: 母 أم هانئ（#AIND-D13831）は #AIND-D13131「زينب ابنة النجم محمد بن أبي البركات」・#AIND-D13132「زينب أخت التي قبلها وأمها أم هانيء ابنة القاضي عزالدين النويري」により النجم أبو المعالي محمد بن الكمال أبي البركات（846年没）の妻であるため、父は النجم محمد بن أبي البركات 本人（見出しの「محمد بن محمد بن أبي البركات」と1代ずれる）か、その子 النجم محمد（D13044・D13732）の可能性がある。確証がないため仮番号を維持（規則26）。'
