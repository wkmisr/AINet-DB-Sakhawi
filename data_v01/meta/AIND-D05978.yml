translation:
  ja: ウマル・ブン・ムハンマド・ブン・ムハンマド・ブン・アビー・アル＝バラカート・ムハンマド・ブン・アビー・アッ＝スウード・ムハンマド・ブン・フサイン・ブン・アリー・ブン・ザヒーラ、アル＝クラシー、アル＝マッキー。母はアル＝イッズ・アン＝ヌワイリーの娘ウンム・ハーニー。イブン・ファハドは彼について空欄を残しており、幼くして没したらしい。
  en: ʿUmar b. Muḥammad b. Muḥammad b. Abī al-Barakāt Muḥammad b. Abī al-Suʿūd Muḥammad b. Ḥusayn b. ʿAlī b. Ẓahīra al-Qurashī al-Makkī; his mother was Umm Hānī, daughter of al-ʿIzz al-Nuwayrī. Ibn Fahd left his entry blank, and it seems he died young.
