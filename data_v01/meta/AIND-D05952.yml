translation:
  ja: ウマル・ブン・ムハンマド・ブン・スライマーン、アッ＝ザイン・ブン・アッ＝サーブーニー、アッ＝ディマシュキー。祖父がムハンマド・ブン・スライマーンである者（の部）で後述する。
  en: ʿUmar b. Muḥammad b. Sulaymān, al-Zayn b. al-Ṣābūnī, al-Dimashqī. He will be mentioned below among those whose grandfather is Muḥammad b. Sulaymān.
