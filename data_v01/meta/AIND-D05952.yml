notes:
- text: '転送見出し（原文末尾「يأتي فيمن جده محمد بن سليمان」による）。転送先は #AIND-D05973（عمر بن محمد بن محمد بن سليمان بن أبي بكر الزين بن ناصر الدين البكري الدمشقي ابن عم العلاء علي بن أحمد بن محمد ويعرف كل منهما بابن الصابوني … مات سنة أربع وثمانين وثمانمائة تقريبا بدمشق）。ラカブ الزين・通称 ابن الصابوني・ダマスクス・祖父名 محمد بن سليمان が一致＝確実。本見出しは父 محمد の次の代（祖父 محمد）を省いた形。'
