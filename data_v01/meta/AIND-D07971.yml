translation:
  ja: ムハンマド・ブン・ウカーブ（ウカーブは無点の字〔ʿayn〕にダンマ、qāf は無重複、末尾は一点の字〔bāʾ〕）、アル＝マグリビー・アッ＝トゥーニスィー、マーリク派。イブン・アラファらから学んだ。既出のウマル・アル＝カルジャーニーの後にカーディー・アル＝ジャマーア職に就いた。851年に没した。私から学んだ者のうち、彼から学んだある者がこれを私に伝えた。
  en: Muḥammad b. ʿUqāb (with ḍamma on the undotted ʿayn, the qāf without tashdīd, and a bāʾ at the end), al-Maghribī al-Tūnisī al-Mālikī. He studied under Ibn ʿArafa and others, and held the office of qāḍī al-jamāʿa after ʿUmar al-Qaljānī, mentioned above. He died in the year 851. One of those who studied under him, among those who studied under me, informed me of this.
