translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・イスハーク、アブー・アブドゥッラー・アル＝ハドラミー、アブー・バクルの父。シャリーア（外的法）とハキーカ（内的真理）を兼ね備えた者の一人で、善性のしるしが彼の上にはっきりと現れていた。834年に没し、マフジャムの町に葬られた。
  en: Muḥammad b. Ibrāhīm b. Isḥāq, Abū ʿAbd Allāh al-Ḥaḍramī, father of Abū Bakr. He was among those who combined the sharīʿa and the ḥaqīqa, and the mark of goodness was manifest upon him. He died in the year 834 and was buried in the town of al-Mahjam.
