translation:
  ja: フシュカダム・アッ＝スードゥーニー・ミン・アブドゥッラフマーン。アッ＝ザーヒル・ジャクマクの時代に幾度もエルサレムの副官（ナーイブ）を務め、2度目にはラムラとナーブルスのカシュフ（監督職）が加えられた。3度目の在任中、853年ラビーウ第1月に同地で没した。後任にはカラージャー・アル＝ウマリー・アン＝ナースィリーが就いた。本項主は勇敢で知られていた。神が彼を赦したまわんことを。
  en: Khushqadam al-Sūdūnī min ʿAbd al-Raḥmān. He served several times as deputy (nāʾib) of Jerusalem in the days of al-Ẓāhir Jaqmaq; in the second term the kashf of al-Ramla and Nablus was added to him. He died there during the third term, in Rabīʿ I of the year 853, and Qarājā al-ʿUmarī al-Nāṣirī succeeded him. The subject was famous for bravery; may God pardon him.
