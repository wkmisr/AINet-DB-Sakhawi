translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ウマル・ブン・アビー・バクル・ブン・ウマル・ブン・アブドゥッラフマーン・ブン・アブドゥッラー、アブー・アブドゥッラー・アン＝ナーシリー・アル＝ヤマーニー。祖父アブー・アブドゥッラーに学び、クルアーン誦読・礼拝・敬虔・寡欲に専念し、あわせて文法学と法学にも通じた。832年に没した。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh b. ʿUmar b. Abī Bakr b. ʿUmar b. ʿAbd al-Raḥmān b. ʿAbd Allāh, Abū ʿAbd Allāh al-Nāshirī al-Yamānī. He studied under his grandfather Abū ʿAbd Allāh and devoted himself to Qurʾān recitation, worship, scrupulousness and contentment, while also having a share in grammar and jurisprudence. He died in the year 832.
