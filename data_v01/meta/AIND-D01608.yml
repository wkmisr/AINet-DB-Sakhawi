translation:
  ja: アハマド・ブン・ムハンマド、シャハーブ・アル＝タルアファリー、後にダマスカス人（811年没）。彼は系譜書記を務めた。811年にダマスカスで中年で亡くなったと言われている。カヌーンの演奏の達人であり、講義が巧みであったという。我らがシャイフ（イブン・ハジャル）がその『インバー（報知）』で述べた。
  en: Aḥmad b. Muḥammad, Shihāb al-Talʿafarī, then al-Dimashqī (d. 811 H). He served as a scribe of lineage/attribution (kātib al-mansūb). It is said that he died in Damascus in 811 H in his middle age. He was a master of playing the qanūn and a skilled lecturer. Our shaykh (Ibn Ḥajar) stated this in his *Anbāʾ*.
