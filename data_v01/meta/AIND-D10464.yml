translation:
  ja: ユースフ・ブン・ハサン・ブン・ムハンマド・ブン・サーリム、ワーディー・ヤンブーのザイド派の長老、「法学者ユースフ」として知られる。（8）76年ラビーウ・アッ＝サーニー月に高齢で同地に没した。学識、とりわけ自派の学で知られ、私の思うところでは、それに総じて通じた者は彼をもって絶えた。私はそのことについて彼への称賛を複数の人から聞いた。神が我らと彼を赦されますように。
  en: Yūsuf b. Ḥasan b. Muḥammad b. Sālim, shaykh of the Zaydīs in Wādī Yanbūʿ, known as "the jurist Yūsuf". He died there in Rabīʿ II of the year [8]76 at an advanced age. He was noted for learning, especially in his own school, and with him, I think, those with a comprehensive knowledge of it came to an end; I heard him praised for this by more than one person. May God forgive us and him.
