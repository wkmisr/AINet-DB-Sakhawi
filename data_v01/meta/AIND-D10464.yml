notes:
- text: '学派 Zaydi は「شيخ الزيدية」「سيما مذهبه」による（repo 先例どおり ref なし）。ニスバ索引 #AIND-D11707「الزيدي جماعة من رؤوسهم الفقيه يوسف بن حسن بن محمد بن سالم وابن أخته عبيد」は本項主と姉妹の子 عبيد を挙げるが、عبيد の本伝は corpus に見当たらず（見出し検索「عبيد」＋「الزيد」）、本項にも記載がない＝relation を立てない（規則23）。初版の residence event（ينبع）は state の地と重複するため除去。同じ通称「الفقيه يوسف」の #AIND-D10558（يوسف بن يونس الجبائي المقري、イエメン）は別人。'
