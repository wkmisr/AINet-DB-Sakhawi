translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・ハラフッラー・ブン・アブドゥッサラーム・アル＝カルシャーニー。カーディー・アル＝ジャマーアとその二人の兄弟の父。イブン・アラファほかに学び、チュニスで婚姻カーディー職（カダー・アル＝アンキハ）とアル＝ウヌク学院の教授職に就いた。学識があり敬虔で、奇跡（カラーマート）で知られた人であった。アブー・ファーリスの孫であるスルターン・ウスマーンの治世の初期に没した。彼のことは一部のマグリブ人から得た。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad b. Khalaf Allāh b. ʿAbd al-Salām al-Qalshānī, father of the qāḍī al-jamāʿa and his two brothers. He was among those who studied under Ibn ʿArafa and others, and held the office of judge of marriages (qaḍāʾ al-ankiḥa) in Tunis and the professorship at the Madrasat al-ʿUnq. He was a learned and righteous man, noted for miracles (karāmāt). He died in the early days of [the reign of] Sultan ʿUthmān, grandson of Abū Fāris. I obtained [this notice] from some Maghribīs.
