translation:
  ja: アブドゥッラー・ブン・アビー・バクル・ブン・ヤフヤー・アッ＝ザウカリー・アル＝ヤマーニー・アッ＝シャーフィイー。タイッズの人びとのうちの優れた者の一人。ムザッファリーヤ〔学院〕でファトワーを出し、教授した。その品行は称賛されていた。810年に没した。我らがシャイフ（イブン・ハジャル）がその『インバーウ〔・アル＝グムル〕』において彼に言及している。
  en: ʿAbd Allāh b. Abī Bakr b. Yaḥyā al-Zawqarī al-Yamānī al-Shāfiʿī. One of the excellent men among the people of Taʿizz. He issued fatwas and taught at al-Muẓaffariyya, and was of praiseworthy conduct. He died in the year ten [810 AH]. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ [al-Ghumr].
