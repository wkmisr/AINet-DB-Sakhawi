translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アリー、アル＝ムフヤウィー・ブン・アル＝ブルハーン・アン＝ナースィリー・アル＝ハラビー、のちアル＝カーヒリー、アル＝ハナフィー。学識ある人々の一人。祖父と父はいずれもナースィリーヤでフトバを行い、祖父は子供たちに読誦を教えていた。
  en: Muḥammad b. Ibrāhīm b. ʿAlī, al-Muḥyawī b. al-Burhān, al-Nāṣirī al-Ḥalabī, then al-Qāhirī, the Ḥanafī, one of the learned. Both his grandfather and his father used to preach at al-Nāṣiriyya, and his grandfather taught children to recite.
