    ja: '「المحيوي بن البرهان」「كان كل من جده وأبيه يخطب بالناصرية」。父はラカブ（البرهان）と職（الناصرية のハティーブ）という識別要素をもち祖父名まで復元できる＝規則3 により仮番号 TMP-P-001749。corpus 見出し「إبراهيم بن علي＋الحلبي」6件（D00182・D00188・D00199・D04935・D06522・本項）に該当者なし、全文検索「يخطب بالناصرية」も本項のみ、ID-Master 未登録。初版は #NEEDID。'
