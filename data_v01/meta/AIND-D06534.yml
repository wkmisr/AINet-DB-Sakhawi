  note:
    ja: 父方の祖父 علي。「كان كل من جده وأبيه يخطب بالناصرية وجده يقرئ الأطفال」＝الناصرية のハティーブで、子供たちに（クルアーンを）教えた。名は裸の علي だが職の描写がある＝規則12 により仮番号 TMP-P-001750（⚠汎用名。同名別人への流用禁止）。corpus に本伝なし。初版は汚染番号 TMP-P-000530（登録＝علي、関係専用。precheck）。
