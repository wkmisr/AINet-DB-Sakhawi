notes:
- text: '「يخطب بالناصرية」「يقرئ الأطفال」は父・祖父の職であり、本項主の state・affiliation にしない（初版は本項主の affiliation type="affiliated" に المدرسة الناصرية wd:Q25463062〔カイロ〕を立てていた＝除去）。この「الناصرية」がどの施設かは原文から決まらない（ニスバ「الحلبي ثم القاهري」からはハラブの الناصرية〔#AIND-D07416「محمد بن سعد … ويعرف بخطيب الناصرية … وولي خطابة الناصرية حتى مات واشتهر بها」、その子 #AIND-D05432 ابن خطيب الناصرية〕の可能性が高いが、カイロの المدرسة الناصرية もありうる）。ニスバ「الناصري」はこの施設に由来するとみられる。初版の residence event 2件（حلب・القاهرة、ニスバ由来）を除去（規則22(1)・(6)）。「أحد الفضلاء」は人物評＝訳のみ。生没年の記載なし。'
