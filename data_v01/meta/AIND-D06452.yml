translation:
  ja: ムバーラク・アル＝ハバシー、アッ＝タキー・アル＝ファースィーの解放奴隷。844年ラビーウ第一月に没した。彼はアジャム（ペルシア）へ旅した者の一人で、富を得て、帰ってからは商取引を行い、ヒジャーズの主の側近となった。
  en: Mubārak al-Ḥabashī, freedman of al-Taqī al-Fāsī. He died in Rabīʿ I 844. He was among those who travelled to Persia (al-ʿAjam) and grew wealthy, so that on his return he engaged in trade, and he became closely attached to the lord of the Ḥijāz.
