notes:
- text: '転送見出し（原文「وقد مضى فيمن جده موسى قريبا」による）。転送先は #AIND-D10052「758 موسى بن أحمد بن موسى الشرف الحسني السرسنائي ثم القاهري الشافعي نزيل الناصرية … ومات في رجب سنة إحدى وسبعين وقد قارب الستين ظنا」（本項の2項前＝「قريبا」）。名・父名・祖父 موسى・ニスバ الحسني が一致し、hw.py「موسى بن أحمد」＋「الحسني」の該当は D10052 と本項のみ。ブリーフ候補と一致（規則60(h) で本文を確認）。'
  type: reference
- text: '「شهد على عبد الدائم في إجازة سنة أربع وثلاثين」＝本項主が834年のイジャーザで عبد الدائم（の署名）の証人を務めた（規則28: 本項主＝証人）。同じ834年のイジャーザの証人の記述が #AIND-D09379「محمد بن محمد العز الدنديلي شهد على عبد الدائم الأزهري في إجازة سنة أربع وثلاثين」・#AIND-D03180「وقد رأيت خطه بالشهادة على الشيخ عبد الدائم في إجازة أبي عبد القادر سنة أربع وثلاثين」にあり、عبد الدائم ＝ عبد الدائم الأزهري ＝ #AIND-D03536（عبد الدائم بن علي زين الدين أبو محمد الحديدي ثم القاهري الأزهري الشافعي）と読める（D10052 は القاهري で年代も合う）。REF のため event・relation にはせず note に留める（ブリーフ指示）。初版の grandfather relation（#NEEDID）・統制外 relation「witnessed_ijaza_for」（TMP-P-000238＝裸名登録）・cultural event・name_only・nisbah は REF のため除去。'
  lang: ja
  type: editorial
translation:
  ja: ムーサー・ブン・アフマド・アル＝ハサニー。834年のイジャーザ（授与状）においてアブド・アッ＝ダーイム（の署名）に対する証人となった。祖父がムーサーである者たち（の部）で少し前に既述。
  en: Mūsā b. Aḥmad al-Ḥasanī. He witnessed (the signature of) ʿAbd al-Dāʾim on an ijāza in the year 834. He has already been mentioned shortly before, among those whose grandfather is Mūsā.
