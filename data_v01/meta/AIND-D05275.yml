translation:
  ja: アリー・ブン・ウザイドゥッラー・アド＝ダウルシー・アル＝ブスターニー。100歳を超えた長老。イブン・ムーサー・アル＝マッラークシーが、815年に我が師（イブン・ハジャル）の息子やその他の者たちのために彼にイジャーザを求めた。それどころか、我が師アル＝ウッビーやその他の人々も、イブン・ムーサーと共に彼から（ハディースを）聴聞した。
  en: ʿAlī ibn ʿUbayd Allāh al-Dawrshī al-Bustānī, a shaykh who lived past one hundred years. Ibn Mūsā al-Marrākushī requested an ijāza from him for the son of our shaykh (Ibn Ḥajar) and others in the year 815 AH; indeed, our shaykh al-Ubbī and others heard [ḥadīth] from him alongside Ibn Mūsā.
