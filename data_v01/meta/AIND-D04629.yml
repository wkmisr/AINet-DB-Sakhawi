translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・ムーサー・ブン・ムハンマド・ブン・ムーサー、アル＝ジャマール・ブン・アッ＝シャムス・ブン・アッ＝シャラフ、アル＝マヌーフィー、のちアル＝マーザーニー。852年にジャアファルからクルアーン読誦諸法（キラーアート）を学んだ。我らの師（イブン・ハジャル）は彼のイジャーザに証人として署名し、彼を「有徳の、学識ある、卓越した者」と評した。また（我らの師は）彼の父と祖父の師でもあった。
  en: ʿAbd Allāh b. Muḥammad b. Mūsā b. Muḥammad b. Mūsā, al-Jamāl b. al-Shams b. al-Sharaf, al-Manūfī, then al-Māzānī. He took the Qurʾānic readings (qirāʾāt) from Jaʿfar in the year 852. Our shaykh (Ibn Ḥajar) attested as a witness on his ijāza and described him as "the virtuous, learned, brilliant scholar"; he (our shaykh) was also the shaykh of his father and grandfather.
