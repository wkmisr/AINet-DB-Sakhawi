translation:
  ja: ムハンマド・ブン・イスマーイール・ブン・アビー・ヤズィード、イエメン出身でマッカの人。父については前述した。（8）75年にそこ（マッカ）で生まれた。私（サハーウィー）から理解と伝承の両面で聴聞した者の一人であり、それどころかマッカで、また預言者の庭（ラウダ・ナバウィーヤ）でも私に『シャマーイル』などを読誦した。彼は抜きん出た有徳の人で、父と同じくカーディーの講義に常時出席している。
  en: Muḥammad b. Ismāʿīl b. Abī Yazīd, of Yemeni origin, al-Makkī; his father has been mentioned above. He was born there in the year (8)75. He was among those who heard from me with both understanding and transmission (dirāya wa-riwāya); indeed he read al-Shamāʾil to me in Mecca and also at the Prophet's Rawḍa, and other things besides. He is distinguished and accomplished, a constant attendant at the qāḍī's lessons like his father.
