translation:
  ja: ファトフッラー・ブン・ファラジュッラー・ブン・ハサン・シャー・ブン・イブラーヒーム、アル＝ブルハーン・アブー・アル＝ハイル・ブン・アッ＝ディヤー・アビー・アル＝カースィム・ブン・アル＝アラー・ブン・アル＝ブルハーン・アル＝カラフリー——（このニスバは）イスファハーンの村カラに由来する——、キルマーン生まれ・キルマーン在住、シャーフィイー派、マッカの寓居者。彼もまたマッカで私から聴聞した者の一人。
  en: Fatḥ Allāh b. Faraj Allāh b. Ḥasan Shāh b. Ibrāhīm, al-Burhān Abū al-Khayr b. al-Ḍiyāʾ Abī al-Qāsim b. al-ʿAlāʾ b. al-Burhān al-Karahlī — a nisba to Karah, a village of Iṣfahān — al-Kirmānī by birth and residence, the Shāfiʿī, resident of Mecca. He too is one of those who heard from me in Mecca.
