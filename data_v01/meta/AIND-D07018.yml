translation:
  ja: ムハンマド・アル＝ムヒッブ・アブー・バクル、前項の人物の兄弟。828年に生まれ、成長してアッ＝シャムス・ムハンマド・ブン・アリー・ブン・サラーフ・アル＝マナーウィーのもとでクルアーンを暗記し、843年に兄とともにマッカでアッ＝タキー・ブン・ファハドから聴聞した。自宅で製本業に携わり、公証人として生計を立てた。アブー・アッ＝タイイブ・アル＝アスユーティーが彼を同伴者としたので、それによって名士となった。893年ジュマーダー第一月に、その同伴者の死後まもなく没した。私は彼が60歳を越えていたと思う。
  en: Muḥammad al-Muḥibb Abū Bakr, brother of the preceding. He was born in the year 828 and grew up memorizing the Qurʾān with al-Shams Muḥammad b. ʿAlī b. Ṣalāḥ al-Manāwī, and he heard together with his brother in Mecca from al-Taqī b. Fahd in the year 843. He practised bookbinding at home and earned a living as a notary witness; Abū al-Ṭayyib al-Asyūṭī took him as his companion, and through that he became a man of standing. He died in Jumādā I 893, shortly after his companion; I think he had passed sixty.
