translation:
  ja: アブドゥルバースィト・ブン・ウマル・ブン・アブドゥルアズィーズ・アル＝アンサーリー・アル＝マダニー。先に言及したアル＝バドル・ハサンの兄弟であり、バキーア墓地にあるアッバースのクッバ（廟）の奉仕者である。マディーナにて私（サハーウィー）からハディースを聴聞した。
  en: ʿAbd al-Bāsiṭ ibn ʿUmar ibn ʿAbd al-ʿAzīz al-Anṣārī al-Madanī. He is the brother of the aforementioned al-Badr Ḥasan, and the caretaker of the Dome of al-ʿAbbās in al-Baqīʿ. He is among those who heard hadith from me (al-Sakhāwī) in Medina.
