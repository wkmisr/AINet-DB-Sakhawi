  summary:
    ar: أبو بكر بن أبي الفتح محمد بن محمد تقي الكازروني
  note:
    ja: '「الآتي أبوه」＝クンヤ部 #AIND-D10856「أبو بكر بن الشيخ فتح الدين أبي الفتح محمد بن محمد تقي بن عبد السلام الكازروني المدني الشافعي أخو الشمس محمد وعبد السلام وأبو بكر أصغرهم وأمه فاطمة ابنة أبي اليمن المراغي . ولد سنة سبع وأربعين بالمدينة」（未受領）。見出しナサブ（أبي الفتح محمد بن محمد تقي）が一致。同じクンヤ部に短い #AIND-D10792「أبو بكر بن أبي الفتح الكازروني المدني سبط أبي اليمن المراغي أمه فاطمة . سمع عليها في سنة ثمان وسبعين」があり同一人物の二重立項とみられる（§D131-4）。初版の汚染番号 TMP-P-000064（أبو بكر 汎用）を解消。'
