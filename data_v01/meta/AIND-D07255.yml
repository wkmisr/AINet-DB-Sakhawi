  note:
    ja: '「وقبل ذلك سمع على فاطمة ابنة أبي اليمن المراغي」＝#AIND-D13487（女性部「فاطمة ابنة الجمال أبي اليمن محمد بن الزين أبي بكر بن الحسين أم الحسين ابنة المراغي … وماتت في سنة ثمان وسبعين」）。父の本伝 #AIND-D10856 によれば彼女は本項主の父方祖母（「وأمه فاطمة ابنة أبي اليمن المراغي」）だが、本項には続柄の記載がないため grandmother relation は立てず note に留める（規則23）。初版は #NEEDID。'
- id: r3
  type: personal
  subtype: father
  active: AIND-D10856
  passive: AIND-D07255
  quote: أبوه
  note:
    ja: '「الآتي أبوه」＝クンヤ部 #AIND-D10856「أبو بكر بن الشيخ فتح الدين أبي الفتح محمد بن محمد تقي بن عبد السلام الكازروني المدني الشافعي أخو الشمس محمد وعبد السلام وأبو بكر أصغرهم وأمه فاطمة ابنة أبي اليمن المراغي . ولد سنة سبع وأربعين بالمدينة」（未受領）。見出しナサブ（أبي الفتح محمد بن محمد تقي）が一致。同じクンヤ部に短い #AIND-D10792「أبو بكر بن أبي الفتح الكازروني المدني سبط أبي اليمن المراغي أمه فاطمة . سمع عليها في سنة ثمان وسبعين」があり同一人物の二重立項とみられる（§D131-4）。初版の汚染番号 TMP-P-000064（أبو بكر 汎用）を解消。'
translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アビー・アル＝ファトフ・ムハンマド・ブン・ムハンマド・タキー・ブン・ムハンマド・ブン・ルーズバ、アル＝カーザルーニー・アル＝マダニー。その父は後述。先祖と同様にイブン・タキーとして知られる。マディーナで私から聴聞した者の一人で、それ以前にアブー・アル＝ヤマン・アル＝マラーギーの娘ファーティマから聴聞した。
  en: Muḥammad b. Abī Bakr b. Abī al-Fatḥ Muḥammad b. Muḥammad Taqī b. Muḥammad b. Rūzba al-Kāzarūnī al-Madanī; his father comes below. Like his forebears he was known as Ibn Taqī. He is among those who heard from me in Medina, and before that he heard from Fāṭima bt. Abī al-Yaman al-Marāghī.
