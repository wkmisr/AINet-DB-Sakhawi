translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アビー・アル＝ファトフ・ムハンマド・ブン・ムハンマド・タキー・ブン・ムハンマド・ブン・ルーズバ、アル＝カーザルーニー・アル＝マダニー。その父は後述。先祖と同様にイブン・タキーとして知られる。マディーナで私から聴聞した者の一人で、それ以前にアブー・アル＝ヤマン・アル＝マラーギーの娘ファーティマから聴聞した。
  en: Muḥammad b. Abī Bakr b. Abī al-Fatḥ Muḥammad b. Muḥammad Taqī b. Muḥammad b. Rūzba al-Kāzarūnī al-Madanī; his father comes below. Like his forebears he was known as Ibn Taqī. He is among those who heard from me in Medina, and before that he heard from Fāṭima bt. Abī al-Yaman al-Marāghī.
