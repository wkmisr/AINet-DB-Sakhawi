translation:
  ja: アハマド・アッ＝シハーブ・アン＝ナフヤーイー。ヌーンをカスラ、ファーをスクーン、その後に重ねられたターを持つ[ニスバ]は、ナフヤーイという下エジプトの小都市に由来する。ザルバーニーとしても知られる。我らがシャイフ（イブン・ハジャル）は著書『インバーウ・アル＝グムル』の中で彼について、彼は高名なシャイフたちの下で著名な学生の一人であったが、その後ムアイヤディーヤ学院の法学部門に住み込み、しばらく証人職で生計を立て、43年に死去したと述べた。
  en: Aḥmad al-Shihāb al-Nafyāy, with a kasra on the nūn, a sukūn on the fāʾ, followed by a doubled tāʾ al-taḥtāniyya, a nisba to a small town in Lower Egypt called Nafyāy. He was also known as al-Zalbānī. Our shaykh (Ibn Ḥajar) stated in his work 『Inbāʾ al-Ghumr』 that he was one of the famous students of the elder shaykhs, then he resided in the jurisprudence department of al-Muʾayyadiyya, earned his living through the office of witness for some time, until he died in the year 843.
