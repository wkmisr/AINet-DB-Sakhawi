translation:
  ja: ウマル・ブン・アブドゥッラー・ブン・ムハンマド・ブン・スライマーン、アッ＝シラージュ・ブン・アル＝ジャマール、アッ＝ディムヤーティーのちアル＝カーヒリー、シャーフィイー派。法学者ムーサーの子アブドゥッラフマーンの姻戚（スィフル。婿または義兄弟）で、その父は前述。成長してクルアーンなどを読み、学問に従事し、ジャウク（合唱朗誦隊）で朗誦し、ティバーク（兵舎）で教え、人々、とくに（宮廷の）使用人たちやその類と交わった。マハッラのカーシフであるハイル・ベクのもとで事務を執り、良い書体で書き、諸機関の職に就き、アル＝カーフィヤジーのもとに通い、何度も巡礼を行い、私のもとにも通った。その話し方にはつかえがあった（あるいは、その言には留保を要する）。ダワーダールから侮辱を受けた後、（8）97年ラジャブ月にペストで没した。アッラーが彼を赦されますように。
  en: 'ʿUmar b. ʿAbd Allāh b. Muḥammad b. Sulaymān, al-Sirāj b. al-Jamāl, al-Dimyāṭī then al-Qāhirī, al-Shāfiʿī, the ṣihr (son-in-law or brother-in-law) of ʿAbd al-Raḥmān b. al-Faqīh Mūsā; his father was mentioned above. He grew up, read the Qurʾān and other texts, studied, recited in the choir (jawq), taught in the barracks (ṭibāq), and mixed with people, especially the servants and their like. He worked under Khayr Bak, the kāshif of al-Maḥalla, wrote a fine hand, held posts in various institutions, frequented al-Kāfiyājī, performed the pilgrimage more than once, and frequented me. There was a hesitancy in his speech (or: his statements call for reservation). He died of the plague in Rajab (8)97 after having been humiliated by the dawādār; may God pardon him.'
