translation:
  ja: アフマド・ブン・アビー・アル＝ファトフ・ブン・イスマーイール・ブン・アリー・ブン・ムハンマド・ブン・ダーウード、シハーブ・アッ＝ディーン、アル＝バイダーウィー・アル＝マッキー・アッ＝ザムザミー、シャーフィイー派。彼は後述されるムハンマドの兄弟であり、両人の父（アブー・アル＝ファトフ）も後述される。848年に生まれ、『アル＝ミンハージュ』などを暗記し、カーディー・アブド・アル＝カーディルに聴聞し、ムアッズィン職に就いた。
  en: Aḥmad b. Abī al-Fatḥ b. Ismāʿīl b. ʿAlī b. Muḥammad b. Dāwūd, Shihāb al-Dīn al-Bayḍāwī al-Makkī al-Zamzamī al-Shāfiʿī, brother of the forthcoming Muḥammad; their father (Abū al-Fatḥ) is also treated below. He was born in 848 H, memorized al-Minhāj and other works, heard from al-Qāḍī ʿAbd al-Qādir, and served as a muezzin.
