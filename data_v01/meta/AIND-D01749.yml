translation:
  ja: アフマド・アッ＝シハーブ・アル＝ハラビー・アル＝ハンバリー、ハーズークとして知られる。ハラブ（アレッポ）でハンバリー派のカーディー職を何度も務め、835年にイブン・アッ＝ラッサームによって解任（後任交代）された。その後、復職を求めてカイロに入ったが、しばらくは叶わなかった。（帰路）ダマスカスで病に倒れ、病のために輿に乗ってハラブに入った。ほどなくして838年に亡くなった。我らがシャイフ（イブン・ハジャル）も彼について言及している。
  en: Aḥmad al-Shihāb al-Ḥalabī al-Ḥanbalī, known as Khāzūq. He repeatedly held the office of qāḍī of the Ḥanbalīs in Aleppo and was dismissed in 835 H, being replaced by Ibn al-Rassām. He then entered Cairo seeking reinstatement, which did not come about for some time. On his return he fell ill in Damascus and entered Aleppo in a litter because of his illness. He remained a short while, then died in 838 H. Our shaykh (Ibn Ḥajar al-ʿAsqalānī) also mentioned him.
