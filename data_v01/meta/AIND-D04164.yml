translation:
  ja: アブドゥルカーディル・ブン・ウマル・アル＝マールディーニー。ダマスカスに起源を持ち、カイロに住んだ。宝石商（アル＝ジャウハリー）。バルクーク・マドラサ（アル＝バルクーキーヤ）の居住者であり、そのスーフィーの一人であった。アル＝ビカーイーの宿敵であった。おそらく（ヒジュラ暦）880年頃に没した。
  en: ʿAbd al-Qādir b. ʿUmar al-Māridīnī, of Damascus origin, resident of Cairo, the jeweler (al-Jawharī). He resided in al-Barqūqiyya and was one of its Sufis. He was an opponent of al-Biqāʿī. He died presumably around 880 AH.
