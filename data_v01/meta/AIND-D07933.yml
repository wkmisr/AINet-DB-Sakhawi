  note:
    ja: '「بعد قتل أخيه في سنة ثلاث وعشرين كما تقدم」＝823 年に殺された兄弟（名は原文になし）。ただし「كما تقدم」の指す父の本伝 #AIND-D04834 では 823 年に殺されたのは父 أبو سعيد عثمان 自身で「وأقام عوضه ولده」（宰相 عبد العزيز اللبابي #AIND-D04015 による）。原文どおり「أخيه」で立て（規則25）、矛盾は ISSUES §D147-2 に。初版は active・desc とも空。'
- id: r3
