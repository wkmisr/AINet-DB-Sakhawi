  passive: AIND-D07933
  note:
    ja: 「استقر فيها بعد قتل أخيه」＝殺された兄弟の後にファースの支配者となった（規則29、原文どおり兄弟を前任者とする）。父の本伝では前任者は父（#AIND-D04834）。ISSUES §D147-2。
