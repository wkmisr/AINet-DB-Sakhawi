notes:
- text: 'マリーン朝（بنو مرين）のスルターン。兄弟 #AIND-D03517「عبد الحق بن أبي سعيد عثمان بن أحمد … سلطان فاس」（869 没）は本項で名指しされないため relation は立てない（規則23）。#AIND-D03522「عبد الحق بن محمد بن عثمان بن مرين المريني صاحب فاس」はナサブ上本項主の子とも読めるが、サハーウィー自身が「وقال غيره انه ابن عثمان بن أحمد كما مضى」と保留しており relation は立てない。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・ウスマーン・ブン・アフマド・ブン・イブラーヒーム・ブン・アリー・ブン・ウスマーン・ブン・ヤアクーブ・ブン・アブド・アル＝ハック、アブー・アブド・アッラー・ブン・アビー・サイード、アル＝マリーニー。父は前述。ファースの主（支配者）。前述のとおり、（8）23年に兄弟が殺された後、そこ（ファース）に（支配者として）据わった。
  en: Muḥammad b. ʿUthmān b. Aḥmad b. Ibrāhīm b. ʿAlī b. ʿUthmān b. Yaʿqūb b. ʿAbd al-Ḥaqq, Abū ʿAbd Allāh b. Abī Saʿīd, al-Marīnī; his father has been mentioned above. Lord of Fez. He was established there after the killing of his brother in the year [8]23, as mentioned before.
