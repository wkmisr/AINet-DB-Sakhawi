  note:
    ja: '「الماضي أبوه」＝corpus 本伝 #AIND-D04834「عثمان بن أحمد بن إبراهيم بن علي بن عثمان بن يعقوب بن عبد الحق أبو سعيد ملك الغرب وصاحب فاس … والد أبي عبد الله محمد أقام على سلطنة فاس وما والاها نحو ثلاث وعشرين سنة وثلاثة أشهر ثم قتله وزيره عبد العزيز اللبابي الماضي في سنة ثلاث وعشرين وأقام عوضه ولده」（ナサブ7代一致、子 أبو عبد الله محمد を名指し、未受領）。初版は #NEEDID。'
