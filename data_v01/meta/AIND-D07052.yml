- text: '【集約】本項主の別出候補: #AIND-D05407（علي بن محمد بن أبي بكر … العلاء … الحسيني الدمشقي、852年生）本文「والطب عن حكيم الدين الشيرازي والمولى قطب الدين السمرقندي」の医学の師 قطب الدين السمرقندي は、ラカブ・ニスバが本項主と一致する。本項に医学の記述がなく名＋ニスバのみの一致のため規則26 により同定・relation は立てない（内容B L）。§D116-3（نعمة الله）は #NEEDID 維持で閉じた。'
