translation:
  ja: イブラーヒーム・ブン・アリー・ブン・アビー・サイード・アル＝ブルハーン・ブン・アル＝アラー・アル＝マールディーニー、クルアーン朗誦教師。彼（シャハーウィー）に聞いたところによると、アッ＝シャハーブ・アフマド・ブン・ラマダーン・アル＝ハラブリー・アッ＝ダリールのもとでマルディンで朗誦学を完成させたという。
  en: Ibrāhīm b. ʿAlī b. Abī Saʿīd al-Burhān b. al-ʿAlāʾ al-Mārdīnī, the Qurʾān reciter. As he (al-Sakhāwī) told me, he perfected recitation (Qurʾān) under al-Shihāb Aḥmad b. Ramaḍān al-Ḥalabī al-Ḍarīr in Mardin.
