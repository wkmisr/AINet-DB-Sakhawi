translation:
  ja: ムハンマド・ブン・アブドゥルアズィーズ・ブン・アフマド・ブン・カースィム、ナースィル・アッ＝ディーン、アブー・アル＝ファラジュ、アッ＝タミーミー、マグリブ出自でマディーナの人、マーリク派。美しい声の持ち主で、イブン・カースィムとして知られる。ヒジュラ暦857年にマディーナに生まれ、そこで育ってクルアーンを暗記し、マスウード・アル＝マグリビーのもとで法学とアラビア語学を少し学んだ。私（サハーウィー）がマディーナに滞在（ムジャーワラ）していた際にはさまざまな事柄で私に師事し、私たちはそこで彼の美しい詠唱を聴いた。彼はカイロにたびたび赴いた。
  en: Muḥammad b. ʿAbd al-ʿAzīz b. Aḥmad b. Qāsim, Nāṣir al-Dīn, Abū al-Faraj, al-Tamīmī, of Maghribī origin, of Medina, the Mālikī, of sweet voice, known as Ibn Qāsim. He was born in the year 857 in Medina and grew up there; he memorized the Qurʾān and studied a little jurisprudence and Arabic with Masʿūd al-Maghribī. He attended me (al-Sakhāwī) closely in various matters during my stay (mujāwara) in Medina, and we heard his fine chants there. He entered Cairo repeatedly.
