translation:
  ja: トゥーガーン・アル＝ウマリー・アル＝ムアイヤディー（アル＝ムアイヤド・シャイフのマムルーク）。フシュカダム治世の初期に十人隊長（アミール・アシャラ）に任命され、872年のシャー・スワール戦役（アル＝ワキア・アル＝スワーリーヤ）で戦死した。享年は70歳に近かった。
  en: Ṭūghān al-ʿUmarī al-Muʾayyadī [Shaykh], mamluk of al-Muʾayyad Shaykh. He was appointed as an emir of ten at the beginning of the reign of Khushqadam until he was killed in the battle against Shah Suwar in the year 872 AH, having approached the age of seventy.
