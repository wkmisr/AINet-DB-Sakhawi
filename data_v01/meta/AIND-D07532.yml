translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・アフマド・ブン・イスマーイール、アル＝ムヒッブ・イブン・アッ＝タキー・イブン・アル＝クトゥブ、カルカシャンダを本貫とするアル＝カーヒリー・アッ＝シャーフィイー。その父と祖父は前述。父が彼の教育に心を砕き、我らがシャイフ（イブン・ハジャル）やイブン・アル＝フラートらのもとに彼を出席させた。諸書を暗記して一団の人々に提示し、アル＝バハー・アル＝マシュハディーらのもとで学問に励んだ。おそらく870年より後に没した。神が彼に楽園をもって報いたまわんことを。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Aḥmad b. Ismāʿīl, al-Muḥibb b. al-Taqī b. al-Quṭb, of Qalqashanda origin, al-Qāhirī al-Shāfiʿī. His father and grandfather have been mentioned above. His father took care of him and had him attend (the sessions of) our shaykh (Ibn Ḥajar), Ibn al-Furāt and others. He memorised several books, presented them to a number of scholars, and studied under al-Bahāʾ al-Mashhadī and others. He died, presumably, after 870. May God recompense him with Paradise.
