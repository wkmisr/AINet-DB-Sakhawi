translation:
  ja: アブドゥルラフマーン・ブン・アフマド・ブン・ハサン・ブン・アリー・ブン・ムハンマド・ブン・ムハンマド・ブン・アブドゥルラフマーン・アル＝アズルイ。イマーム・シハーブ・アッ＝ディーンの一族の兄弟の一人。イブン・マンジャクと親交を結び、ダマスカスのアル＝ムナイビウで没した。
  en: ʿAbd al-Raḥmān b. Aḥmad b. Ḥasan b. ʿAlī b. Muḥammad b. Muḥammad b. ʿAbd al-Raḥmān al-Adhruʿī. One of the brothers from the family of al-Imām Shihāb al-Dīn. He was closely associated with Ibn Manjak, and died in al-Munaybiʿ in Damascus.
