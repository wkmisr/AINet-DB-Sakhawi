translation:
  ja: ヤフヤー・ブン・アブド・アル＝ガニー・ブン・ムハンマド・アル＝ハーンキー。父は既出。女奴隷から生まれた子で、聡明で利発であり、クルアーンを暗記し、（8）94年に父とともにマッカに滞留していたとき、私（サハーウィー）に『ウムダ』を読んだ。二人は我々のあとそこにもう一年とどまり、6年の初めに戻って来たが、ほどなく同年ジュマーダー第二月2日に没し、父は彼を失って悲嘆にくれた。神が二人に天国をもって償いたまわんことを。彼は成年に達していたか、それに近かったと思う。
  en: Yaḥyā b. ʿAbd al-Ghanī b. Muḥammad al-Khānkī, whose father was mentioned earlier. A boy born of a slave woman, intelligent and sharp, he memorized the Qurʾān and read the ʿUmda to me (al-Sakhāwī) when he sojourned with his father in Mecca in the year [8]94. The two of them stayed on there after us for another year, then came back at the beginning of the year six; but it was not long before he died on 2 Jumādā II of that year, and his father was grief-stricken at his loss; may God compensate them both with Paradise. I think he had reached puberty or was close to it.
