translation:
  ja: アフマド・アッ＝シハーブ・アッ＝サワ。彼はアリー・ブン・イブラーヒーム・アル＝ハラビーの子で、殺された者（アル＝マクトゥール）の甥にあたる。アッ＝サワの渾名を持ち、詩作があった。その一部は（後述の）ウバイドゥッラー・ブン・アブドゥッラーの項で挙げられる。実際、890年以降メッカにおいて、アル＝ʿイッズ・ブン・ファフドが彼からその詩の一部を書き取っている。
  en: Aḥmad al-Shihāb al-Ṣawa. He is the son of ʿAlī b. Ibrāhīm al-Ḥalabī, the nephew (son of the brother) of the slain man. He was nicknamed al-Ṣawa and composed poetry. Some of it is cited in the entry for ʿUbayd Allāh b. ʿAbd Allāh (mentioned later). Indeed, al-ʿIzz b. Fahd recorded some of his poetry from him in Mecca after 890 H.
