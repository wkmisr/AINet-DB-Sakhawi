translation:
  ja: アリー・ブン・ユースフ・ブン・アリー・ブン・アフマド、アル＝アラー。ダマスカス出身（元来はバスラ系）、シャーフィイー派。ダマスカスにおけるムフティー（法意見表明官）の一人であり、副判事を務め、多くの者より優れた理解力を示して講義（教授）を行ったアブー・アル＝バカー・ムハンマドの父親である。
  en: ʿAlī b. Yūsuf b. ʿAlī b. ʿAmr, al-ʿAlāʾ. Originally from Basra, based in Damascus, Shāfiʿī. He was one of the muftis of Damascus, and the father of Abū al-Baqāʾ Muḥammad. He served as a deputy judge (nāʾib al-qāḍī) and taught in Damascus, with his understanding preferred over many others.
