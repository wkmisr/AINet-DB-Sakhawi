translation:
  ja: ムーサー・ブン・ムハンマド・ブン・カバー、アッ＝シャラフ、礼拝時刻計算員（アル＝ムワッキト）、アル＝ハリーリーの姉妹の子。天文学（イルム・アル＝ハイア）においてシリアに残る者の中で最も優れ、この技術について有益な著作があったが、彼は自分をこの学問にも他のどの学問にも帰属させず、むしろ人々から離れて隠棲し、自分に関わりのないことに立ち入らないことを良しとする善人であった。タンキズ・モスクなどの首席ムアッズィン職を手中にしていた。（80）7年ムハッラム月に没した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Mūsā b. Muḥammad b. Qabā, al-Sharaf, the timekeeper (al-muwaqqit), the sister's son of al-Khalīlī. He was the best of those remaining in Syria in the science of astronomy (ʿilm al-hayʾa) and had useful works in this art, although he did not attribute himself to this or any other science; rather he was a good man who preferred withdrawal from people and not entering into what did not concern him. He held the headship of the muezzins at the Mosque of Tankiz and elsewhere. He died in Muḥarram of the year (80)7. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
