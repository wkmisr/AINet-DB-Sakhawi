translation:
  ja: ムハンマド・ブン・アブドゥルアズィーズ、チュニスの首長。838年に没した。イブン・アズムはそのように記したが、私は、たとえ没年がそのとおりでないにせよ、彼は前述の、祖父がアフマド・ブン・ムハンマド・ブン・アビー・バクルである者のことだと思う。
  en: Muḥammad b. ʿAbd al-ʿAzīz, chief of Tunis. He died in the year 838. So Ibn ʿAzm wrote it, and I think he is the one mentioned above among those whose grandfather is Aḥmad b. Muḥammad b. Abī Bakr, even if his death was not as stated there.
