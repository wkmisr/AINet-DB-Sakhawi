translation:
  ja: アリー・ブン・ムハンマド・ブン・アラー、アル＝アラー・アッ＝ディマシュキー・アル＝ハナフィー、イブン・アル＝ハリーリー。739年に生まれ、ハナフィー派の学問に従事し、シーラ（預言者伝）とマガーズィー（遠征記）の暗記に努めて、その多くをそらんじていた。アッ＝シハーブ・アル＝ガッズィーが彼の娘を娶って婿となった。813年に没し、その娘もほどなくして亡くなった。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: ʿAlī b. Muḥammad b. ʿAlāʾ, al-ʿAlāʾ al-Dimashqī al-Ḥanafī, Ibn al-Ḥarīrī. Born in 739, he studied according to the Ḥanafī school and devoted himself to memorizing the sīra and maghāzī, retaining a great deal of them. Al-Shihāb al-Ghazzī became his son-in-law by marrying his daughter. He died in 813, and his daughter survived him only a little. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
