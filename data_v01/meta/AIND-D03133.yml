notes:
- text: '名のみの項（生没年・事績の記載なし）。転送の語はなく実項。同じナサブ・ニスバをもつ項に #AIND-D03559「عبد الرحمن بن أحمد بن سليمان الجلال بن الشهاب بن المحيوي أو العلمي الأنصاري الاسنائي ثم القاهري الشافعي … ويعرف بابن العكم … لقب لجده علم الدين」（786年生・868年没）とその子 #AIND-D00811 がある（ニスバ索引 #AIND-D11430「الأسنائي … ويقال له الأسنوي أيضا」）。本項主が D03559 の兄弟である可能性はあるが、本項にも相手側にも名指しがないので relation は立てない（規則23・26）。'
