translation:
  ja: ウスマーン・ブン・アフマド・ブン・ウスマーン・ブン・アフマド、アル＝ファフル、アル＝カシュトゥーヒー、のちアル＝カーヒリー。その父は前出。クルアーンと諸書を暗記し、他の者たちとともにそれらを私（サハーウィー）に提示した者の一人で、いくつかの講義に出席した。その後、父と同じくアスタダールのタグリー・ビルディーへの奉仕に専従した。
  en: ʿUthmān b. Aḥmad b. ʿUthmān b. Aḥmad, al-Fakhr, al-Kashṭūkhī, then al-Qāhirī. His father was mentioned above. He was among those who memorized the Qurʾān and some books and presented them to me (al-Sakhāwī) along with others, and he attended some lessons. Then, like his father, he devoted himself to the service of Taghrī Birdī al-Ustādār.
