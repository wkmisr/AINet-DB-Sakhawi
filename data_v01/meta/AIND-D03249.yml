translation:
  ja: スィーバーイ・アッ＝ザーヒリー・ジャクマク、第三厩舎長（アミール・アーフール・サーリス）かつ左翼侍従（ハージブ・マイサラ）。880年ラマダーン月に没し、スルターンが自ら下って来てサビール・アル＝ムウミニーで彼のために葬礼を行った。伝えられるところでは善良な人物であった。
  en: Sībāy al-Ẓāhirī Jaqmaq, third amīr ākhūr and chamberlain of the left (ḥājib maysara). He died in Ramaḍān 880; the sultan came down and prayed over him at Sabīl (Muṣallā) al-Muʾminī. He was, it is said, a good man.
