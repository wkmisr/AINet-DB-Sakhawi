translation:
  ja: イブラーヒーム・ブン・カルマシュ・アル＝カルミー・アル＝カーヒリー。元来アル＝カルミー出身で、カイロに住むマムルーク商人。父と同様に、スルターン・アル＝アシュラフの側近の一人で、裕福になったが、アル＝アシュラフの死後、没落した。しかし良い評判と威厳をもって言及された。カルマシュ家のアミールたちも彼の父に属する。856年に80歳を超えて亡くなった。アミール・ハリールの息子、アル＝ザイン・アブドゥルバーシトが、彼（イブラーヒーム）の叔母の夫であったことから、この情報をもたらした。
  en: Ibrāhīm b. Qarmash, originally al-Qarmī, residing in Cairo, was a Mamluk merchant like his father. He was one of al-Ashraf's intimates, who became wealthy but declined after al-Ashraf's death. He was remembered favorably and with dignity. The Qarmashī amirs are attributed to his father. He died in the year 856, having exceeded eighty years of age. Al-Zayn ʿAbd al-Bāsiṭ b. al-Amīr Khalīl, who was his paternal aunt's husband, provided this information.
