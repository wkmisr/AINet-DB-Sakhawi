notes:
- text: '転送見出し（原文「فيمن جده محمد بن علي على ما يحرر」による）。転送先は #AIND-D06552「محمد بن إبراهيم بن محمد بن علي الشمس بن الظهير بن المطهر على ما يحرر الجزري الدمشقي . سمع من ابن الخباز وغيره … مات في تاسع عشر شوال سنة ثلاث عن ستين سنة . ذكره شيخنا في أنبائه وفي معجمه」（未受領。祖父「محمد بن علي」・家名「ابن المطهر」が一致）。「على ما يحرر」（要精査）というサハーウィーの留保は転送先の見出しにも同じ形である＝家名 ابن المطهر（ないしナサブ）についての留保で、転送先の特定には影響しない。'
