translation:
  ja: ジャクマク・アル＝アルグーン・シャーウィー・アッ＝ダワーダールはダマスクスの副知事を務め、その地でウマイヤ・モスクの隣にジャクマキーヤとして知られるマドラサを建設した。その後、彼はアル＝ムアイヤドの忠誠から離反し、彼に起きたことが起きた。 私は言う、彼（サハーウィー）は彼以前の人物である。
  en: Jaqmaq al-Arghūn Shāwī al-Dawādār held the deputyship of Damascus, and there, next to the Umayyad Mosque, he built a madrasa known as al-Jaqmaqiyya. Afterwards, he rebelled against al-Muʾayyad, and what happened to him happened. I [al-Sakhāwī] say that he is the one mentioned before him.
