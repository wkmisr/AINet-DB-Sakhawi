notes:
- text: 'Waka 裁定（2026-10-05、要判断_B99-103 ★5）: 候補が2つ（#AIND-D05552 القلصاوي／#AIND-D05332 الفهري البسطي）あり「ابن」の後の名が脱落しているため確定できず、規則26 により target="#NEEDID"。以下は校閲時の記録。転送見出し（原文末尾の指示「هو ابن مضى」＝「彼は既出の ابن（…）である」による。「ابن」の後の名が刊本で脱落している）。転送先の最有力候補は #AIND-D05552（علي بن محمد بن محمد بن علي أبو الحسن القرشي الأندلسي البسطي … المالكي ويعرف بالقلصاوي、アンダルス・バスタ出身のマグリブ人学者。corpus には同人への転送見出し #AIND-D05573「علي بن محمد بن محمد أبو الحسن البسطي . مضى فيمن جده محمد بن علي」・#AIND-D05575「… القلصاوي الحيوب هو البسطي مضى …」がある）。別候補として #AIND-D05332（علي بن عيسى بن محمد العلاء … الفهري البسطي、819年没、ルーム・クリミアで没）も「علي … البسطي」で既出のため、cert medium とし要判断 §D101-5。初版は「مضى」を人名（マダー）と誤読して father relation を立てていた。'
