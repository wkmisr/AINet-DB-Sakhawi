translation:
  ja: アハマド・イブン・ムハンマド・イブン・アハマド・イブン・アリー・イブン・ハサン・アル＝バーリーニー、後にアッ＝タラーブルスィー・アッ＝シャーフィイー。彼はアル＝タージュ・イブン・ズフラの弟子で、「イブン・アッ＝シャイフ・アリー」として知られている。彼は私（サハーウィー）からアル＝ムサルサルをその条件付きで聴聞し、私（サハーウィー）にアル＝ブハーリーを朗誦し、また一部を聴聞した。同様に、アン＝ナシャーウィーやアッ＝ダイミーその他から聴聞した。そして私（サハーウィー）は彼にイジャーザを与えた。
  en: Aḥmad b. Muḥammad b. Aḥmad b. ʿAlī b. Ḥasan al-Bārīnī, then al-Ṭarābulusī al-Shāfiʿī. He was a student of al-Tāj b. Zuhra and was known as Ibn al-Shaykh ʿAlī. He is among those from whom I (al-Sakhāwī) heard al-Musalsal with its conditions, and he read al-Bukhārī to me, and also heard some of it from me. Likewise, he heard from al-Nashāwī, al-Daymī, and others. And I (al-Sakhāwī) granted him ijāza.
