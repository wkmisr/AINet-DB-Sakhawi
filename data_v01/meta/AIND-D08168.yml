  note:
    ja: '見出しナサブの祖父 أبو اليمن محمد بن محمد بن علي بن أحمد بن عبد العزيز＝#AIND-D08912「محمد بن محمد بن علي بن أحمد بن عبد العزيز بن القسم بن عبد الرحمن ابن عبد الله الأمين أبو اليمن بن الجمال أبي الخير بن النور الهاشمي العقيلي النويري المكي الشافعي والد علي وعمر الماضيين … ولد … سنة ثلاث وتسعين وسبعمائة بمكة」（未収録。ナサブ5代＋クンヤ一致、「والد علي」で閉合、規則37。同番号の派生 #AIND-D08912a は別人 الجمال أبو المحامد）。初版なし。'
notes:
- text: 'マッカの النويري 家。母は原文になし（父 D05550 の妻として女性部 #AIND-D13462 فاطمة ابنة عمر بن أبي راجح … زوج القاضي نور الدين علي بن أبي اليمن があるが、本項主の母とは特定できない）。父方祖母＝#AIND-D13364 عيناء（「والدة القاضي نور الدين علي بن أبي اليمن」）。同父の幼児死の姉妹: #AIND-D13009 خديجة ابنة علي بن أبي اليمن（851没）・#AIND-D13453 فاطمة ابنة علي بن أبي اليمن（850没）、弟＝次項 #AIND-D08169 محمد أبو اليمن（858没）。'
