translation:
  ja: ムハンマド・ブン・アリー・ブン・アビー・アル＝ヤマン・ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アフマド・ブン・アブドゥルアズィーズ、アブー・アル＝マヤーミン・アン＝ヌワイリー・アル＝マッキー。（8）52年の末に、生後2か月に満たずに没した。
  en: Muḥammad b. ʿAlī b. Abī al-Yaman Muḥammad b. Muḥammad b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz, Abū al-Mayāmin al-Nuwayrī al-Makkī. He died before completing two months (of age) at the end of the year [8]52.
