notes:
- text: 'マッカの النويري 家。母は原文になし（父 D05550 の妻として女性部 #AIND-D13462 فاطمة ابنة عمر بن أبي راجح … زوج القاضي نور الدين علي بن أبي اليمن があるが、本項主の母とは特定できない）。父方祖母＝#AIND-D13364 عيناء（「والدة القاضي نور الدين علي بن أبي اليمن」）。同父の幼児死の姉妹: #AIND-D13009 خديجة ابنة علي بن أبي اليمن（851没）・#AIND-D13453 فاطمة ابنة علي بن أبي اليمن（850没）、弟＝次項 #AIND-D08169 محمد أبو اليمن（858没）。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・アリー・ブン・アビー・アル＝ヤマン・ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アフマド・ブン・アブドゥルアズィーズ、アブー・アル＝マヤーミン・アン＝ヌワイリー・アル＝マッキー。（8）52年の末に、生後2か月に満たずに没した。
  en: Muḥammad b. ʿAlī b. Abī al-Yaman Muḥammad b. Muḥammad b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz, Abū al-Mayāmin al-Nuwayrī al-Makkī. He died before completing two months (of age) at the end of the year [8]52.
