  note:
    ja: 見出しナサブの父＝#AIND-D05550「علي بن محمد بن محمد بن علي بن أحمد بن عبد العزيز بن القسم بن عبد الرحمن … نور الدين أبو الحسن بن الأمين أبي اليمن بن الجمال أبي الخير العقيلي النويري المكي المالكي أخو عمر الآتي … ويعرف بابن أبي اليمن . ولد في شعبان سنة خمس عشرة وثمانمائة بمكة」（未収録。ナサブ6代＋クンヤ أبو اليمن（祖父）＋ニスバで閉合、規則37。転送見出し D05682「علي بن أبي اليمن . مضى في ابن محمد بن محمد بن علي بن أحمد」も同人）。初版なし。
