notes:
- text: '転送見出し（原文末尾「مضى فيمن جده يوسف」による）。転送先は #AIND-D08224「محمد بن علي بن يوسيف الشمس بن النور القاهري والد سعد الدين محمد الآتي ويعرف بابن الجندي … وكذا يعرف بالذهبي . ولد سنة إحدى وعشرين وثمانمائة … فمات فجأة في شعبان سنة سبع وثمانين」（祖父名は刊本では「يوسيف」の綴り＝原文どおり（規則25）。子 #AIND-D08969「محمد بن محمد بن علي بن يوسف سعد الدين بن الشمس الذهبي」のナサブでは يوسف。ラカブ الشمس・通称 الذهبي が一致）。'
