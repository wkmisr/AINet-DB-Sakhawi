translation:
  ja: アリー・ブン・アフマド・ブン・ハリール・ブン・アフマド・ブン・アービド、アン＝ヌール、アル＝マグリビー、シャーフィイー派。イブン・アービド（バーの文字）として知られる。アン＝ナジュム・ブン・カーディー・アジュルーンに学んだ者の一人で、店で商売をして生計を立てた。
  en: ʿAlī b. Aḥmad b. Khalīl b. Aḥmad b. ʿĀbid, al-Nūr al-Maghribī, the Shāfiʿī, known as Ibn ʿĀbid (with the letter bāʾ). He was among those who studied under al-Najm b. Qāḍī ʿAjlūn, and he earned his living by trade in a shop.
