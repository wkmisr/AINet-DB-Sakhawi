translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ウマル・アル＝バイダムリー。良い育ち方をし、クルアーンを読み、詩を詠み、アミールとなり、ハーッス（スルターン私財庁）の実務を執った。諸事に通じていた。（80）6年ラビーウ第二月に没した。我らの師（イブン・ハジャル）がその『インバー』で述べたことである。
  en: Muḥammad b. Ibrāhīm b. ʿUmar al-Baydamurī. He had a good upbringing, read the Qurʾān, composed poetry, became an amir and administered the Khāṣṣ (the sultan's privy fisc); he had knowledge of affairs. He died in Rabīʿ II of the year [80]6. Our shaykh (Ibn Ḥajar) said this in his Inbāʾ.
