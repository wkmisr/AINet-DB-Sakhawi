  ja: アリー・ブン・ダーウード・ブン・ムハンマド、アル＝ハワージャー・アル＝アラー・アッ＝ルーミー、のちアル＝マッキー。856年ラジャブ月に同地（マッカ）で没し、ムアッラー墓地に自ら用意していた墓所に埋葬された。イブン・ファハドが彼に言及している。
  en: ʿAlī b. Dāwūd b. Muḥammad al-Khawājā al-ʿAlāʾ al-Rūmī, then al-Makkī. He died there (in Mecca) in Rajab of the year 856 and was buried in a tomb he had prepared for himself in al-Muʿallā. Ibn Fahd mentioned him.
