translation:
  ja: ムハンマド・ブン・イスマーイール・ブン・アビー・バクル、アル＝ジャマール・ブン・アッ＝シャラフ、ジャバルト出身でイエメン・ザビードの人。父から（スーフィーの道統を）受け、父はアル＝ジャマール・ムハンマド・ブン・ムハンマド・アル＝マズジャージーから、彼は導師（ダーイヤ）イスマーイール・アル＝ジャバルティーから受けた。アブドゥッラー・ブン・アブド・アル＝ワッハーブ・アル＝カーザルーニー・アル＝マダニーが彼と会い、私（サハーウィー）に、彼が今ザビードのスーフィーの長であり、まだ壮年に達していないと語った。
  en: Muḥammad b. Ismāʿīl b. Abī Bakr, al-Jamāl b. al-Sharaf, of Jabartī origin, al-Yamānī al-Zabīdī. He received (the Sufi path, khidma) from his father, his father from al-Jamāl Muḥammad b. Muḥammad al-Mazjājī, and he from the dāʿiya Ismāʿīl al-Jabartī. ʿAbd Allāh b. ʿAbd al-Wahhāb al-Kāzarūnī al-Madanī met him and told me that he is now the shaykh of the Sufis in Zabīd and that he has not yet reached middle age.
