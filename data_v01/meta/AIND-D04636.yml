translation:
  ja: アブドゥッラー・ブン・ムハンマド、アル＝ジャマール・アル＝カラーフィー。アブー・アル＝ハサン・アル＝アンダルスィーからアラビア語学を学んで熟達し、最も容易な道筋でイウラーブ（語尾変化の解析）の知識に到達できる簡潔な入門書を著した。多くの人々が彼から益を受け、そのなかには我らの師イブン・ヒドルがいる。サハラー（カイロの砂漠墓地）のタンバディーヤの長（シャイフ職）に就いた。826年ラビーウ・アル＝アウワル月に没した。タンバディーヤを彼から引き継いだのは我らの師アル＝ヒンナーウィーであると私は思う。我らの師（イブン・ハジャル）は『インバー』で彼の伝記を簡潔に記している。
  en: ʿAbd Allāh b. Muḥammad, al-Jamāl al-Qarāfī. He took Arabic grammar from Abū al-Ḥasan al-Andalusī and became proficient in it, and he composed a fine introduction by which one reaches knowledge of iʿrāb by the easiest route. A number of people benefited from him, among them our shaykh Ibn Khiḍr. He held the shaykhship of al-Ṭanbadiyya in the Ṣaḥrāʾ (the desert cemetery of Cairo). He died in Rabīʿ al-Awwal of the year 826. I think the one who took over al-Ṭanbadiyya after him was our shaykh al-Ḥannāwī. Our shaykh (Ibn Ḥajar) gave him a brief biography in his Inbāʾ.
