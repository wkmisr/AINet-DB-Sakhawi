translation:
  ja: アブー・ヌマイの子、アブー・ドゥアイジュの子、アブー・スワイドの子、ジルバーンの子、シャリーフ・アル＝ハサニーのアフマド。 彼がムハッラムの26日、水曜日の夜、862年にハイフ・バニー・シャディードで亡くなり、メッカに運ばれてそこに埋葬されたことを、イブン・ファハドは記している。
  en: Aḥmad b. Jilbān b. Abī Suwayd b. Abī Duʿayj b. Abī Numay, al-Sharīf al-Ḥasanī. He died on the night of Wednesday, the 26th of Muharram in the year 862 AH, in Khayf Banī Shadīd, and was transported to Mecca where he was buried. Ibn Fahd recorded this.
