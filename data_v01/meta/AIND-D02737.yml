translation:
  ja: フサイン・ブン・ムハンマド・ブン・イスマーイール・アル＝ヒンディー、のちにアル＝マッキー。アル＝イッズ・イブン・ジャマーアからその『大マナースィク』の一部（原文قلعة=قطعةの誤記か）を聴聞し、ムアイヤド朝の治世（ムアイヤド・シャイフ期）の末にカイロに来た。「私の子らにイジャーザを与えた」とわがシャイフ（イブン・ハジャル）が述べており、彼以外の者のもとでは（この人物への言及を）見ていない。先にフサイン・ブン・アフマド・ブン・ムハンマド・ブン・ナースィル・アル＝ヒンディー、のちにアル＝マッキーが出ているが、同一人物ではないかと思う。要精査（フユハッラル）。
  en: Ḥusayn b. Muḥammad b. Ismāʿīl al-Hindī, then al-Makkī. He heard from al-ʿIzz b. Jamāʿa a portion (reading qalʿa as qiṭʿa) of his greater Manāsik, and came to Cairo at the end of the Muʾayyadī reign. 'He granted an ijāza to my children' — so said our shaykh (Ibn Ḥajar), and I have not seen him [mentioned] by anyone else. Ḥusayn b. Aḥmad b. Muḥammad b. Nāṣir al-Hindī then al-Makkī has already appeared, and I think he is the same person; to be verified.
