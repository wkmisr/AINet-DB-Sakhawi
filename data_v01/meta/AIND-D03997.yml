translation:
  ja: アブドゥルアズィーズ・ブン・ムハンマド・ブン・アブドゥルワッハーブ、アル＝イッズ・ブン・アビー・アル＝カースィム・ブン・アッ＝タージュ・アル＝ウスマーニー——師アブー・アル＝ファトフ・アル＝マラーギーの筆跡による——アッ＝タフターウィー、のちにアル＝マッキー。855年とそれ以降にアブー・アル＝ファトフ・アル＝マラーギーに聴聞した。ダール・アル＝イマーラの布商（バッザーズ）で、恵まれた人物であり、ペルシア（アジャム）に入って財をなした者の一人。867年サファル月、マグリブの礼拝を終えた後にモスクでメッカにて急死した。神が彼を赦したまえ。イブン・ファフドがその没年を記録している。
  en: ʿAbd al-ʿAzīz b. Muḥammad b. ʿAbd al-Wahhāb, al-ʿIzz b. Abī al-Qāsim b. al-Tāj al-ʿUthmānī—as written in the hand of his teacher Abū al-Fatḥ al-Marāghī—al-Ṭahṭāwī, then al-Makkī. He heard from Abū al-Fatḥ al-Marāghī in 855 AH and afterwards. He was a cloth merchant (bazzāz) at Dār al-Imāra, a blessed man, one of those who went to Persia and made money there. He died suddenly in Mecca, in the mosque after his sunset prayer, in Ṣafar 867 AH; may God forgive him. Ibn Fahd recorded the date of his death.
