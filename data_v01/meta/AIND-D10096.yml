translation:
  ja: ムーサー・ブン・ムハンマド、アッ＝シャラフ・アル＝アズィーズィー、のちアル＝カーヒリー、アル＝アズハリー、アッ＝シャーフィイー、代理カーディーの一人。アル＝アッバーディーから教授とファトワー発行の許可を与えられた者の一人であるが、彼は無頓着な人物である。（8）90年代の某年にマフマル（巡礼隊）のカーディー職に就いた。
  en: Mūsā b. Muḥammad, al-Sharaf al-ʿAzīzī, then al-Qāhirī, al-Azharī, al-Shāfiʿī, one of the deputy judges. He was among those whom al-ʿAbbādī authorized to teach and issue fatwās, but he is a careless man. He held the judgeship of the pilgrimage caravan (maḥmal) in the year [8]90-something.
