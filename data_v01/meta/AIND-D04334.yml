translation:
  ja: アブド・アッ＝ラティーフ・ブン・アリー・アル＝マハッリー・アル＝バルタージー・アル＝アフマディー・アッ＝シャーフィイー。父から学び、巡礼して804年に（マッカに）滞在（ムジャーワラ）し、イブラーヒーム・アッ＝ザフラーニーから我らが主アフマド（・アル＝バダウィー）の行伝（マナーキブ）をいくらか聴聞した。彼はその行伝や事績を多く暗記していた。イブン・アル＝ムニールが彼から学び、831年以降に没したと述べている。
  en: ʿAbd al-Laṭīf b. ʿAlī al-Maḥallī al-Baltājī al-Aḥmadī al-Shāfiʿī. He studied under his father, performed the pilgrimage and sojourned (in Mecca) in the year 804, and heard from Ibrāhīm al-Zahrānī something of the Manāqib of Sīdī Aḥmad (al-Badawī); he used to memorize much of his manāqib and his states. Ibn al-Munīr studied under him and said that he died after the year 831.
