translation:
  ja: アフマド・アン＝ナフリー。ヌーンはダンマで、あるいは世間の口の端に上っているとおりファトハで読み、その後に点付きの字（ハー خ）が無母音で続く。チュニス出身で、その学者・ムフティー・賢人たちの一人であり、多くの有識者が彼から益を得た。チュニスでの証人職と兼任して、チュニス管区のバニー・ザルト（ビゼルト）のカーディー職に就いた。873年に疫病で死去した。彼のシャイフには、ウマル・アル＝カルシャーニー、イブン・アカーブ、ヤアクーブ・アッ＝ザアビーがいる。
  en: Aḥmad al-Nakhlī. The nūn is pronounced with a ḍamma, or with a fatḥa as is common on people's tongues, followed by a dotted letter (khāʾ) with sukūn. From Tunis, one of its scholars, muftis, and wise men, from whom many eminent individuals benefited. He held the office of qadi in Banī Zart (Bizerte), a district of Tunis, while also serving as a witness in Tunis. He died of the plague in 873. Among his shaykhs were ʿUmar al-Qalashānī, Ibn ʿAqāb, and Yaʿqūb al-Zaʿbī.
