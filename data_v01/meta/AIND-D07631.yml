translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン、アブー・マンスール・アル＝マーリディーニー・アル＝マクディスィー、ハナフィー派。アル＝マイドゥーミーに聴聞し、彼から『ジュズ・アル＝ビターカ』を聴聞によって伝承した。それをアッ＝タキー・アブー・バクル・アル＝カルカシャンディーが彼から聴聞した。〔八百〕二年ムハッラム月二十五日に没した。
  en: Muḥammad b. ʿAbd al-Raḥmān, Abū Manṣūr al-Māridīnī al-Maqdisī al-Ḥanafī. He heard from al-Maydūmī and transmitted on his authority Juzʾ al-Biṭāqa by audition (samāʿ); al-Taqī Abū Bakr al-Qalqashandī heard it from him. He died on the twenty-fifth of Muḥarram in the year [8]02.
