translation:
  ja: ヤフヤー・ブン・ムハンマド・ブン・ムハンマド・ブン・アブド・アッラー・ブン・アル＝バルディーニー。ハナフィー派のカーディー、ナースィル・アッ＝ディーン・アル＝アフミーミーの娘と結婚し、父の諸職を継ぎ、彼女とともにハッバーニーヤのザイニー・アル＝ウスターダールのマドラサに住んだ。岳父の口添えで、シャーフィイー派（大カーディー）が新たに任じた代理カーディーの一人となった。
  en: Yaḥyā b. Muḥammad b. Muḥammad b. ʿAbd Allāh b. al-Bardīnī. He married the daughter of the Ḥanafī qāḍī Nāṣir al-Dīn al-Akhmīmī, succeeded his father in his posts, and lived with her in al-Ḥabbāniyya, in the madrasa of al-Zaynī al-Ustādār. Through the good offices of his father-in-law he became one of the deputies of the Shāfiʿī (chief qāḍī) whom the latter newly appointed.
