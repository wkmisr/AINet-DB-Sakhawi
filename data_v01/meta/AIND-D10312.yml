notes:
- text: '見出しは「بن البرديني」（父の項は「الشمس البرديني」）＝原文どおり full に「بن」を残した。初版の affiliation madhhab（Shafi''i）は原文にない（「نواب الشافعي」はシャーフィイー派大カーディーの代理の意で、本項主の学派を直接述べる句ではない）＝除去し、ここに記録（父 D08883 は الشافعي）。没年の記載なし。ニスバ索引 #AIND-D11473「البرديني … ومحمد بن محمد بن عبد الله صاحب الزين الأستادار」は父を挙げる。'
