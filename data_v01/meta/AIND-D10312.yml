    ja: '規則3・37。父＝corpus 本伝 #AIND-D08883「محمد بن محمد بن عبد الله الشمس البرديني ثم القاهري الشافعي . حفظ القرآن وسمع من شيخنا ثم مني وخالط الأكابر وتردد للزين عبد الباسط بل اختص بالزين الأستادار … وهو خطيب جامع الحبانية وإمامه . مات في يوم الثلاثاء ثاني عشر ذي الحجة سنة تسعين … بعد أن زوج ابنه لابنة القاضي ناصر الدين الأخميمي الحنفي」（repo 未収録）。見出しナサブ3代＋ニスバに加え、相手側本文の「息子をカーディー・ナースィル・アッ＝ディーン・アル＝アフミーミーの娘と結婚させた」が本項と一致＝閉合。ブリーフは「父」を挙げるのみ（番号なし）＝自分で引いた。初版は #NEEDID。'
