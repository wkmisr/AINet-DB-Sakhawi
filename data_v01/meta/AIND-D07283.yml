translation:
  ja: ムハンマド・ブン・バハードゥル・アッ＝ラティーフィー。イエメンのアミールの一人で、ウサーブなどで代官（ナーイブ）を務め、善き人々を愛した。819年に没した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Muḥammad b. Bahādur al-Laṭīfī. One of the amirs in Yemen; he served as deputy (nāʾib) in Wuṣāb and elsewhere, and was fond of the people of piety. He died in the year 819. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
