  note:
    ja: '父＝ #AIND-D11146「فخر الدين بن السكر والليمون القبطي ولي نظر الديوان المفرد ثم نظر الدولة وتزوج خديجة ابنة التقي البلقيني بعد ناصر الدين النبراوي ومات عنها في سنة خمس وسبعين بعد أن أولدها إبرهيم الماضي وكان حين موته مميزا」（ラカブ部の単独項、未収録）。ラカブ・ニスバ・通称 ابن السكر والليمون・妻 خديجة・子 إبراهيم で閉合（規則57）。「القبطي أبوه」＝ニスバ القبطي は父にかかる（コプト出身）。父の職（نظر الديوان المفرد・نظر الدولة）は本項主の state にしない。初版の TMP-P-001420（太田氏「فخر الدين القبطي」Note「AIND-D00360の母」←誤り）は D11146 と名寄せ要（ISSUES §D159-4）。'
