translation:
  ja: イブラーヒーム、サアド・アッディーン・ブン・ファフル・アッディーン。父はコプト（出身）で、イブン・アッ＝スッカル・ワ・ッ＝ライムーンとして知られる。母はハディージャ、タキー（・アッディーン）・ブン・バドル（・アッディーン）・ブン・スィラージュ（・アッディーン）・アル＝ブルキーニーの娘。864年ラジャブ月に生まれ、母の庇護のもとで育ち、書記術の訓練を受けた。機密書記長とその息子が彼の母に目をかけていたため、一時その門に仕えた。その後、アミールたちの何人かに仕えた。その職務における巧みさと賢さ、そして熱心さで知られる。最近、少し前に述べたシャラフ・イブラーヒーム・ブン・ムハータの後任としてサルガトミシュ学院のワクフ（管理）に就いたが、彼のアミールが度々彼に罰金を科し、没落しかけた。
  en: Ibrāhīm Saʿd al-Dīn b. Fakhr al-Dīn; his father was a Copt (al-Qibṭī), and he is known as Ibn al-Sukkar wa-l-Laymūn. His mother was Khadīja, daughter of al-Taqī b. al-Badr b. al-Sirāj al-Bulqīnī. He was born in Rajab 864 and grew up under his mother's care. He trained in scribal writing and was for a time at the gate of the confidential secretary (kātib al-sirr) and his son, because of their regard for his mother; then he served some of the amirs. He is noted for skill and intelligence in his field, together with diligence. He has recently been appointed, after al-Sharaf Ibrāhīm b. Mukhāṭa, mentioned shortly before, to the awqāf of al-Ṣarghatmishiyya, but his amir subjected him to fines time after time, and he nearly collapsed.
