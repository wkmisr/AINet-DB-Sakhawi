translation:
  ja: ウマル・ブン・ムハンマド・ブン・イブラーヒーム・ブン・アッバース、アッ＝ザイン、アル＝マルダーウィー・アル＝マクディスィー・アッ＝サーリヒー。（7）93年にアッ＝ザイン・アブド・アッ＝ラフマーン・ブン・ムハンマド・ブン・アッ＝ラシードから『アブー・ムスヒルのヌスハ』とそれに付随するものを、またアブドゥッラー・ブン・ハリール・アル＝ハラスターニーからヤアクーブ・ブン・シャイバの『アンマールのムスナド』第1部の後半などを聴聞した。ハディースを伝え、優れた学者たちが彼から聴聞した。（8）52年に私にイジャーザを与え、その後に没した。神よ彼を憐れみたまえ。
  en: ʿUmar b. Muḥammad b. Ibrāhīm b. ʿAbbās, al-Zayn, al-Mardāwī al-Maqdisī al-Ṣāliḥī. In the year (7)93 he heard from al-Zayn ʿAbd al-Raḥmān b. Muḥammad b. al-Rashīd the Nuskha of Abū Mushir and what goes with it, and from ʿAbd Allāh b. Khalīl al-Ḥarastānī the second half of the first part of the Musnad of ʿAmmār by Yaʿqūb b. Shayba, and other things. He transmitted ḥadīth, and learned men heard from him. He granted me ijāza in the year (8)52 and died after that; may God have mercy on him.
