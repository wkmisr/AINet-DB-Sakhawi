translation:
  ja: アフマド・アッ＝シハーブ・イブン・アッ＝シャリーファ、アル＝クドスィー（エルサレム出身）、後にアル＝マッキー（メッカ定住）。彼はムハンマド・イブン・ムハンマド・イブン・アル＝マウラーの子孫である。書物などの商いで生計を立て、詩作などに才があり、我らがシャイフ（イブン・ハジャル）などを称賛した。873年ズー・アル＝ヒッジャ月にメッカで没した。
  en: Aḥmad al-Shihāb b. al-Sharīfa, al-Qudsī then al-Makkī. He was the son of Muḥammad b. Muḥammad b. al-Mawlā. He earned his living dealing in books and other goods, and had a talent for poetry and the like, with which he praised our shaykh (Ibn Ḥajar) and others. He died in Mecca in Dhū al-Ḥijja 873 H.
