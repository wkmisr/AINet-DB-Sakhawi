  en: Mālik al-ʿArabī al-Maghribī, one of the students of ʿAlī al-Wazrawālī (mentioned above). He died in the year 870 between the two Sanctuaries (Mecca and Medina). He was a righteous man. A certain Maghribī informed me (al-Sakhāwī) of this.
