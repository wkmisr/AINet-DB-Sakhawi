translation:
  ja: アフマド・ブン・ユースフ・アル=バーニヤースィー、後にアッ=ディマシュキー、クルアーン朗誦者。諸伝承（ローマ）で朗誦し、770年（代）よりアル=ファフルの学友の一部やその他の人々からハディースを聴聞した。803年シャアバーン月に70歳で死去した。我らがシャイフ（イブン・ハジャル）が自著『インバーゥ・アル=グムル』で彼に言及している。ある者たちは彼の祖父をムハンマドと呼んだ。
  en: Aḥmad b. Yūsuf al-Bānyāsī, then al-Dimashqī, the Qurʾān reciter. He recited in the [canonical] transmissions and heard ḥadīth from the year 70 (the 770s) onward from some of the companions of al-Fakhr and others. He died in Shaʿbān 803 AH at the age of 70. Our shaykh (Ibn Ḥajar) mentioned him in his 『Inbāʾ al-Ghumr』. Some referred to his grandfather as Muḥammad.
