translation:
  ja: アフマド・ブン・アブドゥッラフマーン・ブン・アブドゥッラフマーン・アッ＝シハーブ・ブン・アッ＝サーリフ・アル＝クドワ・バラカット・アル＝ムスリミーン・アッ＝ザイン・アッ＝ダファリー・アル＝マーリキー。聖者アル＝イラーキーは、彼（アフマド）が彼（アル＝イラーキー）から諸事を聞いた後、ヒジュラ暦818年に彼（アフマド）にイジャーザ（学業免許）を与えた。
  en: Aḥmad b. ʿAbd al-Raḥmān b. ʿAbd al-Raḥmān al-Shihāb b. al-Ṣāliḥ al-Qudwa Barakat al-Muslimīn al-Zayn al-Dafarī al-Mālikī. Al-Walī al-ʿIrāqī granted him an ijāza in the year 818 H, after he (the subject) had heard from him.
