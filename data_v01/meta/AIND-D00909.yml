translation:
  ja: アブドゥッラーの子ムハンマドの子アフマド・ブン・アフマド・アッ＝ルーミー、後述。 彼（アフマド）の兄弟はムハンマドで、彼らの父。彼（アフマド）は時に兄弟（ムハンマド）と共に証人として座り、また時に飲料などの商人として活動していた。彼は兄弟よりも遥かに優れていた。80年代（ヒジュラ暦880年代）の終わり頃に亡くなった。
  en: Aḥmad b. ʿAbd Allāh b. Muḥammad b. Aḥmad al-Rūmī, mentioned below. His brother was Muḥammad, and their father. He (Aḥmad) sometimes sat as a witness with his brother, and sometimes worked as a merchant in drinks and the like. He was far better than his brother. He died approximately shortly after the eighties (880s AH).
