translation:
  ja: アフマド・ブン・ムハンマド・ブン・アリー、アッ＝シハーブ・ブン・アッ＝シャムス・アル＝カーヒリー・アル＝ファーディリー・アッ＝ダリール。アブド・アルアズィーズ・アッ＝ズライカシーの兄弟で、イブン・アル＝ジュンディーの婿として、またイブン・アッ＝ラキークとして知られた。飲酒を嗜む者の一人であったが、商売をして人々と善良さと誠実さをもって交わり、善良な人々や学者たちを慕った。兄よりも暮らし向きがよかった。八八七年ズー・アルカアダ月八日に亡くなり、金曜日の夜に埋葬された。アッラーの慈悲が彼にありますように。
  en: Aḥmad b. Muḥammad b. ʿAlī, al-Shihāb b. al-Shams al-Qāhirī al-Fāḍilī al-Ḍarīr. He was the brother of ʿAbd al-ʿAzīz al-Zuraykashī and was known as the son-in-law of Ibn al-Jundī and as Ibn al-Raqīq. He was one of those who drank wine, yet he traded and dealt with people with goodness and rectitude, and was fond of the righteous and the learned. He was better off than his brother. He died on the 8th of Dhū al-Qaʿda in the year 887 H and was buried on Friday night. May God have mercy on him.
