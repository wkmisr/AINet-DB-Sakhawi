notes:
- text: 本項主の名は原文では「محمد تقي الدين الهيثمي」のみ。ナサブ（بن عبد الكريم بن محمد بن علي …）は直前の項 D07725 による（原文にないため persName full には入れない）。「ولكنه غير مرضي مع فاقته وإتلافه لما ورثه من أبيه」＝（証人として）満足すべき者ではなく、貧窮し、父から相続したものを蕩尽した（人物評）。「وأظنه انتسب حنبليا」＝ハンバル派に帰属したと思う（أظنه＝affiliation cert medium）。
  lang: ja
  type: editorial
translation:
  ja: ムハンマド、タキー・アッ＝ディーン、アル＝ハイサミー。直前の者の兄弟で、年少のほうである。証人（公証人）たちとともに（店に）座ったが、貧窮と、父から相続したものを蕩尽したことから、満足すべき者ではなかった。私（サハーウィー）は彼がハンバル派に帰属したと思う。
  en: Muḥammad, Taqī al-Dīn, al-Haythamī, brother of the preceding and the younger of the two. He sat with the notary witnesses, but was not satisfactory, given his poverty and his squandering of what he had inherited from his father; I (al-Sakhāwī) think he affiliated himself with the Ḥanbalī school.
