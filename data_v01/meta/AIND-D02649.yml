translation:
  ja: ハサン・ブン・ナービト・ブン・イスマーイール・ブン・アリー・アル＝バドル・アッ＝ザムザミー・アル＝マッキー。彼は『アル＝バハジャ』と『アル＝アルフィーヤ』を暗記し、これらを学者たちに提示して、相続法と算術において傑出した。彼はその両方を親族のヌール・アル＝ディーンから学び、礼拝時刻学（ミーカーツ）については親族のアル＝ジャマール・ムハンマド・ブン・アビー・アル＝ファトフから学んだ。また、シリア（シャーム）などを訪れた。
  en: Ḥasan b. Nābit b. Ismāʿīl b. ʿAlī al-Badr al-Zamzamī al-Makkī. He memorized al-Bahja and al-Alfiyya and presented them to a group of scholars. He excelled in inheritance law (al-farāʾiḍ) and arithmetic (al-ḥisāb), learning both of them from his relative Nūr al-Dīn. He studied timekeeping (al-mīqāt) with his relative al-Jamāl Muḥammad b. Abī al-Fatḥ. He also entered Syria (al-Shām) and other regions.
