translation:
  ja: イスカンダル・シャー・ブン・アミールザ・ウマル・シャイフ・ブン・ティムール・レンクは884年に死去した。彼は（後述する）ムハンマドの兄弟であり、812年に兄が殺害された後、ペルシアのシーラーズを統治する王となった。彼は兄の殺害者を引き出し、叱責した。殺害者は彼に「私はあなたから善行しか知りませんでした。もし私が彼を殺さなければ、あなたは王国に到達できなかったでしょう。」と答えた。そこでイスカンダル・シャーは、彼が（殺害を）唆したと言われるのを防ぐために、たとえ実際にはそうではなかったとしても、直ちに殺害者を処刑した。これは818年の出来事であった。
  en: Iskandar Shah, son of Amīrzā ʿUmar Shaykh, son of Tīmūrlank, died in 884 AH. He was the brother of Muḥammad (to be mentioned later) and became king of Shīrāz in Persia after his brother was killed in the year 812 AH. He brought forth his brother's killer and admonished him. The killer responded, "I knew nothing but good from you; had I not killed him, you would not have reached the kingdom." So, Iskandar Shah hastened to execute him to prevent accusations of instigation, even though it was not by his doing. This occurred in the year 818 AH.
