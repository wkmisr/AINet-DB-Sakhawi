translation:
  ja: アフマド・イブン・マスウード・イブン・ハーシム・イブン・アリー・イブン・マスウード・イブン・ガズワーン・イブン・フサイン、ラカブはシハーブ、クンヤはアブー・ハーミド、ニスバはハーシミー、マッキー。彼はシャイフ・アブー・サアド・ムハンマド・イブン・アリー・イブン・ハーシム・アル＝アーニーの父方の従兄弟である。805年ラビーウ・アル＝アウワル17日水曜日の午後に生まれた。イブン・ファハドが彼について言及しているが、それ以上の記述はない。
  en: Aḥmad b. Masʿūd b. Hāshim b. ʿAlī b. Masʿūd b. Ghazwān b. Ḥusayn, al-Shihāb Abū Ḥāmid al-Hāshimī al-Makkī. He was a paternal cousin of al-Shaykh Abū Saʿd Muḥammad b. ʿAlī b. Hāshim al-Ānī. He was born after the afternoon prayer on Wednesday, the 17th of Rabīʿ al-Awwal in the year 805 AH. Ibn Fahd mentioned him but added nothing further.
