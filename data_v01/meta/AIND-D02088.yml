translation:
  ja: アイタミシュ、（もとは）アルダバースィー、次いでナースィリー・ファラジュ、さらにムアイヤディーを称した。 ムアイヤド（・シャイフ）によって解放され、スルターンのマムルーク（親衛隊）の一人となった。その後（ムアイヤドの死後）昇進し、ハースィキーとなり、次いでアジーズの時代に十人隊長（アミール・アシャラ）となった。そしてザーヒル（ジャクマク）の時代に、ムガルバーイ・アル＝ジャクマキーの後任としてウスターダール・アル＝スフバに就任した。851年サファル月に死去するまでその職にあった。彼については、自らには浪費的でありながら、けちで勇気に欠けていたと伝えられている。
  en: Aytamish, (originally) of Ardbāsī, then al-Nāṣirī Faraj, then al-Muʾayyadī. He was manumitted by al-Muʾayyad (Shaykh) and became one of the royal mamluks. He then rose after him (after al-Muʾayyad), becoming a khāṣṣakī, then an amīr ʿashara (commander of ten) during the reign of al-ʿAzīz. During the reign of al-Ẓāhir (Jaqmaq), he became Ustādār al-Ṣuḥba, succeeding Mughalbāy al-Jaqmaqī. He continued in this position until his death in Ṣafar 851 H. It was said that he was extravagant with himself despite his stinginess and lack of courage.
