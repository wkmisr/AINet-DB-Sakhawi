translation:
  ja: アフマド・ブン・ムハンマド・ブン・アリー・ブン・ハサン。出自はマールディーン、次いでカラク出身、のちハーンカー（ハーンキー）に属した。「イブン・スマイト」という通称で知られた。アシュラフィーヤ・マドラサで門番を務め、さらにはそこの修理費用の会計官も務めた。研究を好み、訪問者への応対も良かった。882年のラマダーン月に逝去された。アッラーが彼を許されますように。
  en: Aḥmad b. Muḥammad b. ʿAlī b. Ḥasan, originally from Mārdīn, then from al-Karak, then associated with al-Khānqāh, and known as Ibn Sumayṭ. He served as the gatekeeper of al-Madrasa al-Ashrafiyya at al-Khānqāh, and was also responsible for the expenditures on its construction, alongside his passion for scholarship and service to visitors. He died in Ramaḍān in the year 882 H. May God forgive him.
