translation:
  ja: ハサン・ブン・ハリル・ブン・アリー・ブン・ハサン・ブン・ユースフ・ブン・ハーズィム・ブン・ハーシム、バドル、アンサーリー、ハズラジー、サアディー、ウバーディー、ビカーイー、ジャディーシー、シャーフィイー派、ベイルートの寄留者。790年頃に生まれ、850年頃に没したと推定される。ビカーイーがそう述べている。
  en: Al-Hasan ibn Khalil ibn 'Ali ibn Hasan ibn Yusuf ibn Khazim ibn Hashim, al-Badr, al-Ansarī al-Khazrajī al-Saʿdī al-ʿUbādī al-Biqa'ī al-Jadīthī, Shafi'i, resident of Beirut. He was born around 790 AH, and died around 850 AH, according to al-Biqa'ī.
