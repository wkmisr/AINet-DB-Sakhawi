translation:
  ja: ヤフヤー・ブン・ムハンマド・ブン・マスウード・ブン・ウスマーン・ブン・ムハンマド・ブン・アビー・ファーリス。祖父の後を継いだが、のち父方の従兄弟アブド・アル＝ムウミン・ブン・イブラーヒーム・ブン・ウスマーンが彼を殺してその地位に就いた。その後、上述のヤフヤーの子ザカリーヤーがチュニスの民の助けでひそかに彼のもとへ入り込み、アブド・アル＝ムウミンは西方へ逃れた。人々が彼とともに集結してチュニスを包囲したが、チュニスの民がこれを破り、双方の間に多くの死者が出た。その大半はアラブ（遊牧民）であった。内乱は89X年にはなお続いていたが、のち鎮まった。
  en: Yaḥyā b. Muḥammad b. Masʿūd b. ʿUthmān b. Muḥammad b. Abī Fāris. He succeeded his grandfather; then his paternal cousin ʿAbd al-Muʾmin b. Ibrāhīm b. ʿUthmān killed him and took his place. Thereafter Zakariyyā, son of the aforesaid Yaḥyā, entered upon him secretly with the help of the people of Tunis, and ʿAbd al-Muʾmin fled to the west. Forces gathered with him to besiege Tunis, but its people defeated them, and there was great slaughter between them, most of the dead being Arabs (Bedouin). The strife was still going on in the year ninety-odd, and then it subsided.
