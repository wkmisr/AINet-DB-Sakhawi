translation:
  ja: '###$AIND-D01614 | 864961957257$# $ アフマド・イブン・ムハンマド、シャハーブ・アル＝カンジー・アル＝ディマシュキー。 アショーラーの日、894年（ヒジュラ暦）にルワーヒーヤ学院にて80歳近くで亡くなり、バーブ・アッ＝サギール墓地内のシャイフ・ハンマードの墓の南に埋葬された。彼は有徳で朗誦家であり、キラーサ学院でのクルアーン朗誦教師の一人であり、ダマスカス・モスクのマーリク派のミフラーブ（礼拝壁龕）での聴聞（ハディースの聴聞会）のシャイフでもあった。'
  en: '###$AIND-D01614 | 864961957257$# $ Aḥmad b. Muḥammad al-Shihāb al-Kanjī al-Dimashqī. He died on the Day of Ashura in 894 H at al-Madrasa al-Rawāḥiyya, having reached almost eighty years of age. He was buried south of Shaykh Ḥammād in the cemetery of Bāb al-Ṣaghīr. He was a righteous reciter, one of the two shaykhs of Qurʾān recitation at al-Madrasa al-Killāsa, and the shaykh of listening sessions at the Maliki mihrab in Jāmiʿ Dimashq.'
