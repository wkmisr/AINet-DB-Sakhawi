translation:
  ja: ウスマーン・ブン・ムハンマド、アル＝ファフル・ブン・ナースィル・アッ＝ディーン、ハラブのハージブ（侍従）。アミールの子たるアミールであり、イブン・アッ＝タッハーンとして知られた。（8）36年ムハッラム月中旬にハラブの郊外で没し、2日後にハラブへ運ばれて同地に埋葬された。我らがシャイフ（イブン・ハジャル）がその没年を記録している。
  en: ʿUthmān b. Muḥammad, al-Fakhr b. Nāṣir al-Dīn, the ḥājib (chamberlain) in Aleppo. He was an amīr and the son of an amīr, and was known as Ibn al-Ṭaḥḥān. He died in mid-Muḥarram (8)36 outside Aleppo, was brought there two days later, and was buried there. Our shaykh (Ibn Ḥajar) recorded his death.
