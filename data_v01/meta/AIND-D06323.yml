translation:
  ja: カラージャー・アル＝アシュラフィー・イーナール。キプロスの捕虜出身で、アッ＝タウィール（のっぽ）として知られる。ムカッダム（千人隊長）の一人。ハマーのナーイブ（総督）職に任じられ、そこにしばらく滞在したが、横暴に振る舞い傲慢であった。その後、大ダワーダールの怒りを買い、ベイト・アル＝マクディス（エルサレム）への追放を命じられた。そこに滞在し、885年の——推定ではサファル月に——没した。
  en: Qarājā al-Ashrafī Īnāl. He was among the captives of Cyprus and was known as al-Ṭawīl (the Tall). One of the muqaddams, he was appointed governor (nāʾib) of Ḥamāh, where he remained for a period, acting oppressively and arrogantly. Then the Grand Dawādār became angry with him and ordered his exile to Bayt al-Maqdis (Jerusalem), where he remained until he died, in Ṣafar — presumably — of the year 885.
