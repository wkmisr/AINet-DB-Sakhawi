translation:
  ja: スライマーン・アッ＝サウワーク、アル＝カラーフィー、アル＝マジュズーブ（恍惚の人）。人々は彼に過度の信仰を寄せ、彼には多くの霊的開示（ムカーシャファ）があった。（8）02年ラビーウ・アル＝アウワル月に没した。我らの師（イブン・ハジャル）が『インバーゥ』に彼の没年を記し、他の者は彼をサリームと名づけている。
  en: Sulaymān al-Sawwāq al-Qarāfī al-Majdhūb. People held an excessive belief in him, and he had numerous mystical disclosures. He died in Rabīʿ I of the year [8]02. Our shaykh (Ibn Ḥajar) recorded his death in his Inbāʾ, and others named him Salīm.
