    ja: '「وصاهر الأتابك على ابنته سبطة الظاهر جقمق」＝アターバクの娘（الظاهر جقمق の外孫）を娶った。女性部 #AIND-D13195「ستيتة ابنة الاتابك ازبك أخت محمد الماضي لأبيه وسبطة الظاهر جقمق أيضا أمها فاطمة . تزوجها قانصوه أمير آخور وكان الدخول بها والمهم في اثناء سنة اثنتين وتسعين . وولدت له ذكرا في أواخر سنة خمس وتسعين ولم يلبث أن مات المولود ثم هي في طاعون سنة سبع وتسعين」が本項主（أمير آخور）の妻を名指しし、その父＝الأتابك أزبك من ططخ（#AIND-D01869、872〜904年アターバク）。原文では「الأتابك」のみのため cert medium（規則23・26）。初版の統制外 subtype「other」#NEEDID を是正。 【集約 2026-10-25】相手側の本文が通称＋職で本項主を名指しして閉合する: #AIND-D01869「واستولدها عدة كالتي صاهر أمير اخور قانصوه خمسمائة عليها」、#AIND-D13409（فاطمة ابنة الظاهر جقمق＝أزبك の妻、ستيتة の母）「بعد تزوج قانصوه أمير آخور واحدة منهم」。よって cert を外した（規則37 の趣旨、内容A[5]、§D130-6）。子の数の差（本項「بعد ولديها」／D13195 一子）は note に留める。'
