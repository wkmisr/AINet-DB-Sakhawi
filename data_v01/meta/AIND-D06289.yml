translation:
  ja: カーンスーフ・アル＝アシュラフィー・カーイトバーイ、同じく（同名の別人）、ハムスミア（五百）として知られる。昇進して第二ダワーダール、次いでアミール・アーホールとなった。アターバクの娘、すなわちアッ＝ザーヒル・ジャクマクの外孫娘を娶ってその女婿となり、彼女との間に子をもうけたが、彼女は二人の子の後にペストで没した。その直後、898年に巡礼隊の長（アミール・アッ＝ラクブ）として巡礼した。
  en: Qānṣūh al-Ashrafī Qāytbāy, likewise (another of the same name), known as Khamsumiʾa (Five Hundred). He rose until he became second dawādār and then amīr ākhūr. He became son-in-law of the atābak by marrying his daughter, the daughter's daughter of al-Ẓāhir Jaqmaq, and had children by her; then she died in the plague after her two children. Immediately after that he made the pilgrimage as commander of the pilgrim caravan in the year 898.
