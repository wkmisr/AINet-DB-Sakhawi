translation:
  ja: アミール・マジュリス（評議会アミール）のバルスバーイ・カラー・アッ＝ザーヒリー・ジャクマク。ヒジュラ暦893年ズー・アル＝ヒッジャ月にアダナで没した。彼は人々の多くから悪くない人物とみなされていた。法学者や義人を敬う姿勢を示し、彼らに対して礼儀正しく接した。神が彼を慈しみ、赦されますように。
  en: Barsbāy Qarā al-Ẓāhirī Jaqmaq, the Amīr Majlis. He died in Dhu al-Ḥijjah in the year 893 in Adana. In the estimation of many of them, he was acceptable. He made a show of honoring the jurists and the righteous, and behaved politely with them. May God have mercy on him and forgive him.
