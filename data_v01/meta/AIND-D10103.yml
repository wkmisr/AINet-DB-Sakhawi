translation:
  ja: ムーサー・アル＝アッタール（荷担ぎ人）・アル＝ミスリー。後出のマルヤムの父であり、アル＝イッズ・ブン・ファハドの解放女奴隷（マウラー）の夫。（8）96年サファル月にマッカで没した。
  en: Mūsā al-ʿAttāl (the porter) al-Miṣrī, father of Maryam, who is mentioned below, and husband of the freedwoman (mawlāh) of al-ʿIzz b. Fahd. He died in Ṣafar of the year [8]96 in Mecca.
