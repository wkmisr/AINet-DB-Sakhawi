translation:
  ja: イブラーヒーム・ブン・アフマド・ブン・アーミル・アッ＝サアディー。彼は長い間シャイフとして生きたと言われている。一般イジャーザによりファフル・ブン・アル＝ブハーリーからハディースを伝えた。アッ＝タキー・アブー・バクル・アル＝カルカシャンディーが彼から伝承し、彼が815年頃まで生存していたと述べた。
  en: Ibrāhīm b. Aḥmad b. ʿĀmir al-Saʿdī. It is said that he lived for a long time as a shaykh. He transmitted ḥadīth with a general ijāza from al-Fakhr b. al-Bukhārī. Al-Taqī Abū Bakr al-Qalqashandī transmitted from him and stated that he lived until around the year 815 AH.
