translation:
  ja: アハマド・ブン・サアド・アル＝ヒンディー・アル＝マッキー。 قائد（指導者）。サイイド・バカラートのメッカ副知事を務め、その後、その息子にも仕えた。彼は背が高く、威厳があり、大胆であった。865年ムハッラム月8日の木曜日の夜に死去した。イブン・ファハドがその日付を記録した。
  en: Aḥmad b. Saʿd al-Hindī al-Makkī, known as al-Qāʾid (the Leader). He served as nāʾib (deputy) of Mecca for Sayyid Barakāt, and subsequently for Barakāt's son. He was tall, respected, and bold. He died on the night of Thursday, the 8th of Muḥarram, 865 AH. Ibn Fahd recorded this date.
