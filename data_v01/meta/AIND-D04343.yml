translation:
  ja: アブド・アッ＝ラティーフ・ブン・ムハンマド・ブン・アビー・バクル・ブン・ムハンマド・ブン・アビー・バクル・ブン・アル＝フサイン、アッ＝ザイン・イブン・アビー・アル＝ファドル・ブン・アッ＝ザイン・ブン・ナースィル・アッ＝ディーン・アビー・アル＝フトゥーフ・ブン・アッ＝ザイン、マラーガ出身の家系でマディーナの人、シャーフィイー派。マディーナで私（サハーウィー）から聴聞した者の一人。
  en: ʿAbd al-Laṭīf b. Muḥammad b. Abī Bakr b. Muḥammad b. Abī Bakr b. al-Ḥusayn, al-Zayn Ibn Abī al-Faḍl b. al-Zayn b. Nāṣir al-Dīn Abī al-Futūḥ b. al-Zayn, of Marāghī origin, the Medinan, the Shāfiʿī. He was among those who heard from me in Medina.
