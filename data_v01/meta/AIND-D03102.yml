    ja: '見出しナサブ「عبد الله بن أبي عبد الله محمد بن الرضى محمد بن أبي بكر بن خليل」＝#AIND-D04615「عبد الله بن أبي عبد الله محمد بن الرضي محمد بن أبي بكر بن خليل العسقلاني المكي . سمع التقي الحرازي وأجاز له عيسى الحجي والزين الطبري … مات في ربيع الآخر سنة خمس بمكة ودفن بالمعلاة وقد بلغ السبعين أو جازها . قاله الفاسي」（刊本 عبد الله 部 230 番、未収録）。ナサブ5代＋المكي が一致（規則37）。ニスバ「العسقلاني」は本家系の「العثماني」と食い違うが、repo では兄弟 #AIND-D07827 の father・甥 #AIND-D04591 の grandfather として既に #AIND-D04615 が充てられている（D04591 側 note「العسقلاني は العثماني の誤植とみられる」）＝先例どおり cert なし。初版は father なし。'
