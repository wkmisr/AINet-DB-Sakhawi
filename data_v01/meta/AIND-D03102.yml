notes:
- text: 'بنو خليل العثماني 家（マッカ）: 兄弟 #AIND-D07827「محمد بن عبد الله بن أبي عبد الله محمد بن الرضى محمد بن أبي بكر بن خليل القرشي الأموي العثماني المكي … أجاز له في سنة خمس العراقي والهيثمي وابن صديق والزين المراغي وعائشة ابنة ابن عبد الهادي」（830/831没）は同じ父 #AIND-D04615 の子だが、相手側に本項主への名指しがないため brother relation は立てない（規則23。父が AIND なので共通の父で導出できる。D07827 側も同じ扱い）。甥 #AIND-D04591、甥の子 #AIND-D07816、兄弟の娘 #AIND-D13177 も同家。初版の residence event（مكة）はニスバ المكي 由来で居住記述がないため除去（規則22(1)）。'
  lang: ja
  type: editorial
translation:
  ja: サイード・ブン・アブドゥッラー・ブン・アビー・アブドゥッラー・ムハンマド・ブン・アッ＝ラディー・ムハンマド・ブン・アビー・バクル・ブン・ハリール・ブン・イブラーヒーム・ブン・ヤフヤー・アル＝ウスマーニー・アル＝マッキー。（8）05年にイブン・スィッディーク、アッ＝ザイン・アル＝マラーギー、アーイシャ・ビント・イブン・アブドゥルハーディー、アル＝イラーキー、アル＝ハイサミーが彼にイジャーザを与えた。837年サファル月にマッカで没した。
  en: Saʿīd b. ʿAbd Allāh b. Abī ʿAbd Allāh Muḥammad b. al-Raḍī Muḥammad b. Abī Bakr b. Khalīl b. Ibrāhīm b. Yaḥyā al-ʿUthmānī al-Makkī. In the year [8]05 Ibn Ṣiddīq, al-Zayn al-Marāghī, ʿĀʾisha bint Ibn ʿAbd al-Hādī, al-ʿIrāqī, and al-Haythamī granted him an ijāza. He died in Ṣafar of the year 837 in Mecca.
