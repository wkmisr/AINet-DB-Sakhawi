translation:
  ja: アフマド・ブン・バルバーン・ブン・アブドゥッラー、アル＝シハーブ・アブー・アル＝アッバース・アル＝カマリー・アル＝ルゥルゥイー・アル＝ディマシュキー・アル＝ハンバリーン。ブルハーン・アル＝ハラビーは彼をハディース学者かつクルアーン朗誦者と評し、彼がクルアーンを暗記し、アフマド派（ハンバリー派）の法学書を記憶しており、美しい声でハディースを朗誦したと述べた。彼は839年にブルハーン・アル＝ハラビーを訪ね、彼に『イブン・マージャ』を朗読した。
  en: Aḥmad b. Balabān b. ʿAbd Allāh, al-Shihāb Abū al-ʿAbbās al-Qamarī al-Luʾluʾī al-Dimashqī al-Ḥanbalī. Al-Burhān al-Ḥalabī described him as a muḥaddith (hadith scholar) and muqriʾ (Qurʾān reciter), stating that he memorized the Qurʾān and retained his book on the Aḥmadī (Ḥanbalī) madhhab, and that he recited ḥadīth with a beautiful voice. He (the subject) visited al-Burhān al-Ḥalabī in the year 839 H and read Ibn Mājah to him.
