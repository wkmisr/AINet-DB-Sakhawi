translation:
  ja: イブラーヒーム・ブン・ヌーフ、後にアル＝カーヒリー、シャーフィイー派。彼はアル＝サフラーのイルバガ霊廟に住み、児童教育者であった。彼にクルアーンを朗誦した者の一人にアブー・アル＝スウード・アル＝グラキーがいる。
  en: Ibrāhīm b. Nūḥ, then al-Qāhirī, al-Shāfiʿī. He resided in Turbat Yalbāghā in al-Ṣaḥrāʾ and was a children's tutor. Among those who recited the Qurʾān to him was Abū al-Suʿūd al-Gharāqī.
