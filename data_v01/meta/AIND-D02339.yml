translation:
  ja: ジャー・アッラー・アル＝ハダバニー・アッ＝シャリーフ・アル＝ハサニー。876年シャアバーン月末にワーディー・アル＝アーバールで没し、マッカへ運ばれて埋葬された。イブン・ファハドも彼を列伝に記している。
  en: Jār Allāh al-Hadhabānī al-Sharīf al-Ḥasanī. He died at the end of Shaʿbān in 876 AH in Wādī al-Ābār and was carried to Mecca where he was buried. Ibn Fahd also recorded his biography.
