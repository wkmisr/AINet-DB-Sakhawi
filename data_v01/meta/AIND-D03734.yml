translation:
  ja: アブドゥッラフマーン・ブン・ムハンマド・ブン・アフマド・アッ＝ディマシュキー・アル＝グラービーリー。イブン・アン＝ヌマイス（ヌマイスはヌムスの縮小辞で、ヌーンと無点シーン）として知られる。ヒジュラ暦785年に、アル＝ムヒッブ・アッ＝サーミトから、アブー・サアド・アッ＝スッカーリー編纂によるアブー・ヤアラー・イスハーク・ブン・アブドゥッラフマーン・アッ＝サーブーニーの『アワーリー』の前半部分を聴聞した。また、ハディースを伝承し、優れた学者たちが彼からハディースを聴聞した。ヒジュラ暦850年以前に没した。
  en: ʿAbd al-Raḥmān b. Muḥammad b. Aḥmad al-Dimashqī al-Ghurābīlī, known as Ibn al-Numays (Numays is a diminutive of numus, spelled with the letter nūn and a plain sīn). In the year 785 AH, he heard the first half of al-ʿAwālī by Abū Yaʿlā Isḥāq b. ʿAbd al-Raḥmān al-Ṣābūnī, compiled by Abū Saʿd al-Sukkarī, from al-Muḥibb al-Ṣāmit. He transmitted hadith, and distinguished scholars heard hadith from him. He died before 850 AH.
