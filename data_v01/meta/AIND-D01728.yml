translation:
  ja: 707 アフマド・ブン・ユーヌス、称号はアル=ファーディル、ラカブはシハーブ・アッ=ディーン、ニスバはガッザーイー（ガザ出身）、後にハラビー（アレッポ）、シャーフィイー派。既述のイブラーヒーム・アッ=ダイーフの父。アル=ブルハーン・アル=ハラビーが彼の死を803年と記し、彼を「ファドル（有徳）」と称した。
  en: 707 Aḥmad b. Yūnus, known as al-Fāḍil, laqab Shihāb al-Dīn, originally al-Ghazzī, then al-Ḥalabī, Shāfiʿī. He was the father of Ibrāhīm al-Ḍaʿīf al-Māḍī (mentioned above). Al-Burhān al-Ḥalabī recorded his death in the year 803 and described him as 'al-Faḍl' (of excellence).
