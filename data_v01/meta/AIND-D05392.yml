translation:
  ja: アリー・ブン・ムハンマド・ブン・アフマド、ヌール・アッ＝ディーン・アッ＝サカンダリー・アル＝カーヒリー・アル＝ハリーリー。イブン・アビー・アスバウとして知られる。絹などの商いに従事し、そのためにマッカへの旅を繰り返し、ついに888年ジュマーダー・アッ＝サーニヤ月に同地で最期を迎えた。思慮深く付き合いのよい人であった。アッラーが彼を赦し、慈しみたまわんことを。
  en: ʿAlī b. Muḥammad b. Aḥmad, Nūr al-Dīn al-Sakandarī al-Qāhirī al-Ḥarīrī, known as Ibn Abī Aṣbaʿ. He engaged in the trade of silk and other goods and repeatedly travelled to Mecca for that reason, until his death came there in Jumādā al-Thāniya of the year 888. He was sensible and sociable; may God pardon him and have mercy on him.
