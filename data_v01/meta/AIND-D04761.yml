translation:
  ja: アブドゥルワッハーブ・ブン・イスマーイール、アル＝マジュド、アッ＝タドムリー・アル＝ハリーリー。ハリール（イブラーヒーム、彼に平安あれ）聖廟の説教師（ハティーブ）。（8）90年ラビーウ・アル＝アウワル月10日日曜の夜に没し、その翌朝、自邸内の父のトゥルバ（墓廟）に埋葬された。神が彼に慈悲を垂れたまわんことを。
  en: ʿAbd al-Wahhāb b. Ismāʿīl, al-Majd al-Tadmurī al-Khalīlī, preacher (khaṭīb) of the Sanctuary of al-Khalīl (Abraham, peace be upon him). He died on the night of Sunday 10 Rabīʿ al-Awwal (8)90 and was buried the next morning in his father's tomb (turba) in his own house. May God have mercy on him.
