translation:
  ja: アリー・ブン・タイブガー・ブン・ハーッジー・ベク、アル＝アラー・アッ＝トゥルクマーニー・アル＝アンタービー・アル＝ハナフィー。我らがシャイフ（イブン・ハジャル）は『インバー』の中で述べている。「彼は徳高く威厳があり、諸学芸に熟達していた。アル＝アシュラフ・バルスバーイは、彼をサハラー（砂漠＝カイロ北墓地）に建立した自らの廟の教授（ムダッリス）および説教師（ハティーブ）に任じた。」彼はヒジャーズへの道中で没し、838年、ヤンブウの近くに埋葬された。
  en: 'ʿAlī b. Ṭaybughā b. Ḥājjī Bak, al-ʿAlāʾ al-Turkumānī al-ʿAyntābī al-Ḥanafī. Our shaykh (Ibn Ḥajar) said in his Inbāʾ: "He was virtuous and dignified, and excelled in the sciences. Al-Ashraf Barsbāy appointed him teacher (mudarris) and preacher (khaṭīb) at his mausoleum (turba), which he had built in the desert (al-Ṣaḥrāʾ)." He died on the road to the Ḥijāz and was buried near al-Yanbūʿ in the year 838.'
