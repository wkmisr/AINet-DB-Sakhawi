translation:
  ja: アハマド・ブン・アハマド・ブン・ハサン、シャハーブ・アル＝ミスィーリー。後に紹介される二人のムハンマドの父であり、アル＝ファキーフ（法学者）としても知られる。彼は有徳で敬虔で善き人物であった。神の慈悲あれ、約40歳で亡くなった。
  en: Aḥmad b. Aḥmad b. Ḥasan al-Shihāb al-Misīrī, father of the two Muḥammads who will be mentioned later, and known as al-Faqīh (the jurist). He was a virtuous, pious, and good man. May God have mercy on him, he died around the age of forty.
