translation:
  ja: ムーサー・ブン・イスマーイール・ブン・アフマド、アッ＝シャラフ・アル＝キナーニー・アル＝ジャッジーニー（二つのジームで、第二のジームはシャッダ付き）・アッ＝ディマシュキー・アル＝ハナフィー。766年頃に生まれ、アル＝ムヒッブ・アッ＝サーミトの口述から『サカフィーヤート』の第二部を聴聞した。（ハディースを）伝え、学識者たちが彼から聴聞した。マンスーブ体を書き、それどころかダマスクスの書家たちの長であった。タンキズ・モスクの街区に住んでいた。844年ラマダーン月に没した。
  en: Mūsā b. Ismāʿīl b. Aḥmad, al-Sharaf al-Kinānī al-Jajjīnī (with two jīms, the second doubled) al-Dimashqī al-Ḥanafī. He was born around the year 766 and heard the second part of al-Thaqafiyyāt from the dictation of al-Muḥibb al-Ṣāmit. He transmitted (ḥadīth), and men of learning heard from him. He wrote the proportioned (mansūb) script and was indeed the shaykh of the scribes in Damascus, and he resided in the quarter of the Tankiz Mosque. He died in Ramaḍān of the year 844.
