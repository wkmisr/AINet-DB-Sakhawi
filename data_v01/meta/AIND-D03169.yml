    ar: محمد بن أبي بكر بن علي بن محمد بن أبي بكر الناشري
  note:
    ja: '見出しナサブから復元（規則3）。ザビードの الناشري 家。同じ父を持つ兄弟 #AIND-D10822「أبو بكر بن محمد بن أبي بكر بن علي بن محمد بن أبي بكر بن عبد الله … الناشري اليماني」（773年生）があり、その子 #AIND-D00610・#AIND-D03408 は「الآتي أبوه وجده」と祖父（＝本項主の父）の本伝を予告するが、corpus の見出し・全文検索（hw.py・ナサブ6代の全文一致）に محمد بن أبي بكر بن علي … الناشري の本伝はなく、ID-Master にも未登録 → 新規 TMP-P-001683（識別要素: ナサブ9代・家名、本伝のある子2名）。初版なし。'
notes:
- text: 'الناشري 家の縫合: 父方祖父 أبو بكر بن علي بن محمد بن أبي بكر الناشري の子ら＝#AIND-D05815 عمر（العفيف の父）・#AIND-D04847 عثمان・#AIND-D05084 الموفق علي・#AIND-D00602 الشهاب أحمد（ニスバ索引 #AIND-D12072「عمر وعثمان والموفق علي والشهاب أحمد بنو أبي بكر بن علي بن محمد بن أبي بكر」）は本項主の叔父に当たり、العفيف は従兄弟。兄弟 #AIND-D10822 أبو بكر بن محمد（相手側に本項主への言及なし＝父が TMP-P で共通のため relation を立てず note、規則23）。甥 #AIND-D00610・#AIND-D03408・#AIND-D05819・#AIND-D10938（いずれも أبو بكر بن محمد の子）。'
