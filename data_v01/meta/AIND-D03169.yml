translation:
  ja: スライマーン・ブン・ムハンマド・ブン・アビー・バクル・ブン・アリー・ブン・ムハンマド・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ウマル・ブン・アブドゥッラフマーン・ブン・アブドゥッラー・アン＝ナーシリー・アル＝ヤマーニー。771年に生まれ、818年頃にザビードで没した。アル＝アフィーフ・アン＝ナーシリーがその父（の項）で彼に言及している。
  en: Sulaymān b. Muḥammad b. Abī Bakr b. ʿAlī b. Muḥammad b. Abī Bakr b. ʿAbd Allāh b. ʿUmar b. ʿAbd al-Raḥmān b. ʿAbd Allāh al-Nāshirī al-Yamānī. He was born in the year 771 and died in Zabīd around the year [8]18. Al-ʿAfīf al-Nāshirī mentioned him under his father.
