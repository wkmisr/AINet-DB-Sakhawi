    ar: عطية بن محمد بن أبي الخير محمد بن فهد
  note:
    ja: '規則37。父 ＝ #AIND-D04909「عطية بن محمد بن أبي الخير محمد بن محمد بن عبد الله بن فهد ولي الدين أبو الفتح بن النجم أبي النصر الهاشمي العلوي المكي المالكي أخو التقي محمد الآتي ويعرف كسلفه بابن فهد」（804年生、未収録）。ナサブ一致（本項見出しは عبد الله と فهد の間に محمد を1代多く含む）。同じ父の子に #AIND-D02561 حسن（843年生）・#AIND-D02708 حسين الأكبر（849年没の嬰児、収録済み）・弟 #AIND-D07969 محمد أبو سعد（直後の項）。'
notes:
- text: '兄弟: 直後の項 #AIND-D07969「محمد أبو سعد أخوه ويلقب فهدا أيضا」（836年没）＝本項主を「أخوه」で指す（D07969 側から brother relation を立てる）。#AIND-D02561 حسن・#AIND-D02708 حسين الأكبر は父 D04909 を共有するが相手側に本項主の名指しがないため relation は立てない（規則23）。初版の grandfather relation（#NEEDID、「محمد بن أبي الخير محمد …」）は祖父 النجم أبو النصر محمد بن محمد بن أبي الخير بن فهد（父 #AIND-D04909「… بن النجم أبي النصر … أخو التقي محمد」の父＝#AIND-D09211 التقي محمد の父。本伝なし・ID-Master 未登録）であるが、見出しナサブのみで祖父 relation の要件（規則3 は父のみ）に当たらず除去。'
