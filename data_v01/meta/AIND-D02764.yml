translation:
  ja: フサイン・アル＝カーザルーニー・アッ＝シャーフィイー。彼は我らがシャイフ（イブン・ハジャル）のもとへ志を抱いて旅立ち、彼から（学問を）得た。そしてヒジュラ暦849年の疫病（ペスト）で没した。私は、我らがシャイフ（イブン・ハジャル）の署名（到達記録）がある『イブン・アル＝サラーフ（のハディース学入門）』の写本を見たが、そこには「シャイフ・バドル・アッ＝ディーン・フサインが最初から数カ所にわたって（彼に対して）読誦した」とあり、おそらくこの（伝記の）人物のことであろうと思われる。
  en: Ḥusayn al-Kāzarūnī al-Shāfiʿī. He traveled intentionally to our shaykh (Ibn Ḥajar) and studied under him. He died in the plague of the year 849 AH. I saw a copy of [the Muqaddimah of] Ibn al-Ṣalāḥ containing a collation note (balāgh) by our shaykh for Sheikh Badr al-Dīn Ḥusayn, indicating that he read it to him in several places from its beginning, and it seems to be this person.
