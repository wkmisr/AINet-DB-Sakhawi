translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アフマド・ブン・マンスール、カーディー、サリー・アッディーン、ダマスクスの人、同市内の有名な公衆浴場の建立者、ハナフィー派。844年の二つのラビーウ月のいずれかに同地で没した。イブン・アル＝ラブーディーがその没年を記録している。
  en: Muḥammad b. Ibrāhīm b. Aḥmad b. Manṣūr, the qāḍī Sarī al-Dīn al-Dimashqī, builder of the famous bath inside the city, the Ḥanafī. He died there in one of the two Rabīʿ months of the year 844. Ibn al-Labbūdī recorded his death.
