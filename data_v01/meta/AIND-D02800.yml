translation:
  ja: ハイラーン・ブン・アフマド・ブン・イブラーヒーム・アル＝アジャミー。イブラーヒームとハイダルの兄弟。彼（ハイダル）の項で既述のとおり、824年に彼と共にカイロへ来た。
  en: Ḥayrān b. Aḥmad b. Ibrāhīm al-ʿAjamī, brother of Ibrāhīm and Ḥaydar. He came to Cairo with him (Ḥaydar) in the year 824, as was mentioned in the latter's entry.
