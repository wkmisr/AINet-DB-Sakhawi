translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ムハンマド、シャラフ・アッ＝ディーンと呼ばれる、アル＝ラーリー・アッ＝シャーフィイー、マッカ寓居者。文法学・形態論などに従事する者の一人で、布地で生計を立てるかたわら、サイイド・サフィー・アッ＝ディーンとアフィーフ・アッ＝ディーンの一門に付き従っていた。私に師事し、私から、また私のもとで種々のものを聴聞し、そのなかには『マサービーフ』の大部分も含まれる。のみならずナワウィーの『四十ハディース』を私に朗読し、私は彼にイジャーザを書き与えた。894年に私は彼と別れた。
  en: Muḥammad b. Abī Bakr b. Muḥammad, called Sharaf al-Dīn, al-Lārī al-Shāfiʿī, resident of Mecca, one of those who occupied themselves with grammar, morphology and the like, while earning a living in cloth and attaching himself to the circle of al-Sayyid Ṣafī al-Dīn and ʿAfīf al-Dīn. He attended me and heard from me and under me various things, among them most of 'al-Maṣābīḥ'; indeed he read to me the 'Forty' of al-Nawawī, and I wrote him an ijāza. I parted from him in the year 894.
