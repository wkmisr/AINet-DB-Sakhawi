translation:
  ja: イスマーイール、クルアーン朗誦者にして巧みな朗誦者（アル＝ムジャウウィド）、ダマスクス・サーリヒーヤのマドラサ「アル＝ハワージャ・イブラーヒーム」のイマーム。859年ムハッラム月に死去。アル＝ルブーディー（イブン・アル＝ルブーディー）が彼を年代記に記した。
  en: Ismāʿīl, the Qurʾan reciter, the master of tajwīd, imam of the al-Khawāja Ibrāhīm madrasa in Ṣāliḥiyya, Damascus. He died in Muḥarram of the year 859 H. al-Lubūdī (Ibn al-Lubūdī) chronicled him.
