translation:
  ja: トウマーン・バイ・アッ＝ザーヒリー・ジャクマク。スルタン・ジャクマクの治世にハースカ（近侍）を務めた。ハシュカダムの治世の初期にアミール（将軍）に任じられたが、特にバイバルス・ハーンカーに隣接する邸宅を建設した時期には最悪の素行を見せた。その後、シャーフ・スワール（ズル・カドル朝の君主）に対する遠征軍に派遣されるまでその状態が続いた。帰還後、3日間滞在したのち、884年サファル月に没した。50歳近かった。
  en: Tuman Bay al-Zahiri Jaqmaq. He was a khassaki (royal mamluk) during the reign of al-Zahir Jaqmaq and was promoted to amir at the beginning of the reign of Khushqadam, during which he behaved terribly, particularly when he built his house adjacent to al-Baybarsiyya. He remained in this state until he was dispatched on a military campaign against Shah Suwar (of Dhu al-Qadr). He returned and stayed for three days, then died in Safar 884 AH, at nearly fifty years of age.
