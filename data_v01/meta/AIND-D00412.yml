translation:
  ja: アブラーク・アル＝ハカミー、ダマスクスの軍司令官の一人。ハラブを奪取した師ジャカムに従って転々とし、アシュラフ・バルスバーイの時代にはハースィキーヤ隊の要人となった。その後、ダマスクスのタブルハーナー職に移され、恐らく840H直前にそこで死去した。彼は自堕落な生活を送っていた。アッラーが彼を赦されんことを。
  en: Abrāk al-Ḥakamī, one of the amirs of Damascus. He moved around after his master Jakam, who took over Aleppo, until he became one of the notables of the Khāṣṣakiyya during the days of al-Ashraf Barsbāy. He was then transferred to the ṭablakhānāh of Damascus, where he died, probably just before 840 AH. He was extravagant in his life. May God forgive him.
