translation:
  ja: ラマダーン・ブン・イスマーイール・ブン・イブラーヒーム・ブン・ムーサー。アッ＝ザイン。アル＝マヌーフィー、のちにアル＝カーヒリー。シャーフィイー派。アル＝カラースンクリーヤ・マドラサの寄宿者。シハーブ・アッ＝ディーン・アフマド・ブン・アビー・アッ＝スウード（父親を同じくする兄弟）の異母兄弟。ラマダーンの母親は女奴隷であった。882年シャアバーン月に没。善良な人物で、常にクルアーンの朗誦と崇拝に勤しみ、アッ＝サラーヒーヤ・ハーンカーのスーフィーを務めたほか、複数の職位を有した。50歳に満たないうちに亡くなった。神の慈悲あれ。
  en: Ramaḍān b. Ismāʿīl b. Ibrāhīm b. Mūsā, al-Zayn, al-Manūfī then al-Qāhirī, al-Shāfiʿī. A resident of al-Qarāsunqurīya and the paternal half-brother of al-Shihāb Aḥmad b. Abī al-Suʿūd, who was mentioned previously (his mother was a slave girl). He died in Shaʿbān 882 AH. He was a pious man, constant in reciting the Qur'an and worship, and served as a Sufi at al-Khānqāh al-Ṣalāḥiyya along with other posts. He did not reach fifty years of age. May God have mercy on him.
