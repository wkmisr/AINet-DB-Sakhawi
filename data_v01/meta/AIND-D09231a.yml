translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・イブン・アル＝イマーム・フッジャト・アル＝イスラーム・アビー・ハーミド・ムハンマド・ブン・ムハンマド・ブン・ムハンマド、ムヒー・ッディーン〔ムフイウィー〕・アブー・ハーミド・アッ＝トゥースィー・アル＝ガザーリー、シャーフィイー派。以前にシリアに入ったことがあった後、830年ラマダーン月に故郷からアレッポに到来した。〔以前の滞在時に〕同地でイブン・ウマイラから聴聞しており、今アレッポで彼から伝えた。アレッポのハーフィズであるブルハーン〔・ッディーン〕とアラー〔・ッディーン〕・イブン・ハティーブ・アン＝ナースィリーヤは彼を学識と信仰の人と評し、彼が二人に「自分の8代前の祖はガザーリーである」と語ったと述べた。後者はさらに「彼の門人・弟子たちが彼について多くの学識と禁欲と敬虔を語るのを見た。彼は故郷では学問と信仰の家の出として尊敬されていた」と加え、また一部の学生が彼について、幾度も巡礼し、そのうち一度は無一物で徒歩で行ったと伝えた。「私は聞いたところでは、彼は死の天使を見て、いつ自分は死ぬのかと尋ねると『10日間（アシュル）のうちに』と答えたが、どの10日間か分からなかった。すると偶然にも、上述の830年ラマダーン月の最後の10日間、その22日土曜にアレッポで没した。その葬儀は盛大であった」。我らの師〔イブン・ハジャル〕は『インバー』で彼に言及し、「イブラーヒーム・ブン・アリー・アッ＝ザムザミー・アル＝マッキーが彼から学んだ」と述べた。すなわちザムザミーの項で先述したとおり、形態論を〔学んだ〕。
  en: Muḥammad b. Muḥammad b. Muḥammad b. Muḥammad b. Muḥammad b. Muḥammad b. Muḥammad b. the Imam Ḥujjat al-Islām Abī Ḥāmid Muḥammad b. Muḥammad b. Muḥammad, al-Muḥyawī Abū Ḥāmid al-Ṭūsī al-Ghazālī al-Shāfiʿī. He came from his homeland to Aleppo in Ramaḍān 830, having entered Syria long before, when he heard there from Ibn Umayla, from whom he now transmitted in Aleppo. Its ḥāfiẓ al-Burhān and al-ʿAlāʾ Ibn Khaṭīb al-Nāṣiriyya described him as learned and pious, and said he told them that his eighth ancestor was al-Ghazālī; the latter added that he saw his followers and pupils attribute to him much learning, asceticism and scrupulousness, and that he was honoured in his country as of a house of learning and religion. Some students reported that he made the pilgrimage several times, once on foot in destitution; it was said that he saw the Angel of Death and asked when he would die, and was told "in the ten" — and it so happened that he died in the last ten days of Ramaḍān, Saturday the 22nd,
    of that year 830 in Aleppo, with a well-attended funeral. Our shaykh mentioned him in the Inbāʾ, saying that Ibrāhīm b. ʿAlī al-Zamzamī al-Makkī took from him — i.e. morphology, as noted in his entry.
