translation:
  ja: ナースィル・ブン・ミフターフ・アン＝ヌワイリー・アル＝マッキー、同地のバーブ・アン＝ナドワのミナレットのムアッズィン。数年その職にあった。一家であるヌワイリー家の用向きでカイロへ往来していたが、（80）7年ラマダーン月に寿命が尽きた。40歳代であった。アル＝ファースィーが彼に言及している。
  en: Nāṣir b. Miftāḥ al-Nuwayrī al-Makkī, muezzin of the minaret of Bāb al-Nadwa there. He remained in that capacity for years. He used to go back and forth to Cairo on the business of his household, the Nuwayrī family, and his appointed time overtook him in Ramaḍān of the year [80]7, when he was in his forties. Al-Fāsī mentioned him.
