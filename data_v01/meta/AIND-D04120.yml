translation:
  ja: アブドゥルカーディル・ブン・ハリール・アル＝ザイン・アル＝ハリーリー。アル＝ジャウク（朗誦集団）の朗誦者の一人であり、彼の父はパン屋であった。バーブ・アッ＝シャアリーヤの出身で、上品な人物であった。両親の存命中に、852年ラビー・アッ＝アウワル（ラビー第1月）にブーラークで溺死した。奇妙なことに、彼は海路でマッカへの旅支度を整え、アッ＝ツールに到着した際、その海の光景に恐れをなして溺死を恐れて引き返したが、その直後にナイル川で溺死してしまった。アッラーが彼を赦し、慈しまれますように。
  en: Abd al-Qadir b. Khalil al-Zayn al-Hariri. He was one of the Quran reciters of al-Jawq, and his father was a baker. He was a refined man from the people of Bab al-Sha'riyya. He drowned at Bulaq in Rabi' al-Awwal in the year 852 H, during the lifetime of his parents. Remarkably, he had prepared to travel to Mecca by sea, but when he reached al-Tur, he was terrified by its sight and returned out of fear of drowning, only to drown shortly thereafter in the Nile. May Allah forgive him and have mercy on him.
