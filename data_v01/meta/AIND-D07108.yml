translation:
  ja: ムハンマド・ブン・イスマーイール・ブン・アルワーン、アッ＝ザビーディー、のちアル＝マフジャミー。しばらくの間アル＝マフジャムのカーディー職を務め、法学に聡く、行状を称賛された。（8）19年に没した。我らがシャイフ（イブン・ハジャル）が『インバー』でそう述べている。イエメン人の中に、名・父名・祖父名を彼と同じくする別の人物がいるが、その人は（9）世紀の少し前に没した。
  en: Muḥammad b. Ismāʿīl b. ʿAlwān al-Zabīdī, then al-Mahjamī. He held the judgeship of al-Mahjam for a time, and was astute in jurisprudence and of praised conduct. He died in the year (8)19; so said our shaykh (Ibn Ḥajar) in his Inbāʾ. Among the Yemenis there is another who shared with him the name, the father's name and the grandfather's name, but he died shortly before the (ninth) century.
