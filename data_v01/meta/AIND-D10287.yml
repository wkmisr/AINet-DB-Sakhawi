translation:
  ja: ヤフヤー・ブン・ガリーブ・シャー、ハーン・ジャハーンとあだ名される。インドの君主アル＝ギヤース・アブー・アル＝ムザッファル・アアザム・シャー・ブン・イスカンダル・シャーの宰相。814年に殺害された。我らの師（イブン・ハジャル）が『インバー』にその没年を記録した。
  en: Yaḥyā b. Gharīb Shāh, who bore the title Khān Jahān, vizier of the ruler of India, al-Ghiyāth Abū al-Muẓaffar Aʿẓam Shāh b. Iskandar Shāh. He was killed in the year 814. Our shaykh (Ibn Ḥajar) recorded his death in his Inbāʾ.
