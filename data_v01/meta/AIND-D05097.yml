translation:
  ja: アリー・ブン・アブー・バクル、ヌール・アッ＝ディーン・アッ＝トゥーヒー、のちにアル＝カーヒリー、商人。我々（サハーウィー）の昔の隣人であり、自身より先に亡くなったイブラーヒームの父親。盲目となり足腰が立たなくなり、前述の息子を失う悲劇に見舞われた後、883年ズー・アル＝カアダ月の初旬に死去した。彼は非常に貪欲で極めて吝嗇であったが、多くの富を有していることで知られていた。アッラーが彼を赦されますように。
  en: ʿAlī b. Abī Bakr, Nūr al-Dīn al-Ṭūkhī, then al-Qāhirī, the merchant. He was our (al-Sakhāwī's) neighbor of old, and the father of Ibrāhīm who died before him. He died in the early part of Dhū al-Qaʿda in the year 883 AH, after having become blind and unable to walk, and having been grieved by the loss of his aforementioned son. He was exceedingly greedy and very stingy, despite being known for his great wealth. May God forgive him.
