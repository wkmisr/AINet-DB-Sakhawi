translation:
  ja: ムハンマド・ブン・サイード・ブン・ムハンマド・ブン・アブド・アル＝ワッハーブ・ブン・アリー・ブン・ユースフ、ファトフ・アッ＝ディーン、アブー・アル＝ファトフ、アル＝ジャマール（サイード）の子、アル＝ファトフ・アブー・アル＝ファトフの孫、アル＝アンサーリー・アッ＝ザランディー・アル＝マダニー・アル＝ハナフィー。マディーナのカーディー（サイード）の息子で、同地のカーディーであったアリーの弟。いずれも先述。クンヤ（アブー・アル＝ファトフ）で知られる。……年にマディーナで生まれ、同地で育ち、クルアーン、『シャーティビーヤ』、『クドゥーリー』、『マナール』、文法の『アルフィーヤ』を暗記し、アル＝アブシーティーやアブー・アル＝ファラジュ・アル＝マラーギーらに提示し、871年に父とともにカイロに入った際にはアル＝アミーン・アル＝アクサラーイーにも提示した。さらに彼からイブン・ファリシュター『マジュマウ注釈』を分担講読で学び、その朗読者の一人を務め、同じく『サヒーフ・ムスリム』『シャマーイル』などを彼に読んだ。カイロにはたびたび入り、アッ＝サラーフ・アッ＝タラーブルスィーから学び、アル＝ブルハーン・アル＝カルキーに『シファー』を読んでその講義に出席し、父のもとで学んで『ブハーリー』と『シファー』を読み、アラビア語学ではアル＝アブシーティーのもとに出席し、アブー・アル＝ファラジュ・アル＝マラーギーから多くを聴聞し『ブハーリー』を読み、巡礼期にシャイフ・ハミード・アッ＝ディーン・アン＝ヌウマーニーから学び、マディーナで私（サハーウィー）から聴聞した。兄に比べれば活動的で、父、次いで兄、さらにシャーヒーン・アル＝ジャマーリーの代理としてヒスバとカーディー職を執った。
  en: Muḥammad b. Saʿīd b. Muḥammad b. ʿAbd al-Wahhāb b. ʿAlī b. Yūsuf, Fatḥ al-Dīn Abū al-Fatḥ b. al-Jamāl b. al-Fatḥ Abī al-Fatḥ al-Anṣārī al-Zarandī al-Madanī al-Ḥanafī, son of the qadi of Medina and brother of ʿAlī, its qadi, both mentioned above; best known by his kunya. Born in [year missing] in Medina, he grew up there and memorised the Qurʾān, the Shāṭibiyya, the Qudūrī, the Manār and the Alfiyya on grammar, which he presented to al-Abshīṭī, Abū al-Faraj al-Marāghī and others, and to al-Amīn al-Aqṣarāʾī when he entered Cairo with his father in 871; from the latter he also took Ibn Firishtā's commentary on the Majmaʿ by divided reading, being one of its readers, and read to him Ṣaḥīḥ Muslim and the Shamāʾil. He entered Cairo repeatedly, studied with al-Ṣalāḥ al-Ṭarābulusī, read the Shifāʾ to al-Burhān al-Karakī and attended his lessons, studied with his father, reading to him al-Bukhārī and the Shifāʾ, attended al-Abshīṭī for Arabic, heard much from Abū al-Faraj al-Marāghī and read
    al-Bukhārī to him, studied with Shaykh Ḥamīd al-Dīn al-Nuʿmānī during the pilgrimage season, and heard from me in Medina. He is active compared with his brother, and served as deputy in the ḥisba and the judgeship for his father, then for his brother, and likewise for Shāhīn al-Jamālī.
