translation:
  ja: アハマド・ブン・ヤフヤー・ブン・アブド・アッラフマーン・ブン・アビー・ル＝ハイル・ムハンマド・ブン・ムハンマド・ブン・アブド・アッラー・ブン・ムハンマド・ブン・ファハド。アブー・ル＝ハイル・アル＝ハーシミー・アル＝マッキー。彼の父については後述する。彼はラビーウ・ル＝アウワル月827年、メッカで2歳を過ぎたところで亡くなった。イブン・ファハドが彼について記している。
  en: Ahmad ibn Yaḥyā ibn ʿAbd al-Raḥmān ibn Abī al-Khayr Muḥammad ibn Muḥammad ibn ʿAbd Allāh ibn Muḥammad ibn Fahd, Abū al-Khayr al-Hāshimī al-Makkī. His father will be mentioned later. He died in Rabīʿ al-Awwal 827 AH in Mecca, having entered his second year. Ibn Fahd recorded his biography.
