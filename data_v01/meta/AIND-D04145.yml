translation:
  ja: アブドゥルカーディル・ブン・アリー・ブン・ジャーラッラー・ブン・ザーイド・アス＝スィンビスィー・アル＝マッキー。ウバイドと通称される。交易のためにアデンへ旅した。ヒジュラ暦874年ラビーウ・アッ＝サーニー月にマッカで死去した。イブン・ファハドが彼の死去の日付を記録している。後述されるアブドゥッラティーフとアブー・サアドの父親である。
  en: ʿAbd al-Qādir b. ʿAlī b. Jār Allāh b. Zāyid al-Sinbisī al-Makkī, popularly known as ʿUbayd. He was among those who traveled to Aden for trade. He died in Mecca in Rabīʿ al-Thānī, the year 874 AH. His death was chronicled by Ibn Fahd. He is the father of ʿAbd al-Laṭīf and Abū Saʿd, both of whom are mentioned below.
