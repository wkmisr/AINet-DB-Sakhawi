translation:
  ja: ムハンマド・ブン・アフマド・アブー・アル＝ファドル・アル＝クドスィー・アッ＝シャーフィイー、父の生業（大工）からイブン・アン＝ナッジャールとして知られる。成長してマーヒルに学び、次いでアル＝ブルハーン・アル＝アジュルーニーとアル＝カマール・イブン・アビー・シャリーフに学んで、秀でて諸学芸で抜きん出るに至り、教授とファトワー発給にあたった。敬虔で謙虚、清貧で足るを知る人物であり、晩年にはファトワー発給を辞めた。イブン・アッ＝ザマンが彼をエルサレムにある自分のマドラサのシャイフに据えた。壮年のうちに（8）87年シャアバーン月に没し、そのシャイフ職にはアン＝ヌール・マフムード・イブン・アル＝イスヤーティーが就いた。
  en: Muḥammad b. Aḥmad Abū al-Faḍl al-Qudsī al-Shāfiʿī, known as Ibn al-Najjār after his father's trade. He grew up and studied under Māhir, then under al-Burhān al-ʿAjlūnī and al-Kamāl Ibn Abī Sharīf, until he excelled and distinguished himself in the sciences, and he devoted himself to teaching and giving fatwās. He was scrupulous, humble, poor and content; he gave up issuing fatwās toward the end of his life. Ibn al-Zaman installed him as shaykh of his madrasa in Jerusalem. He died in middle age in Shaʿbān (8)87, and al-Nūr Maḥmūd Ibn al-ʿAṣyātī was installed in the shaykhship.
