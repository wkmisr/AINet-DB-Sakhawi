translation:
  ja: サーリム・ブン・ムハンマド・ブン・ナースィル・アル＝ビジャーイー・アル＝ハウワーリー・アル＝マグリビー。後にカイロに住み、シャイフ・マディヤンとの同伴にちなんでアル＝マディーニーと称した。常にクルアーンの朗誦に励み、病人の世話などに従事して、見返りを求めず献身的に仕えた。私のところに何度もやってきてハディース（預言者伝）などの講義を聴聞した。実に立派な人物であった。
  en: Sālim b. Muḥammad b. Nāṣir al-Bijāʾī al-Hawwārī al-Maghribī, then al-Qāhirī, known as al-Madīnī due to his companionship with Shaykh Madyan. He was among those who constantly recited the Quran, cared for the sick, and dedicated themselves to serving them seeking reward from God. He attended my lectures many times, studying the Prophetic biography (al-Sīra) and other subjects; what an excellent man he was!
