translation:
  ja: イブラーヒーム・ブン・アフマド・ブン・アブドゥッラフマーン・ブン・アワド・アル＝タンティダーイー、出自はカイロのシャーフィイー派の人物。後述する彼の父と兄弟アブドゥッラフマーンとは異なり、父の道を辿ることも、それに近いこともなかった。むしろ、彼はカーディーたちの扉で役人を務め、ビバルシーヤのラバートのイマーム職の半分を掌っており、880年頃に死去するまでその職にあった。アッラーが彼を赦されんことを。
  en: Ibrāhīm b. Aḥmad b. ʿAbd al-Raḥmān b. ʿAwaḍ al-Ṭanṭidāʾī, originally from Cairo, a Shāfiʿī. Unlike his father and his brother ʿAbd al-Raḥmān (to be mentioned later), he did not follow his father's path, nor anything close to it. Rather, he served as an official at the judges' gates and held half the imamate of the Ribāṭ at al-Baybarsiyya until he died close to the year 880 H. May God forgive him.
