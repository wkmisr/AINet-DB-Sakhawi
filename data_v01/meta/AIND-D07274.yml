translation:
  ja: ムハンマド・ブン・アブー・バクル・アッ＝シャムス・アル＝クターミー——カーフにダンマ、ターにタシュディードなし（クターミー）、カイロのクターマ街区に因む——、アル＝カーヒリー、アル＝マーリキー。我らがシャイフ（イブン・ハジャル）は『インバー』で言う。「842年ズー・アル＝カアダ月22日、伝えられるところでは急死した。80歳に近づいていたが頑健であった。莫大な財産を遺したと言われる。彼はアル＝バドル・アル＝アイニーの代理としてヒスバ（市場監督）のナキーブを務め、次いで彼のもとで裁判（フクム）のナキーブとなり、彼（アル＝アイニー）の解任後も死ぬまで彼のもとへ通い続けた。クルアーンの読誦も多かった。アッラーが彼を赦し給うように」。
  en: 'Muḥammad b. Abī Bakr al-Shams al-Kutāmī (with ḍamma on the kāf and no doubling of the tāʾ, after the Kutāma quarter in Cairo), al-Qāhirī, al-Mālikī. Our shaykh (Ibn Ḥajar) said in his Inbāʾ: "He died suddenly, according to what is said, on 22 Dhū al-Qaʿda 842, having approached eighty while still robust. It is said that he left a vast fortune. He was naqīb al-ḥisba as deputy of al-Badr al-ʿAynī, then became naqīb al-ḥukm under him, and did not cease to frequent him after his dismissal until he died, together with his abundant recitation of the Qurʾān. May God pardon him."'
