translation:
  ja: アフマド・アル＝トゥラービー、敬虔なシャイフで、多くの人々に尊敬された。855年ズー・アル＝ヒッジャ月21日金曜日に急逝し、翌日、勝利の門の外、アル＝アスナウィーの墓廟の向かいにある自身のザーウィヤに埋葬された。神が彼を憐れむよう。
  en: Aḥmad al-Turābī, a righteous shaykh held in high regard by many. He died suddenly on Friday, the twenty-first of Dhū al-Ḥijjah in the year 855 H, and was buried the next day in his zawiya opposite Turbat al-Asnawī, outside Bāb al-Naṣr. May God have mercy on him.
