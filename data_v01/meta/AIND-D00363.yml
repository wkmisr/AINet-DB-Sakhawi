translation:
  ja: イブラーヒーム・ブン・アル＝アスバハーニー、仕立屋（アル＝ハイヤート）。その手仕事において信頼される者の一人で、善良さ、身内への義理堅さ、礼拝の厳守、学者と義人への信心を備えていた。894年シャアバーン月に没した。それ以前に両脚を患い、杖に頼ってわずかしか歩けなくなっていた。彼の仕事場はハッシャービーンにある、ウスターダール・タグリー・ビルディーが改修したモスクの向かいにあった。神よ彼に慈悲を。
  en: Ibrāhīm b. al-Aṣbahānī al-Khayyāṭ (the tailor), one of the respected men of his craft, with goodness, loyalty to his kin, strict observance of the prayers, and belief in the scholars and the righteous. He died in Shaʿbān of the year 894, after an ailment had befallen his legs that left him unable to walk except a little, leaning on a stick. His workshop was opposite the mosque in al-Khashshābīn that the ustādār Taghrī Birdī had renovated. May God have mercy on him.
