translation:
  ja: ムハンマド・ブン・アフマド・ナースィル・アッ＝ディーン・アル＝ミスリー・アッ＝シャーフィイー、アッ＝サハーウィーとして知られ、祖父がアリーである者たち（の部）で前述した人物とは別人である。クルアーンと諸書を暗記し、（7）70年代にそれらをアル＝ジャマール・アル＝イスナーイーなどカイロの学者たちに提示（アルド）し、彼の講義やほかの者の講義に出席した。彼には聡明さがあり、優れた知見を語り合った。マッカに幾度も隣住（ジワール）し、そこで（8）10年シャアバーン月に没し、60数歳でアル＝ムアッラーに葬られた。アル＝ファースィーが『マッカ（史）』でそう述べている。
  en: Muḥammad b. Aḥmad Nāṣir al-Dīn al-Miṣrī al-Shāfiʿī, known as al-Sakhāwī; he is other than the one mentioned above among those whose grandfather is ʿAlī. He memorized the Qurʾān and some books and presented them in the (7)70s to a number of the scholars of Cairo, such as al-Jamāl al-Isnāʾī, and attended his lessons and those of others. There was intelligence in him, and he would discuss fine points of learning. He sojourned in Mecca more than once, and his death occurred there in Shaʿbān (8)10; he was buried in al-Muʿallā at the age of sixty-odd. Al-Fāsī said this in (his history of) Mecca.
