translation:
  ja: アリー・ブン・イブラーヒーム・ブン・アフマド・ブン・イブラーヒーム・ブン・サアド・ブン・サイード、アブー・マドヤン、アッ＝ラムリー、のちアル＝マクディスィー、シャーフィイー派、アル＝カーディリー。その孫ハリール・ブン・ムハンマドは前述。私は我らがシャイフ（イブン・ハジャル）が彼をうっかりイブラーヒームと呼んでいるのを見た。彼は835年に我らがシャイフのもとで『アル＝アルバウーン・アル＝ムタバーイナ』と『サヒーフ』の一部などを読誦した者の一人である。
  en: ʿAlī b. Ibrāhīm b. Aḥmad b. Ibrāhīm b. Saʿd b. Saʿīd, Abū Madyan al-Ramlī, then al-Maqdisī, al-Shāfiʿī al-Qādirī; his grandson Khalīl b. Muḥammad has been mentioned above. I saw that our shaykh (Ibn Ḥajar) inadvertently named him Ibrāhīm. He is among those who read under him al-Arbaʿīn al-mutabāyina, part of the Ṣaḥīḥ and other works in the year 835.
