translation:
  ja: ムハンマド・ブン・イスマーイール・ブン・マフムード、アッ＝ルクン・アル＝ハワーフィー、『アッ＝ルバーブ』註釈者の外孫。746年ズー・アル＝カアダ月5日に生まれた。アッ＝ターウースィーは彼から、彼自身の『シャルフ・アル＝ムフタサル』とアル＝イージーの『アル＝マワーキフ』を学び、「あらゆる学問において第一人者で、精確な考証家、温和な性質であった」と述べている。マッカとザビードで彼に学んだ者の一人にアル＝ジャラール・アブド・アル＝ワーヒド・アル＝ムルシディーがおり、文法学・法学原理論・意味論・明解論を学び、彼は803年に美しい筆跡で雄弁なイジャーザを彼に書き与えた。834年シャウワール月28日日曜日にヘラートで没した。
  en: 'Muḥammad b. Ismāʿīl b. Maḥmūd, al-Rukn al-Khawāfī, maternal grandson of the commentator of al-Lubāb. He was born on 5 Dhū al-Qaʿda 746. Al-Ṭāwūsī took from him his own commentary on al-Mukhtaṣar and al-Mawāqif of al-Ījī, and said: he was a leading authority in all the sciences, a thorough scholar of gentle disposition. Among those who took from him in Mecca and Zabīd was al-Jalāl ʿAbd al-Wāḥid al-Murshidī, who learned grammar, uṣūl, maʿānī and bayān, and for whom he wrote an eloquent ijāza in a fine hand in the year 803. He died in Herat on Sunday 28 Shawwāl 834.'
