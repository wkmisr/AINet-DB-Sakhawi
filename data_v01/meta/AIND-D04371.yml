translation:
  ja: アブド・アッ＝ラティーフ・アル＝カジャージュキー、アル＝アシュラフ・バルスバーイ（のマムルーク）。（その）側近の酌人（サーキー）の一人で、アッ＝ザーヒル・ジャクマクがその治世の初めに彼を解任するまでその地位にあり、その後も854年ズー・アル＝ヒッジャ月8日に没するまで存命した。寛大で、学識と徳ある人々を愛したことで知られた。彼はハドラト・アル＝カマージイーンの近く、ファッハーダ池を見下ろすモスクの主（創建者）である。神の慈悲がありますように。
  en: ʿAbd al-Laṭīf al-Qajājiqī (mamlūk of) al-Ashraf Barsbāy, one of the elite cupbearers. He remained so until al-Ẓāhir Jaqmaq removed him at the beginning of his reign, and he lived on until he died on the eighth of Dhū al-Ḥijja of the year 854. He was noted for generosity and love of the people of learning and virtue, and he is the founder of the mosque overlooking Birkat al-Fahhāda near Ḥadrat al-Kamājiyyīn. May God have mercy on him.
