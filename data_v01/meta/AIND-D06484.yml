notes:
- text: '転送見出し（原文末尾「يأتي فيمن جده عبد الله」による）。転送先は #AIND-D06513「محمد بن إبراهيم بن عبد الله الشمس الكردي الأصل ثم المقدسي ثم القاهري المكي الشافعي وسمى المقريز جده أحمد لا عبد الله」（747生・811没、未受領）。本見出しの「بن أحمد」は D06513 本文が伝える المقريزي の異説（祖父名 أحمد）による綴り。同じ D06513 へ向く転送見出しに #AIND-D06523「محمد بن إبراهيم بن علي بن إبراهيم الكردي ثم المقدسي . مضى فيمن جده عبد الله」（D06513 末尾「وسمى التقي بن فهد في معجمه جده علي بن إبراهيم」の異説形）と #AIND-D06590「محمد بن إبراهيم الكردي . فيمن جده عبد الله」がある（いずれも本バッチ外）。'
