translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アブドゥッラー、ナースィル・アッ＝ディーン・アル＝ファーウィー・ブン・アッ＝ザキー。742年またはその後に生まれ、少しばかり学問に従事した。アル＝イッズ・ブン・ジャマーアが彼にイジャーザを与えた。我らが師（イブン・ハジャル）は『ムウジャム』で言う。「私は彼から、彼（イッズ・ブン・ジャマーア）伝のハディースを一つ聴聞し、彼の珍談から益を得た。彼は諧謔と珍談の持ち主であった」。（80）6年シャウワール月に没した。
  en: 'Muḥammad b. Abī Bakr b. ʿAbd Allāh, Nāṣir al-Dīn al-Fāwī b. al-Zakī. He was born in the year 742 or after it, and studied a little. Al-ʿIzz b. Jamāʿa granted him an ijāza. Our shaykh (Ibn Ḥajar) said in his Muʿjam: "I heard from him one ḥadīth on his (Ibn Jamāʿa''s) authority; I profited from his anecdotes, and he was a man of jest and anecdotes." He died in Shawwāl of the year (80)6.'
