    ja: '「وحضر مجالس الجمال الطيب الناشري القاضي وأذن له في الإفتاء」。الجمال الطيب الناشري القاضي＝#AIND-D06630「محمد الجمال أبو عبد الله الشافعي أخو الذي قبله ووالد العفيف عبد الله الماضي ويعرف هذا بالطيب . ولد في ذي القعدة سنة اثنتين وثمانين وسبعمائة بزبيد … وولي قضاء الأقضية بزبيد بعد موت عمه المشار إليه في سنة أربع وأربعين فدام حتى مات بزبيد في شوال سنة أربع وسبعين」（兄 #AIND-D06629 の見出し「… الجمال … اليماني الزبيدي الناشري الشافعي」で الناشري 家）。ラカブ الجمال・通称 الطيب・カーディー職（ザビードの قضاء الأقضية）の3点が相手側原文で閉合（規則57）。repo 先例 #AIND-D05819「سمع على خاله القاضي الجمال الطيب」・#AIND-D00790 も #AIND-D06630。【集約 2026-11-03】校閲時の #AIND-D03455（الطيب بن محمد بن عبد الله … الناشري اليماني、768生・844没、قضاء الكدرا を務めたがラカブ الجمال も قاضي القضاة の職も見出し・本文にない）は誤り＝差し替え（内容B H、オーケストレーター決定2）。#AIND-D11075「ابن قاضي القضاة الجمال الطيب」も D06630 側を指す。ID-Master TMP-P-000364「الطيب محمد بن أحمد بن أبي بكر …」は D06630 と同人（ISSUES §D104-2 の既出名寄せ要）。'
