translation:
  ja: ムーサー・ブン・アフマド・ブン・アリー・ブン・ウジャイル、アル＝カマール、アル＝ヤマーニー、前述のアフマドとアブド・アッ＝ラティーフの父。802年に生まれ、学問に励んで法学で頭角を現し、カーディーのアル＝ジャマール・アッ＝タイイブ・アン＝ナーシリーの講義に出席し、彼からファトワー発行の許可を得た。教授しファトワーを発し、ターヒル家（バヌー・ターヒル）がザビードを領有すると、アル＝マドラサ・アル＝フサイニーヤの監督（ナザル）と教授職を付与され、（8）79年ムハッラム月11日金曜日に没するまでその任にあった。彼はアッ＝タキー・ウマル・アル＝ファティーの校訂に拠って『アル＝ワジーズ』の校訂を著し、また『アル＝ミンハージュ』に対する一部（の注釈）を著した。神が彼を慈しみたまわんことを。
  en: Mūsā b. Aḥmad b. ʿAlī b. ʿUjayl, al-Kamāl, al-Yamānī, father of Aḥmad and ʿAbd al-Laṭīf (mentioned above). He was born in 802, devoted himself to study and distinguished himself in fiqh; he attended the sessions of the qāḍī al-Jamāl al-Ṭayyib al-Nāshirī, who authorised him to give fatwās. He taught and gave fatwās, and when the Banū Ṭāhir took possession of Zabīd, the supervision (naẓar) of al-Madrasa al-Ḥusayniyya and its teaching post were added to him, until he died on Friday 11 Muḥarram of the year [8]79. He wrote a taṣḥīḥ on al-Wajīz, drawing it from the taṣḥīḥ of al-Taqī ʿUmar al-Fatī, and a portion (of commentary) on al-Minhāj; may God have mercy on him.
