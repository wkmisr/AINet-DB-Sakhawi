- text: '転送見出し（原文末尾の「مضى」による）。転送先は #AIND-D03619（عبد الرحمن بن حسن بن حمزة بن يوسف المحب أبو الفضل الحلبي الحنفي الكاتب نزيل القاهرة「ويسمى أيضا محمدا لكنه بهذا أشهر ليتميز عن أخ له اسمه محمد ويعرف بابن الأمين」）。「الذي قبله」＝直前項 #AIND-D07343（محمد بن حسن بن حمزة بن يوسف الشمس أبو الأسعد الحلبي ... أخو عبد الرحمن الماضي ويعرف بابن الأمين الكاتب）であり、本項はその兄弟で「عبد الرحمن」の名で呼ばれた人物＝D03619 と一致（ラカブ المحب・クンヤ أبو الفضل・職 الكاتب・居住 نزيل القاهرة がすべて一致）。'
