translation:
  ja: アフマド・ブン・アビー・バクル・ブン・アル＝シャムス・ムハンマド・ファフルッディーン・アル＝ラーリー・アル＝ハナージー。ラーの村の一つであるアル＝ハナージュ出身のシャフィイー法学派の人物。私（＝サハーウィー）が三度目のカーバヤード近郊滞在中にマッカで私に会った。私から伝承や知識の聴聞を継続的に行い、私も彼のために書写を行い、彼を優れた、学識豊かな、そして立派なシャイフだと評した。
  en: Aḥmad b. Abī Bakr b. al-Shams Muḥammad Fakhr al-Dīn al-Lārī al-Hanājī, from al-Hanāj, a village in Lār. A Shafi'i jurist. He met me in Mecca during my third extended stay (mujāwara). He remained with me, listening to various transmissions and studies. I also wrote for him, and I described him as a righteous, accomplished, and excellent shaykh.
