translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・ジュムア・ブン・ラージフ・ブン・ムーサー・ブン・ラージフ・ブン・イブラーヒーム、アル＝ジャマール・アル＝バスラウィー・アッ＝シャーグーリー・アッ＝ディマシュキー。アン＝ナジュム・ウマル・ブン・ファハドがその『ムウジャム』で彼をこのように挙げ、有徳の人と評した。
  en: ʿAbd Allāh b. Muḥammad b. Jumʿa b. Rājiḥ b. Mūsā b. Rājiḥ b. Ibrāhīm, al-Jamāl al-Buṣrawī al-Shāghūrī al-Dimashqī. Al-Najm ʿUmar b. Fahd mentioned him thus in his Muʿjam and described him as a man of merit.
