translation:
  ja: スライマーン・ブン・ヒバ・ブン・ジャンマーズ・ブン・マンスール・アル＝フサイニー、マディーナのアミール。一度マディーナを統治したが、のち解任され、アル＝ムアイヤド・シャイフが彼を逮捕して投獄し、（8）17年ズー・アルヒッジャ月末、カイロの獄中で没した。40歳に向かう十年（30代）であった。
  en: Sulaymān b. Hiba b. Jammāz b. Manṣūr al-Ḥusaynī, amīr of Medina. He governed it once, then was deposed; al-Muʾayyad Shaykh seized and imprisoned him until he died in his prison in Cairo at the end of Dhū al-Ḥijja of the year [8]17, in his thirties (in the decade leading to forty).
