  note:
    en: 'Al-Shihāb Aḥmad b. ʿAlī al-Shawāyṭī (AIND-D01037; the spelling varies in the corpus: الشوايطي/الشوائطي/الشوابطي), al-Sakhāwī''s shaykh, married his daughter Khadīja.'
translation:
  ja: ハサン・アル＝アジャミー・アル＝マダニー。我らがシャイフであるシハーブ・アッ＝シャワーイティーが彼の娘ハディージャと婚姻関係を結び（彼の婿となり）、彼女との間に子供をもうけた。彼女は859年（1455年）に亡くなった。伝記対象者である彼女の父親（ハサン）がいつ亡くなったのかは、私は知らない。
  en: Ḥasan al-ʿAjamī al-Madanī. Our shaykh al-Shihāb al-Shawāyṭī became his son-in-law by marrying his daughter Khadīja, with whom he had children. She died in the year 859 AH (1455 CE), and I do not know when her father, the subject of this biography, died.
