translation:
  ja: アフマド。ジャマール・アッ＝ディーン（アル＝ビーリー）・アル＝ウスターダールの姉妹の息子であり、後述するハムザ（＝AIND-D02791）の兄弟。814年ラビーウ・アル＝アーヒル月に、親族や一族と共に苦難に遭って財産を没収された者の一人であり、絞殺された。
  en: Aḥmad, the son of the sister of Jamāl al-Dīn (al-Bīrī) al-Ustādār, and brother of the forthcoming Ḥamza (= AIND-D02791). He was among those whose property was confiscated during his ordeal with his relatives and family, and was strangled in Rabīʿ al-Ākhir 814 H.
