translation:
  ja: ハサン・ブン・ムハンマド・ブン・ユースフ・ブン・ナイタクス・アル＝バドル・ブン・アッ＝シャムス・ブン・アッ＝サラーフ・アル＝ハナフィー。ヒジュラ暦722年ズー・アル＝ヒッジャ月にカイロ郊外のアル＝フサイニーヤで生まれ、そこで育った。法学を学び、長い間公証人（シャーヒド）として生計を立てた。その後、サファドのハナフィー派判事（カーディー）に指名され、ヒジュラ暦780年代にその職に就いた。そこで判事として留まり、ヒジュラ暦814年に没した。マクリーズィーがその著書『ウクード』において彼について言及している。
  en: Ḥasan b. Muḥammad b. Yūsuf b. Nayṭaqus, al-Badr b. al-Shams b. al-Ṣalāḥ, al-Ḥanafī. He was born in Dhu al-Hijjah 722 AH in al-Ḥusayniyya outside Cairo and grew up there. He studied jurisprudence and earned his living as a notary (shāhid) for a long time. Then he was designated for the Hanafi judgeship of Safad, which he assumed in the 780s AH. He continued as a judge there until he died in 814 AH. Al-Maqrīzī mentioned him in his work al-ʿUqūd.
