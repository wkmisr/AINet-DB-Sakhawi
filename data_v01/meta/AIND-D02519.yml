translation:
  ja: アル＝ハサン・ブン・アフマド・ブン・アリー、バドル・アッ＝ディーン・アッ＝シーシーニー。 我らがシャイフ（イブン・ハジャル）から、その「ムタバーイナート」（相互に系統を異にする高位伝承経路のハディース集）の一部（قطعة）を、アル＝ファトヒーの朗読によって聴聞した。彼（イブン・ハジャル）は彼（シーシーニー）を「シャイフ」と称した。
  en: al-Ḥasan b. Aḥmad b. ʿAlī, Badr al-Dīn al-Shīshīnī. He heard from our shaykh (Ibn Ḥajar) a portion (qiṭʿa) of his mutabāyināt, through the recitation of al-Fatḥī; and he (Ibn Ḥajar) described him (al-Shīshīnī) as "the shaykh".
