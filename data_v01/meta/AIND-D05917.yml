translation:
  ja: ウマル・ブン・ウマル・ブン・ウスマーン、アッ＝ザイン・ブン・アッ＝タージル（商人）・アッ＝シラージュ・ブン・アル＝ファフル、イブン・アル＝ジュンディー。父は前述。（8）89年に没し、ほどなくその息子も没して、スルターンが彼の遺産に手を置いた（差し押さえた）。
  en: ʿUmar b. ʿUmar b. ʿUthmān, al-Zayn b. al-Tājir (the merchant) al-Sirāj b. al-Fakhr, Ibn al-Jundī; his father was mentioned above. He died in the year (8)89, and shortly afterwards his son died too, and the Sultan laid his hand on his estate.
