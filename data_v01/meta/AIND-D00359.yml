translation:
  ja: イブラーヒーム、サアド・アッディーン・ブン・アラム・アッディーン、アル＝バースィティー、実務官（アル＝ムバーシル）。縮小形で「アッ＝サギール（小さい方）」として知られた。軍務監督官（ナーズィル・アル＝ジャイシュ）アッ＝ザイニー・アブドゥルバースィトの門の書記で、842年とその後の彼（アブドゥルバースィト）の受難の際に拘束された者の一人であったが、その後釈放され、ジャマーリー・ナースィル（ナーズィル）・アル＝ハーッス（私領財務監督官）とその後任たちに仕えた。長命を保ち、スルターンの犠牲獣（アドヒヤ・ハーッスィーヤ）の受領証などを書くようになった。893年、失明したのち視力を回復してから没した。クルアーンを読誦する者で、善良な人であった。神よ彼に慈悲を。
  en: Ibrāhīm Saʿd al-Dīn b. ʿAlam al-Dīn al-Bāsiṭī, the administrator (al-mubāshir), known by the diminutive as al-Ṣaghīr. He was scribe at the gate of the controller of the army (nāẓir al-jaysh) al-Zaynī ʿAbd al-Bāsiṭ and was among those detained during the latter's ordeal in the year 842 and thereafter; he was then released and served al-Jamālī, the controller of the privy purse (nāẕir al-khāṣṣ, printed "nāṣir al-khāṣṣ"), and those who came after him. He lived a long life and came to write the receipts for the sultanic sacrificial animals and the like. He died in the year 893, after having gone blind and then regained his sight. He was one who recited the Qurʾān, and there was goodness in him. May God have mercy on him.
