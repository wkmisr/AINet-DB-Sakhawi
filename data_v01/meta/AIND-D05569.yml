translation:
  ja: アリー・ブン・ムハンマド・ブン・ムハンマド、アル＝アラー・ブン・アル＝バハー・イブン・アル＝ブルジー。父は後述。アル＝バドル・ブン・アッ＝シラージュ・アル＝ブルキーニーの娘の子で、母はバルキース。アウハド・アッ＝ディーン・ムハンマド・ブン・アル＝ブルジーの叔父。サイード・アッ＝スアダー（ハーンカー）のスーフィーの一人であった。875年ラマダーン月に約70歳で没した。神が彼を赦したまわんことを。
  en: ʿAlī b. Muḥammad b. Muḥammad, al-ʿAlāʾ b. al-Bahāʾ Ibn al-Burjī, whose father is mentioned below. He was the daughter's son of al-Badr b. al-Sirāj al-Bulqīnī, his mother being Balqīs, and the paternal uncle of Awḥad al-Dīn Muḥammad b. al-Burjī. He was one of the Sufis of Saʿīd al-Suʿadāʾ. He died in Ramaḍān 875, aged about seventy; may God pardon him.
