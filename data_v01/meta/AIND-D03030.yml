translation:
  ja: レイハーン・アン＝ヌービー、のちにアル＝マッキー。アル＝カーイド（指揮官）。アル＝サイイド・ハサン・ブン・アジュラーンの解放奴隷。アル＝フィール（「象」の意）の通称で知られる。ハジュラ暦849年ジュマーダー・アル＝ウーラー（第5月）にマッカで没した。イブン・ファハドが彼の死を記録している。
  en: Rayḥān al-Nūbī, later al-Makkī. He was a commander (al-Qāʾid) and a freed slave (ʿatīq) of al-Sayyid Ḥasan b. ʿAjlān, and was known by the epithet al-Fīl (the Elephant). He died in Mecca in Jumada al-Ula, 849 AH. His death was recorded by Ibn Fahd.
