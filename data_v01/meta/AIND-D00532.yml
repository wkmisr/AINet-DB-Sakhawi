translation:
  ja: アハマド・ブン・アハマド・アル＝ウマリー。アル＝ウマリーのニスバは、司令官の一人であるズー・ウマルに由来する。彼は845年ラビーウ・アル＝アーヒル月29日土曜日、メッカ郊外イエメン方面のアル＝ガドで死去し、そこに埋葬された。イブン・ファハドが彼について記録した。
  en: Aḥmad b. Aḥmad al-ʿUmarī, named al-ʿUmarī due to Dhawī ʿUmar, one of the commanders. He died on Saturday, the twenty-ninth of Rabīʿ al-Ākhir, in the year 845, at al-Ghad outside Mecca in the direction of Yemen, and was buried there. Ibn Fahd recorded his death.
