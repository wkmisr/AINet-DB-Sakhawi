notes:
- text: 見出し中の「بن جمال الثنا」は父祖名（この一族は「ابن جمال الثناء」を家名とする。cf. corpus L39432「ويعرف كأبيه بابن جمال الثناء」）であり、本人のラカブではない。初版が持っていた laqab 要素（الثنا）を除去した。なお本項は刊本の立項番号を持たない見出しで（前項 D04460 が「81」、次項 D04462 が「82」）、実質的には子2人の伝記に対する父の索引項だが、自項に転送指示（مضى／يأتي／في…）を欠くため Waka 裁定 2026-09-08 の絶対基準により実項として扱う。ISSUES §D-1 参照。
