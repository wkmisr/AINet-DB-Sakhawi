translation:
  ja: ムハンマド・ブン・イブラーヒーム・アル＝アルディー（アレッポ近郊のアル＝アルディーにちなむニスバ）・アル＝ハラビー。若者で、（8）96年シャウワール月に私のもとで『アッ＝タワッジュフ・リッ＝ラッブ』を読んだ。聞くところでは、彼の父はアレッポの学識ある人々の一人で、同地の布地店で生計を立てているという。
  en: Muḥammad b. Ibrāhīm al-ʿArḍī—a nisba to al-ʿArḍī in the environs of Aleppo—al-Ḥalabī. A young man who read al-Tawajjuh li-l-Rabb with me in Shawwāl of the year [8]96. I have been told that his father is one of the learned men of Aleppo who make their living in a cloth shop there.
