translation:
  ja: アブドゥッラー・ブン・ハッジャージュ・ブン・アフマド・ブン・ムーサー・アル＝ビルマーウィー・アル＝カーヒリー、書法教師（アル＝ムクティブ）。後述するアル＝バドル・ムハンマドの父。イブン・ハッジャージュとして知られる。伝えられるところでは、アル＝ワスィーミーらのもとで書を学び、これに秀でて、その教授に専心した。彼が作成した巻物（ダルジュ）には、我らがシャイフ（イブン・ハジャル）らが賛辞（タクリーズ）を寄せた。諸方面の職掌（ジハート）に俸禄口を得たが、私の得た情報では貧しかった。850年頃に没した。また私は、彼の父が786年にアズハルのイマームであるアル＝ファフル・アル＝バルビースィーについて行った証言〔文書〕を目にしたが、そこで彼〔父〕は彼〔アル＝ファフル〕を「我らがシャイフ」と記していた。
  en: ʿAbd Allāh b. Ḥajjāj b. Aḥmad b. Mūsā al-Birmāwī al-Qāhirī, the writing-master (al-muktib), father of al-Badr Muḥammad, mentioned below, and known as Ibn Ḥajjāj. He wrote, so it is said, under al-Wasīmī and others, excelled at it, and devoted himself to teaching it. He wrote a scroll (darj) for which our shaykh (Ibn Ḥajar) and others wrote commendations (taqrīẓ). He was given stipendiary posts in the [administrative] departments (al-jihāt) but, according to what reached me, he was poor. He died around the year fifty [850 AH]. I also saw a testimony of his father concerning al-Fakhr al-Bilbīsī, imam of al-Azhar, dated 786 AH, in which he described him as "our shaykh".
