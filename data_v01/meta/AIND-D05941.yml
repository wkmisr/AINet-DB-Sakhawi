translation:
  ja: ウマル・ブン・アビー・サイード・ムハンマド・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ザヒーラ・ブン・アフマド・ブン・アティーヤ、イブン・ザヒーラ、アル＝クラシー。母はザビードの女性。（8）36年に一団とともに我々にイジャーザを与えた。イブン・ファハドは彼のために（記載欄を）空白にしている。
  en: ʿUmar b. Abī Saʿīd Muḥammad b. Abī Bakr b. ʿAbd Allāh b. Ẓahīra b. Aḥmad b. ʿAṭiyya, Ibn Ẓahīra, al-Qurashī; his mother was a woman of Zabīd. He granted us an ijāza, together with a group, in the year (8)36. Ibn Fahd left his entry blank.
