- text: 「وهو غير الشهاب الشغري نزيل حلب أيضا وصاحب الترجمة أفضلهما」＝同じくアレッポに住んだ الشهاب الشغري とは別人で、本項主のほうが優れる、という著者の断り。الشهاب الشغري＝#AIND-D01521「أحمد بن محمد بن محمد بن عمر الشهاب أبو العباس الشغري … الحلبي الشافعي … ثم رأيت له بعد دهر شرحا لجمع الجوامع والبهجة … مات قريبا من سنة خمس وثمانين」（ブリーフ候補、ラカブ＋ニスバ＋アレッポで閉合）。別人と明記されているので relation は立てない。ニスバ「العيني نسبة لعين البندق من أعمال الشغر」は由来説明。「وكان خيرا」は人物評（訳のみ）。
