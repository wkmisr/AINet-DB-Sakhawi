translation:
  ja: ユースフ・ブン・アフマド・ブン・ダーウード・アル＝アイニー（シュグル管下のアイン・アル＝ブンドゥクにちなむ）、のちアッ＝シュグリー、シャーフィイー派、アレッポに住んだ。シュグルで育ったのでアッ＝シュグリーと呼ばれるが、生地はアル＝アインである。同じくアレッポに住んだアッ＝シハーブ・アッ＝シュグリーとは別人で、本項の人物のほうが二人のうちでは優れている。私は彼の著作として、『タスリーフ・アル＝イッズィー』の韻文化とその注釈、その韻文への注釈、また『アル＝ミンハージュ・アル＝アスリー』の韻文化、『アル＝ミンハージュ・アル＝ファルイー』の一部（の韻文化）、8巻からなる『アル＝バフジャ』の注釈を見た。善良な人であった。私に届いたところでは885年に没した。神よ彼を憐れみたまえ。
  en: Yūsuf b. Aḥmad b. Dāwūd al-ʿAynī—after ʿAyn al-Bunduq, in the district of al-Shughr—then al-Shughrī, the Shāfiʿī, resident of Aleppo. He is called al-Shughrī because he grew up there, though his birthplace was al-ʿAyn. He is not the same as al-Shihāb al-Shughrī, likewise a resident of Aleppo, and the subject of this entry is the better of the two. I have seen by him a versification of the Taṣrīf of al-ʿIzzī together with a commentary on it and a commentary on the versification, as well as a versification of al-Minhāj al-Aṣlī and of a portion of al-Minhāj al-Farʿī, and a commentary on al-Bahja in eight volumes. He was a good man. He died in the year 885, according to what has reached me; may God have mercy on him.
