translation:
  ja: ムハンマド・ブン・アフマド・ブン・ハサン・ブン・ウマル、ナースィル・アッ＝ディーン、アッ＝シハーブの子、アッ＝ディマシュキー・アッ＝シュワイキー（ダマスクスの街区にちなむニスバ）、シャーフィイー派。アル＝カーディリー、アッ＝サーリム、アッ＝タワーキーの名で知られる。マッカで私（サハーウィー）から多くを聴聞した者の一人。私は彼にイジャーザを書き与え、その要旨を『大史（アッ＝ターリーフ・アル＝カビール）』に収めた。
  en: Muḥammad b. Aḥmad b. Ḥasan b. ʿUmar, Nāṣir al-Dīn b. al-Shihāb, al-Dimashqī al-Shuwaykī (a nisba to a quarter there), the Shāfiʿī, known as al-Qādirī, as al-Ṣārim and as al-Ṭawāqī. One of those who heard much from me in Mecca; I wrote an ijāza for him and deposited its gist in al-Taʾrīkh al-kabīr.
