translation:
  ja: アクバルディー・アル＝アシュラフィー・バルスバーイは、彼の主君（ウスターズ）の時代には第三のアーミール・アフール（厩舎長）であった。その後、アッ＝ザーヒル（スルタン）によってトリポリへアミールとして追放され、そこで50歳になる前に亡くなった。
  en: Aqburdī al-Ashrafī Barsbāy was a third-rank amīr akhūr (master of the horse) in the days of his master. Al-Ẓāhir later expelled him to Tripoli as an amīr there, where he resided until his death before the age of fifty.
