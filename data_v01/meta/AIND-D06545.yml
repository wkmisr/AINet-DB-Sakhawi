  note:
    ja: '「وممن أخذ عنه وعن أبيه عبد الله البصري صاحب البرهاني بن ظهيرة」＝本項主が師（規則15）。عبد الله البصري＝#AIND-D04492「عبد الله بن عبد الواحد … الشيرازي الأصل البصري الشافعي نزيل مكة ويعرف فيها بالشيخ عبد الله البصري … فقرأ القرآن لعاصم على إبراهيم ابن محمد بن أحمد بن زقزق … وعلى محمد بن إبراهيم بن زقزق البصري جانبا من الحاوي ومختصر الملحة … وعكف على البرهاني قاضيها」（本項主を名指し、البرهاني との関係も閉合。repo 未収録）。「صاحب البرهاني بن ظهيرة」は عبد الله の属性＝relation にしない。父 #AIND-D00253 との師弟は父の項で立てる。初版は既登録 TMP-P-000340（登録＝عبد الله البصري、出現 D00253＝父の弟子として登録された同じ人物）への student relation（規則15 で廃止された向き）と、البرهان بن ظهيرة（#AIND-D00196）への統制外 relation「associate of student」。'
