translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・アフマド、アル＝バスリー、アッ＝シャーフィイー。父と、兄弟のイブラーヒームおよびイスマーイールは既出。イブン・ズクズクの名で知られる。故郷とシャームで学び、法学・アラビア語学その他に秀で、『ジャワーヒル』（『ムルハ』の要約）に簡潔で良い注釈を著した者の一人。彼と彼の父から学んだ者に、アル＝ブルハーニー・ブン・ズハイラの仲間であるアブドゥッラー・アル＝バスリーがいる。
  en: Muḥammad b. Ibrāhīm b. Muḥammad b. Aḥmad al-Baṣrī al-Shāfiʿī, whose father and whose brothers Ibrāhīm and Ismāʿīl have been mentioned above; known as Ibn Zuqzuq. He was among those who studied in his home town and in Syria, excelled in jurisprudence, Arabic and other fields, and wrote a good, concise commentary on the Jawāhir, the abridgement of the Mulḥa. Among those who studied under him and under his father was ʿAbd Allāh al-Baṣrī, the companion of al-Burhānī Ibn Ẓahīra.
