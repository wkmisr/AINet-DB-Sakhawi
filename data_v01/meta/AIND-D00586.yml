translation:
  ja: アフマド・ブン・アブー・バクル・ブン・イスマーイール、法学者、アブー・アル＝アッバース、アッ＝ダンカリー、アル＝ヤマニー、アッ＝シャーフィイー。学問に励み、法学を修め、傑出していた。アル＝アフダルはその歴史書（『ターリーフ』）の中で、彼を篤学で精緻な法学者であり、マハーリブのカーディー職に就いた者だと述べ、「私（アフダル）は彼と面識があった。その後、彼は禁欲からカーディー職を辞した」と記した。アフダルは彼の訃報を838年に聞いた。
  en: Aḥmad b. Abī Bakr b. Ismāʿīl, the jurist, Abū al-ʿAbbās, al-Dankalī, al-Yamānī, al-Shāfiʿī. He devoted himself to knowledge, studied fiqh, and excelled. al-Ahdal stated in his history that he was a diligent, verifying jurist who held the judgeship of al-Maḥālib and that he (al-Ahdal) had met him; the subject later relinquished the judgeship out of asceticism. al-Ahdal heard of his death in the year 838 H.
