translation:
  ja: アイダキー・アル＝ジャーラクスィー・アル＝アシュラフィー・バルスバーイ。アル＝ザーヒル・フシュカダムの治世初期に十人隊長（アミール・アシャラ）となり、その後ラアス・アン＝ナウブ（親衛隊長の一人）となった。872年、スワールの戦いで50歳を超えて戦死した。行動的で勇敢であったが、自らに対して浪費的であった。
  en: Aydakī al-Jārakasī al-Ashrafī Barsbāy. He became an amir of ten in the early days of al-Ẓāhir Khushqadam's reign and subsequently became one of the heads of the Nawba (ruʾūs al-nuwab). He was killed in the battle of Suwār in 872, being over fifty years old. He was energetic and brave, but extravagant with himself (self-indulgent).
