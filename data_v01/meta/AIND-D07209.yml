translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アリー・ブン・スルフ・アッ＝タラーブルスィー、ハンバリー派。イブン・サラータ（無点のスィーン）として知られる。私は彼が（8）54年にいくつかのイスティドアー（イジャーザ請願書）に書き入れたのを見た。それどころか、（8）69年にマッカの人々の幾人かが彼に『ブハーリー』を読誦し、彼がイジャーザを与えたのを見た。私に伝わったところでは、彼は聡明さと理解力をもってイブン・ラジャブの『カワーイド』を諳んじていた。
  en: Muḥammad b. Abī Bakr b. ʿAlī b. Ṣulḥ al-Ṭarābulusī al-Ḥanbalī, known as Ibn Sallāta (with undotted sīn). I saw that he had written in some istidʿāʾāt (ijāza requests) in the year (8)54; indeed I saw some Meccans read al-Bukhārī to him in the year (8)69, and he granted ijāza. According to what reached me, he had Ibn Rajab's Qawāʿid at his command, with intelligence and understanding.
