translation:
  ja: アフマド・アッ＝シハーブ・アル＝クーシー、後にアル＝カーヒリー。彼は交易に関心を持ち、そのために海路などでヒジャーズ地方へ旅をした。その後、アッ＝タキー・アル＝ブルキーニーとその子ワリー・アッ＝ディーン（アル＝ワラウィー）に随行し、次いでアッ＝ザイニー・イブン・ムズヒルに師事してその者に専心した。アル＝ブルキーニーと共にラジャビーヤ（隊商）でハッジを行い、常にクルアーン読誦に励み、サイード・アッ＝スアダーのサラーヒーヤでスーフィズムの修行を積んだ。晩年には状態が良くなった。878年ジュマーダー・アル＝アーヒラに死去した。アッラーの慈悲あれ。
  en: Aḥmad al-Shihāb al-Qūṣī, then al-Qāhirī. He was among those who engaged in trade and traveled to the Ḥijāz for that purpose, by sea and other means. He then accompanied al-Taqī al-Bulqīnī and his son Walī al-Dīn (al-Walawī), and afterwards al-Zaynī b. Mazhar, attaching himself exclusively to him. He performed the Hajj with (al-Bulqīnī) in the Rajabiyya caravan, while maintaining constant Qurʾān recitation and practicing Sufism at the Ṣalāḥiyya Saʿīd al-Suʿadāʾ. In his later life his condition improved. He died in Jumādā al-Ākhira in the year 878 H. May God have mercy on him.
