translation:
  ja: ムハンマド・ブン・アブドゥッラティーフ・ブン・ムーサー・ブン・ウマイラ・ブン・ムーサー、アル＝ジャマール、アル＝クラシー・アル＝マフズーミー・アル＝ユブナーウィー・アル＝マッキー。ヒジュラ暦8□1年（十の位は原文欠落）のズー・アル＝ヒッジャ月に生まれ、…830年代のいずれかの年のズー・アル＝ヒッジャ月にマッカで没した。神が彼を憐れみたまわんことを。イブン・ファハドが彼の没年を記録している。
  en: Muḥammad b. ʿAbd al-Laṭīf b. Mūsā b. ʿAmīra b. Mūsā, al-Jamāl, al-Qurashī al-Makhzūmī al-Yubnāwī al-Makkī. He was born in Dhū al-Ḥijja in the year [8]?1 (the decade is missing in the printed text) … and died in Dhū al-Ḥijja in one of the years between 833 and 839 in Mecca; may God have mercy on him. Ibn Fahd recorded his death date.
