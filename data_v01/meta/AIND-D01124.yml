translation:
  ja: アフマド・ブン・ウマル・ブン・アブドゥッラー・アッ＝シャーブ・アッ＝ターイブ。このように、彼（アフマド）の祖父アブドゥッラーは、マクリーズィーやイブン・ファハドによって名付けられた（系譜が示された）。一方、我らがシャイフ（イブン・ハジャル）や他の者たちは、彼（アフマド）をアフマド・ブン・イーサーと名付けた。これは以前にも述べた通りである。
  en: Aḥmad b. ʿUmar b. ʿAbd Allāh al-Shābb al-Tāʾib. Thus, his grandfather ʿAbd Allāh was named (identified in genealogy) by al-Maqrīzī and then by Ibn Fahd. Our shaykh (Ibn Ḥajar) and others, however, named him (the subject Aḥmad) as Aḥmad b. ʿĪsā. This has been mentioned previously.
