  ja: マンスール・ブン・アキール・ブン・ムバーラク・ブン・ルマイサ・アル＝ハサニー・アル＝マッキー。850年ラビーウ第一月にワーディー・マッルのアッ＝ダクナーで没し、マッカに運ばれてそこに埋葬された。
  en: Manṣūr b. ʿAqīl b. Mubārak b. Rumaytha al-Ḥasanī al-Makkī. He died in Rabīʿ I 850 at al-Daknāʾ in Wādī Marr, and was carried to Mecca and buried there.
