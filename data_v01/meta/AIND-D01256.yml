translation:
  ja: アフマド・イブン・ムハンマド・イブン・アフマド、カーディー・シハーブ・アッ＝ディーン、大カーディー・シャムス・イブン・アル＝ハラウィーの孫でハラブ出身のハナフィー派法官は、891年ズー・アル＝ヒッジャに罷免された。イブン・アル＝ラッブーディーがそのように記録した。
  en: Aḥmad b. Muḥammad b. Aḥmad, al-Qāḍī Shihāb al-Dīn, grandson of Qāḍī al-Quḍāt al-Shams b. al-Ḥalāwī al-Ḥalabī, the Ḥanafī judge of Aleppo, was dismissed in Dhū al-Ḥijja 891 AH. Ibn al-Labbūdī recorded this.
