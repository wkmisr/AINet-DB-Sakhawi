translation:
  ja: アリー・ブン・シュクル・アル＝ハサニー〔ハサン・ブン・アジュラーンの（解放奴隷の子）〕・アル＝マッキー。前述のバディードの兄弟で、富裕な大隊長（カーイド）たちの一人。858年ズー・アル＝ヒッジャ月にマッカ（メッカ）で没した。イブン・ファハドが彼の没年を記録している。
  en: ʿAlī ibn Shukr al-Ḥasanī [i.e. of the household of] Ḥasan ibn ʿAjlān, al-Makkī, the brother of the aforementioned Badīd and one of the great, wealthy commanders (quwwād). He died in Mecca in Dhū al-Ḥijja of the year 858 AH. Ibn Fahd recorded his death.
