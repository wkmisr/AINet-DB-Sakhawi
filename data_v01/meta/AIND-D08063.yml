translation:
  ja: ムハンマド・ブン・アリー・ブン・フサイン・ブン・シュクル・ブン・ムハンマド・ブン・アリー・ブン・ヤフヤー・ブン・アフマド・ブン・スライマーン、アル＝ハサニー、アル＝バスリー、イブン・シュクルとして知られる。彼もまた840年ズー・アル＝ヒッジャ月にマッカで没した。イブン・ファハドが没年を記している。
  en: Muḥammad b. ʿAlī b. Ḥusayn b. Shukr b. Muḥammad b. ʿAlī b. Yaḥyā b. Aḥmad b. Sulaymān al-Ḥasanī al-Baṣrī, known as Ibn Shukr. He too died in Mecca in Dhū al-Ḥijja of the year 840. Ibn Fahd recorded his date of death.
