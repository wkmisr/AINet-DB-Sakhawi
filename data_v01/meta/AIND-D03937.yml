translation:
  ja: アブドゥッサラーム・アル＝ファーリスクーリー・アル＝アズハリー・アル＝ガースィル（湯灌師）。888年ムハッラム月27日の金曜の夜に没した。善人で、長い間死者の湯灌を行い、そのために人々に求められ、その多くを神への奉仕として無償で行った。神の慈悲あれ。
  en: ʿAbd al-Salām al-Fāriskūrī al-Azharī al-Ghāsil (the washer of the dead). He died on the night of Friday, 27 Muḥarram 888 AH. He was a good man who for a long time washed the dead, was sought out for it, and did most of it voluntarily seeking God's reward. May God have mercy on him.
