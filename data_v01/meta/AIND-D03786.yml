translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・ファーディル・ブン・アブドゥルラフマーン。アッ＝ザイン、アル＝ジャザーイリー、アル＝マグリビー、アル＝マーリキー。マッカのムワッファク・リバートの住人で、イブン・ファーディルとして知られる。徳高く、多才なシャイフであり、マッカに定住した。マッカでの私の二度目の隣住（ムジャーワラ）の際には、伝承と学解の両面（リワーヤとディラーヤ）において私に密に師事した。また、敬虔な人物であった。881年ズルカアダ月（11月）に没し、マッカのアル＝ムアッラー墓地に埋葬された。享年は70歳に近かった。アッラーの慈悲あれ。
  en: ʿAbd al-Raḥmān b. Muḥammad b. Fāḍil b. ʿAbd al-Raḥmān, Zayn al-Dīn, al-Jazāʾirī al-Maghribī al-Mālikī. He resided at Ribāṭ al-Muwaffaq in Mecca and was known as Ibn Fāḍil. He was a virtuous and versatile shaykh who settled in Mecca. He closely accompanied me (al-Sakhāwī) during his second extended stay (jawārah) there, studying both the transmission and comprehension of Hadith (riwāyatan wa-dirāyatan), and he was a righteous man. He died in Dhu al-Qaʿdah 881 AH and was buried in al-Muʿallā cemetery. He was nearly seventy years old. May Allah have mercy on him.
