    ja: '見出しナサブから復元。ナーブルス山地の在地シャイフ家「بنو عبد القادر」（#AIND-D02495「حرب بن … بن عبد القادر شيخ جبال نابلس」・#AIND-D03395「صعب بن أحمد بن حسن بن علي بن عبد القادر شيخ نابلس」・#AIND-D07717「محمد بن عبد القادر أحد مشايخ نابلس」）の一員。候補: #AIND-D07717「محمد بن عبد القادر أحد مشايخ نابلس وأظن عبد القادر جدله أعلى … فقتل هذا … سنة ثمان وخمسين」（サハーウィー自身が عبد القادر を遠祖と疑う＝本項主の父と同一の可能性があるが、父名 سليمان が相手側に出ず、閉合は名 محمد＋家名＋職 شيخ نابلس の位置づけのみ＝規則26・57 で同定しない、ISSUES §D156-6）。【集約 2026-11-05】父自身にラカブ・クンヤ・職・珍しい名がなく（家名 بنو عبد القادر は規則3 の識別要素に入らない）、本伝のある兄弟とも共有しない＝規則3 (c'') の字義どおり #NEEDID。校閲の新規 取り下げた仮番号 B156-P03 は取り下げ（内容A L、決定3）。'
