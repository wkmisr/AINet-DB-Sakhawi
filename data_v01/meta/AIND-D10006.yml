translation:
  ja: マンスール・ブン・アビー・バクル・ブン・マンスール・ブン・アビー・バクル・アル＝ジャナーニー・アル＝アズハリー・アッ＝シャーフィイー、シャイフ・サリームの娘の子（スィブト）。しばらくマッカに住み、私（サハーウィー）の最初の（マッカ）滞在のときそこにいて、私の読み上げによりアブー・アル＝ファトフ・アル＝マラーギーから聴講した。861年ジュマーダー第一月朔日にそこ（マッカ）で没し、アル＝マアラーに埋葬された。
  en: Manṣūr b. Abī Bakr b. Manṣūr b. Abī Bakr al-Janānī al-Azharī al-Shāfiʿī, daughter's son of Shaykh Salīm. He resided in Mecca for a time and was there during my first sojourn (mujāwara), when he heard from Abū al-Fatḥ al-Marāghī through my reading. He died there on the first of Jumādā I 861 and was buried at al-Muʿallā.
