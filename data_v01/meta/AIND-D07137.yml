translation:
  ja: ムハンマド・ブン・アッ＝トゥンブガー、ナースィル・アッ＝ディーン・アル＝クラシー。その父は大アミール（アミール・カビール）である。端正で、気概があり、勇敢な青年であった。労咳で没したが、毒を盛られたとも言われ、父は彼の死を深く悲しんだ。我らがシャイフ（イブン・ハジャル）は『インバー』の823年の項で彼の死を記したが、正しくは、アル＝アイニーが記すとおり、その前年（822年）のラジャブ月10日木曜日に没したのである。アル＝アイニーは、彼がカラーファのバクタムル・アッ＝サーキー廟のそばに埋葬されたと言い、また言う。彼はミスル（エジプト）のタブルハーナー（級アミール）の一人で、若く瑞々しく、アル＝ムアイヤドに殊のほか寵愛されており、そのためアル＝ムアイヤドが彼の婚礼の用を自ら執り行い、それに1万ディナール近くを費やしたと言われる、と。
  en: 'Muḥammad b. al-Ṭunbughā, Nāṣir al-Dīn al-Qurashī; his father was the Great Amīr (al-amīr al-kabīr). He was a handsome, high-minded and brave young man. He died of consumption, and it is said that he was given poison; his father grieved for him greatly. Our shaykh (Ibn Ḥajar) dated him under the year 823 in his Inbāʾ, but the correct date is that he died on Thursday 10 Rajab of the year before (822), as al-ʿAynī dated it, who said that he was buried by the turba of Baktamur al-Sāqī in al-Qarāfa. He (al-ʿAynī) said: he was one of the ṭablkhānāh (amīrs) in Egypt, a fresh youth, a special favourite of al-Muʾayyad, who therefore himself took charge of the business of his marriage and, it is said, spent nearly ten thousand dinars on it.'
