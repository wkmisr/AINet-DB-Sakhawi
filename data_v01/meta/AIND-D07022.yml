translation:
  ja: ムハンマド・ブン・アフマド・ブン・ユースフ、カイサーリーヤ・アッ＝タルヒーの布商（バッザーズ）で、私の姻戚の共同経営者、アブー・イブラーヒームとして知られる。巡礼し、多くの者より行状が真っ当であった。870年の少し前に没した。
  en: Muḥammad b. Aḥmad b. Yūsuf, the cloth merchant (al-bazzāz) at Qaysāriyyat al-Ṭarḥī and the partner of my in-law (ṣihrī), known as Abū Ibrāhīm. He performed the pilgrimage and was sounder in his condition than many. He died shortly before [the year] 870.
