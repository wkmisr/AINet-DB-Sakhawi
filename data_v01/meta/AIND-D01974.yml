translation:
  ja: イラーク系マッカのハンバリー法学者、イスマーイール・ブン・アル＝ジャマール・ブン・ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・ムスリフ・ブン・イブラーヒーム。彼の祖父については後述。マッカのハンバリー派の講義に出席し、私（サハーウィー）の講義には特に頻繁に出席した。
  en: Ismāʿīl b. al-Jamāl b. Muḥammad b. Ibrāhīm b. Muḥammad b. Muṣliḥ b. Ibrāhīm, of Iraqi origin, from Mecca, Ḥanbalī. His grandfather is mentioned previously. He attended the lectures of the Ḥanbalīs in Mecca and most frequently attended my (al-Sakhāwī's) sessions.
