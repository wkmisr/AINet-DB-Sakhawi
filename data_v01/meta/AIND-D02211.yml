    en: Was held in great esteem by common people, who considered him among the majādhīb (those spiritually attracted to God).
translation:
  ja: ブカイル・シャイフは、俗人の間で大きな信仰を集めていた。彼らは彼を「惹かれた者たち（ムジャーズィーブ）」の一員と見ていたためである。事実、私はジャラール・アル＝ブルキーニーとその兄弟が彼を信仰していた者たちの一人であり、恐らく彼（ブカイル）が彼ら（ブルキーニー兄弟）の集会に出席していたと聞いた。私は彼を何度も見かけたが、彼はしばしば街路に立ち止まっていた。852年ラビーウ・アル＝アウワル月に死去し、スワイカ・サフィーヤにあるザーウィヤに埋葬された。
  en: Bukayr Shaykh was held in high regard by common people, who considered him one of the majādhīb (those divinely attracted). Indeed, I heard from al-Jalāl al-Bulqīnī and his brother that they were among those who believed in him, and perhaps he attended their gatherings. I saw him often, and he used to stand frequently in the streets. He died in Rabīʿ al-Awwal 852 H and was buried in a zawiya in Suwayqat Ṣafīya.
