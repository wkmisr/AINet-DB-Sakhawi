notes:
- text: 「وهو أسن الثلاثة ويليه أحمد الماضي」＝三兄弟の最年長（أحمد 833年生、أبو الخير 836年生）。D01083 の「سبط النور الرشيدي」（母方祖父 TMP-P-000955）は D12206 が三人を أشقاء とするので本項主にも及ぶが、本項原文に言及がないため note に留める（規則23）。#AIND-D07756「محمد بن عبد الله بن أحمد الخانكي البلبيسي الأصل ويعرف بابن التاجر」は同じ通称・出自の別人（続柄不明）。初版の residence event ×2（القاهرة・الخانكة）はニスバ「القاهري ثم الخانكي」からの補完のため除去（規則22(1)）。
