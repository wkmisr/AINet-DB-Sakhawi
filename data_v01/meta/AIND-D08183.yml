translation:
  ja: ムハンマド・ブン・アリー・ブン・ムハンマド、アル＝バドル・アル＝カーヒリー、のちアル＝ハーンキー、アッ＝シャーフィイー。父が商人であったことからイブン・アッ＝タージル（商人の息子）として知られる。クルアーンを暗記した者の一人で、三人（兄弟）の最年長であり、先述のアフマドがこれに次ぐ。
  en: Muḥammad b. ʿAlī b. Muḥammad, al-Badr al-Qāhirī, then al-Khānkī, al-Shāfiʿī, known as Ibn al-Tājir because his father was a merchant. He was among those who memorized the Qurʾān; he was the eldest of the three (brothers), followed by the aforementioned Aḥmad.
