translation:
  ja: アブドゥッラー・ブン・シュクル。サイイド・ハサン・ブン・アジュラーンのマウラー（解放奴隷・被護者）。彼は兄弟のバディードとともにサイイド・ムハンマド・ブン・バラカートと対立していたが、その兄弟が（服従の）誓約をした際、サイイドは彼に安全保障を与えることを拒み、彼を兄弟のもとへ送り返した。それは864年のことである。イブン・ファハドが彼の項を書き出しており、彼は897年の時点で存命である。
  en: ʿAbd Allāh b. Shukr, the mawlā (freedman/client) of al-Sayyid Ḥasan b. ʿAjlān. He was with his brother Badīd in opposition to al-Sayyid Muḥammad b. Barakāt; when the brother swore [allegiance], the Sayyid refused to grant him safe-conduct and sent him back to his brother — that was in the year 864. Ibn Fahd excerpted his entry, and he is, in the year 897, among the living.
