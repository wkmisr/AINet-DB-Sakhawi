translation:
  ja: アリー・ブン・ムハンマド・ブン・アッ＝シャイフ・アル＝ファーディル・クフル、アル＝マグリビー・アル＝フマイディー。祖父はサイイド・フマイダのマワーリー（被護民）の一人であった。814年にアッ＝ザイン・アル＝マラーギーのもとで『ムスリム』の読了会などを聴聞した。イブン・ファフドが彼に言及している。
  en: ʿAlī b. Muḥammad b. al-Shaykh al-Fāḍil Kuḥl al-Maghribī al-Ḥumayḍī. His grandfather was one of the clients (mawālī) of al-Sayyid Ḥumayḍa. In the year 814 he heard from al-Zayn al-Marāghī the completion (khatm) of (the Ṣaḥīḥ of) Muslim and other things. Ibn Fahd mentioned him.
