translation:
  ja: ハサン・ブン・カラ・ユルク（カラ・ユルクの本名はウスマーン）。855年の戦いで戦死した。私が歴史事件録（『アル＝ハワーディス』）に書いた通りである。彼は、ジャハーンギールと、ハサン・ブン・アリー・ブン・ウスマーン・カラ・ユルクの叔父である。
  en: Ḥasan b. Qarā Yuluk (the real name of Qarā Yuluk was ʿUthmān). He was killed in battle in the year 855 AH, as I have written in [my book of] historical events (al-Ḥawādith). He was the paternal uncle of Jahāngīr and of Ḥasan b. ʿAlī b. ʿUthmān Qarā Yuluk.
