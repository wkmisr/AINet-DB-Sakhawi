translation:
  ja: アズダマル・ミン・ヤシュバク（ヤシュバクから購われた者）、アッ＝ザーヒリー・ジャクマク（ジャクマクのマムルーク）。アル＝ファキーフとして知られる。昇進を重ね、アル＝アシュラフ・カーイトバーイの治世に十人隊長（アミール・アシャラ）となり、その後アダナの戦いから帰還した際にタブルハーナー級への昇格を授けられた。その後、カーンスーワ・アッ＝シャーミーに同道してハラブへ赴いた。
  en: Azdamar min Yashbak (purchased from Yashbak), al-Ẓāhirī Jaqmaq, known as al-Faqīh. He advanced through posts until he became an amir of ten in the reign of al-Ashraf Qāytbāy. Then he was granted a ṭablakhānāh upon his return from the battle of Adana. He then traveled to Aleppo in the company of Qansawh al-Shami.
