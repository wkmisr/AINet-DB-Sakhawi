notes:
- text: '「مضى فيمن جده عبد الله بن أبي بكر بن محمد」＝転送見出し。転送先は #AIND-D04582（刊本 198 番「عبد الله بن محمد بن عبد الله بن أبي بكر بن محمد بن سليمان بن جعفر … الجمال أبو محمد بن الشرف أو المعين أبي عبد الله بن البهاء أبي محمد بن التاج بن المعين القرشي المخزومي الدماميني الأصل السكندري المالكي … ويعرف بابن الدماميني」）。祖父 عبد الله بن أبي بكر بن محمد（البهاء أبو محمد）が一致。本見出しの「أبي محمد」は祖父 عبد الله（البهاء أبو محمد）のクンヤによる呼称であり別の祖父名ではない。転送先は本バッチ B89 担当分外（D04582 は受領フォルダに含まれず）・`Individuals/` 未収録。'
