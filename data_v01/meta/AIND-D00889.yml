translation:
  ja: アフマド・ブン・アブドゥッラー・ブン・ビラール。マッカの聖域の絨毯係兼提灯係。ムハンマドとイスハークの兄弟。イブン・ファハドによると、彼がアブー・ファール・アッ＝ザイト・アフマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ビラールの父方の叔父であると推測される。
  en: Aḥmad b. ʿAbd Allāh b. Bilāl, the carpet-spreader and lamp-lighter at the Holy Sanctuary of Mecca, and brother of Muḥammad and Isḥāq. It is conjectured that he is the paternal uncle of Abū Fār al-Zayt Aḥmad b. ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh b. Bilāl. Mentioned by Ibn Fahd.
