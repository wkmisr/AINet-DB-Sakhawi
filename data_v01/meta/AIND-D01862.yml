translation:
  ja: スルタン・アル＝アシュラフ・カーイトバーイの親衛隊員の一人であったアルカマース・ミン・トルバーイは、その後トリポリの副知事職に左遷された。タールスース副知事のイーズディマルが殺害された後、アレッポの書記長官職に転任し、ジャンバク・アル＝タウィールが死亡した後にはシャームの書記長官職に転任し、派遣部隊とともに旅をした。
  en: Arkamās min Turbāy, one of al-Ashraf Qāytbāy's khāṣṣakīya (royal retainers), was then transferred to the vice-regency of Tripoli. He was subsequently moved to his dawādārīya (chancery) in Aleppo after Azdmar, the nāʾib of Tarsus, was killed. He was later transferred to his dawādārīya in al-Shām after the death of Jānbak al-Ṭawīl and traveled with the detachments.
