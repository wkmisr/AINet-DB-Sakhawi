translation:
  ja: アブド・アル＝カリーム・ブン・アブド・アル＝ガニー・ブン・ムハンマド・ブン・アフマド・ブン・ウスマーン、アル＝ビサーティー家の出でカイロの人、マクス地区の人。高名な学者アル＝ビサーティーの孫であり、後述のアル＝バドル・ムハンマドの兄弟である。将来を嘱望された子供で、母は父の女奴隷であった。880年代（883〜889年）に生まれ、父から、また私（サハーウィー）から『アル＝ムサルサル』と私の回答（アジュウィバ）の一部を聴聞した。その後、897年にペストで没した。
  en: ʿAbd al-Karīm b. ʿAbd al-Ghanī b. Muḥammad b. Aḥmad b. ʿUthmān, of Bisāṭī origin, the Cairene, al-Maqsī, grandson of the famous scholar al-Bisāṭī and brother of al-Badr Muḥammad (mentioned below). A promising child; his mother was a slave-girl of his father. He was born in the year eighty-odd and heard from his father, and likewise from me al-Musalsal and some of my responsa. Then he died of the plague in the year 897.
