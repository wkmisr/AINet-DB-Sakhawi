translation:
  ja: アフマド・ブン・イーサー・ブン・ユースフ・ブン・ウマル・ブン・アブドゥルアズィーズ・アル＝ハワーリー・アル＝バンダーリー。ハワーラ・アラブ族の長（アミール）。イブン・ウマルとして知られた。後述される兄弟スライマーンの解任後に（アミール職に）就任し、882年初頭に死去するまで在職した。彼は兄弟よりも良い状態にあった。彼が亡くなった後、甥のダーウード・ブン・スライマーンがアミール職を継いだ。
  en: Aḥmad b. ʿĪsā b. Yūsuf b. ʿUmar b. ʿAbd al-ʿAzīz al-Hawwārī al-Bandārī, Amīr of the Hawwāra Arabs, known as Ibn ʿUmar. He was installed (in the emirate) after the dismissal of his brother Sulaymān (to be mentioned later), and remained until he died in the beginning of 882 H. He was in a better condition than his brother. His nephew Dāwūd b. Sulaymān succeeded him in the emirate.
