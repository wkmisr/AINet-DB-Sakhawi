translation:
  ja: ムハンマド・ブン・アフマド・ブン・イブラーヒーム・ブン・ダーウード・アル＝マフアリー（ミームにファトハ、次にファー、無点字〔アイン〕、ラーム）・アッ＝サーリヒー・アン＝ナッジャール。アル＝マスルートとして知られる（無点字〔スィーン〕で、末尾は二点字〔ター〕）。おおよそ779年に生まれ、アル＝ムヒッブ・ブン・アッ＝サーミトのもとに、アッ＝スィラフィーの『ブルダーニーヤート』後半（の席）に連れて行かれ、のち彼からほかのものも聴いた。ハディースを語り、イブン・ファハドのような優れた人々が彼から聴いた。そして没した。
  en: Muḥammad b. Aḥmad b. Ibrāhīm b. Dāwūd al-Mafʿalī (with fatḥa on the mīm, then fāʾ, an undotted letter [ʿayn] and lām) al-Ṣāliḥī al-Najjār, known as al-Maslūt (with an undotted letter [sīn], and ending in a two-dotted letter [tāʾ]). He was born in approximately the year 779 and was brought as a child to al-Muḥibb b. al-Ṣāmit for the second half of al-Silafī’s Buldāniyyāt; later he heard other things from him. He transmitted ḥadīth, and worthy scholars such as Ibn Fahd heard from him. He then died.
