  en: Jānbak al-Ṭayyārī al-Ẓāhirī, administrator of customs in Jidda. He died in the year 868 H. Ibn ʿAzm recorded his death. (Al-Sakhāwī notes:) his case is to be verified together with the entry coming three entries later.
