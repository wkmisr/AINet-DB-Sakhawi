translation:
  ja: アブドゥルガッファール・ブン・アッ＝シャムス・ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アル＝イマード、ビルバイス出自でカイロの人。兄弟のムハンマドと二人の父は後述される。父は彼をアッ＝シャーウィーのもとでの『ブハーリー』（聴聞）に同席させ、同じく私（サハーウィー）のもとにも同席させた。幼くして亡くなり、両親ともに彼を悼んだ。神が彼らに楽園をもって償われるように。
  en: ʿAbd al-Ghaffār b. al-Shams Muḥammad b. Muḥammad b. ʿAlī b. al-ʿImād, of Bilbays origin, al-Qāhirī; his brother Muḥammad and their father are mentioned below. His father brought him to hear al-Bukhārī with al-Shāwī, and likewise brought him to me. He died as a child, and both his parents grieved for him; may God compensate them with Paradise.
