translation:
  ja: アブー・アル＝アッバース、アフマド・ブン・ムハンマド・アッ＝シャルキー。シャー、ラーム・キンリーからなるニスバ。アル＝ジャマール・アッ＝ライミーなどから伝承し、タイズで第一人者の一人となった。30代の頃に亡くなった。アル＝アフィーフは「イジャーザを授かって彼から伝承した」と述べた。
  en: Aḥmad b. Muḥammad Abū al-ʿAbbās al-Shalqī. He transmitted from al-Jamāl al-Raymī and others, and became one of the leading experts in Taʿizz. He died around the age of thirty. Al-ʿAfīf said, “I transmitted from him by ijāza.”
