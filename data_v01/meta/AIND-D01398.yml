translation:
  ja: 405. アフマド・ブン・ムハンマド・ブン・ウスマーン。ラカブは「光り輝く星（al-Shihāb）」、ニスバはアル＝ナフリーリー、その後アル＝カーヒリー。失明者（al-Ḍarīr）の異名を持つ。アル＝ザーヒリーヤ・アル＝カディーマの居住者で、その門に頻繁に座っていた数少ない現存のシャイフの一人。彼は879年ラジャブ月4日、月曜日の夜に高齢で亡くなった。彼と我らにアッラーの赦しがありますように。
  en: 405. Aḥmad b. Muḥammad b. ʿUthmān, al-Shihāb al-Naḥrīrī, then al-Qāhirī, al-Ḍarīr, a resident of al-Ẓāhiriyya al-Qadīma and one of its remaining shaykhs who used to frequently sit at its gate. He died on the night of Monday, the fourth of Rajab, in the year 879 [AH], at an advanced age. May God forgive him and us.
