translation:
  ja: ユースフ・ブン・サダカ、ムハッラクの出、アル＝カーヒリー、既出のアブド・アル＝カーディルとアブド・アッ＝ラヒームの兄弟。トルコ人（軍人）のまねをした者で、武具係（ザルドカーシュ）の一人。イブン・サダカとして知られる。（8）95年に、60歳に満たずして遠征の途上で没した。
  en: Yūsuf b. Ṣadaqa, of Muḥarraq origin, al-Qāhirī, brother of ʿAbd al-Qādir and ʿAbd al-Raḥīm, both mentioned above; one who imitated the Turks and one of the armourers (zardkāshiyya), known as Ibn Ṣadaqa. He died on the military expedition in the year [8]95, before completing sixty years of age.
