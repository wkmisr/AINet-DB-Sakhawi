  note:
    ja: '二重立項（転送指示なし＝両項とも実項）。#AIND-D10589「يونس بن صدقة المحرقي الأصل القاهري أخو عبد القادر وعبد الرحيم الماضيين ويعرف بابن صدقة . ممن تشبه بالترك وخدم وسافر للجون وفي عدة تجاريد . ومات في التي في سنة خمس وتسعين منها ولم يبلغ الستين ، وكان أحد الزردكاشية」（未収録）は、父名・ニスバ・兄弟2人・通称・「تشبه بالترك」・「الزردكاشية」・895年の遠征での死・60歳未満、のすべてが本項と一致し、名だけが يوسف／يونس（字形の近い2語）と異なる。兄 #AIND-D03862 の見出し「أخو عبد القادر ويونس الآتيين」と通称索引 #AIND-D12460「عبد الرحيم الفاضل وعبد القادر ويونس بنو صدقة المحرقي」は يونس だけを挙げ يوسف を挙げない＝同一人物が يوسف の名でも立項されたとみられる。サハーウィー自身の指示はなく校閲者の判断（ISSUES §D167-1）。D10589 側の鏡像は同項の受領時。'
