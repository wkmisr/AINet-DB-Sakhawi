    ja: '「رأيته فيمن عرض عليه سنة خمس وتسعين」。【集約】corpus の定型句（D03053「رأيته فيمن عرض عليه ابن أبي اليمن بمكة」、D03527「رأيت فيمن عرض عليه الزين بن الأدمي」、D05520「رأيته فيمن عرض عليه ناصر الدين الزفتاوي」、本項と同文の D06085・D06978・D09404・D10090・D08868）は「（ある提示者が）暗誦提示した相手（試問者）の中に彼を見た」の意で、本項主は試問者（師側）。提示者名は刊本で脱落しているため passive を #NEEDID とする（規則12 により relation は維持）。校閲時の向き（本項主＝学生、師 #NEEDID）は逆だったため反転。初版の wd:Q4120128（サハーウィーを師とする）も誤り。895 ＝ 1489-12-04〜1490-11-22、年のみのため年初 1489（h2g.py）。'
