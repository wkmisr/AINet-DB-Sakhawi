translation:
  ja: アフマド・ブン・アイ・アル＝ヤマン・ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アフマド・ブン・アブドゥルアズィーズ・アル＝アキーリー・アン＝ヌワイリー・アル＝マッキー。後述のアリーの兄弟であり、イブン・アビー・アル＝ヤマンとして知られる。801年に生まれ、翌年ラマダーン月に没した。
  en: Aḥmad b. Ay al-Yaman Muḥammad b. Muḥammad b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz al-ʿAqīlī al-Nuwayrī al-Makkī, known as Ibn Abī al-Yaman. He was born in the year 801 AH and died in Ramadan of the following year. He was the brother of ʿAlī, who will be mentioned later.
