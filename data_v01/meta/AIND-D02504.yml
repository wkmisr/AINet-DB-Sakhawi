translation:
  ja: ハサブ・アッラー・ブン・ムハンマド・ブン・バルクート・アッ＝サブキー・アル＝アジュラーニー。 隊長（カーイド）で、アッ＝サイイド・アブー・アル＝カースィムの側近の一人であった。 847年ジュマーダー・アル＝アーヒラにジッダで死去し、メッカに運ばれて同地に埋葬された。 イブン・ファハドが両者（本項と前項）の没年月を記録している。
  en: Ḥasab Allāh b. Muḥammad b. Barkūt al-Subkī al-ʿAjlānī. The qāʾid (commander), one of the close retainers of al-Sayyid Abū al-Qāsim. He died in Jeddah in Jumādā al-Ākhira 847 and was transported to Mecca and buried there. Ibn Fahd recorded the death dates of both him and the preceding man.
