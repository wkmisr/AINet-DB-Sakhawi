translation:
  ja: ファドル・ブン・イーサー・ブン・ラムラ・ブン・ジャンマーズ、アール・アリーの首長（アミール）。35年間首長の座にあった。バルクークがアル＝カラクから出た際に彼を支援した者の一人であり、それによってバルクークのもとで重んじられた。（8）16年ズー・アル＝カアダ月にナウルーズに殺されるまでその地位にあり続けた。われらがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Faḍl b. ʿĪsā b. Ramla b. Jammāz, amīr of Āl ʿAlī. He held the emirate for thirty-five years. He was among those who supported Barqūq when he came out of al-Karak, and thereby became highly regarded by him. He continued thus until Nawrūz killed him in Dhū al-Qaʿda of the year [8]16. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
