notes:
- text: '見出しの名は刊本どおり「حضر」（خ 部の項なので خضر の誤植の可能性が高いが、規則25により原文どおり保持）。「بن سمنطح」の بن は、同じ父を持つ #AIND-D13020「خديجة ابنة محمد سمنطح بن عبد الكريم …」・#AIND-D04183「عبد القادر بن محمد سمنطح بن عبد الكريم …」および父の本伝 #AIND-D07721「… ويعرف كسلفه بابن ظهيرة وهو بأبي سمنطح」から見て、سمنطح は父 محمد 自身の呼び名であり本来は「محمد سمنطح」（بن なし）と読まれるべきもの。原文どおり保持し、父の同定は note に記す。'
