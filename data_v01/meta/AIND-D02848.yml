translation:
  ja: ハダル・ブン・ムハンマド・ブン・サマンタハ・ブン・アブドゥルカリーム・ブン・アフマド・ブン・アティーヤ・ブン・ザヒーラ、アル＝クラシー、アル＝マッキー。805年に、イブン・スィッディーク、アル＝イラーキー、アル＝ハイサミー、アル＝マラーギー、イブン・アブドゥルハーディーの娘らが彼にイジャーザを与えた。
  en: Ḥaḍar b. Muḥammad b. Samanṭaḥ b. ʿAbd al-Karīm b. Aḥmad b. ʿAṭiyya b. Ẕahīra al-Qurashī al-Makkī. In the year 805 Ibn Ṣiddīq, al-ʿIrāqī, al-Haythamī, al-Marāghī, the daughter of Ibn ʿAbd al-Hādī and others granted him ijāza.
