translation:
  ja: アリー・ブン・マーニウ・ブン・アリー・ブン・アティーヤ・ブン・マンスール・ブン・ジャンマーズ・ブン・シーハ・アル＝フサイニー・アル＝マダニー。前述のウミヤーンの兄弟。父の後にマディーナのアミール職を求め、839年に彼と前述のアル＝アジュル・ブン・アジュラーンとがそれをめぐって争ったが、二人にはそれが叶わなかった。
  en: ʿAlī b. Māniʿ b. ʿAlī b. ʿAṭiyya b. Manṣūr b. Jammāz b. Shīḥa al-Ḥusaynī al-Madanī, the brother of the aforementioned Umyān. After his father he sought the emirate of Medina, and in the year 839 he and the aforementioned al-ʿAjl b. ʿAjlān contended over it, but it was not attained by either of them.
