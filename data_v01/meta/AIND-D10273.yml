translation:
  ja: ヤフヤー・ブン・アリー・ブン・ダーウード・ブン・スライマーン、アル＝ジャマール・アル＝ハフラキー、のちアッ＝スィジスターニー。アッ＝ターウースィーが彼から学び、彼を（人々を導く）イルシャードの人であり、スーフィーたちのシャイフであると評した。（アッ＝ターウースィーは）こう述べている。「私は彼のもとで『アーダーブ・アル＝ムリーディーン』を聴き、『ムーディハト・アル＝アスラール』と『ミルアート・アン＝ナーズィリーン・フィー・シャルフ・マナーズィル・アッ＝サーイリーン』を彼に読んだ。この二つはいずれも彼の著作である。同じく、私の四十の問いに対する答えで『ティラーズ・アッ＝ダカーイク・フィー・イブラーズ・アル＝ハカーイク』と名づけられたものも（読んだ）。それは（8）27年、彼がシーラーズで隠棲していた日々のことで、彼は私にイジャーザを与えた」。
  en: 'Yaḥyā b. ʿAlī b. Dāwūd b. Sulaymān, al-Jamāl al-Khafrakī, then al-Sijistānī. Al-Ṭāwūsī studied under him and described him as a man of spiritual guidance (irshād) and as the shaykh of the Sufis. He (al-Ṭāwūsī) said: "I heard from him the Ādāb al-murīdīn, and I read to him the Mūḍiḥat al-asrār and the Mirʾāt al-nāẓirīn fī sharḥ Manāzil al-sāʾirīn, both of them his own compositions, and likewise the answers to my forty questions, entitled Ṭirāz al-daqāʾiq fī ibrāz al-ḥaqāʾiq; that was in the days of his seclusion in Shīrāz in the year [8]27, and he granted me ijāza."'
