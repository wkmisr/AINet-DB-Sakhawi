translation:
  ja: イブラーヒーム・ブン・アッ＝シャムス・ムハンマド・ブン・アフマド・ブン・アブドゥッラー・アッ＝ディマシュキー。父と同様にイブン・クダイダールとして知られる。父の死後、ダマスカスの彼のザーウィヤ（スーフィー道場）のシャイフ職に就任し、良き作法と敬虔さをもって振る舞った。神が彼を憐れむ。
  en: Ibrāhīm, son of al-Shams Muḥammad, son of Aḥmad, son of ʿAbd Allāh al-Dimashqī. Like his father, he was known as Ibn Qudaydār. After his father, he settled in the shaykhdom of his zawiya in Damascus, where he conducted himself with good manners and piety. God have mercy on him.
