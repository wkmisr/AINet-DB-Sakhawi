translation:
  ja: 954 イスマイル・ブン・ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・サラーフ・ブン・イマーム・アッ＝サルガトミシーヤ。64（ヒジュラ暦864）年に没したが、「イスマイル」は（後に）追加されたもので、その時亡くなったのは、祖先であるアル＝マジュド・ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・サラーフの方である。
  en: 954 Ismāʿīl b. Muḥammad b. Muḥammad b. ʿAlī b. Ṣalāḥ b. Imām al-Ṣarghatmishīya. He died in the year '64 (864 H), but 'Ismāʿīl' is an addition, as al-Majd Muḥammad b. Muḥammad b. ʿAlī b. Ṣalāḥ (an ancestor) died at that time.
