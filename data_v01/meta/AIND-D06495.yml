notes:
- text: '転送見出し（原文末尾「فيمن جده محمد بن خطاب」による）。転送先は #AIND-D06546「محمد بن إبراهيم بن محمد بن حطاب الشمس أبو العباس الوسط الحلبي الكتبي ويعرف في صغره بالقاضي وربما حذف من نسبه محمد」（777生・852以後没、未受領）＝本見出しの省略ナサブ（بن خطاب）は D06546 本文「وربما حذف من نسبه محمد」が説明する形。曾祖父名の綴りは本見出し「خطاب」・D06546「حطاب」で点が異なる（刊本どおり、規則25）。corpus で「محمد بن إبراهيم」＋「حطاب」の見出しは D06546 のみ（hw.py）。'
