    ja: '息子 #AIND-D10283「يحيى بن عمر بن محمد بن أحمد بن عمر بن علي الشرف أبو زكريا بن السراج الحوراني الأصل الحموي المولد الشافعي التاجر نزيل مكة والماضي أبوه ويعرف كهو بابن الحوراني … ومات والده فأسند وصيته على أخويه إليه」（870年頃生）が本項主を「الماضي أبوه」と名指しする。規則23により cert medium で補完（集約時、内容検証B H-7）。同項により本項主のラカブは السراج、ハマー出自で、يحيى の成人後・893年以前に没したことが分かる（属性は補わず note のみ）。'
