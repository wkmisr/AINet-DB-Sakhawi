  note:
    ja: '本項には記述がないが、兄 #AIND-D01216「أحمد بن محمد بن أحمد بن عمر بن علي الشهاب الحوراني الأصل الحموي نزيل مكة وأحد أعيان التجار والآتي أخوه عمر والد يحيى وذاك أصغر وأبذل للفقراء … ويعرف بالحوراني」（896年没）が本項主を「الآتي أخوه عمر والد يحيى」と名指しする。ニスバ索引 #AIND-D11612「الحوراني … أحمد وعمر ابنا محمد بن أحمد بن عمر من أعيان التجار … وابن ثانيهما يحيى」とも閉合。規則23により cert medium で補完（集約時、内容検証B H-6）。'
