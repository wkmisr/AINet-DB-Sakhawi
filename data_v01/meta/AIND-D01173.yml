translation:
  ja: アフマド・ブン・キヤース（初字母にカスラ、軽減形）・ブン・ヒンド、アッ＝シハーブ・ブン・アル＝ファフル。シーラーズを本貫としカイロに居住したシャーフィイー派の人物。ムハンマドの兄弟であり、ナースィル・アッ＝ディーン・ムハンマドの父である。819年に死去した。
  en: Aḥmad b. Qiyās (with kasra on the first letter, lightened) b. Hind and al-Shihāb b. al-Fakhr. Originally from Shīrāz, he resided in Cairo and was a Shāfiʿī scholar. He was the brother of Muḥammad and the father of Nāṣir al-Dīn Muḥammad. He died in the year 819 H.
