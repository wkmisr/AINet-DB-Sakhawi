translation:
  ja: アブドゥルワッハーブ・ブン・サダカ、アル＝クーソーニー・アル＝カーヒリー、医師。ラーイス（医師頭）シャムス（・アッ＝ディーン）ムハンマドの父。医学に秀でた一人で、彼のもとで一群の人々が修業を終えた。その中に親族のアラー（・アッ＝ディーン）アリー・ブン・ファトフ・アッ＝ディーン・イブン・カジャージュクがいる。（8）35年に没した。
  en: ʿAbd al-Wahhāb b. Ṣadaqa, al-Qūṣūnī al-Qāhirī, the physician, father of al-Raʾīs (the chief physician) al-Shams Muḥammad. He was among those who excelled in medicine, and a number of people trained under him, among them his relative al-ʿAlāʾ ʿAlī b. Fatḥ al-Dīn Ibn Qajājiq. He died in (8)35.
