translation:
  ja: アブドゥルカーヒル・ブン・アブドゥルザーヒル・ブン・アフマド・ブン・アブドゥルターヒル・アッ＝ダーウディー、のちにアッ＝タファハニー、のちにアル＝カーヒリー、アッ＝シャーフィイー。その父は前に言及された。少し学問に従事し、私（サハーウィー）から聴聞し、ジョウク（集団朗誦）などで読誦した。
  en: ʿAbd al-Qāhir ibn ʿAbd al-Ẓāhir ibn Aḥmad ibn ʿAbd al-Ṭāhir al-Dāwudī, then al-Tafhanī, then al-Qāhirī, al-Shāfiʿī. His father was mentioned previously. He studied a little, heard [ḥadīth] from me (al-Sakhāwī), and recited in the jawq (recitation group) and elsewhere.
