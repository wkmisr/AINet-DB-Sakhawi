translation:
  ja: アハマド・ブン・アブドゥッラー・ブン・アル＝ハサン・ブン・アティーヤ・ブン・ムハンマド・ブン・アル＝ムアイヤド・アッ＝ザイディー。807年ズー・ル＝ヒッジャ月4日の木曜の夜にイフラームの状態でタルビーヤを唱えながら亡くなり、マアラー墓地に埋葬された。タキー・アル＝ファーシーが『マッカ史』で述べた。
  en: Aḥmad b. ʿAbd Allāh b. al-Ḥasan b. ʿAṭīya b. Muḥammad b. al-Muʾayyad al-Zaydī. He died on the night of Thursday, the 4th of Dhū al-Ḥijja in the year 807, while in the state of ihram and reciting the talbiya, and was buried in al-Muʿallā. This was stated by al-Taqī al-Fāsī in his 『Taʾrīkh Makka』.
