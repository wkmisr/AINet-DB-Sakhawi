translation:
  ja: ムハンマド・ブン・アリー・ブン・イーサー・ブン・ウスマーン・ブン・ムハンマド、アッ＝シャラフ・ブン・ジャウシャン。父は既述、叔父のアル＝ファフル・ムハンマドは後述。835年に生まれ、成長してクルアーンなどを暗記し、我らがシャイフ（イブン・ハジャル）らから聴聞し、アル＝マナーウィーにタクスィーム（分講）などで密に師事した。諸施設の俸給職に就き、彼は隠遁に近い性向の人である。
  en: Muḥammad b. ʿAlī b. ʿĪsā b. ʿUthmān b. Muḥammad, al-Sharaf b. Jawshan; his father has been mentioned and his paternal uncle al-Fakhr Muḥammad will be mentioned. He was born in the year 835, grew up and memorized the Qurʾān and other texts, heard from our shaykh (Ibn Ḥajar) and others, and attended al-Manāwī assiduously in the taqsīm (sectional lessons) and other things. He obtained stipendiary posts, and he is closer to seclusion.
