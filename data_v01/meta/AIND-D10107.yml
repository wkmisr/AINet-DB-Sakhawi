translation:
  ja: ムーサー・アル＝ヤマニー・アル＝ハッラーズ。（8）85年ズー・アル＝ヒッジャ月23日の金曜日にマッカで没し、礼拝の後に葬礼が行われ、次いでアル＝マアラー墓地に葬られた。祝福された、評判のよい人物であった。
  en: Mūsā al-Yamanī al-Ḥarrāz. He died on Friday, 23 Dhū al-Ḥijja of the year [8]85, in Mecca; the funeral prayer was performed for him after the (Friday) prayer and he was then buried in al-Maʿlāt. He was a blessed and well-spoken-of man.
