translation:
  ja: アリー・ブン・ムハンマド・ブン・アフマド・ブン・ジャールッラー・ブン・ザーイド、ヌール・アッ＝ディーン・アッ＝スンブスィー・アル＝マッキー。商いと取引を行う者の一人で、不動産を有し、ダッブースの名で知られる。865年サファル月半ばの土曜の夜に没した。イブン・ファハドがその没年を記録した。
  en: ʿAlī b. Muḥammad b. Aḥmad b. Jār Allāh b. Zāʾid, Nūr al-Dīn al-Sanbasī al-Makkī, one of those who traded and did business; he owned real estate and was known as Dabbūs. He died on the night of Saturday, in the middle of Ṣafar of the year 865. Ibn Fahd recorded his death date.
