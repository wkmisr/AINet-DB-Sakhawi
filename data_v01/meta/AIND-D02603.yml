translation:
  ja: ハサン・ブン・アリー・アル＝バドル・アル＝マルジューシー。後述のムハンマドの父。シャルブ（高級亜麻布）などを扱う商人の長老（シャイフ）で、敬虔で、正義の人々や徳のある人々に親しかった。我らがシャイフ（イブン・ハジャル）の伝記において彼に関する逸話を私は引用しており、彼は我らがシャイフから聴聞した一人である。850年以降に、70歳を超えて亡くなった。神の慈悲あれ。
  en: Ḥasan b. ʿAlī al-Badr al-Marjūshī, the father of Muḥammad who is mentioned below. He was a merchant shaykh dealing in sharb (fine linen cloth) and the like, a good man who was close to the righteous and people of merit. I cited an anecdote about him in the biography of our shaykh (Ibn Ḥajar), and he was among those who heard from him. He died after the year 850 AH at the age of over seventy. May God have mercy on him.
