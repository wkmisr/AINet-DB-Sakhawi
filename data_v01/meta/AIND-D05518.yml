translation:
  ja: アリー・ブン・ムハンマド・ブン・ウマル・ブン・スライマーン・ブン・アブドゥッラフマーン、ヌール・アッ＝ディーン・アル＝マリージー、のちにアル＝カーヒリー、アル＝アズハリー、アッ＝シャーフィイー。アル＝マリージーとして知られる。ヒジュラ暦895年の断食明けの祝日（イド・アル＝フィトル）の日に、私の自宅において私から祝日伝承（アル＝ムサッサル・ビ＝ヤウム・アル＝イード）を聴聞した者の一人である。
  en: ʿAlī b. Muḥammad b. ʿUmar b. Sulaymān b. ʿAbd al-Raḥmān, Nūr al-Dīn, al-Malījī, then al-Qāhirī, al-Azhari, al-Shāfiʿī, known as al-Malījī. He was among those who heard from me, on the day of ʿĪd al-Fiṭr in the year 895, at my house, the musalsal hadith of the day of ʿĪd.
