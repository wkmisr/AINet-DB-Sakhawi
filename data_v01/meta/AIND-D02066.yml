translation:
  ja: アル＝マース・アル＝アシュラフィー・バルスバーイ。アレッポでアミールとなり、そこでいくつかの総督職を歴任し、その後、アタベクとなったが、スワール（Sawār）の戦いの日に872年に戦死した。当時50歳を過ぎていた。彼は容姿端麗で、その行いは称賛され、勇敢さで有名であった。アッラーが彼を憐れみたまわんことを。
  en: al-Mās al-Ashrafī Barsbāy. He became an amir in Aleppo and was transferred to several governorships there. He then became its atābak until he was killed in the Battle of Sawār on the day of the battle in the year 872 H. He was over fifty years old at the time. He was handsome in appearance, of praised conduct, and famous for bravery. May God have mercy on him.
