translation:
  ja: ムーサー・ブン・ハリール・ブン・アフマド・ブン・アビー・バクル・ブン・ガザーラ、シャラフ〔・ッディーン〕・アル＝バアリー・アル＝カッバーニー。790年の少し前にバアルバックで生まれ、そこで育って、イブン・アッ＝ザアブーブ（「ハッジャールが我々に伝えた」と）のもとで『サヒーフ』を一部欠落を伴って聴聞した。私は彼の町で彼に会い、彼のもとで『イブン・タイミーヤの百〔ハディース〕』を読んだ。善良な人で、ナクバイン〔原文ママ〕などで生計を立てていた。60歳近くで没した。
  en: Mūsā b. Khalīl b. Aḥmad b. Abī Bakr b. Ghazāla, al-Sharaf al-Baʿlī al-Qabbānī. Born shortly before 790 in Baalbek, he grew up there and heard the Ṣaḥīḥ, with gaps, from Ibn al-Zaʿbūb (who had it from al-Ḥajjār). I met him in his town and read to him the Hundred of Ibn Taymiyya. He was a righteous man who earned his living by [naqbayn, sic] and other means. He died near sixty.
