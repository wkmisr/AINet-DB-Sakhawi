translation:
  ja: ムッラーザーデ・ブン・ウスマーン・アル＝カルヒー・アル＝ハナフィー。タフスィール、キラーアート、ハディース、理性の学、伝承の学といった諸学に秀でた者の一人。その師には、彼の父、『アル＝グマイニー』その他の注釈者カーディー・ザーデ、ホージャ・ファドル・アッラー、ホージャ・イサーム・アッ＝ディーン、ムッラー・アリー・アル＝クッシー、ムッラー・アラー・アッ＝シャーシーがいる。学識ある人々が彼に学び、彼は教授と難解な書物の校定に専念した。巡礼を果たしたが、カイロには入らなかった。彼は現在ホラーサーンのスルターンのもとにあり、70歳に近く、一度も結婚したことがなく、身持ちが堅く、人柄がよい。
  en: Mullāzāda b. ʿUthmān al-Karkhī al-Ḥanafī. He is one of those who distinguished themselves in various disciplines, such as tafsīr, the Qurʾānic readings, ḥadīth, and the rational and the transmitted sciences. Among his teachers were his father; Qāḍīzāda, the commentator of al-Ghumaynī and of other works; Khwājā Faḍl Allāh; Khwājā ʿIṣām al-Dīn; Mullā ʿAlī al-Qushshī; and Mullā ʿAlāʾ al-Shāshī. Men of learning studied under him, and he confined himself to teaching and to the elucidation of the difficult passages of books. He performed the pilgrimage but did not enter Cairo. He is now with the sultan of Khurāsān, close to seventy; he has never married, and is a man of modest conduct and good character.
