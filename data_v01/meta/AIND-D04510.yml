translation:
  ja: アブドゥッラー・ブン・アリー・ブン・ムーサー・ブン・アビー・バクル・ブン・ムハンマド・アッ＝シャイビー・アル＝ヤマーニー。父の伝記は後述される。父の没後、アル＝フサーミーヤにある父のザーウィヤ（の運営）に就いた。ヒジュラ暦831年に没した。クルアーンの朗誦を多く行う人物であった。我らがシャイフ（イブン・ハジャル）は『インバー・アル＝グムル』の811年の条にある父の伝記の中で彼に言及している。
  en: ʿAbd Allāh b. ʿAlī b. Mūsā b. Abī Bakr b. Muḥammad al-Shaybī al-Yamānī, whose father's biography is forthcoming. He was installed after his father in the latter's zāwiya at al-Ḥusāmiyya, and died in the year 831 AH. He recited the Qurʾān a great deal. Our shaykh (Ibn Ḥajar) mentioned him in the biography of his father under the year 811 AH of his Inbāʾ al-Ghumr.
