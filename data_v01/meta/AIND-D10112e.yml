translation:
  ja: マイムーン、ファッハール（陶工）の奴隷。810年に飢えて死ぬまで奴隷身分にあった。〔クルアーンの〕正書法と朗誦法に関する著作があり、『ヌフファ』『ドゥッラ』などのほか、法学の『リサーラ』をラジャズ詩に韻文化し、『ジュルーミーヤ』も同様に〔韻文化した〕。ザッルークが私に教えてくれた。
  en: Maymūn, slave of al-Fakhkhār. He remained in bondage until he died of hunger in 810. He has works on Qurʾānic orthography and recitation, among them al-Nuḥfa and al-Durra; he even versified the Risāla on fiqh as a rajaz poem, and likewise the Ājurrūmiyya. Zarrūq informed me of this.
