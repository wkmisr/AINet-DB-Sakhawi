  note:
    ja: '見出しナサブ「بن الكمال أبي البركات」＝祖父 محمد بن علي بن أحمد بن عبد العزيز الكمال أبو البركات الحنفي＝#AIND-D07994「محمد الكمال أبو البركات الحنفي أخو اللذين قبله وشقيق ثانيهما . ولد في سنة خمس وثمانين وسبعمائة أو التي بعدها بمكة … مات في المحرم سنة اثنتين وخمسين بمكة」（直前の兄 #AIND-D07992「محمد بن علي بن أحمد بن عبد العزيز … النويري」、未受領）。ラカブ・クンヤ・学派（الحنفي）・ナサブで閉合（規則37）。初版なし。'
