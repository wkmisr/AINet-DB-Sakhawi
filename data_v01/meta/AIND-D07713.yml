translation:
  ja: ムハンマド・ブン・アブド・アル＝カーディル・ブン・ムハンマド・ブン・アリー・ブン・アフマド・ブン・アブド・アル＝アズィーズ、アブー・アル＝バラカート・イブン・アル＝ムヒユウィー・ブン・アル＝カマール・アビー・アル＝バラカート、アン＝ヌワイリー、アル＝マッキー、ハナフィー派。父は前述。マッカとマディーナで私（サハーウィー）から聴聞した者の一人。
  en: Muḥammad b. ʿAbd al-Qādir b. Muḥammad b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz, Abū al-Barakāt Ibn al-Muḥyawī b. al-Kamāl Abī al-Barakāt, al-Nuwayrī, al-Makkī, the Ḥanafī; his father has been mentioned above. He is among those who heard from me (al-Sakhāwī) in Mecca and Medina.
