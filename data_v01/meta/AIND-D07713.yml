    ar: عبد القادر بن محمد بن علي النويري
  note:
    ja: '「الماضي أبوه」。父＝#AIND-D04189「عبد القادر بن محمد بن علي بن أحمد بن عبد العزيز محيي الدين بن الكمال أبي البركات العقيلي النويري المكي الحنفي والد أبي البركات محمد الآتي . ولد في ربيع الثاني سنة تسع وعشرين وثمانمائة بمكة」（未受領）。父側が「والد أبي البركات محمد الآتي」と本項主を名指し、ナサブ一致（規則37）。初版の #AIND-D04089（عبد القادر بن إبراهيم … ابن عليبة＝別人）を是正。'
