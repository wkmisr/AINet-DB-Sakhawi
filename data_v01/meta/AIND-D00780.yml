translation:
  ja: アフマド・ブン・サーリフ・ブン・アッ＝シャイフ・ムハンマド・ブン・アビー・バクル・アル＝ムルシディー・アル＝マッキー、ヒンドゥー生まれでシャーフィイー派の法学者。コーランを暗記し、公文書作成の仕事や若干の事業で生計を立てた。その仕事のためにイエメンなどへ旅行し、メッカで私（サハーウィー）からハディースを聴聞した後、生計を立てるためマンドゥーに旅立った。
  en: Aḥmad b. Ṣāliḥ b. al-Shaykh Muḥammad b. Abī Bakr al-Murshidī al-Makkī, of Indian birth, Shāfiʿī. He memorized the Qurʾān and earned a living through drafting legal documents and some trade. He traveled to Yemen and other places for this purpose and listened (to ḥadīth) from me (al-Sakhāwī) in Mecca. He then traveled to Mandūh for his livelihood.
