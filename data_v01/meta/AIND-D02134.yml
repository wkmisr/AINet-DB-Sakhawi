translation:
  ja: バドル・アル＝クッバ、名はバドル、〔クンヤは〕アブー・アン＝ヌール、アル＝ハバシー（エチオピア人）。イブン・アズムの従僕（フェタン）。主人は彼に目をかけ、多くを聴聞させ、彼のためにイジャーザを求めてやった。ついでヒジュラ暦874年に没した。練達の人であった。
  en: Badr al-Qubba, whose name was Badr Abū al-Nūr al-Ḥabashī, the client (slave) of Ibn ʿAzm. His master cared for him, made him hear many hadiths, and obtained ijazas for him. He died in the year 874 AH, and he was skilled (ḥādhiq).
