notes:
- text: '「له ذكر في X」型＝本人の本伝（REF 化禁止、絶対基準）＝実項。「غير ابن عبد الرحمن الماضي قريبا」＝直前の #AIND-D03180「سليم ككبير بن عبد الرحمن بن سليم العسقلاني الأصل الجناني … القاهري الأزهري … صار للناس فيه اعتقاد」とは別人、というサハーウィーの区別の注記（relation を立てない）。「ولي الله」は聖者としての呼称（初版 laqab → honorific）。'
  lang: ja
- text: 'إبراهيم بن يوسف بن إبراهيم الفاقوسي — 「له ذكر في إبراهيم بن يوسف بن إبراهيم الفاقوسي」。相手＝ #AIND-D00350「إبراهيم بن يوسف بن إبراهيم بن أحمد بن يوسف بن أبي الفتح البرهان الفاقوسي ثم البلبيسي الشافعي الرفاعي … مات … سنة اثنتين وستين」（未収録）。D00350 本文「وكان هذا بلحظ ولي يقال له الشيخ سليم لقيه في أول أمره وكأنه تضجر من ذلك فقال له يا إبراهيم اثبت أو كما قال」が本項主（名 سليم＋「ولي」）を名指しし、إبراهيم が修業の初めに聖者 سليم と出会い「اثبت」と励まされたと記す＝閉合（規則57: 名＋呼称 ولي）。D00350 側の記述による relation は subtype met（repo 統制語彙）。【集約 2026-11-08】向きは規則15（社会関係は active=相手・passive=本項主）と repo の met 先例（active=会った側、例 active="wd:Q4120128" passive="#AIND-D00424"）に合わせ、active＝إبراهيم（D00350、「لقيه في أول أمره」の主語）、passive＝本項主に是正（内容A H・機械 M、決定4）。会見の詳細（بلبيس の子弟教育をめぐる逸話）は他項の情報なので note 留め（規則23）。初版の統制外 subtype「mentioned in his biography」（#NEEDID）を置換。'
  type: cross-reference
