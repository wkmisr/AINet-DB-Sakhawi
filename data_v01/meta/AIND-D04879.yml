translation:
  ja: ウスマーン・ブン・ムハンマド、アル＝ファフル・ブン・ナースィル・アッ＝ディーン、アル＝アイユービー・アル＝カーヒリー。先祖と同様にイブン・アル＝ムルーク（王たちの子）として知られ、そのためアル＝カーミリーヤの監督官（ナーズィル）であった。もっとも彼は、鷹匠（バッザーダラ）の姿そのままに鳥を手に載せて持ち歩いていたのだが。（8）84年ラビーウ・アル＝アーヒル月に70歳余りで没した。アッラーが彼を赦されますように。
  en: ʿUthmān b. Muḥammad, al-Fakhr b. Nāṣir al-Dīn, al-Ayyūbī al-Qāhirī. Like his forefathers he was known as Ibn al-Mulūk (Son of the Kings), and for that reason he was nāẓir (controller) of al-Kāmiliyya, even though he used to carry a bird on his hand in the manner of the falconers (bazādira). He died in Rabīʿ al-Ākhir (8)84, aged seventy or more. May God forgive him.
