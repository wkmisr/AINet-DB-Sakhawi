translation:
  ja: シャラフ・アル＝カウワース。文人、詩人、韻文・散文作家。カーディーであるサリー・アッ＝ディーン・アブド・アッ＝ザーヒル・ブン・アッ＝ザハビーは、彼の詩を集めて個別の詩集（ディーワーン）を編纂した。彼の詩には以下のようなものがある： 「汝が志す事を神に委ねよ、そして知るがよい、肥大した悪巧みはやせ細るものであると。」 「不義はまさにそれを行う者を死に至らしめ、裏切る支配者は（すべてを神に）委ねることにより廃される。」 ヒジュラ暦832年ジュマーダー・アル＝アーヒラ（第6月）にダマスカスで没した。神が彼を赦されますように。
  en: 'Sharaf al-Qawwās. A man of letters, poet, and writer of prose and verse. Qāḍī Sarī al-Dīn ʿAbd al-Ẓāhir b. al-Dhahabī compiled a separate dīwān (collection) of his poetry, which includes his verses: ''Entrust your affairs to God, whom you seek, and know that bloated cunning is ultimately withered.'' ''Injustice will surely plague its perpetrator with death, and the treacherous ruler is deposed through [divine] delegation.'' He died in Damascus in Jumādā al-Ākhira, the year 832 [AH]. May God forgive him.'
