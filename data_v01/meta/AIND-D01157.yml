translation:
  ja: アフマド・ブン・イーサー・アル＝アラウィー。マッカの居住者で、カーディーのアリー・アル＝ヌワイリーの子供たち（アブー・アブドゥッラー、アブー・アル＝バラカート、カマーリイヤ）の母方の叔父（ハール）。ヒジュラ暦846年ズー・アル＝カアダ月に同地で死去。
  en: Aḥmad b. ʿĪsā al-ʿAlawī, a resident of Mecca and the maternal uncle of Abū ʿAbd Allāh, Abū al-Barakāt, and Kamāliyya, the children of the judge ʿAlī al-Nuwayrī. He died there in Dhū al-Qaʿda in the year 846 H.
