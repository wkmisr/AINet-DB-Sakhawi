translation:
  ja: アブドゥッラー。前項の人物のもう一人の兄弟。私は彼が前項の人物より先に没し、そのためその名が付けられたのだと思う。彼は、814年付のアッ＝ザイニー・リドワーンとイブン・ムーサー・アル＝マッラークシーのイジャーザ申請状によって（イジャーザを）受けた者の一人である。
  en: ʿAbd Allāh, another brother of the preceding one. I think he died before him, and so the latter was named after him. He was one of those who received (an ijāza) through the ijāza-request (istidʿāʾ) of al-Zaynī Riḍwān and Ibn Mūsā al-Marrākushī dated in the year 814.
