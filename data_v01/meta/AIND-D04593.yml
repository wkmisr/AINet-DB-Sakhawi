translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・ムーサー・ブン・イーサー、アル＝アフィーフ・アッ＝ダミーリー・アル＝マッキー。前述のアブドゥルカリーム・ブン・ムハンマドの父方の叔父。（8）55年ムハッラム月に同地（マッカ）で没した。イブン・ファハドがその没年月を記録している。
  en: ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh b. Muḥammad b. Mūsā b. ʿĪsā, al-ʿAfīf al-Damīrī al-Makkī, the paternal uncle of ʿAbd al-Karīm b. Muḥammad, mentioned above. He died there (in Mecca) in Muḥarram (8)55; Ibn Fahd recorded his death.
