    ja: '「الشمس بن البرهان … الماضي أبوه」。父＝corpus 本伝 #AIND-D00136「إبراهيم بن عبد الرحمن بن حسين بن حسن بن قاسم برهان الدين أبو اسحاق المدني الشافعي الآتي أبوه ويعرف بابن القطان . ولد في ذي الحجة سنة تسع عشرة وثمانمائة بالمدينة النبوية … مات في ليلة الأربعاء ثاني عشر ذي القعدة سنة ثمان وتسعين」（未収録）。名・ナサブ・ラカブ البرهان・ニスバ・通称 ابن القطان・「الماضي」で閉合（ブリーフ候補を本文で確認。cert なし、規則37）。相手側のナサブは「حسين بن حسن بن قاسم」で、本項は「حسن」を1段欠く（刊本どおり）。初版は #NEEDID。'
