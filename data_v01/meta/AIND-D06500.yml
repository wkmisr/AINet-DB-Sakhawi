notes:
- text: 'マディーナの ابن القطان 家。兄弟 #AIND-D06501（الجمال محمد、「أخو الذي قبله وذاك الأكبر」＝本項主が兄）・#AIND-D06502（الصلاح محمد、「أخو اللذين قبله」、871年生）・#AIND-D03542（الزين عبد الرحمن、「الماضي أبوه」、887年没）、祖父 #AIND-D03624（عبد الرحمن بن حسين بن حسن بن قاسم）。本項はいずれも名指ししないので relation は立てない（父が AIND で共通、規則23）。初版の residence event（المدينة、ニスバ由来）を除去（規則22(1)・(6)）。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アブド・アッ＝ラフマーン・ブン・フサイン・ブン・カースィム、アッ＝シャムス・ブン・アル＝ブルハーン・アル＝マダニー・アッ＝シャーフィイー。父は前述。イブン・アル＝カッターンとして知られる。『ミンハージュ』を暗記し、少しばかり学問に携わり、マディーナで私から聴いた者の一人。（8）91年ラビー・アッ＝サーニー月2日に没した。
  en: Muḥammad b. Ibrāhīm b. ʿAbd al-Raḥmān b. Ḥusayn b. Qāsim, al-Shams b. al-Burhān, al-Madanī al-Shāfiʿī, whose father has been mentioned above; known as Ibn al-Qaṭṭān. He was among those who memorized the Minhāj, studied a little, and heard from me in Medina. He died on 2 Rabīʿ II of the year [8]91.
