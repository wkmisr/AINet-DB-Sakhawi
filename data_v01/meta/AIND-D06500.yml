- text: 'マディーナの ابن القطان 家。兄弟 #AIND-D06501（الجمال محمد、「أخو الذي قبله وذاك الأكبر」＝本項主が兄）・#AIND-D06502（الصلاح محمد、「أخو اللذين قبله」、871年生）・#AIND-D03542（الزين عبد الرحمن、「الماضي أبوه」、887年没）、祖父 #AIND-D03624（عبد الرحمن بن حسين بن حسن بن قاسم）。本項はいずれも名指ししないので relation は立てない（父が AIND で共通、規則23）。初版の residence event（المدينة、ニスバ由来）を除去（規則22(1)・(6)）。'
