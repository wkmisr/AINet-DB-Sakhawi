  note:
    ja: '「ممن سمع مني بمكة」（規則2）。父 #AIND-D10826 の項によれば父は886・887年にマッカでサハーウィーに師事し、兄 #AIND-D07237 も885年以降「سافر مع أبويه وإخوته إلى مكة … وسمع مع أبيه علي ومني」とあり、本項主の聴聞もこの一家のマッカ滞在時とみられる（note 留め）。'
- id: r2
  type: kin
  subtype: father
  active: AIND-D10826
  passive: AIND-D05820
  quote: أبوه
  note:
    ja: '「الآتي أبوه」。父 ＝ #AIND-D10826「أبو بكر بن محمد بن أبي بكر بن نصر بن عمر الشرف الحيشي الأصل الحلبي الشافعي البسطامي الماضي أبوه والآتي جده ويعرف بابن الحيشي」（848年ハラブ生、アレッポのバスターミー教団の長）。ナサブ3代（أبو بكر بن محمد بن أبي بكر）が一致し、兄 #AIND-D07237「محمد بن أبي بكر بن محمد بن أبي بكر قوام الدين أبو يزيد بن الشرف الحبشي الأصل الحلبي الآتي أبوه وجده وهو أكبر إخوته」のナサブ・ニスバとも一致。D10826 ではニスバが「الحيشي」と綴られる（本項・D07237 は「الحبشي」。祖父の項 #AIND-D04434 は「الطائي الحبشي الأصل」。綴り揺れを記録、名寄せはしない）。初版の #NEEDID を解消。兄 D07237 は本項主を名指ししないため relation は立てない。'
  norm: ابوه
translation:
  ja: ウマル・ブン・アビー・バクル・ブン・ムハンマド・ブン・アビー・バクル、ファトフ・アッ＝ディーン、アブー・アル＝ファトフ、アル＝ハバシー・アル＝ハラビー。その父は後述する。マッカで私から聴聞した者の一人。
  en: ʿUmar b. Abī Bakr b. Muḥammad b. Abī Bakr, Fatḥ al-Dīn Abū al-Fatḥ al-Ḥabashī al-Ḥalabī; his father comes below. He was among those who heard from me in Mecca.
