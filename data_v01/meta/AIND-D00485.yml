translation:
  ja: アフマド・ブン・アフマド・タムルバーイ、シャハーブ・アッ＝ディーン・アル＝タムルバガーウィー。その祖父は副官交代の長であり、844年にハッジを指揮した。彼は若き日のハナフィー派の人物で、イブン・アビー・ザイドの友人としてアル＝カーフィヤージーのもとで働いた。彼は現在も存命である。
  en: Ahmad b. Ahmad Tamurbāy, Shihāb al-Dīn al-Tamurbaghāwī, whose grandfather was the head of the watch of the deputies and commanded the Hajj in 844 H. He was a young Hanafi man who worked for al-Kāfiyājī as a companion to Ibn Abī Zayd. He is currently alive.
