translation:
  ja: アブド・アッラー・ブン・イブラーヒーム・ブン・アフマド・ブン・ムハンマド・ブン・アブド・アッラー、アル＝アフィーフ・ブン・アル＝ブルハーン、マグリブ出身の家系でマッカの人、塗装工（ダッハーン）。父は前述。アッ＝ザアバリーとして知られる。アブー・バクル・アル＝マラーギーからいくつかを聴聞した。父と同じく祝福された人で、人々から離れて暮らし、家が遠いにもかかわらず集団礼拝を欠かさず、天井などの塗装と巡礼期のウムラ（の案内）で生計を立てていた。885年ムハッラム月にマッカで没した。
  en: ʿAbd Allāh b. Ibrāhīm b. Aḥmad b. Muḥammad b. ʿAbd Allāh, al-ʿAfīf b. al-Burhān, of Maghribī origin, the Meccan, the painter; his father has been mentioned, and he is known as al-Zaʿbalī. He heard some things from Abū Bakr al-Marāghī. Like his father he was a blessed man, withdrawn from people, constant in attending congregational prayer despite the distance of his house, earning his living by painting ceilings and the like, and by (guiding) ʿumras in the pilgrimage season. He died in Mecca in Muḥarram of the year 885.
