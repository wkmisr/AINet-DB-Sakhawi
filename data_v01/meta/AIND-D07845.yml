translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・アル＝ガムリー・アル＝ハーンキー。そこ（アル＝ハーンカ）の子供の教師（ムアッディブ）で、遺体を洗う者（湯灌師）。クルアーンの暗記に優れた者の一人で、アル＝ハウワースとして知られた。マッカにしばらく滞在し、そこでアッ＝サファディー・アル＝ハーシルの娘を娶った。886年にそこ（マッカ）で私から聴聞した者の一人である。890年の直前に没した。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad al-Ghamrī al-Khānkī, teacher of children there (in al-Khānka) and washer of the dead; one of those who excelled in memorizing the Qurʾān, and known as al-Khawwāṣ. He stayed in Mecca for a time and there married the daughter of al-Ṣafadī al-Ḥāshir. He was among those who heard from me there in the year 886. He died shortly before 890.
