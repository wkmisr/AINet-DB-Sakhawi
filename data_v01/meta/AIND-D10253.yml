translation:
  ja: ヤフヤー・ブン・アブドゥッラー・ブン・ムハンマド・ブン・ムハンマド・ブン・ザカリーヤー、アブー・バクル・アル＝ガルナーティー。相続法と算術における大家で、諸学にも通じ、相続法について『ミフターフ』という書を著し、自分の町でカーディー職に就いた。6年ラビーウ第一月に没した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Yaḥyā b. ʿAbd Allāh b. Muḥammad b. Muḥammad b. Zakariyyāʾ, Abū Bakr al-Gharnāṭī. He was a leading authority in inheritance law (farāʾiḍ) and arithmetic, with a share in the other disciplines; he composed on inheritance law the book al-Miftāḥ, and he held the office of judge in his home town. He died in Rabīʿ I of the year six. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
