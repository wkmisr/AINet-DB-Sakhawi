translation:
  ja: アブドゥッラー・ブン・アブドゥッラー、ガルビーヤ地方のアブシーヤト・アル＝マラク村のシャイフ。ヒジュラ暦871年に殺害され、アブドゥッラフマーン・ブン・アッ＝タージルとその息子イスマーイールがその嫌疑をかけられて、二人とも皮剥ぎの刑に処された。
  en: ʿAbd Allāh b. ʿAbd Allāh, shaykh of Abshiyyat al-Malaq in al-Gharbiyya. He was murdered in the year 871; ʿAbd al-Raḥmān b. al-Tājir and his son Ismāʿīl were accused of it, and both were flayed.
