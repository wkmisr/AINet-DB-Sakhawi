translation:
  ja: アリー・ブン・ウマル・ブン・ラスラーン・ブン・ヌサイル、アル＝ブルキーニー出自、アル＝カーヒリー。私はこのように彼の名を、ムフイー・アッ＝ディーン・アル＝アズハリーの提示記録（アルド）のなかに本人の筆跡で見た。その記入は800年と日付が記され、彼が提示者に対して自分の著述（タアリーク）のイジャーザを与えたとある。これは奇妙なことで、私はシャイフ（アッ＝スィラージュ・アル＝ブルキーニー）の一族のうちにアリーという名の者を知らない。神がもっともよく知りたまう。
  en: ʿAlī b. ʿUmar b. Raslān b. Nuṣayr, of Bulqīnī origin, al-Qāhirī. Thus I saw his name in his own handwriting on the presentation record (ʿarḍ) of Muḥyī al-Dīn al-Azharī, with the writing dated to the year 800, and that he granted the presenter an ijāza for whatever writings (taʿlīq) he had. This is strange, for I know of no one named ʿAlī among the family of the Shaykh (al-Sirāj al-Bulqīnī). God knows best.
