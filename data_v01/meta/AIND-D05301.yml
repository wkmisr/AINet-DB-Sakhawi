  note:
    ja: '「هكذا رأيت اسمه بخطه في عرض محيى الدين الأزهري مؤرخا كتابته بسنة ثمانمائة وأنه أجاز للعارض ماله من تعليق」。本項主（師）が、800年付の محيي الدين الأزهري の عرض（提示記録）に自筆で名を記し、提示者に自分の著述（تعليق）のイジャーザを与えた。相手 محيي الدين الأزهري ＝ #AIND-D07741「محمد بن عبد الله بن إبراهيم … محي الدين أبو نافع … ويعرف بالأزهري وبابن الريفي . ولد … سنة تسع وثمانين وسبعمائة … وعرض في سنة ثمانمائة فما بعدها على جماعة كالأبناسي وابن الملقن والبلقيني والعراقي وأولاد كل من الثلاثة」（名・通称・800年の عرض が一致。索引 #AIND-D11425 も الأزهري に挙げる）。【集約】校閲時の 仮番号（取り下げ、→#AIND-D07741） は取り下げ。800 ＝ 1397-10-02〜1398-09-20、年初 1397（h2g.py）。初版は subtype student・passive #NEEDID・bibl #NEEDID、重複する独立 cultural event を置いていた。'
notes:
- text: '父 relation（#AIND-D05849 السراج البلقيني）は Waka 裁定（2026-10-05、要判断_B99-103 ★6）により削除し note のみとする。原文「فما علمت في بني الشيخ من اسمه علي」（サハーウィー自身が السراج البلقيني の子に علي を知らないと留保）。候補: 本項主の実体が #AIND-D05306（علي بن عمر … ابن الملقن）である可能性（同じ800年の عرض の署名者）。校閲時の記録: 【集約】cert medium → low。相手 #AIND-D07741（محيي الدين الأزهري）は同じ800年の عرض の署名者に「أولاد كل من الثلاثة النور والجلال والولي」（النور＝ابن الملقن の子）を挙げ、#AIND-D05306「علي بن عمر بن علي بن أحمد … نور الدين … ويعرف كأبيه بابن الملقن … زاحم الكبار في عرض غير واحد」はナサブ前半「علي بن عمر」が一致する。サハーウィーが見た署名「علي بن عمر بن رسلان」は D05306 の可能性が残る（候補として記録、同定はしない）。見出しのナサブ「عمر بن رسلان بن نصير البلقيني」は #AIND-D05849「عمر بن رسلان بن نصير بن صلح … السراج أبو حفص الكناني البلقيني ثم القاهري الشافعي」（シャイフ・アル＝イスラーム السراج البلقيني、805年没）と完全一致。ただしサハーウィー自身が「فما علمت في بني الشيخ من اسمه علي فالله أعلم」と、الشيخ（＝السراج البلقيني）の子に علي という名の者を知らないと留保しているため cert medium。'
