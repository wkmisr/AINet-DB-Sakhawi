translation:
  ja: アリ・ブン・マフムード・ブン・ムハンマド・ブン・アフマド・ブン・カーワーン・マリク・アッ＝トゥッジャール・ブン・フワージャ・ジャハーン・アル＝キーラーニー。従兄弟二人（叔父の息子たち）の死後、カイロへやって来た。その後、シャリーフ・イスハークとともに海路で速やかにマッカへと戻り、そこに留まった。それからアデンへ旅し、さらにカンバート（カンバーヤ）へと赴き、そこで没した。毒殺されたとも言われており、それはヒジュラ暦895年、あるいはその翌年（896年）のことであった。学徳と詩作で知られたが、ケチであった。60歳を越えていた。
  en: ʿAlī b. Maḥmūd b. Muḥammad b. Aḥmad b. Qāwān Malik al-Tujjār b. Khwājā Jahān al-Kīlānī. He came to Cairo after the death of his two cousins, then quickly returned to Mecca by sea along with al-Sharīf Isḥāq, and they resided there. Later, he traveled to Aden, then to Cambay (Kanbāya), where he died. It was said that he was poisoned, either in the year 895 AH or the following year. He was remembered for his virtue and poetry, though he was parsimonious. He was over sixty years of age.
