translation:
  ja: アリー・ブン・カラークジャー、アミール、アラー・アッ＝ディーン・アル＝ハサニー、十人長の一人。彼とその父は同じ日、853年サファル月18日土曜日にペストで没した。この者（アリー）は20歳に近かった。
  en: ʿAlī b. Qarāqujā, the amīr ʿAlāʾ al-Dīn al-Ḥasanī, one of the amīrs of ten. He and his father died on one and the same day, Saturday 18 Ṣafar of the year 853, of the plague; this one (ʿAlī) was close to twenty.
