translation:
  ja: ウマル・ブン・ハサン・アル＝ハマウィー、商人イブン・アル＝ハウラーニーの後見下にある孤児のシャリーフ。彼ら［イブン・アル＝ハウラーニーの家の者たち］とともに私から『サヒーフ』の一部などを聴聞した。
  en: ʿUmar b. Ḥasan al-Ḥamawī, a sharīf, an orphan under the guardianship of the merchant Ibn al-Ḥawrānī. He heard part of the Ṣaḥīḥ and other works from me together with them [the household of Ibn al-Ḥawrānī].
