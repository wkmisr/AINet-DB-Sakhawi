translation:
  ja: 965 イスマーイール・ブン・ヤアクーブ・ブン・アル＝ムタワッキル・アラー・アッラーフ・アブー・アブドゥッラーフ・ムハンマド・ブン・アビー・バクル・イブン・スライマーン・ブン・アフマド・アル＝アッバースィー・アル＝ハーシミー。彼はアル＝ムタワッキル・アラー・アッラーフ・アル＝アッズィー・アブドゥルアズィーズと、これから記述されるムハンマドの父方の兄弟であり、イブン・ファハドの招集によりアル＝ムウタディドの兄弟の子孫に入った者たちの一人である。彼は995年現在存命である。
  en: 965 Ismāʿīl b. Yaʿqūb b. al-Mutawakkil ʿalā Allāh Abī ʿAbd Allāh Muḥammad b. Abī Bakr Ibn Sulaymān b. Aḥmad al-ʿAbbāsī al-Hāshimī. He is the brother of al-Mutawakkil ʿalā Allāh al-ʿIzzī ʿAbd al-ʿAzīz and Muḥammad (to be mentioned later), from the same father, and Birām. He was among those who entered the sons of al-Muʿtaḍid's brothers by the summons of Ibn Fahd. He was alive in the year 995 H.
