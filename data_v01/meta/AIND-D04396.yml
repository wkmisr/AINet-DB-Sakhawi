translation:
  ja: アブド・アッラー・ブン・アフマド・ブン・アブド・アッラー・アル＝ジャマール・アル＝フライビティー、のちにアル＝カーヒリー・アッ＝サフラーウィー。私（サハーウィー）の2度目の（マッカ）滞在（ムジャーワラ）の際に私から多くを聴聞し、871年には私と共に巡礼した。クルアーンを読誦する善良な人物で、880年頃かそれ以降に没した。
  en: ʿAbd Allāh b. Aḥmad b. ʿAbd Allāh al-Jamāl al-Huraybiṭī, then al-Qāhirī al-Ṣaḥrāwī. He heard a great deal from me (al-Sakhāwī) during my second stay (mujāwara) in Mecca and performed the pilgrimage with me in the year [8]71. He was a good man who recited the Qurʾān, and he died around the year [8]80 or after it.
