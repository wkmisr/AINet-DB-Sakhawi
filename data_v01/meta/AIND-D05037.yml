translation:
  ja: アリー・ブン・アフマド・ブン・ムハンマド・ブン・イーサー・ブン・ムハンマド・ブン・マフムード・アル＝マクディスィー。私（サハーウィー）はある人の筆跡でこのように読んだ。彼については、祖父がムハンマド・ブン・アブド・アッラー・ブン・ムハンマドである者の項で少し前に既述した。
  en: ʿAlī b. Aḥmad b. Muḥammad b. ʿĪsā b. Muḥammad b. Maḥmūd al-Maqdisī. Thus I (al-Sakhāwī) read it in someone's handwriting; he has already appeared shortly above among those whose grandfather is Muḥammad b. ʿAbd Allāh b. Muḥammad.
