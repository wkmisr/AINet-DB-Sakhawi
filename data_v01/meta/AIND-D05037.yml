notes:
- text: '「هكذا قرأته بخط بعضهم وقد مضى فيمن جده محمد بن عبد الله بن محمد قريبا」＝転送見出し。本項に固有の伝記内容はなく、「ある人の筆跡で見た異形のナサブ」を記録したうえで既出項へ送るのみ（「هكذا قرأته بخط بعضهم」は異綴の出典注記であって実伝ではない）。転送先は #AIND-D05033（علي بن أحمد بن محمد بن عبد الله بن محمد بن محمود العلاء المرداوي ثم الصالحى الحنبلي、生730・没803）。名・父名・祖父名（علي بن أحمد بن محمد）と「بن محمد بن محمود」が一致し、本見出しは 4代目「عبد الله」を「عيسى」とする異伝。ニスバ المقدسي は الصالحي（ダマスクスのサーリヒーヤに移ったマクディスィー系ハンバリー家）と整合する。同名で「جده محمد بن عبد الله بن محمد」に該当する見出しは D05033 のみ（hw.py 検索）。'
