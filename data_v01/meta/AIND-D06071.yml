translation:
  ja: イーサー・ブン・アフマド・アル＝ハンディースィー（無点のハーにファトハ、次にスクーンのヌーン、その後にカスラの無点のダール、次に下点の文字［ヤー］、次に無点のスィーン）、次いでアル＝ビジャーイー・アル＝マグリビー・アル＝マーリキー。法学・法源学・アラビア語学などに秀で、それらを暗記し、その意味を理解していた。加えて騎馬術とその諸種における卓越、そして敬虔さを備えていた。ファトワー発給と教授（イクラーウ）に携わり、ビジャーヤの大ジャーミウで説教職の代理を務めた。彼は現在、（8）90年において、同地のシャイフにして住民の模範であり、60歳を超えている。
  en: ʿĪsā b. Aḥmad al-Ḥandīsī (with fatḥa on the undotted ḥāʾ, then a quiescent nūn, after it an undotted dāl with kasra, then a letter dotted below [yāʾ], then an undotted sīn), then al-Bijāʾī al-Maghribī al-Mālikī. He excelled in jurisprudence, its principles, Arabic and other subjects, memorizing them and understanding their meanings, together with his horsemanship, his excellence in its various kinds, and his piety. He devoted himself to giving fatwās and teaching, and acted as deputy preacher at the Great Mosque of Bijāya. He is now, in the year (8)90, its shaykh and the exemplar of its people, being over sixty years of age.
