translation:
  ja: ムハンマド・ブン・アリー・ブン・サーリフ・ブン・アフマド・ブン・ウマル・ブン・アフマド、ナースィル・アッ＝ディーン・ブン・アル＝アラー・ブン・アッ＝サラーフ、アル＝ハラビー。サーリフの二人の息子〔＝孫〕であるウマル・ブン・アフマドとムハンマド・ブン・ムハンマドの従兄弟。祖先と同じくイブン・アッ＝サッファーフとして知られる。
  en: Muḥammad b. ʿAlī b. Ṣāliḥ b. Aḥmad b. ʿUmar b. Aḥmad, Nāṣir al-Dīn b. al-ʿAlāʾ b. al-Ṣalāḥ al-Ḥalabī, cousin of ʿUmar b. Aḥmad and of Muḥammad b. Muḥammad, the two sons [i.e. grandsons] of Ṣāliḥ. Like his forebears he was known as Ibn al-Saffāḥ.
