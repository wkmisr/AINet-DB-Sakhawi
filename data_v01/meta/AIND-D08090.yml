  note:
    ja: '「ومحمد بن محمد ابني صالح」＝ #AIND-D08796「محمد بن محمد بن صالح بن أحمد بن عمر بن أحمد ناصر الدين بن ناصر الدين بن صلاح الدين الحلبي ثم القاهري الشافعي ابن عم عمر بن أحمد ومحمد بن علي ويعرف كسلفه بابن السفاح」（未受領）。相手側が「ابن عم … محمد بن علي」と本項主を名指し（閉合）。叔父 ناصر الدين محمد بن صالح ＝ #AIND-D07484。'
notes:
- text: '「ابن عم عمر بن أحمد ومحمد بن محمد ابني صالح」は「صالح の二人の息子（أحمد と محمد）の子である عمر بن أحمد と محمد بن محمد の従兄弟」と読む（ابني صالح は双数属格で أحمد・محمد にかかる）。初版の「uncle صالح」relation は誤り（صالح は祖父＝見出しナサブの「صلح بن أحمد بن عمر」）。叔父 ＝ #AIND-D00776（الشهاب أحمد بن صالح）・#AIND-D07484（ناصر الدين محمد بن صالح、كاتب سر حلب）。家名索引 #AIND-D12395（ابن السفاح）は合同索引＝ID に使わない（規則11）。'
