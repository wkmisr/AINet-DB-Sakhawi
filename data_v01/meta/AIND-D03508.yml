translation:
  ja: アブドゥル・ジャッバール・ブン・アブドゥル・マジード・ブン・アル＝ムワッファク・アリー・ブン・アブー・バクル・ハーフィズ・アッ＝ディーン・アン＝ナーシリー・アル＝ヤマーニー。彼の父の子供たちの中で最年長であった。学者であり、高潔な人物であった。カーディー（法官）職に就き、857年に没した。彼の父（の伝記）は後述される。
  en: ʿAbd al-Jabbār b. ʿAbd al-Majīd b. al-Muwaffaq ʿAlī b. Abī Bakr Ḥāfiẓ al-Dīn al-Nāshirī al-Yamānī. The eldest of his father's children. He was a pious scholar. He was appointed to the judgeship (qaḍāʾ) and died in the year 857 AH. His father's biography is forthcoming.
