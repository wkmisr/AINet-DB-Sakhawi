translation:
  ja: アリー・ブン・ムハンマド・ブン・ウハイブ・アル＝ファースクーリー、同地のパン焼き職人で、アル＝ハッシャーシュとして知られる。甚だしく無学の庶民でありながら、自分こそ当代随一の文学（アダブ）の達人だと主張し、そのため同郷の人々の笑い者となっていたが、それも当然であった。私（サハーウィー）は同地で彼に会い、彼の次の詩句を書き取った。「砂塵の火と天の雨は、諸民族の糧のために大地を潤し育てる／雷と稲妻とは、一方は打ち、一方は物語る、戦のしるしの中で引き抜かれ何も訴えぬ剣（のように）」。この類の詩がほかにもある。神が彼を赦したまわんことを。
  en: 'ʿAlī b. Muḥammad b. Wuhayb al-Fāskūrī, the baker there, known as al-Ḥashshāsh. A commoner who, despite his extreme ignorance, claimed to be the master of his age in the art of adab, so that the people of his town mocked him—and he deserved it. I met him there and wrote down from him his verses: "The fire of the dust-cloud and the rains of the sky nourish, / watering the lands for the sustenance of nations; / the thunder and the lightning—this one strikes and that one tells, / a sword drawn amid the marks of war, complaining of nothing." He has other verses of the same sort; may God pardon him.'
