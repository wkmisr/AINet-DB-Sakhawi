translation:
  ja: アリー・ブン・ムハンマド・ブン・ムーサー・ブン・ウマイラ・ブン・ムーサー、ヌール・アッ＝ディーン・アル＝クラシー・アル＝マフズーミー・アル＝ヤブナーウィー・アル＝マッキー、シャーフィイー派。先述のアフマド・ブン・アブドゥッラティーフの従兄弟。788年にアル＝アフィーフ・アン＝ナシャーワリー、アル＝ブルハーン・ブン・アリー・ブン・ファルフーン、アッ＝タキー・ブン・ハーティム、イブン・アラファ、アル＝アブナースィー、アル＝イラーキー、アル＝ハイサミーらが彼にイジャーザを与えた。839年サファル月にマッカで没した。イブン・ファフドも彼の没年を記録している。
  en: ʿAlī b. Muḥammad b. Mūsā b. ʿAmīra b. Mūsā, Nūr al-Dīn al-Qurashī al-Makhzūmī al-Yabnāwī al-Makkī al-Shāfiʿī, cousin of the aforementioned Aḥmad b. ʿAbd al-Laṭīf. In 788 he was granted ijāza by al-ʿAfīf al-Nashāwarī, al-Burhān b. ʿAlī b. Farḥūn, al-Taqī b. Ḥātim, Ibn ʿArafa, al-Abnāsī, al-ʿIrāqī, al-Haythamī and others. He died in Ṣafar 839 in Mecca. Ibn Fahd also recorded his death.
