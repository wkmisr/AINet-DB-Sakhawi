translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド、アル＝バドル・ブン・アル＝ジャマール・アッ＝サマンヌーディー・アル＝カーヒリー・アッ＝シャーフィイー、父は前述。アッ＝サーヒビーヤに隣接するアル＝クトビーヤの教授職で父の後を継いだが、その後ザイヌルアービディーン・ブン・アル＝マナーウィーがその父の時代にそれを彼から奪い取った。また、ウンム・アッ＝スルターン学院の復習教師職（イアーダ）、その書庫の管理、そこのサビールの初等学塾、およびそのイマーム職——イマーム職のみウバイド・アル＝ヒーティーとの共有——が彼の名義であった。860年より後に没した、と思われる。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad, al-Badr b. al-Jamāl al-Samannūdī al-Qāhirī al-Shāfiʿī; his father was mentioned above. He succeeded him in the professorship of al-Quṭbiyya, adjacent to al-Ṣāḥibiyya, but then Zayn al-ʿĀbidīn b. al-Manāwī wrested it from him in the days of his [Zayn al-ʿĀbidīn's] father. Likewise there stood in his name the post of repetitor (iʿāda) at the Madrasa of Umm al-Sulṭān, the keeping of its books, the elementary school (kuttāb) of its sabīl, and its imamate—the imamate in particular being shared with ʿUbayd al-Hītī. He died after [8]60, as far as I suppose.
