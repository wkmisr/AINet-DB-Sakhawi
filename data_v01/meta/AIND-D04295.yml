translation:
  ja: アブド・アル＝カリーム、ジャーニー・バクと称される、ブン・マイラブ・アル＝マッキー、ジッダの職人。（8）90年ラマダーン月14日、土曜の前夜にジッダで、首に降りたカタルのために飲食ができなくなり、ほとんど急死した。マッカへ運ばれて葬礼が行われ、ムアッラー墓地のバヌー・ファフドの墓所にある母の墓の上に葬られた。両親と兄弟たちに孝行であった。
  en: ʿAbd al-Karīm, called Jānī Bak, b. Maylab al-Makkī, the craftsman at Jidda. He died almost suddenly, from a catarrh that descended into his neck and prevented him from eating and drinking, on the eve of Saturday the fourteenth of Ramaḍān of the year [8]90, at Jidda; he was carried to Mecca, prayed over, and buried over his mother in the tomb of the Banū Fahd in al-Muʿallā. He was dutiful to his parents and his brothers.
