translation:
  ja: アブド・アル＝カリーム・ブン・アリー・ブン・ムハンマド・ブン・アブド・アル＝カリーム、カリーム・アッ＝ディーン・ブン・アル＝ハワージャ・シャイフ・アリー・アル＝キルマーニー・アル＝マッキー。810年に同地（マッカ）で生まれ、アッ＝ザイン・アブー・バクル・ブン・アル＝フサイン・アル＝マラーギーから『（サヒーフ・）ムスリム』『（スナン・）アブー・ダーウード』『（サヒーフ・）イブン・ヒッバーン』の結講（ハトム）を聴聞した。860年ジュマーダー・アル＝アーヒラ月にアデンで没した。イブン・ファフドがその没年を記録している。
  en: ʿAbd al-Karīm b. ʿAlī b. Muḥammad b. ʿAbd al-Karīm, Karīm al-Dīn b. al-Khawājā Shaykh ʿAlī al-Kirmānī al-Makkī. He was born there (in Mecca) in the year 810 and heard from al-Zayn Abū Bakr b. al-Ḥusayn al-Marāghī the concluding sessions (khatm) of Muslim, of Abū Dāwūd and of Ibn Ḥibbān. He died in Jumādā al-Ākhira of the year [8]60 in Aden. Ibn Fahd recorded his death.
