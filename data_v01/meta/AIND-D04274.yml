  note:
    ja: '父 = #AIND-D05451（علي بن محمد بن عبد الكريم بن حسن الخواجا العلاء الكيلاني ثم المكي ويعرف بالشيخ علي、没848 بعدن）。同定根拠: (1) ナサブ一致＝本項「عبد الكريم بن علي بن محمد بن عبد الكريم」の父は علي بن محمد بن عبد الكريم で、D05451 の見出しと完全一致。(2) 呼称一致＝本項「الخواجا شيخ علي」＝ D05451「الخواجا … ويعرف بالشيخ علي」。(3) 生活圏一致＝両者ともマッカ在住で عدن に没（父 848、本項主 860）。(4) 兄弟項 D01054「أحمد بن علي بن محمد بن عبد الكريم بن حسن الكيلاني المكي ويعرف أبوه بالخواجا شيخ علي」（生807）は本項主と同じ師 الزين المراغي から同じ書目（صحيح مسلم・سنن أبي داود・صحيح ابن حبان の ختم）を聴き、ニスバを الكيلاني と記す。(5) D05451 は「ولد بكيلان」と明記し、ニスバ الكيلاني はその出身地に対応する。以上から本項の الكرماني は الكيلاني の綴り揺れ（كيلاني／كرماني は字形近似）と判断し、父 relation を D05451 に置いた（Waka 確認 2026-09-08）。ニスバ要素 الكرماني（TMP-N-00188）は原文に忠実に保持し、名寄せは行わない。兄弟 D01054 との brother relation は本項原文に言及がないため置かない。'
