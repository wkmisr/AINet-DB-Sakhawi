translation:
  ja: ムハンマド・ブン・シャアバーン・ブン・アリー・ブン・シャアバーン、アッ＝シャムス、アル＝ガッズィー、シャーフィイー派。カイロのバルクーキーヤ（学院）の寄寓者で、先述のアフマドとアブドゥルカーディルの同父母兄弟であり、三人の最年長である。法学とその原理論、アラビア語学などに励み、アル＝イバーディー、アル＝ジャウジャリー、アブー・アッ＝サアーダート、アッ＝ザイニー・ザカリヤー、アッ＝シャラフ・ブン・アル＝ジーアーンらから学び取り、私（サハーウィー）から諸々を聴聞した。彼は兄弟には及ばず、加えて貧窮していた。ハッジを行い、短期間（マッカに）滞在し、生計を立てるためにシリアに入り、（その後）カイロに定住してバルクーキーヤに住み、サーリヒーヤ（学院）の復習教師（ムイード）の一人に落ち着いた。
  en: Muḥammad b. Shaʿbān b. ʿAlī b. Shaʿbān, al-Shams al-Ghazzī al-Shāfiʿī, a resident of the Barqūqiyya in Cairo, full brother of the aforementioned Aḥmad and ʿAbd al-Qādir, and the eldest of the three. He occupied himself with jurisprudence, its principles, Arabic and other subjects, and took from al-ʿAbbādī, al-Jawjarī, Abū al-Saʿādāt, al-Zaynī Zakariyyā, al-Sharaf b. al-Jīʿān and others, and heard various things from me (al-Sakhāwī). He bears no comparison with his brother, and was moreover in poverty. He performed the pilgrimage and sojourned briefly, entered Syria to earn a living, then settled in Cairo, lived in the Barqūqiyya, and was appointed one of the repetitors (muʿīd) at the Ṣāliḥiyya.
