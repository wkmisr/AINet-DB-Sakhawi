translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・イーサー、アル＝ハカミー、アル＝ヤマニー。後にアル＝ハイフィー。父は、後述するアル＝イッズ・アッ＝タイイブで、イブン・ムタイヤルとして著名な家系の出である。880年ムハッラムにジッダで死去し、その遺骸はマッカへと運ばれ、アル＝ムアッラー墓地に埋葬された。
  en: Ibrāhīm b. Muḥammad b. Ibrāhīm b. Muḥammad b. ʿĪsā al-Ḥakamī al-Yamānī, then al-Khayfī. His father, al-ʿIzz al-Ṭayyib, will be mentioned later, and he was known as Ibn Muṭayr, from a prominent family. He died in Muḥarram 880 H in Jeddah, and his body was transported to Mecca and buried in al-Muʿallā.
