translation:
  ja: アッラーン・ミン・トゥトゥフ、アル＝アシュラフィー・バルスバーイ。十人隊長（アミール・アシャラ）の一人で、871年のラジャブ巡礼団の団長。ビルカト・アル＝ハッジへの道の途中に立派な給水所（サビール）を建てた。886年ラビーウ・アル＝アーヒル月末日の木曜日に没した。老齢に達しており、私は彼を好意的に語る者から（話を）聞いた。
  en: ʿAllān min Ṭuṭukh al-Ashrafī Barsbāy, one of the amīrs of ten, and amīr of the Rajabiyya caravan in the year 871. He built a fine public fountain (sabīl) along the road to Birkat al-Ḥājj. He died on Thursday, the last day of Rabīʿ al-Ākhir of the year 886, having grown old, and I heard someone speak well of him.
