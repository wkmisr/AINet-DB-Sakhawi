translation:
  ja: ハリール・ブン・ハサン・ブン・ヒルズッラー、農民たちのカーディー。人々は農事の諸事で彼に裁定を仰いだ。いくつかの中心地（マラーキズ）で証人（シャーヒド）を務め、アル＝ハッジャールらのもとで（幼時に）聴講した。（8）01年ジュマーダー・アル＝アーヒラ月に没した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Khalīl b. Ḥasan b. Ḥirz Allāh, the qāḍī of the peasants. They used to refer to him in matters of farming. He served as a notary-witness in some of the district centres (marākiz) and had attended the sessions of al-Ḥajjār and others. He died in Jumādā II of the year [8]01. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
