  ja: ムハンマド・ブン・アブー・バクル・アッ＝シャムス・アッ＝ダバイー・アル＝ハナフィー。アル＝アヤースィーから学び、ガザのカーディー職に就き、その後公証人業（シャハーダ）に戻った。彼は現在存命である。
  en: Muḥammad b. Abī Bakr al-Shams al-Ḍabaʿī al-Ḥanafī. He studied under al-Ayāsī, held the judgeship (qaḍāʾ) of Gaza, and then returned to notarial work (al-shahāda). He is now alive.
