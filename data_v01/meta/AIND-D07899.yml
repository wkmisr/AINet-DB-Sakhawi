translation:
  ja: ムハンマド・ブン・アブドゥルハーディー・ブン・アビー・アル＝ヤマン・ムハンマド・ブン・アフマド・ブン・アッ＝リダー・イブラーヒーム・ブン・ムハンマド・イブン・イブラーヒーム、アブー・アル＝ヤマン・アッ＝タバリー・アル＝マッキー。母はザイナブ・ビント・アビー・アブドゥッラー・ムハンマド・ブン・アビー・アル＝アッバース・ブン・アブドゥルムウティー。イブン・ファハドは彼について（没年を）空白のまま残した。
  en: Muḥammad b. ʿAbd al-Hādī b. Abī al-Yaman Muḥammad b. Aḥmad b. al-Riḍā Ibrāhīm b. Muḥammad b. Ibrāhīm, Abū al-Yaman al-Ṭabarī al-Makkī. His mother was Zaynab bt. Abī ʿAbd Allāh Muḥammad b. Abī al-ʿAbbās b. ʿAbd al-Muʿṭī. Ibn Fahd left a blank (for his death date).
