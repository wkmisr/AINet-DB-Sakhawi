notes:
- text: '兄弟: 次項 #AIND-D07900「محمد أبو حامد أخو الذي قبله」（本項主を「الذي قبله」として名指し＝D07900 側から brother relation）。同父の兄弟姉妹: #AIND-D10737 أبو بكر بن عبد الهادي（母は別＝زينب ابنة الرضي محمد بن المحب）・#AIND-D13096 زينب（母 أم هانئ ابنة عبد الوهاب اليافعي）・#AIND-D13210 ستيت と #AIND-D13824 أم هانئ（同母＝D13109）。いずれも相手側が本項主を名指ししないため relation は立てず note に留める（規則23）。'
