translation:
  ja: シーバーイ・アル＝アシュラフィー・イーナール。ガザの副王（ナーイブ）、次いでダマスクスのハージブ（侍従）、その後ハマの副王を務めた。カーンスーフの兄弟。遠征（タジュリーダ）の最中に没した。
  en: Sībāy al-Ashrafī Īnāl. Viceroy (nāʾib) of Gaza, then chamberlain (ḥājib) of Damascus, and then viceroy of Hama. He was the brother of Qānṣawh. He died during a military expedition (al-tajrīda).
