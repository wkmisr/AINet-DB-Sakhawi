translation:
  ja: アブドゥッラフマーン・ブン・ムハンマド・ブン・ハサン・アル＝マクサキー・アル＝バリーヒー・アッ＝タアズィー・アル＝ヤマーニー。我らのシャイフ（イブン・ハジャル）は『インバー・アル＝グムル』の中で次のように述べている。「イエメンの知識人の一人であり、法学（フィクフ）などの分野で卓越していた。その後、ハッジ（巡礼）を行い、帰路の途上、820年ムハッラム月3日に死去した。」
  en: 'ʿAbd al-Raḥmān b. Muḥammad b. Ḥasan al-Maksakī al-Burayhī al-Taʿzī al-Yamānī. Our shaykh (Ibn Ḥajar) said in his Inbāʾ: ''He was one of the scholars of Yemen who excelled in jurisprudence (fiqh) and other fields. He then performed the pilgrimage (Hajj), and upon his return, he died while traveling in a caravan on the third of Muharram in the year 820.'''
