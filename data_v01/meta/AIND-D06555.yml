translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・ムハンマド、アッ＝シャムス、ヤースーフ出自、アッ＝ディマシュキー、アッ＝シャーフィイー。カイロの（カーディー）代理の一人で、後出のムハンマドの父。ダマスクスでアル＝バーウーニーのためにナキーブ職を務め、さらに同地のヒスバ、ナーズィル・アル＝ハーッスのウスターダール職その他も務めた。評判の良い人ではなかったが、以前からの面識ゆえにアッ＝ザーヒル・フシュカダムに近侍し、そのためエジプトのカーディーたちは彼を代理に任じていた。74年ジュマーダー第二月に没した。神が彼を赦されんことを。
  en: Muḥammad b. Ibrāhīm b. Muḥammad b. Muḥammad, al-Shams, al-Yāsūfī by origin, al-Dimashqī al-Shāfiʿī, one of the deputy judges in Cairo and father of the Muḥammad who will come below. He served as naqīb for al-Bāʿūnī in Damascus, and indeed held its ḥisba, the office of ustādār to the nāẓir al-khāṣṣ, and other posts. He was not well regarded, but he became close to al-Ẓāhir Khushqadam because of an earlier acquaintance with him, and for that reason the judges of Egypt used to appoint him as their deputy. He died in Jumādā II of the year 74; may God pardon him.
