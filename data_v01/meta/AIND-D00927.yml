translation:
  ja: アブドゥッラーの子アフマド、ラカブはシハーブ。ハサニーを本源とし、マダニー。メディナの聖域における敷物係と賛美歌詠唱者たちのシャイフ。メディナで私（＝サハーウィー）から聴聞した人物。
  en: Aḥmad b. ʿAbd Allāh, al-Shihāb, al-Ḥasanī by origin, al-Madanī, Shaykh of the Farrāshīn (attendants) and Maddāḥūn (eulogists) in its Sacred Precinct (Medina). He was among those who heard from me (al-Sakhāwī) in Medina.
