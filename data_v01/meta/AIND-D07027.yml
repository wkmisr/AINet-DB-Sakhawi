translation:
  ja: ムハンマド・ブン・アフマド、アル＝バドル・ブン・アッ＝シハーブ・アル＝バンハーウィー・アル＝カーヒリー・アッ＝シャーフィイー。ナースィル・アッ＝ディーン・ブン・アスィールの同母兄弟で、イブン・アル＝フマームの長女を娶った彼の婿（スィフル）。彼〔イブン・アル＝フマーム〕とともに巡礼し、〔マッカに〕滞在した。極端に肥満し、理解力とあらゆる美徳から程遠く、岳父から一粒も得るところがなかった。おそらく860年以後に没した。
  en: Muḥammad b. Aḥmad, al-Badr b. al-Shihāb al-Banhāwī al-Qāhirī al-Shāfiʿī, the brother of Nāṣir al-Dīn b. Aṣīl on his mother's side and the son-in-law of Ibn al-Humām through his eldest daughter. He performed the pilgrimage with him and stayed on [in Mecca]. He was extremely obese, far removed from understanding and from every virtue, and did not gain a single grain from his father-in-law. He died after [the year] 860, presumably.
