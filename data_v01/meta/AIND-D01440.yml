translation:
  ja: アフマド・ブン・ムハンマド・ブン・アリー、アブー・アル＝アッバース・アル＝マスムーディー・アル＝マージリー（ジームとカーフの間が繋がった書き方のマグリブのニスバ）・アル＝マグリビー、預言者の町（マディーナ）の定住者。イブン・アビー・アル＝ヤマン・アル＝ブハーリーが、アブー・アブドゥッラー・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・マルズークからの彼（本人）の伝承によって、『（サヒーフ・）アル＝ブハーリー』を彼のもとで朗読した。
  en: Aḥmad b. Muḥammad b. ʿAlī, Abū al-ʿAbbās al-Maṣmūdī al-Mājrī (with a looped jīm joined to the qāf, a Maghribī nisba), al-Maghribī, a resident of al-Madīna al-Nabawiyya. Ibn Abī al-Yaman al-Bukhārī read the Ṣaḥīḥ al-Bukhārī under him (the subject) on the basis of the subject's narration of it from Abū ʿAbd Allāh Muḥammad b. Aḥmad b. Muḥammad b. Aḥmad b. Muḥammad b. Marzūq.
