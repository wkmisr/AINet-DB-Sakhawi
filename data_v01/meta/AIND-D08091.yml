translation:
  ja: ムハンマド・ブン・アリー・ブン・サーリフ・ブン・イスマーイール、アル＝キナーニー、アル＝マダニー。カーディー・ナースィル・アッ＝ディーン・アブドゥッラフマーン・ブン・ムハンマド・ブン・サーリフの従兄弟で、預言者（神の祝福と平安あれ）の叔父ハムザの廟の奉仕者（ハーディム）。アッ＝タキー・ブン・ファハドにイジャーザを与え、（イブン・ファハドは）彼の伝記のために余白を残した。
  en: Muḥammad b. ʿAlī b. Ṣāliḥ b. Ismāʿīl al-Kinānī al-Madanī, cousin of the qāḍī Nāṣir al-Dīn ʿAbd al-Raḥmān b. Muḥammad b. Ṣāliḥ, and servant (khādim) of the tomb of Ḥamza, the Prophet's uncle (peace and blessings be upon him). He granted an ijāza to al-Taqī b. Fahd, who left a blank space for his biography.
