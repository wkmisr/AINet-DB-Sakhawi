notes:
- text: '転送見出し（原文末尾「يأتي فيمن جده محمد بن أبي بكر بن محمد」による）。転送先は #AIND-D08579「محمد بن علي بن محمد بن أبي بكر بن محمد بن أحمد الجمال أبو المحاسن بن النور القرشي العبدري المكي قاضيها الشافعي الشيبي . ولد في رمضان سنة تسع وسبعين وسبعمائة بمكة …」（未受領）。本見出しは祖父 محمد を省いた「محمد بن علي بن أبي بكر」形で、ラカブ الجمال・ニスバ الشيبي が一致。ニスバ索引 #AIND-D11781「الشيبي … منهم الجمال محمد بن علي بن محمد بن أبي بكر بن محمد」も同人。'
  type: reference
translation:
  ja: ムハンマド・ブン・アリー・ブン・アビー・バクル、アル＝ジャマール・アッ＝シャイビー。祖父がムハンマド・ブン・アビー・バクル・ブン・ムハンマドである者たち（の部）で後述する。
  en: Muḥammad b. ʿAlī b. Abī Bakr, al-Jamāl al-Shaybī. He will come below among those whose grandfather is Muḥammad b. Abī Bakr b. Muḥammad.
