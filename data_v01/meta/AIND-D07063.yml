notes:
- text: '転送見出し（原文末尾「فيمن جده عثمان بن محمد」による）。転送先は #AIND-D06727「محمد بن أحمد بن عثمان بن عمر أبو عبد الله التونسي المالكي نزيل الحرمين ويعرف بالوانوغى」（759年頃生）。クンヤ أبو عبد الله・ニスバ الوانوغي・マーリキー派が一致する唯一の見出しだが、曾祖父名が本項「عثمان بن محمد」⇄ D06727「عثمان بن عمر」で食い違う（ニスバ索引 #AIND-D12114「الوانوغي محمد بن أحمد بن عثمان بن عمر ومحمد بن موسى بن عابد」も عمر）。corpus に「محمد بن أحمد بن عثمان بن محمد … الوانوغي」の見出しは無く、転送先は D06727 と判断（曾祖父名の異伝は要検証）。'
