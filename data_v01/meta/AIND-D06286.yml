translation:
  ja: カーンスーフ・アル＝アシュラフィー・イーナール。十人隊アミールの一人で、アッ＝サイフィー・アル＝ハナフィーの娘を娶ったその女婿であり、ジュライバートと渾名された。882年ムハッラム月に没した。弓射に秀でていたと言われ、スルターンの側近であった。
  en: Qānṣūh al-Ashrafī Īnāl, one of the amirs of ten and son-in-law of al-Sayfī al-Ḥanafī through his daughter; he was nicknamed Juraybāt. He died in Muḥarram of the year 882. He was spoken of as excelling in archery and enjoyed the special favour of the sultan.
