translation:
  ja: ヒラール、学識と教養のあるマグリブ人。860年頃カイロに来た。私は彼がアラム・アル＝ブルキーニーを称える自作の詩を吟じるのを聞き、彼はそれを自筆で私に書いてくれた（6行、原文参照）。イブン・アズムが「ヒラール・アル＝バッタートは86X年に没した」と述べているのを見たが、これは本人のようである。
  en: Hilāl, a Maghribī of learning and accomplishment. He came to Cairo about 860; I heard him recite his verses in praise of al-ʿAlam al-Bulqīnī, which he wrote out for me in his own hand (six lines). I saw that Ibn ʿAzm said "Hilāl al-Baṭṭāṭ died in 86X" — apparently this man.
