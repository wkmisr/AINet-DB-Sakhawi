  en: Bīr Muḥammad b. al-ʿIzz ʿAbd al-ʿAzīz b. al-Shihāb Aḥmad al-Makkī, the maternal grandson of Bīr Muḥammad al-Khawājā, who is mentioned below. His mother was Ṣafiyya. He was known as Ibn al-Mrāḥlī. He died in al-Muḥarram, the year 891 AH.
