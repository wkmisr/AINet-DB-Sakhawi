notes:
- text: '転送見出し（「وهو قانم نعبة」＝「هو الذي قبله」型の同一人指示による）。転送先は #AIND-D06304「قانم الملقب نعجة الأشرفي برسباي . كان من خاصكية سيده ثم تأمر عشرة في أيام إينال إلى أن مات في جمادى الأولى سنة إحدى وسبعين」（871年没、本バッチ未受領）。通称の綴りは本項「نعبة」・転送先「نعجة」で点（ب／ج）が異なる（規則10③の点の揺れ）。corpus に「قانم نعبة」の見出しは無く、同主人（الأشرفي برسباي）の قانم で通称が対応するのは D06304 のみ。綴りは双方とも原文どおりに保持（規則25・46）。ISSUES §D130-1。'
  type: reference
