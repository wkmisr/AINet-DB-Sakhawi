translation:
  ja: ムハンマド・ブン・アッバース・ブン・ムハンマド・ブン・アッバース、アッ＝シャムス・アル＝バアリー。飼料商（アッラーフ）は父のほうである。［ヒジュラ暦］776年頃バアルベクに生まれ、同地でアブー・アル＝ファラジュ・アブド・アッ＝ラフマーン・ブン・アッ＝ザアブーブ――アル＝ハッジャールが彼に伝えた――から『サヒーフ』を聴聞した。私はそこで彼に会い、彼のもとで（その『サヒーフ』から）イブン・タイミーヤの『百（ハディース）』を、その読了（ハトマ）とともに読誦した。彼は善良な人であり、ハッジを行った。［8］60年頃に没した。
  en: Muḥammad b. ʿAbbās b. Muḥammad b. ʿAbbās, al-Shams al-Baʿlī; al-ʿAllāf (the fodder-seller) is his father. He was born approximately in the year 776 in Baʿlabakk, and heard there the Ṣaḥīḥ from Abū al-Faraj ʿAbd al-Raḥmān b. al-Zaʿbūb, who had it from al-Ḥajjār. I met him there and read to him the Miʾa of Ibn Taymiyya from it, together with his completion (khatma) of it. He was a good man, and performed the pilgrimage. He died close to the year [8]60.
