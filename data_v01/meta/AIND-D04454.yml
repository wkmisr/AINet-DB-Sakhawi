notes:
- text: '原文末尾の「وليس هو بأب لمحمود بن شيرين فذاك محمود بن مسعود بن يوسف كما سيأتي」は、サハーウィーによる同名混同への注意書き。ここでいう الكمال محمود ابن شيرين は #AIND-D09881（محمود بن يوسف بن مسعود الكمال العجمي الأصل القاهري الحنفي والد أحمد ويعرف بابن شيرين، 875年ズー・アルカアダ没）であり、本項主の子ではない。corpus 本文は「محمود بن مسعود بن يوسف」と父祖名を転倒させているが、転送見出し「محمود بن شيرين في ابن يوسف بن مسعود」および D09881 本伝の綴りにより同一人物と確定できる。初版は「محمود بن شيرين」と「محمود بن مسعود بن يوسف」を別人として統制外 subtype「genealogical distinction」の relation 2件に分けていたが、両者は同一人物であり、かつ「〜ではない」という否定的言明であるため relation 化せず本 note に統合した。'
  lang: ja
translation:
  ja: アブドゥッラー・ブン・シーリーン、アル＝ジャマール・アル＝ヒンディー・アル＝ハナフィー。カイロの居留者。イブン・アブドゥルハーディーから聴聞し、（ハディースを）伝えた。また没するまでアル＝バルクーキーヤで説教（フトバ）を行った。彼はインドについて驚異の話を伝えたが、その真偽はアッラーが最もよく知りたもう。809年に没した。我らがシャイフ（イブン・ハジャル）が『インバー』でそう述べ、アル＝マクリーズィーも『ウクード』でこれに従っている。なお彼はマフムード・ブン・シーリーンの父ではない。その者は、後述するとおりマフムード・ブン・マスウード・ブン・ユースフである。
  en: ʿAbd Allāh b. Shīrīn, al-Jamāl al-Hindī al-Ḥanafī, a resident of Cairo. He heard from Ibn ʿAbd al-Hādī and transmitted [ḥadīth], and he preached (khaṭaba) at al-Barqūqiyya until he died. He used to relate marvels about India, whose soundness God knows best. He died in the year 809. Our shaykh (Ibn Ḥajar) said so in his Inbāʾ, and al-Maqrīzī followed him in his ʿUqūd. He was not the father of Maḥmūd b. Shīrīn; that one is Maḥmūd b. Masʿūd b. Yūsuf, as will follow.
