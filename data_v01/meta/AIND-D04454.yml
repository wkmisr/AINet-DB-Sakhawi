    ar: سمع من ابن عبد الهادي
    ja: '【裁定 2026-09-18（§Db-3）】師「ابن عبد الهادي」＝ #TMP-P-001114 を、汎用の一族シュフラ番号ではなく أبو الفرج عبد الرحمن بن عبد الهادي（『صحيح مسلم』の伝承者。ダマスクス出身、エジプトでも聴聞を受けた）の番号として実体化する。cert="medium"。根拠: (a) corpus で裸形の「ابن عبد الهادي」が現れるのは『صحيح مسلم』聴聞の文脈に集中し（L19597「سمع من ابن عبد الهادي صحيح مسلم」、L55720「صحيح مسلم على ابن عبد الهادي」、L57134＝D05217「سمع صحيح مسلم على ابن عبد الهادي」〔813年没〕）、その完全形は L12043・13592・33998・95803・97197・97879・97888・101050・118839 の「أبي الفرج بن عبد الهادي」である。(b) L42330 は彼からの聴聞地を「وبمصر ابن عبد الهادي」＝エジプトと記し、カイロ居住・809年没の本項主が「سمع من ابن عبد الهادي」と記されることと年代・場所の双方で整合する。(c) D12909（بركة ابنة سليمان）の「سمعت على عبد الرحمن ابن عبد الهادي」により、この人物のイスムが عبد الرحمن であることが corpus 内で確認できる。(d) 801H 以前の没のため al-Ḍawʾ に独立立項がなく、corpus にも本伝が無い（ع 部の見出し走査で確認）ため AIND は充てられず、TMP-P が正当。⚠この番号を一族の他の男性に流用してはならない: 索引項 #AIND-D12516「ابن عبد الهادي أحمد بن حسن ابن عبد الهادي وابنه حسن الملقب بالمبرد وابنه يوسف وجماعة」の系統、أحمد بن عبد الحميد ابن عبد الهادي（L17746）、العماد أبو بكر بن أحمد ابن عبد الهادي（L88357・89900）、女性の
      عائشة ابنة ابن عبد الهادي（#TMP-P-000158）およびその姉妹たちは、いずれも本番号とは別実体である（TMP-P-000529 型の汎用番号化を避けるための明示的警告）。'
