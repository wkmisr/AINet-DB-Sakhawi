translation:
  ja: ハサン・バドル・アッディーン・アッ＝シャクリー・アル＝カラキー。842年ズー・アル＝ヒッジャ月24日にカイロで没した。彼は行政実務（ムバーシャラ）に精通しており、その仕事ぶりにおいて感謝されていた。アル＝ムアイヤド（シャイフ）らの時代に、エルサレムとヘブロンの監督官（ナザル）をしばらく務めた。我らがシャイフ（イブン・ハジャル）は『インバー・アル＝グムル』の中で彼について言及しており、他の者は、彼がガザの長官も務めたと付け加えている。
  en: Ḥasan Badr al-Dīn al-Shaklī al-Karakī. He died in Cairo on the 24th of Dhū al-Ḥijja in the year 842 AH. He was knowledgeable in administration (mubāshara) and praised for his service. He held the supervision (naẓar) of Jerusalem and Hebron for a period during the reign of al-Mu'ayyad (Shaykh) and others. Our shaykh (Ibn Ḥajar) mentioned him in his Inbā' (al-Ghumr), and others added that he was also appointed over Gaza.
