translation:
  ja: ヤフヤー・ミン・シャーヒーン・アル＝カイスィー、ハナフィー派。ジャーミウ・スンクルのイマーム。アッ＝サラーフ・アッ＝タラーブルスィーに師事して、大部の書やその他の書の多くを読み、またその講義を聴き、そのためおおむね頭角を現した。さらにアル＝アミーン・アル＝アクサラーイーのもとにも少し出席した。アッ＝ザイン・ジャアファルとイブン・アル＝フムサーニーのもとで七読誦、さらにそれ以上を集成して読み、彼に、その墓のそばで『シャーティビーヤ』を暗誦して提示した。初学のころアラビア語学をアル＝ワズィーリーのもとで読んだ。『シャーティビーヤ』のほかに、サドル・アッ＝シャリーアの『タンキーフ』と『マジュマウ』を暗記しており、善良で分別がある。
  en: Yaḥyā min Shāhīn al-Qaysī, the Ḥanafī, imam of the Mosque of Sunqur. He attached himself to al-Ṣalāḥ al-Ṭarābulusī, reading many of the major books and others and hearing his lessons, so that on the whole he distinguished himself; he also attended a little with al-Amīn al-Aqṣarāʾī. He recited the seven readings, and more, in combination under al-Zayn Jaʿfar and Ibn al-Ḥumṣānī, and he presented the Shāṭibiyya from memory to him at his grave. In his early days he read Arabic under al-Wazīrī. Among the texts he has memorized, besides the Shāṭibiyya, are the Tanqīḥ of Ṣadr al-Sharīʿa and the Majmaʿ; and he is a man of goodness and good sense.
