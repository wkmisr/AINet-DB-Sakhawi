translation:
  ja: サルマーン・ブン・ムスリム・アル＝ハナフィー。後述のムハンマドの兄弟。カーディーのサアド・アッ＝ディーンがその晩年に初めて代理（副カーディー）に任じた者の一人で、それ以前は彼の門で書記（ムワッキウ）を務めていたが、その務めに関する知識はなかった。881年シャウワール月に没した。
  en: Salmān b. Muslim al-Ḥanafī, the brother of Muḥammad who comes below. He was among those whom the qāḍī Saʿd al-Dīn, towards the end, newly appointed as his deputy, after he had been a scribe (muwaqqiʿ) at his gate; he had no knowledge of that office. He died in Shawwāl of the year 881.
