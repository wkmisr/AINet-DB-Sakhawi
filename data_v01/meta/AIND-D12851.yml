notes:
- text: '関連項（原文に続柄として出ない＝relation は立てない）: 兄弟 #AIND-D00421「أحمد بن إبراهيم بن أحمد بن غنائم … الماضي أبوه والآتي أخوه أبو الفتح ويعرف بابن علبك」（本項は名指ししない。父が AIND なので導出可、規則23）。夫は原文に出ない（規則14）が、息子のナサブから #AIND-D01534「أحمد بن محمد بن محمد بن محمد الشهاب … رئيس المؤذنين بالحرم النبوي كأبيه … وهو والد الشمس محمد وإبراهيم」とみられる。孫 #AIND-D01245。「علبك」は祖父 أحمد のラカブ（D00421「وهو لقب لجده أحمد … وكأنه مختصر من بعلبك」）。'
