translation:
  ja: アーミナ・ビント・イブラーヒーム・ブン・アルバク、マディーナの人。既出のアブー・ル＝ファトフの姉妹で、ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・ムハンマド・アッ＝ライースの母。（8）67年の末日、水曜日の前夜（火曜の夜）に没した。
  en: Āmina, daughter of Ibrāhīm b. ʿAlbak, of Medina, sister of the aforementioned Abū al-Fatḥ and mother of Muḥammad b. Aḥmad b. Muḥammad b. Muḥammad al-Raʾīs. She died on the eve of Wednesday, the last day of the year [8]67.
