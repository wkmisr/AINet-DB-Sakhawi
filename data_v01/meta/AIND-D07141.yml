notes:
- text: '転送見出し（原文末尾「هو ابن محمد بن حسن بن علي」＝「…の息子（の項にある者）」をブリーフ指示どおり転送指示と読む）。転送先は「محمد بن حسن بن علي」（#AIND-D07357「محمد بن حسن بن علي بن سليمان … الشمس الحلبي الحنفي … ويعرف بالموقت وبابن أمير حاج」）の息子＝ #AIND-D08746「محمد بن محمد بن الحسن بن علي بن سليمان بن عمر بن محمد الشمس الحلبي الحنفي الماضي أبوه والآتي ابنه الشمس محمد ويعرف بابن أمير حاج وبابن الموقت … وتعانى الميقات」（791生・868没、未収録）。ブリーフ候補の #AIND-D09072（محمد بن محمد بن محمد بن حسن بن علي、825生、D08746 の子で同じく「ابن أمير حاج وابن الموقت」）は「ابن محمد بن محمد بن حسن」であり原文の「ابن محمد بن حسن بن علي」の字義に合わないため第2候補として記す（§D119-2）。'
  type: reference
