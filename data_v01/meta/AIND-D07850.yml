  summary:
    ar: وله عندي قصيدة أضفتها لمصنف الشهاب الششيني الحنبلي الذي قامت عليه الثائرة بسببه
  note:
    ja: 本項主の詩（قصيدة）をサハーウィーが所持し、الشهاب الششيني الحنبلي の著作に付した。الشهاب الششيني＝#AIND-D00989「أحمد بن علي بن أحمد بن محمد بن عمر بن محمد بن وجيه الشهاب أبو حامد … الشيشيني الأصل القاهري الميداني الحنبلي」（844年生）。同項本文「عمل مؤلفا حين تحدث الملك بجباية شهرين من الأماكن في سنة أربع وتسعين … فقبحه العامة في ذلك وأطلقوا ألسنتهم فيه نظما ونثرا وكادوا قتله」＝894年の課税擁護論に対する騒動（「قامت عليه الثائرة بسببه」）と符合。本項主と الششيني の間に直接の関係は原文になく、サハーウィーとの関係も「所持」のみなので relation は立てない（初版の correspondent／literary connection relation を除去）。
translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ヤフヤー・アッ＝シャムス・アッ＝タイイビー・アッ＝シャーフィイー。私の手元に彼の詩（カスィーダ）が一篇あり、私はそれを、アッ＝シハーブ・アッ＝シシーニー・アル＝ハンバリーの著作――それが原因で彼に対して騒動が起きた――に付け加えた。彼が我らがシャイフ（イブン・ハジャル）とアル＝カーヤーティーから学んだ者の一人であると私は伝え聞いた。
  en: Muḥammad b. ʿAbd Allāh b. Yaḥyā al-Shams al-Ṭayyibī al-Shāfiʿī. I have in my possession a qaṣīda of his, which I appended to the treatise of al-Shihāb al-Shishīnī al-Ḥanbalī, against whom an uproar arose because of it. It has reached me that he was among those who studied under our shaykh (Ibn Ḥajar) and al-Qāyātī.
