translation:
  ja: ムハンマド・ブン・ウバイダーン、アル＝バドル、アッ＝ディマシュキー、アッ＝シャーフィイー。750年より前に生まれ、法学を修め、裁判官たちのもとで証人（公証人）を務め、頭角を現した。アル＝ブルキーニーが彼にファトワー発給の免許（イジャーザ）を与えた。アル＝ブルハーン・イブン・ジャマーアの代理としてバアルバクのカーディー職に就き、次いでヒムスのカーディー職に就いた。（80）2年ラビーウ1月に没した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Muḥammad b. ʿUbaydān, al-Badr, al-Dimashqī, al-Shāfiʿī. He was born before [7]50, studied jurisprudence, served as a notary witness before the judges, and distinguished himself. Al-Bulqīnī licensed him to issue fatwas. He held the judgeship of Baalbek as deputy of al-Burhān b. Jamāʿa, and then the judgeship of Homs. He died in Rabīʿ I of the year [80]2. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
