translation:
  ja: ムハンマド・ブン・アリー・ブン・アブドゥッラフマーン、アッ＝シャムス・アブー・アル＝ガイス・ブン・アル＝ムクリー・アン＝ヌール・ブン・アッ＝ザイン、アル＝ハリーリー、のちアッ＝サファディー、クルアーン読誦家、アル＝マグリビーとして知られる。871年にイブン・イムラーンとアン＝ナッジャールに七読誦法で読誦し、その一部をジャアファルに読誦した。
  en: Muḥammad b. ʿAlī b. ʿAbd al-Raḥmān, al-Shams Abū al-Ghayth b. al-Muqrī al-Nūr b. al-Zayn al-Khalīlī, then al-Ṣafadī, the Qurʾān reciter, known as al-Maghribī. He recited [the Qurʾān] according to the seven readings to Ibn ʿImrān and al-Najjār, and part of it to Jaʿfar, in the year [8]71.
