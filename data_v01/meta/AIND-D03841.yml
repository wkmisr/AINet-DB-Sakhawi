translation:
  ja: アブドゥルラフマーン・アッ＝タンティダーイー。アッ＝ハリーファ（後継者）の名で知られ、ストゥーフ教団の長（シャイフ）であった。カイロのファールス・マドラサに居住し、金曜礼拝の後にそこでサマーウ（精神的音楽集会）を催しており、多くの人々がこれに参集した。親しみやすい人柄もあり、彼の執り成し（シャファーア）が拒絶されることは滅多になかった。803年（ヘジュラ暦）のジュマーダー・アル＝アーヒラに没した。我らがシャイフ（イブン・ハジャル）がその著書『インバー・アル＝ゴムル』で彼について言及している。
  en: ʿAbd al-Raḥmān al-Ṭantidāʾī, known as al-Khalīfa, the leader (shaykh) of the Suṭūḥiyya order. He used to reside in al-Madrasa al-Fārisiyya in Cairo, where he held samāʿ (spiritual music gatherings) after the Friday prayer, which was attended by crowds of people. His intercessions were rarely rejected, along with his friendliness. He died in Jumādā al-Ākhira, the year 803 AH. Our shaykh (Ibn Ḥajar) mentioned him in his history book 『Inbāʾ al-Ghumr』.
