translation:
  ja: ムハンマド・ブン・サイード・ジャブルーフ・アル＝ハバシー、ジャマール・アッ＝ディーン、カーイド（隊長）、サイイド・バラカートの代理としてのマッカの副官。837年シャウワール月に同地で没した。イブン・ファハドがその没年を記し、「容姿の良い人であった」と述べた。
  en: 'Muḥammad b. Saʿīd Jabrūh al-Ḥabashī, Jamāl al-Dīn, the qāʾid, deputy of Mecca on behalf of al-Sayyid Barakāt. He died there in Shawwāl 837. Ibn Fahd recorded his death date and said: he was of handsome appearance.'
