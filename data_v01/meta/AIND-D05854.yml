translation:
  ja: ウマル・ブン・サーリフ・ブン・アッ＝シラージュ・アル＝ブハイリー・アル＝アズハリー・アル＝マーリキー。後述のアル＝バドル・ムハンマドの父。学問に携わり、証人（公証）業で生計を立て、さらに一時期カーディー代理を務め、諸々の職禄に受給登録された。裁判においても取引においても評判のよい人物ではなかった。
  en: ʿUmar b. Ṣāliḥ b. al-Sirāj al-Buḥayrī al-Azharī al-Mālikī, the father of al-Badr Muḥammad, mentioned below. He engaged in study and earned his living as a notary-witness; indeed he served as a deputy judge for a time and was enrolled in stipendiary posts. He was not praiseworthy either in his judging or in his dealings.
