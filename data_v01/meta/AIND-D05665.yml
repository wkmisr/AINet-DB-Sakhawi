translation:
  ja: アリー・ブン・ムーサー・ブン・ハールーン。アブー・アル＝ハサン・ブン・アッ＝ザイヤート。誦経者（ムクリ）。既述のシハーブ・アハマドの兄弟であり、イブン・アッ＝ザイヤートとして知られる。彼はサイード・アッ＝スアダー（ハーンカー）のスーフィーの一人で、徳高く輝かしい人物であった。彼はほぼ毎日、そこでスーフィーたちの履物を整える役を務めており、バイバルスィーヤ（ハーンカー）のスーフィーたちに対しても時折それを行うことがあった。また、絶えずクルアーンの朗誦と礼拝に励み、シャーフィイー派の集会などに熱心に出席していた。彼は876年の末に没した。なんと素晴らしい人物であったことか、彼に神の慈悲あれ。
  en: Ali bin Musa bin Harun, Abu al-Hasan bin al-Zayyat, the Muqri'. He was the brother of al-Shihab Ahmad, who was mentioned previously, and was known as Ibn al-Zayyat. He was a virtuous and radiant man from among the Sufis of Sa'id al-Su'ada', where he usually undertook the service of placing their shoes every day, and he would sometimes do the same for the Sufis of al-Baybarsiyya, while constantly reciting the Quran, worshipping, and being eager to attend the circle of al-Shafi'i and the like. He died in the late part of the year 876 AH. What an excellent man he was, may Allah have mercy on him.
