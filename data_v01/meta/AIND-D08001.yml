notes:
- text: '転送見出し（原文末尾「مضى فيمن جده أحمد بن أبي بكر」による）。転送先は #AIND-D07988「محمد بن علي بن أحمد بن أبي بكر بن سيف الدين بن جمال الدين عبد الله ابن الشيخ فضل الله النمراوي الأصل القاهري الشافعي الماضي أبوه ويعرف بالسعودي وابن السعودي ورأيت في مكان آخر بخطي اسم جده أحمد بن فضل بن أبي بكر بن عبد الله」（未受領）。D07988 本文のナサブ異伝「أحمد بن فضل بن أبي بكر بن عبد الله」が本見出しのナサブと一致。父は #AIND-D05018「علي بن أحمد بن فضل الله بن أبي بكر بن عبد الله النمراوي ثم القاهري … ووالد الآتي محمد … ويعرف بالسعودي」。'
  type: reference
translation:
