translation:
  ja: アブドゥル・ラフマーン・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・ファルフーン。アル＝バドル（・ブン・アル＝ムヒッブ・アブー・アブドゥッラー）。アル＝ヤアムリー、アル＝マダニー、アル＝マーリキー。後述するアブドゥッラーの兄弟で、イブン・ファルフーンとして知られる。アル＝アラム・アブー・アッ＝ラビーウ・スライマーン・アッ＝サッカーのもとで『アブー・ムスヒルの伝承集（ヌスハ）』を聴聞した。
  en: ʿAbd al-Raḥmān b. Muḥammad b. ʿAbd Allāh b. Muḥammad b. Farḥūn, al-Badr (b. al-Muḥibb Abū ʿAbd Allāh), al-Yaʿmurī, al-Madanī, al-Mālikī. He is the brother of ʿAbd Allāh, who is mentioned below, and is known as Ibn Farḥūn. He heard the Hadith compilation *Nuskhat Abī Mushir* under al-ʿAlam Abū al-Rabīʿ Sulaymān al-Saqqā.
