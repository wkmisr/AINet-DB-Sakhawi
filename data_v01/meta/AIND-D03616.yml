translation:
  ja: アブド・アッ＝ラフマーン・ブン・アビー・バクル・アッ＝ディマシュキー・アッ＝ラッサーム（彩画師）、イブン・アル＝ハッバールとして知られる。アッ＝シハーブ・ブン・アル＝ルブーディーが彼から学んで彼をムスニド（伝承者）と評し、彼が861年シャアバーン月2日の土曜日に急死し、翌日ダマスクスのサーリヒーヤに埋葬されたと述べた。
  en: ʿAbd al-Raḥmān b. Abī Bakr al-Dimashqī al-Rassām, known as Ibn al-Ḥabbāl. Al-Shihāb b. al-Lubūdī took (knowledge) from him, described him as a musnid, and said that he died suddenly on Saturday, 2 Shaʿbān 861 AH, and was buried the next day in al-Ṣāliḥiyya of Damascus.
