translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・アルワーン・ブン・ナブハーン・ブン・ウマル・ブン・ナブハーン・ブン・ガバーフィル・アル＝ジャブリーニー・アル＝ハラビー。およそ763年に生まれ、親戚のアブー・アブドゥッラー・ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・ナブハーンから『イブン・アル＝ムジャッバルの四十〔ハディース〕』を聴聞した。〔その師は〕親戚のサーフィー・ブン・ナブハーンから、〔サーフィーは〕その編者から聴聞していた。彼はこれを伝え、諸イマームが彼から聴聞した。没年は……〔欠落〕。
  en: Muḥammad b. Muḥammad b. ʿAlwān b. Nabhān b. ʿUmar b. Nabhān b. Ghabāfir al-Jabrīnī al-Ḥalabī. Born about 763. He heard from his relative Abū ʿAbd Allāh Muḥammad b. ʿAlī b. Muḥammad b. Nabhān the Arbaʿīn of Ibn al-Mujabbar, by the latter's audition from his relative Ṣāfī b. Nabhān, by his audition from its compiler. He transmitted it, and leading scholars heard it from him. He died ... [lacuna].
