translation:
  ja: スライマーン・ブン・アフマド・ブン・ウマル・ブン・ガーニム、アラム・アッ＝ディーン・アル＝バルンキーミー。学者アッ＝シャラフ・ムーサーとその兄弟たちの同母兄弟で、ハナフィー派副カーディーの一人アッ＝シャムス・ムハンマドの父。クルアーンを暗記し、城塞の兵舎（ティバーク）などで子弟にそれを教えることに従事した。ハナフィー派のいくつかの講義（の給費枝）に就き、そのためにハナフィー派に転じた。（8）46年に40代で没した。
  en: Sulaymān b. Aḥmad b. ʿUmar b. Ghānim, ʿAlam al-Dīn al-Barnakīmī, full brother of the scholar al-Sharaf Mūsā and his brothers, and father of al-Shams Muḥammad, one of the Ḥanafī deputy judges. He memorized the Qurʾān and occupied himself with teaching it to boys in the barracks of the Citadel and elsewhere. He obtained stipendiary places in some Ḥanafī classes and for that reason became a Ḥanafī. He died in the year [8]46, aged forty-odd.
