translation:
  ja: ウマル・ブン・ムハンマド・ブン・アフマド・ブン・アブドゥルアズィーズ。ダマスクス出自で、マッカに生まれ、マッカに住む。同地（マッカ）のファッラーシュ（聖モスクの敷物係・従僕）の長。父については後述する。イブン・バイサクとして知られる。842年にマッカで生まれ、そこで育ち、上述の長職を父から継いだ。カーディーのアル＝ブルハーニーに専従して仕え、アル＝アシュラフ・カーイトバーイが彼（ブルハーニー）を自らのもとへ来るよう招請した際には彼とともにカイロに入り、同様に彼とともに預言者の都マディーナを参詣した。それどころか、（マディーナを）一度ならず参詣した。異邦人に対する礼儀と職務の遂行において、彼に非難すべき点はない。
  en: ʿUmar b. Muḥammad b. Aḥmad b. ʿAbd al-ʿAzīz, of Damascene origin, born and resident in Mecca, chief of the farrāshūn (attendants of the Sacred Mosque) there; his father is mentioned below. He is known as Ibn Baysaq. He was born in the year 842 in Mecca, grew up there and succeeded his father in the aforementioned office. He attended constantly on the qāḍī al-Burhānī, in whose company he entered Cairo when al-Ashraf Qāytbāy summoned him (al-Burhānī) to come to him; likewise he visited the Prophet's Medina with him, and indeed visited it more than once. There is nothing to be said against him as regards his courtesy towards strangers and the performance of his duties.
