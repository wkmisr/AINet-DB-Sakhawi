translation:
  ja: アフマド・ブン・スライマーン・ブン・ムハンマド・アッ=ディールーティー。シャーフィイー派。イブン・ウザイラという名で知られているが、それは彼の母の名である。我らがシャイフ(イブン・ハジャル)のもとで『ブハーリー』を読み、またブルハーン・アル=カルキーのもとで法学、文法学、相続法をわずかに学んだ。証人職で生計を立て、ハッジ巡礼を行った。876年ラビーウ・ル=アウワル月8日（月曜日）に亡くなった。
  en: Aḥmad b. Sulaymān b. Muḥammad al-Dīrūṭī, Shāfiʿī. He was known as Ibn ʿUzayra, who was his mother. He read al-Bukhārī with our shaykh (Ibn Ḥajar), and he studied Fiqh, Naḥw, and Farāʾiḍ to a small extent with al-Burhān al-Karakī. He earned his living as a witness (shāhid) and performed the Hajj. He died on Monday, the 8th of Rabīʿ al-Awwal in the year 876 AH.
