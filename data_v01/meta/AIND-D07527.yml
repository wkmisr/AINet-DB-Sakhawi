translation:
  ja: ムハンマド・ブン・アブドゥッダーイム・ブン・ウマル・ブン・アワド、アル＝ムヒッブ、アブー・アブディッラー、アブー・アル＝バラカート、アブー・アル＝ハイル、イブン・アッ＝ザイン・イブン・アル＝アッラーマ・アビー・ハフス、アル＝マルサフィー、のちにアル＝カーヒリー、アッ＝シャーフィイー。786年頃に生まれ、イブン・スィッディークから『サヒーフ』を聴聞した。彼は我々にイジャーザを与えた。850年より後に没したと思われる。
  en: Muḥammad b. ʿAbd al-Dāʾim b. ʿUmar b. ʿAwaḍ, al-Muḥibb, Abū ʿAbd Allāh, Abū al-Barakāt and Abū al-Khayr, b. al-Zayn b. al-ʿAllāma Abī Ḥafṣ, al-Marṣafī, later al-Qāhirī, al-Shāfiʿī. He was born approximately in 786 and heard the Ṣaḥīḥ from Ibn Ṣiddīq. He granted us an ijāza. He died, presumably, after 850.
