translation:
  ja: アブドゥル＝カーディル・ブン・アブドゥル＝ラフマーン・ブン・ムハンマド・ブン・アブドゥル＝ワッハーブ・ブン・アブドゥッラー・ブン・アスアド・アル＝ヤーフィイー。インドで生まれ、マッカ（メッカ）に居住した。ヒジュラ暦882年サファル月（第2月）にマッカにて死去。イブン・ファハドが彼の伝記（没年）を記録している。
  en: ʿAbd al-Qādir bin ʿAbd al-Raḥmān bin Muḥammad bin ʿAbd al-Wahhāb bin ʿAbd Allāh bin Asʿad al-Yāfiʿī. Born in India and later resided in Mecca. He died in Mecca in the month of Safar in the year 882. His death was recorded by Ibn Fahd.
