  note:
    ja: 'Pattern A。「قال الحسناوي」を情報源の発言と読む（ブリーフ）。الحسناوي ＝ #AIND-D04657「عبد الله بن يوسف بن علي بن خلد الحسناوي البجائي المغربي المالكي لقيني بالمدينة النبوية فأخذ عني … ورجع إلى بلاده」（repo 収録済）＝ビジャーヤ出身でサハーウィーに直接会った唯一の الحسناوي（#AIND-D00737 では「صاحبنا عبد الله الحسناوي」）。ただし corpus には同郷の「سليمان بن يوسف الحسناوي」（#AIND-D09018、本伝なし）もおり、裸ニスバによる同定なので cert medium（ISSUES §D162-8）。【集約 2026-11-08】#AIND-D04657 への同定を外し #NEEDID に（内容B M、オーケストレーター決定6、規則26・61(c)・62）。裸の「الحسناوي」は corpus で複数人を指す: 候補 (1) #AIND-D04657 عبد الله بن يوسف بن علي بن خلد الحسناوي البجائي（サハーウィーの同時代人）、(2) その兄弟 سليمان بن يوسف الحسناوي（#AIND-D01404「عن سليمان بن يوسف الحسناوي」・#AIND-D09018・#AIND-D10015。本伝なし）、(3) #AIND-D05271「علي بن عبد الملك البجائي الحسناوي . مات سنة بضع وعشرين」（本項主（825没）と同時代）、(4) #AIND-D09017 の موسى بن إبراهيم الحسناوي・علي بن إبراهيم الحسناوي。同じ家（D04657 と سليمان）にも同じ呼び名がいるので特定しない。event の cert medium は「قال」の読み（情報源の発言か、本項主のニスバ説明か）の不確かさとして残す。ニスバの由来説明（بجاية・الجزيرة・بنو حسن）は event ではないので placeName を立てない（規則22(2)）。'
  phrase: قال الحسناوي نسبة لقبيلة بين بجاية والجزيرة تعرف ببني حسن
  mention: null
notes:
- text: 刊本の見出し「محمد بن علي بن كبا قال الحسناوي نسبة لقبيلة بين بجاية والجزيرة تعرف ببني حسن الفقيه المكي」は、本項主のニスバ الحسناوي を明示しないまま الحسناوي が「ニスバはバヌー・ハサン族に由来する」と説明する形になっている。説明されるニスバは本項主の الحسناوي と解し（الحسناوي の語が「يقال」の誤植、または本項主のニスバが脱落した可能性）、persName nisbah に الحسناوي を置いた。「المكي」はアルジェのカーディーとして没した人物のニスバとしては不審（المالكي の誤植の可能性）だが刊本どおり（規則25）。いずれも ISSUES §D162-8。
