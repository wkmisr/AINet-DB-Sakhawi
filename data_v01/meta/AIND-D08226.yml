translation:
  ja: ムハンマド・ブン・アリー・ブン・カバー。アル＝ハスナーウィーは言う、「（このニスバは）ビジャーヤとアル＝ジャズィーラの間にあるバヌー・ハサンとして知られる部族に由来する」。法学者、アル＝マッキー。825年、アルジェでそのカーディー在職中に没した。
  en: 'Muḥammad b. ʿAlī b. Kabā. Al-Ḥasnāwī said: [the nisba] refers to a tribe between Bijāya and al-Jazīra known as Banū Ḥasan. The jurist, al-Makkī. He died in al-Jazāʾir (Algiers) while holding its judgeship, in the year 825.'
