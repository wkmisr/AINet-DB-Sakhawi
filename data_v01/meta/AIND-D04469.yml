translation:
  ja: アブドゥッラー・ブン・アブドゥッラフマーン、アブー・ムハンマド、アッ＝シャニーニー・アル＝ヤマーニー。好ましい品性と満足すべき美質の持ち主で、しばらくの間学者たちの集会に通い続け、篤信・クルアーン読誦・礼拝勤行とともに有益な書物を集めた。ヒジュラ暦837年の末に、彼の町シャニーンでペストにより没した。彼の父はイエメンのナースィルのもとで指導的地位と威信を有していた。
  en: ʿAbd Allāh b. ʿAbd al-Raḥmān Abū Muḥammad al-Shanīnī al-Yamānī. A man of pleasing character and agreeable qualities, he attended the sessions of the scholars for a time and acquired useful books, along with piety, Qurʾān recitation and worship. He died of the plague at the end of the year 837 in his town, Shanīn. His father had held leadership and prestige with al-Nāṣir in Yemen.
