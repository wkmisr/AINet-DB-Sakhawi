translation:
  ja: アフマド・ブン・アブドゥッラー・ブン・ハラフ・ブン・アブー・バクル・ブン・ムハンマド・アル＝シハーブ・アル＝シャブラーウィー、後にアル＝カーヒリー（カイロ出身）、シャーフィイー派、シャラービシーヤのイマーム。796年ズルカアダ月に歴史家ナーシル・アッ＝ディーン・ブン・アル＝フラート（d.807）の許で『アッ＝シファー』の読み合わせを聴聞した。イブン・ファハドが彼（アフマド）から（学識を）取得し、彼（アフマド）はイジャーザを与えた。853年サファル月5日木曜日に亡くなり、ある者たちはラビーウ・アル＝アウワル月に亡くなったと記している。同日に埋葬された。
  en: Aḥmad b. ʿAbd Allāh b. Khalaf b. Abī Bakr b. Muḥammad, al-Shihāb al-Shabrāwī, then al-Qāhirī al-Shāfiʿī, Imām of al-Sharābishiyya. He heard the completion of 『al-Shifāʾ』 from the historian Nāṣir al-Dīn b. al-Furāt in Dhū al-Qaʿda, 796 H. Ibn Fahd acquired knowledge from him, and he (Aḥmad) granted ijāza. He died on Thursday, 5th of Ṣafar, 853 H, though some recorded his death in Rabīʿ al-Awwal of the same year. He was buried on the same day.
