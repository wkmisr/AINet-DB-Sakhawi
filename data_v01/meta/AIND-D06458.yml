translation:
  ja: ミスカール・アン＝ナースィリー・ブン・マンジャク。威信と莫大な財産を持った宦官であった。859年ズー・ル＝ヒッジャ月にダマスクスで没した。イブン・アッ＝ラッブーディーが没年を記録した。
  en: Mithqāl al-Nāṣirī [of al-Nāṣirī] b. Manjak. He was a eunuch of standing and vast wealth. He died in Dhū al-Ḥijja 859 in Damascus. Ibn al-Labbūdī recorded his death.
