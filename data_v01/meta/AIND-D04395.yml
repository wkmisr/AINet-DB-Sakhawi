- text: '「يأتي فيمن لم يسم أبوه」＝転送見出し。転送先は #AIND-D04664（عبد الله الجمال بن النحريري الحلبي قاضيها المالكي、没896）。ニスバ索引 D12076「جمال الدين عبد الله بن النحريري ويظهر لي أنه ولد أحمد الذي قبله」で閉合。サハーウィーが推定する父 أحمد بن عبد الله ＝ #AIND-D00935（الشهاب النحريري المالكي … ولي قضاء حماة ثم حلب、没840）の候補（REF のため relation は置かない）。'
