translation:
  ja: アブド・アッラー・ブン・アフマド・ブン・アブド・アッラー、アル＝ジャマール・アン＝ナフリーリー・アル＝マーリキー、ハラブのカーディーにしてそのカーディーの子。父の名が挙げられていない者たちの項で後述する。私（サハーウィー）は彼をアフマド・ブン・アブド・アッラーの子だと考える。
  en: ʿAbd Allāh b. Aḥmad b. ʿAbd Allāh, al-Jamāl al-Naḥrīrī al-Mālikī, qadi of Aleppo and son of its qadi. [His entry] follows among those whose father is not named; I think he is the son of Aḥmad b. ʿAbd Allāh.
