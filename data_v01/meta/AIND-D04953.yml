translation:
  ja: アリー・ブン・アフマド・ブン・イーナール、ヌールッディーン・ブン・アル＝ムアイヤド・ブン・アル＝アシュラフ。877年シャウワール月にアレクサンドリアで生まれた。父方の叔母の子であるムハンマド・ブン・バルドバクの娘と婚姻契約を結んだが、彼女は死去し、彼自身もペストに罹ったが回復した。897年の巡礼期に巡礼に赴こうと動き出したが、取りやめになった。
  en: ʿAlī b. Aḥmad b. Īnāl, Nūr al-Dīn b. al-Muʾayyad b. al-Ashraf. He was born in Shawwāl of the year 877 in Alexandria. He had contracted marriage with the daughter of Muḥammad b. Bardbak, his paternal aunt's son, but she died; he himself was struck by the plague and then recovered. He set about coming for the pilgrimage in the season of the year 897, but it came to nothing.
