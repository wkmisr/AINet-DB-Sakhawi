translation:
  ja: クトル・バク・ブン・スィッディーク・ブン・アリー・アル＝クーナウィー・アッ＝ルーミー。マッカの寄留者で商人の一人、前述のアブド・アッ＝ラフマーンの父、イブン・ハンマームの姻戚。イブン・ファハドが彼に言及している。没した（没年の記載なし）。
  en: Quṭlū Bak b. Ṣiddīq b. ʿAlī al-Qūnawī al-Rūmī. A resident (nazīl) of Mecca and one of the merchants, father of ʿAbd al-Raḥmān mentioned above, and related by marriage (ṣihr) to Ibn Ḥammām. Ibn Fahd mentioned him. He died (no date given).
