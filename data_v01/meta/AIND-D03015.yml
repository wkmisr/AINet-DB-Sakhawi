translation:
  ja: ルマイサ・ブン・アフマド・アル＝フザリー・アル＝マスウーディー。アル＝ハフィール（al-Khafīr）として知られる。彼は、ナフラ・アル＝ヤマーニッヤに属するサウラ（Sawla）に居住する、人々から善行、徳性、高い評価で知られた警備員（khufarāʾ）の有力者の一人であった。高齢によるわずかな知的衰えの後、819年のミナー（巡礼）の時期に没し、76歳かそれ以上でアル＝ムアッラーに埋葬された。アル＝ファースィーが彼について言及している。
  en: Rumaitha b. Aḥmad al-Hudhalī al-Masʿūdī, known as al-Khafīr. He was one of the prominent guards who resided in Sawla of Nakhla al-Yamāniyya, and was recognized for his goodness, virtue, and high standing among the people. He died during the days of Mina in the year 819 AH after some slight mental decline due to old age, and was buried in al-Muʿallā at the age of seventy-six or older. Mentioned by al-Fāsī.
