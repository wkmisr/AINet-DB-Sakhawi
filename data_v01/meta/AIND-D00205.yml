  ja: イブラーヒーム・ブン・ウマル・アッ＝リファーイー・ブン・イブラーヒーム・アル＝アʿラウィーは、ヒジュラ暦800年にイエメンで我らがシャイフ（イブン・ハジャル）に面会し、彼からアッ＝タヌーフィーによる『アル＝ミーア・アル＝アʿシャーリヤート』の一部を聴聞した。私は彼に関するこれ以上の情報を知り得ていない。
  en: Ibrāhīm b. ʿUmar al-Rifāʿī b. Ibrāhīm al-ʿAlawī met our shaykh (Ibn Ḥajar) in the year 800 H in Yemen, and heard from him some of al-Tanūkhī's *al-Mīʾa al-ʿAshāriyāt*. I have no further information about him.
