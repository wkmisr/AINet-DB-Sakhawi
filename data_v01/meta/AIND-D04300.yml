translation:
  ja: アブド・アッ＝ラティーフ・ブン・イブラーヒーム・ブン・ウマル・ブン・ハルファー、アル＝カマール・アル＝ミスリー。850年サファル月にジッダで没し、マッカに運ばれてそのムアッラー墓地に葬られた。イブン・ファフドがその没年を記録している。
  en: ʿAbd al-Laṭīf b. Ibrāhīm b. ʿUmar b. Ḥalfā, al-Kamāl al-Miṣrī. He died in Ṣafar of the year 850 at Jidda and was carried to Mecca, where he was buried in its Muʿallā cemetery. Ibn Fahd recorded his death.
