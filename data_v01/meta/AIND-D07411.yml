notes:
- text: '転送見出し（原文末尾「هو المحب بن علي بن سالم يأتي」による）。転送先は #AIND-D08077「محمد بن علي بن سالم بن معالي المحب أبو الفضل بن نور الدين المارديني الاصل القاهري الشافعي نزيل دمشق … ويعرف كهو بابن سالم」（835年生、ダマスクス寄寓。「المحب」「بن علي بن سالم」「دمشق」が一致）。「محمد بن سالم」は祖父への帰属（نسب لجده）。'
