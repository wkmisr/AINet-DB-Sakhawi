  note:
    ja: '「وابن صاحب الخال بالمعجمة」＝父は「صاحب الخال」（خ の点つき＝黒子の持ち主）。父の本伝＝#AIND-D10851「أبو بكر بن محمد بن عيسى الزيلعي صاحب اللحية . مات سنة تسع وعشرين」（クンヤ部、未受領）＝見出しナサブ一致（規則37）。D04238（عبد الكبير بن عبد الله الزيلعي）本文の「أبو بكر بن محمد الزيلعي صاحب الخال بالمعجمة」も父を صاحب الخال と呼ぶ。ただし D10851 の見出しは父を「صاحب اللحية」とし、本項の「صاحب اللحية＝本項主／صاحب الخال＝父」と通称の配分が食い違う（規則25＝原文どおり保持し note に記録）。初版の #NEEDID「صاحب الخال」を解消。'
- id: r2
  type: kin
  subtype: son
  active: AIND-D10824
  passive: AIND-D07249
  quote: null
  note:
    ja: '本項には言及なし。クンヤ部 #AIND-D10824「أبو بكر بن محمد المقبول بن أبي بكر بن محمد بن عيسى العقيلي الزيلعي الماضي أبوه . كان رجلا صالحا . مات سنة تسع وسبعين」の見出しナサブ（父 محمد المقبول بن أبي بكر بن محمد بن عيسى）と「الماضي أبوه」が本項主に閉合（規則37）。'
translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ムハンマド・ブン・イーサー、善良なシャイフ、アッ＝ザイライー・アル＝ウカイリー、「髭の持ち主（サーヒブ・アッ＝リフヤ）」であり、「黒子の持ち主（サーヒブ・アル＝ハール、ハーは点つき）」の息子。アル＝マクブールとして知られる。善良で敬虔な人であった。855年に没した。
  en: Muḥammad b. Abī Bakr b. Muḥammad b. ʿĪsā, the righteous shaykh, al-Zaylaʿī al-ʿUqaylī, "the one with the beard" (ṣāḥib al-liḥya) and son of "the one with the mole" (ṣāḥib al-khāl, with the dotted khāʾ), known as al-Maqbūl. He was a good and righteous man. He died in the year 855.
