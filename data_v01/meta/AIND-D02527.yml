translation:
  ja: アル＝ハサン・ブン・イスマーイール。ラカブはアル＝バドル。ニスバはアル＝バンビー、後にカイロの人。シャーフィイー派。後述するアル＝バドル・ムハンマドの父。彼はアッ＝シラージュ・アル＝ブルキーニーのもとでその著作の一部を朗読した。アッ＝シラージュは彼を「有徳の学者」と評し、彼が提示する事柄について考究し優れていたと述べ、彼にイジャーザを与えた。そのことを774年サファル月と日付を記した。また彼はアル＝バドル・ブン・アル＝アマーナの姉妹を娶ってその姻戚となった。彼の死は801年より後である。息子の誕生がその年であり、しかもその息子は父をはっきり覚えていないほど（幼くして死別した）だからである。
  en: Al-Ḥasan b. Ismāʿīl, al-Badr, al-Banbī then al-Qāhirī, al-Shāfiʿī, father of al-Badr Muḥammad (mentioned below). He read some of al-Sirāj al-Bulqīnī's own works under him; al-Sirāj described him as a virtuous and learned scholar, stated that he investigated and excelled in what he presented, granted him an ijāza, and dated this in Ṣafar 774 H. He became the brother-in-law of al-Badr b. al-Amāna by marrying his sister. His death occurred after the year [8]01, since his son was born in that year and yet did not know him distinctly (he died while the son was an infant).
