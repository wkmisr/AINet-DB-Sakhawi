translation:
  ja: アブドゥル＝カーディル・ブン・アフマド・ブン・アビー・アル＝ファドル・ムハンマド・ブン・アブドゥッラー。ムヒイー・アッ＝ディーン。ハラーズ（イエメン）をルーツとするマッカ（メッカ）の人。のちに彼の兄弟であるアル＝ジャマール・ムハンマドの伝記がある。マッカ（同地）にて、ヒジュラ暦885年ズー・アル＝ヒッジャ月23日（金曜日の夜）に死去した。夜明け後にカアバ神殿の門（バーブ・アル＝カアバ）のそばで葬儀礼拝が行われ、アル＝マアラー墓地にある彼の家族の墓の近くに埋葬された。彼は祝福された（篤信の）人物で、禁欲的かつ貧しく、貧者に対しては多少頑固な態度を取ることもあったが、困窮している特定の世帯を気にかける優しい一面もあった。
  en: Abd al-Qadir b. Ahmad b. Abi al-Fadl Muhammad b. Abd Allah, Muhyi al-Din. Of Harazi origin and a resident of Mecca. His brother al-Jamal Muhammad is forthcoming. He died in Mecca on the night of Friday, the 23rd of Dhu al-Hijja, in the year 885 AH. The funeral prayer was performed after dawn at the Gate of the Kaaba, and he was buried with his family in al-Mu'alla. He was a blessed, ascetic, and poor man who sometimes treated the poor strictly, though he still looked after some of their households.
