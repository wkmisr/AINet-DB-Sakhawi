notes:
- text: 各地のカーディー職を務めたが、その評判は芳しいものではなかったと伝えられる。
  lang: ja
  type: personalia
- text: He held judgeships in places such as al-Ramla, Ḥamā, Ṭarābulus, Ghazza and Ḥalab, but his conduct in them was not praised, especially in Aleppo. In sum, he was noted neither for learning nor for religion but was described with the opposite of both, together with malice of intent, a contemptible bearing, and open bribe-taking.
  lang: en
  type: personalia
translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・アフマド・ブン・ラジャブ、シャハーブ・アッ＝ディーン・アル＝ビカーイー、次いでアッ＝ディマシュキー、アッ＝シャーフィイー、アル＝アアラジュ（跛者）、カーディー・タージュ・アッ＝ディーンの姉妹の息子、そして父親は前述の人物である。彼（伝記対象者）はイブン・アッ＝ズフリとして知られる。彼はヒジュラ暦806年ラビーウ・アッ＝サーニー月17日の金曜日にアル＝ビカー・アル＝アズィーズィーで生まれた。彼は父親に伴ってダマスクスに移り、そこで育った。彼はクルアーンとシャアバーン・アル＝アーサーリーによる二つの法学要綱（分派と主要）を暗記し、アッ＝シャムス・アル＝カフィーリーやアル＝ルービヤーニーなど数人の学者にそれらを提示した。彼はシャラフ・サダカ・ブン・サラーマ・アッ＝ダリール、ザイン・ブン・アッ＝ラッバーン、そしてアブド・アル＝ムフシン・アッ＝ニーニーからクルアーンを朗誦で学んだ。彼は母方の叔父のタージュやブルハーン・ブン・ハティーブ・アズラー、またダマスクス滞在中のアッ＝シャムス・アル＝ビルマーウィーから法学を、アッ＝シャムス・アル＝バスラウィーからアラビア語学を、そしてシャラフ・ブン・ムフリフから法学原理を学んだ。彼は父親と共にサファドにしばらく居住した後、カイロへ旅立ち、そこでアル＝ワースィティー、アッ＝ザイン・アッ＝ザルカシー、アル＝クルーターティー、アル＝アラー・ブン・バルダス、イブン・ナーズィル・アッ＝サーヒバなどから聴聞した。彼はそこで一時バーシティヤ・ハーンカーのスーフィー共同体に加わり、ガルス・ハリーフ・アッ＝サハーウィーのもとで『サヒーフ・アル＝ブハーリー』を読んだ。彼はカイロでアル＝ハラウィーに代わってカーディー代理を務め、その後我らがシャイフ（イブン・ハジャル）に代わって務め、さらにサファドでは父親に代わって務めた後、父親の死後には独立して同地のカーディーとなり、幾度も解任された。同様に、ラマラ、ハマー、タラーブルス、ガザ、アレッポといった各地でカーディーの職務に就いたが、アレッポでは特にその行状は褒められたものではなかった。私が彼がアレッポでカーディーであった時にその地にいた際、現地の名士や一般の人々から彼の評価について驚くべき話を聞いた。彼は一部の有力者の助力により、イブン・アッ＝シャフナの家の一部を破壊する決定を下した。ヒジュラ暦847年ズー・アル＝ヒッジャ月には、アッ＝サラーフ・アッ＝タラーブルスィー・アル＝ハナフィーが彼の暗記したものを彼に提示し、その時彼は彼らのカーディーだったと思われる。要するに、彼は知識や信仰で評価されることはなく、むしろそれらの正反対の性質、すなわち悪意、外見の軽蔑、賄賂の公然たる受領、そして大胆さで形容された人物であった。彼の晩年は、捨てられ、顧みられず、死ぬまで放浪する結果となった。彼はヒジュラ暦878年ラビーウ・アル＝アーヒル月に亡くなり、アル＝アミーン・アル＝アクサライーが葬儀の祈りを執り行い、彼の遺言は彼と書記長の代理であるアッ＝ヌーリー・アル＝アンバービー（彼の隣人であった）に託された。彼は年老いた母親を残したが、息子も妻も残さなかった。アッラーが彼と我らを赦されんことを。
  en: Aḥmad b. Ibrāhīm b. Aḥmad b. Rajab, Shihāb al-Dīn al-Biqāʿī, then al-Dimashqī, al-Shāfiʿī, al-Aʿraj, nephew of al-Qāḍī Tāj al-Dīn, whose father was previously mentioned. He was known as Ibn al-Zuhrī. He was born on Friday, the seventeenth of Rabīʿ al-Thānī in the year 806 AH, in al-Biqāʿ al-ʿAzīzī. He moved with his father to Damascus and grew up there. He memorized the Qurʾān and the two Minhāj works (al-Farʿī and al-Aṣlī) by Shaʿbān al-Athārī, and presented them to al-Shams al-Kafīrī, al-Lūbiyānī, and others. He recited the Qurʾān to al-Sharaf Ṣadaqa b. Salāma al-Ḍarīrī, al-Zayn b. al-Labbān, and ʿAbd al-Muḥsin al-Nīnī. He studied fiqh under his maternal uncle al-Tāj and al-Burhān b. Khaṭīb ʿAdhrāʾ, as well as under al-Shams al-Birmāwī during his residence in Damascus. He studied Arabic language with al-Shams al-Baṣrawī and uṣūl (legal theory) with al-Sharaf b. Mufliḥ. He resided in Ṣafad with his father for a period, then traveled to Cairo, where he listened to al-Wāsiṭī, al-Zayn
    al-Zarkashī, al-Kalūtātī, al-ʿAlāʾ b. Bardas, Ibn Nāẓir al-Ṣāḥiba, and others. He stayed for a time in the Sufi community of al-Bāsiṭiyya there. He read al-Bukhārī under al-Ghars Khalīl al-Sakhāwī and served as deputy Qāḍī in Cairo for al-Harawī, then for our shaykh (Ibn Ḥajar), and then in Ṣafad for his father. After his father's death, he became the independent Qāḍī there and was dismissed several times. He also served as Qāḍī in various places such as al-Ramla, Ḥamā, Ṭarābulus, Ghazza, and Ḥalab, but his conduct was not praised in these places, especially in Aleppo. I was there when he was Qāḍī, and I heard many strange things describing him from the dignitaries and common people alike. He ordered the demolition of part of Ibn al-Shaḥḥna's house with the assistance of some notables. Al-Ṣalāḥ al-Ṭarābulusī al-Ḥanafī presented his memorized works to him in Dhū al-Ḥijja 847, and I believe he was their Qāḍī at that time. In short, he was not mentioned for knowledge or piety; rather, he
    was described with their opposites, along with malice, contemptible appearance, open bribery, and impudence. His affairs deteriorated until he became neglected and forgotten, wandering on foot until he died in Rabīʿ al-Ākhir 878 AH. Al-Amīn al-Aqṣarāʾī led his funeral prayer and was entrusted with his will, along with al-Nūrī al-Inbābī, the deputy kātib al-sirr and his neighbor. He left behind an aged mother but no son or wife. May God forgive him and us.
