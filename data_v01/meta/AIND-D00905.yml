  en: Aḥmad b. ʿAbd Allāh b. ʿUmar al-Sirsī, then al-Qāhirī, of the Mālikī school, a resident of al-Ṣaḥrāʾ. He was among those who continuously adhered to me (al-Sakhāwī) in transmission and understanding, and he engaged in scholarly pursuits for a short while, then earned his living by teaching due to his poverty and necessity.
