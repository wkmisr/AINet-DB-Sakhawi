translation:
  ja: アリー・ブン・アブー・バクル、ヌール・アッ＝ディーン、アッ＝ダイミー、のちにアル＝カーヒリー、アッ＝サフラーウィー。ラジャブ月の巡礼団（ラジャビーヤ）とともにハッジを行い、巡礼団長（アミール・アッ＝ラクブ）アッラーンのイマームを務めた。預言者の町マディーナを参詣してマッカに到着した後、871年ズー・アル＝カアダ月に同地（マッカ）で没した。アッラーの慈悲あれ。
  en: ʿAlī b. Abī Bakr, Nūr al-Dīn, al-Daymī, then al-Qāhirī, al-Ṣaḥrāwī. He performed the pilgrimage with the Rajab caravan (al-Rajabiyya) and served as the imam of the caravan commander (amīr al-rakb) ʿAllān. He died there (in Mecca) in Dhū al-Qaʿda 871 AH, after visiting the Prophet's City (Medina) and arriving in Mecca. May God have mercy on him.
