translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・シャウアーン・アッ＝ザビーディー、ハナフィー派。彼の町において自派（ハナフィー派）の首位は彼に帰し、教授して人々を益した。（8）22年に没した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Muḥammad b. ʿAbd Allāh b. Shawʿān al-Zabīdī, the Ḥanafī. Leadership of his school in his town came to rest with him; he taught and benefited others. He died in (8)22. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
