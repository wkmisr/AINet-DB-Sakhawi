translation:
  ja: アフマド・ブン・ムハンマド・ブン・アフマド・ブン・アブド・アル＝ムフシン・アッ＝サブキー・アル＝ヒムスィー・アッ＝シャーフィイー。我らがシャイフの子（イブン・ハジャルの子ムハンマド）らに、イブン・ムーサー・アル＝マッラークィーの報告に基づきイジャーザを与えたが、その正しい名は『リフラ・イブン・ムーサー』によればムハンマド・ブン・ムハンマドである。
  en: Aḥmad b. Muḥammad b. Aḥmad b. ʿAbd al-Muḥsin al-Subkī al-Ḥimṣī al-Shāfiʿī. He granted ijāza to Ibn Shaykhinā (Ibn Ḥajar's son Muḥammad) and others, based on the report of Ibn Mūsā al-Marrākushī, though its correct name, as stated in the *Riḥlat Ibn Mūsā*, is Muḥammad b. Muḥammad.
