translation:
  ja: アフマド・イブン・ムハンマド・シャハーブ・アッ＝ディーン・イブン・ナーシル・アッ＝ディーン・アル＝ジャマーリー、アル＝ジャマール・アル＝ウスターダールの姉妹の孫。彼の父は人柄が良く、弁舌に優れ、高潔であり、逸話や詩、有益な知識を暗記していた。息子はアル＝マンジラにあるムンヤト・クダイルの地で彼の生計を引き継いだ。彼は財産を管理し、バヌー・アル＝ジーアーン家と縁組した。
  en: Aḥmad ibn Muḥammad Shihāb al-Dīn ibn Nāṣir al-Dīn al-Jamālī, grandson of al-Jamāl al-Ustādār's sister. His father was of good character, eloquent, and noble, memorizing anecdotes, poems, and beneficial knowledge. His son succeeded him in his livelihood in Munyat Khuḍayr from al-Manzila. He managed his assets and intermarried with Banū al-Jīʿān.
