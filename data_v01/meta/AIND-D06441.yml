    ja: '規則3・37。父＝corpus 本伝 #AIND-D01650「أحمد بن مفتاح الشهاب المكي ويعرف بالقفيلي نسبة لمكان شهير من أعمال حل بن يعقوب كان أبوه عند أمير مكة ثقبة بن رميثة الحسني … مات في العشر الأول من ذي الحجة قبل عرفة سنة تسع عشرة . قاله الفاسي في مكة」（819没、repo 未収録）。見出しナサブ「أحمد بن مفتاح」＋ニスバ القفيلي の2点で閉合（規則57）。初版は father relation なし。'
