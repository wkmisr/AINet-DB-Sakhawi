translation:
  ja: ムーサー・ブン・ムハンマド・ブン・ユースフ、アッ＝シャラフ・アル＝マフズーミー、スルターンの兵舎（ティバーク）で取引を営む者。892年の巡礼期に巡礼し、その後2年間滞在（ジャーワラ）した。一団とともに私（サハーウィー）から聴聞し、またイブン・ジャルバーシュとともにイブン・アッ＝シャワーイティーから聴聞した。タワーフと施しと説教の集会への出席を多く行い、その同業の人々と比べれば概して善く語られている。
  en: Mūsā b. Muḥammad b. Yūsuf, al-Sharaf al-Makhzūmī, the dealer (muʿāmil) at the sultan's barracks (al-ṭibāq al-sulṭāniyya). He performed the pilgrimage in the season of the year [8]92 and stayed on (jāwara) for two years after it. He heard, together with the group, from me (al-Sakhāwī), and together with Ibn Jarbāsh from Ibn al-Shawāʾiṭī. He performed the circumambulation and gave alms frequently and attended the preaching sessions, and on the whole he is spoken of well, relative to his class of people.
