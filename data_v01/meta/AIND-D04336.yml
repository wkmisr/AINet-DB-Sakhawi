translation:
  ja: アブド・アッ＝ラティーフ・ブン・ムハンマド・ブン・アフマド・ブン・イスマーイール・ブン・ダーウード、アル＝バドル・ブン・アッ＝シャムス・ブン・アッ＝シハーブ・アル＝カーヒリー。後述のアブド・アッラーの兄弟で、イブン・アッ＝ルーミーとして知られる。マーリキー派カーディーのアル＝バドル・イブン・アッ＝タナスィーのもとでナキーブ職を務めた者の一人。（書記の）技能に秀でていたが、私が彼の証人資格の登録（アスジャール）で見た限り悪筆であった。私（サハーウィー）の母方の叔父である。
  en: ʿAbd al-Laṭīf b. Muḥammad b. Aḥmad b. Ismāʿīl b. Dāwūd, al-Badr b. al-Shams b. al-Shihāb al-Qāhirī, brother of ʿAbd Allāh (mentioned below), known as Ibn al-Rūmī. He was among those who exercised the office of naqīb under al-Badr Ibn al-Tanasī, the Mālikī judge; he was distinguished in the craft (of the notary), though of weak handwriting, as I saw in the registers of his attestation. He is my maternal uncle.
