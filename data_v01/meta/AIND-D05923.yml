translation:
  ja: ウマル・ブン・アビー・アル＝カースィム・ブン・ムアイビド、カーディー・タキー・アッ＝ディーン、アル＝ヤマニー・アッ＝タイッズィー。アル＝アフィーフ・ウスマーン・アン＝ナーシリーが話の途中で彼に言及し、「彼は名高い徳と豊かな文才の人で、私がタイッズで彼のもとに到った際、私の叔父に私の講義を称える手紙を書いた。そこで私は彼にこう書き送った。『存在と沈黙がその本性であるものが、ウスマーンはウマルに比べてどこにいようか、と言うのを見ないのか。友よ、その幽かさにおいてスハー星は、輝くヴィーナスと太陽と月に比べてどこにいようか。』」と述べた。彼（ナーシリー）はさらに言う。「私は（8）28年にザビードで彼に会い、彼は我らがシャイフ・イブン・アル＝ジャザリーの師たちについての韻文を私のために手に入れてくれた。彼はザーヒル朝において宰相を務め、それでいて礼拝修行に骨身を削り、服従行為を怠らなかった。（8）37年末にタイッズの町で没し、私はその埋葬に立ち会った。」以上。思うに彼は後述のウマル・ブン・ムハンマド・ブン・ムアイビドの父方の従兄弟である。
  en: 'ʿUmar b. Abī al-Qāsim b. Muʿaybid, the qāḍī Taqī al-Dīn al-Yamanī al-Taʿizzī. Al-ʿAfīf ʿUthmān al-Nāshirī mentioned him in the course of a discussion and said that he was a man of celebrated merit and abundant literary culture: "He wrote to my uncle praising my lessons when I came to him at Taʿizz, so I wrote to him: ''Do you not see that existence, whose nature is silence, says: where is ʿUthmān beside ʿUmar? And where, my friend, is al-Suhā in its faintness beside the radiant Venus, the sun and the moon?''" He (al-Nāshirī) said: "I had met him in the year (8)28 at Zabīd, and he obtained for me a versified work on the teachers of our shaykh Ibn al-Jazarī. He served as vizier under the Ẓāhirī regime, and withal he toiled in acts of worship and never slackened in acts of obedience. He died in the city of Taʿizz at the end of the year (8)37, and I attended his burial." End of quotation. I think he is the paternal cousin of ʿUmar b. Muḥammad b. Muʿaybid, mentioned below.'
