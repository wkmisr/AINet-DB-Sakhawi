translation:
  ja: ムハンマド・ブン・アフマド・ブン・ユースフ、アル＝ムアッリム・シュカイル・アル＝フィーシー、仕立屋。740年に生まれ、その技において卓越し、仕立屋たちに〔新たな〕技法を提案するほどであった。あわせて学問とその徒を愛した。826年の末に没した。アル＝マクリーズィーが『ウクード』で彼に言及し、彼が彼〔マクリーズィー〕に口述した、その霊験が知られた祈願文を彼から収録し、そのほかにも彼から伝え、彼から書き留めたものの一部に813年、ダマスクスにてと日付を記している。
  en: Muḥammad b. Aḥmad b. Yūsuf, al-Muʿallim Shuqayr al-Fīshī, the tailor. He was born in the year 740 and excelled in his craft to the point that he would propose [new] techniques to the tailors, together with a love for learning and its people. He died in the last part of the year 826. Al-Maqrīzī mentioned him in his ʿUqūd, cited from him a supplication which he had dictated to him and whose blessing was known, transmitted other things from him, and dated some of what he wrote down from him to the year 813, in Damascus.
