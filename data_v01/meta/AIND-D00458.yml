translation:
  ja: アハマド・ブン・イブラーヒーム・ブン・ムハンマドは、出自はヤマン人でルーム人でありブルサ人であったが、その後カイロ人となった。シャイフーニーヤに定住し、イブン・アラブとして知られる。祖父がムハンマド・ブン・アブドゥッラー・ブン・アラブである人物の伝記のところで述べられた（人物）。
  en: Aḥmad b. Ibrāhīm b. Muḥammad, originally from Yemen, then from Rūm (Anatolia) and Bursa, then a resident of Cairo, settled in al-Shaykhūniyya, and was known as Ibn ʿArab. He is mentioned in the biography of those whose grandfather was Muḥammad b. ʿAbd Allāh b. ʿArab.
