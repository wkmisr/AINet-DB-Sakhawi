translation:
  ja: アハマド・ブン・サーリフ・ブン・アハマド・ブン・ムハンマド・ブン・ムーサー、シャハーブ、アブー・アル＝アッバース、アル＝ハサニー、ホウラーン族出身のラージヒー、そしてラージヒはイッブの間で約二日ほどのところにあり、アル＝ヤマニー、シャーフィイー派。私はメッカに滞在していた894年に、彼が持っていた『アル＝ミンハージ』の写本に対してイジャーザを与えた。彼は祝福されたシャイフである。
  en: Aḥmad b. Ṣāliḥ b. Aḥmad b. Muḥammad b. Mūsā, al-Shihāb Abū al-ʿAbbās, al-Ḥasanī, al-Rāzḥī (from the tribe of Khawlān, and Raziḥ is about two days' journey between it and Ibb), al-Yamānī, al-Shāfiʿī. I granted him an ijāza in the year 894 H while I was in Mecca, for a copy of al-Minhāj that he possessed. He was a blessed shaykh.
