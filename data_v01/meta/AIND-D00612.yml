notes:
- text: 本項は AIND-D02531（الحسن بن أبي بكر بن محمد بن عثمان بن أحمد بن عمر بن سلامة البدر أبو محمد المارديني ثم الحلبي الحنفي، ويعرف بابن سلامة）と同一人物。著者サハーウィーが本項本文で「ولد سنة سبعين هكذا رأيته بخطى في الأحمدين وهو غلط صوابه الحسن」と、アフマドの部に誤って立項したことを自認し、正しくはハサンの部で扱うと明記している。生年（770年）・名の連鎖・ニスバ（المارديني ثم الحلبي الحنفي）・兄弟（البدر محمد = AIND-D07243）がすべて D02531 と一致。本体 D02531 に統合。
