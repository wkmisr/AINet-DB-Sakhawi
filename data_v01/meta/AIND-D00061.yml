translation:
  ja: イブラーヒーム・ブン・イスマーイール・ブン・イブラーヒーム・アル＝バドル・アル＝マクディスィー・アル＝ナーブルスィー・アル＝ハンバリー。判事補(ナーイブ)を務め、判例の引用に精通し、遺産相続法(ファラーイド)に習熟していた。その生涯は称賛されている。903年ラマダーン月に没した。60歳に近かった。我々の師(イブン・ハジャル)がその年代記(『インバー・アル＝グムル』)に記している。
  en: Ibrāhīm b. Ismāʿīl b. Ibrāhīm al-Badr al-Maqdisī al-Nābulusī al-Ḥanbalī. He used to act as a deputy judge (nāʾib), was well-versed in recalling legal precedents, and was proficient in the laws of inheritance (farāʾiḍ). His life conduct was praiseworthy. He died in Ramaḍān in the year 903, having nearly reached sixty. Our Shaykh (Ibn Ḥajar) recorded his biography in his chronicle (Inbāʾ al-Ghumr).
