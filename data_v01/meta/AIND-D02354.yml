translation:
  ja: ジャンバク・アッ＝サウル・アッ＝サイフィー。彼はメッカのトルコ人アミール（司令官）であり、ジェッダの副知事を務め、一時期はアレクサンドリアの副知事でもあった。また、タブルハーナー（軍楽隊）の一員であり、第二ハージブ（侍従）でもあった。841年シャアバーンにメッカで死去した。イブン・ファハドらが彼について記録しており、アル＝マクリージーは「彼が（世を去って）人々は安堵した（厄介払いだ）」と述べた。
  en: Janbak al-Thawr al-Sayfī was an amir of the Turks in Mecca, and he also served as deputy of Jeddah and for a time as deputy in Alexandria. He was also one of the ṭablkhānāh (military band) and the second chamberlain. He died in Mecca in Shaʿbān 841 H. Ibn Fahd and others chronicled him, and al-Maqrīzī commented, 'Good riddance to him.'
