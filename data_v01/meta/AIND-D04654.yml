translation:
  ja: アブドゥッラー・ブン・ナジーブ・ブン・アブドゥッラー、アッ＝シャラフ・アル＝ハラビー。同地（ハラブ）の軍務監督官（ナーズィル・アル＝ジャイシュ）で、イブン・アン＝ナジーブとして知られる。善良で信仰篤く、理性的で物静か、大柄で長たる風格があり、貧者と義人を愛する人であった。〔8〕03年にカルアト・アッ＝ルームで没した。イブン・ハティーブ・アン＝ナースィリーヤが彼について詳しく記し、我らが師（イブン・ハジャル）もその『インバー』でそれに従った。
  en: ʿAbd Allāh b. Najīb b. ʿAbd Allāh, al-Sharaf al-Ḥalabī, the army inspector (nāẓir al-jaysh) there [in Aleppo], known as Ibn al-Najīb. He was a good, pious, sensible and calm man, a stout man of leading stature, who loved the poor and the righteous. He died in Qalʿat al-Rūm in the year [8]03. Ibn Khaṭīb al-Nāṣiriyya mentioned him at length, and our shaykh [Ibn Ḥajar] followed him in his Inbāʾ.
