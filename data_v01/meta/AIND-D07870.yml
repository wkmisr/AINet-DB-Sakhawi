notes:
- text: 「المذكور بالشرف وهو بكنيته أشهر」の الشرف はラカブ（شرف الدين の略）ではなく、シャリーフ身分（sharaf）を称されていたことを言う。後文「لا ينشرح صدري للبس شظفة الشرف ، لتوقفه في ذلك」（シャラフの印を身につけることに心が晴れない、それについて躊躇していたので）と対になる身分の言及で、身分の主張には本人の躊躇がある＝affiliation にしない。初版以来の persName type="laqab"「الشرف」を除去し、訳を改めた（集約 2026-10-31、内容A M、オーケストレーター決定13）。
  lang: ja
