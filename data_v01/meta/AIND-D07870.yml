translation:
  ja: ムハンマド・ブン・アブドゥッラー、アブー・アル＝ハイル・アル＝アルミユーニー、のちアル＝カーヒリー、マーリク派。シャラフ（シャリーフの家系）を称されていたが、クンヤ（アブー・アル＝ハイル）の方で有名である。アルミユーンはガルビーヤ地方にある。クルアーンを暗記し、法学・文法学・二原理学（法学原理論と神学）に従事し、文法学に秀で、その他の分野にも通じた。彼の師にはアル＝サンフーリー、アル＝シュムンニー、アル＝ヒスニー（彼に密着して師事した）、アル＝アラー・アル＝ヒスニー、盲目のムハンマド・アル＝タンタダーイーがいる。871年に没したが、30歳に達していなかった。善良な人であった。彼が「シャラフ（の身分を示す）印を身につけることに私の心は晴れない」と言っていたと、私に伝わっている。それ（シャリーフの身分）について彼が躊躇していたからである。神が彼を慈しまれんことを。
  en: Muḥammad b. ʿAbd Allāh, Abū al-Khayr al-Armiyūnī, then al-Qāhirī, the Mālikī. He was said to have sharaf (sharīfian descent), but he was better known by his kunya. Armiyūn is in al-Gharbiyya. He memorized the Qurʾān and occupied himself with jurisprudence, grammar and the two principles (uṣūl al-fiqh and theology); he excelled in grammar and had a share in the other fields. Among his teachers were al-Sanhūrī, al-Shumunnī, al-Ḥiṣnī (to whom he attached himself closely), al-ʿAlāʾ al-Ḥiṣnī, and the blind Muḥammad al-Ṭanatadāʾī. He died in [8]71 before reaching thirty. He was a good man, and it reached me that he used to say, "My heart does not feel at ease in wearing the badge of sharaf (sharīf status)," because of his hesitation about it. May God have mercy on him.
