translation:
  ja: ジャンバク・アッ＝スーフィー・アッ＝ザーヒリー・バルクークはムカッダム（軍事指揮官）の一人で、あの数々の事件と戦争の当事者であった。彼はアレクサンドリアの監獄から脱走し、スルターンはその捜索に疲れ果てた。彼のせいで多くの人々が試練を受け、ついにイブン・ドゥルガーディルのもとで現れた。彼は841年のラビーウ・アル=アーヒル月半ばに亡くなった。彼の殺害の原因については諸説ある。アル＝マクリージーが述べたところによれば、彼は不公正で暴力的、横暴な人物であり、信仰も寛大さも持ち合わせていなかったという。
  en: Jānbak al-Ṣūfī al-Ẓāhirī Barqūq was one of the muqaddams (military commanders) and the man of those well-known incidents and wars. He escaped from his prison in Alexandria, exhausting the Sultan in his pursuit. Many people were tested because of him, until he appeared with Ibn Dulghādir. He died in mid-Rabīʿ al-Ākhir in the year 841 H. The cause of his death is disputed. According to al-Maqrīzī, he was an unjust, violent, and tyrannical individual, known neither for piety nor generosity.
