translation:
  ja: アリー・ブン・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・イマード、ヌール・アッ＝ディーン、ダマンフール出自のアル＝マッキー、彼も父も薬種商。アブド・アル＝アズィーズ・ブン・アリー・アッ＝ダクーキーの娘を娶って姻戚となり、彼女との間にムハンマドをもうけた。872年シャウワール月にマッカで没した。イブン・ファハドがその没年を記録した。
  en: ʿAlī b. Muḥammad b. Aḥmad b. Muḥammad b. ʿImād, Nūr al-Dīn, of Damanhūrī origin, al-Makkī, the perfumer (ʿaṭṭār), as was his father. He became the son-in-law of ʿAbd al-ʿAzīz b. ʿAlī al-Daqūqī by marrying his daughter, and had by her a son, Muḥammad. He died in Mecca in Shawwāl of the year 872. Ibn Fahd recorded his death date.
