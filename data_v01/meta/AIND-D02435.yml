translation:
  ja: ジュルバーン・ブン・アビー・スワイド・ブン・アビー・ドゥアイジュ・ブン・アビー・ヌマイ、アル＝ハサニー・アル＝マッキー。822年には存命であった。イブン・ムクビル・ブン・ワフバが、マッカへ向かう途上の彼を迎え撃ち、夜間に剣で斬りつけたが、ジュルバーンのために彼の一族が奮起した（彼を守った）。以上はイブン・ファハドが述べたことである。
  en: Julbān b. Abī Suwayd b. Abī Duʿayj b. Abī Numayy al-Ḥasanī al-Makkī. He was alive in the year 822 H. Ibn Muqbil b. Wahba met him and struck him at night with a sword while he was on his way to Mecca, whereupon his people rose up in Julbān's defence. This was stated by Ibn Fahd.
