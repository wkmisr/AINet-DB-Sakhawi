translation:
  ja: ウマル・ブン・ユースフ・アル＝バーリスィー、ムアッズィン。我らがシャイフ（イブン・ハジャル）は『インバー』で次のように述べている。「ハディースに取り組んでそれに熟達し、善性と信仰心とともに多くを聴聞した。」（8）01年ズー・アル＝カアダ月の末、マッカへ向かう途中、ワーディー・アッ＝サフラーで没した。
  en: 'ʿUmar b. Yūsuf al-Bālisī, the muezzin. Our shaykh (Ibn Ḥajar) said in his Inbāʾ: "He occupied himself with ḥadīth and excelled in it, and heard a great deal, together with goodness and piety." He died at Wādī al-Ṣafrāʾ while on his way to Mecca, at the end of Dhū al-Qaʿda of the year (8)01.'
