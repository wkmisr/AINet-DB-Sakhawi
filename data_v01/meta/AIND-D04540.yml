translation:
  ja: アブドゥッラー・ブン・クズル、アル＝ジャマール、ダシュトを本貫とするアル＝カーヒリー。イブン・アル＝ファーリドの『ターイーヤ』を、イブン・バクタムル・アッ＝サーキーとして知られるアッ＝シハーブ・アフマド・ブン・アリー・ブン・クルターイから聴聞により伝えている。アル＝イッズ・ブン・ファハドが870年の少し後に彼と会い、彼から書き留めた。
  en: ʿAbd Allāh b. Kuzul, al-Jamāl, of Dashtī origin, al-Qāhirī. He transmits the Tāʾiyya of Ibn al-Fāriḍ from al-Shihāb Aḥmad b. ʿAlī b. Qurṭāy, known as Ibn Baktamur al-Sāqī, by audition. Al-ʿIzz b. Fahd met him shortly after 870 and wrote down (material) from him.
