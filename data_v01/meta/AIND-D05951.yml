translation:
  ja: ウマル・ブン・ムハンマド・ブン・サイード、アッ＝ザイン、アル＝バアリー、ハンバリー派、綿商（カッターン）。イブン・アル＝バクスマーティーとして知られる。788年にバアルバックで生まれ、そこで育った。タルハ・アル＝アンバリーのもとでクルアーンを読み、『アル＝ヒラキー』（の要約書）を暗記してイブン・アル＝アクラブおよびアッ＝タキー・イブラーヒーム・ブン・ムフリフらに提示し、前者（イブン・アル＝アクラブ）のもとで法学を学んだ。アブー・アル＝ファラジュ・アブドゥッラフマーン・ブン・ムハンマド・ブン・アッ＝ザアブーブのもとで『サヒーフ』の結び（読了部分）を聴聞し、それを伝えた。私はバアルバックで彼にそれを読誦した。善良な人で、そこで綿を売って生計を立てていた。没した。
  en: ʿUmar b. Muḥammad b. Saʿīd, al-Zayn al-Baʿlī, the Ḥanbalī, the cotton merchant, known as Ibn al-Baqsamāṭī. He was born in the year 788 in Baalbek and grew up there. He read the Qurʾān with Ṭalḥa al-ʿAnbarī, memorised al-Khiraqī (the Mukhtaṣar) and presented it to Ibn al-Aqrab, al-Taqī Ibrāhīm b. Mufliḥ and others, and studied jurisprudence with the former. He heard the conclusion of the Ṣaḥīḥ from Abū al-Faraj ʿAbd al-Raḥmān b. Muḥammad b. al-Zaʿbūb and transmitted it; I read it to him in Baalbek. He was a good man who earned his living there by selling cotton. He died.
