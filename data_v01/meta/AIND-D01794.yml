translation:
  ja: アフマド・カムーナ・アッ＝サイーディー。アシュラフ・カーイトバーイがアミールであったときに仕えた者の一人である。カーイトバーイがスルターンに即位すると、彼をシャルブハーナー（宮廷の飲料庫）のミフタール（長官）に任じた。善に近い人物であった。一説には894年に亡くなり、その職は後任に引き継がれた。
  en: Aḥmad Kamūna al-Ṣaʿīdī, one of those who served al-Ashraf Qāytbāy during his emirate. When Qāytbāy became sultan, he appointed him mihtār (overseer) of the sharbakhānāh (the royal drink-house). He was inclined toward goodness. He died, it is said, in the year 894 H, and was succeeded in his post.
