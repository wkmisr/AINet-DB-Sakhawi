translation:
  ja: シャーヒーン・アッ＝ザイニー（＝ザイン・アッ＝ディーン・ヤフヤー・アル＝ウスターダールのマムルーク）。「アル＝ファキーフ」として知られる。主人（ヤフヤー）の側近であった後、アル＝アシュラフ・カーイトバーイのもとで第四ダワーダールを務めた。同類（マムルーク）の中では善良な人物で、学者や敬虔な人々を愛し、時に学問に携わることもあった。879年ラジャブ月に没した。
  en: Shāhīn al-Zaynī (mamlūk of al-Zayn Yaḥyā al-Ustādār), known as al-Faqīh. He was fourth dawādār under al-Ashraf Qāytbāy, after having been a close attendant of his master (Yaḥyā). He was virtuous compared with others of his kind, loved the scholars and the pious, and sometimes occupied himself with study. He died in Rajab of the year 879.
