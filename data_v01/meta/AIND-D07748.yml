translation:
  ja: ムハンマド、アル＝ジャマール、アブー・アル＝ハイル、アル＝ハンバリー。前の三人の兄弟。イブン・アル＝ジャザリー、イブン・サラーマ、その他多くの人々から聴聞し、アッ＝シャムス・アッ＝シャーウィー、アッ＝ザルカシー、イブン・アッ＝タッハーン、イブン・ナーズィル・アッ＝サーヒバ、イブン・バルダス、アブドゥッラフマーン・ブン・アル＝アズライー、イブン・アッ＝シャラーイヒーの娘、その他大勢が彼にイジャーザを授けた。カイロ、ダマスカス、アレッポ、ヒムス、ハマーに赴き、カイロには何度も往来したが、ついにヒジュラ暦848年ムハッラム月にペストに罹って死期を迎え、同じくサイード・アッ＝スアダーの墓域に葬られた。
  en: Muḥammad, al-Jamāl, Abū al-Khayr, al-Ḥanbalī, brother of the three preceding. He heard from Ibn al-Jazarī, Ibn Salāma and a number of others, and al-Shams al-Shāwī, al-Zarkashī, Ibn al-Ṭaḥḥān, Ibn Nāẓir al-Ṣāḥiba, Ibn Bardas, ʿAbd al-Raḥmān b. al-Adhraʿī, the daughter of Ibn al-Sharāʾiḥī and many others granted him ijāza. He entered Cairo, Damascus, Aleppo, Ḥimṣ and Ḥamā, and went to Cairo repeatedly until his death overtook him, stricken by the plague, in Muḥarram 848; he too was buried in the Turba of Saʿīd al-Suʿadāʾ.
