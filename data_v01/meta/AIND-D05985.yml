translation:
  ja: ウマル・ブン・ムハンマド・ブン・ムーサー・ブン・ウマル・ブン・アワド・ブン・アティーヤ・ブン・アフマド・ブン・ムハンマド・ブン・アブド・アッ＝ラフマーン、アッ＝シラージュ・ブン・アッ＝シャムス・ブン・アッ＝シャラフ、アッ＝ラカーニー、のちアル＝カーヒリー、アル＝アズハリー、アル＝マーリキー。父と祖父は後述。（8）80年ズー・アル＝カアダ月に53歳余りで没し、アズハルで葬礼が行われた。生涯の大半はアズハル近くのマカーリーヤの店で公証の仕事で生計を立てていたが、親族である既述のアル＝ブルハーンがマーリク派カーディー職に就いた当初の1か月だけは、その下で代理としてナキーブ職を執った。その後、それを禁じる命令が来て、元の状態に戻った。我らの師（イブン・ハジャル）のもとで聴聞した者の一人であるが、称賛される人ではなかった。神が彼と我々を赦したまわんことを。
  en: ʿUmar b. Muḥammad b. Mūsā b. ʿUmar b. ʿAwaḍ b. ʿAṭiyya b. Aḥmad b. Muḥammad b. ʿAbd al-Raḥmān, al-Sirāj b. al-Shams b. al-Sharaf al-Laqānī, then al-Qāhirī al-Azharī al-Mālikī; his father and grandfather come below. He died in Dhū al-Qaʿda (8)80 aged fifty-three or more, and the funeral prayer was performed over him at al-Azhar. For most of his life he earned his living as a notary witness in a shop at al-Makāriyya near al-Azhar, except for one month at the beginning of the tenure of his relative al-Burhān, mentioned above, as qāḍī of the Mālikīs, when he exercised the office of naqīb as deputy under him; then the order came to bar him from it and he returned to his former state. He was among those who heard from our shaykh, but he was not praiseworthy; may God pardon him and us.
