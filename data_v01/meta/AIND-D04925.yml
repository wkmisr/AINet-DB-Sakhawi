translation:
  ja: アリー・ブン・アーダム・ブン・ハビーブ、ヌールッディーン、アル＝キナーニー、アル＝フバイニー、アル＝ブースィーリー、のちアル＝カーヒリー、シャーフィイー派、クルアーン読誦家（ムクリウ）。アル＝フバイニーおよびアル＝ブースィーリーとして知られる。アッ＝シャムス・アル＝アスカラーニーから読誦諸伝承（キラーアート）を学んだ者の一人で、その教授の座に就き、アッ＝ザイン・ターヒル、イブン・アサド、アル＝ハイサミーらが彼のもとで読誦した。アル＝ヒラーリーヤに居住し、サイード・アッ＝スアダー（修道場）のスーフィーの一人であった。
  en: ʿAlī b. Ādam b. Ḥabīb, Nūr al-Dīn al-Kinānī al-Ḥubaynī al-Būṣīrī, then al-Qāhirī, al-Shāfiʿī, the Qurʾān reciter (muqriʾ), known as al-Ḥubaynī and as al-Būṣīrī. He is among those who took the Qurʾānic readings (qirāʾāt) from al-Shams al-ʿAsqalānī, and he held a teaching post in them; al-Zayn Ṭāhir, Ibn Asad, al-Haythamī and others read under him. He resided at al-Hilāliyya and was one of the Sufis of Saʿīd al-Suʿadāʾ.
