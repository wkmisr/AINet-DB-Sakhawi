notes:
- text: '家系索引 #AIND-D12593「ابن فخيرة … وله أربعة أولاد كريم الدين عبد الكريم … وشرف الدين حمزة أحد كتاب المماليك … وأما رابعهم（حمزة）فله التاج عبد الوهاب وباشر بعده في كتاب المماليك」が本項主を حمزة の子として明記し、父の職の後任となったことを裏づける。同索引では التاج عبد الرزاق は كريم الدين عبد الكريم の子であり、父の本伝 #AIND-D02780「وهو والد عبد الرزاق الآتي」と食い違う（刊本内の矛盾）。校閲時に規則23 で置いた兄弟 عبد الرزاق（TMP-P-000770、cert medium）の relation は、D02780 が本項主に言及せず規則23 の要件を満たさないため集約時に除去し、ここに note 留めとした。'
  lang: ja
  type: editorial
translation:
  ja: アブドゥルワッハーブ・ブン・ハムザ・ブン・アブドゥルガニー・ブン・ヤアクーブ、アッ＝タージュ・ブン・アッ＝シャラフ・ブン・アル＝ファフル。父と同じくマムルーク登録書記（カーティブ・アル＝ママーリーク）の一人で、父と同じく、祖父（の称号）の縮小形であるイブン・フハイラとして知られる。
  en: ʿAbd al-Wahhāb b. Ḥamza b. ʿAbd al-Ghanī b. Yaʿqūb, al-Tāj b. al-Sharaf b. al-Fakhr, one of the clerks of the Mamluks (kuttāb al-mamālīk) like his father, and known, like him, as Ibn Fuḥayra, a diminutive of his grandfather's (title).
