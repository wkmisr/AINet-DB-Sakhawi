translation:
  ja: アブドゥルワッハーブ・ブン・ハムザ・ブン・アブドゥルガニー・ブン・ヤアクーブ、アッ＝タージュ・ブン・アッ＝シャラフ・ブン・アル＝ファフル。父と同じくマムルーク登録書記（カーティブ・アル＝ママーリーク）の一人で、父と同じく、祖父（の称号）の縮小形であるイブン・フハイラとして知られる。
  en: ʿAbd al-Wahhāb b. Ḥamza b. ʿAbd al-Ghanī b. Yaʿqūb, al-Tāj b. al-Sharaf b. al-Fakhr, one of the clerks of the Mamluks (kuttāb al-mamālīk) like his father, and known, like him, as Ibn Fuḥayra, a diminutive of his grandfather's (title).
