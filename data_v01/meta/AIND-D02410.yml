translation:
  ja: ジュシャール・アン＝ナスィーフ・ブン・アフマド・ブン・アブド・アル＝カリーム・ブン・アブドゥッラー・ブン・ウマル・アル＝ウマリー。メッカの隊長（カーイド）の一人。846年サファル月、ジッダでのマクタラト・アル＝ハディード（「鉄の虐殺」）で殺害され、首を斬られて引き回された後、その日のうちに埋葬された。
  en: Jushār al-Naṣīḥ b. Aḥmad b. ʿAbd al-Karīm b. ʿAbd Allāh b. ʿUmar al-ʿUmarī, one of the commanders (quwwād) in Mecca. He was killed in Maqtalat al-Ḥadīd (the "Iron Massacre") in Jidda in Ṣafar 846 AH; his head was cut off and paraded, and he was buried at the end of that day.
