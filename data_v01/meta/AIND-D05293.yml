    ja: '【集約】兄弟 #AIND-D01967 の父＝D05686 は Waka が 2026-06-19 に同じ根拠（علي بن يوسف＋البهلوان）で確定済みのため、同じ根拠で cert medium を外す（§D100-3、内容検証A）。なお repo には #AIND-D05065（علي بن إسماعيل بن يوسف الخواجا … الشهير بابن البهلوان、853年没）⇄ D05686 の possible_identity（cert medium）が既にある（D05065 が同一人物なら本項主の父はナサブ上 علي بن إسماعيل بن يوسف となり見出し「علي بن علي بن يوسف」と1代ずれる点に留意）。父 ＝ #AIND-D05686「علي بن يوسف بن إسماعيل الخواجا بن البهلوان . مات سنة بضع وخمسين」（REF D05702「علي بن يوسف الخواجا نور الدين البهلوان」も同人）。見出しの「علي بن يوسف البهلوان」と名・ラカブが一致。同じ父に #AIND-D01967「إسماعيل بن علي بن يوسف الرومي ويعرف والده بالبهلوان」（867年ジュマーダー1月マッカ没）が Waka 確認済み（2026-06-19）で充てられており、本項主はその兄弟とみられる（没地マッカ・没年が近接）。本項ではラカブ البهلوان が父・本人のいずれに掛かるか明示されないため cert medium（→ISSUES §D100-3）。'
