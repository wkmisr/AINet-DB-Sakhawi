translation:
  ja: ムハンマド・ブン・アリー・ブン・ウマル・ブン・ムハンマド・アッ＝ディマシュキー、イブン・アッ＝シャリーシーの娘の子（外孫）で、イブン・アル＝イルビリーとして知られる。（8）14年ムハッラム月に没した。我らがシャイフ（イブン・ハジャル）が『インバーゥ』にその没年を記している。
  en: Muḥammad b. ʿAlī b. ʿUmar b. Muḥammad al-Dimashqī, the daughter's son of Ibn al-Shurayshī, known as Ibn al-Irbilī. He died in Muḥarram of the year [8]14. Our shaykh (Ibn Ḥajar) recorded his death date in his Inbāʾ.
