translation:
  ja: ウマル・ブン・アブドゥルアズィーズ・ブン・アリー・ブン・アブドゥルアズィーズ・ブン・アブドゥルカーフィー・アッ＝ダクーキー・アル＝マッキー。（8）41年シャウワール月9日土曜日にアジュルードの近くで没し、同地に運ばれて埋葬された。イブン・ファハドが彼について記している。
  en: ʿUmar b. ʿAbd al-ʿAzīz b. ʿAlī b. ʿAbd al-ʿAzīz b. ʿAbd al-Kāfī al-Daqūqī al-Makkī. He died on Saturday, 9 Shawwāl (8)41, near ʿAjrūd, and was carried there and buried in it. Ibn Fahd mentioned him.
