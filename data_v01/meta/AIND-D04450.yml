  note:
    ja: 'Pattern A。「ترجمة القاياتي」の القاياتي は #AIND-D08179（محمد بن علي بن محمد بن يعقوب بن محمد الشمس أبو عبد الله بن النور القاياتي القاهري الشافعي ابن أخت الفخر القاياتي、785年頃生・850年ムハッラム没、首席カーディー）と同定。【裁定 2026-09-18（§Db-2）】この同定を確定とし、cert を medium → high に引き上げた。決め手は corpus の並行例 #AIND-D07029（محمد بن أحمد البهاء المحلي）の本文 L76979「ألزم نفسه بعدم دخول القاهرة ما دام القاياتي قاضيا فلم يلبث إلا نحو شهرين ومات」・L76981「ورأى بعد صرفه مناما أثبته في ترجمة القاياتي」で、(a) そこでの القاياتي は在職約2か月で没した首席カーディー＝D08179（850年ムハッラム没）と明示され、(b) サハーウィーが「ترجمة القاياتي」に منام を書き留めたという本項と全く同型の言い回しが確認できる。さらに D08179 本伝の「وقد بسطت ترجمته في ذيل القضاة والمعجم والحوادث」（別著で長大な伝記を敷衍）とも整合する。対立候補 #TMP-P-000308（الفخر القاياتي）は8世紀末〜9世紀初の伝承者で、850年代の منام 記事の対象として年代が合わず排除される。新規 TMP-P は発行しない（統一規則10）。初版はニスバ番号 #TMP-N-00113（=القاياتي のニスバ）を person 位置（relation/@active）に流用していた（precheck カテゴリ不一致）。'
translation:
  ja: アブドゥッラー・ブン・スライマーン、ジャマール・アッ＝ディーン・アッ＝スブキー・アル＝カーヒリー。学問に励み、講義に出席した。850年より後、アッ＝ザーヒル・ジャクマクの治世に、70歳近くで没した。私は彼から聞いた夢の話を、アル＝カーヤーティーの伝記の中に書き留めた。それはアル＝イッズ・アッ＝スンバーティーが彼から伝えて私に語ったものである。
  en: ʿAbd Allāh b. Sulaymān, Jamāl al-Dīn al-Subkī al-Qāhirī. He occupied himself with study and attended lessons. He died after the [year] fifty [i.e. 850], in the days of al-Ẓāhir Jaqmaq, having come close to seventy. I recorded from him, in the biography of al-Qāyātī, a dream which al-ʿIzz al-Sunbāṭī related to me on his authority.
