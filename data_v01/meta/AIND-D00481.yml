translation:
  ja: アハマド・ブン・アハマド・ブン・アハマド・ブン・ムハンマド・ブン・スライマーン、アブー・アル＝アッバースは、アブー・アル＝アッバースの息子で、高徳な禁欲主義者で、アル＝マクスで有名な大モスクの主であるシャイフの孫である。彼は父と同じくイブン・アル＝ザーヒドとして知られており、シャハーブ・アル＝フサイニーの母方の孫である。その母親はハディージャで、彼らのそれぞれの伝記は後述する。私（サハーウィー）から『アル＝ナワウィーの伝記』という私の著述を聞いた。
  en: Aḥmad b. Aḥmad b. Aḥmad b. Muḥammad b. Sulaymān Abū al-ʿAbbās, son of Abū al-ʿAbbās, grandson of the pious ascetic shaykh who owned the famous mosque in al-Maqs. He was known, like his father, as Ibn al-Zāhid, and was the maternal grandson of al-Shihāb al-Ḥusaynī. His mother was Khadīja. Each of these individuals will be mentioned in their respective entries later. He heard from me (al-Sakhāwī) my composition, the Biography of al-Nawawī.
