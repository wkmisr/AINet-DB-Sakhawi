translation:
  ja: クルトバーイ・アッ＝サイフィー・ジャーニバク——ジッダ副官（ジャーニバク）の（マムルーク）。彼はスルターンの親族の一人であり、そのため彼（スルターン）はフシュカダムが腰斬に処された直後に彼をブハイラのカシュフ職に就けたが、ほどなく881年にペストで没した。
  en: Kurtbāy al-Sayfī Jānibak, (mamlūk of Jānibak) the deputy of Jedda. He was one of the Sultan's relatives, so he (the Sultan) appointed him to the kashf of al-Buḥayra right after Khushqadam was cut in half (executed), but before long he died of the plague in the year 881.
