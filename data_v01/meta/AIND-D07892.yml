translation:
  ja: ムハンマド・ブン・アブドゥルムギース・ブン・ムハンマド・ブン・アフマド・ブン・アッ＝タウワーブ。879年ズー・アル＝ヒッジャ月に腰斬の刑に処された。彼が遺した母と子のために多くの人々が彼（の死）を悲しんだ。特に、彼には表立った罪がなかったからである——たとえ彼が不品行な実務官たちの一人であったとしても。というのも彼はアル＝ワジュフ・アル＝ガルビーにおいて（スルターン私領庁）アル＝ムフラドの実務にあたった者の一人だったのである。神が彼と我らを赦してくださいますように。
  en: Muḥammad b. ʿAbd al-Mughīth b. Muḥammad b. Aḥmad b. al-Ṭawwāb. He was executed by being cut in half in Dhū al-Ḥijja of the year 879. Many grieved for him on account of the mother and child he left behind, especially since he had no manifest sin, even though he was one of the profligate administrators; for he was among those who served in (the Dīwān) al-Mufrad in al-Wajh al-Gharbī. May God forgive him and us.
