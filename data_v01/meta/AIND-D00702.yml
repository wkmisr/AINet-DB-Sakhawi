translation:
  ja: アブー・サワースワーとして知られる、ハサニー家出身、アル＝ハダウィー出身、アッ＝サアディー出身、マッカ出身のムハンマドの父、アフマド・ブン・ハムザ・ブン・ムハンマド。867年ラビーウ・アル＝アウワルにマッカで亡くなった。イブン・ファハドが彼に言及し、ムハンマドについて「アブー・サワースワーの孫」と述べ、両者の結合は解明されなければならない。
  en: Aḥmad b. Ḥamza b. Muḥammad al-Ḥasanī al-Hadawī al-Ṣaʿdī al-Makkī, known as Abū Sawāswāy, father of Muḥammad. He died in Mecca in Rabīʿ al-Awwal in 867 AH. Ibn Fahd mentioned him and said regarding Muḥammad, 'the grandson of Abū Sawāswā,' and their connection needs clarification.
