translation:
  ja: ムハンマド・ブン・アブドゥッラー・アン＝ナフヤーニー、のちアル＝カーヒリー。アル＝ガムリーの仲間（弟子）の一人で、アフマドとアリーの兄弟。彼ら（兄弟）は神がイスラームに導いた者たちであり、アッ＝ザーヒル・ジャクマクが彼らに俸給（リズカ）を与えた。クルアーンを朗誦し、我らがシャイフ（イブン・ハジャル）らに多くを聴聞し、さらに私にも、また私の朗読によっても若干を聴聞した。サイード・アッ＝スアダー（ハーンカー）などに寄宿した。889年シャアバーン月12日金曜の夜に没し、翌日に葬礼の礼拝が行われた。60歳を越えていたと私は思う。神が彼を慈しまれんことを。
  en: Muḥammad b. ʿAbd Allāh al-Nafyānī, then al-Qāhirī, one of the companions of al-Ghamrī, and brother of Aḥmad and ʿAlī; they were among those whom God guided to Islam, and al-Ẓāhir Jaqmaq granted them a stipend (rizqa). He recited the Qurʾān and heard much from our shaykh (Ibn Ḥajar) and others, so that he even heard from me and, through my reading, some things. He was lodged at Saʿīd al-Suʿadāʾ and elsewhere. He died on the eve of Friday 12 Shaʿbān [8]89, and the funeral prayer was performed over him the next day. I think he had passed sixty. May God have mercy on him.
