translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・アフマド・ブン・ムハンマド、アル＝アミーン・イブン・アッ＝ザイン、フスバーンを本貫とするアッ＝ディマシュキー・アル＝ハナフィー。その父は前述。（八百）九十一年シャウワール月、アル＝ムワッファク・アッ＝シャリーフ・アル＝ハマウィーが解任された後、多額の献金によってダマスカスの機密書記職（キターバト・アッ＝スィッル）に就いたが、その翌年のジュマーダー・アル＝アーヒラ月にアッ＝シハーブ・イブン・アル＝ファルフールの甥に代えられて解任された。負債を抱えたまま不遇のうちに過ごし、その災いは、かつてシャイフ・ハッターブの妻であった彼の妻にまで及んだ。（八百）九十七年の疫病で没した。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Aḥmad b. Muḥammad, al-Amīn b. al-Zayn, of Ḥusbān origin, al-Dimashqī al-Ḥanafī. His father has been mentioned above. He was installed in the secretaryship (kitābat al-sirr) of Damascus in Shawwāl (8)91, after the dismissal of al-Muwaffaq al-Sharīf al-Ḥamawī, by paying a large sum; then, in Jumādā II of the following year, he was dismissed in favour of the nephew of al-Shihāb b. al-Farfūr. He remained in obscurity under the burden of debts, and the harm of this extended to his wife, who had formerly been the wife of Shaykh Khaṭṭāb. He died in the plague of the year (8)97.
