notes:
- text: サハーウィー自身が「متأخر لم أقف له على ترجمة … وكتبته هنا بالحدس」と断る項。ハナフィー派の著名学者 Ibn Malak（ابن ملك／ابن فرشتا、没801頃）に相当する。Wikidata には本人（父 عبد اللطيف）の項目がなく（Waka 照合 2026-09-08）、corresp は付けない。息子 محمد بن عبد اللطيف ابن ملك は wd:Q131386051（別人、本項の項主ではない）。TDV İslâm Ansiklopedisi「İbn Melek」項の四著作（Mebâriḳu'l-ezhâr／Şerḥu Mecmaʿi'l-baḥreyn／Şerḥu Menâri'l-envâr／Şerḥu'l-Viḳāye）が本項の列挙と一致。「فرشتا هو الملك」＝ペルシア語 فرشته（天使）。
