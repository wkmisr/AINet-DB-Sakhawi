translation:
  ja: アブド・アッ＝ラティーフ・ブン・アブド・アル＝アズィーズ・ブン・アミーン・アッ＝ディーン・ブン・フィリシュター・アル＝ハナフィー。フィリシュターとは「天使（アル＝マラク）」のことで、彼自身も自筆でそのように「イブン・アル＝マラク」と記して知られていた。後代の人物で、私はその伝記を見出せなかったが、著作があり、アッ＝サガーニーの『マシャーリク』の注釈、『アル＝マジュマウ』『アル＝マナール』『アル＝ウィカーヤ』の注釈などがある。推測でここに書き入れた。神が最もよく知りたまう。
  en: ʿAbd al-Laṭīf b. ʿAbd al-ʿAzīz b. Amīn al-Dīn b. Firishtā al-Ḥanafī — Firishtā means "the angel" (al-malak), and so he used to write in his own hand, being known as Ibn al-Malak. A later figure; I have found no biography of him, but he has works, among them a commentary on al-Ṣaghānī's Mashāriq and commentaries on al-Majmaʿ, al-Manār and al-Wiqāya. I have entered him here by conjecture; God knows best.
