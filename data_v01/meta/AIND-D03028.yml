translation:
  ja: ライハーン・アッ＝ザンジー・アル＝ハラビー。善行と信仰心に富む人物として知られた。アミール（諸将）など有力者たちの頭を剃る仕事に携わっていた。また、長年にわたりシャイフー・ハーンカーにおいて、日没の礼拝と夜の礼拝の間に鉢で水を配る奉仕を行い、常に朗らかな表情を絶やさず、多くの礼拝などを捧げていた。後に、スルタン・アル＝アシュラフ・カーイトバーイによって、イブン・トゥールーン・モスクの増築部に新設されたサビール（公共泉）の番人に任じられた。ヒジュラ暦887年に死去。アッラーの慈悲があらんことを。
  en: Rayḥān al-Zanjī al-Ḥalabī. He was mentioned with goodness and piety. He used to shave the heads of prominent emirs and others. For years, he voluntarily distributed water using a bowl between the two evening prayers at the Khānqāh of Shaykhū, while showing cheerfulness and offering many prayers. Later, the Sultan al-Ashraf Qāytbāy appointed him to the sabil (public fountain) which he established at the annex of the Mosque of Ibn Ṭūlūn. He died in the year 887 H, may Allah have mercy on him.
