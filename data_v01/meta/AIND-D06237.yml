translation:
  ja: カースィム・ブン・アル＝アミール・クムシュブガー・アル＝ハマウィー。父は後述。アル＝アシュラフ・バルスバーイの時代に小ハージブの一人であった。833年に没した。我らがシャイフ（イブン・ハジャル）が『インバー』にその没年を記している。
  en: Qāsim b. al-Amīr Kumushbughā al-Ḥamawī; his father is mentioned below. He was one of the minor chamberlains (al-ḥujjāb al-ṣighār) in the days of al-Ashraf Barsbāy. He died in 833. Our shaykh (Ibn Ḥajar) recorded his death date in his Inbāʾ.
