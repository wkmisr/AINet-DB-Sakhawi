translation:
  ja: アバーン・ブン・ウスマーン・ブン・アブー・バクル・ブン・アブドゥッラー・ブン・ズハイラ・ブン・アフマド・ブン・アティーヤ・ブン・ズハイラ・アル＝クラーシー・アル＝マッキー。彼は840年の終わりに生まれ、アブー・アル＝ファトフ・アル＝マラーギーから（ハディースを）聴聞し、また（何人かの）学徒たちからイジャーザを与えられた。
