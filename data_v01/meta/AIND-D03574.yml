translation:
  ja: アブドゥルラフマーン・ブン・アフマド・ブン・ウマル・ブン・ガーニム、アッ＝ザイン・アル＝バルマキーニー・アル＝カーヒリー。クルアーンの徒（学者・朗誦者）のひとり。830年より少し前に、60代半ば（ないしは60数歳）で没した。アッ＝シャラフ・ムーサー、アフマド、スライマーンの同母（実の）兄弟である。
  en: Abd al-Rahman b. Ahmad b. Umar b. Ghanim, Zayn al-Din, al-Barmakini al-Qahiri. He was one of the people of the Qur'an. He died shortly before 830 AH at the age of sixty-something. He was a full brother of al-Sharaf Musa, Ahmad, and Sulayman.
