translation:
  ja: フセイン・ブン・アリー・ブン・ハーリド。法学者、バドル・アッディーン。アル＝ウカイビー（al-ʿUqaybī）と称し、古くはイブン・アル＝ジャームース（Ibn al-Jāmūs）として知られた。アッ＝タヌーヒー、次いでアル＝ジャマール・アル＝ハンバリーから聴聞した。アッ＝ザイン・リドワーンが息子のために彼にイジャーザを求めた。彼の没年について明確な記述はないが、おそらく（ヒジュラ暦830年）以降に没したとされている。
  en: Ḥusayn b. ʿAlī b. Khālid, the jurist, Badr al-Dīn al-ʿUqaybī, formerly known as Ibn al-Jāmūs. He heard from al-Tanūkhī and then from al-Jamāl al-Ḥanbalī. Al-Zayn Riḍwān requested an ijāza from him for his son. His death was indicated without specification, but it seems to have been after 830 AH.
