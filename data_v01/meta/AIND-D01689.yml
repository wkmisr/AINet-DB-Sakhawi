translation:
  ja: メッカの滞在者で、エルサレムのナージル職に就いた者の一人だったが、ワクフの管理者たちには褒められなかった。ヒジュラ暦876年ジュマーダー・アル＝アーヒラ月26日月曜日にメッカで死去した。イブン・ファハドがその日付を記録した。
  en: Resident of Mecca, and among those who held the office of nāẓir (administrator) of al-Quds, but was not praised by the waqf administrators. He died in Mecca on Monday, the 26th of Jumādā al-Ākhira in the year 876 H. Ibn Fahd recorded this date.
