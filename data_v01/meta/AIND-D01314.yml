translation:
  ja: 328. アフマド・ブン・ムハンマド・ブン・ハサン・ブン・クリーム（第一音節に ضم を持つ）、アル=バアリー。商人。895年に自身の故郷において、アッ=タキー・アブドゥッラフマーン・ブン・ムハンマド・ブン・アブドゥッラフマーン・イブン・アッ=ザアブーブから『サヒーフ・アル=ブハーリー』を聴聞し、その授業にはアル=ハッジャールが代理として参加し、彼もハディースを伝承した。彼から優れた者たちが聴聞した。私（＝サハーウィー）の巡礼以前に亡くなった。
  en: 328. Aḥmad b. Muḥammad b. Ḥasan b. Kuraym (with the first letter vocalized with ḍamma), al-Baʿlī, the merchant. He heard *Ṣaḥīḥ al-Bukhārī* in his hometown in the year 895 from al-Taqī ʿAbd al-Raḥmān b. Muḥammad b. ʿAbd al-Raḥmān Ibn al-Zaʿbūb, whom al-Ḥajjār deputized, and (al-Ḥajjār) transmitted (ḥadīth). The excellent ones heard from him. He died before my (al-Sakhāwī's) journey.
