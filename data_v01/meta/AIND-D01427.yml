translation:
  ja: アフマド・ブン・アッ＝シャムス・ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・アブド・アルカリーム、アッ＝シハーブ・アル＝ハイサミー（本来の出自）・アル＝カーヒリー。アブド・アルカリームとアリーの兄弟で、三人のうち最年少であった。商売に従事し、メッカやその他の地へたびたび旅をした。アミーン・アッ＝ディーン・アル＝ハイサムらと交わったが、何ら大きな成果は得られなかった。ひどく貧しくなった後、六十歳近くで亡くなった。
  en: Aḥmad b. al-Shams Muḥammad b. ʿAlī b. Muḥammad b. ʿAbd al-Karīm, al-Shihāb al-Haythamī (by origin) al-Qāhirī. He was the brother of ʿAbd al-Karīm and ʿAlī, the youngest of the three. He engaged in trade and traveled repeatedly to Mecca and elsewhere. He kept company with Amīn al-Dīn al-Hayṣam and others but obtained nothing substantial. He died near the age of sixty after becoming very poor.
