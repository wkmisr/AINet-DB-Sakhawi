translation:
  ja: アフマド・ブン・クファイフ・ブン・フダイル・ブン・ズハイル（この三つの名はいずれも縮小形）、アル＝アダワーティー。ムハンマド・ブン・ブダイルの母方の叔父（ハール）で、父の名で知られる。彼（アフマド）と甥のムハンマド・ブン・ブダイルは、シャリーフ・ムハンマド・ブン・バラカートによって、ワーディー・マルフィーのアル＝ジュムーム近郊にあるマスジド・アル＝ファトフで、873年ムハッラム月7日木曜日に殺害された。両名の遺体はマッカに運ばれ、そこに埋葬された。
  en: Aḥmad b. Qufayf b. Fuḍayl b. Dhuḥayr (all three names in the diminutive) al-ʿAdawātī, maternal uncle of Muḥammad b. Budayr, known by his father. He and his sister's son Muḥammad b. Budayr were killed by al-Sharīf Muḥammad b. Barakāt near Masjid al-Fatḥ, close to al-Jumūm in Wādī Marfī, on Thursday, the 7th of Muḥarram in the year 873. Their bodies were transported to Mecca and buried there.
