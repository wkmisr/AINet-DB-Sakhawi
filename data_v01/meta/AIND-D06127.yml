translation:
  ja: ファーティン・アッ＝タワーシー（宦官）・アル＝ハバシー。我らの師（イブン・ハジャル）のマウラー。師は『インバー』のアリー・ブン・ムハンマド・ブン・ユースフ・アン＝ヌワイリーの伝で彼から（話を）伝えており、私はそれを同人の項で先に引いた。善良な人で、読み書きを学び、聴聞した。没した。「ニターフ」へと（文字を入れ替えて）字訛りさせたことを法学者アッ＝サウーディーが示したのは、この人物である。
  en: Fātin al-Ṭawāshī (the eunuch) al-Ḥabashī, the mawlā of our shaykh (Ibn Ḥajar). He (Ibn Ḥajar) transmitted from him, in his Inbāʾ, in the biography of ʿAlī b. Muḥammad b. Yūsuf al-Nuwayrī, what I have cited earlier in that entry. He was a good man; he learned to read and write, and heard (hadith). He died. He is the one whose name the jurist al-Saʿūdī pointed out as having been transposed (taṣḥīf) into "Nitāf".
