translation:
  ja: ジーラク・アッ＝ルーミー・アル＝カースィミー・カースィム。カースィムの解放奴隷。商業で幸運に恵まれ、誠実な語り口で、善行を好み、教養があった。商業において立身し、そのためにカイロにしばしば赴き、またそれ以外の地へも旅して、名を知られた一人となった。
  en: Zīrak al-Rūmī al-Qāsimī Qāsim. A freed slave of Qāsim. He was fortunate in trade, truthful in speech, loving of charity, and well-mannered. He rose in trade, frequently visiting Cairo for business, and traveled to other places, becoming one of the prominent figures.
