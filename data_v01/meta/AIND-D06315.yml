translation:
  ja: カジュマース・アル＝ムハンマディー・アッ＝ザーヒリー、シャード・アッ＝シャラブハーナ（御酒膳房監督官）。（8）02年ラビーウ第一月8日、カイロでアイタミシュの戦いにおいて殺された。アル＝マクリーズィーらがその没年を記録している。
  en: Qajmās al-Muḥammadī al-Ẓāhirī, shādd al-sharābkhānāh (supervisor of the royal buttery). He was killed in the battle of Aytamish on the 8th of Rabīʿ I of the year [80]2 in Cairo. Al-Maqrīzī and others recorded his death date.
