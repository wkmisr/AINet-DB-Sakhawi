notes:
- text: '「ويحرر كونه من هذا القرن」＝本項主が9世紀の人物かどうかは要検証、とサハーウィー自身が留保。父 #AIND-D06650 は801年に40歳前後で没しており、「الأكبر」（年長のアリー）が800年以前に没した可能性を含意する。なお ID-Master の TMP-P-000857「علي بن محمد بن أحمد بن حسن بن الزين … القسطلاني المكي」（D03696・D04685・D08156・D11078・D13099・D13176・D13450 の父。子らは836年にイジャーザ）とナサブが一致するが、同一人物かは本項の留保と年代から確定できないため名寄せしない（§D123-2）。'
