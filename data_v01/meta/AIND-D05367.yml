    ja: '見出しナサブから、父 ＝ #AIND-D06650（محمد بن أحمد بن حسن بن الزين محمد بن الأمين محمد بن القطب … الجمال أبو عبد الله القيسي القسطلاني المكي الحنفي والد الكمال محمد الآتي ويعرف بابن الزين、801没・40歳前後）。兄弟項 #AIND-D08556 に「والماضي أخوه علي وأبوهما」とあり整合（規則37）。初版は父 relation 欠落。'
