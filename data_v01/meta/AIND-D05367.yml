translation:
  ja: アリー・アル＝アクバル・ブン・ムハンマド・ブン・アフマド・ブン・ハサン・ブン・アッ＝ザイン・ムハンマド・ブン・アル＝アミーン・ムハンマド・ブン・アル＝クトゥブ・アビー・バクル・ムハンマド・ブン・アフマド・ブン・アリー・アル＝カスタッラーニー。後述するアブー・アル＝バラカート・ムハンマドの兄弟で、イブン・アッ＝ザインとして知られる。イブン・ファハドは彼について（没年を）空白のままにしており、彼がこの世紀の人物であるかは要検証である。
  en: ʿAlī al-Akbar b. Muḥammad b. Aḥmad b. Ḥasan b. al-Zayn Muḥammad b. al-Amīn Muḥammad b. al-Quṭb Abī Bakr Muḥammad b. Aḥmad b. ʿAlī al-Qasṭallānī, the brother of Abū al-Barakāt Muḥammad, who follows, and known as Ibn al-Zayn. Ibn Fahd left a blank for him, and whether he belongs to this century remains to be verified.
