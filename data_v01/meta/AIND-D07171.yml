translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アフマド・ブン・アン＝ナフリーリー、アル＝カーヒリー・アル＝マーリキー、前述のハラフの兄弟。我らの師（イブン・ハジャル）は『インバー』で彼に言及し、「裁判の代理を務め、法学で頭角を現し、教授した」と述べた。809年ジュマーダー・アル＝アーヒラ月に没した。
  en: 'Muḥammad b. Abī Bakr b. Aḥmad b. al-Naḥrīrī, al-Qāhirī al-Mālikī, the brother of Khalaf, mentioned above. Our shaykh mentioned him in his Inbāʾ and said: he acted as deputy judge, became proficient in jurisprudence and taught. He died in Jumādā al-Ākhira of the year [80]9.'
