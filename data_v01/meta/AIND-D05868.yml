translation:
  ja: ウマル、我らの友アル＝イッズ・アブド・アル＝アズィーズ・ブン・アブド・アッ＝ラフマーン・ブン・イブラーヒーム・ブン・ムハンマドの息子、アル＝カマール・アル＝ハラビー・アル＝ハナフィー。アブー・ジャアファル・ブン・アッ＝ディヤーの娘の子で、母はアーイシャ。先祖と同じくイブン・アル＝アディームとして知られる。学問に携わり、イブン・アミール・ハーッジのもとで法学を修め、アブー・ザッルらから学んだ。郷里で私（サハーウィー）とともに一群の師から聴聞した。頭角を現して秀で、詩を詠んで抜きん出、詩集を編んで『ブドゥール・アル＝カマール』と名付けた。アターベクがハマーに、ダワーダールがハラブにいた年に、両親の存命中、30歳に満たずして没した。アッラーが彼と両親に楽園をもって報いられんことを。
  en: ʿUmar, the son of our companion al-ʿIzz ʿAbd al-ʿAzīz b. ʿAbd al-Raḥmān b. Ibrāhīm b. Muḥammad, al-Kamāl al-Ḥalabī al-Ḥanafī, the daughter's son of Abū Jaʿfar b. al-Ḍiyāʾ; his mother was ʿĀʾisha. Like his forebears he was known as Ibn al-ʿAdīm. He studied, learned jurisprudence under Ibn Amīr Ḥājj, and took knowledge from Abū Dharr and others. In his home town he heard, together with me (al-Sakhāwī), from a number of teachers. He distinguished himself, excelled, composed poetry in which he surpassed others, and compiled a dīwān he named Budūr al-Kamāl. He died in the year when the atābak was at Ḥamā and the dawādār at Aleppo, during the lifetime of his parents, before completing thirty years. May God recompense him and them with Paradise.
