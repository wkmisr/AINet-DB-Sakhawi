translation:
  ja: クムシュブガー・アル＝アフマディー・アッ＝ザーヒリー・バルクーク。トルコ系で、彼（アッ＝ザーヒル・バルクーク）の年少のマムルークの一人。次いでアル＝ムアイヤド（シャイフ）の死後にアミールとなり、次いでアル＝アシュラフ（バルスバーイ）が彼をラアス・ナウバ（複数のラアス・ナウバの一人）に任じ、バーシュ（隊長）としてマフマル（巡礼行列）を率いた。髭が薄く、気概があり、意志が強く勇敢で、チェルケス人を憎む性向があった。アル＝アイニーが記すとおり838年ラビーウ第一月11日の月曜の夜に、50代で没した。
  en: Kumushbughā al-Aḥmadī al-Ẓāhirī Barqūq. Of Turkic stock, one of the junior mamlūks of (al-Ẓāhir Barqūq). He then became an amir after the death of al-Muʾayyad (Shaykh); then al-Ashraf (Barsbāy) appointed him among the ruʾūs al-nuwab (heads of the guard), and he led the maḥmal (pilgrimage procession) as bāsh. He was thin-bearded, high-minded, strong-willed and bold, and had a capacity for hating the Circassians. He died on the night of Monday, 11 Rabīʿ I of the year 838, as al-ʿAynī dated it, while in his fifties.
