translation:
  ja: アブドゥルマリク・ブン・アル＝カマール・アビー・アル＝ファドル・ムハンマド・ブン・アッ＝スィラージュ・アブドゥッラティーフ・ブン・ムハンマド・ブン・ユースフ・アッ＝ザランディー・アル＝マダニー・アッ＝シャーフィイー。（8）67年サファル月初めにマディーナで没した。アッラーが彼に慈悲を垂れたまわんことを。
  en: ʿAbd al-Malik b. al-Kamāl Abī al-Faḍl Muḥammad b. al-Sirāj ʿAbd al-Laṭīf b. Muḥammad b. Yūsuf al-Zarandī al-Madanī al-Shāfiʿī. He died in Medina at the beginning of Ṣafar (8)67, may God have mercy on him.
