translation:
  ja: アハマド・ブン・ムーサー・ブン・ハールーン、シャハーブ、カイロ出身のクルアーン朗誦教師。イブン・アッ＝ザイヤートの通称で知られる。詠唱隊（ジョウク）のクルアーン朗誦者の長として精励し昇進し、そこから財産を築いた。アーミドの年の際にアレッポへ旅し、我らがシャイフ（イブン・ハジャル）やブルハーン・アル＝ハラビーらから聴聞した。867年ラビーウ・ル＝アーヒル月5日の月曜日に死去し、翌日埋葬された。おそらく70歳を超えていたか、それに近かったであろう。
  en: Aḥmad b. Mūsā b. Hārūn, al-Shihāb al-Qāhirī, the reciter. Known as Ibn al-Zayyāt. He worked hard and rose to the leadership of the reciters' guild (jawq) and accumulated wealth from it. He traveled to Aleppo in the year of Āmid and heard from our shaykh (Ibn Ḥajar) and al-Burhān al-Ḥalabī and others. He died on Monday, the fifth of Rabīʿ al-Ākhir in the year 867 H and was buried the next day. He might have been over seventy or close to it.
