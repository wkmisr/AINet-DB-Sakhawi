translation:
  ja: アリー・ブン・アフマド・ブン・アブドゥッラー、アッ＝サカンダリー、アル＝ハースィブ（計算家）。我らがシャイフ（イブン・ハジャル）は『インバー』で言う。彼は礼拝時刻学（ミーカート）に取り組み、天文表（ズィージュ）の解法と暦（タクウィーム）の作成に秀でた。そして錬金術に傾倒し、昇華や蒸留などの作業に生涯を費やしたが、何一つ成就しなかった。（8）02年の末に50歳ほどで没した。マクリーズィーは『ウクード』で彼について、ここより長く記している。
  en: ʿAlī b. Aḥmad b. ʿAbd Allāh al-Sakandarī al-Ḥāsib (the reckoner). Our shaykh (Ibn Ḥajar) said in his Inbāʾ that he devoted himself to the science of timekeeping (mīqāt) and excelled in solving astronomical tables (zīj) and drawing up calendars; then he turned to alchemy and wasted his life in its operations, between sublimation and distillation and the like, and nothing came of it for him. He died at the end of the year (8)02, aged about fifty. Al-Maqrīzī mentioned him in his ʿUqūd at greater length than here.
