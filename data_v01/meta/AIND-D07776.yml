translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・サッラーム・アッ＝ディマシュキー。アラー・アッ＝ディーンの兄弟で、年少の方。（8）03年ラジャブ月、ティムール軍の撤収後に没した。我らがシャイフ（イブン・ハジャル）が『インバー』でそう述べている。
  en: Muḥammad b. ʿAbd Allāh b. Sallām al-Dimashqī, brother of ʿAlāʾ al-Dīn and the younger of the two. He died in Rajab (8)03, after the withdrawal of Timur's forces; so said our shaykh (Ibn Ḥajar) in his Inbāʾ.
