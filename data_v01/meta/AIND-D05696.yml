translation:
  ja: アリ・ブン・ユースフ・ブン・ムハンマド・ブン・アリ。アンサーリー、ザランディー、マダニー、ハナフィー派。彼の父（ユースフ）の伝記は後述される。ヒジュラ暦829年ジュマーダー・アル＝アーヒラ（第2ジュマーダー）に生まれ、アブー・アル＝ファトフ・アル＝マラーギーとその兄弟、およびその他の人々からハディースを聴聞した。また、マディーナにおいて私（サハーウィー）からもハディースを聴聞した。親族であるハナフィー派判事のアリ・ブン・サイード（既述）の後任として、ウマル・ブン・アブドゥルアズィーズ・ブン・バドルの推薦（運動）によって、マディーナの市場監督官（ムフタシブ）職を短期間務めた。ヒジュラ暦892年にマディーナで没した。
  en: ʿAlī b. Yūsuf b. Muḥammad b. ʿAlī, al-Anṣārī al-Zarandī al-Madanī al-Ḥanafī. His father is mentioned below. He was born in Jumada II 829 AH and heard hadith from Abū al-Fatḥ al-Marāghī, then his brother, and others. He also heard hadith from me (al-Sakhāwī) in Medina. He briefly held the office of muḥtasib of Medina, succeeding his relative, the Hanafi judge ʿAlī b. Saʿīd (mentioned above), through the mediation of ʿUmar b. ʿAbd al-ʿAzīz b. Badr. He died in Medina in the year 892 AH.
