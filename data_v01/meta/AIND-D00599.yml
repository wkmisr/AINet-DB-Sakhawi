translation:
  ja: アブー・バクル・ブン・アブドゥルワッハーブ・ブン・アフマド、シャーヒーブ・アル＝マハッリー。 後に記述するムハンマドの兄弟。 証言（公証）で生計を立て、カーディーの代理を務め、また裁判の責任者をしばらく務めた。書道に優れ、人柄も良く、クルアーンを朗誦し、手工業にも長けていた。50歳を過ぎて兄より先に亡くなった。
  en: Aḥmad b. Abī Bakr b. ʿAbd al-Wahhāb b. Aḥmad al-Shihāb al-Maḥallī, brother of Muḥammad, who will be mentioned later. He earned his living through witnessing/notarizing, served as a deputy judge, and acted as a trustee of judgment for a period. He had beautiful handwriting, was a good person, recited the Qur'an, and was skilled in craft. He died after the age of fifty, before his brother.
