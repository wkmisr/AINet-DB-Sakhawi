translation:
  ja: クムシュ、アッ＝ザーヒル・バルクークのマムルーク出身の千人隊アミール（ムカッダム）の一人で、トリポリの副王。817年にアル＝ムアイヤドに殺された者の一人。アル＝アイニーが没年を記している。
  en: Qumush, one of the commanders of a thousand (muqaddam) from among the mamlūks of al-Ẓāhir Barqūq, and viceroy of Tripoli. He was among those whom al-Muʾayyad had killed in the year 817. Al-ʿAynī recorded his death.
