translation:
  ja: アフマド・ブン・サアド・ブン・ムスリム、シーハーブッディーン・アルアリーヒー・アッディマシュキー・アルマッキー・アルハナフィー・アルムクリィ。マッカにおけるハナフィー派の地位の代理人であり、リバート・ラビーアのシャイフ。836年ズーアルカアダ月に、アブド・アルアウワル・アルムルシディーからのイジャーザに関して、イブン・アイヤーシュについて証言した。841年ジュマーダー・アルウーラー月初めの木曜日の夜にマッカで亡くなった。イブン・ファハドが彼について記している。
  en: Aḥmad b. Saʿd b. Muslim, Shihāb al-Dīn al-Aryaḥī al-Dimashqī al-Makkī al-Ḥanafī al-Muqriʾ. He served as deputy (nāʾib) of the Ḥanafī position in Mecca and as shaykh of Ribāṭ Rabīʿ. He witnessed concerning Ibn ʿAyyāsh in Dhū al-Qaʿda 836 H regarding an ijāza granted by ʿAbd al-Awwal al-Murshidī. He died in Mecca on the night of Thursday, the beginning of Jumādā al-Ūlā, 841 H. Ibn Fahd recorded his biography.
