translation:
  ja: ナーニク・アル＝ムハンマディー・アッ＝ザーヒリー・ジャクマク。彼の年少のマムルークの一人であった。アッ＝ザーヒル・フシュカダムが彼を十人長とし、ついで第二厩舎長（アミール・アーフール・サーニー）、ついで飲料庫監督（シャード・アッ＝シャラブハーナー）、ついでムカッダムとし、（8）71年にはマフマルの長とした。ついでアル＝アシュラフ・カーイトバーイが筆頭ラアス・ナウバ（ラアス・ナウバト・アン＝ヌワブ）とした。（8）72年、スワールとの戦いで殺された。
  en: Nāniq al-Muḥammadī al-Ẓāhirī Jaqmaq. He was one of his junior mamluks. Al-Ẓāhir Khushqadam made him an amīr of ten, then appointed him second amīr ākhūr, then shādd al-sharabkhānāh, then a muqaddam, and put him in command of the maḥmal in the year [8]71; then al-Ashraf Qāytbāy made him raʾs nawbat al-nuwab. He was killed in the battle against Suwār (al-waqʿa al-Suwāriyya) in the year [8]72.
