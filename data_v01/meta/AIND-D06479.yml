    ja: '「والد إبراهيم وإخوته」。子 إبراهيم ＝ #AIND-D00232「إبراهيم بن محمد بن إبراهيم بن أحمد برهان الدين بن شمس الدين القاهري المقسي الشافعي الخطيب … ويعرف كأبيه بابن الخص」（874没、未収録）。ナサブ3代＋通称 ابن الخص で閉合。D00232 末尾「ورأيت لأبيه سماعا لمجلس الختم للدارقطني على الأبناسي والغماري والشمس الحريري إمام الصرغتمشية والفوى وأحمد بن عبد الله بن رشيد السلمي الحجازي والزين بن النقاش وذلك في سنة خمس وتسعين وسبعمائة فيشار إليه في ترجمته من المحمدين」は本項の師の列挙と一致し、聴講年を 795 と伝える（他項の情報なので日付属性にせず note に留める、規則23）。他の子（通称索引 #AIND-D12295「ابن الخص … محمد بن إبرهيم بن أحمد وبنوه إبراهيم ومحمد وبهاء الدين」の محمد・بهاء الدين）は本項に名がなく relation を立てない。'
