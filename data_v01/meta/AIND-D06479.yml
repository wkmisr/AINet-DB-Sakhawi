translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アフマド、アッ＝シャムス、カイロの人、イブン・アル＝フッスとして知られる。イブラーヒームとその兄弟たちの父。ナースィル・アッディーン・イブン・アル＝マイラクらに随従した者の一人で、アル＝グマーリー、アル＝アブナースィー、サルガトミシーヤのイマームであるアッ＝シャムス・アル＝ハリーリー、アン＝ヌール・アル＝フウウィー、アッ＝シハーブ・アフマド・ブン・アブドゥッラー・ブン・ラシード・アッ＝スラミー・アル＝ヒジャーズィー・アル＝ハナフィー（盲人）、アッ＝ザイン・イブン・アン＝ナッカーシュから、アッ＝ダーラクトニー（『スナン』）の読了会を聴講した。
  en: Muḥammad b. Ibrāhīm b. Aḥmad, al-Shams al-Qāhirī, known as Ibn al-Khuṣṣ, father of Ibrāhīm and his brothers. He was among those who kept the company of Nāṣir al-Dīn b. al-Maylaq and others, and he heard the concluding session (khatm) of al-Dāraquṭnī from al-Ghumārī, al-Abnāsī, al-Shams al-Ḥarīrī the imam of al-Ṣarghitmishiyya, al-Nūr al-Fuwwī, al-Shihāb Aḥmad b. ʿAbd Allāh b. Rashīd al-Sulamī al-Ḥijāzī al-Ḥanafī the blind, and al-Zayn b. al-Naqqāsh.
