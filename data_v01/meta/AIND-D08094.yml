translation:
  ja: ムハンマド・ブン・アリー・ブン・サラーフ・ブン・アリー・ブン・ムハンマド・ブン・アリー・ブン・アフマド・ブン・アル＝ハサン、ザイド派のイマーム。839年に没した。既に挙げた者たちの中で検討を要する。いや、むしろムハンマド・ブン・アリー・ブン・ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・アリーが後に来る。
  en: Muḥammad b. ʿAlī b. Ṣalāḥ b. ʿAlī b. Muḥammad b. ʿAlī b. Aḥmad b. al-Ḥasan, the Imām of the Zaydīs. He died in the year [8]39. He is to be checked against those [already] mentioned; rather, Muḥammad b. ʿAlī b. Muḥammad b. ʿAlī b. Muḥammad b. ʿAlī will come later.
