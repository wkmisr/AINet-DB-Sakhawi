  lang: ja
  type: editorial
translation:
  ja: クルム・フジャー・アッ＝ザーヒリー・バルクーク。彼（バルクーク）のハースィキーの一人で、その（主人の）後に十人長（アミール・アシャラ）となってしばらく務め、その後職を退き、864年ラジャブ月に90代で没するまで（そのままであった）。それまでにハッジとムジャーワラ（聖地滞在）を何度も行っていた。敬虔で善良な人物で、法学などに親しみがあった。アッラーの慈悲あれ。
  en: Qurm Khujā al-Ẓāhirī Barqūq. He was one of his (Barqūq's) khāṣṣakīs, then after him he was made an amir of ten for a period, then withdrew, until he died in Rajab of the year 864 in his nineties, having performed the pilgrimage and the mujāwara (residence at the holy cities) more than once. He was pious and good, with some familiarity with jurisprudence and other subjects; may God have mercy on him.
