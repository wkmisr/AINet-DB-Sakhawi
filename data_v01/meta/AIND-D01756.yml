translation:
  ja: アフマド・アッ＝シハーブ・アッ＝サンフーリー、シャルブ（上質の亜麻布）を扱う商人。ジャーミウ・サラムのムアッズィンであったファトフッディーンの兄弟の娘（姪）と結婚した。893年ジュマーダー・アッ＝サーニヤ月に死去。彼の項目は、先に言及されたアフマド・アッ＝シハーブ・アル＝アズハリー・アル＝ガズーリーの項目と併せて校訂されるべきものである。
  en: Aḥmad al-Shihāb al-Sanhūrī, a merchant dealing in sharb (fine linen). He married the daughter of the brother (i.e. the niece) of Fatḥ al-Dīn, the muezzin at Jāmiʿ Ṣalam. He died in Jumādā al-Thāniya of the year 893 H. His entry is to be collated with that of Aḥmad al-Shihāb al-Azharī al-Ghazūlī, mentioned previously.
