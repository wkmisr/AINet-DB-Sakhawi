notes:
- text: サハーウィーは末尾で「ويحرر مع أحمد الشهاب الأزهري الغزولي الماضي قريبا」（先出のأحمد الشهاب الأزهري الغزولي=AIND-D01745 と併せて校訂せよ）と注記する。D01745は「الأزهري الغزولي **بالسرب**」、本項は「التاجر **بالشرب**」で綴りが近く、両者が同一人物/重複の可能性がある。統合はせず両立のまま相互参照。要Waka判断。
  lang: ja
