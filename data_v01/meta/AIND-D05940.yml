translation:
  ja: ウマル・ブン・ムハンマド・ブン・アビー・バクル・ブン・イスマーイール、アッ＝シラージュ・ブン・アル＝ハワージャー・アッ＝シャムス・ブン・アン＝ナッハース、アッ＝ディマシュキー。商業で頭角を現した者の一人で、商売のためにマッカに繰り返し滞在した。（8）61年ジュマーダー・アル＝ウーラー月、そこ（マッカ）で没することとなり、父は彼を失って嘆いた。イブン・ファハドが彼（の没年月）を記録している。
  en: ʿUmar b. Muḥammad b. Abī Bakr b. Ismāʿīl, al-Sirāj b. al-Khawājā al-Shams b. al-Naḥḥās, al-Dimashqī. He was among those who distinguished themselves in trade, and sojourned in Mecca repeatedly on its account. It was so decreed that he died there in Jumādā al-Ūlā of the year (8)61, and his father was stricken by his loss. Ibn Fahd recorded his death.
