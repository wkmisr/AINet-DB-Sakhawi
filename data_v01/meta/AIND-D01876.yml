translation:
  ja: アズバク・アル＝カーディー。ハーサキーヤの一員。887年ムハッラム月にメッカで死去し、アル＝ムアッラー墓地に埋葬された。彼は、バーシュ（メッカ駐留部隊の長）とともにメッカに駐留していた兵士たちの一人であった。
  en: Azbak al-Qāḍī, one of the Khāṣṣakiyya, died in Mecca in Muḥarram 887 H and was buried in al-Muʿallā. He was among the soldiers stationed in Mecca with al-Bāsh (the commander of the garrison).
