translation:
  ja: ウマル・ブン・カースィム・アル＝アンサーリー・アル＝ミスリー・アッ＝シャーフィイー、クルアーン読誦家。かつての生業からアン＝ナッシャール（鋸挽き）として知られる。アリー・アル＝ハッバーズ・アッ＝ダリール、次いでアッ＝シャムス・ブン・アル＝ヒムサーニー、アッ＝サイイド・アッ＝タバータビーに七読誦法で読み、またアッ＝ダイルーティー、イブン・イムラーン、イブン・アサドにも読んだが、最後の三人のもとでは完了せず、彼らは彼にイジャーザを与えた。ミスルで一時期児童への読誦教育に専念し、一団の人々が彼から益を得た。彼のもとで読んだ者にアッ＝シハーブ・アル＝カスタッラーニーとアン＝ヌール・アル＝ジャーリヒーがおり、後者は彼から諸読誦法を修得した。彼は善良な人で、読誦学に卓越し、『シャーティビーヤ』を暗記している。近隣に住むため、アル＝ジャラール・ブン・アル＝アスユーティーに親近している——彼はアル＝カブシュにあるカーニムのマドラサのイマームだからである。それゆえ（スユーティーは）彼を「シャイフ、学者、有徳者、読誦家たちの長」と評した。彼は巡礼し、複数回（マッカに）滞在し、同様にエルサレムとヘブロンを何度も訪れた。
  en: ʿUmar b. Qāsim al-Anṣārī al-Miṣrī al-Shāfiʿī, the Qurʾān reciter, known as al-Nashshār (the sawyer), after a trade he once practised. He recited the seven readings to ʿAlī al-Khabbāz al-Ḍarīr, then to al-Shams b. al-Ḥimṣānī and al-Sayyid al-Ṭabāṭabī, and also to al-Dayrūṭī, Ibn ʿImrān and Ibn Asad, though he did not complete (the recitation) with the last three, and they granted him ijāza. He devoted himself for a time to teaching children to recite in Miṣr, and a number of people benefited from him; among those who recited before him were al-Shihāb al-Qasṭallānī and al-Nūr al-Jāriḥī, who indeed took the readings from him. He is a good man, accomplished in the readings, and knows al-Shāṭibiyya by heart. He is attached to al-Jalāl b. al-Asyūṭī because of the proximity of his quarters, for he is the imām of the madrasa of Qānim at al-Kabsh; and for this reason (al-Suyūṭī) described him as "the shaykh, the learned, the virtuous, the shaykh of the reciters". He has performed the pilgrimage
    and resided (in Mecca) more than once, and likewise visited Jerusalem and Hebron several times.
