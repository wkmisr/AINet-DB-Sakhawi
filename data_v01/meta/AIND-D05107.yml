translation:
  ja: アリー・ブン・アル＝バドル・ハサン・ブン・イブラーヒーム・ブン・フサイン・ブン・ウライバ。彼の父、祖父、同母兄弟イブラーヒームは前述した。彼（アリー）は二人のうちの年長である。897年の疫病（ペスト）で没し、20歳に満たなかった。
  en: ʿAlī b. al-Badr Ḥasan b. Ibrāhīm b. Ḥusayn b. ʿUlayba. His father, his grandfather, and his full brother Ibrāhīm have been mentioned above; he (ʿAlī) was the elder of the two. He died in the plague of the year 897, not having completed twenty years.
