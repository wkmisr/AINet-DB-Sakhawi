translation:
  ja: アリー・ブン・ファフル・アッ＝ディーン——彼（父）はフハイルとも呼ばれる——ブン・ムハンマド・ブン・ムハンナー、アレクサンドリア出自のマッカ人、薬種商。イブン・フハイルとして知られる。892年ラビーウ第1月にマッカで没した。彼は二人の兄弟のうちで最年長で、次がアフマド、二人に続くのが証人（シャーヒド）のアブド・アル＝カリームである。
  en: ʿAlī b. Fakhr al-Dīn — who (the father) is also called Fukhayr — b. Muḥammad b. Muhannā, of Alexandrian origin, the Meccan, the druggist (al-ʿaṭṭār), known as Ibn Fukhayr. He died in Mecca in Rabīʿ I of the year 892. He was the eldest of his two brothers; next came Aḥmad, and after both of them ʿAbd al-Karīm the notary-witness.
