translation:
  ja: アブド・アッラー・ブン・アビー・アル＝アッバース・アフマド・ブン・アブド・アッラー・ブン・ヤフヤー・アッ＝トゥーニスィー・アル＝マルジャーニー。アル＝イッズ・ブン・ジャマーア、アル＝ファフル・アン＝ヌワイリー、アル＝カマール・ブン・ハビーブから聴聞した。アッ＝タキー・ブン・ファフドが彼から学び、彼は敬虔で善良で信心深い人であったと述べ、それ以上は加えなかった。
  en: ʿAbd Allāh b. Abī al-ʿAbbās Aḥmad b. ʿAbd Allāh b. Yaḥyā al-Tūnisī al-Marjānī. He heard from al-ʿIzz b. Jamāʿa, al-Fakhr al-Nuwayrī and al-Kamāl b. Ḥabīb; al-Taqī b. Fahd studied under him and said that he was a righteous, good and religious man, and added no more.
