notes:
- text: '転送見出し（原文「فيمن جده عمر」による）。転送先は #AIND-D07225「محمد بن أيب بكر بن عمر بن محمد القباني . قال شيخنا الزين رضوان ينظر أهو ابن الباهي الذي بسر ياقوس أو غيره . وسمي البقاعي جده محمدا وعمر أشبه」（未受領）。転送先本文が「البقاعي は祖父を محمد と記すが عمر が妥当」と述べており、本見出し（祖父 محمد）との異同を自ら説明している。corpus の القباني 見出しで「محمد بن أبي بكر بن عمر」はこの1件のみ。'
