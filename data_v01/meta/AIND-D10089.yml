translation:
  ja: ムーサー・ブン・ムハンマド・ブン・ムハンマド、アッ＝シャラフ、アッ＝ディースティー、のちアル＝カーヒリー。アン＝ナースィル・ブン・バルクークの廟に寄寓した。サイード・アッ＝スアダー・ハーンカーでアン＝ヌール・アル＝マハッリーの前で『ムスナド・アッ＝シャーフィイー』を読み、アル＝ジャマール・アル＝ハンバリーから聴聞した。我らがシャイフ・アッ＝ザイン・リドワーンは、彼を学ぶべき相手の中に挙げ、その死を示唆している。
  en: Mūsā b. Muḥammad b. Muḥammad, al-Sharaf al-Dīsaṭī, then al-Qāhirī, resident of the tomb of al-Nāṣir b. Barqūq. He read the Musnad of al-Shāfiʿī before al-Nūr al-Maḥallī at the Khānqāh of Saʿīd al-Suʿadāʾ and heard from al-Jamāl al-Ḥanbalī. Our shaykh al-Zayn Riḍwān mentioned him among those from whom one takes (knowledge) and alluded to his death.
