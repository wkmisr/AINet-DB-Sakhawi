    ja: '規則3 (c'')。父 محمد بن محمد الديسطي は汎用名で識別要素なし、corpus に見出しなし。初版は父 relation なし。【集約 2026-11-05】機械照合の候補 #AIND-D08931「محمد بن محمد بن علي بن عبيد بن شعيب الشمس الديسطي ثم القاهري القلعي … والد المحب محمد الآتي … ولد سنة بضع وثمانمائة … مات في مستهل ربيع الأول سنة ست وتسعين」はナサブ2代＋ニスバ الديسطي が一致するが、子として موسى を挙げず、年代が合わない（本項主は الجمال الحنبلي＝#AIND-D04509（817没）に聴講し、الزين رضوان（852没）が没を記す＝本項主の生年は 810 年以前。D08931 は 80X 生）＝別人。#AIND-D09152 はその子（856生）で別人（機械 L、決定14）。'
