translation:
  ja: ムハンマド・ブン・スンクル、アッ＝シャラフィー。（このニスバは）アル＝フサイニーヤ地区の有名なモスクの主であるイブン・シャラフッディーンに因むもので、彼の父がその解放奴隷（マウラー）であったためである。ルガイラグとして知られる。860年ジュマーダー・アル＝アーヒラ月に没し、小スーフィー廟（トゥルバト・アッ＝スーフィーヤ・アッ＝スグラー）の裏手に埋葬された。イブン・アル＝ムニールが彼の没年を記録し、「彼は文字を知らなかったが、良い言葉を持ち、敬虔な人々に通じており、人々は彼に（聖者としての）信を寄せていた」と述べている。神よ彼に慈悲を。
  en: Muḥammad b. Sunqur al-Sharafī, so called after Ibn Sharaf al-Dīn, the owner of the famous mosque in al-Ḥusayniyya, because his father was the latter's freedman (mawlā); he was known as Lughaylagh. He died in Jumādā al-Ākhira of the year 860 and was buried behind the Lesser Sufi Mausoleum (Turbat al-Ṣūfiyya al-Ṣughrā). Ibn al-Munīr recorded his death and said that he was illiterate but had fine sayings and knowledge of the righteous, and that people held him in (spiritual) esteem; may God have mercy on him.
