translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アブドゥルハーリク、アッ＝シャムス・アル＝カーヒリー、シャーフィイー派。イブン・アル＝ムハッララーティーとして知られる。カイロのバシュターク宮殿の門前で子供たちの教師（ムアッディブ・アル＝アトファール）を務めた。（8）50年ムハッラム月にそこ（カイロ）で没した。善良な人であった。
  en: Muḥammad b. Abī Bakr b. ʿAbd al-Khāliq, al-Shams al-Qāhirī al-Shāfiʿī, known as Ibn al-Mukhallalātī; teacher of children (muʾaddib al-aṭfāl) at the gate of Qaṣr Bishtāk in Cairo. He died there in Muḥarram (8)50. He was a good man.
