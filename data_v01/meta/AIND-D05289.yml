translation:
  ja: アリ・ブン・アリ・ブン・スライマーン・ブン・アユーブ、アン＝ヌール・アル＝ファフリー。ヤシュバク・アル＝ジャマーリーが勧善懲悪（ヒスバ）職に就いていた際、ヒスバの実務を執り行った。死亡。彼にはシャムス・アッディーン・ムハンマドという息子がおり、アッ＝ディーミーに学んでいる。彼は自分がシャーフィイー派であると言い、私のところに来て、他の人々（ジャマーア）と共に少し聴聞した。
  en: Ali b. Ali b. Sulayman b. Ayyub, al-Nur al-Fakhri. He was in charge of the affairs of market supervision (hisba) when Yashbak al-Jamali held the office. He died. He had a son named Shams al-Din Muhammad, who studied under al-Daymi. He stated that he was a Shafi'i, and he attended my circle and heard a little along with the group.
