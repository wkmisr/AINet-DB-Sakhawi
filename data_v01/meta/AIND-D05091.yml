translation:
  ja: アリー・ブン・アブー・バクル・ブン・ムハンマド・ブン・ムハンマド・アル＝マナーウィー。ミニヤ・バニー・ハシーブに由来するニスバで、のちにアル＝アズハリー、アッ＝シャーフィイー（シャーフィイー派）。かつてはイブン・アル＝ムハウジャブ、現在はアル＝アズハリーとして知られる。カイロで私（サハーウィー）から聴聞した者の一人。
  en: ʿAlī b. Abī Bakr b. Muḥammad b. Muḥammad al-Manāwī, the nisbah referring to Minyat Banī Khaṣīb, then al-Azharī al-Shāfiʿī (of the Shafi'i school). He was formerly known as Ibn al-Muḥawjab and is now known as al-Azharī. He was among those who heard from me (al-Sakhāwī) in Cairo.
