translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・マフムード・ブン・アブドゥッラヒーム、アル＝バドル・ブン・アル＝ブルハーン、ハマー出自、アル＝カーヒリー、アッ＝シャーフィイー。後出のムハンマドの兄弟で、父と祖父は既出。イブン・アル＝ハマウィーの名で知られる。子どものいる男である。47年にカイロで生まれ、学問に従事し、父の後に、また父の存命中にも説教（ワアズ）の席を設けた。私にイジャーザを求め、一度ならず巡礼した。
  en: Muḥammad b. Ibrāhīm b. Maḥmūd b. ʿAbd al-Raḥīm, al-Badr b. al-Burhān, al-Ḥamawī by origin, al-Qāhirī al-Shāfiʿī, brother of the Muḥammad who will come below, and whose father and grandfather have been mentioned above; known as Ibn al-Ḥamawī. A man with children. He was born in the year 47 in Cairo, studied, and held preaching sessions after his father and during his lifetime. He asked me for an ijāza, and performed the pilgrimage more than once.
