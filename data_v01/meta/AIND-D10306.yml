translation:
  ja: ヤフヤー、ハワージャー・アル＝ジャマール・ムハンマド・ブン・アリー・ブン・アブド・アル＝アズィーズ・アッ＝ダクーキーの子、マッカの人。893年ムハッラム月に同地で没した。
  en: Yaḥyā, son of the khawājā al-Jamāl Muḥammad b. ʿAlī b. ʿAbd al-ʿAzīz al-Daqūqī, the Meccan. He died there in Muḥarram 893.
