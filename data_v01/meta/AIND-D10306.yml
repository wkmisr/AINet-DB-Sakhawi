  note:
    ja: '規則3・37。見出し「يحيى بن الخواجا الجمال محمد بن علي بن عبد العزيز الدقوقي المكي」＝#AIND-D08110「محمد بن علي بن عبد العزيز بن علي بن عبد الكافي الجمال الدقوقي المكي أخو عبد العزيز الماضي . ولد بمكة تقريبا سنة خمس وتسعين وسبعمائة … وأثرى وكثر ماله … ومات بها في ليلة الجمعة سابع عشري ربيع الأول سنة ستين」（repo 未収録）。ナサブ3代＋ラカブ الجمال＋ニスバ2つで閉合（ニスバ索引 #AIND-D11643「الدقوقي … محمود والجمال محمد ابنا علي بن عبد العزيز بن عبد الكافي وابن ثانيهما أبو بكر」、甥の項 #AIND-D05228「ابن أخي الخواجا الجمال محمد الآتي」）。ブリーフに候補番号なし＝自分で引いた。初版は father relation なし。'
notes:
- text: '見出しの「الخواجا」「الجمال」は父の称号・ラカブ＝persName full から外した（初版は full に含めていた）。兄弟 #AIND-D10841「أبو بكر بن محمد بن علي بن عبد العزيز بن عبد الكافي الفخر بن الخواجا جمال الدين الدقوقي المكي الماضي أبوه」は本項・相手項とも名指しがない＝relation を立てない（父が AIND で共通、規則23）。'
