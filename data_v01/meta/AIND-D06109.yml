translation:
  ja: イーサー・アル＝アンサーリー・アル＝ミスリー・アル＝ハナフィー、書法教師、マッカの寄留者。イブン・スィッディークとアブー・アル＝ヤマン・アッ＝タバリーらから聴聞した。信仰篤く善良な人物で、書法に励んでこれに秀で、神のために無償でこれ（の教授）に当たったので、マッカの人々の多くが彼から益を得た。若くして〔8〕07年にミスルで没した。アッ＝タキー・ブン・ファハドがその『ムウジャム』で彼に言及し、父の名をスライマーン・ブン・アブドゥッラーとしている。
  en: ʿĪsā al-Anṣārī al-Miṣrī al-Ḥanafī, the writing teacher, resident of Mecca. He heard from Ibn Ṣiddīq, Abū al-Yaman al-Ṭabarī, and others. He was a religious, good man who practised calligraphy and excelled in it, and devoted himself to it (teaching it) for God's sake without pay, so that a great many of the people of Mecca benefited from him. He died young in Miṣr in the year [8]07. Al-Taqī b. Fahd mentioned him in his Muʿjam and gave his father's name as Sulaymān b. ʿAbd Allāh.
