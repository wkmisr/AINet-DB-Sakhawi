notes:
- text: '末尾「وأظنه المذكور في نابت بن نعير」＝「نابت بن نعير の項（イブン・ハジャル『إنباء』の同項と解される）で言及されている者は本項主だと思う」。corpus に「نابت بن نعير」の立項はない。「نابت」は「ثابت」の点の揺れ（ن/ث）の可能性があり（規則25 により訳は原文どおり）、候補は #AIND-D02326「ثابت بن نعير بن منصور بن جماز بن شيخة الحسيني أمير المدينة … ومات سنة احدى عشرة」の項（イブン・ハジャル『إنباء』の同人の記事）中の言及、または #AIND-D03401「ضغيم بن خشرم بن ثابت بن نعير」のナサブ中の「خشرم بن ثابت بن نعير」。人物の項への同定ではなく記事中の言及の同定なので possible_identity は立てず note に留める（ISSUES §D135-6。集約 2026-10-26 で内容A M-3 により、根拠のなかった「兄弟 ثابت بن نعير とは別人」の記述を改めた）。'
