translation:
  ja: ハシュラム・ブン・ドゥーガーン・ブン・ジャアファル・ブン・ヒバ・ブン・ジャンマーズ・ブン・マンスール・ブン・ジャンマーズ・ブン・シーハ・アル＝フサイニー。前述のハイダラの兄弟。我らの師（イブン・ハジャル）がその『インバー』のアジュラーン・ブン・ヌアイルの項で述べているとおり、832年に殺された。ナービト・ブン・ヌアイル（の項）で言及されている者は彼だと私は思う。
  en: Khashram b. Dūghān b. Jaʿfar b. Hiba b. Jammāz b. Manṣūr b. Jammāz b. Shīḥa al-Ḥusaynī, brother of the aforementioned Ḥaydara. He was killed in the year 832, as our shaykh mentioned in the entry on ʿAjlān b. Nuʿayr in his Inbāʾ; and I think he is the one mentioned under Nābit b. Nuʿayr.
