translation:
  ja: ハサン・ブン・アリー・ブン・ナースィル・アル＝ヒジャーズィー。後述のフサインの兄弟（二人の父も後述）。父親と同様に「イブン・ナースィル」として知られる。メッカで私（サハーウィー）から聴聞した者の一人であり、父と同じく大胆に、モスク（ハラーム・モスク）の一角の椅子に座って一般民衆（アーンマ）に（書物を）読み聞かせていた。
  en: Ḥasan b. ʿAlī b. Nāṣir al-Ḥijāzī, the brother of Ḥusayn and their father, both of whom are mentioned below. Like his father, he was known as Ibn Nāṣir. He was among those who heard from me in Mecca. Following his father's bold example, he used to read to the common people while seated on chairs in the mosque.
