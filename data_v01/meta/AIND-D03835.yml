translation:
  ja: アブドゥルラフマーン・アッ＝ザイン・アッ＝ディマシュキー・アル＝ハリーリー・アッ＝シャーフィイー。タキー・アッ＝ディーン・イブン・カーディー・アジュルーンに師事したスーフィーの一人。アル＝バドリーがその詩文集（マジュムーア）に彼の次の詩句を書き留めている：『私のもてなしは、その多様な姿において私に優っていた / そのお方に仕える者が私を彼の席へと促した、私が彼の席に憧れて立ち上がった時に』
  en: 'Abd al-Rahman al-Zayn al-Dimashqi al-Hariri al-Shafi''i. One of the Sufis who studied under (and constantly accompanied) al-Taqi Ibn Qadi Ajlun. Al-Badri copied his poetry in his compilation (Majmūʿ al-Badrī): ''My seating arrangements surpassed me in their various forms / How many times did a cupbearer of his urge me, when I stood yearning for his seat.'''
