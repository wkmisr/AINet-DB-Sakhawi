translation:
  ja: ファーリス・アル＝ムハンマディー・アッ＝ルクニー、（主人は）ナーイブ・アル＝ムカッダムのファイルーズ。864年サファル月、アル＝アフナースィーの二子の逃亡後に宰相職（ウィザーラ）に就いたが、3日在職しただけでマンスール・イブン・サフィーに交代させられた。アスターダール職その他にも内定したが実現しなかった。アル＝アシュラフ・カーイトバーイに近づき、ハワンド・アル＝クブラー付きのラアス・ナウバと結婚した。
  en: Fāris al-Muḥammadī al-Ruknī, (mamlūk of) Fayrūz the nāʾib al-muqaddam. He was appointed to the vizierate in Ṣafar of the year 864 after the two sons of al-Ahnāsī went into hiding, but remained only three days before being replaced by Manṣūr Ibn Ṣafī. He was designated for the ustādāriyya and other posts, but it did not come about. He drew close to al-Ashraf Qāytbāy and married the raʾs nawba of Khawand al-Kubrā.
