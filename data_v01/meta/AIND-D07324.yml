translation:
  ja: ムハンマド・ブン・アビー・アル＝ハッジャージ（その名はユースフ）・ブン・ムハンマド・ブン・ユースフ、アスユート出身、アル＝カーヒリー、アッ＝シャーフィイー。父は後出。851年ラマダーン月14日の夜にカイロで生まれ、同地で父の庇護のもとに育ち、クルアーン、ナワウィーの『四十ハディース』、『バフジャ』、文法学の『アルフィーヤ』などを暗記した。多くの学者に（暗記を）提示し、文法学をハラド（ハーリド）・アル＝ワッカードから、法学をアル＝ジャウジャリーから学んだ。父のもとで（証人の）業務の訓練を受け、ハナフィー派（カーディー）の法廷に座った。マフマル付き証人であった父とともにハッジを行い、856年には幼少の身で父とともにマッカにおり、父は彼を私の朗読の場に少しばかり出席させた。彼は理知的で気の利く人物である。
  en: Muḥammad b. Abī al-Ḥajjāj (whose name is Yūsuf) b. Muḥammad b. Yūsuf, of Asyūṭī origin, al-Qāhirī, al-Shāfiʿī; his father is mentioned below. He was born on the night of 14 Ramaḍān 851 in Cairo and grew up there under his father's care. He memorised the Qurʾān, al-Nawawī's Forty Ḥadīths, al-Bahja, the Alfiyya on grammar and other works, and presented them to a number of scholars. He took grammar from Khalad (Khālid) al-Waqqād and jurisprudence from al-Jawjarī. He was trained by his father in the profession (of notary-witness) and sat at the Ḥanafī (judge's) court. He performed the pilgrimage with his father, the witness of the maḥmal, and was with him in Mecca in the year 856 while still a boy, when his father had him attend a little at my recitation. He is intelligent and clever.
