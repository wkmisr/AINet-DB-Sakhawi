translation:
  ja: アハマド・アル＝クラシー：私は彼を知らなかったが、彼がファトフ・アル＝ディーン・アル＝ムハッラキーを称賛する詩を詠んだのを見た。その冒頭は次の通りである：「おお胸よ、あなたの愛は私の中に遍く巡り／あなたの幻さえも夢の中に私を訪れる」。
  en: 'Aḥmad al-Qurashī: I did not know him, but I saw a poem by him in which he praised Fatḥ al-Dīn al-Muḥarraqī, the beginning of which is: ''O heart, your love is circulating throughout me / Until your phantom visits me in my dream.'''
