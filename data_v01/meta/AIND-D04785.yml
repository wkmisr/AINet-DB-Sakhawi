translation:
  ja: アブドゥルワッハーブ・ブン・ムハンマド・ブン・イブラーヒーム・ブン・アビー・バクル、タージュ・アッ＝ディーン、アル＝ハリーリー、ムワッキト（礼拝時刻計算員）。前出のアブドゥルアズィーズの父。〔8〕74年に没した――彼の息子が私に語ったところによる。
  en: ʿAbd al-Wahhāb b. Muḥammad b. Ibrāhīm b. Abī Bakr, Tāj al-Dīn al-Khalīlī, the muwaqqit (timekeeper), father of ʿAbd al-ʿAzīz, mentioned above. He died in the year [8]74, according to what his son told me.
