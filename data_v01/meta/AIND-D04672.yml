  en: ʿAbd Allāh al-Dhākir. He came from al-Rūm and settled in Damascus; people held him in devout esteem, and disciples took the Sufi path under him, such as Abū Bakr b. ʿAbd Allāh al-ʿAddās. He died in the year 811.
