translation:
  ja: アブドゥルガニー・ブン・アブドゥッラー・ブン・ムハンマド、アッ＝タージュ・アル＝アミユーティー・アル＝カーヒリー。公証書記（ムワッキウ）のアン＝ナジュム・ブン・アン＝ナビーフの親族で、イブン・アル＝アアマー（盲人の子）として知られた。881年ラビーウ・アル＝アウワル月の末日に没し、100歳に迫っていた。長年、死ぬまでバーブ・アル＝フトゥーフの店で証人（シャーヒド）業により生計を立てており、そこでの彼については善いことしか伝えられていない。神の慈悲あれ。
  en: ʿAbd al-Ghanī b. ʿAbd Allāh b. Muḥammad, al-Tāj al-Amyūṭī al-Qāhirī, a relative of al-Najm b. al-Nabīh the notary (al-muwaqqiʿ), known as Ibn al-Aʿmā. He died on the last day of Rabīʿ I 881, having nearly reached a hundred. For a long time until his death he earned his living as a professional witness (shāhid) at a shop at Bāb al-Futūḥ, and nothing but good was reported of him there. May God have mercy on him.
