translation:
  ja: アリー・ブン・ムハンマド・ブン・アラブ、アル＝アラー・アル＝カーヒリー、カーディーのアル＝カマール・アッ＝トゥルクマーニーの外孫。我らがシャイフ（イブン・ハジャル）は『インバー』で言う。「いくつかの地方で裁判代理を務め、さらには軍カーディー職に就いた。（80）2年サファル月に没した」。
  en: 'ʿAlī b. Muḥammad b. ʿArab, al-ʿAlāʾ al-Qāhirī, the daughter''s son of the qāḍī al-Kamāl al-Turkumānī. Our shaykh (Ibn Ḥajar) said in his Inbāʾ: "He served as deputy judge in some provinces, and indeed held the office of qāḍī al-ʿaskar (army judge); he died in Ṣafar of the year [80]2."'
