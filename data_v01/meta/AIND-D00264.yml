translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・アビー・バクル・ブン・アル＝ハーズィン。イブン・アズムは彼をヒジュラ暦846年の項でこのように記しており、私（＝サハーウィー）は彼が後述の「アフマド・ブン・ムハンマド・ブン・アビー・バクル・ブン・アフマド・ブン・アル＝ハーズィン」であると考えている。
  en: Ibrāhīm b. Muḥammad b. Abī Bakr b. al-Khāzin. Ibn ʿAzm mentioned him in this manner in the year 846 H. I (al-Sakhāwī) believe him to be Aḥmad b. Muḥammad b. Abī Bakr b. Aḥmad b. al-Khāzin, who will be mentioned later.
