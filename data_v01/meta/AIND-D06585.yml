  note:
    ja: '「وأظنه الشطنوفي」＝サハーウィー自身の推測（أظنه＝cert medium）。الشطنوفي＝#AIND-D06512「889 محمد بن إبراهيم بن عبد الله أو أبو بكر ووجدته بخطه ولعلها كنية عبد الله الشمس الشطنوفي ثم القاهري الشافعي والد أحمد الماضي … ولد بعد الخمسين وسبعمائة بشطنوف … مات في ليلة الاثنين سادس عشري ربيع الأول سنة اثنتين وثلاثين」（repo 未収録）。名・父名・シャーフィイー派が合い、802年の عرض に書き付ける年代（当時50歳前後）とも整合する。corpus 見出しで「محمد بن إبراهيم」＋「الشطنوفي」の本伝はこの1件（ほかは転送見出し #AIND-D06493・#AIND-D06586）。本項に転送指示はなく二重立項型＝実項のまま（絶対基準）。D06512 側の鏡像は同項の受領時。'
