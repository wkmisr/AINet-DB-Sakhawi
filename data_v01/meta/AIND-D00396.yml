translation:
  ja: イブラーヒーム・アッ＝サルマースィー、スーフィー。イブン・アル＝バッカールとして知られる。スーフィズムにおいて彼から益を得た者の中にイブン・アッ＝シャンマーウがおり、彼を大いに崇め、「わが主、わが導師、被造物の導き手、真理の父、シャイフ、イマーム、完全なる模範、信仰と宗教の証（ブルハーン・アル＝ミッラ・ワ・ッディーン）」と形容した。また彼（イブン・アッ＝シャンマーウ）は、彼（イブラーヒーム）が精査者イマード・アッディーン・イスマーイールから、彼は高位のイマーム、アブドゥッラフマーン・ブン・イスマーイールから、彼は神秘家アブー・アル＝アッバース・アフマド・アル＝クールバールから、彼はシャイフ・ラーラーとマジュド・アル＝バグダーディーから、彼はナジュム・アル＝クブラーから受けたと述べた。以上。これには精査が必要である。彼はまた、本項の人物が百歳まで生きたシャイフ・アブドゥッラー・アル＝アジャミーから受け、彼はシャイフ・アブドゥルカーディル・アル＝ジーリーから受けたとも述べたが、これはハディース学者の依拠しないものである。
  en: Ibrāhīm al-Salmāsī al-Ṣūfī, known as Ibn al-Baqqāl. Among those who benefited from him in Sufism was Ibn al-Shammāʿ, who revered him greatly and described him as "my master and my guide, the guide of creation, the father of truth, the shaykh, the imam, the perfect exemplar, the proof of the faith and the religion (Burhān al-Milla wa-l-Dīn)." He said that he (Ibrāhīm) took from the verifier ʿImād al-Dīn Ismāʿīl, from the imam of lofty rank ʿAbd al-Raḥmān b. Ismāʿīl, from the gnostic Abū al-ʿAbbās Aḥmad al-Kūrbār, from al-Shaykh Lālā and al-Majd al-Baghdādī, from al-Najm al-Kubrā. End [of quotation]. This requires verification. He also said that the subject of this entry took from al-Shaykh ʿAbd Allāh al-ʿAjamī, who lived a hundred years, and he from al-Shaykh ʿAbd al-Qādir al-Jīlī, which is something that the scholars of ḥadīth do not rely upon.
