    ja: '「ممن انتفع به في التصوف ابن الشماع」＝本項主が師（active）、規則15。ابن الشماع ＝ #AIND-D08910a「محمد بن محمد بن علي … الشمس المجاهدي الأيوبي … الحموي ثم الحلبي الشافعي الصوفي ويعرف بابن الشماع . ولد في مستهل سنة إحدي وتسعين وسبعمائة بحماة … وصحب البرهان السلماسي الشهير بابن البقال بالقاهرة وأخذ عنه طريق القوم وذلك في رمضان سنة ثلاث وثمانمائة وقال انه أخذ بتبريز في سنة ثلاث وأربعين وسبعمائة عن الجمال عبد الله العجمي … الذي قيل انه عمر مائة سنة … وأن أول شيء دخل جوفه ريق الشيخ عبد القادر الكيلاني」（863没、repo 収録済み。D08910a 側は本項主を teacher n=8 として #AIND-D00396 に既に結んでいる）。ニスバ・通称・スーフィー伝授・عبد الله العجمي→عبد القادر الجيلي の系譜の一致で閉合（規則57）。ブリーフの候補 #AIND-D06812（ابن الشماع القاهري الحنفي القادري）は別人（規則60(h) で本文を確認）。もう一人の #AIND-D08524（الدمشقي ابن الشماع）も別人。初版の TMP-P-001425（太田氏「ابن الشماع」）を置換＝名寄せ要（ISSUES §D159-6）。伝授の場所（القاهرة）・年（803年ラマダーン）は D08910a 側の情報なので属性にしない（規則23）。'
