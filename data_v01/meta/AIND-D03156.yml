translation:
  ja: スライマーン・ブン・アリー・ブン・アフマド、カーディー、ナフィース・アッ＝ディーン、アブー・アッ＝ラビーウ、アル＝クラシー・アル＝ヤマニー。アル＝ジュナイド、またはイブン・アル＝ジュナイドとして知られる。我らがシャイフ（イブン・ハジャル）は『インバーゥ』で、彼がイブン・シャッダードらから聴聞したこと、一時期アデンのカーディー職を務め「私（イブン・ハジャル）は彼をそこで見た」こと、そして（8）21年に同地で没したことを述べている。アッ＝タキー・ブン・ファハドも『ムウジャム』で同じ没年を記しているが、（没地は）ザビードとしている。
  en: Sulaymān b. ʿAlī b. Aḥmad, the qāḍī Nafīs al-Dīn Abū al-Rabīʿ al-Qurashī al-Yamanī, known as al-Junayd or Ibn al-Junayd. Our shaykh (Ibn Ḥajar) said in his Inbāʾ that he heard from Ibn Shaddād and others, that he held the judgeship of Aden for a period—"I (Ibn Ḥajar) saw him there"—and that he died there in the year [8]21. Al-Taqī b. Fahd likewise recorded his death date in his Muʿjam, but (placed it) in Zabīd.
