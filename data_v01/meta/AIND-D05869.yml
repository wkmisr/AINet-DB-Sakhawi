translation:
  ja: ウマル・ブン・アブド・アル＝アズィーズ・ブン・アブド・アッ＝サラーム・ブン・ムーサー、アッ＝シラージュ・アル＝マッキー・アッ＝ザムザミー。後述のムハンマドの兄弟。クルアーンを暗記した者の一人で、カイロ、シャーム、イエメンへ旅し、兄弟と同じく詩作がある。893年ラジャブ月、私（サハーウィー）がマッカにいたときに没した。
  en: ʿUmar b. ʿAbd al-ʿAzīz b. ʿAbd al-Salām b. Mūsā, al-Sirāj al-Makkī al-Zamzamī, the brother of Muḥammad, mentioned below. He was among those who memorised the Qurʾān; he travelled to Cairo, Syria and Yemen, and composed poetry like his brother. He died in Rajab of the year 893 while I (al-Sakhāwī) was in Mecca.
