translation:
  ja: アークバルディー・アル＝ムアイヤディー・アル＝ミンカール。彼の師が存命の当時、高位のムカッダム（地位の高い者）の一人であった。820年サファル月にダマスクスで没した。彼の伝記はあまり賞賛されるものではなかった。我らがシャイフ（イブン・ハジャル）は彼の伝記を『インバーア』の中で簡潔に記している。
  en: Aqbardī al-Muʾayyadī al-Minqār. He was one of the prominent figures during the days of his master. He died in Damascus in Safar of the year 820 AH. His biography was not commendable. Our shaykh (Ibn Ḥajar) mentioned him briefly in his 『Inbāʾ』.
