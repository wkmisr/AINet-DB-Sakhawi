translation:
  ja: ハサン・ブン・イブラーヒーム・アッ＝スィー。ヒスン・カイファーの人。我らがシャイフ（イブン・ハジャル）はその『ムウジャム』の中で、彼が同地（ヒスン・カイファー）のための歴史書を編纂したこと、そして820年代に自分（イブン・ハジャル）宛てにその一部を書き送ってきたことを述べている。
  en: Ḥasan b. Ibrāhīm al-Sī, from the people of Ḥiṣn Kayfā. Our shaykh (Ibn Ḥajar) said in his muʿjam that he compiled a history for it (Ḥiṣn Kayfā) and wrote some of it to him (Ibn Ḥajar) in the [8]20s.
