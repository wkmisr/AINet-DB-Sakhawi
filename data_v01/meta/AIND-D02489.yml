translation:
  ja: ハビーブ・ブン・ユースフ・ブン・サーリフ・ブン・ムハンマド・アル＝キラーニー、カイロ出身シャーフィイー派のクルアーン朗誦家。 アッ＝タージュ・ブン・タムリーヤのもとで朗誦を学び、自らも朗誦を教えた。バルスバーイのアシュラフィーヤ（・マドラサ）でスーフィー職にあり、ジャアファルのいくつかの著作に賛辞（タクリーズ）を書いた。
  en: Ḥabīb b. Yūsuf b. Ṣāliḥ b. Muḥammad al-Kīlānī, from Cairo, a Shafi'i Qur'an reciter. He studied recitation under al-Tāj b. Tamurīya and also taught recitation himself. He was a Sufi at al-Ashrafiyya Barsbāy and wrote commendations (taqrīẓ) on some of Jaʿfar's works.
