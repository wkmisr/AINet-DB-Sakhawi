translation:
  ja: アリー・ブン・サラーマ。父の名がアフマド・ブン・ムハンマド・ブン・サラーマである者たちの項にあり、祖父（サラーマ）に帰して呼ばれたものである。
  en: ʿAlī b. Salāma. [His entry is] among those whose father's name is Aḥmad b. Muḥammad b. Salāma; he was named after his grandfather.
