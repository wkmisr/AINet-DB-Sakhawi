notes:
- text: '「فيمن اسم أبيه أحمد بن محمد بن سلامة نسب لجده」＝転送見出し。転送先は #AIND-D05027（علي بن أحمد بن محمد بن سلامة بن عطوف بن يعلى النور أبو الحسن السلمي المكي الشافعي ويعرف بابن سلامة、746年メッカ生）。父名 أحمد بن محمد بن سلامة が一致し、通称「ابن سلامة」＝祖父名への帰属（نسب لجده）とも符合。corpus の「علي بن أحمد بن محمد بن سلامة」見出しは D05027 のみで一意。'
