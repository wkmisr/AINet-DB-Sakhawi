translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラフマーン・ブン・ムハンマド・ブン・アフマド・ブン・ハリーフ・アル＝マタリー。アル＝ムヒッブ・アル＝マタリー・アル＝マダニーの従兄弟。彼（アル＝ムヒッブ）とともにアル＝ジャマール・アル＝ハンバリーから聴聞した。
  en: ʿAbd Allāh b. Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. Aḥmad b. Khalīf al-Maṭarī, the paternal cousin of al-Muḥibb al-Maṭarī al-Madanī. Together with him he heard from al-Jamāl al-Ḥanbalī.
