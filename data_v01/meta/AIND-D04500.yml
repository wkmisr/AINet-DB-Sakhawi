translation:
  ja: アブドゥッラー・ブン・アリー・ブン・アフマド・ブン・アブドゥルアズィーズ、アブー・バクル、アン＝ヌワイリー、アル＝マッキー。ヒジュラ暦791年およびそれ以降に、一団の人々が彼にイジャーザを与えた。ある証書に記された彼の自筆によれば、813年には存命であった。イブン・ファハドがそう述べている。
  en: ʿAbd Allāh b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz Abū Bakr al-Nuwayrī al-Makkī. A group of scholars granted him ijāza in the year 791 and thereafter. He was still alive in the year 813, according to his handwriting on a deed of testimony. So says Ibn Fahd.
