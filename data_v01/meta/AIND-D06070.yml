translation:
  ja: イーサー・ブン・アフマド・ブン・ヤフヤー、アブー・マフディー・アル＝グブリーニー・アル＝マーリキー。チュニスのカーディーにしてその学者。アフマド・ブン・ムハンマド・アル＝カルジャーニーや、アル＝アジーシーのようなその他の者たちが彼から学んだ。のみならずアル＝ブルズリーはそのファトワー集において彼から引用し、彼を「我らの仲間」と評している。（8）16年に没した。
  en: ʿĪsā b. Aḥmad b. Yaḥyā, Abū Mahdī al-Ghubrīnī al-Mālikī, qāḍī of Tunis and its scholar. Among those who studied under him were Aḥmad b. Muḥammad al-Qaljānī and others such as al-ʿAjīsī; moreover, al-Burzulī quoted him in his Fatāwā and described him as "our companion". He died in the year (8)16.
