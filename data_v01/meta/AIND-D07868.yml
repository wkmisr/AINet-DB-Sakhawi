translation:
  ja: ムハンマド・ブン・アブドゥッラー、ナースィルッディーン・アル＝マハッリー・アッ＝シャーフィイー、マッカ在住。アル＝ファースィーが彼に言及して言う。「思うに彼は『ミンハージュ』（法学）を暗記していた。というのも彼はその中の諸問題を論じ合っていたからである。証人業と証書作成に携わり、アル＝マハッラ・アル＝クブラーのいくつかの管区で、そのカーディーで彼の姻戚であるアル＝イッズ・ブン・スライムの代理を務めた。同様に商業にも携わり、そのために何度もアデンへ往来した。マッカに長年、マディーナに数か月滞在（ジャーワラ）した。マッカからワーディー・アッ＝ターイフを目指して出発したが、乗っていた駱駝から落ち、マッカへ運ばれたものの到着する前に没した。アル＝アブタフで湯灌され、アル＝マアラーに埋葬された。それは（8）20年の二つのラビーウ月のいずれかのことで、思うに彼は70歳に達していた。彼には信仰心と善良さがあった。」
  en: 'Muḥammad b. ʿAbd Allāh, Nāṣir al-Dīn al-Maḥallī al-Shāfiʿī, resident of Mecca. Al-Fāsī mentioned him and said: I think he had memorized the Minhāj (of law), for he used to discuss questions from it. He practised notarial witnessing and the drawing up of documents, and acted as deputy in some of the districts of al-Maḥalla al-Kubrā for its qāḍī, his relative by marriage al-ʿIzz b. Sulaym. He likewise engaged in trade and travelled to Aden several times for it. He sojourned in Mecca for many years and in Medina for some months. He set out from Mecca for Wādī al-Ṭāʾif, fell from the camel he was riding, and was carried back to Mecca but died before reaching it. He was washed at al-Abṭaḥ and buried at al-Maʿlā; that was in one of the two Rabīʿ months of the year [8]20, and I think he had reached seventy. He had piety and goodness.'
