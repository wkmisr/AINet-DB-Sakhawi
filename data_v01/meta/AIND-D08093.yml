translation:
  ja: ムハンマド・ブン・アリー・ブン・サラーフ、アッ＝シャムス・アッ＝サカンダリー・アル＝ハリーリー。物静かで善良、上品で聡明な人物であり、困窮を忍び足るを知りつつ、ガムリー・モスクでの集団礼拝と口述筆記（イムラー）の集会に常に通っていた。880年の少し後に没した。70歳を越えていたと私は思う。アッラーの慈悲があらんことを。
  en: Muḥammad b. ʿAlī b. Ṣalāḥ, al-Shams al-Sakandarī al-Ḥarīrī. He was quiet, good, refined and intelligent, constantly attending the congregational prayer at the Jāmiʿ al-Ghamrī and the dictation assembly, while swallowing poverty and living contentedly. He died shortly after [8]80, and I think he had passed seventy. May God have mercy on him.
