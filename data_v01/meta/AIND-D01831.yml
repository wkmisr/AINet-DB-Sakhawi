translation:
  ja: 881年に亡くなったアフマド・アル＝マシュリキー・アル＝ガッズィーは、「イブン・アル＝アクラム」として知られ、聖者の一人であった。故郷では奇跡で知られ、人々から厚い信仰を集めていた。家族や財産を持たず、ヒジュラ暦881年ムハッラム月に故郷で亡くなった。町の代官が降りてきてハークル廟で彼のために葬儀の祈りを捧げた。
  en: Aḥmad al-Mashriqī al-Ghazzī, known as Ibn al-Akram, who died in 881 H, was one of the Majdhūb known in his hometown for miracles, and its people had great faith in him. He had no family or wealth. He died there in Muharram of the year 881 H. The town's deputy came down and performed the funeral prayer for him at Mashhad Ḥāqil.
