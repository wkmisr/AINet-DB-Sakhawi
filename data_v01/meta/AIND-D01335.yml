translation:
  ja: アハマド・ブン・ムハンマド・ブン・タッラダーイ、シャハーブッディーン・アル＝バースィティー。ハナフィー派のクルアーン朗誦教師で、アブドゥルバースィト地区に居住していたことからドゥクマクとして知られる。私（＝サハーウィー）に『アッ＝シファー』などをわずかな期間師事し、アル＝ザイン・ジャアファル・アッ＝サンフーリにクルアーン朗誦を学び、次にアッ＝ナーシリー・アル＝アキミイに学び、アッ＝シャーティビーヤを暗記した。また、もしかするとアラビア語学にも携わったかもしれないが、私は彼を称賛しない。
  en: Aḥmad b. Muḥammad b. Ṭallādāy, Shihāb al-Dīn al-Bāsṭī, a Ḥanafī Qurʾān reciter known as Dukmāq, due to his residence in Ḥārat ʿAbd al-Bāsiṭ. He accompanied me (al-Sakhāwī) for a short period while studying 『al-Shifāʾ』 and other works. He studied Qurʾān recitation with al-Zayn Jaʿfar al-Sanhūrī, and then with al-Nāṣirī al-Akhmīmī, memorizing 『al-Shāṭibiyya』. He may also have been involved in Arabic language studies, but I do not praise him for that.
