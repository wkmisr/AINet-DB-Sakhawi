translation:
  ja: アブドゥルアズィーズ・ブン・アリー・ブン・アビー・アル＝バラカート・ムハンマド・ブン・アビー・アッ＝スウード・ムハンマド・ブン・フサイン・イブン・アリー・ブン・アフマド・ブン・アティーヤ・ブン・ザヒーラ、アル＝イッズ・アル＝クラシー・アル＝マッキー。ヒジャーズの学者アル＝ブルハーンとその兄弟たちの同母兄弟。先祖と同じくイブン・ザヒーラとして知られる。827年に没し、その前年に生まれた。
  en: ʿAbd al-ʿAzīz b. ʿAlī b. Abī al-Barakāt Muḥammad b. Abī al-Suʿūd Muḥammad b. Ḥusayn b. ʿAlī b. Aḥmad b. ʿAṭiyya b. Ẓahīra, al-ʿIzz al-Qurashī al-Makkī. He was the full brother of al-Burhān, the scholar of the Ḥijāz, and of his brothers, and like his ancestors was known as Ibn Ẓahīra. He died in the year 827 AH, having been born in the preceding year.
