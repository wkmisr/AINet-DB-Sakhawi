translation:
  ja: フシュカルディー・アル＝アラミー。我らがシャイフ（イブン・ハジャル）のもとで『サヒーフ』の全部あるいはその一部を読んだ。それは私がアル＝ムアイヤディーヤにある写本中の、シャイフ自筆の読了記録（バラーガート）で見たとおりであり、シャイフは彼を「アミール」と記していた。
  en: Khushkaldī al-ʿAlamī. He read the Ṣaḥīḥ, or part of it, before our shaykh (Ibn Ḥajar), as I saw in the reading-completion notes (balāghāt) in his (Ibn Ḥajar's) hand in a copy kept at al-Muʾayyadiyya, where he described him as "the amīr".
