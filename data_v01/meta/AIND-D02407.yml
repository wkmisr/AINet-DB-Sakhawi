translation:
  ja: ジャルバーシュ・アル＝アシュラフィー・バルスバーイ。アル＝アシュラフ・バルスバーイの治世にはハーッサキー（親衛マムルーク）であったが、その後、その子アル＝アズィーズ（ユースフ）によって十人長（アミール・アシャラ）に任じられた。次いでアッ＝ザーヒル・ジャクマクによってガザのアターベク職へと出され、852年に同地で没した。彼は悪くない人物であった。
  en: Jarbāsh al-Ashrafī Barsbāy. In the days of (al-Ashraf Barsbāy) he was a khāṣṣakī (royal guard mamluk); then Barsbāy's son al-ʿAzīz appointed him amir of ten; then al-Ẓāhir Jaqmaq sent him out to the atābakiyya of Gaza, and he died there in the year 852. He was a decent enough man (lā baʾsa bihi).
