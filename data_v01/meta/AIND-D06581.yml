notes:
- text: '転送見出し（原文「مضى فيمن جده علي بن المرتضى」による）。転送先は #AIND-D06532「906 محمد بن إبراهيم بن علي بن المرتضى بن الهادي بن يحيى … العز أبو عبد الله الحسني اليماني الصنعاني أخو الهادي الآتي . ولد تقريبا سنة خمس وستين وسبعمائة … ومات في المحرم سنة أربعين」（repo 未収録）。名・父名・祖父「علي بن المرتضى」・ラカブ العز・ニスバ الحسني が一致。corpus 見出しで「المرتضى」をナサブに持つ محمد بن إبراهيم はこの1件（hwm.py。弟 #AIND-D10160 الهادي بن إبرهيم بن علي بن المرتضى は別人）。'
