translation:
  ja: サイード・アル＝ハバシー。イブラーヒーム・ブン・ムスリフ・アル＝イラーキーの解放奴隷。882年ムハッラム月にマッカで没した。彼もまたタハリール（声高な唱名）を行っており、ときにそれを非難された。
  en: Saʿīd al-Ḥabashī, the freedman of Ibrāhīm b. Muṣliḥ al-ʿIrāqī. He died in Mecca in Muḥarram of the year 882. He too used to perform the tahlīl (loud chanting of the formula of divine unity), and was sometimes censured for it.
