  note:
    ja: '「عتيق إبراهيم بن مصلح العراقي」＝主人（規則51、عتيق＝patron）。#AIND-D00312「إبراهيم بن محمد بن مصلح بن إبراهيم برهان الدين العراقي الأصل المكي المولد والدار الشافعي والد أبي بكر وغيره ويعرف أولا بالسقا ثم بالعراقي . ولد في سنة ثلاث عشرة وثمانمائة بمكة … تعاني التجارة … مات بمكة … سنة أربع وسبعين」（未収録）。ナサブは「إبراهيم بن مصلح」と1段省かれるが（規則38）、祖父名 مصلح・通称 العراقي・マッカ在住・年代（主人 874 没、解放奴隷 882 没）で閉合（規則57）。初版の #NEEDID を置換。'
  norm: ابراهيم بن مصلح العراقي
notes:
- text: '「وكان أيضا يهلل وربما أنكر عليه」＝（次項 #AIND-D03116「سعيد المغربي المهلل」と同じく）タハリール（声高な「لا إله إلا الله」の唱和）を行い、しばしば非難された。「أيضا」は隣接項との共通点を示す語で relation ではない。職・state にはしない（note のみ）。'
