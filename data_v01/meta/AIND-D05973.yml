translation:
  ja: ウマル・ブン・ムハンマド・ブン・ムハンマド・ブン・スライマーン・ブン・アビー・バクル、アッ＝ザイン・ブン・ナースィル・アッ＝ディーン、アル＝バクリー、アッ＝ディマシュキー。アル＝アラー・アリー・ブン・アフマド・ブン・ムハンマドのいとこで、二人ともイブン・アッ＝サーブーニーとして知られる。アッ＝ザーヒル・フシュカダムによってダマスクス城塞と城壁などの監督職（ナザル）に任じられた者の一人で、いとこのアル＝アラーの代理として軍務監督職（ナザル・アル＝ジャイシュ）を務めた。商人であった。彼は、私に暗記書を提示した少年アン＝ナジュム・ムハンマドの父であり、その子が私に、父は884年頃にダマスクスで没したと語った。
  en: ʿUmar b. Muḥammad b. Muḥammad b. Sulaymān b. Abī Bakr, al-Zayn b. Nāṣir al-Dīn al-Bakrī al-Dimashqī, cousin of al-ʿAlāʾ ʿAlī b. Aḥmad b. Muḥammad, both of them known as Ibn al-Ṣābūnī. He was among those whom al-Ẓāhir Khushqadam appointed to the supervision (naẓar) of the citadel of Damascus, the walls and other things, and he deputized for his cousin al-ʿAlāʾ in the supervision of the army. He was a merchant, and he is the father of the boy al-Najm Muḥammad who presented his memorized texts to me and told me that his father died around the year 884 in Damascus.
