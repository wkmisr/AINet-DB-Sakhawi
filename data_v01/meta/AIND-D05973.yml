    ja: '「وهو والد الولد النجم محمد الذي عرض على محافيظه وقال لي أن أباه مات …」。息子 ＝ #AIND-D08362「محمد بن عمر بن محمد بن محمد بن سليمان النجم أبو الفضل بن الزين البكري الدمشقي ثم القاهري الشافعي الماضي أبوه … عرض علي وهو … ابن ثلاث عشرة سنة في رمضان سنة ست وتسعين … ولم يلبث أن مات بالطاعون سنة سبع وتسعين」（本項主を「الماضي أبوه」と名指し）。「عرض على」＝「عرضَ عليَّ」（私＝サハーウィーに暗記書を提示した）で、息子の行為のため本項主の event にはしない。初版の TMP-P-000095（登録実体＝別人 AIND-D0036 の息子 النجم محمد）を差し替え。'
