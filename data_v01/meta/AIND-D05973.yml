    ja: '「ابن عم العلاء علي بن أحمد بن محمد ويعرف كل منهما بابن الصابوني」。いとこ ＝ #AIND-D05028「علي بن أحمد بن محمد بن سليمان بن أبي بكر القاضي علاء الدين … البكري … الدمشقي ثم القاهري الشافعي … والآتي ابن عمه عمر بن محمد ويعرف كل منهم بابن الصابوني」（本項主を名指し、相互閉合。خشقدم 期にカイロで نظر الإسطبل・وكيل بيت المال・ناظر البيمارستان 等を歴任）。ID-Master の TMP-P-000055「العلاء الصابوني」は同一人物 → 統合時に名寄せ要（§D109-5）。初版の #NEEDID を解消。'
