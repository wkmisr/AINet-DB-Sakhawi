translation:
  ja: عبد الرحيم بن إبراهيم بن محمد بن محمد نجم الدين بن محي الدين بن تاج الدين ابن قطب الدين الرفاعي。多数の学者から（学問を）得た。彼からはアル＝ターウースィーが学び、その没年月日を820年ズー・アル＝カアルダ月5日火曜日と記録し、彼を大いに称賛した。
  en: ʿAbd al-Raḥīm b. Ibrāhīm b. Muḥammad b. Muḥammad Najm al-Dīn b. Muḥyī al-Dīn b. Tāj al-Dīn b. Quṭb al-Dīn al-Rifāʿī. He studied under a group of scholars, and al-Ṭāwūsī studied under him. Al-Ṭāwūsī recorded his death as occurring on Tuesday, the 5th of Dhū al-Qaʿda, in the year 820 AH, and held him in high esteem.
