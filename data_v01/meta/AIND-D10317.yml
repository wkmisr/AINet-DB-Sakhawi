translation:
  ja: ヤフヤー・ブン・ムハンマド・ブン・ヤフヤー・ブン・イヤーズ（下に二点のヤー）、アッ＝サンハージー、マッカの人、マーリキー派、ハディース学者アリー・ブン・アフマド・アル＝フーウィーの外孫。マッカでイブン・スィッディークほかから聴き、マッカではシャリーフ・アブド・アッ＝ラフマーン・アル＝ファースィーの講義に、カイロではアッ＝タージュ・バフラームの講義にその著『アッ＝シャーミル』について出席し、いずれもアッ＝タキー・アル＝ファースィーと同学であった。アル＝ファースィーはその『史』に彼の伝を立て、「立派で、行いの伴う人であった」と述べている。7年に、ラビーウのどちらかの月かジュマーダーのどちらかの月にマッカで没し、アル＝ムアッラーに葬られた。享年30。神よ彼を憐れみたまえ。
  en: 'Yaḥyā b. Muḥammad b. Yaḥyā b. ʿIyādh (with a yāʾ dotted twice below), al-Ṣanhājī, the Meccan, the Mālikī, grandson through his mother of the ḥadīth scholar ʿAlī b. Aḥmad al-Fuwwī. He heard in Mecca from Ibn Ṣiddīq and others, and attended the lessons of the sharīf ʿAbd al-Raḥmān al-Fāsī in Mecca and of al-Tāj Bahrām in Cairo on his book al-Shāmil, as a fellow student of al-Taqī al-Fāsī in both. The latter wrote his biography in his History, saying: “He was a good man who acted on his knowledge.” He died in Mecca in one of the two Rabīʿs or the two Jumādās of the year seven and was buried in al-Muʿallā, aged thirty; may God have mercy on him.'
