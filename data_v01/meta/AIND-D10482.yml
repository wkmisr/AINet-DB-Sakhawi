translation:
  ja: ユースフ・ブン・アブドゥッラー・アル＝ムクリー。ミスルのイブン・アビー・バクルの廟（マシュハド）に住んでおり、人々は彼に信を寄せていた。（80）2年ラビーウ第1月に没した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Yūsuf b. ʿAbd Allāh al-Muqrī. He lived at the shrine (mashhad) of Ibn Abī Bakr in Miṣr, and the people had faith in him. He died in Rabīʿ I of the year [80]2. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
