translation:
  ja: ムハンマド・ブン・アフマド・ブン・ムーサー・ブン・ナッジャード、ナースィルッディーン・アブー・アブドゥッラー・ブン・アル＝アミール・アッ＝シハーブ・アビー・アブディッラー・ブン・アビー・バクル、アン＝ナーブルスィー・アル＝マクディスィー。〔7〕56年に三人のハーフィズ、すなわちイブン・カスィール、アル＝アラーイー、アッ＝シハーブ・アブー・マフムード、ならびにアッ＝ラムサーウィー、アブー・アル＝ハラム・アル＝カラーニスィー、ナースィルッディーン・アッ＝トゥーニスィー、アル＝バヤーニー、イブン・アル＝ハッバーズ、アブー・アル＝アッバース・ブン・アル＝ジューヒーほかが彼にイジャーザを与えた。彼は伝承を語り、〔8〕15年にイブン・ムーサーやアル＝アービーのような有識者たちが彼から聴聞した。我らがシャイフ（イブン・ハジャル）はその『ムウジャム』で彼に言及し、「彼は私の子らにイジャーザを与えた」と述べた。同様にイブン・ファハドほかも彼に言及した。
  en: Muḥammad b. Aḥmad b. Mūsā b. Najjād, Nāṣir al-Dīn Abū ʿAbd Allāh b. al-Amīr al-Shihāb Abī ʿAbd Allāh b. Abī Bakr al-Nābulusī al-Maqdisī. In the year [7]56 the three ḥāfiẓes—Ibn Kathīr, al-ʿAlāʾī, and al-Shihāb Abū Maḥmūd—as well as al-Ramthāwī, Abū al-Ḥaram al-Qalānisī, Nāṣir al-Dīn al-Tūnisī, al-Bayānī, Ibn al-Khabbāz, Abū al-ʿAbbās b. al-Jūkhī, and others granted him ijāza. He transmitted, and men of learning such as Ibn Mūsā and al-Ābī heard from him in the year [8]15. Our shaykh (Ibn Ḥajar) mentioned him in his Muʿjam and said, "He granted ijāza to my children." Ibn Fahd and others likewise mentioned him.
