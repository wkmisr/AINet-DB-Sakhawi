translation:
  ja: ムハンマド・ブン・アブドゥルガニー・ブン・ムハンマド・ブン・アフマド・ブン・ウスマーン・ブン・ヌアイム、バドル・アッ＝ディーン、ビサートを本貫とするアル＝カーヒリー・アル＝マーリキー。その父と祖父は前述。ドゥバイスと渾名される。836年ラビーウ・アル＝アウワル月にカイロで生まれた。アル＝ブルハーン・アル＝ハラビーらが彼にイジャーザを与えた。いくつかの書物を暗記し、証人（シャーヒド）業で生計を立てたが、その行状は褒められたものではなかった。892年ラビーウ・アル＝アウワル月22日、日曜の夜に没した。
  en: Muḥammad b. ʿAbd al-Ghanī b. Muḥammad b. Aḥmad b. ʿUthmān b. Nuʿaym, Badr al-Dīn, of Bisāṭī origin, al-Qāhirī al-Mālikī; his father and grandfather have been mentioned above. He was nicknamed Dubays. He was born in Rabīʿ al-Awwal of the year 836 in Cairo. Al-Burhān al-Ḥalabī and others granted him an ijāza. He memorised some books and earned his living as a notary witness, and was not of praiseworthy conduct. He died on the night of Sunday, 22 Rabīʿ al-Awwal of the year 892.
