translation:
  ja: アブドゥッラー・ムタイリー・ブン・ウマル・ブン・アッ＝ザイン・アブドゥルアズィーズ・ブン・アブドゥルワーヒド・アル＝マダニー。ハサンとアブドゥルバースィトの兄弟で、彼らはいずれも「イブン・ザイン・アッ＝ディーン」として知られる。マディーナで私（サハーウィー）から聴聞した者の一人。
  en: ʿAbd Allāh Muṭayrī b. ʿUmar b. al-Zayn ʿAbd al-ʿAzīz b. ʿAbd al-Wāḥid al-Madanī, brother of Ḥasan and ʿAbd al-Bāsiṭ; each of them is known as Ibn Zayn al-Dīn. He is among those who heard from me in Medina.
