    en: al-Ṭāwūsī (al-Nūr Abū al-Futūḥ Aḥmad, AIND-D00900) read to the subject in Shiraz introductory works in grammar and morphology — al-Kāfiya of al-Zanjānī and its commentaries by al-Sayyid Rukn al-Dīn and al-Taftāzānī — and the subject granted him an ijāza in the months of the year 800 H.
    ja: §D-1裁定(Waka 2026-08-18)により、報告者「الطاووسي」のcanonicalを **#AIND-D00900**(أحمد بن عبد الله بن عبد القادر … نور الدين أبو الفتوح الطاوسي الأبرقوهي الشيرازي)に統一。決め手はニスバ部索引項 AIND-D11801 の「وابن الأخير النور أبو الفتوح أحمد **صاحب المشيخة التي أنقل منها**」＝サハーウィー自身が引用元マシュヤハの著者を名指ししている点。 / 当該項は D00900 本文の「والفخر أحمد الشيفكي … والثالث في كافية النحو والريحانية في الصرف وشرحهما لكل من السد ركن الدين والتفتازاني」と逐語対応する(D00900の「第3の師」＝本項)。
translation:
  ja: アフマド・アル＝ファフル・アッ＝シーファスキー・アッ＝シーラーズィー。アッ＝ターウースィー（＝AIND-D00900）は語る。私はシーラーズで彼のもとで、諸学の入門書――ザンジャーニーの『カーフィヤ』（文法学・形態論）およびサイイド・ルクン・アッ＝ディーンとタフターザーニーによるその二つの注釈書など――を朗読した。そして彼は800年のうちに私にイジャーザを与えた。彼はその後に亡くなったと思われ、それゆえ私は彼を記した。
  en: 'Aḥmad al-Fakhr al-Shīfaskī al-Shīrāzī. Al-Ṭāwūsī (= AIND-D00900) said: I read to him in Shiraz the introductions to the sciences — such as al-Kāfiya in grammar and morphology by al-Zanjānī and its two commentaries by al-Sayyid Rukn al-Dīn and al-Taftāzānī, and others — and he granted me an ijāza in the months of the year 800 H. It appears he died after that, and that is why I recorded him.'
