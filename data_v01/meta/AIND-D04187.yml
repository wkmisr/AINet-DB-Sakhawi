translation:
  ja: アブドゥルカーディル・ブン・ムハンマド・ブン・アブドゥルマリク。ムヒュッディーン。ダミーラに出自を持つ、カイロ在住のマーリキー派。彼の父と、その息子であるアル＝バドル・ムハンマドの伝記は後述される。ムフタサル（略説書）を暗記し、少し学問に従事した。ハッジ（巡礼）を行い、証人（公証人）たちと同席した。平穏で非の打ち所のない人物であった。891年ムハッラム月18日の夜に没した。60歳を越えていた。
  en: ʿAbd al-Qādir b. Muḥammad b. ʿAbd al-Malik, Muḥyī al-Dīn. Of Damīrī origin, Cairo resident, Maliki. His father and his son, al-Badr Muḥammad, are mentioned below. He memorized al-Mukhtaṣar and studied a little, performed Hajj, and sat with the legal witnesses. He was a peaceful, decent person. He died on the night of 18 Muharram 891 AH, having passed the age of sixty.
