translation:
  ja: アフマド・アッ＝シハーブ・アル＝ヒムスィー、後にアッ＝ディマシュキー。ダマスカスに定住し、（本項の少し前に言及された）アフマド・アル＝アクバーイーのザーウィヤに居した。相続法（アル＝ファラーイド）に秀でており、アッ＝ターッジュ・イブン・アラブ・シャーがそれを彼から学んだ。
  en: Aḥmad al-Shihāb al-Ḥimṣī, then al-Dimashqī, who settled in Damascus at the zāwiya of Aḥmad al-Aqbāʿī (mentioned shortly before). He was proficient in inheritance law (al-farāʾiḍ), which al-Tāj b. ʿArab Shāh took from him.
