translation:
  ja: アフマド・ブン・ムーサー・ブン・アブドゥルワーヒド。イブン・アビー・ハンムーについて。タリムサーンのナーイブであるアフマド・ブン・ムーサー・ブン・ユースフ・ブン・アビー・ハンムーは839年に亡くなった、という説を見た。これは前述の人物と併記すべきである。
  en: 'Aḥmad b. Mūsā b. ʿAbd al-Wāḥid. Regarding Ibn Abī Ḥammū: I have seen it said that Aḥmad b. Mūsā b. Yūsuf b. Abī Ḥammū, nāʾib of Tilimsān, died in the year 839. This should be reconciled with the preceding information.'
