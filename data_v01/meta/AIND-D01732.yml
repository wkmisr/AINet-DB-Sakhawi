translation:
  ja: アフマド・ヌール・アッ=ディーン、ハージー・ヌールとも呼ばれる。イッズ・アッ=ディーンの子、ヌール・アッ=ディーンの子、アル=ラーリー・アル=ビード・シャヒューリー。両聖地（メッカ・メディナ）におけるハナバイラ（ハンバル派）のカーディーであるサイイドに仕えたことで知られ、ヌールの名でより有名である。両聖地で私（サハーウィー）から諸々を聴聞した者の一人であり、彼に問題はない。
  en: Aḥmad Nūr al-Dīn, also called Ḥājjī Nūr, son of ʿIzz al-Dīn, son of Nūr al-Dīn, al-Lārī al-Bīd-Shahyūrī. He is known for serving al-Sayyid, the Qāḍī of the Ḥanābila in the Two Holy Cities (al-Ḥaramayn), and he is better known as Nūr. He is one of those who heard some things from me (al-Sakhāwī) in the Ḥaramayn, and there is nothing wrong with him.
