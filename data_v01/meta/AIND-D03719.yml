translation:
  ja: アブドゥッラフマーン・ブン・イーサー・ブン・スルターン・アル＝ガッズィー・アッ＝シャーフィイー。後述する有名なアッ＝シャムス・ムハンマド・イブン・スルターンの父。息子は彼のもとで7つの朗誦法を朗読し、法学と文法学を学び、ガザのジャーウィリー・モスクで説教を行った。さらに、彼はバイバルス・ハーンカー（大ハーンカーかあるいはリバート）のシャイフ職に就いたとも言われており、多くのサラーフ（清廉な人々／サダート）と親交を結んだ。ヒジュラ暦805年に死去した。アッラーの慈悲あれ。
  en: ʿAbd al-Raḥmān b. ʿĪsā b. Sulṭān al-Ghazzī al-Shāfiʿī. He was the father of the famous al-Shams Muḥammad b. Sulṭān, who is mentioned below. His son recited the Quran to him according to the seven recitations, and studied fiqh and grammar under him. He delivered the sermon at the Jāwilī Mosque in Gaza, and it was even said that he was appointed to the shaykh-ship of the Baybarsiyya, either the grand Khanqah or the Ribāṭ. He accompanied a group of sayyids (Sufi masters). He died in the year 805 AH. May Allah have mercy on him.
