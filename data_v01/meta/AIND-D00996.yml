  ja: アハマド・ブン・アリー・ブン・アハマド・アル＝ハサニー・アル＝ハーシミー・アル＝マッキー。アミール、ワースィト領主。ワディ・ムッル出身。848年ズー・アル＝カアダ月4日金曜日にワースィトで死去。イブン・ファハドが彼について年代記を著した。
  en: Aḥmad b. ʿAlī b. Aḥmad al-Ḥasanī al-Hāshimī al-Makkī, the amir, lord of Wāsiṭ from Wādī Murr. He died there on Friday, the 4th of Dhū al-Qaʿda in the year 848. Ibn Fahd recorded his biography.
