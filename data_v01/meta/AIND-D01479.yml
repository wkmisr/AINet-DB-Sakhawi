translation:
  ja: アフマド・ブン・ムハンマド・ブン・アル＝ラージュ・アル＝カラーヒー・アル＝イスカンダリー、クルアーン朗誦者（ムクリウ）。817年に我らがシャイフ（イブン・ハジャル）の子（イブン・シャイフィナー）らにイジャーザを与えた。彼の祖父の名は要確認で、ある請願書（イスティドアーゥ）ではこう（＝アル＝ラージュ）記されていたが、我らがシャイフ（イブン・ハジャル）のムゥジャム（伝記集）では〔アル＝ファッラーフ〕と記されている。彼は故郷において朗誦学の長（リヤーサ・アル＝イクラーゥ）の地位に至ったという。
  en: 'Aḥmad b. Muḥammad b. al-Lāj al-Qalāḥī al-Iskandarī, the Qurʾān reciter (muqriʾ). He granted ijāza to the son of our shaykh (Ibn Ḥajar) and others in the year 817 H. His grandfather''s name requires verification: I found it thus (as al-Lāj) in a petition (istidʿāʾ), while in the Muʿjam of our shaykh (Ibn Ḥajar) it appears as al-Fallāḥ; and it states that the headship of Qurʾān recitation (riyāsat al-iqrāʾ) in his hometown devolved to him.'
