translation:
  ja: ムハンマド・ブン・アフマド・ブン・ハサン・ブン・アリー・ブン・ムハンマド・ブン・アブド・アッ＝ラフマーン、アル＝カマール、イマームのアッ＝シハーブの子、出自はアル＝アズライー、アル＝カーヒリー。母はダマスクスの人。クルアーンを読み、私たちとともに複数の師に聴聞し、自筆で『アル＝カウル・アル＝バディーウ』を書写した。風雅の人々と交わり、のちブーラークに引きこもった。（8）95年ムハッラム月に、おおよそ50数歳で没した。彼はアン＝ナジュム・ブン・ヒッジーの妻ファーティマの父である。
  en: Muḥammad b. Aḥmad b. Ḥasan b. ʿAlī b. Muḥammad b. ʿAbd al-Raḥmān, al-Kamāl, son of the imam al-Shihāb, al-Adhraʿī by origin, al-Qāhirī; his mother was a Damascene. He read the Qurʾān, heard together with us from more than one [shaykh], and copied al-Qawl al-Badīʿ in his own hand. He mixed with people of wit and refinement, then withdrew to Būlāq. He died in al-Muḥarram of the year [8]95, aged approximately fifty-odd. He is the father of Fāṭima, the wife of al-Najm b. Ḥijjī.
