translation:
  ja: ジャーニム・アル＝アシュラフィー・カーイトバーイ。アル＝アシュカルとしても知られる。卓越した騎馬術で知られる十人長（アシャラート）の一人であったが、果敢である一方、憎まれ役の人物であった。882年ムハッラム月に死去。死の少し前にブハイラ地方の監督（カシュフ）に任じられたが、赴任する前に亡くなり、悼まれることはなかった。
  en: Jānim al-Ashrafī Qāytbāy, also known as al-Ashqar, was one of the amirs of ten (al-ʿasharāt) noted for exceptional horsemanship, yet, though bold, he was a detested man. He died in Muḥarram 882 AH. Shortly before his death he had been appointed to the kashf of al-Buḥayra, but he passed away before setting out for it, unmourned.
