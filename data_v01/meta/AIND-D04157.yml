translation:
  ja: アブドゥルカーディル、またの名をムハンマド。アラー・アッ＝ディーン・アリー・ブン・マフムード・アッ＝サルマーニー、後にアッ＝ハマウィー・アッ＝ハンバリー。父親と同様に「イブン・アル＝ムグリー」として知られる。我らがシャイフ（イブン・ハジャル）はその歴史書（『インバー・アル＝グムル』）において、彼が才覚を現し、『アル＝ムハッラル』などを暗記し、立派に育ったと述べている。ヒジュラ暦826年ズー・アル＝カアラ月半ばに、思春期に達したばかりで亡くなった。父親は彼の死を非常に深く悲しみ、彼以外に子供はいなかった。一部の混乱した者がムハンマドを彼の父親の名とし「アブドゥルカーディル・ブン・ムハンマド・ブン・アリー・ブン・マフムード」としているのを見たが、それは明白な誤りである。
  en: ʿAbd al-Qādir, also called Muḥammad, son of al-ʿAlāʾ ʿAlī son of Maḥmūd, al-Salmānī then al-Ḥamawī, al-Ḥanbalī, known like his father as Ibn al-Mughlī. Our shaykh (Ibn Ḥajar) said in his chronicle (Inbāʾ al-Ghumr) that he showed great promise, memorized al-Muḥarrar and other works, and grew up in an excellent manner. He died in the middle of Dhu al-Qaʿdah in the year 826 AH, having nearly reached puberty, and his father grieved for him deeply, as he had no other child. I saw that some confused writers made Muḥammad the name of his father, writing 'ʿAbd al-Qādir b. Muḥammad b. ʿAlī b. Maḥmūd', which is a pure error.
