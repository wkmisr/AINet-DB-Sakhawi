translation:
  ja: クルトバーイ・アル＝アシュラフィー・カーイトバーイ。彼（カーイトバーイ）のハーッサキーの一人、というよりその親族であり、ジャーニムの兄弟。889年ムハッラム月に没し、ムサッラー・アル＝ムウミニーで葬礼が行われ、スルターンの墓廟に葬られた。
  en: Kurtbāy al-Ashrafī Qāytbāy, one of his (Qāytbāy's) khāṣṣakīs, or rather his relative, and the brother of Jānim. He died in Muḥarram of the year 889; the funeral prayer was performed over him at Muṣallā al-Muʾminī and he was buried in the Sultan's mausoleum.
