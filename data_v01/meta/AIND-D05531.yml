translation:
  ja: アリー・ブン・ムハンマド・ブン・ファラジュ・アッ＝サブティー・アル＝ワーディヤーシー・アル＝マーリキー。我々のもとに来訪した後述のアブー・アル＝カースィムの父。892年、アンダルスのアルメリア（アル＝マリーヤ）の城塞で50数歳で没した。有能な人物で、ワーディー・アーシュ（グアディクス）のカーディー職、次いでその説教師職・教授職と、同地の金曜モスクの管財職を務めた。
  en: ʿAlī b. Muḥammad b. Faraj al-Sabtī al-Wādyāshī al-Mālikī, father of Abū al-Qāsim who came to us and is mentioned below. He died at the citadel of Almería in al-Andalus in the year 892, aged fifty-something. He was an accomplished man who held the judgeship of Guadix (Wādī Āsh), then its preachership and professorship, and the supervision of its congregational mosque.
