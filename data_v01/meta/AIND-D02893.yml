translation:
  ja: ハリール・ブン・ハドル、アル＝アジャミー。804年にアル＝ハリール（ヘブロン）で、一群の人々とともに、アル＝マイドゥーミーから伝える『アル＝ムサルサル・ビ・アル＝アウワリーヤ』を伝承した。アッ＝タキー・アブー・バクル・アル＝カルカシャンディーが彼らから（それを）我々に伝えた。
  en: Khalīl b. Khaḍir al-ʿAjamī. In the year 804 at al-Khalīl (Hebron) he transmitted, together with a group, al-Musalsal bi-l-Awwaliyya on the authority of al-Maydūmī. Al-Taqī Abū Bakr al-Qalqashandī transmitted it to us from them.
