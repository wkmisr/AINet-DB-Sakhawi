  ja: アブド・アル＝カーディル・ブン・ムハンマド・ブン・アリー・アッ＝ダクドゥースィー・アル＝アズハリー・アッ＝シャーフィイー。イブン・アル＝ミスリー、またアル＝ミンハージーとして知られる。カイロで私（サハーウィー）から聴聞した者の一人。891年ラビーウ・アル＝アーヒル月に没した。
  en: ʿAbd al-Qādir b. Muḥammad b. ʿAlī al-Daqdūsī al-Azharī al-Shāfiʿī, known as Ibn al-Miṣrī and as al-Minhājī. He was among those who heard from me in Cairo. He died in Rabīʿ al-Ākhir of the year 891.
