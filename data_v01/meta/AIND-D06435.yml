translation:
  ja: マーミヤ・アル＝アシュラフィー・カーイトバーイ。イブン・ウスマーン（オスマン朝君主）との講和の後、贈物を携えて彼のもとへ赴き、帰還した。そしてシャーズ・ベクの後任として第二ダワーダール職を務めた。機敏さと分別で知られる。
  en: Māmiya al-Ashrafī Qāytbāy. After the peace with Ibn ʿUthmān (the Ottoman ruler) he travelled to him with a gift and then returned, and he held the second dawādārship after Shādh Bak. He is spoken of for his skill and good sense.
