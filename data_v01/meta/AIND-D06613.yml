translation:
  ja: ムハンマド・ブン・アフマド・ブン・アフマド、アッ＝シャムス・アル＝ジャウジャリー・アル＝カーヒリー、我らがシャイフの妻の親族。我らがシャイフから、のちに私から聴いた者の一人。貧しく、暮らしに窮していた。
  en: Muḥammad b. Aḥmad b. Aḥmad, al-Shams al-Jawjarī al-Qāhirī, a relative of the wife of our shaykh. He was one of those who heard from our shaykh and then from me. He was poor and in straitened circumstances.
