notes:
- text: '「قريب زوجة شيخنا」＝イブン・ハジャルの妻の親族。続柄も相手の名も原文にない＝relation を立てず note に留める（ブリーフどおり。初版の統制外 relation「other」・#NEEDID を除去）。通称索引 #AIND-D12507 には、別人（محمد بن محمد بن أحمد بن عبد العزيز）について同じ句「قريب زوجة شيخنا ابنة ناظر الجيش الكريمي عبد الكريم ابن أحمد بن عبد العزيز」がある。本項の言う妻がこの ناظر الجيش の娘と同一かは原文から決まらない（【集約 2026-11-18】他人の項の記述による特定を外した、内容B L4・オーケストレーター決定23）。「وكان فقيرا عسيرا」は人物評（符号化しない）。'
