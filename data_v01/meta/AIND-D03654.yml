- text: '「يأتي قريبا فيمن جده عبد الله بن عبد الرحمن」＝転送見出し。転送先は #AIND-D03661（عبد الرحمن بن عبد الله بن **عبد الله بن عبد الرحمن** بن الوجيه بن العفيف بن الأمين البصري الأصل المكي الشافعي ثم الحنفي … **ويعرف كأبيه بابن جمال الثناء**）。①祖父名「عبد الله بن عبد الرحمن」の完全一致、②البصري、③المكي、④「ابن جمال الثناء」の4点で一意に閉合。初版の father relation は汚染番号 #TMP-P-000490（登録=عبد الله・al-Zuhrīの祖父）の流用であったためLIMBO化に伴い除去。'
