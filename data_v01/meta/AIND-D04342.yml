- text: '「يأتي فيمن جده عبد الله」＝転送見出し。転送先は #AIND-D04353（عبد اللطيف بن محمد بن عبد الله ويقال أحمد الحمصي الأصل المقدسي البلان）。祖父名が「عبد الله ويقال أحمد」（アブド・アッラー、一説にアフマド）と両様で伝えられており、本見出し「بن محمد بن أحمد」がその異伝に当たる。同じ「فيمن جده عبد الله」群の D04351（بن عبد الله بن أحمد）・D04352 は祖父名が عبد الله のみで不一致。'
