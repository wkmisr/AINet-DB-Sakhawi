  en: ʿAbd al-Qādir b. ʿAbd Allāh b. ʿUmar al-ʿUrābī al-Makkī. He was one of the virtuous people. He died in Mecca in Jumādā al-Ūlā, in the year 870 AH. His biography was recorded by Ibn Fahd.
