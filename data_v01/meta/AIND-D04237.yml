translation:
  ja: アブド・アル＝カビール・ブン・アビー・アッ＝サアーダート・ブン・マフムード・ブン・アーディル・アル＝フサイニー・アル＝マダニー・アル＝ハナフィー。アブド・アッラー、アブド・アッラフマーン、アフマドの弟であり、4人の中で最も年少であった。クルアーンと『アル＝クドゥーリー』を暗記し、法学、法原理、アラビア語学、韻律学に励んだ。また、書道を極めてそれを用いて写本を行い、聡明さで知られた。
  en: Abd al-Kabir b. Abi al-Sa'adat b. Mahmud b. 'Adil al-Husayni al-Madani al-Hanafi. He was the brother of 'Abd Allah, 'Abd al-Rahman, and Ahmad, and was the youngest of the four brothers. He memorized the Qur'an and the legal manual of al-Quduri, and occupied himself with the study of jurisprudence, its principles, Arabic grammar, and prosody. He also mastered calligraphy and copied books with it, and was noted for his intelligence.
