translation:
  ja: アフマド・ブン・ラーシド・アル＝ヤンブイー。ザイディー派のイマームでありサナアの支配者であった者（彼自身もザイディー派であったため）よりヤンブーのカーディーに任じられ、数年その職を務め死没した。彼はそのマズハブにおける専門性にもかかわらず、多くの反対者の受け入れに消極的であった。彼は819年にハッジを行った後、巡礼の第一または第二のナフルで没し、アル＝ムアッラーに埋葬され、その墓には墓碑が建てられた。アル＝ファーシーが彼について言及している。
  en: Aḥmad b. Rāshid al-Yanbuʿī. He was appointed as qadi of Yanbuʿ by the Imam of the Zaydiyya, who was also the ruler of Sanaa (as Aḥmad himself was Zaydi). He served in this office for several years until his death. He was hesitant to accept many of his opponents, despite his expertise in his madhhab. He performed the Hajj pilgrimage in 819 H, and his demise occurred after the Hajj, during the first or second nafr (departure from Mina). He was buried in al-Muʿallā, and a monument was erected on his grave. Al-Fāsī mentioned him.
