notes:
- text: '転送見出し（原文末尾「مضى فيمن جده أحمد بن أبي البركات」による）。転送先は #AIND-D07985「محمد بن علي بن أحمد بن أبي البركات الشمس الغزي ثم الحلبي ويعرف بابن أبي البركات … مات في يوم الأربعاء تاسع عشر ربيع الأول سنة ست وعشرين … ذكره شيخنا في إنبائه باختصار وقال المعروف بالركاب بدل ابن أبي البركات ، وما علمت الصواب منهما」（未受領）。本見出しの通称「ابن الركاب」はイブン・ハジャル『إنباء』の呼称に対応。'
