translation:
  ja: スアド・ブン・アリー・ブン・ユースフ・ブン・ムハンマド・ブン・ユースフ・ブン・イスマーイール・ブン・ナスル・ブン・アル＝アフマル。アンダルスのグラナダの支配者（スルタン）であり、アブー・アル＝ハサン・アリーとアブー・アブドゥッラー・ムハンマドの父。896年の出来事の中で彼について付随的に言及した。
  en: Saʿd b. ʿAlī b. Yūsuf b. Muḥammad b. Yūsuf b. Ismāʿīl b. Naṣr b. al-Aḥmar, the ruler of Granada in al-Andalus, and the father of Abū al-Ḥasan ʿAlī and Abū ʿAbd Allāh Muḥammad. I mentioned him in passing in the events of the year 896 AH.
