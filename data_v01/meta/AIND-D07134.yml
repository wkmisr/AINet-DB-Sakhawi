  en: Muḥammad b. al-Bughā, Nāṣir al-Dīn, second chamberlain (ḥājib) of Aleppo. He was of praiseworthy conduct, with wealth and newly acquired fortune. He died on Saturday 27 Ramaḍān 855 in Cairo, a stranger away from his homeland and his family.
