translation:
  ja: ハーッジー・ブン・アブドゥッラー・アッ＝ザイン・アッ＝ルーミー。「ハーッジー・ファキーフ」として知られる。カイロ郊外のザーヒリーヤ廟（アッ＝ザーヒル・バルクーク廟）のシャイフ。学問には無縁であったが、同類の者の常としてトルコ系（の人々）との繋がりを持っていた。ヒジュラ暦818年シャウワール月に死去し、その廟のシャイフ職にはアッ＝シャムス・アル＝バサーティーが就いた。我らがシャイフ（イブン・ハジャル）が『インバー・アル＝グムル』でそう述べている。
  en: Ḥājjī b. ʿAbd Allāh al-Zayn al-Rūmī, known as Ḥājjī Faqīh. Shaykh of the Ẓāhiriyya turba (the mausoleum of al-Ẓāhir Barqūq) outside Cairo. He was devoid of scholarship, but he had connections with the Turks, as was the way of others like him. He died in Shawwāl of the year 818 H, and al-Shams al-Basāṭī was installed in the mashyakha of the turba after him. So said our shaykh (Ibn Ḥajar) in his 『Inbāʾ al-Ghumr』.
