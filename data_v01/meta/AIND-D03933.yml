translation:
  ja: アブドゥッサラーム・ブン・ムハンマド・アッ＝ザルイー。ダマスカスのアル＝ムジャーヒディーヤの住人の一人。イブン・ヒッジーの筆跡で私（サハーウィー）が読んだところによれば、善良で誠実、信頼のおける人物であった。814年の末に没した、と我らがシャイフ（イブン・ハジャル）が『インバー』で述べている。
  en: ʿAbd al-Salām b. Muḥammad al-Zurʿī, one of the residents of al-Mujāhidiyya in Damascus. He was good, trustworthy and reliable, according to what I read in the handwriting of Ibn Ḥijjī. He died in the latter part of the year 814 AH; so stated our shaykh (Ibn Ḥajar) in his Inbāʾ.
