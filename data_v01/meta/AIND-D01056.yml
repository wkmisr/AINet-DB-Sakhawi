translation:
  ja: 93 アフマド・ブン・アリー・ブン・ムハンマド・ブン・アブドゥルムゥミン・アル＝バトヌーニー、出自はカイロのアル＝バースィティー派で、後述のアブルアッバース・アル＝ガムリーの娘の夫である。父とともに私（サハーウィー）から聴聞し、また同じくアル＝クムスィーからも聴聞した。
  en: 93 Aḥmad b. ʿAlī b. Muḥammad b. ʿAbd al-Muʾmin al-Batnūnī, originally from al-Qāhirī al-Bāsiṭī, husband of the daughter of Abū al-ʿAbbās al-Ghamrī (mentioned below). He heard from me (al-Sakhāwī) with his father, and likewise, they both heard from al-Qamṣī.
