translation:
  ja: アールカマース・イブン・サファル・ホージャー・アル＝ムアイヤディーは、十人長アミールの一人であり、ナウバの長であった。また、アールカマース・アル＝アシュカルとしても知られた。853年ラビーウ・アル＝サーニー末の土曜日に疫病で亡くなった。彼はひどく怠慢な人物であった。アッラーの慈悲あれ。
  en: Arqmās ibn Ṣafar Khujā al-Muʾayyadī was one of the commanders of tens (umaraʾ al-ʿasharāt) and head of a nawba. He was also known as Arqmās al-Ashqar. He died of the plague on the last Saturday of Rabīʿ al-Thānī in 853 AH. He was exceedingly negligent, may Allah have mercy on him.
