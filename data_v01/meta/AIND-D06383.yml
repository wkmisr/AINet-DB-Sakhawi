  note:
    ja: '見出しは「كبيش بن جماز」だが、corpus の転送見出し（12桁 707021256314、`$$$`、AIND 無し）「كبيش بن هبة بن جماز الحسيني . هو ابن جماز الماضي قريبا」がサハーウィー自身の同定として本項主＝كبيش بن هبة بن جماز と記す（祖父 جماز に遡らせたナサブ）。父 هبة بن جماز بن منصور الحسيني は corpus に本伝なし（子 جماز=#AIND-D02443（812没、أمير المدينة）・سليمان=#AIND-D03175（أمير المدينة）、孫 زهير بن سليمان=#AIND-D03045 等のナサブに出る）→ 新規 TMP-P-001602。他項（索引見出し）の情報による同定のため cert medium（規則23）。初版の幻番号 TMP-P-000000（desc جماز）を置換。 対立読み（集約 2026-10-26、内容A L-1）: 見出し「كبيش بن جماز」をそのまま読めば父＝#AIND-D02443「جماز بن هبة بن جماز بن منصور الحسيني أمير المدينة」（812没）もありうる。転送見出しは「نسب لجده」と言わないが、サハーウィー自身が本項主のナサブを「كبيش بن هبة بن جماز」と明記し「هو ابن جماز」と通称を説明している（父の名を هبة とする明示の記述）ので هبة の読みを採る（自己裁定。D02443 は父ではなく兄弟の可能性が高い）。'
