translation:
  ja: クバイシュ（点付きの字で）・ブン・ジャンマーズ・アル＝フサイニー。預言者の町マディーナのアミール職に就くためにカイロへ向かったが、彼に血讐のある一団が彼を捕らえ、そこ（カイロ）に入る前に殺害した。839年のことである。我らがシャイフ（イブン・ハジャル）が『インバー』でそう述べている。
  en: Kubaysh (with the dotted letter) b. Jammāz al-Ḥusaynī. He had set out for Cairo in order to take up the emirate of Medina, but a group of people who had a blood feud against him seized him and killed him before he entered it, in the year 839. Our shaykh (Ibn Ḥajar) said so in his Inbāʾ.
