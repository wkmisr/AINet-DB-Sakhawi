translation:
  ja: アリー・ブン・フサイン・ブン・アリー・ブン・フサイン、アラー・アッ＝ディーン・アッ＝ディマシュキー・アル＝マッキー。父は前述しており、彼も父と同様にイブン・マクサブとして知られる。マッカで私（サハーウィー）から聴聞した者の一人。
  en: ʿAlī b. Ḥusayn b. ʿAlī b. Ḥusayn ʿAlāʾ al-Dīn al-Dimashqī al-Makkī. His father has been mentioned above, and like him he is known as Ibn Maksab. He was among those who heard from me (al-Sakhāwī) in Mecca.
