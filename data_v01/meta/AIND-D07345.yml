  ja: ムハンマド・ブン・ハサン・ブン・アビー・アル＝ハイル・アル＝ビルビースィー、のちにアル＝カーヒリー、アル＝アズハリー、マーリク派。学問に励んだ者の一人。彼には息子がおり、（その息子は）ヒジュラ暦896年に私（サハーウィー）に諸書を暗誦提示（アルド）した。
  en: Muḥammad b. Ḥasan b. Abī al-Khayr al-Bilbīsī, then al-Qāhirī, al-Azharī, the Mālikī. He was among those who occupied themselves with study. He has a son who recited books before me (al-Sakhāwī) in the year 896 AH.
