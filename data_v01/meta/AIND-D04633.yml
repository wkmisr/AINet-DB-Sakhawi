translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アッ＝タキー〔タキー・アッディーン〕・ブン・カーディー・アッ＝シャーム、アル＝イッズ・アッ＝ディマシュキー・アル＝ハンバリー。父の後を継いで教授したが大成せず、その後、動乱（フィトナ）の後にタラーブルス（トリポリ）の裁判職に就いた。815年ラマダーン月に没した。
  en: ʿAbd Allāh b. Muḥammad b. al-Taqī (Taqī al-Dīn) b. Qāḍī al-Shām, al-ʿIzz al-Dimashqī al-Ḥanbalī. He taught after his father but did not distinguish himself; then, after the fitna, he was appointed to the judgeship in Tripoli. He died in Ramaḍān of the year 815.
