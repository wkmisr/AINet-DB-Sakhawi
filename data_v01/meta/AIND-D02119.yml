translation:
  ja: アイユーブ・ブン・ハサン・ブン・ムハンマド、ナジュム・アッ＝ディーン・ブン・アル＝バドル・ブン・ナーシル・アッ＝ディーン・ブン・ビシャーラ。サイダー地方におけるアシール（部族民兵）の統率者（ムカッダム・アル＝アシール）。同地に4年間在任し、あらゆる醜行を働いた末に、853年の末に胴斬りの刑（タウスィート）に処された。
  en: Ayyūb b. Ḥasan b. Muḥammad, Najm al-Dīn b. al-Badr b. Nāṣir al-Dīn b. Bishāra, commander of the tribal levies (muqaddam al-ʿashīr) in the district of Ṣaydā. He held it for four years, committing every vile act, until in the end he was executed by bisection (wussiṭa) late in the year 853.
