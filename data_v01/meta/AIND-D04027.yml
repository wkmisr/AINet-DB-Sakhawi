notes:
- text: '「ويعرف بالأصيلي لقرابة بينه وبين بيت ابن أصيل من جهة النساء」＝女系の縁戚関係により الأصيلي と呼ばれた（cf. #AIND-D06246 قاسم الأصيلي も بيت ابن أصيل に仕えて الكاملية に出入り）。「كان كثير الانجماع … له توجه إلى التحصيل والامساك」＝隠遁がちで蓄財・倹約に向かった。'
  lang: ja
translation:
  ja: アブドゥルアズィーズ・ブン・イッズ・アッ＝ディーン、カーミリーヤの住人。女系の縁戚関係でイブン・アシール家につながるため、アル＝アシーリーとして知られる。少し学問に従事し、イブン・アル＝フマームのもとに出席した。自筆で多くを書写し、極めて精確に仕上げ、ガザーリーの『イフヤー』を一部ならず（複数部）書写した。多くの語句について私（サハーウィー）に照会し、また『カームース』などをも書写した。サイード・アッ＝スアダーなどの禄を得た。多くは引きこもりがちで、時に独力で蓄財と節約に向かった。私としばしば同席した。893年ズー・アル＝ヒッジャ月に没した。
  en: ʿAbd al-ʿAzīz b. ʿIzz al-Dīn, resident of al-Kāmiliyya, known as al-Aṣīlī because of kinship on the women's side with the house of Ibn Aṣīl. He studied a little and attended Ibn al-Humām. He copied much in his own hand with great accuracy, including more than one copy of al-Ghazālī's Iḥyāʾ; he used to consult me about many words, and also copied the Qāmūs and other works. He held stipends at Saʿīd al-Suʿadāʾ and elsewhere. He was mostly reclusive, at times inclined to acquisition and thrift. He sat with me a great deal, and died in Dhū al-Ḥijja 893 AH.
