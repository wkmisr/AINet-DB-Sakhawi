translation:
  ja: アブーダリー家出身でマーリク派のシャハーブ・アブドゥルラフマーンの息子イブラーヒームの息子であるアハマドは、過去に言及されたイブラーヒームの父である。彼は892年に『アル=リサーラ』を、その翌年に『アル=ウムダ』を提示した。イブン・アルムラッキン、ブルキーニー、イラーキー、そしてアブドゥルハーリク・アリー・イブン・アルフラートは彼にイジャーザを与え、彼は（彼らが教示する）多くの学問を学ぶことができた。
  en: Aḥmad b. Ibrāhīm b. ʿAbd al-Raḥman, al-Shihāb al-Abūdarī al-Mālikī, was the father of the previously mentioned Ibrāhīm. He presented al-Risāla in 892 H and al-ʿUmda in the following year. He was among those to whom al-Abnāsī, Ibn al-Mulaqqin, al-Bulqīnī, al-ʿIrāqī, and ʿAbd al-Khāliq ʿAlī b. al-Furāt presented (teaching material), and they all granted him general ijāza.
