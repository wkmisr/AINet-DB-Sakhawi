translation:
  ja: アハマド・ブン・ムハンマド・アッ＝ダッハーン、ウマイヤ・モスクの主席ムアッジン。彼は声が美しく、測時学（ミーカート）にも通じており、長寿で、もっとも古参にして、もっともよく知られ、もっとも美しい声のムアッジンとなった。彼は商人としてペルシアの地へ入り、そこにしばらく滞在したことがあった。彼は様々な事柄に精通していた。ディー・アル＝カアダ月、813ヒジュラ年に84歳で亡くなった。我らがシャイフ（イブン・ハジャル）は彼の『インバーア』の中で彼に言及している。
  en: Aḥmad b. Muḥammad al-Dahhān, the chief muezzin of the Umayyad Mosque. He had a melodious voice, was knowledgeable in timekeeping (mīqāt), lived to become the longest-serving, most recognized, and most melodious-voiced of the muezzins. He had entered the lands of Persia as a merchant and resided there for a period. He possessed expertise in various matters. He died in Dhū al-Qaʿda in the year 813 AH, at the age of 84. Our shaykh (Ibn Ḥajar) mentioned him in his Anbāʾ.
