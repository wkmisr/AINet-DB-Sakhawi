translation:
  ja: ウマル・ブン・ハサン・ブン・ムハンマド・ブン・カースィム・ブン・アリー・ブン・アフマド、アッ＝シラージュ・ブン・アル＝ハワージャー・アル＝バドル、アッ＝ターヒルとして知られる［者の子］。その父と同母兄弟のアブド・アッ＝ラフマーンは前述した。商業で頭角を現し、兄弟のうち最も重きをなし、インドの地へ旅した。（8）68年シャアバーン月にジッダで、渡し板から落ちて脚を骨折ししばらく動けなくなった後に没し、マッカへ運ばれて同地に埋葬された。父は彼の死を深く悲しんだ。イブン・ファハドがその没年月を記録している。
  en: ʿUmar b. Ḥasan b. Muḥammad b. Qāsim b. ʿAlī b. Aḥmad, al-Sirāj b. al-Khawājā al-Badr known as al-Ṭāhir; his father and his full brother ʿAbd al-Raḥmān were mentioned above. He advanced in trade, was the most eminent of his brothers, and travelled to the lands of India. He died in Shaʿbān (8)68 in Jidda, after falling from a gangway and being laid up for a while by a broken leg; he was carried to Mecca and buried there. His father was stricken by his loss. Ibn Fahd recorded his death.
