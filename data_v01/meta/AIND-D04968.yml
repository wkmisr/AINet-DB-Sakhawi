translation:
  ja: アリー・ブン・アフマド・ブン・ディフヤ、のちにアル＝カーヒリー、アル＝アズハリー。アッ＝サブワとして知られる。アル＝カーミリーヤで『（サヒーフ・）ムスリム』の一部を聴聞し、書籍商で生計を立てようとしたが実を結ばず、その後、スッラ（巡礼者への送金・物資）を携えてマッカへ旅するようになり、それを続けるうちについには人々に（乗り物を）貸して同行させるまでになった。やがてひどく落ちぶれ、他人の財産も自分の財産も多くを失い、幾度も借金から逃亡した。（8）98年に没した。
  en: ʿAlī b. Aḥmad b. Diḥya, then al-Qāhirī, al-Azharī, known as al-Ṣabwa. He heard part of (Ṣaḥīḥ) Muslim at al-Kāmiliyya, and tried to earn his living by the book trade but did not succeed. He then began travelling to Mecca with the ṣurra (the remittances and provisions for the pilgrimage), and kept on with this until he ended up hiring out mounts to people who travelled with him. Eventually he fell very low, lost a great deal of other people's property and his own, and fled from his debts more than once. He died in the year (8)98.
