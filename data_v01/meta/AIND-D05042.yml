translation:
  ja: アリー・ブン・アフマド・ブン・ミフターフ・ブン・フタイス・アル＝カッバーニー、アブー・バクルとムハンマドの父。864年シャアバーン月にジッダの海岸で没し、（マッカへ）運ばれてアル＝ムアッラー（墓地）に埋葬された。
  en: ʿAlī b. Aḥmad b. Miftāḥ b. Fuṭays al-Qabbānī, the father of Abū Bakr and Muḥammad. He died in Shaʿbān of the year [8]64 on the coast of Jidda, and was carried (to Mecca) and buried in al-Muʿallā.
