translation:
  ja: ヤフヤー・ブン・アリー・ブン・ムハンマド・ブン・ヤアクーブ、タフター出身の家系でマッカの人、商人。長患いの末、897年サファル月に同地で没し、不動産その他の遺産と息子たちを残した。
  en: Yaḥyā b. ʿAlī b. Muḥammad b. Yaʿqūb, of Ṭahṭā origin, the Meccan, the merchant. He died there in Ṣafar 897 after a long illness, leaving an estate of real property and other things, and sons.
