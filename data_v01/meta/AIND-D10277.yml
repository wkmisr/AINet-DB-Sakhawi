notes:
- text: 'マッカの商家 الطهطاوي。父方おじ #AIND-D02641「حسن بن محمد بن يعقوب الطهطاوي المكي أخو علي الآتي . مات بمكة في المحرم سنة اثنتين وثمانين」、兄弟とみられる أبو بكر（父の項「والد أبي بكر وأخوته」、ID-Master TMP-P-000904）は本項に名指しがないので relation は立てない（規則23。父が AIND で共通）。初版の residence event（مكة、ニスバ由来）を除去（規則22(1)・(6)）。'
