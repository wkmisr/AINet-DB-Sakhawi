- text: '転送見出し（原文末尾「مضى قريبا فيمن جده أحمد بن هلال」による）。転送先は #AIND-D08008「محمد بن علي بن أحمد بن هلال بن عثمان المحب الدمشقي الحنفي بن القصيف الماضي أبوه . ناب عن العلاء بن قاضي عجلون في القضاء بدمشق …」（未受領）。父は #AIND-D05044「علي بن أحمد بن هلال بن عثمان بن عبد الرحمن الدمشقي الحنفي الشهير بابن القصيف」（没881）、ニスバ索引 #AIND-D12645「ابن القصيف … علي بن أحمد بن هلال بن عثمان وابنه المحب محمد」。'
