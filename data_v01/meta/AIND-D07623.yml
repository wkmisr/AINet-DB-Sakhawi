translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン、アル＝バドル・アブー・アル＝ファウズ、アル＝カーヒリー、ハナフィー派。アッ＝シャムス・アル＝アムシャーティーの継子で、クンヤ（アブー・アル＝ファウズ）でより知られる。母の存命中、〔八百〕七十六年ムハッラム月に没し、盛大な会葬のなか葬礼が行われ、その後バーブ・アン＝ナスル外のラウダ近くにある彼ら一族の墓所に埋葬された。四十歳を越えていた。理性・忍耐・謙虚・理解力の持ち主と評されていた。少しばかり学問に携わり、母の夫をはじめとする人々のもとに出席し、二人とともにラジャブ月の巡礼団（ラジャビーヤ）で巡礼した。姉妹の夫アル＝ムザッファル・マフムード・アル＝アムシャーティーのもとで証人（シャーヒド）として座し、さらには裁判の代理も務めた。『ヌカーヤ』を暗記していたと言われる。神よ彼を憐れみたまえ。
  en: Muḥammad b. ʿAbd al-Raḥmān, al-Badr Abū al-Fawz, al-Qāhirī al-Ḥanafī, the stepson of al-Shams al-Amshāṭī; he is better known by his kunya. He died during his mother's lifetime in Muḥarram of the year [8]76; the funeral prayer was performed for him in a crowded gathering, and he was then buried in their family tomb near al-Rawḍa outside Bāb al-Naṣr, having passed the age of forty. He was described as possessing sense, forbearance, humility and understanding. He was among those who studied a little and attended [the lessons of] a number of people, such as his mother's husband, and he performed the pilgrimage with the two of them in the Rajabiyya caravan. He sat as a witness (shāhid) under his sister's husband al-Muẓaffar Maḥmūd al-Amshāṭī, and even served as a deputy judge. It is said that he memorised al-Nuqāya. May God have mercy on him.
