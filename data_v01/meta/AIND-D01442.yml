  ja: アフマド・ブン・ムハンマド・ブン・アリー・アル＝ブルルスィー・アル＝マーリキー。イブン・アル＝アキータアの弟子で、イブン・アル＝ヒサン（最初の字はダッマ、2番目の字はハフィーファ）として知られる。すぐれた立派な人物の一人であり、私（＝サハーウィー）から聴聞した一人でもある。
  en: Aḥmad b. Muḥammad b. ʿAlī al-Burlusī al-Mālikī, a student of Ibn al-Aqyaṭaʿ, known as Ibn al-Ḥiṣān (the first letter is with a ḍamma, the second is soft). He was among the excellent and choice men, and among those who heard from me (al-Sakhāwī).
