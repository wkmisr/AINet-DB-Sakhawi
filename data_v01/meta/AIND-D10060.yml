translation:
  ja: ムーサー、アッ＝シャラフ・ブン・アル＝バドル・ハサン。ナザル・アッ＝ダウラ（国庫監督職）に就いたが、のちカースィム・シュガイタと交代してそれを離れ、次いでアッ＝シャラフ・ブン・アル＝バクリーの後にアフバースとワクフの監督職（ナザル・アル＝アフバース・ワ・ル＝アウカーフ）に就いた。なんと悪い後任であることか。
  en: Mūsā, al-Sharaf b. al-Badr Ḥasan. He was appointed to the supervision of the state treasury (naẕar al-dawla), then was removed from it in favour of Qāsim Shughayta; then (he was appointed) to the supervision of the aḥbās and the awqāf after al-Sharaf b. al-Baqarī—and what a bad replacement!
