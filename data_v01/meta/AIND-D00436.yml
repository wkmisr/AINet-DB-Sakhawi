translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・アブドゥルアジーズ・ブン・アリー、シハーブ・アッディーン。モースル出自、ダマスカスの人で、サーリヒーヤ〔地区〕に居住した（nazīl al-Ṣāliḥiyya）。「イブン・アル＝ハッバーズ（ابن الخباز）」として知られる。アブー・バクル・ブン・アル＝ラディー、ザイナブ・ビント・アル＝カマール、その他の人々から聴聞し（samiʿa）、〔ハディースを〕伝授した（ḥaddatha）。われわれの仲間である hāfiz のギルス・アッディーン・アル＝アクフファースィーが彼から聴聞した。思うに、彼（アル＝アクフファースィー）は私のために彼（イブン・アル＝ハッバーズ）からイジャーザを取り次いでくれた。〔ヒジュラ暦〕801年ラビーウ・アル＝アウワル月に、80いくつかの年齢で没した。これはわれらが師（シャイフ＝イブン・ハジャル）がその『アンバーゥ〔・アル＝グムル〕』で述べたところである。
  en: Shihāb al-Dīn Aḥmad b. Ibrāhīm b. ʿAbd al-ʿAzīz b. ʿAlī, originally from al-Mawṣil, resided in al-Ṣāliḥīya, Damascus. He was known as Ibn al-Khabbāz. He heard from Abū Bakr b. al-Raḍī, Zaynab bint al-Kamāl, and others, and he transmitted ḥadīth. Our shaykh's (Ibn Ḥajar's) colleague, al-Ḥāfiẓ Ghars al-Dīn al-Aqfahsī, heard from him. I (al-Sakhāwī) believe he granted me an ijāza. Our shaykh (Ibn Ḥajar) stated in his 『Inbāʾ al-Ghumr』 that he died in Rabīʿ al-Awwal of a year ending in 'one' (e.g., 801 H) at the age of some eighty years.
