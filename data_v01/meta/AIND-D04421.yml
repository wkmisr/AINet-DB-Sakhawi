notes:
- text: '原文「عبد الله بن إسماعيل . لعله إبراهيم」。【裁定 2026-09-18（§Da-1）】この「لعله إبراهيم」は父名（إسماعيل）の異伝ではなく、見出しに記されていない祖父名の推定である（校閲時の「父名の異伝」という読みを是正）。根拠は刊本の配列で、当該節は祖父名のアルファベット順に並び、本項（第45項）→ D04422（第46項 عبد الله بن إسماعيل بن عبد الله …）→ D04423（第47項 عبد الله بن إسماعيل بن عبد الله بن عمر …）と إبراهيم ＜ عبد الله の順に正しく収まる。同型の書式は D06443「مبارك بن جار الله . لعله ابن مبارك السقطي」。これにより転送見出し #AIND-D04424「عبد الله بن إسماعيل العفيف المدني . مضى فيمن جده إبراهيم قريبا」が本項を指すことと完全に整合する（世代のずれは存在しない）。persName type="full" は見出し形（祖父名を含まない形）のまま維持し、推定の祖父名は本注に留める。'
  lang: ja
  type: editorial
translation:
  ja: アブドゥッラー・ブン・イスマーイール。おそらく〔祖父名は〕イブラーヒーム。アッ＝シーラーズィー、のちアル＝マダニー。マッカに居住し、アル＝アフィーフ・アル＝マダニーとして知られる。マディーナで生まれ育ち、797年に同地でイブン・スィッディークから『ブハーリー〔のサヒーフ〕』の一部を聴聞した。ホルムズ、さらにはペルシア（アジャム）に入った。富裕で多くの家屋を所有していた。853年シャウワール月にマッカで没した。イブン・ファハドがその没年を記録している。
  en: ʿAbd Allāh b. Ismāʿīl — perhaps [his grandfather was] Ibrāhīm — al-Shīrāzī, then al-Madanī, a resident of Mecca, known as al-ʿAfīf al-Madanī. He was born and raised there [in Medina], where he heard part of al-Bukhārī [i.e. the Ṣaḥīḥ] from Ibn Ṣiddīq in the year 797 AH. He entered Hurmuz, indeed Persia (al-ʿAjam), and was wealthy, owning many houses. He died in Mecca in Shawwāl of the year fifty-three [853 AH]. Ibn Fahd recorded his death date.
