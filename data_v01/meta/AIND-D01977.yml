translation:
  ja: イスマーイール・ブン・ムハンマド・ブン・イスマーイール・ブン・イブラーヒーム・ブン・アブドゥッサマド、シャラフ・アル＝ハーシミー・アル＝アキーリー・アル＝ジャバルティー・アル＝ヤマンニー・アル＝ザビーディー。前出の人物の孫。 816年（ヒジュラ暦）に誕生した。 877年ズルヒッジャ月20日火曜日の昼にメッカで死去した。 イブン・ファハドが彼の死没年を記した。
  en: Ismāʿīl b. Muḥammad b. Ismāʿīl b. Ibrāhīm b. ʿAbd al-Ṣamad, al-Sharaf al-Hāshimī al-ʿAqīlī al-Jabartī al-Yamanī al-Zubaydī, grandson of the aforementioned (al-Māḍī). He was born in the year 816 H. He died on Tuesday, the 20th of Dhū al-Ḥijja, 877 H, in Mecca. Ibn Fahd recorded his death date.
