translation:
  ja: ムハンマド・ブン・スンクル、アブー・アッ＝スウード、アル＝ジャマーリー。マッカの寄寓者で、ヒスバ（市場監督）と併せてスルターンの造営の監督官を務めた。彼とその父は私（サハーウィー）から『ムサルサル』と『ズハイル・アル＝ウシャーリーのハディース』を聴聞し、私は二人のためにイジャーザを書いた。それどころか、彼は私のもとで『ナワウィーの四十ハディース』を朗読した。
  en: Muḥammad b. Sunqur, Abū al-Suʿūd al-Jamālī, a resident of Mecca, superintendent of the Sultan's building works together with the ḥisba. He and his father heard from me (al-Sakhāwī) al-Musalsal and the ḥadīth of Zuhayr al-ʿUshārī, and I wrote an ijāza for the two of them; indeed, he read al-Arbaʿīn al-Nawawiyya before me.
