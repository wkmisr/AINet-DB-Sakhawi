translation:
  ja: ユースフ・ブン・ハーリド・ブン・アイユーブ、ジャマール〔・ッディーン〕・アル＝ヒスファーウィー・アル＝ハラビー、シャーフィイー派。ヒスファーヤーはアレッポの村の一つ。アレッポで育ってクルアーンを暗記し、シハーブ・イブン・アビー・ッ＝リダーのもとで法学を修めて彼に師事し、その薫陶を受け、彼のもとで七読誦法を読んだ。次いでマールディーンへ旅してザイン・サルバジャーのもとで諸読誦法を読んだ。数年間マラティヤのカーディー職を、次いで幾度もアレッポのカーディー職を務め、同様にトリポリのカーディー職も再度務め、サファドのカーディー職と機密書記職も務め、カイロに入った。聡明で優れ、文法・クルアーン注釈・法学に通じ、容姿が良く、書に卓越し、良い詩を作った。ある人に宛てて書いたカスィーダの冒頭は「これはお前の顔か、それとも輝く満月の光か……」（2行）。829年ムハッラム月13日にトリポリで没した。イブン・ハティーブ・アン＝ナースィリーヤが彼に言及し、次いで我らの師〔イブン・ハジャル〕が『インバー』で簡略に言及した。
  en: Yūsuf b. Khālid b. Ayyūb, al-Jamāl al-Ḥisfāwī al-Ḥalabī al-Shāfiʿī; Ḥisfāyā is one of the villages of Aleppo. He grew up in Aleppo, memorised the Qurʾān, studied fiqh with al-Shihāb Ibn Abī al-Riḍā, to whom he attached himself and by whom he was trained, reading the seven readings to him; then he travelled to Mardin and read the readings there to al-Zayn Sarbajā. He held the judgeship of Malatya for years, then of Aleppo repeatedly, likewise of Tripoli again, and of Safad together with its secretaryship, and he entered Cairo. He was intelligent and accomplished, versed in grammar, exegesis and fiqh, handsome, an outstanding calligrapher and a good poet (two lines quoted). He died in Tripoli on 13 Muḥarram 829. Ibn Khaṭīb al-Nāṣiriyya mentioned him, then our shaykh briefly in the Inbāʾ.
