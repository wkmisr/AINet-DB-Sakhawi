translation:
  ja: アフマド・アッ＝シハーブ・イブン・アッ＝ディーワーン。アレッポのウスターダールを務めた後、イブン・アッ＝サウワの後任としてスルタン代理（ワキール・アッ＝スルターン）となった。894年ジュマーダー・アッ＝サーニー月9日にカイロで亡くなった。70歳を超えていた。父の名はアブー・バクル。
  en: Aḥmad al-Shihāb b. al-Dīwān. He served as Ustādār of Aleppo, then as Wakīl al-Sulṭān in succession to Ibn al-Ṣawwa. He died in Cairo on the ninth of Jumādā al-Thāniya in the year 894 H, having passed seventy years of age. His father's name was Abū Bakr.
