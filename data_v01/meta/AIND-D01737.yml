    en: 'D01737 (Ibn al-Dīwān) received the sultan''s wakāla (Wakīl al-Sulṭān of the Aleppo lands) in succession to the murdered Ibn al-Ṣawwa = Muḥammad b. Ḥasan b. Shaʿbān b. Abī Bakr al-Bāʿūrī = AIND-D07349 (full biography, killed 20 Rajab 885 H). Confirmed by AIND-D12471 (the "Ibn al-Ṣawwa al-Maqtūl" entry), which states the wakāla passed from the murdered Ibn al-Ṣawwa to "Ibn al-Dīwān, who received it from his cousin," and then to the cousin Abū Bakr in place of Ibn al-Dīwān. Provisional TMP-P-000628 DISCARDED (existing AIND identified). NOTE: D07349 and D12471 appear to be a duplicate pair for the same murdered person — separate name-authority merge question, out of B11 scope.'
