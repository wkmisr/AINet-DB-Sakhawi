notes:
- text: '転送見出し（原文末尾「يأتي فيمن لم يسم جده」による）。転送先は #AIND-D05999（عمر بن محمد القلشاني … المغربي التونسي الباجي الأصل … شارح الموطأ المالكي والد قاضي الجماعة محمد الآتي وأخو أحمد الماضي、未受領）。兄 #AIND-D01379「أحمد بن محمد بن عبد الله بن محمد أبو العباس القلشاني المغربي المالكي أخو عمر الآتي」・ニスバ索引 #AIND-D11943「أحمد وعبد الله وعمر بنو محمد بن عبد الله بن محمد بن خلف الله」により、本見出しのナサブ（عمر بن محمد بن عبد الله）と D05999 の同一性を確認。同じ人物への転送見出しに #AIND-D06043「عمر القلشاني . في ابن محمد」（B112）がある。'
