translation:
  ja: アクトゥーフ・アル＝ムーサーウィー・アッ＝ザーヒリー・バルクーク。バルクークのマムルークであったが、ムアイヤドの時代に副ダワーダールになり、その後アミール・アシャラ（十人長）となり、アシュラフの時代にムハンマンダーリーヤ職に就き、その後アミール・タブルハーナー（四十人長）となった。その後、度々追放され、852年サファル月12日の火曜日の夜、内臓の弱りの後、カイロで失職したまま死去した。翌日葬儀が営まれたが、彼の行状は褒められたものではなかった。
  en: Aqtūh al-Mūsāwī al-Ẓāhirī Barqūq. He was one of Barqūq's mamluks, then became a junior dawādār during the days of al-Muʾayyad, then an amīr ʿashara. He then held the muhammandāriyya office during the days of al-Ashraf, and later the imrat ṭablkhānāh. He was subsequently exiled repeatedly until he died unemployed in Cairo after suffering from internal weakness on the night of Tuesday, the 12th of Ṣafar, 852 H. His funeral prayer was performed the next day, but his conduct was not praised.
