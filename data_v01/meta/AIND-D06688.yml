translation:
  ja: ムハンマド・ブン・アフマド・ブン・アブド・アッ＝ラフマーン・ブン・ムハンマド・ブン・アビー・バクル・ブン・アリー・ブン・ユースフ、アル＝ジャマール・アル＝アンサーリー・アル＝マッキー、シャーフィイー派。アル＝ジャマール・アル＝ミスリーの孫の子で、前出のアリーとウマルの兄弟。クルアーンと『ミンハージュ』その他を暗記した者の一人。848年にマッカで生まれた。カイロに入り、マディーナを参詣し、のち（8）82年ズー・アル＝ヒッジャ月にマッカで没した。イブン・ファハドがその没年を記している。
  en: Muḥammad b. Aḥmad b. ʿAbd al-Raḥmān b. Muḥammad b. Abī Bakr b. ʿAlī b. Yūsuf, al-Jamāl al-Anṣārī al-Makkī, the Shāfiʿī, son of the grandson of al-Jamāl al-Miṣrī and brother of the aforementioned ʿAlī and ʿUmar. One of those who memorized the Qurʾān, the Minhāj and other texts. He was born in the year 848 in Mecca. He entered Cairo and visited Medina, then died in Mecca in Dhū al-Ḥijja of the year [8]82. Ibn Fahd recorded his death date.
