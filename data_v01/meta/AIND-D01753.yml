translation:
  ja: アフマド・アッ＝シハーブ・アッ＝ダミーリー。彼は有徳の人で、多くの法学上の問題を記憶していた。いくつかの地域、そしてカイロで裁判官の代理（ナーイブ・アル＝カーディー）を務めた。背中の痛み、次いで下痢により長期間病に臥した。843年サファル月21日に亡くなり、私（サハーウィー）は彼が60歳を超えていたと思う。我らがシャイフ（イブン・ハジャル）が『インバー・アル＝グムル』において彼について述べている。
  en: Aḥmad al-Shihāb al-Damīrī was a virtuous man who kept many jurisprudential questions in memory. He served as deputy judge in some districts and in Cairo. He suffered a prolonged illness, first with back pain, then with diarrhea. He died on the 21st of Ṣafar in the year 843 H, and I believe he had passed sixty years of age. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ al-Ghumr.
