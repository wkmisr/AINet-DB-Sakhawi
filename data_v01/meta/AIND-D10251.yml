translation:
  ja: ヤフヤー・ブン・サダカ・ブン・サブウ。父と同じくズィフターのムドリク（在地の治安責任者）で、祖父の名で知られる。巡礼を行った者の一人で、その滞留（ムジャーワラ）のあいだ、善行と徳をもって語られた。
  en: Yaḥyā b. Ṣadaqa b. Sabʿ, the mudrik (local headman responsible for security) of Ziftā like his father, known by his grandfather's name. He was among those who performed the pilgrimage, and during his sojourn (mujāwara) he was spoken of for piety and goodness.
