translation:
  ja: アフマド・ブン・ムハンマド・ブン・アブド・アッ＝ラフマーン・ブン・アブド・アル＝マフムード・アッ＝スフラワルディー・アル＝バグダーディー。彼は父とともにスィラージュ・アル＝カズウィーニーから学び、アブドゥルアズィーズ・ブン・アリー・アル＝バグダーディー・アル＝カーディーが811年に彼から学んだ。彼はおそらくハンバル法学派であった。
  en: Aḥmad b. Muḥammad b. ʿAbd al-Raḥmān b. ʿAbd al-Maḥmūd al-Suhrawardī al-Baghdādī. He participated with his father in acquiring knowledge from al-Sirāj al-Qazwīnī. Al-ʿIzz ʿAbd al-ʿAzīz b. ʿAlī al-Baghdādī al-Qāḍī studied under him in the year 811 H. I believe he was Hanbali.
