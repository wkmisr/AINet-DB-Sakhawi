translation:
  ja: イブラーヒーム・ブン・フサイン・ブン・ユースフ・ブン・ヒバ・アル＝ハラビー、文法学者で有徳の人物。おそらく彼がイブン・アッ＝シャフナ・アッ＝サギールにクルアーンを教授していた人物であろう。彼の伝記は、父の名が言及されていない人物の項で後述される。
  en: Ibrāhīm b. Ḥusayn b. Yūsuf b. Hiba al-Ḥalabī, the grammarian, the virtuous one. I believe he is the one who used to teach Ibn al-Shiḥna al-Ṣaghīr. He will be mentioned in the section on those whose fathers are not named.
