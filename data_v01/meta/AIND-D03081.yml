translation:
  ja: サアド・ブン・アフマド・ブン・マンスール・サアド・アッ＝ディーン・アル＝アッタール。メッカ在住。バーブ・アッ＝サラーム（平和の門）の薬種商頭領（シャイフ）で、サアド・アル＝ワルカーンとして知られた。有力者との交際（出入り）があった。ハジュル暦862年シャアバーン月に死去し、子孫を残した。
  en: Saʿd b. Aḥmad b. Manṣūr Saʿd al-Dīn al-ʿAṭṭār, in Mecca. He was known as Saʿd al-Warkān, the chief (shaykh) of the druggists at Bāb al-Salām, and he had access [to influential people]. He died in Shaʿbān, in the year 862 AH, leaving descendants.
