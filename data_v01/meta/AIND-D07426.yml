notes:
- text: '転送見出し（原文末尾「يأتي قريبا」による）。転送先は #AIND-D07429a「محمد بن سعيد بن محمد بن عبد الوهاب بن علي بن يوسف فتح الدين أبو الفتح بن الجمال بن الفتح أبي الفتح الأنصاري الزرندي المدني الحنفي ابن قاضي المدينة وأخو علي قاضيها الماضيين وهو بكنيته أشهر」（英字接尾辞付き番号、未受領）。本見出しの「بن أبي الفتح」は祖父 محمد بن عبد الوهاب のクンヤ「الفتح أبي الفتح」に対応し、本見出しを除くと「محمد بن سعيد」で「يأتي قريبا」に当たる見出しは corpus で D07429a のみ（D07427 القباني・D07428 ابن كبن・D07430 سويدان は別人）。'
