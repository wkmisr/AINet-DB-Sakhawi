    ja: '「حفيد شيخ الخانقاه السرياقوسية كان」。【集約】corpus でサルヤークースのハーンカーのシャイフとして記録されるのは #AIND-D07144「محمد ابن أوحد استقر في مشيخة الخانقاه الناصرية بسرياقوس … سنة اثنتي عشرة … إلى أوائل سنة خمس عشرة」のみで、أوحد 本人の記録はない（hw.py「أوحد」）。子 #AIND-D08152「حفيد شيخ الخانقاه الماضي أبوه وجده」の「الماضي … جده」が指しうる既出項も D07144 だけ。見出し「محمد ابن أوحد」の ابن は家名（通称）とみられ、本項主のナサブ「فتح بن أوحد」は「فتح بن (محمد) ابن أوحد」の家名省略と読む。字義（ナサブの祖父 أوحد）との食い違いがあるため cert medium（内容A・内容B M、§D119-4 付記）。校閲時の仮番号 取り下げた仮番号 B122-P08 は取り下げ。初版は #NEEDID で desc に職名のみ。'
