translation:
  ja: アリー・ブン・ファトフ・ブン・アウハド、アン＝ヌール・アル＝ハーンキー。かつてのスィルヤークース・ハーンカーのシャイフの孫で、後述するムハンマドの父。そこで姻戚のイッズ・アッ＝ディーン・アル＝マヌーフィーの代理として裁判（カーディー職の代理）を務め、彼の後も生き延びて、890年ラビーウ第2月に没した。
  en: ʿAlī b. Fatḥ b. Awḥad, al-Nūr al-Khānkī, grandson of the former shaykh of the Siryāqūs khānqāh and father of Muḥammad, who will come below. He served as deputy judge there on behalf of his relative by marriage ʿIzz al-Dīn al-Munūfī, and outlived him until he died in Rabīʿ II of the year 890.
