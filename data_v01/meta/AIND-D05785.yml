    ja: '見出しナサブから。corpus の أحمد 部 #AIND-D00452「أحمد بن إبراهيم بن محمد بن عيسى بن مطر بن علي بن عثمان شهاب الدين أبو القسم بن ضياء الدين أبي إسحاق … ذكره ابن فهد وأنه أجاز لهم في سنة تسع عشرة」はナサブ6代（… بن علي بن عثمان は #AIND-D11059・D11084 の ابن مطير 家の系譜と一致）・ラカブ الشهاب（孫 #AIND-D01162「الشهاب بن الشرف بن الشهاب بن أبي إسحاق」）が一致するが、刊本の綴りは「مطر」で「مطير」と1字異なる（規則25により両方そのまま記録）。【集約】D00452 のクンヤ「أبو القسم」＝子 D11059 の名、孫 D01162「الشهاب بن الشرف بن الشهاب بن أبي إسحاق」のラカブ連鎖、ナサブ6代がすべて一致し、内容検証B も確定を支持するため cert medium を外す（§D103-3）。D00452 は repo 収録済み（Individuals/0000-0999）。'
