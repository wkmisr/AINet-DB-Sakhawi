translation:
  ja: ウマル・ブン・アフマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・イーサー・ブン・ムタイル・アル＝ハカミー・アル＝ヤマーニー・アッ＝シャーフィイー。アブー・アル＝カースィムらの兄弟で、アル＝ファター（若者）とあだ名された。兄弟（アブー・アル＝カースィム）の後を継いでその職に就いた。彼は善良な法学者で、教授しファトワーを出した、とアル＝アフダルは述べている。
  en: ʿUmar b. Aḥmad b. Ibrāhīm b. Muḥammad b. ʿĪsā b. Muṭayr al-Ḥakamī al-Yamānī al-Shāfiʿī, the brother of Abū al-Qāsim and others; he was nicknamed al-Fatā. He succeeded his brother in the post. He was a good jurist who taught and issued fatwās, so said al-Ahdal.
