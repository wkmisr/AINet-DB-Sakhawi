notes:
- text: '転送見出し（原文末尾「مضى فيمن جده على」による）。転送先は #AIND-D04401（عبد الله بن أحمد بن علي عفيف الدين أبو محمد وأبو مخرمة الحميري الشيباني الحضري الهجراني المدني الدار اليماني الشافعي ويعرف بأبي مخرمة、#26）。閉合根拠: ナサブ「عبد الله بن أحمد بن علي」・ラカブ「عفيف الدين」・クンヤ「أبو محمد」が完全一致する候補が corpus 中に他になし。⚠D04401 のニスバは「الحضري」で本項の「الحضرمي」と綴りが異なる(写本/転写差の可能性、要Waka確認・ISSUES参照)。本REF化により初版の汚染番号 TMP-P-000530(=AIND-D04287の兄弟علي専用、grandfather relationへの誤用)の流用が消滅する。'
