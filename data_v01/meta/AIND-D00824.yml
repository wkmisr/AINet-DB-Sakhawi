translation:
  ja: アハマド・ブン・アブドゥッラフマーン・ブン・アブドゥッラー・ブン・ファドル・アル＝ハワーリー・アッ＝ディマシュキー、次いでアル＝マッジーの出身で、シャーフィイー派の法学者。彼自身の手で書かれた著作があり、当時ガザ市のシャラフィー・ユーヌス・アル＝アシュラフィー（モスクまたはマドラサ）のイマームであったと述べられている。843年ジュマーダー・アッ＝サーニー月（第6月）5日火曜日に亡くなった。
  en: Aḥmad b. ʿAbd al-Raḥmān b. ʿAbd Allāh b. Faḍl al-Ḥawārī, originally from Damascus, then al-Mazzī, a Shāfiʿī scholar. He wrote various works in his own hand and was said to be the Imām at al-Sharafī Yūnus al-Ashrafī in the city of Ghazza at that time. He died on Tuesday, the 5th of Jumādā al-Thānī in the year 843 AH.
