translation:
  ja: ムハンマド・ブン・アリー・ブン・マフムード・アル＝マッキー・アル＝カイヤール（計量人）。アル＝マジュヌーンとして知られる。マッカで私（サハーウィー）から聴聞した者の一人。888年ムハッラム月17日火曜日に同地（マッカ）で没し、マアラー墓地に葬られた。
  en: Muḥammad b. ʿAlī b. Maḥmūd al-Makkī al-Kayyāl (the measurer), known as al-Majnūn. He was among those who heard from me (al-Sakhāwī) in Mecca. He died there on Tuesday, 17 Muḥarram 888, and was buried at al-Muʿallā.
