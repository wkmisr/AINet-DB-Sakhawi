translation:
  ja: ダガイム・ブン・ハシュラム・ブン・サービト・ブン・ヌアイル・アル＝フサイニー。マディーナのアミール。769年シャウワール（1368年5/6月）にマディーナの支配者（アミール）に任命されたが、約4か月間留まった後にイブラーヒーム・ブン・スライマーンに取って代わられた。その後、イブラーヒームの死後の774年（1372/73年）に再任され、783年ラマダーン（1381年11/12月）までその職を務めたが、カスィイタル・ブン・ズハイルに取って代わられて罷免された。
  en: Ḍaghaym b. Khashram b. Thābit b. Nuʿayr al-Ḥusaynī, Amir of Medina. He was appointed as its governor in Shawwāl 769 AH, remaining in office for about four months before being replaced by Ibrāhīm b. Sulaymān. He was reinstated after Ibrāhīm's death in the year 774 AH and continued until Ramaḍān 783 AH, when he was dismissed and replaced by Qusayṭal b. Zuhayr.
