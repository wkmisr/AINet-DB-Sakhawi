translation:
  ja: ウマル・ブン・ムハンマド・アッ＝タラーブルスィー、バアルバックの法学者でダマスクス寄留。アル＝バドル・ブン・カーディー・シュフバが彼のために（職を）譲ったことにより、同地（ダマスクス）のアル＝ムジャーヒディーヤ・アル＝ジャウワーニーヤで教授した者の一人。その後、彼自身がそれをアル＝ブルハーン・ブン・アル＝ムウタミドに譲った。
  en: ʿUmar b. Muḥammad al-Ṭarābulusī, the jurist of Baʿlabakk and resident of Damascus. He was among those who taught there at al-Mujāhidiyya al-Jawwāniyya, al-Badr b. Qāḍī Shuhba having ceded it to him; then he in turn ceded it to al-Burhān b. al-Muʿtamid.
