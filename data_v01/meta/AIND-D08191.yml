notes:
- text: '同名異人に注意: カイロの ابن القطان 家の الشمس محمد بن علي بن محمد（بن عمر بن عيسى）السمنودي المصري＝#AIND-D08574（المحمدان البهاء والمحب の父）は別人。ニスバ索引 #AIND-D12646「ابن القطان الشمس محمد بن علي بن محمد بن عمر بن عيسى وابناه … وقد شارك الشمس آخر في اسمه واسم أبيه وجده وهو محمد بن علي بن محمد بن القطان المشهدي」がサハーウィー自身の区別。したがって #AIND-D03794（عبد الرحمن بن المحب محمد بن الشمس محمد … ابن القطان）らの祖父は D08574 であり本項主ではない。'
