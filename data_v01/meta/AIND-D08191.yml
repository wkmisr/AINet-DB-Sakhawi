translation:
  ja: ムハンマド・ブン・アリー・ブン・ムハンマド、アッ＝シャムス・アル＝マシュハディー、イブン・アル＝カッターン。我らがシャイフ（イブン・ハジャル）が『インバーゥ』で彼に言及して言う。「アル＝ワリー・アル＝マッラウィーやその同類から学び、理性的諸学に注力した。大いに研鑽して頭角を現した。医学を知っていたが、治療の心得はなかった。私（イブン・ハジャル）は彼のファワーイド（有益な伝承）を聴いた。（8）19年の疫病で、60歳前後で没した。」
  en: 'Muḥammad b. ʿAlī b. Muḥammad, al-Shams al-Mashhadī, Ibn al-Qaṭṭān. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ, saying: "He studied under al-Walī al-Mallawī and the like, and devoted himself to the rational sciences. He worked hard until he became accomplished. He knew medicine but had no competence in treatment. I (Ibn Ḥajar) heard his fawāʾid (useful traditions). He died in the plague of the year [8]19, aged about sixty."'
