translation:
  ja: ムハンマド・ブン・アブドゥルアズィーズ・ブン・ムハンマド、ジャラール・アッ＝ディーン・イブン・アル＝イッズ・イブン・アル＝バドル、ハッラーンを本貫とするアル＝カーヒリー・アル＝カーディリー。前述のアブドゥルカーディルの同父兄弟であり、アル＝ムヒッブ・イブン・バルカー・アル＝カーディリーの同母兄弟。クルアーンと『ウムダ』を暗記し、我らがシャイフ（イブン・ハジャル）らから、たとえばアッ＝ザーヒリーヤでの『ブハーリー』のように聴聞した（彼はそこでそれを聴聞した）。イブン・ファハドらの依頼状により一群の人々が彼にイジャーザを与えたが、イブン・ファハドは彼の父の名をくり返しムハンマドと記しており、これは誤りである。壮年に達する前、860年頃に没した。神よ彼を憐れみたまえ。
  en: Muḥammad b. ʿAbd al-ʿAzīz b. Muḥammad, Jalāl al-Dīn b. al-ʿIzz b. al-Badr, of Ḥarrānī origin, al-Qāhirī al-Qādirī, paternal brother of the aforementioned ʿAbd al-Qādir and maternal brother of al-Muḥibb b. Balkā al-Qādirī. He was among those who memorised the Qurʾān and al-ʿUmda, and heard from our shaykh (Ibn Ḥajar) and others, for instance al-Bukhārī at al-Ẓāhiriyya, where he attended its audition. A group granted him an ijāza at the request of Ibn Fahd and others, though Ibn Fahd repeatedly named his father Muḥammad, which is an error. He died before reaching middle age, in about the year 860. May God have mercy on him.
