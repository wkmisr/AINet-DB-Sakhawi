translation:
  ja: 701. アフマド・ブン・ユースフ、尊称はシハーブ・アル=ハティーブ（説教師）、ドゥラーバと呼ばれる（ドゥラーバは無点字にダンマ、ラーに重字、アリフの後に単点字）。少し学問に従事し、長らく証人たちと共に座した。判決署名官（タウキーウ・アル=フクム）、次に文書署名官（タウキーウ・アッ=ダラジュ）、次に大書記局（アッ=ダスト）を務めた。内面は清廉で、悪事は少なかったが、いくらか放心の気があった。845年ラジャブ月に90歳近くで死去した。我らがシャイフ（イブン・ハジャル）が自著『インバーゥ（・アル=グムル）』で彼に言及している。
  en: 701. Aḥmad b. Yūsuf, known as al-Shihāb al-Khaṭīb, and nicknamed Darāba (with a ḍamma on the undotted letter, a shadda on the rāʾ, and a single-dotted letter after the alif). He worked a little and sat with the witnesses for a long time. He held the office of signator of judicial decrees (tawqīʿ al-ḥukm), then signator of rolls (tawqīʿ al-daraj), and then the grand chancery (al-Dust). He was pure-hearted, with little evil, though somewhat heedless. He died in Rajab of 845 AH, having nearly reached ninety years of age. Our shaykh (Ibn Ḥajar) mentioned him in his 『Inbāʾ (al-Ghumr)』.
