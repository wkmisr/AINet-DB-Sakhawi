translation:
  ja: ムハンマド・ブン・アブドゥッラティーフ・ブン・ムハンマド・ブン・ユースフ・ブン・アル＝ハサン・アッ＝ザランディー・アル＝マダニー。私（サハーウィー）は彼が前項の人物の祖父であると思う。ヒジュラ暦834年にアル＝ジャマール・アル＝カーザルーニーから聴聞した。
  en: Muḥammad b. ʿAbd al-Laṭīf b. Muḥammad b. Yūsuf b. al-Ḥasan al-Zarandī al-Madanī. I (al-Sakhāwī) think he is the grandfather of the preceding one. He heard from al-Jamāl al-Kāzarūnī in the year 834.
