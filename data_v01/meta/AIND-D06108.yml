translation:
  ja: イーサー、アブー・アッ＝ルーフ、アル＝バグダーディー・アル＝ファルーヒー・アル＝ハナフィー、ダマスクスの寄留者。アラビア語学と形態論などを教授した。彼から学んだ者の一人にアル＝アラー・アル＝マルダーウィーがおり、彼を「大学者、法学者、相続法学者、法源学者、文法学者、形態論学者、厳密で精確な校訂者」と評し、教え方が上手で学ぶ者に対して誠実であったと述べている。
  en: ʿĪsā Abū al-Rūḥ al-Baghdādī al-Falūḥī al-Ḥanafī, resident of Damascus. He taught Arabic grammar, morphology, and other subjects. Among those who studied under him was al-ʿAlāʾ al-Mardāwī, who described him as the erudite scholar, the jurist, the expert in inheritance shares, the legal theorist, the grammarian, the morphologist, precise and accurate in his redactions, and said that he was a fine teacher and sincere toward the student.
