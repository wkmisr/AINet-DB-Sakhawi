translation:
  ja: ムーサー・ブン・ウマル・ブン・アウド・ブン・アティーヤ・ブン・アフマド・ブン・ムハンマド・ブン・アブドゥッラフマーン、アッ＝シャラフ、アル＝ラッカーニー、アル＝アズハリー、アル＝マーリキー。前述のアッ＝シャムス・ムハンマドの父。エルサレムでイブラーヒーム・アッ＝ザイターウィーからイブン・マージャの『スナン』を、また低い伝承経路で『ブハーリー』を聴聞した。イブン・マージャ（の『スナン』）の一部を伝承し、アル＝カルーターティーがそれを彼の前で読んだ。我らがシャイフ・アッ＝シュムンニーにイジャーザを与えた。カイロの公証人（ウドゥール）の一人であった。我らがシャイフ（イブン・ハジャル）は『インバー』で彼に言及し、曾祖父（遠祖）にちなんで「ムーサー・ブン・アティーヤ」と呼び、法学（に通じた者）と評した。（8）10年に没した。
  en: Mūsā b. ʿUmar b. ʿAwaḍ b. ʿAṭiyya b. Aḥmad b. Muḥammad b. ʿAbd al-Raḥmān, al-Sharaf al-Laqānī al-Azharī al-Mālikī, father of the aforementioned al-Shams Muḥammad. He heard the Sunan of Ibn Māja in Jerusalem from Ibrāhīm al-Zaytāwī, and (heard) al-Bukhārī through a low chain of transmission (bi-nuzūl). He transmitted part of Ibn Māja, which al-Kulūtātī read before him, and he granted an ijāza to our shaykh al-Shumunnī. He was one of the notary-witnesses (ʿudūl) of Cairo. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ, calling him Mūsā b. ʿAṭiyya after his distant ancestor, and described him as (versed in) jurisprudence. He died in the year (8)10.
