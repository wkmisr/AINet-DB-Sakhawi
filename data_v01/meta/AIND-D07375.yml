translation:
  ja: ムハンマド・ブン・アル＝ハワージャー・ダーウード・ブン・アリー・ブン・アル＝バハー・アル＝キーラーニー。彼の父は前述。父および二人の兄弟スライマーンとアリーと同じく、ヒジュラ暦842年にアレクサンドリアで没した。イブン・ファハドが彼らの没年を記録している。
  en: Muḥammad b. al-Khawājā Dāwūd b. ʿAlī b. al-Bahāʾ al-Kīlānī. His father was mentioned previously. He died in Alexandria in the year 842 AH, like his father and his two brothers Sulaymān and ʿAlī. Ibn Fahd recorded their dates.
