translation:
  ja: アーマド・ブン・アリー・ブン・ムハンマド・ブン・ウマル・ブン・アブドゥッラー。シャハーブッディーン・アッ=ラッダディー。ハナフィー派。二人のムハンマドの兄弟。少し活動した。861年シャアバーン月半ばに64歳で死去した。アッラーが彼を赦されんことを。
  en: Aḥmad b. ʿAlī b. Muḥammad b. ʿUmar b. ʿAbd Allāh, Shihāb al-Dīn al-Raddādī al-Ḥanafī. He was the brother of the two Muḥammads. He was moderately active. He died in mid-Shaʿbān in the year 861 at the age of 64. May God forgive him.
