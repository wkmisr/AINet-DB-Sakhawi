translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アフマド、アル＝クトゥブ・ブン・アル＝カーフィー・ブン・アル＝ファフル・アル＝ハフリー。732年サファル月の末日に生まれた。アッ＝ターウースィーが819年にシーラーズで彼に会い、「高徳で霊的開示（ムカーシャファ）を得たシャイフであり、90年以上生き、多く旅をし、大シャイフたちの一群に出会った」と述べている。神が彼を憐れみたまわんことを。
  en: Muḥammad b. Ibrāhīm b. Aḥmad, al-Quṭb b. al-Kāfī b. al-Fakhr al-Khafrī. He was born on the last day of Ṣafar of the year 732. Al-Ṭāwūsī met him in Shīrāz in the year 819 and said that he was a virtuous shaykh possessed of spiritual unveiling, who lived more than ninety years, travelled much, and met a host of the great shaykhs. May God have mercy on him.
