translation:
  ja: アハマド・ブン・イブラーヒーム・ブン・アハマド・ブン・アビーバクル・ブン・アブドゥルワッハーブ（アッ＝シャハーブ）。我らがシャイフ（イブン・ハジャル）は彼にアッ＝ディヤーというラカブを与えた。アブー・アルアッバース・アルムルシディー・アルファウィー・アルマッキー・アッ＝シャーフィイーで、ジャマール・ムハンマド・ブン・アブドゥッラー・ブン・アブドゥルムゥティーの母方の孫。ジャマール・ムハンマドとジャラール・アブドゥルワーヒドの兄弟にあたる。 彼は763年にメッカで生まれ、5歳の時にそこでイッズ・ブン・ジャマーアのマンスキー・アルカビールやツサーイート・アルアルバインなどを聴講した。アルヤーフィイーからはアッ＝サヒーフを聴聞し、ザイン・ブン・アルカーリーからはジュズー・イブン・アッ＝タラーイヤを、母方の祖父からはサヒーフ・イブン・ヒッバーンなどを聴聞した。また、ザイナブ・イブン・アハマド・ブン・マイムーン・アッ＝トゥーニスィー、そしてアハマド・ブン・アッ＝ラディー・アッ＝タバリーの二人の娘、ウム・アルハサンとウム・アルフサイン（二人ともファーティマという名）ら多数の人々から聴聞した。 カイロではイブン・アッ＝シャヒードのナズム・アッ＝シーラを、ダマスカスではアル＝ムヒッブ・アッ＝サーミトから多くを聴聞した。イブン・ラーフィア、アルアスナーイー、アルバハー・アッ＝サブキー、アルカマール・ブン・ハビーブ、ウマル・ブン・イブラーヒーム・アン＝ナカビー、イブン・カワーリーフ、イブン・アルハバル、イブン・アン＝ナジム、アッ＝サラフ・ブン・アビーウマル、イブン・ウマイラ、アブー・アルバカー・アッ＝サブキーなどからイジャーザ（伝授許可）を与えられた。 彼から聴聞した者には、アッ＝タキー・ブン・ファハドとその息子たち、アルアビー、アルブルハーン・ブン・ザヒーラといった多くの優秀な人々がいる。 彼は832年ズー・アルカアダ月4日の金曜日の昼過ぎにメッカで亡くなった。盲目になっていた。 عصرの礼拝の後に彼のために葬儀が執り行われ、その後アルムアッラーに埋葬された。彼の葬儀は盛大であった。我らがシャイフ（イブン・ハジャル）は自身の伝記集で彼を簡潔に触れており、「私の息子たちにアルマラーキシィーの記述に基づいてイジャーザを与えた」と述べている。また、彼の訃報について、「死の一年前にバガウィーのシャルフ・アッ＝スンナを師たちの一部からのイジャーザに基づいて伝承し、死の一ヶ月前にはアッ＝シャマーイルをサラフからのイジャーザに基づいて伝承した」と述べている。
    彼の生年は60年で、死没は木曜日であると記述されているが、両方で最初の記述がより確実である。アル＝マクリーズィーもウクードで彼に簡潔に言及している。
  en: Ahmad b. Ibrāhīm b. Aḥmad b. Abī Bakr b. ʿAbd al-Wahhāb (al-Shihāb). Our shaykh (Ibn Ḥajar) gave him the laqab al-Ḍiyāʾ. He was Abū al-ʿAbbās al-Murshidī al-Fuwī al-Makkī al-Shāfiʿī, the maternal grandson of al-Jamāl Muḥammad b. ʿAbd Allāh b. ʿAbd al-Muʿṭī, and the brother of al-Jamāl Muḥammad and al-Jalāl ʿAbd al-Wāḥid. He was born in Mecca in 763 H. In his fifth year (768 H), he attended in Mecca the major rites (mansak) of al-ʿIzz b. Jamāʿa, his forty devotional litanies (tusāʿiyyāt), and other works. He heard al-Ṣaḥīḥ from al-Yāfiʿī. He heard Juzʾ Ibn al-Ṭalāyah from al-Zayn b. al-Qārī, and Ṣaḥīḥ Ibn Ḥibbān and other works from his maternal grandfather. He also heard from Zaynab, the daughter of Aḥmad b. Maymūn al-Tūnisī, and from the two sisters, Umm al-Ḥasan and Umm al-Ḥusayn (both named Fāṭima), daughters of Aḥmad b. al-Raḍī al-Ṭabarī, among others. It is mentioned that he also heard in Cairo from Ibn al-Shahīd his Naẓm al-Sīra, and and in Damascus he heard much (al-kathīr)
    from al-Muḥibb al-Ṣāmit. He received ijāza from Ibn Rāfiʿ, al-Asnāʾī, al-Bahāʾ al-Subkī, al-Kamāl b. Ḥabīb, ʿUmar b. Ibrāhīm al-Naqabī, Ibn Qawāliḥ, Ibn al-Habal, Ibn al-Najm, al-Ṣalāḥ b. Abī ʿUmar, Ibn Umayla, Abū al-Baqāʾ al-Subkī, and others. He transmitted ḥadīth, and distinguished scholars such as al-Taqī b. Fahd, his two sons, al-Abī, and al-Burhān b. Ẓahīra heard from him. He died on Friday afternoon, the fourth of Dhū al-Qaʿda in 832 H in Mecca, after he became blind. His funeral prayer was held after the ʿAṣr prayer, and he was then buried in al-Muʿallā. His funeral was well-attended. Our shaykh (al-Sakhāwī is referring to Ibn Ḥajar al-ʿAsqalānī) mentioned him briefly in his dictionary and said, “He granted ijāza to my children based on the benefit of al-Marākushī.” In his biographical notices (anbāʾ), Ibn Ḥajar stated that Aḥmad narrated al-Baghawī's Sharḥ al-Sunna a year before his death, with an ijāza from some of his shaykhs, and narrated al-Shamāʾil a month before his death,
    with an ijāza from al-Ṣalāḥ. His birth year is recorded as 760 H and his death on a Thursday, but the first date for both (763 H and Friday, 4 Dhū al-Qaʿda 832 H) is more authenticated. al-Maqrīzī also mentioned him briefly in his ʿUqūd.
