translation:
  ja: アブドゥルラフマーン・ブン・アフマド・ブン・ウスマーン、アッ＝ザイン・アッ＝スワイディー、マーリク派。ダマスクスのカーディー（判事）。カイロに赴き、［誰々のもとで］勉学に励んだ。ダマスクスのマーリク派カーディー職を務めた。861年ズー・アル＝ヒッジャ月24日（土曜日）に没した。ダマスクス・モスクで葬儀礼拝が行われ、バーブ・アッ＝サギール墓地に埋葬された。彼の葬儀には多くの人々が参列した。アッラーの慈悲があらんことを。
  en: Abd al-Rahman b. Ahmad b. 'Uthman al-Zayn al-Suwaydi, al-Maliki. He served as the judge of Damascus. He came to Cairo, engaged in studies, and held the Maliki judgeship in Damascus. He passed away on Saturday, 24th of Dhu al-Hijja, 861 AH. The funeral prayer was held at the Mosque of Damascus, and he was buried in the Bab al-Saghir cemetery. His funeral was widely attended. May Allah have mercy on him.
