translation:
  ja: ターヒル。カイロにやって来てバルクークィヤ（マドラサ）に滞留し、学生たちに教授した人物。彼に（本を）読んだ者の中に、我々の同輩であるビージューリーの孫のシハーブがおり、彼（シハーブ）は（ロジックの）クトゥブの大部分を彼（ターヒル）に読んだ。また彼は私に、彼がマッカで亡くなったと語った。
  en: Ṭāhir. A man who came to Cairo, stayed at the Barqūqiyya, and taught the students. Among those who read to him was our companion al-Shihāb, the grandson of al-Bījūrī, who read most of al-Quṭb to him. He told me that he died in Mecca.
