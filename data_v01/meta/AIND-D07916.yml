translation:
  ja: ムハンマド・ブン・アッ＝タージュ・アブドゥルワッハーブ・ブン・アリー・ブン・ハサン・アン＝ナトゥーブスィー、（ナトゥーブス）出自、カイロの人、マッカの人、旧ザーヒリーヤ学院の住人。その父は既述。成長してクルアーンなどを暗記し、少し学問に携わり、アッ＝ザイン・ジャアファル・アッ＝サンフーリーのもとで諸朗誦法によって（クルアーンを）誦んだ。私が彼（ジャアファル）の代講として彼（本項主）の住む所でハディースの講義を行った際、私のもとに出席した。その後、彼はその講義を自ら務め、同所での朗誦学の教授席も兼ね、さらにそのワクフの管財人に代わって（管理を）担い、同じくザーヒル・フシュカダム廟の説教職も務めた。彼は巧みで機敏であり、もし学問に励めば大成したであろうが、自らを台無しにした。
  en: Muḥammad b. al-Tāj ʿAbd al-Wahhāb b. ʿAlī b. Ḥasan al-Naṭūbisī by origin, the Cairene, the Meccan, resident of the old Ẕāhiriyya; his father was mentioned above. He grew up, memorized the Qurʾān and other texts, studied a little, and recited (the Qurʾān) in the various readings under al-Zayn Jaʿfar al-Sanhūrī. He attended my lessons when I was deputizing for him (Jaʿfar) in the teaching of ḥadīth at his (the subject's) place of residence; then he took over those lessons himself, together with the chair of the readings there, and even acted on behalf of the supervisor of its endowments; likewise he served as preacher at the tomb of al-Ẕāhir Khushqadam. He is clever and quick-witted, and had he applied himself he would have amounted to something, but he wasted himself.
