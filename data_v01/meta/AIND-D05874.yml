translation:
  ja: ウマル・ブン・アブドゥルアズィーズ、我らが同僚ナジュム・ウマル・ブン・アッ＝タキー・ムハンマド・ブン・ムハンマド・ブン・ファハドの孫。（8）89年に生まれたので、私はムスニドであるユースフ・アル＝アジャミーの孫アリーに手紙を送ったところ、彼にイジャーザを与え、アン＝ナッジャードの『ムスナド・ウマル』の聴聞記録（タバカ）に書き記した。ほどなくして彼は没した。
  en: ʿUmar b. ʿAbd al-ʿAzīz, grandson of our companion al-Najm ʿUmar b. al-Taqī Muḥammad b. Muḥammad b. Fahd. He was born in (8)89, so I wrote to ʿAlī, the grandson of Yūsuf al-ʿAjamī, the musnid, who granted him an ijāza and entered him in the audition record (ṭabaqa) of al-Najjād's Musnad ʿUmar. He did not live long and died.
