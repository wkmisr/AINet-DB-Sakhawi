translation:
  ja: ヤフヤー・ブン・アジュラーン、アスユート出自のアル＝マッキー。イブン・アッ＝シャリーファとして知られる。クルアーンと『ミンハージュ』を暗記した者の一人で、生計を求めてハバシャ（エチオピア）、インド、カイロ、シャームへ旅したが、入ってくるものを次から次へと使い果たしていた。彼は我らがシャイフ（イブン・ハジャル）から聴聞した者の一人である。タイイという名の祖先にちなんでアッ＝ターイーとも呼ばれる。（8）73年のペストでカイロにおいて没した。
  en: Yaḥyā b. ʿAjlān, of Asyūṭī origin, al-Makkī, known as Ibn al-Sharīfa. He was among those who memorized the Qurʾān and the Minhāj, and he travelled to Abyssinia, India, Cairo and Syria to seek a livelihood, but he used to spend whatever came in to him as fast as it came. He is among those who heard from our shaykh (Ibn Ḥajar). He is also called al-Ṭāʾī, a nisba to an ancestor of his named Ṭayy. He died in Cairo in the plague of the year [8]73.
