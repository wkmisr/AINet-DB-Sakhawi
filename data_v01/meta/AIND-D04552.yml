translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アフマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アブド・アル＝ムウティー・アル＝アンサーリー・アル＝ハズラジー・アル＝マッキー。アル＝クトゥブ・ムハンマドの兄弟で、彼ら二人の父は、その母方の祖父アッ＝サフィー・アッ＝タバリーにちなんでイブン・アッ＝サフィーとして知られていた。聴聞し、イエメンに数年住んだのち、マッカに戻り、さらにイエメンへ帰ってそこで（八百）三年の初めに没した。推定では50歳に達していたか、それを超えていた。アル＝ファースィーがマッカ（史）でそう述べている。
  en: ʿAbd Allāh b. Muḥammad b. Aḥmad b. ʿAbd Allāh b. Muḥammad b. ʿAbd al-Muʿṭī al-Anṣārī al-Khazrajī al-Makkī, brother of al-Quṭb Muḥammad; their father was known as Ibn al-Ṣafī after his maternal grandfather al-Ṣafī al-Ṭabarī. He heard (ḥadīth), lived in Yemen for some years, then returned to Mecca, then went back to Yemen and died there at the beginning of the year (80)3, having reached the age of fifty or, conjecturally, passed it. Al-Fāsī said so in (his history of) Mecca.
