translation:
  ja: ファラジュ・アン＝ナースィリー・アル＝ハバシー。われわれの隣人であり、アシュラフィーヤなどのワクフの徴収においてわれらがシャイフ（イブン・ハジャル）に仕えたことで知られた者の一人であるが、彼（シャイフ）の没後は大した利得を得られなかった。（8）56年ラビーウ・アル＝アウワル月に没し、バイバルスィーヤの墓域（ハウシュ）に葬られた。神が彼を赦したまえ。彼にはアブド・アル＝カリームという名の、禁欲的で容姿の良い息子がいた。
  en: Faraj al-Nāṣirī al-Ḥabashī. Our neighbour, and one of those known for having served our shaykh (Ibn Ḥajar) in collecting the revenues of the Ashrafiyya waqf and others; after him he obtained nothing of consequence. He died in Rabīʿ al-Awwal of the year [8]56 and was buried in the ḥawsh of the Baybarsiyya, may God pardon him. He had a son named ʿAbd al-Karīm, of ascetic life and good looks.
