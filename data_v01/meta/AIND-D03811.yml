translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・アル＝ハリーリー・アス＝スーフィー。エジプト・モスク（アムル・モスク）のムアッズィン。我らがシャイフ（イブン・ハジャル）は自著『ムアジャム』において次のように述べている。「彼はエジプト人のうちで最も風雅な者の一人であり、気の利いた機知に富み、通俗的な詩（ナズム・マグスール）を多く詠んだ。私は彼の『ファワーイド（有益な知識）』や彼の詩を聴聞し、彼は私をいくつかの詩で称賛してくれた。」ヒジュラ暦808年ラマダーン月に没した。
  en: 'ʿAbd al-Raḥmān b. Muḥammad al-Ḥarīrī al-Ṣūfī, the muezzin of the Egyptian Mosque (Mosque of ʿAmr). Our shaykh (Ibn Ḥajar) said in his Muʿjam: ''He was among the witty Egyptians, possessing pleasant humor, and composed many vernacular verses (al-naẓm al-maghsūl). I heard some of his scholarly notes (fawāʾid) and his poetry, and he praised me with some verses.'' He died in Ramaḍān, the year 808.'
