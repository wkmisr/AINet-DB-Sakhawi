translation:
  ja: アブドゥルワリー・ブン・ムハンマド・ブン・ジャマール・アッ＝ディーン、ワリー・アッ＝ディーン。ムハンマドとも名乗るが、アブドゥルワリーの名でより知られる。アル＝ワースィティー・アル＝イラーキー、カイロのジャーミウ・アル＝ガムリーの住人。故郷ではイブン・アッ＝ザイトゥーニーとして知られる。善良で貧しく、クルアーンを読誦する人物であった。彼は我らの師（イブン・ハジャル）らに会ったと語っており、私（サハーウィー）のもとでアマーリーなどに頻繁に出席した。（8）86年ラビーウ・アル＝アーヒル月に没した。70歳を超えていたと私は思う。神が彼に慈悲を垂れたまわんことを。
  en: ʿAbd al-Walī b. Muḥammad b. Jamāl al-Dīn, Walī al-Dīn; he is also called Muḥammad, but is better known as ʿAbd al-Walī. Al-Wāsiṭī al-ʿIrāqī, resident of the Jāmiʿ al-Ghamrī in Cairo, and known in his homeland as Ibn al-Zaytūnī. A good, poor man who recited the Qurʾān. He used to say that he had met our shaykh (Ibn Ḥajar) and others, and he attended the Amālī and other sessions with me (al-Sakhāwī) frequently. He died in Rabīʿ al-Ākhir (8)86; I think he was over seventy. May God have mercy on him.
