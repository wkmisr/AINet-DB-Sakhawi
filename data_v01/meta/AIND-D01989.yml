translation:
  ja: イスマーイール・ブン・ナーシル・ブン・ハリーファ、イマードゥッディーン・アル＝バーウーニー。先述のシャハーブ・アフマドの兄弟である。サファド管区におけるナーシリーヤのシャイフを、貧しいスーフィーの流儀で務めた。名声と財産と商売を営んでいた。9年（ヒジュラ暦809年）のズー・アル＝ヒッジャに70歳で死去した。このことは我らがシャイフ（イブン・ハジャル）がその著書『インバーウ・アル＝グムル』で述べた。
  en: Ismāʿīl b. Nāṣir b. Khalīfa ʿImād al-Dīn al-Bāʿūnī, brother of al-Shihāb Aḥmad (mentioned above). He served as the shaykh of al-Nāṣirīya in the jurisdiction of Safad, in the manner of the poor Sufis. He possessed prominence, wealth, and engaged in trade. He died in Dhū al-Ḥijja of the year 9 (809 AH) at the age of 70. This was stated by our shaykh (Ibn Ḥajar) in his work 『Inbāʾ al-Ghumr』.
