    ja: '見出し「محمد بن عبد المحسن بن أحمد بن حسين الأهدل الجمال بن الشيخ شهاب الدين حفيد الأهدل」。父＝الشهاب أحمد السيد بن البدر حسين بن عبد الرحمن الأهدل。根拠: 二重立項 #AIND-D06653「محمد بن أحمد بن البدر حسين بن عبد الرحمن … ويعرف بابن الأهدل وبابن السيد ويسمى أيضا عبد المحسن تبركا بعبد المحسن الشاذلي . ولد بمكة في المحرم سنة إحدى وسبعين」（父＝أحمد、通称 ابن السيد）、ニスバ索引 #AIND-D11169「الأهدل البدر أبو محمد حسين بن عبد الرحمن … وله أولاد منهم صديق وأحمد والهادي وأحمد السيد … ولأحمد السيد وقيل له ذلك ليتميز عن أخيه الآخر أحمد جمال الدين محمد عبد المحسن أحد الآخذين عني حي」。本項の「بن الشيخ شهاب الدين」（أحمد の通例のラカブ）・「حفيد الأهدل」（祖父 حسين #AIND-D02702）とも閉合する。見出しの「بن عبد المحسن」は本項主自身の別名（D06653「ويسمى أيضا عبد المحسن」）が見出しのナサブに混入したものとみられる（規則25 により見出しの persName は字どおり残す）。「ومات أبوه وهو ابن سبع」＝878 年頃没。corpus に父の本伝なし（hw.py「أحمد بن حسين」「الأهدل」・「أحمد بن البدر حسين」該当なし）、ID-Master 未登録 → 仮番号 TMP-P-001631（校閲時の 取り下げた仮番号 B145-P06「عبد المحسن」は取り下げ、1件に統一。内容A M・機械 L、オーケストレーター決定7、§D145-5）。初版 #NEEDID。'
