translation:
  ja: ムハンマド・ブン・アブド・アル＝ムフシン・ブン・アフマド・ブン・フサイン・アル＝アフダル、アル＝ジャマール、シャイフ・シハーブ・アッ＝ディーンの子、アル＝アフダルの孫。871年にマッカで生まれた。7歳のときに父が没し、姉妹の夫で従兄弟のアル＝ジャマール・ムハンマドが彼を養育し、クルアーンと『イルシャード』などを彼に読ませ（教え）た。成人後、もう一人の従兄弟フサインとともにイエメンに入り、そこに約5年滞在したのち、マッカに戻ってそこで結婚した。彼は私に会い、私は（8）＋（年欠）年ズー・アル＝ヒッジャ月末に彼に『ムサルサル』を伝えた。
  en: Muḥammad b. ʿAbd al-Muḥsin b. Aḥmad b. Ḥusayn al-Ahdal, al-Jamāl, son of al-Shaykh Shihāb al-Dīn, grandson of al-Ahdal. He was born in [8]71 in Mecca. His father died when he was seven, so his sister's husband and cousin al-Jamāl Muḥammad took charge of him and taught him the Qurʾān, al-Irshād and other things. After coming of age he went to Yemen with his other cousin Ḥusayn and stayed there about five years, then returned to Mecca and married there. He met me, and I transmitted to him the Musalsal at the end of Dhū al-Ḥijja of the year [blank].
