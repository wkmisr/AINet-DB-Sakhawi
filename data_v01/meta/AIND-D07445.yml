translation:
  ja: ムハンマド・ブン・スライマーン・ブン・アフマド・ブン・イブラーヒーム・ブン・アブドゥルマリク、アッ＝シャムス・ブン・アル＝アラム、カイロ出自のダミエッタ人、シャーフィイー派。「イブン・アル＝ファキーフ・スライマーン（法学者スライマーンの子）」として知られ、父は「アッ＝スンバーティー」として知られた。770年頃ダミエッタに生まれ、同地でクルアーンを暗記し、9歳1か月でそれを（暗誦して）礼拝を先導した。『ウムダ』を40日で、さらに『ミンハージュ・アル＝ファルイー』を暗記し、ナースィルッディーン・ブン・アル＝マイラクや一団の人々に暗誦提示した。自分の町のカーディーであるアッ＝タージュ・アティークのもとで研究した。韻律学と文法を前もって学んだことがないのに作詩に励み、しかもそのすべてが韻律に適い、文法上の誤りもなかった。イブン・ファハドとアル＝ビカーイーは838年にダミエッタで彼に会い、彼から諸々を書き取った。そのうちには次のものがある。 「謙遜はあらゆる美徳の根源であり、学問はあらゆる卑しい者に誉れをもたらす。 自我によって（自分を）大きくされる者は（実は）小さくされているのだ。自我こそ仲間のうちで最悪の友である。 理性は若者に主から与えられる最大の恩恵であり、理性こそ最良の導き手である。」 また預言者生誕詩（マウリド・ナバウィー）などを詠んだ。善良で、堂々として輝きがあり、落ち着きと威厳を備えた人物であった。842年または843年のズー・アル＝カアダ月26日にダミエッタで没した。神よ彼に慈悲を。
  en: 'Muḥammad b. Sulaymān b. Aḥmad b. Ibrāhīm b. ʿAbd al-Malik, al-Shams b. al-ʿAlam, of Cairene origin, al-Dimyāṭī, al-Shāfiʿī; known as Ibn al-Faqīh Sulaymān, while his father was known as al-Sunbāṭī. He was born around the year 770 in Damietta, where he memorized the Qurʾān and led the prayer with it when he was nine years and one month old. He memorized al-ʿUmda in forty days, as well as al-Minhāj al-Farʿī, and presented them to Nāṣir al-Dīn b. al-Maylaq and a group of others. He studied by discussion under the judge of his town, al-Tāj ʿAtīq. He applied himself to composing poetry without any prior study of prosody or grammar, yet all of it was correctly metred and free of grammatical error. Ibn Fahd and al-Biqāʿī met him in the year 838 in Damietta and wrote down from him various pieces, among them: "Humility is the root of every beautiful thing, and knowledge brings honour to every lowly one. He whom the self makes great is in truth made small, for the self is the worst of friends
    among companions. Reason is the greatest blessing that comes to a young man from his Lord, for reason is the best guide." He also composed a poem on the Prophet''s birth (al-Mawlid al-Nabawī) and other things. He was a good, handsome and radiant man, possessed of calm and dignity. He died in Damietta on the twenty-sixth of Dhū al-Qaʿda in the year 842 or 843; may God have mercy on him.'
