  summary:
    en: 'Composed poetry on the book 『Majmūʿ al-Badrī』. The opening lines are: ''Lillāhi majmūʿun lahu qad tashhadu al-majāmiʿu / bi-annahu quṭbun lahā niʿma wa-fardun jāmiʿun.'''
  note:
    en: Al-Badrī = Abū Bakr b. ʿAbd Allāh b. Muḥammad b. Aḥmad, Taqī al-Dīn Ibn al-Badrī, Abū al-Tuqā, the poet (AIND-D10718; cf. the nisbah entry AIND-D11661-band "al-Badrī" AIND-D11470 and the corpus stub "Abū al-Tuqā al-Badrī al-shāʿir"). His majmūʿ, on which many contemporaries wrote taqārīẓ, is registered as TMP-T-00115 (new).
