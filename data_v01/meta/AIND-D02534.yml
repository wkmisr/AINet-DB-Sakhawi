translation:
  ja: ハサン・ブン・ジューディー・アル＝マーリディーニー。彼には『アル＝バドリーの集成（マジュムーウ）』に寄せた詩がある。その冒頭は「なんと見事な、彼の集成よ。諸々の集成がこぞって証言する、それこそが集成の枢軸、まことに唯一無二の包括者であると」。そして彼の筆跡は見事である。
  en: 'Al-Ḥasan b. Jūdī al-Māridīnī composed poetry on the book 『Majmūʿ al-Badrī』. Its opening lines are: ''To God belongs a collection of his — the collections themselves bear witness / that it is their pole; indeed, a uniquely comprehensive one.'' His handwriting was also excellent.'
