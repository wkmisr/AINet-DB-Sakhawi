translation:
  ja: アリー・イブン・ムハンマド・アル＝アラーイー・アッ＝サーリヒー・アッ＝ディマシュキー・アル＝ガイサーウィー。ザバダーニー近郊のガイサーに由来する。アル＝マワーラの管理人（カッユム）であった。アル＝バドリー（TMP-P-000719）はその選集（『マジュムーウ・アル＝バドリー』TMP-T-00115）の中に、彼の以下の詩を書き留めている。 「私は、その美しさで人々の中で輝く、愛らしきクサイイを愛した。顔立ちは甘く、彼の漆黒の縮れ毛のせいで私の心は闇に包まれる。彼の顔とその頬は満月のようであり、おおサアドよ、稲妻の枝が雷鳴の上で戯れる月のごとくである。」 彼は珍しい著作をシャーム（シリア）からエジプトへ、またその逆に移送することに熱心であり、いくつかの職を手（管理）にしていた。875年頃に没した。この人物の伝記であるか、さらに校訂（確認）されるべきである。
  en: 'ʿAlī b. Muḥammad al-ʿAlāʾī al-Ṣāliḥī al-Dimashqī al-Ghaythāwī. His nisbah is to Ghaythā near al-Zabadānī. He was the caretaker (qayyim) of al-Muwāla. Al-Badrī (TMP-P-000719) recorded his poetry in his compendium (Majmūʿ al-Badrī, TMP-T-00115): ''I loved a lovely Kusayy who shines with beauty among people, / Sweet of face, my heart became black like his jet-black curly hair. / I fancied his face and cheeks like full moons, O Sa''d, / A moon playing with the bough of lightning above the thunder.'' He was eager to transport rare books and compositions to Egypt from Syria and vice versa, and he held some offices. He died around the year 875 AH; it is to be verified if this biography belongs to him.'
