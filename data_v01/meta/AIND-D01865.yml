translation:
  ja: 'ウルナブガー（原文注記: ハムザとバーはダンマで読む）・ブン・ウクバ・アル＝マッキー・アル＝バーニー。彼は893年ムハッラム月に当地（メッカ）で死去した。彼は、おそらくトルコ人到来の折にそう命名されたか、あるいは彼が生まれた時にアミールに任じられた（トルコ人アミールが着任した）ことにちなむのであろう。おそらく彼は近く後述される人物と同一である。'
  en: Urnabughā (vocalized in the text with ḍamma on the hamza and the bāʾ) b. ʿUqba al-Makkī al-Bānī. He died in Makka in Muḥarram 893 AH. He was seemingly named so due to the arrival of a Turk or an amir's appointment at his birth. He is apparently identical with an entry coming shortly below.
