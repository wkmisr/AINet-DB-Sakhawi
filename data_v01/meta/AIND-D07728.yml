notes:
- text: '「ورأيت في موضع آخر اسم جده عبد الله」＝祖父の名を別の箇所では عبد الله と見た（見出しは محمد）。この別形は転送見出し REF #AIND-D07723「محمد بن عبد الكريم بن عبد الله الأردبيلي . يأتي فيمن جده محمد قريبا」に対応する（同一人物）。祖父は本伝なし・名が不定のため relation を立てない（初版の grandfather 汚染番号 #TMP-P-000490 を除去）。「ثم القاهري」はニスバであり residence event を立てない（規則22(1)）。「ولا بأس به」＝悪くない人物（人物評）。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・アブド・アル＝カリーム・ブン・ムハンマド、アッ＝シャムス、アル＝アルダビーリー、のちアル＝カーヒリー、シャーフィイー派。別の箇所では彼の祖父の名をアブド・アッラーと見た。アミール・アーフールのジャーニバク・アル＝ファキーフの側近であった者の一人で、何度も巡礼し、886年に隣住した。私（サハーウィー）に『ブハーリー』の巡礼の章全部とその後の別の一部分を読み、それ以外でも私に師事した。同様にアッ＝ダイミーにも読んだ。悪くない人物である。
  en: Muḥammad b. ʿAbd al-Karīm b. Muḥammad, al-Shams, al-Ardabīlī, then al-Qāhirī, the Shāfiʿī; in another place I saw his grandfather's name given as ʿAbd Allāh. He was among those closely attached to the amīr ākhūr Jānibak al-Faqīh. He performed the pilgrimage several times and resided (as a mujāwir) in the year 886. He read to me (al-Sakhāwī) the whole Book of Pilgrimage from al-Bukhārī together with another portion after it, and attended me closely in other matters; likewise he read to al-Daymī. He is not bad.
