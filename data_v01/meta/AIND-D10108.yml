translation:
  ja: ムワッファク・アル＝ハバシー・アル＝ブルハーニー・アッ＝ザヒーリー。（8）92年ムハッラム月28日、水曜日の前夜（火曜の夜）にマッカで没し、水曜日の朝の礼拝の後に葬礼が行われ、彼の主人たちの新設の墓所に葬られた。旅先でも在地でも商いをしていたので、多くのものを遺したと言われる。
  en: Muwaffaq al-Ḥabashī al-Burhānī al-Ẓahīrī. He died in Mecca on the eve of Wednesday, 28 Muḥarram of the year [8]92; the funeral prayer was performed for him after the dawn prayer on Wednesday and he was buried in the newly established tomb (turba) of his masters. It is said that he left a great deal, because he used to trade both on journeys and at home.
