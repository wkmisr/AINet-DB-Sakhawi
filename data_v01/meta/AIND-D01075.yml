translation:
  ja: アフマド・ブン・アリー・ブン・ムハンマド・アル＝シハーブ・アル＝フサイニー・アル＝ミスリー。彼はイブン・ビント・シャカーイクとして知られる。高貴な人物であり、証言の職に就いていた。我らがシャイフ（イブン・ハジャル）が『インバー・アル＝グムル』で述べるところによれば、ヒジュラ暦801年のジュマーダー・アル＝アーヒラ月に亡くなった。
  en: Aḥmad b. ʿAlī b. Muḥammad al-Shihāb al-Ḥusaynī al-Miṣrī, known as Ibn Bint Shaqāʾiq. He was a noble person who practiced giving testimony. Our shaykh (Ibn Ḥajar) stated in his 『Inbāʾ al-Ghumr』 that he died in Jumādā al-Ākhira in the year one (801 AH).
