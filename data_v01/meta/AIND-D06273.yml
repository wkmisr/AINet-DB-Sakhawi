translation:
  ja: カーンバーイ・アル＝ムアイヤディー・シャイフ、アッ＝サーキー（酌人）およびカラーサクルとして知られる。アル＝アシュラフ・イーナールの治世、あるいはその少し前に十人隊アミール（アミール・アシャラ）となり、トリポリのラアス・ナウバとなった。863年、ジャウラーンへ向かう途上、海上で没した。60歳近くであった。並の生き方をし、自らに対して放埒であった。
  en: Qānbāy al-Muʾayyadī Shaykh, known as al-Sāqī (the cupbearer) and as Qarāsaqul. He was made an amīr of ten in the days of al-Ashraf Īnāl, or a little before, and became a raʾs nawba in Tripoli. He died in the year 863 at sea (al-Baḥr al-Māliḥ) while on his way to al-Jawlān, having nearly reached sixty. He was of middling conduct and dissolute toward himself.
