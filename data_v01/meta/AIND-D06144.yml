translation:
  ja: ファーディル・ブン・マフルーフ・ブン・ハラフ・ブン・スライマーン、アッ＝シャムス・アッ＝タルージー・アッ＝サカンダリー。カイロに居住し、スルターン宮殿のムアッズィン（礼拝告知者）の一人。883年ラビーウ1月に没した。そのアザーンとタスビーフ（神の称揚の唱和）は人々に好まれ、近頃はひときわ重んじられて、求めに応じてアザーンを行うために諸所へ出向くことが多く、時には求められずに自ら行うこともあった。私は彼（のアザーン）を幾度も聴いた。神よ彼を憐れみたまえ。
  en: Fāḍil b. Makhlūf b. Khalaf b. Sulaymān al-Shams al-Tarūjī al-Sakandarī, resident of Cairo and one of the muezzins of the Sultan's palace. He died in Rabīʿ I 883. His call to prayer and his tasbīḥ were well received, and in these days he enjoyed exceptional favour; he frequently travelled to various places to give the call to prayer at the request of those who asked him for it, and sometimes did so in some of them on his own initiative without being asked. I heard him more than once. May God have mercy on him.
