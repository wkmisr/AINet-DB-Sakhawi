translation:
  ja: ウマル・ブン・アリー・ブン・アビー・アル＝バラカート・ムハンマド・ブン・アビー・アッ＝スウード・ムハンマド・ブン・フサイン・ブン・アリー・ブン・アフマド・ブン・アティーヤ・ブン・ザヒーラ、アル＝クラシー・アル＝マッキー。イブラーヒームとアブー・バクルとその兄弟たちの兄弟で、彼らの母はカーディー・イッズ・アッ＝ディーン・アン＝ヌワイリーの娘ウンム・アル＝ハイル。838年ラジャブ月の新月の夜に兄弟アブー・バクルと双子で生まれ、一団（の学者）が彼にイジャーザを与えたが、ほどなく（8）40年ラジャブ月に没した。
  en: ʿUmar b. ʿAlī b. Abī al-Barakāt Muḥammad b. Abī al-Suʿūd Muḥammad b. Ḥusayn b. ʿAlī b. Aḥmad b. ʿAṭiyya b. Ẓahīra al-Qurashī al-Makkī, brother of Ibrāhīm, Abū Bakr and their siblings; their mother was Umm al-Khayr, daughter of the qāḍī ʿIzz al-Dīn al-Nuwayrī. He was born as a twin with his brother Abū Bakr on the night of the new moon of Rajab in the year 838, and a group of scholars granted him ijāza; but he did not live long and died in Rajab of the year (8)40.
