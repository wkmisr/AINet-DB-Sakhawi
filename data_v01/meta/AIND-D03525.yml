translation:
  ja: アブドゥル・ハミード、イマーム・タキー・アッ＝ディーン・ムハンマド・ブン・イブラーヒーム・ブン・アブドゥル・ハミード・アッ＝マダニ。アブー・アル＝ファトフ・アル＝マラーギーの母方の叔父の息子。ヒジュラ暦797年にアッ＝ザイン・アル＝マラーギーおよびアル＝アラム・スレイマーン・アッ＝サッカーに聴聞し、長命を保って没した。
  en: Abd al-Hamid b. al-Imam Taqi al-Din Muhammad b. Ibrahim b. Abd al-Hamid al-Madani. The son of the maternal uncle of Abu al-Fath al-Maraghi. He heard from al-Zayn al-Maraghi and al-Alam Sulayman al-Saqqa in the year 797 AH, and lived a long life until he died.
