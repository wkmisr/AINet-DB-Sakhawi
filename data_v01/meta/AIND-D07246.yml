translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ムハンマド・ブン・アリー・ブン・アブド・アッ＝ラヒーム、アル＝クースィー、のちアル＝カーヒリー、アル＝マクリーズィーの従者、アッ＝サウーディーとして知られる。750年より前にクースで生まれ、長らく貧者（スーフィーたち）に仕えた。彼には知識があり、有益な話を持っていた。彼（マクリーズィー）は『ウクード』で彼に言及し、「7年に彼と別れたが、彼はすでに老いており、その後彼の消息は得られなかった」と述べ、彼から他人の詩を──おそらく一部は彼自身のものだが──伝えている。その一つが、彼（マクリーズィー）が彼を疎んじたときに詠みかけた次の詩である。 「神があなた方を赦したまえ。あの親愛はどこへ行ったのか。かつて私が見知っていた、あなた方の美しい振る舞いはどこへ。我らの間にあるものにかけて、我らの間の誓いを破らないでください。愛をもって我らのもとへ戻ってきてください。戻ることこそ最も称えられる（アフマド）のだから。」 また彼（マクリーズィー）は彼から、シャイフ・ムハンマド・ブン・アッ＝シャイフ・サイフ・アッ＝ディーン・ブン・ムファッリジュ・アッ＝ダマーミーニーとヌール・アッ＝ディーン・イブン・アブド・アル＝アズィーズ・ブン・シュカイルを経て、後者の父から伝わる、神への依拠と神への救いの求めに関する逸話を伝えている。
  en: 'Muḥammad b. Abī Bakr b. Muḥammad b. ʿAlī b. ʿAbd al-Raḥīm al-Qūṣī, then al-Qāhirī, servant of al-Maqrīzī, known as al-Saʿūdī. He was born in Qūṣ before the year 750 and served the poor (Sufis) for a long time; he had knowledge and useful anecdotes. He (al-Maqrīzī) mentioned him in his ''ʿUqūd'' and said that he parted from him in the year [80]7 when he was already old, and found no news of him thereafter; he cited from him verses by others, some of which may be his own. Among them is what he recited to him when he (al-Maqrīzī) turned away from him: ''May God forgive you — where is that affection, and where is the kindness from you I used to know? By what is between us, do not break the covenant between us; return to us with love, for returning is most praiseworthy (aḥmad).'' He also related from him, on the authority of al-Shaykh Muḥammad b. al-Shaykh Sayf al-Dīn b. Mufarrij al-Damāmīnī and Nūr al-Dīn b. ʿAbd al-ʿAzīz b. Shuqayr, from the father of the latter, an anecdote on reliance
    upon God and seeking His aid.'
