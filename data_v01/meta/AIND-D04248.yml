translation:
  ja: アブド・アル＝カリーム・ブン・アフマド・アッ＝シュカイリー・アル＝マッキー。かつて薬種商であったのち、（カアバの）階段の奉仕者の一人となった。879年サファル月にハッダト・バニー・ジャービルで没し、マッカに運ばれてそのムアッラー墓地に葬られた。
  en: ʿAbd al-Karīm b. Aḥmad al-Shuqayrī al-Makkī, one of the servants of the Staircase (khuddām al-daraja) after having been a druggist. He died in Ṣafar of the year 879 at Haddat Banī Jābir and was carried to Mecca, where he was buried in its Muʿallā cemetery.
