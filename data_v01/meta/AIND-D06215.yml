translation:
  ja: カースィム・ブン・ダーウード・ブン・ムハンマド・ブン・イーサー・ブン・アフマド、アル＝ヒンディー・アル＝アフマダーバーディー、ハナフィー派。既述のラージフの兄弟で、こちらの方が年長である。869年に生まれ、少しばかり学問に携わった。彼については兄弟の項に言及があり、マッカで私から学んだ者の一人であること、また私のアルフィーヤ注釈の書写において彼（兄弟）を手伝ったことが記されている。
  en: 'Qāsim b. Dāwūd b. Muḥammad b. ʿĪsā b. Aḥmad al-Hindī al-Aḥmadābādī, the Ḥanafī, brother of the aforementioned Rājiḥ and the elder of the two. He was born in 869 and studied a little. He is mentioned in his brother''s entry: that he is among those who studied under me in Mecca, and that he assisted him (his brother) in copying my commentary on the Alfiyya.'
