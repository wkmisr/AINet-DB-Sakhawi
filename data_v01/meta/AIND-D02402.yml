translation:
  ja: ジブリール・ブン・アリー・ブン・ムハンマド・アル＝カーブーニー、のちにアッ＝ディマシュキー、シャーフィイー派。アル＝ブルハーン・イブラーヒーム・イブン・ジャマーアからアル＝ブハーリーの『アダブ・アル＝ムフラド』を聴聞し、また、アル＝カマール・イブン・アン＝ナッハース、アル＝バドル・ハサン・ブン・ムハンマド・アル＝バアリー、イスマーイール・ブン・イブラーヒーム・ブン・マルワーンほか多数の学者から聴聞した。ハディースを伝え、すぐれた学者たち（フダラー）が彼から聴聞した。私（サハーウィー）にイジャーザを与えた。彼は信頼のおける、高潔な善人であり、常にクルアーンの誦読を続けていた。100歳を超えたのち、855年ムハッラム月にダマスクスで亡くなった。神が彼を憐れむよう。
  en: Jibrīl b. ʿAlī b. Muḥammad al-Qābūnī, then al-Dimashqī, al-Shāfiʿī. He heard al-Bukhārī's al-Adab al-Mufrad from al-Burhān Ibrāhīm b. Jamāʿa, and heard from al-Kamāl b. al-Naḥḥās, al-Badr Ḥasan b. Muḥammad al-Baʿlī, Ismāʿīl b. Ibrāhīm b. Marwān, and many others. He transmitted ḥadīth, and the eminent scholars (al-fuḍalāʾ) heard from him. He granted me (al-Sakhāwī) an ijāza. He was trustworthy, righteous and virtuous, constant in recitation of the Qurʾān. He died in Damascus in Muḥarram of the year 855, having passed one hundred years of age. May God have mercy on him.
