translation:
  ja: ハジャル・ブン・ユースフ・ブン・シャーヒーン。カラク出身で、のちカイロの人。父（ユースフ・ブン・シャーヒーン）は後述される。父は彼の命名にあたり、自身の母方の祖父である我らがシャイフ（イブン・ハジャル）の遠祖のラカブ（＝ハジャル）に倣った。彼はほどなく幼児のまま亡くなった。
  en: Ḥajar b. Yūsuf b. Shāhīn, of Karak origin, then al-Qāhirī (of Cairo). His father (mentioned later) in naming him followed the laqab of the remote ancestor of his own maternal grandfather, our shaykh (Ibn Ḥajar). He soon died as a small child.
