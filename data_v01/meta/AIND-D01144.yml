translation:
  ja: アフマド・ブン・ウマル。ラカブはアッ＝シハーブ。ニスバはアッ＝サウーディー、アル＝バッラーン。 アブー・アッ＝サウード・ザーウィヤにおけるズィクル誦唱者団長。月曜日、ズー・アル＝ヒッジャ月12日、869年に死去。その行状は称賛された。アル＝ムニールがその没年月日を記録した。
  en: Aḥmad b. ʿUmar, al-Shihāb al-Saʿūdī al-Ballān. He was the naqīb of the dhikr-reciters (Naqīb al-Dhakkārīn) at Zāwiyat Abī al-Suʿūd. He died on Monday, the twelfth of Dhū al-Ḥijja in the year 869 H. He was praised for his good conduct. Al-Munīr recorded his death date.
