translation:
  ja: アブドゥッラー・ブン・アビー・アブドゥッラー・アル＝マグリビー・アッ＝スースィー。（八百）三年に没した。私は彼が少し前に挙げた人物と同一ではないかと思う。というのも、彼を記録した者は三年か一年かで迷っており、その場合、二つのニスバの一方が他方から誤写されたことになるからである。
  en: ʿAbd Allāh b. Abī ʿAbd Allāh al-Maghribī al-Sūsī. He died in the year three. I think he is the one mentioned shortly before, for the one who recorded him was in doubt between three and one, in which case one of the two nisbas was corrupted from the other.
