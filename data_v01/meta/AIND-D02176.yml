translation:
  ja: バルスィーガ（Barṣīghā）。アッ＝ザーヒル・バルクーク配下のマムルーク（ザーヒリーヤ・バルクーク）の司令官（ムカッダム）の一人。理知的な優れた人物であり、クルアーンを暗記し、合唱朗誦隊（クッラー・アル＝ジャウク）と共に朗誦していた。ヒジュラ暦817年、アル＝ムアイヤド（・シャイフ）によって殺された。
  en: Barsīghā. One of the commanders (muqaddamūn) from the Zahiriyya Barquq (the mamluks of al-Zahir Barquq). He was a highly intelligent and virtuous man who memorized the Quran and recited it with the choral reciters (qurrāʾ al-jawq). He was killed by Sultan al-Mu'ayyad Shaykh in the year 817 AH.
