translation:
  ja: ムハンマド・ブン・ズィヤード、アミール・バドル・アッ＝ディーン・アル＝カーミリー・アル＝ヤマニー。アル＝アシュラフ・イスマーイールのもとで重用され、次いでその子アン＝ナースィルのもとで（重用され）、彼（ナースィル）は彼への尊重と厚遇を増したが、その後彼（本項主）は彼に対して反乱を起こした。822年に没した。彼はマクリーズィーの『ウクード』に（載っているが）没年は記されていない。
  en: Muḥammad b. Ziyād, the Amīr Badr al-Dīn al-Kāmilī al-Yamanī. He rose to prominence under al-Ashraf Ismāʿīl, then under his son al-Nāṣir, who increased his honour and favour toward him; then he rebelled against him. He died in the year [8]22. He is in al-Maqrīzī's ʿUqūd, without the date of his death.
