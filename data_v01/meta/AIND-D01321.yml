translation:
  ja: アフマド・ブン・ムハンマド・ブン・ラジャブ・シハーブ・アル＝ディーン・ブン・ナーシル・アル＝ディーン。エジプト諸州における十人長のアミールおよび下級侍従の一人。日曜日のラジャブ月11日、ヒジュラ暦5年に没した。彼は美しい容貌を持つ若者で、勇敢かつ大胆であった。
  en: Aḥmad b. Muḥammad b. Rajab Shihāb al-Dīn b. Nāṣir al-Dīn, one of the amirs of ten and minor chamberlains in the Egyptian lands. He died on Sunday, the 11th of Rajab in the year 5 AH. He was a handsome, brave, and valiant young man.
