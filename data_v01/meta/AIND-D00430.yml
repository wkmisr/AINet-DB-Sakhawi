translation:
  ja: アハマド・ブン・イブラーヒーム・ブン・ハサン・ブン・アジュラーン・アル=フサイニー。彼は叔父バカラートと一時対立し、メッカを襲撃したことがあったかもしれない（それは遠征だった）。866年シャウワール月の最後の10日間、フルドの地で死亡し、遺体はメッカに運ばれて埋葬された。イブン・ファハドが彼について記録している。
  en: Aḥmad b. Ibrāhīm b. Ḥasan b. ʿAjlān al-Ḥusaynī opposed his uncle Barakāt for a time and perhaps attacked Mecca (it was a campaign). He died in the last ten days of Shawwāl in the year 866 in the land of Khuld. His body was carried to Mecca and buried there. Ibn Fahd recorded his biography.
