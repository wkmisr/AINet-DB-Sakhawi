translation:
  ja: サウマーイ・アル＝ハサニー・アッ＝ザーヒリー・バルクーク。エジプト地域のアミール（諸侯）の一人であり、ナースィル朝、次いでムアイヤド朝においてラアス・ナウバ（親衛隊長）を務めた。820年頃に没した。内面は穏やかで、悪意のない人物であった。
  en: Ṣawmāy al-Ḥasanī al-Ẓāhirī Barqūq. One of the amirs of Egypt and a raʾs nawba (chief of the guard) during the reigns of al-Nāṣir Faraj and al-Muʾayyad Shaykh. He died around 820 AH. He was of sound heart and free of malice.
