translation:
  ja: ムハンマド・ブン・ハサン・ブン・スワイド、アッ＝シャムス、アル＝バドルの息子、アル＝ミスリー、マーリク派。アル＝ワジーフ・アブド・アッラフマーンの兄弟であり、被伝者（本項主）の方が年長であるが、父が彼（アル＝ワジーフ）を身近に置いたため、アル＝ワジーフの方が著名であった。彼はアッ＝サドル・ムハンマドとアーイシャの父であり、この二人はアル＝ジャラール・アル＝ブルキーニーの外孫である。ヒジュラ暦834年頃に没した。
  en: Muḥammad b. Ḥasan b. Suwayd, al-Shams, son of al-Badr, al-Miṣrī, the Mālikī. He was the brother of al-Wajīh ʿAbd al-Raḥmān; the subject of this entry was the elder, but al-Wajīh was the more prominent because their father kept him close. He was the father of al-Ṣadr Muḥammad and ʿĀʾisha, both of whom were grandchildren (through their mother) of al-Jalāl al-Bulqīnī. He died in approximately the year 834 AH.
