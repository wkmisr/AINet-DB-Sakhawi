translation:
  ja: ムハンマド・ブン・アフマド・アル＝ハールーニー・アル＝ミスリー。マジュズーブ（忘我の聖者）で、ミスルの人々の間で信奉され、その住民は彼を「ハフィール・アル＝バフル（川の番人）」と呼んでいた。（8）05年サファル月に没した。我らのシャイフ（イブン・ハジャル）が『インバー』において彼に言及している。
  en: Muḥammad b. Aḥmad al-Hārūnī al-Miṣrī. He was a majdhūb (ecstatic), revered among the people of Miṣr, and its inhabitants nicknamed him Khafīr al-Baḥr (the Guardian of the River). He died in Ṣafar of the year (8)05. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
