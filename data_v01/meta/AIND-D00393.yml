translation:
  ja: イブラーヒーム・アッ＝ラムリー。（ニスバは）シャルキーヤ地方のラムラト・アトリーブに由来する。アブド・ラッビヒの通称で知られる。アブー・アブドゥッラー・アル＝ウマリー、次いでマドヤンの一門の一人であった。878年サファル月、ザーヒド・モスク内の自分の庵で没した。金曜礼拝の時刻に葬礼が行われ、庵に隣接するモスクの墓所に埋葬された。多くの人々がその埋葬に立ち会った。敬虔さで知られる人物であり、同輩の一部がそれを非難したにもかかわらず、しばしばズィクルを授けた。神よ彼と我らに慈悲を。
  en: Ibrāhīm al-Ramlī, so called after Ramlat Atrīb in al-Sharqiyya; he is known as ʿAbd Rabbih. He was one of the circle of Abū ʿAbd Allāh al-ʿUmarī and then of Madyan. He died in his cell (khalwa) in the Zāhid Mosque in Ṣafar of the year 878; the funeral prayer was performed for him at the time of the Friday prayer, and he was then buried in the tomb of the mosque adjoining his cell, and a great many people attended his burial. He was one of those noted for piety, and he would sometimes transmit the dhikr, though some of his companions disapproved of this. May God have mercy on him and on us.
