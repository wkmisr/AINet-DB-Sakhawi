translation:
  ja: カーンバーイ・アル＝アラーイー、エジプト（アッ＝ディヤール・アル＝ミスリーヤ）のムカッダムの一人。数か月病んだのち、（8）08年シャウワール月21日、日曜の夜に没し、翌日の正午過ぎに埋葬された。スルターン権力を恐れてエジプトやシリアでしばしば身を隠していたため、民衆はそのゆえに彼を「アル＝ガッタース（潜る者）」と呼んでいた。アル＝アイニーが彼に言及している。
  en: Qānbāy al-ʿAlāʾī, one of the muqaddams in the Egyptian realm (al-Diyār al-Miṣriyya). After being ill for some months he died on the night of Sunday the 21st of Shawwāl of the year [80]8, and was buried the next day after the noon prayer. He used to go into hiding frequently in Egypt and Syria out of fear of the sultanate, so the common people called him for that reason "al-Ghaṭṭās" (the diver). Al-ʿAynī mentioned him.
