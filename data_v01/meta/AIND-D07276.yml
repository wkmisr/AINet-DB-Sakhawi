notes:
- text: '転送見出し（原文末尾「وقد مضى فيمن جده محمد بن أبي بكر」による）。転送先は #AIND-D07236「محمد بن أبي بكر بن محمد بن أبي بكر الشمس أبو الفتح بن الشرف بن ناصر الدين المنوفي السرسي الأصل القاهري الشافعي المقري ويعرف بابن الحمصاني وربما يقول الحمصي نسبة لحرفة جده لأمه」（生811頃・没897、未収録）。祖父名 محمد بن أبي بكر・通称 ابن الحمصاني／الحمصي が一致し、D07236 本文にも「قصدني للاشهاد عليه في إجازة … ورأيته شهد عليه في إجازة」とイジャーザへの証人署名の記述がある。ブリーフは D07236 を別人の可能性ありとしたが、corpus の「محمد بن أبي بكر بن محمد بن أبي بكر」見出し4件（D07234 المراغي・D07235 الشيبي・D07236・D07237 الحبشي الحلبي）のうち الحمصي を名乗るのは D07236 のみ。'
  type: reference
- text: '転送見出しに固有の情報: 「شهد في إجازة على جعفر المقري سنة ثمان وثمانين」＝888年、ジャアファル・アル＝ムクリイー（＝#AIND-D02414 الزين جعفر بن إبراهيم السنهوري المقرئ、D05004「الزين جعفر المقري」・D11740 で同定）のイジャーザに証人として署名した。転送先 D07236 の本文にはこの888年・جعفر の件は見当たらない（D07236 は「ابن الاسيوطي」のイジャーザへの署名を記す）ため、REF 化で失われないよう本 note に保持（→ISSUES §D132-1）。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・アブー・バクル・ブン・アル＝ヒムスィー。888年にジャアファル・アル＝ムクリイーのイジャーザに証人として署名した。彼は、祖父がムハンマド・ブン・アブー・バクルである者たち（の部）で既に述べた。
  en: Muḥammad b. Abī Bakr b. al-Ḥimṣī. He witnessed an ijāza for Jaʿfar al-Muqriʾ in the year 888. He has already been treated among those whose grandfather is Muḥammad b. Abī Bakr.
