    ja: '見出しナサブ（7代）が #AIND-D00596「أحمد بن أبي بكر بن عبد الله بن ظهيرة بن أحمد بن عطية بن ظهيرة الشهاب القرشي المخزومي اليماني الزبيدي ثم المكي الشافعي ويعرف كسلفه بابن ظهيرة . ولد في جمادى الآخرة سنة تسعين وسبعمائة بزبيد من بلاد اليمن ونشأ بها وتردد إلى مكة مرارا للحج … وانقطع بأخرة بمكة حتى مات في ذي القعدة سنة ثلاث وخمسين」（repo 未収録）と一致し、本項主がイエメンで生まれ育ったこととも合う（規則37）。初版は父 relation なし。'
