notes:
- text: 'イジャーザは「خلق كالواسطي والزركشي والقبابي والبرهان الحلبي」＝名指しの4人に teacher relation（規則55）、「خلق」は立てない。年は「في سنة ست وثلاثين فما بعدها」＝notBefore-custom 0836（初版は @when にヒジュラ年 0836 を書いていた）。初版の cultural event（同じ内容の重複、英語 desc）を除去した。同じ父の兄弟 #AIND-D03850（عبد الرحيم、834年イエメン生）・#AIND-D10651（أبو بكر الرضي、「أخو عبد الرحيم وعبد المحسن وأمه يمانية」）・#AIND-D04688（عبد المحسن）・姉妹 #AIND-D13073（زينب）はいずれも本項主を名指ししない＝relation を立てず note に留める（規則23、父が AIND なので導出できる）。#AIND-D05979 の本文に出る「الكمال أبو الفضل محمد بن أحمد」（الجمال بن ظهيرة の親族、810年代に النجم بن فهد が聴いた相手）は世代が上で、本項主とは別人とみられる。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・アフマド・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ザヒーラ・ブン・アフマド・ブン・アティーヤ・ブン・ザヒーラ、アル＝カマール・アブー・アル＝ファドル・アル＝クラシー・アル＝マッキー。イエメンで生まれ、母もその地の人で、そこで育った。のち巡礼を行い、（8）36年およびそれ以降に、イブン・ファハドの申請により、アル＝ワースィティー、アッ＝ザルカシー、アル＝キバービー、アル＝ブルハーン・アル＝ハラビーなど多くの人々が彼にイジャーザを与えた。その後に没した。
  en: Muḥammad b. Aḥmad b. Abī Bakr b. ʿAbd Allāh b. Ẓahīra b. Aḥmad b. ʿAṭiyya b. Ẓahīra, al-Kamāl Abū al-Faḍl al-Qurashī al-Makkī. He was born in the Yemen, his mother being from there, and grew up there. Then he performed the pilgrimage, and in the year [8]36 and after, at the request of Ibn Fahd, a great many people granted him ijāzas, such as al-Wāsiṭī, al-Zarkashī, al-Qibābī and al-Burhān al-Ḥalabī. He died after that.
