translation:
  ja: アリー・アッ＝サカフィー・アル＝マッキー、同地（マッカ）の乳脂商（サンマーン）で、アリー・バダウィーとして知られる。881年ムハッラム月に没した。私は彼に会ったことがある。彼は善人や学者に奉仕し、彼らの用事を果たすことを好み、私もそのようにしてもらった者の一人であった。イブン・ファハドがその没年を記録した。
  en: ʿAlī al-Thaqafī al-Makkī, the clarified-butter seller (sammān) there (in Mecca), known as ʿAlī Badawī. He died in Muḥarram of the year 881. I saw him; he loved to serve the righteous and the scholars and to attend to their needs, and I was among those for whom he did so. Ibn Fahd recorded his death.
