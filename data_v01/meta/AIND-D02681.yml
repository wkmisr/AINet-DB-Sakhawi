translation:
  ja: ハサン・アン＝ナーブルスィー。商人。ウスフーラ（雀）として知られる。860年ジュマーダー・アル＝ウーラー（第5月）にマッカの寝床で死亡しているのが発見された。イブン・ファハドが彼の死を記録した。彼はマッカに居住し、クアイキアーンに邸宅を購入して、それを壮麗に再建した。形式張らない実直な人物で、ジッダのシャード（総管）も彼を敬意をもって待遇していた。
  en: Ḥasan al-Nābulusī, the merchant, known as ʿUṣfūra. He was found dead in his bed in Jumādā al-Ūlā, year 860 AH, in Mecca. His death was chronicled by Ibn Fahd. He had settled in Mecca, where he purchased a house in Quʿayqiʿān and rebuilt it magnificently. He was a man of simple and unpretentious manners, and was among those highly respected by the Shādd of Jidda.
