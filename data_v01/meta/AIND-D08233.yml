translation:
  ja: ムハンマド・ブン・アリー、アル＝ジャマール・ブン・アッ＝タイイブ、アル＝ヤマーニー・アッ＝ザビーディー・アル＝ハナフィー、ザビードの学者にしてそのムフティー。同地で長年にわたり教授とファトワー発行の座に就き、同地における学問の首位は彼に帰し、842年ラマダーン月10日に没するまで（それが続いた）。没時は70歳に至る十年のうち（60代）にあった。彼の後に彼に匹敵する者は残らなかった。マクリーズィーも彼に言及し、「アル＝ムタイヤブとして知られる徳高き法学者」と述べた。
  en: 'Muḥammad b. ʿAlī, al-Jamāl b. al-Ṭayyib, al-Yamānī al-Zabīdī al-Ḥanafī, the scholar of Zabīd and its muftī. He presided there over teaching and the issuing of fatwās for several years, and the leadership of learning there culminated in him, until he died on the tenth of Ramaḍān of the year [8]42, being in the decade before seventy (his sixties). He left no one like himself after him. Al-Maqrīzī mentioned him and said: "the virtuous jurist known as al-Muṭayyab."'
