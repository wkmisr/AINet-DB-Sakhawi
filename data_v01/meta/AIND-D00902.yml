translation:
  ja: ハイリー家系の出、マディーナの住人、シャーフィイー派、預言者のモスク（アル＝ハラム・アル＝マダニー）において彼とその父が فراش （フトン係）の一人であった。私（サハーウィー）がマディーナに逗留していた時、私に対し『アル＝アルバアイン・アン＝ナワウィー』（イマーム・ナワウィーの40ハディース集）を読誦した。その後、彼と彼の父はカイロにやって来て、891年の終わりに私と会合した。
  en: Aḥmad b. ʿAbd Allāh b. ʿAlī b. Ibrāhīm, originally from Ḥīra, a resident of Medina, and a Shafi'i. He and his father were among the attendants (farrāshīn) in the Sacred Precinct of Medina (al-Ḥaram al-Madanī). He recited al-Arbaʿūn al-Nawawiyya to me (al-Sakhāwī) during my stay there (in Medina). Afterward, he and his father came to Cairo, and they met with me at the end of the year 891 AH.
