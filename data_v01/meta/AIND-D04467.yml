translation:
  ja: アブドゥッラー・ブン・アブドゥッラフマーン、ハイル・アッ＝ディーン・アル＝アーミディー・アル＝ハナフィー。理性諸学（マアクーラート）に卓越した者の一人であり、他の諸学にも参与した。835年にアーミドの地で没した。アル＝マクリーズィーが『ウクード』において彼に言及し、アッ＝シハーブ・アル＝クーラーニーから、彼（被伝者）がクーラーニーに「私は師たちのもとで130部の著作を講解した」と語ったことを伝えている。
  en: 'ʿAbd Allāh b. ʿAbd al-Raḥmān, Khayr al-Dīn al-Āmidī al-Ḥanafī. He was among those who excelled in the rational sciences and shared in other branches of learning. He died in the land of Āmid in the year 835. Al-Maqrīzī mentioned him in his ʿUqūd and transmitted from al-Shihāb al-Kūrānī that he said to him: "I expounded one hundred and thirty compositions under my shaykhs."'
