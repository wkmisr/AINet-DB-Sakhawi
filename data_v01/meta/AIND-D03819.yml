translation:
  ja: アブドゥルラフマーン・ブン・ヒバトゥッラー・アル＝ミルハーニー・アル＝ヤマーニー。マッカに隣住（ジャーワラ）し、クルアーン朗誦学（キラーアート）に精通し、非常に速く朗誦することができた。冬期には1日に3回と3分の1回のクルアーン完読（ハトマ）を行った。彼は敬虔で熱心な礼拝者であり、他の複数の学問にも通じていた。821年ラジャブ月に没した。我らがシャイフ（イブン・ハジャル）は自著『インバー・アル＝グムル』で彼について言及している。朗誦学における彼の師の一人はムハンマド・ブン・ヤフヤー・アッ＝シャーリフィー・アル＝ハムダーニーであり、彼から七大朗誦法を学んだ。我らがシャイフ、アッ＝シハーブ・アッ＝シャワーイティーもアル＝シャーリフィーから学んでおり、彼と共に学友であった。
  en: Abd al-Rahman b. Hibat Allah al-Milhani al-Yamani. He resided in Mecca as a neighbor (jawara) and was deeply knowledgeable in the Quranic recitations (qira'at) and exceptionally fast in his recitation, completing three and a third full recitations (khatmas) of the Quran in a single day during the winter. He was a pious, devout worshiper who was also well-versed in several other sciences. He died in the month of Rajab in the year 821 AH. Our shaykh (Ibn Hajar) mentioned him in his work Inba' al-Ghumr. Among his teachers in Quranic recitations was Muhammad b. Yahya al-Sharifi al-Hamdani, from whom he studied the Seven Recitations. Our shaykh al-Shihab al-Shawayti also studied under al-Sharifi, sharing the same teacher.
