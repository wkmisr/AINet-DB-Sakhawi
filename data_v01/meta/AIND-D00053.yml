translation:
  ja: イブラーヒーム・ブン・アフマド・ブン・ユーヌス、ブルハーン・アッ＝ディーン、アブー・イスハーク。出自はガッザの人物で、アレッポのシャーフィイー派に属し、ハラブのアル＝マドラサ・アッ＝シャラフィーヤに在住した。彼の父親については後述される。彼はイブン・アッ＝ダウィーフとして知られた（この呼称は指小形および重子音を伴う）。792年頃に生まれ、イブン・アッ＝シッディークから『サヒーフ』の一部を聴聞し、ハディースを伝承した。学識者たちが彼から聴聞した。私（＝サハーウィー）はハラブで彼に会い、彼から『サヒーフ』の三部作などを聴聞した。彼は文盲で善良な人物であり、礼拝と善行によく励み、貧困と倹約にもかかわらず見知らぬ人々に大変親切で、人々と交わらず素朴であった。説教やブルハーンの集会に頻繁に出席したため、彼は様々なことを暗記するようになった。彼はフィトナ（争乱）で投獄された一人であり、ペルシャの地で学者の集会に出席した。881年に亡くなったことが確認されている。
  en: Ibrāhīm b. Aḥmad b. Yūnus, Burhān al-Dīn, Abū Isḥāq. He was of Ghazzan origin, from Aleppo, and belonged to the Shafi'i madhhab. He resided at al-Madrasa al-Sharafiyya in Aleppo, and his father will be mentioned later. He was known as Ibn al-Ḍaʿīf (this name is used in diminutive and geminated forms). Born around 792 H, he heard part of al-Ṣaḥīḥ from Ibn al-Ṣiddīq and transmitted ḥadīth. The learned heard from him. I (al-Sakhāwī) met him in Aleppo and heard from him the Thulāthiyyāt of al-Ṣaḥīḥ and other works. He was illiterate, good, diligent in prayers and good deeds, very kind to strangers despite poverty and frugality, and was reclusive and simple-minded. Due to his frequent attendance at sermons and Burhān's gatherings, he began to recall various things. He was among those who were imprisoned during the fitna (strife) and attended scholarly gatherings in Bilād al-ʿAjam (Persian lands). He died in 881 H, as verified.
