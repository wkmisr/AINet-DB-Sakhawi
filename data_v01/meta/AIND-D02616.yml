translation:
  ja: ハサン・ブン・ムハンマド・ブン・アフマド・ブン・アリー・ブン・ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アフマド。我らがシャイフ・イブン・ハジャルの息子アル＝バドル（ムハンマド）の子。ヒジュラ暦842年シャアバーン月に、1歳に満たずに没した。彼の祖父である我らがシャイフ（イブン・ハジャル）が自著『インバーウ・アル＝グムル』において彼を記録している。
  en: Ḥasan b. Muḥammad b. Aḥmad b. ʿAlī b. Muḥammad b. Muḥammad b. ʿAlī b. Aḥmad, the son of al-Badr (Muḥammad), the son of our shaykh Ibn Ḥajar. He died in Shaʿbān in the year 842 AH, being less than a year old. His grandfather, our shaykh (Ibn Ḥajar), recorded him in his chronicle (Inbāʾ al-Ghumr).
