translation:
  ja: アリー・ブン・サーリム・ブン・ザーキル・アル＝マッキー・アッ＝サーイグ（金細工師）。メッカのムアッズィン長の親族。882年ラマダーン月にメッカで没し、マアラー墓地に埋葬された。イブン・ファハドが両者（前項の人物と彼）の没年を記録している。
  en: ʿAlī b. Sālim b. Dhākir al-Makkī al-Ṣāʾigh (the goldsmith), a relative of the chief of the muezzins in Mecca. He died there in Ramaḍān of the year 882 AH and was buried in al-Muʿallā. Ibn Fahd recorded the death dates of both of them (the preceding person and him).
