translation:
  ja: スードゥン・アン＝ナウルーズィー（ナウルーズ・アル＝ハーフィズィーの配下、シャーム副王）。スードゥン・アル＝アジャミーとしても知られる。十人長（アミール・アシャラ）および近衛隊長（ラアス・ナウバ）の一人。ザーヒル・ジャクマクの治世にアミール（諸公）に列せられた。850年頃に没した。一説には、彼は凡庸な（あるいは怠惰な）人物であったと言われている。
  en: Sūdūn al-Nawrūzī, the mamlūk of Nawrūz al-Ḥāfiẓī and vice-roy of Syria. He was known as Sūdūn al-ʿAjamī. He was one of the amīrs of ten and heads of the guard (raʾs nawba). He was promoted to the rank of amīr during the reign of al-Ẓāhir Jaqmaq. He died around 850 AH, and it was said that he was of little consequence.
