translation:
  ja: ウマル・アル＝クルディー、のちにアル＝ミスリー、アル＝アバーリーキー。ミスル（エジプト）で釉薬を塗った水差し（アバーリーク）を売っていた。アッ＝シャラフ・アル＝ムナーウィーとその下の人々は彼を篤く信じていた。（8）60年ズー・アル＝カアダ月の末日に没し、アル＝ムナーウィーが、バーブ・アッ＝サイード（上エジプト門）と呼ばれるシャーフィイー廟の南門に隣接する自身の墓廟に彼を葬った。アル＝ムニールがその没年月日を記している。
  en: ʿUmar al-Kurdī, later al-Miṣrī, al-Abārīqī. He was in Miṣr (Egypt) selling glazed ewers (abārīq), and al-Sharaf al-Munāwī and those below him held him in devout regard. He died on the last day of Dhū al-Qaʿda of the year (8)60, and al-Munāwī buried him in his own tomb adjoining the southern gate of the shrine of al-Shāfiʿī, called Bāb al-Ṣaʿīd. Al-Munīr recorded his death date.
