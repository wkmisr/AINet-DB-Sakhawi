translation:
  ja: アブド・アッラー・ブン・アフマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・イーサー・ブン・ムタイル・アル＝ハカミー・アル＝ヤマーニー・アッ＝シャーフィイー。父は前述。敬虔で心の清い法学者で、教授しファトワーを出し、父の没後は兄弟たちの中で彼が指さされる（第一人者となった）。815年ジュマーダー・アル＝ウーラー月に45歳ほどで没した。アル＝アフダルがそう述べている。
  en: ʿAbd Allāh b. Aḥmad b. Ibrāhīm b. Muḥammad b. ʿĪsā b. Muṭayr al-Ḥakamī al-Yamanī al-Shāfiʿī; his father has been mentioned. He was a righteous jurist, of sound heart; he taught and gave fatwās, and after his father he was the one pointed to among his brothers. He died in Jumādā al-Ūlā of the year 815 at about forty-five. So said al-Ahdal.
