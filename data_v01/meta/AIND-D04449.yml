translation:
  ja: アブドゥッラー・ブン・スライマーン・ブン・ムハンマド・ブン・アブドゥッラー。アル＝ジャマール・アル＝キナーニー、ハウラーンの出自でガザの人（アル＝ガッズィー）、ハナフィー派。マッカの居留者で、前述のアフマドの同母兄弟。マッカに約10年間隣住（ジャーワラ）し、その地で私（サハーウィー）から聴聞した者の一人である。詩作と理解力があり、それらにいささか通じていた。888年ムハッラム月にカーリクート（カリカット）の地方で異郷の死を遂げた。アッラーが彼を慈しみ、その代償として楽園を与えられんことを。
  en: ʿAbd Allāh b. Sulaymān b. Muḥammad b. ʿAbd Allāh, al-Jamāl al-Kinānī, of Ḥawrānī origin, al-Ghazzī, the Ḥanafī, a resident of Mecca and the full brother of the aforementioned Aḥmad. He lived adjacent (jāwara) to Mecca for about ten years and was among those who heard [ḥadīth] from me there. He had some verse and understanding, in which he shared to a modest degree. He died as a stranger in the regions of Calicut in al-Muḥarram of the year 888. May God have mercy on him and grant him Paradise in recompense.
