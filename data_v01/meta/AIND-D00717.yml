translation:
  ja: アハマド・ブン・ハリル・ブン・ヤアクーブ・ブン・イブラーヒーム・アル＝カーディリー・アル＝ムディール。 833年に生まれた。イブン・アサドのもとでクルアーンを朗誦した。貧困と家族のために絹商人として生計を立て、逝去者に関する名士たちの間を回遊することで生計を立てた。
  en: Aḥmad b. Khalīl b. Yaʿqūb b. Ibrāhīm al-Qādirī al-Mudīr. He was born in 833 H. He recited the Qurʾān with Ibn Asad. Due to his poverty and family, he earned his living as a silk merchant and by circulating among the notables for the dead.
