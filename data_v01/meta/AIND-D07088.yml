translation:
  ja: ムハンマド・ブン・アル＝アターバク・アズバク・アッ＝ザーヒリー・ミン・タタフ、アッ＝ザーヒル・ジャクマクの娘の息子。母はハディージャで、彼女はアン＝ナースィリー・ブン・アル＝バーリズィーの娘の娘である。父は彼にカラージャー・アル＝ハザンダールの娘を娶らせ、彼は彼女との間にアリーをもうけた。四十人隊のアミールの一人となり、父の不在時には任命書などにおいて父を代行し、人々はそれに対する受領を彼に勧めた。898年、第一巡礼隊のアミールとして巡礼した。
  en: Muḥammad b. al-Atābak Azbak al-Ẓāhirī min Ṭaṭakh, the daughter's son of al-Ẓāhir Jaqmaq. His mother was Khadīja, who was the daughter's daughter of al-Nāṣirī b. al-Bārizī. His father married him to the daughter of Qarājā al-Khazindār, and he had by her a son, ʿAlī. He became one of the amirs of forty, and he would deputize for his father, when the latter was absent, in the (issuing of) appointment documents and the like, and people encouraged him to accept (payment) for that. He performed the pilgrimage as amir of the first caravan in the year 898.
