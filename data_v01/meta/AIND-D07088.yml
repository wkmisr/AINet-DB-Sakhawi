- text: '同母の妹 #AIND-D13398「فاطمة ابنة الاتابك أزبك من ططخ الظاهري سبطة الظاهر جقمق ، أمها خديجة」、異母の姉妹 #AIND-D12987「خديجة ابنة الاتابك أزبك الظاهري … امهما فاطمة ابنة الظاهر جقمق」（本項主を名指ししないため relation は立てない、規則23）。本項主を「أخت محمد الماضي لأبيه」と名指しする異母姉妹 #AIND-D13195（ستيتة）は sister relation（cert medium）として立てた（集約）。'
