translation:
  ja: アフマド・ブン・アリー・ブン・ムハンマド、シャムス・アル＝ディーン、エジプト人の商人。マッカ在住。「アル＝アーキル」として知られる。マッカに家を建て、849年頃にはミナーでも仕事に従事した。自身に放蕩であった。864年ラマダーン20日木曜日の夜にジッダで亡くなり、マッカに運ばれて埋葬された。子孫を残した。イブン・ファハドが彼について記した。
  en: Aḥmad b. ʿAlī b. Muḥammad, Shihāb al-Dīn, al-Miṣrī, the merchant, resident of Mecca, known as al-ʿĀqil. He established a house in Mecca and was also engaged in work in Minā around the year 849 H. He was extravagant in his personal life. He died in Jeddah on the night of Thursday, 20th of Ramadan in 864 H, and was carried to Mecca where he was buried. He left behind children. Ibn Fahd recorded his biography.
