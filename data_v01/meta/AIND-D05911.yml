translation:
  ja: ウマル・ブン・アリー・ブン・ムハンマド・ブン・アリー・ブン・ハリール、エジプト出自のマッカ人。前述のアリーの父で、イブン・アッ＝サイラジーとして知られる。「啓示のクッバ」と、ズカーク・アル＝ハジャルにあるファーティマ・アッ＝ザフラー生誕地として知られる信徒の母ハディージャの家の奉仕者。父も前述。（8）50年より前にマッカで生まれ、そこで私に『ナワウィーの四十ハディース』などを朗読し、そのほかを私から聴聞した。幼時にはクルアーンと『ミンハージュ』の全部または一部を読んだが、のちそれから離れた。カイロに来たが、彼は移り気がはなはだしく理解力に乏しく、マッカの人々の間では神のみぞ知る諸事で噂されている。
  en: ʿUmar b. ʿAlī b. Muḥammad b. ʿAlī b. Khalīl, of Egyptian origin, the Meccan; father of the aforementioned ʿAlī, known as Ibn al-Sayrajī; servant (khādim) of the Dome of Revelation (Qubbat al-Waḥy) and of the house of the Mother of the Believers Khadīja, known as the birthplace of the Lady Fāṭima al-Zahrāʾ, in Zuqāq al-Ḥajar; his father was also mentioned above. He was born before (8)50 in Mecca, where he read to me al-Arbaʿīn al-Nawawiyya and other works and heard other things from me. In his childhood he had read the Qurʾān and the Minhāj, or part of it, but then turned away from that. He came to Cairo; he is extremely erratic and lacking in understanding, and is spoken of among the people of Mecca for matters of which God knows best.
