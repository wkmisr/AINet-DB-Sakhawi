translation:
  ja: アリー・ブン・マンスール・ブン・ザイン・アル＝アラブ、アル＝ヒスカフィー、のちにアル＝マクディスィー。アブー・アル＝ルトフ・ムハンマドの父。織物商であり、富豪であった。エルサレム（アル＝クドゥス）で（ヒジュラ暦）855年に亡くなり、息子に莫大な遺産を残した。
  en: ʿAlī b. Manṣūr b. Zayn al-ʿArab al-Ḥiṣkafī, then al-Maqdisī, the father of Abū al-Luṭf Muḥammad. He was a wealthy cloth merchant. He died in Jerusalem in the year 855 AH, leaving a vast fortune to his son.
