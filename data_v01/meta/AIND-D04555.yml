translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アフマド・ブン・アビー・アル＝ファドル・ブン・アブドゥッラー、アル＝アフィーフ・ブン・アル＝ジャマール・ブン・アッ＝シハーブ・ブン・アル＝カマール、ハラール（ハラーズ）を本貫とするアル＝マッキー、アル＝ハナフィー。前述のアフマドの兄弟で、彼ら二人の父は後述される。マッカで私（サハーウィー）から聴聞した者の一人。
  en: ʿAbd Allāh b. Muḥammad b. Aḥmad b. Abī al-Faḍl b. ʿAbd Allāh, al-ʿAfīf b. al-Jamāl b. al-Shihāb b. al-Kamāl, of Ḥarārī (Ḥarāzī) origin, al-Makkī, al-Ḥanafī, brother of the aforementioned Aḥmad; their father is to be mentioned below. He was among those who heard from me (al-Sakhāwī) in Mecca.
