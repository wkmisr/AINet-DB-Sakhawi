translation:
  ja: アブドゥルアズィーズ・ブン・ムハンマド・ブン・サーリフ、ナムラー出身でカイロの人。父は後述され、彼も父と同じく「イブン・サーリフ」として知られる。上品さと物静かさ、隠遁を好む青年で、カイロで私（サハーウィー）から聴聞した者の一人であり、父などから引き継いだいくつかの禄（ジハート）を名義上有していた。ヒジュラ暦891年シャウワール月に没し、金曜礼拝の後にアズハル（・モスク）で葬儀の礼拝が行われた。
  en: ʿAbd al-ʿAzīz b. Muḥammad b. Ṣāliḥ, of Namrā origin, al-Qāhirī, whose father is mentioned below; like him he was known as Ibn Ṣāliḥ. A young man inclined to refinement, quiet and seclusion, he was among those who heard from me in Cairo, and some stipendiary posts (jihāt) transferred from his father and others were held in his name. He died in Shawwāl 891 AH, and the funeral prayer was performed for him after the Friday prayer at al-Azhar.
