translation:
  ja: アハマド・ブン・アリー・ブン・ムハンマド、シャハーブ・アル＝ガッズィー、ハナフィー派。マッカ定住者。ヤフヤー・アル＝ワーイズの弟子であった。我らがシャイフ（サハーウィー）に893年に『アルバイーン・アン＝ナワウィー』を朗誦し、その翌年には『ブハーリー』の一部を朗誦し、その間師事した。彼（伝記対象者）はマッカにおいてアル＝ムヒッブ・イブン・ハルバーシュに法学を、アブドゥッラー・アッ＝シャーミーに文法学を朗誦した人々のうちの一人である。彼には穏やかさと堅実さがあった。
  en: Aḥmad b. ʿAlī b. Muḥammad, al-Shihāb al-Ghazī al-Ḥanafī. A resident of Mecca, he was among the companions/students of Yaḥyā al-Wāʿiẓ. He recited to our shaykh (al-Sakhāwī) in 893 (AH) al-Arbaʿīn al-Nawawiyya, and then in the following year, some of al-Bukhārī, remaining with him for both. He was also among those who recited in Mecca to al-Muḥibb b. Ḥarbāsh in fiqh and to ʿAbd Allāh al-Shāmī in grammar. He possessed calmness and rigidity.
