translation:
  ja: フサイン・ブン・ムハンマド・ブン・ムハンマド・ブン・アリー、アブー・アン＝ヌール・ブン・アビー・アル＝ハイル・ブン・アル＝ジャマール・アル＝ファーキヒー・アル＝マッキー。父（アブー・アル＝ハイル・アル＝ファーキヒー）は後出する。父はマッカで、自らの読誦と他者の読誦により彼に聴聞させた。そのうちには『ナワウィー伝』の一部も含まれる。
  en: Ḥusayn b. Muḥammad b. Muḥammad b. ʿAlī, Abū al-Nūr b. Abī al-Khayr b. al-Jamāl al-Fākihī al-Makkī. His father, whose biography is mentioned below, made him hear in Mecca, through his own recitation and the recitation of others, including a portion of the biography of al-Nawawī.
