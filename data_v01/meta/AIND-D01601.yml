translation:
  ja: アハマド・ブン・ムハンマド。イブン・ワーリーとして知られる。およそヒジュラ暦890年あるいはその以前に生まれた。私（＝サハーウィー）は彼から彼が言った以下の言葉を書写した。 「人びとは私に言う。『海には獰猛なワニがいる。猟師のために私は狩りをするが、ワニは猟師をずる賢く罠にかけた』と。そこで私は彼らに言った。『これはワニの寿命の尽き目だ。もしワニがベイルートに行けば、それがワニの獲物になるだろう』」
  en: 'Aḥmad b. Muḥammad, known as Ibn Wālī. He was born approximately in the year 890 AH or earlier. I (al-Sakhāwī) wrote down from him his saying: "They say to me, ''There is a fierce crocodile in the sea / I hunt for a hunter, and it has trapped him cunningly.'' / So I said to them, ''This is the end of his life / And if he went to Beirut, it would be a prey for him.''"'
