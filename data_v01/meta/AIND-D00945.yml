translation:
  ja: アハマド・ブン・アブドゥッラー・アッ=ザワーウィー・アル=ムラウィー・アル=マグフリビー・アル=マーリキーは、アルジェリアの居住者であった。彼は、篤信、学識、敬虔、そして調査・検証に長けていたことで知られた。ヒジュラ暦884年ムハッラム月10日に84歳で亡くなった。このことは、私に何人かのマグリブ人から知らされた。
  en: Ahmad b. ʿAbd Allāh al-Zawāwī al-Mlawī al-Maghribī al-Mālikī was a resident of Algeria. He was known for his piety, knowledge, devoutness, and thorough verification. He died on the 10th of Muharram in the year 884 H at the age of 84. This information was conveyed to me by some Maghribis.
