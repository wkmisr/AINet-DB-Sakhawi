translation:
  ja: ムハンマド・ブン・アフマド・ブン・アビー・バクル・ブン・アフマド、アル＝ムヒッブ・アブー・アル＝ワリード・ブン・アッ＝シハーブ・アル＝ハマウィー・アル＝マーリキー。前出のアブド・アル＝カーディルの兄弟で、その父はいま存命のナジュム・アッ＝ディーン。父と同じくイブン・アッ＝ラッサームとして知られる。力量は及ばなかったが、故郷でマーリキー派のカーディー職に就き、（8）60年余りにそこで没した。すでに壮年を過ぎていた。
  en: Muḥammad b. Aḥmad b. Abī Bakr b. Aḥmad, al-Muḥibb Abū al-Walīd b. al-Shihāb al-Ḥamawī al-Mālikī, brother of ʿAbd al-Qādir mentioned above, and his father is Najm al-Dīn, who is alive now; known, like his father, as Ibn al-Rassām. He held the Mālikī judgeship in his home town despite the inadequacy of his standing, and he died there in the year [8]60-odd, having passed mature age.
