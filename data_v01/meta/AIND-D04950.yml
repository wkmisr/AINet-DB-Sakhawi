translation:
  ja: アリー・ブン・アフマド・ブン・イブラーヒーム、ヌールッディーン・イブン・アッ＝サッダール。前述のアブドゥッラフマーンの兄弟で、名高いシャムスッディーンの母方の叔父。その姉妹の子は彼のもとでその諸技芸を修業した。彼は美しい筆跡で多くを書写し、とくにマッカに滞在（ムジャーワラ）していた折にそうした。善良な人物で、ムザッファル・アル＝アムシャーティーが彼を称賛し、カーディーのバドルッディーン・アッ＝サアディーが彼について我々にいくらか語ってくれた。850年を過ぎた頃に没した。
  en: ʿAlī b. Aḥmad b. Ibrāhīm, Nūr al-Dīn Ibn al-Saddār, brother of the aforementioned ʿAbd al-Raḥmān and maternal uncle of the famous Shams al-Dīn. His sister's son trained under him in his arts. He wrote a great deal in his fine hand, especially during his stays (mujāwara) in Mecca. He was a good man; Muẓaffar al-Amshāṭī praised him, and the qāḍī Badr al-Dīn al-Saʿdī related something to us about him. He died after 850, approximately.
