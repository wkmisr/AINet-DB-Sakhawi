translation:
  ja: アブドゥルカーディル・ブン・アリー・ブン・ウマル・アッ＝ダンジーヒー・アル＝アズハリー・アッ＝シャーフィイー、モスクの門のシルク商人。礼拝時刻計算学（ミーカーツ）、相続法、算術の分野で頭角を現し、アル＝バドル・アル＝マーリダーニーらから学び、学生たちに教え授けた。
  en: ʿAbd al-Qādir b. ʿAlī b. ʿUmar al-Danjīhī al-Azharī al-Shāfiʿī, the silk-merchant at the gate of the Mosque. He was distinguished in the fields of timekeeping (al-mīqāt), inheritance law, and arithmetic. He studied under al-Badr al-Māridānī and others, and benefited the students.
