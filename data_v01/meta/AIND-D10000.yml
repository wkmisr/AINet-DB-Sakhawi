translation:
  ja: マッキー・ブン・ラージフ・ブン・ムハンマド・ブン・アブド・アッラー・ブン・ウマル・ブン・マスウード・アル＝ウマリー。カーイド（隊長）たちの一人。851年ラビーウ第一月にイエメン地方のアル＝アトワーで没し、マッカに運ばれてアル＝マアラー（墓地）に埋葬された。
  en: Makkī b. Rājiḥ b. Muḥammad b. ʿAbd Allāh b. ʿUmar b. Masʿūd al-ʿUmarī, one of the qāʾids (commanders). He died in Rabīʿ I 851 at al-Aṭwāʾ in the land of Yemen, and was carried to Mecca and buried at al-Muʿallā.
