translation:
  ja: アブドゥルガニー・ブン・ムハンマド・ブン・アブドゥッラフマーン、アル＝カーヒリー・アル＝ハリーリー・アル＝アッカード（絹糸・紐職人）。先述のアブドゥッラフマーンの父。恵み深い長老で、クルアーンと『ウムダ』を暗記した。ハンバリー派で、絹の製造で生計を立てていた。アッ＝シャラフ・アル＝ムナーウィーらのもとで（ハディースを）聴聞した。私（サハーウィー）は、彼が我が家にいたとき、庶民の流儀による彼の詩作をいくつか彼から聴いた。887年ズー・アル＝カアダ月に80歳未満で没した。
  en: ʿAbd al-Ghanī b. Muḥammad b. ʿAbd al-Raḥmān al-Qāhirī al-Ḥarīrī al-ʿAqqād (the silk-cord maker), father of the previously mentioned ʿAbd al-Raḥmān. A blessed shaykh, he memorized the Qurʾān and al-ʿUmda. He was a Ḥanbalī and earned his living in the silk trade. He heard (ḥadīth) from al-Sharaf al-Manāwī and others. I heard from him, while he was at my house, some of his verse composed in the manner of the common people. He died in Dhū al-Qaʿda 887, aged under eighty.
