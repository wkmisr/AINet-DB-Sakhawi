translation:
  ja: アリー・ブン・ムハンマド・ブン・ハサン・ブン・アリー、アン＝ヌール・ブン・アッ＝シャムス・バラカート、ナトゥーバス出自のカイロ人、ブーラークの住人。その父はザイニー・アル＝ウスターダール・モスクの時刻係（ムワッキト）である。890年ラジャブ月末、父の同席のもとで私（サハーウィー）に『ウムダ』を暗誦提示した。
  en: ʿAlī b. Muḥammad b. Ḥasan b. ʿAlī, al-Nūr b. al-Shams Barakāt, of Naṭūbas origin, al-Qāhirī, resident of Būlāq; his father is the timekeeper (muwaqqit) at the mosque of al-Zaynī al-Ustādār. He recited al-ʿUmda to me (al-Sakhāwī) from memory in late Rajab of the year 890, in the presence of his father.
