translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・アフマド、シャハーブ・アッ＝ディーン・アル＝クースィー・アル＝ヤマニー、シャーフィイー派。「イブン・…」として知られた（通称は本文で欠落）。父はクースの人々の間で著名であった。彼はクースで育ち、そこでいくつかの役職に就いた後、イエメンに入り、そこに定住した。イエメンの一部の地域でアル=マジド・アッ=シーラーズィーの代理人を務めた。我らがシャイフ（イブン・ハジャル）は『ムアッジャム』の中で彼について、非常に冗談好きであったと述べている。シャイフは続けて言う。「彼は私（イブン・ハジャル）に、ダマスカスでムヒイー・アッ＝ディーン・ブン・アッ＝ラハビーから聴聞したと語ったので、私はアル＝マハジャムの町で彼からハディースを一つ聴聞し、『アル＝ブルダーニーヤート』に書き留めた。彼は806年に我々（イブン・ハジャルの一行）とともに巡礼を行い、その後イエメンに戻った。再び巡礼を行ったとも伝え聞いた」。私（サハーウィー）が言うに、彼はマクリーズィーの『ウクード』に簡潔に記載されている。彼は後述するアフマド・ブン・アブドゥッラー・アル=クーシー・アル=ミスリーとは異なる人物であり、名前は一致するが、ニスバと出身地は異なる。
  en: 'Aḥmad b. Ibrāhīm b. Aḥmad, Shihāb al-Dīn al-Qūṣī al-Yamanī al-Shāfiʿī, known as Ibn [...] (the byname is lacking in the text); his father was a well-known man of Qūṣ. He grew up there and held several positions. Then he entered Yemen and settled there, serving as a deputy in some of its regions on behalf of al-Majd al-Shīrāzī. Our shaykh (Ibn Ḥajar) mentioned in his dictionary (Muʿjam) that he was very humorous. He (Ibn Ḥajar) continued: ''He told me that he had heard from Muḥyī al-Dīn b. al-Raḥabī in Damascus, so I heard a single ḥadīth from him in the city of al-Mahjam, which I recorded in my Buldāniyāt. He performed Hajj with us in the year 806, then returned to Yemen, and we heard that he performed Hajj again.'' I (al-Sakhāwī) say that he is mentioned briefly in al-Maqrīzī''s ʿUqūd. He is not the Aḥmad b. ʿAbd Allāh al-Qūṣī al-Miṣrī who is mentioned later; they share the same name but differ in nisbah and origin.'
