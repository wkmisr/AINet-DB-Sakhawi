translation:
  ja: アハマド・ブン・イブラーヒーム・ブン・イスマーイール。ラカブは「シハーブ」、クンヤは「アブー・アル＝アッバース」、ニスバは「アル＝ナーブルスィー」。イブン・アッ＝ダルウィーシュとしても知られる。彼はアル＝マイドゥーミーから『アル＝ムサルサル』などを聞いた。またイブン・アル＝カーリーからは『ジュズー・イブン・アッ＝タラーヤ』と、アル＝サッフで『アル＝ムサルサル』を聞いた。伝承を行い、我らがシャイフ（イブン・ハジャル）の弟子であるアッ＝タキー・アブー・バクル・アル＝カルカシャンディーらが802年に彼からこれ（伝承）を聞いた。彼は821年に我らがシャイフの子（イブン・ハジャルの息子）のためにイジャーザを授与するまで生きた。
  en: Aḥmad b. Ibrāhīm b. Ismāʿīl, al-Shihāb Abū al-ʿAbbās al-Nābulusī, also known as Ibn al-Darwīsh. He heard al-Musalsal and other works from al-Maydūmī, and Juzʾ Ibn al-Ṭalāya and al-Musalsal in al-Ṣaff from Ibn al-Qārī. He transmitted (ḥaddatha), and our shaykh (Ibn Ḥajar al-ʿAsqalānī)'s student, al-Taqī Abū Bakr al-Qalqashandī, and others heard that from him in the year '02 (802 AH). He lived until he granted an ijaza in a request in the year '21 (821 AH) for Ibn Shaykhinā (Ibn Ḥajar's son).
