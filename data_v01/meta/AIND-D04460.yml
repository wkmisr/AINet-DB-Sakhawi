    ja: '同母兄弟 العلاء علي ＝ #AIND-D05200（علي بن عبد الرحمن بن حسن بن علي بن منصور بن علي العلاء أبو الحسن البغدادي الأصل الغزي الشافعي ويعرف بابن المشرقي نسبة للمشرق ضد المغرب، 850年生・889年ラビーウ第1月没）。6代ナサブ・ニスバ・シュフラ（ابن المشرقي）がすべて一致し、D05200 本文の「ثم لازمني هو وأخوه بعد في الدروس」も本項の「وأظنه ممن سمع مني」と整合する。初版は #NEEDID。'
