translation:
  ja: アブドゥッラー・ブン・アブドゥッラフマーン・ブン・ハサン・ブン・アリー・ブン・マンスール・ブン・アリー。アッ＝タキー、バグダードの出自でガザの人、シャーフィイー派。後述のアル＝アラー・アリーの同母兄弟。イブン・アル＝マシュリキーとして知られる。852年に生まれ、893年に没した。私（サハーウィー）から聴聞した者の一人であると私は思う。
  en: ʿAbd Allāh b. ʿAbd al-Raḥmān b. Ḥasan b. ʿAlī b. Manṣūr b. ʿAlī, al-Taqī, of Baghdādī origin, al-Ghazzī, the Shāfiʿī, the full brother of al-ʿAlāʾ ʿAlī who comes below, known as Ibn al-Mashriqī. He was born in the year 852 and died in the year 893. I think he was among those who heard [ḥadīth] from me.
