translation:
  ja: ウマル・ブン・アリー・ブン・アブドゥッラー・アル＝ハンマーミー・アッ＝スーフィー。公衆浴場の番人であったが、のちにそれを経営するようになり、富を得た。それに加えて、談話が巧みで、声が美しく、貧者（スーフィー）に奉仕した。（8）11年ラビーウ・アル＝アーヒル月に没した。アル＝マクリーズィーが『ウクード』で彼に言及し、彼が自分の隣人であったこと、また彼に関する奇妙な逸話を伝えている。
  en: ʿUmar b. ʿAlī b. ʿAbd Allāh al-Ḥammāmī al-Ṣūfī. He was a guard at the bathhouses, then came to run them and grew wealthy, along with pleasant company, a touching voice, and service to the poor (Sufis). He died in Rabīʿ II (8)11. Al-Maqrīzī mentioned him in his ʿUqūd, said that he was his neighbour, and related a strange story about him.
