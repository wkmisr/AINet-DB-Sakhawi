notes:
- text: '転送見出し（原文「مضى فيمن جده علي」による）。転送先は #AIND-D06535「909 محمد بن إبراهيم بن علي اليافعي اليماني الأصل المكي والد إبراهيم الماضي ويعرف بالبطيني ممن كان يتجر ويسكن مكة . وله بها وبمنى دار . مات بمكة في سنة إحدى وسبعين .」（本バッチ B169）。名・父名・祖父 علي・通称 البطيني が一致。ニスバ索引 #AIND-D11500「البطيني بضم مصغر محمد بن إبرهيم بن علي وابنه إبرهيم والد أحمد .」も同人を挙げる。'
