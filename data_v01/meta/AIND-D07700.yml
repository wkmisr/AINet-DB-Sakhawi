translation:
  ja: ムハンマド・ブン・アブド・アル＝カーディル・ブン・アビー・バクル、アル＝バドル、アブー・アッ＝サアーダート、カービス出自でマハッラの人、シャーフィイー派。ムワッファク・アッ＝ディーン・ウマル・ブン・アブド・アル＝ワッハーブ・アル＝カービスィーの子孫。私（サハーウィー）に〔暗誦を〕提示した者の一人。彼の父はマハッラのカーディーの代理を務めている——いや、彼自身が〔カーディー〕である。彼の父方の叔父アブー・アッ＝タイイブ・ムハンマド・イブン・アビー・バクル・ブン・ムハンマドは既述した。
  en: Muḥammad b. ʿAbd al-Qādir b. Abī Bakr, al-Badr Abū al-Saʿādāt, of Qābis origin, of al-Maḥalla, Shāfiʿī, a descendant of Muwaffaq al-Dīn ʿUmar b. ʿAbd al-Wahhāb al-Qābisī. He is among those who presented (their memorised texts) to me (al-Sakhāwī). His father serves as deputy of the qāḍī of al-Maḥalla—nay, he is (the qāḍī) himself. His paternal uncle Abū al-Ṭayyib Muḥammad b. Abī Bakr b. Muḥammad has been mentioned above.
