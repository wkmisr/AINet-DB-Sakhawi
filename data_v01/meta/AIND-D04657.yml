translation:
  ja: アブドゥッラー・ブン・ユースフ・ブン・アリー・ブン・ハルド・アル＝ハサナーウィー・アル＝ビジャーイー・アル＝マグリビー・アル＝マーリキー。預言者の町マディーナで私（サハーウィー）に会い、私から『ハディースのアルフィーヤ』を討究しつつ学び、そのほかも学んだ。ついでカイロで私に『ムワッタア』を全巻読み上げ、この両地でも、またマッカでも、私から多くを伝承した。私は彼のために充実したイジャーザを書いた。彼は自らの国へ帰った。彼は精確な学識をもつ選り抜きの卓越者の一人である。
  en: ʿAbd Allāh b. Yūsuf b. ʿAlī b. Khald al-Ḥasanāwī al-Bijāʾī al-Maghribī al-Mālikī. He met me [al-Sakhāwī] in Medina, the Prophet's city, and took from me the Alfiyya of ḥadīth by way of critical study, and other works; then in Cairo he read to me the Muwaṭṭaʾ in its entirety, and he transmitted a great deal from me in both places and in Mecca as well. I wrote him a copious ijāza. He returned to his country. He is one of the excellent, choice and precise scholars.
