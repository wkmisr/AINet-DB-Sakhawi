translation:
  ja: ダウード・ブン・イブラーヒーム・アッ＝サイラフィー。ハナフィー派のヌール・アッ＝ディーン・アリーの父。私庫（ムフラド）および国家（ダウラ）双方の精算官（両替商）を務め、のちに国家のみに限定されて（没するまで）継続した。853年ラジャブ月に死去。おそらくその息子よりも優れた人物であった。
  en: Dāwūd b. Ibrāhīm al-Ṣayrafī, the father of Nūr al-Dīn ʿAlī, the Hanafi. He served as the money changer (ṣayrafī) of both the private treasury (al-mufrad) and the state (al-dawla) together, then he was restricted to the state treasury, continuing in this role until he died in Rajab, the year 853. Perhaps he was better than his son.
