translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・アフマド・ブン・アリー・ブン・ムハンマド・ブン・カースィム、アッ＝シャムス・ブン・アル＝ジャマール・ブン・アル＝ハーフィズ・アッ＝シハーブ、アル＝カーヒリー・アル＝カッザーズィー。前述のイブラーヒームの兄弟で、先祖と同じくアル＝ウルヤーニーとして知られる。ヒジュラ暦808年頃に生まれた。ハディースと伝承の家の出であったが、私（サハーウィー）は彼に聴聞もイジャーザも知らない。ただし、年長になってから私たちと共に幾人かの師からわずかに聴聞した。ワッラーキーン（書籍商街）の店でガラス商いを生業とし、サイード・アッ＝スアダー（ハーンカー）のスーフィーであった。しばらく半身不随を患った後、ヒジュラ暦879年ムハッラム月に没した。神が彼を赦したまわんことを。
  en: Muḥammad b. ʿAbd Allāh b. Aḥmad b. ʿAlī b. Muḥammad b. Qāsim, al-Shams b. al-Jamāl b. al-Ḥāfiẓ al-Shihāb, al-Qāhirī al-Qazzāzī, brother of the aforementioned Ibrāhīm, known like his forebears as al-ʿUryānī. He was born around the year 808. He came from a family of ḥadīth and transmission, but I (al-Sakhāwī) know of no audition (samāʿ) or ijāza of his; however, when he was grown he heard a little together with us from some shaykhs. He earned his living in the glass trade in a shop in al-Warrāqīn, and was a Sufi at Saʿīd al-Suʿadāʾ. He died in Muḥarram 879 after suffering from hemiplegia for a time. May God pardon him.
