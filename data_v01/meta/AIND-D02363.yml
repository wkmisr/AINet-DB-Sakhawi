translation:
  ja: ジャンバク・アッ＝シャムシー・アル＝ムアイヤディー。アターバク時代にムアイヤドによって買い取られ、その後に位階を昇り、ついにタラーブルスのアミールの一人となった。それからアレッポで侍従長職に就いたが、解任されてダマスカスへ向かい、そこでタブルハーナーのアミール位を授けられた。その地で859年ズー・アル＝カアダ末またはその次の月のはじめに亡くなるまで、その職にあった。
  en: Jānbak al-Shamsī al-Muʾayyadī. Al-Muʾayyad purchased him during his atabak-ship, and he subsequently rose in rank until he became one of the amirs of Tripoli. Then he was appointed as ḥājib al-ḥujjāb in Aleppo, but he was dismissed and proceeded to Damascus, where he was granted the amirate of ṭablkhānāh. He held that office until he died there in late Dhū al-Qaʿda or early the next month in the year 859.
