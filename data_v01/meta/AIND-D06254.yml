translation:
  ja: カースィム・アッ＝ダマニー・アル＝ヤマーニー・アッ＝シャーフィイー、大学者（アッラーマ）、法学者、タイッズのムフティー。同地におけるファトワー（発行）の首位は彼に帰した。832年に没し、タイッズでは後述のアル＝ジャマール・イブン・アル＝ハイヤートが彼の後を継いだ。
  en: Qāsim al-Damanī al-Yamānī al-Shāfiʿī, the erudite scholar, jurist and muftī of Taʿizz. The leadership in issuing fatwās there passed to him. He died in the year 832, and al-Jamāl Ibn al-Khayyāṭ, who will be mentioned below, succeeded him in Taʿizz.
