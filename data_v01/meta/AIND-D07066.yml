translation:
  ja: ムハンマド・ブン・アフマド・アル＝バルヒー・アッ＝ディマシュキー、バキーバカとして知られる。850年にダマスクスから私（サハーウィー）にイジャーザを与えた。アル＝ブルハーン・アル＝アジュルーニーは、彼がアル＝ムヒッブ・アッ＝サーミトから聴聞したと述べたが、アッラーが最もよく知りたもう。
  en: Muḥammad b. Aḥmad al-Balkhī al-Dimashqī, known as Bakībaka. He granted me (al-Sakhāwī) an ijāza in the year 850 from Damascus. Al-Burhān al-ʿAjlūnī mentioned that he had heard from al-Muḥibb al-Ṣāmit; but God knows best.
