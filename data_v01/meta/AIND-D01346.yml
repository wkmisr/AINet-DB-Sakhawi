translation:
  ja: 358番。アフマド・ブン・ムハンマド・ブン・アブドゥッラフマーン・ブン・ムハンマド・ブン・アフマド・ブン・ハリーフ・ブン・イーサー、ラカブは「アッ＝シハーブ」、クンヤは「アブー・ル＝ハッターブ」。彼はイマームのアブー・ハーミド・アル＝マタリー、アル＝マダニー、アッ＝シャーフィイーの子孫である。後述のアル＝ムヒッブ・ムハンマドの兄弟である。彼はアブー・ル＝ハサン・アル＝マハッリー（スィブト・アッ＝ズバイル）に聴聞し、それ以前の815年にはアッ＝ザイン・アル＝マラーギーに聴聞した。
  en: Aḥmad b. Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. Aḥmad b. Khalīf b. ʿĪsā, al-Shihāb Abū al-Khaṭṭāb, from the family of al-Imām Abū Ḥāmid al-Maṭarī al-Madanī al-Shāfiʿī. He is the brother of al-Muḥibb Muḥammad, who will be mentioned later. He heard from Abū al-Ḥasan al-Maḥallī (Sibṭ al-Zubayr), and before that, in the year 815 H, he heard from al-Zayn al-Marāghī.
