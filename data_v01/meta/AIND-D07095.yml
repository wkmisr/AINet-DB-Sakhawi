translation:
  ja: ムハンマド・アミーン・アッ＝ディーン・アブー・アン＝ヌール、前項の人物の同母兄弟。彼もまた父の庇護のもとで育ち、クルアーンなどを読誦し、（父は）彼に多くを聴聞させた。私（サハーウィー）から口述（イムラー）の場で多くを学んだ。彼（父）の後を継いで城塞のモスク（ジャーミウ・アル＝カルア）における諸職に就いた。もっとも代理としてである。彼には品位があり、知性と優れた筆跡を備え、良き後継者である。
  en: Muḥammad Amīn al-Dīn Abū al-Nūr, the full brother of the preceding one. He too grew up under his father's care, read the Qurʾān and other texts, and (his father) had him hear a great deal. He took much from me in the dictation sessions (imlāʾ). He succeeded him in his posts at the Mosque of the Citadel, though only as deputy. He has dignity, intelligence and fine handwriting, and is an excellent successor.
