translation:
  ja: ムハンマド・ブン・アブド・アル＝アハド・ブン・アリー、アッ＝シャムス・アル＝カーヒリー、文法学者（アン＝ナフウィー）、イブン・ヒシャームの外孫、アル＝ウジャイミーとして知られる。アル＝アイニーは彼の父をアブド・アル＝アハドと呼んだ。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及して言う、「母方の叔父アル＝ムヒッブ・ブン・ヒシャームに学び、法学・法学原理論・アラビア語学に熟達した。アル＝アラー・アル＝ブハーリーがカイロに来た時には彼に密着して師事し、同じくアル＝バドル・アッ＝ダマーミーニーにも密着して師事した。礼節に富み、アラビア語学の知識に秀で、礼拝に励み、重厚で静かな人であった」。822年シャアバーン月20日に没し、スーフィー墓地に埋葬された。葬列は盛大であった。神が彼と我々を慈しまれんことを。
  en: 'Muḥammad b. ʿAbd al-Aḥad b. ʿAlī, al-Shams al-Qāhirī, the grammarian, grandson (through his mother) of Ibn Hishām, known as al-ʿUjaymī; al-ʿAynī named his father ʿAbd al-Aḥad. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: "He studied under his maternal uncle al-Muḥibb b. Hishām and became skilled in jurisprudence, legal theory and Arabic; he attached himself to al-ʿAlāʾ al-Bukhārī when the latter came to Cairo, and likewise to al-Badr al-Damāmīnī. He was most courteous, outstanding in his knowledge of Arabic, assiduous in worship, dignified and calm." He died on 20 Shaʿbān [8]22 and was buried at al-Ṣūfiyya; his funeral was crowded. May God have mercy on him and on us.'
