translation:
  ja: アシュラフィー・カーイトバーイのアクバーイ。彼の（カーイトバーイの）購入奴隷の「アル＝タウィール（背の高い）」ではなかった。彼はアル＝シャルキーヤのカシフを務め、その後、シーバーイ・アッ＝ザーヒリー（＝シーバーイ・アル＝アシュラフィー・イーナール、#AIND-D03248）がシャームのハージュブ職に転任した後、その後任としてガザのナイーブ職に任ぜられ、さらにラムラがその管轄に加わった。彼の厳しさのおかげで、当時の道路の治安は大いに改善された。彼の体には白い斑点が生じた。
  en: 'Aqbay al-Ashrafī Qāytbāy. He was not al-Ṭawīl (the Tall One) from among his (Qāytbāy''s) purchased Mamluks. He served as Kāshif of al-Sharqiyya, then he (likely the Sultan) appointed him as Nāʾib of Ghazza — succeeding Sībāy al-Ẓāhirī (identified as Sībāy al-Ashrafī Īnāl, #AIND-D03248) — after the latter transferred to the Ḥujūbiyya of al-Shām, and then al-Ramla was added to his jurisdiction. During his time, security on the roads greatly increased due to his severity. A whiteness (skin condition) appeared on his body.'
