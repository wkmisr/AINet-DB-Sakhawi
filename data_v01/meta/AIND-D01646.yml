translation:
  ja: マスウードの息子アフマド、マディーナ出身でメッカ在住。アル＝ハルリーヤ（開いたミーム、静止したラー、その下にヤー）として知られる。彼は善良な人物で、ダー・アル＝イマーラ（総督府）の市場（カイサリーヤ）で生計を立て、アル＝ムッダアー地区に家があった。ヒジュラ暦860年ムハッラム月に死去し、アル＝ムアッラー墓地に埋葬された。
  en: Aḥmad b. Masʿūd al-Madanī, a resident of Mecca, known as al-Kharriyya (with an open mīm, a quiescent rāʾ, and a yāʾ below it). He was a good-natured person who earned his living in the Qayṣarīya of Dār al-Imāra (House of the Emirate) and had a house in the al-Muddaʿā district. He died in Muḥarram of the year 860 AH and was buried in al-Muʿallā.
