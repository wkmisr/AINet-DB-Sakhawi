translation:
  ja: アブドゥルカーディル・ブン・アッ＝タキー・ムハンマド・ブン・アッ＝シャムス・ムハンマド・ブン・ハリル・ブン・イブラーヒーム・ブン・アリー。ハッラーンを起源とし、カイロに在住。彼の父と祖父の伝記は後述される。「イブン・アル＝ムナムナム」として知られる。ザーヒリーヤ・マドラサで『サヒーフ・アル＝ブハーリー』を聴聞した者の一人。
  en: ʿAbd al-Qādir b. al-Taqī Muḥammad b. al-Shams Muḥammad b. Khalīl b. Ibrāhīm b. ʿAlī, of Ḥarrānī origin, of Cairo. His father and grandfather are mentioned below. He is known as Ibn al-Munamnam. He was among those who heard the recitation of al-Bukhārī at the Ẓāhiriyya.
