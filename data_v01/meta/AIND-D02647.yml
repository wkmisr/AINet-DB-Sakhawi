translation:
  ja: ハサン・ブン・マンスール。アル＝バドル。ハナフィー派の判事（カーディー）。さらにダマスクスで市場監督官（ムフタスィブ）も務めた。［ヒジュラ暦８０］３年、タメルラン（ティムール）による［ダマスクス］処罰の最中に没した。アル＝アイニーがそう述べている。
  en: Ḥasan b. Manṣūr, al-Badr, the Hanafi judge (qāḍī). He had also assumed the office of market inspector (ḥisba) in Damascus. He died in the year 803 during the punishment/devastation of al-Lank (Timur). This was stated by al-ʿAynī.
