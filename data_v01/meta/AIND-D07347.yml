translation:
  ja: ムハンマド・ブン・ハサン・ブン・アッ＝サミーン・アル＝ヤマニー。ヒジュラ暦746年ジュマーダー・アッサーニヤ月に生まれた。母方の叔父であるハディース学者アフマド・ブン・イブラーヒーム・アル＝ウサイリーから伝承した。（その叔父は）アル＝アフィーフ・アル＝ヤーフィイーからイジャーザによって（伝承していた）。アッ＝タキー・ブン・ファハドが自身の『ムウジャム』において彼に言及している。彼の祖父の名と彼の師のニスバは要校訂である。
  en: Muḥammad b. Ḥasan b. al-Samīn al-Yamanī. He was born in Jumādā al-Thāniya of the year 746 AH. He narrated from his maternal uncle, the muḥaddith Aḥmad b. Ibrāhīm al-ʿUsaylī, who [narrated] from al-ʿAfīf al-Yāfiʿī by ijāza. Al-Taqī b. Fahd mentioned him in his Muʿjam. The name of his grandfather and the nisba of his shaykh remain to be verified.
