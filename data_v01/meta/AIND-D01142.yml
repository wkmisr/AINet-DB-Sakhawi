translation:
  ja: アフマド・ブン・ウマル、ラカブはアッ＝シハーブ、ニスバはビルバイスィーそしてバッザール。ヒジュラ暦838年ラジャブ月12日の金曜日に死去、80歳を超えていた。彼は信頼性、信仰心、誠実さ、そして正直な言葉遣いで知られる優れた商人であった。マッカで何度か滞在（ムジャーワラ）し、多くのハディースを聴聞した。子供たちをもうけた。アッラーの慈悲が彼にあらんことを。我らがシャイフ（イブン・ハジャル）は自身の著書『インバー・アル＝グムル』で彼について述べ、私は彼が後述するアッ＝サラージ・ウマルの父であろうと推測する。もっとも私自身、我らがシャイフの伝記のなかでは彼（アッ＝サラージ・ウマル）の祖父をムハンマドと記したのではあるが。
  en: Aḥmad b. ʿUmar, known as al-Shihāb al-Bilbaysī al-Bazzār, died on Friday, the twelfth of Rajab in the year 838 AH, having passed eighty years of age. He was among the best merchants, known for his trustworthiness, piety, integrity, and truthful speech. He undertook several extended stays (mujāwarāt) in Mecca and heard much [ḥadīth]. He begat children, may God have mercy on him. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ al-Ghumr, and I presume he is the father of al-Sirāj ʿUmar, who will be mentioned later, even though I named his (al-Sirāj ʿUmar's) grandfather as Muḥammad in [my] biography of our shaykh.
