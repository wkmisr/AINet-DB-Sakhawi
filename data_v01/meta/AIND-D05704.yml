translation:
  ja: アリー・ブン・ユースフ・アン＝ナワウィー。優れたシャーフィイー派の法学者。865年にアン＝ヌービーのイジャーザ（授権状）に証人として署名した。彼について、法学を教え、つつましく満足した暮らしを送りながら、公証人（シャハーダ）として生計を立て、ハッジ（巡礼）を行ったと私に届いている。
  en: ʿAlī b. Yūsuf al-Nawawī. A virtuous Shāfiʿī jurist. He witnessed the ijāza of al-Nūbī in the year 865 AH. I was informed that he teaches jurisprudence and earns his living as a notary (shahāda) while maintaining goodness, simplicity, and contentment, and he performed the pilgrimage (Hajj).
