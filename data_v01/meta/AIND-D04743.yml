notes:
- text: '転送見出し（原文「في همام لكونه بها أشهر」による）。転送先は #AIND-D10179（همام كذلك الرومي الحنفي والد الكمال بن الهمام واسمه عبد الواحد بن عبد الحميد بن مسعود … ولي قضاء إسكندرية ومات بها سنة إحدى）。本伝が本名 عبد الواحد بن عبد الحميد بن مسعود を明記しナサブ3代が完全一致。كمال الدين ابن الهمام の父。クンヤ・ラカブ索引の $$$ 見出し「همام الدين عبد الواحد بن عبد الحميد بن مسعود السيواسي والد الكمال ابن الهمام」（corpus L124459）とも整合。'
