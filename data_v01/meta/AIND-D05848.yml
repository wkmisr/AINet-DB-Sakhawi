translation:
  ja: ウマル・ブン・ダウラート・バーイ・アル＝ムアイヤディー。881年ズー・アル＝ヒッジャ月に没した。放埒で身を慎まず、多くの財産を蕩尽し、貧窮に陥りかけたところで急逝した。アッラーが彼を赦されんことを。
  en: ʿUmar b. Dawlāt Bāy al-Muʾayyadī. He died in Dhū al-Ḥijja of the year 881. He was prodigal with himself and made no effort at discretion; he squandered a great deal and was on the verge of impoverishment when death took him suddenly. May God pardon him.
