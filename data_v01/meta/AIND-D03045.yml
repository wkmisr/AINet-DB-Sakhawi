translation:
  ja: ズハイル・ブン・スライマーン・ブン・ヒバ・ブン・ジャンマーズ・ブン・マンスール・アル＝フサイニー。マディーナのアミール。前述のズバイリーの後を継いで865年の末にマディーナの支配者となり、873年サファル月に死去するまでその職に留まった。ただし、869年シャウワール月には、ドゥガィム・ブン・ハシュラム・アル＝フサイニー・アル＝マンスーリー（ズハイルの死後、正式に後継者となる人物）によって約4ヶ月間アミール職から離脱させられた。
  en: Zuhayr b. Sulaymān b. Hiba b. Jammāz b. Manṣūr al-Ḥusaynī, the Amīr of Medina. He assumed its governorship after the aforementioned Zubayrī at the end of the year 865 AH and continued in office until his death in Ṣafar 873 AH, except that he was temporarily deposed for about four months in Shawwāl 869 AH by Ḍughaym b. Khashram al-Ḥusaynī al-Manṣūrī, who permanently succeeded him after his death.
