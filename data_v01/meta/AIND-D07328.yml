translation:
  ja: ムハンマド・ブン・ハサブッラー・アル＝ハリーリー。ハーキム・モスクなどのムアッズィン（礼拝告知者）で、周知の「ヤー・ダーイム（永遠なる御方よ）」（をめぐる論争）においてアル＝ビカーイーに対する反対派の筆頭であった。果敢で大胆、極めて声の太い人物であった。おそらく880年以降に没した。
  en: Muḥammad b. Ḥasab Allāh al-Ḥarīrī, the muezzin at the Mosque of al-Ḥākim and elsewhere, and the head of those who disputed with al-Biqāʿī over the well-known "Yā Dāʾim" (affair). He was bold and daring, with a very broad voice. He died after 880, so it is thought.
