notes:
- text: '「وكان أميرا جليلا مفرط السمن بحيث عجز عن الركوب」＝人物評（極度の肥満で乗馬できなかった）。ドゥルガーディル家の corpus 立項: 子 شاه بضع（#AIND-D02020「فقرر عوضه أخوه شاه بضع」＝ID-Master TMP-P-000640、本項に言及なし）、姉妹 #AIND-D13646 نفيسة ابنة الامير ناصر الدين بك بن دلغادر（الظاهر جقمق の妻）、甥 #AIND-D02783 حمزة بك بن علي بك بن ناصر الدين بن دلغادر（840年没）、#AIND-D03423 طغرق من أولاد دلغادر。いずれも本項原文に言及がないため relation を立てない（規則23、父が TMP-P で共通）。'
  lang: ja
  type: editorial
translation:
  ja: スライマーン・ブン・ナースィル・アッ＝ディーン・ベク・ムハンマド・ブン・ドゥルガーディル、アル＝アブルスタイン（エルビスタン）のナーイブにしてトルクメンのアミール。（8）58年ラマダーン月に息子のマリク・アスラーンにニヤーバ（統治権）を託したのち、同地で没した。威厳あるアミールであったが、極度の肥満のため乗馬ができないほどであった。
  en: Sulaymān b. Nāṣir al-Dīn Bak Muḥammad b. Dulghādir, nāʾib of al-Ablastīn (Elbistan) and amīr of the Turkmen. He died there after having entrusted the governorship (niyāba) to his son Malik Aṣlān in Ramaḍān of the year [8]58. He was a dignified amīr, but so excessively obese that he was unable to ride.
