translation:
  ja: シャラフ・ブン・アブドゥルアズィーズ・ブン・カースィム・シャラフ・アッ＝ディーン・アル＝マダニー・アル＝マーリキー。マディーナにおけるファッラーシュ（預言者モスクの堂役・清掃係）の一人。後述のアブー・アル＝ファラジュ・ムハンマドの兄弟であり、彼らは共にイブン・カースィムの名で知られる。マディーナにて私（サハーウィー）から（ハディースを）聴聞した。
  en: Sharaf b. ʿAbd al-ʿAzīz b. Qāsim Sharaf al-Dīn al-Madanī al-Mālikī. One of the attendants (farrāshīn) in Medina, and the brother of Abū al-Faraj Muḥammad, who is mentioned below. Both of them are known as Ibn Qāsim. He heard (ḥadīth) from me (al-Sakhāwī) in Medina.
