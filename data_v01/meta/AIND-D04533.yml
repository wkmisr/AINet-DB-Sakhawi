translation:
  ja: アブドゥッラー・ブン・ウマル・アッ＝タウワーティー――二つのター（ت）の間に重いワーウ（重子音の و）がある――・アル＝マダニー。敬虔で善良な人物であり、禁欲（ズフド）と善行の跡が彼には見られた。（八百）七年にカイロで没した。イブン・ハティーブ・アン＝ナースィリーヤが彼に言及しており、また我らがシャイフ（イブン・ハジャル）も『インバー』の中で次のように述べている。「彼は善行と敬虔の人であり、マディーナに滞在して隣留（ムジャーワラ）し、エジプトとシャームを行き来していたが、その最期はカイロであった。」
  en: 'ʿAbd Allāh b. ʿUmar al-Tawwātī—with two tāʾs and a doubled wāw between them—al-Madanī. He was a righteous, good man, on whom the marks of asceticism and goodness were visible. He died in Cairo in the year [80]7. Ibn Khaṭīb al-Nāṣiriyya mentioned him, and our shaykh (Ibn Ḥajar) likewise said in his Inbāʾ: "He was one of the people of goodness and righteousness; he resided in Medina as a mujāwir, and used to travel back and forth to Egypt and Syria, and his death took place in Cairo."'
