translation:
  ja: アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ハルド・ブン・ムーサー・アル＝ヒムスィー・アル＝ハンバリー。後述される（父子ともに立項される）アブドゥッラフマーン・ブン・ムハンマド・ブン・ハルドの甥であり、イブン・ズフラとして知られる。彼は故郷でハンバリー派のカーディー職を務め、カイロに来て、その地のカーディーであったアル＝イッズ・アル＝キナーニーの代理（ナーイブ）を務めた。
  en: Aḥmad b. Muḥammad b. Muḥammad b. Khald b. Mūsā al-Ḥimṣī al-Ḥanbalī, nephew of ʿAbd al-Raḥmān b. Muḥammad b. Khald (who, together with his father, is mentioned later), known as Ibn Zahra. He held the judgeship (qaḍāʾ) of the Ḥanbalīs in his hometown, then came to Cairo, where he deputized for its judge, al-ʿIzz al-Kinānī.
