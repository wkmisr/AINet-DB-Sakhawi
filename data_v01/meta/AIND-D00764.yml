translation:
  ja: アハマド・ブン・スィナーン・ブン・ラージフ・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ウマル・ブン・マスウード・アル＝ウマリー・アル＝マッキー・アル＝カーイド。 847年ラジャブ月9日（土曜日）、ハッダにて没し、遺体はマッカへ運ばれた。遺体が到着したのは日曜日の夜中で、ムアッラーに埋葬された。
  en: Aḥmad b. Sinān b. Rājiḥ b. Muḥammad b. ʿAbd Allāh b. ʿUmar b. Masʿūd al-ʿUmarī al-Makkī al-Qāʾid. He died on Saturday, the 9th of Rajab, 847 H, in al-Hadda. His body was transported to Mecca, arriving on the last night of Sunday, and was subsequently buried at al-Muʿallā.
