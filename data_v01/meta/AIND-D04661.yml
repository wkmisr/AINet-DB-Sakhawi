translation:
  ja: アブドゥッラー・アル＝ジャマール・アッ＝トゥルクマーニー・アル＝ハナフィー。シャーム副王カジュマースのイマーム。ラディー・アッ＝ディーン・ブン・マンスールの後任として、ハラブの機密書記職（キターバト・アッ＝スィッル）と、同地の軍務・城塞・施療院の監督職を務めた。
  en: ʿAbd Allāh al-Jamāl al-Turkumānī al-Ḥanafī, imam of Qajmās, the viceroy of Syria. He held the office of confidential secretary (kitābat al-sirr) of Aleppo and the supervision of its army, its citadel and its hospital, after Raḍī al-Dīn b. Manṣūr.
