translation:
  ja: アブドゥッラー・ブン・ムハンマド・アッ＝サーアーティー、ウマイヤ・モスクのムアッズィン。その技芸における第一人者の地位は彼に帰した。801年ズー・アル＝ヒッジャ月に80歳近くで没した。我らの師（イブン・ハジャル）が『インバー』で彼に言及している。
  en: ʿAbd Allāh b. Muḥammad al-Sāʿātī, the muezzin at the Umayyad Mosque. Leadership in his craft came to rest with him. He died in Dhū al-Ḥijja of the year 801, having nearly reached eighty. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
