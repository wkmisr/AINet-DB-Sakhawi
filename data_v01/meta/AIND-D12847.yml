translation:
  ja: アースィヤ・ビント・アブドゥルマリク・ブン・アブドゥッラティーフ・ブン・アル＝ジーアーン。アブドゥッラティーフとムハンマドの姉妹。（8）35年サファル月に生まれ、書くことを習い、ガザーリーの『アキーダ』を読んだ。アブドゥルバースィト・ブン・カーティブ・アクバーイと結婚し、彼は彼女との間にアミーン・アブー・サイード・ムハンマドとアズダーンをもうけた。アズダーンは、ハージブのジャクマクの子で、ハナフィー派の、学問に携わる者の一人であるユーヌスの妻である。アースィヤは幾度も巡礼した。
  en: Āsiya, daughter of ʿAbd al-Malik b. ʿAbd al-Laṭīf Ibn al-Jīʿān, sister of ʿAbd al-Laṭīf and Muḥammad. She was born in Ṣafar of the year [8]35, learned to write, and read al-Ghazālī's creed (ʿAqīda). She married ʿAbd al-Bāsiṭ b. Kātib Aqbāy, who had by her al-Amīn Abū Saʿīd Muḥammad and Azdān, the wife of Yūnus, son of Jaqmaq the chamberlain (ḥājib), a Ḥanafī and one of those engaged in study. Āsiya made the pilgrimage more than once.
