translation:
  ja: ムハンマド・ブン・ジャッサール・ブン・アリー・アル＝フマイディー。837年ラジャブ月、東方の地（ビラード・アッ＝シャルク）でサイイド・ルマイサ・ブン・ムハンマド・ブン・アジュラーンと共に殺害され、その地に葬られた。イブン・ファハドが彼の没年を記録している。
  en: Muḥammad b. Jassār b. ʿAlī al-Ḥumayḍī. He was killed together with al-Sayyid Rumaytha b. Muḥammad b. ʿAjlān in Bilād al-Sharq in Rajab 837 and was buried there. Ibn Fahd recorded his death date.
