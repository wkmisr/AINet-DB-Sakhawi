translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アフマド、アッ＝シャムス・ブン・アッ＝タキー・ブン・アッ＝シハーブ、サイード（上エジプト）出身の家系で、エルサレムの人、ハナフィー派。前述のアル＝バドル・ハサンの兄弟。イブン・アッ＝スーダーニー、およびイブン・アル＝バキーラとして知られ、後者は彼の父のラカブである。769年に生まれ、叔父のアッ＝シハーブ、アッ＝シュライヒー、ハイル・アッ＝ディーンら一群の人々から学び、法学に秀でるとともに、善良・廉潔・敬虔・衒いのなさ・優れた探究を備えていた。839年ラマダーン月に没した。
  en: Muḥammad b. Abī Bakr b. Aḥmad, al-Shams b. al-Taqī b. al-Shihāb, of Upper Egyptian origin, al-Maqdisī, the Ḥanafī, brother of al-Badr Ḥasan, mentioned above. He was known as Ibn al-Sūdānī and as Ibn al-Buqayra, the latter being his father's laqab. He was born in the year 769 and studied under his paternal uncle al-Shihāb, al-Shurayḥī and Khayr al-Dīn, among a group of others. He excelled in jurisprudence together with goodness, abstinence, piety, absence of affectation and excellence in inquiry. He died in Ramaḍān 839.
