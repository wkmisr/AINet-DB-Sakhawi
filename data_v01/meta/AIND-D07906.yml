- text: '見出しナサブ「… بن صدر الدين أبو عبد الوارث بن عبد الوارث」は父名 عبد الوارث を重ねて記す原文どおり（規則25）。ニスバ索引 #AIND-D12518「ابن عبد الوارث النجم عبد الرحمن وابنه المحيوي عبد القادر وابنه البدر محمد مالكيون وآخر عمل قاضي المحمل سنة اثنتين وتسعين وهو محمد بن عبد الوارث بن محمد بن محمد بن محمد وأظنه شافعيا」が本項主に触れ、「أظنه شافعيا」（シャーフィイー派と思う）とするが、複数人の合同索引（規則11）かつ他項にのみある推定情報のため affiliation は立てず note に留める（規則23）。本項主は البكري المالكي の ابن عبد الوارث 家とは別人として索引で区別されている。'
