translation:
  ja: フブク（第一字の（点のない）ハーと第二字の（点一つの）バーはいずれもダンマで発音し、語末はカーフ）。ナースィル・ファラジュの時代に、エジプトでラアス・ナウバであり、またタブルハーナ級（アミール）の一人であった。803年ズー・アル＝カアダ月の初めに死去し、彼の50騎級のイクターはナースィルのマムルークたちへ移された。彼は無知で腐敗した者たちの一人であった。アル＝アイニーがそう述べている。
  en: Ḥubuk (with ḍamma on both the undotted [ḥāʾ] and the single-dotted [bāʾ], ending in kāf). He was a raʾs nawba and one of the ṭablkhāna [amirs] in Egypt in the days of al-Nāṣir Faraj. He died at the beginning of Dhū al-Qaʿda of the year 803 AH, and his iqṭāʿ of the fifty [grade] passed out to mamluks of al-Nāṣir. He was one of the ignorant and corrupt; so said al-ʿAynī.
