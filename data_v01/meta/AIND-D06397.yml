translation:
  ja: クズル、バフナサーの副官。アル＝ムアイヤドの時代にアミールとなった者の一人で、次いで825年にアレッポ副官タグリー・ビルディー・アル＝ムウズィーとともに反乱を起こした。その戦闘で殺されたと思われる。
  en: Kuzul, governor (nāʾib) of al-Bahnasā. He was among those who became amirs in the days of al-Muʾayyad; then he rebelled together with Taghrī Birdī al-Muʾdhī, the governor of Aleppo, in the year 825, and it is thought that he was killed in that engagement.
