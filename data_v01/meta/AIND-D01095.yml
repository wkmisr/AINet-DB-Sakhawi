translation:
  ja: アフマド・ブン・アリー・アル＝ミスリー。後述する盲人ムハンマドの兄弟で、先祖と同様にイブン・アビー・アッ＝ラッダードとして知られ、ナイルの計測官（アミーン・アン＝ナイル）の一人であった。887年シャウワール月28日火曜日に没し、一族の墓に父の傍らで埋葬された。
  en: Aḥmad b. ʿAlī al-Miṣrī, brother of the blind Muḥammad (mentioned below), known like his forebears as Ibn Abī al-Raddād, was one of the overseers (umanāʾ) of the Nile. He died on Tuesday, the 28th of Shawwāl in the year 887 H, and was buried in the family tomb beside his father.
