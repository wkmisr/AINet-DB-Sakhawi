notes:
- text: '転送見出し（原文「مضى فيمن جده محمد بن عبد الله بن إبراهيم بن محمد」による）。転送先は #AIND-D06548「محمد بن إبراهيم بن محمد بن عبد الله بن إبراهيم بن محمد الأرموي ثم الصالحي . سمع من فاطمة ابنة العز وغيرها وحدث سمع منه شيخنا وآخرون . ومات بدمشق سنة أربع」（同チャンク B170 の実項。祖父以上のナサブ「محمد بن عبد الله بن إبراهيم بن محمد」とニスバ「الأرموي ثم الصالحي」が一致）。'
