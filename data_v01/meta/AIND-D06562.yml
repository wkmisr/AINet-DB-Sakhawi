translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・アル＝ウルマウィー、のちアッ＝サーリヒー。祖父がムハンマド・ブン・アブドゥッラー・ブン・イブラーヒーム・ブン・ムハンマドである者の（項の）ところで既出。
  en: Muḥammad b. Ibrāhīm b. Muḥammad Ibn al-Urmawī, then al-Ṣāliḥī. He has been mentioned above among those whose grandfather is Muḥammad b. ʿAbd Allāh b. Ibrāhīm b. Muḥammad.
