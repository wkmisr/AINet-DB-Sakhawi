translation:
  ja: アブドゥル・ラフマーン・ブン・イブラーヒーム・ブン・アフマド・ブン・アブドゥル・ラティーフ・ブン・ナ نجم・ブン・アブドゥル・ムアティー・アル＝ビルマーウィー、のちにアル＝カーヒリー。のちに言及されるアル＝ファフル・ウースマーンおよびアブドゥル・ガニーの兄弟である。アッ＝タヌーヒーらに聴聞した。アル＝ビカーイーは彼を自身の師匠たちの中に（詳細を省いて）名前だけ挙げている。
  en: ʿAbd al-Raḥmān b. Ibrāhīm b. Aḥmad b. ʿAbd al-Laṭīf b. Najm b. ʿAbd al-Muʿṭī al-Birmāwī, then al-Qāhirī. Brother of al-Fakhr ʿUthmān and ʿAbd al-Ghanī, who are mentioned below. He heard from al-Tanūkhī and others. Al-Biqāʿī mentioned him simply in his list of shaykhs.
