translation:
  ja: アリー・ブン・ウマル・ブン・ムハンマド、最も高貴で敬虔な法学者シャムス・アッ＝ディーン・アル＝アフダル。アブド・アル＝マジードの兄弟。二人は父と同様に敬虔な人々のうちにあり、スィハムのアル＝マラーウィガにおける最も優れた者であった。アル＝アフィーフが彼に言及している。
  en: ʿAlī b. ʿUmar b. Muḥammad, the most eminent and righteous jurist Shams al-Dīn al-Ahdal, the brother of ʿAbd al-Majīd. The two of them, like their father, were among the righteous, the best to be found in al-Marāwigha of Sihm. Al-ʿAfīf mentioned him.
