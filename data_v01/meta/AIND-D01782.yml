translation:
  ja: アフマド・アブー・アル＝アッバース・ブン・アル＝アジャル、ファースのカーディー。57年（857年）に亡くなった。イブン・アズムがその死を年代記に記し、別の機会には52年（852年）と述べており、どちらかが誤りである。それどころか、彼がカーディーであったことを否定する者さえ私は見た。彼はファースのアル＝アンダルス・モスクの近くにあるアル＝サフリージュ・マドラサで教師（ムダッリス）を務め、法学・アラビア語学その他の諸学に通じた学者であった。
  en: Aḥmad Abū al-ʿAbbās b. al-ʿAjl, qāḍī of Fās. He died in the year 857 H. Ibn ʿAzm dated his death, and on another occasion gave 852 H, one of which is in error. Indeed, I have even seen some who deny that he was a qāḍī. He was a teacher (mudarris) at Madrasat al-Ṣihrīj in Fās, near Jāmiʿ al-Andalus, and a scholar knowledgeable in jurisprudence, Arabic, and other sciences.
