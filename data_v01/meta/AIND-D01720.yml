translation:
  ja: アフマド・ブン・ユースフ、シハーブ・アル=ハウラーニー・アッ=ディマシュキー、公正な証人（アル=アドル）、ラディー、法学者（アル=ファキーフ）。846年ジュマーダー・アル=ウーラー月10日土曜日にダマスクスで死去し、バーブ・アル=ファラーディース墓地に埋葬された。彼の葬儀は盛大であった。
  en: Aḥmad b. Yūsuf al-Shihāb al-Ḥawrānī al-Dimashqī, al-ʿAdl al-Raḍī al-Faqīh. He died on Saturday, the 10th of Jumādā al-Ūlā, in the year 846 AH, in Damascus. He was buried in the Bāb al-Farādīs cemetery, and his funeral was well-attended.
