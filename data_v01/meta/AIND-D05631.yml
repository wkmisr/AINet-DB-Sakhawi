translation:
  ja: アリー・ブン・ムハンマド・アッ＝シャーズィリー。私は彼が、マーリキー派の書物の要約に対するアル＝バハーウ・ブン・アル＝アブシーヒーの注釈書に、自作の詩を書き込んでいるのを見た。 『何と素晴らしいことか、学者よ、あなたは私たちのために、宝石の首飾りをルビーや真珠と混ぜ合わせてくれた。 そして真珠が豊かな海に潜り、そこから数え切れないほど多くの貴重なものを拾い集めてくれた。 その意味は、要約書の見事な編集と推敲によって、明瞭に明らかとなった。 私の主が、あなた、バハーウ・アッディーンに、（来世と現世の）二世において高い地位を人々の群れの中で授けてくださいますように。 そして、おお主よ、この詩の作者に、これまでの生涯の罪を消し去るようなお許しを与えてくださいますように。』
  en: 'ʿAlī b. Muḥammad al-Shādhilī. I saw him writing some of his poetry on the commentary of al-Bahāʾ b. al-Abshīhī, which is an epitome of Maliki books: ''May God reward you, O scholar, you have mixed for us a necklace of gems with rubies and pearls, And dived into a sea rich in pearls, collecting precious things from it that cannot be numbered. Its meanings became clear through exposition, with excellent drafting and refinement of an epitome. May my Lord grant you, Bahāʾ al-Dīn, ascending to the highest stations in both abodes among the groups. And forgive, O Lord, its composer with a forgiveness that erases past sins of his whole life.'''
