translation:
  ja: アフマド・ブン・ムハンマド・ブン・イスマーイール・アル＝マジディー。「ヤヌース」という綽名で呼ばれたが、これは髪の毛の赤みが非常に強かったためである。ハナフィー派のワクフ管理官を務め、よく職務を遂行した。（末尾が1の）ある年のラビーウ・アル＝アウワル月に死去した。我らがシャイフ（イブン・ハジャル）が著書『インバー・アル＝グムル』でそう述べている。（末尾1の年は801年と読む。）
  en: Aḥmad b. Muḥammad b. Ismāʿīl al-Majdī, nicknamed Yanūṣ due to the intense reddishness of his hair. He diligently managed the endowments of the Hanafi school. He died in Rabīʿ al-Awwal of a year ending in one (read as 801 H). Our shaykh (Ibn Ḥajar) stated this in his book 『Inbāʾ al-Ghumr』.
