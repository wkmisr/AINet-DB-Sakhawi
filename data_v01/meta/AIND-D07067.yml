translation:
  ja: ムハンマド・ブン・アッ＝シハーブ・アフマド・アル＝バンハーウィー、商人。841年ズー・アル＝カアダ月に没した。我らのシャイフ（イブン・ハジャル）がその没年を記し、次のように述べている。彼（本項主）の管理人（アル＝ムタハッディス・アライヒ）がその父の遺産を押さえた。それはおそらく2万ディナールを超えていた。すると2人の者が現れ、自分たちは彼の父方の叔父の息子で男系親族（アサバ）であると主張したので、管理人は彼らと和解し、同様にナーズィル・アル＝ハーッス（特別財務監督官）とも和解したが、その合計は遺産の3分の1にも満たなかった。彼（イブン・ハジャル）は言う、このことを知らせたのは、（遺産の）呈示と売却を実際に取り扱い記録した者であった。それにもかかわらず管理人はこれに取り合わず否認の途をとり、自分が支払った額こそが自分の押さえた額であって、それ以上はないと（主張した）。
  en: 'Muḥammad b. al-Shihāb Aḥmad al-Banhāwī, the merchant. He died in Dhū al-Qaʿda of the year 841. Our shaykh (Ibn Ḥajar) recorded his death date and said that the administrator in charge of him (al-mutaḥaddith ʿalayhi) took possession of his father''s estate, which was perhaps more than twenty thousand dinars. Then two men came forward claiming to be the sons of his paternal uncle, agnate heirs (ʿaṣaba), so he settled with them, and likewise with the nāẓir al-khāṣṣ, for a total that did not amount to a third of the estate. He (Ibn Ḥajar) said: the one who reported this was the person who had handled the presentation and the sale and recorded it; nevertheless the administrator paid no heed to this and took the path of denial, (maintaining) that what he had paid out was exactly what he had taken possession of, without any surplus.'
