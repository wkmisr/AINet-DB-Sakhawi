translation:
  ja: アブド・アル＝カリーム・ブン・アビー・サアド・ブン・ムハンマド・ブン・アーミル・アル＝ハサニー。アル＝ムジャーシュとして知られる、ザウー・アリー（アリー家のシャリーフ）の一員。843年ズー・アル＝ヒッジャ月にマッカで没した。イブン・ファフドがその没年を記録している。
  en: ʿAbd al-Karīm b. Abī Saʿd b. Muḥammad b. ʿĀmir al-Ḥasanī, of the Dhawū ʿAlī, known as al-Mujāsh. He died in Mecca in Dhū al-Ḥijja of the year 843. Ibn Fahd recorded his death.
