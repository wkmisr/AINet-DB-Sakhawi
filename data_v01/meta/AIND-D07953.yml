translation:
  ja: ムハンマド・ブン・ウスマーン・ブン・ムハンマド・ブン・イスハーク・ブン・イブラーヒーム、アル＝バドル・ブン・アル＝ファフル・ブン・アッ＝タージュ、アッ＝スラミー、アル＝ムナーウィー、のちアル＝カーヒリー、アッ＝シャーフィイー。前述のアル＝バハー・アフマドの兄弟。父の死後、その教授職に兄弟と共同で就いた。彼の自筆で、父の従兄弟アッ＝サドル・アル＝ムナーウィーから伝承していると書かれているのを私は見た。明らかにこの世紀の人である。その後、803年に彼に（暗記書を）提示した者がいるのを私は見た。
  en: Muḥammad b. ʿUthmān b. Muḥammad b. Isḥāq b. Ibrāhīm, al-Badr b. al-Fakhr b. al-Tāj, al-Sulamī, al-Munāwī, then al-Qāhirī, al-Shāfiʿī, brother of the aforementioned al-Bahāʾ Aḥmad. After their father's death he was installed as his brother's partner in his teaching posts. I saw in his own hand that he transmits from his father's cousin al-Ṣadr al-Munāwī. He apparently belongs to this century; then I saw someone who presented to him in the year 803.
