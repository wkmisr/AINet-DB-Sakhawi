translation:
  ja: アハマド・ブン・アブドゥッラー・アル＝ブーシーリー。 801年*に亡くなった。 イブン・アズムが彼について言及している。彼の祖父の名前がハサンであるかどうかは検討されるべきであるが、そうではないようである。 *「 سنة إحدى 」(イフダーの年) の記載のみで、801年以降、各世紀の「01年」に当たる複数の選択肢が存在する。ここでは、本稿の対象年代である9世紀（ヒジュラ暦）前半と見なして801年と判断した。
  en: Aḥmad b. ʿAbd Allāh al-Būṣīrī. He died in the year 'iḥdā' (one). Ibn ʿAzm mentioned him. It should be investigated if his grandfather's name was Ḥasan, but it appears otherwise. *The text only states "the year 'iḥdā' (one)", which could refer to the first year of any century (e.g., 801 AH, 901 AH). Here, it is interpreted as 801 AH, consistent with the early 9th century AH, the period covered by this biography.
