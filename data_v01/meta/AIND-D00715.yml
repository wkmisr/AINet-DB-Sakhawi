translation:
  ja: アハマド・ブン・ハリル・ブン・タバフ・アル＝ジャウダリー、ムアッディブ、マッカの定住者。私（＝サハーウィー）にマッカでハディースを聴聞し、クルアーンの暗唱に優れ、墓所などでクルアーンを朗誦した。896年にマッカで亡くなった。
  en: Aḥmad b. Khalīl b. Ṭabakh al-Jawdarī, al-Muʾaddib, a resident of Mecca, was among those who heard (ḥadīth) from me (al-Sakhāwī) there. He excelled in memorizing the Qurʾān and used to recite it over graves and elsewhere. He died there in the year 896 AH.
