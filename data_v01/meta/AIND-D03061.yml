translation:
  ja: サーリム・ブン・アブドゥルワッハーブ・アル＝マジュド・ブン・アッ＝タージュ・アッ＝ディマシュキー・アル＝カーヒリー。タンタダーのアフマディー廟のハリーファ（後継者）。父の生存中にその職に就き、その後、父がその職に就いた。父が亡くなると、マジュド（サーリム）に再びその職が戻された。彼が父に毒を盛ったという噂を聞いた。彼はアッ＝シャムス・ブン・アッ＝ザマーンの姉妹の娘と婚姻関係を結び、彼女との間にアシールという名の娘をもうけた。彼女ら二人を残して、880年頃に亡くなり、シャイフ職の後継者を残した。
  en: Sālim ibn ʿAbd al-Wahhāb al-Majd ibn al-Tāj al-Dimashqī al-Qāhirī, the successor (khalīfa) of the Aḥmadī shrine in Ṭantadā (Tanta). He held the office during his father's lifetime, then his father held it, and when his father died, the office was restored to him. It was rumored that he poisoned his father. He became related by marriage to al-Shams ibn al-Zaman by marrying his niece, with whom he had a daughter named Aṣīl. He died leaving them around the year 880 AH, and was succeeded in the mashyakha.
