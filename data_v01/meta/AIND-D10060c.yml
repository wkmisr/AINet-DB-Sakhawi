translation:
  ja: ムーサー・ブン・ラジャブ・ブン・ラーシド・ブン・ナースィル・ッディーン・ムハンマド、シャラフ〔・ッディーン〕・アル＝キナーニー・アル＝ジャルジューリー・アル＝マクディスィー、シャーフィイー派。〔8〕21年または22年にジャルジューリヤーに生まれ、そこで育ってシャムス・アル＝カルカブリーのもとでクルアーンと『タンビーフ』の一部を読み、イッズ・アブド・アッ＝サラーム・アル＝クドスィーらの講義に出席した。イブン・アッ＝サーイフの代理としてエルサレムでカーディー職を務め、ムヒッブ・イブン・アッ＝シフナがそこに滞在していた際に彼に師事した。幾度もカイロに往来し、あるときその帰路に我々は彼と同行した。彼は快活で交際が穏やかだが戯れと放埓が勝ち、文学と詩作を好む人物と見えた。私はカティヤーの「イブン・アビー・ル＝ファラジュ」として知られる場所で彼から詩を書き留め、『ムウジャム』に収めた。その中にアラム・ッディーンという名の美少年への詩がある（2行）。およそ880年に没した。神が彼を憐れみ赦したまえ。
  en: Mūsā b. Rajab b. Rāshid b. Nāṣir al-Dīn Muḥammad, al-Sharaf al-Kinānī al-Jaljūlī al-Maqdisī al-Shāfiʿī. Born in [8]21 or 822 at Jaljūliyā, he read the Qurʾān and part of al-Tanbīh with al-Shams al-Qalqablī, attended the lessons of al-ʿIzz ʿAbd al-Salām al-Qudsī and others, deputised as judge in Jerusalem for Ibn al-Sāʾiḥ, and attached himself to al-Muḥibb Ibn al-Shiḥna during his stay there. He went to Cairo several times; on one return journey we travelled with him, and I found him light-spirited and pleasant company, though given to jesting and licence, fond of literature and verse. I wrote down from him, at the place known as Ibn Abī al-Faraj near Qaṭyā, pieces which I included in the Muʿjam, including lines on a handsome youth named ʿAlam al-Dīn. He died about 880.
