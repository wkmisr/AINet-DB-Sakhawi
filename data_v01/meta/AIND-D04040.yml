translation:
  ja: アブドゥルガッファール・ブン・アブドゥッラヒーム・ブン・アッ＝ザキー・アビー・バクル・ブン・ウマル・ブン・ユースフ、アッ＝タージュ・アブー・アル＝ハイル、マイドゥーム出自でミスル（フスタート）の人。前述のアッ＝シハーブ・アフマドの甥。ミスルでカーディー代理を務め、そこでアル＝アスユーティーの、次いでザカリヤーの裁判財産管理官（アミーン・アル＝フクム）を務めた。
  en: ʿAbd al-Ghaffār b. ʿAbd al-Raḥīm b. al-Zakī Abī Bakr b. ʿUmar b. Yūsuf, al-Tāj Abū al-Khayr, of Maydūm origin, al-Miṣrī, nephew of the aforementioned al-Shihāb Aḥmad. He served as deputy judge in Miṣr and worked there as amīn al-ḥukm for al-Asyūṭī and then for Zakariyyā.
