translation:
  ja: ハムザ・ブン・カースィム・ブン・アフマド・ブン・アブドゥルカリーム・ブン・ムハイト・ブン・ラージハ・ブン・アビー・ヌマイ・アル＝ハサニー・アル＝マッキー。アル＝クルディー（クルド人）として知られる。846年サファル月（1442年6月〜7月）にワーディー・マッルで没し、マッカに運ばれて同地に埋葬された。イブン・ファハドが彼の没年を記録している。
  en: Ḥamza b. Qāsim b. Aḥmad b. ʿAbd al-Karīm b. Mukhayṭ b. Rājiḥ b. Abī Numayy al-Ḥasanī al-Makkī, known as al-Kurdī. He died in the month of Ṣafar, in the year 846 AH [June/July 1442 CE], in Wādī Marr, and was carried to Mecca where he was buried. His death was chronicled by Ibn Fahd.
