translation:
  ja: ムハンマド・ブン・アッ＝タージュ・アル＝ヒンディー・アル＝マフムーダーバーディー・アル＝ハナフィー。ラージフのような優秀な者たちに天文学（ハイア）と神学（カラーム）を教授した者の一人。（8）94年に（ある者が）私に、彼は存命で40歳ほどであると語った。
  en: Muḥammad b. al-Tāj al-Hindī al-Maḥmūdābādī al-Ḥanafī. One of those who taught astronomy (hayʾa) and theology (kalām) to accomplished scholars such as Rājiḥ. In the year (8)94 I was told that he was alive and about forty years old.
