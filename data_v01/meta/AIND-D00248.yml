  ja: イブラーヒーム・ブン・アッ＝ラディー・ムハンマド・ブン・アッ＝シハーブ・アフマド・ブン・アブドゥッラー・ブン・バドル・アル＝ガッズィー・アッ＝ディマシュキー。その父、祖父、そして兄弟のラディー・アッ＝ディーン・ムハンマドについては後述する。彼は父の所領地で兄弟のパートナーとして定住し、その兄弟は年下であったが、彼には美徳があり、時折精神的な錯乱状態に陥ることがあった。彼は〜で亡くなった。
  en: Ibrāhīm b. al-Raḍī Muḥammad b. al-Shihāb Aḥmad b. ʿAbd Allāh b. Badr al-Ghazī al-Dimashqī. His father, grandfather, and brother Radī al-Dīn Muḥammad will be mentioned later. He settled in his father's areas, working in partnership with his brother (who was younger). He possessed virtue, but was sometimes afflicted by a state of madness. He died in [incomplete sentence].
