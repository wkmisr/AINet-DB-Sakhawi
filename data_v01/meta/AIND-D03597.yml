translation:
  ja: アブドゥッラフマーン・ブン・アビー・アル＝バラカート・ブン・アビー・アル＝フダー・ムハンマド・ブン・タキー・アッ＝ディーン、高潔で敬虔なシャイフ、ザイン・アル＝カーザルーニー・アル＝マダニー・アッ＝シャーフィイー。後述のアブドゥッラー・ブン・アブド・アル＝ワッハーブ・ブン・アビー・アル＝バラカートの叔父。マディーナにて私（サハーウィー）から『（ヌフバ・アル＝フィカルの）註釈（シャルフ・アル＝ヌフバ）』を読み、また様々なものを聴聞した。さらにアル＝アブシーティーらからも学術を修得した。彼は物静かで善良な人物であり、一定の徳を有していた。ヒジュラ暦891年に没した。
  en: ʿAbd al-Raḥmān b. Abī al-Barakāt b. Abī al-Hudā Muḥammad b. Taqī al-Dīn, the pious and righteous shaykh, Zayn al-Kāzarūnī al-Madanī al-Shāfiʿī. He was the paternal uncle of ʿAbd Allāh b. ʿAbd al-Wahhāb b. Abī al-Barakāt, who is mentioned later. He studied under me (al-Sakhāwī) in Medina, reading the commentary on al-Nukhba (Sharḥ al-Nukhba) and hearing other works. He also acquired knowledge from al-Abshīṭī and others. He possessed virtue, tranquility, and goodness. He died in the year 891 AH.
