translation:
  ja: ムーサー・ブン・イムラーン・ブン・ムーサー、アッ＝シャラフ、アル＝ブースィーリー、のちアル＝カーヒリー、アッ＝シャーフィイー。前述の、アル＝アルジーヒーヤ学院の管理官（ムバーシル）ナースィル・アッ＝ディーン・ムハンマド・ブン・アフマド・ブン・イムラーンの叔父。856年に没した。
  en: Mūsā b. ʿImrān b. Mūsā, al-Sharaf al-Būṣīrī, then al-Qāhirī, al-Shāfiʿī, paternal uncle of the aforementioned Nāṣir al-Dīn Muḥammad b. Aḥmad b. ʿImrān, the administrator (mubāshir) of al-Madrasa al-Aljīhiyya. He died in the year 856.
