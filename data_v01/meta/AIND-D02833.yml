translation:
  ja: フシュカルディー・アル＝バイサキー。十人長（アミール・アシャラ）に叙せられ、その地位のままアッ＝ザーヒル・フシュカダムの治世にヒスバ（市場監督）職を務めた。ついでその治世の末期にナーナク・アル＝ムハンマディーの後任としてシャード・アッ＝シャラブハーナ（御酒膳房監督官）となり、ついでラアス・ナウバ・アン＝ヌワブ（筆頭ラアス・ナウバ）となった。
  en: Khushkaldī al-Baysaqī. He was made an amīr of ten and, while holding that rank, administered the ḥisba (market inspectorship) in the days of al-Ẓāhir Khushqadam; then, at the end of his reign, he served as shādd al-sharābkhānāh (supervisor of the royal buttery) in place of Nānaq al-Muḥammadī, and then as raʾs nawbat al-nuwab (chief raʾs nawba).
