translation:
  ja: ムハンマド・ブン・アブー・バクル・ブン・ムハンマド・ブン・イブラーヒーム・ブン・ジャアマーン・アル＝ヤマーニー・アッ＝シャーフィイー。自らの町であるファキーフ・アフマド・ブン・ムーサー・ブン・ウジャイル村で、二人の母方の叔父、ファキーフ・ラディー・アッ＝ディーン・アッ＝スィッディーク・ブン・イブラーヒーム・ブン・ジャアマーンとアッ＝シャラフ・アブー・アル＝カースィムに法学を学んだ。教授し講義して益を与え、相続法と代数（ジャブルとムカーバラ）に秀で、博学の法学者であった。856年ラマダーン月に没した。アル＝カマール・ムーサー・アッ＝ダワーリー——彼は本項主から学んだ者の一人である——は、その没年月を同年シャウワール月の中旬と記し、自著『イエメンの義人たち』で彼の伝記を長く記している。
  en: Muḥammad b. Abī Bakr b. Muḥammad b. Ibrāhīm b. Jaʿmān al-Yamānī al-Shāfiʿī. He studied jurisprudence in his home town, the village of al-Faqīh Aḥmad b. Mūsā b. ʿUjayl, under his two maternal uncles, the jurist Raḍī al-Dīn al-Ṣiddīq b. Ibrāhīm b. Jaʿmān and al-Sharaf Abū al-Qāsim. He taught and gave instruction, excelled in inheritance law and algebra (al-jabr wa-l-muqābala), and was a learned jurist. He died in Ramaḍān of the year 856; al-Kamāl Mūsā al-Dawālī, who was among those who studied under him, dated it to the middle of Shawwāl of that year, and gave him a long biography in his own Ṣulaḥāʾ al-Yaman.
