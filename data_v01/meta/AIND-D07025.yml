translation:
  ja: ムハンマド・ブン・アフマド・ブン・アッ＝シャイフ・アル＝バハー・アル＝アンサーリー・アル＝アフミーミー。アッ＝タキー・ブン・ファハドがその『ムウジャム』で、このように〔名のみを〕裸で挙げている。彼は現在のハナフィー派カーディー、ナースィル・アッ＝ディーン・ムハンマド・ブン・アフマドの祖父であり、したがって彼〔本項主〕の祖父はムハンマド・ブン・ムハンマド・ブン・アブド・アル＝ワッハーブ・ブン・アル＝バハーである。
  en: Muḥammad b. Aḥmad b. al-Shaykh al-Bahāʾ al-Anṣārī al-Akhmīmī. Al-Taqī b. Fahd mentioned him in his Muʿjam thus, bare [of any detail]. He is the grandfather of the present Ḥanafī qāḍī Nāṣir al-Dīn Muḥammad b. Aḥmad, and accordingly his [own] grandfather is Muḥammad b. Muḥammad b. ʿAbd al-Wahhāb b. al-Bahāʾ.
