translation:
  ja: サイード。ブーラークに住む、人々に崇敬された者（ムウタカド）の一人。860年ラビーウ・アル＝アーヒル月に没し、アッ＝タリーク・アル＝ジャディーダの庭園のひとつに埋葬された。アル＝ムニールがそう述べている。
  en: Saʿīd, one of the revered men residing in Būlāq. He died in Rabīʿ al-Ākhir of the year 860 and was buried in one of the gardens of al-Ṭarīq al-Jadīda. So said al-Munīr.
