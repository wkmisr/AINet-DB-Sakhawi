translation:
  ja: アフマド・ブン・アッ＝ザーヒル・アビー・サイード・ジャクマク。彼の母はルームの支配者ウスマーンの娘、ハウンドシャー・ザーダである。彼は853年サファル月新月の水曜日にペストで7歳で亡くなった。
  en: Aḥmad b. al-Ẓāhir Abī Saʿīd Jaqmaq. His mother was Khawandshāh Zāda, daughter of ʿUthmān, ruler of Rūm. He died of the plague on Wednesday, the first of Ṣafar, in the year 853 AH, at the age of seven.
