translation:
  ja: イブラーヒーム・ブン・アハマド・ブン・アリー・ブン・ハラフ・ブン・アブドゥルアズィーズ・ブン・バドゥラーン、ブルハーン・アッ＝ディーン。イスハーク・ブン・ムハンマド・アル＝ブルハーン・アル＝ハリーリー・アッ＝ダーリミーの子孫で、「イブン・アル＝ムフタシブ」として知られる。兄のシャムス・ムハンマドの後を継いで、自身の町のカーディー職に就いた。義理の息子アブー・バクル・アミーン・ハラムの理由でカイロに訪れた。893年以降も生存していた。
  en: Ibrāhīm b. Aḥmad b. ʿAlī b. Khalaf b. ʿAbd al-ʿAzīz b. Badrān, Burhān al-Dīn, known as Ibn al-Muḥtasib, of the lineage of Isḥāq b. Muḥammad al-Burhān al-Khalīlī al-Dārimī. He succeeded his brother al-Shams Muḥammad in the judgeship of his town. He came to Cairo because of his son-in-law Abū Bakr Amīn Ḥaram. He was alive after 893 AH.
