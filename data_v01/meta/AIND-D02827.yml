translation:
  ja: フシュカダム・アッ＝ザイニー（アッ＝ザイン・）ヤフヤー・アル＝ウスターダール（の配下）、カーシフ（地方監督官）の一人。879年ズー・アル＝ヒッジャ月、彼のために幾度も取りなしがあったにもかかわらず、明白な理由もなく腰斬の刑に処された。
  en: Khushqadam al-Zaynī (mamlūk of al-Zayn) Yaḥyā al-Ustādār, one of the kāshifs. He was executed by being cut in half (wussiṭa) in Dhū al-Ḥijja of the year 879, despite repeated intercession on his behalf and without any apparent cause.
