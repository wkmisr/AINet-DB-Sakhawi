translation:
  ja: ムハンマド・ブン・アブドゥルムンイム・ブン・ダーウード・ブン・スライマーン、アル＝バドル・アブー・アブドゥッラー・ブン・アッ＝シャラフ・アビー・アル＝マカーリム、バグダード出自、カイロ在住、ハンバル派。その父は既述、その息子アル＝バドル・ムハンマドは後述。彼はアル＝ハサニーヤ、ウンム・アッ＝スルターン、アッ＝サーリフ（学院）などの教授職、ならびにダール・アル＝アドルでのファトワー職と軍カーディー職において父の後を継いだが、その在職期間は長くなかった。そして彼は没した（年不明）。
  en: Muḥammad b. ʿAbd al-Munʿim b. Dāwūd b. Sulaymān, al-Badr Abū ʿAbd Allāh b. al-Sharaf Abī al-Makārim, of Baghdādī origin, the Cairene, the Ḥanbalī. His father was mentioned above and his son al-Badr Muḥammad comes below. He succeeded his father in the teaching posts of al-Ḥasaniyya, Umm al-Sulṭān, al-Ṣāliḥ and others, and in the muftīship of Dār al-ʿAdl and the judgeship of the army, but his tenure was not long. He died (date not given).
