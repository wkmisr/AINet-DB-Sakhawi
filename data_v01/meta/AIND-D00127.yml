translation:
  ja: イブラーヒーム・ブン・サイード・ブン・サーリム・アル＝タラーブルシー。 イブン・ファハドがその「ムアッジャム」で彼について言及し、彼がイブン・ウマイラから『アブー・ダーウードのスンナ』と『ティルミズィーのジャーミウ』を聴聞したと述べている。私（＝サハーウィー）は彼についての伝記や没年を知らない。
  en: Ibrāhīm b. Saʿīd b. Sālim al-Ṭarābulusī. Ibn Fahd mentioned him in his lexicon, stating that he heard al-Sunan by Abū Dāwūd and al-Jāmiʿ by al-Tirmidhī from Ibn Umaylah. I (al-Sakhāwī) have no biography or death date for him.
