translation:
  ja: フサイン・ブン・ウスマーン・ブン・スライマーン・ブン・ラスール・ブン・アミール・ユースフ・ブン・ハリール・ブン・ヌーフ、アル＝バドル（・ブン・アッ＝シャラフ）、カラード族の出自で、クリム（クリミア）ついでカイロの人、ハナフィー派。アル＝ムヒッブ・ムハンマドの兄弟で、イブン・アル＝アシュカルとして知られる。847年サファル月に没した。60歳に達していなかった。兄弟（ムハンマド）は彼の死を大いに惜しんだ。フサインは兄弟のすべての実務を取り仕切っており、兄弟がマンスーリー病院の監督官に任命された際には、その副監督官に指名されるほどであった。神の慈悲があらんことを。
  en: Ḥusayn b. ʿUthmān b. Sulaymān b. Rasūl b. Amīr Yūsuf b. Khalīl b. Nūḥ, al-Badr (b. al-Sharaf), of Karādī origin (the Karād, a Turkmen tribe), of Crimea and then Cairo, the Ḥanafī. He was the brother of al-Muḥibb Muḥammad and was known as Ibn al-Ashqar. He died in Safar 847 H, not having completed his sixtieth year. His brother grieved deeply for him. Ḥusayn used to manage all of his brother's affairs, to the extent that his brother appointed him as his deputy in the administration of the Bimaristan when the latter was appointed as its supervisor. May Allah have mercy on him.
