translation:
  ja: ハムザ・ブン・ヤアクーブ・アッ＝ディマシュキー・アル＝ハリーリー。我らがシャイフ（イブン・ハジャル）は自著『インバー・アル＝グムル』の中で彼について言及し、834年サファル月に没したと述べている。私は、彼は前項の人物と同一人物ではないかと思う。
  en: 'Ḥamza b. Yaʿqūb al-Dimashqī al-Ḥarīrī. Our shaykh (Ibn Ḥajar) mentioned him in his chronicle, stating that he died in Safar, the year 834. I say: I think he is the same person as the one mentioned in the preceding entry.'
