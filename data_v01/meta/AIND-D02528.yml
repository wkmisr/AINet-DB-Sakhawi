translation:
  ja: アル＝ハサン・ブン・イリヤース・アッ＝ルーミーは、高名な商人たちのうちの一人であり、彼には、ルゥルゥー・アル＝ハサニーやマルジャーン・アル＝ハサニーといった召使たちが属していた。彼はハバシャで亡くなり、後述のアル＝ジャマール・ムハンマドの父である。
  en: al-Ḥasan b. Ilyās al-Rūmī was one of the prominent and esteemed merchants, to whom a group of servants, including Luʾluʾ al-Ḥasanī and Marjān al-Ḥasanī, were affiliated. He died in Abyssinia, and he is the father of al-Jamāl Muḥammad (mentioned later).
