notes:
- text: '転送見出し（原文末尾「يأتي في أواخر العليين فيمن لم يسم أبوه」による）。転送先は #AIND-D05725「علي نور الدين السفطي」（832年没、未受領）。D05725 本文に「قلت : وهو ابن محمد بن ثامر القرشي الأموي . ولد بسفط الحنا من الشرقية وكان أبوه خطيبها」とあり、父名 محمد بن ثامر・ニスバ السفطي が一致するため一意に同定。もう一つの候補 #AIND-D05726「علي نور الدين السفطي … الوراق」は「واسم والده حجاج」とあり別人。'
