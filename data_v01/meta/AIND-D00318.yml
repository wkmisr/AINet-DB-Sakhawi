translation:
  ja: AIND-D00318 | 523608523461 イブラーヒーム・ブン・ムハンマド、ブルハーン・アッ＝ディーン・アル＝キルミー・アル＝カーヒリー・アル＝ハナフィー。 (後述する) ナジュム・イスハークの甥。彼のおじや、アル＝アミーン・アル＝アクサラージュイー、ニザームなどから学び、理解を深めた。証人として生計を立て、カーニバーイー・サルクのディーワーンを取り仕切った。何度もハッジを行い、最後のハッジは887年であった。マフマル(巡礼行列を率いる隊商)の証人を務め、イブン・アジャー（彼のおじであるナジュムからそれを受け継いでいた）の死以来空席となっていた軍カーディー職を、その俸給をもって何度も求めた。それは叶えられたが、死期が彼を襲い、彼は888年ズルヒッジャ月29日水曜の夜に急死した。フシュカダム・アル＝ムカッダム廟の、ターズ廟の向かい、彼のおじの傍らに埋葬された。私が聞くところによると、彼は敬虔で、愛想が良く、意欲があり、協力的であったという。アッラーが彼を憐れみたまわんことを。
  en: AIND-D00318 | 523608523461 Ibrāhīm b. Muḥammad Burhān al-Dīn al-Qirmī al-Qāhirī al-Ḥanafī, nephew of al-Najm Isḥāq (mentioned later). He remained in close discipleship with his uncle, al-Amīn al-Aqṣarāʾī, Niẓām, and others, and he gained understanding. He earned his livelihood through testimony (shahāda) and managed the dīwān of Qānibāy Ṣulūq. He performed Hajj multiple times, the last being in the year 887 H. He served as a witness for the Maḥmal. He repeatedly sought the position of Qāḍī al-ʿAskar, which had been vacant since the death of Ibn Ajā (who had received it from his uncle al-Najm), offering a sum of money, and his request was granted. However, fate overtook him, and he died suddenly on Wednesday night, the 29th of Dhū al-Ḥijja, in the year 888 H. He was buried in the Turbat Khushqadam al-Muqaddam, opposite Turbat Tāz, near his uncle. I heard from those who mentioned him with piety, affection, ambition, and helpfulness. May God have mercy on him.
