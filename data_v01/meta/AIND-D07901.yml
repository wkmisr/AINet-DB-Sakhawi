translation:
  ja: ムハンマド・ブン・アル＝ジャラール・アビー・アル＝マハーミド・アブドゥルワーヒド・ブン・イブラーヒーム・ブン・アフマド・ブン・アビー・バクル・イブン・アブドゥルワッハーブ、アル＝ジャマール・アル＝ムルシディー・アル＝マッキー・アル＝ハナフィー。（80）8年サファル月に生まれ、父のもとで学んだ。結婚もせず旅もせず、祝福された静かな人物であった。846年ラビーウ・アル＝アーヒル月にマッカで没した。イブン・ファハドがその没年を記した。
  en: Muḥammad b. al-Jalāl Abī al-Maḥāmid ʿAbd al-Wāḥid b. Ibrāhīm b. Aḥmad b. Abī Bakr b. ʿAbd al-Wahhāb, al-Jamāl al-Murshidī al-Makkī al-Ḥanafī. He was born in Ṣafar of the year (80)8 and studied under his father. He neither married nor travelled, and was a blessed, quiet man. He died in Rabīʿ al-Ākhir of the year 846 in Mecca. Ibn Fahd recorded his death date.
