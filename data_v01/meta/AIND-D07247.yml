translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ムハンマド・ブン・アリー・ブン・アッ＝タキー・ムハンマド・ブン・サーリフ、アル＝マダニー。そこ（マディーナ）のカーディーたちであるバヌー・サーリフの従兄弟で、同地のサイイド・ハムザ廟の奉仕人。そこで育ち、『ミンハージュ』の法学（フルーウ）書と法源学（ウスール）書、および文法の『アルフィーヤ』を暗記し、学問に励み、カイロに来た。
  en: Muḥammad b. Abī Bakr b. Muḥammad b. ʿAlī b. al-Taqī Muḥammad b. Ṣāliḥ al-Madanī, cousin of the Banū Ṣāliḥ, its (Medina's) judges, and servant of the shrine of al-Sayyid Ḥamza there. He grew up there, memorized the 'Minhāj' of law (furūʿ) and that of legal theory (uṣūl) and the 'Alfiyya' of grammar, studied, and came to Cairo.
