translation:
  ja: ウマル・ブン・アフマド・ブン・ムハンマド・ブン・マフムード・ブン・ユースフ・ブン・アリー、インド出身でマッカの人。（8）32年にアッ＝シハーブ・アフマド・アル＝ムルシディーのもとでイブン・ジャマーアの『マナースィク』の一部を聴聞した。（8）63年ジュマーダー・アル＝アーヒラ月にマッカで没した。イブン・ファハドがその没年月を記録している。
  en: ʿUmar b. Aḥmad b. Muḥammad b. Maḥmūd b. Yūsuf b. ʿAlī, of Indian origin, of Mecca. He heard part of the Manāsik of Ibn Jamāʿa from al-Shihāb Aḥmad al-Murshidī in the year (8)32. He died in Mecca in Jumādā al-Ākhira (8)63. Ibn Fahd recorded his death.
