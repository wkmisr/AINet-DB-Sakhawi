translation:
  ja: アフマド、ラカブはアッ＝シハーブ、通称アル＝ヤマニー。カイロのジョウクの朗誦家の一人。イブン・アッ＝タッバーフの弟子で、彼と一緒に朗誦し、彼を模倣した。人々は彼の朗誦に並々ならぬ熱意を示した。825年サファル月に死去し、彼以降に彼の方式で朗誦する者はいなかった。我らがシャイフ（イブン・ハジャル）が『インバーウ（＝インバーウ・アル＝グムル）』で述べた。
  en: Aḥmad, known as al-Shihāb, commonly known as al-Yamanī, was one of the readers of the Jawq in Cairo. He was a student of Ibn al-Ṭabbākh, read with him, and imitated his style. People showed great enthusiasm for his recitations. He died in Ṣafar 825 AH and left no one after him who read in his style, as stated by our shaykh (Ibn Ḥajar) in his 『Inbāʾ al-Ghumr』.
