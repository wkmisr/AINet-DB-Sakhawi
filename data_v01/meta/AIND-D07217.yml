translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アリー、ナースィル・アッ＝ディーン・アッ＝ディーリー・アル＝マクディスィー、シャーフィイー派、サイード・アッ＝スアダー（・ハーンカー）の寄留者。イブン・ハッサーンらに学び、優れた人物となった。善良で謙虚であった。壮年に達する前、（8）55年ラビーウ・アル＝アウワル月9日日曜日に没し、サイーディーヤのスーフィー墓域（ハウシュ・アッ＝スーフィーヤ）に埋葬された。神が彼に慈悲を垂れたまわんことを。
  en: Muḥammad b. Abī Bakr b. ʿAlī, Nāṣir al-Dīn al-Daylī al-Maqdisī al-Shāfiʿī, resident of Saʿīd al-Suʿadāʾ. He studied under Ibn Ḥassān and others and became accomplished; he was a good and humble man. He died before reaching mature age, on Sunday 9 Rabīʿ al-Awwal (8)55, and was buried in the Sufis' enclosure (ḥawsh) of the Saʿīdiyya; may God have mercy on him.
