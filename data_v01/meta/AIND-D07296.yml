notes:
- text: '母方の親族（relation は立てず note のみ、規則23）: イブン・ハジャルの妻 أنس（#AIND-D12898）は母方祖母 فرح の姉妹＝本項主の大叔母。#AIND-D07294 محمد بن تغري برمش（母 فرح خاتون）は母 فاطمة の（異父）兄弟＝本項主の母方叔父にあたるが、D07294 は本項主を名指ししないため note に留める。母は852年に産褥で没し（D13532）、本項主（「ولدها」）を遺した。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・ジャージャク。母はアッ＝シャリーフ・アル＝ファフリーの娘アッ＝シャリーファ・ファーティマで、我らがシャイフ（イブン・ハジャル）の妻の姉妹の娘である。アル＝バースィティーヤで生計を立てていた者の一人で、ふさわしくないことで取り沙汰されてもいた。彼は我々の隣人の一人で、我らがシャイフらから聴聞した者である。
  en: Muḥammad b. Jājiq. His mother was al-Sharīfa Fāṭima, daughter of al-Sharīf al-Fakhrī and daughter of the sister of our shaykh's (Ibn Ḥajar's) wife. He was one of those who earned a living at al-Bāsiṭiyya, though spoken of in unbecoming terms. He was one of our neighbours and among those who heard from our shaykh and others.
