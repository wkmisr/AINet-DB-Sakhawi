translation:
  ja: カーンバーイ・アン＝ナースィリー・ファラジュ、アル＝アアマシュ（目のかすんだ者）として知られる。アル＝アシュラフ・バルスバーイの治世にハーッサキーとなり、次いでアッ＝ザーヒル（ジャクマク）の治世に十人隊アミール、次いでラアス・ナウバの一人となり、アル＝アシュラフ・イーナールの治世に城塞の副官（ナーイブ・アル＝カルア）となった。次いでユーヌス・アル＝アラーイーのイクターを加増され、860年ズー・アル＝カアダ月に没するまでその両方を保持した。
  en: Qānbāy al-Nāṣirī Faraj, known as al-Aʿmash (the bleary-eyed). In the days of al-Ashraf Barsbāy he became a khāṣṣakī, then in the days of al-Ẓāhir (Jaqmaq) an amīr of ten, then one of the ruʾūs al-nuwab, and in the days of al-Ashraf Īnāl deputy of the Citadel (nāʾib al-qalʿa). Then the iqṭāʿ of Yūnus al-ʿAlāʾī was added to his, and he continued to hold both until he died in Dhū al-Qaʿda of the year 860.
