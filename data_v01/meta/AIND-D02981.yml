translation:
  ja: ディナール・アッ＝タワーシー。ジャムダール（衣類番）の一人。サルール・アル＝ハバシー・アル＝ハサニー・カラークジャー（後述）に続いて、895年に預言者の玄室（聖廟）の奉仕職を加えて委ねられた。
  en: Dīnār al-Ṭwāshī, one of the jamdārs (wardrobe keepers). In the year 895 AH the service of the Prophet's Chamber was added to his charge, succeeding Surūr al-Ḥabashī al-Ḥasanī Qarāqujā, who is mentioned below.
