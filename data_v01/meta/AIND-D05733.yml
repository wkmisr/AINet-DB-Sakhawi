translation:
  ja: アリー・アル＝ウスター・アル＝アルズィンジャーニー、後出のヤアクーブ・シャーの父。自分の国からルーム（アナトリア）へ、次いでアル＝ムアイヤドの治世の初めにカイロへやって来た。アン＝ナースィリー・ブン・アル＝バーリズィーに専属して仕え、次いでスルターンの家（宮廷）に移った。弓術において理論と実践の両面で抜きん出て、それゆえ「アル＝ウスター（親方）」として知られた。7回巡礼し、（マッカに）滞在（ムジャーワラ）し、100歳近くまで長命を保って没した。息子よりも善良な人物であった。
  en: ʿAlī al-Usṭā al-Arzinjānī, father of Yaʿqūb Shāh (to follow). He came from his homeland to al-Rūm (Anatolia), then to Cairo at the beginning of the sultanate of al-Muʾayyad. He attached himself to the service of al-Nāṣirī b. al-Bārizī, then moved to the household of the sultan. He excelled in archery in both theory and practice, so that he became known as "al-Usṭā" (the master). He performed the pilgrimage seven times and resided as a mujāwir (presumably in Mecca), and lived to about a hundred years before he died. He was a better man than his son.
