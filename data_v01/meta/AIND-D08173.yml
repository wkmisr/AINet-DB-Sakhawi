translation:
  ja: ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・ムハンマド、ナースィル・アッ＝ディーン、アッ＝サカンダリー、のちにアッ＝ディムヤーティー、アッ＝シャーフィイー、アッ＝シャーズィリー。「アル＝アンバリーの姻戚（スィフル）」として知られる。私（サハーウィー）から聴講した者の一人。
  en: Muḥammad b. ʿAlī b. Muḥammad b. Muḥammad, Nāṣir al-Dīn al-Sakandarī, then al-Dimyāṭī, al-Shāfiʿī, al-Shādhilī, known as the in-law (ṣihr) of al-ʿAnbarī. One of those who heard from me.
