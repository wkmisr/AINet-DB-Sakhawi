  note:
    ja: '規則3 (c'')。父 علي بن محمد بن محمد は裸の汎用名で識別要素なし。hw.py「علي بن محمد بن محمد」＋「السكندري」の該当は #AIND-D05556（… بن يفتح الله النور … السكندري المالكي）・#AIND-D05566（… بن وفا أبو الحسن … السكندري الأصل المصري الشاذلي المالكي الصوفي）のみで、いずれもマーリキー派・通称が異なり本項主（الشافعي・ناصر الدين・صهر العنبري）の父とは閉合しない。「الدمياطي」側の #AIND-D05544・#AIND-D05554 も別家系。ID-Master 未登録。【集約 2026-11-03】機械照合候補 #AIND-D05566（「علي بن محمد بن محمد بن وفا أبو الحسن القرشي الأنصاري … السكندري الأصل المصري الشاذلي المالكي الصوفي … ويعرف كسلفه بابن وفا … ولد سنة تسع وخمسين وسبعمائة」）を原文で確認: マーリク派（本項主は الشافعي）、通称 ابن وفا（本項主は صهر العنبري）、759 年生（本項主はサハーウィーの聴講者＝9 世紀後半に存命）で学派・年代が合わず別人＝同定しない（機械 M、オーケストレーター決定13）。#AIND-D05544（… بن حجاج … الجوجري الأصل الدمياطي الشافعي、父 893 没）もニスバ・家名が合わない。'
