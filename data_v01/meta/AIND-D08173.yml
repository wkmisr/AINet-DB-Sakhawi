notes:
- text: '通称「صهر العنبري」（アル＝アンバリーの姻戚。婿・舅・義兄弟のいずれかは原文から決まらない＝規則52）の العنبري は特定できない。corpus の العنبري 見出し: #AIND-D02698（حسين بن حسن … البدر المنصوري ثم القاهري الشافعي العنبري）・#AIND-D04207（عبد القادر بن أبي الفتح … العنبري أحد جماعة الجوجري）・#AIND-D05712（علي بن العنبري الدمشقي）・#AIND-D05793（عمر بن أحمد … الحموي الشافعي العنبري）・#AIND-D09460・#AIND-D11035・ニスバ索引 #AIND-D11869。いずれも本項主への言及なし → 規則52 により relation は立てず note のみ（初版の relation「other」（ニスバ番号 TMP-N-00840 の人物流用）は除去）。「السكندري ثم الدمياطي」はニスバであり居住 event は立てない（規則22(1)）。'
