translation:
  ja: ダイフ・ブン・アフマド・ブン・アリー・ブン・ウスマーン・アン＝ナッジャール・アル＝ハッラート。ハッジ・アリー・アッ＝トゥーニスィーからある逸話を聴聞し、それを伝承した。アッ＝タキー・ブン・ファハドが彼からそれを聴き、自著『ムアジャム』に彼を記載した。808年に没した。
  en: Ḍayf b. Aḥmad b. ʿAlī b. ʿUthmān al-Najjār al-Kharrāṭ. He heard a story from al-Ḥājj ʿAlī al-Tūnisī and transmitted it. Al-Taqī b. Fahd heard it from him and mentioned him in his Muʿjam. He died in the year 808 AH.
