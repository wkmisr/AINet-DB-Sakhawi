  note:
    ja: '「قرأ على شيخنا الرشيدي البخاري」。「شيخنا الرشيدي」（サハーウィーの師）＝#AIND-D07805「محمد بن عبد الله بن محمد بن إبراهيم بن لاجين الشمس بن الجمال … الرشيدي الأصل القاهري الشافعي … والآتي ولده يحيى ويعرف بالرشيدي . ولد في رجب سنة سبع وستين وسبعمائة … وكانت بيده وظيفة الإسماع بجامع الأزهر … وقد حدث بالكثير خصوصا من بعد اجتماعي به وذلك في أواخر ذي الحجة سنة ثمان وأربعين وإلى أن مات فإني أكثرت عنه جدا ، وخرجت له مشيخة … مات … سنة أربع وخمسين」（サハーウィーが848年から没年854年まで多く聴いた師・ハディースの إسماع 職・息子 يحيى＝ID-Master TMP-P-000803「يحيى ابن شيخنا الرشيدي」と整合＝3点で閉合、規則57）。ブリーフ頻出ID欄の「شيخنا الرشيدي＝#AIND-D00907」は D07805 の兄 الشهاب أحمد（844年没、サハーウィーとの師弟関係の記述なし）で、規則60(h) により採らない（ISSUES §D163-4）。初版はニスバ番号 TMP-N-00203 を人物位置に流用（カテゴリ不一致）。bibl『البخاري』: #NEEDID → wd:Q1023470（頻出確定ID）。初版の field desc「الحديث」（原文に分野の明示はなく書名のみ）を除去。'
translation:
  ja: ムハンマド・ブン・アリー、アッ＝シャムス・アッ＝サンフーリー、イブン・アル＝ウサイフィルとして知られる。我らがシャイフ、アッ＝ラシーディーのもとで『ブハーリー』を読んだ。
  en: Muḥammad b. ʿAlī al-Shams al-Sanhūrī, known as Ibn al-Uṣayfir. He read al-Bukhārī under our shaykh al-Rashīdī.
