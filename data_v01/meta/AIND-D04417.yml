translation:
  ja: アブドゥッラー・ブン・アフマド・アル＝ジャマール・ブン・アッ＝シハーブ・アル＝カスタッラーニー・アル＝ミスリー。フスタートのアムル・モスクの説教師（ハティーブ）であり、彼とその父が約50年間にわたりその職を務めた。805年ラマダーン月の最後の10日間に没した。70歳を超えており、晩年は精神錯乱（ボケ）に陥っていた。彼の死後、タキー・アッ＝ディーン・アル＝マクリーズィーが説教師職を引き継ぎ、彼（マクリーズィー）が彼の死亡年月日を記録した。
  en: Abd Allah b. Ahmad al-Jamal b. al-Shihab al-Qastallani al-Misri. The Khatib (preacher) of the Amr Mosque of Egypt (Fustat), a post which he and his father held for about fifty years. He died in the last ten days of Ramadan in the year 805 AH, having lived past seventy years of age, and after suffering from cognitive decline (senility). Al-Taqi al-Maqrizi succeeded him in the sermon-giving post, and he is the one who recorded his date of death.
