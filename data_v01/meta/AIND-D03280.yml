translation:
  ja: シャーヒーン・アッ＝ルーミー・アン＝ヌーリー・アル＝アンバービー。副機密書記（ナーイブ・カーティブ・アッ＝スィッル）。アル＝ブルハーン・アル＝ファルナウィー、次いでヤースィーンのもとでクルアーンを読み、書法を習得してその道で頭角を現した。いくつかのクルアーン写本（ムスハフ）などを書写し、その一部をアル＝アシュラフ・カーイトバーイに献上した。
  en: Shāhīn al-Rūmī al-Nūrī al-Anbābī, deputy confidential secretary (nāʾib kātib al-sirr). He read the Qur'an and perfected his handwriting under al-Burhān al-Farnawī and then under Yāsīn, excelling in it. He wrote several copies of the Qur'an and other works, and presented some of them to al-Ashraf Qāytbāy.
