translation:
  ja: ムハンマド・ブン・シャアバーン・ブン・ムハンマド、アル＝ブーティージー、のちにアル＝カーヒリー、シャーフィイー派。我らがシャイフ、アッ＝ザイン・アル＝ブーティージーの親族。善良で、家柄よく、名望ある人物であった。クルアーンを読誦し、いくつかの書を暗記し、少しばかり学問に励んだ。アル＝ワリー・アル＝イラーキーの講義に出席し、さらに彼の口述録（アマーリー）を聴聞した。それは、私（サハーウィー）が聴聞記録（マジャーリス）の中にアル＝ムアッラーの筆跡で記録されているのを見たとおりである。諸機関の俸給職に登録され、ジャワーリー（人頭税）関係のいくつかの部署で実務に携わった。推測では870年頃に没した。
  en: Muḥammad b. Shaʿbān b. Muḥammad al-Būtījī, then al-Qāhirī, al-Shāfiʿī, a relative of our shaykh al-Zayn al-Būtījī. He was a good man, of good family and standing. He recited the Qurʾān, memorized some books and studied a little; he attended the lessons of al-Walī al-ʿIrāqī, and indeed heard his dictations (amālī), as I saw recorded in the hand of al-Muʿallā in the session records. He held stipendiary posts in various institutions and served as a clerk in some of the offices of the jawālī (poll-tax). He died, as far as I suppose, around the year 870.
