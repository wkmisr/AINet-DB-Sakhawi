translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・アブドゥッラー・ブン・サダカ・アッ＝サイラフィー。彼はサハーウィーに仕えたことで知られている。彼（サハーウィー）から『アマーリー』などについて書写した。また、私（サハーウィー）の著作である『アル＝カウル・アル＝バディーウ』や『イルティヤー・アル＝アクバード』などを得た。彼は学問への欲求があったが、初めは裕福であったが、その恩恵を顧みなかったため、結局は卑しい税吏たちとわずかな金銭のために交わるほどに落ちぶれてしまった。彼はヒジュラ暦892年ラジャブ月に亡くなった。
  en: Aḥmad b. Ibrāhīm b. ʿAbd Allāh b. Ṣadaqa al-Ṣayrafī. He was known for his service to al-Sakhāwī. He copied from him (al-Sakhāwī) dictations and other matters. He also acquired al-Qawl al-Badīʿ, Irtiyāḥ al-Akbād, and other compositions of mine (al-Sakhāwī). He had a desire for knowledge, and although he was initially wealthy, he did not appreciate its blessings and eventually fell into such poverty that he associated with tax collectors for meager gains, despite his scholarly engagement. He died in Rajab of the year 892 AH.
