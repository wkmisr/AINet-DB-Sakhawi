translation:
  ja: アブド・アッ＝ラティーフ・ブン・ウバイド・アッラー・ブン・アワド・ブン・ムハンマド・アル＝アルダビーリー・アッ＝シルワーティー・アル＝カーヒリー・アル＝ハナフィー。アル＝バドル・ムハンマドとその兄弟たちの兄弟で、イブン・ウバイド・アッラーとして知られる。『アル＝カンズ』『アル＝マナール』ナサフィーの『ウムダ』『アル＝ハージビーヤ』を暗記し、教授した。854年に没した。
  en: ʿAbd al-Laṭīf b. ʿUbayd Allāh b. ʿAwaḍ b. Muḥammad al-Ardabīlī al-Shirwātī al-Qāhirī al-Ḥanafī, brother of al-Badr Muḥammad and his brothers, known as Ibn ʿUbayd Allāh. He memorized al-Kanz, al-Manār, the ʿUmda of al-Nasafī and al-Ḥājibiyya, and taught. He died in the year 854.
