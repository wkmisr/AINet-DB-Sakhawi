translation:
  ja: イスマーイール・ブン・ムハンマド・ブン・イスマーイール・ブン・アブドゥッラー・ブン・ウマル・ブン・アビー・バクル・ブン・アブドゥッラフマーン・ブン・アブドゥッラー・アル＝ナーシリー（その父については後述）。 彼は高潔で、立派な文字と美しい声の持ち主であり、クルアーンの朗誦を絶えず行っていた。アル＝アフィーフが彼の父の伝記の中で彼に言及している。
  en: Ismāʿīl b. Muḥammad b. Ismāʿīl b. ʿAbd Allāh b. ʿUmar b. Abī Bakr b. ʿAbd al-Raḥmān Ibn ʿAbd Allāh al-Nāshirī (his father is mentioned later). He was virtuous, possessed good handwriting, and a beautiful voice, constantly reciting the Qurʾān. al-ʿAfīf mentioned him in his father's entry.
