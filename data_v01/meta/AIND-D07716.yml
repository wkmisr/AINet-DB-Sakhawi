  en: Muḥammad b. ʿAbd al-Qādir b. Yaḥyā b. ʿAbd al-Raḥmān b. Abī al-Khayr Muḥammad b. Fahd, Abū al-Baqāʾ, al-Hāshimī. He died in the cradle, before completing one month of age, in Ramaḍān of the year 865.
