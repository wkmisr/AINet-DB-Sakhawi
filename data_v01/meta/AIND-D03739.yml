  ja: アブド・アッラフマーン・ブン・ムハンマド・ブン・アビー・バクル・ブン・アル＝フサイン、ワジーフ・アッディーン（・ブン・アッ＝シャイフ・ナースィル・アッディーン・アビー・アル＝ファラジュ・ブン・アッ＝ザイン・アル＝マラーギー・アル＝アスル・アル＝マダニー）、後述のムハンマドの兄弟。マディーナにて私（＝サハーウィー）から聴聞した。
