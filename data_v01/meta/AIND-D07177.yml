translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ハサン・ブン・マフブーブ、ナースィル・アッ＝ディーン・アル＝バアリー・アッ＝シャーフィイー・アッ＝ザハビー、イブン・イッズ・アッ＝ディーンとして知られる。779年頃にバアルベックで生まれ、そこで育った。アッ＝シャムス・アル＝アクルーミー・アル＝ハンバリーのもとでクルアーンを読み、『サヒーフ』の全部をアッ＝シャムス・アル＝ユーニーニー、アッ＝シャリーフ・アル＝フサイニー、アル＝ジャルディーから聴聞したが、その冒頭の2葉だけはイブン・アッ＝ザアブービーから聴聞した。ハディースを伝え、学徳ある人々が彼から聴聞し、私（サハーウィー）も彼の町で彼のもとでその一部を読んだ。巡礼を行い、善良な人で、金細工の仕事で生計を立てていた。推測では860年頃に没した。
  en: Muḥammad b. Abī Bakr b. Ḥasan b. Maḥbūb, Nāṣir al-Dīn al-Baʿlī al-Shāfiʿī al-Dhahabī, known as Ibn ʿIzz al-Dīn. He was born in about 779 at Baʿlabakk and grew up there. He read the Qurʾān with al-Shams al-Akrūmī al-Ḥanbalī and heard the whole of the Ṣaḥīḥ from al-Shams al-Yūnīnī, al-Sharīf al-Ḥusaynī and al-Jardī, except for two folios at its beginning, which he heard from Ibn al-Zaʿbūbī. He transmitted; learned men heard from him, and I read part of it to him in his town. He performed the pilgrimage and was a good man who earned his living by goldsmithing. He died around [8]60, as far as I conjecture.
