translation:
  ja: アル＝ハサン・ブン・アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ワファー、アブー・アル＝ジュード、アッ＝シハーブ（アフマド）の息子。アレクサンドリア出身の家系で、エジプト（ミスル）のマーリキー派。イブラーヒーム、アブド・アッ＝ラフマーン・ムハンマド、アブー・アル＝ファトフ・ムハンマド、ヤフヤーの兄弟。一族と同様イブン・ワファーとして知られる。808年、父の存命中に19歳で亡くなった。
  en: Al-Ḥasan b. Aḥmad b. Muḥammad b. Muḥammad b. Wafā, Abū al-Jūd, son of al-Shihāb. Of Alexandrian origin, Egyptian (Miṣrī), Mālikī. He was the brother of Ibrāhīm, ʿAbd al-Raḥmān Muḥammad, Abū al-Fatḥ Muḥammad, and Yaḥyā. Like his forebears, he was known as Ibn Wafā. He died in [8]08 at the age of nineteen, during his father's lifetime.
