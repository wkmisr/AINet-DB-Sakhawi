translation:
  ja: ムーサー・ブン・イブラーヒーム・ブン・ムハンマド・ブン・ファラジュ・ブン・ザイド、アル＝マルカーウィー、アッ＝ディマシュキー、シャーフィイー派、アッ＝サーリヒーヤの寄留者。イブン・ハティーブ・アル＝ミッザとイブン・アビー・アル＝マジュドから『ムスナド・アッ＝シャーフィイー』を、イブン・カワーリーフから『サヒーフ・ムスリム』を聴聞し、（ハディースを）伝えた。イブン・ファハドらが彼に会った。…に没した（以下欠）。
  en: Mūsā b. Ibrāhīm b. Muḥammad b. Faraj b. Zayd al-Malkāwī al-Dimashqī al-Shāfiʿī, resident of al-Ṣāliḥiyya. He heard the Musnad of al-Shāfiʿī from Ibn Khaṭīb al-Mizza and Ibn Abī al-Majd, and Ṣaḥīḥ Muslim from Ibn Qawālīḥ, and he transmitted (ḥadīth). Ibn Fahd and others met him. He died in ... (text lacking).
