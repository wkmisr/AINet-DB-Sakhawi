  note:
    ja: '「ثم شادية السواقي عن خشقدم الأحمدي ثم للزمامية بعده بسنتين」＝シャード・アッ＝サワーキー職とザマーム職の前任者。corpus 本伝 #AIND-D02831「خشقدم الظاهري جقمق الرومي اللالا ويقال له أيضا الاحمدي لتاجره … شاد السواقي … استقر خازندارا زماما بعد موت جوهر شراقطلي في ربيع الأول سنة اثنتين وثمانين مضافا للوزر وشد السواقي منفصلا عما عداهما … واستمر على الزمامية والخازندارية إلى أن رسم عليه … فكانت منيته بسواكن في شوال سنة أربع وتسعين」（収録済み）。【集約 2026-10-19 訂正】D02831 は882年にザマーム職（خازندار زمام）に宰相職と شد السواقي を兼ね（「مضافا للوزر وشد السواقي منفصلا عما عداهما」＝それ以外の職からは離れた）、894年までザマーム在任。「ثم شادية السواقي عن خشقدم الأحمدي ثم للزمامية بعده بسنتين」の بعده は「خشقدم の後に」とも読め、ザマーム職の前任としても整合（校閲時の「882年に شد السواقي を離れた」は誤読、内容B L・規則42）。初版 #NEEDID。'
