translation:
  ja: フィールーズ・アッ＝ルーミー・アル＝ジャマーリー・アル＝カーブーニー——（このニスバは）彼の（奴隷）商人にちなむ。アル＝アシュラフ・カーイトバーイが彼を小ハーズィンダール職（al-khāzindāriyya al-ṣughrā）に昇進させ、次いでフシュカダム・アル＝アフマディーの後任として水車監督職（shādiyyat al-sawāqī）に、その2年後、彼が壮年にさしかかった頃にザマーム職に就けた。ルームから到来した年には、ハワンド（王妃）が巡礼した際にその供をして赴いた。
  en: Fīrūz al-Rūmī al-Jamālī al-Qābūnī, the latter nisba being after his (slave-)merchant. Al-Ashraf Qāytbāy promoted him to the lesser treasurership (al-khāzindāriyya al-ṣughrā), then to the superintendency of the waterwheels (shādiyyat al-sawāqī) in succession to Khushqadam al-Aḥmadī, and then, two years after that, when he was approaching middle age, to the office of zimām. In the year of his arrival from Rūm he had travelled in the service of the Khawand (the sultan's consort) when she performed the pilgrimage.
