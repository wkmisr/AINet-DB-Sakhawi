translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ハサン・ブン・アリー・ブン・アフマド・ブン・ハラフ、アッ＝シャムス・アル＝ジャウジャリー、のちアル＝カーヒリー、シャーフィイー派、盲目、イブン・ダシーシャとして知られる。810年頃、カイロ管区のジャルジャルに生まれ、そこでクルアーン、『タブリーズィー』、『ミンハージュ・ファルイー』の一部、『ウムダ』と『ミルハ』の全部を読み、『ミルハ』をアッ＝シャムス・アル＝ハリーリーと、彼の町のカーディーであるアル＝イッズ・ブン・ジュマイル（縮小形）のもとで討究した。その後833年にカイロへ移り、一群の人々のもとで法学と文法の講義に出席し、我らの師（イブン・ハジャル）を称える詩を作り、私はそれを『ジャワーヒル』に収めた。アル＝ビカーイーは彼から書き取り、「彼はビルカト・カルムート街区の住人で、聡明で、子供の教育で生計を立てている」と述べた。それどころか私（サハーウィー）はアル＝ジャマール・アル＝キルマーニーのところで彼にたびたび会い、彼の詩を多く聴いた。さらに彼はアッ＝ザーヒリーヤでブハーリーの読了会を聴聞した。きわめて聡明であった。877年シャアバーン月の下旬に没した。
  en: Muḥammad b. Abī Bakr b. Ḥasan b. ʿAlī b. Aḥmad b. Khalaf, al-Shams al-Jawjarī, then al-Qāhirī, the Shāfiʿī, the blind, known as Ibn Dashīsha. He was born in about 810 at Jarjar, in the district of Cairo, where he read the Qurʾān, al-Tabrīzī, part of al-Minhāj al-Farʿī and all of al-ʿUmda and al-Mulḥa, and studied al-Mulḥa under al-Shams al-Ḥarīrī and al-ʿIzz b. Jumayl (in the diminutive), the qāḍī of his town. Then he moved to Cairo in the year 833 and attended lessons in jurisprudence and grammar with a number of scholars. He praised our shaykh in verses which I recorded in al-Jawāhir. Al-Biqāʿī wrote (poetry) from him and said that he lived in the quarter of Birkat Qarmūṭ, was intelligent, and earned his living by teaching children. Indeed I met him often at al-Jamāl al-Kirmānī's and heard a good deal of his poetry; he also heard the completion of al-Bukhārī at al-Ẓāhiriyya, and was extremely intelligent. He died in the last ten days of Shaʿbān 877.
