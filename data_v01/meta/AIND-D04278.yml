  ja: アブド・アル＝カリーム・ブン・カースィム・ブン・アブド・アル＝ムウティー、カリーム・アッ＝ディーン・アル＝アンサーリー。アブド・アル＝ムウティーの兄弟。イブン・ファフドがその『補遺（ザイル）』で名前のみ挙げており、私（サハーウィー）は推測で（本書に）書き入れた。
  en: ʿAbd al-Karīm b. Qāsim b. ʿAbd al-Muʿṭī, Karīm al-Dīn al-Anṣārī, brother of ʿAbd al-Muʿṭī. Ibn Fahd listed him bare (without details) in his Dhayl, and I have entered him here conjecturally.
