translation:
  ja: ウスマーン・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ザヒーラ・ブン・アフマド・ブン・アティーヤ・ブン・ザヒーラ・アル＝クラシー・アル＝マッキー。後出のアッファーンの父。806年にザビードで生まれ、5歳のときマッカで叔父アル＝ジャマール・ブン・ザヒーラのもとに連れられてその『ムウジャム』を聴講し、イブン・スィッディークほか一団の人々からイジャーザを受けた。848年ラジャブ月に同地（マッカ）で没した。
  en: ʿUthmān b. Abī Bakr b. ʿAbd Allāh b. Ẓahīra b. Aḥmad b. ʿAṭiyya b. Ẓahīra al-Qurashī al-Makkī, the father of ʿAffān, who is mentioned below. He was born in 806 in Zabīd, and in his fifth year he was brought in Mecca to attend the reading of the Muʿjam of his paternal uncle al-Jamāl b. Ẓahīra; Ibn Ṣiddīq and a group of others granted him ijāza. He died there (in Mecca) in Rajab 848.
