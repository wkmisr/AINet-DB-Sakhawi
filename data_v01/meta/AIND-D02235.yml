translation:
  ja: バイバルス・アル＝アシュラフィー・カーイトバーイ。〔アル＝アシュラフ・カーイトバーイは〕彼を引き立て、ついにはシャラブハーナ（御酒膳房）のシャード（監督官）に任じ、その後、イーナール・アル＝アシュラフィーが捕虜となった際にその後任としてトリポリのナーイブ（総督）とした。しかしほどなくして、890年に死去した。
  en: Baybars al-Ashrafī Qāytbāy. He [al-Ashraf Qāytbāy] advanced him until he made him shādd al-sharabkhānāh, then nāʾib of Ṭarābulus in succession to Īnāl al-Ashrafī when the latter was taken captive. He did not last long, dying in the year [eight hundred and] ninety.
