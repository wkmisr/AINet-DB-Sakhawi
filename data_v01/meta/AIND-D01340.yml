translation:
  ja: アフマド・ブン・ムハンマド・ブン・アブド・アル＝ハック・ブン・アフマド・ブン・ムハンマド・ブン・ムハンマド・アル＝スンバーティー、次いでアル＝カーヒリー。シャラフ・アブド・アル＝ハックの兄弟（後述）。多くのシャイフから聴聞し、父と共にハッジを行い、短期間メッカに居住し、旅をした。様々な状況を経験したが、多くで成功せず、彼を愛するその兄弟の心を悩ませた。
  en: Aḥmad b. Muḥammad b. ʿAbd al-Ḥaqq b. Aḥmad b. Muḥammad b. Muḥammad al-Sunbāṭī, then al-Qāhirī, brother of al-Sharaf ʿAbd al-Ḥaqq (mentioned later). He heard from a group of shaykhs, performed the Hajj with his father, resided briefly in Mecca, and traveled. He experienced various circumstances, many of which he did not succeed in, causing his brother's heart distress despite his love for him.
