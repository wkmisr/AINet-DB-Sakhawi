  note:
    ja: '主人ニスバ「العديمي الكمالي」に続けて主人の名「محمد بن إبراهيم بن محمد بن عمر بن العديم الحلبي」が記される（規則51）。刊本どおりに読むと主人は「الكمال محمد بن إبراهيم …」だが、corpus にこの名の本伝はなく、全文検索でも本項のみ。同輩 #AIND-D02039 أقبغا は「فتى الكمال عمر بن العديم」で、その主人 #AIND-D05779「عمر بن إبراهيم بن محمد بن عمر بن عبد العزيز … الكمال أبو حفص … العقيلي الحلبي ثم المصري الحنفي ويعرف بابن العديم」（811年没）は父祖のナサブ（إبراهيم بن محمد بن عمر）とラカブ（الكمال）が本項と一致し、イスムだけが食い違う（محمد／عمر）。名の食い違う候補に cert で寄せない（規則10・25・26）＝刊本どおりの名で仮番号 TMP-P-001747 を発行し、候補 D05779 を記録（ISSUES §D169-1）。初版は主人の名を本項主の persName full に含め、relation なし。'
