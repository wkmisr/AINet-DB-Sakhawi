translation:
  ja: クムシュブガー・アル＝アディーミー・アル＝カマーリー、〔すなわち〕ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・ウマル・ブン・アル＝アディーム・アル＝ハラビー〔のマムルーク〕。イブン・スィッディークのもとで『サヒーフ』を一部欠けた形で聴き、わずかに伝承して、我々の仲間が彼から聴いた。前述のアクブガーの同輩である。没した（没年は原文に欠）。
  en: Kumushbughā al-ʿAdīmī al-Kamālī, [mamlūk of] Muḥammad b. Ibrāhīm b. Muḥammad b. ʿUmar b. al-ʿAdīm al-Ḥalabī. He heard the Ṣaḥīḥ, with some portions missed, under Ibn Ṣiddīq, and transmitted a little; our companions heard from him. He was the comrade of the aforementioned Aqbughā. He died [date lacking in the text].
