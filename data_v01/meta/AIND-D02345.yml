translation:
  ja: ジャンバック・アブー・バクリー・アシュラフィー・バルスバーイ。イナール統治時代にアミール職を務め、後に暴虐に振る舞ったが、やがて失脚し老いた。イブン・マイヤーラ・モスクの近く、二つの城壁の間で暮らした。ヒジュラ暦884年ムハッラム月に亡くなり、たまたま私（サハーウィー）がバーブ・アン＝ナスルの礼拝所（ムサッラー）でイマームとして葬儀を行った。
  en: Janbak al-Abū Bakrī al-Ashrafī Barsbāy, one of those who held the rank of amir during the time of Īnāl and became oppressive, then lost power and grew old. He used to reside near Jāmiʿ Ibn Mayyāla, between the two walls. He died in Muḥarram of the year 884 H. I (al-Sakhāwī) happened to be the one who led his funeral prayer as imam at the Muṣallā Bāb al-Naṣr.
