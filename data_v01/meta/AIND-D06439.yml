translation:
  ja: ムバーラク・シャー・アッ＝ザーヒリー・バルクーク。初め彼（バルクーク）の従者の一人であったが、彼がスルターンになると側近とし、ハージブ職、次いで宰相職、次いでアスターダール職、そのほかギーザのカーシフ職や上エジプト知事職などの職に任じた。その後（バルクークは）彼を失脚させ、彼は816年ラマダーン月に没するまで自宅に籠もった。アル＝アイニーらが彼に言及している。
  en: Mubārak Shāh al-Ẓāhirī Barqūq. He was at first one of his (Barqūq's) followers; when he became sultan he drew him close, then appointed him to the chamberlainship (ḥujūbiyya), then the vizierate, then the ustādāriyya and other offices such as the kashf of al-Jīza and the governorship of Upper Egypt (al-Wajh al-Qiblī). Then he disgraced him, and he kept to his house until he died in Ramaḍān of the year 816. Al-ʿAynī and others mentioned him.
