translation:
  ja: グライル――点付きのガイン、次いで点なしの二文字（ラーとヤー）、縮小形――・ブン・アジュル・ブン・ルマイフ・アル＝ハサニー。父は先述。ヒジャーズの主（サーヒブ・アル＝ヒジャーズ）の縁戚で、その娘の夫であったが、899年に彼（ヒジャーズの主）は彼にその娘との離縁を命じた。
  en: Ghurayr — with a dotted ghayn followed by two undotted letters, in the diminutive — b. ʿAjl b. Rumayḥ al-Ḥasanī; his father was mentioned earlier. A relative of the lord of the Hijaz and the husband of his daughter, whom he (the lord) ordered him to divorce in the year 899.
