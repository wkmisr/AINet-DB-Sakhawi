translation:
  ja: ハリール・ブン・サラーマ・ブン・アフマド・ブン・アリー・アル＝アズライー・アル＝カーブーニー。我らがシャイフ、アッ＝ザイン・アブドゥッラフマーンの父。おそらく後出の「（ハリール）・ブン・アブドゥッラー」の項の人物と同一であろう。私は『サヒーフ・イブン・フザイマ』の現存部分で彼の自筆によるものを実見した。
  en: Khalīl b. Salāma b. Aḥmad b. ʿAlī al-Adhraʿī al-Qābūnī, the father of our shaykh al-Zayn ʿAbd al-Raḥmān; perhaps he is the one who comes below under Ibn ʿAbd Allāh. I came across the extant portion of the Ṣaḥīḥ of Ibn Khuzayma in his own handwriting.
