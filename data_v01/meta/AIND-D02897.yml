  note:
    ja: '「والد شيخنا الزين عبد الرحمن」＝#AIND-D03629「عبد الرحمن بن خليل بن سلامة بن أحمد بن علي بن شريف بن مونس الزين أبو الفهم وأبو زيد بن الصلاح أبي الصفا الأذرعي الأصل القابوني الدمشقي الشافعي الماضي أبوه ويعرف بابن الشيخ خليل」（784生・869没、未収録）。ナサブ4代・ニスバ2つが一致し、相手側も「الماضي أبوه」で本項主を父と名指し＝cert なし（規則37）。「شيخنا」はサハーウィーの師としての呼称（イブン・ハジャルではない）。初版の #NEEDID を置換。原文の「لعله」は子の同定にかかるのではなく、次の possible_identity にかかる。'
