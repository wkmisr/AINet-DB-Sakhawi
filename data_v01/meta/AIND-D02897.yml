  note:
    ja: '「لعله الآتي في ابن عبد الله」＝「おそらく後出の『(خليل) بن عبد الله』の項の人物と同一」。該当は #AIND-D02905「خليل بن عبد الله الأذرعي ويعرف بالقابوني ذكره شيخنا في أنبائه … كتب الكثير للناس بخطه الحسن ومن ذلك كما وقفت عليه الموجود من صحيح ابن خزيمة … مات بالطاعون في صفر سنة أربع عشرة وله ثلاث وستون سنة … قلت وأظنه والد شيخنا الزين عبد الرحمن بن الشيخ خليل القابوني فإن يكنه فهو الصلاح أبو الصفا خليل بن سلامة بن أحمد بن علي」（未収録）。両項でサハーウィー自身が「لعله」「أظنه」と推定しており、同一人物の可能性が高い二重立項（転送指示ではないので REF にしない。絶対基準）。「لعله／أظنه」＝cert medium。D02905 側の没年（814、63歳）・イブン・ハジャル『إنباء』の記述は本項に補わない（規則23、note 留め）。D02905 受領時に鏡像の possible_identity（active=#AIND-D02897）を置くこと。'
