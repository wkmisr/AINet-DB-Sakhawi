  note:
    ja: '父＝見出しナサブ「سلامة بن أحمد بن علي」。子の本伝 #AIND-D03629 の見出しでは「سلامة بن أحمد بن علي بن شريف بن مونس … الأذرعي الأصل القابوني」と5代まで復元できる。corpus に本伝なし（hw.py「سلامة بن أحمد」は本項と D03629 のみ）、ID-Master の سلامة を含む Person 行（TMP-P-000249・000457・000486・000801・000884・000885・001485・001612 等）はいずれも別家系。【集約 2026-11-05】父自身にラカブ・クンヤ・職がなく、سلامة は珍しい名ではない。本伝のある本項主の兄弟とも共有しない（D03629 は孫）＝規則3 (c'') の字義どおり #NEEDID（desc は名、復元ナサブは本 note）。校閲の新規 取り下げた仮番号 B155-P02 は取り下げ（内容A L、決定3、§D155-7）。'
