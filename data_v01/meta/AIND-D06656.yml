translation:
  ja: ムハンマド・ブン・アフマド・ブン・ハムザ・アッ＝サマンヌーディー、シャーフィイー派。後出の私たちの仲間アル＝ジャラールの母方のおじ。その姉妹の子（アル＝ジャラール）が彼から法学を学び、彼が（8）43年シャアバーン月にサマンヌードで没したと私に語った。
  en: Muḥammad b. Aḥmad b. Ḥamza al-Samannūdī, the Shāfiʿī, maternal uncle of our companion al-Jalāl, who will come below. His sister's son learned jurisprudence from him, and told me that he died in Shaʿbān of the year [8]43 in Samannūd.
