translation:
  ja: アブド・アッラフマーン・ブン・イブラーヒーム、アブー・ムハンマド・アル＝マーズィニー・アル＝バウイーニー。（ヒジュラ暦8）30年頃に頭角を現し、数々の奇跡的な行いを示したため、ワサーブの人々から深く信奉されたが、彼に対する世間の評価は二分されていた。その勢力が衰退したのち、（ヒジュラ暦8）36年かそれに近い年に没した。アル＝アフィーフが彼について言及している。
  en: Abd al-Rahman b. Ibrahim, Abu Muhammad al-Mazini al-Ba'yni. He appeared around the year [8]30 AH, performing miraculous deeds such that the people of Wasab believed in him, though people were divided into two factions regarding him. He died after the decline of his prestige in the year [8]36 AH or close to it. He was mentioned by al-Afif.
