  ja: アブド・アル＝カーディル・ブン・アフマド・ブン・イッズ・アッ＝ディーン、少年（アル＝ワラド）、ムヒー・アッ＝ディーン・アブー・アル＝バラカート、アッ＝シハービー・アル＝マナーウィーの子。父は仕立屋である。890年ラビーウ・アッ＝サーニー月に、私（サハーウィー）に『アル＝ミンハージュ』を提示（暗誦）した。
  en: ʿAbd al-Qādir b. Aḥmad b. ʿIzz al-Dīn, the boy Muḥyī al-Dīn Abū al-Barakāt, son of al-Shihābī al-Manāwī; his father is a tailor. He presented al-Minhāj to me in Rabīʿ al-Thānī of the year [8]90.
