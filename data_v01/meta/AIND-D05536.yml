translation:
  ja: アリー・ブン・ムハンマド・ブン・クフル（カーフにダンマ、次いで無点のハー、末尾がラー）。祖父がアブド・アル＝アリー・クフルである者たちの項で既述。彼と少し前に先述した者とは「ムッタフィク・ワ・ムフタリク」および「ムウタリフ・ワ・ムフタリフ」の範疇に入るが、一部の者は前者と同様にこれを誤写している。
  en: ʿAlī b. Muḥammad b. Quḥr (ḍamma on the qāf, then undotted ḥāʾ, ending in rāʾ). Already mentioned among those whose grandfather is ʿAbd al-ʿAlī Quḥr; he and the one mentioned shortly before fall under al-muttafiq wa-l-muftariq and al-muʾtalif wa-l-mukhtalif, though some have miscopied his name like the former.
