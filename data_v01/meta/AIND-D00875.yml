    ja: '【全件照合 2026-09-01】原文「سمع في النسائي الكبير بقراءة البقاعي على جماعة」。「بقراءة البقاعي」は朗誦者(قارئ)を示す句であり師ではない。聴聞先の師は「على جماعة」＝無名の一団。corpus 全体で同型句「سمع … بقراءة〈朗誦者〉على〈X〉」は43例あり X は常に師であり、とりわけ D00280「وسمع بقراءتي وبقراءة غيري على جماعة من المسندين」が同一構文。「على جماعة من …」35例の後続語も المسندين / شيوخه / شيوخنا / أئمة / علماء 等すべて師側で、聴衆を指す例はない。初版は朗誦者 البقاعي(#AIND-D00207) を師としていたため #NEEDID に是正。朗誦者を relation にしない扱いは D00441（師=سارة のみ、朗誦者 شيخنا は note）と同じ。'
