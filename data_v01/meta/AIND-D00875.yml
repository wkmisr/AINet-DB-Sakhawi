translation:
  ja: アフマド・ブン・アブド・アル＝カリーム・ブン・アル＝バシーリー・アル＝ムワッキイ。ハーキム・モスクのバーブ・ズィヤーダ近くに住居を構えた。892年ジュマーダー・アル＝ウーラー17日に死去した。著名な学者たちと交友があり、また『ナサーイー大スナン』を、アル＝ビカーイーの朗誦により（無名の）一団の師たちから聴聞し、（アル＝ビカーイーの）もとに足しげく通った。
  en: Ahmad b. Abd al-Karim b. al-Bashiri al-Muwaqqi'. He resided near Bab Ziyada of Jami' al-Hakim. He died on the 17th of Jumada al-Ula in the year 892 H. He associated with prominent scholars, and heard al-Nasāʾī al-Kabīr under a group (of unnamed shaykhs), with al-Biqāʿī as the reciter, and frequented him (al-Biqāʿī).
