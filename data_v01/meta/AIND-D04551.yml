translation:
  ja: アブドゥッラー、バイト・アル＝マクディスで名高いシャイフ、ムハンマド・ブン・アフマド・ブン・アブド・アッラフマーン——アブド・アッラフマーンではなくウスマーン・ブン・ウマルとも言われる——の息子、アッ＝トゥルキスターニー、アル＝クルミーとして知られる。少しばかり学問に従事し、ハラブに来て、次いでバグダードに入り、ランク（ティムール）軍のもとで捕虜となったのち解放された。一説には、彼に苦難が降りかかり、そのために自ら首を絞めて死んだと言われ、それが人々の間に広まった。それは806年末のことである。我らがシャイフ（イブン・ハジャル）がその『インバー』で述べている。
  en: ʿAbd Allāh, son of the shaykh famous in Jerusalem (Bayt al-Maqdis), Muḥammad b. Aḥmad b. ʿAbd al-Raḥmān — or, as is also said, b. ʿUthmān b. ʿUmar — al-Turkistānī, known as al-Qirimī. He studied a little, came to Aleppo and then entered Baghdad, where he was taken captive by the Timurid (Lankī) forces and later released. It is said that a tribulation befell him, on account of which he strangled himself, as was widely reported among the people; that was at the end of the year 806. Our shaykh (Ibn Ḥajar) said so in his Inbāʾ.
