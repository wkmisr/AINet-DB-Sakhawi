notes:
- text: '「الناصري نسبة لتاجره الخواجا ناصر الدين」＝ニスバ الناصري は彼を売った奴隷商人ホワージャ・ナースィルッディーンに由来する。奴隷商人は主人（patron）ではなく、repo に「تاجره」の relation 先例は無い（D06197 も note のみ）ので relation を立てない（初版の patron #NEEDID を除去）。corpus にこの商人の本伝は見当たらない（hw.py「الخواجا」「ناصر الدين」）。'
  lang: ja
  type: editorial
translation:
  ja: クズル・アン＝ナースィリー——（このニスバは）彼の（奴隷）商人ホワージャ・ナースィルッディーンにちなむ——アッ＝ザーヒリー・バルクーク。槍術の教授とその技において第一人者であった。諸政権のもとで昇進を重ね、アル＝ムアイヤドの時代には一時ムカッダムとなったが、辞職して自邸に籠り、820年代のある年に没した。アッラーの慈悲あれ。
  en: Kuzul al-Nāṣirī, the nisba being after his (slave-)merchant al-Khawājā Nāṣir al-Dīn, al-Ẓāhirī Barqūq. He was a leading master in the teaching and practice of the lance. He rose under successive regimes until, in the days of al-Muʾayyad, he became a muqaddam for a time; then he resigned and kept to his house until he died in one of the years of the 820s. May God have mercy on him.
