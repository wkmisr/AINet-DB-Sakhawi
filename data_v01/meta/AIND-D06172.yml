translation:
  ja: ファラジュ・アッ＝ザンジー、後述のムハンマド・ブン・アリー・ブン・アフマド・アッ＝シュグリーの奴隷（ファター）。主人は彼に心を配り、数種の入門書とともに『ナワウィーの四十ハディース』『ブルダ』などを暗記させた。私の第3回マッカ滞在（ムジャーワラ）の折に、彼は私に（暗誦を）提示し、マッカで私からいくつかのものを聴聞した。
  en: Faraj al-Zanjī, the slave (fatā) of Muḥammad b. ʿAlī b. Aḥmad al-Shughrī, who will come below. His master took care of him and had him memorize several primers together with al-Nawawī's Forty (Ḥadīths), al-Burda and other works. He recited to me and heard several things from me in Mecca during my third sojourn (mujāwara).
