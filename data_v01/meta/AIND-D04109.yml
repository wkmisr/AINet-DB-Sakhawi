translation:
  ja: アブドゥルカーディル・ブン・アビー・アル＝バカー・アル＝ガズーリー。学生たちと席を競い、いくつかの学問的諸問題に通じていた。さらにはサルガトミシヤ・マドラサなどに席（扶持）を得た。私（サハーウィー）と、特にマッカ滞在（ムジャーワラ）や講義において頻繁に会合を持ったが、それだけに留まらず、バルスバーイ・カラーやタンバク・アル＝ジャマーリーといった多くのアミール（トルコ人）たちとも交際した。しかし、いずれのグループ（学者とアミール）からも大きな利益を得ることはなかった。［ヒジュラ暦897］年に海路を旅し、その年のハッジ巡礼団長（アミール・アル＝マフマル）を務めた後者（タンバク）の荷物搬送の差配に当たった。
  en: ʿAbd al-Qādir b. Abī al-Baqāʾ al-Ghazūlī. He used to compete with students and was familiar with some scholarly questions. He held a position in the Ṣarghatmashiyya Madrasa among others. He associated with me frequently, especially during his stay (jāwara) and lessons in Mecca. He also socialized with many Turks (Mamluk amirs) such as Barsbāy Qarā and Tanbak al-Jamālī, though he did not gain much benefit from either group. In the year 897 AH, he travelled by sea, managing the transport of the latter (Tanbak), who was the commander of the pilgrimage caravan (Amīr al-Maḥmal) that year.
