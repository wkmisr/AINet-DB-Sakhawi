translation:
  ja: カシュタムル・アル＝ムアイヤディー・シャイフ。彼（アル＝ムアイヤド・シャイフ）のハースィキーの一人で、小ダワーダールの一人。その死後、その子アル＝ムザッファル・アフマドの名でアレクサンドリアのナーイブ（代官）となったが、タタルが自身のダワーダールのファーリスをもって彼を解任し、次いで彼を捕らえて投獄した。やがてアル＝アシュラフ（バルスバーイ）が彼を釈放してアレッポのアターバクに任じ、彼はアレッポに赴いてそこに留まり、830年にトルクメンとアレッポ軍との間に起こった戦闘で戦死した。赤毛で中背、物静かで、悪くない人物であった。
  en: Qashtamur al-Muʾayyadī Shaykh. He was one of his (al-Muʾayyad Shaykh's) khāṣṣakīs and one of his junior dawādārs. After his (master's) death he served as governor (nāʾib) of Alexandria on behalf of his son al-Muẓaffar Aḥmad; Ṭaṭar removed him, replacing him with his own dawādār Fāris, then arrested and imprisoned him, until al-Ashraf (Barsbāy) released him and made him atābak of Aleppo. He went there and remained until he was killed in a battle between the Turkmens and the army of Aleppo in the year 830. He was fair-haired, of medium build, calm, and not a bad man.
