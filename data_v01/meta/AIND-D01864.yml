translation:
  ja: アルカマース。ヤルブガー・アル＝ムザッファリーがアタベク職に就く以前にそのダワーダールを務め、次いでヤシュバク・アル＝アアラジュ・アッ＝サーキーのアタベク在任期にそのダワーダールとなった。彼は政治に長け、事柄をよく知り、その行いは称賛され、悪が少なかった。また、クトゥルブガー・ハッジーが亡くなった後、ワクフ（寄進財産）の監督職（ナーズィル・アル＝アウカーフ）に就いた。彼は841年ムハッラム月に死去した。我らがシャイフ（イブン・ハジャル）が『インバーウ』でそう述べている。
  en: Arkamās served as the dawādār of Yalbughā al-Muẓaffarī before the latter's establishment in the atabakiyya, and then as the dawādār of Yashbak al-Aʿraj al-Sāqī during his atabakship. He was skilled in governance, knowledgeable in affairs, of praiseworthy conduct, and had little malice. He also took over the supervision of awqāf after the death of Quṭlūbughā Ḥajjī. He died in Muḥarram of the year 841 H. Our shaykh (Ibn Ḥajar) said so in his Inbāʾ [al-Ghumr].
