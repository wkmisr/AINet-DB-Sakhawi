translation:
  ja: アリー・ブン・ムハンマド、アン＝ヌール・アル＝ウィーシー（ワーウにカスラ、ヤーは無母音、次いで点付きのシーン）、のちにアル＝カーヒリー。学問を志して大いに励み、美しい筆跡で非常に多くを書写したが、その後、評価額の証人業に手を染めて奇怪な事柄に入り込み、虚偽の証言で悪名を得た。845年ズー・アル＝カアダ月に没した。神が彼を赦したまわんことを。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: ʿAlī b. Muḥammad, al-Nūr al-Wīshī (with kasra on the wāw, sukūn on the yāʾ, then shīn), then al-Qāhirī. He had sought knowledge, studied much and copied a great deal in his fine hand; then he took up testifying in valuations, entered into strange dealings and became notorious for false testimonies. He died in Dhū al-Qaʿda 845; may God pardon him. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
