translation:
  ja: アハマド・ブン・アブドゥッラー・ブン・イスマーイール・ブン・アル＝アフマル。 アル＝マイドゥーミーから伝承した。 我らがシャイフ（イブン・ハジャル）の師であるアル＝タキー・アブー・バクル・アル＝カルカシャンディーが彼（アハマド・ブン・アブドゥッラー）から『イブラーヒーム・ブン・サアドの書』を804年に聴聞し、我々にそれを伝達した。
  en: Aḥmad b. ʿAbd Allāh b. Ismāʿīl b. al-Aḥmar. He transmitted from al-Maydūmī. Our shaykh (Ibn Ḥajar)'s teacher, al-Taqī Abū Bakr al-Qalqashandī, heard 『Nuskhat Ibrāhīm b. Saʿd』 from him (Aḥmad b. ʿAbd Allāh) in the year 804 H, and then transmitted it to us (al-Sakhāwī).
