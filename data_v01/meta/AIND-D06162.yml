translation:
  ja: ファラジュ・ブン・スィキズバーイ——（父名は）無点の字（スィーン）、ついでカーフ（ともにカスラ）、その後にスクーンのザーイ、ついで一点のバー——、アッ＝ザイン・アル＝ムアイヤディー。（アル＝ムアイヤド・）シャイフがアミール時代に彼を養育し、スルターンに即位すると彼をハーッサキー（近侍）に、ついで十人長アミールにし、その美貌ゆえに側近くに置いたので、ついには政権の有力者の一人となった。背が高く、髭が薄く、容姿が美しい美男であった。長患いの末、824年サファル月4日にカイロで没した。マクリーズィーとアイニーらが彼に言及している。
  en: Faraj b. Sikizbāy — with undotted sīn and kāf, both with kasra, then a quiescent zāy, then a bāʾ with one dot — al-Zayn al-Muʾayyadī. Shaykh (al-Muʾayyad) brought him up during his amirate, and when he became sultan he made him a khāṣṣakī, then an amir of ten, and kept him close on account of his beauty, until he became one of the notables of his regime. He was tall, thin-bearded, of handsome appearance and good-looking. He died on 4 Ṣafar 824 in Cairo after a long illness. Al-Maqrīzī, al-ʿAynī and others mentioned him.
