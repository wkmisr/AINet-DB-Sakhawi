    ja: '日曜に الخبت で死に、月曜の夜（ليلة الاثنين＝日曜の日没後）、893年ラビーウ・アッ＝サーニー月24日にマッカへ運ばれた。h2g.py: 893-04-24＝1488-04-16（月曜）で原文の曜日と一致、原文の日付「رابع عشرى ربيع الثاني」は遺体搬入の「ليلة الاثنين」にかかり、死亡は「في يوم الأحد」とのみ言う＝死亡日は24日の前日の日曜（893-04-23＝1488-04-15、h2g.py）の可能性が高いが、それより前の日曜の可能性も残る。【集約 2026-11-03】このため death は月精度（893年ラビーウ・アッ＝サーニー月＝1488-03-24〜04-21、h2g.py → @when 1488-03）とし、日付の推定はここに記す（校閲時の日精度 0893-04-23／1488-04-15 を改めた。内容B L、オーケストレーター決定16）。「وقد جاز العشرين」＝20歳余（兄 هيزع の本伝 D10184 は869／870年生と記し、本項主はその弟）＝生年を作らず note。الخبت＝マッカ南方イエメン方面の地（#AIND-D09954「مات … بالخبت من ناحية اليمن وجيء به فصلي عليه عند باب الكعبة」）、ID-Master 未登録 → 新規 TMP-L-00393。葬礼はマッカ（「بمكة فصلى عليه」）、埋葬は المعلاة（wd:Q42004）。【集約 2026-11-03】原文明記の「مكة」（遺体の搬入・葬礼地。gn:104515、type burial＝D10000・D10011 と揃えた）を placeName に補った（規則22(2)、機械 L、オーケストレーター決定17）。'
