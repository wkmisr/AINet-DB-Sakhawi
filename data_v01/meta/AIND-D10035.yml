translation:
  ja: ムハイザウ・ブン・ムハンマド・ブン・バラカート・ブン・ハサン・ブン・アジュラーン、後述のハイザウの実の兄弟（同父同母）で、クンヤはアブー・アル＝ガイス。日曜日にアル＝ハブトで没し、（8）93年ラビーウ・アッ＝サーニー月24日月曜の夜にマッカへ運ばれ、朝の礼拝ののち葬礼が行われ、それからアル＝マアラー（墓地）へ運ばれた。20歳を過ぎたばかりであった。
  en: Muhayziʿ b. Muḥammad b. Barakāt b. Ḥasan b. ʿAjlān, full brother of Hayziʿ (who follows), with the kunya Abū al-Ghayth. He died at al-Khabt on a Sunday and was brought to Mecca on the night of Monday, 24 Rabīʿ II of the year [8]93; the funeral prayer was said over him after the dawn prayer and then he was taken to al-Muʿallā. He had just passed twenty.
