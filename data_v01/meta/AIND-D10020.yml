translation:
  ja: 別のマンスール。アル＝ムアイヤド・アフマド・ブン・イーナールの、父を同じくする兄弟。897年ジュマーダー第二月にペストで没した。彼はジャウク（合同読誦）で首席として読誦していた。アッラーが彼に楽園をもって報いられますように。
  en: Another Manṣūr, a brother of al-Muʾayyad Aḥmad b. Īnāl on the father's side. He died of the plague in Jumādā II 897. He used to recite in the jawq (choral recitation) as its leader. May God recompense him with Paradise.
