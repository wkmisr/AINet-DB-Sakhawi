notes:
- text: '転送見出し（原文末尾「مضى فيمن جده أبو بكر」による）。転送先は #AIND-D05945「عمر بن عمر بن أبي بكر السراج أو الزين الصفدي ثم النيني ثم القاهري نزيل المنكوتمرية الشافعي」（826年ジュマーダー・アル＝ウーラー月カイロ没。本バッチ時点で未受領＝Individuals・B104-108 受領物のいずれにもない。検証後訂正 2026-10-10: 校閲時の「B108 で収録済み」は誤り）。عمر 部で祖父 أبو بكر を持ち الصفدي・النيني を名乗る項は D05945 のみ。ただし本見出しの父名は محمد、D05945 の父名は عمر で**食い違う**（D05945 の「السراج أو الزين」は本項主のラカブで、本見出しでは「ابن الزين」と父のラカブとして読める）。サハーウィーが同一人物に複数の見出しを立てる際に父名の異伝を併記する例（D06025／D05888／D06013）に準じ、唯一の候補 D05945 を転送先とし、父名の相違をここに記録する（規則25）。'
