translation:
  ja: フサイン・ブン・アフマド・アッ＝サラーウィー・アル＝アジャミー、商人。メッカにしばらくの間隣住（ジャーワラ）し、メッカの泉の整備などのための遺贈を遺した。811年ジュマーダー・アル＝アーヒラに没し、アル＝ムアッラー墓地に埋葬された。推定で70歳に達していたか、それを超えていた。アル＝ファースィーが彼について言及している。
  en: Ḥusayn b. Aḥmad al-Sarāwī al-ʿAjamī, the merchant. He resided in Mecca as a neighbor (jāwara) for a period of time and left a bequest for the maintenance of the spring of Mecca (ʿAyn Makka). He died in Jumada al-Akhira, 811 AH, and was buried in al-Muʿallā. He was estimated to have reached or exceeded seventy years of age. Al-Fāsī mentioned him.
