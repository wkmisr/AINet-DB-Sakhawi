translation:
  ja: カイロ定住者である、イエメンのハドラマウト出身で後にメッカ住民となったアフマド・ブン・ウクバ。多くの人から信仰された者の一人。彼は永くカイロに留まり、895年シャッワールにサフラーの墓地で亡くなった。
  en: Ahmad b. ʿUqba al-Yamānī al-Ḥaḍramī, then al-Makkī, resident of Cairo. One of those believed in by many people. He remained in Cairo for a period until he died in Shawwal of the year 895 H, in a desert cemetery.
