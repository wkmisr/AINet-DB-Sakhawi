translation:
  ja: イスマーイール。宮殿のイマームの一人。880年ムハッラム月にアル＝マクシャラで死去。彼は数日前からそこに収監されていたが、それは彼が人々の女奴隷を盗み、それを地方の村々で売った疑いをかけられたためで、それもワーリー、次いでスルターンによる拷問の後であった。
  en: Ismāʿīl, one of the imams of the palace. He died in Muharram of the year 880 H at al-Maqshara. He had been imprisoned there for some days, having been accused of attempting to steal people's slave girls and selling them in rural villages, after having been beaten by the governor (wālī) and then the sultan.
