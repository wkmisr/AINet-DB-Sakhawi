  ja: ムハンマド・ブン・アリー・ブン・ムーサー・ブン・イーサー・ブン・イムラーン・アル＝マッキー。アル＝ムザッリク（マズラク）として知られる。833年ジュマーダー・アッ＝サーニヤ月にマッカで没した。
