translation:
  ja: スライマーン・ブン・ムハンマド・ブン・イーサー・ブン・アフマド・アル＝ヒンディー・アル＝アフマダーバーディー・アル＝ハナフィー、先述のラージフの（父方の）叔父。840年に生まれ、諸学に取り組んで頭角を現した。前述のその甥（ラージフ）が彼から学んだことは、彼（甥）の項で先に述べたとおりであり、また彼（スライマーン）は、894年に彼（甥）が私から私の『アルフィーヤ註釈』を受けた際、その一部の書写を手伝った。彼は私と幾度も会った。
  en: Sulaymān b. Muḥammad b. ʿĪsā b. Aḥmad al-Hindī al-Aḥmadābādī al-Ḥanafī, paternal uncle of the aforementioned Rājiḥ. He was born in the year 840, applied himself to various sciences and distinguished himself. His nephew just mentioned studied under him, as I set forth in his (the nephew's) entry, and he (Sulaymān) helped him (Rājiḥ) in copying a portion of my commentary on the Alfiyya when he (Rājiḥ) took it from me in the year [8]94. He met with me more than once.
