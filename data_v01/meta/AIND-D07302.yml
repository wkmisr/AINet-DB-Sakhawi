translation:
  ja: ムハンマド・ブン・ジャルバーシュ・クルト・アル＝ムハンマディー・アル＝ナースィリー・ファラジュ。彼の父の主人であるアル＝ナースィル［・ファラジュ］の外孫（スィブト）で、母はシャクラーウ。839年頃に生まれ、両親の庇護のもとで育ち、859年に第一巡礼隊のアミール（アミール・アッ＝ラクブ・アル＝アウワル）として旅立った。私がマッカに不在であった88［…］年（一の位欠字）に没した。素行は悪かったが、向こう見ずで大胆であった。
  en: Muḥammad b. Jarbāsh Kurt al-Muḥammadī al-Nāṣirī Faraj, the daughter's son of al-Nāṣir [Faraj], the master of his father; his mother was Shaqrāʾ. He was born approximately in the year 839 and grew up in the care of his parents, and he set out as commander of the first pilgrim caravan in the year 859. He died while I was away in Mecca, in the year [...] and eighty (digit missing in the text). He was of bad conduct, bold and daring.
