translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・アブー・バクル。ブルハーン・アッ＝ディーン・アッ＝ディマシュキー・アッ＝シャーフィイー。公正な人物。イブン・アル＝ハッダードとしても知られた。ヒジュラ暦785年にハーフィズのアブー・バクル・イブン・アル＝ムヒッブから『アワーリー・アブー・ヤアラー・アッ＝サーブーニー』の最初の半分を聴聞し、伝承した。学者たちが彼から聴聞した。彼は近しい公正な人物だったが、死去した。
  en: Ibrāhīm b. Muḥammad b. Abī Bakr, Burhān al-Dīn al-Dimashqī al-Shāfiʿī, the just. Known as Ibn al-Ḥaddād. In 785 AH, he heard the first half of `Awālī Abī Yaʿlā al-Ṣābūnī from al-Ḥāfiẓ Abū Bakr b. al-Muḥibb and transmitted it. Scholars heard from him. He was a close and just person who passed away.
