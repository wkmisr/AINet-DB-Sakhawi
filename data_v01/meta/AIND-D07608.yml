translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・ムハンマド・ブン・ムハンマド・ブン・ヤフヤー、アル＝ムヒッブ・ブン・アッ＝ザイン・ブン・アッ＝タージュ、サンダビース出自のアル＝カーヒリー、アッ＝シャーフィイー。アル＝ムアイヤディーヤのスーフィーの一人。873年ズー・アル＝カアダ月9日日曜日に没し、壮年に達しなかった。善良な人物で、商業で生計を立て、父からわずかに学んだ者の一人である。アッラーが彼を憐れみたまえ。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. Muḥammad b. Yaḥyā, al-Muḥibb b. al-Zayn b. al-Tāj, of Sandabīs origin, al-Qāhirī al-Shāfiʿī, one of the Sufis of al-Muʾayyadiyya. He died on Sunday 9 Dhū al-Qaʿda 873 without having reached middle age. He was a good man who earned his living by trade, and was among those who learned a little from his father. May God have mercy on him.
