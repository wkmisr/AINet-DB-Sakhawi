translation:
  ja: フサイン・ブン・ムハンマド・ブン・アッ＝シャイフ・ラージーン・アル＝バドル・ブン・アッ＝シャムス・アル＝ウカビー・アッ＝サフラーウィー。サフラー（砂漠）のジャマール・アッ＝ディーン廟で生まれた。一団の人々が彼にイジャーザを与えた。そのうちにはアーイシャ・イブナ・イブン・アブド・アル＝ハーディーや、学問を受けるに足る人々のうちに数えられるアッ＝ザイン・リドワーンの娘がいる。彼は私たち（サハーウィー）にイジャーザを与え、ヒジュラ暦884年には存命であった。
  en: Ḥusayn b. Muḥammad b. al-Shaykh Lājīn, al-Badr b. al-Shams al-ʿUqabī al-Ṣaḥrāwī. He was born in the Turbah of Jamāl al-Dīn in the Desert (al-Ṣaḥrāʾ). A group of scholars granted him ijāza (scholarly license), including ʿĀʾisha bint Ibn ʿAbd al-Hādī and the daughter of al-Zayn Riḍwān. He granted us (al-Sakhāwī) an ijāza, and he was still alive in the year 884 AH.
