translation:
  ja: カースィム・ブン・ジュムア、アッ＝ザイン・アル＝カサースィー・アル＝ハラビー。かつてその（アレッポの）城塞の代官（ナーイブ）およびそのアタベクであった。863年ラマダーン月にそこで没した。その両職への就任は金銭の供与によるものであった。
  en: Qāsim b. Jumʿa, al-Zayn al-Qasāsī al-Ḥalabī, formerly deputy (nāʾib) of its (Aleppo's) citadel and its atābak. He died there in Ramaḍān 863. His appointment to both offices had been obtained by payment (bribery).
