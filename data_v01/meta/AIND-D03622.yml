translation:
  ja: アブドゥルラフマーン・ブン・ハサン・アッ＝ザイン・ブン・アッ＝シャイフ・アル＝ハーリディー。のちに言及されるアブドゥルサラームの兄弟で、嘘つき（アル＝カッザーブ）として知られる。ヒジュラ暦842年ズルヒッジャ月（12月）にマッカにて没し、アル＝ムアッラーのラーマシュト廟に埋葬された。
  en: ʿAbd al-Raḥmān b. Ḥasan al-Zayn b. al-Shaykh al-Khālidī. Brother of ʿAbd al-Salām, who is mentioned below, and he was known as al-Kadhdhāb (the liar). He died in Dhu al-Hijjah in the year 842 AH in Mecca, and was buried in the tomb of Rāmasht in al-Muʿallā.
