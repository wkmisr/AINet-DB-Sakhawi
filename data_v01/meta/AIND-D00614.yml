translation:
  ja: アブー・バクル・ブン・ムハンマド・ブン・アリーの息子、シャハーブ・アル＝マースーキー・アル＝ワーダーニー。出身はマグリブ人で、マディーナで生まれ、そこに在住し、またマッカにも在住した。その後、マディーナに隠棲した。彼はマディーナで私（サハーウィー）に聴聞した者の一人であり、カイロに何度も訪れている。彼は大胆な性格であった。
  en: Shihāb al-Masūqī al-Wādānī, son of Abū Bakr ibn Muḥammad ibn ʿAlī. He was originally from the Maghrib, born in Medina, and resided there and in Mecca. Later, he secluded himself in Medina. He was among those who heard from me (al-Sakhāwī) there in Medina. He visited Cairo several times. He possessed courage.
