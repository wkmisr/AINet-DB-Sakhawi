    ja: '原文「محمد بن سعيد الشمس الوراق أبوه وأحد التجار هو」＝本項主はアッ＝シャムス（ムハンマドの通例のラカブ شمس الدين）で、父はワッラーク（紙商・写本商）、本人は商人の一人（要判断_B88 §D-b1。同構文の D01257「أحمد بن محمد بن أحمد الشهاب الذهبي أبوه … ويعرف بابن الذهبي」でも見出し直後のラカブは本項主のもの）。父は職名のみで名不詳（「أظنه نسب لجده」により سعيد は祖父の名）。corpus に該当本伝なし（「الشمس الوراق الحنبلي」D09238 の師はハマー系で別人。TMP-P-000927「الشمس محمد بن أحمد الوراق المؤذن」は D04173 の父＝ナサブ不一致、TMP-P-000396「الوراق」は D01099 の師＝マーリク派法学者で別人）。職名のみのため #NEEDID 維持（規則3）。'
