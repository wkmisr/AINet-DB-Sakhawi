translation:
  ja: ムハンマド・ブン・サイード・アッ＝シャムス。父はワッラーク（紙商）であり、彼自身は商人の一人であった。マッカなどへ旅した。私（サハーウィー）は、彼が祖父の名にちなんで呼ばれているのだと思う。888年ジュマーダー・アッ＝サーニヤ月に没した。50歳には達していなかったと思う。軽率な人物であった。神よ彼に慈悲を。
  en: Muḥammad b. Saʿīd, al-Shams. His father was a paper-seller (warrāq), and he himself was one of the merchants. He travelled to Mecca and elsewhere, and I think he was named after his grandfather. He died in Jumādā al-Thāniya of the year 888, and I do not think he had reached fifty. He was a reckless man; may God have mercy on him.
