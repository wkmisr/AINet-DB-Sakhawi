notes:
- text: '転送見出し（原文末尾「مضى فيمن جده أحمد بن علي بن عبد الله」による）。転送先は #AIND-D06607「محمد بن أحمد بن أحمد بن علي بن عبد الله بن علي ناصر الدين بن الشهاب ابن الطولوني المعلم ابن المعلم الماضي أبوه … كان يلي معلمية السلطان」（801年没、未受領）。ナサブ（祖父 أحمد بن علي بن عبد الله）が一致。本見出しの「المهندس」は転送先では「المعلم」（スルタンの معلمية＝建築総監）に相当する。'
  type: reference
translation:
  ja: ムハンマド・ブン・アフマド・ブン・アッ＝トゥールーニー、技師（アル＝ムハンディス）。祖父がアフマド・ブン・アリー・ブン・アブドゥッラーである者たち（の部）で前述した。
  en: Muḥammad b. Aḥmad b. al-Ṭūlūnī, the engineer (al-muhandis). He has been mentioned above among those whose grandfather is Aḥmad b. ʿAlī b. ʿAbd Allāh.
