translation:
  ja: ムハンマド・ブン・ズィマーム、アブー・ズィマーム、アル＝フルティー──アル＝フルートと呼ばれる部族への帰属名──、次いでアル＝マーリキー──マグリブのバヌー・マリクへの帰属名。善良な人であった。866年サファル月に没した。マグリブ出身の我らの同輩の一人が私に伝えてくれた。
  en: Muḥammad b. Zimām, Abū Zimām, al-Khulṭī, a nisba to a tribe called al-Khulūṭ, then al-Mālikī, a nisba to the Banū Malik of the Maghrib. He was a righteous man. He died in Ṣafar of the year [8]66. One of our Maghribi companions informed me of this.
