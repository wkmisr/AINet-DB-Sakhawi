  ja: アブドゥルマジード・ブン・アリー・ブン・ムハンマド・ブン・アフマド・ブン・ハサン・ブン・アッ＝ザイン・ムハンマド・ブン・アル＝アミーン・ムハンマド・イブン・アル＝クトゥブ・ムハンマド・ブン・アフマド・ブン・アリー・アル＝カスタッラーニー。（8）36年に一群の人々が彼にイジャーザを授けた。イブン・ファハドが彼に言及し、彼のために余白を残した。
  en: ʿAbd al-Majīd b. ʿAlī b. Muḥammad b. Aḥmad b. Ḥasan b. al-Zayn Muḥammad b. al-Amīn Muḥammad b. al-Quṭb Muḥammad b. Aḥmad b. ʿAlī al-Qasṭallānī. In (8)36 a group of scholars granted him an ijāza. Ibn Fahd mentioned him and left a blank space for him.
