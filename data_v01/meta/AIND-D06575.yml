notes:
- text: '転送見出し（原文「فيمن جده أحمد بن أبي بكر」による）。転送先は #AIND-D06465「848 محمد بن إبراهيم بن أحمد بن أبي بكر بن عبد الوهاب الجمال أبو عبد الله وأبو المحاسن وأبو حامد الفوي الأصل المكي الحنفي والد عبد الأول وعبد الرحمن وأخو عبد الواحد ويعرف بالمرشدي . ولد في ربيع الأول سنة سبعين بمكة」（repo 未収録）。名・父名・祖父「أحمد بن أبي بكر」・ラカブ الجمال・通称 المرشدي が一致。corpus 見出しで「محمد بن إبراهيم」＋「المرشدي」に当たる本伝はこの1件（hwm.py。ほかは子 #AIND-D03480・#AIND-D03726・#AIND-D04543 と孫 #AIND-D05209）。'
