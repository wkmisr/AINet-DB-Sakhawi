translation:
  ja: アフマド・ブン・マンスール・アッ＝シハーブ・アル＝マーリキー。アル＝カラーフィー（al-Qarāfī）の学派に属し、一般的に証言（al-shahāda）の訓練を受け、彼の門下で学び、その後、彼の息子アル＝バドル（al-Badr）に師事した。97年（ヒジュラ暦897年）サファル月に死去した。彼は功績に乏しい人物であった、アッラーが彼を許されますように。
  en: Aḥmad b. Manṣūr al-Shihāb al-Mālikī. He was among those who belonged to al-Qarāfī, and generally trained in legal witnessing (al-shahāda) and sat at his door, then attached himself to his son al-Badr. He died in Ṣafar in the year 897 H. He was a person devoid of merit, may God forgive him.
