translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・ヤフヤー・ブン・アフマド・ブン・スライマーン・ブン・ムハイブ、アッ＝サダカーウィー・アッ＝ザワーウィー、その地（ザワーワ）のマーリク派カーディー。息子のイブラーヒームと孫のムハンマドは先述。853年またはその前年に63歳で没した。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Yaḥyā b. Aḥmad b. Sulaymān b. Muhayb al-Ṣadaqāwī al-Zawāwī, the Mālikī judge of that place (Zawāwa), whose son Ibrāhīm and grandson Muḥammad were mentioned previously. He died in 853 or the year before, aged sixty-three.
