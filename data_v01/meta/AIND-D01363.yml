translation:
  ja: アブー・アル＝スルールの息子であるシャイフ・アブー・アル＝スルール・アフマド・ブン・ムハンマド・ブン・アブド・アル＝ラティーフ・ブン・アブー・アル＝スルール・アル＝ハサニー・アル＝ファーシー・アル＝マッキー・アル＝マーリキー。 彼は後述するアブド・アル＝ラティーフの兄弟であり、彼らの父も後述される。 私（サハーウィー）にカイロで覚書を提示し、父やその他（の人びと）の朗読を通して私から（ハディースを）聴聞した。 彼は現在（ヒジュラ暦897年）、ルーム地方かアレッポにいる。
  en: Aḥmad b. Muḥammad b. ʿAbd al-Laṭīf b. Abī al-Surūr, al-Shihāb Abū al-Surūr, son of al-Quṭb Abī al-Khayr, al-Ḥasanī, of Fāsī origin, al-Makkī, al-Mālikī. He is the brother of ʿAbd al-Laṭīf (to be mentioned later), and their father will also be mentioned. He presented his memorized texts to me (al-Sakhāwī) in Cairo and heard from me, through the recitation of his father and others. He is now, in the year 897, either in al-Rūm or Ḥalab.
