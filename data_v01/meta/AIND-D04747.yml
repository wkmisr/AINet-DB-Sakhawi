translation:
  ja: アブドゥルワーヒド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・アブドゥッラー、アッ＝ダミーリー・アル＝マッキー。既述のアブドゥルカリーム・ブン・ムハンマドの甥（兄弟の息子）。（8）85年ラジャブ月に同地（マッカ）で没した。イブン・ファハドがその没年月を記録している。
  en: ʿAbd al-Wāḥid b. Muḥammad b. Muḥammad b. Muḥammad b. ʿAbd Allāh, al-Damīrī al-Makkī, nephew (brother's son) of ʿAbd al-Karīm b. Muḥammad mentioned above. He died there (in Mecca) in Rajab (8)85; Ibn Fahd recorded his death.
