translation:
  ja: ムハンマド・ブン・イスマーイール・ブン・イブラーヒーム、ムヒー・アッ＝ディーン・ブン・アル＝マジュド・アル＝ムクラーニー。前述のアフマドの兄弟で、こちらが二人のうち優れている。家族とともにマッカで育ち、そこに住んで文法学・形態論・論理学などに励み、886年およびそれ以後そこ（マッカ）で私（サハーウィー）に師事した。理解力に加えて分別・落ち着き・礼儀を備え、イブン・アッ＝サイイド・アフィーフ・アッ＝ディーン家とのつながりがあり、年若い。その後故郷に戻り、私の思うところではそこ（マッカ）に再び戻ったが、いや、彼は今、兄弟および父とともにカンバーヤ近辺におり、父はその地の君主の子に教えている。
  en: Muḥammad b. Ismāʿīl b. Ibrāhīm, Muḥyī al-Dīn b. al-Majd al-Makrānī, brother of the aforementioned Aḥmad, and the better of the two. He grew up and settled in Mecca with his family, occupying himself with grammar, morphology, logic and other subjects, and he attended me there assiduously in the year 886 and thereafter. He has understanding together with good sense, composure and good manners, an attachment to the house of Ibn al-Sayyid ʿAfīf al-Dīn, and is young in years. He then returned to his homeland, and I think he came back to it (Mecca); rather, he is now in the region of Cambay, he and his brother and their father, who teaches a son of its ruler.
