translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・アフマド・ブン・イブラーヒーム・ブン・ジュムラ・ブン・ムスリム、アル＝カマール、マハッジャを本貫とするアッ＝ディマシュキー。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及して言った、「威厳ある富裕な名士であった。ディーワーン・アッ＝サブウの監督職を務め、のちにそれを辞した」。（八百）八年ムハッラム月に没した。
  en: 'Muḥammad b. ʿAbd al-Raḥmān b. Aḥmad b. Ibrāhīm b. Jumla b. Muslim, al-Kamāl, of Maḥajja origin, al-Dimashqī. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: "He was a dignified and wealthy notable; he held the supervision of the Dīwān al-Sabʿ and then gave it up." He died in Muḥarram of the year (8)08.'
