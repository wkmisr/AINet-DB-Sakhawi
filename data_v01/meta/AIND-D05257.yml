translation:
  ja: アリー・ベン・アブドゥッラー・ベン・ムハンマド、ファキーフ（法学者）、ヌール・アッ＝ディーン、児童教育者。ヒジュラ暦865年ムハッラム月2日に死去。一世紀（100歳）の長寿を全うしたと言われる。アル＝ムニールがその没年を記録した。
  en: ʿAlī b. ʿAbd Allāh b. Muḥammad, al-Faqīh, Nūr al-Dīn, a tutor of children. He died on the second of al-Muḥarram in the year 865, and it is said that he lived to be a hundred years old. Al-Munīr recorded his death date.
