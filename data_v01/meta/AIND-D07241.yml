notes:
- text: '転送見出し（原文「في ابن أبي بكر بن محمد بن عثمان بن أحمد بن عمر بن سلامة」による）。転送先は #AIND-D07243「محمد بن أبي بكر بن محمد بن عثمان بن أحمد بن عمر بن سلامة البدر المارديني ثم الحلبي الحنفي عالم حلب واخو حسن الماضي ، ويختصر من نسبه فيقال ابن أبي بكر بن سلامة ومرة ابن أبي بكر بن محمد بن سلامة」（未受領）。転送先本文が本見出しの短縮形「ابن أبي بكر بن محمد بن سلامة」を明記。同じ D07243 へ向く転送見出しに #AIND-D07185「محمد بن أبي بكر بن سلامة . فيمن جده محمد بن عثمان بن أحمد بن عمر」がある。'
