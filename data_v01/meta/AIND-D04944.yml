translation:
  ja: アリー・ブン・イブラーヒーム・ブン・ユースフ、ファークース出身で、アル＝ビルビースィー、シャーフィイー派。父は前述。善良で、きわめて純朴な性質の、ひどく困窮した人物。クルアーンを読誦し、アラビア語学などを少し学び、何年もかけて私（サハーウィー）のもとで『サヒーフ』の大部分を読誦した。同様にアッ＝ダイミーとアル＝バハー・アル＝マシュハディーのもとでも読誦し、それどころか自分の町では一般の人々に向けてそれを読み上げ、彼らは彼を篤く信頼していた。実に立派な人物である。
  en: ʿAlī b. Ibrāhīm b. Yūsuf, of Fāqūsī origin, al-Bilbīsī al-Shāfiʿī; his father has been mentioned above. A good man, of a very sound and simple nature, and extremely poor. He recited the Qurʾān and studied Arabic and other subjects a little, and read most of the Ṣaḥīḥ under me over several years. He likewise read it under al-Daymī and al-Bahāʾ al-Mashhadī; indeed he read it to the common people in his town, and they held him in great esteem. What a fine man he was.
