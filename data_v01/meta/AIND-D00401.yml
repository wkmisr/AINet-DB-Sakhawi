translation:
  ja: シャマーヒーおよびその周辺地域を支配するイブラーヒーム。803年にティムールがシャーム地方に入った際にハラブに入城した。その後、故国に戻り、その地の統治者として留まった。カラ・ユースフがタブリーズとその周辺地域を支配すると、イブラーヒームは軍隊を集めてカラ・ユースフとの戦いに備えたが、敗北した。しかし、カラ・ユースフがイブラーヒームを捕らえた後、彼を釈放し、その土地を与えた。イブラーヒームはそこに戻り、820年以降またはその頃に亡くなるまでカラ・ユースフの支配下にあった。イブン・ハティーブ・アン＝ナーシリーヤと、我らがシャイフ（イブン・ハジャル）が『インバーウ（アル＝グムル）』で言及しているが、ごく簡潔である。
  en: Ibrāhīm, the ruler of Shamākhī and its surrounding regions, entered Ḥalab in 803 AH when Timurlank entered the Syrian lands. He then returned to his homeland and continued as its ruler. When Qara Yūsuf seized Tabrīz and its surroundings, Ibrāhīm gathered his troops and prepared for battle, but he was defeated. However, after Qara Yūsuf captured him, he released him and returned his lands. Ibrāhīm returned there and remained under Qara Yūsuf's obedience until his death after 820 AH or around that time. Ibn Khaṭīb al-Nāṣiriyya mentioned him, as did our shaykh (Ibn Ḥajar) in his Inbāʾ (al-Ghumr), but very briefly.
