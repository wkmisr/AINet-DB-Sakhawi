translation:
  ja: バシュバーイ（「バーシュバーイ」の短縮形）。大ラアス・ナウバ（親衛隊長）。811年ジュマーダー・アル＝アーヒラ月に死去。アズハルで葬礼の礼拝が行われ、次いでスルターンがムサッラー・アル＝ムウミニーで礼拝を執り行い、アル＝カラーファに埋葬された。私（サハーウィー）は、彼がアル＝マシュハド・アル＝フサイニー近くのハーン（隊商宿）の所有者であったと思う。
  en: Bashbāy — a shortened form of Bāshbāy — a chief raʾs nawba (senior guard commander). He died in Jumādā al-Ākhira 811 H. The funeral prayer was performed over him at al-Azhar, then the Sultan prayed over him at the Muṣallā al-Muʾminī, and he was buried in al-Qarāfa. I (al-Sakhāwī) think he was the owner of the khān near al-Mashhad al-Ḥusaynī.
