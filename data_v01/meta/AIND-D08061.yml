translation:
  ja: ムハンマド・ブン・アリー・ブン・ハサン、アッ＝シャムス、アル＝カーヒリー、ハナフィー派。アル＝バドル・アル＝アイニーの姻戚（スィフル）で、アル＝アズハリーおよびイブン・アッ＝サッカーとして知られる。アル＝ビサーティーにウスール（法学原理論）などを読み、姻戚（アル＝アイニー）には彼の『シャワーヒド注釈』などを読み、彼の『ブハーリー注釈』を入手した。彼（アル＝アイニー）のもとでアフバース（ワクフ財）などの実務に携わった。私は彼が物静かな人であるのを見た。867年頃に没した。
  en: Muḥammad b. ʿAlī b. Ḥasan, al-Shams al-Qāhirī al-Ḥanafī, a relative by marriage (ṣihr) of al-Badr al-ʿAynī, known as al-Azharī and as Ibn al-Saqqāʾ. He read uṣūl and other subjects under al-Bisāṭī, and under his relative by marriage (al-ʿAynī) the latter's commentary on the Shawāhid and other works; he obtained his commentary on al-Bukhārī and served under him in the administration of the aḥbās (endowments) and other matters. I found him to be a quiet man. He died in about the year 867.
