translation:
  ja: ムハンマド・ブン・ジブリール・アッ＝サファウィー・アル＝ハナフィー、イブン・アル＝フマームの門下とシャイフーニーヤのスーフィーたちの中の優れた者の一人。彼は、私（サハーウィー）が彼の師（イブン・アル＝フマーム）のために編んだ『四十（ハディース）』を、私の朗読により彼の師から聴聞した。彼は一部の学生に教授し、それどころか、彼の師は彼に自著の法源学（ウスール）書への注釈を書くよう勧めたと言われる。856年ラビーウ・アル＝アーヒル月に没した。アッラーが彼を慈しみ給うように。
  en: Muḥammad b. Jibrīl al-Ṣafawī al-Ḥanafī, one of the accomplished men among the circle of Ibn al-Humām and the Sufis of al-Shaykhūniyya. He heard from his shaykh (Ibn al-Humām), through my (al-Sakhāwī's) reading, the Forty (ḥadīths) that I had compiled for him; he taught some students, and indeed it is said that his shaykh suggested that he write a commentary on his (the shaykh's) work on uṣūl. He died in Rabīʿ al-Ākhir 856, may God have mercy on him.
