translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド、バドル〔・ッディーン〕・アブー・ル＝バカー・アル＝アンサーリー・アッ＝サハーウィー、マリージュ出身でカイロの人、シャーフィイー派。母の父がシャリーフであったため「ハサニーの外孫」と称され、その母はカーディー・マジュド〔・ッディーン〕・イスマーイール・アル＝ハナフィーの娘であるので、マジュドの外孫でもある。バドル・アル＝アンサーリーとして知られる。810年ジュマーダー第1月11日土曜の夜にカイロで生まれ、そこで育ってクルアーンを暗記し、成年に近づくと学問に打ち込み、シハーブ・アッ＝タンティダーイーの晩年に間に合って彼から学び、シャラフ・アッ＝スブキーから法学で、アブー・ル＝ジュードから相続法で、我らの師イブン・ヒドルからその両方とアラビア語学で益を得た、ほか多数。我らの師〔イブン・ハジャル〕から少し聴聞し、次いで我々とともにラシーディーらから聴聞した。一時期は証人業で生計を立て、サイード・アッ＝スアダーなどの〔スーフィー職に〕就き、シハーブ・アッ＝シャトヌーフィーの息子らに教授した。算術と相続法に秀で、法学、アラビア語学などにも通じ、病がちで、世俗に淡泊でわずかで満足し、人と交わらず親しみやすく、中程度の詩と散文、著作があり、『タンキーフ・アッ＝ルバーブ注釈』と『ラフビーヤ〔注釈〕』などがある。私は彼の詩をいくつか書き留めた——「病と痛みを恐れて長らく食を控える者を私は不思議に思う／だが彼は火獄と叱責と恐怖を恐れて自らの罪を控えることは決してない」。869年ラジャブ月12日日曜に没した。神が彼と我々を憐れみたまえ。
  en: Muḥammad b. Muḥammad (×9), al-Badr Abū al-Baqāʾ al-Anṣārī al-Sakhāwī, of Malīj origin, Cairene, Shāfiʿī, "grandson of al-Ḥasanī" because his mother's father was a sharīf, his mother being a daughter of the judge al-Majd Ismāʿīl al-Ḥanafī, so that he was al-Majd's descendant too; known as al-Badr al-Anṣārī. Born on the night of Saturday 11 Jumādā I 810 in Cairo, he memorised the Qurʾān, took up study near puberty, caught al-Shihāb al-Ṭanṭadāʾī and took from him, and benefited from al-Sharaf al-Subkī in fiqh, Abū al-Jūd in inheritance law, and our shaykh Ibn Khiḍr in both and in Arabic, among others. He heard a little from our shaykh (Ibn Ḥajar), then with us from al-Rashīdī and the like. He earned for a time as a notary witness, held posts at Saʿīd al-Suʿadāʾ and elsewhere, and taught the son of al-Shihāb al-Shaṭanūfī and others. He excelled in arithmetic and inheritance law, with a share in fiqh and Arabic; sickly, ascetic, content with little, retiring and affable; of middling verse
    and prose, with works including a commentary on Tanqīḥ al-Lubāb and on al-Raḥbiyya. I wrote down some of his verse. He died on Sunday 12 Rajab 869.
