translation:
  ja: ムハンマド・ブン・アル＝マジュド・イスマーイール・ブン・イブラーヒーム・ブン・ムハンマド・ブン・アリー・ブン・ムーサー、アル＝キナーニー、ビルバイス出身でカイロ在住、ハナフィー派。父については前述した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及し、「父より2か月前、（8）02年の初めに没した。学問に励み、熟達していた」と述べている。
  en: 'Muḥammad b. al-Majd Ismāʿīl b. Ibrāhīm b. Muḥammad b. ʿAlī b. Mūsā al-Kinānī, of Bilbaysī origin, al-Qāhirī, the Ḥanafī; his father has been mentioned above. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: he died two months before his father, at the beginning of the year (8)02, and he had engaged in study and become proficient.'
