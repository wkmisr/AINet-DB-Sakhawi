translation:
  ja: アブドゥルラフマーン・ブン・アル＝ジャマール・ムハンマド・ブン・アフマド・ブン・アリー・アル＝ヒジャーズィー・アル＝シャリーフィー・アル＝アッタール。彼の父はマッカにおり、後述のアブドゥルラティーフの同母兄弟である。二人はアル＝タキー・イブン・ファハドから（ハディースを）聴聞した。
  en: Abd al-Rahman b. al-Jamal Muhammad b. Ahmad b. Ali al-Hijazi al-Sharifi al-Attar. His father, [who resided] in Mecca, was the full brother of Abd al-Latif, who is mentioned below. They both heard [hadith] from al-Taqi b. Fahd.
