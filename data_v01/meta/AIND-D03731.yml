notes:
- text: 【校閲】原文「الحجازي الشريفي **العطار أبوه بمكة** شقيق عبد اللطيف الآتي」の العطار は**父の職**（類型6-1 係り先の誤り）。初版は伝主のニスバ（ref に ID-Master 未登録の捏造ニスバ番号（00000 番）を付与）と伝主の office（#TMP-O-00012）に付け替えていたため両者を削除した。父=#AIND-D06750（…الحجازي الشريفي **العطار بمكة** …ووالد عبد اللطيف الماضي）、同母兄弟=#AIND-D04339（…شقيق عبد الرحمن الماضي **العطار أبوهما**）で双方向に閉合。初版の subtype="uncle" は شقيق の誤読。
