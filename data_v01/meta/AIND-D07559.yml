    ja: '父は見出しの「عبد الرحمن بن علي بن أحمد بن عبد العزيز … بن القاضي وجيه الدين」。corpus 唯一の同名本伝 #AIND-D03684（刊本第277項 عبد الرحمن بن علي بن أحمد بن عبد العزيز البهاء الهاشمي العقيلي النويري المكي المالكي、生773・没806、マッカで裁判代理）はナサブ4代・ニスバ・マッカ・カーディー職が一致するがラカブが البهاء（本項は وجيه الدين）。#AIND-D10835 の見出し「محمد بن عبد الرحمن بن علي بن أحمد بن عبد العزيز الفخر بن الكمال بن الوجيه」でも同人が الوجيه と呼ばれる。ラカブ不一致のため cert="medium"（ISSUES §De-2）。'
