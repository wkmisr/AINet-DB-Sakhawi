translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・アリー・ブン・アフマド・ブン・アブドゥルアズィーズ・ブン・アル＝カースィム・ブン・アブドゥッラフマーン・ブン・アル＝カースィム、アン＝ナジュム・ブン・アル＝カーディー・ワジーフッディーン・ブン・アル＝カーディー・ヌールッディーン、アル＝ハーシミー・アル＝ウカイリー・アン＝ヌワイリー・アル＝マッキー。母はアル＝カーディー・アブー・アル＝ファドル・アン＝ヌワイリーの娘ファーティマ。794年に生まれ、アッ＝タヌーヒー、アブー・アル＝ハイル・ブン・アル＝アラーイー、アブー・フライラ・ブン・アッ＝ザハビーらが彼にイジャーザを与えた。いつ没したかは私の知るところではない。
  en: Muḥammad b. ʿAbd al-Raḥmān b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz b. al-Qāsim b. ʿAbd al-Raḥmān b. al-Qāsim, al-Najm b. al-Qāḍī Wajīh al-Dīn b. al-Qāḍī Nūr al-Dīn, al-Hāshimī al-ʿUqaylī al-Nuwayrī al-Makkī. His mother was Fāṭima, daughter of al-Qāḍī Abū al-Faḍl al-Nuwayrī. He was born in 794. Al-Tanūkhī, Abū al-Khayr b. al-ʿAlāʾī, Abū Hurayra b. al-Dhahabī and others granted him ijāza. I do not know when he died.
