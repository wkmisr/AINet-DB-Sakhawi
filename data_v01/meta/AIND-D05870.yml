translation:
  ja: ウマル・ブン・アブド・アル＝アズィーズ・ブン・アブド・アッ＝サラーム、アッ＝シラージュ・アル＝アンサーリー・アッ＝ザランディー・アル＝マダニー・アッ＝シャーフィイー。父は863年サファル月に没し、この息子はその後に生まれた。マスウード・アル＝マグリビーのもとでアラビア語を、他の者のもとでその他を少し学んだ。マディーナで私（サハーウィー）に師事し、『アル＝マカースィド・アル＝ハサナ』を聴聞したうえでその写本を手に入れ、私は彼にイジャーザを書いた。その後894年の巡礼期に彼に会ったが、親しみは変わらないものの学問からは離れてしまっており、思うに彼はシャーヒーンか誰かと交わって、その行く末は褒められたものではなかった。
  en: 'ʿUmar b. ʿAbd al-ʿAzīz b. ʿAbd al-Salām, al-Sirāj al-Anṣārī al-Zarandī al-Madanī al-Shāfiʿī. His father died in Ṣafar of the year 863 and this son of his was born after that. He studied a little Arabic grammar under Masʿūd al-Maghribī and other subjects under others. He attended me (al-Sakhāwī) closely in Medina, obtained a copy of al-Maqāṣid al-ḥasana after hearing it, and I wrote him an ijāza. Then I saw him in the pilgrimage season of the year 894: he remained as affectionate as before, but had drifted away from his studies, and I think he had fallen in with Shāhīn or someone like him, so that his end was not praiseworthy.'
