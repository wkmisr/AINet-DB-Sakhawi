translation:
  ja: アブドゥルラフマーン・ブン・アフマド・ブン・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・アワド。アル＝イッズ、アブー・アル＝ファドル。アル＝バクリー、アッ＝シャーフィイー。前述の人物の兄弟であり、後述のアル＝ジャマール・ムハンマドの父親である。ヒジュラ暦781年に生まれ、父親のもとで法学を学び、ファトワーの発行を許可された。ヒジュラ暦807年に若くして亡くなった。この情報は彼の息子から得たものである。
  en: ʿAbd al-Raḥmān b. Aḥmad b. Muḥammad b. Aḥmad b. Muḥammad b. Aḥmad b. Muḥammad b. ʿAwaḍ, al-ʿIzz, Abū al-Faḍl, al-Bakrī al-Shāfiʿī. He was the brother of the person mentioned in the preceding entry, and the father of al-Jamāl Muḥammad, who is mentioned below. He was born in the year 781 AH, studied jurisprudence (fiqh) under his father, who authorized him to issue fatwas. He died at a young age in the year 807 AH. His son provided me with this information.
