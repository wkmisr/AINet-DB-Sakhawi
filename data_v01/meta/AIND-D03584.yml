    ja: '汚染番号TMP-P-000416(登録=汎用「الجمال محمد」、他バッチで別人へ流用歴あり)を解消。ナサブ「محمد بن عبد الرحمن بن أحمد بن محمد بن أحمد بن محمد بن أحمد بن محمد بن عوض」がcorpus #AIND-D07537「الجلال أبو البقاء محمد بن عبد الرحمن بن أحمد بن محمد...البكري」と完全一致するため同定。隣接する兄弟項 #AIND-D03583 も本人を「عم الجلال محمد بن عبد الرحمن بن أحمد الآتي」と呼び、ラカブは「الجلال」(本項原文の「الجمال」は異読/誤写の可能性)。【二次検証で確定】祖父の本伝#AIND-D01228(أحمد بن محمد بن أحمد بن محمد بن أحمد بن محمد بن عوض...جد الجلال محمد ابن عبد الرحمن الآتي。「أخذ عنه ابنه عبد الرحمن بل وحفيده الجلال」)を発見、父・子・孫三代の相互参照が全て確認できたためcert=highに確定(ラカブは「الجلال」が正、D03584原文の「الجمال」は誤写)。刊本 第4巻 p.57（第178・179項）／第7巻 p.284–285（第734項）で活字を目視確認。'
