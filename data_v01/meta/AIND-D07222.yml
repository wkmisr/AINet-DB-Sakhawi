translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ウマル・ブン・ウスマーン・ブン・アビー・バクル・ブン・ウマル・ブン・アブドゥッラフマーン・ブン・アブドゥッラー、アル＝バドル・アン＝ナーシリー。アブー・バクルとアリーの父。800年より後に没した。アブー・アル＝ハサン・アル＝ハズラジーが、760年に没した彼の父の伝記の中で彼から伝えるところでは、アル＝ムジャーヒドが巡礼した際に、彼（本項主あるいはその父）が巡礼の諸儀礼を詠み込んだカスィーダで彼（アル＝ムジャーヒド）を称えたという。
  en: Muḥammad b. Abī Bakr b. ʿUmar b. ʿUthmān b. Abī Bakr b. ʿUmar b. ʿAbd al-Raḥmān b. ʿAbd Allāh, al-Badr al-Nāshirī, the father of Abū Bakr and ʿAlī. He died after 800. Abū al-Ḥasan al-Khazrajī related on his authority, in the biography of his father, who died in the year 760, that when al-Mujāhid performed the pilgrimage he (the subject or his father) praised him with an ode into which he worked the rites of the ḥajj.
