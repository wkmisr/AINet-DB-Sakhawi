notes:
- text: '見出し「قانباي البهلوان آخر صاحب طرابلس」＝「もう一人の（آخر）カーンバーイ・アル＝バフラワーン、トリポリの人」。直前の転送見出し #AIND-D06259「قانباي البهلوان . هو الأبو بكري مضى」が指す #AIND-D06256「قانباي الأبو بكري الناصري فرج ويعرف بالبهلوان」（851 年ラビーウ第一月没、ハマー総督）とは、原文の「آخر」および没年（851 vs 861 の訃報）により別人。転送指示はないため実項（possible_identity も立てない）。初版の state「صاحب」（TMP-O-00163、retirement 861-01、placeName طرابلس）は「صاحب طرابلس」をトリポリの支配者職と読んだものだが、「آخر صاحب طرابلس」は同名者を区別する付記（トリポリにいた方）であり、本文の職はハージブ（الحجوبية）のみのため除去した。'
  lang: ja
  type: editorial
translation:
  ja: カーンバーイ・アル＝バフラワーン、もう一人の（同名者）、トリポリの人。861年ムハッラム月中旬に彼の訃報が届き、彼の代わりにシャーズバク・アッ＝サーリミーがハージブ職（フジュービーヤ）に就いた。
  en: Qānbāy al-Bahlawān, another one, the one of Tripoli. The news of his death arrived in the middle of Muḥarram of the year 861, and Shādhbak al-Ṣārimī was appointed in his place to the chamberlainship (ḥujūbiyya).
