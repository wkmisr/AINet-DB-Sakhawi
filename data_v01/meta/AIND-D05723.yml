translation:
  ja: アリー・ヌール・アッ＝ディーン・アル＝ブルッルスィー、のちアル＝アズハリー、マーリク派。アッ＝サンフーリーに師事（密着）した者の一人で、さらにアッ＝タキー・アッ＝シュムンニーらからも学んだ。公証人（シャーヒド）として座った。非常に貧しいが、信仰と善行に立ち返る人物である。
  en: ʿAlī Nūr al-Dīn al-Burullusī, then al-Azharī, the Mālikī. He was among those who closely attended al-Sanhūrī, and he also studied under al-Taqī al-Shumunnī and others. He sat as a notary-witness (shāhid). He is very poor, but is a man of religion and goodness.
