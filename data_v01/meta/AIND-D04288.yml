translation:
  ja: アブド・アル＝カリーム・ブン・ムハンマド・ブン・アワド・アル＝ジュッディー。不動産を持つ富裕な商人の一人。イブン・アズムは858年に彼を「カリーム・アッ＝ディーン、ジッダの首領（ザイーム）」と形容した。イブン・ファフドがその没年を記録し、847年にミナーにサビール（給水所）を建てたと述べている。
  en: ʿAbd al-Karīm b. Muḥammad b. ʿAwaḍ al-Juddī, one of the wealthy merchants who owned real estate. Ibn ʿAzm described him, in the year 858, as Karīm al-Dīn, the chief (zaʿīm) of Jidda. Ibn Fahd recorded his death and said that he built a public fountain (sabīl) at Minā in the year 847.
