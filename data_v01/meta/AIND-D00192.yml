translation:
  ja: イブラーヒーム・ブン・アリー・ブン・ムハンマド・ブン・イブラーヒーム。ブルハーン、アブー・イスハーク。ムカッダミー、アフブーリー、マルハーニー、ヤマニー。シャーフィイー派。私（サハーウィー）とマッカで会い、私にアル＝ナワウィーに帰せられる『アル＝ヒズブ』を朗誦し、また私からその他（の学問）を聴聞した。そして、私は彼にイジャーザを与えた。
  en: Ibrāhīm b. ʿAlī b. Muḥammad b. Ibrāhīm, al-Burhān Abū Isḥāq al-Muqaddamī al-Aḥbūlī al-Malḥānī al-Yamānī al-Shāfiʿī. He met me (al-Sakhāwī) in Mecca, recited to me al-Ḥizb attributed to al-Nawawī, and heard from me other subjects. And I granted him an ijāza.
