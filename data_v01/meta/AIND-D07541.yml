translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ザヒーラ・ブン・アフマド・ブン・アティーヤ・ブン・ザヒーラ・アル＝クラシー・アル＝マッキー。母はカーディー・スライマーン・ブン・アリー・イブン・アル＝ジュナイドの娘ハディージャ。幼くして没した。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Abī Bakr b. ʿAbd Allāh b. Ẓahīra b. Aḥmad b. ʿAṭiyya b. Ẓahīra al-Qurashī al-Makkī. His mother was Khadīja, daughter of the qāḍī Sulaymān b. ʿAlī b. al-Junayd. He died in childhood.
