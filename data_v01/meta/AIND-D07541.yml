    ja: '父＝#AIND-D03605（عبد الرحمن بن أبي بكر بن عبد الله بن ظهيرة بن أحمد بن عطية ابن ظهيرة وجيه الدين القرشي اليماني ثم المكي والد عبد الكريم وأبي بكر الآتيين、849年没）。ナサブ7代完全一致。同項は本項主を子として挙げないが、次項 #AIND-D07542（同父兄弟）の母 #AIND-D13356 の本伝「تزوجها ابن عمها عبد الرحمن بن أبي بكر بن عبد الله بن ظهيرة … واستولدها」で同一家系を確認。'
