translation:
  ja: アーミル・ブン・アブドゥルワッハーブ・ブン・ダーウード・ブン・ターヒル。前項の人物の兄弟の孫。父の跡を継いでイエメンを支配した。前項のバヌー・アーミルが彼に反対したが、彼の勢力は彼らを圧倒した。マドラサなどの建設やそのワクフ（寄進）の発展に努めた。基本的には善良な人物で、正しい信仰を持ち学者たちを愛したため、詩人たちから称賛された。
  en: ʿĀmir b. ʿAbd al-Wahhāb b. Dāwūd b. Ṭāhir, the grandson of the brother of his predecessor. He ruled Yemen after his father. The Banu ʿĀmir of his predecessor opposed him, but his power overcame them. He occupied himself with supervising madrasas and other institutions, constructing them and developing their endowments. He was generally virtuous, loved the scholars, possessed sound creed, and was praised by poets.
