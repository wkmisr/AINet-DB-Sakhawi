translation:
  ja: フサイン。サルウアのシャイフであり、そのシャイフの息子。ヒジャーズの支配者であるサイイドのもとへ向かう途中、バドルとヤンブーの間で没した。遺体はバドルに運ばれ、そこに埋葬された。没年は（ヒジュラ暦）886年。彼は東洋と西洋において極めて重んじられた人物であった。アシュラーフ（預言者の末裔）の一人であるアリー・ブン・ムハンマド・ブン・ガザンファルの息子。神が彼を赦されますように。
  en: Ḥusayn, the shaykh of Sarūʿa and the son of its shaykh. He died on his way to the Sayyid, the ruler of the Hijaz, between Badr and al-Yanbuʿ. He was then carried to Badr and buried there in the year 886 AH. He was highly revered in the East and the West, may God forgive him. He was the son of ʿAlī b. Muḥammad b. Ghaḍanfar, from the Ashrāf (noble descendants of the Prophet).
