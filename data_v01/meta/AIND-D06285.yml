translation:
  ja: カーンスーフ・アル＝アシュラフィー・バルスバーイ、同じく（同名の別人）。長らくハーッサキーとして過ごし、次いでフシュカダムの時代に十人隊アミールとなり、やがてサワール討伐に出征したが病んで帰還し、そのまま874年ラビーウ・アル＝アーヒル月に約60歳で没した。
  en: Qānṣūh al-Ashrafī Barsbāy, likewise (another of the same name). He remained a khāṣṣakī for a long time, then became an amir of ten in the days of Khushqadam, until he went on campaign against Sawār and returned ill, and so he died in Rabīʿ II of the year 874 at about sixty years of age.
