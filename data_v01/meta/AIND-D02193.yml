translation:
  ja: ブルハーン・ブン・アル＝シャイフ・アブドゥルカリーム・ブン・アブドゥッラー・ブン・ムハンマド…アル＝アンサーリー・アル＝ハドラミー、次いでアル＝マッキー。ヤーシーン（後述）の兄弟であり、両者の父（アブドゥルカリーム）も（別項にある）。883年ムハッラム月に死去し、メッカ下部のアル＝シャビーカにある父の傍らに埋葬された。
  en: Burhān b. al-Shaykh ʿAbd al-Karīm b. ʿAbd Allāh b. Muḥammad b. Aḥmad b. ʿAlī b. Aḥmad b. Muḥammad b. ʿAbd Allāh al-Anṣārī al-Ḥaḍramī, then al-Makkī. He was the brother of Yāsīn (mentioned later), and their father (ʿAbd al-Karīm) is likewise noted. He died in Muḥarram 883 H and was buried next to his father in al-Shabīka, in the lower part of Mecca.
