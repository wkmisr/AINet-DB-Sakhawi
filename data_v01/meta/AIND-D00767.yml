translation:
  ja: アハマド・ブン・シャーヒーン・アル＝カラキーは、我らがシャイフ（イブン・ハジャル）の孫で、後に言及されるユースフの兄弟である。祖父が825年に彼のためにイジャーザを授与させた後、両親が存命中に死去した。
  en: Aḥmad b. Shāhīn al-Karakī was the grandson of our shaykh (Ibn Ḥajar) and the brother of Yusuf (who will be mentioned later). He died during the lifetime of his parents, after his grandfather had arranged for him to receive an ijāza from a group of scholars in the year 825.
