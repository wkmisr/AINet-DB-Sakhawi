translation:
  ja: ハイル・ベク・アル＝アシュラフィー・バルスバーイ・アル＝バフラワーン。イーナールの治世下で10人長（アミール・アシャラ）に任じられ、その後、アッ＝ザーヒル・ホシュカダムによってシリア地方（シャーム）へ追放されたが、のちにダマスクスの有力指揮官（ムカッダム）の一人となった。873年シャウワール月のスワール（シャースワール）の戦いにおいて、50代で戦死した。
  en: Khayr Bak al-Ashrafī Barsbāy al-Bahlawān. He was appointed as an Amir of Ten during the reign of Īnāl, and was subsequently exiled by al-Ẓāhir Khushqadam to the Syrian lands, where he later became one of the commanders (muqaddams) of Damascus. He was killed in the battle of Suwar (Sawar) in Shawwāl, the year 873 H, being in his fifties.
