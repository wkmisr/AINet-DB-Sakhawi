  ja: アワド・ブン・アブドゥッラー・アッ＝ザーヒド。アムル・モスクに籠居しており、人々は彼を篤く信じていた。（8）06年ラマダーン月に没した。我らのシャイフ（イブン・ハジャル）が『インバー』において彼に言及している。
  en: ʿAwaḍ b. ʿAbd Allāh al-Zāhid. He lived in seclusion at the Mosque of ʿAmr, and people held him in devout regard. He died in Ramaḍān of the year (8)06. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
