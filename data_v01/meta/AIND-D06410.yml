translation:
  ja: クムシュブガー・トゥールー。もとはトゥールー・ブン・アリー・バーシャー・アッ＝ザーヒリーのマムルークの一人。彼（トゥールー）の死後に転任を重ね、ダマスクスのタブルハーナ級アミールの一人、次いで第二ハージブとなり、次いでサルグトミシュ・ヤーブーの後任としてダマスクス城塞の代官（ナーイブ）に就いた。富を蓄え、不動産を建て、840年頃に没し、多額の財産を残した。
  en: Kumushbughā Ṭūlū. He was originally one of the mamlūks of Ṭūlū b. ʿAlī Bāshā al-Ẓāhirī. After him he moved from post to post until he became one of the amirs of ṭablkhānāh in Damascus and second chamberlain (ḥājib thānī); then he held the deputyship (niyāba) of the Citadel of Damascus after Ṣarghitmish Yābū. He grew rich and built up properties, died around the year 840, and left behind much wealth.
