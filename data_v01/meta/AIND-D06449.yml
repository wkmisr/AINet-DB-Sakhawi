translation:
  ja: ムバーラク・ブン・マイラブ・ブン・アリー・ブン・ムバーラク・ブン・ルマイサ・ブン・アビー・ヌマイ・アル＝ハサニー・アル＝マッキー。祖父は既出。866年ズー・ル＝ヒッジャ月29日木曜日、ワーディー・マッルからマッカへ向かう途上で没し、アル＝ムアッラー墓地に葬られた。イブン・ファハドが没年を記録した。
  en: Mubārak b. Maylab b. ʿAlī b. Mubārak b. Rumaytha b. Abī Numayy al-Ḥasanī al-Makkī; his grandfather has been mentioned above. He died on Thursday, 29 Dhū al-Ḥijja 866, while on his way to Mecca from Wādī Marr, and was buried in al-Muʿallā. Ibn Fahd recorded his death.
