translation:
  ja: カースィム・ブン・アリー、アル＝ジャービー（徴収人）。後述するアッ＝シャムス・ムハンマドの父。878年ジュマーダー第一月に没し、バーブ・アン＝ナスルのムサッラーの広場でごく少数の人々により葬礼が行われ、日没近くにそこの墓所に埋葬された。彼は無学の民衆で、訴訟が多く、白斑病を患いながらも悪意が甚だしく、それは息子にまで及んだ。神が彼を赦したまわんことを。
  en: Qāsim b. ʿAlī al-Jābī (the rent-collector), father of al-Shams Muḥammad (mentioned below). He died in Jumādā I 878; the funeral prayer was performed over him by a small group in the courtyard of Muṣallā Bāb al-Naṣr, and he was buried near sunset in a tomb there. He was a commoner, much given to litigation and exceedingly malicious, so much so that it extended to his own son, though he was afflicted with vitiligo (baraṣ). May God pardon him.
