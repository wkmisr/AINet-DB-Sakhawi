translation:
  ja: アブド・アル＝カリーム・ブン・アリー・ブン・スィナーン・ブン・アブド・アッラー・ブン・ウマル・ブン・マスウード・アル＝ウマリー。「アル＝ウマラ」として知られる隊長（カーイド）たちの名士の一人であった。820年ズー・アル＝ヒッジャ月末にマッカで没し、ムアッラー墓地に葬られた。私（サハーウィー）は彼が40代であったと思う。アル＝ファースィーがその『マッカ（史）』でそう述べている。
  en: ʿAbd al-Karīm b. ʿAlī b. Sinān b. ʿAbd Allāh b. ʿUmar b. Masʿūd al-ʿUmarī. He was one of the notable commanders (quwwād) known as al-ʿUmara. He died in Mecca at the end of Dhū al-Ḥijja of the year [8]20 and was buried in al-Muʿallā; I think he was in his forties. Al-Fāsī said so in (his history of) Mecca.
