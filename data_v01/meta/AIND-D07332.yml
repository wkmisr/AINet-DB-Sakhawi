translation:
  ja: ムハンマド・ブン・ハサン・ブン・アフマド・ブン・ハサン・ブン・アリー・ブン・ムハンマド・ブン・アブドゥッラフマーン、バドル・アッ＝ディーン・ブン・バドル・アッ＝ディーン・ブン・アル＝イマーム・アッ＝シハーブ・アル＝アズライー・アル＝カーヒリー。父と祖父は前出。マーミシュとあだ名される。842年に生まれ、イブン・ヒッジーに仕えて洒脱に育ち、彼のもとで重んじられた。少しばかり学問に励み、ハッジを行い、その後は落ち着いた。のちにアル＝バドリー・ブン・ムズヒルに身を寄せた。
  en: Muḥammad b. Ḥasan b. Aḥmad b. Ḥasan b. ʿAlī b. Muḥammad b. ʿAbd al-Raḥmān, Badr al-Dīn b. Badr al-Dīn b. al-Imām al-Shihāb al-Adhraʿī al-Qāhirī; his father and grandfather have been mentioned above. He is nicknamed Māmish. He was born in the year 842 and grew up as an elegant youth in the service of Ibn Ḥijjī, enjoying distinction with him. He studied a little and performed the pilgrimage, and after that he settled down. Later he attached himself to al-Badrī b. Muzhir.
