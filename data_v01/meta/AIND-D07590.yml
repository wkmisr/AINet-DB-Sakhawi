translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・ムハンマド・ブン・アブドゥッラフマーン・ブン・ムハンマド・ブン・アブドゥッラフマーン、アブー・アル＝カースィム・アル＝ヒムヤリー、フェズ出自のアル＝クサンティーニー・アッ＝トゥーニスィー、のちアル＝マクディスィー、アル＝マーリキー。アル＝ハッルーフとして知られるアフマドの父。830年およびそれ以降にマッカに滞在（ムジャーワラ）し、その後エルサレム（バイト・アル＝マクディス）に来てそこに定住し、859年に没するまでそこにいた。法学（フィクフ）に卓越し、その第一人者であり、マグリブの君主のために書記を務めた。彼の息子が（この情報を）伝えた。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. ʿAbd al-Raḥmān, Abū al-Qāsim al-Ḥimyarī, of Fez origin, al-Qusanṭīnī al-Tūnisī, then al-Maqdisī, al-Mālikī, the father of Aḥmad known as al-Khallūf. He resided (jāwara) in Mecca in 830 and thereafter, then came to Jerusalem and settled there until he died in 859. He was outstanding and preeminent in jurisprudence (fiqh), and wrote (as secretary) for the ruler of the Maghrib. His son related this.
