translation:
  ja: アブドゥルワッハーブ、タージュ・アッ＝ディーン、アッ＝ディマシュキー、のちにアル＝カーヒリー。タンタダーのアフマディー廟のハリーファ（後継者職）であり、前出のサーリムの父。〔8〕66年ジュマーダー・アル＝アーヒラ月に同地で急死し、そこに埋葬された。
  en: ʿAbd al-Wahhāb Tāj al-Dīn al-Dimashqī, then al-Qāhirī, the khalīfa (successor-custodian) of al-Maqām al-Aḥmadī at Ṭanṭadā, and the father of Sālim, mentioned above. He died there suddenly in Jumādā al-Ākhira of the year [8]66 and was buried there.
