  note:
    en: 'Father, known as al-Bahlawān = ʿAlī b. Yūsuf b. Ismāʿīl al-Khawājā b. al-Bahlawān (D05686). Confirmed (Waka, 2026-06-19) on four grounds: (1) name chain ʿAlī b. Yūsuf matches the subject''s patronymic exactly; (2) the distinctive laqab al-Bahlawān appears in both; (3) D05686''s father-name Ismāʿīl = the subject''s own ism (papponymy); (4) the cross-reference entry D05702 "ʿAlī b. Yūsuf al-Khawājā Nūr al-Dīn al-Bahlawān. مضى فيمن جده إسماعيل" points back to D05686 and shows al-Khawājā and al-Bahlawān co-occurring in one person, dissolving the earlier nisbah concern (al-Khawājā is a merchant title compatible with the origin-nisbah al-Rūmī). Competing entry D05293 (ʿAlī b. ʿAlī b. Yūsuf al-Bahlawān, d. Mecca 868) is excluded: its name chain differs and its death year (868) is incompatible with being the father of someone who died in 867.'
translation:
