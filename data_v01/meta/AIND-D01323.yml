translation:
  ja: アハマド・ブン・ムハンマド・ブン・サイード、シャハーブ（尊称）、シャルアビー出身、ヤマン出身、タアッズ出身、シャーフィイー派法学者、クルアーン朗誦学者。 ダマスクスのスミサーティーヤに定住し、イマーム、大学者、クルアーン朗誦学者、多芸の士、文人として傑出していた。 アル＝ビカーイーが彼に面会し、彼がイエメンで795年頃に生まれたと述べた。 837年ズー・アルヒッジャ月22日木曜日にダマスクスで死去した。
  en: Aḥmad b. Muḥammad b. Saʿīd, al-Shihāb (honorific), al-Sharʿabī, al-Yamānī, al-Taʿizzī, a Shāfiʿī jurist and Qurʾān reciter. He resided at al-Sumaysāṭīya in Damascus and excelled as an imam, scholar, Qurʾān reciter, versatile master, and man of letters. Al-Biqāʿī met him and stated that he was born in Yemen around 795 H. He died in Damascus on Thursday, 22 Dhū al-Ḥijja, 837 H.
