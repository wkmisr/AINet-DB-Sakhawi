translation:
  ja: シャアバーン。アル＝バドル・ブン・アル＝ハッラーウィーの義理の息子（シャアバーンの妻、すなわち彼の息子アブー・バクルらの母親の父親）。造幣局（ダール・アッ＝ダルブ）の門番。845年ズルカアダ月に死去。巡礼衣（イフラーム）をまとう前日にメッカに向かう途上でのことであった。彼の死後、その義理の息子が造幣局の役職を継いだ。
  en: Shaʿbān. Son-in-law of al-Badr b. al-Ḥallāwī (the father of his wife, who was the mother of his son Abū Bakr and others). He was the gatekeeper of the Mint (Dār al-Ḍarb). He died in the month of Dhu al-Qaʿda in the year 845 AH while heading to Mecca, one day before entering the state of ihram. His son-in-law succeeded him in his position at the Mint.
