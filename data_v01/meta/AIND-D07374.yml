translation:
  ja: ムハンマド・ブン・ダーウード・ブン・ウスマーン・ブン・アリー・アル＝クラシー・アル＝ハーシミー、ジッダの行政実務官（ムバーシル）の一人。彼の父はアン＝ニザームとして知られる。ヒジュラ暦863年ラビーウ・アルアウワル月にマッカで没した。イブン・ファハドが彼の没年を記録している。彼にはアブドゥッラーという名の兄弟がおり、（その兄弟は）814年にアッ＝ザイン・アル＝マラーギーから聴聞した。二人の父は「シャイフ」と称されていた。
  en: Muḥammad b. Dāwūd b. ʿUthmān b. ʿAlī al-Qurashī al-Hāshimī, one of the administrators (mubāshirūn) of Jedda. His father was known as al-Niẓām. He died in Mecca in Rabīʿ al-Awwal of the year 863 AH. Ibn Fahd recorded his date. He had a brother named ʿAbd Allāh, who heard [hadith] in the year 814 AH from al-Zayn al-Marāghī, and their father was described as "al-Shaykh".
