translation:
  ja: アリー・ヌール・アッ＝ディーン・アッ＝ダリール（盲人）・アル＝ムクリー。バーブ・アッ＝シャアリーヤ内のジャーミウ・アル＝マガーリバに隣接するモスクでの児童の教師で、同モスク（ジャーミウ・アル＝マガーリバ）のイマーム。推定で70歳近くで、853年サファル月に没した。教え方が上手く、善良で、声の調べが瑞々しく、その点（教育）で多くの者が彼に益を得た。
  en: ʿAlī Nūr al-Dīn al-Ḍarīr (the blind) al-Muqrī, teacher of children at the mosque adjacent to Jāmiʿ al-Maghāriba inside Bāb al-Shaʿriyya, and imām of the said mosque. He died, aged nearly seventy by estimate, in Ṣafar of the year 853. He was a good teacher, a good man with a fresh, melodious voice, and a number of people benefited from him in that.
