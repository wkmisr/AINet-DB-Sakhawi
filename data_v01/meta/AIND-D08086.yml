translation:
  ja: ムハンマド・ブン・アリー・ブン・スードゥーン、アブー・アル＝マアーリー、我らが友アル＝アラー・アル＝イブラーヒーミーの子、ハナフィー派、シャイフーニーヤのスーフィーの一人で、アブドゥルカーディルの兄弟。美しい書を書き、頭角を現し、詩と散文を作った者の一人で、時に私（サハーウィー）のもとに通った。彼とその兄弟は旧ザーヒリーヤ（マドラサ）で、ウンム・ハーニ・アル＝ハウリーニーヤとアッ＝シャムス・ブン・アル＝ファウウィーから『ブハーリー』の読了会（ハトム）を聴聞していた。
  en: Muḥammad b. ʿAlī b. Sūdūn, Abū al-Maʿālī, son of our companion al-ʿAlāʾ al-Ibrāhīmī, al-Ḥanafī, one of the Sufis of al-Shaykhūniyya and brother of ʿAbd al-Qādir. He was among those who wrote a fine hand, distinguished himself, and composed poetry and prose; he occasionally frequented me (al-Sakhāwī). He and his brother had heard the concluding session (khatm) of al-Bukhārī at the old Ẓāhiriyya from Umm Hāniʾ al-Hawrīniyya and al-Shams b. al-Fuwwī.
