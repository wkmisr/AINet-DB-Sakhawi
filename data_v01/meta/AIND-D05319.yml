translation:
  ja: アリー・ブン・ウマル・ブン・ムハンマド・ブン・アッ＝シャムス・ルウルウ・アル＝ハラビー、のちにアッ＝ディマシュキー。ザイナブの兄弟。726年に生まれ、アル＝ハッジャールのもとに（幼くして）連れて行かれて聴講し、ハディースを伝えた。801年ムハッラム月にバイト・ラフヤーで没した。アル＝マクリーズィーが『ウクード』で彼に言及している。私の書にあるかどうかは要検討である。
  en: ʿAlī b. ʿUmar b. Muḥammad b. al-Shams Luʾluʾ al-Ḥalabī, then al-Dimashqī, the brother of Zaynab. He was born in the year 726, was brought (as a child) to attend al-Ḥajjār, and transmitted (ḥadīth). He died in Bayt Lahyā in Muḥarram of the year [8]01. Al-Maqrīzī mentioned him in his ʿUqūd; it should be examined whether he is in my book.
