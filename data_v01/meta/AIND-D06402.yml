translation:
  ja: クスー・アッ＝ザーヒリー・バルクーク。チェルケス人のうちでも彼らの間で極めて高く尊重された人物で、一兵卒（ジュンディー）でありながら（スルターン）位の候補に挙げられた者の一人であった。アン＝ナースィル・ファラジュの治世の末期に没した。
  en: Kasū al-Ẓāhirī Barqūq. He was among the Circassians held in the utmost esteem among them, to the extent that he was one of those nominated for the (sultanic) office while still an ordinary soldier (jundī). He died at the end of the reign of al-Nāṣir Faraj.
