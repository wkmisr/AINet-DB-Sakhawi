translation:
  ja: シャイフ・アリー・アル＝アジャミー。マッカの住人で、シャイフ・ムハンマド・ブン・カーワーンの一党の一人。商人で、ハワージャの称号で呼ばれた。（8）91年ズー・アル＝ヒッジャ月にマッカで没し、シャーフィイー派（のカーディー）に40を、四人のカーディーのうち残る（三）人のそれぞれに20を遺贈した。
  en: ʿAlī, the shaykh, al-ʿAjamī, resident of Mecca and one of the circle of Shaykh Muḥammad b. Qāwān. A merchant, he was styled al-Khawājā. He died in Mecca in Dhū al-Ḥijja (8)91, and bequeathed forty to the Shāfiʿī (judge) and twenty to each of the remaining (three) of the four judges.
