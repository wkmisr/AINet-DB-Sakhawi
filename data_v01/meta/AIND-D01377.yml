translation:
  ja: 388 アフマド・ブン・ムハンマド・ブン・アブドゥッラー・ブン・アッタキー・ムハンマド・ブン・アフマド・アッ＝シャハーブ・アル＝クラーシー・アル＝ウマリー・アル＝ハラーズィー・アル＝マッキー・アッ＝シャーフィイーは、直前の人物の従兄弟である。彼はラジャブ月3日の日曜の夜866年にメッカで亡くなった。その死はイブン・ファハドも記録している。彼はアル＝ブルハーニー・ブン・ザヒーラに師事し、彼から恩恵を受け、(精神的に)惹きつけられ、その後(信仰が)確かなものとなった。アッラーが彼を憐れむように。
  en: 388 Aḥmad b. Muḥammad b. ʿAbd Allāh b. al-Taqī Muḥammad b. Aḥmad al-Shihāb al-Qurashī al-ʿUmarī al-Ḥarāzī al-Makkī al-Shāfiʿī, cousin of the preceding person. He died in Mecca on the night of Sunday, the 3rd of Rajab in the year 866. Ibn Fahd also recorded his death. He adhered to al-Burhānī b. Ẓahīra, benefited from him, was drawn to him, and then became firm (in faith). May God have mercy on him.
