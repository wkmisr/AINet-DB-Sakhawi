translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・アフマド・ブン・ハサン・ブン・アッ＝ザイン・ムハンマド・ブン・アル＝アミーン・ムハンマド・ブン・アル＝クトゥブ、アブー・アッ＝サアーダート・アル＝アクバル（年長のアブー・アッ＝サアーダート）、アル＝カスタッラーニー・アル＝マッキー。ヒジュラ暦802年にルクン・アッ＝ディーン・ムハンマド・ブン・イスマーイール・ブン・ムハンマド・アル＝ハワーフィーが、彼あるいは後述する彼の弟にイジャーザを授けた。
  en: Muḥammad b. ʿAbd Allāh b. Aḥmad b. Ḥasan b. al-Zayn Muḥammad b. al-Amīn Muḥammad b. al-Quṭb, Abū al-Saʿādāt the Elder, al-Qasṭallānī al-Makkī. Rukn al-Dīn Muḥammad b. Ismāʿīl b. Muḥammad al-Khawāfī granted an ijāza to him, or to his brother who follows, in the year 802.
