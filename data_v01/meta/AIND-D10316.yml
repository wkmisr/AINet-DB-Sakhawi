translation:
  ja: ヤフヤー・ブン・ムハンマド・ブン・ヤフヤー・ブン・アフマド・ブン・アリー・アル＝マグリビー・アッ＝シャーズィリー、マーリキー派。マッカに住み、既出のヤフヤー・ブン・アリー・ブン・アフマドの母方の祖父。771年ラビーウ第二月にアレクサンドリアで生まれ、819年にはカイロにいた。846年シャアバーン月25日土曜日の朝、マッカで没した。徳のある人で、人々の崇敬を受け、学識もあった。イブン・アビー・アル＝ヤマンが暗記書を試問に供した相手の一人である。神よ彼を憐れみたまえ。
  en: Yaḥyā b. Muḥammad b. Yaḥyā b. Aḥmad b. ʿAlī al-Maghribī al-Shādhilī, the Mālikī, resident of Mecca and maternal grandfather of Yaḥyā b. ʿAlī b. Aḥmad, mentioned above. He was born in Rabīʿ II 771 in Alexandria and was in Cairo in the year 819. He died in Mecca on the morning of Saturday, 25 Shaʿbān 846. He was a righteous man, held in veneration, and possessed of learning; he was one of those to whom Ibn Abī al-Yaman presented his memorized texts. May God have mercy on him.
