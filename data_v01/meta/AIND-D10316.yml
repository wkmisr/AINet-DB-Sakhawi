  note:
    ja: '「وهو ممن عرض عليه ابن أبي اليمن」＝本項主が試問を受ける側（師）、ابن أبي اليمن が暗記書を試問に供した側（規則28、active=師）。サハーウィーが「ابن أبي اليمن」と固定的に呼ぶのはマッカのマーリキー派カーディー #AIND-D05550「علي بن محمد بن محمد بن علي … نور الدين أبو الحسن بن الأمين أبي اليمن … العقيلي النويري المكي المالكي … ويعرف بابن أبي اليمن . ولد في شعبان سنة خمس عشرة وثمانمائة بمكة … وعرض على عمه التقي الفاسي … وغيرهم」（repo の D08168・D08169 が father に使用）。corpus の用例: #AIND-D03053「رأيته فيمن عرض عليه ابن أبي اليمن بمكة」・#AIND-D05472「أجاز لابن أبي اليمن حين عرض عليه في سنة ثلاثين」・#AIND-D01463「وبحث عليه ابن أبي اليمن في سنة تسع وثلاثين بمكة … الرسالة لابن أبي زيد」（D05550 本文の師 أحمد اللجائي と対応）・#AIND-D03460「ولي قضاء المالكية بمكة بعد ابن أبي اليمن」。同家で同じ通称をもつ兄弟 #AIND-D01517 أحمد（801生・802没）・#AIND-D05975 عمر（850生）と子 D03518・D04154（868年以降生）は本項主（846没）に試問できない＝規則26 例外2・61(c) により cert medium。**ブリーフ誤り**: ブリーフは「أبو اليمن الطبري #AIND-D06599 の子のうち誰か」とするが、corpus の「ابن أبي اليمن」は النويري 家のこの人物を指す。初版は #NEEDID。'
