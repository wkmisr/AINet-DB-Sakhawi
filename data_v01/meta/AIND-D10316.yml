notes:
- text: '「وكان صالحا معتقدا فيه فضيلة」＝人物評（訳のみ）。corpus の他項も本項主を試問者として挙げる: #AIND-D01525「وعرض في سنة تسع وثلاثين فما بعدها على … ويحيى بن محمد المغربي الشاذلي」・#AIND-D03480「ويحيى بن محمد المغربي الشاذلي نزيل مكة في سلخ ذي القعدة」、また #AIND-D10947「والنظر فيه ليحيى المغربي الشاذلي ثم من بعده للجمال محمد بن علي الدقوقي」（842年の遺言の管理人）。いずれも相手側の記事＝本項には足さない（規則23）。女性部 #AIND-D13252「شرفية زوج الشيخ يحيى المغربي وأم ولده محمد . ماتت في صفر سنة ثلاث وستين بمكة」の夫は #AIND-D10346 يحيى المغربي الركاع（子 محمد＝D09532）の可能性があり、本項主とは決められない。'
