notes:
- text: '転送見出し（原文末尾「وصوابه محمد بن محمد بن عثمان وسيأتي」＝「صوابه」型による）。転送先は #AIND-D08902c「محمد بن محمد بن عثمان بن محمد بن أحمد … الشمس أبو عبد الله السعدي الاخنائي الدمشقي الشافعي」（757年生、Individuals/8000-8999/ に収録済み）。ラカブ الشمس・ニスバ الاخنائي・الدمشقي・学派が一致し、本見出しは父名を一代落とした別形。'
  type: reference
- text: 「كذا في معجم التقي بن فهد」＝التقي بن فهد（#AIND-D09211）の『معجم』（TMP-T-00138）における表記への言及。REF のため relation は立てない。
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・ウスマーン、アッ＝シャムス、アッ＝ディマシュキー、シャーフィイー派、アル＝アフナーイーとして知られる。タキー（・アッ＝ディーン）・ブン・ファハドの『ムウジャム』にはこのようにあるが、正しくはムハンマド・ブン・ムハンマド・ブン・ウスマーンであり、後述する。
  en: Muḥammad b. ʿUthmān al-Shams al-Dimashqī al-Shāfiʿī, known as al-Akhnāʾī. So it appears in the Muʿjam of al-Taqī b. Fahd, but the correct form is Muḥammad b. Muḥammad b. ʿUthmān, and he will come below.
