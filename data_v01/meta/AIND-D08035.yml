notes:
- text: '転送見出し（原文末尾「مضى فيمن جده أحمد بن إسمعيل قريبا」による）。転送先は #AIND-D07982「محمد بن علي بن أحمد بن إسمعيل أبو الفتح القاهري الأزهري الشافعي نزيل طيبة ويعرف بأبي الفتح بن إسمعيل وهو بكنيته أشهر وربما قيل له ابن الريس لكون والده كان رئيس الوقادين بجامع الأزهر . ولد بعيد العشرين وثمانمائة بالقاهرة …」（未受領）。本見出しは祖父 أحمد を省いた「محمد بن علي بن إسمعيل」形で、クンヤ أبو الفتح・通称 ابن الريس が一致。'
  type: reference
translation:
  ja: ムハンマド・ブン・アリー・ブン・イスマーイール、アブー・アル＝ファトフ・ブン・アッ＝ライイス。祖父がアフマド・ブン・イスマーイールである者たち（の部）で少し前に既出。
  en: Muḥammad b. ʿAlī b. Ismāʿīl, Abū al-Fatḥ b. al-Rayyis. He has already appeared shortly above among those whose grandfather is Aḥmad b. Ismāʿīl.
