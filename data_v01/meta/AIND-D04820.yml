translation:
  ja: ウバイド・ブン・ウマル・ブン・ムハンマド・アル＝クラシー――ガルビーヤ県のアル＝クラシーヤに因むニスバである――、前出のアブドゥッラフマーンの父。私の聞いたところでは、アッ＝ザーヒドとイブン・アン＝ナッカーシュから学んだ者の一人であった。彼は読み書きができなかったが説教をし、並外れた聡明さを示すことを語った。〔8〕67年ラビーウ・アル＝アウワル月に没した。本人が語っていたところによれば、百歳を超えていた。神が彼を憐れみたまわんことを。
  en: ʿUbayd b. ʿUmar b. Muḥammad al-Qurashī – the nisba refers to al-Qurashiyya in al-Gharbiyya – father of ʿAbd al-Raḥmān, mentioned above. According to what reached me, he was among those who studied under al-Zāhid and Ibn al-Naqqāsh. He was illiterate, yet he used to preach, producing things that showed exceptional intelligence. He died in Rabīʿ al-Awwal of the year [8]67, having passed one hundred years of age according to what he used to say, may God have mercy on him.
