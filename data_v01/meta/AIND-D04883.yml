translation:
  ja: ウスマーン・ブン・マフムード、アル＝バハーウ・アッ＝ズィーラーウィー・アル＝アジャミー、マッカに寄留した人。アッ＝シハーブ・アル＝ムイードの代理として、マッカのハナフィー派マカーム（礼拝所）で礼拝を先導した。（8）44年ズー・アル＝カアダ月に同地で没した。イブン・ファハドがその没年を記録している。
  en: ʿUthmān b. Maḥmūd, al-Bahāʾ al-Dhīrāwī al-ʿAjamī, resident of Mecca. He led the prayer at the Ḥanafī station (maqām al-Ḥanafiyya) there as deputy for al-Shihāb al-Muʿīd, and died there in Dhū al-Qaʿda (8)44. Ibn Fahd recorded his death.
