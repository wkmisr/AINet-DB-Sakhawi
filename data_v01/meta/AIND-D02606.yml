translation:
  ja: ハサン・ブン・アリー・アル＝アマディー。（アマディーは、長母音なしで二つのファトハで読む。）我らがシャイフ（イブン・ハジャル）は『インバー・アル＝グムル』において次のように述べている。「ハサイニーヤ地区の出身で、軍人の装いをしていたが、一部のアミールたちとの知遇を得たことで、スィルヤークースのシャイフ職（ハーンカーの長）に任命されるに至った。その後、軍服を脱ぎ、スーフィーの衣服を身にまとった。」 805年シャアバーン月に没した。別の者は彼を「シャイフ・アッ＝シュユーフ（長老たちの長）」と呼んだ。善良で信仰深く、信心深い人物であった。
  en: 'Ḥasan b. ʿAlī al-Amadī. [Al-Amadī is pronounced] with two fatḥas and without lengthening. Our shaykh (Ibn Ḥajar) said in his Inbāʾ [al-Ghumr]: ''He was from the people of al-Ḥusayniyya and wore military garb. Then, through his association with some amirs, he managed to be appointed as the head of Siryāqūs, whereupon he abandoned military dress and wore the garb of a Sufi.'' He died in Shaʿbān in the year 805. Others referred to him as ''Shaykh al-Shuyūkh''. He was good, pious, and devout.'
