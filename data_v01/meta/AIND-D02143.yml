translation:
  ja: ブルジャーン・カラー・アン＝ナースィリー。アル＝バドリーがその詩文集（マジュムーウ）に彼の次の詩を書き留めている。「ハームの一族のうちに、輝き昇る月がある。その歩みを見れば、止まっているかと思うほどだ。私が『わが君よ、お名前は』と尋ねると、彼は『おお、惑わされた者よ、私には人を魅する者（ファーティン）が』と答えた。」（名を問う謎掛けの二行詩。答えを「ファーティン」に掛けたものか）
  en: 'Burjān Qarā al-Nāṣirī. Al-Badrī recorded in his compilation (Majmūʿ) these verses of his: ''From the house of Ham, a radiant rising moon; you would think him motionless as he moves. I asked him: What is your name, my lord? He said: O deluded one — in me is one who charms (fātin).'' (A two-line name-riddle, apparently punning on the name Fātin.)'
