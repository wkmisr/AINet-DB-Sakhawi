translation:
  ja: ターヒル・ブン・ユーヌス・アル＝マウスィリー。私は、彼が835年に医学に関するアル＝ジャマール・アブドゥッラー・ブン・アリー・ブン・アユーブの論考（リサーラ）に注釈などを執筆したのを見た。また、アブー・アル＝ルトフ・アル＝ハスカフィー（後にアル＝クドゥスィーとなる）の師たちの中に、モースルのカーディーの息子である巡礼者でザイン・アッ＝ディーンのターヒルがおり、彼（アブー・アル＝ルトフ）はサフィー・アブドゥルムウミン・アル＝アルマウィーの『アル＝アドワール（旋律）』を彼（ターヒル）のもとで読誦（学習）したとあるが、おそらくこの人物のことであろう。
  en: Ṭāhir b. Yūnus al-Mawṣilī. I saw that he wrote in the year 835 AH on a treatise of al-Jamāl ʿAbd Allāh b. ʿAlī b. Ayyūb on medicine, as will be mentioned. Among the teachers of Abū al-Luṭf al-Ḥaṣkafī, later al-Qudsī, is al-Ḥājj Zayn al-Dīn Ṭāhir b. Qāḍī al-Mawṣil, under whom he read 『al-Adwār』 by al-Ṣafī ʿAbd al-Muʾmin al-Urmawī; it appears that he is the same person.
