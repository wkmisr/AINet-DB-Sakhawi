translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アフマド・アル＝ビルマーウィー・アル＝カーヒリー。既述のウスマーン、アブド・アッラフマーン、アブド・アル＝ガニーの兄弟。兄弟が彼を一群（の師）のもとで聴講させた。アル＝ビカーイーが彼を（詳述なしに）名だけ挙げている。
  en: Muḥammad b. Ibrāhīm b. Aḥmad al-Birmāwī al-Qāhirī, brother of the aforementioned ʿUthmān, ʿAbd al-Raḥmān and ʿAbd al-Ghanī. His brother had him hear from a group [of shaykhs], and al-Biqāʿī mentioned him by name only, without details.
