translation:
  ja: ナースィル・ブン・アブドゥッラー・アッ＝スーフィー、サイード・アッ＝スアダーのスーフィーの一人。シハーブ・イブン・アル＝ムハンマラは、そこにスーフィーの道において彼のような者はいなかったと述べた。タヌーヒーらから聴聞した。833年ラジャブ月にペストで没した。後出のイブン・ムハンマド・アル＝バッサーミーと別人かどうか要検討。
  en: Nāṣir b. ʿAbd Allāh al-Ṣūfī, one of the Sufis of Saʿīd al-Suʿadāʾ. Al-Shihāb Ibn al-Muḥammara said there was no one there like him on the Sufi path. He heard from al-Tanūkhī and others. He died of plague in Rajab 833. It should be checked whether he is other than Ibn Muḥammad al-Bassāmī (below).
