translation:
  ja: アブド・アル＝カリーム・ブン・ムハンマド、タキー・アッ＝ディーン・アン＝ナワウィー・アッ＝シャーフィイー。我らがシャイフ（イブン・ハジャル）は『インバー（・アル＝グムル）』で次のように述べている。かつて学問に励んだが、のちにそれを捨てて諸地方での裁判官職を求めることに専心し、ナワーの（カーディー職）に任じられ、次いでアズリアートの裁判官職をしばらく務めたが、満足のいく人物ではなかった。ただし客のもてなしには気前がよかった。805年ラジャブ月に没した。
  en: 'ʿAbd al-Karīm b. Muḥammad, Taqī al-Dīn al-Nawawī al-Shāfiʿī. Our shaykh (Ibn Ḥajar) said in his Inbāʾ: he studied in early life, then abandoned it and devoted himself to seeking judgeships in the provinces; he was appointed over Nawā, then held the judgeship of Adhriʿāt for a time, and he was not satisfactory, though he was generous in hospitality. He died in Rajab of the year [80]5.'
