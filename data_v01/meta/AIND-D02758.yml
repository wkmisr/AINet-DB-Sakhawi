translation:
  ja: フサイン・ブン・ユースフ・アッ＝ディマシュキー。アル＝ジャズィーラのカーディー（法官）として知られる。ヒジュラ暦857年ズルヒッジャ月にマッカで没し、アル＝ムアッラーに埋葬された。イブン・ファハドが彼の没年を記録している。
  en: Ḥusayn b. Yūsuf al-Dimashqī, known as the Qāḍī of al-Jazīra. He died in Mecca in Dhū al-Ḥijja in the year 857 AH and was buried in al-Muʿallā. His death was recorded by Ibn Fahd.
