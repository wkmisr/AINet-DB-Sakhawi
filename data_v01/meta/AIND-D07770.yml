translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・フサイン、アッ＝シャムス・アン＝ヌワイリー、のちにアル＝カーヒリー、シャーフィイー派。アル＝バドル・アン＝ヌワイリーの母方の祖父。その外孫が私に語ったところでは、彼は『シャーティビーヤ』や『タンビーフ』などを暗記し、七読誦法で朗誦した。彼は傑出しており、クルアーン読誦学と法学を教授していた。（8）60年に100歳前後で没した――アッラーが最もよく知りたもう。
  en: Muḥammad b. ʿAbd Allāh b. Ḥusayn, al-Shams al-Nuwayrī, then al-Qāhirī, the Shāfiʿī, maternal grandfather of al-Badr al-Nuwayrī. His grandson told me that he memorised al-Shāṭibiyya, al-Tanbīh and other works, and that he recited according to the seven readings. He was distinguished and taught the Qurʾānic readings and jurisprudence. He died in (8)60 at about a hundred years of age, but God knows best.
