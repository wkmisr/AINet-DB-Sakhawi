notes:
- text: '転送見出し（原文末尾「مضى فيمن جده محمد بن أحمد」による）。転送先は #AIND-D08576「محمد بن علي بن محمد بن أحمد وقيل عبد الله بدل أحمد … الشمس أبو عبد الله القاهري الحنفي المقرئ ويعرف بابن الزراتيتي … ولد … سنة ثمان وأربعين وسبعمائة … مات … سنة خمس وعشرين بالقاهرة」（名・父名・祖父名 أحمد・ラカブ・クンヤ・ニスバ・المقرئ が一致。未受領）。同じ D08576 へ向く転送見出しが他に #AIND-D08190（本バッチ B156）・#AIND-D08592「محمد بن علي بن محمد بن عبد الله بن الزراتيتي . مضى فيمن جده محمد بن أحمد」（祖父名の異伝 عبد الله）にもある＝三重の転送見出し。ニスバ索引 #AIND-D11690「الزراتيتي نسبة لقرية زراتيت محمد ابن علي بن محمد بن أحمد المقري」は target に使わない。'
