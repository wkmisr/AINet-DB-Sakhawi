translation:
  ja: フサイン・ブン・アル＝カマール・ムハンマド・ブン・アブド・アル＝アズィーズ・ブン・アブド・アル＝ワーヒド・ブン・ウマル・ブン・イヤード・アル＝アンサーリー、マグリブ出自のマディーナの人、マーリキー派。既出のハサン・ブン・ウマル・ブン・アブド・アル＝アズィーズは彼の従兄弟であり、父は後出する。彼はアン＝ヌール・アル＝マハッリーの外孫（スィブト）で、彼から聴聞し、それどころか『ムワッタア』を彼のもとで読誦した。善良で礼拝に励み続ける人であった。ヒジュラ暦867年サファル月に没した。
  en: Ḥusayn b. al-Kamāl Muḥammad b. ʿAbd al-ʿAzīz b. ʿAbd al-Wāḥid b. ʿUmar b. ʿAyyāḍ al-Anṣārī, of Maghribī origin, a resident of Medina, and a Mālikī. He was the cousin of the previously mentioned Ḥasan b. ʿUmar, and the son of al-Kamāl Muḥammad, whose biography will follow. He was the maternal grandson of al-Nūr al-Maḥallī, under whom he heard and indeed read al-Muwaṭṭaʾ. He was virtuous and constant in worship. He died in the month of Safar, in the year 867 AH.
