translation:
  ja: 我らがシャイフ(イブン・ハジャル)の姉妹の孫(娘の子)であり、我らが隣人であるアフマド・ブン・ジャーヒク・アル＝ムアイヤディー。彼の母はシャリーファであった。彼は我らがシャイフ(イブン・ハジャル)から（講義を）聴聞し、またアル＝バーシティーヤにある商店で生計を立てた。
  en: Aḥmad b. Jāḥiq al-Muʾayyadī, our neighbor and the maternal grand-nephew of al-Sakhāwī's shaykh (Ibn Ḥajar al-ʿAsqalānī). His mother was al-Sharīfa. He received learning from our shaykh (Ibn Ḥajar) and earned a living from a shop in al-Bāsiṭiyya.
