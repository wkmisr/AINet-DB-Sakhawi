translation:
  ja: イーサー・アル＝カーリー・アッ＝ディマシュキー。ダマスクスの有力商人の一人で、複数回にわたり巡礼し留錫（ムジャーワラ）した。余所者（新来者）であったにもかかわらず、善行・敬虔・施しの人であった。895年シャアバーン月末にダマスクスで没したが、それはカイロに召喚された際に多額の金銭を徴収された後のことであり、さらに彼の死後まもなく息子からも徴収された。
  en: ʿĪsā al-Qārī al-Dimashqī, one of the notable merchants of Damascus, who performed the Hajj and resided in the holy city (jāwara) more than once. He was a man of goodness, piety, and charity, despite being an outsider. He died in Damascus in late Shaʿbān of the year 895, after a large sum had been taken from him when he was summoned to Cairo; then, shortly after his death, more was taken from his son.
