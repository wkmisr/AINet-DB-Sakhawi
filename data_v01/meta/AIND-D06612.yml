  note:
    ja: '二重立項（両項とも転送指示なし＝絶対基準により実項のまま）。#AIND-D06949「205 محمد بن أحمد بن محمد التاج الباهي النويري ثم المصري . كان يخدم الزين البوشي المجذوب ثم انقطع بمنزله بالنخالين من مصر ولم ينفك عنه مع استيلاء الخراب عليه من جميع جوانبه وصار يظهر منه الخوارق فتزايد اعتقاد الناس فيه . مات في رمضان سنة إحدى وأربعين بعد أن أضر مدة وأظنه بلغ السبعين أو دونها . قاله سيخنا في أنبائه .」（repo 未収録）は、ラカブ التاج・ニスバ الباهي と النويري・ミスル（مصر）居住・没年841がすべて本項と一致し、違いは祖父名（أحمد／محمد）だけ。サハーウィー自身の同定の言はなく校閲者の判断（先例 #AIND-D06576⇄#AIND-D09482、#AIND-D06690⇄#AIND-D06870 に倣い cert high、ISSUES §D172-2）。D06949 側の鏡像は同項の受領時。ブリーフに記載のなかった相手。'
