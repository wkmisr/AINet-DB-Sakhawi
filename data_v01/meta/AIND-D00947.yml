translation:
  ja: アブー・バクル・ブン・アリー・ブン・アブドゥッラー・ブン・アリーの子、アブドゥルマリクの子、アハマド（シハーブ）。出身はモスルで、エルサレムに居住。シャーフィイー派。父は後述。彼は大きな家柄の出で、彼（＝アハマド）を伴って私（＝サハーウィー）のもとにやってきた。彼が『ミンハージュ』『ジャムウ・ル・ジャワーミウ』『アルフィーヤ』を提示し、私は彼の父の死に際して彼から恩恵を受けた。
  en: Aḥmad b. ʿAbd al-Malik b. Abī Bakr b. ʿAlī b. ʿAbd Allāh b. ʿAlī al-Shihāb, of Mawṣilī origin, al-Maqdisī, a Shāfiʿī. His father will be mentioned later. He was from a prominent family. He (his father) came to me (al-Sakhāwī) with his son (Aḥmad), who presented al-Minhāj, Jamʿ al-Jawāmiʿ, and al-Alfiyya. I (al-Sakhāwī) benefited from him upon his father's death.
