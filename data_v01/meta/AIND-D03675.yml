translation:
  ja: アブドゥッラフマーン・ブン・ウバイドゥッラー・ブン・アワド・ブン・ムハンマド・アル＝アルダビールィー・アッ＝シルワーニー・アル＝カーヒリー・アル＝ハナフィー。後述のバドル・マフムードおよびその兄弟たちの兄弟。イブン・アッ＝サーアーティーの『アル＝バディーウ』と『アル＝ヒダーヤ』を暗記した。兄弟の最年長であったため、アブー・バクリーヤ、アイタミシーヤ、ウンム・アッ＝スルターンの各マドラサにおける教授職を父から継いだ。ヒジュラ暦811年に没した。
  en: ʿAbd al-Raḥmān b. ʿUbayd Allāh b. ʿAwaḍ b. Muḥammad al-Ardabīlī al-Shirwānī al-Qāhirī al-Ḥanafī. Brother of al-Badr Maḥmūd, who is mentioned below, and his other brothers. He memorized 'al-Badīʿ' by Ibn al-Sāʿātī and 'al-Hidāya'. Being the eldest of his brothers, he succeeded his father in teaching at al-Abūbakriyya, al-Aytamishiyya, and Umm al-Sulṭān madrasas. He died in the year 811 AH.
