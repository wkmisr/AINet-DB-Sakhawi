translation:
  ja: ウマル・ブン・ヤフヤー・ブン・アブドゥッラー・ブン・アリー・ブン・アムルーン・アル＝バアリー。アブド・アッ＝ラフマーン・ブン・ムハンマド・イブン・アッ＝ザアブーブから『サヒーフ・アル＝ブハーリー』を聴聞した。アッ＝タキー・イブン・ファハドが『ムウジャム』に、追記なしで彼を挙げている。
  en: ʿUmar b. Yaḥyā b. ʿAbd Allāh b. ʿAlī b. ʿAmrūn al-Baʿlī. He heard Ṣaḥīḥ al-Bukhārī from ʿAbd al-Raḥmān b. Muḥammad Ibn al-Zaʿbūb. Al-Taqī Ibn Fahd mentioned him in his Muʿjam without any addition.
