translation:
  ja: アブドゥルラフマーン・ブン・アフマド・ブン・ガーズィー・アッ＝ザルイー・アル＝マクディスィー。アル＝ジャマール・イブン・ジャマーアの娘の息子（外孫）。我々とともに［ハディースを］聴聞し、多くの書物を暗記し、アル＝カマール・イブン・アビ・シャリーフに師事（密着）した。壮年期（中年）に達する前のヒジュラ暦889年に没した。善良で穏やかな人物であった。
  en: ʿAbd al-Raḥmān b. Aḥmad b. Ghāzī al-Zarʿī al-Maqdisī. Grandson (daughter's son) of al-Jamāl b. Jamāʿa. He studied (heard ḥadīth) together with us, memorized many books, and closely accompanied al-Kamāl b. Abī Sharīf. He died in the year 889 AH before reaching middle age. He was a good and quiet person.
