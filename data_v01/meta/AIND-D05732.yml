notes:
- text: '「اثنان」型の項。前半「أحدهما الماضي قريبا … واسم أبيه حجاج」は直前の #AIND-D05726（علي نور الدين السفطي … ويعرف بالوراق … واسم والده حجاج、マーリク派）への参照で、本項の人物データ（没年・職・人物評）はすべて後半の「والآخر كاتب غيبة الأشرفية」以下に記された第2の人物のもの。本項はこの第2の人物の実項として扱い、D05726 とは別人（二重立項・同一性なし）。corpus のニスバ索引 #AIND-D11395「الوراق جماعة يسمون عليا … وثالثهم حريري أيضا كان كاتب الغيبة بالأشرفية」も本項主を第3の علي الوراق（絹織物業者）として挙げる。要判断 §D101-4。'
  lang: ja
  type: editorial
translation:
  ja: アリー・ヌール・アッ＝ディーン・アル＝ワッラーク。二人いる。一人は少し前に述べた者で、マーリク派の優れた者の一人であり、その父の名はハッジャージュである。もう一人はアル＝アシュラフィーヤの欠勤記録係（カーティブ・ガイバ）であった。（後者は）882年シャウワール月に、推定で70歳を超えて没した。物静かで悪くない人物で、その仲間内でも（評判は）悪くなかった。
  en: 'ʿAlī Nūr al-Dīn al-Warrāq: there are two. One is the man mentioned shortly before, who was among the distinguished Mālikīs and whose father''s name was Ḥajjāj; the other was the clerk of absences (kātib ghayba) of al-Ashrafiyya. He (the latter) died in Shawwāl of the year 882, having, by estimate, exceeded seventy years of age. He was quiet and unobjectionable among his group.'
