translation:
  ja: アブドゥッラー・ブン・アフマド・ブン・ムハンマド、マラークシュ出自、ハリーリー。ハリール（ヘブロン）にあるウマルのザーウィヤのシャイフであり、そこでクルアーン朗誦（タジュウィード）を行っていた。シャフィーイー派として『アッ＝タンビーフ』の学習に従事し、アル＝ブルハーン・アル＝アンサーリーに師事して読誦した。しかしその後、自らの敬虔さと父の敬虔さとともに、スーフィーの道へと進んだ。ハジュリー暦895年シャウワール月にハリールの地で没した。当時60歳を超えていた。アッラーの慈悲あれ。
  en: Abd Allah b. Ahmad b. Muhammad, of Marrakesh origin, al-Khalili. He was the shaykh of the Zawiyah of Umar and its Quranic reciter (mujawwid). He studied as a Shafi'i, engaging with 『al-Tanbih』, and read under al-Burhan al-Ansari, but later turned to the path of the Sufis, along with his own piety and that of his father. He died in Shawwal in the year 895 AH in the town of al-Khalil (Hebron), having passed the age of sixty. May Allah have mercy on him.
