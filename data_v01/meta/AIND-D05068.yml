translation:
  ja: アリー・ブン・イーナール、アル＝アミール・アラー・アッディーン。アッ＝ザーヒル・ジャクマクの近臣の一人。843年に、贈り物を持たせてルームの王ムラード・ブン・ウスマーンのもとに派遣された。アル＝マクリーズィーが『アル＝ハワーディス』において述べている。
  en: ʿAlī b. Īnāl, al-Amīr ʿAlāʾ al-Dīn, one of the close associates of al-Ẓāhir Jaqmaq. He was sent by him with a gift to the King of Rūm, Murād b. ʿUthmān, in the year 843 AH. Al-Maqrīzī said this in al-Ḥawādith.
