translation:
  ja: アブドゥルカーディル・ブン・ムスタファー・ブン・ムハンマド・ブン・ムハンマド・ブン・イブラーヒーム・ブン・アリー・アッ＝ザイン・アル＝カーヒリー・アッ＝シャーフィイー。イブン・ムスタファーとして知られる。ヒジュラ暦832年に生まれ、アル＝イバーディーやアル＝ムナーウィーらのもとで学問に励み、我らがシャイフ（イブン・ハジャル）らから聴聞し、貴重な書籍を収集した。アッ＝シャラフ・アル＝アンサーリーの娘と婚姻したが、その後困窮し、アル＝ムナーウィーによって裁判官代理に任命された後に、不名誉な嫌疑をかけられた。ヒジュラ暦860年頃に没したと推測される。
  en: ʿAbd al-Qādir b. Muṣṭafā b. Muḥammad b. Muḥammad b. Ibrāhīm b. ʿAlī al-Zayn al-Qāhirī al-Shāfiʿī, known as Ibn Muṣṭafā. He was born in the year 832 AH and engaged in studies under al-ʿIbādī, al-Munāwī, and others. He heard (ḥadīth) from our shaykh (Ibn Ḥajar) and others, and acquired precious books. He became allied by marriage to al-Sharaf al-Anṣārī, but later became impoverished and was accused of inappropriate things after al-Munāwī appointed him as a deputy judge. He died around 860 AH, presumably.
