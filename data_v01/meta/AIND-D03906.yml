translation:
  ja: アブドゥッラッザーク・ブン・アブドゥッラー。ウマイヤ・モスクに滞在（ムジャーワラ）していた。人々の畏敬を集めた人物（ムウタカド）の一人であり、追随者たちがいた。810年ジュマーダー・アル＝ウーラー月に没し、70歳に達していた。我らがシャイフ（イブン・ハジャル）がその『インバー』において彼に言及している。
  en: ʿAbd al-Razzāq ibn ʿAbd Allāh, who performed jiwār (extended devotional stay) at the Umayyad Mosque. He was one of those who were highly revered and had followers. He died in Jumādā I in the year 810 AH, having reached seventy years of age. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
