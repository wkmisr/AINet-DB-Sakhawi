    ja: '祖父 المحيوي ＝ #AIND-D04139「عبد القادر بن عبد الله بن محمد بن عبد الله بن عمر بن أبي بكر … محيي الدين أبو محمد الناشري اليماني القاضي」（798年生・855年没）。見出しの祖父名 عبد القادر بن عبد الله、ラカブ محيي الدين（＝المحيوي）、ニスバ الناشري が一致（内容検証で追加。校閲者は TSV で祖父を「المحيوي عبد القادر بن عبد الله الناشري」と特定しながら本伝を引いていなかった）。'
