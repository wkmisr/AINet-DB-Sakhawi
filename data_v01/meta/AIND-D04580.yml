translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アブドゥルカーディル・ブン・アブドゥッラー、アル＝アフィーフ・アブー・ムハンマド・ブン・アル＝ジャマール・イブン・アル＝ムヒユウィー、アン＝ナーシリー・アル＝ヤマーニー・アッ＝シャーフィイー。マッカで私（サハーウィー）にアル＝ムンズィリーの『用事の充足に関する40ハディース』を朗誦し、私からいくつかのものを聴聞した。私は彼にイジャーザを書いた。
  en: ʿAbd Allāh b. Muḥammad b. ʿAbd al-Qādir b. ʿAbd Allāh, al-ʿAfīf Abū Muḥammad b. al-Jamāl b. al-Muḥyawī, al-Nāshirī al-Yamānī al-Shāfiʿī. He read to me (al-Sakhāwī) in Mecca al-Mundhirī's al-Arbaʿīn fī qaḍāʾ al-ḥawāʾij, heard a number of things from me, and I wrote an ijāza for him.
