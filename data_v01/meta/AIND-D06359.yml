translation:
  ja: クトルブガー・アッ＝スードゥーニー、（主人は）スードゥーン・アッ＝シャイフーニー。前述のザイン・カースィム・アル＝ハナフィーの父。ラアス・ナウバの一人であったと言われ、アッ＝ザッラーフとあだ名された。息子がまだ幼いうちに没した。
  en: Quṭlūbughā al-Sūdūnī, (mamlūk of) Sūdūn al-Shaykhūnī, father of al-Zayn Qāsim al-Ḥanafī mentioned above. It is said that he was one of the heads of the guard (ruʾūs al-nuwab), and he was nicknamed al-Zarrāf. He died while his son was still small.
