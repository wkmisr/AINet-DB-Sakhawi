translation:
  ja: アリー・ブン・アビー・アル＝カースィム・ブン・ムハンマド・ブン・フサイン・アル＝ヤマニー・アッ＝ザイディー、イブン・シュカイフとして知られる。マッカにおけるザイド派の名士の一人で、彼らにファトワーを出し、彼らのために婚姻契約を結ぶ者であった。816年ズー・アル＝カアダ月にそこ（マッカ）で没し、アル＝マアラーに葬られた。70代であった。アル＝ファースィーが『マッカ（史）』で彼に言及している。
  en: ʿAlī b. Abī al-Qāsim b. Muḥammad b. Ḥusayn al-Yamanī al-Zaydī, known as Ibn Shuqayf. He was one of the notables of the Zaydīs in Mecca, among those who issued fatwās for them and contracted their marriages. He died there in Dhū al-Qaʿda of the year 816 and was buried in al-Muʿallā, being in his seventies. Al-Fāsī mentioned him in (his history of) Mecca.
