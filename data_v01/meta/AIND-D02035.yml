translation:
  ja: アクバルディー・アル＝ムザッファリー。アル＝ムアイヤドの時代にはジャムダーリーヤ隊のラアス・ナウバ（隊長）を務め、その後アル＝ザーヒル・ジャクマクの時代にはアミール・アシャラ（十人長）となった。その後、小ノウバ隊長の一人となり、次いでアミール・アッ＝ラクブ（隊商長）が彼を初めて派遣し、さらにアル＝ムハンマディーのスードゥーンの後任としてスルタン直属マムルークたちのムカッダム（隊長）としてメッカへ派遣された。その経歴は賞賛されるべきものであった。847年シャウワール月24日の火曜の夜にメッカで没。
  en: Aqbardī al-Muẓaffarī served as raʾs nawbat al-Jamdāriyya during the days of al-Muʾayyad. Then he became an amīr ʿashara (commander of ten) during the days of al-Ẓāhir Jaqmaq. After that, he became one of the ruʾūs al-nūb al-ṣighār (heads of the minor guards). Then the amīr al-rakb (caravan commander) sent him for the first time, and subsequently he was dispatched to Mecca as muqaddam over the sultanic mamluks there, succeeding Sawdūn al-Muḥammadī. His conduct was praiseworthy. He died in Mecca on the night of Tuesday, the 24th of Shawwāl, in the year 847 H.
