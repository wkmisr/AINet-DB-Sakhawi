translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ビラール、アル＝マッキー、ハラム（マッカ聖モスク）の灯火係（ワッカード）。（8）05年にアル＝イラーキー、アル＝ハイサミー、イブン・スィッディークが彼にイジャーザを与えた。（8）47年ラマダーン月に同地（マッカ）で没した。イブン・ファハドがその没年月を記録している。
  en: ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh b. Bilāl, al-Makkī, the lamp-lighter (waqqād) at the Ḥaram (the Sacred Mosque of Mecca). In (8)05 al-ʿIrāqī, al-Haythamī and Ibn Ṣiddīq granted him an ijāza. He died there (in Mecca) in Ramaḍān (8)47; Ibn Fahd recorded his death.
