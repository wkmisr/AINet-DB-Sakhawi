translation:
  ja: アリー・ブン・ウマル・ブン・アフマド・ブン・フィトヤーン、アン＝ヌール・アッ＝サカンダリー、商人。（私の）2度目のマッカ滞在中に、マッカで私（サハーウィー）に師事（密着）した者の一人で、その後カイロでも同様に私のもとへ通った。富裕であった後に困窮の様に陥ったが、身を慎み目立たぬように暮らしていた。ときに正気が減退し、うわ言が増した。
  en: ʿAlī b. ʿUmar b. Aḥmad b. Fityān, al-Nūr al-Sakandarī, the merchant. He was among those who kept close company with me (al-Sakhāwī) in Mecca during (my) second sojourn there, and likewise he later frequented me in Cairo. After having been wealthy he fell into a state of destitution, while remaining self-restrained and discreet; at times his mind failed and his raving increased.
