translation:
  ja: クサイティル・ブン・ズハイル・ブン・スライマーン・アル＝フサイニー、マディーナのアミール。ダガイムの罷免の後、883年にヒジャーズの主（マッカのシャリーフ）の助力を得てその職に就き、887年の途中まで在職した。その後、エジプトの主がヒジャーズ諸地の事務を彼（ヒジャーズの主）に委ねたことから、前記の者（ダガイム）に代償を与えるという口実で罷免された。
  en: Qusayṭil b. Zuhayr b. Sulaymān al-Ḥusaynī, amir of Medina. He assumed its governorship after the removal of Ḍughaym in the year 883, with the assistance of the lord of the Ḥijāz, and remained until partway through the year 887; then he was removed on the pretext of compensating the aforementioned (Ḍughaym), because the lord of Egypt had added the affairs of the lands of the Ḥijāz to him (the lord of the Ḥijāz).
