translation:
  ja: ダーウード・ブン・ナースィル・アッ＝ディーン・ムハンマド・ブン・アッ＝サービク・アル＝ヒムスィー。アブー・アル＝ガイス・ムハンマド・ブン・アブドゥッラー・ブン・アッ＝サーイクらから、アル＝ハッジャール伝承の『サヒーフ』の一部を聴聞した。ハフィズのイブン・ムーサーと、我らがシャイフであるアル＝ムワッファク・アル＝アビーがホムスで彼に面会し、彼からブハーリーのハディースをいくつか取得した後、彼は死去した。
  en: Dāwūd b. Nāṣir al-Dīn Muḥammad b. al-Sābiq al-Ḥimṣī. He heard a portion of the Ṣaḥīḥ (al-Bukhārī) transmitted via al-Ḥajjār from Abū al-Ghayth Muḥammad b. ʿAbd Allāh b. al-Ṣāʾigh and others. The Ḥāfiẓ Ibn Mūsā and our shaykh al-Muwaffaq al-Abī met him in Homs and received some Hadiths of al-Bukhārī from him, after which he died.
