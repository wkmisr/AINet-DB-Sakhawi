translation:
  ja: アズバク・アル＝アシュカル・アッ＝ラマダーニー・アッ＝ザーヒリー・バルクーク。タブルハーナ級アミール、ラアス・ナウバ（隊長）。806年ラビーウ・アル＝アウワル月14日火曜の夜に死去し、翌日埋葬された。彼は多大な財産を残したが、それはナーシルによって没収された。彼はナーシルのもとで高い地位にあった。
  en: Uzbak al-Ashqar al-Ramaḍānī al-Ẓāhirī Barqūq, Amir of the Kettle-drums and Head of a Nawba (military unit). He died on the night of Tuesday, the 14th of Rabīʿ al-Awwal in the year 806 H. He was buried the following day. He left behind a great deal of wealth, which was seized by al-Nāṣir. He held a high position with al-Nāṣir.
