translation:
  ja: ムハンマド・ブン・アブドゥッラッザーク・ブン・アブドゥルカリーム・ブン・アブドゥルガニー・ブン・ヤアクーブ、ファトフ・アッ＝ディーン・アブー・アル＝ファトフ・イブン・アッ＝タージュ・イブン・アル＝カリーム・イブン・アル＝ファフル。前述のアブドゥルカリームの兄弟で、こちらが年長。先祖と同じくイブン・フハイラ（祖先〔のラカブ〕の縮小形）として知られる。病院（ビーマーリスターン）の管理証人（シャーヒド・アル＝イダーラ）の一人で、これをシャリーフのカマール・アッ＝ディーン・イブン・アル＝ムハイリクから受け継いだ。さらにマムルーク登録書記のユースフ・ブン・アビー・アル＝ファトフの代理として同病院の監督（ナザル）を執行し、彼の名義でマムルーク庁（ディーワーン・アル＝ママーリーク）における職務もある。人物に問題はない。私（サハーウィー）への聴聞、およびそこ（弟の項）で述べたすべてにおいて弟と行動を共にした。
  en: Muḥammad b. ʿAbd al-Razzāq b. ʿAbd al-Karīm b. ʿAbd al-Ghanī b. Yaʿqūb, Fatḥ al-Dīn Abū al-Fatḥ b. al-Tāj b. al-Karīm b. al-Fakhr, the brother of ʿAbd al-Karīm mentioned above, this one being the elder; like his forebears he is known as Ibn Fukhayra, a diminutive of his ancestor's [laqab]. He is one of the witnesses of the administration (shuhūd al-idāra) at the hospital (bīmāristān), which he received from al-Sharīf Kamāl al-Dīn b. al-Muḥayriq; indeed he exercised the deputy supervision (niyābat al-naẓar) of it on behalf of the clerk of the Mamlūks, Yūsuf b. Abī al-Fatḥ, and there is a post in his name in the Dīwān al-Mamālīk. There is no harm in him. He joined his brother in hearing from me (al-Sakhāwī) and in everything mentioned there.
