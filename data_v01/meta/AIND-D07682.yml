translation:
  ja: ムハンマド・ブン・アブドゥルアズィーズ・ブン・ムスリム、アッ＝シャムス、アブー・アブドゥッラー・アル＝ムスタナーニー・アル＝マグリビー・アッ＝サカンダリー・アル＝マーリキー。その父は前述。875年、あるいはその翌年の初頭に、ディムヤート（ダミエッタ）で没した。というのも彼はアル＝マンスール〔ウスマーン〕に随行して同地に赴いたからで、それは彼がアル＝マンスールのイマーム（礼拝導師）であり、アル＝マンスールが彼に格別の信を寄せていたためである。彼は敬虔と学識、理性と静穏によって広く知られていた。彼は多くを自筆で書写した。神よ彼と我らを憐れみたまえ。
  en: Muḥammad b. ʿAbd al-ʿAzīz b. Muslim, al-Shams Abū ʿAbd Allāh al-Mustanānī al-Maghribī al-Sakandarī al-Mālikī; his father has been mentioned above. He died in the year 875, or at the beginning of the following year, in Damietta, for he had gone there in the company of al-Manṣūr [ʿUthmān], since he was his imam and al-Manṣūr held him in especially high regard; he was widely reputed for piety and learning, with intelligence and composure. He copied a great deal in his own hand. May God have mercy on him and on us.
