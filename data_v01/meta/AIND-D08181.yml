translation:
  ja: ムハンマド・ブン・アリー・ブン・ムハンマド、アル＝バドル、アル＝カーヒリー、ワキール（代理人）。後述のアッ＝タキー・ムハンマド・アル＝ハナフィーの父で、イブン・アル＝カッザーズィーとして知られる。自らの生業において出世し、品位と分別を備えつつ財を成した者の一人。没した（年の記載なし）。
  en: Muḥammad b. ʿAlī b. Muḥammad, al-Badr al-Qāhirī, the wakīl (agent), father of al-Taqī Muḥammad al-Ḥanafī who comes below, known as Ibn al-Qazzāzī. One of those who rose in their trade and grew wealthy, with dignity and good sense. He died (no date given).
