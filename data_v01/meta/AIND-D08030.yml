translation:
  ja: ムハンマド・ブン・アリー・ブン・アフマド・アン＝ナッジャーリー、アブー・アル＝アッバース・ブン・アル＝ガムリーの門人集団の一人。クルアーンを読み、いくつかの講義を修め、私（サハーウィー）から口述（イムラー）その他を聴聞し、両聖地にしばらく隣住（ムジャーワラ）した。
  en: Muḥammad b. ʿAlī b. Aḥmad al-Najjārī, one of the circle of Abū al-ʿAbbās b. al-Ghamrī. He read the Qurʾān, acquired some lessons, heard from me at the dictation sessions and elsewhere, and sojourned in the two sanctuaries (Mecca and Medina) for a period.
