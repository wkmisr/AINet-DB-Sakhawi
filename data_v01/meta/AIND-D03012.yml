translation:
  ja: ラマダーン・アッ＝ラカーニー、のちにアル＝カーヒリー、アル＝バハーイー、商人。イブン・アサドやアブー・アッ＝サアーダート・アル＝ブルキーニーらに師事して学び、ハッジ（大巡礼）を行った。善行を志し、自身の息子を我らがシャイフ・アッ＝ラシーディーの息子ヤフヤーの娘と結婚させた。888年の初頭に死去した。神が彼を赦されんことを。
  en: Ramaḍān al-Laqānī, then al-Qāhirī, al-Bahāʾī, the merchant. He studied under Ibn Asad, Abū al-Saʿādāt al-Bulqīnī, and others, and performed the Hajj. He was inclined toward charity, and married his son to the daughter of Yaḥyā, the son of our shaykh al-Rashīdī. He died in the beginning of the year 888 AH. May God forgive him.
