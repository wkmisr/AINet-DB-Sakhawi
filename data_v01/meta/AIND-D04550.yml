translation:
  ja: アブドゥッラー・ブン・アビー・アル＝ファドル・ムハンマド・ブン・アフマド・ブン・ザヒーラ・ブン・アフマド・ブン・アティーヤ・イブン・ザヒーラ・アル＝クラシー。マッカで生まれ、そこで育った。イブン・アル＝ジャザリー、アッ＝シャムス・アル＝ビルマーウィー、イブン・サラーマ、アッ＝シャーミーらから聴聞し、イブン・アブド・アル＝ハーディーの娘、アッ＝ザイン・アル＝マラーギー、イブン・アル＝クワイクらが彼にイジャーザを与えた。830年末あるいはその翌年初めにマッカで没した。神よ彼を憐れみたまえ。
  en: ʿAbd Allāh b. Abī al-Faḍl Muḥammad b. Aḥmad b. Ẓahīra b. Aḥmad b. ʿAṭiyya Ibn Ẓahīra al-Qurashī. He was born in Mecca and grew up there. He heard from Ibn al-Jazarī, al-Shams al-Birmāwī, Ibn Salāma, al-Shāmī and others, and the daughter of Ibn ʿAbd al-Hādī, al-Zayn al-Marāghī, Ibn al-Kuwayk and others granted him an ijāza. He died in Mecca at the end of the year 830 or at the beginning of the following year. May God have mercy on him.
