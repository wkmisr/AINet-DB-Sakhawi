  note:
    ja: '見出しナサブより（規則3・37）。父 إبراهيم بن علي بن فرحون＝マディーナのマーリク派の البرهان بن فرحون（ID-Master 登録 TMP-P-000097「البرهان بن فرحون」、corpus に本伝なし。repo 先例 #AIND-D10040・#AIND-D05582・#AIND-D07201 で8世紀末の師として使用）。corpus 本文はこの人を「إبراهيم بن علي بن فرحون」「أبي إسحق إبراهيم بن علي بن فرحون」（#AIND-D04746・#AIND-D05936・#AIND-D08660・#AIND-D07606）と呼び、#AIND-D08874 は「قريبه القاضي أبي اليمن محمد بن البرهان بن فرحون」として البرهان の子 محمد を伝える＝名・父名・家名で閉合。初版は father relation なし。'
notes:
- text: '本文は「سنة أربع عشرة وثمانمائة」（814年）で終わり、年にかかる動詞がない（刊本・corpus とも同じ。途切れ）。年の意味（没年か生年か）が原文に書かれていないので birth／death は作らない（規則45、ブリーフの指示どおり）。初版は death when-custom="0814" とし訳文に「没した」を補っていた＝除去。候補（記録のみ）: #AIND-D08874「وولي قضاء المدينة بعد قريبه القاضي أبي اليمن محمد بن البرهان بن فرحون」＝マディーナのカーディー أبو اليمن محمد が本項主とみられるが、本項にクンヤ・職の記載はなく、属性は補わない（規則23）。ISSUES §D169-2。'
