translation:
  ja: ハムザ・ベク・ブン・アリー・ベク・ブン・ナースィル・アッ＝ディーン・ブン・ズルカディル（ズルガディル）。840年ジュマーダー・アル＝ウーラー（第5月）にカイロのシタデル（城塞）に投獄されたまま死去した。我らがシャイフ（イブン・ハジャル）がその歴史書『インバー・アル＝グムル』で彼について言及している。
  en: Hamza Bek, son of Ali Bek, son of Nasir al-Din, son of Dulkadir. He died while imprisoned in the Citadel (Qal'at al-Jabal) in Jumada al-Ula, the year 840 AH. Our shaykh (Ibn Hajar) mentioned him in his history book, Inba' al-Ghumr.
