translation:
  ja: アリー・アル＝アスユーティー。アブー・アル＝ハルクとして知られる。我らがシャイフ（イブン・ハジャル）がその『インバー（・アル＝グムル）』で言及したシャイフで、「崇敬される者の一人で、彼については多くの神秘的開示（ムカーシャファート）が語り伝えられている」と述べている。（8）33年に没した。
  en: 'ʿAlī al-Asyūṭī, known as Abū al-Ḥalq. A shaykh whom our shaykh (Ibn Ḥajar) mentioned in his Inbāʾ (al-Ghumr), saying: "He was one of those who were venerated, and many mystical disclosures (mukāshafāt) are related of him." He died in the year (8)33.'
