translation:
  ja: ユースフ・ブン・アフマド・ブン・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・フサイン・ブン・ビシュル、アル＝ヤマニー、マッカの寄留者、アル＝ラクサとして知られる。（8）49年ジュマーダー・アッ＝サーニヤ月にマッカで没した。イブン・ファハドがその没年を記している。
  en: Yūsuf b. Aḥmad b. Muḥammad b. Aḥmad b. Muḥammad b. Ḥusayn b. Bishr, al-Yamanī, resident of Mecca, known as al-Laqsa. He died in Jumādā II of the year [8]49 in Mecca. Ibn Fahd recorded his death.
