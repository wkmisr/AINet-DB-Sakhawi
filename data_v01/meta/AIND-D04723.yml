translation:
  ja: アブドゥルムウミン・ブン・アブドゥッラヒーム、サフィー・アッ＝ディーン、アッ＝シルワーニー、シャーフィイー派。後述のアブドゥルムフスィン・イブン・アブドゥッサマドの母方の叔父。その姉妹の息子（甥）が彼から法学・文法学・論理学などを学んだ。
  en: ʿAbd al-Muʾmin b. ʿAbd al-Raḥīm, Ṣafī al-Dīn al-Shirwānī al-Shāfiʿī, maternal uncle of ʿAbd al-Muḥsin b. ʿAbd al-Ṣamad who will be mentioned below. His sister's son studied jurisprudence, grammar, logic and other subjects under him.
