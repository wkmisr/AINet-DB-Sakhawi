translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・イスマーイール・ブン・アブドゥッラー、アッ＝シャムス・アル＝ジャアバリー・アル＝ハンバリー・アル＝カッバーニー・アル＝アービル、後述のアル＝イマード・ムハンマドの父。我らの師（イブン・ハジャル）は『インバー』で——そこでは彼の祖父はイブラーヒームと名づけられている——次のように述べた。「秤量の生業に携わり、ハンバル派の講義とサイード・アッ＝スアダーのスーフィーの給費に加わり、夢解釈に卓越した」。808年ジュマーダー・アル＝アーヒル月に没した。アル＝マクリーズィーは『ウクード』でこれに従い、彼が解釈した夢のいくつかを語り、彼がハウシュ・アッ＝スーフィーヤに埋葬されたと伝えた。
  en: 'Muḥammad b. Abī Bakr b. Ismāʿīl b. ʿAbd Allāh, al-Shams al-Jaʿbarī al-Ḥanbalī al-Qabbānī al-ʿĀbir, the father of al-ʿImād Muḥammad, mentioned below. Our shaykh said in his Inbāʾ—where his grandfather is named Ibrāhīm—: he practised the craft of the steelyard (qabbān), held stipends in the Ḥanbalī lessons and among the Sufis of Saʿīd al-Suʿadāʾ, and excelled in the interpretation of dreams. He died in Jumādā al-Ākhir of the year [80]8. Al-Maqrīzī followed him in his ʿUqūd, related some of the dreams he had interpreted, and (stated) that he was buried in Ḥawsh al-Ṣūfiyya.'
