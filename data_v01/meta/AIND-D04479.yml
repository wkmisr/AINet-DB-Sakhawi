translation:
  ja: アブドゥッラー・ブン・アブドゥッラティーフ、アブー・ムハンマド、アル＝ハドラミー。マッカに寄留し、アル＝イラーキーの名で知られた。人々から（聖者として）信仰される人物で、イブン・ファハドは彼を聖性・敬虔・禁欲をもって評し、その死をヒジュラ暦847年ジュマーダー・アッ＝サーニヤにマッカで記録した。彼はアッ＝シャビーカに葬られた。
  en: ʿAbd Allāh b. ʿAbd al-Laṭīf Abū Muḥammad al-Ḥaḍramī, a resident of Mecca, known as al-ʿIrāqī. He was a man in whom people placed their faith; Ibn Fahd described him with sainthood, righteousness and asceticism, and dated his death to Jumādā II of the year 847 in Mecca. He was buried at al-Shabīka.
