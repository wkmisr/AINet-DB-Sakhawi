translation:
  ja: ムハンマド・ブン・アッ＝シャイフ・サアド、アッ＝シャムス・アル＝ハドラミー・アル＝マダニー、アブー・ル＝ファラジュ・アル＝マラーギーの同母兄弟。アル＝ジャマール・アル＝カーザルーニーとアブー・ル＝ファトフ・アル＝マラーギーから聴聞し、前述の兄弟に同行してカイロへ旅し、彼とともに我らがシャイフ（イブン・ハジャル）から若干のものを聴聞した。没した。（没年の記載なし）
  en: Muḥammad b. al-Shaykh Saʿd, al-Shams al-Ḥaḍramī al-Madanī, the uterine brother of Abū al-Faraj al-Marāghī. He heard from al-Jamāl al-Kāzarūnī and Abū al-Fatḥ al-Marāghī, and accompanied his aforementioned brother on the journey to Cairo, where he heard some things with him from our shaykh (Ibn Ḥajar). He died [date blank].
