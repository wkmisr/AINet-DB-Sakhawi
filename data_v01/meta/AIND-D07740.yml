translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・イブラーヒーム・ブン・ハンマーム、アッ＝シャムス、アッ＝シャーミー、のちにアル＝マッキー。マッカで子供の教育に携わった者。ヒジュラ暦842年ラビーウ・アル＝アーヒル月にマッカで没した。イブン・ファハドが彼の没年を記録している。彼はマッカに来て定住し、そこで子供たちを教え、アフマド・アッ＝シャウバキーの娘ザイナブと結婚して、彼女との間にアフマドやアブー・アル＝ファトフらの子をもうけた。貧しいが祝福された人物であった。アッ＝シラージュ・ウマル・ブン・アル＝ムザッラクがマッカに来た際、クアイキアーンに家を買い、彼とその子らのためにワクフとした。
  en: Muḥammad b. ʿAbd Allāh b. Ibrāhīm b. Hammām, al-Shams, al-Shāmī, then al-Makkī, the children's tutor there. He died in Mecca in Rabīʿ al-Ākhir 842; Ibn Fahd recorded his death date. He had come to Mecca and settled there, teaching children, and married Zaynab, daughter of Aḥmad al-Shawbakī, who bore him children including Aḥmad and Abū al-Fatḥ. He was poor but blessed. When al-Sirāj ʿUmar b. al-Muzalliq came to Mecca he bought a house in Quʿayqiʿān and endowed it as a waqf for him and his children.
