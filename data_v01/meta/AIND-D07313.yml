translation:
  ja: ムハンマド。前の4人に続く5人目（の兄弟）。854年ラビーウ・アル＝アーヒル月13日月曜日に、生後10か月に満たないまま没した。父が城塞（アル＝カルア）で彼の葬礼の礼拝を行い、次いでアミールや官吏をはじめとする有力者たちが葬列に付き添い、バイナ・アル＝カスライン（両宮殿の間）のバルクーキーヤに埋葬された。これは、彼の母がアミール・スィラーフ（武器長官）ジャルバーシュ・アル＝カリーミーの娘フワンドであり、その母がアッ＝ザーヒル・バルクークの縁者カーニバーイの娘であったためである。人々は彼の棺をズワイラ門の二つの門から（市内へ）入れた。
  en: Muḥammad, the fifth after the four preceding him. He died on Monday, 13 Rabīʿ al-Ākhir 854, not having completed ten months of age. His father led the funeral prayer over him at the Citadel, and then the notables among the amirs, the administrators and others accompanied his bier until he was buried at al-Barqūqiyya in Bayn al-Qaṣrayn, because his mother was Khawand, the daughter of the Amīr Silāḥ Jarbāsh al-Karīmī, whose own mother was the daughter of Qānibāy, a relative of al-Ẓāhir Barqūq. They brought his bier in through the two gates of Bāb Zuwayla.
