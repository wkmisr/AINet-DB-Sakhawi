translation:
  ja: アリー・ブン・アフマド・ブン・サイード・ブン・ハールーン、アラー・アッ＝ディーン、アル＝ムハンマディー、ヤズド出自でのちにアル＝カーヒリー、ハナフィー派。後述するアル＝アラー・アリーの父。アッ＝タズマンティーとして知られ、シャイフ・アル＝マシャーイフ（長老たちの長老）と称された。父などに学んだ。（8）33年ムハッラム月にペストで90歳あまりで没し、ジャーミウ・アール・マリク（アール・マリク・モスク）の近くの自宅に埋葬された。
  en: ʿAlī b. Aḥmad b. Saʿīd b. Hārūn, ʿAlāʾ al-Dīn al-Muḥammadī, of Yazdī origin, then al-Qāhirī, the Ḥanafī, father of al-ʿAlāʾ ʿAlī, who is mentioned below. He was known as al-Tazmantī and bore the title Shaykh al-Mashāyikh. He studied under his father and others. He died of the plague in Muḥarram (8)33, aged over ninety, and was buried in his house near the Mosque of Āl Malik.
