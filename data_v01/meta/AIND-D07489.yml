translation:
  ja: ムハンマド・ブン・サダカ・ブン・ハリール・ブン・アル＝ハサン、アッ＝シャムス・ブン・アッ＝ザイン・ブン・アル＝バドル・アル＝ハラビー。イブン・アル＝ファルフール（二つのファーのうち最初のものにファトハ）として知られる。私が本人の自筆で読んだところによれば、［ヒジュラ暦］766年シャアバーン月半ばの月曜の夜にアレッポで生まれ、同地で育った。そしてアッ＝シハーブ・アフマド・ブン・アブド・アル＝アズィーズ・ブン・アル＝ムラッハルから、アル＝カッラーブの『ファドル・アッ＝ラムイ（弓射の功徳）』などを聴聞した。彼はハディースを伝え、学識ある者たちが彼から聴聞した。［8］51年に私にイジャーザを与えた。彼は公証人（シャハーダ）を生業とし、公証文書の書式（シュルート）に通じ、能書で善良であった。［8］51年以降に没した。彼の父はクルアーン読誦諸法（キラーアート）を学んだ者の一人であり、祖父はアレッポのディーワーンの書記であった。
  en: Muḥammad b. Ṣadaqa b. Khalīl b. al-Ḥasan, al-Shams b. al-Zayn b. al-Badr al-Ḥalabī, known as Ibn al-Farfūr (with two fāʾs, the first of them vowelled with fatḥa). He was born, as I read in his own handwriting, on the night of Monday in the middle of Shaʿbān of the year 766 in Aleppo, and grew up there. He heard from al-Shihāb Aḥmad b. ʿAbd al-ʿAzīz b. al-Muraḥḥal the Faḍl al-ramy of al-Qarrāb and other works. He transmitted ḥadīth, and men of learning heard from him. He granted me an ijāza in the year [8]51. He earned his living by notarial witnessing, being familiar with the notarial formularies, with fine handwriting and goodness. He died after the year [8]51. His father was among those who studied the Qurʾānic readings, while his grandfather was the scribe of the dīwān in Aleppo.
