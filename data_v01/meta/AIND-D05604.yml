translation:
  ja: アリー・ブン・ムハンマド・ブン・アッ＝シャリーフ・ヌール・アッ＝ディーン・アル＝ハサニー・アッ＝サフラーウィー。ヤシュバク・アル＝ジャマーリーのヒスバ職における代理で、イブン・ワリー・アッ＝ディーンとして知られる。父は敬虔な人物で、彼らは敬虔の家柄であった。アル＝アシュラフ・カーイトバーイ廟のスーフィーの長に仕える職に就いたが、のちに他の者と交代させられ、カーティブ・アッ＝スィッルのイブン・ムズヒルが自らの廟に彼を任用し、彼はそこに住んだ。
  en: ʿAlī b. Muḥammad b. al-Sharīf Nūr al-Dīn al-Ḥasanī al-Ṣaḥrāwī, deputy of Yashbak al-Jamālī in the ḥisba, known as Ibn Walī al-Dīn. His father was a pious man; indeed they were of a pious house. He was appointed to the service of the shaykh of the Sufis at the mausoleum of al-Ashraf Qāytbāy, then was replaced by another, and the kātib al-sirr Ibn Muzhar appointed him at his own mausoleum, where he took up residence.
