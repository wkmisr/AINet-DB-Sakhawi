translation:
  ja: アリー・ブン・アブド・アル＝アズィーズ・ブン・アブド・アル＝カーフィー・アッ＝ダクーキー。前項の人物の祖父。資産家で、マッカに隣住（ムジャーワラ）し、同地に不動産と子供たちを残した。805年ズー・アル＝ヒッジャ月8日木曜日に同地で没し、マアラー墓地に葬られた。アル＝ファースィーが『マッカ〔史〕』でそう述べている。
  en: ʿAlī b. ʿAbd al-ʿAzīz b. ʿAbd al-Kāfī al-Daqūqī, the grandfather of the preceding. He was a man of means who took up residence (mujāwara) in Mecca and left behind there real estate and children. He died there on Thursday, 8 Dhū al-Ḥijja of the year 805, and was buried at al-Muʿallā. So said al-Fāsī in [his history of] Mecca.
