translation:
  ja: アクバルディー・マントゥー、渾名はタアーム。ムアイヤド朝期のマムルーク軍人。その後ダマスカスに転任し、アミール・タブールハーナー（軍楽隊長）兼第二ハージブを務め、830年後までその職にあった。
  en: Aqbardī Mantū, nicknamed Ṭaʿām. He was one of the amirs of the Muʾayyadī state. He was then transferred to Damascus, serving as Amīr Ṭablakhānāh and second Ḥājib until his death after the year 830 H.
