translation:
  ja: ムハンマド・ブン・サーリム・ブン・ハリール・ブン・イブラーヒーム、アル＝アッバーディー出身で、アル＝カーヒリー・アル＝アズバキー。兄弟のイブラーヒームとアフマドは既出で、この者が3人のうち最年長である。生まれは855年頃。ハナフィー派を自称したが、賞賛される人物ではない。イブン・アッ＝シフナがハディージャ・アッ＝ラハービーヤ（の項）で後述する2行の詩で当てこすったのは彼のことであり、実態はそれ以上である。
  en: Muḥammad b. Sālim b. Khalīl b. Ibrāhīm, of ʿAbbādī origin, al-Qāhirī al-Azbakī; his brothers Ibrāhīm and Aḥmad were mentioned above, and this one is the eldest of the three. He was born in about the year [8]55. He called himself a Ḥanafī, but he is not praiseworthy; he is the one to whom Ibn al-Shiḥna alluded in his two verses that will come under Khadīja al-Raḥābiyya, and the matter is worse than that.
