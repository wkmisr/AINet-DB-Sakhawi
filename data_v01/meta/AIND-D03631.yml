translation:
  ja: アブドゥルラフマーン・ブン・ダーウード・アッ＝ザイン・ブン・アル＝クワイズ。前の伝記の人物（ダーウードの子アブドゥッラフマーン、すなわちAIND-D03630）の祖父にあたる。イスラームへの改宗を公にする前の名はジルジス（ゲオルギウス）であった。マクリーズィーは、その伝記集『ウクード』において、ダーウードの項で前に述べられたのと同様に、彼について言及している。
  en: ʿAbd al-Raḥmān b. Dāwūd al-Zayn b. al-Kuwayz, the grandfather of the preceding subject (AIND-D03630, ʿAbd al-Rahmān b. Dāwūd b. ʿAbd al-Rahmān b. Dāwūd). His name before openly professing Islam was Jirjis (George). Al-Maqrīzī mentioned him in his biographical work 『al-ʿUqūd』 in a manner similar to what was previously mentioned concerning [his father] Dāwūd.
