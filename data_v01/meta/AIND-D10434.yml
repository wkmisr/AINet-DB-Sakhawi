translation:
  ja: ユースフ・ブン・アフマド・ブン・ハサン・ブン・アリー・ブン・ムハンマド・ブン・アブド・アッ＝ラフマーン、アル＝ムヒッブ、アッ＝シハーブの子、アズリアート出身の家系でカイロの人。兄弟たちの一人で、母は自由人の女性（以下欠）。ザーヒリーヤで『アル＝ブハーリー』を聴いた者の一人。
  en: Yūsuf b. Aḥmad b. Ḥasan b. ʿAlī b. Muḥammad b. ʿAbd al-Raḥmān, al-Muḥibb, son of al-Shihāb, of Adhriʿāt origin, the Cairene, one of the brothers; his mother was a free woman … [lacuna]. He was among those who heard (part of) al-Bukhārī at the Ẓāhiriyya.
