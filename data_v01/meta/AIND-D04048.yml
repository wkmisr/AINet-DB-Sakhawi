translation:
  ja: アブドゥルガフール・ブン・アブドゥルバッル・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・アッ＝シフナ。カーディーのアル＝ムヒッブ（イブン・アッ＝シフナ）の孫で、父（アブドゥルバッル）は先述。幼少期にペストに罹って881年ズー・アル＝カアダ月に没し、一族の墓廟に葬られた。神が彼に楽園をもって報いたまわんことを。
  en: ʿAbd al-Ghafūr b. ʿAbd al-Barr b. Muḥammad b. Muḥammad b. Muḥammad b. al-Shiḥna, grandson of the qāḍī al-Muḥibb (Ibn al-Shiḥna); his father was mentioned previously. He died of the plague in his childhood in Dhū al-Qaʿda 881 and was buried in the family tomb. May God recompense him with Paradise.
