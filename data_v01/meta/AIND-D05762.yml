translation:
  ja: アリー・アル＝カリユービー、のちにアル＝カーヒリー。ジャズブ（恍惚）と、カシュフ（霊的開示）を示す諸状態（アフワール）で知られたシャイフで、非常に多くの人々が彼を（聖者として）信奉することで一致していた。（8）89年ムハッラム月に急死し、アル＝アムシャーティー家の墓所に葬られた。神が彼を憐れみたまえ。私は『ワファヤート（没年録）』で彼について詳しく述べた。
  en: ʿAlī al-Qalyūbī, then al-Qāhirī. A shaykh known for ecstasy (jadhb) and spiritual states indicating unveiling (kashf), such that a vast multitude agreed in venerating him. He died suddenly in Muḥarram (8)89 and was buried in the Turba of al-Amshāṭī, may God have mercy on him. I treated him at length in al-Wafayāt.
