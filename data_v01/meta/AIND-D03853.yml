translation:
  ja: アブド・アッ＝ラヒーム・ブン・アフマド・ブン・ムハンマド・ブン・マンスール。ザイン・アッ＝ディーン、またムヒッブ・アッ＝ディーン。フッワ出身、カイロ生まれ。フサイニーヤ地区に居住。イブン・バヒーフ（祖父のあだ名であるバッハの縮小形）として知られる。『ミンハージュ』を読誦・提示し、アル＝ハンナーウィー、アッ＝シャリーフ・アン＝ナッサーバ、アル＝イッズ・アブド・アッ＝サラーム・アル＝バグダーディーのもとで学んだ。公証人（シャーヒド）として生計を立て、さらにアル＝バドル・アブー・アッ＝サアーダート（・アル＝ブルキーニー）とその後任たちの代理として法官職を務めた。ヒジュラ暦879年ラマダーン月に没。ハンバリー派の法官シャムス・アッ＝ディーン・ブン・バイラムの妻の父親にあたる。
  en: ʿAbd al-Raḥīm b. Aḥmad b. Muḥammad b. Manṣūr, Zayn al-Dīn and Muḥibb al-Dīn. Originally from Fuwwa, of Cairo, residing in al-Ḥusayniyya, and known as Ibn Baḥīḥ (after his grandfather's nickname Baḥ). He recited and presented 『al-Minhāj』, studied under al-Ḥannāwī, al-Sharīf al-Nassāba, and al-ʿIzz ʿAbd al-Salām al-Baghdādī. He earned his living as a notary witness (al-Shahāda), and served as deputy judge on behalf of al-Badr Abū al-Saʿādāt and his successors. He died in Ramaḍān 879 AH. He was the father-of-the-wife of the Hanbali judge Shams al-Dīn b. Bayram.
