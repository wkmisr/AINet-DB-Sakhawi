translation:
  ja: サアド・ブン・アブドゥッラー・アル＝ハドラミー。アブドゥッラフマーン・ブン・アル＝ヤーフィイー、次いでウマル・アル＝ウラービーに20年以上仕えた。利他精神、任侠、公正さ、そして男気を備えた人物であり、ハドラマウトの人々の如く、その勤勉さ、精励、そして祈願が聞き届けられるという崇拝行為において驚異的な存在であった。818年にターイフで没した。
  en: Saʿd b. ʿAbd Allāh al-Ḥaḍramī. He served as a servant to ʿAbd al-Raḥmān b. al-Yāfiʿī, and subsequently to ʿUmar al-ʿUrābī, for a period exceeding twenty years. He was characterized by selflessness, chivalry, equity, and virtue, and was remarkable for his diligence, devotion, and worship, resembling the people of Hadramaut whose prayers are said to be answered. He died in al-Ṭāʾif in the year 818 AH.
