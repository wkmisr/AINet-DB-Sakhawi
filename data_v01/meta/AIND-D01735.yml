translation:
  ja: アフマド・アッ=シハーブ・イブン・アル=バシャーズィー（バシャーズィーは、単点のバーにカスラ、次に軽いシャダーなしの点付きシーン、その後に点付きのザーイ）。ダンジヤまたはドゥミヤートのウラマーの一人。アブドゥッラフマーン・ブン・アフマド・ブン・アブドゥッラー・アッ=ダンジーヒー（＝AIND-D03565）が彼のもとで（クルアーンを）朗誦した。
  en: 'Aḥmad al-Shihāb b. al-Bashāzī (al-Bashāzī: with a kasra on the single-dotted bāʾ, then a lightly dotted shīn without shadda, followed by a dotted zāy). He was one of the scholars of Danjiyya or Dumyāṭ. ʿAbd al-Raḥmān b. Aḥmad b. ʿAbd Allāh al-Danjīhī recited (the Qurʾān) to him.'
