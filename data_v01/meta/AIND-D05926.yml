translation:
  ja: ウマル・ブン・カイマーズ、ルクン・アッ＝ディーン、アブー・ハフス、アミール・サイフ・アッ＝ディーンの息子。カイロで生まれ、有力アミールたちの一団に仕え、スルターンのウスタダール職（数度）など多くの職務に当たったが、その身は大成しなかった。（80）9年ラジャブ月初日の月曜日に没した。アル＝アイニーほかが彼に言及している。アル＝マクリーズィーは「アレッポで」と付け加え、彼がザアファラーン運河の向かいにある、イブン・カイマーズのサビールとして知られるサビール（給水所）と墓廟の建立者であるとする。
  en: ʿUmar b. Qaymāz, Rukn al-Dīn Abū Ḥafṣ, son of the amīr Sayf al-Dīn. He was born in Cairo, served a number of leading amirs and held many offices, among them the post of ustādār of the Sultan several times, but his affairs did not prosper. He died on Monday, the first of Rajab of the year (80)9. Al-ʿAynī and others mentioned him; al-Maqrīzī added "in Aleppo", and that he was the founder of the sabīl (public fountain) and the turba (mausoleum) facing the Khalīj al-Zaʿfarān, known as the Sabīl of Ibn Qaymāz.
