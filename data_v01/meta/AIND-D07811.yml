translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・ヒドル、アッ＝シャムス・ブン・アル＝ジャマール、クーラーン出自のカイロ人、シャーフィイー派。父は前述。学問に励み、私（サハーウィー）やそのほかの者、たとえばイブン・カースィムに読誦したが、頭角を現すことはなかった。いくつかの（ワクフの）職禄を得たが、その後、容認されない行為に手を染めるようになり、戯言がひどく増え、父は彼のせいで苦労し、父の死後、彼の醜行はいっそうひどくなった。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad b. Khiḍr, al-Shams b. al-Jamāl, of Kūrānī origin, the Cairene, the Shāfiʿī; his father was mentioned above. He engaged in studies and recited before me [al-Sakhāwī] and before others, such as Ibn Qāsim, but did not distinguish himself. He obtained stipendiary posts in some endowed institutions, then turned to unacceptable conduct, to the extent that his ravings increased greatly; his father suffered because of him, and his foulness increased greatly after his [father's] death.
