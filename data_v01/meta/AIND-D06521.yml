translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ウスマーン、アッ＝シャムス・アブー・アブド・アッラー・アッ＝サフトラシュバニー、のちアル＝ミスリー、マーリク派のちシャーフィイー派、アッ＝シャーズィリー。前述のアリーの父。アン＝ヌール・アル＝アダミーと姻戚になり、彼によってシャーフィイー派に改め、彼とアッ＝ザイン・アル＝イラーキーほかから学び、篤信と善良さを備えて学識に優れた。（8）30年より後にダマスクスのサーリヒーヤで没した。神が彼を憐れみ給わんことを。
  en: Muḥammad b. Ibrāhīm b. ʿUthmān, al-Shams Abū ʿAbd Allāh al-Safṭrashbanī, then al-Miṣrī, the Mālikī, then Shāfiʿī, al-Shādhilī, father of the aforementioned ʿAlī. He became related by marriage to al-Nūr al-Adamī, through whom he turned Shāfiʿī; he studied under him, under al-Zayn al-ʿIrāqī and under others, and excelled, with piety and goodness. He died in al-Ṣāliḥiyya of Damascus after the year [8]30. May God have mercy on him.
