- text: 'ニスバは刊本どおり「السفطرشبني」（TMP-N-04349）。子の項 #AIND-D05359・#AIND-D06737・ニスバ索引 #AIND-D11721 は「السفطرشيني نسبة لسفط رشين من البهنساوية」＝ب／ي の点の揺れとみられるが読み替えない（規則25）。「وفضل مع الصلاح والخير」は人物評＝訳のみ。「الشاذلي」はタリーカのニスバで、師・施設の記載はない。'
