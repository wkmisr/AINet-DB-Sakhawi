notes:
- text: '「يأتي فيمن جده عبد الله ابن محمد بن محمد قريبا」＝転送見出し。転送先は #AIND-D04591（刊本 206 番「عبد الله بن محمد بن عبد الله بن أبي عبد الله محمد بن الرضي محمد بن أبي بكر عبد الله بن خليل عفيف الدين أبو الطيب القرشي العثماني المكي أحد العدول بباب السلام」、809年マッカ生・882年没）。指示の祖父「عبد الله بن محمد بن محمد」は同項の祖父 عبد الله بن أبي عبد الله محمد بن الرضي محمد（＝#AIND-D04615）と一致し、本見出しの6項後（同じ عبد الله بن محمد بن عبد الله 部）に位置する。転送先は本バッチ（B90）内で校閲済み。'
  type: reference
translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー・ブン・アビー・アブドゥッラー。祖父がアブドゥッラー・ブン・ムハンマド・ブン・ムハンマドである者の項にまもなく後述。
  en: ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh b. Abī ʿAbd Allāh. He will be mentioned shortly below among those whose grandfather is ʿAbd Allāh b. Muḥammad b. Muḥammad.
