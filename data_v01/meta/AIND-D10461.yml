    ja: '「الماضي أبوه وجده」。父＝corpus 本伝 #AIND-D02514「الحسن بن أحمد بن حسن بن أحمد بن عبد الهادي بن عبد الحميد بن عبد الهادي البدر أبو يوسف بن الشهاب القرشي العمري … الصالحي الحنبلي الماضي أبوه ويعرف بابن عبد الهادي وبابن المبرد」（未収録）。ナサブ・ニスバ・学派・クンヤ「أبو يوسف」で閉合（規則37、cert なし）。本項見出しは「أحمد بن حسن بن عبد الهادي」で父の項より「أحمد」が1代少ない（刊本どおり）。初版 #NEEDID。'
