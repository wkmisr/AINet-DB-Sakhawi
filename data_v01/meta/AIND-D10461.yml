    ja: '「بلغني」＝伝聞 → cert medium。خديجة ابنة عبد الكريم الآتية＝女性部の corpus 本伝 #AIND-D13005「خديجة ابنة الموفق عبد الكريم بن محمد بن إسماعيل الأرموي الدمشقي الصالحي . سمعت على عائشة ابنة ابن عبد الهادي … وحدثت سمع منها الطلبة وبلغني أن يوسف بن حسن بن أحمد بن عبد الهادي الماضي خرج لها أربعين」（未収録）＝相手側が本項主を名指しして同じ事実を記す（双方向閉合）。ブリーフが挙げた #AIND-D13003（اللخمي النستراوي、853年頃没）・#AIND-D13004（ابن الجيعان）は別人。本項主が彼女から聴講したとは原文にない＝師弟 relation を立てない（初版の student relation と統制外「patron of compilation」relation、ともに #NEEDID、を除去）。本項主の編んだ『四十ハディース集』は ID-Master 未登録 → 仮 TMP-T-00272。年は原文になし（初版 note「Before 896 AH」は根拠なし）。'
