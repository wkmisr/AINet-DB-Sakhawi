translation:
  ja: ユースフ・ブン・ハサン・ブン・アフマド・ブン・ハサン・ブン・アブド・アル＝ハーディー、アッ＝ディマシュキー、アッ＝サーリヒー、アル＝ハンバリー。その父と祖父は既出。（8）40年余りにダマスクスで生まれ、カーディーの代理を務めた。（8）96年に存命である。後出のハディージャ・ビント・アブド・アル＝カリームのために『四十（ハディース）集』を編んだと私は聞いている。
  en: Yūsuf b. Ḥasan b. Aḥmad b. Ḥasan b. ʿAbd al-Hādī, al-Dimashqī, al-Ṣāliḥī, al-Ḥanbalī, whose father and grandfather have been mentioned above. He was born in the year forty-odd [84x] in Damascus and served as a deputy judge. He was alive in the year [8]96. It has reached me that he compiled a collection of forty ḥadīths for Khadīja bint ʿAbd al-Karīm, who will be mentioned below.
