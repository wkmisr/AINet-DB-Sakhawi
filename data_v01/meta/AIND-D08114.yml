translation:
  ja: ムハンマド・アッ＝タキー、前項の人物の同父母兄弟。805年に、イブン・スィッディーク、アル＝イラーキー、アル＝ハイサミー、アーイシャ・ビント・イブン・アブドゥルハーディー、アッ＝ザイン・アル＝マラーギー、アル＝ファルスィースィーらが彼にイジャーザを与えた。彼もまた壮年期にカイロで没した。
  en: Muḥammad al-Taqī, full brother of the preceding. In the year 805 Ibn Ṣiddīq, al-ʿIrāqī, al-Haythamī, ʿĀʾisha bint Ibn ʿAbd al-Hādī, al-Zayn al-Marāghī, al-Farsīsī and others granted him ijāza. He too died in Cairo in middle age.
