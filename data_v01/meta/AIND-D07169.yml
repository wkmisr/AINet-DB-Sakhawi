translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アフマド、アッ＝シャムス・ブン・アッ＝タキー・ブン・アッ＝シハーブ・アル＝ジュハイニー・アッ＝ディマシュキー、前述のアッ＝ザイン・ハッターブの外孫。886年にマッカで私（サハーウィー）から聴聞した者の一人。
  en: Muḥammad b. Abī Bakr b. Aḥmad, al-Shams b. al-Taqī b. al-Shihāb al-Juhaynī al-Dimashqī, the maternal grandson of al-Zayn Khaṭṭāb, mentioned above. He was among those who heard from me in Mecca in the year 886.
