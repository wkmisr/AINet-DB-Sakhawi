translation:
  ja: アリー・ブン・ムハンマド・ブン・ウスマーン・アル＝バルバハーリー・アル＝マッキー・アル＝ウマリー。「アル＝ウマリー」は代行ウムラ業（アマル・アル＝ウマル）に由来するニスバである。879年ラビーウ・アル＝アウワル月にマッカで没した。イブン・ファハドがその没年を記録している。
  en: ʿAlī b. Muḥammad b. ʿUthmān al-Barbahārī al-Makkī al-ʿUmarī, the nisba referring to the trade of performing ʿumras on behalf of others (ʿamal al-ʿumar). He died in Mecca in Rabīʿ I of the year 879. Ibn Fahd recorded his death date.
