translation:
  ja: アブドゥルアリーム・ブン・アル＝ハサン・ブン・アリー・ブン・アビー・バクル・ブン・アリー・ブン・ムハンマド・ブン・アビー・バクル・イブン・アブドゥッラー・アン＝ナーシリー・アル＝ヤマーニー。父は前述。理解力と聡明さをもって一時期学問に励み、七読誦法に秀でたが、のちにやめた。843年ムハッラム月初めに30歳ほどでタイズにて没した。
  en: ʿAbd al-ʿAlīm b. al-Ḥasan b. ʿAlī b. Abī Bakr b. ʿAlī b. Muḥammad b. Abī Bakr b. ʿAbd Allāh al-Nāshirī al-Yamānī, whose father was mentioned above. He applied himself to study for a time with understanding and intelligence and excelled in the Seven Readings, but then gave it up. He died at about thirty at the beginning of Muḥarram 843 AH in Taʿizz.
