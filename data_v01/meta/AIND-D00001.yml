translation:
  ja: キラーン出身、後にマッカのアーダム・ブン・サアド・ブン・イーサー。 マッカに20年近く在住し、そこで結婚し、晩年はリバート・スッカルに住んだ。彼は信頼できる人物であった。 67年ズー・アル＝カアダ月に死去。
  en: Ādam b. Saʿd b. ʿĪsā, originally al-Kīlānī, then al-Makkī. He resided in Mecca for nearly twenty years and married there, and in his later years, he lived in Ribāṭ Sukkar. He was a trusted person. He died in Dhū al-Qaʿda in the year 867 AH.
