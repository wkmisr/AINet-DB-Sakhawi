translation:
  ja: アブドゥルアズィーズ・ブン・ムーサー・ブン・ムハンマド、アブー・アル＝カースィム・アル＝アブドゥースィー・アル＝マグリビー。ウマル・イブン・ユースフ・アル＝バスラクーニーが821年に彼に会い、彼（アブドゥルアズィーズ）はウマルにファトワー発行と教授の許可を与えた。これはウマルの伝記で後述される。クンヤの部も参照せよ。
  en: ʿAbd al-ʿAzīz b. Mūsā b. Muḥammad, Abū al-Qāsim al-ʿAbdūsī al-Maghribī. ʿUmar b. Yūsuf al-Baslaqūnī met him in the year 821 AH and he authorized him to give fatwās and to teach, as will be mentioned in the latter's biography. See also the section of kunyas.
