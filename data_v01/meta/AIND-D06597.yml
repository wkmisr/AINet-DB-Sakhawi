  passive: AIND-D06597
  quote: null
  note:
    ja: '見出し「بن القاضي البرهان ابن جماعة」＝祖父 #AIND-D00161「إبراهيم بن عبد الله بن محمد بن عبد الرحمن بن سعد الدين بن جماعة البرهان ابن شيخنا الجمال الكناني المقدسي الشافعي … ووالد العماد إسماعيل والنجم محمد شيخ الصلاحية والخطيب المحب أحمد الآتي ذكرهم … وولي قضاء بلده وخطابتها … مات في آخر صفر سنة اثنتين وسبعين」（repo 未収録）。ナサブ・ラカブ・「القاضي」が一致し、相手側が子として「الخطيب المحب أحمد」を挙げる（規則37）。初版は祖父 relation なし。'
