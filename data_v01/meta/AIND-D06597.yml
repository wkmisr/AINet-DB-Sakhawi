translation:
  ja: ムハンマド・ブン・アフマド・ブン・イブラーヒーム・ブン・アブドゥッラー、アル＝ジャラール・ブン・アル＝ムヒッブ・ブン・アル＝カーディー・アル＝ブルハーン、イブン・ジャマーア。『ミンハージュ』と『アルフィーヤ』を暗記し、文法学と法学を学んだ。父の後を継いでエルサレムのハーンカーのスーフィー長職の半分に就き、同じくアクサーの説教職の四分の一にも就いた。（8）97年にそこで疫病により没し、彼の後には〔後任者の名、原文に記載なし〕が就いた。
  en: Muḥammad b. Aḥmad b. Ibrāhīm b. ʿAbd Allāh, al-Jalāl b. al-Muḥibb b. al-Qāḍī al-Burhān, Ibn Jamāʿa. He memorized the Minhāj and the Alfiyya and studied grammar and law. He was installed, in succession to his father, in half of the headship of the Sufis at the khānqāh in Jerusalem, and likewise in a quarter of the preachership at al-Aqṣā. He died there of the plague in the year [8]97, and after him [name lacking in the text] was installed.
