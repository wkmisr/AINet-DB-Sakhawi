    ja: 父＝#AIND-D00438「أحمد بن إبراهيم بن عبد الله بن محمد بن عبد الرحمن بن إبراهيم المحب ابن البرهان بن الجمال المقدسي بن جماعة … واستقر في ربع الخطابة بالأقصى ونصف مشيخة التصوف بالصلاحية … مات في ليلة السبت خامس رمضان سنة تسع وثمانين」。見出しのナサブ・ラカブ（المحب بن البرهان）と、本項主が父から継いだ二つの職の持ち分（説教職の四分の一・スーフィー長職の半分）が相手側本文と一致（規則37、ブリーフ ★どおり）。初版は零番号 TMP-P-000000。
