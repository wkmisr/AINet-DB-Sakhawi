  ja: イブラーヒーム・ブン・アブドゥッラフマーン・ブン・アブドゥッラー・アル＝アンサーリー・アル＝カーヒリー。衆人から「ジャーذب」（宗教的恍惚境に入った者）と評された、信仰厚き人物の一人。850年ラビーウ・ル＝アウワル月4日火曜日に、バーブ・ル＝ハラク門外のザ-ウィヤで亡くなり、そこに埋葬された。
  en: Ibrāhīm b. ʿAbd al-Raḥmān b. ʿAbd Allāh al-Anṣārī al-Qāhirī, one of those believed among the common people, described by them as having spiritual ecstasy (majdūb). He died on Tuesday, the 4th of Rabīʿ al-Awwal in the year 850 AH, in his zawiya outside Bāb al-Kharaq, and was buried there.
