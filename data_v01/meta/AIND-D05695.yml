translation:
  ja: アリー・ブン・ユースフ・ブン・ウマル・ブン・アンワル。我らがシャイフ（イブン・ハジャル）は『インバー・アル＝グムル』において彼に言及し、彼が当代のモガディシュの主（サーヒブ・マクディシューフ）であったと述べている。「アル＝ムアイヤド・ブン・アル＝ムザッファル・ブン・アル＝マンスール」と称された（ムザッファル・マンスールは父祖の君主号）。彼は836年に没した。
  en: ʿAlī b. Yūsuf b. ʿUmar b. Anwar. Our shaykh (Ibn Ḥajar) mentioned him in his 『Inbāʾ al-Ghumr』 and said that he was the ruler of Mogadishu (ṣāḥib Maqdishūh) in our time; he bore the regnal title al-Muʾayyad b. al-Muẓaffar b. al-Manṣūr (al-Muẓaffar and al-Manṣūr being the regnal titles of his father and grandfather). He died in the year 836 AH.
