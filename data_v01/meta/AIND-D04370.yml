translation:
  ja: アブド・アッ＝ラティーフ・アッ＝シャーミー、マッカの薬種商。（8）90年サファル月に同地で没した。彼のもとには他にない薬草や香料があり、そのため無愛想かつ頑なに高値で売ろうとしていた。神が彼を赦したまいますように。
  en: ʿAbd al-Laṭīf al-Shāmī, the druggist at Mecca. He died there in Ṣafar of the year [8]90. He used to have herbs and perfumes such as no one else had, and so he strove to overcharge in selling them, with roughness and dryness. May God pardon him.
