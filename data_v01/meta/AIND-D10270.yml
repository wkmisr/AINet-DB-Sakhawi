translation:
  ja: ヤフヤー・ブン・カリーム・アッ＝ディーン・アブド・アル＝カリーム・ブン・アブド・アッ＝ラフマーン・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ズハイラ、アル＝マッキー、ハンバリー派。父と祖父は既出。（8）71年サファル月にマッカで生まれて育ち、クルアーン、ナワウィーの『四十（ハディース）』、彼ら（ハンバリー派）の法学細則の『ワジーズ』、イブン・アッ＝ラッハームの『ウスール』、文法の『アルフィーヤ』を暗記して（暗誦を）提示し、父のもとで学んだ。彼は、（8）86年に、ついで（8）93年と（8）94年に、マッカで私（サハーウィー）から聴聞した者の一人であり、暗記書の一部を私に提示したとも思う。父の後、（8）99年の途中に海路カイロへ旅立ち、無事であるとの報せが書き送られた。
  en: Yaḥyā b. Karīm al-Dīn ʿAbd al-Karīm b. ʿAbd al-Raḥmān b. Abī Bakr b. ʿAbd Allāh b. Ẓuhayra, al-Makkī, the Ḥanbalī, whose father and grandfather were mentioned earlier. He was born in Ṣafar of the year [8]71 in Mecca and grew up; he memorized the Qurʾān, al-Nawawī's Forty, the Wajīz on their (the Ḥanbalīs') substantive law, the Uṣūl of Ibn al-Laḥḥām and the Alfiyya on grammar, presented them from memory, and studied under his father. He is among those who heard from me (al-Sakhāwī) in Mecca in the year [8]86 and then in the years [8]93 and [8]94, and I think he presented some of his memorized texts to me. He travelled after his father, in the course of the year [8]99, by sea to Cairo, and word of his safe arrival was written.
