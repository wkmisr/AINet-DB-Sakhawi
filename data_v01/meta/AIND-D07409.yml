translation:
  ja: ムハンマド・ブン・サーリム・ブン・ムハンマド、アッ＝シャムス・アッ＝ラフビー・アル＝ハラビー、説教師、カーニスーフ・アル＝ヤフヤーウィーのイマーム。カイロへ赴き、我らがシャイフ（イブン・ハジャル）に『ブハーリー』とその注釈の序その他で密着して師事した。次いで859年にアレッポで我々とともにイブン・ムクビル、ハリーマ・イブナ・アッ＝シハーブ・アル＝フサイニー、アブドゥルワーヒド・ブン・サダカら（他にもいる）から聴聞した。我々は彼を精査と正確さに欠ける者として知っていた。その後、彼が民衆に向けて語る（説教する）ようになったこと、そして前述のカーニスーフに特別に近侍し、彼がアレッポ次いでシリアの総督であった時に彼のもとで重んじられ、さらに彼が解任されてバイト・アル＝マクディス（エルサレム）に滞在した時も彼とともにいたことが我々に伝わった。人々は彼について大いに非難し、彼は罪の重さゆえに自分のアミールのもとから逃亡した。
  en: Muḥammad b. Sālim b. Muḥammad, al-Shams al-Raḥbī al-Ḥalabī, the preacher, imām of Qāniṣawh al-Yaḥyāwī. He travelled to Cairo and attended our shaykh (Ibn Ḥajar) closely for al-Bukhārī, the introduction to his commentary on it, and other things. Then in the year [8]59 he heard with us in Aleppo from Ibn Muqbil, Ḥalīma bint al-Shihāb al-Ḥusaynī, and ʿAbd al-Wāḥid b. Ṣadaqa, among others. We knew him for his lack of care and accuracy. We later learned that he had taken to addressing the common people, that he became closely attached to the aforementioned Qāniṣawh and held a position with him during his governorship of Aleppo and then of Syria, and that he was then with him in Jerusalem when he resided there out of office. People spoke much against him, and he fled from his amīr because of the enormity of his offence.
