translation:
  ja: ウマル・ブン・アッ＝ラディー・アビー・バクル・ブン・ムハンマド・ブン・アブド・アッ＝ラティーフ・ブン・サーリム、アッ＝シラージュ、イエメン出身でマッカの人、イブン・アッ＝ラディーとして知られる。ジッダの実務官（ムバーシル）の一人、というよりその筆頭で、サイイド・バラカートの書記（ムワッキウ）であった。職務において非常に寛大で、人に食事を振る舞うことを好んだ者の一人。アッ＝タキー・ブン・ファハドの娘ウンム・リームと縁組みし、彼女との間にアル＝ジャマール・ムハンマドを得た。マッカへの到来は（8）40年代のことで、名高い家の出である。（8）65年ズー・アル＝カアダ月にマッカで没した。イブン・ファハドがその没年月を記録している。
  en: ʿUmar b. al-Raḍī Abī Bakr b. Muḥammad b. ʿAbd al-Laṭīf b. Sālim al-Sirāj, of Yemeni origin, of Mecca, known as Ibn al-Raḍī. One of the administrators (mubāshir) of Jidda, indeed their foremost, and the secretary (muwaqqiʿ) of al-Sayyid Barakāt. He was among those who were very lenient in their office and fond of feeding people. He became the son-in-law of al-Taqī b. Fahd through his daughter Umm Rīm, with whom he had al-Jamāl Muḥammad. He came to Mecca in the (8)40s, and he was from a famous house. He died in Mecca in Dhū al-Qaʿda (8)65. Ibn Fahd recorded his death.
