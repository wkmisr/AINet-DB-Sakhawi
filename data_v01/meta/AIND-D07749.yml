translation:
  ja: ムハンマド、アブー・アル＝マカーリム、アル＝ハンバリー。前の四人の兄弟で、直前の二人とは同母兄弟。彼らの母はハディージャ・ビント・イブラーヒーム・ブン・アフマド・アル＝ムルシディーである。イブン・アル＝ジャザリー、アッ＝シャムス・アッ＝シャーミーら多くの人々から聴聞し、ヒジュラ暦814年にはアッ＝ザイン・アル＝マラーギーが彼にイジャーザを授けた。カイロとダマスカスに赴いて両地にしばらく滞在し、アッ＝ザイン・アブドゥッラフマーン・アブー・シャアルに随伴して師事し、彼のもとで法学を学び、同様にほかの大学者たちにも随伴した。ヒジュラ暦833年にシリアのタラーブルス（トリポリ）で没した。クンヤの部で再び後述する。
  en: Muḥammad, Abū al-Makārim, al-Ḥanbalī, brother of the four preceding and full brother of the two immediately preceding; their mother was Khadīja, daughter of Ibrāhīm b. Aḥmad al-Murshidī. He heard from Ibn al-Jazarī, al-Shams al-Shāmī and a number of others, and in the year 814 al-Zayn al-Marāghī granted him an ijāza. He entered Cairo and Damascus and stayed in both for a time; he kept company with al-Zayn ʿAbd al-Raḥmān Abū Shaʿr, attended him closely and studied jurisprudence under him, and likewise kept company with other leading scholars. He died in Tripoli of Syria in the year 833. He will be mentioned again under the kunyas.
