translation:
  ja: ウスマーン・ブン・アフマド・ブン・アブドゥッラフマーン・ブン・アル＝ジャマール、エジプト出自、アル＝マッキー。インドで生まれ、のちマッカに定住し、ユーヌス・アッ＝ズバイリーの娘を娶って彼の婿となった。マッカで私（サハーウィー）から聴聞した者の一人。
  en: ʿUthmān b. Aḥmad b. ʿAbd al-Raḥmān b. al-Jamāl, of Egyptian origin, al-Makkī. He was born in India, then settled in Mecca and became the son-in-law of Yūnus al-Zubayrī by marrying his daughter. He was among those who heard from me (al-Sakhāwī) in Mecca.
