translation:
  ja: アブドゥルガッファール・ブン・アッ＝タージュ・ムハンマド・アル＝キルビシャーウィー。前述のイブラーヒームの弟で、兄の方が年長。『ハーウィー』を暗記し、少し学問に従事し、父と祖父と同じく、兄の後を継いで自郷（キルビシャー）のカーディー職とハティーブ職を務めた。
  en: ʿAbd al-Ghaffār b. al-Tāj Muḥammad al-Kilbishāwī, brother of the aforementioned Ibrāhīm, who was the elder. He memorized al-Ḥāwī and studied a little, and succeeded his brother in the judgeship and preachership of his town, as their father and grandfather had held them.
