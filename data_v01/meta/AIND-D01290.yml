notes:
- text: '校閲: 幻番号を既存AINDに是正 — 祖父（سمع على جده の師）= الزين أبو بكر المراغي = #AIND-D10690（TMP-P-000066 破棄）、兄弟 الحسين الآتي = #AIND-D02738（TMP-P-000087 破棄）。系図: 父 = الجمال أبو اليمن محمد = #AIND-D07179。kunyah 是正: 本人は أبو الرضى（原文「أحمد ... أبو الرضى بن الجمال أبي اليمن」）。Gemini初版は父のkunyah「أبو اليمن」を本人kunyahに誤記していた。申し送り: nisbah #TMP-N-0107（المراغي）は桁不整合（4桁、他は5桁ゼロ埋め）。'
