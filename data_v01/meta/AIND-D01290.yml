  en: Aḥmad b. Muḥammad b. Abī Bakr b. al-Ḥusayn b. ʿUmar, Abū al-Riḍā b. al-Jamāl Abī al-Yaman al-Marāghī al-Madanī, brother of al-Ḥusayn (mentioned below). He heard from his grandfather in the year 815 H.
