translation:
  ja: アブドゥル・ラフマーン・ブン・アリー・ブン・ムハンマド・ブン・ミフターフ・アル＝バアリー。彼の祖父ムハンマド・ブン・アブドゥル・ラフマーン・ブン・ムハンマド・ブン・ミフターフの項（この近く）ですでに言及された。アブドゥル・ラフマーン・ブン・アリー・ブン・ムハンマド・アル＝タファハニー。イブン・アリー・ブン・アブドゥル・ラフマーン・ブン・アリーの項ですでに言及された。
  en: ʿAbd al-Raḥmān b. ʿAlī b. Muḥammad b. Miftāḥ al-Baʿlī. He was already mentioned nearby under the entry of those whose grandfather is Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. Miftāḥ. ʿAbd al-Raḥmān b. ʿAlī b. Muḥammad al-Tafhanī. He was already mentioned under Ibn ʿAlī b. ʿAbd al-Raḥmān b. ʿAlī.
