notes:
- text: '「مضى فيمن جده محمد بن عبد الرحمن بن محمد بن مفتاح قريبا」＝転送見出し。転送先は #AIND-D03698（عبد الرحمن بن علي بن محمد بن **عبد الرحمن بن محمد بن مفتاح** الزين **البعلي** الحنبلي الدهان **ويعرف بابن مفتاح**）。祖父名の完全一致＋البعلي で確定。⚠corpus の当該ブロックには転送見出しがもう1件同居する（「عبد الرحمن بن علي بن محمد **التفهني** . مضى في ابن علي بن عبد الرحمن بن علي .」）。初版はこれを立項せず訳文にのみ混入させていた。当該項は欠番ウォッチリスト_B59-63.md に記載。'
