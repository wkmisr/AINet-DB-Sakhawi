- text: One of the excellent physicians and the best of them. He held stipendiary posts in the [administrative] departments (al-jihāt). He was intelligent, of handsome appearance, and affable.
  lang: en
  type: personalia
- text: '校閲: Gemini初版は علي بن بطيخ を本項の「兄弟」(TMP-P-000470)としていたが誤り。相互参照で確定 — 父 = البدر محمد بن بطيخ = #AIND-D09616（本文「والد أحمد الماضي . له ذكر في أخيه علي」）、علي بن بطيخ = #AIND-D05073（本文「وهو عم الشهاب أحمد ... أحد الأطباء」＝本項を甥とする）。よって本文「وله ذكر في أخيه علي」の「أخيه」の主語は父であり、علي は本項の父方の伯叔父(عم)。brother relation を破棄し、father(#AIND-D09616)＋uncle(#AIND-D05073) に是正。幻番号 TMP-P-000470 破棄。'
  lang: ja
  type: editorial
