translation:
  ja: 305 アフマド・ブン・ムハンマド・ブン・バティーフ、シハーブ・アッ＝ディーン。優れた医者の一人で、その中でも最良の者。各地に居を構えた。賢明で、容貌が麗しく、人懐っこかった。没年は（原文空白で）未記載。彼（＝彼の父）への言及は、（父の）兄弟アリー・ブン・バティーフの項にある。
  en: '305 Aḥmad b. Muḥammad b. Baṭṭīkh, Shihāb al-Dīn. He was one of the excellent physicians and the best of them, and he resided in various regions. He was intelligent, handsome in appearance, and amiable. He died in [incomplete]. He (i.e. his father) is mentioned in the biography of the latter''s brother, ʿAlī b. Baṭṭīkh (the subject''s paternal uncle, #AIND-D05073); cf. the father''s entry #AIND-D09616.'
