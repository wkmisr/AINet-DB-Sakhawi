translation:
  ja: フシュカダム・アル＝アルナブガーウィー。もとはサファド城塞の副官（ナーイブ）アルナブガーの所有（マムルーク）であったが、その後シャームの総督（ナーイブ）カーンバーイ・アル＝ハムザーウィーに仕えてそのダワーダールとなった。彼（カーンバーイ）が没すると、多額の金でトリポリのハージブ職に就いたが、間もなく864年ジュマーダー第1月に没した。
  en: 'Khushqadam al-Arnabghāwī. He originally belonged to Arnabghā, the deputy of the citadel of Ṣafad; then he entered the service of the viceroy of Syria Qānbāy al-Ḥamzāwī and became his dawādār. When the latter died, he obtained the chamberlainship (ḥujūbiyya) of Tripoli for a large sum of money, but did not last long: he died in Jumādā I of the year 864.'
