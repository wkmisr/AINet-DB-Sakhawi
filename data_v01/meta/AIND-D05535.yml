translation:
  ja: アリー・ブン・ムハンマド・ブン・カースィム、ハーッジュ・アリー・ブン・アル＝ムラッヒム（大理石職人の子）。アッ＝シャムス・ムハンマド・ブン・アル＝ムラッヒムの父。善良な一般人で、集団礼拝とズィクルを絶やさなかった。830年より後に没し、70歳に近かったが、いずれも推測である。
  en: ʿAlī b. Muḥammad b. Qāsim, al-Ḥājj ʿAlī b. al-Murakhkhim, father of al-Shams Muḥammad b. al-Murakhkhim. He was a good-hearted commoner, constant in congregational prayer and dhikr. He died after [8]30, having approached seventy—both being conjecture.
