translation:
  ja: サーミル。 彼は衆人から非常に敬愛される「神に魅せられた者（ مجذوب）」で、貴重な言葉を数多く残しており、私はその多くを彼から聴聞した。彼は（尊敬する）その人物に深く帰依して、たびたびガムリー・モスクの門に佇んでいた。850年以降に没した。
  en: Thāmir. He was a “majdhūb” (divinely attracted/ecstatic) greatly revered by the common people, and he left many profound sayings, much of which I heard from him. He frequently stood at the door of Jāmiʿ al-Ghamrī due to his deep devotion to its owner. He passed away after 850 AH.
