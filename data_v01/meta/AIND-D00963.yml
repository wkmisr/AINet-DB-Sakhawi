translation:
  ja: アハマド・ブン・ウスマーン・ブン・ニザーム・アル＝ジャルヒー・アル＝ブハーリー・アル＝ハナフィー。彼にはムッラーザーダとも言われる。ユースフ・ブン・アハマド（後述）は彼に893年に『アル＝マサービーフ』を読誦し、彼を非常に尊敬し、彼のために包括的なイジャーザ（伝授許可証）を書いてもらった。
  en: Aḥmad b. ʿUthmān b. Niẓām al-Jarkhī al-Bukhārī al-Ḥanafī. He was also known as Mullāzāda. Yūsuf b. Aḥmad (mentioned later) read al-Maṣābīḥ to him in 893 H. He greatly revered him and received a comprehensive ijāza written by him.
