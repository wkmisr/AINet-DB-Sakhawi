translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アッバース・ブン・アフマド・アル＝バドラーニー。父については後述する。彼は、同じく後述するアッ＝シャムス・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・アミーンの外孫（娘の子）である。聡明な子で、（8）92年に私に『ミンハージュ』を提示（暗誦確認）し、その後、私から『ムサルサル』を聴聞したうえで、『ブハーリー』の冒頭から三つのハディースを私に読誦した。私は彼にイジャーザを与えた。
  en: Muḥammad b. Abī Bakr b. ʿAbbās b. Aḥmad al-Badrānī; his father is mentioned below. He is the daughter's son of al-Shams Muḥammad b. Muḥammad b. Muḥammad b. Amīn, who is also mentioned below. A clever boy, he presented al-Minhāj to me in the year (8)92, then read to me three ḥadīths from the beginning of al-Bukhārī after he had heard al-Musalsal from me, and I granted him an ijāza.
