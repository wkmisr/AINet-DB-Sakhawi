translation:
  ja: イーサー・ブン・ムハンマド・ブン・ムハンマド・ブン・アブドゥッラー、アル＝クトゥブ・ブン・アル＝アフィーフ・アル＝フサイニー・アル＝イージー・アッ＝シャーフィイー。アル＝アラー・ムハンマドの兄弟で、ムルシド・アッ＝ディーン・ムハンマドの父。甥のウバイドゥッラーが彼のもとで、ハディース学におけるアッ＝ティービーの『フラーサ』と、イブン・アル＝ハージブの『カーフィヤ』に対するアッ＝サイイドの注釈の一部を読誦した。彼は大学者（アッラーマ）であった。巡礼を行い、その学問の多くをアッ＝サイイド・サフィー・アッ＝ディーンから受けた。（8）59年に40数歳でイージュにおいて没した。
  en: ʿĪsā b. Muḥammad b. Muḥammad b. ʿAbd Allāh, al-Quṭb b. al-ʿAfīf al-Ḥusaynī al-Ījī al-Shāfiʿī, brother of al-ʿAlāʾ Muḥammad and father of Murshid al-Dīn Muḥammad. His brother's son ʿUbayd Allāh read to him al-Ṭībī's Khulāṣa on the sciences of ḥadīth and part of al-Sayyid's commentary on the Kāfiya of Ibn al-Ḥājib. He was a great scholar (ʿallāma). He performed the pilgrimage, and most of his learning was taken from al-Sayyid Ṣafī al-Dīn. He died at Īj in the year (8)59, aged forty-odd.
