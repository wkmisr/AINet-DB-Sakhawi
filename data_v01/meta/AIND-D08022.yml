notes:
- text: '転送見出し（原文末尾「فيمن جده أحمد بن عبد العزيز بن القسم」による）。転送先は #AIND-D07993「محمد ولي الدين أبو عبد الله المالكي أخو الذي قبله … وولي إمامة المالكية بمكة وكذا قضاءها عوضا عن الكمال بن الزين مرتين … مات في قضائها في شوال سنة اثنتين وأربعين بمكة」（未受領。「الذي قبله」＝#AIND-D07992「محمد بن علي بن أحمد بن عبد العزيز بن القسم بن عبد الرحمن الشهيد الجمال أبو الخير … النويري ثم المكي الشافعي」であり、D07993 のナサブは D07992 と同じ「محمد بن علي بن أحمد بن عبد العزيز بن القسم」＝本見出しの「فيمن جده أحمد بن عبد العزيز بن القسم」と一致。クンヤ أبو عبد الله・マッカのマーリキー派カーディー職も一致）。'
  type: reference
translation:
  ja: ムハンマド・ブン・アリー・ブン・アフマド、マッカのマーリキー派カーディー、アブー・アブドゥッラー・アン＝ヌワイリー。祖父がアフマド・ブン・アブドゥルアズィーズ・ブン・アル＝カースィムである者たち（の部）に（見よ）。
  en: Muḥammad b. ʿAlī b. Aḥmad, the Mālikī judge of Mecca, Abū ʿAbd Allāh al-Nuwayrī. [See] among those whose grandfather is Aḥmad b. ʿAbd al-ʿAzīz b. al-Qāsim.
