    ja: '【集約 2026-11-10】校閲の #AIND-D00684 cert medium を #NEEDID＋候補に改めた。規則10（v13.46 追記）「名の食い違う候補に cert medium を付けない」。規則3 の段階では、父 محمد بن الحسين は祖父名まで分かるが父自身の識別要素（ラカブ・クンヤ・職・珍しい名）が本項になく、家名 ابن المدني は識別要素に入らない（規則61(d)）＝#NEEDID（オーケストレーター決定4 は「祖父名まで分かる＝TMP-P 新規」とするが、規則3 の識別要素の条件を満たさないため #NEEDID とした。TMP-P を発行すると D00684 と二重番号になるおそれもある）。候補 #AIND-D00684 の扱いは ★2（機械 M）。以下は校閲の記述: 規則3。見出しの父は「محمد بن الحسين」。候補＝corpus 本伝 #AIND-D00684「أحمد بن الحسين بن إبراهيم محيي الدين المدني الأصل الدمشقي والد نجم الدين . ولد سنة إحدى أو اثنتين وخمسين وسبعمائة بدمشق وكان أبوه انتقل من المدينة إليها … ولي بها كتابة السر في أوائل سنة ثمان عشرة … مات في صفر سنة عشرين . ذكره شيخنا في أنبائه」（repo 未収録）。祖父名 الحسين・家名（المدني الأصل الدمشقي⇄ابن المدني）・「والد نجم الدين」（本項主のラカブ النجم）・ダマスクスの كتابة السر（父子とも）の4点が閉合するが、父のイスムが محمد（本項）と أحمد（D00684）で食い違う＝原文どおり desc は「محمد بن الحسين」とし、同定は cert medium（規則25・26、ISSUES §D166-4）。初版は father relation なし。'
