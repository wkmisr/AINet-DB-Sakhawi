translation:
  ja: ヤフヤー・ブン・ムハンマド・ブン・アル＝フサイン、アン＝ナジュム、アッ＝ディマシュキー、シャーフィイー派、イブン・アル＝マダニー。アーイシャ・ビント・イブン・アブド・アル＝ハーディーに聴いた。自分のために小さな『ムウジャム』を編んだともいわれる。シャームの機密文書庁長官（キターバト・アッ＝スィッル）とアレッポの軍務庁監督（ナザル・アル＝ジャイシュ）を務めた。学識があり、歴史についてのかなりの知識と有益な話を諳んじていた。852年シャウワール月、免職された身のままダマスクスで、60歳ほどで没した。イブン・アビー・ウザイバが彼を記している。
  en: Yaḥyā b. Muḥammad b. al-Ḥusayn, al-Najm, al-Dimashqī, the Shāfiʿī, Ibn al-Madanī. He heard from ʿĀʾisha bt. Ibn ʿAbd al-Hādī, and it is said that he compiled a small muʿjam for himself. He held the office of confidential secretary (kitābat al-sirr) of Syria and the supervision of the army bureau of Aleppo. He was a learned man who could call to mind a good portion of history and useful notes. He died in Damascus, out of office, in Shawwāl 852, aged about sixty. Ibn Abī ʿUdhayba mentioned him.
