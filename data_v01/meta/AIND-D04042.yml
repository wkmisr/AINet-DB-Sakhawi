translation:
  ja: アブドゥルガッファール・ブン・ムハンマド・ブン・ムハンマド・ブン・アブドゥルマリク・ブン・ムハンマド・アル＝ヒムスィー。後述のアブドゥルマリクの兄弟。877年ジュマーダー・アル＝ウーラー月に生まれ、父とともにカイロに来て、私（サハーウィー）から『ムサルサル』を聴聞した。
  en: ʿAbd al-Ghaffār b. Muḥammad b. Muḥammad b. ʿAbd al-Malik b. Muḥammad al-Ḥimṣī, the brother of ʿAbd al-Malik, who is mentioned below. He was born in Jumādā I 877 AH and came to Cairo with his father, where he heard al-Musalsal from me.
