translation:
  ja: アブドゥッラー・ブン・アリー・ブン・ムハンマド・ブン・アブドゥルハミード、アル＝フンドゥキー、アル＝カバーキビー、アッ＝サーリヒー。アブー・アル＝アッバース・アル＝マルダーウィーから『アル＝ムハッラディーの三つのマジュリス』を聴聞し、それを伝えた。我らがシャイフ（イブン・ハジャル）はサーリヒーヤで彼のもとでそのうちの第一（マジュリス）を読んだ。彼は…に没した。
  en: ʿAbd Allāh b. ʿAlī b. Muḥammad b. ʿAbd al-Ḥamīd al-Funduqī al-Qabāqibī al-Ṣāliḥī. He heard the three Majālis of al-Mukhalladī from Abū al-ʿAbbās al-Mardāwī and transmitted them; our shaykh (Ibn Ḥajar) read the first of them with him at al-Ṣāliḥiyya. He died in ...
