translation:
  ja: ハルサーン・イブン・シュマイラ・イブン・ムハンマド・イブン・サーリム・アル＝ハフィーシー・アル＝マッキー。兄弟のラージフ、および彼ら二人の父については後述される。897年ラジャブにメッカで急死し、先祖の眠るアル＝ムアッラー墓地に埋葬された。
