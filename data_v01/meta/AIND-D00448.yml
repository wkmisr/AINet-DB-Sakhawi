translation:
  ja: アハマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・イブラーヒーム・アル＝バスティーニー。その父については既述、その祖父については後述。882年ラマダーン8日にジッダで生まれた。彼の母は父に属するハバシュ（アビシニア）人の女奴隷であった。1ヶ月後、両親とともにマッカへ転居した。クルアーン、『アルバイーン・アン＝ナワウィー』、『ブルダ』、『アルフィーヤ・アン＝ナフウ』、『アル＝ミンハージュ』を記憶し、マッカに滞在していた際に、アッ＝タキー・ブン・カーディー・アジュルーンにそれらの一部を提示（朗誦して確認してもらった）。その滞在期間中、さらに897年に、私（サハーウィー）から『アッ＝シファー』と『サヒーフ・アル＝ブハーリー』を聴聞した。同様に、預言者の町マディーナでは、父の朗誦によりシャイフ・ムハンマド・ブン・アビー・アル＝ファラジュから『アッ＝シファー』の一部と『サヒーフ・アル＝ブハーリー』の一部を聴聞した。文法学やその他の学問について、貴顕の人々（アアヤーン）らのもとで学んだ。
  en: Aḥmad b. Ibrāhīm b. Muḥammad b. Ibrāhīm al-Basṭīnī. His father was mentioned previously, and his grandfather will be mentioned later. He was born on the 8th of Ramaḍān in the year 882 AH in Jeddah. His mother was an Abyssinian slave woman of his father. One month later, he moved with his parents to Mecca. He memorized the Qurʾān, al-Nawawī's al-Arbaʿīn, al-Burda, Alfiyyat al-Naḥw, and al-Minhāj. He presented some of these works to al-Taqī b. Qāḍī ʿAjlūn when he resided in Mecca. During that sojourn, and again in 897 AH, he heard al-Shifāʾ and al-Bukhārī from me (al-Sakhāwī). Likewise, in the Prophetic City of Medina, he heard parts of al-Shifāʾ and al-Bukhārī from Shaykh Muḥammad b. Abī al-Faraj, with his father reciting. He studied grammar and other subjects under notables (aʿyān, written عيان) and others.
