translation:
  ja: アーミナ・ビント・アル＝カーディー・カリーム・ッディーン・アブドゥルカリーム・ブン・アフマド・ブン・アブドゥルアズィーズ、アッ＝ラフミー。我らがシャイフ（イブン・ハジャル）の妻アナスの姉妹。色が浅黒く、女奴隷の子らに似ていた。イブン・ムティーウの妻である。（8）65年ズー・ル＝カアダ月の朔日、土曜日の前夜（金曜の夜）に、90余歳で没し、スーフィーヤ（墓地）に葬られた。五感は最期まで健在で、それどころか、きょうだいのなかで最も身体が丈夫であった。
  en: Āmina, daughter of the qāḍī Karīm al-Dīn ʿAbd al-Karīm b. Aḥmad b. ʿAbd al-ʿAzīz, al-Lakhmī, sister of Anas, the wife of our shaykh (Ibn Ḥajar). She was dark-skinned, resembling the children of slave women, and she was the wife of Ibn Muṭīʿ. She died on the eve of Saturday, the first of Dhū al-Qaʿda of the year [8]65, aged ninety-odd, and was buried in the Ṣūfiyya [cemetery], still in possession of her senses; indeed she was the soundest in body of her siblings.
