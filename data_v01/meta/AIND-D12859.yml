notes:
- text: '他の姉妹（本項は名指しせず、相手側も本項主を名指ししない＝relation は立てない）: #AIND-D13540「فرج ابنة عبد الكريم بن أحمد بن عبد العزيز … أخت أنس جهة شيخنا وغيرها」。D13003 の挙げる姉妹 فاطمة は女性部の見出しに見当たらない。「كانت سمراء تشبه أبناء الاماء」は容貌の記述。「ممتعة بحواسها بل كانت أصح إخوتها بدنا」＝最期まで五感が健在で、きょうだいのなかで最も丈夫だった。'
  lang: ja
