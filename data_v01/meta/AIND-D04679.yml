translation:
  ja: アブドゥッラー・アル＝マグリビー、アル＝ビジャーイーとして知られる。祝福された人で、クルアーンの読誦が多く、モスクでそれを声高に行い、その読誦には親しみがあった。同地（マッカ）に数年間、良き道行きのうちに滞在（ムジャーワラ）した後、〔8〕03年の初めにマッカで没した。アル＝ファースィーが彼に言及している。
  en: ʿAbd Allāh al-Maghribī, known as al-Bijāʾī. He was a blessed man who recited the Qurʾān much, doing so aloud in the mosque, and there was a charm in his recitation. He died at the beginning of the year [8]03 in Mecca, after having sojourned there (mujāwara) for years in a fine manner. Al-Fāsī mentioned him.
