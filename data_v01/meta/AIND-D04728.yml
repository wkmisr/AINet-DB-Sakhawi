translation:
  ja: アブドゥンナースィル・ブン・ジャラール・アッ＝ディーン・ムハンマド・アル＝マハッリー。その父はそこ（マハッラ）のジャーミウ・アッ＝トゥリーニーの説教師であった。私（サハーウィー）に読誦した者の一人であり、父の後、説教職をめぐってイブン・アッ＝トゥリーニーが彼と争った。彼がジャーミウ（金曜モスク）を建てたと私は聞いた。
  en: ʿAbd al-Nāṣir b. Jalāl al-Dīn Muḥammad al-Maḥallī; his father was the preacher (khaṭīb) at the Jāmiʿ al-Ṭurīnī there (in al-Maḥalla). He was among those who read to me (al-Sakhāwī), and Ibn al-Ṭurīnī contested the preachership with him after his father. I heard that he built a congregational mosque.
