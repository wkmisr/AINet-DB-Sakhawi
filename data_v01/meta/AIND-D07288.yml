translation:
  ja: ムハンマド・ブン・ブー・ワーリー、アミール、ナースィル・アッ＝ディーン。アル＝ムアイヤドの時代にウスターダール職に就き、次いでダマスクスのウスターダール職に就任した。844年ジュマーダー・アル＝ウーラー月にそこ（ダマスクス）で没した。彼は圧政者の一人に数えられていた。アル＝マクリーズィーが彼に言及している。
  en: Muḥammad b. Bū Wālī, the amir Nāṣir al-Dīn. He held the office of ustādār in the days of al-Muʾayyad, then was appointed to the ustādāriyya of Damascus. He died there in Jumādā al-Ūlā 844, and was counted among the oppressors. Al-Maqrīzī mentioned him.
