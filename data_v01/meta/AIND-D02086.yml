translation:
  ja: ウワイス・ブン・シャー・ワラド・ブン・シャー・ザーダ・ブン・ウワイス。（曾祖父の）ウワイスはバグダードの領主であった。彼はムハンマド・シャー・ブン・カラー・ユースフとの間の戦争で殺され、ムハンマド・シャーは再びバグダードを奪回した。このことは我らがシャイフ（イブン・ハジャル）がその『インバーウ（インバーウ・アル＝グムル）』で述べ、830年のことと記している。
  en: Uways b. Shāh Walad b. Shāh Zāda b. Uways, whose (great-grandfather) Uways was the lord of Baghdad. He was killed in a war between him and Muḥammad Shāh b. Qara Yūsuf, and Muḥammad Shāh recaptured Baghdad again. Our shaykh (Ibn Ḥajar) mentioned this in his Inbāʾ (al-Ghumr) and dated it to the year 830.
