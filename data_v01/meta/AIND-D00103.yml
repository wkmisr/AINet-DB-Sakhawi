translation:
  ja: イブラーヒーム・ブン・ハサン・ブン・ムーサー・ブン・アイユーブ・アル＝アブナーシー。このようにマクリーズィーはここで彼をその著書で伝記として採録したが、我らがシャイフ（イブン・ハジャル）はこれに反駁し、「ハサン」の追加は誤りであり、その結果、父名（イスム）の項目が「ミーム」の文字に移動してしまった、と述べている。
  en: Ibrāhīm b. Ḥasan b. Mūsā b. Ayyūb al-Abnāsī. Al-Maqrīzī recorded his biography in this manner in his history here. Our shaykh (Ibn Ḥajar) refuted this, stating that the addition of 'Ḥasan' was a mistake, which caused the entry to be listed under the letter 'M' in the section for fathers' names (instead of 'A' for Ayyūb).
