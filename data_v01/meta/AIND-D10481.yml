notes:
- text: '見出しの「واختلف هو وعمه عبد الرحمن فيمن بعده فمرة قال هو يوسف ومرة قال العم أحمد بن أحمد」はナサブの続き（عبد الله の父以降）についての食い違い: 本人は（祖父の名は）يوسف と言い、叔父は أحمد بن أحمد と言った（#AIND-D11162 で同じことを「هكذا سمى لي عمه … اسم أبيه أحمد بن أحمد وقال يوسف إن اسم جده يوسف فالله أعلم」と記す）。persName full は「يوسف بن عبد الله」まで。関連項（relation は立てない）: ニスバ索引 #AIND-D11584「الحاكمي … يوسف بن عبد الله إمامه وابن إمامه وابن عمه أحمد ابن عبد الرحمن طالب …」（2人の合同索引＝人物IDに使わない。従兄弟 أحمد بن عبد الرحمن の存在を示す）、#AIND-D03500（الشرف بن البقري）本文「اختص به … والفخر عثمان الديمي ويوسف إمام جامع الحاكم」（他項にのみある情報＝規則23 により note 留め）。'
  lang: ja
  type: editorial
translation:
  ja: ユースフ・ブン・アブドゥッラー。その先（の名）については、本人と父方おじアブドゥッラフマーンとで言うことが食い違い、本人は「ユースフ」と言い、おじは「アフマド・ブン・アフマド」と言った。ダイミーに読み、私にも少し読んだ。師ダイミーのやり方にならって、諸所へ通ってブハーリー（の『サヒーフ』）を読誦するようになった。父と同じくハーキム・モスクでイマームを務め、ウスターダールのタグリー・バルディーに一時期つき従って仕えた。同人はダワーダールの時代に、行き倒れの死者たちの葬送の支度などの監督に彼を充てたが、のちに彼を遠ざけた。
  en: 'Yūsuf b. ʿAbd Allāh. He and his paternal uncle ʿAbd al-Raḥmān differed about what comes after that [in the lineage]: he himself said “Yūsuf”, while the uncle said “Aḥmad b. Aḥmad”. He read with al-Daymī, and a little with me, and took to going round to various places to recite al-Bukhārī in the manner of his teacher al-Daymī. He led the prayer at the mosque of al-Ḥākim as his father had done, and for a time attached himself to the service of Taghrī Birdī the ustādār, who in the days of the dawādār assigned him to oversee the unclaimed dead (al-ṭarḥā), their preparation for burial and the like, and then dismissed him.'
