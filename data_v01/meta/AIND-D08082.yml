  ja: ムハンマド・ブン・アリー・ブン・サイード・ブン・ウマル、アル＝ヤーフィイー、アル＝マッキー、革職人（ハッラーズ）。857年ラビーウ・アル＝アーヒル月にそこ（マッカ）で没した。イブン・ファハドが没年を記している。
  en: Muḥammad b. ʿAlī b. Saʿīd b. ʿUmar al-Yāfiʿī al-Makkī, the leatherworker (kharrāz). He died there (in Mecca) in Rabīʿ II of the year 857. Ibn Fahd recorded his date of death.
