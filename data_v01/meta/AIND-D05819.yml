    ja: '「سمع على خاله القاضي الجمال الطيب كثيرا」。師 ＝ 母方の叔父 الجمال الطيب ＝ #AIND-D06630「محمد الجمال أبو عبد الله الشافعي أخو الذي قبله ووالد العفيف عبد الله الماضي ويعرف هذا بالطيب」（782年ザビード生、844年にザビードの大カーディー、874年没）。父 #AIND-D10822 の項に「ابن عمه الجمال محمد الطيب بن أحمد الناشري」とあり同一人物。初版の #NEEDID を解消。ID-Master の TMP-P-000364「الطيب محمد بن أحمد بن أبي بكر بن الشهاب بن الجمال」（Note 空欄）は同人＝名寄せ要（ISSUES §D104-2）。'
