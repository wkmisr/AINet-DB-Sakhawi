translation:
  ja: ウマル、アブド・アッ＝サラームと呼ばれる、ブン・アビー・バクル・ブン・ムハンマド・アビー・バクル・ブン・アリー・ブン・ムハンマド・ブン・アビー・バクル、シュジャーウ・アッ＝ディーン・アン＝ナーシリー。その父は後述する。母方の叔父であるカーディー・アル＝ジャマール・アッ＝タイイブのもとで多くを聴聞し、［クルアーンの］誦読と集団礼拝への精励に専心した。（8）26年に巡礼し、子供たちがいた。
  en: ʿUmar, called ʿAbd al-Salām, b. Abī Bakr b. Muḥammad Abī Bakr b. ʿAlī b. Muḥammad b. Abī Bakr, Shujāʿ al-Dīn al-Nāshirī; his father comes below. He heard much from his maternal uncle the qāḍī al-Jamāl al-Ṭayyib, and devoted himself to recitation and to constant attendance at congregational prayer. He performed the pilgrimage in (8)26, and he had children.
