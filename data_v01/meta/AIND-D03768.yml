translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・アビー・アブドゥッラー・ブン・サラーマ・アル＝マークシーニー・アッ＝ディマシュキー。彼の父と同様に、ダマスカスのウマイヤ・モスクのムアッジン（礼拝告知者）であり、その長を務めた。イブン・アビー・アッ＝ターイブ、およびアッ＝ザイン・アブドゥルガーリブ・ブン・ムハンマド・アル＝マークシーニーから、彼の『マシヤハ（師父目録）』などを聴聞した。ハディースを伝承し、我らがシャイフ（イブン・ハジャル）は「彼は私に何度もイジャーザ（伝承認可）を与えてくれた」と述べた。彼は801年ジュマーダー・アル＝ウーラーに没した。アル＝マクリーズィーもその著書『アル＝ウクード』でこれに従っている。なお、彼の祖父をムハンマドと命名している記述を見たことがある。
  en: 'Abd al-Rahman b. Muhammad b. Abi Abd Allah b. Salamah al-Makasini al-Dimashqi, the muezzin of the Great Mosque of Damascus and its chief, like his father. He heard from Ibn Abi al-Ta''ib and from al-Zayn Abd al-Ghalib b. Muhammad al-Makasini, studying the latter''s Mashyakha and other works. He transmitted hadith, and our shaykh (Ibn Hajar) said: ''He granted me ijaza more than once.'' He died in Jumada al-Ula in the year 801 AH, which al-Maqrizi also followed in his Uqud. I saw some who named his grandfather Muhammad.'
