  norm: تعصب معه تمراز ناءب السلطنة في ايام الناصر فرج حتي صرف الشمس البلالي به عن مشيخة سعيد السعداء ثم بعد عشرة ايام صرف لمجء الامر بقبض تمراز ورجعت المشيخة لصاحبها وعد ذلك من كراماته
