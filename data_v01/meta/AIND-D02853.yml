  lang: ja
translation:
  ja: ハディル、サイード・アッ＝スアダー（ハーンカー）の従僕。ナースィル・ファラジュの時代に副スルターン（ナーイブ・アッ＝サルタナ）のタムラーズが彼に肩入れし、ついにアッ＝シャムス・アル＝ビラーリーを彼のためにサイード・アッ＝スアダーのシャイフ職から解任させた。しかし10日後、タムラーズ逮捕の命令が届いたため彼は解任され、シャイフ職はその持ち主（アル＝ビラーリー）に戻った。これは彼（アル＝ビラーリー）のカラーマ（奇瑞）の一つに数えられた。彼の伝記を書いた者を私は見ていない。要再検討。
  en: Khaḍir, the attendant (khādim) at Saʿīd al-Suʿadāʾ. Tamrāz, the viceroy (nāʾib al-salṭana) in the days of al-Nāṣir Faraj, took his side so far as to have al-Shams al-Balālī dismissed from the shaykh-ship of Saʿīd al-Suʿadāʾ in his favour; but ten days later he was dismissed when the order arrived to arrest Tamrāz, and the shaykh-ship returned to its holder, which was counted among his (al-Balālī's) miracles. I have not seen anyone who wrote a biography of him; this should be looked into.
