translation:
  ja: アブドゥッラー・アル＝カラーフィー・アッ＝サウーディー、アル＝ウサイフィルとして知られる。多くの人々、さらにはスルタンまでもが篤く信奉した者の一人。852年ラビーウ・アル＝アーヒル月に没し、カラーファのジャーミウ・マフムードで葬礼が行われ、埋葬された。神が彼を憐れみたまえ。
  en: ʿAbd Allāh al-Qarāfī al-Saʿūdī, known as al-Uṣayfir. He was one of those in whom many people, even the Sultan, placed devout belief. He died in Rabīʿ II of the year 852; the funeral prayer was performed over him at the Mosque of Maḥmūd in al-Qarāfa, and he was buried, may God have mercy on him.
