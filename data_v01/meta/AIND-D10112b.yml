translation:
  ja: マイラブ・ブン・ムハンマド・ブン・アビー・スワイド・ブン・アビー・ドゥアイジュ・ブン・アビー・ヌマイイ・アル＝ハサニー。勇敢さと気概で知られた。829年シャアバーン月に叔父アリー・ブン・アビー・スワイドとともに殺された。ファースィーが『ザイル・スィヤル・アン＝ヌバラー』で彼に言及した。
  en: Maylab b. Muḥammad b. Abī Suwayd b. Abī Duʿayj b. Abī Numayy al-Ḥasanī. He was credited with courage and gallantry. He was killed with his uncle ʿAlī b. Abī Suwayd in Shaʿbān 829. Al-Fāsī mentioned him in the Dhayl Siyar al-Nubalāʾ.
