translation:
  ja: アブド・アル＝カリーム・ブン・ムハンマド・ブン・イブラーヒーム・アッ＝ディマシュキー、アッ＝サッワーフとして知られる。マッカにたびたび赴いて同地に住み、そこにいくつかの家を建てた者の一人で、同地から商用でインドへ旅していた。857年にインドのカリカットの地で没した。イブン・ファフドがその没年を記録している。
  en: ʿAbd al-Karīm b. Muḥammad b. Ibrāhīm al-Dimashqī, known as al-Ṣawwāf. He was among those who frequented Mecca, settled there and built some houses there, and he used to travel from there to India for trade. He died in the year [8]57 in the land of Calicut in India. Ibn Fahd recorded his death.
