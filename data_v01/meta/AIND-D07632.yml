  note:
    ja: '原文「قيم مصارع معالج」を「قيّم مصارعَ」（イダーファ）＝レスリング場（مصارع＝مصرع の複数）の管理人、「معالج」＝施術者（接骨・治療を行う者）と読む（2026-09-24 Waka 裁定 ★7-1、引き継ぎ担当の読み）。3語を無接続で並べた「管理人・格闘家・施術者」の読みは、サハーウィーが職業を列挙するときに接続詞 و を省かないため採らない。語義に不確実さが残り職としての同定はできないため、label は原文どおり、ref は #NEEDID のまま（ISSUES §Df-3）。'
notes:
- text: 原文末尾「واسم جده」は目的語を欠いたまま項が終わる（刊本の欠落）。祖父名は不明。
  lang: ja
  type: textual
translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・アル＝ハラビー。イブン・アミーン・アッ＝ダウラとして知られる。レスリング場の管理人で、施術（接骨・治療）も行った〔語義に不確実さが残る〕。アッ＝サラーフ・イブン・アビー・ウマルらからのイジャーザを持ち、〔八百〕三十年以降に我らがシャイフ（イブン・ハジャル）の息子らにイジャーザを与えた。彼の祖父の名は〔原文欠〕。
  en: Muḥammad b. ʿAbd al-Raḥmān al-Ḥalabī, known as Ibn Amīn al-Dawla. Custodian of the wrestling grounds and a practitioner (bone-setter) [reading uncertain]. He held an ijāza from al-Ṣalāḥ b. Abī ʿUmar and others, and he granted an ijāza to the son of our shaykh (Ibn Ḥajar) and others after [the year 8]30. And his grandfather's name [text breaks off].
