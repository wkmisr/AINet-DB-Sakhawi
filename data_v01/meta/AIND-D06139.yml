translation:
  ja: ファーリス・アル＝アシュラフィー・アッ＝ルーミー・アッ＝タワーシー（宦官）。842年にアル＝ワラウィー・ブン・カースィムの後任としてマディーナの奉仕者（宦官）長職（マシュヤハト・アル＝フッダーム）に就き、海路でヤンブウへ向かい、そこから任地へ進んで同年中に到着した。845年に解任されるまで在職し、その後再任されて854年に解任されるまで在職した。
  en: Fāris al-Ashrafī al-Rūmī al-Ṭawāshī (the eunuch). He was appointed to the office of chief of the attendants (mashyakhat al-khuddām) in Medina in the year 842 in place of al-Walawī b. Qāsim, and set out by sea for Yanbuʿ in order to proceed from there to his post, reaching it in the course of that year. He remained until he was dismissed in the year 845, then was reinstated and remained until he was dismissed in the year 854.
