translation:
  ja: アブドゥッサマド・ブン・ウマル・ブン・アブドゥッラフマーン・ブン・アフマド・アル＝ムクラーニー・アル＝ヤマーニー・アッ＝シャーフィイー。アブー・ナビーラとして知られる。有徳の人物で、法学などを父のもとで学んだ。893年ラビーウ・アル＝アウワル月にメッカで私（サハーウィー）と会い、私のもとでナワウィーの『四十ハディース』を読誦し、それ以外を聴聞した。彼は私に、父が法学者でアル＝アフダルに学んだこと、888年に76歳で没したことを語った。
  en: ʿAbd al-Ṣamad b. ʿUmar b. ʿAbd al-Raḥmān b. Aḥmad al-Muqrānī al-Yamānī al-Shāfiʿī, known as Abū Nabīla. An accomplished man, he studied fiqh and other subjects under his father. He met me in Mecca in Rabīʿ I 893 AH and read to me al-Nawawī's Forty Hadiths, and heard other things. He told me that his father was a jurist who had studied under al-Ahdal and died in the year 888 AH at the age of seventy-six.
