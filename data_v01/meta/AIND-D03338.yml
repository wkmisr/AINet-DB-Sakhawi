translation:
  ja: シャフワーン・ブン・アジル・ブン・ルマイフ。アッ＝サイイド、アン＝ヌマウィー。マッカの支配者の娘婿（娘の一人と結婚）。母もまたバラカートの娘ファーティマである。ヒジュラ暦892年に死去。マッカで葬儀礼拝が行われたのち、埋葬された。
  en: Shahwān b. ʿAjl b. Rumayḥ, al-Sayyid al-Numawī. He was the son-in-law of the ruler of Mecca, having married one of his daughters. His mother too was Fāṭima, the daughter of Barakāt. He died in the year 892 AH, and the funeral prayer was performed for him in Mecca, where he was then buried.
