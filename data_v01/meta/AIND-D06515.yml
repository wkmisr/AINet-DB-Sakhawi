notes:
- text: '転送見出し（原文「فيمن جده عبد الوهاب قريبا」による）。転送先は2項あとの #AIND-D06517「محمد بن إبراهيم بن التاج عبد الوهاب على الأكثر أو الجمال عبد الله كما رأيته في بعض ورق عرضه تاج الدين الأخميمي الأصل القاهري الشافعي … ويعرف أبوه بالسيوفي وهو بالتاج الأخميمي . ولد في يوم عاشوراء سنة أربع وثمانمائة … ومات في يوم الخميس تاسع عشري رمضان سنة إحدى وتسعين」（未受領）＝祖父名の両形（عبد الوهاب／عبد الله）を相手側本文が説明し、ニスバ الأخميمي が一致する。corpus 見出しで「محمد بن إبراهيم＋الأخميمي」はこの2項のみ（ブリーフ候補を本文で確認）。'
