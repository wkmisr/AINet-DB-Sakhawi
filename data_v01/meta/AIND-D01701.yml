translation:
  ja: アフマド・ブン・ヤアクーブ・ブン・ムハンマド・ブン・シッディーク・アル＝ブルルスィー。その父〔ヤアクーブ〕と兄弟のムハンマドは後述される。商売に従事し、アル＝ブルハーン・イブン・ウライバの娘と結婚したが、彼から安らぎを得ることはなかった。誕生は850年以前である。
  en: Aḥmad b. Yaʿqūb b. Muḥammad b. Ṣiddīq al-Burlusī. His father [Yaʿqūb] and his brother Muḥammad will be mentioned later. He engaged in trade and married the daughter of al-Burhān b. ʿUlayba, but found no comfort from him. He was born before 850 H.
