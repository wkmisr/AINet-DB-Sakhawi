translation:
  ja: ムハンマド・ブン・アフマド・ブン・ジャアファル・ブン・アフマド・ブン・アリー・アッ＝ディーワーニー・アル＝マッキー。イナーン・ブン・ムガーミス・ブン・ルマイサほかマッカのアミールたちに仕え、思うに（80）6年かその翌年にそこで没した。アル＝ファースィーが『マッカ〔史〕』で彼に言及している。
  en: Muḥammad b. Aḥmad b. Jaʿfar b. Aḥmad b. ʿAlī al-Dīwānī al-Makkī. He served ʿInān b. Mughāmis b. Rumaytha and others of the amirs of Mecca, and he died there, as is thought, in the year [80]6 or the one after it. Al-Fāsī mentioned him in [his history of] Mecca.
