translation:
  ja: アフマド・ブン・ムハンマド・ブン・ムハンマド、ラカブはアッ＝シハーブ、ニスバはアル＝ハウィー、次いでアル＝カーヒリー、ハンバリー派。わずかに勉学に励み、ウンム・ハーニウ・アル＝フーリーニーヤおよびその同席者たちのもとで『サヒーフ・アル＝ブハーリー』の読了（ختم）を聴聞した。静穏な人物であった。
  en: Aḥmad b. Muḥammad b. Muḥammad, laqab al-Shihāb, nisbahs al-Hawī then al-Qāhirī, a Ḥanbalī. He studied a little and heard the completion (khatm) of al-Bukhārī's Ṣaḥīḥ from Umm Hāniʾ al-Hūrīniyya and those who were with her. He was a quiet person.
