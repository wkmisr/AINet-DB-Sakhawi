translation:
  ja: ムハンマド・ブン・アフマド・ブン・ハサン・ブン・ムハンマド・ブン・ムハンマド・ブン・ザカリーヤー・ブン・ヤフヤー・ブン・マスウード・ブン・グナイマ・ブン・ウマル、アッ＝スワイダーウィー・アル＝カーヒリー。父は前出。アル＝ジャマール・アル＝マーリダーニーからミーカート（礼拝時刻学）その他を学んだ者の一人で、『イルシャード・アル＝バシャル・イラー・アル＝アマル・ビル＝カワーキブ・ワル＝カマル』と名づけた著作がある。没した（以下欠）。
  en: Muḥammad b. Aḥmad b. Ḥasan b. Muḥammad b. Muḥammad b. Zakariyyā b. Yaḥyā b. Masʿūd b. Ghunayma b. ʿUmar, al-Suwaydāwī al-Qāhirī, whose father has been mentioned above. One of those who learned timekeeping (al-mīqāt) and other things from al-Jamāl al-Māridānī; he has a work which he named Irshād al-bashar ilā al-ʿamal bi-l-kawākib wa-l-qamar. He died [the text breaks off here].
