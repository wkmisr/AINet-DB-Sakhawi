notes:
- text: '転送見出し（原文「فيمن جده عبد الله」による）。転送先は #AIND-D06512「889 محمد بن إبراهيم بن عبد الله أو أبو بكر ووجدته بخطه ولعلها كنية عبد الله الشمس الشطنوفي ثم القاهري الشافعي والد أحمد الماضي … مات في ليلة الاثنين سادس عشري ربيع الأول سنة اثنتين وثلاثين」（repo 未収録）。名・父名・祖父 عبد الله・ニスバ الشطنوفي が一致。同じ D06512 へ向く転送見出しに REF #AIND-D06493「محمد بن إبراهيم بن أبي بكر الشمس الشطنوفي . فيمن جده عبد الله .」（repo 収録済み）。直前の実項 #AIND-D06585（802年の عرض に書いた محمد بن إبراهيم الشافعي、「وأظنه الشطنوفي」）も同じ D06512 を指す possible_identity を持つ。'
