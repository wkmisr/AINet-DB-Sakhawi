translation:
  ja: ウマル・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・フサイン・ブン・アリー・ブン・アフマド・ブン・アティーヤ・ブン・ザヒーラ、アッ＝シラージュ・ブン・アル＝カーディー・ジャマール・アッ＝ディーン・アビー・アッ＝スウード・ブン・カーディー・アル＝クダート・アル＝カマール・アビー・アル＝バラカート・ブン・アル＝カーディー・アル＝ジャマール・アビー・アッ＝スウード、アル＝クラシー、アル＝マッキー。後述のアブー・アル＝ハイル・ムハンマドの同母兄弟で、二人の母はアル＝カーディー・アビー・アル＝カースィム・ブン・アビー・アル＝アッバース・ブン・アブド・アル＝ムウティーの娘ウンム・アル＝ハイルである。853年ムハッラム月に預言者の町マディーナで生まれ、父とともにマッカに来て、アッ＝シハーブ・アフマド・ブン・アリー・アル＝マハッリーから聴聞した。854年以降、アブー・ジャアファル・ブン・アル＝アジャミーらが彼にイジャーザを与えた。たびたびカイロに来た。クルアーンを暗記していて、子弟の慣習どおり、同母兄弟アブー・バクルとラマダーン月に交代でそれを唱えて礼拝を導いた。おそらく他の書も暗記した。母方の叔父アブド・アル＝カーディルのもとで文法を読み、叔父のために講義の下読みをしていた。だが秀でることはなかった。
  en: ʿUmar b. Muḥammad b. Muḥammad b. Muḥammad b. Ḥusayn b. ʿAlī b. Aḥmad b. ʿAṭiyya b. Ẓahīra, al-Sirāj b. al-Qāḍī Jamāl al-Dīn Abī al-Suʿūd b. Qāḍī al-Quḍāt al-Kamāl Abī al-Barakāt b. al-Qāḍī al-Jamāl Abī al-Suʿūd al-Qurashī al-Makkī, full brother of Abū al-Khayr Muḥammad who comes below; their mother was Umm al-Khayr, daughter of the qāḍī Abū al-Qāsim b. Abī al-ʿAbbās b. ʿAbd al-Muʿṭī. He was born in Muḥarram 853 in the Prophet's Medina, came with his father to Mecca and heard from al-Shihāb Aḥmad b. ʿAlī al-Maḥallī. In 854 and thereafter Abū Jaʿfar b. al-ʿAjamī and others gave him an ijāza. He came repeatedly to Cairo. He had memorized the Qurʾān and led the prayers with it, alternating with his full brother Abū Bakr in Ramaḍān according to the custom of the sons (of the family); he may have memorized other works too. He read grammar with his maternal uncle ʿAbd al-Qādir and used to prepare the lesson for him. He did not excel.
