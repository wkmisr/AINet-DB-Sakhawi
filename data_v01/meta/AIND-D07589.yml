translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・アル＝カーディー・アビー・アブディッラー・ムハンマド・ブン・アル＝カーディー・ナースィルッディーン・アブドゥッラフマーン・ブン・ムハンマド・ブン・サーリフ、ムイーヌッディーン・アル＝キナーニー・アル＝マダニー・アッ＝シャーフィイー。父は先述。若者で、898年、その読了の日に預言者のラウダにおいて、マディーナのマーリク派カーディーであるハイルッディーンのもとで『アッ＝シファー』を読誦するのを私は見た。
  en: Muḥammad b. ʿAbd al-Raḥmān b. al-Qāḍī Abī ʿAbd Allāh Muḥammad b. al-Qāḍī Nāṣir al-Dīn ʿAbd al-Raḥmān b. Muḥammad b. Ṣāliḥ, Muʿīn al-Dīn al-Kinānī al-Madanī al-Shāfiʿī, whose father was mentioned previously. A young man; I saw him reading al-Shifāʾ before Khayr al-Dīn, the Mālikī judge of Medina, in 898, on the day of its completion, in the Prophet's Rawḍa.
