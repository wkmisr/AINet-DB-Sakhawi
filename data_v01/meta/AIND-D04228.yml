translation:
  ja: 我らがシャイフ（イブン・ハジャル）がその『インバー・アル＝グムル』のヒジュラ暦838年の出来事の中で、度重なる偽造行為のために指を切り落とされたと伝えている人物である。私（サハーウィー）は言う、彼はアル＝マクシャラ（監獄）に投獄されたが、それでも死ぬまでその行為を止めなかった。
  en: 'He is the one whom our shaykh (Ibn Ḥajar) mentioned in his chronicle 『Inbāʾ al-Ghumr』 under the events of the year 838 AH, stating that his finger was cut off due to his repeated forgery. I (al-Sakhāwī) say: He was also imprisoned in the al-Maqshara prison, yet despite that, he did not cease his habits until his death.'
