translation:
  ja: アムル・ブン・ウスマーン・ブン・ムハンマド・ブン・ウスマーン、我らの友アル＝ファフル・アッ＝ディーミー・アル＝アスル・アル＝アズハリーの息子。聡明で賢く、父の読み上げと私の読み上げによって多くの人々から聴聞し、さらに私からも聴聞した。成人に達する前に（8）64年のペストで没した。神が彼に天国で報いられますように。
  en: ʿAmr b. ʿUthmān b. Muḥammad b. ʿUthmān, a son of our companion al-Fakhr al-Daymī by origin, al-Azharī. He was intelligent and quick-witted; he heard from a number of scholars through the recitation of his father and through my recitation, and indeed he heard from me as well. He died before reaching puberty in the plague of the year (8)64. May God recompense him with Paradise.
