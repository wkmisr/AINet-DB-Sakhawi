translation:
  ja: アハマド・ブン・アハマド・ブン・ウマル・ブン・フサイン。ザフターウィー出身でアル＝マクスィーに移住した人物。父親については後述。彼のおじはアブド・アル＝カーディル。私（サハーウィー）のもとで『タクリープ・リル＝ナワウィー』を朗読し、その他（の書物）について聴聞した。
  en: Aḥmad b. Aḥmad b. ʿUmar b. Ḥusayn, originally from Zaftā and residing in al-Maqs. His father will be mentioned below, and his paternal uncle is ʿAbd al-Qādir. He read to me (al-Sakhāwī) from al-Nawawī's 『al-Taqrīb』 and heard other works (from others).
