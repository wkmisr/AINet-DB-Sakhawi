translation:
  ja: ウマル・ブン・フサイン・ブン・フサーム・アッ＝ディーン、アン＝ナジュム・ブン・アル＝カーディー・ジャマール・アッ＝ディーン、アッ＝サアディー（サアド・ブン・アビー・ワッカースに由来する）・アル＝ヒスニー・アッ＝シャーフィイー。前述のアル＝アラー・アリー・ブン・アル＝バドル・ムハンマド・ブン・フサインの父方の叔父。カイロに来て、我らがシャイフ（イブン・ハジャル）のもとで『ブハーリー』を読んだ。徳と信仰心を兼ね備え、きわめて寛大であった。833年にペストで没した。アッラーが彼に慈悲を垂れられんことを。
  en: ʿUmar b. Ḥusayn b. Ḥusām al-Dīn, al-Najm b. al-Qāḍī Jamāl al-Dīn, al-Saʿdī (an attribution to Saʿd b. Abī Waqqāṣ) al-Ḥiṣnī al-Shāfiʿī, the paternal uncle of al-ʿAlāʾ ʿAlī b. al-Badr Muḥammad b. Ḥusayn, mentioned previously. He came to Cairo and read al-Bukhārī under our shaykh (Ibn Ḥajar). He was extremely generous, with merit and piety. He died of the plague in the year 833. May God have mercy on him.
