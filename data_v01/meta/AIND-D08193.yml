notes:
- text: '転送見出し（原文末尾「فيمن جده محمد بن عبد الله」による）。転送先は #AIND-D08591「محمد بن علي بن محمد بن عبد الله الشمس بن النور البهرمسي المحلي الشافعي صهر الغمري والماضي أبوه ويعرف بابن البهرمسي ، وبهرمس من المحلة . ولد تقريبا سنة عشرين بالمحلة … مات في ربيع الآخر سنة ثمان وخمسين」（名・父名・祖父名 عبد الله・ニスバ البهرمسي が一致。未受領。父＝#AIND-D05455 علي بن محمد بن عبد الله نور الدين البهرمسي）。ニスバ索引 #AIND-D11516「البهرمسي نسبة لقرية من المحلة بالغربية محمد بن علي بن محمد بن عبد الله وأبوه」は父子2人の合同索引のため target に使わない（規則11）。'
