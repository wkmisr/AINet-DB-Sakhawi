- text: 人物評：アラビア語学を解し医学に秀で、能書で著作もあり、「فخم العبارة مع فضيلة في الجملة」。
  lang: ja
translation:
  ja: ナースィル・ブン・アリー・ブン・ムハンマド・ブン・アフマド・アル＝アンサーリー・アル＝ヒスニー、イラーキーおよびハキーム（医師）として知られる。およそ816年に生まれ、故郷で学び一団〔の師〕に会った後カイロに来た。アラビア語学を理解し、医学に秀でて治療を行い、能書で、いくつかの著作を書き、時に証人たちと同席した。私のもとに少し通い、私から学ぼうとした。総じて学識を備え、重厚な言葉遣いの人だった。891年ラビーウ第1月に没した。
  en: Nāṣir b. ʿAlī b. Muḥammad b. Aḥmad al-Anṣārī al-Ḥiṣnī, known as al-ʿIrāqī and as al-Ḥakīm. Born about 816, he came to Cairo after studying in his homeland and meeting a group of scholars. He understood Arabic, excelled in medicine and practised it, wrote a fine hand and composed some works, and sometimes sat with the notary witnesses. He came to me a little, wishing to study with me; he was grandiloquent, with some learning on the whole. He died in Rabīʿ I 891.
