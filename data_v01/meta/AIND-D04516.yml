  ja: アブドゥッラー・ブン・アリー・アッ＝タイッズィー・アル＝マダニー・アッ＝シャーフィイー。ビーマーリスターン（施療院）の奉仕人（ハーディム）。クルアーンを暗記している者で、同様に『ミンハージュ』も暗記した。ヒジュラ暦891年ラビーウ・アル＝アウワル月に没した。
  en: ʿAbd Allāh b. ʿAlī al-Taʿizzī al-Madanī al-Shāfiʿī, servant (khādim) of the bīmāristān. He is among those who memorized the Qurʾān, and he likewise memorized al-Minhāj. He died in Rabīʿ al-Awwal of the year 891 AH.
