translation:
  ja: ウスマーン・ブン・アリー・ブン・イスマーイール・ブン・ガーニム、アル＝ファフル・ブン・アル＝クトゥブ、アル＝マクディスィー。757年に生まれ、4歳のときアル＝バヤーニーのもとに連れられて『アル＝ムスタジャード・ミン・ターリーフ・バグダード』などを聴講した。伝承（ハディース伝授）を行った。815年にイブン・ムーサーが、アル＝アッビーを伴って彼に会い、二人は彼から聴聞した。アッ＝タキー・ブン・ファハドとその子など一団の人々にイジャーザを与えた。我らの師（イブン・ハジャル）はその『ムウジャム』で「彼は私の娘ラービアにイジャーザを与えた」と述べている。
  en: 'ʿUthmān b. ʿAlī b. Ismāʿīl b. Ghānim, al-Fakhr b. al-Quṭb, al-Maqdisī. He was born in 757 and in his fourth year was brought to attend, under al-Bayānī, al-Mustajād min Taʾrīkh Baghdād and other works. He transmitted ḥadīth. Ibn Mūsā, accompanied by al-Ubbī, met him in 815 and both heard from him. He granted ijāza to a group including al-Taqī b. Fahd and his son. Our shaykh (Ibn Ḥajar) said in his Muʿjam: "He granted ijāza to my daughter Rābiʿa."'
