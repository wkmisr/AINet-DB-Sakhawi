translation:
  ja: サダカ・ブン・ムーサー。ファトフ・アッ＝ディーン、アブー・アッ＝シファー。イブン・サダカ、また、より広く知られた名としてはイブン・ファイルーズと呼ばれる。医師の一人。多くの者が彼のもとで学んだ。イブン・アッ＝シャリーフが彼の娘を妻とし、その間に後述の息子アル＝カマール・ムハンマドが生まれた。卓越した人物であった。おそらく（ヒジュラ暦8）70年頃に没した。
  en: Ṣadaqa b. Mūsā, Fatḥ al-Dīn, Abū al-Shifāʾ, also known as Ibn Ṣadaqa and more famously as Ibn Fayrūz. He was a physician under whom a group of students graduated. Ibn al-Sharīf married his daughter, who gave birth to his son al-Kamāl Muḥammad (mentioned below). He was highly skilled and is thought to have died around 870 AH.
