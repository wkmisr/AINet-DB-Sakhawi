translation:
  ja: アリ・ブン・アブドゥッラー・ヌール・アッ＝ディーン・アン＝ナフィヤーイー・アル＝カーヒリー。アフマドの父であり、アフマドとムハンマドの兄弟である。彼らはイスラームに改宗し、クルアーンを朗読し、ハッジ（大巡礼）を行った。彼は香料商などで生計を立て、サイード・アッ＝スアダー（ハーンカー）に身を寄せ、善良かつ堅実に暮らした。ヒジュラ暦889年ラビー・アル＝アーヒル月（第4月）に死去。推測するに40歳を超えていた。アッラーが彼を憐れんでくださいますように。
  en: ʿAlī b. ʿAbd Allāh Nūr al-Dīn al-Nifyāʾī al-Qāhirī. He was the father of Aḥmad, and the brother of Aḥmad and Muḥammad, who converted to Islam, read the Qurʾān, and performed the Hajj. He earned his living as a perfumer and settled in Saʿīd al-Suʿadāʾ (Khānqāh) in goodness and decency. He died in Rabīʿ al-Ākhir, 889 H, having presumably passed the age of forty. May Allāh have mercy on him.
