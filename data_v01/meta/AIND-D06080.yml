translation:
  ja: イーサー・ブン・ウタイファ（ハニーファと同形）・ブン・ムハンマド・ブン・イーサー・アル＝ウトビー・アル＝ハルウィー（ハリーに因む）・アル＝ヤマーニー・アッ＝シャーフィイー。866年に生まれた。（8）97年ズー・アル＝ヒッジャ月にマッカで私（サハーウィー）に出会い、私に『ミンハージュ』の一部を読誦し、私から『ムサルサル』などを聴聞した。私は彼のために（イジャーザを）書いた。
  en: ʿĪsā b. ʿUṭayfa (on the pattern of Ḥanīfa) b. Muḥammad b. ʿĪsā al-ʿUtbī al-Ḥalawī (after Ḥalī) al-Yamānī al-Shāfiʿī. He was born in the year 866. He met me (al-Sakhāwī) in Dhū al-Ḥijja of the year (8)97 in Mecca, read part of al-Minhāj to me and heard from me al-Musalsal and other things, and I wrote (an ijāza) for him.
