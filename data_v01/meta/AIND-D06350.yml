translation:
  ja: カシュタムル——あるいはラーなしで（カシュタム）——アル＝マフムーディー・アン＝ナースィリー・ファラジュ。ブハイラの代官（ナーイブ）職に就き、857年ラジャブ月末、タルーハの近くで彼とアラブのラビード族との間に起こった戦闘において、同地で戦死した。60歳に近かった。賢明で勇敢、高貴で謙虚、気前がよく、容姿端麗で愛想がよく、人々に愛され、その統治を称えられ、物事に通じ果敢な、同輩中の美点ある人物の一人であった。アッラーの慈悲あれ。
  en: Qashtamur — or without the rāʾ (Qashtam) — al-Maḥmūdī al-Nāṣirī Faraj. He held the governorship (niyāba) of al-Buḥayra and was killed there, in a battle between him and the Arabs of Labīd near Tarūḥa, at the end of Rajab of the year 857, having nearly reached sixty. He was a sensible, brave, noble, humble and generous amir, handsome, cheerful, beloved by the people, praised in his governorship, knowledgeable and bold, one of the finest of his kind; may God have mercy on him.
