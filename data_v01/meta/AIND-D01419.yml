translation:
  ja: アフマド・ブン・ムハンマド・ブン・アリー・ブン・ウマル・ブン・アリー・ブン・アフマド、ラカブはアッ＝シハーブ、イブン・アル＝バドル、ニスバはアル＝クラシー、アッ＝タンバズィー、アル＝カーヒリー。後述するアッ＝サラーフと、アル＝ムヒッブ・アブー・アル＝ファドル——このいずれもムハンマドという名の——二人の息子の父である。彼は父祖にならいイブン・アラブとして知られる。彼は二人の息子のうち最初の子に先立たれた後、875年ラジャブ月に亡くなった。かつて一時期フィールーズ・アッ＝ザマームに仕えていた。アッラーが彼を赦し給わんことを。
  en: Aḥmad b. Muḥammad b. ʿAlī b. ʿUmar b. ʿAlī b. Aḥmad, al-Shihāb, Ibn al-Badr al-Qurashī al-Ṭanbadhī al-Qāhirī, was the father of al-Ṣalāḥ and al-Muḥibb Abū al-Faḍl, the two Muḥammads who will be mentioned later. He was known, like his predecessors, as Ibn ʿArab. He died in Rajab 875 AH, after having been bereaved of the elder of his two sons. He was at one time in the service of Fīrūz al-Zimām. May God forgive him.
