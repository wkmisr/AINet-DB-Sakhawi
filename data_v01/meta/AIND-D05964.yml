translation:
  ja: ウマル・ブン・ムハンマド・ブン・ウマル・ブン・アフマド・ブン・アル＝ムバーラク、アッ＝ザイン・ブン・アル＝カマール・ブン・アッ＝ザイン、アル＝ハマウィー、アッ＝シャーフィイー。祖父は既述、父は後述。先祖と同様にイブン・アル＝ハラズィー（二つの点付き文字で）として知られる。（8）93年、父の数か月後に30数歳で没した。彼は大した人物ではなかったと私は聞いている。神が彼を赦したまわんことを。
  en: ʿUmar b. Muḥammad b. ʿUmar b. Aḥmad b. al-Mubārak, al-Zayn b. al-Kamāl b. al-Zayn al-Ḥamawī al-Shāfiʿī; his grandfather was mentioned above and his father comes below. He was known, like his forebears, as Ibn al-Kharazī (with two dotted letters). He died a few months after his father in the year (8)93, aged thirty-odd. I was told that he was of no great account; may God pardon him.
