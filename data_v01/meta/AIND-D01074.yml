translation:
  ja: 110 アフマド・ブン・アリー・ブン・ムハンマド、アブー・アル＝アッバース、アル＝シャーディリー、シャーフィイー派。 イラーキーの『アルフィーヤ』の注釈書の一写本を見たが、その写本は、筆写者によれば「我らがシャイフ（イブン・ハジャル）に読誦され、イジャーザを与えられた」と記されているものであった。また、カーヤーティーにも読誦された。これは、後の伝記で出てくるアフマド・ブン・ムハンマド・ブン・アブド・アル＝ガニーの系譜とマズハブに誤りがある可能性があり、調査が必要である。
  en: 110 Aḥmad b. ʿAlī b. Muḥammad, Abū al-ʿAbbās, al-Shādhilī, al-Shafi'i. I saw a copy of al-ʿIrāqī’s commentary on al-Alfiyya, which its transcriber stated he copied from his own copy, and which had been recited to our shaykh (Ibn Ḥajar), who granted him ijāza. It was also recited to al-Qāyātī. It is possible that this Aḥmad is the same Aḥmad b. Muḥammad b. ʿAbd al-Ghanī (forthcoming in the Kunyas section), and that there was an error in the recording of his nasab and madhhab, which requires investigation.
