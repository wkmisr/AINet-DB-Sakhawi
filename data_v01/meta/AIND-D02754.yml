translation:
  ja: フサイン・ブン・ヤフヤー・ブン・アフマド・ブン・イスマーイール・ブン・アリー・ブン・ダーウード・ブン・ユースフ・イブン・ウマル・ブン・アリー・ブン・ラスール・アル＝ムアイヤド・ブン・アッ＝ザーヒル・ブン・アン＝ナースィル・ブン・アル＝アシュラフ・ブン・アル＝アフダール・イブン・アル＝ムジャーヒド・ブン・アル＝ムアイヤド・ブン・アル＝ムザッファル・ブン・アル＝マンスール・アル＝ガッサーニー。イエメン王家（ラスール朝）の系統。870年ジュマーダー・アル＝ウーラー（第5月）にマッカで没した。イブン・ファハドがその没年を記録している。
  en: Ḥusayn b. Yaḥyā b. Aḥmad b. Ismāʿīl b. ʿAlī b. Dāwūd b. Yūsuf b. ʿUmar b. ʿAlī b. Rasūl al-Muʾayyad b. al-Ẓāhir b. al-Nāṣir b. al-Ashraf b. al-Afḍal b. al-Mujāhid b. al-Muʾayyad b. al-Muẓaffar b. al-Manṣūr al-Ghassānī, of the Rasulid kings of Yemen. He died in Mecca in Jumādā al-Ūlā, in the year 870. His death was recorded by Ibn Fahd.
