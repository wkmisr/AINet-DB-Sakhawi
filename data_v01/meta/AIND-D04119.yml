translation:
  ja: アブドゥルカーディル・ブン・ハムザ・アッ＝タラーブルスィー・アッ＝ディマシュキー。イブン・ズフラやイブン・カーディー・シュフバから（ハディース等を）学んだ。カーンスーフがアレッポの総督であった時に、彼のイマームを務めたが、後にイマーム職を退いてシャーム（シリア）に定住した。トルコ風の装束をまとった極めて徳の高い人物であったが、貧困ゆえに、見捨てられた人々（困窮者）の集まりに出席していた。
  en: ʿAbd al-Qādir b. Ḥamza al-Ṭarābulusī al-Dimashqī. He studied under Ibn Zuhra and Ibn Qāḍī Shuhba. He served as an imam for Qānṣawh when the latter was the governor of Aleppo, but later gave up the imamate and settled in al-Shām (the Levant). He was a highly virtuous man who dressed in Turkish attire, but due to his poverty, he used to attend the gatherings of the neglected and destitute.
