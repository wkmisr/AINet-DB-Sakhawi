translation:
  ja: ドウラート・バーイ・アル＝ハサニー・アッ＝ザーヒリー・ジャクマク。様々な職を転々とし、シャード・アッ＝シュウーン（諸事監督官）となった。この職にあった887年にハッジを行い、私たちは彼の隊商（ラクブ）で帰還した。その後、890年にラアス・ナウバ・サーニー（第二親衛隊長）に就任し、893年ラマダーン月の戦闘（マクタラ）で死亡した。
  en: Dawlat Bay al-Hasani al-Zahiri Jaqmaq. He held various posts until he became Shadd al-Shu'un (Supervisor of Affairs), in which capacity he performed the Hajj in the year 887 AH. We returned in his caravan. Then he was appointed as Ra's Nawba Thani (Second Chief of the Mamluk Guards) in the year 890 AH. He died in a battle/massacre in Ramadan of the year 893 AH.
