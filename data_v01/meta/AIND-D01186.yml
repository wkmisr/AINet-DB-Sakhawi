translation:
  ja: アフマド・ブン・ムハンマド・ブン・イブラーヒーム、アッ＝シハーブ・アッ＝シャキーリー・アル＝マダニー。メディナにおける死者への唱誦者（ムラッキン・アル＝アムワート、埋葬時のタルキーンを行う者）。私（サハーウィー）からメディナで聴聞した者の一人。889年ラビーウ・アル＝アーヒル月16日金曜日にメディナで死去し、その日の午後の礼拝時に（葬儀）礼拝が執り行われた。アル＝ファフル・アル＝アイニーが彼の死を私に書き送ってきた。
  en: Aḥmad b. Muḥammad b. Ibrāhīm, al-Shihāb al-Shakīlī al-Madanī, the prompter of the dead (mulaqqin al-amwāt) in Medina. Among those who heard from me (al-Sakhāwī) in Medina. He died there on Friday, the 16th of Rabīʿ al-Ākhir in the year 889 (AH). The funeral prayer was performed in the afternoon (ʿaṣr). Al-Fakhr al-ʿAynī wrote to me about his death.
