translation:
  ja: アブドゥッラヒーム・ブン・イブラーヒーム・アル＝ヤズナースィー。ヤズナースィーは、最初のヤ（下面の二点）にファトハ、次のザーにスクーン、そしてヌーン、最後にスィーン（点なし）であり、モロッコの部族に由来する。マグリブ出身。フェズのカーディー（判事）を務めた。830年を少し過ぎてから没した。証人のための法的公正証書を作成していた人物の一人である。マグリブ出身の我々の仲間の一人が、彼について私に教えてくれた。
  en: ʿAbd al-Raḥīm b. Ibrāhīm al-Yaznāsī (the name al-Yaznāsī is spelled with an opened yaʾ, a quiescent zāy, a nūn, and an unmarked sīn, referring to a Maghribī tribe), al-Fāsī, who was the judge of Fez. He died shortly after 830 AH. He was among those who drafted notary documents for witnesses. One of our Maghribī companions informed me of him.
