translation:
  ja: アリー・ブン・アブド・アッ＝ラフマーン・ブン・アブド・アッラー・ブン・アリー・ブン・アブド・アル＝ムフシン・ブン・ジャマール・アッ＝サナー、アル＝ハワージャー（豪商）・ヌール・アッ＝ディーン・アッ＝シャイバーニー・アル＝バスリー。アル＝アミーン・アブド・アッラーの兄弟。彼から次の詩句が伝えられている。 「非難する女たちの策略を聞いたとき、私は寝椅子を用意して、彼——彼のことである——を呼んだ。 『ユースフよ、今朝、彼女たちの前に出て唱えよ、《これこそ、あなたたちが私を非難したその人》と』」
  en: 'ʿAlī b. ʿAbd al-Raḥmān b. ʿAbd Allāh b. ʿAlī b. ʿAbd al-Muḥsin b. Jamāl al-Thanāʾ, al-Khawājā Nūr al-Dīn al-Shaybānī al-Baṣrī, the brother of al-Amīn ʿAbd Allāh. The following verses of his are transmitted from him: "When I heard of the guile of the blaming women, having prepared a couch, I called out—I mean to him—: ''O Joseph, go out before them this morning and recite: This is the one about whom you blamed me.''"'
