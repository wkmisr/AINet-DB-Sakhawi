translation:
  ja: ジャーニム・アル＝ムアイヤディー・シャイフ。主人（ウスターズ＝アル＝ムアイヤド・シャイフ）の時代に酌人（サーキー）たちのラアス・ナウバ（隊長）職に就き、その後、十人長（アミール・アシャラ）となり、さらにラアス・ナウバの一人（ルウース・アン＝ヌワブ）となった。後の二職はいずれもアル＝アシュラフ・イーナールの時代のことである。彼は物静かで、賢く、つつましく、威厳のある人物であった。861年ムハッラム月に死去した。
  en: Jānim al-Muʾayyadī Shaykh. During the days of his master (ustādh) he held the office of head of the corps of cupbearers (raʾs nawbat al-suqāh); then he became an amir of ten, and then one of the heads of the guard corps (ruʾūs al-nuwab), both of the latter during the days of al-Ashraf Īnāl. He was calm, intelligent, modest and dignified. He died in Muḥarram of the year 861 AH.
