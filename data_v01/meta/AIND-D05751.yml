translation:
  ja: アリー・アッ＝リファーイー。（8）33年ジュマーダー・アッ＝サーニヤ月の中旬にカイロで没した。謙虚で礼儀正しく、人々ともアフマディーヤ教団の者たちとも付き合いがよかったが、学識は備えていなかった。アル＝アイニーが彼に言及している。
  en: ʿAlī al-Rifāʿī. He died in the middle of Jumādā II (8)33 in Cairo. He was humble and well-mannered, on good terms with people and with the Aḥmadiyya order, but devoid of learning. Al-ʿAynī mentioned him.
