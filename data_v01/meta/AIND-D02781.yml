translation:
  ja: ハムザ・ブン・ウスマーン・カラ・ユルク・ブン・トゥル・アリー・カトルーバク。アーミド、マールディーン、およびその他のディヤール・バクルの支配者。彼はハジュリ暦848年のラジャブ月の初旬に没した。彼は、父や兄弟たちのように称賛されるような素行の持ち主ではなかった。彼の死後、甥（兄弟の息子）にあたるジャハーンギール・ブン・アリー・ベク・ブン・ウスマーン（後述）が後を継いだ。
  en: Ḥamza ibn ʿUthmān Qarā Yulūk ibn Ṭur ʿAlī Qaṭlūbak, the ruler of Āmid, Māridīn, and other parts of Diyār Bakr. He died in the beginning of Rajab in the year 848 AH. He was not of praised conduct like his father and brothers. He was succeeded by his nephew Jahāngīr ibn ʿAlī Bik ibn ʿUthmān, who is mentioned below.
