translation:
  ja: ムハンマド・ブン・アリー・ブン・アフマド・ブン・イブラーヒーム・アッ＝サルシーリー・アル＝ムナーウィー、シャーフィイー派。イブン・アル＝ヒリース（hāʾ と lām にカスラ、末尾は無点の字〔sīn〕）として知られ、これは彼の祖父のあだ名である。812年頃にミンヤト・バニー・サルシールで生まれ、そこでクルアーンを暗記して（タラーウィーフで）これを唱えて礼拝を導き、『ウムダ』を暗記して一群の学者に提示（暗誦）した。わずかな詩を作り、その中には受け容れられるものもある。イブン・ファハドとアル＝ビカーイーが838年にアル＝ミンヤで彼から次の詩句を書き取った。 「私と同じ罪人たちよ、神の呼びかけに応えよ、急いで悔い改めよ。 あらゆる醜い行いから身を引き、善を行え、それは報われる行いなのだから。 そして神のもとへ速やかに立ち返れ、清算の日はお前たちの間近にあるのだから」 ——数行の詩のうちの一部。
  en: 'Muḥammad b. ʿAlī b. Aḥmad b. Ibrāhīm al-Salsīlī al-Munāwī al-Shāfiʿī, known as Ibn al-Hilīs (with kasra on the hāʾ and the lām and an undotted sīn at the end), a nickname of his grandfather. He was born in about 812 at Minyat Banī Salsīl, where he memorized the Qurʾān and led prayers with it, and memorized al-ʿUmda, which he presented to a number of scholars. He composed a little poetry, some of which is acceptable. Ibn Fahd and al-Biqāʿī wrote down from him at al-Minya in the year 838 his verses: "O sinners like me, answer the caller of God; hasten and repent. Turn away from every ugly deed and do good, for it is a deed that is reckoned. And return to God soon, for the day of reckoning is near to you" — from a longer poem.'
