translation:
  ja: アハマド・バラカ・アッ＝シハーブ・アッ＝ディマシュキー。アル＝バドリーは自身の著作集で彼について次のように記した。「端麗な彼は、月が彼の前に現れると姿を隠し、背丈の優雅さでバンの木の枝も恥じらう。彼の額には、まるで月の出の際にかかるわずかな暗い雲のような黒子がある。」またこうも記した。「彼の頬には、麝香の線で描かれたような黒子があり、頬の王座に高く座している。それはまるで、バラ園に佇む木が、その横顔に影を落としているかのようだ。」
  en: 'Aḥmad Baraka al-Shihāb al-Dimashqī. Al-Badrī wrote about him in his collection, stating: ''Beautiful, the full moon hides at his presence, and the bān tree branch blushes at his graceful stature. He has a mole above his forehead, as if it were a little dark cloud on the rising moon.'' And he also stated: ''He has a mole, as if drawn with a line of musk, high on the throne of his cheeks. It is like a tree standing in a rose garden, casting a shadow upon his sideburns.'''
