translation:
  ja: ムハンマド・ブン・アリー・ブン・イブラーヒーム・ブン・ムーサー・ブン・ターヒル、アッ＝シャムス、アブー・バクル、アル＝カリユービー、のちアル＝カーヒリー、サイード・アッ＝スアダー（ハーンカー）の門前の油売り——それは彼の父の生業でもあった——、後出のアブー・アル＝ハイル・ムハンマド・アル＝マフバズィーの父。871年ラマダーン月に没した。善良で、集団礼拝を欠かさず、つつましい人であった。神よ彼を憐れみたまえ。
  en: Muḥammad b. ʿAlī b. Ibrāhīm b. Mūsā b. Ṭāhir al-Shams Abū Bakr al-Qalyūbī, then al-Qāhirī, the oil-seller at the gate of Saʿīd al-Suʿadāʾ, which was his father's trade as well; father of Abū al-Khayr Muḥammad al-Makhbazī, who follows. He died in Ramaḍān of the year 871. He was a good man, constant in attending congregational prayers, and of modest means; may God have mercy on him.
