translation:
  ja: ジャアファル・ブン・アビー・バクル・ブン・ラスラーン・ブン・ヌサイル・アル＝ブルキーニー、アル＝カーヒリー、シャーフィイー派。シラージュ・ウマル（アル=ブルキーニー）の甥であり、バハー・ラスラーン、ナーシルッディーン・ムハンマド、シハーブ・アフマドの兄弟である。我らがシャイフ（イブン・ハジャル）は、彼の父の伝記の中で、脱線して彼について述べ、次のように記した。「彼は法学者であり、有徳で、敬虔で、謙虚であった。裁判の代理を務め、サムンヌードなどの地の判事職を担い、ラスラーンの後も生き長らえた。」
  en: 'Jaʿfar b. Abī Bakr b. Raslān b. Nuṣayr al-Bulqīnī, al-Qāhirī, al-Shāfiʿī, was the nephew (brother’s son) of al-Sirāj ʿUmar, and the brother of al-Bahāʾ Raslān, Nāṣir al-Dīn Muḥammad, and al-Shihāb Aḥmad. Our shaykh (Ibn Ḥajar) mentioned him incidentally in his father''s biography in *Inbāʾ al-Ghumr*, saying: "He was a learned, virtuous, pious, and humble jurist. He served as a judicial deputy and held judgeship in some lands like Samannūd, and he outlived Raslān."'
