translation:
  ja: ウマル・ブン・アブドゥッラー・アッ＝シラージュ・アル＝ヒンディー、アル＝ファーファー（ファーを二つ重ねる）。我らがシャイフは『インバー』で「彼はファーの音をしきりに発したので、そう綽名された。法学とその法源学、アラビア語に精通していた」と述べている。マッカに40年以上住んで同地で人々に益を与え、（8）15年ズー・ル＝ヒッジャ月に70歳で没した。
  en: 'ʿUmar b. ʿAbd Allāh al-Sirāj al-Hindī al-Fāfā (with two fāʾs). Our shaykh said in his Inbāʾ: he pronounced the letter fāʾ a great deal and was therefore so nicknamed; he was learned in jurisprudence, its principles, and Arabic. He lived in Mecca for more than forty years, benefiting people there, and died in Dhū al-Ḥijja (8)15 at the age of seventy.'
