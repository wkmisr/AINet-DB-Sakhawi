notes:
- text: 'sister 候補 #AIND-D13466（فاطمة ابنة أبي القسم بن محمد بن علي بن محمد بن جوشن المكي）: 本項原文に言及はないが、女性部 #AIND-D13466「فاطمة ابنة أبي القسم بن محمد بن علي بن محمد بن جوشن المكي . ماتت بها في المحرم سنة اثنتين وثمانين」はナサブ5代が本項主と完全一致し同父と特定できるため、規則23・38により cert medium で補う。なお父の兄弟 أحمد（#AIND-D01424、874年没）・عبد الكريم（#AIND-D04286、商人、イエメンに往来）は本項主の叔父にあたるが、相手側に本項主への言及がないため note 留め。 【集約 2026-10-19】規則23 は相手側本文が本項主を特定して関係を明記する場合に限り relation を補う。本項・相手側のいずれにも言及がなくナサブ一致からの推論にとどまるため、relation を note に移した（内容B L、チャンク間の方針割れ(2)の統一）。'
