translation:
  ja: ムハンマド・ブン・アリー・ブン・イブラーヒーム・ブン・イスマーイール・ブン・ムハンマド、アッ＝シャムス、アル＝ムナーウィー、のちアル＝カーヒリー、シャーフィイー派。既出のアフマドとイブラーヒームの兄弟で、彼が最年長。アッ＝シュワイヒド（点のある字〔shīn〕にダンマ、末尾は無点の字〔dāl〕、縮小形）として知られる。クルアーンを暗記し、証人たちとともに（公証人として）座り、サイード・アッ＝スアダー（ハーンカー）やサービキーヤ（学院）などいくつかの機関で職禄を得た。老齢に達し、手にしていたものを少しずつ手放すようになったのちに没した。私の思うところでは870年より前である。
  en: Muḥammad b. ʿAlī b. Ibrāhīm b. Ismāʿīl b. Muḥammad al-Shams al-Munāwī, then al-Qāhirī, al-Shāfiʿī, brother of Aḥmad and Ibrāhīm, both mentioned above, and the eldest of them; known as al-Shuwayhid (with ḍamma on the dotted shīn and an undotted dāl at the end, a diminutive). He memorized the Qurʾān, sat with the notaries, and held stipendiary posts in some institutions such as Saʿīd al-Suʿadāʾ and al-Sābiqiyya. He died after growing old and gradually relinquishing what he held, before 870, as I suppose.
