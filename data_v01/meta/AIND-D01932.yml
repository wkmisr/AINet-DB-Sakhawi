translation:
  ja: 904 イスマーイール・ブン・アル＝アミーン・アフマド・ブン・イスマーイール・ブン・イブラーヒーム・ブン・アジバル、シャラフ・アッ＝ディーン。イエメンの著名な家系の出身で、訪問客を厚遇することで知られていた。しかし、彼の存命は長くなかった。というのも、彼の父は先に述べた通り840年に亡くなっており、彼自身も857年ラビーウ・ル＝アウワル月末に亡くなった。
  en: 904 Ismāʿīl b. al-Amīn Aḥmad b. Ismāʿīl b. Ibrāhīm b. ʿAjbal, Sharaf al-Dīn. From a renowned Yemeni family, he was known for his hospitality towards visitors. However, his life was not long, as his father, as previously mentioned, died in the year 840 H, and he himself died on the last day of Rabīʿ al-Awwal in the year 857 H.
