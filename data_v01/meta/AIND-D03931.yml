translation:
  ja: アブド・アッ＝サラーム第二（アッ＝サーニー）、前項の者（アブド・アッ＝サラーム第一）の弟。ヒジュラ暦862年ムハッラム月10日にマディーナで生まれ、同地で育ち、父、アブー・アル＝ファラジュ・アル＝マラーギー、アブー・アル＝ファトフ・イブン・タキーらから聴聞した。私（サハーウィー）が選ばれし御方（預言者）の御許に滞在（ムジャーワラ）していた間、彼は私に大いに常侍し、私は彼が私から聴聞したものとイジャーザについて書き付けてやり、その一部を『マディーナの人々の歴史（ターリーフ・アル＝マダニーイーン）』に収めた。ついで894年にマッカに来て、私の著作のいくつかを聴聞した。彼はもの静かで理解力があり、善良と敬虔で知られている。
  en: Abd al-Salam II, the brother of the one mentioned before him. He was born on the 10th of Muharram in the year 862 AH in Medina and grew up there. He heard hadith from his father, Abu al-Faraj al-Maraghi, Abu al-Fatah b. Taqi, and others. He associated with me closely during my stay (mujawara) near the Chosen One [i.e., Medina/the Prophet's Mosque], and I wrote down for him what he heard from me, and granted him an ijaza, some of which I included in 'Tarikh al-Madaniyyin' (History of the Medinese). Later, he arrived in Mecca in the year 894 AH and heard some of my works from me. He is quiet and discerning, spoken of for goodness and piety.
