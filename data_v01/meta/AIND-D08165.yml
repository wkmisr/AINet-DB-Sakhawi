translation:
  ja: ムハンマド・アッ＝タキー・ブン・ズハイラ、直前の人物の同父同母の弟。827年の末にマッカで生まれ、829年に兄弟たちとともに、またそこ（前項）で先に挙げたアティーヤの子孫たちとともにイジャーザを授けられた。830年に幼くしてマッカで没した。
  en: Muḥammad al-Taqī b. Ẓahīra, full brother of the preceding one. He was born at the end of the year 827 in Mecca; in the year 829 he was granted an ijāza together with his brothers and among the descendants of ʿAṭiyya by those mentioned there shortly before. He died as a small child in the year 830 in Mecca.
