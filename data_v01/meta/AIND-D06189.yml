notes:
- text: '転送見出し（原文末尾「هو محمد يأتي」による）。転送先は #AIND-D07969「محمد أبو سعد أخوه ويلقب فهدا أيضا مات قبل السنة أيضا في رجب سنة ست وثلاثين」（直前項 #AIND-D07968「محمد بن عطية بن محمد بن أبي الخير محمد بن محمد بن عبد الله بن محمد بن فهد أبو الخير الهاشمي المكي . مات بها قبل استكماله سنة في المحرم سنة اثنتين وأربعين」の兄弟。いずれも未収録）。クンヤ أبو سعد と「يلقب فهدا」が本項見出しと一致。D07968（أبو الخير、842没の夭折児）は別人。父 عطية بن محمد بن أبي الخير بن فهد ＝ #AIND-D04909（ولي الدين أبو الفتح、804年生）。'
