translation:
  ja: ムハンマド・ブン・ウスマーン・ブン・アル＝マリク・アル＝アフダル・アッバース・ブン・アリー・ブン・ダーウード、アサド・アッ＝ディーン、アル＝アイユービー。ザビードのマムルークたちがアル＝ムザッファルに叛いたとき、彼はザビードに（支配者として）据わり、彼らは彼を擁立して「アル＝ムファッダル・アサド・アッ＝ディーン」と称した。しかし長くは続かず、アル＝ムザッファルが彼を捕らえる者を差し向け、彼はいずこかの城塞に入れられ、それが彼の消息の最後となった。これらはすべて（8）46年のことである。
  en: Muḥammad b. ʿUthmān b. al-Malik al-Afḍal ʿAbbās b. ʿAlī b. Dāwūd, Asad al-Dīn, al-Ayyūbī. He was installed in Zabīd when the mamlūks there rose against al-Muẕaffar; they set him up and titled him al-Mufaḍḍal Asad al-Dīn. But he did not last long before al-Muẕaffar sent someone who seized him, and he was put into one of the fortresses, which was the last that was heard of him. All of this was in the year [8]46.
