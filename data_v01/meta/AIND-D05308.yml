translation:
  ja: アリー・ブン・ウマル・ブン・アリー・ブン・ウマル・ブン・アリー・ブン・アフマド、アブー・アル＝ハサン・ブン・アッ＝スィラージュ・アビー・ハフス・ブン・アン＝ヌール・ブン・アラブ。彼はクンヤ（アブー・アル＝ハサン）でより知られる。828年に生まれ、アル＝アラム・アル＝ブルキーニーとその後継者たちの代理（裁判官）を務めた。
  en: ʿAlī b. ʿUmar b. ʿAlī b. ʿUmar b. ʿAlī b. Aḥmad, Abū al-Ḥasan b. al-Sirāj Abī Ḥafṣ b. al-Nūr b. ʿArab; he is better known by his kunya. He was born in 828 and served as deputy (judge) under al-ʿAlam al-Bulqīnī and those after him.
