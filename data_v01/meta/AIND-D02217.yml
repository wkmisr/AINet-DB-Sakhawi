translation:
  ja: ムスニド（大伝承者）アブドゥッラフマーン・ブン・ウマル・アル＝カッバービー・アル＝クドスィーの奴隷（フィター）ビラール。主人から聴聞した。867年ジュマーダー・アル＝アーヒラ月9日月曜日に死去し、主人のそば、バーブ・アッ＝ラフマ（墓地）に埋葬された。神が彼を憐れみますように。
  en: Bilāl, the slave (fatā) of the musnid ʿAbd al-Raḥmān b. ʿUmar al-Qabbābī al-Qudsī. He heard from his master and died on Monday, the 9th of Jumādā al-Ākhira in 867 H. He was buried near his master at Bāb al-Raḥma. May God have mercy on him.
