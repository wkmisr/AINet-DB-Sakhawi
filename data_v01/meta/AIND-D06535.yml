notes:
- text: '「البطيني」は子の項 D00236 によれば本項主のラカブ（「بالضم لقب لأبيه」）で、ニスバ索引 #AIND-D11500 にも「البطيني بضم مصغر」として立つ＝初版どおり nisbah（TMP-N-01280）と shuhrah の両方に保持。孫 #AIND-D00448「أحمد بن إبراهيم بن محمد بن إبراهيم البسطيني الماضي أبوه والآتي جده」（収録済み、本項主への grandfather relation あり。刊本の「البسطيني」は البطيني の異綴）は本項に名指しなし＝relation は相手側の1本で足りる。本項主を指す転送見出し #AIND-D06583「محمد بن إبراهيم البطيني . مضى فيمن جده علي」（本バッチ B171）。persName full に限定語「الأصل」を復元（規則66 (e)）。'
