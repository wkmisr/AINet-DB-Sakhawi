translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アリー・アル＝ヤーフィイー、イエメン出身の家系でマッカの人。前述のイブラーヒームの父で、アル＝ブタイニーとして知られる。商いを営みマッカに住んだ者の一人で、マッカとミナーに家を持っていた。（8）71年にマッカで没した。
  en: Muḥammad b. Ibrāhīm b. ʿAlī al-Yāfiʿī, of Yemeni origin, the Meccan, father of the aforementioned Ibrāhīm, known as al-Buṭaynī. He was among those who engaged in trade and lived in Mecca; he had a house there and one in Minā. He died in Mecca in the year [8]71.
