translation:
  ja: バトハース・アル＝ウスマーニー・アッ＝ザーヒリー〔・バルクーク〕。彼は約50年間、一兵卒（ジュンディー）のままであったが、やがてアッ＝ザーヒル・ジャクマクによって十人長アミール（アミール・アシャラ）に任じられ、次いで第二ハージブ（ハージブ・サーニー）となった。ついにアッ＝ザーヒル・フシュカダムが彼のイクター（封土）と官職を取り上げたが、生計を支えるハルカのイクターを恩給として与えた。以後は無官（バッタール）のまま過ごし、874年ラビーウ・アル＝アウワル月に没した。100歳に近づいていた。
  en: Batkhāṣ al-ʿUthmānī al-Ẓāhirī [the Mamluk of al-Ẓāhir Barqūq]. He served as a regular soldier (jundī) for about fifty years. Then, al-Ẓāhir Jaqmaq promoted him to an amir of ten, and he subsequently became the second chamberlain (ḥājib thānī). This continued until al-Ẓāhir Khushqadam stripped him of his iqṭāʿ and his office, granting him instead a pension iqṭāʿ from the halqa to sustain him. He remained out of office (baṭṭāl) until he died in Rabi' al-Awwal in the year 874 AH, having nearly reached the age of one hundred.
