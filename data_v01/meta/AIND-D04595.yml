translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・カワーム・アッ＝ディーン・アブドゥッラー、アッ＝ルクン・アル＝フンジー。叔父のアッ＝ザイン・アリーから伝承した。この叔父はハワージャ・シャイフとして知られるイマーム・アッ＝ディーン・アリーから伝承し、そのイマーム・アッ＝ディーンはアラー・アッ＝ダウラ・アッ＝スィムナーニーから伝承した。アッ＝ターウースィーが彼から伝承し、彼はアッ＝ターウースィーにイジャーザを与えた。それは（8）19年シャアバーン月のことである。アッ＝ターウースィーは彼を「学識あり、徳高く、卓越し、禁欲的で、精妙な構成と驚くべき技巧の持ち主」と評した。
  en: ʿAbd Allāh b. Muḥammad b. Qawām al-Dīn ʿAbd Allāh, al-Rukn al-Khunjī. He transmitted from his paternal uncle al-Zayn ʿAlī, who transmitted from Imām al-Dīn ʿAlī, known as Khwāja Shaykh, from ʿAlāʾ al-Dawla al-Simnānī. Al-Ṭāwūsī transmitted from him, and he granted him an ijāza, in Shaʿbān (8)19; al-Ṭāwūsī described him as a learned, virtuous, brilliant and ascetic scholar, possessed of marvellous compositions and wondrous crafts.
