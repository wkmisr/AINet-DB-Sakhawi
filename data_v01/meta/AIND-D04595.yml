  note:
    ja: 「روى عن عمه الزين علي الراوي عن إمام الدين علي المعروف بخواجة شيخ عن علاء الدولة السمناني」。叔父 الزين علي الخنجي は corpus に本伝なし・ID-Master 未登録 → 新規 TMP-P-001232。候補は corpus D00294「زين الشريعة علي بن محمد بن علي بن كلاه الخنجي」・27414 行「الزين علي بن كلاه الخنجي」（同時代のフンジ出身の伝承者、الطاووسي の師の列挙に並ぶ）だが、そのナサブ（父 محمد بن علي بن كلاه）は本項主の祖父名 قوام الدين عبد الله と合わないため同定は note に留める（ISSUES §D90-3）。以下の伝承系統（إمام الدين علي ＝ خواجة شيخ ← علاء الدولة السمناني）は叔父の師であり本項主の直接の師ではないため relation を立てない。
