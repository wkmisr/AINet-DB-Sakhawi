translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・アリー・ブン・ユースフ・ブン・マンスール、アッ＝シャムス・アル＝カーヒリー。後述のアル＝カーミリーヤのイマーム、アル＝カマール・ムハンマドの父。クルアーンを読誦し、わずかに学問に従事し、アッ＝シャラフ・イブン・アル＝クワイクから『アッ＝シファー』などを聴聞した。いくつかの職（ジハート）に任ぜられ、我らがシャイフ（イブン・ハジャル）らのもとに出席し、アル＝カーミリーヤでイマームを務めた。善良な人物で、アル＝ビルマーウィーは彼の息子へのイジャーザの中で彼を学識と徳をもって評した。
  en: Muḥammad b. ʿAbd al-Raḥmān b. ʿAlī b. Yūsuf b. Manṣūr, al-Shams al-Qāhirī, the father of al-Kamāl Muḥammad, the imam of al-Kāmiliyya, who is mentioned below. He recited the Qurʾān, studied a little, and heard al-Shifāʾ and other works from al-Sharaf Ibn al-Kuwayk. He was appointed to some posts (jihāt), attended the sessions of our shaykh (Ibn Ḥajar) and others, and served as imam at al-Kāmiliyya. He was a good man; al-Birmāwī described him, in the ijāza he wrote for his son, as possessing learning and virtue.
