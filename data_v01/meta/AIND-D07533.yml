translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・アフマド・ブン・フサイン・ブン・ダーウード・ブン・サーリム・ブン・マアーリー、ムヒー・アッ＝ディーン・アブー・アル＝ファドル・イブン・アル＝ムワッファク・アビー・ザッル、アル＝アッバースィー・アル＝ハマウィー・アル＝ハンバリー。その父と祖父は前述。父がダマスカスの軍務監督（ナザル・アル＝ジャイシュ）に就くためダマスカスへ移った（八百）七十八年に、ハマーのカーディー職に就いた。カイロから故郷へ帰る途中、（八百）八十二年の疫病の際にダマスカスで没した。神が彼を憐れみたまわんことを。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Aḥmad b. Ḥusayn b. Dāwūd b. Sālim b. Maʿālī, Muḥyī al-Dīn Abū al-Faḍl b. al-Muwaffaq Abī Dharr, al-ʿAbbāsī al-Ḥamawī al-Ḥanbalī. His father and grandfather have been mentioned above. He was appointed to the judgeship of Ḥamā when his father moved to Damascus to take up the supervision of its army (naẓar al-jaysh) in the year (8)78. He died in Damascus, on his way back from Cairo to his hometown, in the plague of the year (8)82. May God have mercy on him.
