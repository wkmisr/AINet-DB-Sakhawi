translation:
  ja: アフマド・ブン・ムハンマド・ブン・ムイーヌッディーン、クンヤはアブー・アル＝アッバース、カイロの人、書籍商（クトゥビー）、物語作家（カサスィー）。ある人々が、子どもたちに関わる請願書（イスティドアーゥ）の作成を彼に依頼した。彼の詩は「悪くない」と評された。彼はラムラで物語（キサス）を書き、（カイロの）アッ＝サルギトミシーヤの下で書物を売っていた。彼の詩のいくつかが伝わっているが、その没年は不明である。
  en: Aḥmad b. Muḥammad b. Muʿīn al-Dīn, Abū al-ʿAbbās, al-Qāhirī, the bookseller (al-kutubī), the storyteller (al-qaṣaṣī). Some people commissioned him to write a petition (istidʿāʾ) concerning certain children, and his poetry was said to be not bad. He used to write stories in al-Ramla and sell books under al-Ṣarghitmishiyya. Some of his poetry is extant, but the date of his death is unknown.
