translation:
  ja: アブドゥル・ラフマーン・ブン・ウスマーン・ブン・アッ＝ラディー・アブドゥル・ラフマーン・ブン・ウスマーン・ブン・アッ＝ラディー・アブドゥル・ラフマーン・ブン・アリー・アッ＝サフトラシーディー、のちにアル＝カーヒリー、アッ＝シャーフィイー、アル＝ハリーファティー。小カラーファ墓地内のクースーン・ハーンカーに所属するスーフィー。ハジュリ暦841年の末にサフト・ラシードで生まれた。
  en: ʿAbd al-Raḥmān ibn ʿUthmān ibn al-Raḍī ʿAbd al-Raḥmān ibn ʿUthmān ibn al-Raḍī ʿAbd al-Raḥmān ibn ʿAlī al-Safṭrashīdī, later al-Qāhirī, al-Shāfiʿī, al-Khalīfatī, the Sufi of the Khanqah of Qusun in the Lesser Qarafa. He was born at the end of the year 841 AH in Safat Rashid.
