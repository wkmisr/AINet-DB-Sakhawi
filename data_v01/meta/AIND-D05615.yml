translation:
  ja: アリー・ブン・ムハンマド、ヌール・アッ＝ディーン・アル＝マンジリー、シャーフィイー派、イブン・シラージュとして知られる。アル＝マンジラでその敬虔さをもって指折りの人物で、常にクルアーン朗誦と礼拝に励み、その費用を彼が賄う従者たちを抱え、学識にもある程度通じていた。880年より後に没した。
  en: ʿAlī b. Muḥammad Nūr al-Dīn al-Manzilī al-Shāfiʿī, known as Ibn Sirāj. He was highly regarded in al-Manzilah for his piety, being one who constantly recited the Quran and engaged in worship. He had followers whose expenses he covered, while also possessing some learning. He died after the year 880 AH.
