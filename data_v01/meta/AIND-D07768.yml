translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ハサン・ブン・アル＝マウワーズ。（8）32年ラビーウ・アル＝アウワル月に60歳前後で急死した。アル＝マクリーズィーが『ウクード』で彼に言及し、こう述べている。「篤信で、修行と俗世からの離脱、現世に対する寡欲の人であり、それに加えて気骨と男気、ハディースとその徒への愛、スンナへの追従を備えていた」。また、彼の死後に彼について夢を見た者があり、その中で彼が墓の懲罰を免れたことが示された、とも述べている。
  en: 'Muḥammad b. ʿAbd Allāh b. Ḥasan b. al-Mawwāz. He died suddenly in Rabīʿ I (8)32, aged about sixty. Al-Maqrīzī mentioned him in his ʿUqūd and said: he was pious, a man of devotion, detachment and frugality towards this world, together with zeal, manliness, love of ḥadīth and its people, and adherence to the Sunna; and that someone saw a dream about him after his death in which he was shown to have been spared the torment of the grave.'
