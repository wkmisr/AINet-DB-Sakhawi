translation:
  ja: ビーグート・カラー・ミン・キブジャク・アッ＝シラフダール。彼は、ヒジュラ暦893年ラマダーン月の会戦（アル＝イルティカー）の際、アミール・シラーフ（兵器長官）を殺害しようと槍で突いて落馬させ、死に至らしめた人物である。この一戦は彼の卓越した武芸（ファルーシーヤ）の極みとみなされた。
  en: Bīghūt Qarā min Qibjaq al-Siliḥdār. He is the one who struck the Amīr Silāḥ with his spear, intending to kill him, at the encounter in Ramaḍān of the year 893 AH. He knocked him down dead, and this deed was counted among his great feats of horsemanship (farūsiyya).
