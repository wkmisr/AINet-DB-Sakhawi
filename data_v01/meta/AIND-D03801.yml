translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・ムハンマド・ブン・ヤフヤー、アッ＝シャラフ・アル＝ワースィトィー、のちにアッ＝サカンダリー、のちにアル＝アダニー。我らがシャイフ（イブン・ハジャル）はその『ムアジャム』で彼について言及し、次のように述べている。「彼の父親はハディース学者の一人であり、彼自身は商人として育った。イエメンに入ってそこに定住し、私は現地で彼と何度も会った。彼は機知に富んだ対話や逸話に長けており、他人の詩を我々に多く詠んで聞かせてくれた。」彼が（ヒジュラ暦）807年に亡くなったという知らせが私に届いている。
  en: 'Abd al-Rahman b. Muhammad b. Muhammad b. Yahya al-Sharaf al-Wasiti, later al-Sakandari, later al-Adani. Our shaykh (Ibn Hajar) mentioned him in his Mu''jam, saying: ''His father was one of the scholars of Hadith, and he grew up as a merchant. He entered Yemen and settled there. I met him there several times; he was of good humor and witty anecdotes, and recited to us much poetry of others.'' It reached me that he died in the year 807 AH.'
