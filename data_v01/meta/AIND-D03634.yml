translation:
  ja: アブド・アッ＝ラフマーン・ブン・アビー・アッ＝サアーダート・ブン・マフムード・ブン・アーディル、アッ＝ザイン・アル＝フサイニー・アル＝マダニー・アル＝ハナフィー。既出のアフマド、後出のアブドゥッラーとアブド・アル＝カビールの兄弟。ヒジュラ暦856年頃に生まれ、成長してクルアーンと『ムフタール』を暗記し、文法学・形態論を学び、読誦を多くし、ウマル・アン＝ナッジャール・アル＝ハマウィーのもとで美誦を修めた。アブー・アル＝ファラジュ・アル＝マラーギーとその息子から聴聞し、マディーナで私（サハーウィー）からも聴聞した。
  en: ʿAbd al-Raḥmān b. Abī al-Saʿādāt b. Maḥmūd b. ʿĀdil, Zayn al-Dīn, al-Ḥusaynī, al-Madanī, al-Ḥanafī. He is the brother of the aforementioned Aḥmad, and of ʿAbd Allāh and ʿAbd al-Kabīr who are mentioned below. He was born around 856 AH and grew up to memorize the Qurʾān and al-Mukhtār. He engaged in the study of grammar and morphology, recited frequently, and perfected his recitation under ʿUmar al-Najjār al-Ḥamawī. He heard from Abū al-Faraj al-Marāghī and his son, and also heard from me (al-Sakhāwī) in Medina.
