translation:
  ja: バラート。高官の一人。彼は宗教的知識に疎く、放蕩で堕落した人物であった。そのためスルタンは彼に激怒し、アレクサンドリアに投獄した。その後、彼はそこからダミエッタへ移送され、道中で812年に殺害された。アル＝アイニーも彼のことに言及している。
  en: Balāṭ. One of the muqaddams. He was among the wicked, corrupt, and ignorant in religious matters. The Sultan therefore became angry with him and imprisoned him in Alexandria. He was then removed from there to Damietta and killed on the road in the year 812 H. Al-ʿAynī also mentioned him.
