translation:
  ja: ウマル・ブン・アブド・アル＝アズィーズ・ブン・アリー・ブン・アフマド・ブン・アブド・アル＝アズィーズ、アッ＝シラージュ・ブン・アル＝カーディー・アル＝イッズ・ブン・アル＝カーディー・アン＝ヌール、アル＝ハーシミー・アン＝ヌワイリー・アル＝マッキー。前述のアブドゥッラーの父。母はムハンマド・ブン・ウマル・アッ＝タアカリーの娘ウンム・クルスーム。796年にマッカで生まれ、アッ＝ザイン・アル＝マラーギーとイブン・アル＝ジャザリーから聴聞し、アブー・フライラ・ブン・アッ＝ザハビー、イブン・アル＝アラーイー、アッ＝タヌーヒーらがイジャーザを与えた。マーリキー派のマカームのイマーム職の半分に就いた。832年の初めにマッカからカイロへ旅し、次いでマグリブへ、次いでタクルールへ向かい、その翌年かその翌々年に同地で没した。息子の項に彼への言及がある。
  en: ʿUmar b. ʿAbd al-ʿAzīz b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz, al-Sirāj b. al-Qāḍī al-ʿIzz b. al-Qāḍī al-Nūr, al-Hāshimī al-Nuwayrī al-Makkī, the father of ʿAbd Allāh, mentioned previously; his mother was Umm Kulthūm, daughter of Muḥammad b. ʿUmar al-Taʿkarī. He was born in the year 796 in Mecca, heard from al-Zayn al-Marāghī and Ibn al-Jazarī, and was granted ijāza by Abū Hurayra b. al-Dhahabī, Ibn al-ʿAlāʾī, al-Tanūkhī and others. He held half of the imamate at the Mālikī maqām. At the beginning of the year 832 he travelled from Mecca to Cairo, then to the Maghrib, then to Takrūr, and he died there in the following year or the one after. He is mentioned in his son's entry.
