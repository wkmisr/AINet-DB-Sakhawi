translation:
  ja: ハサン・アッ＝ディムヤーティー。アル＝フサイニーヤの居住者。882年ズー・アル＝ヒッジャ（第12月）にデイラム監獄（ハブス・アッ＝デイラム）にて没した。彼は訴訟を起こすことが非常に多く、ハーン・アッ＝サビールの件でアッ＝シャーフィイーを相手取り訴えるほどであった。その後、彼の状況が乱れていることからスルタンが彼に怒りを覚え、没するまで投獄した。
  en: Ḥasan al-Dimyāṭī, a resident of al-Ḥusayniyya. He died in Dhū al-Ḥijja in the year 882 AH in the prison of al-Daylam (Ḥabs al-Daylam). He was someone who frequently engaged in litigation, to the extent that he brought a complaint against al-Shāfiʿī over Khān al-Sabīl. Later, the Sultan became displeased with him due to the disorganization of his affairs and imprisoned him until he died.
