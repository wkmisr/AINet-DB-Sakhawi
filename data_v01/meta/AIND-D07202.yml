translation:
  ja: ムハンマド・アル＝バドル・アブー・アル＝バラカート・ブン・ザヒーラ、前の項の人物の兄弟。母はハッサーン・ビント・ラージフ・ブン・ハッサーン・アル＝キナーニー。809年に、イブン・アル＝クワイク、イブン・アブドゥルハーディーの娘、および叔父を含む一団が彼にイジャーザを与えた。幼くして没した。
  en: Muḥammad al-Badr Abū al-Barakāt b. Ẓahīra, brother of the preceding. His mother was Ḥassān bt. Rājiḥ b. Ḥassān al-Kinānī. In the year 809 he was granted ijāza by Ibn al-Kuwayk, the daughter of Ibn ʿAbd al-Hādī, and a group including his paternal uncle. He died young.
