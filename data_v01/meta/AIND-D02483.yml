translation:
  ja: ハーミド・ブン・アビー・バクル・ブン・アリー・アッ＝ザイン・アル＝ジーラティー・アル＝ハナフィー・アル＝ムクリイ。メッカに住み、（ヒジュラ暦）890年頃に同地で没した。メディナで私（サハーウィー）から聴聞した者の一人である。常に善良で、学問に励み続けた。
  en: Ḥāmid b. Abī Bakr b. ʿAlī al-Zayn al-Jīratī al-Ḥanafī al-Muqriʾ. He resided in Mecca and died there around [the year] 890 H. He was among those who heard from me (al-Sakhāwī) in Medina. He was always virtuous, constantly engaged in study.
