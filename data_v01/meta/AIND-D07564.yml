translation:
  ja: ムハンマド・ジャラールッディーン・アブー・アル＝ハイル。前項の人物の同父母の兄弟で、あちらが年長である。826年ラジャブ月に生まれ、クルアーン、『タンキーフ・アッ＝ルバーブ』、『アッ＝ラフビーヤ』、『アル＝ワラカート』、『アル＝ムルハ』を暗記し、学問に励んだ。ドゥムヤートのアル＝バドリー・モスクで説教（フトバ）を行い、さらに同地の裁判で代理（ナーイブ）を務めた。美しい書を書いた。彼もまた現在存命である。
  en: Muḥammad Jalāl al-Dīn Abū al-Khayr, the full brother of the preceding, who is the elder of the two. He was born in Rajab 826, memorised the Qurʾān, Tanqīḥ al-Lubāb, al-Raḥbiyya, al-Waraqāt and al-Mulḥa, and pursued his studies. He preached at the Jāmiʿ al-Badrī in Damietta and even served as deputy judge there. He wrote a fine hand. He too is still alive at present.
