  note:
    ja: 'Pattern A。この句は本項にはなく、2項後の #AIND-D10121（نانق الأشرفي）の末尾「أرخهم ابن فهد」による。複数形「هم」（3人以上）は、情報源を記さない直前の連続3項＝本項・#AIND-D10120・#AIND-D10121 を指すと読んだ（その前の #AIND-D10118 は「ذكره الفاسي」で区切られる）。3人のうち最も遅い没年は本項の 897（＞885）→ 規則60(a)・43 により العز بن فهد＝#AIND-D03985。ただし本項には没地の記載がなく、本項が「هم」に含まれるかは確実でない（含まれなければ D10120・D10121 は #AIND-D09211 cert low）＝cert medium（event 側、規則43・58）。ISSUES §D164-1。【集約 2026-11-10】範囲を D10119〜D10121 の3項で確定し、cert medium を外した（規則43: 没年＞885→#AIND-D03985 は cert なし。オーケストレーター決定13）。根拠: サハーウィーは2人なら双数「أرخهما」を使う（D06453 の「أرخهم」は「ذكره الفاسي」で区切られた3項）。ابن فهد はマッカ外の死も「أرخهم」で記録する（#AIND-D07606「مات وإبناه في الطاعون بالقاهرة … أرخهم ابن فهد」、#AIND-D07375「مات في اسكندرية … أرخهم ابن فهد」）。直前の #AIND-D10118 は「ذكره الفاسي」で区切られる。'
translation:
