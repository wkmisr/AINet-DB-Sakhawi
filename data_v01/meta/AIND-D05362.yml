translation:
  ja: アリー・ブン・ムハンマド・ブン・イブラーヒーム、アン＝ヌール・アル＝ハリーリー・アル＝ワッラーク・アル＝ムクリー。イブン・アル＝ムアッズィンとして知られる。アル＝アスカラーニーが彼から七読誦法を学んだ。アッ＝ザイン・リドワーンが彼に面会した。それどころかイブン・アサドは、自分が彼から学んだと述べた。
  en: ʿAlī b. Muḥammad b. Ibrāhīm, al-Nūr al-Ḥarīrī al-Warrāq al-Muqrī, known as Ibn al-Muʾadhdhin. Al-ʿAsqalānī took the seven readings from him, and al-Zayn Riḍwān met him; indeed, Ibn Asad said that he had studied under him.
