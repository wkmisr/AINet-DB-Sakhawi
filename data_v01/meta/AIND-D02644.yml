translation:
  ja: ハサン・ブン・ムハンマド・アル＝アイサーウィー。著名な学生（知識の探求者）の一人。イブン・ヒッジーは、彼が同世代の中で最も優れた人物であったと述べている。801年の初頭に、30歳を少し超えたところで亡くなった。我らがシャイフ（イブン・ハジャル）がその歴史書『インバー・アル＝グムル』の中で彼について言及している。
  en: Ḥasan b. Muḥammad al-ʿAythāwī, one of the famous students. Ibn Ḥijjī mentioned that he was the best of his generation. He died at the beginning of the year 801 AH, having just passed thirty years of age. Our shaykh (Ibn Ḥajar) mentioned him in his work Inbāʾ al-Ghumr.
