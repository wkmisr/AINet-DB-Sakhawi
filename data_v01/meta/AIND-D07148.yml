translation:
  ja: ムハンマド・ブン・バフル・アル＝ヤマニー。ジッダからマッカへわずかな品を運んで生計を立てる者の一人。善良さと敬虔さで知られ、子を授かるための祈願を人々から求められ、それは叶えられたという。845年シャウワール月にマッカで没し、ウマル・アル＝アアラービーの墓廟の近くに葬られた。二人に神の慈悲があるように。
  en: Muḥammad b. Baḥr al-Yamanī, one of those who made a small living carrying a little merchandise from Jidda to Mecca. He was famed for goodness and righteousness; people would seek him out for prayers to obtain children, and it would come about. He died in Mecca in Shawwāl 845 and was buried near the turba of ʿUmar al-Aʿrābī; may God have mercy on them both.
