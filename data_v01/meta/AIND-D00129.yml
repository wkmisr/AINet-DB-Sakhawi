translation:
  ja: イブラーヒーム・ブン・スライマーン・ブン・サーリム。渾名（ブルハーン）を持つファザーリー。ナーシリー朝のタムルバーイのウスターダール。871年にラジャビーヤと共にハッジを履行し、その際私（＝サハーウィー）のもとでいくつかの講義を聴講した。穏やかな人物で、アル=アムシャーティーが彼を良い人物だと評しかけたほどだったという。800年頃の少し前か少し後に死去した。
  en: Ibrāhīm b. Sulaymān b. Sālim, al-Burhān al-Fazārī, Ustādār of Tamurbāy al-Nāṣirī. He performed the hajj with al-Rajabiyya in 871 H and attended some of my sessions there. He was a tranquil person, and al-Amshāṭī almost described him as good. He died shortly before or after the 880s AH.
