translation:
  ja: ジャウハル・アル＝アジュラーニー（メッカの支配者アジュラーン・ブン・ルマイサへの帰属名）。善良さと敬虔さを内に備えた人物で、主人（アジュラーン）の二人の息子アリーとハサンの養育係（ムラッビー）であった。809年か810年に没し、アル＝ムアッラー（墓地）に葬られた。アル＝ファースィーがメッカ（誌）において彼に言及している。
  en: Jawhar al-ʿAjlānī — the attribution being to ʿAjlān b. Rumaytha, lord of Mecca. He embodied goodness and piety, and was the tutor (murabbī) of his master's two sons, ʿAlī and Ḥasan. He died in the year (80)9 or (8)10 and was buried at al-Muʿallā. Al-Fāsī mentioned him in [his history of] Mecca.
