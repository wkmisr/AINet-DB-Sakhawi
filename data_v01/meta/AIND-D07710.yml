translation:
  ja: ムハンマド・ブン・アブド・アル＝カーディル・ブン・ムハンマド・ブン・ジブリール、ハイル・アッ＝ディーン、アブー・アル＝ハイル・ブン・アル＝ムヒユウィー、アル＝イッズィー、アッ＝シャーフィイー。父は前述。イブン・ジブリールとして知られる。少し学問に従事し、私（サハーウィー）に作者自身による『アル＝イラーキーのアルフィーヤ注釈』の冒頭の一部を読み、それ以外でも私に師事した。彼は理解力がある。自らの学派から別の学派に転向し、その（学派の）ガザのカーディー職に就いた。
  en: Muḥammad b. ʿAbd al-Qādir b. Muḥammad b. Jibrīl, Khayr al-Dīn, Abū al-Khayr b. al-Muḥyawī, al-ʿIzzī, al-Shāfiʿī; his father has been mentioned above. He is known as Ibn Jibrīl. He engaged a little in study, read to me a portion from the beginning of the commentary on the Alfiyya of al-ʿIrāqī by its author, and attended me closely in other matters. He is intelligent. He changed from his madhhab to another and held the judgeship of Gaza in it.
