translation:
  ja: ムハンマド・ブン・ハサン・ブン・フサイン・ブン・アリー・ブン・アブド・アッダーイム、アル＝ムヒッブ、アル＝バドルの息子、アミユート出身、カイロの人、フサイニーヤ地区に居住。彼の父については前述。ヒジュラ暦835年ズー・アルヒッジャ月13日に生まれ、口述筆記（イムラー）その他において私（サハーウィー）にしばらくの間師事した。公証人（シャーヒド）業で生計を立て、困窮に耐え忍んだ。
  en: Muḥammad b. Ḥasan b. Ḥusayn b. ʿAlī b. ʿAbd al-Dāʾim, al-Muḥibb, son of al-Badr, of Amyūṭ by origin, al-Qāhirī, resident of the Ḥusayniyya quarter. His father was mentioned previously. He was born on 13 Dhū al-Ḥijja 835 AH. He attended my (al-Sakhāwī's) dictation sessions and other classes for a period of time. He earned his living as a notary-witness and endured poverty.
