translation:
  ja: アブドゥルハフィーズ・ブン・ウマル・アッ＝シャリーフ・アル＝ハサニー・アッ＝ザビーディー。シャーフィイー派。私が得た情報によれば、現地の優れた知識人の一人である。897年に、彼自身と息子のムハンマド、および親族一同へのイジャーザ（伝承許可）を求めて私に（手紙を）送ってきたため、私は彼らにイジャーザを与えた。
  en: ʿAbd al-Ḥafīẓ b. ʿUmar al-Sharīf al-Ḥasanī al-Zabīdī, of the Shāfiʿī madhhab, was one of the virtuous scholars there [in Zabīd], as I was informed. In the year 897 AH, he sent a request asking me for an ijāza (scholarly license) for himself, his son Muḥammad, and his relatives, so I granted it to them.
