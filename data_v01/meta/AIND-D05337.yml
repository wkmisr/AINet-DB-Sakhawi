translation:
  ja: アリー・ブン・アビー・アル＝ファラジュ・ムハンマド・ブン・マフムード・ブン・フマイダーン・アル＝マダニー・アル＝ハナフィー。父と同様にイブン・フマイダーンとして知られる。マディーナの聖なるハラムのムアッズィンの一人で、クルアーンを暗記している者の一人。ラビーウ第2月、（空白）年に没した。
  en: ʿAlī b. Abī al-Faraj Muḥammad b. Maḥmūd b. Ḥumaydān al-Madanī al-Ḥanafī, known like his father as Ibn Ḥumaydān. One of the muezzins of the Noble Sanctuary of Medina and one of those who have memorized the Qurʾān. He died in Rabīʿ II of the year (blank).
