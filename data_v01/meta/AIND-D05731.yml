translation:
  ja: アリー・ヌール・アッ＝ディーン・アル＝ハワー、商人。手を尽くして、アル＝ブルハーン・ブン・ウライバの娘と、彼（父）とその2人の息子の意に反して結婚した。彼らの件は、約500ディーナールあるいはそれ以上で彼女を彼から身請けすることに帰着した。彼は預言者の町マディーナへ旅立ち、875年ラジャブ月に同地で、そこで若干の善行を行ったのちに死を迎えた。多くの財を遺した。神が彼と我々を赦したまわんことを。
  en: ʿAlī Nūr al-Dīn al-Hawā, the merchant. He contrived until he married the daughter of al-Burhān b. ʿUlayba, against the will of the latter and of his two sons; the matter ended with her being ransomed from him for about five hundred dinars or more. He travelled to Medina, the Prophet's city, and his death came there in Rajab of the year 875, after he had performed some pious works there. He left a great deal of property. May God forgive him and us.
