notes:
- text: '転送見出し（原文末尾「فيمن جده محمد بن محمود」による）。転送先は #AIND-D08175「محمد بن علي بن محمد بن محمود بن علي بن عبد الله بن منصور الشمس السلمي الدمشقي الحنفي ثم الشافعي ويعرف بابن خطيب زرع … ولد في ذي الحجة سنة أربع وسبعين وسبعمائة … مات في ذي القعدة سنة إحدى عشرة」（名・父名・祖父名 محمود・ニスバ السلمي が一致。未受領）。同じナサブ「محمد بن علي بن محمد بن محمود」の #AIND-D08174（… بن إسمعيل بن المنتخب المحب … الحلبي ثم القاهري ويعرف بالألواحي）は السلمي ではないので別人。'
