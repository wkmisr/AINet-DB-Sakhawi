translation:
  ja: サディーク・ブン・ムハンマド・アル＝ミスリー・アル＝ジャッディー・アル＝マッキー。イブン・クダイフとして知られる。ジッダから帰還した後のヒジュラ暦882年サファル月にマッカでペストにより死去した。ジッダで種子（あるいは亜麻）の商人（バッザール）として活動した、祝福された人物であった。
  en: Ṣiddīq b. Muḥammad al-Miṣrī al-Jaddī al-Makkī, famously known as Ibn Qudayḥ. He died of the plague in Mecca in Safar of the year 882 AH, shortly after his arrival from Jidda. He had worked as a blessed seed merchant in Jidda.
