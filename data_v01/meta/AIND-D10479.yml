translation:
  ja: ユースフ・ブン・アブドゥッラー、アル＝ジャマール・アル＝マールディーニー・アル＝ハナフィー。後出のアブー・バクルの兄弟。カイロに来てアズハル・モスクで人々に説教し、多くの書物を手に入れた。物腰が柔らかく、謙虚で善良であり、タフスィールと訓戒の多くをそらんじていた。（8）19年にペストで没し、50歳を超えていた。かなりの遺産を残し、それを兄弟が相続したが、その兄弟も程なく没した。我らがシャイフ（イブン・ハジャル）も彼に言及している。私の思うところ、彼は前項の人物であり、その没年は「9年」ではなく「19年」が正しい。
  en: Yūsuf b. ʿAbd Allāh, al-Jamāl al-Māridīnī al-Ḥanafī, brother of Abū Bakr who follows. He came to Cairo and preached to the people in the al-Azhar mosque, and he acquired many books; he was gentle, humble and good, and had much of Qurʾān commentary and of homilies at his command. He died of the plague in the year [8]19, having passed fifty, and left a good estate which his brother inherited; the brother died not long after. Our shaykh (Ibn Ḥajar) also mentioned him. It occurs to me that he is the man of the preceding entry, and that the correct year of his death is nineteen, not nine.
