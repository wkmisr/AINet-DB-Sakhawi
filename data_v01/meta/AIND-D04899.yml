translation:
  ja: アラブシャー・ブン・アリー・ブン・ヤフヤー・ブン・イスハーク、ルクン・アッ＝ディーン、アブー・アル＝ファトフ・ブン・アル＝ジャマール・イブン・アル＝アラーウ・イブン・アル＝イッズ・アル＝フサイニー。755年ラビーウ・アル＝アウワル月7日、金曜の夜に生まれ、アル＝マジュド・アル＝フィールーザーバーディー、アッ＝シャラフ・アル＝ジャルヒー、その他同じ世代とそれ以下の人々から聴聞した。アッ＝ターウースィーが彼から学び、彼を称賛した。（8）28年ムハッラム月5日、月曜の朝に没した。
  en: ʿArabshāh b. ʿAlī b. Yaḥyā b. Isḥāq, Rukn al-Dīn Abū al-Fatḥ b. al-Jamāl Ibn al-ʿAlāʾ Ibn al-ʿIzz al-Ḥusaynī. He was born on the night of Friday, 7 Rabīʿ al-Awwal 755, and heard from al-Majd al-Fīrūzābādī, al-Sharaf al-Jarhī and others of that generation and below. Al-Ṭāwūsī studied under him and praised him. He died in the forenoon of Monday, 5 Muḥarram (8)28.
