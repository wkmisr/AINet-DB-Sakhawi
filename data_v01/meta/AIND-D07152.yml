translation:
  ja: ムハンマド・ブン・ブダイド・ブン・シュクル・アル＝ハサニー・アル＝マッキー、隊長（カーイド）。873年ムハッラム月7日木曜日の朝、バトン・マッルのマスジド・アル＝ファトフの近くで殺された。マッカの主アル＝ジャマール・ムハンマド・ブン・バラカートが、本項主の母方の叔父アフマド・ブン・クファイフともども同時に彼を討ったのである。二人はその日のうちにマッカへ運ばれ、金曜日の夜にアル＝マアラーの、彼の祖父シュクルの墓廟に葬られた。人々は彼の死を惜しんだ。
  en: 'Muḥammad b. Budayd b. Shukr al-Ḥasanī al-Makkī, the qāʾid (commander). He was killed on the morning of Thursday 7 Muḥarram 873 near Masjid al-Fatḥ in Baṭn Marr: the lord of Mecca, al-Jamāl Muḥammad b. Barakāt, struck him down together with the subject''s maternal uncle Aḥmad b. Qufayf at one and the same time. The two were carried to Mecca in what remained of their day and buried on the eve of Friday at al-Muʿallā, in the turba of his grandfather Shukr; and people grieved for him.'
