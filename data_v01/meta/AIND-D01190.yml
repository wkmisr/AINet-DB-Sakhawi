translation:
  ja: アフマド・ブン・ムハンマド・ブン・アフマド・ブン・イスマーイール・ブン・ダーウード。ラカブはシハーブ、父はシャムス、祖父はシハーブ。カイロ出身のハナフィー法学派で、アブドゥッラーとその二人の兄弟の兄弟にあたる。先祖代々「イブン・アッ＝ルーミー」として知られる。
  en: Ahmad b. Muḥammad b. Aḥmad b. Ismāʿīl b. Dāwūd, al-Shihāb (laqab), son of al-Shams (father's laqab/name), son of al-Shihāb (grandfather's laqab/name), al-Qāhirī, al-Ḥanafī. He is the brother of ʿAbd Allāh and his two brothers. He is known, like his ancestors, as Ibn al-Rūmī.
