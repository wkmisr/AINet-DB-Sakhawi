  note:
    ja: '「تلميذ الأدمي」。シャーフィイー派の文脈で裸の「الأدمي」は النور علي بن أحمد بن أبي بكر الأدمي ثم المصري الشافعي（#AIND-D04954、813年没。ニスバ索引 #AIND-D11420「الأدمي … علي بن أحمد بن أبي بكر بن أحمد المصري الشافعي وبنوه」が筆頭に挙げる）。息子 الزين عبد الرحمن（#AIND-D03683、866年没）も「الأدمي」と呼ばれ得るため cert medium（要判断 §D101-3）。初版はニスバ番号 TMP-N-00231 を person 位置に流用していた。【集約】規則26（確証なき同定は仮番号）により #AIND-D04954 cert medium → 新規 TMP-P-001368「الأدمي (شيخ نور الدين الطيبي)」に差し替え。候補: 父 #AIND-D04954（813年没）／息子 الزين عبد الرحمن #AIND-D03683（866年没。弟子 D10929 が822年生で世代的にはこちらが合う）。確証を得た時点で統合。'
