  quote: الحجاج السيوطي
  note:
    ja: '「وتخرج به أبو الحجاج السيوطي」。弟子 ＝ #AIND-D10929（أبو الحجاج الأسيوطي هو الجمال يوسف بن فلك الدين محمد بن يوسف السيوطي ثم القاهري الشافعي、822年生。同項に「قطن الأزهر تحت نظر نور الدين الطيبي تلميذ الادمي وأحد فقهاء الأطباق … وأخذ عنه في الفقه وغيره وتدرب به في الصناعة」と相互閉合）。初版は #NEEDID。'
