translation:
  ja: アリー・ヌール・アッ＝ディーン・アッ＝タイイビー、シャーフィイー派、アル＝アダミーの弟子。法学その他で傑出し、（城塞の）兵舎で教授し、公証人を務めた。アブー・アル＝ハッジャージュ・アッ＝スユーティーが彼のもとで修業した。
  en: ʿAlī Nūr al-Dīn al-Ṭaybī, the Shāfiʿī, the pupil of al-Adamī. He distinguished himself in jurisprudence and other fields, taught in the barracks (al-ṭibāq), and served as a notary-witness. Abū al-Ḥajjāj al-Suyūṭī was trained under him.
