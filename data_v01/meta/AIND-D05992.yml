translation:
  ja: ウマル・ブン・ムハンマド・アッ＝シラージュ・アッ＝トゥライニー・アル＝マハッリー・アル＝マーリキー、ムハンマドとアブー・バクルの父で、アッ＝トゥライニーとして知られる。学識と敬虔さで知られ、夢解釈に関する著作がある。優れた禁欲的な法学者で、息子のアブー・バクルが彼から学び、彼から法学を学んだ者にはアル＝ワラウィー・アッ＝スンバーティーがいる。（8）22年ズー・アル＝ヒッジャ月28日月曜日に没した。私はそれを（8）20年とする者を見たが、誤りだと思う。
  en: ʿUmar b. Muḥammad al-Sirāj al-Ṭuraynī al-Maḥallī al-Mālikī, the father of Muḥammad and Abū Bakr, known as al-Ṭuraynī. He was known for learning and righteousness, and has a work on the interpretation of dreams. He was an excellent, ascetic jurist; his son Abū Bakr studied under him, and among those who took fiqh from him was al-Walawī al-Sunbāṭī. He died on Monday, the twenty-eighth of Dhū al-Ḥijja of the year (8)22; I have seen someone who dated it to the year (8)20, but I think that is an error.
