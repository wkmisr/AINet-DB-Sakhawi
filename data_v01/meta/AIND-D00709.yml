translation:
  ja: アフマド・b・ハラフ、シハーブ・アッディーン、アル＝ミスリー、遺産監督官（ناظر المواريث）。その父は、イブン・ファドル・アッラーフのもとで侍従頭（مهتار）を務めていた。802年ジュマーダー・アル＝アーヒラ（後ジュマーダー）に没した。わが師〔イブン・ハジャル〕が『〔インバーゥ・アル＝グムル〕』のなかで言及している。
  en: Aḥmad b. Khalaf, Shihāb al-Dīn al-Miṣrī, the inspector of inheritances (nāẓir al-mawārīth). His father was a chamberlain/steward (mihtār) in the service of Ibn Faḍl Allāh. He died in Jumādā II of the year 802 (AH). Our shaykh (Ibn Ḥajar) mentions him in his Inbāʾ (al-Ghumr).
