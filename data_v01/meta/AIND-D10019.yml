translation:
  ja: マンスール・ブン・ヤシュバク・ミン・マフディー・アッ＝ザーヒリー。大ダワーダール、ヤシュバク・ミン・マフディーの息子で、アル＝ムアイヤド・アフマド・ブン・アル＝アシュラフ・イーナールの娘の子（スィブト）。父の同席のもと、私（サハーウィー）の暗誦から『アル＝ムサルサル』を聴講した者の一人。幼くして、881年ズー・アル＝ヒッジャ月19日、木曜の夜にペストで没した。
  en: Manṣūr b. the Grand Dawādār Yashbak min Mahdī al-Ẓāhirī, daughter's son of al-Muʾayyad Aḥmad b. al-Ashraf Īnāl. One of those who heard al-Musalsal from my memory in the presence of his father. He died while still a child, of the plague, on the night of Thursday, 19 Dhū al-Ḥijja 881.
