translation:
  ja: アースィヤ・ビント・サーリフ・ブン・アビー・ル＝マンスール・アフマド・ブン・アブドゥルカリーム・ブン・アビー・ル＝マアーリー、アッ＝シャイバーニー・アッ＝タバリー。既出の女性の親族。シャムス・ムハンマド・ブン・アブドゥッラー・ブン・アフマド・アル＝イスティジーが彼女を娶り、彼女にファーティマとウンム・ハーニーを産ませた。彼女が本書の収録条件に当たるかどうかは確かめる必要がある。
  en: Āsiya, daughter of Ṣāliḥ b. Abī al-Manṣūr Aḥmad b. ʿAbd al-Karīm b. Abī al-Maʿālī, al-Shaybānī al-Ṭabarī, a kinswoman of the woman mentioned above. Al-Shams Muḥammad b. ʿAbd Allāh b. Aḥmad al-Istijī married her and had by her Fāṭima and Umm Hāniʾ. Whether she falls within the scope of our book is to be verified.
