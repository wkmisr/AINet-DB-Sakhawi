translation:
  ja: タービット・ブン・ムハンマド・ブン・アフマド・ブン・アリー・ブン・ハビーブ・アブー・バクル・ブン・ハビーブ・アル＝アザーズィー・アル＝ジャラーイヒー。彼はそのクンヤ（アブー・バクル）でより知られていた。ヒジュラ暦726年シャアバーン月生まれ。24人のシャイフに『ジュズ・イブン・アラファ』を聴聞し、それを伝承した。我らがシャイフ（イブン・ハジャル）がダマスカスで彼にそれを読んだ。アル＝マクリーズィーは自身の『ウクード』で彼に言及している。
  en: Thābit b. Muḥammad b. Aḥmad b. ʿAlī b. Ḥabīb Abū Bakr b. Ḥabīb al-ʿAzāzī al-Jarāʾiḥī, who was better known by his kunya. He was born in Shaʿbān in the year 726 AH. He heard Juzʾ Ibn ʿArafa from twenty-four shaykhs and transmitted it, which our shaykh (Ibn Ḥajar) read to him in Damascus. al-Maqrīzī mentioned him in his 『ʿUqūd』.
