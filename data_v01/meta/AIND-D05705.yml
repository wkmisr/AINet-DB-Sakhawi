translation:
  ja: アリ・ブン・ユーヌス・ブン・ユースフ・ブン・マスウード・アル＝カルイー・アッ＝ディマシュキー・アッ＝シャーフィイー。ダマスクスのアキーバ・アス＝スグラに居住した。750年より前に生まれ、アブー・アル＝マハースィン・ユースフ・ブン・ムハンマド・アル＝カッバーニーのもとで『サヒーフ・アル＝ブハーリー』を聴聞し、アル＝ヤースフィーとハリール・アル＝クドゥシーのもとで『サヒーフ・ムスリム』の一部を、アル＝ムヒュウィー・アッ＝ラハビーのもとで『アッ＝シファー』を聴聞したと語った。ハディースを伝承し、我々の同僚の一部が彼から学んだ。彼はハンマーム・アル＝カウワースの近くで児童の教育（学塾教師）を行っていた。
  en: ʿAlī b. Yūnus b. Yūsuf b. Masʿūd al-Qalʿī al-Dimashqī al-Shāfiʿī, who resided in al-ʿUqayba al-Ṣughrā in Damascus. He was born before the year 750 AH. He stated that he heard the Ṣaḥīḥ al-Bukhārī from Abū al-Maḥāsin Yūsuf b. Muḥammad al-Qabbānī, some of the Ṣaḥīḥ Muslim from al-Yāswfī and Khalīl al-Qudsī, and al-Shifāʾ from al-Muḥyawī al-Raḥbī. He transmitted Hadith, and some of our companions took knowledge from him. He used to teach children near Hammām al-Qawwās.
