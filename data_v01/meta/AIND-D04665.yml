translation:
  ja: アブドゥッラー、ハージー・バハードゥルとして知られる。アル＝アズバキー・アル＝ジャラーリー。ジャラール・アッ＝ディーン・マスウード・ブン・アスィール・アッ＝ディーン・ジャアファル・アル＝バンジーリーの解放奴隷。アッ＝ターウースィーが818年に彼に会ってイジャーザを求めた。彼はそのとき90歳を超えていると告げ、「私（ターウースィー）の祖父と叔父に常に随従した者であり、二人と共に、二人が聴聞したものの大半を聴聞した」と語った。
  en: ʿAbd Allāh, known as Ḥājjī Bahādur, al-Azbakī al-Jalālī, freedman of Jalāl al-Dīn Masʿūd b. Aṣīl al-Dīn Jaʿfar al-Banjīrī. Al-Ṭāwūsī met him in the year 818 and asked him for an ijāza; he told him that he was then over ninety, and said that he had been one of those who constantly attended "my [al-Ṭāwūsī's] grandfather and my uncle" and had heard with them most of what they heard.
