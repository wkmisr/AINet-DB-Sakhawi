translation:
  ja: ハサン・ブン・アリー・ブン・ハサン、バドル・アッ＝サフティー・アル＝アズハリー・アッ＝シャーフィイー。彼はわずかに（学問に）従事し、ナジュム・ブン・ヒッジーの側近となった。一団の人々から聴聞した。彼は、召喚状（イスティドアーアート）に伝承者たちの署名（ハット）を得るために、後代の伝承者たちについて私（サハーウィー）に相談していたため、彼らについて熟達し、精通するようになった。彼は私から（学問を）学んだ者の一人である。
  en: Ḥasan b. ʿAlī b. Ḥasan al-Badr al-Safaṭī al-Azharī al-Shāfiʿī. He engaged in study for a short while, and was closely associated with al-Najm b. Ḥijjī. He heard from a group of scholars. He used to consult me (al-Sakhāwī) regarding later transmitters in order to obtain their handwritings on summonses (istidʿāʾāt), whereby he gained skill and expertise with them. He is among those who took from me.
