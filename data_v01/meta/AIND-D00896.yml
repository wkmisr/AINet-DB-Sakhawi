translation:
  ja: アフマド・ブン・アブドゥッラー・ブン・ラシード、ラカブはアッ＝シハーブ、ニスバはアッ＝サラムィー、アル＝ヒジャーズィー、ハナフィー派で盲人。894年にアッ＝サルガトマシーヤ学院のイマームであるアル＝マジュドが、彼から『ダーラクトニーの伝承集』と『アル＝ガトリーフの章』を聴聞した。ここに推測で書き記したもので、そうでなければ彼に関する伝記を見つけられなかった。
  en: Aḥmad b. ʿAbd Allāh b. Rashīd, al-Shihāb, al-Sulamī, al-Ḥijāzī, al-Ḥanafī, al-Ḍarīr (the Blind). Al-Majd, the imam of al-Ṣarghatmashiyya, heard from him in the year 894 the complete al-Dāraquṭnī and part of al-Ghaṭrīf. I wrote this here by conjecture, for otherwise, I did not find a biography for him.
