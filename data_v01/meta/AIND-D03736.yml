translation:
  ja: アブドゥルラフマーン・ブン・アル＝ジャマール・ムハンマド・ブン・アフマド・アル＝アジャミー・アル＝キーラーニー・アル＝マッキー・アル＝ハンバリー。マッカにて私（サハーウィー）からハディースを聴聞し、インドへと旅立って望ましくない暮らしぶりで数年を過ごした。彼は（ヒジュラ暦8）97年においても現地（インド）にいた。
  en: Abd al-Rahman ibn al-Jamal Muhammad ibn Ahmad al-Ajamī al-Kilani, of Mecca, of Hanbali school. He heard hadith from me (al-Sakhawi) in Mecca, then traveled to India where he stayed for years in an unsatisfactory manner. He was still there in the year 897 AH.
