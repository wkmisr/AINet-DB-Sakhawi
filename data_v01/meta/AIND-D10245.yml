translation:
  ja: ヤフヤー・ブン・ザカリーヤー・ブン・ムハンマド・ブン・アフマド・ブン・ザカリーヤー、ムフイー・アッ＝ディーン、アブー・アッ＝スウード、アッ＝ザイニーの子、出自はアッ＝スナイキー、アル＝カーヒリー、アッ＝シャーフィイー。彼の兄弟と、二人の父（ザカリーヤー）は既出。父に就いて聴いた者の一人。（8）97年の疫病で、そのラジャブ月に没し、父は彼を失って深く悲しんだ。
  en: Yaḥyā b. Zakariyyā b. Muḥammad b. Aḥmad b. Zakariyyā, Muḥyī al-Dīn, Abū al-Suʿūd, son of al-Zaynī, al-Sunaykī by origin, al-Qāhirī, al-Shāfiʿī. His brother and their father have been mentioned above. He was one of those who heard (ḥadīth) from his father. He died in the plague of the year [8]97, in its Rajab, and his father was grief-stricken at his loss.
