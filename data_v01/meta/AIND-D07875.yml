translation:
  ja: ムハンマド・ブン・アブドゥッラー・アル＝ハサニー・アル＝ハーダウィー・アッ＝サンアーニー、前述のイブラーヒームの父。871年にサヌアーに在住していた同地の碩学・文人の一人。ヌール・アッ＝ディーン・アッ＝サンアーニーが彼の作った詩を私に吟誦した。 ヒポクラテスは毒を盛られて世を去り、プラトンは胸膜炎で死んだ。 アリストテレスは肺病で世を去り、ガレノスは腹を病んで死んだ。 病の薬はただ、無に「あれ」と言えばそれがあるお方のもとにしかない。
  en: 'Muḥammad b. ʿAbd Allāh al-Ḥasanī al-Hādawī al-Ṣanʿānī, father of the aforementioned Ibrāhīm. One of the learned and literary men of Ṣanʿāʾ who were present there in [8]71. Nūr al-Dīn al-Ṣanʿānī recited to me from his verse: Hippocrates went his way poisoned, and Plato died of pleurisy; Aristotle departed consumptive, and Galen died with a diseased belly. There is no remedy for disease except with Him who, if He says to the non-existent "Be", it is.'
