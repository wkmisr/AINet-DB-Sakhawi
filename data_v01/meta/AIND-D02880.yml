translation:
  ja: ハリール・ブン・アフマド・ブン・ハサン、アル＝マタリー、イブン・クバイバ（クッバの縮小形）として知られる。彼は、女性の部で後述するバラカの息子である。801年頃にアル＝マタリーヤで生まれ、そこで育った。アーイシャ・ビント・イブン・アブドゥルハーディー、アッ＝ザイン・アブー・バクル・アル＝マラーギー、アッ＝サラーフ・アル＝アルマウィー、アッ＝シャラフ・ブン・アル＝クワイクら複数の者が彼にイジャーザを与えた。私はアル＝マタリーヤで彼に会い、彼からハディース一つを読んだ。860年以後に没した（およそ）。
  en: Khalīl b. Aḥmad b. Ḥasan al-Maṭarī, known as Ibn Kubayba (diminutive of kubba). He is the son of Baraka, who follows in the section on women. He was born around the year 801 in al-Maṭariyya and grew up there. More than one scholar granted him ijāza, among them ʿĀʾisha bint Ibn ʿAbd al-Hādī, al-Zayn Abū Bakr al-Marāghī, al-Ṣalāḥ al-Urmawī and al-Sharaf b. al-Kuwayk. I met him in al-Maṭariyya and read a single ḥadīth under him. He died after [8]60, approximately.
