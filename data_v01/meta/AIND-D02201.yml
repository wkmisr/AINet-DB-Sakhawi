translation:
  ja: バシール・サアド・アッ＝ディーン・アッ＝タナミー・アッ＝タワーシー（宦官）。834年にカイロへ召喚されたフィールーズ・アッ＝ルクニー（D06199）の後任として、預言者の町マディーナの給仕長職（マシュヤハ・アル＝フッダーム）に就いた。840年末、マッカへ向かう途中で亡くなり、バドルに埋葬された。839年にアル＝ワラウィー・ブン・カーシム（D12616）が後任となっており、死の前に免職されたとみられる。
  en: Bashīr Saʿd al-Dīn al-Tanamī al-Ṭawāshī (a eunuch). He took over the office of head of the servants (mashyakhat al-khuddām) at al-Madīna al-Nabawiyya after Fayrūz al-Ruknī, who had been summoned to Cairo, in 834 H. He died at the end of 840 H while heading to Mecca and was buried at Badr. It appears he was dismissed before his death, as al-Walawī b. Qāsim succeeded him in 839 H.
