translation:
  ja: フサイン・アル＝アクバル・ブン・アティッヤ・ブン・ムハンマド・ブン・ムハンマド・ブン・アビール＝ハイル・ムハンマド・ブン・ファハド・アル＝ハーシミー・アル＝マッキー。ハサンの兄弟。849年ラビーウ・アル＝アーヒルにマッカで没した。1ヶ月に満たなかった。彼の従兄弟がその死を記録した。
  en: Ḥusayn al-Akbar, the son of ʿAṭiyya, the son of Muḥammad, the son of Muḥammad, the son of Abī al-Khayr Muḥammad, the son of Fahd, al-Hāshimī al-Makkī. He was the brother of Ḥasan. He died in Rabīʿ al-Ākhir in the year 849 AH in Mecca, not having completed a month of age. His cousin chronicled his date of death.
