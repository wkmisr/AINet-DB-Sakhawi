translation:
  ja: トゥーフ・アル＝ジャカミー、ジャカム・ミン・アワド（の生前の所有）。主人の後に転々とし、アル＝アシュラフの時代に十人長（アミール・アシャラ）となったが、その後、怒りを買って投獄された。その後、再び十人長に復帰し、アル＝ザーヒルの時代に軍鼓長（タブルハーナー・アミール）に任命された。その後、第二親衛隊長（ラアス・ナウバ・サーニー）となったが、視力が衰えたため免職され、自宅に籠もるようになった。放蕩、傲慢、臆病、吝嗇であったと噂されつつ、868年に死去した。
  en: Tūkh al-Jakamī, [the mamlūk of] Jakam min ʿAwaḍ. He was transferred after his master's death until he was appointed as an Amīr of Ten during the reign of al-Ashraf. Later, the Sultan became angry with him and imprisoned him, but then restored him to the command of ten. He was subsequently promoted to the command of Tablkhānāh by al-Ẓāhir, and then became the Second Chief of Guards (Raʾs Nawba Thānī). He was dismissed when his sight grew weak, after which he remained confined to his house. It is said that he was addicted to pleasures, arrogant, cowardly, and miserly until his death in the year 868.
