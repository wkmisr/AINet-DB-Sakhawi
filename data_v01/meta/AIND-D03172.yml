notes:
- text: '兄弟とみられる #AIND-D03779（عبد الرحمن بن محمد بن علي بن عقبة الوجيه المكي مهندس الحرم、826年没）・#AIND-D10842（أبو بكر بن محمد بن علي بن عقبة、855年没）は本項原文に言及がなく、父が TMP-P で共通なので relation を立てず note（規則23）。D03779 の校閲時に本項主の父を同じ番号で充てること（ISSUES §D156-8）。転送指示はなく「أخو حسين الماضى」は兄弟の参照＝実項（ブリーフどおり）。'
