translation:
  ja: マーミヤ・ミン・ハムザ・アッ＝ザーヒリー。アル＝アシュラフ・カーイトバーイの時代に十人長となった者の一人で、ラクダ厩舎のアミール・アーフール、次いでアミール・ジャムダールに任じられた。前年に巡礼を行った。884年ズー・ル＝カアダ月に、壁から落ちて急死した。アターベク以下（の高官ら）が葬列に加わった。人柄の良さで知られていた。アッラーが彼を赦したまわんことを。
  en: Māmiya min Ḥamza al-Ẓāhirī. One of those who became an amir of ten in the days of al-Ashraf Qāytbāy; he was appointed amīr ākhūr of the camels and then amīr jamdār. He performed the pilgrimage in the preceding year. He died suddenly in Dhū al-Qaʿda of the year 884, having fallen from a wall; the atābak and those below him walked in his funeral. He was remembered for good; may God pardon him.
