translation:
  ja: アル＝ハサン・ブン・アフマド・ブン・ムハンマド・ブン・アブドゥッラー・アッ＝ダワーヒリー、次いでアル＝カーヒリー、シャーフィイー派。ターイバ（マディーナ）の住人。 後述のムハンマドの兄弟であり、ムハンマドの方が年長である。クルアーンを暗記し、学問に励み、両聖都（ハラマイン）に長く滞在し、そこで私（＝サハーウィー）から聴聞した。 ヤフヤー・ブン・ファハドの死後、そのファター（女奴隷）であった女性と結婚し、預言者の町マディーナに定住した。そこでスルターンのマドラサの門番となった。彼は悪くない人物であった。
  en: Al-Ḥasan b. Aḥmad b. Muḥammad b. ʿAbd Allāh al-Dawākhilī, then al-Qāhirī, al-Shāfiʿī, was a resident of Ṭayba (Medina) and the brother of the Muḥammad who is to come, who was older than him. He memorized the Qur'an, engaged in scholarly pursuits, resided in the Ḥaramayn (Mecca and Medina) for a period, and heard from me (al-Sakhāwī) there. After the death of Yaḥyā b. Fahd, he married his fatāh (slave woman) and settled in al-Madīna al-Nabawiyya. He became the gatekeeper of the Sulṭān's madrasa there, and he was a decent person.
