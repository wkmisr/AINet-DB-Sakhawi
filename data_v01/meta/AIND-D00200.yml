translation:
  ja: イブラーヒーム・ブン・アリー・ブン・ヌサイル・ブン・アター・アッラー、ブルハーン・アッディーン。ナムラーウィー家出身、カイロ出身、マーリク法学派。クィルアーン朗誦の合唱団の朗誦者。ファードゥル・アブドゥル・カーディルの父。また「イブン・アル＝ファウワール」として知られた。彼は善良で、朗誦の評判が良く、朗誦と児童教育で生計を立て、ハーンカーに常時出席していた。盲目になった後、死亡した。
  en: Ibrāhīm b. ʿAlī b. Nuṣayr b. ʿAṭāʾ Allāh, Burhān al-Dīn, of Namrāwī origin, from Cairo, a Mālikī jurist and a reciter in the ensemble. Father of al-Fāḍil ʿAbd al-Qādir, and known as Ibn al-Fawwāl. He was a good person, pleasant in his recitation, earning a living by it and by educating children, constantly attending the khānqāh. He died after becoming blind.
