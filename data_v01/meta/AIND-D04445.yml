notes:
- text: '転送見出し（原文の「في ابن محمد بن عبد الرحمن بن محمد」による）。転送先は #AIND-D04579（عبد الله بن أبي السرور محمد بن عبد الرحمن بن أبي الخير محمد بن أبي عبد الله محمد بن محمد بن عبد الرحمن الحسني الفاسي المكي أخو عبد اللطيف المالكي الماضي、ズー・アルカアダ818年マッカ生・ラマダーン840年マッカ没、立項番号195）。閉合根拠: 父が「أبو السرور محمد」、祖父が「عبد الرحمن」、曽祖父が「（أبو الخير）محمد」という指示ナサブと完全一致するのは corpus 中 D04579 のみ。⚠同じ ع 部の直前にある #AIND-D04578（عبد الله بن محمد بن عبد الرحمن بن محمد بن أحمد بن خليف المطري）はクンヤ「أبي السرور」を欠く同名異人で、転送先ではない。'
