translation:
  ja: アーミナ・ビント・アッ＝サドル・アフマド・ブン・アル＝バドル・ムハンマド・ブン・ザイド、バアルベックの人。バアルベックのハンバル派カーディーの母方おば。795年ジュマーダー第2月に、アブー・ル＝ファラジュ・アブドゥッラフマーン・ブン・ムハンマド・ブン・アッ＝ザアブーブから『サヒーフ・ブハーリー』の一部を聴いた。同人は「ハッジャールが我らに伝えた」と述べている。彼女は私たちにイジャーザを与えた。家柄がよく善良な人であった。（8）60年の少し後ごろに没した。神が彼女を憐れみたまえ。
  en: 'Āmina, daughter of al-Ṣadr Aḥmad b. al-Badr Muḥammad b. Zayd, al-Baʿliyya, maternal aunt of the Ḥanbalī qāḍī of Baʿlabakk. In Jumādā II of the year 795 she heard part of the Ṣaḥīḥ of al-Bukhārī from Abū al-Faraj ʿAbd al-Raḥmān b. Muḥammad Ibn al-Zaʿbūb, who said: “al-Ḥajjār informed us.” She granted us an ijāza. She was of good family and virtuous, and died approximately a little after [8]60, may God have mercy on her.'
