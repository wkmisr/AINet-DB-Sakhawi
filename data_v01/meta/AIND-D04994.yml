notes:
- text: '転送見出し（「يأتي فيمن جده محمد بن سالم بن علي」）。転送先は #AIND-D05026（علي بن أحمد بن محمد بن سالم بن علي الموفق الزبيدي المكي الشافعي ابن أخي القاضي سراج الدين عبد اللطيف بن محمد بن سالم ويعرف بابن سالم、847年生）。見出しのナサブ「بن أحمد بن علي بن سالم」は転送先の「بن أحمد بن محمد بن سالم بن علي」と祖父名が食い違う（علي／محمد）が、転送指示が「جده محمد بن سالم بن علي」と明示するため同一の転送先。B99 の REF D04969「علي بن أحمد بن سالم . يأتي فيمن جده محمد بن سالم بن علي」と同じ転送先（二重IDなし）。'
