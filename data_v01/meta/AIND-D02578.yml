translation:
  ja: ハサン・ブン・アリー・ブン・ハラフ・アル＝バドル・アル＝サジーニー・アル＝アズハリー・アル＝シャーフィイー。前述の相続分割学者（ファラディー）シハーブ・アッ＝サジーニーの母方の叔父（ハール）。児童教育（寺子屋教師）を業とし、グループ（合唱団・聖歌隊）の指導的朗誦を務めた。また時に説教を行うこともあった。写本（書写）を数多く手がけ、いくつかのクルアーン（ムスハフ）やラブア（分冊クルアーン）を書写した。そして、自ら書写した『サヒーフ・アル＝ブハーリー』をアブー・アル＝アッバース・アル＝ガムリーのためにワクフ（寄進）とした。ヒジュラ暦880年ズー・アル＝ヒッジャ月（1476年3〜4月）に死去、享年は60歳に近かった。アッラーが彼を憐れまれんことを。
  en: Ḥasan b. ʿAlī b. Khalaf al-Badr al-Sajīnī al-Azharī al-Shāfiʿī. He was the maternal uncle of the aforementioned inheritance scholar al-Shihāb al-Sajīnī. He used to instruct children, led the recitation of choirs (al-ajwāq), and occasionally preached. He was prolific in copying manuscripts, writing several Mushafs (copies of the Quran) and Rab'as (part-sets of the Quran), and he endowed a copy of Ṣaḥīḥ al-Bukhārī that he had transcribed to Abū al-ʿAbbās al-Ghamrī. He died in Dhu al-Hijjah in the year 880 AH, having nearly reached the age of sixty, may Allah have mercy on him.
