translation:
  ja: 961. イズマイル・ブン・ムヒー・アッ＝ディーン・ヤフヤー・ブン・アフマド・ブン・ヤフヤー・アッ＝ラスーリー・アル＝マッキー、イブン・アッ＝ディヤーの孫、ハナフィー派。そして後に記述されるウマルの兄弟。 私（サハーウィー）からマッカで聴聞し、カイロに入った人物である。彼と彼の兄弟はマッカのラスーリー家マドラサを占領し、まるで私有地のように管理することで生計を立てていた。このことから、それらのワクフ（寄進財産）は中断され、アッ＝バグダーディーのワクフと著書に対する侵害も起こった。アッラーの他に力はない。
  en: 961. Ismāʿīl b. Muḥyī al-Dīn Yaḥyā b. Aḥmad b. Yaḥyā al-Rasūlī al-Makkī, grandson of Ibn al-Ḍiyāʾ, al-Ḥanafī, and brother of the aforementioned ʿUmar. He was among those who heard from me (al-Sakhāwī) in Mecca. He later entered Cairo. He and his brother made a living by seizing the Rasūlī schools in Mecca and administering them as if they were private property. This resulted in the cessation of their endowments and an encroachment upon the endowments and books of al-Baghdādī. There is no power save in God.
