translation:
  ja: ウマル・ブン・カースィム・ブン・ジュムア、アミール・ザイン・アッ＝ディーン、アル＝カッサースィー・アル＝ハラビー、アレッポ城塞の代官（ナーイブ）。父は後述。864年シャアバーン月にそこ（アレッポ）で没し、彼の後にはアル＝ビーラの代官イブン・ジュバーラが代官職に就いた。
  en: ʿUmar b. Qāsim b. Jumʿa, the amīr Zayn al-Dīn al-Qassāsī al-Ḥalabī, deputy (nāʾib) of the citadel of Aleppo; his father is mentioned below. He died there in Shaʿbān of the year 864, and after him Ibn Jubāra, the deputy of al-Bīra, was installed in the deputyship.
