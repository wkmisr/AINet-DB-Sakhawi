translation:
  ja: ウマル・ブン・アリー・ブン・ウマル・ブン・ムハンマド・ブン・キナーン、アッ＝ラスアニー・アッ＝ディマシュキー・アル＝マダニー・アッ＝シャーフィイー。812年に父および兄弟とともにアッ＝ザイン・アブー・バクル・アル＝マラーギーから聴聞した。商業に従事し、そのために両聖地（マッカ・マディーナ）やその他の地を往来していたが、845年末か846年初めにインド洋で溺死した。
  en: ʿUmar b. ʿAlī b. ʿUmar b. Muḥammad b. Qinān al-Rasʿanī al-Dimashqī al-Madanī al-Shāfiʿī. He heard, together with his father and his brother, from al-Zayn Abū Bakr al-Marāghī in the year 812. He engaged in trade and for that purpose kept travelling between the Two Sanctuaries (Mecca and Medina) and other places, until he drowned in the Indian Ocean, either at the end of the year 845 or at the beginning of the year 846.
