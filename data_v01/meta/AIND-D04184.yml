translation:
  ja: アブドゥルカーディル・ブン・アッ＝シャムス・ムハンマド・ブン・アル＝ジャマール・アブドゥッラー・ブン・アッ＝シハーブ・アフマド。アル＝フィリヤーン（フィリヤーナ）を家系上のルーツとし、カイロに居住する、シャーフィイー派の学者。イブン・アル＝ハッスの娘方初孫。ザーヒリーヤ・マドラサにおいて『サヒーフ・アル＝ブハーリー』のハディースを聴聞した。私（サハーウィー）のもとにわずかに通い、またビカーイーのもとにも通って、むしろ彼の（著作）の写本を作製した。説教を行い、アル＝マクスのマジュリス・アッ＝ツータにおいて公証人（シャーヒド）として席に着き、またスーフィーに任命された。
  en: ʿAbd al-Qādir b. al-Shams Muḥammad b. al-Jamāl ʿAbd Allāh b. al-Shihāb Aḥmad, of Firyānī origin, residing in Cairo, Shāfiʿī. Maternal grandson of Ibn al-Khaṣṣ. He was among those who heard the Ṣaḥīḥ al-Bukhārī at the al-Ẓāhiriyya Madrasa. He frequented me (al-Sakhāwī) briefly, and likewise al-Biqāʿī, for whom he actually copied manuscripts. He delivered sermons, sat as a witness (shāhid) in the session of al-Tūta in al-Maqs, and was appointed as a Sufi.
