translation:
  ja: ウマル・ブン・ムハンマド・ブン・イブラーヒーム、アッ＝シラージュ、アッ＝シャーミー・アル＝カーヒリー・アル＝クトゥビー（書籍商）、ムハンマドの父で、アッ＝シャーミーとして知られる。747年または748年に生まれた。アル＝アフィーフ・アン＝ナシャーワリーから『両サヒーフ』などを聴聞したと述べた。学生たちは請願書（イスティドアー）の筆記を彼に依頼した。善良な人で、製本の業で生計を立て、その仕事で我らがシャイフに仕えたが、その技に熟達していたわけではなかった。彼には次のことがあった。市場でアリー・ブン・フジュルの諸巻を見て買い、我らがシャイフのもとに持参して「あなたのお父上の著作を見つけたので買いました」と言った。シャイフはそれを受け取り、彼に恥をかかせなかった。この人の父は「フジュル」（ハーにダンマ、ジームにスクーン）であり、我らがシャイフの通称イブン・ハジャルは二つのファトハである。（8）43年または44年にカイロで没した。神よ彼を憐れみたまえ。
  en: 'ʿUmar b. Muḥammad b. Ibrāhīm, al-Sirāj, al-Shāmī al-Qāhirī al-Kutubī (the bookseller), father of Muḥammad, known as al-Shāmī. He was born in the year 747 or 748. He stated that he had heard the two Ṣaḥīḥs and other works from al-ʿAfīf al-Nashāwarī. Students had him write out their petitions (istidʿāʾāt). He was a good man who earned his living by the craft of bookbinding and served our shaykh in that, although he was not skilled in his craft. It happened that he saw some fascicles of ʿAlī b. Ḥujr in the market, bought them and brought them to our shaykh, saying: "I have come across a work by your father, so I bought it." He took it from him and did not embarrass him; for the father of this (ʿAlī) is Ḥujr, with ḍamma on the ḥāʾ and sukūn on the jīm, whereas the well-known name of our shaykh, Ibn Ḥajar, has two fatḥas. He died in Cairo in the year (8)43 or 44; may God have mercy on him.'
