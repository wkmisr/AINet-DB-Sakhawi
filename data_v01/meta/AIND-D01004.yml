translation:
  ja: アフマド・ブン・アリー・ブン・アビー・バクル・ブン・シャッダード、シャハーブッディーン・アル＝ズバイディー、アル＝ムクリー。756年頃に生まれた。父から聴聞し、またハディースを伝承した。学者たちは彼から聴聞し、イブン・ファハドは719年ムハッラム月付のイジャーザ請求書で彼からイジャーザを授与されたと伝えた。
  en: Aḥmad b. ʿAlī b. Abī Bakr b. Shaddād, Shihāb al-Dīn al-Zabīdī al-Muqrī. He was born around the year 756 AH. He heard from his father and transmitted ḥadīth. Scholars heard from him. Ibn Fahd narrated from him, for he (the subject) granted him an ijāza in a request dated Muḥarram 719 AH.
