translation:
  ja: ウマル・ブン・アブドゥッラー・アル＝ミスリー、マッカ寓居者。同地に二十年ほど滞在し、定まった収入もなく、人に乞うこともせず、むしろ沈黙と徹夜と隠遁が多かった。それゆえムハンマド・ブン・アッ＝シャイフ・ウマル・アル＝アラービーがその父の伝記の中で彼に言及し、父から、彼が預言者（彼にアッラーの祝福と平安あれ）をしばしば見るアブダールの一人であると語っていたこと、現世を口にせず、笑わず、脇目もふらず、来世の民以外とは席を共にしなかったことを伝えている。（8）27年に没した。イブン・ファハドがこれを伝えた。
  en: ʿUmar b. ʿAbd Allāh al-Miṣrī, resident of Mecca. He stayed there about twenty years with no fixed stipend, and did not beg; rather he was given to silence, night vigils, and seclusion, so that Muḥammad b. al-Shaykh ʿUmar al-ʿUrābī mentioned him in the biography of his father and related from his father that he used to say that he was one of the abdāl who saw the Prophet (God bless him and grant him peace) often, never speaking of this world, never laughing or looking about, and sitting only with the people of the hereafter. He died in (8)27. Ibn Fahd reported this.
