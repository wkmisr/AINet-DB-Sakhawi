translation:
  ja: ターハー・ブン・ハーリド・ブン・ムーサー・アル＝イトフィーヒー、のちにアル＝カーヒリー、アル＝アズハリー、アル＝シャーフィイー。アブド・アル＝ラティーフの父。アッ＝シャラフィー・イブン・アル＝ジーアーンに師事して密着し、彼に特別に目をかけられて良好かつ堅実にいくつかの職（ジハト）に就いた。彼のシャイフの一人であるアッ＝ザイン・シャアバーン・ブン・ハジャルに、私（サハーウィー）の朗誦によって『アル＝アダブ・アル＝ムフラド』（ブハーリー著）を聴聞した。またハッジ（巡礼）を行った。彼は［…］に没した。
  en: Ṭāhā b. Khālid b. Mūsā al-Iṭfīḥī, later al-Qāhirī al-Azharī al-Shāfiʿī, the father of ʿAbd al-Laṭīf. He was among those who studied under and closely associated with al-Sharafī b. al-Jīʿān, who favored him, and he held several positions in a good and upright manner. Among his teachers, he heard al-Bukhārī's 『al-Adab al-Mufrad』 from al-Zayn Shaʿbān ibn Ḥajar, with my (al-Sakhāwī's) recitation. He also performed the Hajj. He died in...
