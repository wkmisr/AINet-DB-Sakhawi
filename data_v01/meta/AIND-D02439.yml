translation:
  ja: ジュルバーン・アル＝ムアイヤディーは、アル＝ムアイヤドの治世におけるムカッダム（軍事指揮官）の一人であり、アッ＝サーリミー・イブラーヒーム（「スィーディー」と呼ばれた人物）のラアス・ナウバであった。824年にアレクサンドリアの獄中で殺害されて亡くなった。
  en: Julbān al-Muʾayyadī was one of the muqaddams during the Muʾayyadī reign and the raʾs nawba of al-Ṣārimī Ibrāhīm, who was called Sīdī. He died in the prison of Alexandria, having been killed, in the year 824 H.
