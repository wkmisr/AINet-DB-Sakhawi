- text: 彼はその職人仲間から尊敬される、静かで善行の多い人物であった。
  lang: ja
  type: personalia
- text: He was a man of standing among the masters of his craft, much given to quietness and to doing good.
  lang: en
  type: personalia
translation:
  ja: イスマーイール・ブン・アフマド・ブン・アブー・バクル・アル＝マジュド・アル＝カーヒリー・アル＝アフファー。我らがシャイフ（イブン・ハジャル）の娘婿のイブン・ヒドル。彼はその職人仲間から尊敬される、静かで善行の多い人物であった。我らがシャイフの集会に常に参加してハディースの聴聞などを行い、アル＝タンティダーイーなどの講義にも出席したと思われる。787年（ヒジュラ暦）に亡くなった。70歳を超えていたか、それに近い年齢だったと思われる。
  en: Ismāʿīl b. Aḥmad b. Abī Bakr al-Majd al-Qāhirī al-Akhfā, son-in-law of our shaykh Ibn Khiḍr (al-Sakhāwī's shaykh, Ibn Ḥajar al-ʿAsqalānī, is mentioned as the source of this relationship). He was a notable person among his fellow craftsmen, known for his tranquility and goodness. He regularly attended the sessions of our shaykh (Ibn Ḥajar) for samāʿ (listening to Hadith) and other studies. I believe he also attended some lessons of al-Ṭanṭidāʾī and others. He died in the year 878 AH, likely having passed the age of seventy or being close to it.
