    en: The subject was the son-in-law (صهر) of "shaykhunā Ibn Khaḍir". Identified as Ibrāhīm b. Khaḍir, al-Burhān, whose entry D00112 explicitly reads "شيخنا العلامة الفريد برهان الدين أبو اسحاق...بابن خضر". This is an affinal (son-in-law) tie, retained as subtype="other". TMP-P-000082 (al-Burhān b. Khaḍir / Ibn Khaḍir) has been consolidated to AIND-D00112 in the master (confirmed by Waka, 2026-06-19).
