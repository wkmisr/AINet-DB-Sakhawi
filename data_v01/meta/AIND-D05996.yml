translation:
  ja: ウマル・ブン・ムハンマド・アル＝ガムリー、イブン・アル＝マグリビーヤとして知られる。アブー・アブドゥッラー・アル＝マグリビーの弟子（アスハーブ）の一人。（8）56年ラビーウ・アル＝アウワル月に没した。善良な人物で、白髪が輝き、風采がよく、話しぶりがよく、親しみ深く、人々に愛された。巡礼し、80歳近くに達した。神が彼を憐れみたまわんことを。
  en: ʿUmar b. Muḥammad al-Ghamrī, known as Ibn al-Maghribiyya, one of the companions of Abū ʿAbd Allāh al-Maghribī. He died in Rabīʿ al-Awwal of the year (8)56. He was a good man, with radiant grey hair, of fine appearance and good speech, affectionate and beloved by people. He performed the pilgrimage and approached eighty years of age. May God have mercy on him.
