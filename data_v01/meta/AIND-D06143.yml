translation:
  ja: ファーリス。エジプトのムカッダム（軍団長）の一人。ザーヒル・タタルのアミール時代にそのダワーダールであり、タタルが即位すると彼にタブルハーナ（級のアミール職）を与えた。その後アレクサンドリアの総督職（ニヤーバ）に任じられ、ついでそこを離任してムカッダムとなり、826年ムハッラム月初旬に没するまでその地位にあった。善良で謙虚、敬虔な人物であった。アイニーが彼に言及している。
  en: Fāris, one of the muqaddams in Egypt. He was the dawādār of al-Ẓāhir Ṭaṭar during the latter's amirate, and when Ṭaṭar became ruler he granted him a ṭablkhānāh. He was then appointed to the governorship (niyāba) of Alexandria, was afterwards removed from it and became a muqaddam until he died in early Muḥarram 826. He was good, humble and scrupulous. Al-ʿAynī mentioned him.
