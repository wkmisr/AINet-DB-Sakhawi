translation:
  ja: アリー・ブン・アフマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・イーサー・ブン・ムタイル、アル＝ハカミー、アル＝ヤマーニー。兄のアブー・アル＝カースィムほかの兄弟たちより年少で、法学を修めきらなかった者の一人であり、若くして没した。アル＝アフダルがそう述べた。
  en: ʿAlī b. Aḥmad b. Ibrāhīm b. Muḥammad b. ʿĪsā b. Muṭayr al-Ḥakamī al-Yamānī, younger than his brother Abū al-Qāsim and his other brothers; he was among those who did not master jurisprudence, and he died young. So said al-Ahdal.
