translation:
  ja: イスマーイール・ブン・イスハーク・ブン・アフマド・ブン・イスハーク・ブン・イブラーヒーム、サイイド・ワジーフ・アッ＝ディーン、イブン・アル＝イズ・ブン・アン＝ニザーム、フサイニー家、ハサニー家、アフマディー家、シーラーズ出身のシャーフィイー派法学者。アブドゥルジャリールとフサイン（後述）の父で兄弟でもある。多才な学者であり、過去に言及されたサファウィー出身のジャラール・アフマド・ブン・ムハンマド・ブン・イスマーイール・ブン・ハサンが彼から法学を学んだ。ジャラール・アフマドは、彼（イスマーイール）の伝記にとって有益な情報源であり、彼が994年に存命であったと述べている。
  en: Ismāʿīl b. Isḥāq b. Aḥmad b. Isḥāq b. Ibrāhīm, al-Sayyid Wajīh al-Dīn, Ibn al-ʿIzz b. al-Niẓām, al-Ḥusaynī, al-Ḥasanī, al-Aḥmadī, al-Shīrāzī, al-Shāfiʿī, father of ʿAbd al-Jalīl and brother of Ḥusayn (both mentioned later). He was a versatile scholar from whom al-Jalāl Aḥmad b. Muḥammad b. Ismāʿīl b. Ḥasan al-Ṣafawī (mentioned previously), who was beneficial for his biography, acquired jurisprudence. Al-Jalāl Aḥmad stated that Ismāʿīl was alive in 994 H.
