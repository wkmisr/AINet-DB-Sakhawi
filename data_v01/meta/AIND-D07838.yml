translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド、アル＝バドル・ブン・アル＝ウサイヤーティー。正しくはイブン・イブラーヒーム・ブン・アイユーブであり、既に前述した。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad, al-Badr b. al-ʿUṣayyātī. Correctly, [he is] Ibn Ibrāhīm b. Ayyūb, and he has already been mentioned above.
