notes:
- text: '転送見出し（原文「صوابه ابن إبراهيم بن أيوب وقد مضى」による）。転送先は #AIND-D06487「محمد بن إبراهيم بن أيوب البدر الحمصي الشافعي والد محمد الآتي ويعرف بابن العصياتي وسقط من نسبه محمد قبل أيوب」（刊本 869 番、未受領）。同じ人物へ向く転送見出しに #AIND-D09619「محمد البدر بن العصياتي الحمصي . مضى في ابن إبرهيم بن أيوب」がある。ニスバ索引 #AIND-D12546「ابن العصياتي … البدر محمد بن إبرهيم بن محمد بن أيوب وابنه محمد وابنه محمود」。'
