translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・ウースマーン、ワジーフ・アッ＝ディーン。バルバハール（イラクの村）を祖とし、マッカに居住した。代行ウムラ業（アマル・アル＝ウマル）に由来するアル＝ウマリーのニスバを持つ。ハナフィー派。イブン・ウースマーンとして知られる。マッカで私（サハーウィー）から学び、少し学業に携わった。我らの同僚であるナジュム・ブン・ファハドと親交を結び、シリアやエジプトなどを訪れた。シリアでの彼の師の中には、彼が付き従ったハミード・アッ＝ディーンがいる。代行ウムラで生計を立て、ヤルブガーの講義などの給費枠に登録された。ヒジュラ暦882年ラマダーン月にマッカで没した。
  en: Abd al-Rahman b. Muhammad b. Uthman, Wajih al-Din, of Barbahari origin, then of Mecca, known as al-Umari due to his work with the Umrah arrangements, a Hanafi also known as Ibn Uthman. He studied under me (al-Sakhawi) in Mecca, engaged in studies for a short while, and was closely associated with our companion Najm b. Fahd. He traveled to Syria, Egypt, and elsewhere. Among his teachers in Syria was Hamid al-Din, whom he accompanied closely. He made a living through Umrah services and was appointed to a position in the lectures of Yalbugha, among others. He died in Mecca in Ramadan, 882 AH.
