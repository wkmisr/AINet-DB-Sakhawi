translation:
  ja: アフマド・イブン・イブラーヒーム・イブン・アフマド・イブン・ハーシム。ラカブは「アル=シハーブ」、ニスバは「アル=マハッリー、アル=カーヒリー」。750ヒジュラ年以前生まれで、アル=カランシーにサヒーフ・ムスリムの大部分を聴聞した。スライマーン・イブン・サーリム・アル=ガッズィーからイジャーザを得ており、彼からイブン・アル=サラフのハディース学を聴聞したことも言及されている。多くの高名な学者たちから聴聞されたハディースを伝承した。彼はアル=バイバルスィーヤのスーフィーの一人で、ブーラークで証人（シャーヒド）の職で生計を立てていた。我らがシャイフ（イブン・ハジャル）は自身のインバー・アル=グムルで彼について簡潔に言及し、「私の子供たちにイジャーザを与えた」と述べた。825ヒジュラ年初めに80歳を超えて亡くなった。私（サハーウィー）は言う。彼は我らがシャイフ、アル＝ジャラール・アル＝マハッリーの父の父方の叔父であった。彼にはシャムス・アル=ディーン・ムハンマドという息子がおり、そのムハンマドにはアブド・アル=カーディルという息子がいたが、896ヒジュラ年シャアバーン月に亡くなった。
  en: 'Aḥmad b. Ibrāhīm b. Aḥmad b. Hāshim, al-Shihāb al-Maḥallī al-Qāhirī. He was born before 750 H. He heard most of Ṣaḥīḥ Muslim from al-Qalānsī. Sulaymān b. Sālim al-Ghazzī granted him ijāza, and it is also mentioned that he heard from him Ibn al-Ṣalāḥ''s ʿUlūm al-Ḥadīth. He transmitted ḥadīth, and distinguished scholars heard from him. He was one of the Sufis at al-Baybarsiyya and earned his living as a witness (shāhid) in Būlāq. Our shaykh (Ibn Ḥajar al-ʿAsqalānī) mentioned him briefly in his work Inbāʾ al-Ghumr, stating that he granted ijāza to his children. He died at the beginning of 825 H, having passed 80 years of age. I say: he was the paternal uncle of the father of our shaykh al-Jalāl al-Maḥallī. He had a son named Shams al-Dīn Muḥammad, who in turn had a son named ʿAbd al-Qādir, who died in Shaʿbān 896 H.'
