translation:
  ja: カースィム・ブン・ムハンマド・アル＝アシーリー。イブン・アル＝バーバーとも呼ばれる。イブン・アシール家に仕えて育ち、アル＝カーミリーヤに出入りするようになり、諸施設の禄を得た。最初は、本人の主張によれば、ハナフィー派として学問に携わり、イブン・アル＝フマームのもとに出席したが、その後シャーフィイー派に転じた。しかし何事においても成果を上げず、それどころか悪行が多く、一般庶民に近い者であった。
  en: Qāsim b. Muḥammad al-Aṣīlī, also called Ibn al-Bābā. He grew up in the service of the house of Ibn Aṣīl, came to frequent al-Kāmiliyya, and obtained stipends in various institutions. He first studied, as he claimed, as a Ḥanafī, and attended Ibn al-Humām, then as a Shāfiʿī; but he produced nothing, rather he was full of mischief and closer to the common people.
