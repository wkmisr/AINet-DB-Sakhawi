translation:
  ja: アブドゥッラー・ブン・ウマル・ブン・ムハンマド・ブン・ムハンマド・ブン・アビー・アル＝ハイル・ムハンマド・ブン・ファハド、アル＝アフィーフ、アブー・アッ＝シヤーダ。我らの同僚アン＝ナジュム（・ウマル・ブン・ファハド）の息子で、アル＝ハーシミー・アル＝マッキー。アン＝ヌール・ブン・サラーマの娘の子。先人たちと同様にイブン・ファハドとして知られる。ヒジュラ暦840年ラビーウ・アル＝アーヒル月にマッカで生まれ、同年ラジャブ月に同地で没した。
  en: ʿAbd Allāh b. ʿUmar b. Muḥammad b. Muḥammad b. Abī al-Khayr Muḥammad b. Fahd, al-ʿAfīf Abū al-Siyāda, son of our companion al-Najm (ʿUmar b. Fahd), al-Hāshimī al-Makkī, daughter's son of al-Nūr b. Salāma; known, like his forebears, as Ibn Fahd. He was born in Mecca in Rabīʿ al-Ākhir of the year 840 AH and died there in Rajab of that year.
