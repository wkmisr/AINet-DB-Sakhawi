translation:
  ja: ウマル・アッ＝ラジュラージー・アル＝マグリビー・アル＝マーリキー。〔ラジュラージーは〕点のないラー、次いで二つのジームで、極西マグリブのある部族へのニスバである。フェズのアンダルス・モスクのイマーム。法学に通じていたが、何よりも禁欲と敬虔が際立っていた。〔8〕10年に没した。我々のマグリブ出身の仲間の一人が私にこれを伝えてくれた。
  en: ʿUmar al-Rajrājī al-Maghribī al-Mālikī. [Al-Rajrājī is] with an undotted rāʾ followed by two jīms, a nisba to a tribe in the Far Maghrib. He was the imam of the Andalus Mosque (Jāmiʿ al-Andalus) in Fez. Asceticism and scrupulousness predominated in him, together with his advancement in jurisprudence. He died in the year [8]10; one of our Maghribi companions informed me of this.
