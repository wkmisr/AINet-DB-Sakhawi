translation:
  ja: ユースフ・ブン・アフマド、アル＝ジャマール、アル＝マルカーウィー、ダマスクスの優れた学者の一人。教鞭を執り、説教をした。信仰心と善良さを備え、ハンバル派の信条に傾いていた。（80）5年シャウワール月に没した。我らの師（イブン・ハジャル）が『インバー』でそう述べている。
  en: Yūsuf b. Aḥmad, al-Jamāl, al-Malkāwī, one of the accomplished scholars in Damascus. He taught and preached, and he inclined to the creed of the Ḥanbalīs, together with piety and goodness. He died in Shawwāl of the year [80]5. Our shaykh (Ibn Ḥajar) said this in his Inbāʾ.
