translation:
  ja: アミーラーン・シャー・イブン・ティムール・クーリー、後述するハリールの父。 802年、父（前述）がインドからシャーム地方へ来訪した際、父は彼をアゼルバイジャンの統治者に任命し、彼の兄弟〔ママ。実際は彼の息子たち—relation注参照〕アブー・バクルとウマル、そして彼のアミールたちの一団を同行させた。タブリズも彼の支配下にあった。父が亡くなった後、彼は809年に殺害された。
  en: Amīrān Shāh b. Taymūr Kūr, father of the forthcoming Khalīl. In 802, when his father (the aforementioned) arrived from the lands of India to the Syrian regions, his father appointed him to govern Azerbaijan. His two brothers [sic; in fact his sons — see relation note], Abū Bakr and ʿUmar, and a group of his emirs accompanied him. Tabriz was also under his control. He was killed in 809, after the death of his aforementioned father.
