    ja: '原文は「أخويه أبي بكر وعمر」(彼の二人の兄弟)だが、伊藤同定(2026-08-11・確信度ほぼ確実)により実際はミーラーン・シャーの息子 أبو بكر بن ميران شاه(アブー・バクル・ミールザー)と確定→Waka裁定(2026-08-16)でson relationに訂正。サハーウィーは息子ハリール(#AIND-D02888)の伝記(Ibn Taghrībirdī, al-Manhal al-ṣāfī, v, 237-241/al-Maqrīzī, Durar al-ʿuqūd, ii, 66-77=いずれも二人を正しくミーラーン・シャーの息子とする)に依拠したため、「(ハリールの)兄弟」を「(ミーラーン・シャーの)兄弟」と誤記したもの。ティムールの子にأبو بكر・عمرは確認されない(J.E. Woods, The Timurid Dynasty, 1990, esp. 33-35)。詳細: docs/同定シート_伊藤_20260811_反映記録.md。'
