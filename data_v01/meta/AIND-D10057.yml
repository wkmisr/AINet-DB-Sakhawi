translation:
  ja: ムーサー・ブン・アビー・バクル・ブン・アクバル、アッ＝シャラフ・アッ＝シーラーズィー・アル＝マッキー・アッ＝ザムザミー。既述のアブド・アッ＝サラームの父。アル＝ムヒッブ・ブン・ザヒーラは彼を「敬虔なシャイフ」と評した。819年、あるいはその少し前に没した。
  en: Mūsā b. Abī Bakr b. Akbar, al-Sharaf al-Shīrāzī al-Makkī al-Zamzamī, the father of the aforementioned ʿAbd al-Salām. Al-Muḥibb b. Ẕahīra described him as "the righteous shaykh". He died in the year 819 or shortly before it.
