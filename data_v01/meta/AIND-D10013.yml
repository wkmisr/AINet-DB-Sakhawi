translation:
  ja: マンスール・ブン・アリー・アル＝ハラビー・アル＝ジャズィーリー。ある人の筆跡でこのように書かれているのを見た。「アル＝ハラビー」という記述は要確認である。というのも、まもなくマンスール・アル＝ジャズィーリーが出てくるが、彼はマグリブ人だからである。
  en: Manṣūr b. ʿAlī al-Ḥalabī al-Jazīrī. I saw it written thus in the hand of one of them; his being called al-Ḥalabī should be verified, for Manṣūr al-Jazīrī will come shortly, and he is a Maghribī.
