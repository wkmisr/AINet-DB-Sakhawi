translation:
  ja: アリー・ブン・アフマド・ブン・ユースフ、アッ＝サイイド・アル＝アラー・アブー・アル＝ハサン、大学者（アル＝アッラーミー）アッ＝シハービー・アブー・アル＝アッバースの子。アッ＝ルーミー、のちにアル＝マクディスィー、ハナフィー派。私（サハーウィー）から諸々を学び、私が彼にイジャーザ（授権状）を書いた者の一人。
  en: ʿAlī b. Aḥmad b. Yūsuf, al-Sayyid al-ʿAlāʾ Abū al-Ḥasan, son of the most learned (al-ʿAllāmī) al-Shihābī Abū al-ʿAbbās; al-Rūmī, then al-Maqdisī, al-Ḥanafī. He was among those who studied various things under me (al-Sakhāwī), and I wrote an ijāza for him.
