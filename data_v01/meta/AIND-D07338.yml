translation:
  ja: ムハンマド・ブン・ハサン・ブン・アビー・バクル・ブン・ムハンマド、ジャマール・アッ＝ディーン・アル＝アーミリー・アル＝ヤマーニー・アル＝ハラディー・アッ＝シャーフィイー。894年ムハッラム月にマッカで私に会った。当時40歳を少し下回る年齢であった。彼は私のもとで、学徒らしい読み方でナワウィーの『四十ハディース』を朗読し、私の口から『ムサルサル』を聴聞し、私は彼に（イジャーザを）書いた。彼はシャイフ・ヤフヤー・アル＝アーミリーの門下の一人である。
  en: Muḥammad b. Ḥasan b. Abī Bakr b. Muḥammad, Jamāl al-Dīn al-ʿĀmirī al-Yamānī al-Ḥaraḍī al-Shāfiʿī. He met me in Muḥarram 894 in Mecca, when he was a little under forty years of age. He read to me al-Nawawī's Forty Ḥadīths with the reading of a student of learning, heard from my lips the Musalsal, and I wrote (an ijāza) for him. He is one of the circle of Shaykh Yaḥyā al-ʿĀmirī.
