translation:
  ja: アブド・アッラー・ブン・イブラーヒーム・ブン・アル＝ジャラール・アフマド・ブン・ムハンマド・アル＝フジャンディー・アル＝マダニー・アル＝ハナフィー。預言者の町マディーナで生まれ育ち、父のもとで学問に励んで学識を身につけ、父およびマディーナのバースィティーヤのシャイフであるアッ＝サイイド・アリーのもとで書法を極め、それで多くを書写した。カイロに入って滞在し、アレクサンドリアにもしばらく滞在し、同地でペストに罹って没したと推定される。863年のことである。神の慈悲がありますように。
  en: ʿAbd Allāh b. Ibrāhīm b. al-Jalāl Aḥmad b. Muḥammad al-Khujandī al-Madanī al-Ḥanafī. He was born in Medina and grew up there, studied under his father and shared in learning, perfected his handwriting under his father and under al-Sayyid ʿAlī, shaykh of the Bāsiṭiyya of Medina, and copied many things in it. He entered Cairo and stayed there, and in Alexandria for a time; his death there, of the plague, I estimate in the year 863. May God have mercy on him.
