translation:
  ja: ムハンマド・ブン・ザカリヤー・ブン・ムハンマド・ブン・アビー・バクル・ブン・ヤフヤー・ブン・イブラーヒーム・ブン・ヤフヤー・ブン・アブドゥルワーヒド・ブン・ウマル・ブン・ヤフヤー、アブー・アブドゥッラー・ブン・アビー・ヤフヤー、アル＝ヒンターティー・アル＝マスムーディー・アル＝カフスィー・アル＝マリーニー、バラド・アル＝アッターブの領主。アフマド・ブン・ムハンマド・ブン・アビー・ル＝アッバースが没し、その兄弟ザカリヤーが彼に代わって就いたとき、ムハンマドは彼らに対抗した。彼はフェズに滞在しており、その（フェズの）君主アブー・サイード・ウスマーン・ブン・アビー・ル＝アッバース・イブン・アビー・サーリムが彼を援助し、彼はそれを領有した。しかしアブー・ファーリスは彼に対して策を講じ続け、ついに彼の軍勢は離散し、彼を捕らえて殺した。810年ズー・ル＝ヒッジャ月のことである。我らがシャイフ（イブン・ハジャル）が『インバー』で述べている。『ウクード』における彼の伝記は長い。
  en: Muḥammad b. Zakariyyā b. Muḥammad b. Abī Bakr b. Yaḥyā b. Ibrāhīm b. Yaḥyā b. ʿAbd al-Wāḥid b. ʿUmar b. Yaḥyā, Abū ʿAbd Allāh b. Abī Yaḥyā, al-Hintātī al-Maṣmūdī al-Qafṣī al-Marīnī, lord of Balad al-ʿAttāb. When Aḥmad b. Muḥammad b. Abī al-ʿAbbās died and his brother Zakariyyā was established in his place, Muḥammad opposed them. He was residing in Fez, and its ruler Abū Saʿīd ʿUthmān b. Abī al-ʿAbbās b. Abī Sālim assisted him, and he took possession of it. Abū Fāris kept working against him until his following dispersed; he seized him and killed him in Dhū al-Ḥijja of the year [8]10. Our shaykh (Ibn Ḥajar) said this in his Inbāʾ, and his biography in al-ʿUqūd is long.
