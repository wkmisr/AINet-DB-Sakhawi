translation:
  ja: ムハンマド、アッ＝ラディー、アブー・ハーミド、アル＝ハサニー・アル＝ファースィー・アル＝マッキー。前の二人の同母兄弟。クルアーンその他を暗記した者の一人で、二人の兄のうち最初の者と共にカイロに来て、私（サハーウィー）に（暗記したものを）提示し、私から聴聞した。
  en: Muḥammad, al-Raḍī, Abū Ḥāmid, al-Ḥasanī al-Fāsī al-Makkī, full brother of the two preceding. He was among those who memorized the Qurʾān and other works; he came to Cairo with the first of his two brothers, presented (his memorized texts) to me (al-Sakhāwī) and heard from me.
