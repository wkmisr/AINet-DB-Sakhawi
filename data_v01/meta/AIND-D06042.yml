translation:
  ja: ウマル・アル＝キリミー、のちにアル＝ハラビー。学問に長け、文学と詩作に通じていた。自分の国からやって来てハラブ（アレッポ）に滞在し、次いでダマスクスに移ってそこにしばらく滞在し、それからそこを発ってエジプト（ミスル）へ向かったが、その途上で（8）01年に没した。我らのシャイフ（イブン・ハジャル）が『インバー』においてその没年を記している。
  en: ʿUmar al-Qirimī, later al-Ḥalabī. He was skilled in learning and versed in literature and verse. He came from his country and settled in Aleppo, then moved to Damascus and stayed there for a while, then set out from there for Egypt and died there on the way in the year (8)01. Our shaykh (Ibn Ḥajar) recorded his death date in his Inbāʾ.
