translation:
  ja: ハサン・アル＝ハイサミー。アブー・アル＝ハイサム地区出身の敬虔な人物。アブー・アブドゥッラー・アル＝ガムリーに師事（同伴）し、彼とともにアル＝マハッラに留まった。その後、師の勧めによってミニヤト・ガムルに移り、俗世を離れてクルアーンの朗誦とズィクル（神の念誦）に没頭した。優れた徳、高い霊的境地、カラマ（奇跡）を備えていた。一生に一度の義務であるハッジ（大巡礼）へ向かう途中で、840年より少し前に、50歳近くで亡くなった。神の慈悲あれ。
  en: Ḥasan al-Haythamī, a righteous man from the district of Maḥallat Abī al-Haytham. He accompanied Abū ʿAbd Allāh al-Ghamrī and stayed with him in al-Maḥalla, then moved to Minyat Ghamr upon his advice, dedicating himself to recitation and remembrance (dhikr) in seclusion, possessing virtue, spiritual states, and miracles. He died while heading for the pilgrimage of Islam shortly before the year 840 AH, being nearly fifty years old. May Allah have mercy on him.
