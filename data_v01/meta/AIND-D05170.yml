  ja: アリー・ブン・スィナーン・ブン・アブド・アッラー・ブン・ウマル・ブン・マスウード・アル＝ウマリー・アル＝マッキー。ウマル系の隊長（カーイド）たちの一人であり、アフマド・ブン・アジュラーンのワズィールであった。805年、あるいはその前後に没した。アル＝ファースィーが彼に言及している。
  en: ʿAlī b. Sinān b. ʿAbd Allāh b. ʿUmar b. Masʿūd al-ʿUmarī al-Makkī. He was one of the ʿUmarī commanders (quwwād) and a vizier to Aḥmad b. ʿAjlān. He died in the year 805 AH or thereabouts. Al-Fāsī mentioned him.
