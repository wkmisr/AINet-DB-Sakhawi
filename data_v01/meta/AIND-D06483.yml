translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アフマド、イブン・アッ＝タウワーブとして知られる。マンクータムリーヤ学院に寄寓する者の一人。我らがシャイフ（イブン・ハジャル）とアル＝アラム・アル＝ブルキーニーの法廷で（使者として）勤め、両者から聴講し、晩年にはそれ（聴講）に意欲を示した。前記の学院で集団礼拝を欠かさず、使者職の務めを減らし、（神に）立ち返った。しばらく病んだのち、876年サファル月に高齢で没した。
  en: Muḥammad b. Ibrāhīm b. Aḥmad, known as Ibn al-Ṭawwāb, one of those residing at al-Madrasa al-Mankūtamuriyya. He served at the court (bāb) of our shaykh [Ibn Ḥajar] and of al-ʿAlam al-Bulqīnī and heard from them both, and late in life he took a liking to that. He kept to the congregational prayers at the said madrasa, reduced his work as a court messenger (rusuliyya), and turned [to God] in repentance. He died in Ṣafar of the year 876, after a period of illness and at an advanced age.
