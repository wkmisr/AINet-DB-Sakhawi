  ja: サダカ・ブン・ムハンマド・ブン・サダカ・アル＝ムヌーフィー、のちにアル＝マッキー。礼拝告知者（ムアッズィン）および復唱者（ムカッビル）であり、イブン・アル＝ハワンダールと呼ばれる。メッカにおいて私（サハーウィー）から（ハディースを）聴聞した人物の一人である。
