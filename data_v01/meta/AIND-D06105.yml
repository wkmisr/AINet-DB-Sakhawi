translation:
  ja: イーサー・ブン・ユースフ・ブン・ハッジャージュ・ブン・イーサー・ブン・ユースフ、アッ＝シャラフ、アブー・アン＝ヌール、アル＝アシュムーミー、のちにアル＝カーヒリー、アル＝マディーニー、クルアーン読誦家、シャーフィイー派、盲目の人。学問に励み、クルアーン読誦諸伝承（キラーアート）に通じた者の一人で、この分野における彼の師の一人がアッ＝ザイン・ジャアファル・アッ＝サンフーリーであり、彼は850年に彼に（教授の）許可を与えた。また、我らがシャイフ（イブン・ハジャル）から聴聞した。
  en: ʿĪsā b. Yūsuf b. Ḥajjāj b. ʿĪsā b. Yūsuf, al-Sharaf Abū al-Nūr al-Ashmūmī, then al-Qāhirī, al-Madīnī, the Qurʾān reciter, the Shāfiʿī, the blind. He was among those who devoted themselves to study and became versed in the Qurʾānic readings (qirāʾāt); among his teachers in that field was al-Zayn Jaʿfar al-Sanhūrī, who gave him authorization in the year 850. He also heard from our shaykh (Ibn Ḥajar).
