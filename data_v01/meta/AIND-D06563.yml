notes:
- text: '転送見出し（原文「فيمن جده محمد بن عبد الله بن يوسف」による）。転送先は #AIND-D06550「محمد بن إبراهيم بن محمد بن عبد الله بن يوسف بن يونس الشمس أبو عبد الله السلامي بالتثقيل البيري الأصل الحلبي الشافعي . ولد تقريبا سنة إحدى عشرة وثمانمائة بالبيرة … مات في ربيع الأول سنة تسع وسبعين」（未受領。祖父以上のナサブ「محمد بن عبد الله بن يوسف」とニスバ السلامي が一致。corpus の見出しで「محمد بن إبراهيم」＋「السلامي」は本項と D06550 のみ）。本項の見出しは曾祖父を「محمد」とし、転送先は「عبد الله」とする（ナサブの異伝）。'
