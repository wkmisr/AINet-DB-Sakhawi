translation:
  ja: フィールーズ・アッ＝ルーミー・アル＝アッラーミー——（このニスバは）アレクサンドリア代官アル＝ガルス・ハリール・ブン・アッラームにちなむ。長寿を保ち、ラシード港に塔を建ててそのためにワクフを設定した。学問にひととおりの関わりがあり、歴史をいくらか記憶していた。それどころか、アターバク・ヤシュバク・アッ＝シャアバーニーと、彼とアン＝ナースィルとの間に起こったことについての書物を著し、それを韻文であると称したが、整った文章ですらなく、まして韻文ではなかった。（8）50年頃にカイロで没した。
  en: Fīrūz al-Rūmī al-ʿArrāmī, so called after al-Ghars Khalīl b. ʿArrām, governor of Alexandria. He lived to a great age, built a tower at the port of Rashīd (Rosetta) and endowed a waqf for it. He had some general acquaintance with learning and remembered some history; indeed he composed a book on the atābak Yashbak al-Shaʿbānī and what befell him with al-Nāṣir, which he claimed was in verse, though it was not even orderly prose, let alone verse. He died in Cairo around the year [8]50.
