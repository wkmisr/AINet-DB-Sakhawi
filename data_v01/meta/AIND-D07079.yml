translation:
  ja: ムハンマド・ブン・アフマド・ブン・アル＝フラート。833年、アッ＝ザイン・ターヒル・アル＝マーリキーがアブー・アブドゥルカーディルに与えたイジャーザにおいて証人となった。私の思うに、彼は祖父がムハンマド・ブン・アリー・ブン・アル＝ハサンである者たち（の部）で前述した者である。
  en: Muḥammad b. Aḥmad b. al-Furāt. He acted as witness for al-Zayn Ṭāhir al-Mālikī in his ijāza to Abū ʿAbd al-Qādir in the year 833, and I think he is the one mentioned above among those whose grandfather is Muḥammad b. ʿAlī b. al-Ḥasan.
