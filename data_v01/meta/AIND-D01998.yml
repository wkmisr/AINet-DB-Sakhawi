translation:
  ja: 969 イブラーヒーム العماد السرميني。ダマスカスの機密書記長代理、創設者（منشئها）にして詩人。詩と散文を創作し、稀有な人物であった。ラジャブ月838年に中年で亡くなった。
  en: 969 Ismāʿīl al-ʿImād al-Sarmīnī. Deputy Confidential Secretary (nāʾib kātib al-sirr) in Damascus, its founder (munshiʾ) and poet. He composed poetry and prose and was one of the unique individuals of his time. He died in Rajab 838 H, being middle-aged.
