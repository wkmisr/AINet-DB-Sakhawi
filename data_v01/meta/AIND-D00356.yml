translation:
  ja: イブラーヒーム・ブン・ユースフ・ブン・アラム・アッディーン・ブン・ムヒッブ・アッディーン、ブルハーン・アッディーン、アル＝ファーリスクーリー、シャーフィイー派。二人のムハンマド、シャムス・アッディーンと、アブー・アッ＝タイイブの父ザイン・アッディーンの同母兄弟。イブラーヒームは二人の兄弟より年長で、イブン・アル＝ファキーフとして知られた。読誦師イブラーヒーム・アル＝ブースィーリーのもとで七読誦法を朗誦し、法学・アラビア語学などをシャムス（・アッディーン）・アル＝ハリーリーらから学んだが、彼が最も益を得たのは父からであった。故郷に金曜礼拝と集団礼拝が行われるマドラサを建て、そこに座って教授したので、子弟の一団が彼から益を得た。彼のもとで読んだ者の中にザイン（・アッディーン）・アブドゥッラフマーン・ブン・ウスマーン・ブン・ムハンマド・アル＝ファーリスクーリーがいる。やがて彼は故郷で、おおよそ70年（870年）の少し前に没した。80歳を超えていた。神よ彼に慈悲を。
  en: Ibrāhīm b. Yūsuf b. ʿAlam al-Dīn b. Muḥibb al-Dīn, Burhān al-Dīn al-Fāriskūrī al-Shāfiʿī, full brother of the two Muḥammads, Shams al-Dīn and Zayn al-Dīn, the father of Abū al-Ṭayyib. Ibrāhīm was the eldest of his two brothers and was known as Ibn al-Faqīh. He recited the seven readings under the reciter Ibrāhīm al-Būṣīrī and studied jurisprudence, Arabic and other subjects under al-Shams al-Ḥarīrī and others, but he benefited most from his father. He built in his hometown a madrasa in which the Friday and congregational prayers were held, and he used to sit there to teach, so that a group of young men benefited from him. Among those who read under him was al-Zayn ʿAbd al-Raḥmān b. ʿUthmān b. Muḥammad al-Fāriskūrī. He died in his hometown approximately shortly before [8]70, having passed the age of eighty. May God have mercy on him.
