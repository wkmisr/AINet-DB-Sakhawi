translation:
  ja: アリー・ブン・ムハンマド、アラー・アッ＝ディーン・イブン・アル＝クサイル、ハナフィー派。801年の断食明けの祝日に生まれた。アッ＝タキー・ブン・ファフドの『ムウジャム』にはこのようにあり、彼の項は空白のままにされている。前項の人物と同一か別人かは要検討である。
  en: ʿAlī b. Muḥammad, ʿAlāʾ al-Dīn Ibn al-Quṣayr, al-Ḥanafī. He was born on the day of ʿĪd al-Fiṭr 801. So it stands in the Muʿjam of al-Taqī b. Fahd, who left his entry blank; it remains to be verified whether he is the preceding person or someone else.
