translation:
  ja: イブラーヒーム・ブン・アハマド・ブン・イブラーヒーム、ラカブはブルハーンッディーン。シーラーズ出身で、礼拝時刻計算官（ムワッキト）。ハフィズ・アル＝ジャマール・イブン・ムーサー・アル＝マラーキシーは彼にアレクサンドリアで出会い、「優秀な教授でムワッキト」と評して伝記を著し、彼には時間学や天文学などの関連分野に関する著作や豊かな知識があったと述べた。イブン・ファハドを含む集団のために、彼（イブラーヒーム）からイジャーザ（教える許可）を求めた。そしてその事柄を自身の『ムアジャム』（伝記集）に記録した。彼の没時は不明。
  en: Ibrāhīm b. Aḥmad b. Ibrāhīm, titled Burhān al-Dīn, from Shīrāz, and a prayer-time calculator (muwaqqit). al-Ḥāfiẓ al-Jamāl Ibn Mūsā al-Marākushī met him in Alexandria and wrote his biography, describing him as "the excellent master and muwaqqit." He stated that Ibrāhīm had compositions in the science of timekeeping and extensive knowledge in related fields such as astronomy. He sought an ijāza from him for a group, including Ibn Fahd, and mentioned this in his biographical dictionary. The time of his death is unknown.
