translation:
  ja: アハマド・ブン・ジブリール・アル＝ハリーリー、ムアッズィン。アル＝マイドゥーミーから聴聞し、804年に彼から、アブー・バクル・アル＝カルカシャンディーが彼らから聴聞したイブラーヒーム・ブン・サアドの著作を伝承した。
  en: Aḥmad b. Jibrīl al-Khalīlī, the muezzin, heard from al-Maydūmī. In 804 H, he transmitted from him (al-Maydūmī) the text of Ibrāhīm b. Saʿd, which al-Taqī Abū Bakr al-Qalqashandī also heard from them (i.e., Aḥmad and the group).
