translation:
  ja: アブドゥルガッファール・ブン・アフマド・ブン・ムハンマド・ブン・アフマド・アル＝キーラーニー。二人のシャイフ、ムハンマドとフサイン、およびイブラーヒームの兄弟で、（彼らは）イブン・カーワーンの子らである。学問に励んで優れた者の一人。890年の少し後にアレッポの隊商とともにメッカに来て1年滞在し、故郷へ帰った。
  en: ʿAbd al-Ghaffār b. Aḥmad b. Muḥammad b. Aḥmad al-Kīlānī, brother of the two shaykhs Muḥammad and Ḥusayn, and of Ibrāhīm, the sons of Ibn Qāwān. He was one of those who studied and excelled. He came to Mecca shortly after [8]90 with the Aleppo caravan, stayed a year, and then returned to his country.
