  en: Aḥmad b. al-Ḥasan al-Ghumārī al-ʿArūsī. He was widely renowned throughout the entire Maghrib for his piety and goodness. He lived for about a hundred years. He died in Ramadan or Shawwal of the year 874 AH. This information was conveyed to me by some Moroccans.
