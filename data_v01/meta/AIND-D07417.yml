translation:
  ja: ムハンマド・ブン・サアド、アッ＝シャムス、アブー・アブドゥッラー・アル＝アジュルーニー・アッ＝ディマシュキー・アッ＝シャーフィイー。874年サファル月24日にダマスクスで没し、バーブ・アッ＝サギール墓地に葬られた。高齢で、教授、学者、ムフティーであり、裁判代理官の一人で、学生たちが彼から学んだ。
  en: Muḥammad b. Saʿd, al-Shams Abū ʿAbd Allāh al-ʿAjlūnī al-Dimashqī al-Shāfiʿī. He died in Damascus on the 24th of Ṣafar of the year [8]74 and was buried in the Bāb al-Ṣaghīr cemetery. He was aged, a teacher (mudarris), a scholar and a muftī, one of the deputy judges, and one from whom the students took (knowledge).
