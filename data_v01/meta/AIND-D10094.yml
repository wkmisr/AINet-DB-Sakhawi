translation:
  ja: ムーサー・ブン・ムハンマド・ブン・アル＝フマーム、アッ＝シャラフ・ブン・アン＝ナジュム・アル＝マクディスィー。アル＝マイドゥーミーのもとで『アル＝ムサルサル』、『ジュズウ・イブン・アラファ』、『（ジュズウ・）アル＝ビターカ』、『ヌスハ・イブラーヒーム・ブン・サアド』などを聴聞し、（ハディースを）伝え、学識者たちが彼から聴聞した。我らがシャイフ（イブン・ハジャル）は『ムウジャム』で彼に言及し、「私の子らのための（イジャーザ）申請書において私にイジャーザを与えた」と述べた。その後ほどなく、821年ラジャブ月に没した。マクリーズィーも『ウクード』でこれ（イブン・ハジャルの記述）に従った。
  en: 'Mūsā b. Muḥammad b. al-Humām, al-Sharaf b. al-Najm al-Maqdisī. He heard from al-Maydūmī al-Musalsal, Juzʾ Ibn ʿArafa, (Juzʾ) al-Biṭāqa, Nuskhat Ibrāhīm b. Saʿd and other works; he transmitted (ḥadīth), and men of learning heard from him. Our shaykh (Ibn Ḥajar) mentioned him in his Muʿjam and said: "He granted me an ijāza in the request (istidʿāʾ) for my children." He died shortly after that, in Rajab of the year [8]21, and al-Maqrīzī followed him in his ʿUqūd.'
