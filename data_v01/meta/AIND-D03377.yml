translation:
  ja: シッディーク・ブン・アフマド・ブン・ユースフ・ブン・アブド・アッラフマーン・ブン・イスマーイール・ブン・ムハンマド・アル＝ヤマニー。マッカに定住し、アル＝アフダルの名で知られた。高潔なシャイフ。855年ムハッラム月23日金曜日の午前中に同地で没し、アル＝ムアッラー墓地にある父親の墓の傍らに埋葬された。
  en: Ṣiddīq bin Aḥmad bin Yūsuf bin ʿAbd al-Raḥmān bin Ismāʿīl bin Muḥammad al-Yamanī. He settled in Mecca and was known as al-Ahdal. A righteous shaykh. He died there in the forenoon of Friday, the 23rd of Muharram, in the year 855 AH, and was buried next to his father's grave in al-Muʿallā.
