translation:
  ja: ウスマーン・ブン・アフマド・ブン・ウスマーン、アル＝ファフル、アッ＝サフラジュティー、のちアル＝カーヒリー、アル＝アズハリー、アッ＝シャーフィイー。アル＝ムナーウィー、ついでアル＝ジャウジャリーに師事（密着）した者の一人で、後者のもとで『ブハーリー』を読誦し、さらには同書をアッ＝ザーヒリーヤで聴聞した者の一人でもある。ジャーミウ・アッ＝サーリフで証人業（シャハーダ）により生計を立て、アッ＝ディーミーの娘を娶ってその婿となり、彼女との間に子らをもうけた。没した。
  en: ʿUthmān b. Aḥmad b. ʿUthmān, al-Fakhr, al-Ṣahrajtī, then al-Qāhirī, al-Azharī, al-Shāfiʿī. He was among those who attended al-Munāwī and then al-Jawjarī, under whom he read al-Bukhārī; indeed he was among those who heard it at al-Ẓāhiriyya. He earned his living as a notary witness at the Mosque of al-Ṣāliḥ, married the daughter of al-Daymī and had children by her. He died.
