translation:
  ja: ラスール・ブン・ムハンマド・ブン・ウマル・アル＝クルディー。彼もまた我らがシャイフ（イブン・ハジャル）から（ハディースを）聴聞し、アル＝カーミリッヤ・マドラサのイマームに師事（同伴）した人物である。彼ら二人のうちの一方は、区別のために『大（アル＝カビール）』、他方は『小（アッ＝サギール）』と呼ばれていた。
  en: Rasūl b. Muḥammad b. ʿUmar al-Kurdī. He was among those who heard hadith from our shaykh (Ibn Ḥajar) as well, and he accompanied the imam of al-Kāmiliyya. One of them was called 'the Elder' (al-Kabīr) and the other 'the Younger' (al-Ṣaghīr) for distinction.
