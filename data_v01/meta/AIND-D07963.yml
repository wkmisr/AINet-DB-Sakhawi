translation:
  ja: ムハンマド・ブン・アジュラーン、シャイフ・アル＝アラブ（アラブ部族長）。アッ＝ザーヒル・タムルブガーがディムヤートから脱出した際に彼を助けた者であるが、二人の企ては成らず、ともに捕らえられ、彼はしばらくブルジュ（塔）に収監され、のち釈放された。推定では888年の初めか、その前年の末に、アル＝ウスターダール・タグリーバルディーの処罰を受けたのちに没した。
  en: Muḥammad b. ʿAjlān, shaykh of the Arabs. He was the one who assisted al-Ẕāhir Tamurbughā in his departure from Damietta, but their enterprise did not succeed; both were seized, and he was held in the Burj for a while and then released. He died, presumably, at the beginning of the year 888 or at the end of the year before, after Taghrī Birdī the ustādār had punished him.
