translation:
  ja: アリー・ブン・アブドゥッラー、ヌール・アッ＝ディーン、アン＝ナハリーリー、文学者。イブン・アーミリヤとして知られる。詩人、文学者であり、特に預言者賛歌（マディーフ・ナバウィー）を多く作った。人々は彼に対して信仰を抱いていた。ハジュラ暦832年ラビー・アッ＝サーニー（第4月）にガルビーヤ地方のアン＝ナハラーリーヤで没した。アッラーの慈悲がありますように。
  en: ʿAlī b. ʿAbd Allāh, Nūr al-Dīn al-Naḥrīrī, the littérateur, known as Ibn ʿĀmiriyya. He was a poet and a prolific writer, particularly of praises of the Prophet, and people held him in high spiritual regard. He died in Rabīʿ al-Ākhar, 832 AH, in al-Naḥrārīya in the Gharbiyya province, may Allah have mercy on him.
