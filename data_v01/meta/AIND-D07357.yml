translation:
  ja: ムハンマド・ブン・ハサン・ブン・アリー・ブン・スライマーン・ブン・ウマル・ブン・ムハンマド、アッ＝シャムス、アル＝ハラビー、ハナフィー派。彼の息子と孫（いずれもムハンマドという名）は後述。アル＝ムワッキト（礼拝時刻計算員）、またイブン・アミール・ハーッジとして知られる。彼は諸学に秀でた学徳ある人物で、アル＝ジャルダキーヤ（学院）の教授（ムダッリス）であり、時刻計算に熟達していたため、それ（時刻計算職）を自らの町の大モスクで務めた。彼の後、時刻計算職と教授職は息子に移った。
  en: Muḥammad b. Ḥasan b. ʿAlī b. Sulaymān b. ʿUmar b. Muḥammad, al-Shams al-Ḥalabī al-Ḥanafī. His son and his grandson, each named Muḥammad, are mentioned below. He was known as al-Muwaqqit and as Ibn Amīr Ḥājj. He was accomplished in various branches of learning, a teacher (mudarris) at al-Jardakiyya, and excelled in timekeeping, for which reason he held that post at the Great Mosque of his town. After him the posts of timekeeping and teaching passed to his son.
