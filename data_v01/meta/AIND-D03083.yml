translation:
  ja: サアド・ブン・アブドゥッラー・サアド・アッ＝ディーン・アル＝アーミディー、のちにアッ＝タラーブルシー、アッ＝シャーフィイー。タラーブルス（トリポリ）にしばらく滞在し、人々に『アル＝ハーウィー』を教授し、少しばかりファトワーを発していた。彼はウスール（法の諸原理）に優れ、『アル＝ハーウィー』の難問を解決することができたが、その信仰（宗教性）においては芳しく評価されていなかった。ヒジュラ暦832年の二つのジュマーダー月のいずれかに没した。我らがシャイフ（イブン・ハジャル）がその著書『インバー・アル＝グムル』で彼に言及し、次いでイブン・カーディー・シュフバも言及している。
  en: Saʿd b. ʿAbd Allāh Saʿd al-Dīn al-Āmidī, later al-Ṭarābulusī al-Shāfiʿī. He resided in Tripoli (Ṭarābulus) for a period, occupying people with (teaching them) 『al-Ḥāwī』 and occasionally issuing fatwas. He was accomplished in uṣūl (legal principles) and could resolve the problems of 『al-Ḥāwī』, but he was not well-regarded in his religious piety. He died in one of the two months of Jumada in the year 832 AH. Our shaykh (Ibn Ḥajar) mentioned him in his 『Inbāʾ al-Ghumr』, and subsequently Ibn Qāḍī Shuhba mentioned him as well.
