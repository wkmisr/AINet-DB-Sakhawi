translation:
  ja: ウスマーン・ブン・ユースフ・ブン・ムハンマド・ブン・アリー・アッ＝サンハージー・アル＝マグリビー、マッカに寄留し同地のリバート・アル＝ムワッファクに住んだ人で、人々の崇敬を集めた者の一人。795年頃に生まれ、巡礼者としてマッカに来て、しばらくの間マッカとマディーナの間を往来した。人々から離れて隠棲し、学問と信仰と敬虔さを兼ね備えていたので、人々の彼への崇敬はいよいよ高まった。（8）63年にマッカで没した。
  en: ʿUthmān b. Yūsuf b. Muḥammad b. ʿAlī al-Ṣanhājī al-Maghribī, resident of Mecca in its Ribāṭ al-Muwaffaq, and one of those held in veneration. He was born around 795, came to Mecca as a pilgrim, and for a time went back and forth between Mecca and Medina. People's veneration for him grew, together with his withdrawal from them and his combining of learning, religion and righteousness. He died in Mecca in (8)63.
