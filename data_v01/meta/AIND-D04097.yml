translation:
  ja: アブド・アル＝カーディル・ブン・アフマド・ブン・アビー・バクル・ブン・アフマド・ブン・アリー・アッ＝ザイン・アル＝ハマウィー・アル＝ハラビー。彼の父は以前に言及され、息子のアフマドと兄弟のアル＝ムヒッブ・ムハンマドは後述される。彼と同様にイブン・アッ＝ラサームとして知られる。アレッポの機密書記長（カーティブ・アッ＝スィッル）、同地の軍事監督官（ナザル・アル＝ジャイシュ）および人頭税監督官（ナザル・アル＝ジャワーリー）を歴任した。アル＝アラム・アル＝ブルキーニーの娘と結婚し、彼の婿となった。彼の行動は目立たず（無気力で）、多額の債務を抱え、官職にあっても大した利益を得られなかった。兄弟の死後、860年代（860〜869年）のいずれかの年にハマーで没した。
  en: Abd al-Qadir b. Ahmad b. Abi Bakr b. Ahmad b. Ali, al-Zayn al-Hamawi al-Halabi. His father was mentioned previously, and his son Ahmad and his brother al-Muhibb Muhammad are to be mentioned later. Like him, he was known as Ibn al-Rassam. He was among those who held the office of Secretary of State (Katib al-Sirr) in Aleppo, and oversaw its army (Nazar al-Jaysh) and its poll-tax (Nazar al-Jawali). He became the son-in-law of al-Alam al-Bulqini by marrying his daughter. He was obscure in his movements, bore heavy debts, and did not achieve significant gain from his offices. He died in Hama in the sixty-somethings (860s AH) after his brother.
