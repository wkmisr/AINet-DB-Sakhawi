translation:
  ja: イブラーヒーム・ブン・アリー・ブン・イブラーヒーム・ブン・アフマド・ブン・サアド・ブン・サイード、アル＝マクディシー、シャーフィイー派。イブン・アビー・マディヤンとして知られるが、それは彼の父のクンヤである。カイロにやってきて、892年シャウワールに、私（＝サハーウィー）から『ムサルサル』を聴聞した。
  en: Ibrāhīm b. ʿAlī b. Ibrāhīm b. Aḥmad b. Saʿd b. Saʿīd, al-Maqdisī, al-Shāfiʿī. He is known as Ibn Abī Madyan, which is his father's kunya. He arrived in Cairo and heard from me (al-Sakhāwī) al-Musalsal in Shawwāl of the year 892.
