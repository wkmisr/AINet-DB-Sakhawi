translation:
  ja: リドワーン・ブン・アリー・ブン・リドワーン・アル＝カーヒリー。クルアーン朗誦家。既述のアフマドの父。学習に熱心なジョウク（朗誦団）の朗誦家の一人。父と同様に公証人（シャハーダ）として、またアミールらの邸宅などでのウスブウ（クルアーン7分之1）の巡回朗誦によって生計を立て、多くの場所で職位（スティペンド）を得た。それどころか、息子の後にハッシャービッヤで領収書の書記を務め、時に説教（フトバ）を行った。私は彼の朗誦を称賛していた。アル＝ジャマール・アル＝バドラーニーの『サバト（伝承目録）』の中に彼の聴聞記録（アスマア）がいくつか発見されたため、学生たちは彼にイジャーザを求めた。
  en: Riḍwān ibn ʿAlī ibn Riḍwān al-Qāhirī, the Quran reciter. He is the father of the aforementioned Aḥmad, and was one of the diligent Quran reciters of the jawq (recitation group) in acquiring knowledge. He earned his living by witnessing (al-shahāda) like his father, and by circulating for the recitation of the usbūʿ (one-seventh of the Quran) in the houses of the amirs and others. He received stipends in many places, and even wrote receipts at al-Khashshābiyya after his son did. He sometimes delivered sermons (khutba). I [al-Sakhāwī] used to praise his recitation. Some of his audition records (asmiʿa) were found in the Thabat of al-Jamāl al-Badrānī, so students requested ijāza from him for that reason.
