translation:
  ja: ムハンマド・ブン・アブドゥッラティーフ・ブン・ムハンマド・ブン・アフマド・ブン・アリー、アル＝ムヒッブ、アブー・アブドゥッラー、イブン・アル＝ヒジャーズィー、アル＝マッキー。父は前述した。父と共にカイロに来て、私（サハーウィー）から『アズカール』などを聴聞し、同じくアル＝クムスィーやアッ＝ダイミーらからも聴聞し、アル＝ファフル・アル＝マクスィーのもとでいくつかの講義に出席した。思慮深い人物であった。ヒジュラ暦873年ラマダーン月28日火曜の夜にペストで没し、父は彼の死を嘆き悲しんだ。神が二人に楽園をもって報われんことを。
  en: Muḥammad b. ʿAbd al-Laṭīf b. Muḥammad b. Aḥmad b. ʿAlī, al-Muḥibb, Abū ʿAbd Allāh, Ibn al-Ḥijāzī, al-Makkī. His father has been mentioned above. He came with his father to Cairo and heard from me (al-Sakhāwī) al-Adhkār and other works; he likewise heard from al-Qumṣī, al-Daymī and others, and attended some lessons with al-Fakhr al-Maqsī. He was sensible. He died of the plague on the night of Tuesday, 28 Ramaḍān 873, and his father grieved over him; may God compensate them both with Paradise.
