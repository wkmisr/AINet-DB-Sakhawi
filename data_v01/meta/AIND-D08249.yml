notes:
- text: '転送見出し（原文末尾「فيمن جده خلد بن أحمد」による）。転送先は #AIND-D08065「محمد بن علي بن خلد بن أحمد الشمس المحلي ثم القاهري الشافعي الشاعر . ولد في سنة ست وعشرين وثمانمائة بالمحلة ظنا … فتوفي هناك غريبا … في محرم سنة خمس وستين」（祖父ナサブ خلد بن أحمد・ラカブ الشمس・ニスバ المحلي・「الشاعر」が一致）。同じ「محمد بن علي بن خلد」の #AIND-D08066（البدر القنبشي、祖父 خلد بن علي）・#AIND-D08067（ابن البيطار、祖父 خلد بن محمد）は別人。'
