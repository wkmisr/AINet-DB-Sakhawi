translation:
  ja: ムハンマド・ブン・アフマド・ブン・ディーナール、法学者ジャマール・アッ＝ディーン・アル＝マッキー。（カアバの）階段の奉仕者の一人。807年に、アッ＝シハーブ・アル＝ジャウハリー、アブド・アル＝カリーム・ブン・ムハンマド・アル＝ハラビー、アブー・アル＝ユムン・アッ＝タバリー、アーイシャ・ビント・ムハンマド・ブン・アブド・アル＝ハーディーらが彼にイジャーザを与えた。（8）43年ムハッラム月にマッカで没した。イブン・ファハドが彼に言及している。
  en: Muḥammad b. Aḥmad b. Dīnār, the jurist Jamāl al-Dīn al-Makkī, one of the attendants of the staircase [of the Kaʿba]. In the year 807 al-Shihāb al-Jawharī, ʿAbd al-Karīm b. Muḥammad al-Ḥalabī, Abū al-Yumn al-Ṭabarī, ʿĀʾisha bt. Muḥammad b. ʿAbd al-Hādī and others granted him an ijāza. He died in Mecca in al-Muḥarram of the year [8]43. Ibn Fahd mentioned him.
