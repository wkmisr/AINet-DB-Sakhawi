notes:
- text: '本項は転送項（صوابه … وقد مضى）。原文「صوابه أحمد ابن محمد بن أحمد بن أحمد بن محمد بن أبي بكر بن عيسى وقد مضى」= 正しい系譜は別項で既述、の意。しかし転送先の実伝（أحمد بن محمد بن أحمد بن أحمد بن محمد بن أبي بكر بن عيسى الأخنائي）が corpus に独立ヘッドワードとして見当たらず、転送先AINDを一意特定できない。D00952型クローズとして立項を維持（REF_リネーム・txt改変は行わない）。本伝が後続で特定でき次第、type="reference" subtype="LIMBO" 化して統合先へ転送する。関連: al-Akhnāʾī 一族の総説項 AIND-D11417 に同系譜（بن أبي بكر بن عيسى）の記載あり（ただし本人の実伝ではない）。'
