translation:
  ja: アブド・アッ＝ラティーフ・ブン・ムハンマド・ブン・アブド・アッ＝ラティーフ・ブン・ムハンマド・ブン・アブド・アッ＝ラフマーン、少年（アル＝ワラド）スィラージュ・アッ＝ディーン・ブン・アル＝クトゥブ・アビー・アル＝ハイル・アル＝ハサニー・アル＝ファースィー・アル＝マッキー・アル＝マーリキー。父と叔父は後述。887年に『ナワウィーの四十ハディース』と『アージュッルーミーヤ』を、次いで897年にシャイフ・ハリールの『ムフタサル』を私（サハーウィー）に提示（暗誦）し、私は彼に（イジャーザを）書いた。
  en: ʿAbd al-Laṭīf b. Muḥammad b. ʿAbd al-Laṭīf b. Muḥammad b. ʿAbd al-Raḥmān, the boy Sirāj al-Dīn b. al-Quṭb Abī al-Khayr al-Ḥasanī al-Fāsī al-Makkī al-Mālikī; his father and his uncle follow. He presented to me al-Arbaʿīn al-Nawawiyya and al-Ājurrūmiyya in the year 887, then the Mukhtaṣar of Shaykh Khalīl in the year 897, and I wrote (an ijāza) for him.
