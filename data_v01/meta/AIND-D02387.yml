translation:
  ja: ジャーン・バラート・アル＝アシュラフィー・イーナール。主人（ウスターズ＝アル＝アシュラフ・イーナール）に寵愛され、その酌人（サーキー）を務めた。その後試練の時期を経て、最終的にアル＝アシュラフ・カーイトバーイによって十人長に任じられた。873年ラマダーン月に死去し、スルターンはアル＝ムウミニーの礼拝所（ムサッラー）での葬礼に臨席した。彼は背が高く、美男で容姿端麗であり、同輩のマムルーク（フジュダーシュ）たちよりも暮らし向きが良かった。
  en: Jān Balāṭ al-Ashrafī (of Īnāl). He was closely attached to his master (ustādh), who made him a cupbearer (sāqī). He then underwent a period of trials until al-Ashraf Qāytbāy appointed him amir of ten. He died in Ramaḍān of the year 873, and the Sultan attended his funeral prayer at (Muṣallā) al-Muʾminī. He was tall, handsome, of fine appearance, and better off than his khujdāsh comrades.
