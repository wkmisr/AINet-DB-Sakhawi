translation:
  ja: ハサン・バドル・アッ＝ディーン・イブン・アン＝ナハ・アル＝バグダーディー・アッ＝シャーフィイー。優れた学識者（フダラー）の一人。アル＝バドリーが自身の選集に彼の次の詩を書き留めた。 「絹のよう（ハリーリー）な彼の美しく輝く頬は、いかなる比類をも超越している。彼は確かな言葉で私と親しく語らった。ハリーリーのマカーマート（集会／ハリーリーの著作『マカーマート』）は何と甘美なことか！」
  en: 'Ḥasan Badr al-Dīn ibn al-Naḥ al-Baghdādī al-Shāfiʿī, one of the virtuous men. al-Badrī transcribed his verses in his compilation, including: "A silk-like (ḥarīrī) youth with a radiant cheek, elevated far above any compare. He entertained me with sound words; how sweet indeed are the assemblies (maqāmāt) of al-Ḥarīrī!"'
