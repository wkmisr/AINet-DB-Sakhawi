translation:
  ja: Ahmad b. Abī Yazīd from Ṭarabāy, the younger brother of Muḥammad (forthcoming). He was born in 866 in Cairo, and was among those who studied under me, along with his brother. He also heard from al-Khaṭīb al-Ḥanbalī and others. He performed the Hajj. His brother was involved with him in some of the necessities that befell his master, and other matters. He died, as I heard while I was in Mecca, in 897.
  en: Aḥmad b. Abī Yazīd from Ṭarabāy, the younger brother of Muḥammad (forthcoming). He was born in 866 in Cairo, and was among those who studied under me, along with his brother. He also heard from al-Khaṭīb al-Ḥanbalī and others. He performed the Hajj. His brother associated with him in some of the needs that befell his master, and other matters. He died, as I heard while I was in Mecca, in 897.
