translation:
  ja: ジャアファル・アッ＝ザイン・アル＝アジャミー・アル＝ハナフィー。アル＝ムアイヤディーヤの居住者。 アッ＝ザイン・ザカリヤー・アル＝カーディーが彼のもとで『シャムシーヤの注釈』と、サイイドによるその大半の補注書を読んだ。また、彼のもとで哲学（知恵の学）を学び、彼を「美徳と敬虔さの持ち主」と評した。
  en: Jaʿfar al-Zayn al-ʿAjamī al-Ḥanafī, a resident of al-Muʾayyadiyya. Al-Zayn Zakariyā al-Qāḍī studied with him, reading Sharḥ al-Shamsiyya and most of its supercommentary by al-Sayyid. He also acquired al-Ḥikma (philosophy/wisdom) from him and described him as possessing excellence and piety.
