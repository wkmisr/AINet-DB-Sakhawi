translation:
  ja: アハマド・ブン・アブドゥッラー・ブン・アハマド・アッ＝ディマシュキー・アル＝ムクリ（イブン・ル＝ラッバーンとして知られる）。ダマスクスでクルアーン朗誦のシャイフを務めた。821年に老齢で死去した。多くのハディースを聴聞した。これはイブン・アビー・ウダイバが述べたもので、精査を要する。
  en: Aḥmad b. ʿAbd Allāh b. Aḥmad al-Dimashqī al-Muqriʾ, known as Ibn al-Labbān. He served as the shaykh of Qur'an recitation in Damascus in his time. He died there in 821 at an advanced age, having heard much (ḥadīth). Ibn Abī ʿUdhayba reported this, and it requires verification.
