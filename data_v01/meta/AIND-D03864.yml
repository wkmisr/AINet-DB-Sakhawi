translation:
  ja: アブドゥルラヒーム・ブン・アブドゥルラフマーン・ブン・アフマド・ムイン・アッ＝ディーン・ブン・サフィー・アッ＝ディーン・ブン・シハーブ・アッ＝ディーン・アル＝フサイニー・アル＝バミー・アル＝キルマーニー・アッ＝シャーフィイー。メッカにおいて私から、また私に対して様々なものを聴聞・朗読し、私は彼のために冊子（クッラーサ）にイジャーザを書き記した。その後、彼は自身の国へと旅立った。
  en: Abd al-Rahim bin Abd al-Rahman bin Ahmad Muin al-Din bin Safi al-Din bin Shihab al-Din al-Husayni al-Bami al-Kirmani al-Shafi'i. He heard from me and recited to me various works in Mecca. I wrote an ijaza for him in a booklet, and he then traveled back to his homeland.
