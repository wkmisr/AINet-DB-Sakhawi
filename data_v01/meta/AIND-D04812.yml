translation:
  ja: ウバイドゥッラー・ブン・マフムード・アッ＝シャーシー。〔8〕95年ラビーウ・アル＝アウワル月の末日、あるいはラビーウ・アッ＝サーニー月の朔日に没した。彼の伝記は、彼から学んだ者のうち私からも学んだ或る人の筆跡で私の手元にあり、〔それは〕同年の出来事、あるいはその翌年の出来事のなかに、ヤアクーブの死とともに〔記されている〕とおりである。
  en: ʿUbayd Allāh b. Maḥmūd al-Shāshī. He died at the end of Rabīʿ al-Awwal or at the beginning of Rabīʿ al-Thānī of the year [8]95. I have his biography, written in the hand of one of those who studied under him and who also studied under me, as it stands in the events of that year or of the following year, together with the death of Yaʿqūb.
