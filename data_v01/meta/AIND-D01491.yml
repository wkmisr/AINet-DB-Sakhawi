translation:
  ja: アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・イスマーイール・ブン・ムワッファク、ラカブはアッ＝シハーブ、ニスバはアッ＝ダイルーティー、シャーフィイー派。カイロで私（＝サハーウィー）から（ハディースを）聴聞した。また私（＝サハーウィー）は、（同族の年長の）アッ＝ダイルーティーがイブン・アル＝カサビー（＝D08670）にイジャーザを与えた際、その証人として名を連ねた者たちの中に彼を見かけた。
  en: Aḥmad b. Muḥammad b. Muḥammad b. Ismāʿīl b. Muwaffaq, known as al-Shihāb al-Dayrūṭī al-Shāfiʿī. He heard from me (al-Sakhāwī) in Cairo, and I saw him among the witnesses to the ijāza granted by (an elder) al-Dayrūṭī to Ibn al-Qaṣabī.
