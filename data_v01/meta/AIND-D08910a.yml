translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アフマド・ブン・アビー・バクル・ブン・イスマーイール・ブン・アフマド・ブン・アリー・イブン・イブラーヒーム、シャムス〔・ッディーン〕・アル＝ムジャーヒディー・アル＝アイユービー（サラーフ〔・ッディーン〕・ユースフ・ブン・アイユーブの子孫であるため。時に「アッ＝サーリヒー・アル＝アイユービー」とも書いた）、ハマー出身でのちアレッポの人、シャーフィイー派、スーフィー、イブン・アッ＝シャンマーウとして知られる。791年初めにハマーで生まれ、幼くして父とともにエジプトへ移り住み、クルアーン、『タンビーフ』、〔シーラーズィーの〕『ムハッザブ』の最初の4分の1を暗記した。スィラージュ・アル＝ブルキーニーの講義に出席し、ビージューリーとワリー・アル＝イラーキーのもとで法学を修め、『ムフタサル』の論理学などをイッズ・イブン・ジャマーアから学び、多くの学芸でビサーティーに師事した。ハマーでジャマール・イブン・ハティーブ・アル＝マンスーリーヤに出会い、彼からも法学、さらに法源学とアラビア語学を学び、後二者はアラー・イブン・アル＝ムガッリーからも学んだ。カイロでイブン・アル＝バッカールとして名高いブルハーン・アッ＝サルマースィーに随伴し、803年ラマダーン月に彼からスーフィーの道を授かった。彼は、743年にタブリーズで、185歳まで生きたと言われるシハーブ・イブン・アン＝ナースィフの師ジャマール・アブドゥッラー・アル＝アジャミーから学んだと語り、〔その師が〕最初に口にしたものはシャイフ・アブド・アル＝カーディル・アル＝カイラーニーの唾液であり、母が連れて行った際に〔カイラーニーが〕口を潤し衣を着せたのだと語ったが、これは真実とは程遠い。本項の主はまた、ザイン・アル＝ハーフィーやその他当時の諸シャイフに随伴し、アラー・アル＝ブハーリーとタキー・アル＝ヒスニーと短時間会い、サアド・ッディーン・アッ＝スーフィーからヒルカを着せられズィクルの伝授を受けた（サアド・ッディーンはイブン・アル＝アラビー系統でヒルカを着ていた）。本人の言によれば、ワリー・アル＝イラーキー、イッズ・イブン・ジャマーア、イブン・ハルドゥーンからハディースを聴聞した。830年からアレッポに定住し、弟子の育成と求道者の指導に専念して一団が彼から学び、同地で威信と栄誉を得、その書簡は好評を博した。私〔サハーウィー〕は同地で彼に会い、その詩を筆録した（詩2篇、原文参照）。タージュ・イブン・ズフラも彼から学び、ガザーリーが神学・スーフィズムの著作で挙げた「七つの務め」に関する彼の詩句を私に伝えた。彼はイマーム、碩学で、雄弁で語り口が流暢、詩文は美しく、聡明で品性・交際・風貌・身なりがよく、話が楽しく機知に富み、語る事柄に通じ、豊かな財産を有し、アレッポに建てた自邸（同市の名邸の一つ）で世間から離れ、法学者の職務などを潔しとせず、各種の商いで自立していた。カラーム学、天文学、文字学、スーフィズムに長じたが、イブン・アル＝アラビーの説に帰されており、そのためブラータンスィーは彼を非難した。私はその自筆にこれを否認する記述を見たが、他方で彼はサイイド・アラー・イブン・アフィーフ・ッディーンに書いたイジャーザの中で自らのヒルカ伝授の系譜を記し、「我らの師ムヒー・ッディーンは幾度もヒルカを着し、七百人ほどの道のシャイフからヒルカ・ズィクル・礼法を授かったと伝えられる」と述べ、その一端を引いている。神がその真相をご存じである。幾度も巡礼し、830年代にマッカに滞在（ムジャーワラ）し、インドへ行き、遍歴して一時期辺境の要塞で守備に就いた。『ハーウィー・サギール』の一部と、法源学における判官アブー・バクル・アル＝バーキッラーニーの『イルシャード』の一部を注釈し、息子アブー・ッ＝ターヒルのために『イブン・マーリクのアルフィーヤ』全体に語法分析を施し、信仰原理論の『ブルハーニーヤ』を注釈し、スーフィー用語に関する書『マンシャ・アル＝アガーリート』を著し、旅行記を一巻にまとめ、信条書も著した（その中でスンナとジャマーアに反するすべてから自らを切り離した）。彼はその栄誉を保っていたが、アレッポに大疫病が起こり、子・家族・従者の大半を失って悲嘆し、アレッポの巡礼隊とともにマッカ隠棲を志して出立した。シリアで体調を崩した彼にイブン・アッ＝サイイド・アフィーフ・ッディーンが会うと、「マッカ隠棲を決意していたが、今は預言者の町マディーナへの隠棲の望みがいっそう心に湧いた」と語り、その通りとなった。すなわち不調のまま同地に入った当日、863年ズー・ル＝カアダ月20日火曜に没し、預言者の庭（ラウダ）で葬礼が営まれた後バキーウに葬られた。神が彼を憐れみ赦したまえ。学識あるジャラール・ッディーン・イブン・アン＝ナスィービーの娘婿が「太陽よ、日蝕がお前を隠した……」に始まる哀悼詩を詠んだ。
  en: Muḥammad b. Muḥammad b. ʿAlī b. Aḥmad b. Abī Bakr b. Ismāʿīl b. Aḥmad b. ʿAlī Ibn Ibrāhīm, al-Shams al-Mujāhidī al-Ayyūbī (being a descendant of al-Ṣalāḥ Yūsuf b. Ayyūb; he sometimes wrote al-Ṣāliḥī al-Ayyūbī), of Ḥamā then Aleppo, Shāfiʿī, Sufi, known as Ibn al-Shammāʿ. Born at the start of 791 in Ḥamā; moved as a child with his father to Egypt, where he memorised the Qurʾān, al-Tanbīh and the first quarter of al-Muhadhdhab. He attended the lessons of al-Sirāj al-Bulqīnī, studied fiqh with al-Bījūrī and al-Walī al-ʿIrāqī, took the logic of the Mukhtaṣar from al-ʿIzz Ibn Jamāʿa, and kept company with al-Bisāṭī in many disciplines. In Ḥamā he met al-Jamāl Ibn Khaṭīb al-Manṣūriyya, from whom he took fiqh, uṣūl and Arabic, the latter two also from al-ʿAlāʾ Ibn al-Mughallī. In Cairo he accompanied al-Burhān al-Salmāsī, famous as Ibn al-Baqqāl, and took from him the Sufi path in Ramaḍān 803. He claimed to have studied at Tabriz in 743 with al-Jamāl ʿAbd Allāh al-ʿAjamī, shaykh of al-Shihāb
    Ibn al-Nāṣiḥ who was said to have lived 185 years, and told other tales of ʿAbd al-Qādir al-Kīlānī, all far from the truth. He also accompanied al-Zayn al-Khāfī and other shaykhs of the time, met al-ʿAlāʾ al-Bukhārī and al-Taqī al-Ḥiṣnī briefly, and was invested with the khirqa and instructed in dhikr by Saʿd al-Dīn al-Ṣūfī, in the line of Ibn al-ʿArabī. He said he heard ḥadīth from al-Walī al-ʿIrāqī, al-ʿIzz Ibn Jamāʿa and Ibn Khaldūn. He settled in Aleppo from 830, devoting himself to training disciples; a group took from him, and he gained standing there. I met him there and wrote down his verse; al-Tāj Ibn Zuhra also took from him. He was a learned imam, eloquent, a fine poet and prose writer, intelligent, of good character and appearance, wealthy, living apart in the house he built in Aleppo, disdaining jurists' posts and living by trade; expert in kalām, astronomy, the science of letters and Sufism, but suspected of Ibn al-ʿArabī's doctrine, for which al-Balāṭunsī attacked him
    — though I saw in his hand a disavowal, even as he cited in an ijāza for al-Sayyid al-ʿAlāʾ Ibn ʿAfīf al-Dīn his khirqa chain through Ibn al-ʿArabī. He performed the pilgrimage several times, resided in Mecca after 830, visited India, travelled and garrisoned frontier posts. He wrote commentaries on part of al-Ḥāwī al-Ṣaghīr and of al-Bāqillānī's Irshād, parsed the whole Alfiyya of Ibn Mālik for his son Abū al-Ṭāhir, commented on al-Burhāniyya in theology, composed Manshaʾ al-Aghālīṭ on Sufi terminology, a travel account and a creed. After a great plague in Aleppo killed most of his children, family and servants, he set out for Mecca with the Aleppo caravan, but, falling ill, resolved instead on Medina, where he died on the day of his arrival, Tuesday 20 Dhū al-Qaʿda 863, and was buried in al-Baqīʿ after prayers in the Prophet's Rawḍa. The son-in-law of Jalāl al-Dīn Ibn al-Naṣībī elegised him.
