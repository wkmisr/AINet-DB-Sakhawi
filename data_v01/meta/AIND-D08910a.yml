  trigger: rule
  mention: m52
notes:
- text: ニスバ المجاهدي・الأيوبي は「لكونه من ذرية الصلاح يوسف بن أيوب」（サラーフ・ッディーンの子孫）に由来し、「وربما كتب الصالحي الأيوبي」。
  lang: ja
- text: 人物評：イマーム・碩学、雄弁で詩文に優れ、聡明で品行・交際・容姿・服装がよく、話術に富み、豊かな財産を持ち、アレッポに自ら建てた邸宅（同市の名邸の一つ）に隠棲し、法学者の職務を潔しとせず商業で自立。カラーム・天文学・文字学（الحرف）・スーフィズムに長じたが、イブン・アラビー説への傾倒を疑われた（サハーウィーはその筆跡に否認の証拠を見た一方、イジャーザ中に ابن العربي がヒルカを授かった七百人の師云々と記すのを引く）。詩4句（原文参照）。
  lang: ja
