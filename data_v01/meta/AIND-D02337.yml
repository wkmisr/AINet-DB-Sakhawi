translation:
  ja: ジャー・アッラーフ・ブン・アブドゥッラー・アル＝マッキー・アル＝ムアッディブ。シャウワール月、818年（ヒジュラ暦）に同地（メッカ）で死去し、アル＝ムアッラー墓地に埋葬された。イブン・ファハドが、イブン・ムーサーの筆録に基づいて彼を記録した。
  en: Jār Allāh b. ʿAbd Allāh al-Makkī al-Muʾaddib. He died there (Mecca) in Shawwal in the year 818 AH and was buried in al-Muʿallā. Ibn Fahd chronicled him, based on the handwriting of Ibn Mūsā.
