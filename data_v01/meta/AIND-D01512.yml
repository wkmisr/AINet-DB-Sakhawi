translation:
  ja: アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ウバイド、アブー・アル＝バラカート・ブン・アビー・サアド・ブン・アル＝カッターン。彼の父は後述（別項）。父は彼に心を配り、クルアーンを読ませ、ハディースを聴聞させた。彼は私（サハーウィー）から聴聞した者の一人で、父の後にサイード・アッ＝スアダー（修道院）などの職を継承した。
  en: Aḥmad b. Muḥammad b. Muḥammad b. ʿUbayd, Abū al-Barakāt b. Abī Saʿd b. al-Qaṭṭān. His father is mentioned later (separately entered). His father cared for him, had him read the Qurʾān, and had him hear ḥadīth. He is among those who heard from me (al-Sakhāwī), and he succeeded his father at Saʿīd al-Suʿadāʾ and elsewhere.
