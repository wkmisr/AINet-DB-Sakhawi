translation:
  ja: アハマド・ブン・ムハンマド・ブン・アリー・ブン・フサイン・アル＝ハンキー、次いでアル＝カーヒリーでシャーフィイー派法学者。アル＝バイバルスィーヤに居住した。彼は少し働いた後、イブン・アッ＝シャイフ・ユーセフ・アッ＝サフィーに師事し、私（＝サハーウィー）から集団で聴聞し、バーブ・アル＝フトゥーフの外にあるハンバル派の店に座していたが、特に問題はなかった。
  en: Aḥmad b. Muḥammad b. ʿAlī b. Ḥusayn al-Khānkī, then al-Qāhirī, a Shāfiʿī. He resided in al-Baybarsiyya. He worked a little, accompanied Ibn al-Shaykh Yūsuf al-Ṣafī, heard from me (al-Sakhāwī) in a group, and used to sit in a Hanbalī shop outside Bāb al-Futūḥ. He was not bad.
