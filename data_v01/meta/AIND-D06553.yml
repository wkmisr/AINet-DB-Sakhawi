translation:
  ja: ムハンマド・アル＝イッズ・アッ＝タイイブ・ブン・イブラーヒーム・ブン・ムハンマド・ブン・イーサー・ブン・ムタイル、アル＝ハカミー、アル＝ヤマーニー。既出のイブラーヒームの父。法学を修め、ハディースとタフスィールを聴いた。兄弟ムハンマドの後に没した。
  en: Muḥammad al-ʿIzz al-Ṭayyib b. Ibrāhīm b. Muḥammad b. ʿĪsā b. Muṭayr al-Ḥakamī al-Yamānī, father of the Ibrāhīm mentioned above. He studied jurisprudence and heard ḥadīth and tafsīr. He died after his brother Muḥammad.
