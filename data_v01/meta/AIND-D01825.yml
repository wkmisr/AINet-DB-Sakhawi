translation:
  ja: アハマド・アル＝カズウィーニー、後にアル＝マッキー。彼は「アル＝ハワージャ・ミール・アハマド」（ミールはミームの字）とも呼ばれた。858年ムハッラム月朔の夜にメッカで急死した。イブン・ファハドが彼について年代記を記し、その補遺では彼の父がフサイン・ブン・ムハンマドであると記されている。彼はメッカとジッダに邸宅（ドール）を有しており、気性が荒く傲慢で、エジプトに入ってトルコ人と交際していた。
  en: Aḥmad al-Qazwīnī, then al-Makkī. He was also known as al-Khawājā Mīr Aḥmad (Mīr spelled with mīm). He died suddenly in Mecca on the eve of the first of Muḥarram in the year 858 H. Ibn Fahd recorded his biography and mentioned in his dhayl that his father was Ḥusayn b. Muḥammad. He had properties (dūr) in Mecca and Jeddah, was ill-tempered and arrogant, and was among those who entered Egypt and associated with the Turks.
