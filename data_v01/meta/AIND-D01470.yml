translation:
  ja: アフマド・ブン・ムハンマド・ブン・ファンドゥー、ラカブはアル＝ムザッファル・シャー。インドのベンガルの君主（صاحب）であり、その君主（＝父）の子でもある。すなわちアル＝ジャラール（＝父ムハンマド）の子。837年、14歳のときに父の後を継いで（ベンガルの君主として）擁立された。
  en: Aḥmad b. Muḥammad b. Fandū, al-Muẓaffar Shāh, lord (ṣāḥib) of Bengal in India and son of its lord — i.e. son of al-Jalāl (his father Muḥammad). He was installed (as ruler) after his father in 837 H, when he was fourteen years old.
