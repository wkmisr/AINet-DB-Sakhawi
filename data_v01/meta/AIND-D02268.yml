translation:
  ja: タグリー・ビルディー・タタル・アッ＝ザーヒリー・ジャクマク。マムルーク軍人として昇進し（تقدمة）、のちに侍従長（ḥujūbīyat al-ḥujjāb）に就任した。また、幾度かの軍事遠征に参加し、ある年には巡礼キャラバンの指揮官（amīr al-maḥmal）としてハッジ（巡礼）を行った。ヒジュラ暦893年シャアバーン月、戦闘に向かう前に、ハラブ（アレッポ）の病床において没した。彼が要請されることなく自ら遠征に出発し、そのことで他のアミールたちから孤立したため、スルタンが彼に対して呪いの祈りを捧げた（あるいは彼を非難した）という噂が私に届いている。
  en: Taghrī Birdī Ṭaṭar al-Ẓāhirī Jaqmaq. He was promoted to a command position (Taqdima) and later appointed to the office of chief chamberlain (ḥujūbīyat al-ḥujjāb). He participated in several military campaigns and in some years performed Hajj as the commander of the pilgrimage caravan (amīr al-maḥmal). He died in Sha'bān of the year 893 AH on his bed in Aleppo before they set out for battle. It reached me that when he went out for the campaign without being requested and isolated himself from the other amirs in doing so, the Sultan prayed against him.
