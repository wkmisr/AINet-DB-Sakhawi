translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・アリー・ブン・アル＝カマール・ムハンマド・ブン・アビー・アッ＝スウード・ムハンマド・ブン・フサイン・アッ＝シハーブ。彼（アフマド）は、ヒジャーズの学者にしてその長であるアル＝ブルハーン・イブン・ザヒーラの息子で、マッカ出身のシャーフィイー派である。彼はヒジュラ暦875年ズル＝ヒッジャ月10日の金曜日に生まれた。彼の母は父の女奴隷であったヌール・アッ＝サバーフ・アル＝ハバシーヤであった。彼はクルアーン、アル＝ミンハージ、アル＝アルフィーヤ、ジャムウ・アル＝ジャワーミウを記憶して育った。彼は父から聴聞し、兄のアル＝ジャマーリーの講義にも出席した。また、アッ＝サイイド・アル＝カマール・ブン・ハムザが897年に（マッカに）滞在（ムジャーワラ）した際には、そのもとで『アル＝イルシャード』の講義に出席した。彼は私（サハーウィー）のもとで『ブハーリー』を読誦したが、それに先立ち、父の存命中にも死後にも私からいくつかのことを聴聞していた。また、アラビア語学・語形論・法源学を名士たちから学んだ。
  en: Aḥmad b. Ibrāhīm b. ʿAlī b. al-Kamāl Muḥammad b. Abī al-Suʿūd Muḥammad b. Ḥusayn al-Shihāb, son of the scholar and head of the Hijaz, al-Burhān b. Ẓahīra, al-Makkī al-Shāfiʿī. He was born on Friday, the tenth of Dhū al-Ḥijja in the year 875. His mother was Nūr al-Ṣabāḥ al-Ḥabashiyya, his father's handmaiden. He grew up having memorized the Qurʾān, al-Minhāj, al-Alfiyya, and Jamʿ al-Jawāmiʿ. He heard (texts) from his father and attended the lessons of his brother al-Jamālī. He also attended (the reading of) al-Irshād under al-Sayyid al-Kamāl b. Ḥamza when the latter sojourned (jāwara) [in Mecca] in the year 897. He recited al-Bukhārī to me (al-Sakhāwī), after having heard various things from me both during his father's lifetime and after it, and (he studied) with notables in Arabic grammar, morphology, and uṣūl.
