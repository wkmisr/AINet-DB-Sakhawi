translation:
  ja: アフマド・ブン・アブドゥルガニー・ブン・アブドゥルラッザーク・ブン・アビー・ルファラジュ・アッ＝シハーブィー・ブン・アルアミール・ファフルッディーン・ブン・アルワズィール・タージュッディーン。彼はキトヤーの統治者を務め、ハッジを行った。彼はヒジュラ暦857年ムハッラムの初めにキトヤーで熟年期に死去し、移送されマドラサの彼らの墓地に埋葬された。
  en: Aḥmad b. ʿAbd al-Ghanī b. ʿAbd al-Razzāq b. Abī al-Faraj al-Shihābī b. al-Amīr Fakhr al-Dīn b. al-Wazīr Tāj al-Dīn. He governed Qiṭyā and performed the Hajj. He died in middle age in Qiṭyā in early Muḥarram 857 H. He was transported and buried in their cemetery adjacent to the madrasa.
