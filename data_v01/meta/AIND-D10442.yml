translation:
  ja: ユースフ・ブン・アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・アブド・アル＝カリーム・ブン・ユースフ、アッ＝ズバイリー、アル＝バスリー、のちアル＝マッキー。そのおじアブド・アル＝カリームは既出。ドゥライムとして知られる。（8）54年ズー・アル＝ヒッジャ月にマッカで没した。イブン・ファハドがその没年を記している。
  en: Yūsuf b. Aḥmad b. Muḥammad b. Muḥammad b. ʿAbd al-Karīm b. Yūsuf, al-Zubayrī, al-Baṣrī, then al-Makkī, whose paternal uncle ʿAbd al-Karīm has been mentioned above; known as Dulaym. He died in Dhū al-Ḥijja of the year [8]54 in Mecca. Ibn Fahd recorded his death.
