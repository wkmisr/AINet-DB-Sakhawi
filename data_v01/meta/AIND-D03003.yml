translation:
  ja: ラシード・ブン・アブドゥッラー、アル＝ハーッジュ、ラシード・アッ＝ディーン・アル＝ファフディー・アル＝バハーイー。預言者聖モスク（マディーナ）のファッラーシュ（敷物係）の一人。ヒジュラ暦812年、「アッ＝シハービーヤ学院」として知られるアブー・アイユーブ・アル＝アンサーリーの家の、預言者の雌駱駝が膝を折った地（マブラク・アン＝ナーカ）で、アル＝イッズ・ブン・ジャマーアからジュズウ（ハディース分冊）を聴聞した。読誦したのはアッ＝シャラフ・アブー・アル＝ファトフ・アル＝マラーギーで、彼（マラーギー）はラシードを「敬虔で善良なシャイフ」と評している。
  en: Rashīd b. ʿAbd Allāh, al-Ḥājj Rashīd al-Dīn al-Fahdī al-Bahāʾī. One of the farrāshūn (attendants/servants) in the Prophet's Mosque. He heard a juzʾ (hadith part) from al-ʿIzz b. Jamāʿa, which was read to him by al-Sharaf Abū al-Fatḥ al-Marāghī in the year 812 AH at the place where the Prophet's she-camel knelt (Mabrak al-Nāqa), at the house of Abū Ayyūb al-Anṣārī (known as al-Madrasa al-Shihābiyya). He (al-Marāghī) described him as a pious and righteous shaykh.
