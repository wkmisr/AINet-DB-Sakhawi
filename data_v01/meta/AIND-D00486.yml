  en: Aḥmad b. Aḥmad b. Jawghān (spelled with jīm, then wāw, then a dotted letter, and ending in nūn), al-Shādhilī, the Preacher, a resident of Mecca, and one of those who held the office of mashyakhat al-Zamāmiyya. He died in Rabīʿ al-Ākhir in the year 850.
