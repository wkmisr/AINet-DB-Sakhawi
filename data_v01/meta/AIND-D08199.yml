translation:
  ja: ムハンマド・ブン・アリー・ブン・マフムード、アッ＝シャムス・ブン・アッ＝タージュ・ブン・アン＝ナジュム、アル＝ウマリー・アル＝キーラーニー・アル＝ハンバリー。我らがシャイフ（イブン・ハジャル）のもとで、アル＝ファトヒーの朗読により『アル＝ムタバーイナート』（刊本の綴りはアル＝ムブターイナート）を聴聞した者の一人で、彼（イブン・ハジャル）は彼を「学者（アル＝アーリム）」と評した。同じく彼のもとで研究（バハス）形式で『ハディースのアルフィーヤ注釈』の多くを聴聞し、彼（イブン・ハジャル）はタブリーグ（聴講記録への書き付け）において彼を「シャイフ」と称した。さらに彼のもとでアッ＝ティービーの『フラーサ』を研究形式で講読し、またナワウィーの『四十ハディース』を講読した。
  en: Muḥammad b. ʿAlī b. Maḥmūd, al-Shams b. al-Tāj b. al-Najm, al-ʿUmarī al-Kīlānī al-Ḥanbalī. He was among those who heard al-Mutabāyināt (spelled al-Mubtāyināt in the edition) from our shaykh (Ibn Ḥajar) through the recitation of al-Fatḥī, and he (Ibn Ḥajar) described him as "the scholar (al-ʿālim)". He likewise heard from him, in study sessions (baḥth), much of the commentary on the Alfiyyat al-Ḥadīth, and he (Ibn Ḥajar) styled him "shaykh" in the tablīgh (the attestation note); indeed he read before him al-Khulāṣa of al-Ṭībī in study, and the Forty of al-Nawawī.
