- text: '同名・同ラカブの「الشمس محمد الكيلاني نائب الإمام بمقام الحنبلي」（#AIND-D00687 の妻の父、ID-Master では TMP-P-000246）が corpus にあるが、本項にはナサブ以外の識別要素（マッカ・職）がなく、ラカブ＋ニスバ＋学派の一致だけでは規則57 の下限に達しないため同定しない（候補として ISSUES に記録）。ハンバリー派のキーラーニー家の別人 #AIND-D07038（الجمال محمد بن أحمد الكيلاني المكي الحنبلي نائب الإمام بالمقام الحنبلي）は父名・ラカブが異なる。'
