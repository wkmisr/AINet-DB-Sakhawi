translation:
  ja: イーナール・アル＝ジャラーリー、またの名をイーナール・アル＝ミンカール。シャイフとナウルーズが（ガザに）入城した813年シャアバーン月に、ガザで死去した。我らがシャイフ（イブン・ハジャル）が『インバーウ』に彼の没年を記録している。
  en: Īnāl al-Jalālī, also called Īnāl al-Minqār. He died in Ghazza in Shaʿbān 813, when Shaykh and Nawrūz entered it. Our shaykh (Ibn Ḥajar) recorded his death in his Inbāʾ.
