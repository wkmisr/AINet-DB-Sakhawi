translation:
  ja: ムハンマド・ブン・アリー、シャイフ・ジャマール・アッ＝ディーン・アル＝ハッダード、サーヒブ・アッ＝ディラーウとして知られる。891年シャウワール月のうちに没した。バヌー・ターヒル（ターヒル朝）の君主たちのもとで威望があり、彼らのもとで並外れた権勢を有していたため、彼の仲介によって多くの事柄が処理され、人に益を与えもし害を与えもした。アッラーが彼を赦されますように。このことはジャマール・ムーサー・アッ＝ドゥアーリーがイエメンから私（サハーウィー）に書き送ってきた。
  en: Muḥammad b. ʿAlī, al-Shaykh Jamāl al-Dīn al-Ḥaddād, known as Ṣāḥib al-Dirāʿ. He died in the course of Shawwāl of the year [8]91. He enjoyed prestige with the kings of the Banū Ṭāhir and had such excessive influence with them that many matters were settled through his mediation, and he brought both benefit and harm. May God pardon him. Al-Jamāl Mūsā al-Duʾālī wrote to me (al-Sakhāwī) about this from Yemen.
