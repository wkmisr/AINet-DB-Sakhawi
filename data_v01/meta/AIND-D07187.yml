translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・スライマーン・ブン・イスマーイール・ブン・ユースフ・ブン・ウスマーン・ブン・イマード、アレッポ出身の家系でカイロの人、前述のアブド・アッ＝ラティーフの兄弟で、バヌー・アル＝アジャミーの外孫。イブン・アル＝ジャザリーから聴聞した者の一人。
  en: Muḥammad b. Abī Bakr b. Sulaymān b. Ismāʿīl b. Yūsuf b. ʿUthmān b. ʿImād, of Aleppine origin, al-Qāhirī, the brother of ʿAbd al-Laṭīf, mentioned above, and a daughter's son of the Banū al-ʿAjamī. He was among those who heard from Ibn al-Jazarī.
