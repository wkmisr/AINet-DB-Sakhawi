translation:
  ja: サダカ・ブン・シリー・アッ＝ディーン・ムハンマド・ブン・サダカ・アル＝ムハッリキー、のちにアル＝カーヒリー、アル＝アズハリー。優れた人物であったアブド・アッ＝ラヒームとその弟アブド・アッ＝カーディルの父。仕立屋を営む敬虔な人物であった。二人の息子の不在の最中、（ヒジュラ暦）886年ラビーウ・アル＝アーヒル月に没した。アズハル・モスクで葬儀礼拝が執り行われ、称賛された。彼に神の慈悲がありますように。
  en: Ṣadaqa b. Sirī al-Dīn Muḥammad b. Ṣadaqa al-Muḥriqī, then al-Qāhirī al-Azharī. He was the father of the virtuous ʿAbd al-Raḥīm and his brother ʿAbd al-Qādir. He was a good man who earned his living as a tailor. He died during the absence of both of his sons in Rabīʿ al-Ākhir, the year 886 AH. The funeral prayer was performed for him at al-Azhar Mosque, and he was highly praised. May God have mercy on him.
