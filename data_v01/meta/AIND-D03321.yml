translation:
  ja: シャアバーン・アブー・ラジャブ。善良で信心深い庶民。集団礼拝、特にマンクータムリーヤ・マドラサでの暁の礼拝（スブフ）を絶やさず、礼拝に通う際にはいつもランプを携え、そこの人々を照らした。ヒジュラ暦856年に死去。神の慈悲あれ。
  en: Sha'bān Abū Rajab. A good and pious commoner who regularly attended congregational prayers, particularly the dawn prayer (ṣubḥ) at the Mankūtamuriyya Madrasa. He never failed to bring a lamp with him when coming to it, which the people there would use for light. He died in the year 856 AH. May Allah have mercy on him.
