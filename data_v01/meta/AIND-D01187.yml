translation:
  ja: アフマド・ブン・ムハンマド・ブン・イブラーヒーム、アル＝ハワージャー、シハーブ・アッ＝ディーン、アル＝キーラーニー・アル＝マッキー。シュフタラーシュ（語頭のシーンにダンマ、続く字はファーまたはバー）として知られる。この語はペルシア語で「理髪師」を意味する。彼は867年サファル月5日の金曜日の夜（＝木曜の日没後）にマッカで亡くなった。イブン・ファフドがその没年月日を記録している。彼は祝福された人物であり、会衆の礼拝に率先して参加することを熱心に望んだ。
  en: Aḥmad b. Muḥammad b. Ibrāhīm al-Khawāja Shihāb al-Dīn al-Kīlānī al-Makkī. He was also known as Shuftarāsh — with ḍamma on the shīn, and either fāʾ or bāʾ [as the second letter] — which in Persian means 'the barber'. He died in Mecca on the eve of Friday (laylat al-jumʿa), the 5th of Ṣafar, in the year 867 AH. Ibn Fahd recorded his death date. He was a blessed person and was eager to participate in congregational prayers.
