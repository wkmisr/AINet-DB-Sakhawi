translation:
  ja: アハマド・ブン・イブラーヒーム・ブン・アハマド・ブン・ムハンマド・アッ＝シハーブ・イブン・アル＝ハターティー（点なしのハーと二つのターで、シャッダなしに読む）、商人にして商人の子であった。彼は勉学に励む生徒たちと肩を並べて学び、アル＝アブナーシーらのもとで授業に出席した。時には、素早い行動力と親愛の情、そして決断力を示しながら私（サハーウィー）のもとへも訪れた。彼は交易のために何度かマッカへ旅し、長期滞在した。ヒジュラ暦893年ジュマーダー・アル＝ウーラー月に死去した。彼はタージ・アル＝ディーン・ブン・アブド・アル＝ガニー・イブン・アル＝ジーアーンに遺言を託した。伝えられるところによれば、彼は非常に多くの財産を残し、その中から王に千金が献上されたという。アブド・アル＝アズィーズ・アル＝ウカイリーは彼の娘と結婚しており、彼らの死は近接していた。
  en: Aḥmad b. Ibrāhīm b. Aḥmad b. Muḥammad al-Shihāb Ibn al-Ḥatātī (with unpointed ḥāʾ and two tāʾs, without doubling), a merchant and son of a merchant. He associated closely with students of knowledge and attended the lessons of al-Abnāsī and others. Sometimes he would visit me (al-Sakhāwī), showing quick activity, affection, and resolve. He traveled to Mecca repeatedly for trade and stayed there for an extended period. He died in Jumādā al-Ūlā in the year 893 AH. He entrusted his will to Tāj al-Dīn b. ʿAbd al-Ghanī Ibn al-Jīʿān. It is said that he left a great deal of wealth, so much so that a thousand (dinars/dirhams) from it were presented to the ruler. ʿAbd al-ʿAzīz al-ʿUqaylī had married his daughter, and their deaths were close together.
