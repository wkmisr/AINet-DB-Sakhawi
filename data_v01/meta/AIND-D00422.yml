- text: A merchant and the son of a merchant, he used to press in among the students of knowledge and attend al-Abnāsī and the like. He is said sometimes (rubbamā) to have come to al-Sakhāwī as well, showing quickness, affection and resolve; how substantial the discipleship was is unclear.
  lang: en
