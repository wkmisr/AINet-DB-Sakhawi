translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・イスマーイール。マッキー、ハルワーニー。彼の父は香料商人で、彼（イブラーヒーム）はアル＝ヒジャーリーとして知られる。714年にアッ＝ザイン・アル＝マラーギーから『アル＝ムサルサル』などを聴聞した。778年ムハッラム月に没した。
  en: Ibrāhīm b. Muḥammad b. Ismāʿīl al-Makkī al-Ḥulwānī. His father was a perfumer, and he (Ibrāhīm) was known as al-Ḥijāzī. He heard al-Musalsal and other works from al-Zayn al-Marāghī in 714 H. He died in Muḥarram 778 H.
