translation:
  ja: ムハンマド・ブン・アイユーブ・ブン・サイード・ブン・アラウィー、ヒスバーン出身でダマスクスの人、シャーフィイー派、父は前述。77X年に生まれ、クルアーン、イブン・アブド・アル＝ハーディーの『アル＝ムハッラル』、『アル＝ミンハージュ』などを暗記した。アッ＝シハーブ・アッ＝ズフリー、アッ＝シュライシー、アッ＝サルハディーらに法学を学び、アル＝マルカーウィーに師事して彼のもとで『アル＝ミンハージュ』の大部分を読んだ。法学とハディース学に熟達し、ジャーミウ（金曜モスク）で教授の座に着き、学生たちは彼から益を得た。陰口や嫉妬の少ない人で、それどころか誰にも嫉妬したことがないと誓ったほどであった。819年ラビーウ第2月にペストで没した。我らがシャイフ（イブン・ハジャル）が『インバー』でそう述べている。
  en: Muḥammad b. Ayyūb b. Saʿīd b. ʿAlawī, of Ḥisbān origin, al-Dimashqī, the Shāfiʿī, whose father has been mentioned. He was born in the 770s and memorised the Qurʾān, al-Muḥarrar of Ibn ʿAbd al-Hādī, al-Minhāj and other works. He studied fiqh under al-Shihāb al-Zuhrī, al-Shurayshī, al-Ṣarkhadī and others, and attended al-Malkāwī assiduously until he had read most of al-Minhāj with him. He became proficient in fiqh and ḥadīth, sat to teach in the Jāmiʿ, and the students benefited from him. He was little given to backbiting and envy; indeed he swore that he had never envied anyone. He died of the plague in Rabīʿ II 819. So said our shaykh (Ibn Ḥajar) in his Inbāʾ.
