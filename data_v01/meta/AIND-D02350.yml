translation:
  ja: ジャンバク・アッ＝サイフィー・アクブルディー、次いでアル＝アシュラフィー・バルスバーイ。アッ＝サルガトミシーヤの集団の一員であるナーシル・アッ＝ディーン・ムハンマドの父。ヒジュラ暦891年ジュマーダー・アル＝ウーラー月2日の夜に亡くなった。
  en: Jānbak al-Sayfī Aqburdī, then al-Ashrafī Barsbāy, father of Nāṣir al-Dīn Muḥammad, one of the jamāʿa of al-Ṣarghatmashiyya. He died on the night of the second of Jumādā al-Ūlā in the year 891 AH.
