translation:
  ja: ウスマーン・アン＝ナースィフ（写字生）、アル＝カアキーイーンの証人（公証人）の一人。（8）98年にジッダ代官に随行し、そのイマーム職などを務めて海路でマッカに来た者の一人で、その後、彼とともに巡礼団に加わって帰る途中、翌年のムハッラム月に道中で没した。私の著作のいくつかを書写しており、悪くない人物であった。アズダムル・ティムサーフのもとにもいたと言われる。
  en: ʿUthmān al-Nāsikh (the copyist), one of the witnesses (notaries) at al-Kaʿkiyyīn. He was among those who came to Mecca by sea in (8)98 in the company of the deputy governor of Jidda, serving as his imām and in other capacities; he then went back with him in the caravan and died on the way in Muḥarram of the following year. He had copied some of my works, and he was not a bad man. It is said that he had also been in the service of Azdamur Timsāḥ.
