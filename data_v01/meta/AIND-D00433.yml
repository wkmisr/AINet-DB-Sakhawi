translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・スライマーン・ブン・イブラーヒーム、シャハーブ（ラカブ）。カリユーブ出身、のちカイロ住。後述するアリーの兄弟。およそヒジュラ暦780年代生まれ。ヒジュラ暦794年にムタルリズィー、タキー・アッ＝ダジュウィー、シャラフ・ブン・アル＝カウィクから、アブー・ダーウードの伝承（『スンナ』）を聴聞し、またハディースを伝えた。多くの識者たちが彼から聴聞した。私（＝サハーウィー）も彼から聴聞した。彼はサイード・アッ＝スアダー（ハーンカー）のスーフィーの一人であり、またシャバーラー（と呼ばれる品）などを売って生計を立てていた。善良で柔和な人柄であった。ヒジュラ暦868年のラマダーン初頭に亡くなった。神が彼と私たちを憐れみたまわんことを。
  en: Aḥmad b. Ibrāhīm b. Sulaymān b. Ibrāhīm al-Shihāb al-Qalyūbī, then al-Qāhirī, brother of the forthcoming ʿAlī. He was born approximately in the 780s AH (after 780 or before it). In 794 AH, he heard the narrations from Abū Dāwūd from al-Muṭarrizī, al-Taqī al-Dajwī, and al-Sharaf b. al-Kuwayk, and he transmitted ḥadīth. Many eminent scholars heard from him, and I (al-Sakhāwī) heard from him. He was one of the Sufis at Saʿīd al-Suʿadāʾ and earned a living by selling shibārā and similar items. He was known for his goodness and gentleness. He died in early Ramaḍān in the year 868 AH. May God have mercy on him and on us.
