translation:
  ja: ムハンマド・ブン・ダーウード・ブン・ムハンマド・ブン・ダーウード、アッ＝シャムス、アブー・アブドゥッラー、アル＝ムカイスィー――ミーム、カーフ、無点のスィーンで縮小形、ハウラーンの諸村の一つ（ムカイス）に由来する――、アッ＝ディマシュキー、シャーフィイー派。おそらくヒジュラ暦797年に生まれ、アーイシャ・ビント・イブン・アブド・アルハーディーらから聴聞し、法学を修めて教えた。ダマスクスで代理裁判官（ナーイブ・アル＝カーディー）を務め、アブー・アル＝アッバース・アル＝マクディスィーをはじめ複数の者が彼から学んだ。アル＝ビカーイーは彼を「アッラーマ（大学者）」と評した。840年サファル月19日日曜の夜にダマスクスで没し、バーブ・アッ＝サギール墓地に葬られた。アッラーが彼を慈しまれますように。
  en: Muḥammad b. Dāwūd b. Muḥammad b. Dāwūd, al-Shams Abū ʿAbd Allāh al-Mukaysī — with mīm, kāf and undotted sīn, in the diminutive, from one of the villages of Ḥawrān — al-Dimashqī, the Shāfiʿī. He was born presumably in 797 AH, heard from ʿĀʾisha bint Ibn ʿAbd al-Hādī and others, studied jurisprudence and taught. He served as deputy judge in Damascus, and more than one person studied under him, among them Abū al-ʿAbbās al-Maqdisī; al-Biqāʿī described him as "al-ʿallāma". He died on the night of Sunday, 19 Ṣafar 840 AH, in Damascus, and was buried in the cemetery of Bāb al-Ṣaghīr. May God have mercy on him.
