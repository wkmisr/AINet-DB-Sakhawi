translation:
  ja: ウマル・ブン・ヤフヤー・ブン・スライマーン・アル＝ブースィーリー・アル＝ガムリー、説教師の子の説教師。貧者（ファキール）で、（8）71年に巡礼し、私とともに滞在（ムジャーワラ）して、口述（イムラー）その他で私に師事した。彼はクルアーンを読誦する者の一人である。
  en: ʿUmar b. Yaḥyā b. Sulaymān al-Būṣīrī al-Ghamrī, the preacher, son of the preacher. A poor man (faqīr); he performed the pilgrimage and sojourned (jāwara) with me in the year (8)71, and attended me assiduously in the dictation sessions (al-imlāʾ) and other things. He is one of those who recite the Qurʾān.
