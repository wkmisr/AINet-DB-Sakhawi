translation:
  ja: アフマド・ブン・フサイン・ブン・フサイン・ブン・フサイン、渾名シャハーブ・アブー・アルファトフ・ブン・アルファトヒー・アルマッキー。彼は三人の兄弟の真ん中で、彼らの中で最も優れていた。彼は、ハンバル派の法廷でイマームの代官を務めていたシャムス・ムハンマド・アルキーラーニーの娘の夫である。彼は864年ズー・アルヒッジャ月にマッカで生まれ、[ハディースを]聞いた（が伝承者の名前は途中で途切れているため特定できない）。
  en: Aḥmad b. Ḥusayn b. Ḥusayn b. Ḥusayn, al-Shihāb Abū al-Fatḥ b. al-Fatḥī al-Makkī. He was the middle of his three brothers and the best of them. He was the husband of the daughter of al-Shams Muḥammad al-Kīlānī, who served as deputy to the Imam for the Hanbali madhhab. He was born in Dhū al-Ḥijja in the year 864 AH in Mecca and heard from (teachers, text incomplete).
