translation:
  ja: ムハンマド・ブン・ウスマーン・ブン・アフマド、アッ＝シャムス、アル＝ハマウィー、のちアル＝カーヒリー。イブン・アッ＝ザマンの代理人（ワキール）で、彼とともに、また単独でマッカに繰り返し赴いた。それどころか彼はマッカに家を持ち、タワーフを多く行い、彼の学院に隣接する「王の給水所（サビール・アル＝マリク）」を管掌していた。
  en: Muḥammad b. ʿUthmān b. Aḥmad, al-Shams, al-Ḥamawī, then al-Qāhirī, the agent (wakīl) of Ibn al-Zaman, who frequented Mecca both with him and on his own; indeed he owned a house there, performed the circumambulation often, and had charge of the Sabīl al-Malik adjacent to his madrasa.
