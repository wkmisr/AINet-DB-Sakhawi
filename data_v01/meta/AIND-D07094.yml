translation:
  ja: ムハンマド・ブン・イスマーイール・ブン・イブラーヒーム・ブン・ハサン、アル＝ムヒッブ・アブー・アル＝バラカート・ブン・アル＝マジュド・アビー・アル＝フィダー・アル＝カルイー。シャリーフのカリーム・アッ＝ディーン・アブド・アル＝カリーム・ブン・アッ＝シャイフ・アッ＝サーリフ・アル＝ムマッリク・アッ＝ザイン・アビー・バクル・アル＝ハヤーティーの外孫であり、父については前述した。父の庇護のもとで育ち、クルアーンと諸書を暗記して一団の人々に提示した。それどころか父は彼に多くを聴聞させた。私（サハーウィー）から聴聞した者の一人であり、一団の人々が彼にイジャーザを与えた。860年より後に幼くして没した。
  en: Muḥammad b. Ismāʿīl b. Ibrāhīm b. Ḥasan, al-Muḥibb Abū al-Barakāt b. al-Majd Abī al-Fidāʾ al-Qalʿī, the maternal grandson of the Sharīf Karīm al-Dīn ʿAbd al-Karīm b. al-Shaykh al-Ṣāliḥ al-Mumallik al-Zayn Abī Bakr al-Ḥayātī; his father has been mentioned above. He grew up under his father's care, memorized the Qurʾān and some books and presented them to a group of scholars; indeed his father had him hear a great deal. He was among those who heard from me, and a group granted him ijāza. He died young, after 860.
