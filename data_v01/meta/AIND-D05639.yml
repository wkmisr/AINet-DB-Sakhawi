translation:
  ja: アリー・ブン・ムハンマド・アル＝ヤマニー。ジェッダのディーワーンの会計官（ムスタウフィー）。もともとの名はウマルであったが、アッ＝サイイド・ハサンに仕えた際にアリーに改名した。ハジュリー暦840年サファル月に死去。イブン・ファハドが彼について言及している。
  en: Ali b. Muhammad al-Yamani, the financial officer (mustawfi) of the diwan in Jidda. His name was originally Umar, but he changed it to Ali when he entered the service of al-Sayyid Hasan. He died in Safar, the year 840 AH. He was mentioned by Ibn Fahd.
