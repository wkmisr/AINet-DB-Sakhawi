- text: '転送見出し（原文末尾「وسيأتي في الميم」による）。転送先は #AIND-D09883「محمود بن بهاء الدين الكيلاني ويعرف بخواجا سلطان . مات في مستهل رجب سنة خمس وخمسين بمكة . أرخه ابن فهد」（刊本 محمود 部 594 番、未収録）。名（محمود بن بهاء الدين）・ニスバ（الكيلاني）・通称（سلطان／خواجا سلطان）・没日（855年ラジャブ月1日、マッカ）の4点が一致（規則57）。索引 #AIND-D11221「خواجا سلطان هو محمود بن بهاء الدين الكيلاني تقدم」は target にしない。本項の本文にある没日・商人の身分は転送先 D09883 側と同じ（855-07-01＝1451-08-08 金曜、h2g.py で曜日一致）。女性部 #AIND-D13139「زينب ابنة خواجا سلطان محمود بن بهاء الدين الكيلاني المكي」（874没）は同人の娘（D09883 受領時に daughter relation を置くこと）。'
