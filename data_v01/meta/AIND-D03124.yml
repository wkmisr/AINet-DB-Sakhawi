translation:
  ja: スルターン・アル＝キーラーニー。有力な商人の一人で、その名はマフムード・ブン・バハー・アッ＝ディーン。855年ラジャブ月1日の金曜日にマッカで没した。ミームの部で後述する。
  en: Sulṭān al-Kīlānī, one of the esteemed merchants; his name was Maḥmūd b. Bahāʾ al-Dīn. He died in Mecca on Friday, the first of Rajab of the year 855. He will come below under the letter Mīm.
