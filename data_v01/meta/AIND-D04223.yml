translation:
  ja: アブドゥルカーディル・アル＝カスラウィー。アル＝バドリー・アブー・アル＝バカー・イブン・アル＝ジウアーンに身を寄せ、ジャーニム・ビラートに仕えた。彼がハッジ（巡礼）の司令官に任命された際や、シリア（シャーム）地方その他への遠征の際に同行した。一時期、財産没収（ソードラ）の処分を受けた。人当たりが良く、気品を備えていた。
  en: Abd al-Qadir al-Qasrawi. He affiliated himself with al-Badri Abu al-Baqa' bin al-Ji'an and served Janim Bilat, traveling with him during his command of the Hajj pilgrimage, to the region of Syria, and elsewhere. He was subjected to confiscation of his property at one time. He possessed friendliness and decency.
