translation:
  ja: アリー・ブン・ムハンマド、アブー・アルハサン・アッ＝ディムヤートィー、アル＝ムクリ。ダミエッタにあるハサン・ブン・アッ＝タウィール・アッ＝シャヒード・モスクのイマーム。クルアーン朗誦の指導にあたり、タキー・ブン・ワキール・アッ＝スルターンらが彼のもとで朗誦を学んだ。ヒジュラ暦820年シャアバーン月（10月頃）に死去したと言われている。
  en: ʿAlī b. Muḥammad Abū al-Ḥasan al-Dimyāṭī al-Muqriʾ, the prayer leader (imām) of the Mosque of Ḥasan b. al-Ṭawīl al-Shahīd in Damietta. He engaged in teaching Qurʾānic recitation, and among those who recited under him was al-Taqī b. Wakīl al-Sulṭān. It is said that he died in Shaʿbān, the year 820 AH.
