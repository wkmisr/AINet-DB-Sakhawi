translation:
  ja: アブド・アッ＝ラヒーム、シャイフ・アッ＝シュユーフ、アッ＝ザイニー・アル＝マクディスィー・アル＝ハナフィー、イブン・アン＝ナキーブ。805年に生まれ、タンキズィーヤ学院およびアルグーニーヤ学院のシャイフ職を務め、ムアッザミーヤ学院で復習教師（ムイード）を務めた。853年シャアバーン月13日土曜日の午後に没した。
  en: ʿAbd al-Raḥīm, Shaykh al-Shuyūkh, Zayn al-Dīn al-Maqdisī al-Ḥanafī Ibn al-Naqīb. He was born in 805 AH, held the mashyakha of the Tankiziyya and the Arghūniyya, and served as muʿīd at the Muʿaẕẕamiyya. He died on the afternoon of Saturday, 13 Shaʿbān 853 AH.
