translation:
  ja: アリー・ブン・タウアーン。アミール・アーフール（厩舎長）のカーンスーフ・ハムスミア（「五百」の異名を持つカーンスーフ）のダワーダール。私は、彼の父が前述の人物（タウガーン）であり、856年にカラクの総督（ナーイブ）在任中に殺害された者だと考える。彼は主人のもとで昇進し、ジャーミウ・バシュターク（バシュターク・モスク）の近くにある大邸宅を交換取得してそこに住んだ。
  en: ʿAlī b. Ṭawʿān, the dawādār of Qānṣūh Khamsumiʾa ("Qānṣūh Five-Hundred"), the amīr ākhūr (master of the stables). I think that his father is the one mentioned above, and that he [the father] was killed while governor (nāʾib) of al-Karak in the year 856. He advanced in the service of his master, and acquired by exchange the great house near the mosque of Bashtāk and lived in it.
