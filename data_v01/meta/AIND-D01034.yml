translation:
  ja: アフマド・ブン・アリー・ブン・ハイル、シャハーブ・アッ＝カーヒリー。サイード・アッ＝スアダーの（スーフィー）の一人。父親の職業からイブン・アッ＝スッカリーとしても知られている。ザイン・ザカリーヤーとアル＝バクリーのもとで学んだ者の一人で、その後、カマール・アッ＝タウィールなどと一緒に過ごした。彼は巡礼を行い、（サハーウィー）私のもとを頻繁に訪れ、穏やかで高潔な人物であった。
  en: Aḥmad b. ʿAlī b. Khayl, Shihāb al-Qāhirī. One of the Sufis of Saʿīd al-Suʿadāʾ, known as Ibn al-Sukkarī, after his father's craft. He studied under al-Zayn Zakariyyā and al-Bakarī, and then settled with al-Kamāl al-Ṭawīl and others. He performed the pilgrimage and frequented me (al-Sakhāwī), possessing tranquility and good manners.
