translation:
  ja: アハマド・ブン・フサイン・アル＝バスターミー・ブン・アル＝イアザーリー。ハラブ外縁のマシャーリカ地区にあるイブン・アル＝アトアーニー・ザーウィヤのシャイフ。アブー・アムル流のクルアーン朗誦を修め、『ミンハージュ』（al-Minhāj）の四分の一を暗記した。また、マッカに定住してその地で60歳を過ぎて亡くなったシャラフ・アブー・バクル・アル＝ハバシーに師事した。彼自身もまた60歳を過ぎてマッカで亡くなった。
  en: Aḥmad b. Ḥusayn al-Basṭāmī b. al-Iʿzāzī was the shaykh of the Zāwiyat Ibn al-Aṭʿānī in Ḥārat al-Mashāriqa, outside Ḥalab. He mastered Qurʾān recitation according to Abū ʿAmr and memorized a quarter of al-Minhāj. He also kept the company of al-Sharaf Abū Bakr al-Ḥabashī, who was a resident of Mecca and died there after the age of sixty. Aḥmad himself also died in Mecca after the age of sixty.
