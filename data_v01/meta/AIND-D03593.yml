translation:
  ja: アブド・アッ＝ラフマーン・ブン・アフマド・アル＝マダニー・アル＝マーリキー。後出のウマルの兄弟で、アン＝ナフティーとして知られる。その〔学派の〕イマーム〔マーリク〕の『ムワッタア』をガーニム・アル＝ハシャビーのもとで読誦した。アブー・アル＝ファトフ・アル＝マラーギーの後に、アル＝ジャラール・アル＝フジャンディーの娘を娶った。ヒジュラ暦（8）10年には存命であった。
  en: ʿAbd al-Raḥmān b. Aḥmad al-Madanī al-Mālikī, the brother of ʿUmar who is mentioned below, known as al-Nafṭī. He read the Muwaṭṭaʾ of his Imam [Mālik] under Ghānim al-Khashabī, and married the daughter of al-Jalāl al-Khujandī after her marriage to Abū al-Fatḥ al-Marāghī. He was alive in the year [8]10 AH.
