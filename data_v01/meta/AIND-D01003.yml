translation:
  ja: アフマド・ブン・アリー・ブン・アビー・バクル・ブン・ハサン、シャハーブ・ブン・アビー・アル＝ハサン、アル＝シャウバキー出身、アル＝ナフリーリー、アル＝カーヒリー。ザーヒリーヤ・アル＝カディーマの居住者であり、アル＝シャムス・ムハンマド・アル＝ナフリーリー・アル＝マーリキーの父である。ヒジュラ暦856年ラジャブ月に63歳で亡くなった。彼の生涯については彼の息子に関する記述に記載がある。
  en: Aḥmad b. ʿAlī b. Abī Bakr b. Ḥasan, al-Shihāb b. Abī al-Ḥasan, originally from al-Shūbakī, al-Naḥrīrī, al-Qāhirī. He was a resident of al-Ẓāhiriyya al-Qadīma and the father of al-Shams Muḥammad al-Naḥrīrī al-Mālikī. He died in Rajab in the year 856 AH at the age of 63. He is mentioned in his son's biography.
