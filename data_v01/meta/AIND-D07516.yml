translation:
  ja: ムハンマド・ブン・アル＝アッバース・アル＝マグリビー、ティリムサーン（トレムセン）のムフティー。〔ティリムサーンとは〕ベルベル語で「二つのものの結合」を意味する。というのも、その食糧の大半、たとえば小麦、またその果物は二つの種類からなるからである。著作があり、そのうちにイブン・マーリクの『ラーミーヤ』の註釈がある。871年にペストで没した。我々の仲間のあるマグリブ人が私にこれを教えてくれた。
  en: Muḥammad b. al-ʿAbbās al-Maghribī, the muftī of Tilimsān (Tlemcen). In the Berber language its name means "the joining of two things", for most of its foodstuffs, such as wheat, and its fruits are of two kinds. He has writings, among them a commentary on the Lāmiyya of Ibn Mālik. He died of the plague in the year 871. One of our Maghribī companions informed me of this.
