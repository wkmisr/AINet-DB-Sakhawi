translation:
  ja: アブド・アッラー・ブン・アフマド・ブン・ムハンマド・アッ＝サルウィー、のちにアッ＝サフティー、シャーフィイー派。アル＝ガムリーの一団の一人。善良な人物で、学問に励み、（学的議論に）参加し、私（サハーウィー）に『ブハーリー（の真正集）』の多くを読誦した。立派な人物で、現在も存命である。
  en: ʿAbd Allāh b. Aḥmad b. Muḥammad al-Sarawī, then al-Safṭī, al-Shāfiʿī. One of the group (jamāʿa) of al-Ghamrī. A good man who studied, took part (in scholarly exchange), and read to me (al-Sakhāwī) a great deal of al-Bukhārī. An excellent man; he is still among the living.
