translation:
  ja: ムハンマド・ブン・サイフ・ブン・ムハンマド・ブン・ウマル・ブン・ビシャーラ。カイロで殺害され、その皮に藁が詰められ、819年ズー・アル＝ヒッジャ月にサファドへ運ばれた。我らがシャイフ（イブン・ハジャル）も彼に言及している。
  en: Muḥammad b. Sayf b. Muḥammad b. ʿUmar b. Bishāra. He was killed in Cairo; his skin was stuffed with straw and carried to Ṣafad, in Dhū al-Ḥijja of the year 819. Our shaykh (Ibn Ḥajar) also mentioned him.
