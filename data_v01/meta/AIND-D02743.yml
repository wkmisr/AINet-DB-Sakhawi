translation:
  ja: フサイン・ブン・ムハンマド・ブン・サブラ〔と立項〕。ヒジュラ暦894年にマッカで私（サハーウィー）から聴聞した者の一人。父のハサン・ブン・ムハンマド・ブン・サブラは既出である。ただし彼（ハサン）の息子の名はフサインではなく、「アル＝フサイニー」の通称で知られただけで、本名はムハンマドである。したがって彼はムハンマド・ブン・ハサン・ブン・ムハンマド・ブン・サブラであり、ムハンマドの部に編入されるべきである。
  en: '[Entered as] Ḥusayn b. Muḥammad b. Ṣabra. He was among those who heard from me (al-Sakhāwī) in Mecca in 894 AH. His father Ḥasan b. Muḥammad b. Ṣabra has already been given. But his (Ḥasan''s) son''s name is not Ḥusayn — he was merely known as ''al-Ḥusaynī'', his name being Muḥammad. He is therefore Muḥammad b. Ḥasan b. Muḥammad b. Ṣabra and should be inserted among the Muḥammads.'
