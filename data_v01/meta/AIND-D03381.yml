translation:
  ja: アッ＝スィッディーク・ブン・アブドゥルラフマーン、ラディー・アッ＝ディーン、アブー・アブドゥッラー・アッ＝サフリー、のちにアル＝ハディーディー・アッ＝シャーフィイー。ゼイラのカーディー（法官）。私は、彼の同郷人で彼を『栄光に満ちた、徳高く、完璧なカーディー』と評する者を見かけた。彼は（ヒジュラ暦）894年に健在であった。
  en: al-Ṣiddīq b. ʿAbd al-Raḥmān, Raḍī al-Dīn, Abū ʿAbd Allāh, al-Ṣakhrī, later al-Ḥadīdī, al-Shāfiʿī, the judge of Zaylaʿ. I saw someone from his homeland describe him as 'the most glorious, virtuous, and perfect judge'. He was alive in the year 894 AH.
