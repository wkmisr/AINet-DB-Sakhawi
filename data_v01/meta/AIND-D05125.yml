translation:
  ja: アリー・ブン・フサイン・ブン・アリー・ブン・サラーマ・アッ＝ディマシュキー・アッ＝シャーフィイー。アル＝イマード・アル＝フスバーニーらに法学を学び、ダマスカスで教授した。文学の素養があり、詩作は中程度であった。819年にダマスカスで没した。我らがシャイフ（イブン・ハジャル）が『インバー』でそう述べている。
  en: ʿAlī b. Ḥusayn b. ʿAlī b. Salāma al-Dimashqī al-Shāfiʿī. He studied jurisprudence under al-ʿImād al-Ḥusbānī and others, and taught in Damascus. He had some share in literature, and his poetry was of middling quality. He died in Damascus in the year 819. Our shaykh (Ibn Ḥajar) said so in his Inbāʾ.
