translation:
  ja: ムハンマド・ブン・シャアバーン、アッ＝シャムス、カイロのムフタスィブ（市場監督官）。780年頃に生まれた。学識に欠け、まったくの平民であったが、それにもかかわらず金銭の提供（バズル）によって20回以上もヒスバ職に就き、それを誇り自慢するほどであった。アル＝ムアイヤド（・シャイフ）が一度彼の両足を打ち、同職を求めないよう命じたにもかかわらず（である）。彼は困窮して関節の病に冒されるまで（それを）やめなかった。その後、844年シャウワール月21日に没した。アル＝マクリーズィーは「彼には何の長所も美点もなかった」と述べている。
  en: 'Muḥammad b. Shaʿbān, al-Shams, the muḥtasib of Cairo. He was born around the year 780. He was devoid of accomplishments, indeed a mere commoner; nevertheless he held the ḥisba more than twenty times through payment, to the point that he used to boast and pride himself on it, even though al-Muʾayyad once had him beaten on his feet and ordered him not to seek it again. He did not desist until he became impoverished and was afflicted with joint disease. He then died on the twenty-first of Shawwāl of the year 844. Al-Maqrīzī said: he had neither merit nor virtue.'
