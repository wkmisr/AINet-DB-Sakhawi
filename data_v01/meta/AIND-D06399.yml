translation:
  ja: カスバーイ・アッ＝ザーヒリー・フシュカダム。チェルケスから自らやって来て彼（フシュカダム）に身を寄せ、彼はこれを自分のダワーダールの一人とし、次いで870年に十人長とした。881年ズー・ル＝ヒッジャ月に没し、主人の墓廟に葬られた。
  en: Kasbāy al-Ẓāhirī Khushqadam. He came from Circassia on his own and attached himself to him (Khushqadam), who made him one of his dawādārs and then, in the year 870, an amir of ten. He died in Dhū al-Ḥijja of the year 881 and was buried in his master's mausoleum.
