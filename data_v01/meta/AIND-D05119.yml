translation:
  ja: アリー・ブン・ハサン・ブン・アリー・アル＝ガムリー。父はアル＝マラーキビー（船頭）で、イブン・ハッルーブとして知られる。『アル＝ミンハージュ』を暗記し、集団の中で私（サハーウィー）に提示（暗誦確認）した者の一人。巡礼を行い、アル＝アミーン・イブン・アン＝ナッジャール、次いでアル＝フライビーのもとで少し学んだ。アッ＝ザイニー・ザカリヤーに引き合わされ、同人は彼をミニヤト・ガムルのカーディー職に、ファーリスとの共同で、次いで他の者との共同で任じた。これは奇事の一つに数えられた。
  en: ʿAlī b. Ḥasan b. ʿAlī al-Ghamrī; his father was al-Marākibī (the boatman), and he is known as Ibn Kharrūb. He was among those who memorized al-Minhāj and recited it to me (al-Sakhāwī) among the group. He performed the pilgrimage and studied a little under al-Amīn Ibn al-Najjār, then al-Ḥulaybī. He was presented to al-Zaynī Zakariyyā, who appointed him to the judgeship of Minyat Ghamr in partnership with Fāris and then with others, which was counted among the marvels.
