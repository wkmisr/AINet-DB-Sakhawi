translation:
  ja: アハマド・ブン・ウマル・ブン・ムハンマド・ブン・ウマル。ラカブはアッ＝シハーブ。カイロ出身、のちムヌーフ出身。シャフィイー派。イブン・アル＝カンニーニーとして知られる。786年に生まれ、そこで育った。クルアーン、『アル＝ウムダ』、『アル＝ミンハージュ』、イブン・マーリクの『アルフィーヤ』を暗記し、彼が知らせたところによれば、アル＝ブルキーニー、アッ＝サドル・アル＝マナーウィー、アル＝クワイサニー、アッ＝ダミーリーらにそれらを提示した。ムヌーフに定住し、その地のカーディーたちのために署名した。私（＝サハーウィー）は彼にムヌーフで会い、彼の発言の信頼性につながる手がかりから、イジャーザを求めた。おおよそ60歳になる前に亡くなった。
  en: Aḥmad b. ʿUmar b. Muḥammad b. ʿUmar, al-Shihāb, al-Qāhirī, then al-Munūfī, al-Shāfiʿī, known as Ibn al-Qannīnī. He was born in the year 786 H and grew up there. He memorized the Qurʾān, al-ʿUmda, al-Minhāj, and Ibn Mālik's Alfiyya, and, as he reported, presented them to al-Bulqīnī, al-Ṣadr al-Manāwī, al-Quwaysnī, al-Damīrī, and others. He resided in Manūf and signed for its judges. I (al-Sakhāwī) met him there (in Manūf) and sought an ijāza from him, based on indications leading to his credibility in his statements. He died approximately before the age of sixty.
