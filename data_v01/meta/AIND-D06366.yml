translation:
  ja: クマーリー。第一巡礼隊のアミールであったが、819年シャウワール月、巡礼へ向かう途上で没した。シャード・アッ＝ザルドハーナー（武器庫監督官）でもあった。我らの師（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Qamārī. He was amīr of the first pilgrimage caravan and died while on his way to the pilgrimage in Shawwāl 819. He had also been shādd al-zardkhānāh (superintendent of the armoury). Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
