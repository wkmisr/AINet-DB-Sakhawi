translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ビラール・アル＝ワッカード（メッカのマスジドでランプ点灯係）。ファール・アッ＝ザイトとして知られ、また祖父ビラールに帰属されることもあった。メッカでヒジュラ暦878年ジュマーダー・アル＝ウーラー月に死去した。
  en: Aḥmad b. ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh b. Bilāl al-Waqqād (the lamp-lighter/muezzin at the Meccan mosque). He was known as Fār al-Zayt (the oil rat), and sometimes attributed to his grandfather Bilāl. He died in Mecca in Jumādā al-Ūlā in the year 878 H.
