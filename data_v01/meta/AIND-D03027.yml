translation:
  ja: ライハーン・アル＝ハバシー・アル＝マッキー、別名アル＝アイニー。アリー・ブン・アジュラーン・サイイドの統治期に、ジッダの関税（マクス）徴収官に任じられた。富と不動産を築いたが、その大部分を失った。気高き人物であった。816年ラマダーン月、またはシャウワール月にザビードにて没した。アル＝ファースィーがメッカ（の歴史書）において彼について言及している。
  en: Rayḥān al-Ḥabashī al-Makkī, known as al-ʿAynī. He was appointed as the customs officer (amr al-maks) of Jidda during the reign of al-Sayyid ʿAlī b. ʿAjlān, and acquired wealth and properties, most of which he subsequently lost. He was a man of chivalry. He died in Zabīd in Ramaḍān or Shawwāl of the year 816 AH. Al-Fāsī mentioned him in his history of Mecca.
