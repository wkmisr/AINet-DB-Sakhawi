translation:
  ja: アフマド・アッ＝シハーブ・アル＝ガッザーウィー・アル＝ファイユーミー、後にアル＝カーヒリー。我らがシャイフ（イブン・ハジャル）のバーブ・アル＝バフルにあった邸宅の住人で、イブン・アル＝ハティーブとして知られていた。ダワーダールなどのもとで職務を執り、慎み（フシュマ）、人間味、そして侠気（フトゥーワ）を備えていた。時には詩を詠み、肥満が甚だしく批判もされたが、しばしばジャーミウ・アル＝マクシー（マクスのモスク）で説教をした。894年またはその翌年に死去した。
  en: Aḥmad al-Shihāb al-Ghazzāwī al-Fayyūmī, later al-Qāhirī. He resided in the house of our shaykh (Ibn Ḥajar al-ʿAsqalānī) at Bāb al-Baḥr and was known as Ibn al-Khaṭīb. He served as an administrator under the dawādār and others, and possessed dignity, humanity, and futuwwa (chivalry). He sometimes composed poetry, and despite his excessive corpulence and being subject to criticism, he often preached at the Jāmiʿ al-Maqsī. He died in the year 894 H or the one after it.
