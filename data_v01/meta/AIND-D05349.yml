translation:
  ja: アリー・ブン・カラマーン。彼はアル＝ムアイヤドのもとに参上し、アル＝ムアイヤドは822年に、その息子イブラーヒームを頭とする軍勢で彼を援助した。そして兄弟のムハンマドをカラマーン領から追放し、この人物（アリー）がそこに定着した。その兄弟は彼（イブラーヒーム）とともに連行された。
  en: ʿAlī b. Qaramān. He came to al-Muʾayyad, who supported him in the year 822 with an army headed by his son Ibrāhīm; his brother Muḥammad was expelled from the Karamanid lands, this one (ʿAlī) was established there, and his brother was brought along with him (Ibrāhīm).
