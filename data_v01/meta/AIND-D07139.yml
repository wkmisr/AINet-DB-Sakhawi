translation:
  ja: ムハンマド・ナースィル・アッ＝ディーン・ブン・アッ＝トゥンブガー、（父は）スードゥーン・アル＝マーリダーニーのダワーダール。思慮と落ち着き、敬虔さと慎みをもって商業に従事した者の一人。アル＝マハッラの土地にリズカ（俸禄地）を購入し、それを娘のファーティマのためにワクフとした。彼はその（ファーティマの）母、アル＝カマール・ブン・シーリーンの娘スタイタを娶っていたのである。872年頃、若くして没した。
  en: Muḥammad Nāṣir al-Dīn b. al-Ṭunbughā, (his father being) the dawādār of Sūdūn al-Māridānī. He was among those who engaged in trade, with intelligence, composure, piety and decorum. He bought a rizqa (allotment of land) in the lands of al-Maḥalla and made it a waqf for his daughter Fāṭima, whose mother, Sutayta the daughter of al-Kamāl b. Shīrīn, he had married. He died in about 872, as a young man.
