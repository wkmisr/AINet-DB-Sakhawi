  summary:
    ar: |-
      لقيه العلاء بن السيد عفيف الدين الإيجي بسجستان سنة ست وخمسين، فحدّثه
                  بالأحاديث الزينية المكذوبة، وزعم روايتها عن الجلال أبي الفتح محمد بن محمد الحافظي
                  البخاري السرغي.
    ja: |-
      本人がالعلاء الإيجي(السخاويへの情報源)に「الأحاديث
                  الزينية」を、السرغي からの伝承と称して伝えた。السخاوي は المكذوبة(偽作)と判定。856年、سجستان。السرغي
                  は本書に立項あり(D09313)だが、詐称された伝承元のため relation 化せず本記述に留める。
  note:
    ja: |-
      「الأحاديث الزينية」が確立した作品名か伝承経路の形容(زين
                  الدين由来)かは未確定。外部典拠での裏取り不成立(2026-06-12)。
translation:
  ja: アフマド・ブン・アリー・ブン・ムハンマド・アッ＝スィジスターニー・アル＝ハナフィー。 アブー・ル＝ファトフ・ムハンマド・ブン・ムハンマド・アル＝ハーフィズィー・アル＝ブハーリー・アッ＝サルギー（後述）から伝承された、ザインに帰せられる偽造ハディース群を、アラーア・ブン・アッ＝サイイド・アフィーフ・アッ＝ディーンが彼（＝本伝の対象者）に、シャイフ（＝本伝の対象者）がマッカから戻った時、数回にわたりシジスターンで聴聞した。
  en: Aḥmad b. ʿAlī b. Muḥammad al-Sijistānī al-Ḥanafī. Al-ʿAlāʾ b. al-Sayyid ʿAfīf al-Dīn met him (the subject) several times, including in Sijistān, in the year 856 H when the shaykh (the subject) returned from Mecca. He (the subject) transmitted to him (al-ʿAlāʾ) the fabricated al-Aḥādīth al-Zayniyyāt from al-Jalāl Abū al-Fatḥ Muḥammad b. Muḥammad al-Ḥāfiẓī al-Bukhārī al-Sarghī (who will be mentioned later).
