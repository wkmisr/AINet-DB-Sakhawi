  en: Khalīl b. al-Shihāb Aḥmad b. Khalīl al-Tarūjī al-Sakandarī, resident of Mecca. He was wealthy and dealt much with people. He died in Mecca in Shaʿbān of the year 888, and his sons are now, in the year 897, in Mecca.
