translation:
  ja: フジャー・バルディー、ラムラの天幕張り場（マダーリブ・アル＝ハーム）の近くにあるザーウィヤの主。チェルケス人、ハナフィー派。信奉された聖者の一人であるシャイフ・イーナールに親しく付き従った者の一人で、他の敬虔者たちとの交際もあった。881年ズー・アル＝カアダ月26日に80歳ほどで没した。後述する彼の孫ユーヌス・ブン・ムハンマドが私にそう語った。
  en: Khujā Bardī, master of the zāwiya near the tent-pitching ground (maḍārib al-khām) of al-Ramla; a Circassian and a Ḥanafī, one of those closely attached to Shaykh Īnāl, one of the venerated (saints), besides keeping company with other righteous men. He died at about eighty years of age on 26 Dhū al-Qaʿda of the year 881; so his grandson Yūnus b. Muḥammad (mentioned below) told me.
