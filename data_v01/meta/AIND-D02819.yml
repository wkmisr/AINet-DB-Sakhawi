    ja: 本項主のザーウィヤ（先例 D05761「صاحب الزاوية خارج الصحراء」＝affiliation affiliated＋desc）。ID-Master 未登録 → TMP-I-00249（زاوية خجا بردي）。corpus では D02117「زاوية قريبة من مضارب الخيام بالرملة … زاوية تلميذه المشار إليه عند مضارب الخيام من الرملة」・D10593「زاويته التي بقرب مضارب الخيم من الرملة」にも同施設。الرملة は D02117「قدم القاهرة … ونزل بزاوية قريبة من مضارب الخيام بالرملة」によりカイロ市中の地区（天幕張り場 مضارب الخيام のある الرملة）であって、ID-Master 既登録の TMP-L-00059 الرملة（パレスチナ）とは別実体 → TMP-L-00364（ISSUES §D135-5）。初版は TMP-L-00059。【集約 2026-10-26（内容A M-5、オーケストレーター決定10）】ID-Master 既登録 TMP-L-00207「الرميلة」（Note「D03078 カイロ・城塞下の広場」、repo D00450 は wd:Q12246605 ميدان الرميلة）と同一実体の可能性が高い（カイロの「الرملة」は城塞下の رملة القلعة／الرميلة を指すのが通例）。ただし原文の綴りは「الرملة」で、規則25 により原文どおり新規 TMP-L-00364 を維持し、TMP-L-00207 を名寄せ候補とする（Waka 裁定）。
