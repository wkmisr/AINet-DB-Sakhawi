- text: 'سالم بن إسماعيل بن الحسن البابي ثم الحلبي في محمد → 転送先 AIND-D07104（محمد بن إسماعيل بن الحسن بن صهيب بن خميس الشمس البابي ثم الحلبي الشافعي، #330）。閉合根拠: (1) corpusに立項番号を持たない転送見出しで本文は「في محمد」のみ、(2) D07104本文に「وكان اسمه أولا سالم」＝改名前の名がسالمと明記、(3) نسب「بن إسماعيل بن الحسن」とニスバ「البابي ثم الحلبي」が完全一致。本REF化により初版の汚染番号 TMP-P-000528(إسماعيل)・TMP-P-000529(محمد) の誤用が消滅する。'
