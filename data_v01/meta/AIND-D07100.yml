translation:
  ja: ムハンマド・ブン・イスマーイール・ブン・イブラーヒーム、アブー・アル＝ワファー・アル＝カーヒリー、医師。ワファーとして知られる。830年より後にカイロで生まれ、そこで育ち、母方の叔父アッ＝シハーブ・アフマド・ブン・ハリールとナースィル・アッ＝ディーン・ブン・アル＝ブンドゥキーのもとで医学の修練を積んだ。そして施療院（ビーマーリスターン）の交代勤務医の一人となり、技量・堅実さ・手際の軽やかさ・治療における熟慮の点で指折りと目される者となった。幾度か巡礼し、2度（マッカに）滞在（ムジャーワラ）し、ディムヤートに入った。時に私（サハーウィー）に親しく接し、私の著作『アル＝ヒサール・アル＝ムージバ・リ＝ッ＝ズィラール』の書写を強く望んだ。
  en: Muḥammad b. Ismāʿīl b. Ibrāhīm, Abū al-Wafā al-Qāhirī, the physician, known as Wafā. He was born after 830 in Cairo and grew up there, and trained in medicine under his maternal uncle al-Shihāb Aḥmad b. Khalīl and under Nāṣir al-Dīn b. al-Bunduqī. He became one of the physicians on rotation at the hospital (bīmāristān), among those pointed to for skill, soundness, a light touch and deliberation in treatment. He performed the pilgrimage more than once, resided (as mujāwir) twice, and entered Damietta. At times he showed me kindness, and he was most eager to copy my work al-Khiṣāl al-mūjiba li-l-ẓilāl.
