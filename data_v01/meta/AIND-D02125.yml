translation:
  ja: バービー・スンクル・ブン・シャー・ルフ・ブン・ティームール・ランク。ケルマーン王国の主にして、後出のムハンマドの兄弟。839年ズー・アル＝ヒッジャ月に死去したが、その前年（838年）とも言われる。父の後継者（ワリー・アフド）であり、名だたる勇気と非凡な胆力の持ち主であった。我らがシャイフ（イブン・ハジャル）は、ここでの記述よりも簡潔に彼を記している。
  en: Bābī Sunqur b. Shāh Rukh b. Tīmūr Lank, ruler of the kingdom of Kirmān and brother of Muḥammad, who follows. He died in Dhū al-Ḥijja 839, though it is also said [that he died] in the year before. He was his father's heir apparent, and possessed renowned courage and great daring. Our shaykh (Ibn Ḥajar) recorded him more briefly than this.
