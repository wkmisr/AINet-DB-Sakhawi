translation:
  ja: アリー・ブン・ムハンマド・ブン・ムハンマド・ブン・ユースフ、アル＝アラー・アッ＝ディマシュキー・イブン・アル＝ジャザリー。後述する朗誦学者の長（シャイフ・アル＝クッラー）アッ＝シャムス・ムハンマドの兄弟。私（サハーウィー）の聞くところでは学者で朗誦学者（ムクリウ）であった。ナキーブ・アル＝アシュラーフのシャリーフ・ナースィル・アッ＝ディーン・ムハンマド・ブン・アビー・バクル・ブン・アリーの母方の祖父である。
  en: ʿAlī b. Muḥammad b. Muḥammad b. Yūsuf, al-ʿAlāʾ al-Dimashqī Ibn al-Jazarī, brother of the shaykh of the Qurʾān-readers al-Shams Muḥammad, mentioned below. According to what reached me he was a scholar and reader (muqriʾ); he was the maternal grandfather of the sharīf Nāṣir al-Dīn Muḥammad b. Abī Bakr b. ʿAlī, the naqīb al-ashrāf.
