translation:
  ja: ドゥバイス・ブン・ジャサール・ブン・スィナーン・ブン・ザージハ・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ウマル。マッカのウムラ（小巡礼）の司令官の一人であり、前述のアフマド・ブン・アリー・ブン・スィナーンの従兄弟。ハジュリー暦846年サファル月にハジュバにおいて殺害された。
  en: Dubays bin Jasar bin Sinan bin Zajih bin Muhammad bin Abd Allah bin Umar. One of the commanders of the 'Umrah in Mecca, and the cousin of the aforementioned Ahmad bin Ali bin Sinan. He was killed at al-Hadba in Safar of the year 846 AH.
