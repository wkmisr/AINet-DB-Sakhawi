translation:
  ja: アブドゥルカーディル・ブン・ハサン・ブン・アフマド・アル＝カルユービー・アル＝カーヒリー。スーク・アッ＝シュルブ（カイロの市場）の商人。法学者たちと頻繁に交流し、マッカにムジャーワラ（長期滞在）した。アシュ＝シャラフ・アル＝ムナーウィーらにハディースを聴聞し、マッカでは私（サハーウィー）からも聴聞した。彼は素晴らしい集団の一人であった。また、我らが師（イブン・ハジャル）から聴聞したとも述べており、それは十分にあり得ることである。ヒジュラ暦891年ジュマーダー・アル＝アーヒラ（第2ジュマーダー月）に没した。享年は70歳を下らなかった。
  en: Abd al-Qādir b. Ḥasan b. Aḥmad al-Qalyūbī al-Qāhirī. A merchant in Sūq al-Shurb (Cairo), who frequently associated with jurists and performed mujāwara (extended stay/devotion) in Mecca. He heard hadith from al-Sharaf al-Munāwī and others, and he even heard from me (al-Sakhāwī) in Mecca, being one of the best of the group. He used to mention that he heard from our shaykh (Ibn Ḥajar), which is highly plausible. He died in Jumādā al-Thāniya in the year 891 AH, being not less than seventy years of age.
