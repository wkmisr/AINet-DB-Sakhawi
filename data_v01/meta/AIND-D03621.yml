translation:
  ja: アブドゥルラフマーン・ブン・アル＝ハサン・ブン・ムハンマド・ブン・カースィム・ブン・アリー。イエメン系マッカ（メッカ）人。父（ハサン）は前出であり、二人の兄弟アリーとムハンマドは後出、同母兄弟はウマル。イブン・アッ＝ターヒル（タは点無しのハ行）として知られる。ヒジュラ暦862年ジュマーダー・アル＝アーヒラ（第6月）にジッダで没し、マッカへ運ばれてアル＝ムアッラー墓地に埋葬された。
  en: Abd al-Rahman b. al-Hasan b. Muhammad b. Qasim b. Ali. Of Yemeni origin, resident of Mecca. His father (Hasan) was mentioned previously, his two brothers Ali and Muhammad are mentioned below, and his full brother is Umar. He was known as Ibn al-Tahir. He died in Jidda in Jumada al-Akhira 862, and was carried to Mecca where he was buried in al-Mu'alla.
