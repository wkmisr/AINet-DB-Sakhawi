translation:
  ja: ムーサー・ブン・アブドゥッサラーム・ブン・ムーサー・ブン・アビー・バクル・ブン・アクバル、シーラーズ出自、アル＝マッキー。前述のアブドゥルアズィーズの兄弟であり、二人の父と祖父も前述した。ザムザムの井戸にちなみアッ＝ザムザミーとして知られる。（8）76年ラジャブ月にマッカで没した。イブン・ファハドがその没年を記している。彼は（8）47年に、ミナー街道の、イブン・ムズナ（の名）で知られるアッ＝シット（貴婦人）の給水所の近くにあるアル＝ワトシュの給水所を改修した者であり、タシュリークの日々にそこで水を施した。ナフラにあるそのための寄進財（ワクフ）の管理にあたっており、書字などによるジン除けで知られていた。
  en: Mūsā b. ʿAbd al-Salām b. Mūsā b. Abī Bakr b. Akbar, of Shīrāzī origin, al-Makkī, brother of the aforementioned ʿAbd al-ʿAzīz; their father and grandfather have also been mentioned. He was known as al-Zamzamī, after the Well of Zamzam. He died in Rajab of the year (8)76 in Mecca. Ibn Fahd recorded his death. He was the one who renovated the Sabīl al-Watsh on the road to Minā, near the Sabīl al-Sitt known as (the sabīl of) Ibn Muzna, in the year (8)47, and provided water there during the days of Tashrīq. He administered an endowment (waqf) for it at Nakhla, and he was reputed for warding off jinn by writing (amulets) and other means.
