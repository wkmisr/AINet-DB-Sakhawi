translation:
  ja: イスハーク・ブン・アビー・ル=カースィム・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ウマル・ブン・アビー・バクル・ブン・アブドゥッラフマーン・イブン・アブドゥッラー・アブー・ヤアクーブ・アン=ナーシリー。 802年生まれ。『シャティビーヤ詩』および『アル＝ハーウィー』の大部分を暗記した。アラビア語学においてはシャラフ・イスマーイール・アル＝ブーマに師事し、彼の祖父および2人の兄弟であるムハンマドとイブラーヒームからハディースを聴聞した。そして、彼の2番目の兄弟の職務を代行し、重要な判決を下した。彼は敬虔な法学者であった。アル＝アフィーフが彼について言及しているが、その没年は記録されていない。
  en: Isḥāq b. Abī al-Qāsim b. Muḥammad b. ʿAbd Allāh b. ʿUmar b. Abī Bakr b. ʿAbd al-Raḥmān b. ʿAbd Allāh, Abū Yaʿqūb al-Nāshirī. He was born in 802 H. He memorized al-Shāṭibiyya and most of al-Ḥāwī, and he studied Arabic under al-Sharaf Ismāʿīl al-Būma. He heard from his grandfather and his two brothers, Muḥammad and Ibrāhīm. He deputized for his second brother in important legal judgments. He was a pious jurist. Al-ʿAfīf mentioned him, but his date of death is not recorded.
