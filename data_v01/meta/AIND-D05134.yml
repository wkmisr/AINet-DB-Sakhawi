  en: ʿAlī b. Ḥaydar, shaykh of Turbat al-Aʿjām (the mausoleum of the non-Arabs) near the mausoleum of Taghrī Birmish al-Zardakāsh, and formerly imam of Barqūq, the viceroy of Syria. He died in Jumādā al-Ūlā of the year 895.
