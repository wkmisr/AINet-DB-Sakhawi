translation:
  ja: ムハンマド・ブン・アブド・アル＝カーディル・ブン・アリー、イマーム・アッ＝ディーン、アブー・アル＝マアーリー、アル＝ジャズィーリー、アル＝カーヒリー、シャーフィイー派。ガムリー〔・モスク〕のイマームであるアル＝アミーン・イブン・アン＝ナッジャールのもとで『ミンハージュ』を読み、次いで891年ジュマーダー・アッ＝サーニヤ月22日の土曜日に、私（サハーウィー）を皮切りとして面々に対してそれを提示〔暗誦〕した。私から『ムサルサル』をその条件どおりに聴聞し、私は彼にイジャーザを与えた。同様に他の書も暗記し、法学とアラビア語学に励み、理解を得た。
  en: Muḥammad b. ʿAbd al-Qādir b. ʿAlī, Imām al-Dīn Abū al-Maʿālī al-Jazīrī al-Qāhirī al-Shāfiʿī. He is among those who read al-Minhāj with al-Amīn b. al-Najjār, imam of al-Ghamrī (mosque), and then presented it (from memory) to the scholars, beginning with me (al-Sakhāwī), on Saturday 22 Jumādā II 891. He heard al-Musalsal from me under its condition, and I granted him an ijāza. He likewise memorised other works, occupied himself with jurisprudence and Arabic, and gained understanding.
