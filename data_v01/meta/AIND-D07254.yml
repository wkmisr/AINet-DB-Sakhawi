translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ムハンマド・ブン・ムハンマド・ブン・ウマル、アブー・アブドゥッラー・アッ＝シュグリー、のちアル＝ハラビー、アッ＝シャーフィイー。前述のアッ＝シハーブ・アフマド・ブン・ムハンマドの甥で、イブン・トゥンブルとして知られる。遍歴する貧者（スーフィー）で、カイロやその他の地で私から聴聞した。
  en: Muḥammad b. Abī Bakr b. Muḥammad b. Muḥammad b. ʿUmar, Abū ʿAbd Allāh al-Shughrī, then al-Ḥalabī, al-Shāfiʿī, nephew of al-Shihāb Aḥmad b. Muḥammad mentioned above, known as Ibn Ṭunbul. A wandering faqīr (Sufi), he heard from me in Cairo and elsewhere.
