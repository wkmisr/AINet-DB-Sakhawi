translation:
  ja: アハマド・ブン・トゥーガーン、別名アリー・ブン・アブドゥッラー・アッ＝サーリヒー・アル＝ハンマーミー、イブン・アル＝バイタールとして知られる。781年にアブー・アル＝ホール・アル＝ジャザリーから、アブー・ヌアイムの聴聞物からの高位の伝承を含む著作などを聴聞した。イブン・ファハドらが彼からハディースを伝承した。738年ジュマーダー・アル＝アーヒラ月にダマスクスのサーリヒーヤで亡くなり、カースィユーン山の麓に埋葬された。アッラーの慈悲が彼にあらんことを。
  en: Ahmad b. Ṭūghān, also known as ʿAlī b. ʿAbd Allāh al-Ṣāliḥī al-Ḥammāmī, and famously called Ibn al-Bayṭār. In 781 AH, he heard from Abū al-Hawl al-Jazarī, among other things, a juzʾ containing elevated narrations from Abū Nuʿaym's auditioned works. Ibn Fahd and others transmitted from him. He died in Jumādā al-Ākhira 838 AH in Ṣāliḥiyyat Dimashq and was buried at the foothills of Mount Qasioun. May Allah have mercy on him.
