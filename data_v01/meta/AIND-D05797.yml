  en: ʿUmar b. Aḥmad b. ʿUmar al-Taqī al-Zabīdī al-Munaqqish al-Shāfiʿī; his son was mentioned above. He was a jurist, good, virtuous, pious, humble, often smiling, gentle and patient. He died in the year (80)3.
