translation:
  ja: フサイン・ブン・アブー・ハーミド・ムハンマド・ブン・アブー・アル＝ハイル・ブン・アブー・アッ＝サウード・ブン・ザヒーラ・アル＝マッキー・アル＝マーリキー。ヒジュラ暦864年ラマダーン月生。マッカで私（サハーウィー）から聴聞した者の一人で、アフマド・ブン・ハーティム・アル＝マグリビーの講義に常侍し、その他の者のもとにも少し出席した。私は彼がアル＝ジャウジャリーの『イルシャード』注釈を書き写しているのを見た。マディーナを一度ならず訪れ、898年には往路も帰路も私たちの隊商にいた。
  en: Ḥusayn b. Abī Ḥāmid Muḥammad b. Abī al-Khayr b. Abī al-Suʿūd b. Ẓahīra al-Makkī al-Mālikī. He was born in Ramaḍān 864 AH. He heard from me (al-Sakhāwī) in Mecca and assiduously attended the lessons of Aḥmad b. Ḥātim al-Maghribī, besides attending a little under others. I saw him writing out al-Jawjarī's commentary on al-Irshād. He visited Medina more than once, and was in our caravan in the year 898 AH, both going and returning.
