translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・アブドゥッラー、アッ＝シャムス・アブー・アブドゥッラー、のちにアッ＝ディマシュキー、ハンバル派の法学者にして読誦家。アル＝ブルハーン・アル＝ハラビーが彼の伝記を記して次のように述べた。「素性も学統もハンバル派の善良な人物で、タキー・アッ＝ディーン・イブン・タイミーヤの敬慕者の一人。（8）39年ムハッラム月10日にアレッポに来て、私に『イブン・マージャのスナン』と『ファフルのマシュヤハ』を読誦し、同月25日にダマスカス方面へ帰った。アッラーが彼の無事を定めたまわんことを。」
  en: 'Muḥammad b. ʿAbd Allāh b. ʿAbd Allāh, al-Shams Abū ʿAbd Allāh, then al-Dimashqī, the Ḥanbalī jurist and Qurʾān reciter. Al-Burhān al-Ḥalabī wrote his biography, saying: "A good man, Ḥanbalī by origin and by training, one of the admirers of al-Taqī Ibn Taymiyya. He came to Aleppo on 10 Muḥarram (8)39 and read to me the Sunan of Ibn Māja and the Mashyakha of al-Fakhr, then returned towards Damascus on the 25th of the same month. May God decree his safety."'
