translation:
  ja: アブドゥルカーディル・ブン・アリー・ブン・ユースフ・アッ＝ザフターウィー・アル＝ブーティージィー。アデンに居住し、そこではアッ＝サイーディー（上エジプト人）として知られた。また、前述のイスマーイール・ブン・アリーの叔父である。830年のすぐ後にザフターで生まれ、クルアーンを朗読し、一時期アズハル・モスクのイエメン人用のリワーク（学生宿舎）に居住した。その後、マリキ派の法学を学び、それから商業に携わるようになってアデンに旅し、およそ40年間そこに居住した。そこからハッジ（巡礼）などのために頻繁に（メッカを）往来した。多くの子宝に恵まれ、善行、親しみやすさ、貧者への慈善、素晴らしい対応、そして篤い信仰心とともに祝福された。彼に対する称賛は少なからぬ人々から聞いており、彼は（ヒジュラ暦）896年またはその翌年に私（サハーウィー）と面会した。
  en: ʿAbd al-Qādir b. ʿAlī b. Yūsuf al-Zaftāwī al-Būtījī. He settled in Aden, where he was known as al-Ṣaʿīdī, and was the uncle of the aforementioned Ismāʿīl b. ʿAlī. He was born shortly after 830 AH in Zaftā. He recited the Qurʾān and resided for a time in the Yemeni hospice (Riwāq al-Yamanat) of al-Azhar Mosque. He studied Maliki law, then turned to trade and traveled to Aden, where he settled for about forty years, frequently traveling from there for Hajj and other purposes. He was blessed with children, prosperity, goodness, amiability, charity to the poor, good conduct, and devotion to religion. I heard praise of him from several people, and he met with me in the year 896 AH or after.
