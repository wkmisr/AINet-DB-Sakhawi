translation:
  ja: ムハンマド・ブン・アリー・ブン・ウマル、アッ＝シャムス・アッ＝サーブーニー・アル＝カーヒリー、文書署記官（ムワッキウ）。風采も落ち着きも、その職における威信も悪くなく、時にイブン・キシュカと渾名された。（8）56年ラビーウ・アル＝アウワル月に没した。神よ彼を憐れみ給え。
  en: Muḥammad b. ʿAlī b. ʿUmar, al-Shams al-Ṣābūnī al-Qāhirī, the signatory clerk (muwaqqiʿ). He was not bad in appearance, composure and standing in his craft, and he was sometimes nicknamed Ibn Kishka. He died in Rabīʿ al-Awwal of the year [8]56, may God have mercy on him.
