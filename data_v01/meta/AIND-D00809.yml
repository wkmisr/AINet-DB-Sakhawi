notes:
- text: '【2026-11-17 Waka 裁定】見出し「أحمد بن عبد الدائم بن عمر الشريف الحسني بن عمر الشريف البدر النسابة」は「بن عمر」が二度続き不自然で、後半は「ابن عم الشريف البدر النسابة」（著名人を基準にした人物の示し方）の崩れの可能性がある。ただし相手は、系譜学者 البدر حسن الحسني（corpus 本伝 #AIND-D02617「ويعرف بالشريف النسابة」）とも、その叔父 البدر النسابة（D02617 の師「عمه البدر النسابة」）とも読め、D02617 の従兄弟なら祖父は أيوب のはずで見出しの عمر と合わないなど、確定できない。規則26 により relation は立てない。いずれの読みでも「النسابة」は本項主の肩書きと確定しないので office state は置かない（段階2 で付けた TMP-O-00409 は取り下げ）。laqab「البدر」も参照先の人物のものである可能性があるが、規則25 により刊本どおり保持し cert="low" とした。'
  lang: ja
  type: editorial
translation:
  ja: アフマド・ブン・アブド・アッ=ダーイム・ブン・ウマル・アッ=シャリーフ・アル=ハサニー。系図学者バドルと称される。フサイニー廟にいたこと、イジャーザを求めたと言われるが、私（＝サハーウィー）はこれを全く知らない。
  en: Aḥmad b. ʿAbd al-Dāʾim b. ʿUmar al-Sharīf al-Ḥasanī, known as al-Badr al-Nassāba (the Genealogist). It is said that he was at al-Mashhad al-Ḥusaynī and that he sought ijāza, but I (al-Sakhāwī) do not know this at all.
