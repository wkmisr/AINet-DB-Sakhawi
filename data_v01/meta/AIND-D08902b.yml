notes:
- text: 'ニスバ الجناني（D05466 に「بكسر الجيم ثم نون خفيفة وآخره نون」）・الصالحي は ID-Master 未登録→要登録。同名同職の #AIND-D05466（علي بن محمد بن عثمان بن عبد الله الجناني الصالحي المؤذن بجامعها المظفري ويعرف بابن شقير、774年に حضر）は父子または兄弟と推定されるが原文に言及なし→relation 未立て（要判断）。'
  lang: ja
translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・ウスマーン・ブン・アブドゥッラー、シャムス〔・ッディーン〕・アル＝ジナーニー・アッ＝サーリヒー、同地〔サーリヒーヤ〕のムザッファリー・モスクのムアッズィン、イブン・シュカイルとして知られる。イブン・カイイム・アッ＝ディヤーイーヤから『アリー・ブン・アル＝ムファッリジュ・アッ＝スィキッリーのハディース』第1部などを、イブン・アン＝ナジュムから『サムウーニーヤート』の最後の4会分を、ムハンマド・ブン・アル＝ムヒッブ・アブドゥッラー・ブン・アブド・アル＝ハミード・ブン・アブド・アル＝ハーディーから『イブン・ムハイトの部（ジュズ）』などを、ファフルの孫娘スィット・アル＝アラブから『ムザッキヤート』の第1部などを、ウマル・ブン・ウスマーン・ブン・サーリムほかから聴聞した。ハディースを伝え、815年ダマスクスでイブン・ムーサーとムワッファク・アル＝ウッビーが彼から聴聞した。
  en: 'Muḥammad b. Muḥammad b. ʿUthmān b. ʿAbd Allāh, al-Shams al-Jinānī al-Ṣāliḥī, muezzin of the Muẓaffarī mosque there (al-Ṣāliḥiyya), known as Ibn Shuqayr. He heard from Ibn Qayyim al-Ḍiyāʾiyya the first part of the ḥadīth of ʿAlī b. al-Mufarrij al-Ṣiqillī and other things; from Ibn al-Najm the last four sessions of the Samʿūniyyāt; from Muḥammad b. al-Muḥibb ʿAbd Allāh b. ʿAbd al-Ḥamīd b. ʿAbd al-Hādī the Juzʾ of Ibn Mukhayt and other things; from Sitt al-ʿArab, granddaughter of al-Fakhr, the first of the Muzakkiyyāt and other things; and from ʿUmar b. ʿUthmān b. Sālim, among others. He transmitted ḥadīth: Ibn Mūsā and al-Muwaffaq al-Ubbī heard from him in Damascus in 815.'
