    ja: 生徒 النور بن الركاب المقري を既存項 AIND-D12352（ابن الركاب بالتشديد علي بن المقري）に同定（النور=علي、ابن الركاب、المقري の三点一致）。原文「وممن سمعه منه النور بن الركاب المقري」より、聴聞方向は النور←D01285。Gemini初版は active/passive を逆転させ、生徒に幻番号 TMP-P-000066 を付していたため是正。著作『منهاج الطريق』は師relationと同一の一冊のため TMP-T-00031 に統一（Geminiが先取り幻番号 TMP-T-00106 を重複付与していたため破棄）。 / 原文照合により方向を是正（2026-09-01）。相手方は伝主の弟子であり、伝主が師。旧版は active/passive が逆転していた。
