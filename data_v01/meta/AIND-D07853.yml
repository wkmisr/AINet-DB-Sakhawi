translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ユースフ・アル＝ジャジャーウィー・アル＝ハンバリー。彼をハナフィー派と言った者は誤っている。アッ＝タキー・ブン・ファハドが『ムウジャム』で彼に言及し、彼（本人）がアッ＝サラーフ・ブン・アビー・ウマルとアル＝ムヒッブ・アッ＝サーミトから聴聞したと述べていた、と記している。我らがシャイフ（イブン・ハジャル）も『ムウジャム』で彼に言及し、「（8）27年に私の子らにイジャーザを授けた」と言い、それ以上は加えていない。833年に没した。
  en: 'Muḥammad b. ʿAbd Allāh b. Yūsuf al-Jajāwī al-Ḥanbalī; whoever called him a Ḥanafī erred. Al-Taqī b. Fahd mentioned him in his Muʿjam and said that he (the subject) stated that he had heard from al-Ṣalāḥ b. Abī ʿUmar and al-Muḥibb al-Ṣāmit. Our shaykh (Ibn Ḥajar) mentioned him in his Muʿjam, saying: "He granted an ijāza to my children in the year [8]27," and added nothing more. He died in the year 833.'
