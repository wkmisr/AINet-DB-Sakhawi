translation:
  ja: カースィム・ブン・ファラフ・ブン・ハムザ、仕立屋（アル＝ハイヤート）、アッ＝シャーティル、武術師範（アル＝ムサーキフ）、アル＝バルザンジー、スーフィー。800年頃に生まれ、855年ズー・アル＝ヒッジャ月21日金曜日にカイロで没し、翌日アズハルで葬礼が行われた。温厚で付き合いのよい人物で、仕立てと武術（サカーフ）の師範であり、仲間内では「ラッダーダト・アル＝カイイム」と綽名されていた。神の慈悲あれ。
  en: Qāsim b. Faraḥ b. Ḥamza, the tailor (al-khayyāṭ), al-Shāṭir, the fencing-master (al-muthāqif), al-Barzanjī, the Ṣūfī. He was born around the year 800 and died on Friday 21 Dhū al-Ḥijja 855 in Cairo; the funeral prayer was performed over him the next day at al-Azhar. He was affable and good company, a master in tailoring and in thiqāf (weapons drill), and was nicknamed among his peers Raddādat al-Qayyim. May God have mercy on him.
