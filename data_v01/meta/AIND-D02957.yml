translation:
  ja: ダーウード・ブン・ムハンマド・ブン・イーサー・ブン・アフマド・アル＝ヒンディー・アル＝ムハンマドアーバーディー。スレイマーンの兄弟で、後述のラージハの父。彼の息子が私に語ったところによると、徳の高い人物であった。ヒジュラ暦872年に30歳前後で没した。
  en: Dāwūd b. Muḥammad b. ʿĪsā b. Aḥmad al-Hindī al-Muḥammadābādī. Brother of Sulaymān and father of Rājiḥ, both of whom are mentioned below. According to what his son told me, he was a virtuous man. He died in the year 872 AH at around thirty years of age.
