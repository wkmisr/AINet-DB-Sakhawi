translation:
  ja: ムハンマド・ブン・アフマド・ナースィル・アッ＝ディーン・アル＝ハズバーニー・アル＝クルディー・アッ＝シャーフィイー、斧持ち（タバルダール）。屈強な者たち（アブナー・アル＝ジャルド）の出であったが、学者たちの集まりに連なることに執心し、カマール・アッ＝ディーン・アッ＝ダミーリーとヌール・アッ＝ディーン・アッ＝ラシーディーに随伴（師事）した。信仰篤くなり、断食を続け、集団礼拝を励行し、それどころかアズハルでの暁の礼拝を欠かさず、毎夜、夜の四分の一ほどの時刻にハーラト・バハー・アッ＝ディーンの自宅から歩いてそこへ赴いた。帯（ハワーイス）の商いで生計を立てていたが、老いてからそれを辞めた。彼の頭には（学んだ）事柄が残っていた。（8）24年に没した。我らの師（イブン・ハジャル）が『インバー』で彼に言及して言った、「彼はしばらくの間、私に師事した」と。
  en: 'Muḥammad b. Aḥmad Nāṣir al-Dīn al-Hadhbānī al-Kurdī al-Shāfiʿī, the axe-bearer (ṭabardār). He was one of the sons of the hardy folk (abnāʾ al-jald), but he attached himself to sitting with the scholars and kept company with Kamāl al-Dīn al-Damīrī and Nūr al-Dīn al-Rashīdī. He became devout, took to fasting continuously, and kept up congregational prayer; indeed he never missed the dawn prayer at al-Azhar, setting out for it every night at about a quarter of the night, on foot from his house in Ḥārat Bahāʾ al-Dīn, while earning his living by trading in belts (ḥawāʾiṣ), which he gave up when he grew old. He retained various things in his memory. He died in the year (8)24. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: he attended me for a while.'
