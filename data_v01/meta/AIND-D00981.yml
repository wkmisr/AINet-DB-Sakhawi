translation:
  ja: アフマド・ブン・アリー・ブン・アフマド・ブン・アビー・バクル、シャハーブ・アッ＝シャーディリー・アル＝ミスリー・アッ＝シャーフィイー派。後述するムハンマドの兄弟で、父のクンヤであるイブン・アビー・アル＝ハサンとして知られる。我らがシャイフ（イブン・ハジャル）からヒジュラ暦805年に、『ブハーリー伝（彼の編纂した書物より）』を聴聞した。
  en: Aḥmad b. ʿAlī b. Aḥmad b. Abī Bakr, al-Shihāb al-Shādhilī al-Miṣrī al-Shāfiʿī, brother of the forthcoming Muḥammad, and known as Ibn Abī al-Ḥasan, which is his father's kunyah. He heard from our shaykh (Ibn Ḥajar) in the year 805 AH the biography of al-Bukhārī from his (Ibn Ḥajar's) compilation.
