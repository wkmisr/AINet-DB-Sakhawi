translation:
  ja: カースィム・ブン・アブドゥルワッハーブ・ブン・アフマド・ブン・ムハンマド、アッ＝シャラフ・ブン・アッ＝タージ、ハウワーラ族の出で、カイロ、のちにヤンブウの人、シャーフィイー派。後述するムハンマドの同父の兄弟で、イブン・ズバーラとして知られる。830年に生まれた。873年、兄弟の死後にヤンブウのカーディー職に就いた。
  en: Qāsim b. ʿAbd al-Wahhāb b. Aḥmad b. Muḥammad, al-Sharaf b. al-Tāj, of Hawwārī origin, al-Qāhirī then al-Yanbūʿī, the Shāfiʿī, paternal brother of Muḥammad (mentioned below), known as Ibn Zubāla. He was born in 830. He was appointed to the judgeship of Yanbuʿ after the death of his brother in 873.
