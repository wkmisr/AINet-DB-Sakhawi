translation:
  ja: ジャカム・アッ＝ザーヒリー・ホシュカダム、アル＝アシュラフ・カーイトバーイの姉妹の息子（甥）。主人（アル＝ザーヒル・ホシュカダム）により十人長に任じられ、後にタブルハーナー（・アミール）の一人となり、次いで第二ハージブとなった。883年ラマダーン月に約30歳でペストにより死去し、母方の伯父（カーイトバーイ）がアル＝ムウミニー礼拝所での彼への葬礼の祈りに臨席した。彼は時代の害悪の一人であった。
  en: Jakam al-Ẓāhirī Khushqadam, sister’s son of al-Ashraf Qāytbāy. His master (ustādh) made him amir ʿashara; he then became one of the ṭablakhānāh and second ḥājib. He died of the plague in Ramaḍān 883 AH, at around thirty years of age, and his maternal uncle attended the funeral prayer over him at al-Muʾminī. He was among the evils of the age.
