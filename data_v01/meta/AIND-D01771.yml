notes:
- text: サハーウィーは「يحتمل أن يكون الذي قبله」と述べ、本項が直前の項（D01770 أحمد الشهاب المغربي الصنهاجي المالكي）と同一人物である可能性を示唆している。同定は要Waka判断。また「ابن مسعود الآتي」（عبد الله بن عبد الرحمن بن مسعود）は後出の別項の人物で、確実にターラブルスのカーディーを務めたとされる。
