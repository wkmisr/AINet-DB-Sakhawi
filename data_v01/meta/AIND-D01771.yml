notes:
- text: サハーウィーは「يحتمل أن يكون الذي قبله」と述べ、本項が直前の項（D01770 أحمد الشهاب المغربي الصنهاجي المالكي）と同一人物である可能性を示唆している。同定は要Waka判断。また「ابن مسعود الآتي」（عبد الله بن عبد الرحمن بن مسعود）は後出の別項の人物で、確実にターラブルスのカーディーを務めたとされる。
  lang: ja
  type: editorial
translation:
  ja: アフマド・アッ＝シハーブ・アル＝マグリビー・アル＝マーリキー。彼らのカーディー（ターラブルス＝トリポリの法官）。カーディー・アブド・アル＝カーディルがメッカで彼から（法学を）学んだ。彼が直前の項（の人物）と同一人物である可能性もあるが、彼がターラブルスのカーディーを務めたことは確定している。なお、前述のカーディー（アブド・アル＝カーディル）の師の中には、後述するアブドゥッラー・ブン・アブド・アッ＝ラフマーン・ブン・マスウードもおり、彼もまた確実にターラブルスのカーディーを務めていた。
  en: Aḥmad al-Shihāb al-Maghribī al-Mālikī, their qāḍī in Ṭarābulus (Tripoli). Al-Qāḍī ʿAbd al-Qādir studied fiqh from him in Mecca. It is possible that he is (the same as) the one mentioned just before him, but it is confirmed that he held the judgeship of Ṭarābulus. Indeed, among the shaykhs of the aforementioned qāḍī (ʿAbd al-Qādir) was also ʿAbd Allāh b. ʿAbd al-Raḥmān b. Masʿūd (mentioned later), who certainly held the judgeship of Ṭarābulus.
