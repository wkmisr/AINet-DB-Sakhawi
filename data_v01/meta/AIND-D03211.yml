translation:
  ja: スードゥン・アル＝ハマウィー。ダマスクスの指揮官（ムカッダム）の一人であり、そのアタベク（総司令官）。これ以前はカイロのアミール（諸侯）の一人であったが、アシュラフ（スルタン・バルスバーイ）によって一時幽閉された後、ダミエッタへ流刑に処された。その後、カーニバーイ・アル＝ハムザーウィーの後任として、アタベク職および指揮官職（タカッドム）に任命されてシリアに送られた。そしてシリア（ダマスクス）において、827年ズー・アル＝カアダの初めに没した。アル＝アイニーが彼について言及している。
  en: Sūdūn al-Ḥamawī. One of the commanders (muqaddams) and the Atabak (commander-in-chief) of Damascus. Prior to that, he was one of the amirs of Cairo. Sultan al-Ashraf (Barsbāy) imprisoned him for a period and then exiled him to Damietta. Later, he was sent to al-Shām (Damascus) to replace Qānibāy al-Ḥamzāwī as Atabak and commander (muqaddam). He died there in early Dhu al-Qaʿda, in the year 827 AH. Al-ʿAynī mentioned him.
