translation:
  ja: アリー・ブン・アッ＝ザキー・アブー・バクル・ブン・アブドゥルラフマーン、アル＝ミスリー、のちにアル＝マッキー、秤量人（カッバーン）、薬種商（アッタール）。イブラーヒーム、アフマド、ウマルの兄弟。マッカで私（サハーウィー）から聴聞した者の一人。
  en: ʿAlī b. al-Zakī Abī Bakr b. ʿAbd al-Raḥmān, al-Miṣrī then al-Makkī, the weigher (al-Qabbānī) and druggist (al-ʿAṭṭār), brother of Ibrāhīm, Aḥmad, and ʿUmar. He was among those who heard from me (al-Sakhāwī) in Mecca.
