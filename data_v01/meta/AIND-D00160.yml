translation:
  ja: イブラーヒーム・ブン・アブドゥッラー・ブン・アブドゥッラフマーン・ブン・ムハンマド・ブン・イブラーヒーム、生まれはサヌアでマディーナ定住のマリク法学派に属する讃美詩人。マディーナで私（＝サハーウィー）から聴聞した人物の一人である。
  en: Ibrāhīm b. ʿAbd Allāh b. ʿAbd al-Raḥmān b. Muḥammad b. Ibrāhīm, originally from Ṣanʿāʾ, a resident of Medina, a Maliki jurist, and a praiser/panegyrist. He was among those who heard from me (al-Sakhāwī) in Medina.
