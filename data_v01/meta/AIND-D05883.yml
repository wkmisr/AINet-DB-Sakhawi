translation:
  ja: ウマル・ブン・アブドゥッラー・ブン・ムハンマド・ブン・バルダス・ブン・ナスル・ブン・バルダス・ブン・ラスラーン、アッ＝ザイン・アル＝バアリー・アル＝ハンバリー・アッ＝ダッハーン。前述のイスマーイール・ブン・ムハンマドの二人の息子、アッ＝タージュ・ムハンマドとアル＝アラーのいとこ（父方の叔父の子）。（7）79年にバアルバックに生まれ、同地で育ち、シャイフ・タルハのもとでクルアーンを読み、いとこのアッ＝タージュらのもとで法学などを聴講した。アブドゥッラフマーン・ブン・ムハンマド・ブン・アッ＝ザアブーブから、アル＝ハッジャールを経由する『ブハーリー』を聴聞した。巡礼を行い、ハディースを伝えた。私はバアルバックで彼に会い、彼のもとで『百伝（アル＝ミア）』をそのハトム（読了会）とともに読んだ。彼は善良な人で、塗装（ペンキ塗り）の仕事で生計を立てていた。（8）60年近くに没した。
  en: ʿUmar b. ʿAbd Allāh b. Muḥammad b. Bardas b. Naṣr b. Bardas b. Raslān, al-Zayn al-Baʿlī al-Ḥanbalī al-Dahhān, cousin of al-Tāj Muḥammad and al-ʿAlāʾ, the two sons of Ismāʿīl b. Muḥammad mentioned above. He was born in (7)79 in Baʿlabakk and grew up there; he read the Qurʾān with al-Shaykh Ṭalḥa, attended the lessons of his cousin al-Tāj and others in jurisprudence and other subjects, and heard al-Bukhārī from ʿAbd al-Raḥmān b. Muḥammad b. al-Zaʿbūb, on the authority of al-Ḥajjār. He performed the pilgrimage and transmitted ḥadīth. I met him in Baʿlabakk and read to him the Hundred (al-Miʾa) from it together with its concluding session. He was a good man who earned his living from the (house-)painting trade. He died around (8)60.
