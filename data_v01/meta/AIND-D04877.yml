translation:
  ja: ウスマーン・ブン・ムハンマド・ブン・ムハンマド・ブン・アビー・アル＝ハイル・ムハンマド・ブン・ファハド、アル＝ファフル、アブー・フライラ、アッ＝タキーの息子、アル＝ハーシミー、アル＝マッキー。アン＝ナジュム・ウマルとその兄弟たちの兄弟で、先祖と同様にイブン・ファハドとして知られる。（8）30年ラビーウ・アル＝アーヒル月に、満4歳になる前に没した。
  en: ʿUthmān b. Muḥammad b. Muḥammad b. Abī al-Khayr Muḥammad b. Fahd, al-Fakhr Abū Hurayra, son of al-Taqī, al-Hāshimī al-Makkī, brother of al-Najm ʿUmar and his other brothers. Like his forebears he was known as Ibn Fahd. He died before completing four years of age, in Rabīʿ al-Ākhir (8)30.
