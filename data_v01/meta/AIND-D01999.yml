translation:
  ja: イスマーイール・アルマジュド。アルマクスィー・モスクの説教師（ハティーブ）であり、バイバルシーヤの読誦者（クッラーア・アッ＝スッファ）の一人。彼は善良でクルアーン朗誦が美しく、アルディッカの店の証人として生計を立てていた。ヒジュラ暦851年ズー・アルヒッジャ月1日（新月）に亡くなった。
  en: Ismāʿīl al-Majd, khaṭīb of al-Maqsī Mosque and one of the readers of the ṣuffa at al-Baybarsiyya. He was good, with a beautiful recitation, and earned his living as a witness at Ḥānūt al-Dikka. He died on the first of Dhū al-Ḥijja in the year 851 AH.
