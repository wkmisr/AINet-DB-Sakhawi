translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・アフマド（通称イブン・ズルクルク）、ブルハーン・アッ＝ディーン、バスラ出身のシャーフィイー派法学者。ムハンマドとその兄弟の父。法学について韻文の著作『アル＝ユスル』があり、その中で次のように述べた。「アル＝ユスルと名付けたのは、おそらくアッラーがターハーの権利において我々に容易さを授けてくださるからであろう」。マッカ在住でそのカーディー、イブン・ザヒーラの友であったアブドゥッラー・アル＝バスリーが、彼から学んだ者の一人である。
  en: 'Ibrāhīm b. Muḥammad b. Aḥmad, Burhān al-Dīn, al-Baṣrī, a Shāfiʿī scholar, known as Ibn Zurqurq. He was the father of Muḥammad and his brothers. He composed a versified work on fiqh named 『al-Yusr』, in which he stated: “He named it al-Yusr, perhaps God will grant us ease by the right of Ṭāhā.” Among those who learned from him was ʿAbd Allāh al-Baṣrī, who resided in Mecca and was a companion of its qadi, Ibn Ẓahīra.'
