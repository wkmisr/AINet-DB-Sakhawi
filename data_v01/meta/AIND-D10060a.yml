translation:
  ja: ムーサー・ブン・アル＝フサイン・ブン・ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・アビー・ッ＝リジャール・アフマド・ブン・アブドゥッラー・ブン・イーサー・ブン・アフマド・ブン・アリー・ブン・ムハンマド・ブン・ムハンマド、クトゥブ〔・ッディーン〕・アル＝フサイニー・アル＝ユーニーニー・アル＝バアリー、ハンバル派。762年ラビーウ第1月に生まれ、シャムス・イブン・アル＝ユーナーニーヤのもとで法学・相続法・文法を、父のもとで相続法を学んだ。アフマド・ブン・アブド・アル＝カリーム・アル＝バアリーから『サヒーフ・ムスリム』を、アフマド・ブン・ムハンマド・ブン・ラーシド・イブン・ハトリーシャーから『イブン・アビー・ッ＝ドゥンヤーのタワックル』を、ムハンマド・ブン・アリー・ブン・アフマド・アル＝ユーニーニー、ムハンマド・ブン・ムハンマド・ブン・イブラーヒーム・アル＝フサイニー、ムハンマド・ブン・アフマド・アル＝ジャルディーから『サヒーフ』を聴聞し、ナジュム・イブン・アル＝カシュクのもとで『イブン・イスハークのスィーラ』を読んだ。ハディースを伝え、学識者たちが彼から聴聞した。40歳近くで没した。
  en: Mūsā b. al-Ḥusayn b. Muḥammad b. ʿAlī b. Muḥammad b. Abī al-Rijāl Aḥmad b. ʿAbd Allāh b. ʿĪsā b. Aḥmad b. ʿAlī b. Muḥammad b. Muḥammad, al-Quṭb al-Ḥusaynī al-Yūnīnī al-Baʿlī al-Ḥanbalī. Born in Rabīʿ I 762, he studied fiqh, inheritance law and grammar with al-Shams Ibn al-Yūnāniyya and inheritance law with his father; heard Ṣaḥīḥ Muslim from Aḥmad b. ʿAbd al-Karīm al-Baʿlī, al-Tawakkul of Ibn Abī al-Dunyā from Aḥmad b. Muḥammad b. Rāshid Ibn Khaṭlīshā, and the Ṣaḥīḥ from Muḥammad b. ʿAlī b. Aḥmad al-Yūnīnī, Muḥammad b. Muḥammad b. Ibrāhīm al-Ḥusaynī and Muḥammad b. Aḥmad al-Jardī; and read the Sīra of Ibn Isḥāq to al-Najm Ibn al-Kashk. He transmitted, and learned men heard from him. He died near forty.
