translation:
  ja: ムハンマド・ブン・アブドゥッラー、ナースィルッディーン・アッ＝ディマシュキー・アル＝アカビー。我らがシャイフ（イブン・ハジャル）は『インバー』で言う。彼は軍人でアスタダール職（の部局）に勤めていたが、のちにそれを捨ててスーフィーの装いをまとい、アブー・バクル・アル＝マウスィリーに随従した。その後アル＝アカバ・アッ＝スグラーにザーウィヤを建ててそのシャイフとなり、そこに貧者（修行者）たちを住まわせて食事を与えたので、彼の信従者は増えた。そして賃貸物件（の収入）で生計を立てるようになった。容姿と髭が美しく、見目のよい人であった。815年ジュマーダー・アル＝ウーラー月に63歳で没した。
  en: 'Muḥammad b. ʿAbd Allāh, Nāṣir al-Dīn al-Dimashqī al-ʿUqbī. Our shaykh (Ibn Ḥajar) said in his Inbāʾ: he was a soldier serving in the ustādāriyya; then he gave that up, put on the garb of the Sufis and kept the company of Abū Bakr al-Mawṣilī. He then built a zāwiya at al-ʿUqba al-Ṣughrā and became its shaykh, and lodged poor (devotees) there whom he fed, so his followers multiplied; and he came to earn his living from rented properties. He was of handsome appearance and beard, fine to look upon. He died in Jumādā I of the year 815, aged sixty-three.'
