translation:
  ja: ムハンマド・ブン・スードゥーン・ドゥクマーク、ナースィルッディーン。イクター保有者（ムクタウ）の一人。父は先述され、母のアーイシャ（アミール・ナースィルッディーン・ムハンマド・ブン・アル＝アッタールの娘）は後述される。同母の姉妹はファーティマ（タイブガーの娘）である。彼は現在存命である。
  en: Muḥammad b. Sūdūn Duqmāq, Nāṣir al-Dīn, one of the iqṭāʿ-holders. His father has been mentioned above, and his mother ʿĀʾisha, the daughter of the amir Nāṣir al-Dīn Muḥammad b. al-ʿAṭṭār, will be mentioned below; his uterine sister is Fāṭima, the daughter of Ṭaybughā. He is still alive at present.
