translation:
  ja: クーズィー・アッ＝ザーヒリー・ジャクマク。ジャクマクが即位する前からそのマムルークで、即位するとハーッサキーに、次いでサーキーに、次いで十人隊アミールにした。その後失脚したが、やがてフシュカダムが彼を十人隊アミールに任じ、ラアス・ナウバの一人とした。サワールへの遠征に出て病を得て帰還し、873年ジュマーダー・アル＝ウーラー月、壮年のうちに没した。スルターンはアル＝ムウミニー（礼拝所）での葬礼に臨席した。物静かで、容姿が美しく、穏やかな人であった。
  en: Qūzī al-Ẓāhirī Jaqmaq. He was one of Jaqmaq's mamlūks before the latter's accession; when he became sultan he made him a khāṣṣakī, then a cupbearer (sāqī), then an amīr of ten. He then fell into disgrace, until Khushqadam made him an amīr of ten and one of the heads of the guard (ruʾūs al-nuwab). He went out on the expedition against Sawār and returned ill, until he died in Jumādā al-Ūlā 873 while still in middle age. The sultan attended the funeral prayer over him at al-Muʾminī. He was quiet, handsome and gentle.
