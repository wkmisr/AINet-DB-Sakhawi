translation:
  ja: ジャーウシャン (Jawshan) の息子として知られるアフマド・ブン・アリー・ブン・フサイン・アル＝ミスリー・アル＝マッキー。メッカの商人の一人であった。彼がハッダ・バニー・ジャービル（al-Hadda Banī Jābir）にある貧しい人々のための財産をワクフとして供与したことが私（＝サハーウィー）に伝えられている。801年にメッカで亡くなり、アル＝ムアッラー（al-Muʿallā）に埋葬された。ファーシーがその『歴史書』で述べた。
  en: Aḥmad b. ʿAlī b. Ḥusayn, of Egyptian origin, residing in Mecca, known as Ibn Jawshan. He was one of the merchants in Mecca. It has reached me (al-Sakhāwī) that he endowed property in al-Hadda Banī Jābir for the poor. He died in Mecca in the year 801 and was buried in al-Muʿallā. Al-Fāsī mentioned this in his history.
