translation:
  ja: ムハンマド・ブン・アリー・ブン・ムーサー・ブン・クライシュ・アル＝ハーシミー・アル＝マッキー。852年サファル月に同地（マッカ）で没した。イブン・ファハドが二人（前項の人物と本項主）の没年を記録している。
  en: Muḥammad b. ʿAlī b. Mūsā b. Quraysh al-Hāshimī al-Makkī. He died there (in Mecca) in Ṣafar of the year 852. Ibn Fahd recorded the dates of death of both of them (the preceding entry and this one).
