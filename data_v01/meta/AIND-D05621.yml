translation:
  ja: アリー・ブン・ムハンマド・アル＝アフミーミー。バグダードの家系。［ヒジュラ暦８］１４年に没した。我らがシャイフ（イブン・ハジャル）は、彼の没年を記録し、彼が宰相職（ワズィール）や諸官庁監督職（シャッド・アッ＝ダワーウィーン）などを歴任したと述べ、彼が「アッ＝シャラフ（シャラフ・アッ＝ディーン）」と呼ばれていたと記している。
  en: ʿAlī b. Muḥammad al-Akhmīmī, of Baghdadi origin. He died in the year 814 AH. Our shaykh (Ibn Ḥajar) chronicled his death and mentioned that he held the vizierate (al-wizāra) and the office of comptroller of the chanceries (shadd al-dawāwīn), among other posts, and that he was called al-Sharaf.
