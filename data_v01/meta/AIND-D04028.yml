translation:
  ja: アブドゥルアズィーズ・ブン・イッズ・アッ＝ディーン・アン＝ナフヤーニー・アル＝ミスリー。カラーファ門近くのマドラサの主で、そこでは毎月17日の夜に朗誦者たちが集まった。またハシュカダム・アッ＝ザマームに帰属する者の一人。幾度もメッカに滞在（ジワール）し、多くの財を持つと伝えられ、明らかな親しみやすさゆえに彼を称賛する声を私も聞いたことがある。声が美しく合唱朗誦隊（ジャウク）で朗誦したが、声量は足りなかった。アフマド・ブン・アル＝ハターティーの娘と結婚した。892年または893年に没した。神が彼を赦したまえ。
  en: ʿAbd al-ʿAzīz b. ʿIzz al-Dīn al-Nafyānī al-Miṣrī, owner of the madrasa near Bāb al-Qarāfa in which the reciters gather on the seventeenth night of every month, and one of those attached to Khushqadam al-Zimām. He performed jiwār more than once, is said to have had much wealth, and I have heard people praise him for his evident amiability and his recitation in the jawq thanks to his fine voice, though it lacked strength. He married the daughter of Aḥmad b. al-Ḥatātī. He died in 892 or 893 AH; may God pardon him.
