  ja: ハイダル・ブルハーン・アッ＝ディーン。シーラーズのアル＝カッザーリーヤ・マドラサの教授。アッ＝タフターザーニーから学んだ。アッ＝ターウースィーは「（ヒジュラ暦）801年に自身にイジャーザを授けてくれた」と述べている。
  en: 'Ḥaydar Burhān al-Dīn, teacher of al-Qazzāriyya in Shīrāz. He was among those who took from al-Taftāzānī. Al-Ṭāwūsī said: ''He granted me ijāza in the year 801 AH.'''
