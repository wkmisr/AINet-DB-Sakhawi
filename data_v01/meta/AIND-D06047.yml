translation:
  ja: ウマル・アン＝ナッジャール。マスジド・アル＝ハラームの門の一つであるバーブ・アル＝ウムラのミナレットの最後のムアッズィンであり、マッカのズカーク・アル＝ハジャルにある信徒の母（ハディージャ）の家の奉仕人であった。（8）51年に没した。イブン・ファハドがその没年を記している。
  en: ʿUmar al-Najjār, the last muezzin of the minaret of Bāb al-ʿUmra, one of the gates of al-Masjid al-Ḥarām, and servant of the House of the Mother of the Believers in Zuqāq al-Ḥajar in Mecca. He died in the year (8)51. Ibn Fahd recorded his death date.
