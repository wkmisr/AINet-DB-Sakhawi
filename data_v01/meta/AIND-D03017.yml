translation:
  ja: ルマイサ・ブン・アビー・アル＝カースィム・ブン・ハサン・ブン・アジュラーン・ブン・ルマイサ・ブン・アビー・ヌマイ・アル＝ハサニー・アル＝マッキー。スィカンダリーヤ（アレクサンドリア）から戻る途中の879年ラビー・アッ＝サーニー月に、マハッラにおいて異郷で亡くなった。彼の葬儀礼拝には無数の人々が参列し、埋葬された。彼がカイロに赴いたのは876年のことであった。神の慈悲あれ。
  en: Rumaytha ibn Abī al-Qāsim ibn Ḥasan ibn ʿAjlān ibn Rumaytha ibn Abī Numayy al-Ḥasanī al-Makkī. He died away from home in al-Maḥalla while returning from Alexandria in Rabīʿ al-Thānī 879 AH. An innumerable crowd of people attended his funeral prayer and buried him. He had traveled to Cairo in 876 AH. May Allah have mercy on him.
