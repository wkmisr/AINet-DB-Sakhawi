  type: editorial
translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・イブラーヒーム、アッ＝シャムス・アル＝キブティー。アッ＝タージュ・アブドゥッラッザーク、およびイブラーヒームの父アブドゥルガニーの兄弟で、彼らのことは既述。イブン・アル＝ハイサムとして知られる。（8）50年ジュマーダー・アル＝ウーラー月に没し、バーブ・アン＝ナスル外の墓所に葬られた。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Ibrāhīm, al-Shams al-Qibṭī, brother of al-Tāj ʿAbd al-Razzāq and of ʿAbd al-Ghanī the father of Ibrāhīm, all of whom have been mentioned above. He was known as Ibn al-Hayṣam. He died in Jumādā I of the year [8]50 and was buried in a tomb outside Bāb al-Naṣr.
