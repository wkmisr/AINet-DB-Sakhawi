  note:
    ja: '父＝سعد الدين إبراهيم（ابن الهيصم）。通称索引 #AIND-D12803「ابن الهيصم التاج عبد الرزاق والمجد عبد الغني والشمس محمد بنو سعد الدين إبرهيم فأولهم جد ناظر الخاص الجمال يوسف وأخيه إبرهيم لأمهما وثانيهم والد أمين الدين إبرهيم」が3兄弟を「بنو سعد الدين إبرهيم」と明記し、兄 #AIND-D03895 の見出しも「عبد الرزاق بن إبراهيم تاج الدين بن سعد الدين القبطي المصري」「ويعرف كأبيه بابن الهيصم」。本伝のある兄弟2人と共有する父で、ラカブ سعد الدين・家名を持つ（規則3）。corpus に本伝なし（hwm.py「الهيصم」）、ID-Master の既登録は別人の TMP-P-000531「أمين الدين الهيصم」のみ＝新規仮番号 TMP-P-001754。本項の見出しは「محمد بن عبد الرحمن بن إبراهيم」で、父を عبد الرحمن とする形になっており、兄弟2人（بن إبراهيم）・索引・corpus 上の配列（محمد بن إبراهيم の項群の中、الشمس التروجي と صفي الدين の間）と食い違う。persName は刊本どおりとし（規則25）、食い違いはこの note に留める。【集約 2026-11-18】索引 #AIND-D12803 が本項主を名指しし、兄 #AIND-D03895 も「وأخو محمد الآتي」と書く＝父は確定とみて cert を外した（オーケストレーター決定7、検証A §4、ISSUES §D171-2）。初版は父 relation なし。'
