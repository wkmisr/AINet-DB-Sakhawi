notes:
- text: '「أخو التاج عبد الرزاق وعبد الغني والد إبراهيم الماضي ذكرهم」の「والد إبراهيم」は直前の عبد الغني にかかる（規則63(b)）。複数形「ذكرهم」は عبد الرزاق・عبد الغني・إبراهيم の3人を指し、相手側 #AIND-D04050 が「ووالد الأمين إبراهيم」、索引 #AIND-D12803 が「وثانيهم والد أمين الدين إبرهيم」と記すのと一致する。إبراهيم＝#AIND-D00150「إبراهيم بن عبد الغني بن إبراهيم أمين الدين بن مجدالدين القبطي المصري ويعرف بابن الهيصم」（本項主の甥）。本項主の子としての إبراهيم の本伝は corpus にない。初版は إبراهيم を本項主の子（son relation、零番号）としていた＝除去。甥との関係は兄弟 relation から導けるので relation は立てない。'
