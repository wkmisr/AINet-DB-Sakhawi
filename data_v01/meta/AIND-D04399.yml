notes:
- text: '「مضى في ابن أحمد بن أبي الحسن قريبا」＝転送見出し。転送先は #AIND-D04387（عبد الله بن أحمد بن أبي الحسن علي بن عيسى بن محمد بن عيسى بن محمد بن عيسى الجمال الحسني السمهودي الشافعي、生804・没866）。本見出しは父 أحمد の父を「أبو الحسن علي」のクンヤなしに「علي」とした異形で、以下の「بن عيسى بن محمد بن عيسى」が一致する。同じ عبد الله بن أحمد بن أبي الحسن は D05247（子 النور علي「الماضي أبوه وجده」）・D05808（「السيد الجمال عبد الله بن أحمد بن أبي الحسن الماضي」）でも同一人と確認。'
