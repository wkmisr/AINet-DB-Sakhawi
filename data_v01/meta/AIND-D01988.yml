translation:
  ja: 959. イスマーイール・ブン・ナービット・ブン・イスマーイール・ブン・アリー・ブン・ムハンマド・ブン・ダーウード、マジュド・アッ＝ディーン・アッ＝ザムザミー（彼の父については後述、祖父については先述）。彼は『ミンハージュ』と『アルフィーヤ』を朗誦し、カーディー・ムフイー・アッ＝ディーン・アル＝マーリキーのもとで提示し、立ち会い、アラビア語学に没頭した。また、『ブハーリー』を朗誦し、私（サハーウィー）から少し聴聞した。彼はアザーン（礼拝告知）とアッ＝アッバース給水所の責任者の一人であった。彼は998年ズー・アル＝カアダ月末にメッカで死去した。
  en: 959. Ismāʿīl b. Nābit b. Ismāʿīl b. ʿAlī b. Muḥammad b. Dāwūd, Majd al-Dīn al-Zamzamī (his father will be mentioned later, his grandfather was mentioned previously). He recited al-Minhāj and al-Alfīya, presented and attended under al-Qāḍī Muḥyī al-Dīn al-Mālikī in Arabic studies, and engaged in fiqh and other subjects. He also recited al-Bukhārī and heard a little from me (al-Sakhāwī). He was one of those directly performing the call to prayer and managing the watering station of al-ʿAbbās. He died in late Dhū al-Qaʿda in the year 898 H in Mecca.
