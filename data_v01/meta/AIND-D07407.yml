translation:
  ja: ムハンマド・ブン・サーリム・ブン・ザーキル・アル＝マッキー、金細工師、ライース（ムアッズィン長）ムハンマド・ブン・アビー・ル＝ハイルの親族。882年ジュマーダー・アル＝ウーラー月にマッカで没した。イブン・ファハドがその没年を記録した。
  en: Muḥammad b. Sālim b. Dhākir al-Makkī, the goldsmith, a relative of al-Raʾīs Muḥammad b. Abī al-Khayr. He died in Mecca in Jumādā al-Ūlā of the year [8]82. Ibn Fahd recorded his death date.
