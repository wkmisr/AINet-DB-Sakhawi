translation:
  ja: アブドゥッサラーム・アッ＝シャルヌービー・アル＝ブハイリー、のちにアル＝カーヒリー、アル＝マッキー。アズバク・アル＝ユースフィーのもとでイマームとして仕えたが、のちに追い出されたため、ティムラーズに身を寄せ、彼とともにブハイラ地方へ赴いた。彼の息子はシャイフーニーヤなどの朗誦者の職（禄）を得た。
  en: ʿAbd al-Salām al-Sharnūbī al-Buḥayrī, later al-Qāhirī, al-Makkī. He served Azbak al-Yūsufī as imam, but the latter dismissed him, so he attached himself to Timrāz and travelled with him to al-Buḥayra. His son obtained a place among the Qurʾān readers of al-Shaykhūniyya and elsewhere.
