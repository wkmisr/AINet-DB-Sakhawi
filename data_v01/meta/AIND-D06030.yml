translation:
  ja: ウマル・アル＝ハサニー・アル＝ビジャーイー・アル＝マーリキー、マッカの寄留者。カーディー・アブド・アル＝カーディルへのイジャーザ（授与）に際して、アル＝ワーヌーギーに対する証人となった者の一人。
  en: ʿUmar al-Ḥasanī al-Bijāʾī al-Mālikī, resident of Mecca. He was among those who witnessed al-Wānūghī's ijāza to the qāḍī ʿAbd al-Qādir.
