  note:
    ja: '本項主はイジャーザの証人（先例 D01491 の event 型。初版の統制外 relation「witnessed signature」「witnessed ijāza」を除去）。الوانوغي＝#AIND-D09463（محمد بن موسى بن عائذ أبو عبد الله الغماري المغربي الوانوغي المالكي نزيل مكة وشيخ رباط الموفق）、القاضي عبد القادر＝#AIND-D04166（عبد القادر بن أبي القسم … المكي المالكي、814年生、843年マッカのマーリク派カーディー）。直接証拠: D09463 本文末尾「رأيت في أجايز المحيوي عبد القادر بن أبي القسم محمد المالكي قاضي مكة أنه حضر عليه دروسا كثيرة … وأذن له في التدريس لجميع كتب المالكية وأرخ الإجازة بثالث ذي القعدة سنة اثنتين وثلاثين」が授与者・受領者を名指しし、D04166 本文「أخذ الفقه عن محمد بن موسى بن عائد الوانوغي نزيل مكة وشيخ رباط الموفق بها … وأذنوا له في التدريس」とも閉合するため cert は付けない（検証後訂正 2026-10-10: 校閲の cert medium を除去、内容B L）。イジャーザの日付 832-11-03 ＝ 1429-08-13（h2g.py）は D09463 側の情報のため属性にせず note 留め（規則23。D09463 の没年827との矛盾はサハーウィー自身が「ويحرر تاريخ وفاته」と注記）。同名の #AIND-D06727（محمد بن أحمد بن عثمان التونسي الوانوغي、819年没）は該当しない。ID-Master の TMP-P-000485「أبو عبد الله الوانوغي teacher (ijāza)」（D00511 で使用）の実体は D06727 か D09463 か確定できない（検証後訂正:
      校閲の「D06727 と同一」は根拠不足、要判断）。'
