translation:
  ja: ムハンマド・ブン・アフマド・ブン・アビー・バクル・ブン・ジュバイル・アル＝ハラビー、仕立て職人。その生年が761年であることを示すことを語っていた。イブン・スィッディークのもとで『サヒーフ』の一部を聴き、ハディースを伝えた。アン＝ナジュム・ブン・ファハドが彼から聴き、父の『ムウジャム』その他で彼に言及して、その善良さ、敬虔さ、仕立ての腕のよさとその仕事の誠実さを称え、「彼には敬虔な人々の風格がある」と言った。……に没した（以下欠）。
  en: 'Muḥammad b. Aḥmad b. Abī Bakr b. Jubayr al-Ḥalabī, the tailor. He mentioned something indicating that his birth was in the year 761. He heard part of the Ṣaḥīḥ under Ibn Ṣiddīq and transmitted ḥadīth. Al-Najm b. Fahd heard from him and mentioned him in his father’s Muʿjam and elsewhere, praising him for his goodness, his devotion, his skill in tailoring and his honesty in it; he said: “He bears the mark of the righteous.” He died in … [the text breaks off].'
