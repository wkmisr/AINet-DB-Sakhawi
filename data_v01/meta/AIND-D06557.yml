translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・ヤフヤー・ブン・ムハンマド・ブン・イブラーヒーム、カワーム・アッ＝ディーン・ブン・ギヤース・アッ＝ディーン、アル＝フサイニー、アル＝カーザルーニー。743年ズー・アル＝カアダ月にガザで生まれ、アル＝アミーン・ムハンマド・アル＝バルヤーニーに学び、サイード・アッ＝ディーン・アル＝カーザルーニーから伝えた。アッ＝ターウースィーは「29年に彼は私にイジャーザを与えた」と述べている。
  en: 'Muḥammad b. Ibrāhīm b. Muḥammad b. Yaḥyā b. Muḥammad b. Ibrāhīm, Qawām al-Dīn b. Ghiyāth al-Dīn, al-Ḥusaynī al-Kāzarūnī. He was born in Gaza in Dhū al-Qaʿda of the year 743, studied under al-Amīn Muḥammad al-Balyānī and transmitted from Saʿīd al-Dīn al-Kāzarūnī. Al-Ṭāwūsī said: "He gave me an ijāza in the year 29."'
