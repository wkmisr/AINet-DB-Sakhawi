  note:
    ja: '二重立項（どちらにも転送指示なし＝両項とも実項）。#AIND-D09254「محمد بن محمد بن محمد بن يحيى بن محمد بن إبرهيم السيد قوام الدين بن غياث الدين العلوي الحسيني الموسوي الكازروني القاضي . ولد في غرة ذي القعدة سنة ثلاث وأربعين وسبعمائة بكازرون وسمع من الموفق الزرندي الصحيح ومن العفيف الكازروني ثم من ولده سعيد الدين المقتفي في مولد المصطفى له وولي قضاء كازرون . وممن روى عنه التقي بن فهد وذكره في معجمه」（repo 未収録）。ラカブ قوام الدين・父のラカブ غياث الدين・祖父以上のナサブ（محمد بن يحيى بن محمد بن إبراهيم）・ニスバ الحسيني الكازروني・生年月（743年ズー・アル＝カアダ月）・師 سعيد الدين が一致し、相違は父の名（إبراهيم／محمد）のみ。サハーウィー自身の同定の言はないが一致点が多い＝cert high（先例 #AIND-D10247⇄#AIND-D12832。ISSUES §D170-3）。鏡像は D09254 受領時。カーディー職・生地 كازرون・師 الموفق الزرندي・ابن فهد は相手側にのみある属性＝本項には立てない（規則23）。'
