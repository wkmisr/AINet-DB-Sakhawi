- text: He served as accountant (mustawfī) of the Umayyad Mosque and was the most eminent of those remaining among its administrators (mubāshirūn).
  lang: en
  type: personalia
translation:
  ja: アフマド・ブン・ムハンマド・アッ＝シハーブ・アッ＝ディマシュキー・イブン・アル＝アッタール。ウマイヤ・モスクの会計官（ムスタウフィー）を務め、その責任者たちの中で最も傑出した生き残りの一人であった。彼は一時期ハディースを学んだ。アッ＝シャムス・ブン・サイイドおよびイブン・イマーム・アル＝マシュハドの学友（同輩）であった。801年シャウワール月に死去した。我らがシャイフ（イブン・ハジャル）がその著『インバーウ（・アル＝グムル）』で彼に言及している。
  en: Aḥmad b. Muḥammad al-Shihāb al-Dimashqī b. al-ʿAṭṭār. He served as the accountant (mustawfī) of the Umayyad Mosque and was among the most eminent of its surviving administrators. He sought ḥadīth for a time, and was a companion (rafīq) of al-Shams b. Sayyid and Ibn Imām al-Mashhad. He died in Shawwāl of the year 801 H. Our shaykh (Ibn Ḥajar) mentioned him in his work Inbāʾ (al-Ghumr).
