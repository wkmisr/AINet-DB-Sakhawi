translation:
  ja: ムハンマド・ブン・アブドゥッラー、ナースィルッディーン・アッ＝タルージー、のちアル＝カーヒリー、アル＝マーリキー。マーリキー派の代理判事（ナーイブ）の一人。（8）03年に没し、称賛される人物であった。我らがシャイフ（イブン・ハジャル）が『インバー』でそう述べている。アル＝マクリーズィーは『ウクード』で彼の父の名を挙げず、彼がサファル月に没したこと、そしてアル＝カマール・アッ＝ダミーリーが彼の死後に（夢で）彼を見て「神はそなたに何をなされたか」と尋ねると、「死後に財を残さずにいられるなら、そうせよ」と答えたことを記している。
  en: Muḥammad b. ʿAbd Allāh, Nāṣir al-Dīn al-Tarūjī, then al-Qāhirī, the Mālikī, one of the Mālikī deputy judges. He died in the year [8]03 and was well regarded; our shaykh (Ibn Ḥajar) said so in his Inbāʾ. Al-Maqrīzī in his ʿUqūd did not name his father, and recorded that he died in Ṣafar, and that al-Kamāl al-Damīrī saw him after his death and asked him, "What has God done with you?" He replied, "If you can manage to leave no wealth behind you, do so."
