  ja: カースィム・ブン・アリー・ブン・フサイン、アル＝ハイザーニー、クルアーン読誦教師。既述のイブラーヒームの父。イブン・アイヤーシュのもとで読誦し、自らも読誦を教えた。
  en: Qāsim b. ʿAlī b. Ḥusayn al-Ḥayzānī, the Qurʾān reciter (muqriʾ), father of the aforementioned Ibrāhīm. He recited under Ibn ʿAyyāsh and taught recitation himself.
