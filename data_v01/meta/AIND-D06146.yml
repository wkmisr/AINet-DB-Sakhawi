translation:
  ja: ファーイズ・ブン・アル＝ファフル・アビー・バクル・ブン・アフマド・アル＝マダニー。父は後述する。父と同じくイブン・アル＝アイニーとして知られる。マディーナで私から聴聞した者の一人。
  en: Fāyiz b. al-Fakhr Abī Bakr b. Aḥmad al-Madanī; his father will come below. Like him he is known as Ibn al-ʿAynī. He is one of those who heard from me in Medina.
