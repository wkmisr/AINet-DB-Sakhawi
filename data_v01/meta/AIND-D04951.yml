translation:
  ja: アリー・ブン・アッ＝シハーブ・アフマド・ブン・アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・アリー・ブン・アブドゥルカリーム・ブン・ユースフ・ブン・サーリム・ブン・ドゥライム、アル＝クラシー、アル＝バスリー、アル＝マッキー。872年ラビーウ・アル＝アウワル月に同地（マッカ）で、酩酊した状態で没した。神が彼を赦したまわんことを。イブン・ファハドがその没年を記録した。
  en: ʿAlī b. al-Shihāb Aḥmad b. Aḥmad b. Muḥammad b. Muḥammad b. ʿAlī b. ʿAbd al-Karīm b. Yūsuf b. Sālim b. Dulaym al-Qurashī al-Baṣrī al-Makkī. He died there (in Mecca) in Rabīʿ al-Awwal of the year 872 while intoxicated, may God pardon him. Ibn Fahd recorded his death.
