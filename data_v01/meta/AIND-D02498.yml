translation:
  ja: ハズマーン（第一音節はファトハで発音）。チェルケス系の名前である。アッ＝ザーヒル・バルクーク（のマムルーク）。主人の子（アン＝ナースィル・ファラジュ）の時代に出世を重ね、イェルサレムのナーイブ（代官）を務めた後、第二ダワーダールとなった。その後、その（ナースィルへの）服従を離れてダマスクスを目指して逃亡したが、ガザで捕らえられて連行された。アン＝ナースィルは彼を数日間監禁した後、814年に胴斬り（タウスィート）に処した。
  en: Ḥazmān (with fatḥ), a Circassian name; [a mamluk] of al-Ẓāhir Barqūq. He was among those who rose through the ranks in the days of his master's son (al-Nāṣir Faraj), serving as nāʾib of Jerusalem and then becoming second dawādār. Afterward he abandoned his (al-Nāṣir's) obedience and fled, making for Damascus; he was seized in Gaza and brought back. Al-Nāṣir imprisoned him for some days, then had him cut in two (wassaṭahu) in the year 814.
