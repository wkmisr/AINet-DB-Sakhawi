translation:
  ja: ムハンマド・ブン・サイード・アッ＝トゥーニスィー、アル＝ガーフィキーとして知られる。アブー・アル＝カースィム・アル＝クサンティーニーの同輩の一人で、二人はヤアクーブ・アッ＝ズグビーをはじめ法学に秀でた人々から共に学んだ。教授し、ファトワーを発し、人々は彼から益を得た。860年以後に没した。
  en: Muḥammad b. Saʿīd al-Tūnisī, known as al-Ghāfiqī, one of the peers of Abū al-Qāsim al-Qusanṭīnī; the two of them studied together under Yaʿqūb al-Zughbī and others who were advanced in jurisprudence (fiqh). He taught, issued fatwas, and people benefited from him. He died after 860.
