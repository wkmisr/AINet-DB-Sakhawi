translation:
  ja: アクバーイ・アル＝カラキー・アッ＝ザーヒリー・バルクーク。ターズ・アル＝ハーザンダールとしても知られる。ナースィル・ファラジュの時期にタクディマ（大アミール職）に就いたが、後にアレクサンドリアに投獄された。その後、元の役職に復帰したが、長きにわたる病の末、895年ジュマーダー・アル＝ウーラー14日土曜の夜に亡くなり、翌日、バーブ・アン＝ナスル外のザーヒル家墓地（ハウシュ・アッ＝ザーヒル）に埋葬された。アル＝アイニーらが彼について言及している。
  en: Aqbay al-Karakī al-Ẓāhirī Barqūq, known as Tāz al-Khāzindār. He received a taqdima (command of a hundred) under al-Nāṣir Faraj, then was imprisoned in Alexandria. He was later reinstated to his position, but did not live long, dying after a prolonged illness on the night of Saturday, the 14th of Jumādā al-Ūlā in the year 895. He was buried the following day in Ḥawsh al-Ẓāhir, outside Bāb al-Naṣr. Al-ʿAynī and others mentioned him.
