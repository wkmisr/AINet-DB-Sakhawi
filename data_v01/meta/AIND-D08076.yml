translation:
  ja: ムハンマド・ブン・アリー・ブン・ズィヤーダ・アル＝ガムリー、クルアーン朗誦者（ムクリ）。クルアーンを朗誦し、それを合唱朗誦隊（アジュワーク）で生業とし、宮殿の朗誦者（クッラー・アル＝カスル）の一人となった。時折私（サハーウィー）のもとに出席した。バーブ・アル＝カンタラの外のハリーリーイーン（絹商人街）に店をもっていた。889年に巡礼した。
  en: Muḥammad b. ʿAlī b. Ziyāda al-Ghamrī, the Qurʾān reciter. He recited the Qurʾān and earned his living by it in the recitation choirs (ajwāq), and became one of the reciters of the palace. He occasionally attended my (al-Sakhāwī's) sessions. He had a shop outside Bāb al-Qanṭara in al-Ḥarīriyyīn (the silk-merchants' quarter), and he performed the pilgrimage in the year 889.
