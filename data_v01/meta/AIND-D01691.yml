translation:
  ja: アフマド・ブン・ヤフヤー・ブン・イーサー、アル＝シハーブ・アル＝スンハージー、アル＝マグリビー、アル＝ムクリ（クルアーン朗誦家）。アル＝ダーニー著『アル＝タイスィール』をアル＝ファウイーから、アブドゥルラフマーン・ブン・ムハンマド・ブン・イスマーイール・アル＝カルキーと共に聴聞した。
  en: Aḥmad b. Yaḥyā b. ʿĪsā, al-Shihāb al-Ṣanhājī al-Maghribī al-Muqriʾ (Qurʾān reciter). He heard al-Taysīr by al-Dānī from al-Fuwwī, together with ʿAbd al-Raḥmān b. Muḥammad b. Ismāʿīl al-Karakī.
