translation:
  ja: ウマル・ブン・アビー・アル＝カースィム・ムハンマド・ブン・アビー・アル＝ファドル・ムハンマド・ブン・アフマド・ブン・アビー・アル＝ファドル・ムハンマド・ブン・アフマド・ブン・アブド・アル＝アズィーズ、アン＝ヌワイリー、アル＝マッキー。父は後述。（8）40年にザイナブ・イブナ・アル＝ヤーフィイーらが彼にイジャーザを与えた。同年ラビーウ・アル＝アーヒル月に没した。
  en: ʿUmar b. Abī al-Qāsim Muḥammad b. Abī al-Faḍl Muḥammad b. Aḥmad b. Abī al-Faḍl Muḥammad b. Aḥmad b. ʿAbd al-ʿAzīz al-Nuwayrī al-Makkī; his father comes below. In the year (8)40 Zaynab bint al-Yāfiʿī and others gave him an ijāza. He died in Rabīʿ II of that year.
