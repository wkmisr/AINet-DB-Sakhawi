translation:
  ja: アブド・アル＝カビール・ブン・ムハンマド・ブン・アフマド、アル＝アラー・アブー・アル＝カースィム・ブン・アル＝ジャマール・アル＝ハラーズィー・アル＝マッキー・アル＝ハナフィー。アフマドとアブド・アッラーの兄弟で、最年少。成長してクルアーンと『アル＝カンズ』を暗記し、マッカで私（サハーウィー）にそれを提示（暗誦）した。
  en: ʿAbd al-Kabīr b. Muḥammad b. Aḥmad, al-ʿAlāʾ Abū al-Qāsim b. al-Jamāl al-Ḥarāzī al-Makkī al-Ḥanafī, brother of Aḥmad and ʿAbd Allāh, and the youngest of them. He grew up, memorized the Qurʾān and al-Kanz, and presented it to me in Mecca.
