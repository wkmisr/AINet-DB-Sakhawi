translation:
  ja: ジャンバク・アッ＝ザーヒリー・アル＝アブラク。バーシャート（先任兵たち）に加わってマフマルを先導した十人長（アミール・アシャラ）の一人であった。ヒジュラ暦868年の両ジュマーダー月のいずれかに、キプロス島のマーウーサでフランク人によって殺害された。
  en: Jānbak al-Ẓāhirī al-Ablaq was one of the amirs of Ten, among those of the bāshāt who drove the maḥmal. He was killed by the Franks at al-Māʿūṣa on the island of Cyprus in one of the two Jumādās in the year 868 AH.
