translation:
  ja: アブド・アル＝カリーム・ブン・ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・ジャウシャン・アル＝マッキー、同地（マッカ）からイエメンへ行き来していた商人。マッカで没し、家々とナツメヤシを遺した。イブン・ファフドがその『補遺（ザイル）』で名前のみ挙げている。
  en: ʿAbd al-Karīm b. Muḥammad b. ʿAlī b. Muḥammad b. Jawshan al-Makkī, the merchant who used to travel from there to Yemen. He died in Mecca, having left houses and palm trees. Ibn Fahd listed him bare in his Dhayl.
