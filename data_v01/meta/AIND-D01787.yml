translation:
  ja: アフマド・ブン・アッ＝スルージー・アル＝ジャービー。アル＝ムアイヤディーヤのワクフの徴収官（ジャービー）であった。893年ラビーウ・アッ＝サーニー月に死去。かつては威勢がよく強情であったが、その後ひどく落魄し老いさらばえた。享年は60歳を超えていたと思われる。
  en: Aḥmad b. al-Surūjī al-Jābī, the revenue-collector (jābī) of the Waqf al-Muʾayyadiyya. He died in Rabīʿ al-Thānī in the year 893 H. He had become very poor and infirm after having been mighty and strong-headed. I believe he was over sixty years old.
