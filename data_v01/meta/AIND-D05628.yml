translation:
  ja: アリー・ブン・ムハンマド・アッ＝リッカーブ。カイロの狂実者（マジュズーブ）の一人。863年シャアバーン月（1459年6月）に死去し、マイダーン・アッ＝カムフ（小麦広場）の起点近くの道沿いにあった自身のザーウィヤに埋葬された。彼はその法悦状態（ジャズバ）に入る前、スルターンの乗馬係（リッカーブ）であった。アル＝ムニールが彼の伝記を記録している。
  en: ʿAlī b. Muḥammad al-Rikkāb, one of the ecstatics (majdhūbs) in Cairo. He died in Shaʿbān 863 H (June 1459) and was buried in his zawiya on the road at the head of Maydan al-Qamh (Wheat Square). Before his spiritual attraction (jadhba), he had served as an equerry (rikkāb) of the Sultan. His biography was recorded by al-Munir.
