translation:
  ja: ハーリド・ブン・アブドゥルアール・ブン・ハーリド・アッ＝サフティー。シャイフ・ムハンマド・アル＝ガムリーの同伴者の一人。善良で、絶えず（クルアーンの）誦読とズィクルを行い、その地方の貧者（フカラー）たちの拠り所であった。私のもとに少し出席した。885年ラビーウ第2月に没した。70歳に近かったと私は思う。神が彼に慈悲を垂れたまわんことを。
  en: Khālid b. ʿAbd al-ʿĀl b. Khālid al-Safaṭī, one of the companions of Shaykh Muḥammad al-Ghamrī. He was a good man, constant in recitation and dhikr, and a refuge for the poor (fuqarāʾ) of his district. He attended my sessions a little, and died in Rabīʿ II of the year 885; I think he was nearly seventy. May God have mercy on him.
