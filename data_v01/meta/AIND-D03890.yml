translation:
  ja: アブドゥルラヒーム・ブン・ムヒュッディーン・ブン・アル＝ジーアーン。彼の父はアル＝アラミー・シャーキルの従兄弟であった。彼は父の死後、病院（ビーマーリスターン）の会計監督職（イスティーファー）およびその他の彼の職を引き継ぎ、これを855年に亡くなるまで務めた。彼の死後、会計監督職には先述のアル＝アラミー（・シャーキル）の息子、ザイン・アブドゥルバースィトが就任した。
  en: ʿAbd al-Raḥīm bin Muḥyī al-Dīn bin al-Jīʿān. His father was the cousin of al-ʿAlamī Shākir. He succeeded his father as the comptroller (istīfāʾ) of the Bīmāristān and in his other offices until his death in the year 855 AH. After his death, al-Zayn ʿAbd al-Bāsiṭ, the son of the aforementioned al-ʿAlamī, succeeded him in the comptrollership.
