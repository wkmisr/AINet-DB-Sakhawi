translation:
  ja: ジャンバク・アル＝ジュクミー、またアッ＝ザーヒリー。彼は職務や地方統治を転々とし、ついにマラティヤでナアーイブ（副知事）を務めることになった。そこでヒジュラ暦866年ラビーウ・アル＝アーヒル月に死去した。彼は高齢であった。その後、ナアーイブ職にはアイナール・アル＝アシュカル・アル＝ワーリーがマラティヤで就任した。
  en: Janbak al-Jukmī, also al-Ẓāhirī. He moved between various services and governorships until he served as nāʾib in Malatya for a period, where he eventually died in Rabīʿ al-Ākhir of the year 866, having become old. After him, Aynāl al-Ashqar al-Wālī was appointed to the nāʾib position in Malatya.
