    ja: 'クンヤ部 #AIND-D11025「389 أبو الفتح بن أبي السعود بن الكمال أبي الفضل محمد بن النجم محمد ابن أبي بكر المرجاني المكي الماضي أبوه . ممن سمع مني بمكة .」は本項主と名（クンヤ أبو الفتح）・父祖・ニスバ・サハーウィーからのマッカでの聴聞が一致。両項とも転送指示がないので二重立項型（双方向 possible_identity、断定的一致＝cert high）。D11025 は未受領のため鏡像は受領時（内容A H-2、オーケストレーター決定1）。'
notes:
- text: 'マッカの المرجاني 家（النجم محمد بن أبي بكر بن علي بن يوسف الأنصاري の一族。索引 #AIND-D12012、#AIND-D08722「أبو الفتح بن العلامة النجم … ويعرف بابن المرجاني」は未婚のまま 875 年没とあるので本項主の祖父 أبو الفضل とは別人）。生没年の記載なし。父＝#AIND-D09065（أبو السعود、840生・893没）、二重立項 #AIND-D11025（クンヤ部）との possible_identity cert high（集約 2026-10-26）。'
