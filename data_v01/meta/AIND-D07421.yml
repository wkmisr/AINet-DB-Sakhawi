  note:
    ja: '「الآتي أبوه」＝父 أبو السعود の本伝は محمد 部の #AIND-D09065「510 محمد أبو السعود شقيق الذي قبله . ولد في فجر يوم الخميس ثاني عشرى شعبان سنة أربعين وثمانمائة . ومات وأنا بمكة في منتصف ربيع الآخر سنة ثلاث وتسعين」（「شقيق الذي قبله」＝直前項 #AIND-D09064「محمد بن محمد بن محمد بن أبي بكر بن علي بن يوسف المحب بن الكمال أبي الفضل بن النجم … ويعرف كسلفه بابن المرجاني」の同母同父の兄弟＝أبو السعود محمد بن الكمال أبي الفضل محمد بن النجم محمد）。ニスバ索引 #AIND-D12012「وابنا ثانيهم المحمدان أبو السعود ومحب الدين … ولأبي السعود ولد اسمه أبو الفتح محمد」で本項主と閉合（規則37、cert なし）。D09065 は محمد 部で本項より後＝「الآتي」。初版 #NEEDID → 校閲 取り下げた仮番号 B140-P05 → 集約で本伝に差し替え（機械 H、オーケストレーター決定1。取り下げた仮番号 B140-P05 は取り下げ）。'
