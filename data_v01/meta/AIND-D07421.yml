    ja: 'クンヤ部 #AIND-D11025「389 أبو الفتح بن أبي السعود بن الكمال أبي الفضل محمد بن النجم محمد ابن أبي بكر المرجاني المكي الماضي أبوه . ممن سمع مني بمكة .」は本項主と名（クンヤ أبو الفتح）・父祖・ニスバ・サハーウィーからのマッカでの聴聞が一致。両項とも転送指示がないので二重立項型（双方向 possible_identity、断定的一致＝cert high）。D11025 は未受領のため鏡像は受領時（内容A H-2、オーケストレーター決定1）。'
