translation:
  ja: ムハンマド・ブン・アリー、アッ＝シャムス・アル＝カーヒリー、署名書記（ムワッキウ）、先述のアッ＝シハーブ・アフマドの父。アル＝アーキルとして知られた。その職能における知識で語られる者の一人で、ハイル・アッ＝ディーン・アッ＝シャンシー・アル＝ハナフィーのもとに座し（仕え）、富を得た。882年シャウワール月に没し、莫大な遺産を残した。アッラーが彼を赦されますように。
  en: Muḥammad b. ʿAlī al-Shams al-Qāhirī, the muwaqqiʿ (scribe of the chancery), father of the aforementioned al-Shihāb Aḥmad; known as al-ʿĀqil. He was among those spoken of for knowledge of his craft, and he sat (served) with Khayr al-Dīn al-Shanshī al-Ḥanafī and grew wealthy. He died in Shawwāl of the year [8]82 and left a vast estate. May God pardon him.
