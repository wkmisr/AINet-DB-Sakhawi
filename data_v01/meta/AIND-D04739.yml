translation:
  ja: アブドゥルワーヒド・ブン・アフマド・ブン・イーサー、アル＝クラシー・アル＝マッキー。カイロとマッカで私（サハーウィー）から聴聞した者の一人。父とともにカイロに入り、その後にも再び（入り）、そこからシャーム（シリア）へ旅立ったが、（8）97年に同地でペストにより没した。神が彼に（その代わりに）楽園を与えたまわんことを。
  en: ʿAbd al-Wāḥid b. Aḥmad b. ʿĪsā, al-Qurashī al-Makkī. He was among those who heard from me (al-Sakhāwī) in Cairo and Mecca. He had entered Cairo with his father, and again after that, and travelled from there to Syria (al-Shām), where he died of the plague in (8)97. May God compensate him with Paradise.
