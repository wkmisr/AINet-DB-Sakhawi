translation:
  ja: ムハンマド・ブン・アフマド・ブン・サッラーム、ナースィル・アッ＝ディーン、アッ＝シハーブの子。（8）42年の末にスードゥーン・アル＝マグリビーに代わってディムヤートを治めた。ついで翌年にそこから解任された。ディムヤートの人々があるキリスト教徒に襲いかかって殺したとき、彼がそのキリスト教徒の側に立ち、政権を彼らに対してけしかける書簡を送ったためで、その実情がスルターンに明らかになると、スルターンは彼を解任した。
  en: Muḥammad b. Aḥmad b. Sallām, Nāṣir al-Dīn b. al-Shihāb. He took charge of Damietta at the end of the year [8]42 in place of Sūdūn al-Maghribī, then was removed from it in the following year, when he took the side of a certain Christian whom the people of Damietta had set upon and killed, and wrote to incite the government against them; when the truth about him became clear to the sultan, he dismissed him.
