translation:
  ja: ジャミール・ブン・アフマド・ブン・ウマイラ・ブン・ユースフ。イブン・ユースフとして知られる。下エジプトのガルビーヤおよびサハーウィーヤ地方の一部におけるアラブのシャイフ（首長）であった。865年ジュマーダー・アル＝ウーラー月に60歳余りで没した。合法・非合法を問わず多くの財を残した。信心深く自制的な人物ではあったが、その自制は不正な取り立て（マザーリム）には及ばなかったのである。
  en: Jamīl b. Aḥmad b. ʿUmayra b. Yūsuf, known as Ibn Yūsuf, was shaykh of the Arabs in parts of the al-Gharbiyya and al-Sakhāwiyya regions of Lower Egypt. He died in Jumādā al-Ūlā of the year 865, at over sixty years of age. He left behind a great deal of wealth, both lawful and unlawful, even though he was religious and abstinent — save when it came to unjust exactions (maẓālim).
