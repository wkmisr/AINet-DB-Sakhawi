translation:
  ja: カザー（カーディー）のジャマール・アッ＝ディーン、アル＝アンサーリー、アッ＝ザビーディー、アル＝マッキー、アル＝ターヒル・ブン・ムハンマド・ブン・アブー・バクル・ブン・アリー・ブン・ユースフ。後述のアル＝ワジーフ・アブド・アッ＝ラフマーンの兄弟。「イブン・アル＝ジャマール・アル＝ミスリー」として知られる。マッカにて848年ズー・アル＝ヒッジャ（12月）に没し、兄弟の傍らに埋葬された。
  en: al-Ṭāhir b. Muḥammad b. Abī Bakr b. ʿAlī b. Yūsuf, the Qāḍī Jamāl al-Dīn al-Anṣārī al-Zabīdī al-Makkī. He is the brother of al-Wajīh ʿAbd al-Raḥmān who is mentioned below. He was known as Ibn al-Jamāl al-Miṣrī. He died in Mecca in Dhu al-Ḥijjah in the year 848 AH and was buried next to his brother.
