translation:
  ja: ムハンマド・ブン・アリー・ブン・ファトフ・ブン・アウハド、アッ＝シャムス・ブン・アン＝ヌール・アル＝ハーンキー。アル＝イッズ・アル＝ムヌーフィーの娘の子（外孫）で、ハーンカーのシャイフの孫。父と祖父は既述。アブー・アル＝ガイスの朗読により私のもとで『シファー』を聴聞した。
  en: Muḥammad b. ʿAlī b. Fatḥ b. Awḥad, al-Shams b. al-Nūr al-Khānkī, the daughter's son of al-ʿIzz al-Munūfī and the grandson of the shaykh of the khānqāh; his father and his grandfather have been mentioned. He heard al-Shifāʾ from me through the recitation of Abū al-Ghayth.
