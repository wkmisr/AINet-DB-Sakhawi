  note:
    ja: '相手側の見出しナサブによる（規則23・37）: #AIND-D01693「أحمد بن الفقيه محيي الدين يحيى بن محمد بن تقي الكازروني المدني أخو علي . سمعا علي الزين المراغي في سنة اثنتي عشرة」（repo 収録済み）がラカブ محيي الدين・ナサブ・ニスバで本項主を父と特定する。本項には子の記載がないので cert medium。同項の「أخو علي」＝もう一人の子 علي は corpus に本伝がなく、本項にも名指しがないので relation は立てない。ID-Master の TMP-P-000438「يحيى بن محمد بن تقي الكازروني」（Note「AIND-D01693の父。独立立項なし」）は本項主その人＝#AIND-D10294 と名寄せ要（ISSUES §D166-2）。'
notes:
- text: 見出しのみの項（事績・没年の記載なし）。「الكازروني ثم المدني」はニスバで、居住 event は立てない（初版の residence event المدينة を除去、規則22(1)・(6)）。子の項 D01693 は本項主を「الفقيه」と呼び、812年にマディーナで الزين المراغي に聴いている＝本項主は9世紀初めの人（年代は note 留め、規則23）。
