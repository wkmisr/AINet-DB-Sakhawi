    ja: 規則3。見出し「محيي الدين بن الشمس」＝父はラカブ الشمس の محمد بن تقي。corpus に本伝なし（hw.py「محمد＋تقي＋الكازروني」24件に「محمد بن تقي」本人の見出しなし）・ID-Master 未登録。ラカブ＋家名（ابن تقي）で識別でき、祖父名（تقي）まで復元できる＝仮番号 TMP-P-001722。corpus の「الشيخ محمد بن تقي الكازروني」（#AIND-D07180「وأمه رقية ابنة الشيخ محمد بن تقي الكازروني」、#AIND-D09503「محمد بن أبي الهدى بن محمد بن تقي الكازروني المدني」）と同人とみられるが、ラカブ الشمس は本項にしかない（TSV Note に候補として記載）。初版は father relation なし。
