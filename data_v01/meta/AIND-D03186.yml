translation:
  ja: スィナーン・ブン・アリー・ブン・スィナーン・ブン・アブドゥッラー・ブン・ウマル・ブン・マスウード、アル＝ウマリー、カーイド（隊長）。（8）53年ムハッラム月にアル＝ガッド（マッカ郊外）で没し、マッカへ運ばれてそのマアラー墓地に葬られた。イブン・ファハドも彼の没年を記している。
  en: Sinān b. ʿAlī b. Sinān b. ʿAbd Allāh b. ʿUmar b. Masʿūd al-ʿUmarī, the qāʾid. He died at al-Ghadd in Muḥarram of the year [8]53 and was carried to Mecca and buried in its Muʿallā cemetery. Ibn Fahd also recorded his death.
