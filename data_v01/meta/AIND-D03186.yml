    ja: '853年ムハッラム＝1449-03-05〜04-03（月精度、h2g.py。初版の @when="1449" は年精度）。「بالغد」は「翌日」ではなく地名: corpus 他所に「مات … بالغد خارج مكة」（6743行 #AIND-D00490、7233行）、「مات خارجها بالغد في المحرم」（35197行）とあり、本項も「وحمل إلى مكة」（マッカへ運ばれた＝マッカ外で没）と続く。父 #AIND-D05102（D03185 の父）の項では「بالعد من منازل بني حسن」と綴る（غ／ع の揺れ）。ID-Master 未登録 → TMP-L-00401（規則22(2)・25、ISSUES §D159-8）。搬送先 مكة は「حمل إلى مكة」の目的地＝埋葬地 المعلاة（wd:Q42004、「معلاتها」の ها＝مكة）で表す（規則60(g)）。【集約 2026-11-08】原文に「إلى مكة」と明記があるので搬送先 مكة（gn:104515、type burial）も立てた（規則60(g)「搬送先・埋葬地の placeName は立てる」、先例 #AIND-D03123・#AIND-D10000。機械 L、オーケストレーター決定12）。初版の en note「died on the morrow」を是正。'
