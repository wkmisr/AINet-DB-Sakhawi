translation:
  ja: アフマド・ブン・アブドゥッラー・アル＝アリージャーニー・アッ＝ディマシュキー。我らがシャイフ（イブン・ハジャル）がその著『インバーア』において述べるところによれば、彼は少しの間仕事に勤しみ、美しい筆跡で書き、詩作と散文を嗜んだ。またアル＝スマイサーティーヤのワクフを管理し、スンナと（ハディース）伝承を愛した。805年のムハッラムに没した。
  en: Aḥmad b. ʿAbd Allāh al-ʿArjānī al-Dimashqī. Our shaykh (Ibn Ḥajar) said in his 'Inbāʾ' that he worked a little and wrote in a beautiful hand. He practiced composition and versification. He administered the waqfs of al-Sumaysāṭiyya and loved the Sunna and traditions. He died in Muḥarram of the year 805.
