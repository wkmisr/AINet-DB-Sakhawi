translation:
  ja: アクバルディー・アッ＝ティマーシーヒー・アッ＝ザーヒリー・ジャクマク。マッカのアミール・アッ＝ラーキズ職をアズダマルに代わって引き継ぎ、895年にキャラバンと共に同地に入った。その後その職に長く留まったが、897年の途中に妻が死去した。その後、タキー・アル＝ブルキーニーの娘であるウンム・アル＝ハサンと結婚し、私 (サハーウィー) は彼が彼女といるのを喜んでいるのを見た。彼は純粋なトルコ人で、災いは彼の指揮下の者たちと従者たちから生じた。
  en: Aqbirdī al-Timāsīḥī al-Ẓāhirī Jaqmaq. He was appointed Amīr al-Rākiz in Mecca, replacing Azdmar, and arrived there with the caravan in 895 H. He remained in office for a long time, and his wife died during 897 H. He then married Umm al-Ḥasan, daughter of al-Taqī al-Bulqīnī, and I (al-Sakhāwī) saw him rejoicing with her. He was a pure Turk, and the trouble came from those under his command and his followers.
