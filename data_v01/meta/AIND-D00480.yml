translation:
  ja: アフマド・ブン・アフマド・ブン・アフマド・ブン・アリー・ブン・シャラフ・ブン・アブドゥッザーヒル・アッ＝ダルジー。カーディー・アフマドの子として知られる。クルアーン、アッ＝タブリーズィーの著作、そして『アル＝ミルハ』を読んだ。晩年には同郷のシャハーブ・アッ＝ダルジーに師事し、私（サハーウィー）から口述筆記を聴聞した。881年にダルジャで疫病により没した。40歳に満たなかった。
  en: Aḥmad b. Aḥmad b. Aḥmad b. ʿAlī b. Sharaf b. ʿAbd al-Ẓāhir al-Daljī, known as Ibn al-Qāḍī Aḥmad. He read the Qurʾān, al-Tibrīzī, and al-Milḥa. Late in life, he devoted himself to the service of his townsman al-Shihāb al-Daljī, and he heard dictations from me (al-Sakhāwī). He died in Dalja in the year 881 H, afflicted by the plague, not having completed forty years of age.
