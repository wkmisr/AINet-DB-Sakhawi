translation:
  ja: アフマド・ブン・アリー・ブン・ウマル・ブン・アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムフリーズ、シーハーブ・アッ＝ディーン、アル＝サンダフィー・アル＝マハッリー・アル＝マーリキー。シャイフ・アブー・バクル・アッ＝タリニーの母方の孫。イブン・ムフリーズとして知られる。カイロで私（＝サハーウィー）から学んだ人々の一人。
  en: Aḥmad b. ʿAlī b. ʿUmar b. Aḥmad b. Muḥammad b. Muḥammad b. Muḥriz, Shihāb al-Dīn al-Ṣandafī al-Maḥallī al-Mālikī, maternal grandson of Shaykh Abū Bakr al-Ṭarīnī, and known as Ibn Muḥriz. He was one of those who acquired knowledge from me (al-Sakhāwī) in Cairo.
