translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アリー・アル＝ガッズィー・アル＝ハナフィー。アル＝アシュラフ・イーナールのイマームであったアル＝アラー・アル＝ガッズィーの兄弟の外孫（娘の子）で、この者は「イブン・ビント・アル＝ヒムヤリー」として知られる。交易などのために何度もカイロに来た。その来訪のいくつかの折に、私（サハーウィー）に『アズカール』、ナワウィーの『四十（ハディース）』、私の著作のうちの『ブハーリー読了におけるウムダ・アル＝カーリー』を読誦し、また私の『ヒダーヤ・ジャザリーヤ』注釈の大部分を討究の形で読み、残りを聴聞した。そのほかにも私が彼のために冊子に書き付けたものがある。一時期は学生のように振る舞ったが、その後結婚して自分の用事に専念した。
  en: Muḥammad b. Abī Bakr b. ʿAlī al-Ghazzī al-Ḥanafī, the daughter's son of the brother of al-ʿAlāʾ al-Ghazzī, the imām of al-Ashraf Īnāl; this man is known as Ibn Bint al-Ḥimyarī. He came to Cairo several times for trade and other business. On some of his visits he read to me al-Adhkār, al-Nawawī's Forty (Ḥadīth), and, of my own compositions, ʿUmdat al-Qārī fī Khatm al-Bukhārī, and most of my commentary on al-Hidāya al-Jazariyya by way of discussion, hearing the remainder, along with other things that I recorded for him in a notebook. For a time he fashioned himself after the students, then he married and busied himself with his own concerns.
