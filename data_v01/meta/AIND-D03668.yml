translation:
  ja: アブドゥルラフマーン・ブン・アブドゥッラー、カージ・ザイン・アッ＝ディーン・イブン・アル＝ムジール。ヒスン・カイファーの支配者に宰相（ワズィール）として仕えた。彼は、我らがシャイフ（イブン・ハジャル）が836年の項のアフマド・ブン・スライマーン・アル＝アシュラフの伝記において述べているように、シャーフィイー派の判事（カージ）であり、高潔な人物であった。
  en: Abd al-Rahman b. Abd Allah, al-Qadi Zayn al-Din b. al-Mujir. He was appointed as vizier (wazir) by the ruler of Hisn Kayfa. He was a learned Shafi'i judge (qadi) of good conduct, as our shaykh (Ibn Hajar) mentioned in the biography of Ahmad b. Sulayman al-Ashraf under the year 836 AH.
