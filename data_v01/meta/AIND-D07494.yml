translation:
  ja: ムハンマド・ブン・サダカ、アル＝ハワージャー・シャムス・アッ＝ディーン・アッ＝ディマシュキー。［ヒジュラ暦8］53年ジュマーダー・アル＝ウーラー月8日の日曜日に没し、翌日カースィユーン山麓のアッ＝ザイニー・アブド・アル＝バースィトの墓廟に埋葬された。神が彼を憐れみたまわんことを。
  en: Muḥammad b. Ṣadaqa, al-Khawājā Shams al-Dīn al-Dimashqī. He died on Sunday, the 8th of Jumādā al-Ūlā of the year [8]53, and was buried the next day in the turba of al-Zaynī ʿAbd al-Bāsiṭ at the foot of Qāsiyūn, may God have mercy on him.
