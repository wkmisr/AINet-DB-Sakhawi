translation:
  ja: 163 アフマド・ブン・ウマル・ブン・ムハンマド・アル＝カーヒリー・アッ＝シャイヒー・アル＝マーワルディー。 後述するナースィル・アッ＝ディーン・ムハンマドの兄弟である。我らがシャイフ（イブン・ハジャル）の『ブハーリーの真正集』読誦会完成式をアッ＝ザーヒリーヤで聴聞した者の一人である。
  en: 163 Aḥmad b. ʿUmar b. Muḥammad al-Qāhirī al-Shaykhī al-Māwardī. He was the brother of Nāṣir al-Dīn Muḥammad, whose biography will follow. He was among those who heard our shaykh (Ibn Ḥajar)'s completion of al-Bukhārī at al-Ẓāhiriyya.
