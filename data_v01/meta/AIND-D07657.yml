translation:
  ja: ムハンマド・ブン・アブドゥッサラーム・ブン・ラージフ、アル＝クラシー・アル＝カンダハーリー――インドの或る村に因むニスバ――。マッカの寄留者で、同地のハナフィー派マカームのイマーム代理。〔八百〕六十七年ラビーウ第二月、マッカで倒壊物の下敷きとなり殉教者として没した。イブン・ファハドがその没年を記録した。
  en: Muḥammad b. ʿAbd al-Salām b. Rājiḥ al-Qurashī al-Qandahārī — a nisba referring to one of the villages of India. A resident of Mecca and deputy imam of the Ḥanafī station (maqām al-Ḥanafiyya) there. He died in Mecca as a martyr, [crushed] under a collapse, in Rabīʿ II of the year [8]67. Ibn Fahd recorded his death date.
