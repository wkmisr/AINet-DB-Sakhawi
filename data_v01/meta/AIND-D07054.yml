translation:
  ja: ムハンマド・ブン・アフマド・ムヒー・アッ＝ディーン・アッ＝ルーミー・アル＝ハナフィー、彼の国の人々の間ではフィルブウィーとして知られる。若者で、マッカから海路でカイロに来て数日間滞在し、私にアッ＝サガーニーの『マシャーリク』の一部を読み、私から『ムサルサル』をその条件どおりに聴聞した。彼には学識があり、私は彼にイジャーザを書いた。彼は（カイロに）滞在して師事し続けるつもりであったが、そのための支えとなるものを見つけられず、シャームへ戻った。
  en: Muḥammad b. Aḥmad Muḥyī al-Dīn al-Rūmī al-Ḥanafī, known among the people of his country as Filbawī. A young man who came to Cairo by sea from Mecca and stayed a few days; he read to me part of al-Mashāriq of al-Ṣaghānī and heard from me al-Musalsal under its condition. He had merit, and I wrote him an ijāza. His intention was to stay and attend lessons regularly, but he found nothing to support him in that, so he returned to Syria.
