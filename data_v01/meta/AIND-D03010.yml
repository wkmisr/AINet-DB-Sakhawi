translation:
  ja: ラマダーン・ブン・ウマル・ブン・マズルーウ・アル＝アートカーウィー・アッ＝シャーフィイー。敬虔で高潔なシャイフであった。同郷のシャイフ・イブラーヒームに学び、判事のザイン・アッ＝ディーン・ザカリーヤーやシャムス・アッ＝ディーン・ブン・サラーマら一団が彼に同行（師事）した。優れた人物であった。870年ジュマーダー・アル＝ウーラー（第1ジュマーダー月）に没した。後述のムハンマド・ブン・イスマーイール・ブン・ウマル・アル＝アムリーティーの叔父（父方）にあたる。
  en: Ramaḍān b. ʿUmar b. Mazrūʿ al-Ātkāwī al-Shāfiʿī. He was a pious and noble shaykh. He studied under his fellow townsperson, al-Shaykh Ibrāhīm, and was accompanied by a group of disciples including the judge Zayn al-Dīn Zakarīyā and Shams al-Dīn b. Salāma. He was a man of virtue. He died in Jumādā al-Ūlā, the year 870 AH. He is the paternal uncle of Muḥammad b. Ismāʿīl b. ʿUmar al-ʿAmrīṭī, who is mentioned below.
