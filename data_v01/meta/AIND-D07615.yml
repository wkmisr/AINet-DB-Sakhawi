translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・ムウミン、ワリーユッディーン、クース出自のアル＝カーヒリー、アッ＝シャーフィイー。アタベク・アズバク・アッ＝ザーヒリーの書記（ムワッキウ）。878年、そのアミールとともに（カイロを）離れている間に没した。父と同様に一時ディーワーン・アル＝ムフラドの書記職（タウキーウ・アル＝ムフラド）を務め、またダストの書記職（タウキーウ・アッ＝ダスト）も務めていた。アッラーが彼を赦されますように。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Muʾmin, Walī al-Dīn, of Qūṣ origin, al-Qāhirī al-Shāfiʿī, the scribe (muwaqqiʿ) of the Atābak Azbak al-Ẓāhirī. He died in 878 while away with his amir. He had for a time held the post of scribe of the Mufrad (tawqīʿ al-mufrad), like his father, as well as that of scribe of the Dast (tawqīʿ al-dast). May God forgive him.
