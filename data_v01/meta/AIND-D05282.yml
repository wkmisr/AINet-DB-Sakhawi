  note:
    ja: '#AIND-D05319（立項番号906「على بن عمر بن محمد بن الشمس لولو الحلبي ثم الدمشقي أخو زينب」）は父名（عمر／عثمان）のみ異なり、祖父名・لولو・ニスバ・妹 زينب・生年726・الحجار・没年月（801年ムハッラム）・没地 بيت لهيا が一致。D05319 末尾「وينظر إن كان في كتابي」はサハーウィー自身の留保＝二重立項型として両項を実項のまま保持（B119-123 §D122-1 の鏡像）。'
translation:
  ja: アリー・ブン・ウスマーン・ブン・ムハンマド・ブン・アッ＝シャムス・ルウルウ、ハラブ出身、のちにダマスカスに居住。ザイナブの兄弟。ヒジュラ暦726年に生まれた。アル＝ハッジャールに師事して『ブハーリーの三伝ハディース集（スラーシヤート）』および『アブー・アル＝ジャフムの部（ジュズウ）』を聴聞した。我らのシャイフ（イブン・ハジャル）を含む複数名が彼からハディースを伝承しており、我らのシャイフは自身の『ムアジャム』において彼について言及し、「彼は我々にイジャーザ（伝承許可）を与えた」と述べている。ヒジュラ暦801年のムハッラム月に、バイト・ラヒヤーの自宅で逝去した。神の慈悲があらんことを。
  en: 'ʿAlī b. ʿUthmān b. Muḥammad b. al-Shams Luʾluʾ al-Ḥalabī, later al-Dimashqī, the brother of Zaynab. He was born in the year 726 AH. He attended the readings of the Thulāthiyyāt of al-Bukhārī and the Juzʾ of Abū al-Jahm under al-Ḥajjār. Several people narrated from him, including our shaykh (Ibn Ḥajar), who mentioned him in his Muʿjam and said: ''He granted us an ijāza.'' He passed away at his home in Bayt Lahyā in al-Muḥarram, the year 801 AH. May God have mercy on him.'
