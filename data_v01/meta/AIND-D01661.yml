translation:
  ja: アフマド・イブン・ムーサー・イブン・アフマド・イブン・ムーサー・イブン・ムハンマド・アッ＝ザワーリー・アッ＝サリフィーニー・アル＝ヤマニー・アッ＝ズバイディー・アッ＝シャーフィイー。父については後述する。イブン・アル＝ムカシュキシュという通称で知られる。メッカで父と共に私からさまざまなことを聴聞し、私が他の箇所で詳述した通り、彼ら両名を称賛した証言書（サバト）を彼のために書いた。
  en: Aḥmad b. Mūsā b. Aḥmad b. Mūsā b. Muḥammad al-Dhāwālī al-Ṣarīfīnī al-Yamānī al-Zabīdī al-Shāfiʿī. His father is mentioned later. He was known as Ibn al-Mukashkish. He heard various things from me (al-Sakhāwī) in Mecca with his father, and I wrote for him an attestation (thabat) in which I praised them both, as I have explained elsewhere.
