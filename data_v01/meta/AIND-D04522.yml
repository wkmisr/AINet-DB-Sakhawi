translation:
  ja: アブドゥッラー・ブン・ウマル・ブン・アブドゥッラー・ブン・ウマル・ブン・マスウード・アル＝ウマリー・アル＝マッキー。「アル＝ウマラ（ウマリー家）」として知られる隊長（カーイド）たちの名士の一人であった。おそらく（八百）三年に没した。アル＝ファースィーが『マッカ史』の中でそう述べている。
  en: ʿAbd Allāh b. ʿUmar b. ʿAbd Allāh b. ʿUmar b. Masʿūd al-ʿUmarī al-Makkī. He was one of the notables of the commanders (quwwād) known as al-ʿUmara. He died in the year [80]3, conjecturally; so said al-Fāsī in his history of Mecca.
