translation:
  ja: ムハンマド・ブン・アフマド・クトゥブ・アッ＝ディーン・アブー・アブドゥッラー・ブン・アッ＝タージュ・アル＝バハーイリー。866年ラビーウ・アッ＝サーニー月にミスルで没し、アムル・モスクで彼のための葬礼の礼拝が行われた。民衆の間で崇敬されていた。アル＝ムニールが彼の没年を記した。
  en: Muḥammad b. Aḥmad Quṭb al-Dīn Abū ʿAbd Allāh b. al-Tāj al-Baḥāylī. He died in Rabīʿ al-Thānī 866 in Miṣr, and the prayer over him was performed at the Mosque of ʿAmr. He was an object of veneration among the common people. Al-Munīr recorded his death.
