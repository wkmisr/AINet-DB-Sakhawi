translation:
  ja: ウスマーン・ブン・ハサン・ブン・アリー・ブン・マンスール、アル＝ファフル、アル＝ウクビー、のちアル＝カーヒリー、アッ＝サフラーウィー。780年より後におよそ生まれ、クルアーンと『ウムダ』を暗記して提示した。父の母方の叔父アッ＝ザイン・リドワーンが彼をイブン・アル＝クワイク、アル＝ジャマール・アル＝ハンバリー、アッ＝シャムス・アッ＝ザラーティーティーほかのもとで聴聞させ、一団の人々が彼にイジャーザを与えた。巡礼し、（マッカに）滞在（ムジャーワラ）した。バルクーク廟（アッ＝トゥルバ・アル＝バルクーキーヤ）のサッジャーダ奉仕人であった。私（サハーウィー）にイジャーザを与えた。882年ラビーウ・アル＝アーヒル月に没した。神が彼を憐れみたまえ。
  en: ʿUthmān b. Ḥasan b. ʿAlī b. Manṣūr, al-Fakhr, al-ʿUqbī, then al-Qāhirī, al-Ṣaḥrāwī. He was born approximately after 780. He memorized the Qurʾān and al-ʿUmda and presented them. His father's maternal uncle al-Zayn Riḍwān had him hear from Ibn al-Kuwayk, al-Jamāl al-Ḥanbalī, al-Shams al-Zarātītī and others, and a group granted him ijāza. He performed the pilgrimage and stayed (as mujāwir). He was the keeper of the sajjāda at the Barqūqiyya tomb-complex. He granted me (al-Sakhāwī) an ijāza. He died in Rabīʿ al-Ākhir 882, may God have mercy on him.
