translation:
  ja: アリー・ブン・ムハンマド、アル＝アラー・ブン・アル＝クサイル・アッ＝ディマシュキー。同地（ダマスカス）の不動産仲買人で、さらに一時期シリア巡礼隊のカーディーを務めた。アブドゥルカーディル・アル＝ウルマウィーから聴聞しており、ハディースを伝え、アッ＝ラブーディーが彼から聴聞した。彼（ラブーディー）はその没年を865年ラビーウ・アル＝アウワル月と記録している。神が彼を赦したまわんことを。
  en: ʿAlī b. Muḥammad, al-ʿAlāʾ b. al-Quṣayr al-Dimashqī, a real-estate broker there, who also served for a time as qāḍī of the Syrian pilgrimage caravan. He had heard from ʿAbd al-Qādir al-Urmawī and transmitted; al-Labūdī heard from him and recorded his death in Rabīʿ I 865. May God pardon him.
