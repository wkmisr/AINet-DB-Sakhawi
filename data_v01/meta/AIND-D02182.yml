translation:
  ja: バラカート・ブン・フサイン・ブン・ハサン、シーラーズ出身の家系のマッカ人。イブン・アル＝ファトヒーとして知られる。前述のムハンマドとアフマドの同母兄弟で、三人のうち最年少。869年にマッカで生まれ、マッカとカイロで私（サハーウィー）から聴聞した者の一人である。カイロには父とともに、また単身で来た。アターバクのもとに寄宿した。彼の名はイスマーイールで、クンヤの部で後述する。
  en: Barakāt b. Ḥusayn b. Ḥasan, of Shīrāzī origin, the Meccan, known as Ibn al-Fatḥī; full brother of the aforementioned Muḥammad and Aḥmad, and the youngest of the three. He was born in 869 in Mecca and was among those who heard from me (al-Sakhāwī) there and in Cairo, which he visited with his father and on his own. He lodged with the atābak. His name is Ismāʿīl, and he will be treated again under the kunyas.
