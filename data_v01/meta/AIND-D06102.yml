translation:
  ja: イーサー・ブン・ムーサー、アッ＝シャラフ・アル＝ファイユーミー・アル＝ミスリー、海路その他を旅する商人で、アル＝アッラーフとして知られる。（8）65年ラビーウ・アル＝アウワル月にジッダで没し、同地に埋葬された。悪くない人物であった。イブン・ファハドがその没年月を記録している。
  en: ʿĪsā b. Mūsā, al-Sharaf al-Fayyūmī al-Miṣrī, the merchant who travelled by sea and otherwise, known as al-ʿAllāf. He died in Rabīʿ al-Awwal of the year (8)65 in Jidda and was buried there. He was a decent man. Ibn Fahd recorded his death.
