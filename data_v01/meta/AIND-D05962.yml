translation:
  ja: ウマル・ブン・ムハンマド・ブン・アリー・ブン・ユースフ・ブン・アル＝ハサン、アッ＝シラージュ・ブン・アル＝ムヒッブ、アル＝アンサーリー、アッ＝ザランディー、アル＝マダニー。アブド・アル＝ワッハーブとムハンマドの兄弟。4歳のときアル＝ジャマール・アル＝アミユーティーのもとに連れて行かれて聴聞し、その後アッ＝ザイン・アル＝マラーギーのもとで聴聞した。
  en: ʿUmar b. Muḥammad b. ʿAlī b. Yūsuf b. al-Ḥasan, al-Sirāj b. al-Muḥibb al-Anṣārī al-Zarandī al-Madanī, brother of ʿAbd al-Wahhāb and Muḥammad. He was brought at the age of four to hear from al-Jamāl al-Amyūṭī, and then heard from al-Zayn al-Marāghī.
