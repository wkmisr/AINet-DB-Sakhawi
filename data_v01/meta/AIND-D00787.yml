notes:
- text: 本項は誤名による参照エントリ。実体は AIND-D07504（محمد بن ططر الصالح بن الظاهر أبي الفتح ططر، マムルーク朝スルターン al-Malik al-Ṣāliḥ Muḥammad b. Ṭaṭar، 824/1421 即位、d.833）。サハーウィーは本文で「أحمد بن ططر。このように私の『إنباء』写本の欄外で見たが、アイニー（العيني）からの引き写しと思われ、正しくは محمد、後述する（سيأتي）」と記す。正項 D07504 でも「（アイニーが）彼を أحمد と名づけたのは誤り。ただしアイニーの『الحوادث』では正しく記す」と照応。
