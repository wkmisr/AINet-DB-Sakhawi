translation:
  ja: イーナール・アル＝ヤシュバキー、〔すなわち〕ヤシュバク・アッ＝シャアバーニー〔のマムルーク〕。師（ウスターズ）の死後、アル＝アシュラフの時代にハーッサキーとなり、ついでジャムダーリーヤのラアス・ナウバとなった。その後、師の墓（トゥルバ）のことで試練を被ったが、アッ＝ザーヒルは彼を十人隊長（アミール・アシャラ）に任じ、853年サファル月に死去するまでその位にあった。
  en: Īnāl al-Yashbakī, [mamluk of] Yashbak al-Shaʿbānī. After his master['s death], in the days of al-Ashraf he became a khāṣṣakī and raʾs nawbat al-jamdāriyya. He then suffered an ordeal on account of his master's tomb, and al-Ẓāhir gave him an emirate of ten, [which he held] until he died in Ṣafar 853.
