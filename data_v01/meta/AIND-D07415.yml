translation:
  ja: ムハンマド・ブン・サアド・ブン・アブドゥッラー・アル＝カルイー、アル＝マジュド・イスマーイール・アル＝カルイーに仕えたことで知られた者の一人で、アッ＝ザフルとして知られる。マッカにしばしば通い、やがてそこに定住し、私や他の人々から若干のものを聴聞した。896年ムハッラム月にそこ（マッカ）で没した。
  en: Muḥammad b. Saʿd b. ʿAbd Allāh al-Qalʿī, one of those known for serving al-Majd Ismāʿīl al-Qalʿī, and known as al-Zahr. He was among those who travelled to Mecca often, then settled there, and heard some things from me and from others. He died there in Muḥarram of the year [8]96.
