translation:
  ja: アイナール・バーイ・ブン・カジュマース・ブン・アサン。アッ＝ザーヒル・バルクークの兄弟の子（甥）。810年にガッザで殺害された。彼の息子ユースフ（＝AIND-D10454）の項で言及される。
  en: Aynāl Bāy b. Qajmās b. Asan, the son of al-Ẓāhir Barqūq's brother (his paternal nephew). He was killed in Ghazza in the year 810 AH. He is mentioned in the biography of his son Yūsuf (AIND-D10454).
