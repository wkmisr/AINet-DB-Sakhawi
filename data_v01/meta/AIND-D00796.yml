translation:
  ja: アフマド・ブン・アッバード、シャハーブ・アッ＝ディーン・アッ＝サファティー。イブン・ファハドが彼の事績を著書『ムアジャム』に記し、彼が『サヒーフ』をアッ＝タキー・ブン・ハーティムから聴聞したこと、またワリー・アル＝イラーキーが818年に彼から口述筆記を聴聞したと記録していることを述べた。彼の父の名前はアルスラーンである。
  en: Aḥmad b. ʿAbbād, Shihāb al-Dīn al-Safaṭī. Ibn Fahd mentioned him in his dictionary, stating that he (Aḥmad) reported hearing al-Ṣaḥīḥ from al-Taqī b. Ḥātim. Al-Walī al-ʿIrāqī also recorded that he (Aḥmad) dictated to him in the year 818 H. His father's name was Arslān.
