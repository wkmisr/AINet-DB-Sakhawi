translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・アフマド・ブン・イスマーイール・ブン・ダーウード。ザイン・アッ＝ディーン。アッ＝シャムス（ムハンマド）の子、アッ＝シハーブ（アフマド）の孫。カイロ在住、ハナフィー派。アル＝ジャマール・アブドゥッラーらの兄弟。先祖と同様にイブン・アッ＝ルーミーとして知られる。
  en: ʿAbd al-Raḥmān b. Muḥammad b. Aḥmad b. Ismāʿīl b. Dāwūd, Zayn al-Dīn, the son of al-Shams (Muḥammad) and grandson of al-Shihāb (Aḥmad), of Cairo, of the Hanafi school. He was the brother of al-Jamāl ʿAbd Allāh and others, and like his ancestors was known as Ibn al-Rūmī.
