translation:
  ja: アブドゥルラフマーン・タキー・アッ＝ディーン・アル＝カバービー・アル＝カーヒリー・アル＝マーリキー。ムヒー・アッ＝ディーン・ヤフヤー・アッ＝ディマシュキーの従兄弟。アル＝ビサーティーの代理として司法（副カーディー）を務め、シャムス［・アッ＝ディーン］・アル＝ビサーティーが彼のために職を退いたことで、アル＝ジャマーリーヤ［・ハーンカー］でマーリキー派の講義を行った。また、エジプト（カイロ）のアル＝カムヒーヤ［・マドラサ］での教授職の割当（シェア）も有していた。彼が没すると、アル＝ジャマーリーヤの職はアル＝バドル・ブン・アッ＝タンスィーが、アル＝カムヒーヤの割当はアル＝カラーフィーが引き継いだ。
  en: Abd al-Rahman Taqi al-Din al-Qababi al-Qahiri al-Maliki, the cousin of Muhyi al-Din Yahya al-Dimashqi. He served as a deputy judge on behalf of al-Bisati, and taught the Malikis at al-Jamaliyya after Shams [al-Din] al-Bisati stepped down in his favor. He also held a share in the teaching position at al-Qamhiyya in Egypt (Cairo). He died, after which al-Badr b. al-Tansi succeeded him at al-Jamaliyya, and al-Qarafi succeeded him in his share [at al-Qamhiyya].
