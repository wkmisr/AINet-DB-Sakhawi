translation:
  ja: アブドゥルアズィーズ・アッ＝シャリーフ・アル＝マグリビー・アル＝マーリキー。844年に我らがシャイフ（イブン・ハジャル）から『アル＝ヒサール・アル＝ムカッフィラ』と『ジュズウ・アル＝ジュムア』を聴聞した。アル＝ファトヒーは彼を、また彼と共に聴聞したことを「学者（アーリム）」と記している。
  en: ʿAbd al-ʿAzīz al-Sharīf al-Maghribī al-Mālikī. He heard from our shaykh (Ibn Ḥajar) in 844 AH al-Khiṣāl al-mukaffira and Juzʾ al-jumuʿa, and al-Fatḥī described him—and the audition together with him—with the term "the scholar (al-ʿālim)".
