notes:
- text: '転送見出し（原文末尾「فيمن جده حسن بن عبد الواحد」による）。転送先は #AIND-D06645「محمد بن أحمد بن حسن وقيل موسى بن عبد الواحد أبو عبد الله الأموي المغربي التونسي المالكي ويعرف بالقباقبي」（796年生、未受領）。D06645 の「حسن وقيل موسى」が本見出しの祖父名 موسى に対応する。見出しの「القبابي」は D06645・D07003 の「القباقبي」の揺れ。同じ D06645 へ向く転送見出しに #AIND-D07003「محمد بن أحمد بن موسى التونسي القباقبي . فيمن جده حسن بن عبد الواحد」がある。'
