translation:
  ja: アハマド。ファフルッディーン・ムハンマドの子、シャハーブ・アハマドの孫。クルアシー・カーヒリー。ハナフィー派。後述するカースィムの父で、イブン・アッ＝サブウとして知られた。アル＝カマール・イブン・アル＝アディームとその息子のもとでナカーバ（ النقابة ）職を務めた。
  en: Aḥmad, son of Fakhr al-Dīn Muḥammad, grandson of al-Shihāb Aḥmad al-Qurashī al-Qāhirī al-Ḥanafī. He was the father of Qāsim (mentioned later) and was known as Ibn al-Sabʿ. He held the office of Naqāba with al-Kamāl b. al-ʿAdīm and his son.
