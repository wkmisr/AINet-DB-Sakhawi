translation:
  ja: アブド・アル＝カーディル・ブン・ムハンマド・ブン・ウマル・ブン・ウスマーン、アル＝ハワージャ・ザイン・アッ＝ディーン・ブン・ナースィル・アッ＝ディーン・イブン・アル＝ジュンディー・アル＝ミスリー。我らがシャイフ（イブン・ハジャル）から口述会（イムラー）などで聴聞し、アル＝ブーティージーから学び、マッカにたびたび赴いた。ジッダに邸宅と貯水槽を持ち、それらを自身の解放奴隷たちとジャバルトのためにワクフとした。父の存命中の864年ジュマーダー・アル＝アーヒラ月に同地（ジッダ）で没し、マッカに運ばれてそのムアッラー墓地に葬られた。イブン・ファフドがその没年を記録している。
  en: ʿAbd al-Qādir b. Muḥammad b. ʿUmar b. ʿUthmān, al-Khawājā Zayn al-Dīn b. Nāṣir al-Dīn Ibn al-Jundī al-Miṣrī. He was among those who heard from our shaykh (Ibn Ḥajar) at the dictation sessions and elsewhere, studied under al-Būtījī, and frequented Mecca. He had a house and a cistern in Jidda, which he made waqf for his freedmen and the Jabart. He died there, during his father's lifetime, in Jumādā al-Ākhira of the year 864, and was carried to Mecca and buried in its Muʿallā cemetery. Ibn Fahd recorded his death.
