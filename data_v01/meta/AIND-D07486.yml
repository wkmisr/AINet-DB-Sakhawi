translation:
  ja: ムハンマド・ブン・サーリフ・ブン・ヤフヤー、アッ＝シャムス・アル＝カラキー。本人が語ったところによれば、アル＝ファフル・アッ＝ダリールからクルアーン読誦諸法（キラーアート）を学んだ。我らがシャイフ、アッ＝ザイン・リドワーンが［ヒジュラ暦8］34年に、いくつかのイスティドアー（伝授許可請願書）において彼から書き取った。
  en: Muḥammad b. Ṣāliḥ b. Yaḥyā, al-Shams al-Karakī. He took the Qurʾānic readings (qirāʾāt) from al-Fakhr al-Ḍarīr, as he himself reported, and our shaykh al-Zayn Riḍwān wrote down (transmissions) from him in some ijāza-petitions (istidʿāʾāt) in the year [8]34.
