translation:
  ja: ムーサー・ブン・マーフーフ・アル＝マグリビー、読誦教師（アル＝ムクリ）。読誦学に熟達しており、それをアル＝ワフリーから学び、多くの者が彼からそれを学んだ。（8）72年に没した。ザッルークが私に彼の伝記を語った。
  en: Mūsā b. Mākhūkh al-Maghribī, the Qurʾān reciter (al-muqriʾ). He was skilled in the Qurʾānic readings (qirāʾāt), which he took from al-Wahrī, and a group (of students) took them from him. He died in the year (8)72. Zarrūq related his biography to me.
