translation:
  ja: アフマド・ブン・ムハンマド、尊称はシハーブ、ニスバはアジャミー、またスーフィーとしてスィルヤークースィーヤ・ハーンカーに属し、イブン・アル＝ジャウジャリー・アル＝アブラーズィーの義理の息子。彼は我らがシャイフ・ティルミズィーからヒジュラ暦844年に読誦を受け、師から高い評価を得た。彼は愛想がよかった。彼の死は、私の推測では、ヒジュラ暦860年以降である。
  en: Aḥmad b. Muḥammad, known by the laqab Shihāb and the nisbah al-ʿAjamī, was a Sufi affiliated with the al-Siryāqūsīya Khānqāh, and the son-in-law of Ibn al-Jawjarī al-Abrāzī. He read from our shaykh al-Tirmidhī in 844 H and achieved a high standing with him. He was amiable. He died, as I assume, after 860 H.
