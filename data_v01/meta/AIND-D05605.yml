notes:
- text: 「النايني بنونين بينهما تحتانية مهموزة」＝ニスバの綴り注記（ナーイーン、イラン中部の町）。
  lang: ja
translation:
  ja: アリー・ブン・ムハンマド、アル＝カマール・ブン・アッ＝シャムス・アン＝ナーイニー（ヌーン二つの間にハムザ付きのヤー）。イブン・アル＝ジャザリーのもとで諸読誦法を読誦し、アル＝アフィーフ・アル＝カーザルーニーから学んだ者の一人。サイイド・ウバイドゥッラー・ブン・アフィーフ・アッ＝ディーンが彼のもとで開端章などを読誦し、さらに彼からいくつかのものを聴聞した。
  en: ʿAlī b. Muḥammad, al-Kamāl b. al-Shams al-Nāyinī (with two nūns and a hamzated yāʾ between them). He was among those who read the qirāʾāt under Ibn al-Jazarī and studied under al-ʿAfīf al-Kāzarūnī; the Sayyid ʿUbayd Allāh b. ʿAfīf al-Dīn recited the Fātiḥa and other things under him and indeed heard various things from him.
