translation:
  ja: アハマド・ブン・ムハンマド・ブン・アハマド、アル＝シハーブ、アル＝マシュハディー、アル＝カーヒリー、アル＝ザルカシー、ハンバリー派。彼は勤勉で理解力があり、ウム・ハーニ・アル＝ハウリーニーヤとその同伴者たちから『ブハーリー選集』の完結部分を聴聞し、合唱団で朗誦し、証人職で生計を立てていた。その後、いくつかの職務には引き続き出席しながらも、専業からは退いた。彼は気性の荒い人物であった。
  en: Aḥmad b. Muḥammad b. Aḥmad, al-Shihāb al-Mashhadī al-Qāhirī al-Zarkashī al-Ḥanbalī. He was among those who strived and understood. He heard the completion of al-Bukhārī from Umm Hāniʾ al-Hawrīnīya and those who were with her, recited in the choir (al-Jawq), and earned his living as a witness. He later retired while continuing to attend some of his duties. He was of a sharp temperament.
