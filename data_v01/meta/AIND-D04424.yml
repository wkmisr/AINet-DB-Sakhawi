notes:
- text: '「مضى فيمن جده إبراهيم قريبا」＝転送見出し。転送先は #AIND-D04421（عبد الله بن إسماعيل . لعله إبراهيم الشيرازي ثم المدني نزيل مكة ويعرف بالعفيف المدني、853年シャウワール月メッカ没）。イスム＋父名＋ラカブ＋ニスバ（عبد الله بن إسماعيل／العفيف المدني）が完全一致し、かつ3項前＝「قريبا」に合致する唯一の項。シュフラ「العفيف المدني」は corpus 全体で本 REF と D04421 本文の2箇所にしか現れない。【裁定 2026-09-18（§Da-1）】転送先 #AIND-D04421 は正しいが、校閲時の根拠記述は誤りであった。D04421 の見出しにある「لعله إبراهيم」は父名（إسماعيل）の異伝ではなく、記されていない祖父名の推定である。刊本の当該節は祖父名のアルファベット順に配列されており、D04421（第45項「لعله إبراهيم」）→ D04422（第46項 عبد الله بن إسماعيل بن عبد الله …）→ D04423（第47項 عبد الله بن إسماعيل بن عبد الله بن عمر …）と إبراهيم ＜ عبد الله の順に正しく並ぶ（corpus で実地に確認）。同型の書式は D06443「مبارك بن جار الله . لعله ابن مبارك السقطي」。したがって本項の「جده إبراهيم」と D04421 の間に世代のずれは最初から存在せず、両者は完全に整合する。'
