translation:
  ja: アハマド・ブン・アリー・ブン・アブドゥッラー。アル・ワラウィー・アル・ブルキーニー学院の管理者（カイイム）であり、バスイリー（縮小形）として知られる。上記のワラウィーの家系とその近親者に育ち、彼の訴えは多くなったが、利益を得ることはなかった。むしろ、アル・ライスらの訪問に関連して、彼の元にはひどい犯罪が帰せられた。
  en: Aḥmad b. ʿAlī b. ʿAbd Allāh, administrator (qayyim) of the al-Walawī al-Bulqīnī Madrasa, and known by the diminutive 'al-Buṣayrī'. He grew up in the house of the aforementioned al-Walawī and his relatives. His legal appeals became numerous, but he achieved no significant gain. Rather, an outrageous crime was attributed to him, connected with the visit of al-Layth and the like.
