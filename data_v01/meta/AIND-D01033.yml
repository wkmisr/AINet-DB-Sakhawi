notes:
- text: 'نسبة章の重複立項「المصيري」を本項に統合。統合元: AIND-D12035（12桁位置ID 164110557746）。同一人物（أحمد بن علي بن عبد الله）。統合元固有情報を本項に吸収済み: ニスバ異読「المصيري بضم أوله مصغر」／شاب／نشأته مع أمه／جرأة／أيام الأشرف قايتباي／سنة 896（ست وتسعين）／حبس أولى الجرائم（執筆時点投獄中）／共犯 ابن العظمة・رجب العلمي。位置ID 164110557746 は欠番化。'
