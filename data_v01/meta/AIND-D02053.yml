translation:
  ja: アルタシュ・アッ＝シャアバーニー、城塞の副知事。809年ジュマーダー・アル＝サーニー24日木曜日に亡くなり、砂漠の霊廟に、アル＝ザーヒル・バルクーク廟の隣、勝利のドームの近くに葬られた。アル＝アイニーが彼について言及した。
  en: Altash al-Shaʿbānī, Deputy of the Citadel, died on Thursday, the 24th of Jumādā al-Thāniya in the year 809. He was buried in a tomb in the desert, next to the tomb of al-Ẓāhir Barqūq, near Qubbat al-Naṣr. Al-ʿAynī mentioned him.
