translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・ウマル・ブン・アビー・バクル、シャムス〔・ッディーン〕、サルハド出身でダマスクスの人、シャーフィイー派、朗誦家、サルハディーとして知られる。およそ840年にダマスクスに生まれ、そこで育ってアフマド・アッ＝ザイヌーニー（ヌーン2つとファトハのザーイ、バカーウ地方の村への帰属名）のもとでクルアーンと『タンビーフ』を暗記し、同地サーリヒーヤに住むイスマーイール・アル＝ハンバリー・アッ＝ディマシュキーのもとでアースィムの読誦法によりクルアーンの音誦を修め、シャムス・イブン・アン＝ナッジャールのもとでキサーイーとアースィムの読誦法により、ザイン・ハッターブのもとでアブー・アムルの読誦法のみにより誦読した。ハッターブのもとで『ブハーリー』と『マサービーフ』の全体を読み、彼の講義とナジュム・イブン・カーディー・アジュルーンの講義に出席した。ウマル・アッ＝タイイビー・アッ＝サーリヒー（盲人）とウマイヤ・モスクのイマームであるハリール・アッ＝ルッディー（二人ともシャーフィイー派）のもとで七読誦法を統合して読み、イブラーヒーム・アン＝ナージーのもとで『サヒーフ・ムスリム』を冒頭のわずかを除いて読み、彼から『ブハーリー』と『タルギーブ』などを聴聞し、ニザーム・イブン・ムフリフの集会に出席し、さらに親戚のブルハーン・アル＝カーディーのもとでクルアーンの一部を読んだ、ほか多数。幾度も巡礼しマッカに滞在し、同地でシャムス・アル＝ムサイリーのもとで法学などを、ハナフィー派のイブン・アミール・ハーッジ・アル＝ハラビーのもとで『ザイン・アル＝ハーフィーの書簡』を読み、ナジュム・ウマル・イブン・ファフドから『ムスナド・アフマド』を、アブー・ル＝ファドル・アル＝マルジャーニーから『ブハーリー』を聴聞し、アラー・イブン・アッ＝サイイド・アフィーフ・ッディーン、ブルハーン・イブラーヒーム・アル＝カーディリーら諸師に随伴した。商業のためエジプトに入り、そのためにジッダへも繰り返し旅した。自分の町に店舗も持つ。893年に私がマッカにいたとき、彼がラマダーン月にタラーウィーフ礼拝の導師を務めるのを見たが、朗誦の見事さゆえに最も人が押し寄せる導師の一人であった。翌年には繰り返し私のもとに集い、六書などの多くを私からの聴聞、および私が読むのを聴いて学び、私は彼に一帖のイジャーザを書いた。同様にアブド・アル＝ムウティー・アル＝マグリビーのもとで『リサーラ』と『アワーリフ』を聴講した。風采、知性、親しみやすさ、善良さにおいて実に良い人物である。
  en: Muḥammad b. Muḥammad b. ʿUmar b. Abī Bakr, al-Shams, of Ṣarkhad origin, Damascene, Shāfiʿī, Qurʾān reciter, known as al-Ṣarkhadī. Born about 840 in Damascus, he memorised the Qurʾān and al-Tanbīh with Aḥmad al-Zaynūnī, perfected the Qurʾān in ʿĀṣim's reading with Ismāʿīl al-Ḥanbalī al-Dimashqī of al-Ṣāliḥiyya, recited in the readings of al-Kisāʾī and ʿĀṣim to al-Shams Ibn al-Najjār and in Abū ʿAmr's only to al-Zayn Khaṭṭāb, to whom he also read the whole of al-Bukhārī and al-Maṣābīḥ and whose lessons, and those of al-Najm Ibn Qāḍī ʿAjlūn, he attended. He combined the seven readings under ʿUmar al-Ṭayyibī al-Ṣāliḥī the blind and Khalīl al-Luddī, imam of the Umayyad mosque; read Ṣaḥīḥ Muslim (but for a little of its beginning) to Ibrāhīm al-Nājī, hearing from him al-Bukhārī, al-Targhīb and others; attended al-Niẓām Ibn Mufliḥ; and read some Qurʾān to his relative al-Burhān al-Qāḍī, among others. He performed the pilgrimage several times and resided in Mecca, reading there fiqh etc. with
    al-Shams al-Musayrī and the Risāla of al-Zayn al-Khāfī with Ibn Amīr Ḥājj al-Ḥalabī al-Ḥanafī, hearing the Musnad of Aḥmad from al-Najm ʿUmar Ibn Fahd and al-Bukhārī from Abū al-Faḍl al-Marjānī, and keeping company with al-ʿAlāʾ Ibn al-Sayyid ʿAfīf al-Dīn, al-Burhān Ibrāhīm al-Qādirī and other masters. He entered Egypt in trade and travelled repeatedly to Jedda for it, and has a shop in his home town. When I was in Mecca in 893 I saw him lead the tarāwīḥ in Ramaḍān, drawing among the largest crowds for the beauty of his recitation; the next year he met me repeatedly, took much of the Six Books and other works from me by audition, and I wrote him an ijāza in a quire. He also attended ʿAbd al-Muʿṭī al-Maghribī for the Risāla and the ʿAwārif. A fine man in bearing, intelligence, affability and goodness.
