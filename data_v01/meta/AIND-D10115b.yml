translation:
  ja: ナースィル・ブン・アブド・アル＝アズィーズ・ブン・ハサン・アル＝バスリー、アッ＝タンマーウ（貪欲者）として名高い。シャラフ・アル＝ガッラが彼の母を娶り姻戚となった。858年ムハッラム月にマッカで没した。イブン・ファフドが没年を記録した。
  en: Nāṣir b. ʿAbd al-ʿAzīz b. Ḥasan al-Baṣrī, famous as al-Ṭammāʿ ("the greedy"). Al-Sharaf al-Ghalla became his relative by marrying his mother. He died in Muḥarram 858 in Mecca. Ibn Fahd recorded his death.
