translation:
  ja: アハマド・ブン・アッ＝シャヒード。我らがシャイフ(イブン・ハジャル)が『インバー・アル＝グムル』の813年の項で彼についてこのように述べた。彼は当初、毛皮産業に従事していたが、その後しばらく（スルタンの）ディーワーンで勤め、次いで宰相職に就いた。彼が宰相の時にティムールによる騒乱が起こり、彼はティムールによって連行され、その地（ティムールの故国）へ連れて行かれた。その後、30年を経て彼から逃れ、ダマスクスに到着し、シャアバーン月には軍隊監督官その他の職務に就いた。以上。
  en: Ahmad ibn al-Shahīd. Our shaykh (Ibn Hajar) mentioned him thus in his *Inbāʾ al-Ghumr* under the year 813 H, stating that he was initially engaged in the fur industry, then worked for a while in the Sultan's chancery, and subsequently became vizier. During his vizierate, Lank's (Tamerlane's) fitna occurred, and Tamerlane took him to his own country. After thirty years, he escaped from captivity and arrived in Damascus, where he assumed the supervision of the army and other duties in Shaʿbān. End.
