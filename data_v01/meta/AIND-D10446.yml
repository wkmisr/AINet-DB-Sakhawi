translation:
  ja: ユースフ・ブン・アフマド・ブン・ユースフ、アル＝ジャマール、ルームの出、アル＝マクディスィー、アル＝ハナフィー、アル＝アドハミーとして知られる。アル＝ブルハーン・ブン・アッ＝ダイリーに、ついでアン＝ナースィリー・ムハンマド・ブン・カーニバーイ・アル＝ユースフィー（ミフマンダール）に近侍した。諸施設の職に名を連ね、ハナフィー派のカーディーであるアッ＝シャムス・ブン・アル＝マグリビー・アル＝ガッズィーを訴え出たが、彼に対して目的を達することはできなかった。
  en: Yūsuf b. Aḥmad b. Yūsuf, al-Jamāl, of Rūmī origin, al-Maqdisī, al-Ḥanafī, known as al-Adhamī. He attached himself closely to al-Burhān b. al-Dīrī, then to al-Nāṣirī Muḥammad b. Qānibāy al-Yūsufī, the mihmandār. He obtained stipendiary positions in the institutions, and he brought a complaint against the Ḥanafī qāḍī al-Shams b. al-Maghribī al-Ghazzī, but did not attain his aim against him.
