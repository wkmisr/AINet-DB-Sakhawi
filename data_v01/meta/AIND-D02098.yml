translation:
  ja: アイナール・ハタブ・アル＝アラーイー。ヒジュラ暦809年ズー・アル＝カアダ月6日金曜日の夜に死去し、翌日埋葬された。アル＝ナーシル（・ファラジュ・ブン・バルクーク）がムサッラー・アル＝ムウミニーでの葬儀（の礼拝）に参列した。アル＝アイニーが彼に言及している。
  en: Īnāl Ḥaṭab al-ʿAlāʾī. He died on the night of Friday, the 6th of Dhū al-Qaʿda in the year 809 AH. He was buried the next day, and al-Nāṣir (Faraj b. Barqūq) attended his funeral prayer at the Muṣallā al-Muʾminī. Al-ʿAynī mentioned him.
