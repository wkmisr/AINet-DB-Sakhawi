translation:
  ja: アブドゥルラフマーン・ブン・アブドゥッラー・ブン・アフマド・ブン・アビル・ハサン・アリー・ブン・イーサー・ブン・ムハンマド・ブン・イーサー・アル＝ハサニー・アル＝サムフーディー。後述するアン＝ヌール・アリーの兄弟であり、彼（アブドゥルラフマーン）の方が年長で、彼（アリー）の方が優れていた。父親が辞退した際、アル＝アラム・アル＝ブルキーニーの代理として、自身の故郷（サムフード）の副カーディー（ナーイブ・アル＝カーディー）を務めた。彼がその副カーディー職を最初に創始した者であり、彼の後任たちの代理をも務め続けた。
  en: ʿAbd al-Raḥmān b. ʿAbd Allāh b. Aḥmad b. Abī al-Ḥasan ʿAlī b. ʿĪsā b. Muḥammad b. ʿĪsā al-Ḥasanī al-Samhūdī. He is the brother of al-Nūr ʿAlī, who is mentioned below; this one (ʿAbd al-Raḥmān) was older, while the other was more virtuous. He served as deputy judge in his hometown (Samhūd) on behalf of al-ʿAlam al-Bulqīnī when his father withdrew from it, being the first to initiate this deputyship, and he continued to act as deputy for those who succeeded him.
