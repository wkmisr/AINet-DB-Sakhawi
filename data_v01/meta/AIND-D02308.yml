  ja: タンバク・アッ＝トゥールーニー。十人長アミールの一人で、ムヌーフィーヤのカシフを務めた。879年ラビーウ・ル＝アーヒル月に殺害された。彼の後任として息子のユーヌスがカシフ職に、他の者がアミール職に就き、彼の財産は封印された。
  en: Tanbak al-Ṭūlūnī, one of the amirs of the tens and kāshif of al-Munūfiyya. He was killed in Rabīʿ al-Ākhir in the year 879 H. His son Yūnus succeeded him as kāshif, and another person succeeded him in the amirate. His possessions were sealed.
