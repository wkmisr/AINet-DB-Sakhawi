translation:
  ja: ハサン・ブン・ガーズィー。804年にヘブロンにおいて、アル＝マイドゥーミーからハディース・ムサルサル（特定の伝承動作を伴うハディース）を人々の集まりに伝承した。それをアッ＝タキー・アブー・バクル・アル＝カルカシャンディーが彼らから得て、我々に伝えた。
  en: Ḥasan b. Ghāzī. He transmitted the musalsal (pattern-chained) hadith in Hebron to a group from al-Maydūmī in the year 804 AH. Al-Taqī Abū Bakr al-Qalqashandī transmitted it to us from them.
