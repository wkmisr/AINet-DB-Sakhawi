translation:
  ja: イーナール・アクルキー〔アル＝カラキー〕。ハーッサキーヤの一員、いやむしろスルターンのアガーたちの長（宦官長）であった。それゆえ878年ラマダーン月17日、金曜礼拝の後に、ムサッラー・アル＝ムウミニーでの彼への葬送礼拝のために〔スルターンが〕下向した。
  en: Īnāl Akrukī [al-Karakī], one of the khāṣṣakiyya — indeed he was the chief of the sultan's aghas (eunuchs). For that reason [the sultan] came down, after the Friday prayer on 17 Ramaḍān 878, for the funeral prayer over him at Muṣallā al-Muʾminī.
