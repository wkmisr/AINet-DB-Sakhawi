translation:
  ja: アブー・アッ＝ターヒル・アフマド・ブン・アフマド・ブン・ムハンマド・ブン・アッ＝ザイン・アフマド・ブン・アル＝ジャマール・ムハンマド・ブン・アル＝ムヒッブ・アフマド・ブン・アブドゥッラー・アッ＝タバリー・アル＝マッキー。母はサイード・アン＝ヌワイリーの娘アーイシャ。およそ807年に生まれ、4歳のとき父およびアル＝ジャマール・ブン・ズハイラらのもとで（聴聞のため）出席させられた。アブー・アブドゥッラー・アル＝ワーヌーギー、イブン・サラーマらが彼にイジャーザを与えた。827年ジュマーダー・アル＝アーヒラ月、メッカで没した。
  en: Abū al-Ṭāhir Aḥmad b. Aḥmad b. Muḥammad b. al-Zayn Aḥmad b. al-Jamāl Muḥammad b. al-Muḥibb Aḥmad b. ʿAbd Allāh al-Ṭabarī al-Makkī. His mother was ʿĀʾisha, daughter of Saʿīd al-Nuwayrī. He was born approximately in 807 AH, and at the age of four, he attended lessons under his father and al-Jamāl b. Ẓuhayra, among others. Abū ʿAbd Allāh al-Wānūghī and Ibn Salāma, among others, granted him ijāza. He died in Mecca in Jumādā al-Ākhira 827 AH.
