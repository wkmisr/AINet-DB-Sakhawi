translation:
  ja: Aḥmad b. Yaḥyā al-Ḥasanī al-Darwī al-Makhlafī al-Yamanī. 信仰篤い人物で、彼にまつわる奇跡が語られている。恐らく850年以前に亡くなり、彼の息子ムヒー・アッ＝ディーン・ムハンマドが後を継いだ。彼に師事した者の中には、シャリーフ・アブドゥッラー・ブン・アーミル・ブン・ムハンマド・アル＝バドル（後述）がいる。
  en: Aḥmad b. Yaḥyā al-Ḥasanī al-Darwī al-Makhlafī al-Yamanī. A man of faith, for whom miracles are recounted. He died approximately before [the year] 850 AH, and his son Muḥyī al-Dīn Muḥammad succeeded him. Among those whom he (the subject) accompanied was al-Sharīf ʿAbd Allāh b. ʿĀmir b. Muḥammad al-Badr (mentioned later).
