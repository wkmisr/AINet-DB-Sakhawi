translation:
  ja: アブドゥルムフスィン・ブン・アリー・ブン・ウマル・アル＝ヤマーニー。その兄弟アブドゥッラウーフは前述、彼ら二人の父と、彼らの甥アブドゥルムグニー・ブン・アビー・アル＝ファトフは後述する。敬虔と名声の家の出である。ジッダで没した。彼らはそこに廟（クッバ）を持ち、その中に彼の墓と甥の墓、その他の墓がある。
  en: ʿAbd al-Muḥsin b. ʿAlī b. ʿUmar al-Yamānī. His brother ʿAbd al-Raʾūf was mentioned above; their father and their nephew ʿAbd al-Mughnī b. Abī al-Fatḥ will be mentioned below. They were of a house of piety and renown. He died in Judda, where they have a domed mausoleum containing his grave, the grave of his nephew, and others.
