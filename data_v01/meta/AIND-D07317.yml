translation:
  ja: ムハンマド・ブン・ジュムア・アル＝ハマザーニー、アル＝ハワージャ（大商人）。マッカに定住し、同地に寄進（ワクフ）した邸宅群を所有していた。彼はその大半を聖モスク（マスジド・アル＝ハラーム）におけるハナフィー派の講座のために充てた。その（講座の）主宰者には、バースィティーヤのシャイフでハナフィー派イマームのアッ＝シャムス・アル＝ブハーリーが任ぜられ、彼がそれを務めたが、その後、寄進者の息子の代にしばらく停止した。868年ラビーウ・アル＝アウワル月2日の月曜日の夜の終わりに急死した。イブン・ファハドが彼の没年月日を記録している。
  en: Muḥammad b. Jumʿa al-Hamadhānī, al-Khawājā. A resident of Mecca and the owner of the endowed houses there, most of which he dedicated to a lesson for the Ḥanafīs in the Sacred Mosque. The shaykh of al-Bāsiṭiyya and imam of the Ḥanafīs, al-Shams al-Bukhārī, was appointed to preside over it, and he exercised it; then it was suspended for a period in the time of the endower's son. He died suddenly at the end of the night of Monday, 2 Rabīʿ al-Awwal 868. Ibn Fahd recorded his death date.
