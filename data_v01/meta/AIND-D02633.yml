  ja: ハサン・ブン・ムハンマド・ブン・アリー・アン＝ニムラーウィー。同郷人であるアル＝バドル・ハサン・ブン・アリー・ブン・ハサン（既出）の婿（スィフル）。クルアーンと『ハディーヤ・アン＝ナースィフ』を読誦し、カイロで私（サハーウィー）から聴聞し、時にいくつかの講義にも出席した。
  en: Ḥasan b. Muḥammad b. ʿAlī al-Nimrāwī. The brother-in-law (or son-in-law) of his compatriot al-Badr Ḥasan b. ʿAlī b. Ḥasan (aforementioned). He recited the Qurʾān and Hadiyyat al-Nāṣiḥ, heard from me (al-Sakhāwī) in Cairo, and sometimes attended some of the lessons.
