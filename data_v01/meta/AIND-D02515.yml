translation:
  ja: アル＝ハサン・ブン・アフマド・ブン・ハサン・ブン・アリー・ブン・ムハンマド・ブン・アブドゥッラフマーン、バドルッディーン。イマーム・アッ＝シハーブ・アル＝アズライーの息子。ムハンマド・マーミシュの父。母は彼の父に仕えたチェルケス人の女奴隷であった。彼はクルアーンを暗記して父のもとでその朗誦を仕上げ、『ミンハージュ』の一部も暗記した。アル＝ザーヒリーヤ学院で『サヒーフ・アル＝ブハーリー』の読了会を聴聞した。880年頃、壮年に達したのちに亡くなった。
  en: Al-Ḥasan b. Aḥmad b. Ḥasan b. ʿAlī b. Muḥammad b. ʿAbd al-Raḥmān, Badr al-Dīn, son of al-Imām al-Shihāb al-Adhraʿī. Father of Muḥammad Māmish. His mother was a Circassian slave-girl belonging to his father. He memorized the Qurʾān and perfected its recitation under his father, and memorized part of al-Minhāj. He heard the completion of 『Ṣaḥīḥ al-Bukhārī』 at al-Ẓāhiriyya. He died around the year 880 H, having reached middle age.
