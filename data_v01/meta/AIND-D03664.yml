translation:
  ja: アブドゥッラフマーン・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラフマーン・ブン・フサイン・ブン・アル＝ハサン・アッ＝ザイン・アル＝マダニー。アブー・アル＝ファラジュの兄弟であり、以前言及されたイブラーヒーム・ブン・アブドゥッラフマーンの兄弟の孫。先祖と同様にイブン・アル＝カッターンとして知られる。マディーナで私（サハーウィー）から聴聞した。
  en: Abd al-Rahman bin Abd Allah bin Muhammad bin Abd al-Rahman bin Husayn bin al-Hasan al-Zayn al-Madani. He is the brother of Abu al-Faraj and the grandson of the brother of Ibrahim bin Abd al-Rahman, who was mentioned previously. Like his predecessors, he is known as Ibn al-Qattan. He heard (hadith) from me in Medina.
