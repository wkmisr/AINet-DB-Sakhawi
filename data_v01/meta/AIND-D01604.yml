translation:
  ja: 595 アフマド・ブン・ムハンマド、シャハーブ・アル＝バーリスィー出身、ダマスカス人、ハナフィー派、アル＝ジャワーシニー。我らがシャイフは自身の『アンバーʾ』の中で述べた。彼は若い頃から仕事に就き、アブー・アル＝バカーʾの娘と婚姻関係を結び、ファトワを発し、教鞭を執り、判務を代行し、後見人監督官の職務やその他多くの役職をダマスカスで務めた。彼は良き行状の持ち主であり、自らの努力によってしばらくカーディー職を務めたが、その後解任され、復職を試みたものの実現しなかった。そして809年ジュマーダー・アル＝アーヒラ月に亡くなった。
  en: 595 Aḥmad b. Muḥammad al-Shihāb, of al-Bālisī origin, al-Dimashqī, al-Ḥanafī, al-Jawāshnī. Our shaykh (Ibn Ḥajar) said in his 『Anbāʾ』 that he worked in his youth, became a son-in-law to Abū al-Baqāʾ (by marrying his daughter), issued fatwas, taught, served as a deputy in judgment, and held the office of supervisor of guardians, as well as many other positions in Damascus. He had good conduct and briefly served as an independent qāḍī through his own efforts. He was then dismissed and sought to return to the post, but it was not granted. He died in Jumādā al-Ākhira in the year 809.
