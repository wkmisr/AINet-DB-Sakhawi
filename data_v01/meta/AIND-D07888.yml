  ja: ムハンマド・ブン・アビー・アブドゥッラー、アル＝ムンタスィル、アブー・ファーリスの孫でその後を継いだ者。彼はムハンマド・ブン・ムハンマド・ブン・アブド・アル＝アズィーズであり、後述する。
  en: Muḥammad b. Abī ʿAbd Allāh al-Muntaṣir, grandson of Abū Fāris and the one established after him. He is Muḥammad b. Muḥammad b. ʿAbd al-ʿAzīz; he will come later.
