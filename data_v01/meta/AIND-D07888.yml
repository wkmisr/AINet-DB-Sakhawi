- text: '転送見出し（原文「هو محمد بن محمد بن عبد العزيز يأتي」による）。転送先は #AIND-D08836「محمد بن محمد بن عبد العزيز بن أحمد بن محمد بن أبي بكر المنتصر أبو عبد الله بن الأمير أبي عبد الله بن أبي فارس بن أبي العباس الهنتاني الحفصي الماضي أبوه وجده . ملك المغرب بعد جده في ذي الحجة سنة سبع وثلاثين … مات … سنة ثمان وثلاثين بتونس」（ハフス朝スルターン المنتصر、ラカブ・祖父 أبو فارس・後継の記述が一致）。'
