translation:
  ja: ムハンマド・イッズ・アッ＝ディーン・アブー・アル＝ヤマン、前の項の人物（ザイン・アル＝アービディーン）の同父母弟。（8）87年ジュマーダー・アル＝アーヒラ月14日火曜日の午後にカイロで生まれた。両親の庇護のもとで育ったが、やがて父が没し、母から引き取られて、私は（8）96年の巡礼期に彼を伴ってマッカへ行き、彼は私とともに隣留（ジャーワラ）した。彼は私に聴聞することもあり、それどころか『ブハーリー』の大部分を聴聞した。（8）98年ラビーウ・アル＝アウワル月に私は彼に割礼を施した。神が彼に神の書（クルアーン）の暗記を容易にし、彼を学問の徒・学識者の一人としてくださるように。
  en: Muḥammad ʿIzz al-Dīn Abū al-Yaman, full brother of the preceding (Zayn al-ʿĀbidīn). He was born in Cairo on the afternoon of Tuesday 14 Jumādā al-Ākhira (8)87. He grew up under the care of his parents; then his father died, and he was taken from his mother, and I took him with me to Mecca in the pilgrimage season of (8)96, where he sojourned (jāwara) with me. He sometimes heard from me; indeed he heard most of al-Bukhārī. I circumcised him in Rabīʿ al-Awwal (8)98. May God make the memorization of His Book easy for him and make him one of the people of knowledge and its masters.
