translation:
  ja: カジュマース・ブン・カルクマース。父はスィーディー・アル＝カビールとして知られた。彼は勇敢さと気前のよさにおいて、父、叔父のタグリー・ビルディー、そして二人の叔父であるディマルダーシュ・アル＝ムハンマディーに勝っていたが、彼らほどの幸運は与えられなかった。アル＝ジャマーリー・ユースフ・ブン・タグリー・ビルディーとの交際がきわめて親密で、ユースフは、彼（カジュマース）が自分より数か月年長であったと述べている。841年シャウワール月、カイロでペストにより没した。
  en: Qajmās b. Qurqumās, whose father was known as Sīdī al-Kabīr. He surpassed his father, his paternal uncle Taghrī Birdī, and their uncle Dimirdāsh al-Muḥammadī in bravery and generosity, yet he was not granted their good fortune. He was very closely attached to al-Jamālī Yūsuf b. Taghrī Birdī, who said that he (Qajmās) was older than himself by some months. He died of the plague in Cairo in Shawwāl of the year 841.
