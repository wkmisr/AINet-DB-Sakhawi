translation:
  ja: ハサン・ブン・ユースフ・ブン・アユーブ・アル＝バドル・アッ＝トゥルクマーニー（祖父の名で知られる）。エルサレム、ラムラ、ナブルス、アル＝カラクの副知事（ナーイブ）職を異なる時期に何度も歴任した。私はエルサレムなどで彼を何度も見かけた。彼は880年ジュマーダー・アル＝アーヒラ（第6月）に没した。
  en: Ḥasan b. Yūsuf b. Ayyūb al-Badr al-Turkumānī, known by his grandfather. He was appointed as deputy (nāʾib) of Jerusalem, al-Ramla, Nablus, and al-Karak more than once at different times. I saw him more than once, including in Jerusalem. He died in Jumada al-Akhira, the year 880.
