notes:
- text: 本文は三人目の兄弟を「عبد الكريم」と記すが、これは「عبد الكبير」(AIND-D04237) の誤記。父 أبو السعادات (AIND-D10978) および他の兄弟項 AIND-D03634・AIND-D04446 がいずれも「عبد الكبير」と記し、本人項 AIND-D04237 自身も同綴りであることから、D00741 側の単独の誤記と判断した。
  lang: ja
  type: editorial
- text: The text names the third brother "ʿAbd al-Karīm," but this is a scribal error for "ʿAbd al-Kabīr" (AIND-D04237). The father's entry (Abū al-Saʿādāt, AIND-D10978) and the other brothers' entries (AIND-D03634, AIND-D04446), as well as the man's own entry (AIND-D04237), all read "ʿAbd al-Kabīr"; the discrepancy is therefore an isolated error in D00741.
  lang: en
  type: editorial
