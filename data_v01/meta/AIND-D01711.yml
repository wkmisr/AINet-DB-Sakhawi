translation:
  ja: アフマド・ブン・ユースフ・ブン・アブド・アッ＝ラフマーン・アル＝ヤマニー、のちアル＝マッキー。後述するサディークの父で、アル＝アハダルとして知られる。イエメンで人びとが聖者として崇敬した者の一人で、高徳と学識の家系の出であった。長らくメッカに隣住（ジャワラ）し、819年ズー・アル＝ヒッジャ月16日に没した。アル＝ファーシーが彼について詳細に記している。
  en: Aḥmad b. Yūsuf b. ʿAbd al-Raḥmān al-Yamanī, then al-Makkī. Father of Ṣiddīq (forthcoming), and known as al-Ahdal. He was one of those whom people in Yemen venerated, hailing from a house of righteousness and knowledge. He resided (jāwara) in Mecca for a long time, and died on the 16th of Dhū al-Ḥijja in the year 819 H. al-Fāsī mentioned him at length.
