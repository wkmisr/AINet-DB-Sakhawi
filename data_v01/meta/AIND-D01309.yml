translation:
  ja: 324 アフマド・ブン・ムハンマド・ブン・ハージ・ブン・ダーニヤル、あだ名がシャイハーブ・アブル・アッバース・アル＝キラーニー、シャーフィイー派のクルアーン朗誦教師であり、アル＝ハーフィズ・アル＝アアライ（跛行のハーフィズ）として知られる。彼は様々な学術分野で優れ、イブン・アル＝ジャザリーなどと共にクルアーン朗誦法を習得し、多くの人々に教授した。彼に朗誦した者の中にはジャアファル・アッ＝サンフーリーがいる。我らがシャイフ（イブン・ハジャル）は、今世紀（9世紀ヒジュラ暦）中頃にエジプトの朗誦家（のリスト）に彼の名を記した。彼は840年代以降に疫病で亡くなった。
  en: 324 Aḥmad b. Muḥammad b. Ḥājjī b. Dāniyāl, known by the honorific Shihāb Abū al-ʿAbbās al-Kīlānī, a Shāfiʿī Qurʾān reciter (muqriʾ), and recognized as al-Ḥāfiẓ al-Aʿraj (the Lame Ḥāfiẓ). He excelled in various scholarly disciplines and mastered the Qurʾānic recitations (qirāʾāt) with Ibn al-Jazarī and others, teaching them to many. Among those who recited to him was Jaʿfar al-Sanhūrī. Our shaykh (Ibn Ḥajar) recorded his name among the reciters in Egypt in the middle of this century (9th Hijri century). He died in the plague after the 840s.
