translation:
  ja: ハーリド・ブン・ジャーミウ・ブン・ハーリド、アッ＝ザイン・アル＝ビサーティー、のちアル＝カーヒリー。カーディー・シャムス・アッ＝ディーン・アル＝マーリキーの従兄弟。我らの師アッ＝ザイン・リドワーンが彼に言及し、彼がアッ＝シハーブ・アル＝ジャウハリーからイブン・マージャの『スナン』を一部欠落ありで聴聞し、またアル＝ジャマール・アル＝ハンバリーから『サマーニヤート・アン＝ナジーブ』の一部を聴聞したと述べ、学生たちを彼のもとへ導いた。アル＝ビカーイーも彼に会った者の一人だと私は思う。840年頃に没した（推定）。
  en: Khālid b. Jāmiʿ b. Khālid, al-Zayn al-Bisāṭī, then al-Qāhirī, cousin of the qāḍī Shams al-Dīn al-Mālikī. Our shaykh al-Zayn Riḍwān mentioned him and said that he heard the Sunan of Ibn Māja from al-Shihāb al-Jawharī with some lacunae, and that he heard part of the Thamāniyyāt al-Najīb from al-Jamāl al-Ḥanbalī; and he directed students to him. I think al-Biqāʿī was among those who met him. He died around the year 840, as I suppose.
