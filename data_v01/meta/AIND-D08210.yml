translation:
  ja: ムハンマド・ブン・アリー・ブン・ムーサー、アル＝バドル・アル＝カーヒリー・アル＝マーワルディー。イブン・ムーサーとして知られる。856年にマッカとマディーナで、さらにカイロの旧ザーヒリーヤ（マドラサ）でも、私（サハーウィー）とともに一団の師たちのもとで『ブハーリー』の読了（ハトム）を聴聞した者の一人。アッ＝スンバーティーの仲間（アスハーブ）の一人であった。マンスーブ体を書き、ワッラーキーン（書籍商街）で生計を立てた。推測では870年近くに没した。
  en: Muḥammad b. ʿAlī b. Mūsā, al-Badr al-Qāhirī al-Māwardī, known as Ibn Mūsā. He was among those who heard, together with me (al-Sakhāwī), in the year 856 in Mecca and Medina from a group of shaykhs, and also at the old Ẕāhiriyya in Cairo, the completion (khatm) of al-Bukhārī. He was one of the companions of al-Sunbāṭī. He wrote the proportioned (mansūb) script and earned his living in al-Warrāqīn (the stationers' quarter). He died around 870, presumably.
