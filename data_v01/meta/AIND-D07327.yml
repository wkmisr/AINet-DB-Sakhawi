translation:
  ja: ムハンマド・ブン・ハサブッラー、ジャマール・アッ＝ディーン、アル＝マッキー、アッ＝ザイーム、商人。我らのシャイフ（イブン・ハジャル）は『インバー』で次のように述べている。「802年ジュマーダー・アル＝ウーラー月3日に没した。非常に富裕で商取引で知られ、死後、隠していた分を除いても2万ディーナール以上の財産が彼の遺産から差し押さえられた。」
  en: 'Muḥammad b. Ḥasab Allāh, Jamāl al-Dīn, al-Makkī, al-Zaʿīm, the merchant. Our shaykh (Ibn Ḥajar) said in his Inbāʾ: "He died on 3 Jumādā al-Ūlā 802. He was extremely wealthy and well known for commercial dealings; after his death more than twenty thousand dinars of his property were seized, apart from what he had concealed."'
