translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・バクタムル、ナースィル・アッ＝ディーン・ブン・ジャマール・アッ＝ディーン。イブン・アル＝ハージブとして知られる。彼の姻族（スィフル）がダワーダール職にあった時期に立身し、エジプト領（アッ＝ディヤール・アル＝ミスリーヤ）の十人隊長（アミール・アシャラ）の一人であった。（8）02年ラビーウ・アル＝アーヒル月25日に没した。アル＝アイニーがその没年月日を記録し、多くの財産を遺したと述べている。我らがシャイフ（イブン・ハジャル）は『インバー』でその死をラビーウ・アル＝アウワル月としているが、前者（ラビーウ・アル＝アーヒル月）が正しい。
  en: Muḥammad b. ʿAbd Allāh b. Baktamur, Nāṣir al-Dīn b. Jamāl al-Dīn, known as Ibn al-Ḥājib. He rose to prominence while his in-law held the office of dawādār, and was one of the amirs of ten in the Egyptian realm. He died on 25 Rabīʿ II (8)02. Al-ʿAynī recorded his death and said that he left behind much property. Our shaykh (Ibn Ḥajar) dated it in his Inbāʾ to Rabīʿ I, but the former is correct.
