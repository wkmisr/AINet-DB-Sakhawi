translation:
  ja: サディーク・ブン・サーリム・アッ＝タグリビー・アル＝カーヒリー。クルアーンを修め、バーブ・アッ＝シャアリーヤ門外のシーディー・ヤフヤー・アル＝バルヒーのザーウィヤの傍らで子供たちにそれを教えた。バイバルス修道院（バイバルスィーヤ）に籍を置いた。［著者サハーウィーの］母方の祖父の近隣住民の一人であり、その（祖父の）死後、850年頃に没した。神が彼を赦されますように。
  en: Sadiq b. Salim al-Taghlibi al-Qahiri. He recited the Qur'an and taught children with it near the zawiya of Sidi Yahya al-Balkhi outside Bab al-Sha'riya. He held a stipend at al-Baybarsiyya, and was a neighbor of [al-Sakhawi's] maternal grandfather. He died after him, close to the year 850 AH. May God forgive him.
