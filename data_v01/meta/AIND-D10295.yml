translation:
  ja: ヤフヤー・ブン・ムハンマド・ブン・ハサン・ブン・マルズーク・アル＝マルズーキー・アル＝ジブリー（ジームにカスラ、バーにスクーン）、アル＝ヤマーニー、シャーフィイー派。アッ＝ラディー・ブン・アッ＝ラッダードに法学を学び、アリー・イブン・シャッダードから聴き、大いに学問に励んだ。信心深く敬虔で善良な人で、スーフィーの流儀によるサマーゥを事とし、そのために人々が彼のもとに集まった。814年ジュマーダー第二月に、80歳に達して没した。我らの師（イブン・ハジャル）が『インバー』に彼を記している。
  en: Yaḥyā b. Muḥammad b. Ḥasan b. Marzūq al-Marzūqī al-Jiblī (with kasra on the jīm and an unvowelled bāʾ), al-Yamānī, the Shāfiʿī. He studied law under al-Raḍī b. al-Raddād and heard from ʿAlī Ibn Shaddād, and studied a great deal. He was a devout, religious and good man who practised samāʿ sessions in the manner of the Sufis, and people would gather at his place for that. He died in Jumādā II 814, having reached eighty. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
