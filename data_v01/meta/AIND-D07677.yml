notes:
- text: corpus の見出しは「محمد عبد العزيز بن علي بن أحمد بن عبد العزيز …」で محمد と عبد العزيز の間の「بن」が脱落している。本項は刊本 96 番＝「محمد بن عبد العزيز」の連続（95 محمد بن عبد العزيز بن عبد الواحد／98 محمد بن عبد العزيز بن محمد）の中にあり、父 عبد العزيز بن علي بن أحمد بن عبد العزيز النويري（#AIND-D03979）と兄弟 عمر（#AIND-D05872）・عبد الرحمن（#AIND-D03646）の本伝から「محمد بن عبد العزيز بن علي」と復元できるため、persName では「بن」を補った（要判断 §Dd-2）。
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・〔ブン・〕アブドゥルアズィーズ・ブン・アリー・ブン・アフマド・ブン・アブドゥルアズィーズ・アル＝ハーシミー・アン＝ヌワイリー・アル＝ヤマニー・アル＝マッキー。母は父の女奴隷であったインド人のカムラー。816年にイエメンのタイッズまたはザビードで生まれた。832年に二人の兄ウマルおよびアブドゥッラフマーンとともにカイロへ旅し、次いでマグリブ、次いでタクルールへ赴き、没した。
  en: Muḥammad [b.] ʿAbd al-ʿAzīz b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz al-Hāshimī al-Nuwayrī al-Yamanī al-Makkī. His mother was Qamrā al-Hindiyya, a slave-girl of his father. He was born in the year 816 in Taʿizz or Zabīd in Yemen, and travelled with his two brothers ʿUmar and ʿAbd al-Raḥmān to Cairo in the year 832, then to the Maghrib, then to Takrūr, and died.
