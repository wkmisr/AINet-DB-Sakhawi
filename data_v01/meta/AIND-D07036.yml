translation:
  ja: ムハンマド・ブン・アフマド・アル＝ジャマール・アル＝バフナスィー、のちアッ＝ディマシュキー、シャーフィイー派。カイロで学問に携わり『ミンハージュ』を暗記し、アル＝ブルハーン・ブン・ジャマーアと結びつき、彼がシャームの法官職に就くと彼を代理に任じ、多くの事柄で彼に頼った。職務の遂行が巧みで勤勉であり、洒脱で逸話に富み、貞潔とともに清貧であった。ダマスクスで大事件が起こると、カイロへ逃れ、アル＝ジャラール・アル＝バルキーニーが彼を代理に任じた。〔80〕5年ズー・アル＝カアダ月に没した。我らが師〔イブン・ハジャル〕が『インバー』で彼に言及している。
  en: Muḥammad b. Aḥmad al-Jamāl al-Bahnasī, then al-Dimashqī, al-Shāfiʿī. He studied in Cairo and memorised the Minhāj, and attached himself to al-Burhān b. Jamāʿa, who, when he was appointed to the judgeship of Syria, made him his deputy and relied on him in many matters. He was skilful in the conduct of business and assiduous in it, with wit and amusing anecdotes, and he was poor yet upright. When the great calamity befell Damascus he fled to Cairo, where al-Jalāl al-Bulqīnī made him his deputy. He died in Dhū al-Qaʿda of the year [80]5. Our shaykh [Ibn Ḥajar] mentioned him in his Inbāʾ.
