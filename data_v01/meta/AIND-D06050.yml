translation:
  ja: アナーン・ブン・クナイド・ブン・ミスカール、アル＝カーイド、アル＝ハサニー。その父と兄弟マスウードは後述。兄弟の代理としてマッカの副知事職（ニヤーバ）を務めた者の一人で、むしろ彼こそがその知事（ワーリー）であり、兄弟より圧政が軽かった。
  en: ʿAnān b. Qunayd b. Mithqāl, al-Qāʾid, al-Ḥasanī; his father and his brother Masʿūd are mentioned below. He was among those who deputized for his brother in the deputy-governorship (niyāba) of Mecca; indeed he was its governor (wālī), and was lighter-handed than his brother.
