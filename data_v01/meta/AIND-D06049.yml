translation:
  ja: アナーン・ブン・アリー・ブン・アナーン・ブン・ムガーミス・ブン・ルマイサ・ブン・アビー・ヌマイイ・アル＝フサイニー。（8）23年にイブン・アル＝ジャザリーのもとで、その著書『アル＝ヒスン・アル＝ハスィーン』の大部分を聴聞した者の一人。（8）30年にカイロで没した。イブン・ファハドがその没年を記している。
  en: ʿAnān b. ʿAlī b. ʿAnān b. Mughāmis b. Rumaytha b. Abī Numayy al-Ḥusaynī. He was among those who heard most of his book al-Ḥiṣn al-Ḥaṣīn from Ibn al-Jazarī in the year (8)23. He died in Cairo in the year (8)30. Ibn Fahd recorded his death date.
