notes:
- text: '転送見出し（原文「فيمن اسم أبيه محمد بن أحمد بن أبي الفضل بن عبد الله」による）。転送先は #AIND-D04555（عبد الله بن محمد بن أحمد بن أبي الفضل بن عبد الله العفيف بن الجمال بن الشهاب بن الكمال الحرازي الأصل المكي الحنفي أخو أحمد … ممن سمع مني بمكة。corpus L50011）。ナサブ5代（محمد بن أحمد بن أبي الفضل بن عبد الله）とニスバ・父の称号（الجمال）が完全に一致し、父 الجمال الحرازي の本伝 #AIND-D06881（محمد بن أحمد … جمال الدين … الحرازي الأصل المكي الحنفي والد أحمد وعبد الله）とも整合する。'
