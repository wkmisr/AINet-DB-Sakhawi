notes:
- text: '「وجدهم مع ولدي هذا المحمدين أبي الفضل وأبي اليمن」の読み: 「الآتي」が「أخوه الآخر أبو بكر」（クンヤ部）・「جدهم」（祖父 محمد بن محمد بن حسين＝D08766、محمد بن محمد 部）・「ولدي هذا」（本項主の二人の息子 محمد بن محمد بن علي＝D08952・D08953、محمد بن محمد 部）に及ぶ、と読んだ（いずれも本項より後に立項＝「الآتي」と整合。ブリーフは「読みが難しい＝relation を立てず」としたが、corpus の D08952「الماضي أبوه وجده وجد أبيه」・D08953 がナサブで閉合するため規則37 により relation を立てた。ISSUES §D151-4）。初版の訳「彼らの祖父は私の二人の息子と同時代」は誤り（「ولدي」はサハーウィーの息子ではない）。孫: D09157 محمد بن محمد بن محمد … أبو الطيب بن الجلال أبي الفضل。'
