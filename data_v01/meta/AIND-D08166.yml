translation:
  ja: ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・ムハンマド・ブン・フサイン・ブン・アリー・ブン・アイユーブ、アッ＝シャムス・ブン・アン＝ヌール・イブン・アル＝バルキー。父と兄弟のアフマドは既述、もう一人の兄弟アブー・バクルと彼らの祖父は、この者の二人の息子である二人のムハンマド、アブー・アル＝ファドルとアブー・アル＝ヤマンとともに後述。（8）72年ズー・アル＝ヒッジャ月に没した。神が彼を赦し給うように。
  en: Muḥammad b. ʿAlī b. Muḥammad b. Muḥammad b. Ḥusayn b. ʿAlī b. Ayyūb, al-Shams b. al-Nūr Ibn al-Barqī. His father and his brother Aḥmad have been mentioned; his other brother Abū Bakr and their grandfather, together with the two sons of this man, the two Muḥammads Abū al-Faḍl and Abū al-Yaman, will be mentioned. He died in Dhū al-Ḥijja of the year [8]72, may God pardon him.
