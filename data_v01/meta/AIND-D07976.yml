translation:
  ja: ムハンマド・ブン・アリー・ブン・イブラーヒーム・ブン・アフマド、ナースィル・アッ＝ディーン、アッ＝サーリヒー、アル＝ブザーイー（一点の字〔bāʾ〕にダンマ、次に無重複の zāy、次いで無点の ʿayn）、仕立屋、サーリヒーヤのナースィリーヤの管理人（カイイム）。740年の少し後に生まれ、ザイナブ・ビント・イスマーイール・ブン・アル＝ハッバーズから聴講した。我らが師（イブン・ハジャル）は彼に会って彼のもとで読み、『ムウジャム』で彼を取り上げて「（80）3年シャウワール月16日に没した」と述べた。アル＝マクリーズィーも『ウクード』でこれに従っている。
  en: 'Muḥammad b. ʿAlī b. Ibrāhīm b. Aḥmad Nāṣir al-Dīn al-Ṣāliḥī al-Buzāʿī (with ḍamma on the bāʾ, then a zāy without tashdīd, then an undotted ʿayn), the tailor, custodian (qayyim) of al-Nāṣiriyya in al-Ṣāliḥiyya. He was born shortly after 740 and heard from Zaynab bt. Ismāʿīl b. al-Khabbāz. Our shaykh (Ibn Ḥajar) met him and read under him, mentioned him in his Muʿjam and said: he died on 16 Shawwāl of the year [80]3. Al-Maqrīzī followed him in his ʿUqūd.'
