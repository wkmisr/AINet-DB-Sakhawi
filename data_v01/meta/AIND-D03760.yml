translation:
  ja: アブドゥルラフマーン・ブン・アル＝ジャマール・アブー・アル＝ハイル・ムハンマド・ブン・アブドゥルカーディル・ブン・ムハンマド・ブン・アリー・アル＝クラシー・アル＝アダウィー・アル＝ジュラーニー・アル＝マダニー・アル＝ハンバリー。イブン・アル＝ハッジャールとして知られる。父親と共にイブン・スィッディークから（ハディースを）聴聞した。
  en: ʿAbd al-Raḥmān b. al-Jamāl Abū al-Khayr Muḥammad b. ʿAbd al-Qādir b. Muḥammad b. ʿAlī al-Qurashī al-ʿAdawī al-Jarānī al-Madanī al-Ḥanbalī, known as Ibn al-Ḥajjār. He heard (hadith) from Ibn Ṣiddīq together with his father.
