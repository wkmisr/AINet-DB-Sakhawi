translation:
  ja: イヤース・アル＝ジャラーリー・アル＝ハージブ・アル＝ザーヒリー。彼はかつてアミール・アル＝アルバイーン（四十人隊のアミール）の一人であったが、イクターを剥奪され、ハージブ職から解任された。そしてヒジュラ暦831年ジュマーダー・アル＝アーヒラ月19日（火曜日の夜）に、カイロで失業状態のまま死去した。我らがシャイフ（イブン・ハジャル）がその著『インバーウ』で彼について言及している。
  en: 'Iyās al-Jalālī al-Ḥājib al-Ẓāhirī: He was once one of the amirs of forty, but his iqṭāʿ was revoked, and he was dismissed from the office of ḥājib. He died unemployed on the night of Tuesday, the 19th of Jumādā al-Ākhira in the year 831 AH in Cairo. Our shaykh (Ibn Ḥajar) mentioned him in his work Inbāʾ (al-Ghumr).'
