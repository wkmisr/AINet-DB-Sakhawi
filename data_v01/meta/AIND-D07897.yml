translation:
  ja: ムハンマド・ブン・アブドゥルマフディー・ブン・アリー・ブン・ジャアファル・アル＝マッキー。ハサン・ブン・アジュラーンのマッカ統治期間の一時期、彼のディーワーンの監督官の一人であった。812年にイエメンのある町で没した。アル＝ファースィーが彼に言及している。
  en: Muḥammad b. ʿAbd al-Mahdī b. ʿAlī b. Jaʿfar al-Makkī. He was one of the supervisors (mushārif) of the dīwān of Ḥasan b. ʿAjlān during part of the latter's rule over Mecca. He died in the year 812 in some town of Yemen. Al-Fāsī mentioned him.
