translation:
  ja: ムハンマド・ブン・アリー・ブン・アフマド、アル＝ムヒッブ・アブー・アッ＝タイイブ・アル＝ファーリキー・アッ＝シャーズィリー。私は彼をイブン・フカイクだと思う。父とともにアル＝ワリー・アル＝イラーキーの口述会（アマーリー）に通い師事した。
  en: Muḥammad b. ʿAlī b. Aḥmad, al-Muḥibb Abū al-Ṭayyib al-Fāriqī al-Shādhilī; I think he is Ibn Fukayk. Together with his father he attended assiduously the dictation sessions (amālī) of al-Walī al-ʿIrāqī.
