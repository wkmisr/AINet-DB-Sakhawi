    ja: '父 علي بن أحمد：「لازم مع أبيه الولي العراقي في أماليه」＝父も الولي العراقي の口述会に同席。【集約 2026-10-25】#AIND-D05009「علي بن أحمد بن علي نور الدين الفارقي الشاذلي . سمع في ابن ماجة على الأبناسي والغماري والجوهري」は corpus で唯一の「علي بن أحمد … الفارقي الشاذلي」で、本項主の見出し「محمد بن علي بن أحمد … الفارقي الشاذلي」とナサブ＋ニスバ2種が一致し、年代（الأبناسي・الغماري 802没、父子で الولي العراقي（826没）の أمالي に出席）も整合する（規則37・38、内容B[3]、§D133-5）。相手側に子の言及がないため cert medium（同バッチ D07235→D10825 と同水準）。校閲時は #NEEDID（候補 note 留め）、初版は汚染番号 TMP-P-000530。'
