  quote: أزبك الخازندار
  note:
    ja: '「وأنه والد زوجته أزبك الخازندار رأس نوبة النوب بعد موت تنم نائب الشام فيحرر」。読み: 「زوجته」の代名詞を直後の أزبك（代名詞の同格）に係ると取り、「ملج は أزبك الخازندار の妻の父」＝أزبك は本項主の娘婿（son-in-law、規則52 の向き）。代名詞を جقمق に係ると取る読み（ملج＝ジャクマクの妻の父）も文法上は可能だがその場合 أزبك 以下が文中で浮くため採らない。伝聞（قيل）＋「فيحرر」＝cert low。أزبك الخازندار＝#AIND-D01869「أزبك من ططخ الأشرفي ثم الظاهري جقمق … الخازندارية الثانية … ثم نقل إلى رأس نوبة النوب عوضا عن تمربغا في أواخر رمضان من التي تليها［869］」（تنم نائب الشام＝#AIND-D02314 تنم من عبد الرزاق المؤيدي، نائب الشام として868年ジュマーダー1月没）と、الخازندار・رأس نوبة النوب・「تنم の没後」の3点で整合。ただし D01869 の妻はジャクマクの娘（「زوجه ابنته من مطلقته خوند مغلي」）で、ملج がジャクマクの兄弟なら矛盾する（サハーウィー自身「فيحرر」）。別候補 #AIND-D01871「أزبك اليوسفي الخازندار … وصار بعد برسباي قرا رأس نوبة النوب」は時期が合わない。ISSUES §D152-1。'
notes:
- text: '「رأس نوبة النوب」「نائب الشام」は أزبك・تنم の職＝本項主の state にしない。同じ ملج の見出し #AIND-D10003「ملج الظاهري جقمق نائب القلعة」とは原文に同一視の指示がなく、関係づけない（ブリーフ指示）。'
