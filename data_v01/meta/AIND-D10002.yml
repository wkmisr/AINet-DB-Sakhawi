translation:
  ja: マラジュ。アッ＝ザーヒル・ジャクマクの兄弟であり、また、シリア（ダマスクス）副王タナムの死後にラアス・ナウバト・アン＝ヌワブ（侍衛長）となったアズバク・アル＝ハーズィンダールの妻の父である、と言われる。要確認。
  en: Malaj. It is said that he was a brother of al-Ẓāhir Jaqmaq, and that he was the father of the wife of Azbak al-Khāzindār, who became raʾs nawbat al-nuwab after the death of Tanam, the viceroy of Syria. This is to be verified.
