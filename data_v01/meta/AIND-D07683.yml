notes:
- text: '「مضى فيمن جده أحمد بن محمد ابن أبي بكر」＝転送見出し。転送先は #AIND-D07668（محمد بن عبد العزيز بن أحمد بن محمد بن أبي بكر أبو عبد الله بن صاحب المغرب أبي فارس ووالد المنتصر محمد الآتي、835年没）。見出しの「أبي فارس صاحب المغرب」は父（ハフス朝スルターン アブー・ファーリス・アブドゥルアズィーズ）の属格同格であり本項主のクンヤではない（初版は kunyah「أبو فارس」・office「صاحب المغرب」を本項主に付していたが誤り）。'
  type: reference
translation:
  ja: ムハンマド・ブン・アブドゥルアズィーズ〔すなわち〕アブー・ファーリス、マグリブの君主〔の子〕。祖父がアフマド・ブン・ムハンマド・イブン・アビー・バクルである者の項に前述。
  en: Muḥammad b. ʿAbd al-ʿAzīz Abī Fāris, [son of] the ruler of the Maghrib. He has been mentioned above among those whose grandfather is Aḥmad b. Muḥammad b. Abī Bakr.
