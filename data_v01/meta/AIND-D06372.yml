translation:
  ja: キワーム・ブン・アブドゥッラー・アッ＝ルーミー・アル＝ハナフィー。キワームとあだ名され、その名はその省略形であるらしい。我らの師（イブン・ハジャル）は『インバー』で言う。「シャームに来たときすでに諸学に秀でており、アル＝バドル・ブン・マクトゥームと姻戚となり、モスクの教授席（タスディール）に任じられ、学業に励み裨益を与え、副王たちと交わった。心が清く、義侠心に富み、人々をよく助けた。」（8）08年ラビーウ・アル＝アウワル月にダマスクスで没した。アッラーよ彼を憐れみたまえ。
  en: 'Qiwām b. ʿAbd Allāh al-Rūmī al-Ḥanafī; he was called Qiwām by laqab, and his name seems to be an abbreviation of it. Our shaykh (Ibn Ḥajar) said in his Inbāʾ: he came to Syria already accomplished in several disciplines, became related by marriage to al-Badr b. Maktūm, was appointed to a teaching chair (taṣdīr) in the congregational mosque, studied and benefited others, and kept company with the viceroys; he was pure of heart, abounding in generosity and in helping people. He died in Rabīʿ al-Awwal of the year (8)08 in Damascus, may God have mercy on him.'
