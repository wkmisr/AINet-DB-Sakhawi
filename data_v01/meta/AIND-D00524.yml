translation:
  ja: アハマド・ブン・アハマド・ブン・ムーサー・ブン・イブラーヒーム・ブン・タルハーン、ラカブはアッ＝シハーブ、クンヤはアブー・アル＝アッバース。アッ＝シハーブ・ブン・アッ＝ディヤーの息子。その父（の伝記）は後述される。彼はそのクンヤでより知られる。先代と同様に証人職で生計を立て、その後、アル＝イズ・アル＝キナーニーは彼を契約と無効化の代理人に任用し、次いで判事職に任じた。彼は867年ラビーウ・アル＝アウワル月に没した。享年70歳を超えていたか、それに近い年齢であったと私は思う。
  en: Aḥmad b. Aḥmad b. Mūsā b. Ibrāhīm b. Ṭarkhān, al-Shihāb Abū al-ʿAbbās, known as Ibn al-Shihāb b. al-Ḍiyāʾ (his father al-Ḍiyāʾ will be mentioned later). He was more famous by his kunya. He earned a living by bearing witness, like his predecessor. Then al-ʿIzz al-Kinānī appointed him as his deputy for contracts and annulments, and subsequently to the judiciary. He died in Rabīʿ al-Awwal 867 H. I believe he was over seventy years of age, or very close to it.
