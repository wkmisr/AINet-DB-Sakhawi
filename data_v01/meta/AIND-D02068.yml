translation:
  ja: アル＝マース・アル＝アラーイー・アル＝アシュラフィー・バルスバーイは、ハサキーヤの一人である。彼は自身の墓廟を建て、そこでハナフィー法学の授業を設け、その教授にはザイン・アブドゥルラヒーム・アル＝ミンシャーウィーと7人の学生が割り当てられた。880年頃に亡くなった。
  en: Al-Mās al-ʿAlāʾī al-Ashrafī Barsbāy was one of the Khāṣṣakīya. He built a tomb complex for himself, in which he established classes for the Hanafis, appointing al-Zayn ʿAbd al-Raḥīm al-Minshāwī along with seven students to teach in it. He died around the year 880 H.
