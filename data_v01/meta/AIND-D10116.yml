notes:
- text: '女性部 #AIND-D13611「764 مريم ابنة أبي المين محمد بن أحمد بن الرضى إبراهيم بن محمد بن إبراهيم الطبرى المكية ، أمها حبشية لأبيها」は同じ父の娘（母も「حبشية لأبيها」）＝本項主の姉妹。相手側は本項主を名指ししない（規則23）ので relation は立てず、共通の父 #AIND-D06599 で導出できる。初版の shuhrah「ابن أبي اليمن」（「ويعرف بـ」のない父称）と residence event（مكة、ニスバからの補完）は除去。'
