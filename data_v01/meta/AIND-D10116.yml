translation:
  ja: ナースィル・ブン・ムハンマド・ブン・アフマド・ブン・アッ＝ラディー・イブラーヒーム・ブン・ムハンマド・ブン・イブラーヒーム、ナースィル・アッ＝ディーン、イブン・アビー・アル＝ユムン、アッ＝タバリー・アル＝マッキー。母は父の所有するアビシニア人の女奴隷であった。父から聴き、アン＝ナシャーウィリー、イブン・ハーティムその他から免状（イジャーザ）を受けた。（80）1年シャアバーン月朔日に、20歳かそれ以上で没した。アル＝ファースィーが彼に言及している。
  en: Nāṣir b. Muḥammad b. Aḥmad b. al-Raḍī Ibrāhīm b. Muḥammad b. Ibrāhīm, Nāṣir al-Dīn, Ibn Abī al-Yumn, al-Ṭabarī al-Makkī. His mother was an Abyssinian slave girl of his father. He heard (ḥadīth) from his father, and al-Nashāwirī, Ibn Ḥātim and others granted him ijāzas. He died on the first of Shaʿbān of the year [80]1, aged twenty or more. Al-Fāsī mentioned him.
