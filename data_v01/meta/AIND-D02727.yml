translation:
  ja: フサイン・ブン・アリー・ブン・ナースィル・ブン・アフマド。ビルバイス（ビルベイス）を家系上のルーツとするヒジャーズの人。既出のハサンの兄弟。彼らの父親はイブン・ナースィルとして知られる。マッカで私（サハーウィー）から聴聞した者の一人である。
  en: Ḥusayn b. ʿAlī b. Nāṣir b. Aḥmad, of Bilbaysī origin and Ḥijāzī residence. He is the brother of the aforementioned Ḥasan, and their father is known as Ibn Nāṣir. He is among those who heard from me in Mecca.
