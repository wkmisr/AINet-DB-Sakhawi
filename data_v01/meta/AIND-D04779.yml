translation:
  ja: アブドゥルワッハーブ・ブン・アブドゥルムウミン・ブン・アブドゥルアズィーズ、アル＝クラシー・アル＝カーヒリー、布商（バッザーズ）。既述のアブドゥルカーディルの父。我らの師（イブン・ハジャル）の口述講義（イムラー）を筆記した者の一人で、さらにイブン・ズカーアからその詩を多く書き取った。徳と善良さを備えていた。（8）45年に没した。
  en: ʿAbd al-Wahhāb b. ʿAbd al-Muʾmin b. ʿAbd al-ʿAzīz, al-Qurashī al-Qāhirī, the cloth merchant (bazzāz), father of ʿAbd al-Qādir mentioned above. He was among those who wrote down the dictation sessions (imlāʾ) of our shaykh (Ibn Ḥajar), and he also wrote down much of the poetry of Ibn Zuqqāʿa, along with merit and goodness. He died in (8)45.
