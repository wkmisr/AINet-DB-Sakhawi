translation:
  ja: アブドゥルワッハーブ・ブン・アビー・バクル、アッ＝タージュ、アッ＝ディマシュキー、ハナフィー派、イブン・アル＝ハンマール（ハー無点・シャッダ付き）。ダマスクスの裁判代理官（ナーイブ・アル＝フクム）の一人。（8）57年シャウワール月末日に同地（ダマスクス）で没し、翌日バーブ・アル＝ファラーディース墓地に埋葬された。神が彼に慈悲を垂れたまわんことを。
  en: ʿAbd al-Wahhāb b. Abī Bakr, al-Tāj al-Dimashqī al-Ḥanafī, Ibn al-Ḥammāl (with undotted ḥāʾ and shadda), one of the deputy judges (nuwwāb al-ḥukm) in Damascus. He died there on the last day of Shawwāl (8)57 and was buried the next day in the cemetery of Bāb al-Farādīs. May God have mercy on him.
