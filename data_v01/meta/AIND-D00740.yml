translation:
  ja: أحمد・イブン・サーリム・アル＝アッバーディー、後にアル＝カーヒリー・アル＝アズバキー。先に述べられたイブラーヒームと、後述するムハンマドの兄弟である。役職のためにシャワーフィイー派と自称していたが、そうでなければ三兄弟とも適格性はなかった。898年の巡礼シーズンに父と兄弟とともにハッジを行ったが、二人（父とアフマドを指す）は戻り、イブラーヒームは残った。
  en: Aḥmad b. Sālim al-ʿAbbādī, then al-Qāhirī al-Azbakī, the brother of the aforementioned Ibrāhīm and the forthcoming Muḥammad. He called himself Shāfiʿī, seemingly for the sake of offices, otherwise, none of the three brothers had any competence. He performed the Hajj with his father and brother in the season of 898 AH. The two (his father and Ahmad) returned, but Ibrāhīm remained behind.
