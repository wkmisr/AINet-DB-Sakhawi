translation:
  ja: ムハンマド・ブン・アブドゥッラー、バルムーン出自のアッ＝ダミーリー、マーリク派。ザーウィヤ・アル＝ハナフィーの寄留者。アブー・アル＝アッバース・アル＝ハナフィーのもとでアラビア語学・二原理学（法学原理論と神学）・スーフィズムを修め、イブン・クタイラのもとで法学とスーフィズムを修めた者の一人。我らがシャイフ（イブン・ハジャル）に聴聞し、彼に『リサーラ』を暗誦提示してイジャーザを得た。巡礼を行い、教授の座に就いて、一団の人々が彼から益を得た。彼に法学とアラビア語学を学んだ者にイブラーヒーム・アッ＝ダミーリーがいる。複数の人が私に彼を称賛し、彼はカラーマ（奇跡）の持ち主で、子供たちの教育をたえず続けている、と言った。
  en: Muḥammad b. ʿAbd Allāh al-Barmūnī by origin, al-Damīrī, the Mālikī, resident of the Zāwiya of al-Ḥanafī. He was among those trained by Abū al-ʿAbbās al-Ḥanafī in Arabic, the two principles (uṣūl al-fiqh and theology) and Sufism, and by Ibn Kutayla in jurisprudence and Sufism. He heard from our shaykh (Ibn Ḥajar), recited al-Risāla to him from memory, and he granted him an ijāza. He performed the pilgrimage and sat to teach, and a group of people benefited from him; among those who studied jurisprudence and Arabic under him was Ibrāhīm al-Damīrī. More than one person praised him to me, saying that he is a man of miraculous graces (karāmāt) and constantly engaged in teaching children.
