translation:
  ja: イブラーヒーム・アル＝アジャミー・アル＝カーナフーシー。後述するシャイフ・アリー・カーナフーシーの代行を務めた。859年ジュマーダー・アル＝ウーラー月9日（日曜日）に死去し、アル＝ムトバクの近くにある自身のザーウィヤに埋葬された。アル＝ムニールが言及した。
  en: Ibrāhīm al-ʿAjamī al-Kahnafūshī, successor of Shaykh ʿAlī Kahnafūshī (forthcoming entry). He died on Sunday, the 9th of Jumādā al-Ūlā, in the year 859 AH, and was buried in his zawiya near al-Muṭbaq. Al-Munīr mentioned him.
