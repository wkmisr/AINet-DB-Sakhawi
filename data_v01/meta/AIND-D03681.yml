translation:
  ja: アブド・アッラフマーン・ブン・ウスマーン・ジャマール・アッディーン・アッ＝サカンダリー。通訳官、商人。商業の諸事に通じており、イブン・アル＝アシュカル家と婚姻関係を結んだ。アレクサンドリアから体調を崩して（カイロに）到来し、しばらく病に伏したが、一時回復してハンマーム（公衆浴場）に入った。しかしその後病が再発し、849年ラマダーン月に没した。彼にはムハンマドという息子がいたが、彼も（先立って）没した。
  en: Abd al-Rahman bin Uthman Jamal al-Din al-Sakandari. The interpreter and merchant, he was knowledgeable in trade matters and married into the family of Ibn al-Ashqar. He arrived from Alexandria in ill health and remained sick for a period, after which he recovered slightly and entered the bathhouse, but then suffered a relapse and died in Ramadan, the year 849 AH. A son of his named Muhammad also died.
