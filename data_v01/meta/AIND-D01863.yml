translation:
  ja: アークマース・アン＝ナウローズィー・アミール・シカール。元々はナウルーズ・アル＝ハーフィズィーのマムルークであり、アル＝ジャームースとも綽名された。アル＝アシュラフ・バルスバーイの治世に十人長（アミール・アシャラ）に任じられ、その後アミール・シカール（狩猟長官）となり、数度にわたり上エジプト（アル＝ワジュフ・アル＝キブリー）の「アル＝カシュフ」（検地・行政官職）を務めた。ザンジュとの戦いで上エジプト（アッ＝サイード・アル＝アアラー）にておよそ845年に殺害された。
  en: Arkamās al-Nawrūzī Amīr Shikār. He was originally one of the mamluks of Nawrūz al-Ḥāfiẓī and was also nicknamed al-Jāmūs. He was made an amir of ten (amīr ʿashara) during the reign of al-Ashraf Barsbāy, then became Amīr Shikār (Master of the Hunt), and subsequently held the office of al-Kashf (inspector/administrator) of Upper Egypt (al-Wajh al-Qiblī) multiple times, until he was killed in Upper Egypt (al-Ṣaʿīd al-Aʿlā) during the war against the Zanj in approximately 845 AH.
