translation:
  ja: アリー・ブン・アブド・アル＝ハック・ブン・アリー・アル＝ハサニー・アル＝ビルカスィー。同地（ビルカス）のシャイフで、ハーンカー・シルヤークース領の村ミナー・ジャアファルの管理人（ムタカッリム）。父については前述した。彼は度々罰金を課された者の一人で、彼を告発した者たちの中に兄弟のバラカートがいたと私に伝わっている。〔バラカートは〕兄弟のアブー・ナスルのためにミニヤト・ハルファーを手に入れ、本項の主は三か所の会計を行うよう拘束された。
  en: ʿAlī b. ʿAbd al-Ḥaqq b. ʿAlī al-Ḥasanī al-Bilqasī, the shaykh of that town [Bilqas] and the administrator (mutakallim) of Minā Jaʿfar, a village belonging to the khānqāh of Siryāqūs; his father has been mentioned above. He was among those who were subjected to fines more than once, and I was informed that among those who denounced him was his brother Barakāt, who obtained Minyat Ḥalfā for his brother Abū Naṣr, while the subject of this entry was placed under detention to render the accounts of the three places.
