translation:
  ja: ムハンマド・ブン・アジュラーン・ブン・ルマイサ・ブン・アビー・ヌマイイ・アル＝ハサニー・アル＝マッキー。我らが師（イブン・ハジャル）が『インバー』の802年の条で彼を取り上げて述べた。「マッカの首長職を代行したが、兄アフマドの死後に目を潰され、そのまま不遇のうちに過ごした。彼はイエメンに入ってその君主に扶助を求め、君主は800年に彼とともにマフミル（巡礼隊）を送り出した。私（イブン・ハジャル）は彼に同行し、その年の巡礼者の大半を襲った渇きから、この伝記の主に同行していたおかげで無事であった。というのも彼は我々を別の経路で進ませたが、巡礼隊長（アミール・アッ＝ラクブ）は彼と意見を異にして通例の経路を進み、水が見つからず、その多くが死んだからである」。アル＝ファースィーは彼の伝記を長く記し、アル＝マクリーズィーも『ウクード』で彼に言及し、ラビーウ・アル＝アウワル月12日に没したとする。
  en: 'Muḥammad b. ʿAjlān b. Rumaytha b. Abī Numayy al-Ḥasanī al-Makkī. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ, dating him to the year 802, and said: he acted as deputy in the emirate of Mecca, then was blinded after the death of his brother Aḥmad and remained in obscurity. He went to Yemen seeking support from its ruler, who sent the maḥmil (pilgrim caravan) out with him in the year 800; "I accompanied him, and thanks to the company of the subject of this entry we were spared the thirst that struck most of the pilgrims that year, for he led us by one route while the leader of the caravan disagreed with him and took the customary route, where they found no water and many of them perished." Al-Fāsī wrote a long biography of him, and al-Maqrīzī mentioned him in his ʿUqūd, saying that he died on 12 Rabīʿ I.'
