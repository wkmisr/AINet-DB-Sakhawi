translation:
  ja: ムハンマド・ブン・アビー・サアド・アル＝ハジャル・ブン・アブドゥルカリーム・ブン・アビー・サアド・ブン・アブドゥルカリーム・ブン・アビー・サアド・ブン・アリー・ブン・カターダ、アル＝ハサニー・アル＝マッキー、イブン・アル＝ハジャル（ファトハ二つ）として知られる。848年ラマダーン月にヤンブウで殺害されて没した。
  en: Muḥammad b. Abī Saʿd al-Ḥajar b. ʿAbd al-Karīm b. Abī Saʿd b. ʿAbd al-Karīm b. Abī Saʿd b. ʿAlī b. Qatāda al-Ḥasanī al-Makkī, well known as Ibn al-Ḥajar (with two fatḥas). He died, killed, at Yanbuʿ in Ramaḍān of the year [8]48.
