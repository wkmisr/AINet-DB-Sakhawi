translation:
  ja: ウマル・ブン・ムハンマド・アッ＝タラーブルスィー・アル＝ハナフィー。我らがシャイフ（イブン・ハジャル）は『ムウジャム』で彼を挙げて次のように述べている。「受け入れられる詩人で、カイロに来て、そこで有力者たちを頌した。私に自作の詩を多く吟じて聞かせ、数行の詩で私を頌した。」（8）13年ラジャブ月に没した。『インバー』では「50歳ほどで」と加え、「巧みな詩人」と評している。アル＝マクリーズィーも『ウクード』で彼を挙げている。
  en: 'ʿUmar b. Muḥammad al-Ṭarābulusī al-Ḥanafī. Our shaykh (Ibn Ḥajar) mentioned him in his Muʿjam and said: "An acceptable poet; he came to Cairo and there praised the notables; he recited to me much of his poetry and praised me in some verses." He died in Rajab of the year (8)13. In the Inbāʾ he added that he was about fifty years old, and described him as a skilled poet. Al-Maqrīzī also mentioned him in his ʿUqūd.'
