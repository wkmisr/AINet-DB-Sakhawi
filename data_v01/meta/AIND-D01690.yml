translation:
  ja: アブドゥッラー・ブン・ヤフヤー・ブン・イーサー・ブン・アッバース・ブン・イブラーヒーム・アル＝アウカリー・アル＝クスンティーニー。 マッカ在住。リバーṭ・アル＝ムーファーのシャイフであった。 商業機器に長けていた。860年ラビーウッ・サーニー月にマッカで死去した。イブン・アズムが彼について著述している。
  en: Aḥmad b. Yaḥyā b. ʿĪsā b. ʿAyyāsh b. Ibrāhīm al-ʿAwkalī al-Qusṭanṭīnī. He was a resident of Mecca and the shaykh of Ribāṭ al-Mawfā. He was skilled in trade instruments. He died there in Rabīʿ al-Ākhir in the year 860 AH. Ibn ʿAzm recorded his biography.
