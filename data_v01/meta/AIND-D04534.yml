translation:
  ja: アブドゥッラー・ブン・イーサー・ブン・アブドゥッラー、アル＝ジャマール・アル＝クルディー。カイロの寄留者、シャーフィイー派。カイロに来て、イブン・アサド、ジャアファル、および両者の弟子アル＝ジャラール・アル＝マルジューシーに読誦学（キラーアート）で師事し、それに秀でた。巡礼（ハッジ）を行い、ウマル・アン＝ナッジャールのもとで十読誦をまず個別に、次いで合わせて読誦した。同様にアッ＝シハーブ・アル＝カバーキビーからも学び、自らも（クルアーンを）教授した。気性の激しい人物であった。ヒジュラ暦883年、四十歳を過ぎて没した。
  en: ʿAbd Allāh b. ʿĪsā b. ʿAbd Allāh, al-Jamāl al-Kurdī, resident of Cairo, the Shāfiʿī. He came to Cairo and attached himself to Ibn Asad, Jaʿfar, and their pupil al-Jalāl al-Marjūshī in the Qurʾānic readings (qirāʾāt), and excelled in them. He performed the pilgrimage and recited the ten readings, first individually and then combined, under ʿUmar al-Najjār; he likewise studied under al-Shihāb al-Qabāqibī, and taught recitation himself. He was sharp-tempered. He died in the year 883 AH, having passed forty.
