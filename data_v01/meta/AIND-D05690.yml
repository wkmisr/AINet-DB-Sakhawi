translation:
  ja: アリ・ブン・ユースフ・ブン・サーリム・ブン・アティーヤ・ブン・サーリフ・ブン・アブドゥンナビー・アル＝ジュハニー。イブン・アビー・アスバアとして知られる。彼は753年にアル＝イズ・ブン・ジャマーアおよびアル＝ファフル・アッ＝タウザリーから『プサア（一部）』のハディースを聴聞した。商業のためにイエメンを頻繁に訪れていたが、804年の末にその地のアデンで逝去した。アル＝ファースィーがマッカでこのことを述べている。
  en: ʿAlī b. Yūsuf b. Sālim b. ʿAṭiyya b. Ṣāliḥ b. ʿAbd al-Nabī al-Juhanī, known as Ibn Abī Aṣbaʿ. He heard a portion of Sunan al-Nasāʾī from al-ʿIzz b. Jamāʿa and al-Fakhr al-Tawzarī in the year 753 AH. He used to travel to Yemen for trade, and he passed away in Aden at the end of the year 804 AH. Al-Fāsī mentioned this in Mecca.
