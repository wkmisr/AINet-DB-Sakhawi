translation:
  ja: ムハンマド・ブン・アフマド・ブン・ヤアラー、アッ＝サイイド・アル＝ハサニー。『ジュルーミーヤ』の註釈を著し、その著者がこれを息子のアブー・ムハンマドのために著したこと、そして自分がフェズでその息子からこの書を読誦したことを述べている。私は彼を今世紀の人と思うが、要確認である。
  en: Muḥammad b. Aḥmad b. Yaʿlā, al-Sayyid al-Ḥasanī. He wrote a commentary on al-Jurūmiyya and stated that its author had composed it for his son Abū Muḥammad, and that he had read it with that son in Fez. I think he belongs to this century, but this should be verified.
