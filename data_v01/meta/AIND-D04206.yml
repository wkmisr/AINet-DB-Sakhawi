translation:
  ja: アブド・アル＝カーディル・ブン・アル＝バドル・ムハンマド・ブン・アビー・アン＝ナジャー・ムハンマド。タハトゥート出自で、ファイユームの町に因みアル＝イスターイーと呼ばれる。父はアル＝ヒジャーズィーとして知られる。高名な聖者（信仰を集める人物）。父の名が挙げられていない者たちの項で後述。
  en: ʿAbd al-Qādir b. al-Badr Muḥammad b. Abī al-Najā Muḥammad, of Ṭaḥṭūṭ origin, known as al-Isṭāʾī after a town in al-Fayyūm; his father is known as al-Ḥijāzī. A famous holy man; [his entry] comes among those whose father is not named.
