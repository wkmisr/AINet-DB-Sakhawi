translation:
  ja: イブラーヒーム・ブン・イブラーヒーム・ブン・ムハンマド、ブルハーン・アル＝ディーン・アル＝ナワウィー・アル＝ディマシュキー・アッ＝シャーフィイー。アル＝ナワウィーの近親者であると言われている。タキー・ブン・カーディー・シュフバから学んだ。証人（カーティブ）として生計を立て、相続法と算術、およびそれらの関連分野に優れており、それらを学生たちに教えた。アブー・アル＝ファドル・ブン・アル＝イマームのような多くの人々が彼から恩恵を受けた。彼が私（＝サハーウィー）に語ったところによると、『ミンハージュ』を注釈し、その相続法部分を詩にまとめ、さらにそれに算術と関連分野を加えて『アル＝ハラーワ・アッ＝スッカリヤ』と題するアルフィーヤ（千行詩）を著したという。他の者は、彼が『アル＝アージュッルーミーヤ』を注釈したとも付け加えている。彼は詩作が速く、かつ優れていた。885年頃にダマスクスで亡くなった。70歳を超えていた。アッラーが彼と我らを慈悲してくださるように。
  en: Ibrāhīm b. Ibrāhīm b. Muḥammad Burhān al-Dīn al-Nawawī al-Dimashqī al-Shāfiʿī. It is said that he was a relative of al-Nawawī. He acquired knowledge from al-Taqī b. Qāḍī Shuhba. He earned his living as a notary/witness. He excelled in inheritance law and arithmetic and their related subjects, teaching these to students. A group, such as Abū al-Faḍl b. al-Imām, benefited from him. He informed me that he commented on 『al-Minhāj』 and versified its inheritance laws, then combined it with arithmetic and its related subjects in an alfiyya (thousand-line poem) which he named 『al-Ḥalāwa al-Sukkarīya』. Others added that he commented on 『al-Ājurrūmīya』. He was quick and good at versification. He died around 885 H in Damascus, having passed seventy years of age. May God have mercy on him and us.
