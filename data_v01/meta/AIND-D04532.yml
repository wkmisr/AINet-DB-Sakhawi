translation:
  ja: アブドゥッラー・ブン・ウマル・アル＝アフダル・アル＝ヤマーニー。善き品性と賞賛すべき礼節の持ち主。アブドゥッラー・アル＝イラーキーに随伴し、（スーフィーの）道において彼から益を得、彼によってシャイフに任じられた。自分に関わりのないことを捨て、衣服などにおいて節度を守り、スーフィーの作法を身につけ、彼らの称賛される道を歩むという善き境地にあった。ヒジュラ暦866年に没した。アッラーが彼を憐れみたまえ。『イエメンの義人たち（スラハー・アル＝ヤマン）』の著者が彼に言及している。
  en: 'ʿAbd Allāh b. ʿUmar al-Ahdal al-Yamānī, a man of good character and commendable manners. He kept the company of ʿAbd Allāh al-ʿIrāqī, benefited from him in the (Sufi) path, and was appointed a shaykh by him. He stood on a fine footing: leaving aside what did not concern him, being frugal in his dress and other matters, cultivating the manners of the Sufis and walking their approved path. He died in the year 866 AH, may God have mercy on him. The author of Ṣulaḥāʾ al-Yaman mentioned him.'
