translation:
  ja: アブドゥルラフマーン・ブン・ヤフヤー・ブン・アブドゥルラフマーン・ブン・アビルハイル・ムハンマド・ブン・ムハンマド・ブン・ファハド・アル＝ハーシミー・アル＝マッキー。後述のアブドゥルカーディルの兄弟。ヒジュラ暦822年ズー・アル＝カアバ月にマッカで生まれ、イブン・アル＝ジャザリーやイブン・サラーマの講義に列席し、また複数からイジャーザ（伝承認可）を授けられたが、幼少にしてヒジュラ暦827年ラビー・アル＝アウワル月の朔日にマッカで没した。
  en: Abd al-Rahman b. Yahya b. Abd al-Rahman b. Abi al-Khayr Muhammad b. Muhammad b. Fahd al-Hashimi al-Makki, the brother of the forthcoming Abd al-Qadir. He was born in Dhu al-Qa'da 822 AH in Mecca. He attended the lectures of Ibn al-Jazari and Ibn Salama, and a group of scholars granted him ijaza. He passed away in Mecca as a child on the first of Rabi' al-Awwal 827 AH.
