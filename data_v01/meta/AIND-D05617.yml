translation:
  ja: アリー・ブン・ムハンマド、アブー・アル＝ハサン・アル＝バジリー・アル＝ビジャーイー・アル＝マグリビー。ビジャーヤ（ブージー）の公証人の一人。法学や الأصلين（二原理、すなわち信仰原理と法学原理）などを講じた。彼は現在、890年に存命中である。
  en: Ali ibn Muhammad Abu al-Hasan al-Bajri al-Bija'i al-Maghribi. One of the notary witnesses of Bougie (Bejaia). He taught jurisprudence (fiqh), the two principles (al-aslayn), and other subjects. He is currently alive in the year 890 [AH].
