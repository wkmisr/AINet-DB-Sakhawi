translation:
  ja: ムハンマド・ブン・アリー・ブン・アビー・バクル・ブン・イスマーイール・アル＝ミスリー・アル＝マッキー・アル＝ジャウヒー、聖モスクの敷物係（ファッラーシュ）にして、ハンバリー派マカームの復唱者（ムカッビル）、またラマダーン月にはザムザムの復唱者。843年ズー・アル＝ヒッジャ月にマッカで没した。イブン・ファフドが（没年を）記している。
  en: Muḥammad b. ʿAlī b. Abī Bakr b. Ismāʿīl al-Miṣrī al-Makkī al-Jawkhī, the farrāsh (attendant) at the Sacred Mosque and the mukabbir (repeater of the prayer formulae) at the Ḥanbalī station, and during Ramaḍān at Zamzam. He died in Mecca in Dhū al-Ḥijja of the year forty-three. Ibn Fahd recorded the date.
