translation:
  ja: アリー・ブン・ラーシド・ブン・アラファ、ヌール・アッ＝ディーン・アル＝アジュラーニー、隊長（アル＝カーイド）。マッカの支配者であったハサン・ブン・アジュラーンの二人の息子アリーとアブー・アル＝カースィムのもとで重んじられた者の一人。866年ムハッラム月3日にマッカで没した。イブン・ファハドがその没年を記録している。
  en: ʿAlī b. Rāshid b. ʿArafa Nūr al-Dīn al-ʿAjlānī, the commander (al-qāʾid). He was among those held in high regard by the two lords of Mecca, ʿAlī and Abū al-Qāsim, the sons of Ḥasan b. ʿAjlān. He died in Mecca on the 3rd of Muḥarram of the year 866; Ibn Fahd recorded his death date.
