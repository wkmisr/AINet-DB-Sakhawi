translation:
  ja: ムハンマド・ブン・サルマーン・ブン・ムハンマド、アッ＝シャムス、アッ＝シャンバーリー、アル＝カーヒリー、シャーフィイー派。諸読誦法（キラーアート）を学び、アッ＝ダイミーのもとで『ブハーリー（サヒーフ）』をダイミー自筆の写本から朗読し、同様に私（サハーウィー）のもとでも同書を朗読した。スルターン（のハッジ）の年に、アル＝アラム・アル＝ブルキーニーの娘に随行してハッジを行った。彼は彼女の（設けた）サブウ（クルアーン七分誦の会）に登録されており、時に子供たちに（クルアーンを）教えることもあった。
  en: Muḥammad b. Salmān b. Muḥammad, al-Shams al-Shanbārī al-Qāhirī al-Shāfiʿī. He studied the Qurʾānic readings (qirāʾāt), and read al-Bukhārī before al-Daymī from a copy in the latter's own hand; likewise he read it before me (al-Sakhāwī). He performed the pilgrimage in the year of the Sultan's pilgrimage in the company of the daughter of al-ʿAlam al-Bulqīnī, being enrolled in her sabʿ (Qurʾān-recitation endowment), and he sometimes taught boys.
