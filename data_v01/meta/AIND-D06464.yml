    ja: '規則3・37。「الماضي أبوه」＝ #AIND-D00014「إبراهيم بن أحمد بن أحمد بن محمود بن موسى المقدسي الأصل الدمشقي الحنفي ثم الشافعي أخو الزين عبد الرحمن الهمامي وعبد الرزاق ومحمد الآتي ذكرهم وكذا أبوهم … ولقيتي بمكة أيضا ومعه ولده محمد فعرض محافيظه على … مات … سنة أربع وتسعين بدمشق」（repo 未収録）。見出しナサブ3代＋ニスバ＋相手側本文の「ومعه ولده محمد فعرض محافيظه على」で閉合。初版の #NEEDID を置換。'
