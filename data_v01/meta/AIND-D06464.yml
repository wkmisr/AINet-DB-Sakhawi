translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アフマド・ブン・アフマド・アル＝マクディスィー、アル＝ハマーミーの甥で、父と叔父は既出。いくつかの書物を暗記し、第3回のマッカ滞在（ムジャーワラ）の際に父とともに私に会ってそれらを私に試問（アルド）し、二人は私から『アル＝ムサルサル』などを聴いた。
  en: Muḥammad b. Ibrāhīm b. Aḥmad b. Aḥmad al-Maqdisī, nephew of al-Hamāmī; his father and his uncle have been mentioned above. He memorized some books, met me together with his father in Mecca during the third mujāwara, recited them to me, and the two of them heard from me al-Musalsal and other works.
