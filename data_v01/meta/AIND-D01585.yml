translation:
  ja: アフマド・ブン・ムハンマド・ブン・ユースフ。ニスバは元来アジャミー、のちマダニー。ハナフィー派。後述する兄のヤフヤーがおり、彼（ヤフヤー）が年長である。アッ＝ザーキルとして知られる。マディーナで（ハディースを）聴聞した人々のひとり。ヒジュラ暦891年ラビーウ・アッ＝サーニー月9日に死去した。
  en: Aḥmad b. Muḥammad b. Yūsuf, originally al-ʿAjamī, then al-Madanī, a Ḥanafī. He is the brother of Yaḥyā, who will be mentioned later and who is the elder. He is known as al-Dhākir. He was among those who heard [ḥadīth] in Medina. He died on the 9th of Rabīʿ al-Thānī in the year 891 H.
