translation:
  ja: アフマド・ブン・ムハンマド・ブン・ウスマン・ブン・アブドゥッラー。アブドゥッラーの代わりにアイユーブとする説もある。カーディー・アシールッディーンの子シハーブ・アル＝アシュリーミー・アル＝カーヒリー。のちに伝記の登場するナーシルッディーン・ムハンマドの父。「イブン・アシール」として知られた。判事職の代理を務めた。819年サファル月に疫病で亡くなった。我らがシャイフ（イブン・ハジャル）がその著書『アンバー』で彼について触れている。
  en: Aḥmad b. Muḥammad b. ʿUthmān b. ʿAbd Allāh (it is also said Ayyūb instead of ʿAbd Allāh), al-Shihāb, son of al-Qāḍī Aṣīl al-Dīn al-Ashlīmī al-Qāhirī, father of Nāṣir al-Dīn Muḥammad (mentioned later). He was known as Ibn Aṣīl. He served as deputy in judgment and died of plague in Ṣafar of the year 819. Our shaykh (Ibn Ḥajar) mentioned him in his *Anbāʾ*.
