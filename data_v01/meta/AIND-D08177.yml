notes:
- text: '転送見出し（原文「مضى فيمن جده محمد بن محمد بن مسلم」による）。転送先は #AIND-D08171「549 محمد بن علي بن محمد بن محمد بن مسلم ناصر الدين المصري الشافعي ويعرف بابن مسلم كمحمد … مات في ربيع الأول سنة ست وستين」（B151、同バッチ受領）。祖父 محمد بن محمد بن مسلم・曾祖父 مسلم が一致し、corpus で「محمد بن علي بن محمد بن محمد بن مسلم」の見出しはこの1件のみ（hw.py「بن مسلم」）。'
  type: reference
  target: AIND-D08171
- text: '見出しの「البالسي」は D08171 の見出しには無い（D08171 は「المصري」）が、ابن مسلم 家は「القرشي البالسي المصري」（#AIND-D07653・#AIND-D08832・女性部 #AIND-D12928「… بن حسين بن مسلم … البالسي المصري」）であり、本見出しは1段省略した同家の索引見出しと読める。同名見出し #AIND-D09263・#AIND-D09362（ابن الغرابيلي、فيمن جده محمد بن محمد بن مسلم）は父が محمد で別人。初版の grandfather relation（#NEEDID）・name_only・nisbah は REF のため除去。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・ムスリム・アル＝バーリスィー。祖父がムハンマド・ブン・ムハンマド・ブン・ムスリムである者たち（の部）で既述。
  en: Muḥammad b. ʿAlī b. Muḥammad b. Muslim al-Bālisī. Already mentioned among those whose grandfather is Muḥammad b. Muḥammad b. Muslim.
