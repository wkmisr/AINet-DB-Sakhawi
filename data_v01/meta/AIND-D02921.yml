translation:
  ja: ハリル・ブン・ヤアクーブ・ブン・イブラーヒーム、商人。アブー・バクルの兄弟の義兄弟（サハル）であり、前に言及されたアフマドの父。人付き合いを避け、自身の生計と仕事に専念し、いくらかの余裕はあったがつつましく暮らした。ヒジュラ暦871年に死去。アッラーが彼を赦されますように。
  en: Khalīl b. Yaʿqūb b. Ibrāhīm, the merchant. He was the brother-in-law of the brother of Abū Bakr, and the father of the aforementioned Aḥmad. He kept away from people, focusing on his livelihood and affairs, frugal yet with some comfortable means. He died in the year 871 AH, may Allah forgive him.
