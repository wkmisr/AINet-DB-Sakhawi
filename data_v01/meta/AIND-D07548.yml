translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・ダーウード、サラーフ・アッ＝ディーン・イブン・アル＝クワイズ。その父と祖父は前述。クルアーンと『ミンハージュ』を暗記し、我らがシャイフ（イブン・ハジャル）を含む一団の人々に提示して、彼から聴聞したが、その後（学問を）やめた。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Dāwūd, Ṣalāḥ al-Dīn b. al-Kuwayz. His father and grandfather have been mentioned above. He was among those who memorised the Qurʾān and al-Minhāj; he presented them to a number of scholars, among them our shaykh (Ibn Ḥajar), and heard from him, but then gave up (his studies).
