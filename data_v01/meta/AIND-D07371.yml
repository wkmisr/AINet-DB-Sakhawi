translation:
  ja: ムハンマド・ブン・アビー・アル＝ハイル・ブン・ムハンマド・ブン・ウマル、ダマンフール出身、マッカの人、絹商（アル＝ハリーリー）。彼の父は後述。イブン・アビー・アル＝ハイル・アッ＝ダマンフーリーとして知られる。礼拝時刻計算学（ミーカート）に励み、その分野で頭角を現した。
  en: Muḥammad b. Abī al-Khayr b. Muḥammad b. ʿUmar, of Damanhūr by origin, al-Makkī, al-Ḥarīrī (the silk-merchant). His father is mentioned below. He was known as Ibn Abī al-Khayr al-Damanhūrī. He occupied himself with timekeeping (mīqāt) and distinguished himself in it.
