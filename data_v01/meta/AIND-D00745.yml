notes:
- text: 本文の「أخو القاضي شرف الدين قاسم والشاهد بسوق صاروجا」は、兄弟を2人（カーシムと「サールージャー市場の証人」）と読みうるが、ここでは1人と解した。すなわち「シャラフ・アッディーン・カーシム（AIND-D06217）＝サールージャー市場の証人」であり、والشاهد は قاسم の同格修飾。根拠は D06217 本文で、彼が裁判官（قضاء حمص ほか）でありながら証人職（الشهادة، الجلوس مع الشهود）を続けたと明記されること。したがって兄弟は1名（قاسم = AIND-D06217）。
  lang: ja
  type: editorial
- text: 'The phrase "akhū al-qāḍī Sharaf al-Dīn Qāsim wa-l-shāhid bi-sūq Ṣārūjā" could be parsed as two brothers (Qāsim and a separate "notary of the Ṣārūjā market"), but it is here read as one person: Sharaf al-Dīn Qāsim (AIND-D06217), who was himself the notary of the Ṣārūjā market — "wa-l-shāhid" being in apposition to Qāsim. This is confirmed by D06217''s own entry, which states that he held judgeships (incl. Ḥimṣ) yet continued to serve as a court notary (al-shahāda; sitting with the notaries). Hence a single brother, Qāsim (AIND-D06217).'
  lang: en
  type: editorial
- text: 本人項（D00745）は父名を「سعيد」と綴るが、兄弟カーシムの項（AIND-D06217）は「سعد بن محمد」と綴る。兄弟である以上、父は同一人物であり、両綴りは異伝（سعيد ↔ سعد の混同）。いずれが本来の形かは未確定。
  lang: ja
  type: textual
translation:
  ja: アフマド・ブン・サイード・ブン・アフマド・アッ＝サンマーキー・アル＝ヒスバーニー。カーディー・シャラフ・アッ＝ディーン・カースィムの兄弟であり、スーク・サーイーリーの証人を務めた。ジュマーダー・アル＝ウーラー812年に70歳でダマスクスで亡くなった。我らがシャイフ（イブン・ハジャル）は自身の『インバーア』で彼に言及した。
  en: Aḥmad b. Saʿīd b. Aḥmad al-Sammāqī al-Ḥisbānī. Brother of al-Qāḍī Sharaf al-Dīn Qāsim and a witness (shāhid) in Sūq Sārūjā. He died in Jumādā al-Ūlā 812 AH at the age of seventy in Damascus. Our shaykh (Ibn Ḥajar) mentioned him in his *Inbāʾ*.
