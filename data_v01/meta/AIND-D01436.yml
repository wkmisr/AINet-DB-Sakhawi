translation:
  ja: アフマド・ブン・ムハンマド・ブン・アリー、アッ＝シハーブ・ブン・アッ＝シャムス・アル＝アーキル。その父アル＝ムワッキウは後述（別項）。彼はサイフ・アッ＝ディーン・ブン・アル＝ハウンダールに諸学を、次いでムッラー・アリー・アル＝キルマーニーに、さらにアル＝ハティーブ・アル＝ワズィーリーに学んだ。そして私（サハーウィー）にアッ＝サルガトマシーヤ学院で師事し、そこで私の前で『アルフィーヤ・アルハディースの注釈』を朗読した。優れた理解力、上品な身なり、温和な交際を兼ね備えていたが、言い訳の多い人物であった。アッラーが彼を癒されんことを。
  en: Aḥmad b. Muḥammad b. ʿAlī, al-Shihāb b. al-Shams al-ʿĀqil. His father, al-Muwaqqiʿ, is mentioned later (separately entered). He acquired various subjects (funūn) from Sayf al-Dīn b. al-Khawndār, then from Mullā ʿAlī al-Kirmānī, then from al-Khaṭīb al-Wazīrī. He kept close company with me (al-Sakhāwī) at al-Ṣarghitmashiyya, where he read to me the Sharḥ Alfiyyat al-Ḥadīth. He combined excellent understanding, an elegant appearance, and an agreeable manner, though he was much given to making excuses. May God restore his health.
