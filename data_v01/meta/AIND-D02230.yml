translation:
  ja: バイバルス・ブン・アフマド・ブン・バカル。下エジプト（ワジュフ・バフリー）のシャルキーヤ地方におけるアラブ遊牧民（ウルバーン）の長（シャイフ）で、少し前に言及したバカルの父方の叔父。866年ムハッラム月末日に、70歳近くで死去した。顔立ちが良く、背が高く、威厳があり、気前よく、信仰篤く、教養と謙遜に富み、同輩のうちでは稀有の人物であった。アッラーよ彼を憐れみたまえ。
  en: Baybars b. Aḥmad b. Baqar, shaykh of the Bedouin (ʿurbān) of al-Sharqiyya in Lower Egypt, and paternal uncle of Baqar, who was mentioned shortly before. He died on the last day of Muḥarram 866, at nearly seventy years of age. He was handsome, tall, dignified, generous, and religious, full of refinement and humility — a rarity among his kind. May God have mercy on him.
