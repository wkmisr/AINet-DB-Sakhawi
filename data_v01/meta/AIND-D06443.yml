  note:
    ja: '規則3 (c'')。父 جار الله は裸名で本項に識別要素なし → #NEEDID。サハーウィーの推定句「لعله ابن مبارك السقطي」（下の editorial note）が正しければ父は「جار الله بن مبارك السقطي」となるが、corpus に「مبارك السقطي」の見出し・本文はなく（全文 grep 該当は本項のみ）、ナサブが合う #AIND-D02338「جار الله بن مبارك الصفدي القائد . سمع علي ابن سلامة والتقي بن فهد في سنة سبع وثلاثين . مات في المحرم سنة أربعين بمكة . أرخه ابن فهد」はニスバが الصفدي で السقطي と合わない（ص/س・ف/ق・د/ط）＝候補に留め同定しない（規則25・26・57）。'
notes:
- text: '「لعله ابن مبارك السقطي」は、見出しに記されていない祖父名の推定（「おそらく［父 جار الله は］مبارك السقطي の子であろう」）。Waka 裁定 2026-09-18 §Da-1（#AIND-D04421「عبد الله بن إسماعيل . لعله إبراهيم」）が本項を同型として明示的に挙げている＝刊本の配列は祖父名順で、本項は مبارك بن أحمد ×3 の後・مبارك بن عبد الكريم の前に置かれ、祖父名 مبارك… として整合する。先例どおり persName type="full" は見出し形のまま維持し、推定の祖父 مبارك السقطي は relation にせず本注に留める（初版が立てた nisbah「السقطي」（TMP-N-00985）・shuhrah「مبارك السقطي」・full「مبارك بن جار الله السقطي」は本項主自身の属性ではないので除去）。候補 #AIND-D02338 جار الله بن مبارك الصفدي（840没、マッカ）については father relation の note 参照。'
