translation:
  ja: アブドゥルワッハーブ・ブン・アブドゥッラー・ブン・ジャマール・ブン・ガナーイム・ブン・サリーム、アル＝バトナーウィー・アッ＝ディマシュキー、イブン・アル＝ジャマールとして知られる。785年より後に生まれた。アブー・フライラ・ブン・アッ＝ザハビーの後ろで礼拝したと語ったが、彼からの聴聞もイジャーザも覚えていない。（8）59年には存命であり、アル＝ビカーイーは彼が（アブー・フライラから）聴聞したと考えてイジャーザを求めたが、私（サハーウィー）はそれを好まなかった。
  en: ʿAbd al-Wahhāb b. ʿAbd Allāh b. Jamāl b. Ghanāyim b. Salīm, al-Baṭnāwī al-Dimashqī, known as Ibn al-Jamāl. He was born after 785. He reported that he had prayed behind Abū Hurayra b. al-Dhahabī, but did not recall any audition (samāʿ) or ijāza from him. He was still alive in (8)59, and al-Biqāʿī sought an ijāza from him, supposing that he had heard (from Abū Hurayra), which I (al-Sakhāwī) did not approve of.
