translation:
  ja: ムハンマド・ブン・アブドゥッラー・アッ＝トゥルクマーニー・アル＝クバイバーティー・アッ＝ディマシュキー、アル＝カウワースとして知られる。敬虔・禁欲・篤信のシャイフで、ダマスクス郊外のムサッラーの西にザーウィヤを持ち、そこに住んでいた。彼には仲間と弟子たちがおり、ウマイヤ・モスクで大規模なズィクルの会を持ち、人々の参詣の対象であった。アブー・バクル・アル＝マウスィリーやその他の大人物たちに長年同伴した者の一人であった。アッ＝タキー・ブン・カーディー・シュフバは言う、「彼は学識によってではなく敬虔さによって、夢の解釈に秀でていた」。846年ズー・アル＝カアダ月6日金曜の夜、伝えられるところでは100歳余で自分のザーウィヤにおいて没した。彼に老衰の徴は現れなかった。神が彼を慈しまれんことを。
  en: 'Muḥammad b. ʿAbd Allāh al-Turkumānī al-Qubaybātī al-Dimashqī, known as al-Qawwās. A righteous, ascetic and devout shaykh who had a zāwiya west of al-Muṣallā outside Damascus, where he resided. He had companions and disciples, and a great dhikr circle at the Umayyad Mosque, and he was sought out for visitation. He was among those who kept company with Abū Bakr al-Mawṣilī for a long time, and with other great men. Al-Taqī b. Qāḍī Shuhba said: "He was skilled in the interpretation of dreams, through piety rather than learning." He died at his zāwiya, aged over a hundred as was said, on the eve of Friday 6 Dhū al-Qaʿda [8]46, and no senility had appeared in him. May God have mercy on him.'
