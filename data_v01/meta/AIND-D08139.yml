  note:
    ja: '「السكري أبوه」＝السكري（砂糖商）は父の通称・職（先例 D02583「الوقاد أبوه」型）。父自身に職の識別要素があり祖父名（علي）まで判明 → 新規 TMP-P-001664（規則3・12）。corpus に本伝なし（hw.py「السكري」「علي بن علي」）、ID-Master の Person に該当なし（ناصر الدين السكري TMP-P-001263 はダマスクスの法学者＝別人）。初版の #NEEDID を置換。【集約 2026-11-03】兄弟とみられる項がある: #AIND-D01034「أحمد بن علي بن خيل الشهاب القاهري أحد صوفية سعيد السعداء ويعرف بابن السكري حرفة أبيه . … وقد حج وتردد إلي」と、その索引 #AIND-D12401「ابن السكري وشهاب الدين أحمد بن علي بن علي بن خليل أحد الطلبة」から、D01034 の父は「علي بن علي بن خليل」で職は السكري（حرفة أبيه）。本項の父「علي بن علي … السكري」とナサブ2代（علي بن علي）と職 السكري の2点で閉合し（規則57）、両人ともサハーウィーのもとに通った同時代人＝同じ父とみる。祖父の父は خليل（D12401）。父の本伝はないので TMP-P-001664 を維持。父が #NEEDID でない（TMP-P）ので兄弟 relation は立てず共通の父で導出する（規則23）。repo #AIND-D01034 には father relation がなく（nisbah に父の属性 السكري）、同番号の付与は ★1（内容A M、オーケストレーター決定7）。'
