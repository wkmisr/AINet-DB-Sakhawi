translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン、ジャマール・アッ＝ディーン・イブン・ワジーフ・アッ＝ディーン、アル＝フサイニー・アル＝アラウィー・アル＝ヤマーニー。私（サハーウィー）の著作『アル＝カウル・アル＝バディーウ』を書写し、そのうちの一部を私に聴聞し、同様に私の他の著作や伝承したものからも〔聴聞した〕。さらに私から『アル＝ムサルサル』を聴聞した。私は彼のために書いてやった。〔八百〕九十年より前に旅立った。
  en: Muḥammad b. ʿAbd al-Raḥmān, Jamāl al-Dīn b. Wajīh al-Dīn, al-Ḥusaynī al-ʿAlawī al-Yamānī. He copied my work al-Qawl al-Badīʿ and heard a portion of it from me, and likewise [heard] from other works of my composition and my transmitted texts; indeed he heard al-Musalsal from me, and I wrote [something] for him. He departed before [the year 8]90.
