translation:
  ja: アブドゥッラフマーン・ブン・ルトフッラー。アッ＝シャムス・アル＝ムイードの娘の息子（外孫）。メッカにおけるハナフィー派のイマーム職を、母方の叔父であるアッ＝シハーブ・ブン・アル＝ムイードの代理として務めた。ヒジュラ暦853年ズー・アル＝ヒッジャ（巡礼月）に同地（メッカ）で没した。
  en: ʿAbd al-Raḥmān b. Luṭf Allāh, the grandson (daughter's son) of al-Shams al-Muʿīd. He deputized in the Hanafi imamate in Mecca on behalf of his maternal uncle al-Shihāb b. al-Muʿīd, and died there in Dhu al-Hijja, year 853 H.
