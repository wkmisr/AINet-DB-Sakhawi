    ja: '「قريب ناصر الدين بن غانم」。ID-Master に「ناصر الدين بن غانم」の Person 登録なし（idsearch「غانم」）→ 新規 TMP-P-001657（ناصر الدين بن غانم المقدسي）。候補: #AIND-D07832「محمد بن عبد الله بن محمد بن محمد بن غانم ناصر الدين بن الجمال بن ناصر الدين الغانمي … المقدسي الشافعي ابن شيخ الحرم」（827年生、サハーウィーと同世代）と、同家で同じ呼称になる祖父 ناصر الدين محمد بن محمد بن سليمان（#AIND-D04620 の父、本伝なし）。閉合はラカブ ناصر الدين と家名 غانم のみで2人を区別できず、corpus の「ناصر الدين بن غانم」は本項と #AIND-D06818「أمه أخت لناصر الدين بن غانم المقدسي」の2例だけ＝固定呼称とも言えない（規則26 例外2 不適用）→ 同定せず仮番号（規則26・57）。【集約 2026-11-03】校閲時の #AIND-D07832 cert medium を差し替え（内容A M、オーケストレーター決定10）。候補は ★1 の候補一覧に。'
