translation:
  ja: ムハンマド・ブン・アリー・ブン・ハリール、アッ＝シャムス・アル＝マクディスィー、ハナフィー派。イブン・ガーニムとして知られ、ナースィル・アッ＝ディーン・ブン・ガーニムの親族。カイロに来て学問に励み、私（サハーウィー）から『アル＝ムサルサル・ビル＝アウワリーヤ』を聴聞した。
  en: Muḥammad b. ʿAlī b. Khalīl, al-Shams al-Maqdisī al-Ḥanafī, known as Ibn Ghānim, a relative of Nāṣir al-Dīn b. Ghānim. He came to Cairo, pursued his studies, and heard from me al-Musalsal bi-l-Awwaliyya.
