translation:
  ja: ヤシュバク・アル＝ムアイヤディー、〔ムアイヤド・〕アフマド・ブン・イーナールの〔マムルーク〕。その財務官（ハーズィンダール）であり、次いでアシュラフ・カーイトバーイの時代にアミールとなったが、数か月後の873年シャアバーン月15日木曜の夜に没した。
  en: Yashbak al-Muʾayyadī, mamluk of (al-Muʾayyad) Aḥmad b. Īnāl. He was his treasurer (khāzindār), then became an amir in the days of al-Ashraf Qāytbāy, and died months later on the night of Thursday, mid-Shaʿbān 873.
