translation:
  ja: アブドゥッラー・ブン・アブドゥッラー、アッ＝ダカーリー、アル＝マグリビー、のちにアル＝マダニー、アル＝マーリキー。同地（マディーナ）で読誦を教え、教授し、人々を益し、いくつかの訴訟で裁判代理を務めたが、学者たちに対して不遜であった。（八百）六年に没した。神が彼を赦したまわんことを。我らがシャイフ（イブン・ハジャル）が『インバー』の中でそう述べている。
  en: ʿAbd Allāh b. ʿAbd Allāh al-Dakārī al-Maghribī, then al-Madanī, al-Mālikī. He taught recitation there (in Medina), lectured and benefited others, and acted as deputy judge in some cases; but he was insolent toward the scholars. He died in the year six (806), may God pardon him. So says our shaykh (Ibn Ḥajar) in his Inbāʾ.
