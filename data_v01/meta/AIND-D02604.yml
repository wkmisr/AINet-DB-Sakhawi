translation:
  ja: ハサン・ブン・アリー・アル＝ジャマール・アル＝ハティーブ。アル＝ヒスン（ヒスン・カイファー）の最高判事ヌール・アッ＝ディーン・アル＝ヒスカフィーの息子。シャーフィイー派。彼の同郷人でエルサレムに居住したアブー・アル＝ルトフが、彼から論理学、韻律学、脚韻学などを学んだ。
  en: Ḥasan bin ʿAlī al-Jamāl al-Khaṭīb, son of the chief judge of the Fortress, Nūr al-Dīn al-Ḥiṣkafī al-Shāfiʿī. His compatriot, Abū al-Luṭf, who settled in Jerusalem, studied logic, prosody, rhyme, and other subjects under him.
