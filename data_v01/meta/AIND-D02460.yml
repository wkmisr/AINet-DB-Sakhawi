translation:
  ja: ジャウハル・シュラー・クトゥリー・アル＝ハバシー。ハーズィンダール（出納官）にしてザマーム（後宮監督官）。882年サファル月に死去し、葬礼の祈りが捧げられた後、カナフーシュ廟の近くの廟に埋葬された。後任にはフシュカダム・アル＝アフマディー・アッ＝ラーラー、シャード・アッ＝サワーキーが就いた。
  en: Jawhar Shurā Quṭlī al-Ḥabashī, al-khāzindār al-zimām. He died in Ṣafar 882 H. Funeral prayers were performed over him, and he was then buried in a turba near the turba of Kanafūsh. Khushqadam al-Aḥmadī al-Lālā, shād al-sawāqī, succeeded him.
