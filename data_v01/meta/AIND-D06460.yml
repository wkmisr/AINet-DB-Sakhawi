translation:
  ja: ムフリズ・ブン・マスウード・ブン・ムーサー・ブン・ズィヤード・ブン・イブラーヒーム、アッ＝シャリーフ・アブー・マフフーズ・アル＝ハサニー・アル＝マグリビー・アッ＝トゥーニスィー・アル＝マーリキー、アレクサンドリアに住み、イブン・アッ＝ラッファーとして知られる。導師、学者、ムフティー。アル＝ビカーイーが彼に言及し、795年にチュニスで生まれたと述べ、没年は（空欄）。
  en: Muḥriz b. Masʿūd b. Mūsā b. Ziyād b. Ibrāhīm, al-Sharīf Abū Maḥfūẓ al-Ḥasanī al-Maghribī al-Tūnisī al-Mālikī, resident of Alexandria, known as Ibn al-Raffā. An imam, scholar and muftī. Al-Biqāʿī mentioned him and said that he was born in the year 795 in Tunis, and that he died [year left blank].
