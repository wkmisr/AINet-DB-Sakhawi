notes:
- text: '転送見出し（原文末尾「يأتي فيمن لم يسم أبوه」による）。転送先は #AIND-D06025「عمر الكمال البلخي الحنفي نزيل القدس」（826年没、未受領）。D06025 本文に「وممن أخذ عنه الشمس بن عمر قاضي غزة وسمي والده يعقوب وغيره وسمى والده عبد الله」とあり、父名 يعقوب は弟子 الشمس بن عمر قاضي غزة の伝える呼称。同じ D06025 へ向く転送見出しに REF #AIND-D05888「عمر بن عبد الله البلخي . فيمن لم يسم أبوه」（父名 عبد الله、B106 で REF 化済み）がある。'
