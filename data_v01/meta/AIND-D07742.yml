translation:
  ja: ムハンマド。前項の人物の兄弟。ヒジュラ暦791年に生まれ、5歳のときに兄と共にアル＝ファルスィースィーから、兄が聴聞した『シーラ（預言者伝）』の部分を聴聞した。それ以上のことを私（サハーウィー）は知らない。
  en: Muḥammad, brother of the preceding. He was born in the year 791 and, in his fifth year, heard from al-Farsīsī, together with his brother, what the latter heard of the Sīra. I (al-Sakhāwī) know nothing more about him.
