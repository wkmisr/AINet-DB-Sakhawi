translation:
  ja: アブドゥルカーディル・ブン・アビー・アル＝ファドル・ムハンマド・ブン・アフマド・ブン・アビー・アル＝ファドル・ムハンマド・ブン・アフマド・ブン・アブドゥルアズィーズ・ブン・アル＝カースィム・ブン・アブドゥルラフマーン・アル＝クラシー・アル＝ハーシミー・アル＝ウカイリー・アル＝ヌワイリー・アル＝マッキー。彼の父の伝記は後述される。我らの同伴者イブン・ファハドは、ヌワイリー一族に関する著作において、彼のために白紙（空白）を残した。
  en: ʿAbd al-Qādir ibn Abī al-Faḍl Muḥammad ibn Aḥmad ibn Abī al-Faḍl Muḥammad ibn Aḥmad ibn ʿAbd al-ʿAzīz ibn al-Qāsim ibn ʿAbd al-Raḥmān al-Qurashī al-Hāshimī al-ʿUqaylī al-Nuwayrī al-Makkī. His father is mentioned below. Our companion Ibn Fahd left a blank space for him in his biographical dictionary of the Nuwayrīs.
