translation:
  ja: アフマド・ブン・アブドゥッラー・ブン・ウマル・ブン・アフマド・ブン・ムハンマド・ブン・ハサン・アル＝アジャミー。アル＝サルフィーとして知られる。マッカの定住者であった。ヒジュラ暦861年ラビーウ・アル＝アーヒルの11日金曜日にマッカで死去した。イブン・ファフドが彼の伝記を記録し、彼を「シャイフ」と評した。
  en: Aḥmad b. ʿAbd Allāh b. ʿUmar b. Aḥmad b. Muḥammad b. Ḥasan al-ʿAjamī, known as al-Ṣarfī, a resident of Mecca. He died there on Friday, the 11th of Rabīʿ al-Ākhir, in the year 861 H. Ibn Fahd recorded his biography and described him as "al-Shaykh".
