translation:
  ja: アブド・アッラフマーン・アッ＝ザイン・アッ＝シャルビーニー・アッ＝シャーフィイー。ドミヤートの居留者。そこに約3年間滞在して教鞭を執った。彼に学んだ（読誦した）者にはタキー・ブヌ・ワキール・アッ＝スルターンがおり、タキーは彼を『博学なるカーディー』と評した。
  en: Abd al-Rahman al-Zayn al-Sharbini al-Shafi'i, a resident of Damietta. He stayed there for about three years and taught. Among those who read under him was al-Taqi b. Wakil al-Sultan, who described him as 'the learned judge'.
