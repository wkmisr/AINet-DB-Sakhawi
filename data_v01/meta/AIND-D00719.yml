translation:
  ja: アフマド・ブン・ハリーl・アル＝スーフィー。医師の一人であり、現在存命の息子たちの父である。彼（アフマド）は今彼の息子がしているように、アル＝アクマル・モスクの門のそばの香料商の店に座っていた。私（サハーウィー）が彼について最後に知ったのは、（ヒジュラ暦）860年代の後であった。
  en: Aḥmad b. Khalīl al-Ṣūfī, one of the doctors and father of those currently alive. He used to sit at a perfumer's by the gate of al-Aqmar Mosque, as his son does now. My last knowledge of him was after the sixties (860s AH).
