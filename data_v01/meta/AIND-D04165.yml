translation:
  ja: アブドゥルカーディル・ブン・アビー・アル＝ファドル・ブン・ムーサー・ブン・アビー・アル＝ハウル、ムヒウッディーン・イブン・アル＝マジュド（その父、および兄弟のムハンマドの伝記は後述）。彼は、父と同様にアシュラーフ（預言者子孫）宗務局（ディーワーン・アル＝アシュラーフ）の管理職に就いた。さらに、飼料書記のサアド・アッディーンに代わって厩舎監督職（ナザル・アル＝イスハブル）を務めた。その後、ヤフヤー・ブン・アル＝バカリーに交替し、ヤフヤーは兵糧・宝物庫会計官（イスティーファー・アッ＝ザヒーラ）などの職と共にその地位を引き継いだ。
  en: ʿAbd al-Qādir b. Abī al-Faḍl b. Mūsā b. Abī al-Hawl, Muḥyī al-Dīn, known as Ibn al-Majd (whose father and brother Muḥammad are mentioned below). He was appointed to the administration of the Bureau of the Ashrāf (Dīwān al-Ashrāf), just like his father. Indeed, he also held the supervision of the stable (Naẓar al-Isṭabl) in place of Saʿd al-Dīn, the scribe of fodder. Later, he was replaced by Yaḥyā b. al-Baqarī, who took over that post along with the auditing of the provisions (Istīfāʾ al-Dhakhīra) and other offices.
