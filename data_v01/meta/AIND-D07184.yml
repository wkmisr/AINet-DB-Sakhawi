translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ラスラーン・ブン・ヌサイル・ブン・サーリフ、ナースィル・アッ＝ディーン・アル＝ブルキーニー・アル＝カーヒリー・アッ＝シャーフィイー、アッ＝スィラージュ・ウマルの甥（兄弟の子）で、ラスラーン、ジャアファル、アフマドの兄弟。我らの師（イブン・ハジャル）は『インバー』の彼の父の項で付随的に彼に言及し、「彼はラーフィイーの『ムハッラル』を暗記しており、しばらく署名書記を務めたのち裁判の代理を務めた」と述べた。
  en: Muḥammad b. Abī Bakr b. Raslān b. Nuṣayr b. Ṣāliḥ, Nāṣir al-Dīn al-Bulqīnī al-Qāhirī al-Shāfiʿī, the nephew (brother's son) of al-Sirāj ʿUmar and the brother of Raslān, Jaʿfar and Aḥmad. Our shaykh mentioned him incidentally in his Inbāʾ under his father, and said that he used to have al-Rāfiʿī's al-Muḥarrar by heart, and that he acted as deputy judge after having been a clerk of the tawqīʿ for a time.
