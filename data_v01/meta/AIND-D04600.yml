translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド、アッ＝サイイド・アル＝ジャラール・ブン・アル＝クトゥブ・ブン・アル＝ムヒッブ・ブン・アン＝ヌール、アル＝フサイニー・アル＝イージー。学問に励んで秀でた。父の叔父アッ＝サフィー・アブドゥッラフマーンの娘（父の従姉妹）ハリーマと結婚し、彼女との間にアーイダをもうけた。（8）60年頃、若くして彼女を残して没した。
  en: ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh b. Muḥammad, al-Sayyid al-Jalāl b. al-Quṭb b. al-Muḥibb b. al-Nūr, al-Ḥusaynī al-Ījī. He devoted himself to study and excelled. He married Ḥalīma, the daughter of his father's paternal uncle al-Ṣafī ʿAbd al-Raḥmān, and had by her a daughter, ʿĀʾida. He died, leaving her a widow, while still young, around the year (8)60.
