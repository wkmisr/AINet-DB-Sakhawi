translation:
  ja: ウマル・ブン・アリー・ブン・ウマル、アッ＝シラージュ、アル＝ムナーウィー、のちアル＝カーヒリー、ハナフィー派。アル＝ムナイティーニーとして知られる。サイフ・アッ＝ディーンに師事した者の一人で、マンスーリーヤにおいて彼のもとで『カッシャーフ』の朗読者を務めた。彼の母（本項主の母、あるいはサイフ・アッ＝ディーンの母）ほかから聴聞し、多く学んで優秀となり、カーディー代理を務めてクラビイーン地区のジャーニバキーヤ近くに着座した。いくつかの俸給ポストを得、アル＝ブルハーン・アル＝カラキーはアシュラフィーヤ（の職）を得た際、アズハルにおけるフシュカダムの教授職を彼に与えた。議論と歩行を好み、おおらかで、自らを卑しくし、身なりも風体もみすぼらしく、きわめて迂闊で、生来純朴であったため、（さまざまな）逸話が彼に帰せられている。893年ジュマーダー・アル＝ウーラー月に没した。神が彼を赦したまえ。
  en: 'ʿUmar b. ʿAlī b. ʿUmar, al-Sirāj, al-Munāwī then al-Qāhirī, the Ḥanafī, known as al-Munaytīnī. He was among those who studied closely with Sayf al-Dīn and acted as the reader of the Kashshāf before him at al-Manṣūriyya. He heard from his mother (or: from the mother of Sayf al-Dīn) and others, studied extensively and excelled, served as deputy judge and held his sessions near al-Jānibakiyya in al-Qurabiyyīn. He obtained some stipendiary posts, and al-Burhān al-Karakī, when he took over al-Ashrafiyya, gave him the Khushqadam teaching post at al-Azhar. He was much given to disputation and to walking about, easygoing, self-abasing, shabby in appearance and figure, exceedingly absent-minded and simple by nature, so that various anecdotes are attributed to him. He died in Jumādā al-Ūlā of the year 893; may God pardon him.'
