translation:
  ja: ムーサー・ブン・ウマル・ブン・ムーサー、アッ＝シャラフ、説教師（アル＝ハティーブ）。（8）25年に我らがシャイフ（イブン・ハジャル）の息子その他の者にイジャーザを与えた。アッ＝ザイン・リドワーンは、彼がカイロのアル＝カーミリーヤなどでアル＝イッズ・ブン・ジャマーアから『ブハーリー』の数回の講席を聴聞したと述べている。
  en: Mūsā b. ʿUmar b. Mūsā, al-Sharaf, the preacher (al-khaṭīb). He granted an ijāza to the son of our shaykh (Ibn Ḥajar) and others in the year (8)25. Al-Zayn Riḍwān mentioned that he had heard several sessions of (Ṣaḥīḥ) al-Bukhārī from al-ʿIzz b. Jamāʿa at al-Kāmiliyya and elsewhere in Cairo.
