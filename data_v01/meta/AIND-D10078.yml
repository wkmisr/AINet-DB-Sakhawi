    ja: '「وذكر الزين رضوان أنه سمع على العز بن جماعة مجالس من البخاري بالكاملية وغيرها من القاهرة」。العز بن جماعة は祖父 العز عبد العزيز（没767、TMP-P-001145）と孫 العز محمد（749–819、#AIND-D07198）の二人がいる（規則34）。本項主は 825 年にイブン・ハジャルの子へイジャーザを与えた高齢の伝承者で、カイロの الكاملية（ハディース学院）での『ブハーリー』聴聞という文脈は祖父に合うと判断し TMP-P-001145、cert medium（先例 D05963。§D158-4）。初版の TMP-P-000010（祖父と孫の混同番号、新規使用禁止）を置換。الكاملية＝wd:Q12241661（旧 Q25633535 はリダイレクト）。【集約 2026-11-05】規則60(e)（既登録 TMP-P に cert で寄せない）との関係を ★3 に回付。ID-Master TMP-P-001145 の Note は「マッカ・754年以前の聴聞・مناسك／تساعيات 関連は本番号、カイロ・معقولات・810年代は D07198」とし、本項の「بالكاملية وغيرها من القاهرة」はカイロの文脈。先例 D05963（cert medium で 001145）は本項主の 804 年没・790 年代の面会という年代の根拠があったが、本項にはない（825 年にイジャーザを与えたことのみ）。裁定まで校閲のまま。 / 裁定 2026-11-05 ★3 (c): #NEEDID。候補: TMP-P-001145（祖父 العز عبد العزيز بن جماعة、没767）／#AIND-D07198（孫 العز محمد بن أبي بكر بن جماعة、749–819）。ID-Master TMP-P-001145 の Note は「カイロ・معقولات・810年代は D07198」とし、本項の「بالكاملية وغيرها من القاهرة」はカイロの文脈。原文は裸の「العز بن جماعة」で年代の根拠もなく、どちらとも決められない。上の note の
