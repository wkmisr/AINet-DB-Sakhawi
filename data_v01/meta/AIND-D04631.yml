translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・ナスル、アル＝ガーリブ・ビッラー。アンダルスのグラナダの支配者で、アミール・アブー・アル＝ジュユーシュ・ナスル・ブン・アミール・アル＝ムスリミーン・アビー・アル＝ハッジャージュ・ブン・アビー・アル＝ワリード・イスマーイール・ブン・ナスルの孫。アル＝マクリーズィーは844年の出来事のなかで、同年ラジャブ月に彼の書簡が到来し、グラナダのムスリムがコルドバとセビリアの住民であるキリスト教徒から被っている苦難を述べて救援を求めていた、と記している。
  en: ʿAbd Allāh b. Muḥammad b. Naṣr, al-Ghālib bi-llāh, the ruler of Granada in al-Andalus and grandson of the Amīr Abū al-Juyūsh Naṣr b. Amīr al-Muslimīn Abī al-Ḥajjāj b. Abī al-Walīd Ismāʿīl b. Naṣr. Al-Maqrīzī mentioned in the events of the year 844 that in Rajab of that year his letter arrived, describing the hardship the Muslims in Granada were suffering from the Christians of Cordoba and Seville, and requesting aid.
