translation:
  ja: アブドゥッラー・ブン・ウマル・ブン・アブドゥルアズィーズ・ブン・アリー・ブン・アフマド・ブン・アブドゥルアズィーズ・アル＝ハーシミー・アル＝ウカイリー、ヌワイラ出身のマッカの人、マーリク派。父の伝記は後述される。同地（マッカ）で生まれ、母は父の女奴隷ガザール・アル＝ハバシーヤである。クルアーンを暗記し、それを（唱えて）礼拝を導いた。イブン・アル＝ジャザリーやアル＝ビルマーウィーらから聴聞した。ヒジュラ暦832年に父とともにカイロに入り、次いでマグリブ、さらにタクルールへ赴き、二人はそこで836年より前に没した。
  en: ʿAbd Allāh b. ʿUmar b. ʿAbd al-ʿAzīz b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz al-Hāshimī al-ʿUqaylī, of Nuwayrī origin, al-Makkī, the Mālikī; his father's biography is forthcoming. He was born there (in Mecca); his mother was Ghazāl al-Ḥabashiyya, his father's slave-girl. He memorized the Qurʾān and led the prayers with it, and heard from Ibn al-Jazarī, al-Birmāwī and others. In the year 832 AH he entered Cairo with his father, then the Maghrib, then al-Takrūr, and the two of them died there before the year 836 AH.
