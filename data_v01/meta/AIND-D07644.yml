translation:
  ja: ムハンマド・ブン・アブドゥッラヒーム・アル＝フサイニー・アル＝クトゥビー、ザーヒリーヤ・バルクーク廟のファッラーシュ（敷物係）。アル＝ジャマール・アブドゥッラー・アル＝ハンバリーに聴聞した。アッ＝ザイン・リドワーンは、伝承を受けるべき者たちの中に彼の名を記し、彼はクトゥビーイーン（書籍商街）にいると述べた。我々は彼を見ていないので、〔八百〕五十年より前に没したものと思われる。
  en: Muḥammad b. ʿAbd al-Raḥīm al-Ḥusaynī al-Kutubī, the farrāsh (attendant) at the Ẓāhiriyya mausoleum of Barqūq. He heard from al-Jamāl ʿAbd Allāh al-Ḥanbalī. Al-Zayn Riḍwān recorded his name among those from whom [ḥadīth] may be taken, and said that he was in al-Kutubiyyīn (the booksellers' quarter). We did not see him, so it seems that he died before [the year 8]50.
