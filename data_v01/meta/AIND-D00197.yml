translation:
  ja: イブラーヒーム・ブン・アリー・ブン・ムハンマド・ブン・ヒラール・アッ＝ラバアィー・アル＝マグレビー・アッ＝トゥーニスィー・アル＝マーリキー。マーリキー派のカーディーであるアブドゥルカーディル・アル＝マーリキー・アル＝マッキーは彼から法学とその諸原理を学び、彼ら二人の教授を許可された。それはおよそ830年のことであった。
  en: Ibrāhīm b. ʿAlī b. Muḥammad b. Hilāl al-Rabaʿī al-Maghribī al-Tūnisī al-Mālikī. Al-Qāḍī ʿAbd al-Qādir al-Mālikī al-Makkī learned from him fiqh and its principles in Mecca, and was authorized by him to teach both, around the year 830 H.
