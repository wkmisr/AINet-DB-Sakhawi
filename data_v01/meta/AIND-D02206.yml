translation:
  ja: ベク・ブラート・アル＝アシュラフィー・イーナール。主人（イーナール）の死後にトリポリへ追放され、同地のアミール職を与えられていたが、872年のスワールの戦いで若くして戦死した。「ベク」とはアミールのことである。
  en: Bak Bulāṭ al-Ashrafī Īnāl. After his master's death he was banished to Tripoli, holding an amirate there, until he was killed, still a young man, in the battle of Suwār in the year 872. "Bak" means "amir".
