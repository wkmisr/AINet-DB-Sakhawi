translation:
  ja: ハンタム・イブン・アッ＝サイイド・ムハンマド・イブン・バラカート・イブン・ハサン・イブン・アジュラーン・アル＝ハサニー・アッ＝マッキー。彼の祖父および父の祖父は（前述の章で）言及済みである。彼はアル＝ジャーザーニーとあだ名された。ヒジュラ暦888年ジュマーダー・アル＝ウーラー（第5月）に、10歳に満たないうちに死去した。アル＝ムアッラー墓地の先祖の墓の側に埋葬され、父は彼の早すぎる死を深く嘆いた。
  en: Ḥantam, son of al-Sayyid Muḥammad, son of Barakāt, son of Ḥasan, son of ʿAjlān, al-Ḥasanī al-Makkī. His grandfather and his father's grandfather were mentioned previously. He was nicknamed al-Jāzānī. He died in Jumādā al-Ūlā, 888 AH, before reaching the age of ten, and was buried in al-Muʿallā near his ancestors. His father grieved deeply over his loss.
