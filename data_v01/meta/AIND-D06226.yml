translation:
  ja: カースィム・ブン・ウバイド、アル＝カーヒリー、徴収人（ジャービー）。イブン・アル＝バーリドとして知られる。マンクータムリーヤ学院の向かいに建物を建て、ティーラーン商館などの（賃料）徴収を行っていたが、好ましい人物ではなかった。875年ズー・アル＝ヒッジャ月に没し、息子のバドル・アッ＝ディーン・ムハンマドを遺した。息子は彼よりもよい人物である。
  en: Qāsim b. ʿUbayd al-Qāhirī, the rent-collector (al-jābī), known as Ibn al-Bārid. He built a place opposite al-Mankūtamuriyya and used to collect the rents of Qaysāriyyat Ṭaylān and other properties; he was not a satisfactory man. He died in Dhū al-Ḥijja 875 and left his son Badr al-Dīn Muḥammad, who is better than him.
