translation:
  ja: 968. イスマーイール・ブン・アル＝アジャミー。彼の都市、堅牢なイスマーイール派の要塞の一つであるカフフ城のイスマーイール派のアミール（領主）。タラーブルスから軍隊が彼のもとに来襲し、城を破壊した。843年、彼はタラーブルスでのアミール職を与えられた。
  en: 968. Ismāʿīl b. al-ʿAjamī, the amir of the Ismāʿīlīs in Qalʿat al-Kahf, its city, one of the impregnable Ismāʿīlī fortresses. Troops from Tripoli came against him and destroyed the fortress. In the year 843 AH, he was granted an amirate in Tripoli.
