translation:
  ja: アフマド・ブン・スライマーン・ブン・イーサー・アル＝バドマーシー、後にアル＝カーヒリーでハナフィー派。大通りのアル＝イーナーリーヤ学院の滞在者であり、そのイマームを務めた。ハーディル市場のシャイフである、後に述べるハーンバリー派アル＝バスティーのアル＝タキー・ムハンマドの父。クルアーンの知識者であった尊敬されるシャイフで、良い評判で記憶されている。盲目となった後に亡くなった。
  en: Aḥmad b. Sulaymān b. ʿĪsā al-Badmāṣī, then al-Qāhirī, al-Ḥanafī, resident and imām of al-Īnālīya on the street (al-Shāriʿ). He was the father of al-Taqī Muḥammad al-Ḥanbalī al-Basṭī, shaykh of Sūq al-Fāḍil (forthcoming). He was a respected shaykh among the people of the Qur'an and is remembered favorably. He died after becoming blind.
