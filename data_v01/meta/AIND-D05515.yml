translation:
  ja: アリー・ブン・ムハンマド・ブン・アリー・アル＝ミッズィー・アッ＝ディマシュキー、イブン・ジャドヤーとして知られる。850年にイブラーヒーム・アル＝アジュルーニーが私（サハーウィー）のために彼からイジャーザを求め、彼を「イブン・ウマイラに常に付き従っていた」と紹介した。また彼については、光塔でアザーンを唱えるとジャウラーン（ゴラン）から聞こえ、衰えてアル＝マルジャーニー・モスクの門の井戸のところでアザーンを唱えるようになると、マクスーラから聞こえた、と語り伝えられていたという。彼はイブン・ウマイラが自分にイジャーザを与えたと言ったが、神がもっともよく知りたまう。
  en: ʿAlī b. Muḥammad b. ʿAlī al-Mizzī al-Dimashqī, known as Ibn Jadyā. Ibrāhīm al-ʿAjlūnī obtained an ijāza from him on my behalf in the year 850 and described him as one who constantly attended Ibn Umayla; it used to be related of him that when he gave the call to prayer from the minaret it could be heard from the Jawlān (Golan), and when he grew weak and began giving the call at the well by the gate of the Marjānī Mosque, it could be heard from the maqṣūra. He claimed that Ibn Umayla had granted him an ijāza—and God knows best.
