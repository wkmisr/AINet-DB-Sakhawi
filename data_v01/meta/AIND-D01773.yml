translation:
  ja: アハマド、ラカブは「アッ＝シハーブ」、ニスバはアン＝ナシャルティー、アル＝ムクリウ。「アル＝ハイスーブ（計算に長けた者）」とも称された。アル＝ムヒッブ・ブン・アル＝イマーム（アル＝マハッリー）が、マハッラにおいて彼（アハマド）に対し、アブー・アムルの読誦法によってクルアーンを朗誦した。すなわちアル＝ムヒッブはアハマドを師として学んだ。
  en: Aḥmad, known by the laqab al-Shihāb, with the nisbas al-Nishartī and al-Muqriʾī, and the epithet al-Ḥaysūb (the arithmetician). Al-Muḥibb b. al-Imām (al-Maḥallī) recited the Qurʾān to him according to the reading of Abū ʿAmr in al-Maḥalla — i.e., al-Muḥibb studied the recitation under him (Aḥmad, the teacher).
