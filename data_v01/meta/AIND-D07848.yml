translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ナシャーバ・アル＝アシュアリー・アル＝ハラディー（二つの無点字［ḥ・r］にファトハ、有点字［ḍ］）、さらにアル＝アリーシー（無点字［ʿ］にファトハ、次にカスラ、有点字のシーン）。ハラズ管区の、アリーシュと呼ばれる村にちなむニスバである。ハラズはヒジャーズ側から見たイエメンの最端にあり、ハラズとハリーの間には砂漠がある。シャーフィイー派の法学者。前出のアブド・アッ＝ラフマーンの父。アル＝アフダルが『アル＝ジャナディーの歴史への補遺』で彼に言及し、その没年を（8）02年またはその翌年と記録した。我らがシャイフ（イブン・ハジャル）が『インバー』でそう述べている。
  en: Muḥammad b. ʿAbd Allāh b. Nashāba al-Ashʿarī al-Ḥaraḍī (with fatḥa on the two undotted letters and a dotted [ḍ]), then al-ʿArīshī (with fatḥa on the undotted letter, then kasra, and a dotted shīn), the nisba referring to a village called ʿArīsh in the district of Ḥaraḍ; Ḥaraḍ lies at the far end of Yemen on the side of the Hijaz, with a desert between it and Ḥalī. The Shāfiʿī jurist, father of the aforementioned ʿAbd al-Raḥmān. Al-Ahdal mentioned him in his continuation of the history of al-Janadī and recorded his death in the year [8]02 or the following year. Our shaykh (Ibn Ḥajar) said so in his Inbāʾ.
