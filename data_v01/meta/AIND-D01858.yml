translation:
  ja: アラカマス・アル＝ジャームース・アル＝ヤシュバキー。アル＝ヤシュバク・アル＝シャアバーニーに由来するニスバを持つ。アル＝ザーヒル・ジャクマクの治世において十人隊長の一人であった。863年ラビーウ・アル＝サーニー末にカイロで死去した際、高齢であった。
  en: Arqamās al-Jāmūs al-Yashbakī, whose nisbah is derived from Yashbak al-Shaʿbānī. He was one of the 'Asharāt (ten-officers) during the reign of al-Ẓāhir Jaqmaq. He died in Cairo at the end of Rabīʿ al-Thānī in the year 863, being of advanced age.
