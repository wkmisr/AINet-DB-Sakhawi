translation:
  ja: イスマーイール・ブン・アリー・ブン・アビー・バクル・ブン・アリー・ブン・ムハンマド・ブン・アビー・バクル・ブン・アブドゥッラー・イブン・ウマル・ブン・アブドゥッラフマーン・ブン・アブドゥッラー、シャラフ・アブー・アル＝フィダー・アル＝ナーシリー。 776年に生まれ、叔父に学び、父の集会に欠かさず出席し、祈祷書に注意を払った。タイズの一部のモスクの監督職を務め、農業で生計を立て、ハッジを行った。ラマダーン月844年に亡くなった。
  en: Ismāʿīl b. ʿAlī b. Abī Bakr b. ʿAlī b. Muḥammad b. Abī Bakr b. ʿAbd Allāh b. ʿUmar b. ʿAbd al-Raḥmān b. ʿAbd Allāh, al-Sharaf Abū al-Fidāʾ al-Nāshirī. He was born in 776 H. He acquired knowledge from his uncle, regularly attended his father's gatherings, and paid attention to books of supplications. He held the position of supervisor of some mosques in Taʿizz, earned a living through agriculture, and performed the Hajj. He died in Ramadan of 844 H.
