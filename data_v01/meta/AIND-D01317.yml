translation:
  ja: アハマド・ブン・ムハンマド・ブン・フサイン、アッ＝シハーブ・ブン・アッ＝シャムス・アル＝アウターリー・アル＝マクディシー・アッ＝シャーフィイー。彼の父親については後述する。彼はヒジュラ暦822年にバイト・アル＝マクディスで生まれ、学問に励んで傑出しており、クルアーン朗誦家、文人、詩人、散文家であり、諸学芸の達人であった。ヒジュラ暦874年ラジャブ月7日の水曜日に亡くなった。神が彼を憐れむよう。
  en: Aḥmad b. Muḥammad b. Ḥusayn al-Shihāb b. al-Shams al-Awtārī al-Maqdisī al-Shāfiʿī. His father is mentioned later. He was born in 822 AH in Bayt al-Maqdis, studied diligently and excelled, and was a reciter, man of letters, poet, prose writer, and master of various arts. He died on Wednesday, the 7th of Rajab, in 874 AH. May God have mercy on him.
