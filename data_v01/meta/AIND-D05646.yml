translation:
  ja: アリ・ブン・マハーリシュ・アッ＝ザイディー（マハーリシュはミームにダンマ、ハームにファトハ、最後はシィン）。勇猛さと武術で知られる高名な騎士であり、1人で100人に値するとされた。イエメンの支配権を握ったアブド・アル＝ワッハーブ・ブン・ターヒルによって、861年ラマダーン月の戦闘で殺害された。
  en: ʿAlī b. Makhārish al-Zaydī (Makhārish with damma on the mīm, fatha on the khāʾ, and ending in shīn). A famous knight renowned for his courage and horsemanship, counted as equivalent to a hundred men. He was killed by ʿAbd al-Wahhāb b. Ṭāhir, who obtained the kingdom of Yemen, in a battle in Ramaḍān of the year 861 AH.
