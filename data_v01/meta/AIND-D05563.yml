translation:
  ja: アリー・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・アル＝ファルヒー・アッ＝タジャーフィーフィー・アル＝マッキー。財をなし商取引に携わる者の一人。803年サファル月にアル＝マジュド・アッ＝ルガウィー（アル＝ファイルーザーバーディー）のもとでアル＝アラーイーの『ムサルサラート』第1部などを聴聞（フドゥール）した。864年ラジャブ月にマッカで没した。イブン・ファフドが彼に言及している。
  en: ʿAlī b. Muḥammad b. Muḥammad b. Muḥammad al-Farkhī al-Tajāfīfī al-Makkī, one of the wealthy men engaged in trade. In Ṣafar 803 he attended (the reading of) the first part of al-ʿAlāʾī's Musalsalāt and other works under al-Majd al-Lughawī (al-Fayrūzābādī). He died in Mecca in Rajab 864. Ibn Fahd mentioned him.
