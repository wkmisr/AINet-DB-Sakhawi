translation:
  ja: カーンスーフ・アル＝アシュラフィー・カーイトバーイ、彼（カーイトバーイ）の親族で、アッ＝シャーミーとして知られる。昇進して市場監督職（ムアッリミーヤト・アル＝アスワーク）に就き、次いでムカッダムの一人となり、いくつかの遠征に出征した。
  en: Qānṣūh al-Ashrafī Qāytbāy, his (Qāytbāy's) relative, known as al-Shāmī. He rose to the muʿallimiyya of the markets, then became one of the muqaddams, and went out on some of the military expeditions.
