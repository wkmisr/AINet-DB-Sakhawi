    ja: '本項主と #AIND-D04954 は名（علي بن أحمد بن أبي بكر النور أبو الحسن）・ニスバ（المصري）・学派・師（الملوي）が一致する。さらに本項主の息子 #AIND-D07989 の子 #AIND-D03773「عبد الرحمن بن محمد بن علي بن أحمد بن أبي بكر المصري … حفيد النور الأدمي … ويعرف بابن الأدمي」はサハーウィー自身が本項主を「النور الأدمي」と呼んでおり、D04954 の息子 #AIND-D03683「عبد الرحمن بن علي بن أحمد بن أبي بكر … بن النور أبي الحسن الأدمي … ولد … بالبندقدارية」も本項の「نزيل البندقدارية」と一致する。サハーウィーは本項で「رفيقا للادمي」と別人扱いしている（情報源は息子）ため REF 化せず二重立項型として保持し、同一人物の可能性を possible_identity で記録（→ISSUES §D99-1）。Waka 裁定（2026-10-05、要判断_B99-103 ★1(a)）: 同一人物とみて cert high。原文の「رفيقا للادمي الماضي قريبا」は本項主自身を指すことになるため colleague relation（active=#AIND-D04954）は削除し、この note に記録する。D04954 の収録時に鏡像の possible_identity を置く。'
