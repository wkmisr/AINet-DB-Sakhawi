translation:
  ja: アリー・ブン・アフマド・ブン・アビー・バクル、アン＝ヌール、アブー・アル＝ハサン、アル＝ミスリー、シャーフィイー派。アル＝ブンドゥクダーリーヤの住人で、後述するムハンマドの父。先に述べたばかりのアル＝アダミーの同学としてアル＝マッラウィーに学んだ。敬虔と善行を兼ね備えた、学派における名士の一人であった。彼の息子が私（サハーウィー）にそう語った。
  en: ʿAlī b. Aḥmad b. Abī Bakr, al-Nūr Abū al-Ḥasan, al-Miṣrī, the Shāfiʿī. He was a resident of al-Bunduqdāriyya and the father of Muḥammad, who is mentioned below. He studied under al-Mallawī as a fellow student of al-Adamī, mentioned just above. He was one of the notables of the madhhab, together with piety and goodness. His son told me this.
