translation:
  ja: シャーヒーン・アル＝ハサニー・アッ＝タワーシー。アン＝ナースィル（・ファラジュ）の治世に立身し、人びとを率いて巡礼を行い、バイバルス・ハーンカーの管財職（ナザル）やその他の職に就いた。アル＝アイニーが彼について言及し、その没年を815年と記録している。
  en: Shāhīn al-Ḥasanī al-Ṭawāshī. He advanced during the reign of al-Nāṣir (Faraj), led the people on the pilgrimage, and held the trusteeship (naẓar) of the Baybarsiyya and other posts. Al-ʿAynī mentioned him and recorded his death in the year 815 AH.
