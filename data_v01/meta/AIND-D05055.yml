translation:
  ja: アリー・ブン・アフマド・アル＝ヤマニー。アブヤート・フサインの出身で、アル＝アズラクとあだ名された。法学（フィクフ）に並外れた関心を寄せ、それについて大著を編んだ。9年（809年）に没した。我らがシャイフ（イブン・ハジャル）がその著書『インバー・アル＝グムル』において彼の没年を記録している。おそらく、少し前に言及されたアッ＝サンアーニーとは別人であろう。
  en: ʿAlī b. Aḥmad al-Yamanī, from the people of Abyāt Ḥusayn, nicknamed al-Azraq. He was deeply devoted to fiqh (jurisprudence) and compiled a large book on it. He died in the year nine (809 AH). Our shaykh (Ibn Ḥajar) recorded his death in his Inbāʾ al-ghumr, and he is apparently not the same as al-Ṣanʿānī mentioned shortly before.
