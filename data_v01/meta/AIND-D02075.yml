translation:
  ja: アミール・ハージ。尊崇されるアブドゥッラフマーンの子、アブドゥルガニーの子、シャーキルの子、マージドの子。イスマーイールとも呼ばれるが、この名前でより有名である。彼の先祖はイブン・アル＝ジーアーンとして知られ、彼は兄弟の一人である。 彼は数回ハッジを行い、我らがシャイフ（イブン・ハジャル）を含む多くの人から聴聞した。彼は身が不自由になったのでダンミヤートに旅行し、多くの聖人を訪れた後、健康になって戻った。 彼は880年ラマダンに死去し、翌日葬儀の礼拝が執り行われ、彼らの墓地に埋葬された。
  en: Amīr Ḥājj b. al-Majd ʿAbd al-Raḥmān b. ʿAbd al-Ghanī b. Shākir b. Mājid. He was also called Ismāʿīl, but was more famous by this name. His family/predecessor was known as Ibn al-Jīʿān, and he was one of the brothers. He performed the Hajj multiple times and listened to a group of scholars, including our shaykh (Ibn Ḥajar), and others. He became crippled, so he traveled to Damietta and visited many righteous people, then returned recovered. He died in Ramaḍān 880 H. Funeral prayers were performed the following day, and he was buried in their family tomb.
