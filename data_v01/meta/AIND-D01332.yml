translation:
  ja: マスィーリーのアフマド・ブン・ムハンマド・ブン・サーリフは、敬虔な人物であり、マジズーブで、ミス・イブン・サルサル地区の居住者であり、アッ＝ハッシャーブとしても知られた。770年以前の生まれと推測される。アル＝ブルハーン・ブン・ウライバは彼（マスィーリー）の多くのカリスマと出来事を記憶しており、アル＝ビカーイーは彼の辞典でこれを記している。
  en: Aḥmad b. Muḥammad b. Ṣāliḥ al-Misīrī, a pious man (al-Rajul al-Ṣāliḥ), a Majdhūb (sufi ecstatic), resided in the district of Mīnyat Ibn Silsil and was known as al-Khashshāb. He was born before 770 H, as I (al-Sakhāwī) reckon. Al-Burhān b. ʿUlayba used to memorize many of his miracles (karāmāt) and events, and al-Biqāʿī attested this in his dictionary.
