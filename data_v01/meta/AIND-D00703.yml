translation:
  ja: アハマド・ブン・アビー・ハムー・ムーサー・ブン・アブドゥルワーヒド。このアブドゥルワーヒドは彼の大祖父で、アブー・アルアッバース・アルアブドゥルワーディー・アルティリムサーニー、中央マグリブとその周辺の君主であり、アルムウタスィムと称された人物である。彼（アハマド）は865年に亡くなった。彼については、我らがシャイフ（イブン・ハジャル）の『アンバー』の833年かその後の事件の記述に言及がある。ザイン・アブドゥルバーシトも彼について詳しく記述している。
  en: Ahmad b. Abī Ḥamū Mūsā b. ʿAbd al-Wāḥid. This ʿAbd al-Wāḥid is his paternal great-grandfather Abū al-ʿAbbās al-ʿAbd al-Wādī al-Tilimsānī, Sultan of the Central Maghrib and its environs, and titled al-Muʿtaṣim. He (Ahmad) died in the year 865. He is mentioned in the events of the year 833 or the year thereafter in *Anbāʾ* by our shaykh (Ibn Ḥajar al-ʿAsqalānī). Al-Zayn ʿAbd al-Bāsiṭ biographed him at length.
