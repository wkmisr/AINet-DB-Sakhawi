translation:
  ja: サーリム・ブン・ザーキル・ブン・ムハンマド・ブン・アブドゥルムウミン・ブン・ムハンマド・ブン・ザーキル・ブン・アブドゥルムウミン・ブン・アビルマアーリー・ブン・アビルハイル・ブン・ザーキル・アル＝カーザルーニー・アル＝マッキー。メッカのムアッズィン（礼拝告知者）であり、金細工師。ムハンマド、アリー、アブドゥルアズィーズの父。イマーム・アブー・アル＝ヤマン・アッ＝タバリーから、イブン・ブカイル伝『ムワッタア』の冒頭部分、およびアル＝アクファハスィーによる『アブー・ダーウードの（ハディース）選集40選』を聴聞した。没年は不詳である。
  en: Sālim bin Dhākir bin Muḥammad bin ʿAbd al-Muʾmin bin Muḥammad bin Dhākir bin ʿAbd al-Muʾmin bin Abī al-Maʿālī bin Abī al-Khayr bin Dhākir al-Kāzarūnī, of Mecca, the muezzin and goldsmith. He was the father of Muḥammad, ʿAlī, and ʿAbd al-ʿAzīz. He heard from al-Imām Abū al-Yaman al-Ṭabarī a portion of the beginning of the Muwaṭṭaʾ of Ibn Bukayr and the Forty Selected by al-Aqfahsī from Abū Dāwūd. The author (al-Sakhāwī) states he does not know when he died.
