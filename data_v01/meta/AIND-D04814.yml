translation:
  ja: ウバイドゥッラー・ブン・ユースフ・アッ＝タブリーズィー、カイロの寓居者。我らが師（イブン・ハジャル）から学んだ者の一人で、アル＝イッズ・アブドゥッサラーム・アル＝バグダーディーの同学であった。我らが師は彼を「イマーム、大学者、当代無比の人、精査者、諸学に通じた人、ブルハーン・アッ＝ディーン・ブン・アル＝イマーム・イッズ・アッ＝ディーン」と形容した。
  en: ʿUbayd Allāh b. Yūsuf al-Tabrīzī, resident of Cairo. He was among those who studied under our shaykh (Ibn Ḥajar), as a fellow student of al-ʿIzz ʿAbd al-Salām al-Baghdādī. Our shaykh described him as "the imām, the most learned, the unique, the verifier, the master of many disciplines, Burhān al-Dīn, son of the imām ʿIzz al-Dīn".
