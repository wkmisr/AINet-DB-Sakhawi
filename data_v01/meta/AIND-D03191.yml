translation:
  ja: スンクル・ブン・ワビール・ブン・ヌフバール、アル＝フサイニー、ヤンブウのアミール。（8）55年、兄弟ハルマーンの後を受けてその（ヤンブウの）アミール職に就き、その治績は称えられた。彼（の死）を（8）52年とする者も見たので、前記の年代と照らして検証を要する。
  en: Sunqur b. Wabīr b. Nukhbār al-Ḥusaynī, amir of Yanbūʿ. He took charge of it in the year [8]55 after his brother Halmān, and his conduct was praised. I have seen someone who dated his [death] to the year [8]52, so it should be verified against the date mentioned.
