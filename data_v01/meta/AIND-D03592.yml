translation:
  ja: アブドゥルラフマーン・ブン・アフマド、ハマー出身（のちにカイロ在住）。公証（証言）においてアル＝サルムーニーらの同僚であり、能書家であったが、評判は良くなかった。私の兄弟（アブー・バクル・アル＝サハーウィー）に師事して『アル＝タクスィーム』の朗読を学び、また私のところにも出入りした。のちに遺産を相続し、その遺産を携えて海路で（マッカへ）向かい、897年シャウワール月に到着して、バーブ・アッ＝サラーム（のそば）に居を構えた。
  en: ʿAbd al-Raḥmān b. Aḥmad, of Ḥamāh origin, then of Cairo. He was a colleague of al-Salmūnī and others in notary services (shahāda); he had excellent calligraphy but was not well-regarded. He studied and kept close to my brother [Abū Bakr al-Sakhāwī] in reciting [the book] al-Taqsīm, and frequented me. Later he received an inheritance and traveled with it by sea, arriving in [Mecca] in Shawwāl of the year 897, where he sat at Bāb al-Salām.
