translation:
  ja: アブドゥルラフマーン・ブン・アフマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・イーサー・ブン・ムトイル・アル＝ハカミー・アル＝ヤマニー。アブー・アル＝カースィムらの兄弟。法学を修め、ハディースを聴聞した。ハッジ（巡礼）からの帰途、841年サファル月にアーズィブにおいて若くして没した。アル＝アフダルが伝える。
  en: ʿAbd al-Raḥmān b. Aḥmad b. Ibrāhīm b. Muḥammad b. ʿĪsā b. Muṭayr al-Ḥakamī al-Yamānī, brother of Abū al-Qāsim and others. He studied jurisprudence (fiqh) and heard Hadith. He died young at ʿĀzib on his return from the Hajj pilgrimage in Safar, 841 AH. Reported by al-Ahdal.
