  en: Sharʿān b. Aḥmad b. Ḥasan b. ʿAjlān, al-Sharīf al-Ḥasanī, whose son Shāriʿ was mentioned previously. He died in Mecca in Jumādā al-Ākhira in the year 863 AH, as dated by Ibn Fahd.
