translation:
  ja: アフマド・ブン・ムハンマド・ブン・サダカ、シャイフ。「アル＝シャハーブ」と称された。エジプト人、カーディリー教団員でシャーフィイー法学派。サラーヒーヤ・ハーンカーに属するスーフィーの一人。彼（アフマド）と共に『アル＝ウンダ』をアル＝ブルキーニー、イブン・アル＝ムラッキン、アル＝イラーキー、アル＝ダミーリーらに提示した記録用紙が見つかったが、その記録用紙には彼（アフマド）の名前の箇所に削り跡があり、その記録の可能性はあったものの、私（＝サハーウィー）はその情報を用いることを諦めた。しかし彼は『アル＝シャーティビーヤ』をアル＝シャラフ・ブン・アル＝クワイイク、アル＝ザラーティーティー、そして我らがシャイフ（＝サハーウィーの師匠）アル＝ザイン・リドワーンから聴聞した。そのため、我々はその書物に関するイジャーザを彼（アル＝ザイン・リドワーン）から受けた。彼は60歳くらいで亡くなった。
  en: Aḥmad b. Muḥammad b. Ṣadaqa, al-Shihāb al-Miṣrī al-Qādirī al-Shāfiʿī, one of the Sufis at al-Ṣalāḥīya and the Qādirī order. I (al-Sakhāwī) found with him papers regarding the presentation of al-ʿUmda to al-Bulqīnī, Ibn al-Mulaqqin, al-ʿIrāqī, al-Damīrī and others. There was an erasure in the place of his (Aḥmad's) name on these papers, so I disregarded them, despite their potential validity. However, he did hear al-Shāṭibiyya from al-Sharaf b. al-Kuwayk, al-Zarātītī, and our shaykh al-Zayn Riḍwān. Therefore, we sought ijāza from him (al-Zayn Riḍwān) for it. He died around the age of sixty.
