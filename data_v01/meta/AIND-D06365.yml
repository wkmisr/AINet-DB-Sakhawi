translation:
  ja: カラムターイ・アル＝イスハーキー・アル＝アシュラフィー・バルスバーイ、アル＝ジャマール・ユースフ・ブン・タグリー・ビルディーの姻戚で、十人隊アミールの一人。2度巡礼し、善人として語られる者であった。877年ムハッラム月10日水曜の夜に約70歳で没した。アッラーよ彼を憐れみたまえ。
  en: Qalamṭāy al-Isḥāqī al-Ashrafī Barsbāy, relative by marriage (ṣihr) of al-Jamāl Yūsuf b. Taghrī Birdī, and one of the amirs of ten. He performed the pilgrimage twice and was among those spoken of with approval. He died on the eve of Wednesday, 10 Muḥarram 877, aged about seventy. May God have mercy on him.
