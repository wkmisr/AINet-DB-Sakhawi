translation:
  ja: ファドル・アッラー、アッ＝タージュ・ブン・アッ＝ラムリー・アル＝キブティー。カイロで育ち、諸々の勤めを転々とした末に国庫監督職（ナザル・アッ＝ダウラ）に就き、しばらくこれを務めた。宰相職（ウィザーラ）を再三提示されたが受けず、（8）26年サファル月に80歳を超えて没するまで国庫監督職に留まった。アル＝マクリーズィーは「彼はコプト人のうちの圧制者・放埒者の一人であった」と言っている。
  en: 'Faḍl Allāh, al-Tāj b. al-Ramlī al-Qibṭī. He grew up in Cairo and moved from one service to another until he was appointed controller of the state treasury (naẓar al-dawla), which he exercised for a time. The vizierate was offered to him more than once, but he declined, and he remained in the naẓar al-dawla until he died in Ṣafar of the year [8]26, having passed eighty. Al-Maqrīzī said: he was one of the oppressive and dissolute Copts.'
