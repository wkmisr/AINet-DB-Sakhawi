    ja: 'corpus #AIND-D04803「عبد الوهاب التاج بن الرملي . ولد سنة أربعين أو قبلها بسنة وتنقل في الخدم إلى أن ولي نظر الدولة بالقاهرة … وقد أحضره المؤيد في سنة اثنتين وعشرين … فقال لي الآن اثنان أو ثلاث وثمانون سنة … مات وقد أسن وارتعش مفصولا في سنة ست وعشرين . ذكره شيخنا في إنبائه」（未収録）は、ラカブ التاج・通称 ابن الرملي・職 نظر الدولة・826年没・80歳超がすべて一致し、名のみ فضل الله⇄عبد الوهاب（コプト改宗者の改名）で異なる同一人物とみられる。双方に転送指示がないため二重立項型として両項とも実項のまま、possible_identity（§D127-2）。【集約 2026-10-19】cert を high→medium に下げた（内容B M）。相違点: D04803「فانفرد هذا إلى قبيل موته بدون السنة … مات وقد أسن وارتعش مفصولا」＝没前1年弱で離職し解任状態で没、本項「واستمر في نظر الدولة حتى مات」＝在職のまま没と矛盾。人物評も D04803「يحب أهل الخير ويكثر الصدقة」⇔本項 المقريزي「من ظلمة الأقباط وفساقهم」と正反対、名も فضل الله⇄عبد الوهاب。同一人物の公算は高いが断定の根拠はない。名寄せはしない（決定5）。D04803 側の鏡像は統合時。'
