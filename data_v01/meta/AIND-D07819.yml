translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー、アッ＝シャムス・アブー・ナスル・ブン・アル＝イッズ・ブン・アッ＝シャムス・アッ＝ラーリー・アッ＝シャーフィイー。感じのよい、理解力に優れた青年で、871年にマッカで私と会い、私に『スラースィヤート』を読誦した。彼は私に、自分の生年は849年ラマダーン月で、アヒーとして知られるアル＝ジャマールから諸学を学んだと語った。アミール・ニザームッディーン・アラーウルムルク・ブン・アル＝ムイーン・ジャーハーンシャーのためにリサーラを著し、その一部を私の面前で読んだ。また、彼が自作の次の詩を吟じるのも聴いた。 「われらはライラー以外のすべてを捨てた／そして昼も夜も彼女との逢瀬を求める」 彼は自分の地方の有力者の一人である。
  en: 'Muḥammad b. ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh, al-Shams Abū Naṣr b. al-ʿIzz b. al-Shams al-Lārī al-Shāfiʿī. A pleasant young man of good understanding; he met me in Mecca in the year [8]71 and read the Thulāthiyyāt before me. He told me that he was born in Ramaḍān 849 and that he had studied various disciplines under al-Jamāl known as Akhī. He composed a treatise written for the amir Niẓām al-Dīn ʿAlāʾ al-Mulk b. al-Muʿīn Jāhānshāh and read part of it in my presence; I also heard him recite his own verse: "We have left everything but Laylā / and I seek union with her day and night." He is one of the notables of his region.'
