translation:
  ja: ムーサー・ブン・ハサン・ブン・ウマル・ブン・イムラーン・アル＝マッキー。870年ラマダーン月に同地（マッカ）で没した。イブン・ファハドがその没年を記録している。彼は生業に従事する者（ムタサッビブ）で、カーディーのアル＝ブルハーニーに属し、彼（アル＝ブルハーニー）は彼を傷害の鑑別を（法廷に）報告する役に起用した。
  en: Mūsā b. Ḥasan b. ʿUmar b. ʿImrān al-Makkī. He died there (in Mecca) in Ramaḍān of the year 870. Ibn Fahd recorded his date (of death). He was a tradesman (mutasabbib) attached to al-Burhānī the judge, who put him forward for giving (court) notification on the assessment of wounds.
