translation:
  ja: ムハンマド・アッ＝サドル、彼（直前の項の人物）の兄弟。アフマドたち（の部）で既述した。あちらのほうが優れている（あるいは：あちら〔の名〕のほうが妥当である）。
  en: Muḥammad al-Ṣadr, his (the preceding one's) brother. He has already been mentioned among the Aḥmads, and that one is preferable (i.e. either that entry/name is the more correct, or that person is the more excellent).
