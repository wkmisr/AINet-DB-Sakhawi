notes:
- text: '転送見出し（原文「مضى في الأحمدين」による）。「أخوه」は直前の項 #AIND-D07696「محمد بن عبد القادر أو اسمعيل والأول أشبه بن ابراهيم محي الدين بن مجد الدين المكراني الأصل المكي」（未受領）の兄弟を指す。転送先は実項 #AIND-D00544a「أحمد بن إسماعيل بن إبراهيم الصدر أبو البركات بن المجد المكراني الشافعي نزيل مكة وأخو محمد الآتي … اضطرب في اسم أبيه فقال مرة هكذا ومرة عبد القادر … وكأن إسماعيل أصح」（ラカブ الصدر・クンヤ أبو البركات・المكراني が一致）。同人の転送見出し #AIND-D00864「أحمد بن عبد القادر بن إبراهيم الصدر أبو البركات بن المجد المكراني … مضى في ابن إسماعيل ورأيت بخط بعضهم تسميته محمدا كأخيه」（`$$$`）が、本人を「محمد」と記す例があることを伝える＝本見出しはその「محمد」名による索引。「وذاك أفضل」は「そちら（أحمد の名）のほうが妥当」の意と読む。 「وذاك أفضل」は二通りに読める: (a) あちら（アフマド部の項・名）のほうが妥当、(b) あちら（الصدر 本人＝D00544a）のほうが（直前項の兄弟 D07696 より）優れている。訳は留保して両読みを示す（集約 2026-10-26、内容A L-7）。'
  type: reference
