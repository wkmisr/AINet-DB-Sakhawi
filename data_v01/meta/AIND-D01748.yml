translation:
  ja: アフマド・アッ＝シハーブ・アル＝フジャイラーニー・アル＝ルゥルゥイー。その父はフジャイラー村のフトバ担当者（ハティーブ）であった。彼は学問の探求のうちに育ち、イブン・アル＝ハッバーブに（クルアーンを）学んだ。その後、シャイフ・アル＝マウスィリーに師事し、多くの書物を手に入れた。真珠の穴あけをして生計を立てていた。827年ムハッラム月、およそ60歳で故郷の村で死去した。我らがシャイフ（イブン・ハジャル）が『インバー・アル＝グムル』で言及している。
  en: Aḥmad al-Shihāb al-Ḥujayrānī al-Luʾluʾī. His father was the khaṭīb of Ḥujayrā village. He grew up in pursuit of knowledge, studying (qaraʾa) under Ibn al-Ḥabbāb, then kept the company of al-Shaykh al-Mawṣilī and acquired many books. He earned his living by drilling pearls. He died in his village in Muḥarram 827 H, at around sixty years of age. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ al-Ghumr.
