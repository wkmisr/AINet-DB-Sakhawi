translation:
  ja: バイラム・アッ＝トゥルキー。信仰を集めた（聖者と見なされた）人々（ムウタカドゥーン）の一人で、ハーキム・モスクに住していた。864年ジュマーダー・アッ＝サーニヤ月に死去し、ジャーニー・バク・アル＝マシャッド廟（トゥルバ）に埋葬された。アル＝ムニールが彼の没年を記録している。
  en: Bayram al-Turkī, one of those in whom people believed (al-muʿtaqadīn, i.e. popularly venerated men). He resided at the Mosque of al-Ḥākim. He died in Jumādā al-Thāniya 864 and was buried in the turba of Jānī Bak al-Mashadd. Al-Munīr recorded his death date.
