translation:
  ja: タナム・アル=アシュラフィー・カーイトバーイ。彼の師が彼を何度もジッダの副知事として派遣し、その後3年目には、彼にその職位の栄誉の衣装（خلعة）を与えた後、それを剥奪し、既出のバルド・ベクに着せた。
  en: Tanm al-Ashrafī Qāytbāy. His master sent him repeatedly as deputy of Jeddah. Then, in the third year, after vesting him with the robe of honor for it, he stripped it from him and vested it upon Bard Bek, the aforementioned.
