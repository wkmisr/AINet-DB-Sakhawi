translation:
  ja: アブドゥッラー・ブン・アブドゥッラヒーム・ブン・ムハンマド・ブン・アブドゥッラー・ブン・バクタムル・ブン・アル＝ハージブ。アブドゥッラフマーンとアリフの父方の兄弟で、彼の母はトルコ系のルーム人女性であった。ヒジュラ暦853年のペストで幼くして没し、同じくその日に彼の甥ムハンマド・ブン・アブドゥッラフマーン・ブン・アブドゥッラヒームも共に没した。またアブドゥッラフマーンは、父アブドゥッラヒームの死後2年に満たずして没した。
  en: ʿAbd Allāh b. ʿAbd al-Raḥīm b. Muḥammad b. ʿAbd Allāh b. Baktamur b. al-Ḥājib. He was the paternal brother of ʿAbd al-Raḥmān and Alif, and his mother was a Turkish Rūmī woman. He died young of the plague in the year 853, and likewise his nephew Muḥammad b. ʿAbd al-Raḥmān b. ʿAbd al-Raḥīm died with him on the same day. ʿAbd al-Raḥmān died less than two years after his father ʿAbd al-Raḥīm.
