translation:
  ja: アフマド・ブン・カースィム・ブン・マリク・ブン・アブドゥッラー・ブン・ガーニム、アッ＝シャリーフ・アル＝アラウィー・アル＝マッキー。彼はワーディー・マルにあるアッ＝ラウダに居住していた。841年ズー・アル＝ヒッジャ月にマッカで亡くなり、アル＝ムアッラーに葬られた。
  en: Aḥmad b. Qāsim b. Malik b. ʿAbd Allāh b. Ghānim al-Sharīf al-ʿAlawī al-Makkī. He was residing in al-Rawḍa in Wādī Marr. He died in Dhū al-Ḥijja 841 H in Makka and was buried in al-Muʿallā.
