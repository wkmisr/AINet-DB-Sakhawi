  en: Ḥusayn b. Nābit b. Ismāʿīl b. ʿAlī b. Muḥammad b. Dāwūd al-Zamzamī al-Makkī. His grandfather is mentioned previously, and his father is forthcoming. He died in Ṣafar, the year 882 AH, in Mecca.
