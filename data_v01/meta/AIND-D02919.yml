translation:
  ja: ハリール・ブン・ムハンマド・アル＝ジュンディー、アル＝ハートゥーニーヤのスーフィー（教団員）にしてクルアーン朗誦家。アル＝スミサースィーヤのマドラサの給仕であったアッ＝シャラフから七つの朗誦法を学んで伝承し、みずからも教え授けた。813年サファル月に死去。我らが師（イブン・ハジャル）がその著書『インバー・アル＝グムル』に彼の伝記を記録している。
  en: Khalil b. Muhammad al-Jundi, the Sufi at al-Khatuniyya and the Quran reciter. He studied and compiled the seven variant recitations under al-Sharaf, the servant of al-Sumaysatiyya, and taught them to others. He died in Safar, in the year 813 AH. Our shaykh (Ibn Hajar) recorded his biography in his chronicle, Inba' al-Ghumr.
