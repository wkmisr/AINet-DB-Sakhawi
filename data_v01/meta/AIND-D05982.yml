  en: ʿUmar b. Muḥammad b. Masʿūd al-Ghazzī, Ibn al-Maghribī, father of the two Muḥammads, the Ḥanafī qāḍī and his brother. He was a Mālikī by madhhab and a good man. He died after (8)40.
