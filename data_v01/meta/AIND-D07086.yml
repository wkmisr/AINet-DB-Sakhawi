    ja: '父 ＝ #AIND-D01852（أرغون شاه النوروزي نورز الحافظي … عمل استدارية أستاذه … ثم استقر في استادارية السلطان بدمشق حتى مات … سنة أربعين、840年没）。見出しの「أستاذ الظاهر جقمق بدمشق」は父の属性（Waka 裁定 2026-10-17 ★2、下記 editorial note）。初版は الظاهر جقمق（#AIND-D02423）を本項主の patron とし、honorific「أستاذ」と residence دمشق を本項主に付けていたため除去。見出しナサブによる同定（規則37）。'
