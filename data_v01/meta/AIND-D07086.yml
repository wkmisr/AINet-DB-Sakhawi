notes:
- text: '見出し「محمد بن أرغون شاه النوروزي أستاذ الظاهر جقمق بدمشق」の「أستاذ الظاهر جقمق بدمشق」は父 أرغون شاه（#AIND-D01852）の属性と読む（Waka 裁定 2026-10-17、要判断_B114-118 ★2）: 父はジャクマクがスルタンに即位（842）する前、アミール時代のジャクマクに仕える職（ウスターズ＝アスタードール）をダマスクスで務めていたと解釈し、「الظاهر」は追記的な尊称とみる。D01852 本文の「استادارية السلطان بدمشق … مات … سنة أربعين」（840年没）と矛盾しない。他人（父）の職なので本項主の state・patron relation は立てず、初版の patron #AIND-D02423・honorific・residence دمشق は除去のまま。集約時の「係り先未確定」の暫定処置を本裁定で置き換えた。'
