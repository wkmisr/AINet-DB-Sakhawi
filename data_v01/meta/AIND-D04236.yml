translation:
  ja: アブド・アル＝カーフィー・ブン・ムハンマド・ブン・ムハンマド・ブン・フサイン・アル＝マダニー・アッ＝サッカー（水運び）。イブン・クトゥブの名で知られる。797年に預言者モスクにてイブン・スィッディークより『サヒーハ』の一部を聴聞した。846年ズー・アル・ヒッジャ（12月）にマッカにて没した。イブン・ファハドが彼の没年を記録している。
  en: ʿAbd al-Kāfī bin Muḥammad bin Muḥammad bin Ḥusayn al-Madanī al-Saqqāʾ, known as Ibn Quṭb. He heard some of al-Ṣaḥīḥ from Ibn Ṣiddīq in the year 797 AH at the Prophet's Mosque. He died in Mecca in Dhu al-Hijja in the year 846 AH. His death was recorded by Ibn Fahd.
