notes:
- text: 「ويقال له سنبل الصغير للتمييز عن آخر أكبر منه」＝同名の年長者（سنبل الكبير）と区別するための呼称。年長の سنبل は corpus に見出しなし（hw.py「سنبل」該当は本項のみ）。#AIND-D06461「محسن الفتحي … ثم الأشرفي قايتباي الطواشي الحبشي . استقر به خازنا عوض سنبل」の前任 سنبل は本項主（الأشرفي の خازندار）の可能性があるが、2人の سنبل がいるので同定しない（ISSUES §D159-9）。初版の honorific「الطواشي」（nisbah と二重）を除去。
  lang: ja
translation:
  ja: スンブル・アル＝アシュラフィー、宦官（アッ＝タワーシー）。年長の同名者と区別して「小スンブル（スンブル・アッ＝サギール）」と呼ばれる。主人の財庫管理官（ハーズィンダール）で、重んじられ側近とされた者の一人であり、ハワンド（王妃）に仕えて巡礼した者の一人であった。その後、（主人は）何らかの理由で彼に怒り、彼をハウワーラ族のアラブのシャイフに引き渡した。彼はその後インド、サワーキン、そのほかアデンやホルムズなどに（渡った）。
  en: Sunbul al-Ashrafī the eunuch (al-ṭawāshī), called Sunbul al-Ṣaghīr (the Younger) to distinguish him from another, older [Sunbul]. He was the treasurer (khāzindār) of his master and one of the honoured intimates, one of those who performed the pilgrimage in the service of Khawand (the sultan's consort). Then [his master] became angry with him for certain reasons and handed him over to the shaykh of the Hawwāra Arabs, and afterwards he was in India, Suakin, and elsewhere, such as Aden and Hormuz [the verb in the printed text, "wa-sunidat", is unclear].
