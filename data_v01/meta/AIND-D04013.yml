translation:
  ja: アブドゥルアズィーズ・ブン・ムハンマド・ブン・ムーサー・ブン・ムハンマド・ブン・アリー、アッ＝シャリーフ・アル＝カーディリー。父は後述される。私（サハーウィー）から聴聞した者の一人で、ヒジュラ暦897年の疫病（ペスト）で没した。彼はアスターダール（宮廷家政長官）タグリー・ビルディーの妻の兄弟である。
  en: ʿAbd al-ʿAzīz b. Muḥammad b. Mūsā b. Muḥammad b. ʿAlī al-Sharīf al-Qādirī, whose father is mentioned below. He was among those who heard from me, and he died of the plague in the year 897 AH. He was the brother of the wife of Taghrī Birdī the ustādār.
