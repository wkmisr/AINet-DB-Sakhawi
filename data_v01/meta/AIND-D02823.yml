    ja: '見出しナサブから復元（祖父 ثابت まで）。「مجاد」は珍しい名＝識別要素のため TMP-P を発行（規則3）。corpus に本伝なし（hw.py「مجاد」は本項のみ）・ID-Master 未登録。祖父 ثابت をマディーナ首長 ثابت بن نعير（#AIND-D02326）と結びつける根拠は原文になく、同定しない（規則26）。【集約 2026-10-26 補記（内容A M-2、決定9）】点の揺れ（م/ن）で引き直すと #AIND-D03404「ضيغم بن خشرم بن نجاد الحسيني أمير المدينة … ثم انفصل سنة خمسين」の父「خشرم بن نجاد」が本項主（خشرم بن مجاد、831没）と同一の可能性がある（ضيغم の在任 839年以後〜850年は父子として矛盾しない）。ただし D03404 は本項主を名指しせず（規則23・26）、本項の見出しにも子の記載がないので relation は立てない。D03404（repo 収録）の father「خشرم」#NEEDID・grandfather「نجاد」#NEEDID は本項主・TMP-P-001592 の名寄せ候補（ID-Master／repo 側の裁定事項）。なお #AIND-D03401「ضغيم بن خشرم بن ثابت بن نعير」（769〜783 在任）にも「خشرم بن ثابت」が出るが世代が異なる。'
