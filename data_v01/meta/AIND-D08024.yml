    ja: '「وسيأتي محمد بن محمد بن عبد الله البرديني فيحرر」＝#AIND-D08883「محمد بن محمد بن عبد الله الشمس البرديني ثم القاهري الشافعي . حفظ القرآن وسمع من شيخنا ثم مني وخالط الأكابر … وهو خطيب جامع الحبانية وإمامه . مات … سنة تسعين」（未受領）。サハーウィー自身が同一人物の可能性を留保（فيحرر）するため possible_identity cert low。転送指示ではないので両項とも実項（二重立項型、Waka 裁定 2026-09-08）。ニスバ索引 #AIND-D11473「البرديني … البدر حسن بن أحمد بن محمد ومحمد ابن علي بن أحمد ومحمد بن محمد بن عبد الله صاحب الزين الأستادار …」は両名を別人として並記している（note）。'
notes:
- text: 'ニスバ索引 #AIND-D11473 は「محمد ابن علي بن أحمد」（本項主）と「محمد بن محمد بن عبد الله صاحب الزين الأستادار」（#AIND-D08883）を別個に列挙しており、サハーウィーは索引段階では両者を別人と扱っている。本項の「فيحرر」の留保はそのまま possible_identity cert low に反映。'
