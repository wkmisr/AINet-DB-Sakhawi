translation:
  ja: ムハンマド・ブン・アリー・ブン・アフマド・アル＝バルディーニー、のちにアル＝カーヒリー。我らがシャイフ（イブン・ハジャル）から聴聞した者の一人。ムハンマド・ブン・ムハンマド・ブン・アブドゥッラー・アル＝バルディーニーが後出するので、検討を要する。
  en: Muḥammad b. ʿAlī b. Aḥmad al-Bardīnī, then al-Qāhirī. One of those who heard from our shaykh (Ibn Ḥajar). Muḥammad b. Muḥammad b. ʿAbd Allāh al-Bardīnī will come below, so this should be examined.
