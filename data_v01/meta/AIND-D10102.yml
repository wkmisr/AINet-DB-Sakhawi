  en: Mūsā al-Ṭarābulusī, a Maghribī man of good character. He died in Mecca in Ramaḍān of the year [8]18 and was buried in the cemetery of Ribāṭ al-Muwaffaq. Ibn Fahd mentioned him on the authority of Ibn Mūsā.
