translation:
  ja: アリー・ブン・サーリフ・ブン・アブド・アッラー・アル＝マッキー・アル＝ジャウハリー。（アル＝ジャウハリーは）彼らのマウラーで、カーディーのアブー・アッ＝サアーダート・ブン・ザヒーラに仕えていた者に由来する呼称である。861年ジュマーダー第2月に没した。イブン・ファハドが彼の没年を記録している。
  en: ʿAlī b. Ṣāliḥ b. ʿAbd Allāh al-Makkī al-Jawharī, (the latter being) an attribution to a client (mawlā) of theirs who used to serve the qāḍī Abū al-Saʿādāt b. Ẓahīra. He died in Jumādā al-Ākhira of the year 861 AH. Ibn Fahd recorded his death.
