translation:
  ja: アブー・アッ＝シヤーダ・アフマド・ブン・イブラーヒーム・ブン・アッ＝シャイフ・カリーム・アッ＝ディーン・ブン・ジャラール・アッ＝ディーン・ブン・サイフ・アッ＝ディーン・アル＝ハサニー・アル＝アウダヒー・アル＝ヒンディー・アル＝ハナフィー。 メッカでの2度目のムジャーワラ滞在中、私に面会し、『ブハーリー』を朗誦したほか、私に付き従い、私が口述したものを書き写し、私は彼に包括的なイジャーザを与えた。
  en: Abū al-Siyāda Aḥmad b. Ibrāhīm b. al-Shaykh Karīm al-Dīn b. Jalāl al-Dīn b. Sayf al-Dīn al-Ḥasanī al-Awdahī al-Hindī al-Ḥanafī. He met me (al-Sakhāwī) in Mecca during his second period of mujāwara. He read Sahih al-Bukhārī to me, accompanied me in various matters, and even wrote down what I dictated there. I also wrote a comprehensive ijāza for him.
