translation:
  ja: ムハンマド・ワリーユッディーン・アブー・アブディッラー・イブン・サーリフ。前項の人物の兄弟。兄が844年にカーディー職を辞任した際に単独でその職に就き、自身もまた辞任してその職を甥のサラーフッディーン・ムハンマドに譲るまで、それを保った。説教師職（ヒターバ）とイマーム職も分担し、説教に優れていた。アブー・アル＝ハサン・スィブト・アッ＝ズバイルらから聴聞した者の一人である。ほどなくして874年のジュマーダー（第一または第二）月に没した。
  en: Muḥammad Walī al-Dīn Abū ʿAbd Allāh Ibn Ṣāliḥ, the brother of the preceding. He held the judgeship in his own right when his brother resigned from it in 844, and continued until he too resigned and left it to his nephew Ṣalāḥ al-Dīn Muḥammad. He also shared in the offices of preacher (khaṭīb) and imam, and was a good preacher. He was among those who heard from Abū al-Ḥasan Sibṭ al-Zubayr and others. Not long afterwards he died, in one of the two Jumādās of 874.
