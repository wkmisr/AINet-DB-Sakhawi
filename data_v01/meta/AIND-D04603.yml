translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アリー・ブン・スライマーン、アッ＝ラーザービー・アル＝ジャバルティー、のちにアル＝マッキー。同地（マッカ）のリバート・イブン・アッ＝ザマンの住人。（8）86年ラジャブ月に没し、アル＝マアラーに葬られた。善良で敬虔な人物で、私（サハーウィー）のもとで『アルフィーヤ註釈』などの講義に出席した者の一人であり、『アル＝カウル・アル＝バディーウ』を入手した。それどころか、私の聞いたところでは、彼はアッ＝シャラフ・アブドゥルハック・アッ＝スンバーティーが隣留（ムジャーワラ）していた際に彼のもとで『アル＝イルシャード』の分担講読を行っていたという。神が彼を憐れみたまえ。
  en: ʿAbd Allāh b. Muḥammad b. ʿAlī b. Sulaymān, al-Rāzābī al-Jabartī, later al-Makkī, resident of Ribāṭ Ibn al-Zaman there (in Mecca). He died in Rajab (8)86 and was buried at al-Muʿallā. He was a righteous, good man, one of those who attended my (al-Sakhāwī's) lectures on the Sharḥ al-Alfiyya and other works, and he obtained al-Qawl al-Badīʿ; indeed, as I was informed, he used to read al-Irshād in divided sessions under al-Sharaf ʿAbd al-Ḥaqq al-Sunbāṭī during the latter's sojourn (mujāwara). May God have mercy on him.
