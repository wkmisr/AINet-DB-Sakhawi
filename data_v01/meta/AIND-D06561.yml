  active: AIND-D11030
  passive: AIND-D06561
  cert: medium
  quote: null
  note:
    ja: '二重立項の可能性（どちらにも転送指示なし＝両項とも実項）。クンヤ部 #AIND-D11030「أبو الفتح بن محمد بن إبرهيم الشكيلي المدني أخو أحمد الماضي ممن سمع مني بالمدينة」（repo 未収録）は、クンヤ أبو الفتح・ニスバ الشكيلي المدني・「سمع مني بالمدينة」が本項と一致し、ナサブは「محمد بن إبراهيم」（本項）と「بن محمد بن إبراهيم」（D11030）で名の順が入れ替わるだけ。D11030 の兄弟 أحمد＝#AIND-D01186「أحمد بن محمد بن إبراهيم الشهاب الشكيلي المدني」で、その子が #AIND-D06819 محمد（「الماضي أبوه」）と #AIND-D09830 محمود（「وأخوه محمد وأبوهما」）＝D09830 の「عم」は أحمد の兄弟 أبو الفتح（D11030）であり、それを D09830 は「عمه محمد بن إبرهيم」（＝本項）と呼ぶ。サハーウィー自身 D09830 でこの家のナサブを「فقيل محمد بن إبرهيم وقيل إبرهيم بن محمد」と迷っている。同定の明言はない＝cert medium（ISSUES §D170-2）。鏡像は D11030 受領時。'
