translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド、ファトフ・アッ＝ディーン、アブー・アル＝ファトフ、アッ＝シュカイリー、アル＝マダニー。同地（マディーナ）のファッラーシュおよびムアッズィンの一人で、後出のマフムード・ブン・アフマドの父方おじ。マディーナで私から聴いた者の一人。
  en: Muḥammad b. Ibrāhīm b. Muḥammad, Fatḥ al-Dīn Abū al-Fatḥ, al-Shukaylī al-Madanī, one of its (Medina's) farrāshes and muezzins, and paternal uncle of Maḥmūd b. Aḥmad, who will come below. He was among those who heard from me in Medina.
