  quote: محمود بن أحمد
  note:
    ja: '「وعم محمود بن أحمد الآتي」＝#AIND-D09830「محمود بن أحمد واختلف علي فيمن بعده فقيل محمد بن إبرهيم وقيل إبرهيم بن محمد وكأنه أصح الزين الشكيلي المدني أحد مؤذنيها والماضي عمه محمد بن إبرهيم وأخوه محمد وأبوهما . ممن سمع في المدينة . ويحرر مع محمود ابن أحمد بن إبرهيم الماضي قريبا」（相手側が「الماضي عمه محمد بن إبرهيم」と本項主を名指し＝相互閉合、repo 未収録）。ブリーフの候補 #AIND-D09826「محمود بن أحمد بن إبرهيم حميد اتلدين بن الفاضل شهاب الدين الشكيلي المدني الشافعي」は本項主に触れず、サハーウィー自身が D09830 の末尾で「ويحرر مع محمود ابن أحمد بن إبرهيم الماضي قريبا」（D09826 と同一人物かを要精査）と留保している項＝充てない（ISSUES §D170-1）。初版は #NEEDID。'
- id: r4
