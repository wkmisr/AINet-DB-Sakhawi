- text: 'シュカイリー家（マディーナ）の corpus 上の項: #AIND-D01186 أحمد بن محمد بن إبراهيم الشهاب（889年没、ملقن الأموات）・#AIND-D01628（REF）・本項・#AIND-D06819 محمد بن أحمد بن محمد بن إبراهيم・#AIND-D09408 محمد بن محمود بن أحمد بن محمد بن إبرهيم أمين الدين・#AIND-D09826 محمود بن أحمد بن إبرهيم حميد الدين・#AIND-D09830 محمود بن أحمد … الزين・#AIND-D11030 أبو الفتح بن محمد بن إبرهيم。兄弟 أحمد（D09830 の父）は本項に名指しされない＝relation は立てない（規則23）。ニスバ由来の residence event（المدينة）は除去（規則22(1)）。'
