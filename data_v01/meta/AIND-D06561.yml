    ja: '規則3 (c'')。見出しどおりなら父は إبراهيم بن محمد（الشكيلي）＝汎用名で識別要素なし、corpus に本伝なし（全文「الشكيلي」8件）。ID-Master の TMP-P-000962「إبراهيم（جد أحمد بن محمد الشكيلي المدني）」は #AIND-D01628 の祖父として登録された別の位置の人物＝充てない。なお下の possible_identity が成り立てば、本項主の正しいナサブは「محمد بن إبراهيم」の順が逆（أبو الفتح بن محمد بن إبراهيم）で、父は محمد بن إبراهيم となる。初版は father relation なし。'
