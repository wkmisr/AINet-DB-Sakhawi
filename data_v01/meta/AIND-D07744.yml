translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・イブラーヒーム、アッ＝シャムス、アル＝マスーフィー、のちにアル＝マダニー。マディーナの聖域（ハラム）の頌詩詠唱者で、その子ムハンマドは後述する。ヒジュラ暦827年に生まれ、2歳か3歳のときに父と共にマディーナに来て、クルアーンを読誦（学習）し、落ち着きと善良さを備えたハラムの頌詩詠唱者となった。私（サハーウィー）がそこにいたとき、彼は私から聴聞し、その子の作った一篇のカスィーダを私のために書いてくれた。
  en: Muḥammad b. ʿAbd Allāh b. Ibrāhīm, al-Shams, al-Masūfī, then al-Madanī, the panegyrist (mādiḥ) at its Sanctuary, whose son Muḥammad is mentioned below. He was born in the year 827 and came with his father to Medina when he was two or three years old; he learned to recite the Qurʾān and became the panegyrist of the Sanctuary, with composure and goodness. When I (al-Sakhāwī) was there he heard from me and wrote out for me a qaṣīda composed by his son.
