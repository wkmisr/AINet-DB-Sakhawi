translation:
  ja: アリー・ブン・アフマド・ブン・アブドゥルアズィーズ・ブン・アブドゥルワーヒド・ブン・ウマル・ブン・イヤード、アル＝アンサーリー・アル＝マグリビー、のちにアル＝マダニー。父は前述した。（8）20年、2歳のときに父とともに、叔父ムハンマドの項で述べる（聴聞の席）に出席した。
  en: ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz b. ʿAbd al-Wāḥid b. ʿUmar b. ʿAyyād, al-Anṣārī al-Maghribī, then al-Madanī; his father has been mentioned above. In the year (8)20, when he was in his second year, he attended with his father what is mentioned in the entry of his uncle Muḥammad.
