translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・ヤアクーブ・ブン・イスマーイール・ブン・ムハンマド・ブン・アブドゥルラフマーン・ブン・アブドゥルラヒーム・ブン・ムハンマド・ブン・ユースフ・ブン・アビルマアーリー・ヤフヤー・アッ＝シャイバーニー。後述するアブドゥルカーディルの父であり、前述したアフマドの兄弟。イブン・ジブラクとして知られる。
  en: ʿAbd al-Raḥmān b. Muḥammad b. Yaʿqūb b. Ismāʿīl b. Muḥammad b. ʿAbd al-Raḥmān b. ʿAbd al-Raḥīm b. Muḥammad b. Yūsuf b. Abī al-Maʿālī Yaḥyā al-Shaybānī. He is the father of ʿAbd al-Qādir (mentioned below) and brother of Aḥmad (mentioned above). He was known as Ibn Zibraq.
