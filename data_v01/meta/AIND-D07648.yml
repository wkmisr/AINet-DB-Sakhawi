translation:
  ja: ムハンマド・ブン・アブドゥッラッザーク・ブン・アブドゥッラー、アル＝アラム・アブー・アル＝ハイル・イブン・アッ＝シャムス――〔アッ＝シャムスは〕宰相（サーヒブ）アル＝アラム・ヤフヤー・ブン・アビー・カムの兄弟――、後述のヤフヤーの父。イブン・アビー・カムとして知られる。諸官庁（ディーワーン）で実務に携わった者の一人。およそ〔八百〕六十年に没した。神が彼を赦したまいますように。
  en: Muḥammad b. ʿAbd al-Razzāq b. ʿAbd Allāh, al-ʿAlam Abū al-Khayr b. al-Shams — [al-Shams being] the brother of the vizier (al-Ṣāḥib) al-ʿAlam Yaḥyā b. Abī Kamm — and the father of Yaḥyā, who is mentioned below. He is known as Ibn Abī Kamm. He was among those who served in the government bureaus (dawāwīn). He died in approximately the year [8]60; may God pardon him.
