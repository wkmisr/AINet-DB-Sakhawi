translation:
  ja: ダウード・ブン・イスマーイール・ブン・アリー・ブン・ムハンマド・ブン・ダウード・ブン・シャムス・ブン・アブドゥッラー・アル＝バイダーウィー・アル＝マッキー・アル＝ザムザミー。アブー・アル＝ファトフの兄弟であり、美声のムアッズィン（礼拝告知者）の一人。882年ムハッラム月にマッカにて代理（イナーバ）の任のなかで死去した。アッラーが彼を赦されますように。
  en: Dāwūd ibn Ismāʿīl ibn ʿAlī ibn Muḥammad ibn Dāwūd ibn Shams ibn ʿAbd Allāh al-Bayḍāwī al-Makkī al-Zamzamī. The brother of Abū al-Fatḥ and one of the muezzins known for his resonant voice. He died in Mecca as a deputy in Muharram, the year 882 [AH]. May Allah forgive him.
