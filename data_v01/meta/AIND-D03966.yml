translation:
  ja: アブドゥルアズィーズ・ブン・アブドゥルジャリール・ブン・アブドゥッラー、イッズ・アッ＝ディーン・アン＝ナムラーウィー、シャーフィイー派の法学者。［7］10年ズー・アル＝カアダ月9日に没した。我らがシャイフ（イブン・ハジャル）は『インバー』でそのように（810年の項に）記しているが、正しくは「700」を伴う（710年）であり、彼は（ヒジュラ暦）8世紀の人であって、彼（イブン・ハジャル）自身がそこ（8世紀の人物録）で既に伝記を書いている。誤ることなき御方に栄光あれ。
  en: ʿAbd al-ʿAzīz b. ʿAbd al-Jalīl b. ʿAbd Allāh ʿIzz al-Dīn al-Namrāwī, the Shāfiʿī jurist. He died on 9 Dhū al-Qaʿda in the year [7]10. Thus our shaykh (Ibn Ḥajar) recorded him in his Inbāʾ, but the correct reading is "and seven hundred", so he belongs to the eighth century, and he (Ibn Ḥajar) had already given him a biography there. Glory be to Him who does not err.
