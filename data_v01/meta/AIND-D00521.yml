translation:
  ja: アハマド・ブン・アハマド・ブン・ムハンマド・アル＝マナーウィー。ニスバはシャルキーヤ地方のムンヤト・アビー・アブドゥッラー。シャーフィイー派。イブン・アル＝ムアッズィブとして知られる。アッ＝ザイン・アル＝ハーフィーおよびナーシル・アッ＝ディーン・アッ＝タブナーウィーに師事した。アッ＝タブナーウィーは自分の息子を彼（伝記対象者）の娘と結婚させた。彼は高潔な人物で、故郷で子供たちを教える職に就いていた。856年の末か、その次の年の初めに死去した。彼のもとで学んだ者の中にはヌール・アッ＝ディーン・アッ＝サルウィーがいる。
  en: Aḥmad b. Aḥmad b. Muḥammad al-Manāwī, his nisbah is to Munyat Abī ʿAbd Allāh in al-Sharqiyya. A Shafi'i jurist, known as Ibn al-Muʾaddib. He accompanied al-Zayn al-Ḥāfī and Nāṣir al-Dīn al-Ṭabnāwī. Al-Ṭabnāwī married his son to the subject's daughter. He was a righteous man who sat to teach children in his hometown. He died at the end of the year 856 or the beginning of the one after it. Among those who studied with him was Nūr al-Dīn al-Sarawī.
