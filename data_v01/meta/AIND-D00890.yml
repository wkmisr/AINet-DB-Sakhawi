translation:
  ja: アブー・アル＝ファドル、シャハーブ・アッ＝ディーン、アフマド・ブン・アブドゥッラー・ブン・アブー・バクル・ブン・アブドゥッラー。ナブルス出身でカイロ生まれ。父親は商人であり、アル＝ラッファーフ（「包装業者」の意）として知られる。 私（＝サハーウィー）のもとで、父親らの同席のもと、記憶をもとに『アル＝ミンハージュ』の最初からタヤンムム（沙浄）の章までを読誦した。また、私（＝サハーウィー）の口述から『アル＝ムサルサル』と六大ハディース書の冒頭部分を聴聞した。これら全てはヒジュラ暦891年に私の自宅において行われ、私は両者（＝アフマドと彼の父親）にイジャーザを与えた。
  en: Aḥmad b. ʿAbd Allāh b. Abī Bakr b. ʿAbd Allāh, Shihāb al-Dīn Abū al-Faḍl, originally from Nablus, born in Cairo. His father was a merchant and was known as al-Laffāf. He read to our shaykh (al-Sakhāwī), in the presence of his father and others, from memory, from the beginning of al-Minhāj until the chapter on tayammum. He also heard from our shaykh's dictation al-Musalsal and the beginnings of the Six Books of Hadith. All of this took place in the year 891 AH at our shaykh's house, and our shaykh granted ijāza to both him and his father.
