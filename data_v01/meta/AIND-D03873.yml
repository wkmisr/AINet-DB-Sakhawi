translation:
  ja: アブドゥッラヒーム・ブン・アリー・ブン・ムハンマド・ブン・ウマル、ラカブはアッ＝ザイン。トゥールーン朝の家系を引くマディーナの住民。シャーフィイー派。ハラム（聖所）の建築家（エンジニア）であり、「アル＝ムハンディス（建築家）」および「イブン・アル＝バンナーウ」として知られる。ヒジュラ暦891年に没した。彼は『アル＝ウムダ』、2つの『アル＝ミンハージュ』、そして『イブン・マーリクのアルフラ（千行詩）』を暗記し、学問に励んだ人物の一人である。
  en: Abd al-Rahim b. Ali b. Muhammad b. Umar, Zayn al-Din, of Tulunid origin, resident of Medina, Shafi'i, the architect (engineer) of the Sanctuary, known as al-Muhandis and as Ibn al-Banna. He died in the year 891. He was among those who memorized al-Umda, the two Minhajs, and Alfiyyat Ibn Malik, and engaged in scholarly study.
