translation:
  ja: タバル・ブン・マンスール・ブン・ラージフ・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ウマル・ブン・マスウード・アル＝ウマリー・アル＝マッキー、アル＝カーイド（指揮官）。彼らの有力者の一人。826年のラマダーン月、あるいはシャウワール月に、50歳未満、あるいはちょうど50歳ほどで没した。アル＝ファースィーが彼について言及している。
  en: Tabal b. Manṣūr b. Rājiḥ b. Muḥammad b. ʿAbd Allāh b. ʿUmar b. Masʿūd al-ʿUmarī al-Makkī al-Qāʾid, one of their notables. He died in Shawwāl or Ramaḍān in the year 826 AH, aged under fifty or just having reached it. He was mentioned by al-Fāsī.
