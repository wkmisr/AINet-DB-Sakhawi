translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・ムハンマド・ブン・ハサン・アル＝ファークースィー。父と祖父は先述。彼と兄弟のアフマドは、アッ＝ザーヒリーヤでの『ブハーリー』読了会（ハトム）を聴聞した者たちの一人である。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. Ḥasan al-Fāqūsī, whose father and grandfather were mentioned previously. He and his brother Aḥmad were among those who heard the completion (khatm) of al-Bukhārī at al-Ẓāhiriyya.
