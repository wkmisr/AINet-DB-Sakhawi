translation:
  ja: アブー・アル＝アッバース・アッ＝サリーフィー、アフマド・ブン・ウマル・ブン・ジャウマーン。 高潔なる義人、篤信の聖者の一人で、彼を見る者は誰であれ、彼が偉大なワリー（聖友）たちの一人であると疑うことはないだろうと評される人物である。834年に死去した。アル＝アフィーフが彼について言及している。彼に学んだ者の中には、息子であるアル＝ジャマール・アッ＝ターヒル（ムハンマド伝中に後述）、および親族であるアブー・アル＝カシム・ブン・イブラーヒーム・ブン・アブドゥッラー（こちらも後述）がいる。
  en: Abū al-ʿAbbās al-Ṣarīfī, Aḥmad b. ʿUmar b. Jawmān. He was from a house of piety and righteousness, of whom no one who saw him would doubt that he was one of the great, virtuous, and pious saints. He died in 834. Al-ʿAfīf mentioned him. Among those who studied with him were his son, al-Jamāl al-Ṭāhir (who will be mentioned later in the section on Muḥammads), and his relative, Abū al-Qasim b. Ibrāhīm b. ʿAbd Allāh (who will also be mentioned later).
