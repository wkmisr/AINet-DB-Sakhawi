  en: Ṣadīq b. ʿAbd Allāh al-Ṣamṣām. al-ʿAfīf al-Nāshirī stated that he (the subject) came to him in Taʿizz in the year 840 AH, describing him as having a good demeanor and excellent conduct, and he narrated a beneficial point on his authority.
