translation:
  ja: ムハンマド・ブン・ハサン・ブン・イリヤース、アル＝ジャマール・アッ＝ルーミー・アル＝ハナフィー。860年ラジャブ月にマッカで没した。イブン・ファハドがその没年を記録している。彼は学問に励み法学などで頭角を現した者の一人で、アブー・アル＝ワクト・アル＝ムルシディーと交友し、手紙を交わすほどであった。書物を収集し、それに加えて能書でもあった。彼の名義には、ハナフィー派マカームのタクビール（復唱）職の半分と、アル＝ムアイヤドが（聖）モスク内の黒石の正面に建てたサビール（給水所）の職、そのほかの俸給があった。40歳前後で没した。
  en: Muḥammad b. Ḥasan b. Ilyās, al-Jamāl al-Rūmī al-Ḥanafī. He died in Mecca in Rajab 860; Ibn Fahd recorded his death date. He was among those who studied and distinguished themselves in jurisprudence and other subjects. He kept company with Abū al-Waqt al-Murshidī, to the point that he corresponded with him, and he acquired books; he was, moreover, a fine calligrapher. Registered in his name were half of the takbīr post at the Ḥanafī maqām, together with the sabīl (public fountain) that al-Muʾayyad had built in the (Sacred) Mosque facing the Black Stone, and other stipends besides. He died at about forty years of age.
