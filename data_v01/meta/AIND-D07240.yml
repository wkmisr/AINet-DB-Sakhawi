- text: '転送見出し（原文「يأتي فيمن جده محمد بن صالح قريبا」による）。転送先は #AIND-D07242「محمد بن أبي بكر بن محمد بن صالح بن محمد الجمال أبو عبد الله بن الرضي الهمذاني الجبلي … التعزي الشافعي ويعرف بابن الخياط」（787年生、未受領）。ラカブ الجمال بن الرضي・通称 ابن الخياط・祖父 محمد بن صالح が一致（ブリーフ指定どおり索引 D12314 は使わない）。'
