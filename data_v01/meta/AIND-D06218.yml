translation:
  ja: カースィム・ブン・サイード・ブン・ハラミー。アル＝バハー・ブン・ハラミーの姉妹の息子。我らがシャイフ（イブン・ハジャル）から聴聞し、アッ＝ザーヒリーヤで『ブハーリー』の読了（ハトム）に臨んだ。
  en: Qāsim b. Saʿīd b. Ḥaramī, sister's son of al-Bahāʾ b. Ḥaramī. He heard from our shaykh (Ibn Ḥajar) and attended the completion (khatm) of al-Bukhārī at al-Ẓāhiriyya.
