notes:
- text: 'grandfather 候補 #AIND-D02497（حرمي بن سليمان الببائي）: 祖父（推定）。#AIND-D00818（البهاء أحمد بن عبد الرحمن بن سليمان … ويعرف بابن حرمي）に「وكأنه عمه فسيأتي حرمي بن سليمان」とあり、ابن حرمي 家の名祖 حرمي は حرمي بن سليمان（#AIND-D02497、生750以前）。本項主は母方で البهاء の甥、父方で حرمي の孫＝D11022「أبو الفتح بن حرمي … ابن أخت البهاء بن حرمى وابن عمه」と同型の従兄妹婚の子。同定は家系からの推定のため cert medium。 【集約 2026-10-19】祖父 relation から外し候補として note に残す（内容B M、決定6）。根拠 D00818「وكأنه عمه فسيأتي حرمي بن سليمان」はサハーウィー自身の推量（كأنه）で、本項「قاسم بن سعيد بن حرمي」の حرمي が実祖父か家名祖かも原文から決まらない（規則26）。'
  lang: ja
