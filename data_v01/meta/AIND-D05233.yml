translation:
  ja: アリー・ブン・アブド・アル＝ガニー・ブン・アブド・アッラー・ブン・アビー・バクル・ブン・アブド・アッラー・ブン・ザヒーラ・アル＝クラシー・アル＝マフズーミー・アル＝マッキー。学問に励み、聡明であった。878年ラビーウ第2月にカイロで没した。イブン・ファハドが彼の没年を記録している。
  en: ʿAlī b. ʿAbd al-Ghanī b. ʿAbd Allāh b. Abī Bakr b. ʿAbd Allāh b. Ẓahīra al-Qurashī al-Makhzūmī al-Makkī. He occupied himself with study and was intelligent. He died in Rabīʿ II of the year 878 in Cairo. Ibn Fahd recorded his death date.
