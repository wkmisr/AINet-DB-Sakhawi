translation:
  ja: アフマド・ブン・ムハンマド・ブン・アルファキーフ・アリー・アル＝ハユーティー・アル＝ミスリー。我らが師（イブン・ハジャル）は自著『ムアジャム（・アル＝ムファフラス）』で彼について述べた。彼は学問に大いに励み、とりわけクルアーン諸読誦法に力を注いだ。ハディース聴聞では我々（サハーウィー）と同行した。私（サハーウィー）は彼からタジュウィードによるクルアーンを学び、また彼は私のために多くの写本を書写した。彼は壮年期の初めに、八〇七年シャウワール月に亡くなった。
  en: Aḥmad b. Muḥammad b. al-Faqīh ʿAlī al-Khuyūṭī al-Miṣrī. Our shaykh (Ibn Ḥajar) mentioned him in his muʿjam (al-Muʿjam al-Mufahras). He devoted himself greatly to study and gave particular attention to the Qurʾānic readings (al-qirāʾāt). He accompanied us (al-Sakhāwī) in hearing ḥadīth. I (al-Sakhāwī) acquired the Qurʾān with tajwīd from him, and he copied many texts for me. He died at the beginning of mature adulthood, in Shawwāl 807 H.
