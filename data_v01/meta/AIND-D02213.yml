translation:
  ja: バラート・アッ＝サアディー。アッ＝ザーヒル・バルクークの時代にはタブルハーナ級アミールであったが、その後多くの出来事が彼の身に降りかかり、ヒジュラ暦808年ジュマーダー・アル＝ウーラー月に無任の身（バッタール）で亡くなった。アル＝アイニーが彼について言及している。
  en: Balāṭ al-Saʿdī held the rank of ṭablakhānāh during the time of al-Ẓāhir Barqūq, and many things happened to him until he died in Jumādā al-Ūlā in the year eight (808 H) while out of service (baṭṭāl). Al-ʿAynī mentioned him.
