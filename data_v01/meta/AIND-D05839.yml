translation:
  ja: ウマル・ブン・アル＝フサイン・ブン・ブーバーン（Būbān：二つのバーのうち最初のものにダンマ、語末はヌーン）・アル＝ガッズィー・アル＝ハナフィー。858年、イブン・ウマルの罷免ののちに自分の町（ガザ）のカーディー職に就いたが、1年足らずしか続かず、その後再任され、さらにもう一度この職に就いた。師の一人にナースィル・アッ＝ディーン・アル＝イヤースィーがいる。890年時点で存命であり、60歳を越えていた。
  en: ʿUmar b. al-Ḥusayn b. Būbān (with two bāʾs, the first with ḍamma, ending in nūn) al-Ghazzī al-Ḥanafī. He was appointed judge of his town (Gaza) in the year 858 after the dismissal of Ibn ʿUmar, but lasted less than a year; he was later reinstated, and likewise held the office once more. Among his teachers was Nāṣir al-Dīn al-Iyāsī. In the year 890 he was still alive and had passed sixty.
