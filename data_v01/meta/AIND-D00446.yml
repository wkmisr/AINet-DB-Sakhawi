translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・ウマル・ブン・アリーは、ラカブをシャハーブ、クンヤをアブー・アル＝ファドル、エジプト出身で、アル＝ブルハーン（＝先述の父イブラーヒーム）の息子である。アル＝マハッラーの息子として知られる商人。彼の父は先行する伝記で言及された人物である。我らがシャイフ（イブン・ハジャル）は言った：「彼は善良で、気高く、快活な若者であった」。またシャイフは、彼の父の項において彼（アフマド）について、商業の知識を極め、イエメンに赴き、父がエジプトで亡くなったときにはその地（イエメン）にいた、と述べている。彼（アフマド）は父の死後まもなく、ヒジュラ暦806年ドゥー・アル＝カアダ月の終わりにマッカで亡くなった。アル＝タキー・アル＝ファーシーは『マッカの歴史』で彼について述べた：「彼は極めて裕福で、商業に精通し、善行への意欲があった。我々の仲間であるハーフィズ・シャハーブ・アル＝ディーン・イブン・ハジャルは、彼（アフマド）の地位を重んじて彼を励まし、彼の手によって慈善が行われた。イブン・ハジャルは彼が潔白であると褒めていたが、彼のような人物としては珍しいことであった。彼はてんかんの病に苦しんでおり、それによってヒジュラ暦806年ドゥー・アル＝カアダ月25日の水曜日の夜、イエメンから到着して4日後に、享年26歳で亡くなった。彼が亡くなる前に、父の死後、エジプトのスルタンの商業代理店の管理を委任するよう彼に求められていたが、死がそれを先んじた。」
  en: 'Shihāb Abū al-Faḍl Aḥmad b. Ibrāhīm b. ʿUmar b. ʿAlī, of Egyptian origin, son of al-Burhān, known as Ibn al-Maḥallā, the merchant. His father was mentioned previously. Our shaykh (Ibn Ḥajar) said: ''He was a good, noble, and light-spirited young man.'' And in the notice of his father he said of him (Aḥmad) that he had attained the utmost knowledge of commerce and had gone to Yemen, being there when his father died in Egypt. He (Aḥmad) died shortly after his father, in Mecca, at the end of Dhū al-Qaʿda in the year six (806 H). Al-Taqī al-Fāsī mentioned him in his ''History of Mecca'' saying: ''He was exceedingly wealthy, knowledgeable in trade, and had a zeal for good. Our companion, al-Ḥāfiẓ Shihāb al-Dīn Ibn Ḥajar, encouraged him due to his high standing with him, and charities were conducted through his hands. He (Ibn Ḥajar) praised his chastity, which was remarkable for someone like him. He was afflicted with epilepsy, and he died from it on Wednesday night, the twenty-fifth of
    Dhū al-Qaʿda, at the age of twenty-six, four days after his arrival from Yemen. He had been asked to take charge of the Sultanic commercial agency in Egypt after his father''s death, but death preceded him.'''
