translation:
  ja: イスマーイール・ブン・アフマド・ブン・イスマーイール・ブン・ムハンマド・ブン・イスマーイール・ブン・アリー・アル＝ʿイマード・ブン・アル＝クトゥブ・アル＝カルカシャンディー・アル＝カーヒリー・アッ＝シャーフィイー。 我らがシャイフ（筆者サハーウィーの師）であるアラー・アリー（後述）、および兄イブラーヒーム（前述）らの兄弟で、バドル・ムハンマドの父にあたる。 アル＝クワイイクから『アッ＝シファー』の一部を聴聞し、少し勉学に励み、証人たちの会合に出席した。聴覚が鈍かった。私（サハーウィー）にイジャーザを与え、彼が亡くなったのは…
  en: Ismāʿīl b. Aḥmad b. Ismāʿīl b. Muḥammad b. Ismāʿīl b. ʿAlī al-ʿImād b. al-Quṭb al-Qalqashandī al-Qāhirī al-Shāfiʿī. He was the brother of our shaykh (al-Sakhāwī's teacher) al-ʿAlāʾ ʿAlī (forthcoming entry) and his brother Ibrāhīm (previous entry), among others, and the father of al-Badr Muḥammad. He listened to parts of al-Shifāʾ from al-Kuwayk, studied a little, and sat with the witnesses. He was hard of hearing. He granted me (al-Sakhāwī) an ijāza, and he died in (year not specified).
