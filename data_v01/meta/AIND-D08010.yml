  quote: الكمال عبد اللطيف
  note:
    ja: '「أخو الكمال عبد اللطيف الماضي」＝ #AIND-D04332「عبد اللطيف بن علي بن محمد بن محمد بن الحسين الكمال … الحسني المنفلوطي ثم القاهري الموقع ، ويعرف بابن أخي المحروق」（生821・没890、未受領）。ニスバ索引 #AIND-D11269「الشريف ابن أخي المحيريق الكمال عبد اللطيف بن علي بن أحمد وأخوه بهاء الدين」と #AIND-D12710「ابن أخي المحروق عبد اللطيف بن علي ابن أحمد」で両者を閉合（通称の綴り المحيريق／المحروق の揺れは規則25・46 により原文のまま）。初版の #NEEDID を本伝に置換。'
