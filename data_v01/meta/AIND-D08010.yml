  note:
    ja: '【集約 2026-10-25】機械検査の候補 #AIND-D04959「علي بن أحمد بن ثقبة بن رميثة الحسني المكي」（846年没、マッカのシャリーフ）は一致が2代＋汎用ニスバ الحسني のみで、兄弟 D04332 の父ナサブ（علي بن محمد بن محمد بن الحسين … المنفلوطي）とも合わず別人。 父 علي بن أحمد：兄弟 الكمال عبد اللطيف の本伝 #AIND-D04332 では「عبد اللطيف بن علي بن محمد بن محمد بن الحسين الكمال بن العلاء بن ناصر الدين الحسني المنفلوطي ثم القاهري」（祖父名が محمد で本項の أحمد と相違。本項末尾「ويحرر اسمه」）。本伝のある兄弟と共有する父で、ラカブ العلاء・ナサブ・ニスバ المنفلوطي が復元できる → 新規 TMP-P-001580（規則3）。corpus に本伝なし（hw.py「علي بن محمد بن محمد بن الحسين」「المنفلوطي」）。'
