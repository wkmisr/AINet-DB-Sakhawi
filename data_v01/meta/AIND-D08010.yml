translation:
  ja: ムハンマド・ブン・アリー・ブン・アフマド、バハー・アッ＝ディーン・アル＝ハサニー・アル＝カーヒリー。前述のアル＝カマール・アブド・アッ＝ラティーフの兄弟で、イブン・アヒー・アル＝ムハイリク（アル＝ムハイリクの甥）として知られる。夢解釈に長じ、私の考えでは証人（シャーヒド）を務めていたが、のちに失明した。891年ラビーウ・アル＝アウワル月に没した。彼の名は要検討である。
  en: Muḥammad b. ʿAlī b. Aḥmad, Bahāʾ al-Dīn al-Ḥasanī al-Qāhirī, brother of the aforementioned al-Kamāl ʿAbd al-Laṭīf, known as Ibn Akhī al-Muḥayriq. He was skilled in dream interpretation, and I think he acted as a notary witness; then he went blind. He died in Rabīʿ al-Awwal 891. His name is to be verified.
