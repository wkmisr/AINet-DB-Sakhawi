translation:
  ja: ムハンマド・ブン・アリー・ブン・アビー・バクル・ブン・アフマド・ブン・アター・アッラー、アッ＝シャムス・アッ＝ラシーディー・アッ＝シャーフィイー、イブン・アター・アッラーとして知られる。クルアーンその他を暗記し、少し学問に従事し、カイロにたびたび赴き、我らがシャイフ（イブン・ハジャル）らから聴聞した。871年に我々とともに隣住（ムジャーワラ）し、私（サハーウィー）から私の著作その他の多くを聴聞した。
  en: Muḥammad b. ʿAlī b. Abī Bakr b. Aḥmad b. ʿAṭāʾ Allāh, al-Shams al-Rashīdī al-Shāfiʿī, known as Ibn ʿAṭāʾ Allāh. He memorized the Qurʾān and other works, studied a little, went repeatedly to Cairo, and heard from our shaykh (Ibn Ḥajar) and others. He sojourned with us in the year seventy-one and heard from me much of my writings and other works.
