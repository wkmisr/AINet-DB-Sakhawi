translation:
  ja: ハリール・ブン・アビー・アル＝バラカート・ブン・ムーサー、サラーフ・アッ＝ディーン・ブン・サアド・アッ＝ディーン、先人と同じくイブン・アビー・アル＝ハウルとして知られる。マムルーク登録書記（クッターブ・アル＝ママーリーク）の一人。883年ラマダーン月に没した。彼はビルカト・カルムートにあるジャーミウの主で、それは古いモスクであったが、彼が拡張して金曜説教を設け、職務者を配置した。巡礼を複数回行った。
  en: Khalīl b. Abī al-Barakāt b. Mūsā, Ṣalāḥ al-Dīn b. Saʿd al-Dīn, known like his forebears as Ibn Abī al-Hawl. One of the scribes of the mamlūks (kuttāb al-mamālīk). He died in Ramaḍān of the year 883. He was the master of the congregational mosque at Birkat Qarmūṭ; it had been an old mosque, which he enlarged, instituting the Friday sermon in it and appointing office-holders. He performed the pilgrimage more than once.
