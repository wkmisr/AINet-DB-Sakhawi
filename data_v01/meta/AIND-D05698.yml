translation:
  ja: アリ・イブン・ユースフ・イブン・マズルーウ・アル＝ミスリー。マッカに定住し、そこで薬種商（アッタール）を営んだ。ヒジュラ暦884年ラビー・アル＝アウワル月（第3月）にマッカで死去した。イブン・ファハドが彼の死を記録している。
  en: ʿAlī b. Yūsuf b. Mazrūʿ al-Miṣrī. He settled in Mecca and worked as a druggist (perfumer) there. He died in Mecca in Rabīʿ al-Awwal, the year 884 AH. His death was chronicled by Ibn Fahd.
