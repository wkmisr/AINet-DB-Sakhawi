notes:
- text: 'ワッタース家（بنو وطاس）: 子 يحيى＝#AIND-D10333（866年ムハッラム月朔日、従兄弟 محمد بن أبي حسون #AIND-D08221 とともに عبد الحق المريني に殺害された）。#AIND-D08221「محمد بن علي بن يوسف بن زيان الوطاسي المغربي ابن عم يحيى الآتي … وكان كل منهما استقر في الوزارة فهذا بعد والده فأقام يسيرا ثم استقر يحيي فدام سبعين ليلة」。初版の residence event（فاس）はニスバ「الفاسي」と職の地からの補完のため除去（規則22(1)）。nisbah「الفاسي」の ref TMP-N-00108 はニスバ位置での正しい使用（precheck の「汚染注意」は人物位置での流用に対する警告で、本項は該当しない）。'
