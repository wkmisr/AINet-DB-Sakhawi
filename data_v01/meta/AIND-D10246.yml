translation:
  ja: ヤフヤー・ブン・ザイヤーン・ブン・ウマル・ブン・ザイヤーン、アブー・ザカリーヤー、アル＝ワッタースィー・アル＝マリーニー・アッ＝ラムトゥーニー・アル＝ファースィー、アル＝アズラク。極西マグリブ（アル＝マグリブ・アル＝アクサー）の宰相で、後出のヤフヤーの父、ファースの主。公正な人物で、そのため彼の伝記は単独の著作として編まれたほどである。（8）53年ラビーウ第二月2日に不当に殺害されて没し、彼の後は、既出の親族アブー・ハッスーン・アリー・ブン・ユースフ・ブン・ザイヤーンがその地位に就いた。彼はマクリーズィーの『ウクード』に載っており、そこでは次のように言われている。「ヤフヤー・ブン・アビー・ザイヤーン・ブン・アビー・ムハンマド・ブン・アル＝ワズィール・ブン・アビー・ハッスーン・ウマル・ブン・ハマーマ・アル＝ワッタースィー。目が青いためアル＝アズラクとして知られ、ファースの町で政務を執る者。父ザイヤーンは、8年に没するまで、マリーン族の長老たちの重鎮の一人であった。そのときこの息子は7歳ほどで、境遇はさまざまに移り変わった」。その後は（マクリーズィーは）空白のままにしている。
  en: 'Yaḥyā b. Zayyān b. ʿUmar b. Zayyān, Abū Zakariyyāʾ, al-Waṭṭāsī al-Marīnī al-Lamtūnī al-Fāsī, al-Azraq, vizier of the Farthest Maghrib (al-Maghrib al-Aqṣā), father of the Yaḥyā who comes later, and lord of Fez. He was just, so much so that his biography was made the subject of a separate work. He died murdered unjustly on 2 Rabīʿ II of the year [8]53, and after him his relative Abū Ḥassūn ʿAlī b. Yūsuf b. Zayyān, mentioned earlier, took his place. He is in al-Maqrīzī''s ʿUqūd, where he says: "Yaḥyā b. Abī Zayyān b. Abī Muḥammad b. al-Wazīr b. Abī Ḥassūn ʿUmar b. Ḥamāma al-Waṭṭāsī, known as al-Azraq because of the blueness of his eyes, and the one in charge of affairs in the city of Fez. His father Zayyān was one of the great shaykhs of the Banū Marīn until he died in the year eight, when this son of his was about seven years old, and circumstances carried him from one state to another"; then he left a blank.'
