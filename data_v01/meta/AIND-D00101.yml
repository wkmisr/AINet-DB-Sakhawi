translation:
  ja: イブラーヒーム・ブン・アル＝ハサン・ブン・ファラフ・ブン・サアド、カマールッディーン、アル＝ハラビー、シャーフィイー派、公文書署名官。イブン・アル＝ハタブとしても知られる(「ハタブ」のホムラタイン(無点字)は開母音)。774年ジュマーダー・アル＝ウーラー中旬に生まれた。シャハーブ・ブン・アル＝マルハルを介してダーラクトニーの『スンナーン』を聴聞した(一部は聴聞し損ねた)。830年以降に我らのシャイフの息子などの請願書に書写を行った。私が彼の事柄について確認できたのはこれ以上ないし、いつ死んだかも分からなかった。その後、私はイブン・ファハドとアル＝ビカーイー、あるいはそのいずれかが彼に会った可能性があると考えるが、その後に後者(アル＝ビカーイー)が彼に言及しており、840年頃に亡くなったと述べたのを見た。
  en: Ibrāhīm b. al-Ḥasan b. Faraḥ b. Saʿd, Kamāl al-Dīn, al-Ḥalabī, al-Shāfiʿī, al-Muwaqqiʿ bi-l-Dust (Signatory of Official Decrees), and known as Ibn al-Ḥaṭab (with the opening of the two undotted letters). He was born in the middle of Jumādā al-Ūlā in the year 774 H. He listened to al-Sunan by al-Dār Quṭnī from al-Shihāb b. al-Marḥal, with some parts missed. He wrote on a petition for the son of our shaykh and others after the year 830 H. I have no more information about him than what I have recorded, nor do I know when he died. I believe it is possible that Ibn Fahd and al-Biqāʿī, or one of them, met him. Later, I saw that the latter (al-Biqāʿī) mentioned him and stated that he died around the year 840 H.
