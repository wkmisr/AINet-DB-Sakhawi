translation:
  ja: ムハンマド・ブン・トゥーガーン・アル＝ハサニー。その父は前述。父は彼が幼児のときに没し、彼は遊びと戯れにかまけて育った。アッ＝タージュ・アル＝バルキーニーの娘ジャンナと結婚して同家と姻戚となったが、彼女とは続かなかった。また、アッ＝シャムス・ブン・アル＝ムラッハムの姉妹の娘を娶り、彼女との間に男児をもうけた。［ヒジュラ暦8］53年サファル月にペストで没した。四十歳に近づいていた。
  en: Muḥammad b. Ṭūghān al-Ḥasanī, whose father is mentioned above. His father died while he was a small child, and he grew up occupied with amusement and play. He became son-in-law of al-Tāj al-Bulqīnī by marrying his daughter Janna, but did not stay with her; then he married the daughter of the sister of al-Shams b. al-Murakhkham, and she bore him a son. He died of the plague in Ṣafar of the year [8]53, having approached forty.
