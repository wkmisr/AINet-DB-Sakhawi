translation:
  ja: アリー・ブン・ムハンマド・ブン・アビー・アル＝ヤマン・ムハンマド・ブン・アフマド・ブン・アッ＝ラディー・イブラーヒーム・ブン・ムハンマド・ブン・イブラーヒーム・アッ＝タバリー・アル＝マッキー。母はアッ＝シャムス・ムハンマド・ブン・アリー・ブン・スッカル・アル＝バクリーの娘ファーティマ。818年にアッ＝シャリーフ・アフマド・アル＝ファースィーとイブン・サラーマから聴聞した。イブン・ファフドは彼の項を空白のままにした。
  en: ʿAlī b. Muḥammad b. Abī al-Yumn Muḥammad b. Aḥmad b. al-Raḍī Ibrāhīm b. Muḥammad b. Ibrāhīm al-Ṭabarī al-Makkī; his mother was Fāṭima, daughter of al-Shams Muḥammad b. ʿAlī b. Sukkar al-Bakrī. He heard from al-Sharīf Aḥmad al-Fāsī and Ibn Salāma in the year 818. Ibn Fahd left his entry blank.
