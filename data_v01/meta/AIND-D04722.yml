translation:
  ja: アブドゥルムウミン・ブン・アブドゥッダーイム・ブン・アリー・アッ＝サマンヌーディー。ムウミンとして知られ、彼自身の言によれば本名はムハンマドであった。マッカに数年間滞在（ムジャーワラ）し、善い生き方を送り、子供たちを教育していた。（8）07年の巡礼の後にそこ（マッカ）で没し、ユースフ・アル＝カラウィーの娘との間の子孫を残した。アル＝ファースィーが彼に言及している。
  en: ʿAbd al-Muʾmin b. ʿAbd al-Dāʾim b. ʿAlī al-Samannūdī, known as Muʾmin; his name, according to what he himself said, was Muḥammad. He was among those who sojourned in Mecca for years, leading a good life and teaching children. He died there after the Ḥajj of (8)07, leaving offspring by the daughter of Yūsuf al-Qarawī. Al-Fāsī mentioned him.
