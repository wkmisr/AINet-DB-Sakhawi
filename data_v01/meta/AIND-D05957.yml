translation:
  ja: ウマル・ブン・ムハンマド・ブン・アブド・アル＝ワッハーブ・ブン・アブドゥッラー・ブン・アスアド、アッ＝シラージュ、アル＝ヤーフィイー、アル＝マッキー。父は後述、祖父は既述。834年ズー・アル＝カアダ月にアダンで生まれ、マッカに来て、クルアーンを読み、美しい書を書いた。（8）64年ジュマーダー・アッ＝サーニヤ月に同地で没した。イブン・アル＝ファハドがその没年月を記録している。
  en: ʿUmar b. Muḥammad b. ʿAbd al-Wahhāb b. ʿAbd Allāh b. Asʿad, al-Sirāj al-Yāfiʿī al-Makkī; his father is mentioned below and his grandfather above. He was born in Dhū al-Qaʿda 834 in Aden, came to Mecca, read the Qurʾān and wrote a fine hand. He died there in Jumādā II (8)64. Ibn al-Fahd recorded his death.
