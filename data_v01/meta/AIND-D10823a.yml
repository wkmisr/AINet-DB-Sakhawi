translation:
  ja: アブー・バクル・ブン・ムハンマド・ブン・アビー・バクル・ブン・アリー・ブン・ユースフ、ファフル〔・ッディーン〕・イブン・アル＝ジャマール、ザルワ出身でマッカの人、シャーフィイー派、前項の従弟で、父は前出。同じくムルシディーとして知られる。『ミンハージュ』と法源学の『ムフタサル』などを暗記し、法学と文法に励み、文学に大いに関心を寄せてこれとその他に通じ、良い詩と有用な選集がある。ジャマール・イブン・ムーサー・アル＝マッラークシーは彼の詩を大いに称賛した。生計を求めて幾度もイエメンに入り、820年アラファの日にザビードで死期が訪れた。30歳を少し越えていた。ファースィーも彼に言及した。
  en: Abū Bakr b. Muḥammad b. Abī Bakr b. ʿAlī b. Yūsuf, al-Fakhr b. al-Jamāl, of Dharwa origin, Meccan, Shāfiʿī, cousin of the preceding entry, whose father has been mentioned; also known as al-Murshidī. He memorised the Minhāj, the Mukhtaṣar on uṣūl and other texts, studied fiqh and grammar, devoted much attention to literature, in which and in other things he was knowledgeable, and has fine verse and useful compilations; al-Jamāl Ibn Mūsā al-Marrākushī greatly admired his poetry. He went to Yemen several times in search of livelihood, and death overtook him at Zabīd on the day of ʿArafa 820, when he had just passed thirty. Al-Fāsī also mentioned him.
