translation:
  ja: イーサー・ブン・ユースフ・ブン・ムハンマド、アル＝ハワージャ・アル＝イマード・ブン・アル＝ジャマール・ブン・アッ＝シャムス、アル＝クラシー・アル＝バクリー・アル＝バフナシー、マッカの寄留者で、バーブ・アッ＝ドゥライバにある、のちにアル＝ジャマール・ムハンマド・ブン・アッ＝ターヒルのものとなった家の持ち主。865年ラジャブ月に同地（マッカ）で没した。イブン・ファハドがその没年を記した。
  en: ʿĪsā b. Yūsuf b. Muḥammad, al-Khawājā al-ʿImād b. al-Jamāl b. al-Shams al-Qurashī al-Bakrī al-Bahnasī, resident of Mecca and owner of the house there at Bāb al-Durayba that later passed to al-Jamāl Muḥammad b. al-Ṭāhir. He died there (in Mecca) in Rajab 865. Ibn Fahd recorded the date of his death.
