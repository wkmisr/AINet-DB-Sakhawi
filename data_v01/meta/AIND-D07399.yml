translation:
  ja: ムハンマド・ブン・ズィヤーダ・ブン・シャムス・アッ＝ディーン・アル＝アスミーディー・アル＝カーヒリー、朗誦家、絹商、イブン・ズィヤーダとして知られる。クルアーンを暗記し、それを合唱朗誦隊（アジュワーク）で朗誦した者の一人で、時には城塞での勤番で朗誦することもあり、それに秀でていた。バーブ・アル＝カンタラの店で絹商として生計を立てた。彼は私の口述講義（イムラー）を聴聞した者の一人である。889年に巡礼した。
  en: Muḥammad b. Ziyāda b. Shams al-Dīn al-Athmīdī al-Qāhirī, the Qurʾān reciter and silk dealer, known as Ibn Ziyāda. He was among those who memorized the Qurʾān and recited it in the choral groups (al-ajwāq); he sometimes recited in a shift (nawba) at the Citadel and excelled in that. He earned his living as a silk dealer in a shop at Bāb al-Qanṭara. He is among those who heard from me at the dictation sessions. He performed the pilgrimage in the year [8]89.
