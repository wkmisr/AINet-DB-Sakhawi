translation:
  ja: ファーリス・ブン・ムハンマド・ブン・アリー・ブン・スィナーン・アル＝ウマリー。カーイド（隊長）の一人。876年ラビーウ第1月またはラビーウ第2月に、イエメンのある地で没し、そこに埋葬された。享年74。イブン・ファハドが彼の没年を記した。
  en: Fāris b. Muḥammad b. ʿAlī b. Sinān al-ʿUmarī, one of the qāʾids (commanders). He died in Rabīʿ I or Rabīʿ II of the year 876 in some part of Yemen and was buried there, at the age of seventy-four. Ibn Fahd recorded his death date.
