- text: 詩は文法用語の掛詞（تورية）で、نحو（方向／文法）・جر（引く／属格）・عدل（逸れること／語形の転換＝非三段変化の要因 أسباب منع الصرف の一つ）・صرف（去らせる／格変化）・إضافة（付加／属格支配）・ينصرف（立ち去る／三段変化する）が二重の意味をもつ。訳文は表面の意味のみを示した。
