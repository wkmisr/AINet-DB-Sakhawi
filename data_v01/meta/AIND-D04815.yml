translation:
  ja: ウバイドゥッラー・アル＝マンズィリー、マーリク派、黒人のマウラー。その父はアブドゥッラフマーンと名づけられていた。813年頃に生まれた。私は我らが師（イブン・ハジャル）の講席で彼に会い、彼は自らの口で〔次の詩を〕吟じ、私はそれを聴いた。 「あなた方の高位を敬して大地に口づけする、一人の僕（しもべ）が――あなた方のもとへと、熱情が彼を引き寄せたのだ。 あなたが彼から逸れた（アドル）ことの諸原因が、〔彼の〕立ち去ること（サルフ）を妨げた。それでは彼には、それによって立ち去れる（ヤンサリフ）ような付加（イダーファ）があるだろうか。」
  en: 'ʿUbayd Allāh al-Manzilī, the Mālikī, the black mawlā (freedman). His father was named ʿAbd al-Raḥmān. He was born in about 813. I met him at the assembly of our shaykh (Ibn Ḥajar), and he recited from his own lips, while I listened, his verses: "A servant kisses the ground in reverence for your high rank – a servant whom passion has drawn towards you. The causes of your turning away (ʿadl) from him have prevented his departure (ṣarf); so has he any additions (iḍāfāt) by which he might depart (yanṣarif)?"'
