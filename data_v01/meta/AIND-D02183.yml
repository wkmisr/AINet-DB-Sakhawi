translation:
  ja: バラカート・ブン・サラーマ・ブン・アワド・アッ＝タンバダーウィー、のちにアル＝マッキー。マッカでヒジュラ暦867年ラビーウ・アル＝アーヒル月（第4月）に没した。バーブ・アッ＝サラーム（平和の門）で薬種商を営んでいたが、のちに辞めた。
  en: Barakāt b. Salāma b. ʿAwaḍ al-Ṭanbadāwī, later al-Makkī. He died in Mecca in Rabīʿ al-Ākhir, year 867 AH. He used to be a druggist at Bāb al-Salām, but later left the trade.
