translation:
  ja: ハサン・ブン・アリー・ブン・アブドゥルアズィーズ・ブン・アブドゥッラフマーン・ブン・グファー・アル＝バドラーニー。ラカブはアル＝バドル。後述される3人のムハンマドの父親。クルアーンを暗誦し、自分の子供たちにもそれを教えた。敬虔で善良な人物であった。ヒジュラ暦808年にミンヤ・バドラーンで亡くなった。アッラーの慈悲がありますように。
  en: Ḥasan b. ʿAlī b. ʿAbd al-ʿAzīz b. ʿAbd al-Raḥmān b. Ghufāh al-Badrānī, al-Badr. He was the father of the three Muhammads mentioned below. He recited the Qur'an and taught it to his children. He was a good and righteous man. He died in the year 808 AH in Minyat Badran, may Allah have mercy on him.
