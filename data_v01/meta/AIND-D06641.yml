translation:
  ja: ムハンマド・ブン・アフマド・ブン・ハビーブ、アッ＝シャムス・アル＝ガーニミー・アル＝マクディスィー。イブン・ダーミスとして知られる。クルアーンの徒である良きシャイフ。私はエルサレムで彼に会い、彼がアブー・アル＝ハイル・ブン・アル＝アラーイーやアッ＝シャムス・アル＝カルカシャンディーらに聴聞したと知らされた。私は彼にいくつかのジュズウを読んだ。彼はかの地のサラーヒーヤのスーフィーであり、アクサーの書庫係であった。生まれは（7）80年に至る十年のうち。（8）60年近く、おおよそその頃に没した。
  en: Muḥammad b. Aḥmad b. Ḥabīb, al-Shams al-Ghānimī al-Maqdisī, known as Ibn Dāmis. A good shaykh, one of the people of the Qurʾān. I met him in Jerusalem and was told that he had heard from Abū al-Khayr b. al-ʿAlāʾī, al-Shams al-Qalqashandī and others; and I read some juzʾs to him. He was a Sufi at the Ṣalāḥiyya there and keeper of the books at al-Aqṣā. His birth was in the decade leading up to the year 780. He died near the year [8]60, approximately.
