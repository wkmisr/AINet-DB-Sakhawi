notes:
- text: '転送見出し（原文末尾「فيمن جده」。刊本では祖父名が欠落している）。転送先は #AIND-D06629「محمد بن أحمد بن أبي بكر بن علي بن محمد بن أبي بكر بن عبد الله … الجمال أبو عبادة الصامت بن الشهاب … اليماني الزبيدي الناشري الشافعي … ولقبه بالصامت لجده لأمه」（778年生、未受領）＝祖父は أبو بكر。ニスバ索引項 #AIND-D11286「الصامت الجمال محمد بن أحمد بن أبي بكر بن علي بن محمد الناشري في المحمدين」も同人を指す。ラカブ الجمال・通称 الصامت・父名 أحمد・ニスバ الناشري が一致し、corpus に他の該当なし。'
