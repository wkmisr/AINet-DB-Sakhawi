translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アビー・バクル、アッ＝シャムス・アル＝ハラビー。私は彼のことを知らないが、820年のアル＝フウウィーのもとでの『スィーラ（預言者伝）』聴講記録（タバカ）において、アル＝アラー・アリー・ブン・スードゥーン・アル＝イブラーヒーミーが彼に帰属する者として記され、彼と同席していたのを見た。
  en: Muḥammad b. Ibrāhīm b. Abī Bakr, al-Shams al-Ḥalabī. I know nothing of him, except that I saw al-ʿAlāʾ ʿAlī b. Sūdūn al-Ibrāhīmī ascribed to him in the attendance record (ṭabaqa) of the audition of the Sīra under al-Fuwwī in the year 820, and that he [Ibn Sūdūn] was with him.
