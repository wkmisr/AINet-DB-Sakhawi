translation:
  ja: ジャンバク・ミン・ヤルクジャー・アッ＝ザーヒリー・ジャクマク。彼はアミーン・アル＝アクサラーイーの娘ザイナブと結婚し、男の子をもうけた。847年の疫病で30歳にならずに亡くなった。彼は能書家で、『アッ＝シファー』などのクルアーン写本やその他の書物を数多く筆写した。彼はそれを義父（アミーン・アル＝アクサラーイー）に朗誦して聴かせ、ワクフに指定し、その後、彼の妻を娶ったジャクマク（・アル＝ムハンマディー）のもとでそれは閲覧されることとなった。
  en: Jānbak min Yalkhujā al-Ẓāhirī Jaqmaq married Zaynab, the daughter of al-Amīn al-Aqṣarāʾī, and had a male child with her. He died in the plague of 847 H, not having completed thirty years of age. He had mastered calligraphy and copied several Qurʾāns and other works, such as al-Shifāʾ. He recited al-Shifāʾ to his father-in-law (al-Amīn al-Aqṣarāʾī) and endowed it, and it was subsequently kept with Jaqmaq (al-Muḥammadī), who married his widow after him.
