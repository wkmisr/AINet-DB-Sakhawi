translation:
  ja: アフマド・ブン・ハーッス、シャハーブ・アル＝ディーン、ハナフィー派。夜昼を問わず法学とハディース学に勤しみ、多くの著作を著し、集成し、教授したことで傑出した碩学の一人。809年（ヒジュラ暦）に亡くなったとバドル・アル＝アインィーが述べた。我らがシャイフ（イブン・ハジャル）は彼の『アンバーウ』で、バドルが彼から（知識を）取得し、彼を称賛していたと述べた。
  en: Aḥmad b. Khāṣṣ, Shihāb al-Dīn, al-Ḥanafī. He was one of the distinguished scholars who diligently engaged in fiqh and ḥadīth studies day and night, wrote extensively, compiled works, and taught. He died in the year 9 (H), as stated by al-Badr al-ʿAynī. Our shaykh (Ibn Ḥajar) stated in his Anbāʾ that al-Badr acquired knowledge from him and used to praise him.
