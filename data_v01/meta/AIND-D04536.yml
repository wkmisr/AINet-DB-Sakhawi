    ja: '父 = #AIND-D08857（محمد بن محمد بن عبد الله بن إبراهيم الخواجا أبو الفتح بن حمام الدمشقي الأصل المكي … تاجرا سفارا إلى الهند … مات بمكة … سنة خمس وسبعين）。クンヤ أبو الفتح＋父名 محمد＋家名 ابن حمام＋المكي が一致し、corpus に他の「أبو الفتح بن حمام」はない（索引 L122576「أبو الفتح بن حمام في محمد بن محمد بن عبد الله」も同人を指す）。本項のナサブ「بن محمد بن حمام」は عبد الله بن إبراهيم を省いた略記。'
