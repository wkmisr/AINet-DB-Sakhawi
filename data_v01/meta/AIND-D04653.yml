translation:
  ja: アブドゥッラー・ブン・マンスール・アル＝ワジュディー・アッ＝ティリムサーニー・アル＝マグリビー、ハラム（聖モスク）の水運び人（サッカー）。855年ジュマーダー・アル＝ウーラー月、マッカのその施療院（ビーマーリスターン）で水腫により没し、アッ＝シュバイカに葬られた。
  en: ʿAbd Allāh b. Manṣūr al-Wajdī al-Tilimsānī al-Maghribī, the water-carrier at the Ḥaram. He died in Mecca, in its hospital (bīmāristān), of dropsy in Jumādā al-Ūlā of the year 855, and was buried in al-Shabīka.
