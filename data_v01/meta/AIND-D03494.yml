translation:
  ja: アブドゥルバースィト・ブン・ムハンマド・ブン・アブドゥルラフマーン・ブン・アッ＝シャイフ・ヌールッディーン・アリー・ブン・アフマド・ブン・アビー・バクル・アル＝アダミー・アル＝カーヒリー。アッ＝シャムス・アル＝ジョウジャリーの共同経営者（パートナー）であり、その弟子。海路でメッカへ頻繁に旅し、取引やムダーラバ（委託販売）を行った。何度も災難（破産）に見舞われた。彼の言葉は、その益や行動よりも多く、誠実さにおいては他者の方が彼よりも優れている（信頼性に欠ける）。
  en: ʿAbd al-Bāsiṭ b. Muḥammad b. ʿAbd al-Raḥmān b. al-Shaykh Nūr al-Dīn ʿAlī b. Aḥmad b. Abī Bakr al-Ādamī al-Qāhirī. He was a partner and student of al-Shams al-Jawjarī. He was among those who frequently travelled to Mecca by sea, engaging in trade and mudarabah partnerships. He suffered financial ruin multiple times. His words were more than his utility and actions, and others are more worthy of truthfulness than him.
