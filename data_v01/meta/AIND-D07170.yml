translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アフマド、アッ＝シャムス・アル＝カーヒリー・アル＝ハナフィー、イブン・アッ＝サッカーとして知られる。法学とその法源学、アラビア語学、形態論、意味論、修辞論、ハディース学などを修めた。彼の師にはイブン・アッ＝ダイリー、イブン・アル＝フマーム、アル＝アクサラーイー、そして我らの師（イブン・ハジャル）がおり、後者に師事して『ヌフバの注釈』を彼のもとで読誦し、いくつかのものを彼から聴聞した。完全な学徳の持ち主として指折りに数えられた。諸機関の給費職に就き、カーディー代理を務めたが、それから大した利益は得られなかった。888年ラビーウ・アル＝アウワル月に、60歳近くかそれを超えて没した。神が彼を赦したまえ。
  en: Muḥammad b. Abī Bakr b. Aḥmad, al-Shams al-Qāhirī al-Ḥanafī, known as Ibn al-Saqqāʾ. He occupied himself with jurisprudence and its principles, Arabic, morphology, semantics, rhetoric, ḥadīth and other subjects. Among his teachers were Ibn al-Dayrī, Ibn al-Humām, al-Aqṣarāʾī and our shaykh, to whom he attached himself until he read to him the Sharḥ al-Nukhba and heard some things from him. He was pointed out as one of complete merit. He held stipendiary posts and acted as deputy qāḍī, but gained nothing much from it. He died, having approached sixty or passed it, in Rabīʿ al-Awwal 888. May God pardon him.
