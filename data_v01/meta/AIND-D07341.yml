translation:
  ja: ムハンマド・ブン・ハサン・ブン・ハサン・ブン・フサイン・ブン・ウクバ・アル＝マダニー・アル＝マーリキー。アレッポに定住し、イブン・ウクバ、またイブン・ハサンとしても知られる。780年頃マディーナに生まれ、世紀の変わり目（800年頃）にアレッポに来て、そこに住み着いた。イブン・スィッディークから『サヒーフ』の一部を聴聞した。善良で集団礼拝を守り、ハッジを何度も行い、法学に少しばかり携わった。850年頃に没した。ある者たちは彼のナサブを「ムハンマド・ブン・ハサン・ブン・フサイン・ブン・アリー・ブン・ウクバ」と伝えている。
  en: Muḥammad b. Ḥasan b. Ḥasan b. Ḥusayn b. ʿUqba al-Madanī al-Mālikī, resident of Aleppo, known as Ibn ʿUqba and also as Ibn Ḥasan. He was born around the year 780 in Medina, came to Aleppo at the turn of the century and settled there. He heard part of the Ṣaḥīḥ from Ibn Ṣiddīq. He was a good man, regular in attending congregational prayer, performed the pilgrimage many times, and had a little occupation with jurisprudence. He died around the year 850. Some give his lineage as Muḥammad b. Ḥasan b. Ḥusayn b. ʿAlī b. ʿUqba.
