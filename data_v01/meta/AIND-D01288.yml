translation:
  ja: アフマド・ブン・アル＝ムヒッブ・ムハンマド・ブン・バルカ・アル＝カーディリー。 彼の父は彼に私（サハーウィー）の朗誦とアリーの朗誦を聞かせ、彼を庇護した。彼は64年（ヒジュラ暦864年）に疫病で死去した。彼は私の息子（バドル・アッ＝ディーン・ムハンマド）の友であった。アッラーが彼ら両人に楽園を報償されますように。
  en: Aḥmad b. al-Muḥibb Muḥammad b. Balkā al-Qādirī. His father took care of him and made him listen to my recitation and to ʿAlī. He did not tarry long before he died of the plague in the year 864 AH. He was a companion to my son. May Allah compensate both of them with Paradise.
