  ja: アブドゥルアズィーズ、居住地によりアル＝ミスリー、アッ＝サッラーフーリー。多額の財産が彼のものとして見つかり、宛名の特定されていない証書類（マサーティール）によればその遺産は約3万ディーナールに達した。その大半は既に取り立て済みであったと言われる。
  en: ʿAbd al-ʿAzīz, al-Miṣrī by residence, al-Sallākhūrī. A great deal was found in his estate, so that it reached about thirty thousand dinars judging by unaddressed deeds (masāṭīr) that were found; it is said that he had already collected most of them.
