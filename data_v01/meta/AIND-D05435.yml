translation:
  ja: アリー・ブン・ムハンマド・ブン・サダカ、ヌール・アッ＝ディーン・ブン・アッ＝シャムス・アッ＝ディマシュキー。父と同じくダマスカスの有力商人の一人。862年ラジャブ月、長患いの末に体力が著しく衰えて没し、同日のうちにカースィユーン山麓の父の傍らに葬られた。神がその若さを憐れみたまえ。イブン・アッ＝ラブーディーが彼に言及している。
  en: ʿAlī b. Muḥammad b. Ṣadaqa, Nūr al-Dīn b. al-Shams al-Dimashqī, one of the notable merchants of Damascus, like his father. He died in Rajab of the year 862 after a long illness in which his strength declined greatly, and he was buried the same day beside his father at the foot of Qāsiyūn. May God have mercy on his youth. Ibn al-Labbūdī mentioned him.
