translation:
  ja: アフマド・アッ＝シハーブ・アッ＝ディマシュキー、イブン・アッ＝サーヒブとして知られる。当初は数人のアミールの書記（ディーワーン）を務め、その後、父方のいとこ（＝父方のおば〔عمة〕の子）であるアル＝クトゥブ・アル＝ハイダリーのナキーブを務めた。次いでイブン・アル＝ファルフールの代理として裁判に携わった。アル＝クトゥブが亡くなるとエジプトへ呼ばれて赴いたが、王との対話に苦悩し、仮病を使い、894年シャアバーン月3日に亡くなるまでそれを続けた。アル＝カラーファに埋葬された。
  en: Aḥmad al-Shihāb al-Dimashqī, known as Ibn al-Ṣāḥib. He was initially secretary (dīwān) to some of the amirs, then served as naqīb for his paternal cousin (his paternal aunt's son) al-Quṭb al-Khayḍarī. He then deputized in the judiciary on behalf of Ibn al-Farfūr. When al-Quṭb died, he was summoned to Egypt and went there, but he became distressed by his audience with the king and feigned illness until he died on the 3rd of Shaʿbān in the year 894 H. He was buried in al-Qarāfa.
