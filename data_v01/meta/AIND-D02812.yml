translation:
  ja: ハーリド・ブン・ヤフヤー・アル＝マグリビー、宰相アッ＝ルッバーニーの書記。敬虔な学者で、詩作と（ハディース等の）伝承があった。宰相のための書記業務から身を引き、没するまでモスクに籠った。869年に没した。我らのマグリブ出身の仲間のある者が彼の伝記を私に伝えた。
  en: Khālid b. Yaḥyā al-Maghribī, scribe of the vizier al-Lubbānī. He was a righteous and learned man, with poetry and transmission to his credit. He turned away from working as scribe for the vizier and kept to the mosque until he died in the year 869. One of our Maghribī companions gave me his biography.
