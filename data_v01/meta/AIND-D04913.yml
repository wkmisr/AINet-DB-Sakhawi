translation:
  ja: アキール・ブン・ムバーラク・ブン・ルマイサ・ブン・アビー・ヌマイイ、アル＝ハサニー、アル＝マッキー。シャリーフたちの有力者の一人であり、それどころか従兄弟のイナーン・ブン・ムガーミス・ブン・ルマイサは彼をマッカのアミール職における自身の共同統治者とし、彼は数か月そのままの地位にあって、フトバ（金曜説教）において、また日没後のザムザムにおいて、彼のために祈願がなされた。失明し、おそらく精神にも変調を来した後、825年に没した。アル＝ファースィーが彼に言及している。
  en: ʿAqīl b. Mubārak b. Rumaytha b. Abī Numayy al-Ḥasanī al-Makkī. He was one of the notables of the sharīfs; indeed his cousin ʿInān b. Mughāmis b. Rumaytha made him his partner in the emirate of Mecca, and he remained so for some months, with prayers offered for him in the Friday sermon and at Zamzam after the sunset prayer. He died in the year 825, after having gone blind and perhaps having lost his reason. Al-Fāsī mentioned him.
