translation:
  ja: アジュワド・イブン・ザーミル・アル＝ウカイリー・アル＝ジャブリー。彼は祖父のジャブルにちなんでアル＝ジャブリーと名乗り、一族もバヌー・ジャブルと呼ばれた。ナジュドがその出自で、マーリク法学派に属した。821年ラマダーンに東方のアル＝ハサーとアル＝カティーフの砂漠で生まれた。 ジャラーウナ（カルマト派の残党）の最後の支配者が彼（サイフ）の殺害を図ったとき、兄のサイフがその者に対して蜂起した。サイフが勝利してその者を殺し、前述の土地を奪取して支配した。彼は公正に統治したため、民衆は彼に従った。サイフが亡くなると、この兄弟（アジュワド）が彼を継承し、彼の王国はバーレーンとオマーンを支配するまで拡大した。その後、彼は立ち上がり、父の死後そこに定住していたサルガルのおいのフルムズ王国を奪取し、そのおいに圧力をかけた。サルガルは彼の兄弟が彼に提供していたもの、あるいはそれ以上のものを彼に提供するようになった。ナジュドの首長となった彼は、筆舌に尽くしがたいほどの多くの従者を持ち、武術にも長けており、そのために体に多くの傷を負った。彼はマーリク派のいくつかの法学分野にも精通しており、その著作の収集にも熱心だった。彼らはシーア派であったが、その統治下でスンナ派の人々が金曜礼拝や集団礼拝を行うようになり、彼は慈善と施しを伴いながら、何千人もの多くの従者と共に度々ハッジを行った。以上の内容はアッ＝サイイド・アッ＝サムフーディーが伝えたものであり、彼は私（サハーウィー）に対して彼のことを大いに称えた。サムフーディー自身、彼から多くの施しを受けている者の一人である。
  en: Ajud b. Zāmil al-ʿUqaylī al-Jabrī, named al-Jabrī after his grandfather Jabr, and his tribe was known as Banū Jabr. He was of Najdi origin and belonged to the Maliki madhhab. He was born in the desert of al-Ḥasā and al-Qaṭīf in the East in Ramaḍān of the year 821 AH. His brother Sayf rose up against the last rulers of the Jarāwina, remnants of the Qarmatians, when they attempted to kill him. Sayf was victorious, killing him and seizing the aforementioned lands, ruling them justly, so their people submitted to him. When Sayf died, this brother (Ajud) succeeded him, and his kingdom expanded to include al-Baḥrayn and ʿUmān. He then rose up and seized the kingdom of Hurmuz from Ṣarghal's nephew, who had settled there after his father's death, and he put pressure on the aforementioned nephew. Ṣarghal began to offer him what his brother used to offer him, or more. He became the leader of Najd with followers beyond description, and he was skilled in horsemanship, sustaining many wounds on
    his body because of it. He had some familiarity with branches of Maliki law and was diligent in collecting their books. Moreover, he established his judiciary among some of the Sunnis in his realm after they had been Shiites, instituting Friday prayers and congregational prayers. He performed Hajj many times with many followers, numbering thousands, accompanied by charity and generosity, among other acts. The substance of this notice was provided by al-Sayyid al-Samhūdī, who spoke to me (al-Sakhāwī) at length in his praise; he himself is among those to whom he (Ajwad) gives generously.
