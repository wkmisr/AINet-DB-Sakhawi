translation:
  ja: アフマド・ブン・アブドゥルカーディル・ブン・ムハンマド・ブン・アッ＝シャイフ・ムルタファ、アッ＝シハーブ・アン＝ナイラビー・アッ＝サーリヒー。彼はアブー・ハフス・ウマル・ブン・ムハンマド・ブン・アビー・バクル・アッ＝シャフタビーから、イブン・ウヤイナのハディースを、ムハンマド・ブン・アブドゥッラー・ブン・ヤズィード・アル＝ムクリー伝承の副本(تابع)として聴聞した。アル＝ファフルが彼（＝アブー・ハフス）を代理に立て、彼（＝アブー・ハフス）は伝承した。彼からイブン・ムーサーと我らがシャイフ（アル＝アビー）が聴聞した。我らがシャイフ（イブン・ハジャル）は自身の『ムアジャム』で彼に言及し、彼が娘のラービヤにイジャーザを与えたことを記している。
  en: Aḥmad b. ʿAbd al-Qādir b. Muḥammad, Shihāb al-Nīrabī al-Ṣāliḥī. He heard from Abū Ḥafṣ ʿUmar b. Muḥammad b. Abī Bakr al-Shaḥṭabī, who transmitted the ḥadīth of Ibn ʿUyayna via the narration of Muḥammad b. ʿAbd Allāh b. Yazīd al-Muqrī. Al-Fakhr appointed him as his deputy, and he transmitted. Ibn Mūsā and our shaykh (al-Abī) heard from him. Our shaykh (Ibn Ḥajar) mentioned him in his 『Muʿjam』, and that he granted an ijāza to his daughter Rābiʿa.
