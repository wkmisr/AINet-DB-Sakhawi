translation:
  ja: スィッディーク・ブン・アッ＝シャイフ・フサイン・ブン・アブドゥルラフマーン・ブン・アリー・アル＝フサイニー。血統および土地においてアル＝フサイニー。シャーフィイー派。その父（フサイン）は前に記述があり、その息子フサインも（記述がある）。イブン・アル＝アフダルとして知られる。父から多くを学んだ。ヒジュラ暦887年ラマダーン月に没した。70歳を超えており、存命の兄弟の中で最年長であった。
  en: Ṣiddīq b. al-Shaykh Ḥusayn b. ʿAbd al-Raḥmān b. ʿAlī al-Ḥusaynī, of al-Ḥusaynī lineage and origin, Shāfiʿī. His father (Ḥusayn) was mentioned previously, and his son is Ḥusayn. He is known as Ibn al-Ahdal. He studied extensively under his father, and died in Ramaḍān in the year 887 AH, having lived past seventy. He was the eldest of his surviving brothers.
