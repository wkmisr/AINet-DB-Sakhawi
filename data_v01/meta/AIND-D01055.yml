translation:
  ja: 92 アフマド・ブン・アリー・ブン・ムハンマド・ブン・アブドゥッラー。シャハーブ。元来ブルキーニー出身、エジプト人。カーディリー教団員。ハサン・アル＝カシュカシー・アル＝カーディリー、また一説にはイブン・アン＝ナーシフから学んだ。独身で18年間遊行し、敬虔さで有名になった。955年ズル・ヒッジャ月14日の金曜日に亡くなり、バーブ・アン＝ナスル門の近くに埋葬された。アッラーの慈悲あれ。
  en: 92 Aḥmad b. ʿAlī b. Muḥammad b. ʿAbd Allāh, al-Shihāb, originally al-Bulqīnī, al-Miṣrī, al-Qādirī. He acquired knowledge from Ḥasan al-Kashkashī al-Qādirī, and, according to some accounts, also from Ibn al-Nāṣiḥ. He devoted himself to asceticism and wandered for eighteen years, becoming renowned for his piety. He died on Friday, the fourteenth of Dhū al-Ḥijja, in the year 955, and was buried outside Bāb al-Naṣr. May God have mercy on him.
