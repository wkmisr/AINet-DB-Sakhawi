translation:
  ja: イーサー・ブン・アリー・ブン・ジャールッラー・ブン・ザーイド・ブン・ヤフヤー・ブン・ムフイー・アッ＝スンブスィー・アル＝マッキー。後述するムーサー・ブン・アフマド・ブン・ジャールッラーの従兄弟で、イブン・ザーイドとして知られる。（8）60年ズー・アル＝ヒッジャ月にマッカで没した。イブン・ファハドがその没年月を記録している。
  en: ʿĪsā b. ʿAlī b. Jār Allāh b. Zāyid b. Yaḥyā b. Muḥyī al-Sunbusī al-Makkī, paternal cousin of Mūsā b. Aḥmad b. Jār Allāh, who comes below, and known as Ibn Zāʾid. He died in Mecca in Dhū al-Ḥijja of the year (8)60. Ibn Fahd recorded his death.
