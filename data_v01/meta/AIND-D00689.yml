translation:
  ja: アフマド・ブン・フサイン・ブン・ハルド・ブン・フサイン、シハーブ・アッ＝ディーン・アル＝ハイタミー。彼はアル=ジャマール・ブン・アッ=サービクがアッ=ザイン・アッ=ザルカシーに『サヒーフ・ムスリム』の大部分を朗誦するのを聴聞した。彼（アフマド）は私（サハーウィー）に、彼（アッ=ザルカシー）が50年に亡くなったと語った。彼（アッ=ザルカシー）の伝記を参照されたい。
  en: Ahmad b. Husayn b. Khald b. Husayn Shihāb al-Dīn al-Haytamī. He heard most of Ṣaḥīḥ Muslim from al-Jamāl b. al-Sābiq, who recited it to al-Zayn al-Zarkashī. He (Ahmad) told me (al-Sakhāwī) that he (al-Zarkashī) died in the year fifty. His (al-Zarkashī's) biography should be consulted.
