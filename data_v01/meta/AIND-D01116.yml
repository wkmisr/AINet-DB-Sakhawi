  ja: アフマド・ブン・ウマル・ブン・アスラム。父と兄弟のヤフヤーについては後述する。彼（アフマド）が二人のうち年長者である、あるいはそう思われていたが、実際には彼が言及される人物であり、また彼は放縦で晩年までそうであった。
