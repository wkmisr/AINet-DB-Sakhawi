translation:
  ja: アワド・ブン・ハスブッラー・ブン・ムハーウィシュ・アル＝マッキー、同地（マッカ）のナツメヤシ商。マッカで私（サハーウィー）から聴聞した者の一人で、裕福であったが、のちに困窮した。（8）99年ラビーウ・アッ＝サーニー月にマッカで没した。
  en: ʿAwaḍ b. Ḥasb Allāh b. Muhāwish al-Makkī, the date-seller there. He was among those who heard from me (al-Sakhāwī) in Mecca; he was wealthy, then fell into poverty. He died in Rabīʿ al-Thānī of the year (8)99 in Mecca.
