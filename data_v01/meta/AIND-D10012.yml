translation:
  ja: マンスール・ブン・アリー・ブン・ウスマーン・アッ＝ザワーウィー、のちにアル＝ビジャーイー、同地（ビジャーヤ）の法学者。アブー・アル＝ハサン・アリー・ブン・アビー・ファーリスが、その兄弟の子アブー・アムル・ウスマーン・ブン・アビー・アブド・アッラー・ムハンマド・ブン・アビー・ファーリスへの忠誠誓約を拒んだとき、彼はアブー・アル＝ハサンと共に立ち上がった。彼には党派と勢力があり、ビジャーヤを独占支配するほどであったが、その後退いて両者の間に入り和解を図った。そこで諸事件が起こったが、その実態は今の私には確定できていない。もっともマクリーズィーが843年の事件記事でそれに言及している。また、彼が著名な学者アッ＝ザワーウィーその人であり、846年にチュニスで没したと言う者がいるのを目にした。彼は学者であった。
  en: Manṣūr b. ʿAlī b. ʿUthmān al-Zawāwī, then al-Bijāʾī, the jurist (faqīh) of Bijāya. When Abū al-Ḥasan ʿAlī b. Abī Fāris refused to pledge allegiance to his brother's son Abū ʿAmr ʿUthmān b. Abī ʿAbd Allāh Muḥammad b. Abī Fāris, he rose with him; he had a faction and such strength that he took sole control of Bijāya, then drew back and entered into mediating peace between the two. Events ensued whose course I have not yet been able to establish, although al-Maqrīzī alludes to them in the events of the year 843. I have seen someone say that he is al-Zawāwī the famous scholar, and that he died in the year 846 in Tunis; and he was a scholar.
