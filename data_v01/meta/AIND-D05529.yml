translation:
  ja: アリー・ブン・ムハンマド・ブン・ファトフ・アル＝マウスィリー・アル＝ハナフィー、トリポリ（タラーブルス）の居留者。846年に同地でアッ＝サラーフ・アッ＝タラーブルスィーが彼に（暗記書を）提示した者の一人で、彼はアッ＝サラーフに良い筆跡でイジャーザを書いた。アッ＝サラーフによれば、彼は四法学派に基づいてファトワーを出しており、彼ら（トリポリの人々）のもとに短期間滞在したという。
  en: ʿAlī b. Muḥammad b. Fatḥ al-Mawṣilī al-Ḥanafī, resident of Tripoli. He was among those to whom al-Ṣalāḥ al-Ṭarābulusī presented (texts) there in the year 846, and he wrote him an ijāza in a fine hand. Al-Ṣalāḥ said that he used to issue fatwās according to the four madhhabs and that he stayed with them only a short while.
