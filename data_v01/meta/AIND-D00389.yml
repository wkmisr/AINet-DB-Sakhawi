translation:
  ja: イブラーヒーム・アル＝ラムラウスィキー・アッ＝ディマシュキー・アッ＝シャーフィイー。我らがシャイフ（イブン・ハジャル）は『インバーウフ（インバーウ・アル＝グムル）』の中で、彼についてシャフィイー派の有徳な学者の一人で、篤信の士であり、書道に優れ、隠遁生活を送っていたと述べた。シャウワール月3日[ヒジュラ暦803年]に死去した。
  en: Ibrāhīm al-Lamlawsaqī al-Dimashqī al-Shāfiʿī. Our shaykh (Ibn Ḥajar) said in his book al-Inbāʾ (Inbāʾ al-Ghumr) that he was one of the virtuous scholars in the Shafi'i madhhab, possessing piety, good handwriting, and reclusiveness. He died in Shawwāl of the year 803 AH.
