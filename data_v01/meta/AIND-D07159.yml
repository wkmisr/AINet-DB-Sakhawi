translation:
  ja: ムハンマド・ブン・バルクート、ジャマール・アッ＝ディーン・ブン・アル＝ハワージャ・シハーブ・アッ＝ディーン・アル＝マキーニー、前述のアッ＝サラーフ・アフマドの父。エジプトに度々赴いた。845年シャウワール月24日木曜の夜、極度に困窮した後にマッカで没した。
  en: Muḥammad b. Barkūt, Jamāl al-Dīn b. al-Khawājā Shihāb al-Dīn al-Makīnī, the father of al-Ṣalāḥ Aḥmad, mentioned above. He went repeatedly to Egypt. He died on the night of Thursday, 24 Shawwāl 845, in Mecca, after having become extremely destitute.
