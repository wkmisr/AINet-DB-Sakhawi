translation:
  ja: ムハンマド・ブン・イスマーイール、タージュ・アッ＝ディーン・ブン・アル＝イマード・アル＝バトルニー、マグリブ出身でダマスクスの人、マーリク派。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及して言った。「カーディーのアラム・アッ＝ディーン・アル＝カフスィーに仕え、さらにはそのナキーブを務めた。その後、彼（アル＝カフスィー）の死後にタラーブルス（トリポリ）のカーディー職に就き、その後戻ってマーリク派（カーディー）の代理を務めた。職務執行において清廉で、法学のいくらかを記憶していた」。833年サファル月にペストで没した。
  en: 'Muḥammad b. Ismāʿīl, Tāj al-Dīn b. al-ʿImād al-Baṭarnī, of Maghribī origin, al-Dimashqī, the Mālikī. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: he was in the service of the qāḍī ʿAlam al-Dīn al-Qafṣī, indeed he served as his naqīb; then after the latter''s death he was appointed to the judgeship of Tripoli, then returned and deputized for the Mālikī (judge). He was upright in his conduct of office and had some fiqh at his command. He died of the plague in Ṣafar 833.'
