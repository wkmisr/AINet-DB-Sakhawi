translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・イスマーイール・アッ＝ダワーヒリー、のちにアル＝カーヒリー、アル＝ガムリー、アッ＝シャーフィイー。カイロで私（サハーウィー）から聴聞した者の一人。時に学問に従事し、ガムリー・モスクで数日間フトバを行った。告げ口と争いを好むことで知られている。
  en: ʿAbd Allāh b. Muḥammad b. Ismāʿīl al-Dawākhilī, then al-Qāhirī, al-Ghamrī, al-Shāfiʿī. He was among those who heard from me (al-Sakhāwī) in Cairo. He occasionally engaged in study and delivered the Friday sermon at the Ghamrī Mosque for some days. He is noted for a fondness for tale-bearing and stirring up strife.
