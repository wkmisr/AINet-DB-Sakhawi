translation:
  ja: アブドゥルカーディル・ブン・ムーサー・ブン・アフマド・ブン・アブドゥッラフマーン、アッ＝サラーフ・アル＝マトブーリー、のちにアル＝カーヒリー、アル＝フサイニー。先述のシハーブ・アッディーン・アフマドの兄弟。製粉所の経営と織物商を営み生計を立てていた。善良な人々や学生を好み、善行の場に好んで出席する非の打ち所のない人物であった。ブルハーン・アッディーン・アル＝バウーニー、アン＝ニザーム・ブン・ムフリフ、イブン・ザイドらからイジャーザ（学問の授権）を授かった。
  en: Abd al-Qadir b. Musa b. Ahmad b. Abd al-Rahman, al-Salah al-Matbuli, then al-Qahiri, al-Husayni. He was the brother of the aforementioned al-Shihab Ahmad. He earned his living by managing a mill and trading in cloth. He was a decent man, fond of righteous people and students, and frequently attended gatherings of goodness. He received ijaza (authorization) from Burhan al-Din al-Ba'uni, al-Nizam b. Muflih, Ibn Zayd, and others.
