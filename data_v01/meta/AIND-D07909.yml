notes:
- text: 見出しの「بن سعد بن ناصر الدين بن التاج بن الديري」は刊本どおり（規則25）。父の項 D04769・祖父の項 D03090 の見出しでは祖父＝سعد الدين سعد بن محمد、曾祖父＝الشمس محمد بن عبد الله（#AIND-D07774）であり、「ناصر الدين」「التاج」の位置は本項の見出し特有。「يقال أنه غير مرضي」＝評価句（伝聞）、訳に反映。詩の「سعدا」「لبنا」「بسنا」は固有名（サアド・ルブナー・ブスナー）と普通名詞（幸運・乳・美しさ）を掛けた語戯。
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・アブドゥルワッハーブ・ブン・サアド・ブン・ナースィル・アッ＝ディーン・ブン・アッ＝タージュ・ブン・アッ＝ダイリー・アル＝マクディスィー・アル＝ハナフィー。その父と祖父は既述。彼は芳しからぬ人物であったと言われる。アル＝バドル（アル＝バドリー）はその詩集（マジュムーウ）に彼の次の詩を書き留めた。 「トルコ人の（美しい）ガゼルは美しさで（人々に）勝り、サアド（幸運）にも勝り、ルブナー（乳の白さ）にも勝った。 私が彼に口づけを求めると彼は拒んだ。そこで私が『（お前の）出身は何か』と問うと、彼は『ブスナー（美しさの民）だ』と答えた。」
  en: 'Muḥammad b. ʿAbd al-Wahhāb b. Saʿd b. Nāṣir al-Dīn b. al-Tāj b. al-Dīrī al-Maqdisī al-Ḥanafī. His father and grandfather were mentioned above. It is said that he was not of good repute. Al-Badr (al-Badrī) recorded in his anthology (Majmūʿ) these verses of his: "A gazelle of the Turks surpassed (all) in beauty, surpassed Saʿd (good fortune) and surpassed Lubnā (milk-white). I asked him for a kiss and he refused; so I said, ''What is your kind (origin)?'' He said, ''Busnā (beauty).''"'
