translation:
  ja: フサイン・ブン・ハサン・ブン・アリー・ブン・アビー・バクル・アル＝バドル・アル＝マンスーリー、のちにアル＝カーヒリー、アッ＝シャーフィイー、アル＝アンバリー。カマール・アッ＝ディーン・ムハンマドの父。アル＝イバーディーに長年密着して師事し、同様にイブン・クルクマースにも師事した。イブン・クルクマースはバーブ・アル＝バルキッヤ地区にある自らの廟に彼を同居させた。彼は夢解釈において頭角を現した。彼は我々（サハーウィー）と共に、サーラ・イブナ・イブン・ジャマーアからハディースを聴聞した。
  en: Ḥusayn b. Ḥasan b. ʿAlī b. Abī Bakr al-Badr al-Manṣūrī, later al-Qāhirī, al-Shāfiʿī, al-ʿAnbarī. He was the father of Kamāl al-Dīn Muḥammad. He closely accompanied al-ʿIbādī for a long time, and likewise Ibn Qurqumās, who accommodated him to reside with him in his tomb-mausoleum in the Bab al-Barqiyya area. He distinguished himself in the interpretation of dreams. He also heard Hadith alongside us (including al-Sakhawi) under Sara, the daughter of Ibn Jama'ah.
