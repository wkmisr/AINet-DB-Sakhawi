translation:
  ja: ヤフヤー・ブン・アリー・ブン・ヤフヤー、アッ＝シャラフ、アル＝ムハージリー・アル＝クルディー、サンフート出身の家系でカイロの人、ハナフィー派。既出のムハンマドとイスマーイールの父。カーリウ・アル＝ヒダーヤに学んだ者の一人で、アル＝ブーティージーをはじめとする大物たちに親しく仕え、諸職に就いた。多くのアミールのための記録と帳簿づけの正確さで信頼されていた。852年に没した。
  en: Yaḥyā b. ʿAlī b. Yaḥyā, al-Sharaf, al-Muhājirī al-Kurdī, of Sanhūt origin, the Cairene, the Ḥanafī, father of Muḥammad and Ismāʿīl, both mentioned above. He was among those who studied under Qāriʾ al-Hidāya, attached himself closely to al-Būtījī and other eminent men, and was enrolled in salaried posts. He was trusted by many of the amirs for the accuracy of his record-keeping and registering. He died in the year 852.
