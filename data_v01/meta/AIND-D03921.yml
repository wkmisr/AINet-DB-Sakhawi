translation:
  ja: アブドゥッサラーム・ブン・アフマド・ブン・アブドゥルアズィーズ・アル＝マダニー・アッ＝シャーフィイー。祖父の名（イブン・アブドゥルアズィーズ）で知られる。カイロに来て、我らがシャイフ（イブン・ハジャル）やその他の者たちに聴聞し、少し学問に従事し、アル＝ビカーイーと交わった。860年以降、あるいはその前後に没した。
  en: ʿAbd al-Salām b. Aḥmad b. ʿAbd al-ʿAzīz al-Madanī al-Shāfiʿī, known by his grandfather's name (Ibn ʿAbd al-ʿAzīz). He came to Cairo, heard from our shaykh (Ibn Ḥajar) and others, studied a little, and kept company with al-Biqāʿī. He died after the year 860 AH or thereabouts.
