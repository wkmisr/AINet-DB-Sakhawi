translation:
  ja: アスンバーイ・アッ＝ザーヒル・ジャクマク、アル＝ジャマーリーおよびアッ＝サーキーとしても知られる。彼の師（アッ＝ザーヒル・ジャクマク）が彼をイムラ・アシャラ（十人長）に昇進させ、その後その師（ジャクマク）の息子が彼を第二ダワーダール（ドワーダール・サーニー）に任じた。しかし彼が失脚すると逃亡し、数日間身を隠した。その後拘束され、失業者（バッタール）としてエルサレムへ赴くよう命じられ、860年シャアバーン月に死去するまでその状態が続いた。
  en: Asanbāy al-Ẓāhir Jaqmaq, also known as al-Jamālī and al-Sāqī. His master (al-Ẓāhir Jaqmaq) promoted him to amir of ten, and then his master's son appointed him second dawādār. When he suffered misfortune, he fled and hid for days. He was then arrested and ordered to proceed to Jerusalem as an unemployed person (baṭṭāl), a state in which he remained until his death in Shaʿbān of the year 860 H.
