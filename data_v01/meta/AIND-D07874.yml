translation:
  ja: ムハンマド・ブン・アッラー（原文のまま）・アル＝ジャジーニー、ハナフィー派、アル＝キトア（切れ端）とあだ名された。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及して言う、「彼は、頭の硬さ、極めて悪筆であること、みすぼらしい身なり、無名であることにもかかわらず、（法学の）枝葉問題をそらで挙げることにおいてハナフィー派で最もよく知る者の一人であった」。816年ラマダーン月に没した。
  en: 'Muḥammad b. Allāh [sic] al-Jajjīnī, the Ḥanafī, nicknamed al-Qiṭʿa. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: "He was among the Ḥanafīs most knowledgeable in recalling the subsidiary rulings (furūʿ), despite the rigidity of his mind, his extremely bad handwriting, his shabby appearance and his obscurity." He died in Ramaḍān [8]16.'
