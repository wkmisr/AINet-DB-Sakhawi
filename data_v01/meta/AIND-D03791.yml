translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・ムハンマド・ブン・アブドゥルラフマーン・ブン・ウマル・ブン・イブラーヒーム。ザイン。アル＝アスディー（バヌー・アサドに比定される）。ダマスカス出身。シャフィーイー派。のちに言及されるウマルの父。イブン・アル＝ジャームースとして知られる。アル＝ジャマール・ブン・アッ＝シャラーイヒーからイブン・サムウーンの『アマーリー』を聴聞した。また、アル＝イッズ・ブン・ファハドと面会し、彼は本人から少し読誦した。同様に他の者たちも彼から学問を得て、彼は（イジャーザを）与えた。彼は父と同様に、ダマスカスの公証人の一人であった。873年に死去。アッラーの慈悲あれ。
  en: Abd al-Rahman b. Muhammad b. Muhammad b. Abd al-Rahman b. Umar b. Ibrahim, Zayn, al-Asadi (attributed to Banu Asad), al-Dimashqi, al-Shafi'i. The father of Umar, who is mentioned below. Known as Ibn al-Jamus. He heard the Amali of Ibn Sam'un from al-Jamal b. al-Shara'ihi. Al-Izz b. Fahd met him and read a little to him, and others also took from him and he granted licenses. He was, like his father, one of the witnesses of Damascus. He died in the year 873 AH.
