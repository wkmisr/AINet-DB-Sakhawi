translation:
  ja: ムハンマド・ブン・ウスマーン・ブン・アビー・バクル・ブン・アブド・アッラー・ブン・ズハイラ・ブン・アフマド・ブン・アティーヤ・ブン・ズハイラ、アブー・アル＝ファトフ、アル＝クラシー、アル＝マッキー、イブン・ズハイラ。母はザビードのシャリーファで、名はサラーマ・ビント・ムハンマド。832年に生まれ、（8）36年に、彼の親族アル＝ムヒッブ・ムハンマド・ブン・アビー・ハーミド・イブン・ズハイラにイジャーザを与えた人々が彼にもイジャーザを与えた。（8）78年ラマダーン月にマッカで没した。
  en: Muḥammad b. ʿUthmān b. Abī Bakr b. ʿAbd Allāh b. Ẕahīra b. Aḥmad b. ʿAṭiyya b. Ẕahīra, Abū al-Fatḥ, al-Qurashī, al-Makkī, Ibn Ẕahīra; his mother was a sharīfa of Zabīd named Salāma bint Muḥammad. He was born in the year 832, and in the year [8]36 those who had licensed his relative al-Muḥibb Muḥammad b. Abī Ḥāmid b. Ẕahīra granted him an ijāza as well. He died in Mecca in Ramaḍān of the year [8]78.
