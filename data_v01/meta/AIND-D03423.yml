translation:
  ja: طغرق（トゥグルク）。ドルカディル・ウルスのトルコマンの末裔。ホムスの代理官（ナーイブ）。ヒジュラ暦838年ズー・アル＝カアダ月、アラブとの戦闘で戦死。彼の死後、その息子が後を継いだ。
  en: Ṭughruq, of the descendants of Dulkadir (Dulghādir) al-Turkumānī, governor (nāʾib) of Homs. He was killed in Dhu al-Qaʿdah, 838 AH, in a battle with the Arabs, and his son succeeded him in office.
