translation:
  ja: ムハンマド・ブン・アフマド・ブン・アッ＝サブウ（これは彼の父のラカブである）、アル＝クラシー・アル＝カーヒリー・アル＝ハナフィー、ファフルッディーン・ブン・シハーブッディーン、前述のカースィム・ブン・アフマドの祖父。（8）01年、あるハナフィー派の者たちのイジャーザにおいて証人となった。
  en: Muḥammad b. Aḥmad b. al-Sabʿ (this being his father's laqab), al-Qurashī al-Qāhirī al-Ḥanafī, Fakhr al-Dīn b. Shihāb al-Dīn, the grandfather of the aforementioned Qāsim b. Aḥmad. He acted as witness for some Ḥanafīs in an ijāza in the year (8)01.
