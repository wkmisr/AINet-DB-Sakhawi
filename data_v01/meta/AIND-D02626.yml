translation:
  ja: ハサン・ブン・ムハンマド・ブン・アッ＝ザイン・アブドゥルアズィーズ・ブン・アブドゥルワーヒド・ブン・ウマル・ブン・アイヤード・アル＝アンサーリー、マグリブ系の出自でマディーナ出身、マーリキー派。後述するフサインの兄弟。少し前に言及されたアッ＝バドル・ハサン・ブン・ウマルの従兄弟。兄弟と同様にイブン・カマールとして知られる。『アッ＝リサーラ』を暗記し、834年にアル＝ジャマール・アル＝カーザルーニーから聴聞した。そして死去した…
  en: Ḥasan b. Muḥammad b. al-Zayn ʿAbd al-ʿAzīz b. ʿAbd al-Wāḥid b. ʿUmar b. ʿAyyād al-Anṣārī, of Maghribi origin, resident of Medina, Mālikī. He is the brother of Ḥusayn, who is mentioned below, and the cousin of al-Badr Ḥasan b. ʿUmar, mentioned shortly above. Like his brother, he is known as Ibn Kamāl. He memorized al-Risāla and heard hadith from al-Jamāl al-Kāzarūnī in the year 834 AH. He died...
