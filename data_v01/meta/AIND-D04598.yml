  note:
    ja: '父 ＝ #AIND-D07917「محمد بن عبد الوهاب بن علي بن يوسف بن الحسن بن محمود فتح الدين أبو الفتح بن التاج الأنصاري الزرندي المدني الحنفي والد أحمد وسعد وسعيد وعبد الله ومحمد المذكورين في محالهم … وولي قضاء المدينة … مات في ذي القعدة سنة ثمان وثلاثين」（本項主を子として明記）。内容検証で 仮番号 NEW90-07（取り下げ）（「本伝なし」として発行）から差し替え。クンヤ部 #AIND-D11027「أبو الفتح بن عبد الوهاب بن علي بن يوسف … الأنصاري الزرندي المدني الحنفي واسمه محمد … مات … في يوم الأحد رابع عشر ذي القعدة سنة ثمان وثلاثين」も同一人物（二重立項）。'
