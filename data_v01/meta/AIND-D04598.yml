translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アブドゥルワッハーブ、アル＝ジャマール・ブン・アル＝カーディー・ファトフ・アッ＝ディーン・アビー・アル＝ファトフ、アル＝アンサーリー・アッ＝ザランディー・アル＝マダニー・アル＝ハナフィー。五人兄弟の一人で、三人のムハンマドの父。（8）62年に没した。
  en: ʿAbd Allāh b. Muḥammad b. ʿAbd al-Wahhāb, al-Jamāl b. al-Qāḍī Fatḥ al-Dīn Abī al-Fatḥ, al-Anṣārī al-Zarandī al-Madanī al-Ḥanafī, one of the five brothers and the father of the three Muḥammads. He died in (8)62.
