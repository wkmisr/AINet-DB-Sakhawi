translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・アフマド、ラカブはアッ＝シハーブ、ニスバはアル＝ウクビー、アル＝ヤマニー、シャフィイー派。823年に生まれたと記されている。847年にカイロに来て、アッ＝ザイン・アル＝ブーティージーに師事し、彼のもとファーディリーヤ学院に住み、彼によって知られるようになった。我らがシャイフ（イブン・ハジャル）からディクテーションを書き取り、また『シャルフ・アル＝アルフィーヤ（アルフィーヤ注釈）』などを彼（同シャイフ）から学んだ。イブン・ハッサンなどからも学んだ。自筆で多くの書物を書き、イブン・アル＝ジュライースとは一時親しく、彼が亡くなるまでその庇護下にあった。その後、故郷に近いタイズに移り住み、そこに滞在した。毎年そこからメッカ巡礼を行い、慎み深く、全体的に協調性のある素晴らしい人物であった。ヒジュラ暦895年ムハッラム月にメッカで死去した。神が彼と我々を慈悲深くあらせるように。
  en: Aḥmad b. Ibrāhīm b. Aḥmad, with the laqab al-Shihāb and nisbahs al-ʿUqbī, al-Yamānī, and of the Shāfiʿī madhhab. He was born, as mentioned, in the year 823 H. He arrived in Cairo in 847 H and remained in close discipleship to al-Zayn al-Būtījī, residing with him at the Fāḍiliyya (madrasa), and became known through him. He wrote down dictations from our shaykh (Ibn Ḥajar), and also studied from him (Ibn Ḥajar) a commentary on al-Alfiyya and other works. He also studied from Ibn Ḥassān and others. He wrote many things in his own hand and was for a time closely associated with Ibn al-Jurays, remaining under his patronage until his death. After him (Ibn al-Jurays's death), he moved to Taʿizz, which is near his hometown, and resided there. From there, he performed the Hajj every year. He was a fine man, calm and generally cooperative, with a modest disposition. He died in Mecca in Muḥarram of the year 895 H. May God have mercy on him and us.
