- text: corpus で「بن طوق」を持つ項はもう1件、#AIND-D08561「21 محمد بن محمد بن أحمد بن طوق البدر أو الشمس بن الجمال الطواويسي الكاتب . ولد سنة سبع وثلاثين وسبعمائة … وكان يباشر ديوان الأسرى والأسوار … ومات في سابع عشري ذي الحجة سنة إحدى . وذكره في أنبائه أيضا ، وتبعه المقريزي في عقوده」（repo 未収録）だけである。家名 ابن طوق と「الكاتب」は共通するが、父名（أحمد／محمد）・ニスバ（النصيبي／الطواويسي）・没年（810／801）が違う。同族か、別の典拠から入った同一人物の二重立項かは原文からは決まらない＝relation を立てず候補として記す（ISSUES §D172-6）。
