translation:
  ja: アブドゥッラー・アル＝ミクナースィー・アル＝マグリビー、先祖の一人アフマドにちなんでイブン・アフマドとして知られる。敬虔さとスーフィズムが勝った学者であった。一群の人々が彼から学び、その中にアブー・アブドゥッラー・アル＝ファウリーがいる。〔8〕40年以降に没した。
  en: ʿAbd Allāh al-Miknāsī al-Maghribī, known as Ibn Aḥmad after one of his ancestors. He was a scholar in whom piety and Sufism predominated. A number of people learned from him, among them Abū ʿAbd Allāh al-Fawrī. He died after [8]40.
