translation:
  ja: アハマド・ブン・ラビーア・ブン・アルワーン・アッ＝ディマシュキー。クルアーン朗誦の師範であり、その奥義に通じていた。イブン・アッ＝ラバーンらから学んだ。この分野におけるリーダーシップは彼で終わり、一方で砂占いとジン召喚の修行に耽っていたため、無名であった。シャーバーン月（ヒジュラ暦803年）に60歳を過ぎて死去した。我らがシャイフ（イブン・ハジャル）は自身の『インバー・アル＝グムル』の中で彼について述べている。
  en: Aḥmad b. Rabīʿa b. ʿAlwān al-Dimashqī, the Qurʾān reciter, one of the masters of recitation and knowledgeable in its subtleties. He acquired knowledge from Ibn al-Labbān and others. The leadership in this art in Damascus ended with him. Despite this, he remained obscure due to his involvement in geomancy (ḍarb al-mandal) and the summoning of jinn. He died in Shaʿbān of a year ending in three (e.g., 803 H), having passed sixty years of age. Our shaykh (Ibn Ḥajar) mentioned him in his work 『Inbāʾ al-Ghumr』.
