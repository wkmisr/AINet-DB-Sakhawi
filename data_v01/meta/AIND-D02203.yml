translation:
  ja: バッティーフ・ブン・アフマド・ブン・アブド・アル＝カリーム・アン＝ナシーフ・アル＝ウマリー。メッカの隊長（カーイド、軍事指揮官）の一人。855年ジュマーダー・アル＝アーヒラ月にジッダで死去し、メッカに運ばれて埋葬された。隊長たちの中でも有力かつ富裕な人物であった（末尾「ممن عشرته بخمسة عشر」は原文が難解）。
  en: Baṭṭīkh b. Aḥmad b. ʿAbd al-Karīm al-Naṣīḥ al-ʿUmarī was one of the quwwād (military commanders) of Mecca. He died in Jidda in Jumādā al-Ākhira 855 H and was carried to Mecca, where he was buried. He was among the prominent and wealthy of the commanders (the closing phrase "ممن عشرته بخمسة عشر" is obscure in the source).
