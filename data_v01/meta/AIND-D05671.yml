translation:
  ja: アリ・ブン・ナスル・アル＝カーヒリー・アル＝ファウワール。バルジュワーン街の入り口の市場（に店を構えていた）。人々から（敬虔な人物として）信奉されていた一人。ズル＝ヒッジャ（ハジュの月）の858年に急死し、バーブ・アン＝ナスル（勝利門）の外に埋葬された。アル＝ムニールがその死を記録している。
  en: ʿAlī b. Naṣr al-Qāhirī al-Fawwāl, (who operated) in the market at the head of Barjawān Quarter. He was one of those in whose piety people believed. He died suddenly in Dhu al-Ḥijjah in the year 858 and was buried outside Bāb al-Naṣr. His death was recorded by al-Munīr.
