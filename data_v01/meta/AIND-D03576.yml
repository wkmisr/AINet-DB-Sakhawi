translation:
  ja: アブドゥル・ラフマーン・ブン・アフマド・ブン・ウマイル・アル＝マダニー。彼地（マディーナ）のファッラーシュ（モスクなどの給仕・絨毯敷き職）であり、ダルビイー（Darbīyī）として知られる。マディーナにて私（サハーウィー）から（ハディースを）聴聞した者の一人である。彼は先の人物（前項）と同一人物であり、二つの箇所のうち一方で祖父の名に誤りが生じたのだと思う。
  en: ʿAbd al-Raḥmān b. Aḥmad b. ʿUmayr al-Madanī, the attendant (farrāsh) there [in Medina], known as Darbīyī. He is among those who heard [ḥadīth] from me in Medina. I think he is the former (the preceding entry), a mistake having occurred in one of the two places regarding his grandfather's name.
