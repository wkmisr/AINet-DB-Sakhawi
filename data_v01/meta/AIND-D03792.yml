translation:
  ja: アブドゥル・ラフマーン・ブン・ムハンマド・ブン・ムハンマド・ブン・アブドゥル・カリーム。サマンヌードを起源とし、ダミエッタを本拠とする。後述するアシール・アッ＝ディーン・ムハンマドの兄弟。ダミエッタのマルカブ（監視塔）の下にあるイブン・カイイム・モスクにおいて、神の唱念（ズィクル）のために精神的弟子（ムリード）たちを集める活動を兄弟から引き継いでそこに留まり、善き人として言及されている。
  en: ʿAbd al-Raḥmān bin Muḥammad bin Muḥammad bin ʿAbd al-Karīm, of Samannūdī origin and Damietta residence, the brother of Aṣīl al-Dīn Muḥammad, who is mentioned below. He succeeded his brother in residing at the Ibn Qayyim Mosque under the Marqab in Damietta, gathering disciples (murīdīn) for the remembrance of Allah (dhikr), and he is remembered well.
