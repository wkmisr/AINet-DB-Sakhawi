translation:
  ja: アフマド・ブン・ムハンマド・ナーシル・アッ＝ディーン、イブン・アミーン・アル＝フクムとして知られる。エジプトおよびバフナサーウィーヤ地方のいくつかの町で裁判（フクム）の代理職（ナーイブ）を務めた。839年に、彼に発症した麻痺（ファーリジュ）という病のためしばらく活動を絶った後、死去した。
  en: Aḥmad b. Muḥammad Nāṣir al-Dīn, known as Ibn Amīn al-Ḥukm. He served as a deputy (nāʾib) in the judiciary in Egypt and in several towns of the Bahnasāwīya region. He died in 839 H, after being incapacitated for a period by an illness that caused him paralysis (fālij).
