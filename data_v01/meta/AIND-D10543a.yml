translation:
  ja: ユースフ・ブン・ムハンマド・ブン・アル＝ハーッジ・ユースフ、ハマー出身でダマスクスの人、イブン・アッ＝サーイグおよびイブン・アル＝ファルダナク（ファーにファトハ、ラーにスクーン、ダールにファトハ、ヌーンにスクーン、末尾はカーフ）として知られる。806年に生まれた。ビカーイーが彼の項を書き出した。
  en: Yūsuf b. Muḥammad b. al-Ḥājj Yūsuf, of Ḥamā origin, Damascene, known as Ibn al-Ṣāʾigh and as Ibn al-Fardanak. Born in 806. Al-Biqāʿī excerpted his entry.
