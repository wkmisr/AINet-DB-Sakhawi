translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ザヒーラ・ブン・アフマド・アティーヤ・ブン・ザヒーラ、アブー・サイード・アル＝クラシー・アル＝マッキー。先祖と同じくイブン・ザヒーラとして知られる。母はアーイシャ・ビント・アフマド・ブン・ムハンマド・ブン・アフマド・ブン・アブドゥルムウティー・アル＝アンサーリー。マッカで生まれ、そこで育ち、そこで叔父のアル＝ジャマール・イブン・ザヒーラから聴聞した。（7）95年に、イブン・スィッディーク、イブン・ファルフーン、アル＝マラーギー、アッ＝シハーブ・アフマド・ブン・アリー・アル＝フサイニー、イブン・アブドゥルハーディーの二人の息子、イブン・アル＝ムンジャーの娘、アル＝イラーキー、アル＝ハイサミー、イブン・アル＝クワイクほかが彼にイジャーザを与えた。（8）15年にザバド（ザビード）で没し、その訃報はラマダーン月にマッカへ届いた。
  en: Muḥammad b. Abī Bakr b. ʿAbd Allāh b. Ẓahīra b. Aḥmad ʿAṭiyya b. Ẓahīra, Abū Saʿīd al-Qurashī al-Makkī, known like his forebears as Ibn Ẓahīra. His mother was ʿĀʾisha bt. Aḥmad b. Muḥammad b. Aḥmad b. ʿAbd al-Muʿṭī al-Anṣārī. He was born in Mecca and grew up there, and there he heard from his paternal uncle al-Jamāl Ibn Ẓahīra. In the year (7)95 he was granted ijāza by Ibn Ṣiddīq, Ibn Farḥūn, al-Marāghī, al-Shihāb Aḥmad b. ʿAlī al-Ḥusaynī, the two sons of Ibn ʿAbd al-Hādī, the daughter of Ibn al-Manjā, al-ʿIrāqī, al-Haythamī, Ibn al-Kuwayk and others. He died in the year (8)15 at Zabad (Zabīd), and the news of his death reached Mecca in Ramaḍān.
