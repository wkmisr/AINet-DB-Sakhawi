    ja: '「يتكسب بالتجارة لنفسه ثم لغيره كابن المرجوشي」＝ابن المرجوشي のために商業に従事した（仕えた型、規則56）。通称索引 #AIND-D12723「ابن المرجوشي محمد بن حسن بن علي وأبوه وابنه الذي كحل وقطع لسانه في سنة خمس وتسعين」＝この通称は محمد بن حسن بن علي المرجوشي（ID-Master TMP-P-000708「محمد بن البدر حسن المرجوشي」、#AIND-D02603「حسن بن علي البدر المرجوشي والد محمد الآتي … تاجرا في الشرب」の子。サハーウィーの隣人、D12713・D13809「جارنا」）とその父・子の3人が帯びる。本項主（885没）の雇い主としては محمد بن حسن（TMP-P-000708）が最有力だが、3人のうち誰かを原文から確定できず、既登録 TMP-P に cert で寄せない規則60(e) により #NEEDID（ISSUES §D162-2）。【集約 2026-11-08】オーケストレーター決定7（TMP-P-000708 cert medium）は、集約者が索引を読んだ結果、適用を保留した: ニスバ索引 #AIND-D12013「المرجوشي … والبدر حسن بن علي وابنه محمد ويقال له ابن المرجوشي وله ابن قطع لسانه وكحل في سنة خمس وتسعين」は呼び名を محمد بن حسن に当てるが、通称索引 #AIND-D12723「ابن المرجوشي محمد بن حسن بن علي وأبوه وابنه الذي كحل وقطع لسانه في سنة خمس وتسعين」は同じ見出しの下に父と子（895年に存命）も挙げる＝同家に同じ呼び名の候補が残る（規則61(c)・62）。裁定まで #NEEDID のまま（要判断 ★2）。'
