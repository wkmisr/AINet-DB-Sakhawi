translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アフマド・ブン・ハラフ、アッ＝シャムス・ブン・アル＝ブルハーン、原籍はニーン、のちカイロの人、マーリク派。その父と兄弟のアフマドは前述した。アル＝フトゥーヒーとして知られる。クルアーンを読み、合唱朗誦隊（アジュワーク）で朗誦していたのち、商業で生計を立てるようになった。はじめは自身のため、次いでイブン・アル＝マルジューシーやイブン・アル＝ジュンディーの婿といった他人のためである。彼（イブン・アル＝ジュンディーの婿）のためにジッダへ旅し、885年の二つのラビーウ月のいずれかに同地で最期を迎えた。神が彼を憐れみ、赦したまわんことを。
  en: Muḥammad b. Ibrāhīm b. Aḥmad b. Khalaf, al-Shams b. al-Burhān, of Nīnī origin, then of Cairo, the Mālikī. His father and his brother Aḥmad have been mentioned above. He is known as al-Futūḥī. He read the Qurʾān and, after having recited in the choral groups (al-ajwāq), came to earn his living by trade, first for himself and then for others such as Ibn al-Marjūshī and the son-in-law of Ibn al-Jundī. He travelled for him to Jidda, and his death came there in one of the two Rabīʿ months of the year 885. May God have mercy on him and pardon him.
