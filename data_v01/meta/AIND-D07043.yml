- text: '転送見出し（原文「مضى فيمن جده عبد الله بن عبد الرحمن بن عبد القادر」による）。転送先は #AIND-D06703「محمد بن أحمد بن عبد الله بن عبد الرحمن بن عبد القادر القاضي شمس الدين أبو عبد الله الدفري الأصل القاهري المالكي」（未受領。ナサブ・ラカブ・ニスバ一致、ニスバ索引 #AIND-D11641 とも整合）。見出しの「الماضي」は本項主自身（既出の人物）を指し、直後の「مضى فيمن جده …」と同旨（ニスバ索引 #AIND-D11641「… وأما جده أحمد فمن أواخر ذاك القرن」により父 أحمد は立項されていない）。【集約】校閲時の「父を指す」読みを訂正（内容A M）。'
