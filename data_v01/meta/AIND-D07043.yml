translation:
  ja: ムハンマド・ブン・アフマド・アッ＝シャムス・ブン・アル＝カーディー・アッ＝シハーブ・アッ＝ダファリー・アル＝カーヒリー、既出の人物。祖父がアブドゥッラー・ブン・アブド・アッ＝ラフマーン・ブン・アブド・アル＝カーディルである者たち（の部）で既述。
  en: Muḥammad b. Aḥmad al-Shams b. al-Qāḍī al-Shihāb al-Dafarī al-Qāhirī, the one mentioned above. He has come above among those whose grandfather is ʿAbd Allāh b. ʿAbd al-Raḥmān b. ʿAbd al-Qādir.
