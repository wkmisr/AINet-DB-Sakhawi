notes:
- text: '#AIND-D05335（本バッチ B122）「علي بن فتح بن أوحد النور الخانكي حفيد شيخ الخانقاه السرياقوسية كان … مات … سنة تسعين」の「شيخ الخانقاه السرياقوسية」は、名に أوحد を含み年代（孫が890没）も合うため本項主（815年までシャイフ、D07940 では「شمس الدين محمد بن أوحد」）を指す可能性があるが、D05335 のナサブは字義どおりには祖父＝أوحد であり、B122 校閲は祖父を 取り下げた仮番号 B122-P08「أوحد الخانكي」として発行した。規則26により本項では relation を立てず note 留め（§D119-4 付記）。曾孫 #AIND-D08152「محمد بن علي بن فتح بن أوحد … حفيد شيخ الخانقاه」も同家。【集約 2026-10-19】D08152「الماضي أبوه وجده」の「جده」が指しうる既出項は本項 D07144 だけなので、D05335 側の grandfather を #AIND-D07144（cert medium）に差し替え、取り下げた仮番号 B122-P08 は取り下げた（内容A・B M）。本項側には片方向で十分なので relation を立てない。'
  lang: ja
