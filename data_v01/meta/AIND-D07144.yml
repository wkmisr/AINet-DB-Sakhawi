translation:
  ja: ムハンマド・イブン・アウハド。812年にアッ＝シャムス・アル＝カルユービーが没した後、スィルヤークースのナースィリー・ハーンカーのシャイフ職に就いた。その（カルユービーの）存命中は彼の代理（ナーイブ）であった。815年の初めまでシャイフ職にとどまり、その後アル＝ムヒッブ・アル＝アシュカルにその職を譲った。（空白）に没した。
  en: Muḥammad Ibn Awḥad. He was appointed to the shaykhship of the Khānqāh al-Nāṣiriyya at Siryāqūs after the death of al-Shams al-Qalyūbī in 812, having been his deputy during his lifetime. He remained in the shaykhship until the beginning of 815, then relinquished it in favour of al-Muḥibb al-Ashqar. He died in (blank).
