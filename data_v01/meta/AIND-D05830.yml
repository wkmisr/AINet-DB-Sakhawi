  note:
    ja: '「ممن سمع على الولوي السنباطي」。師 ＝ #AIND-D08853「محمد بن محمد بن عبد اللطيف بن إسحاق بن أحمد بن إبراهيم الولوي أبو البقاء … المحلي المولد ثم السنباطي ثم القاهري المالكي … ويعرف بقاضي سنباط」（787年生、861年没、マーリク派大カーディー。corpus で「الولوي السنباطي」は同人を指す用例が多数: 「ناب في القضاء عن الولوي السنباطي」等。索引 #AIND-D11736「السنباطي الولي محمد بن محمد ابن عبد اللطيف」）。同じ「ولي الدين السنباطي المالكي」を名乗る #AIND-D07869（محمد بن عبد الله … ويلقب حصيرم、881年没、代理判事で「ليس بثقة」）も存在するため cert medium（規則26）。初版の #NEEDID を解消。'
