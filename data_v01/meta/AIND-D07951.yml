translation:
  ja: ムハンマド・ブン・ウスマーン・ブン・アリー、アッ＝サーリヒー、アル＝アッラーフ（飼料商）。イブン・アッ＝ダリールとして知られる。794年にアブド・アッ＝ラフマーン・ブン・ムハンマド・イブン・アッ＝ラシードとアル＝イマード・アブー・バクル・ブン・アフマド・イブン・アブド・アル＝ハーディーから、その翌年にアフマド・ブン・ムハンマド・ブン・ラーシド・ブン・ハトリーシャー、アブド・アッラー・イブン・ハリール・アル＝ハラスターニー、アフマド・ブン・イブラーヒーム・ブン・ユースフから聴聞した。伝承を行い、イブン・ファハドらの優れた学者たちが彼から聴聞した。サーリヒーヤのアッ＝シャルカスィーヤ近くの店で生計を立てていた。思うに（8）50年より前に没した。
  en: Muḥammad b. ʿUthmān b. ʿAlī, al-Ṣāliḥī, al-ʿAllāf (the fodder-seller), known as Ibn al-Ḍarīr. In the year 794 he heard from ʿAbd al-Raḥmān b. Muḥammad Ibn al-Rashīd and al-ʿImād Abū Bakr b. Aḥmad Ibn ʿAbd al-Hādī, and in the following year from Aḥmad b. Muḥammad b. Rāshid b. Khaṭlīshā, ʿAbd Allāh Ibn Khalīl al-Ḥarastānī and Aḥmad b. Ibrāhīm b. Yūsuf. He transmitted, and the learned, such as Ibn Fahd and others, heard from him. He earned his living in a shop near al-Sharkasiyya in al-Ṣāliḥiyya. He died, I think, before [8]50.
