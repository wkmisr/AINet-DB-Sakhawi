translation:
  ja: ムハンマド・ブン・アリー・ブン・ウマル、アッ＝シャムス・アル＝バグダーディー・アル＝ハンバリー・アッ＝ザイーム、ダマスクス在住。750年代（7）5X年にバグダードで生まれ、失明し、イエメン・インド・ヒジャーズ・カイロなどの諸国を遍歴した。そこ（カイロ）で（8）14年ズー・アル＝ヒッジャ月に没した。彼には美点があった。アル＝マクリーズィーが『ウクード』で彼に言及し、彼から一つの逸話を伝えている。
  en: Muḥammad b. ʿAlī b. ʿUmar, al-Shams al-Baghdādī al-Ḥanbalī al-Zaʿīm, resident of Damascus. He was born in the 750s (seven hundred fifty-odd) in Baghdad; he lost his sight and travelled through the lands, such as Yemen, India, the Hijaz and Cairo. He died there (in Cairo) in Dhū al-Ḥijja of the year [8]14, and he had merits. Al-Maqrīzī mentioned him in his ʿUqūd and related an anecdote on his authority.
