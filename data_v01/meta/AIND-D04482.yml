translation:
  ja: アブドゥッラー・ブン・アブドゥッラー、アル＝ジャマール、アッ＝ルーミー、アル＝ハナフィー。サルグトムシーヤ学院の寄留者。ジャーニバキーヤ学院でアル＝アミーン・アル＝アクサラーイーのもとイブン・アッ＝サーアーティーの『マジュマウ』を読み、彼から教授の許可を得た。彼（アル＝アミーン）は本人を「有徳にして博学、碩学にして明敏、精緻にして堅実な人」と評し、その（許可）の日付をヒジュラ暦833年ラビーウ・アル＝アーヒル月と記した。
  en: ʿAbd Allāh b. ʿAbd Allāh al-Jamāl al-Rūmī al-Ḥanafī, resident of the Ṣarghatmashiyya. He read the Majmaʿ of Ibn al-Sāʿātī with al-Amīn al-Aqṣarāʾī at the Jānibakiyya, who authorized him to teach and described him as "the virtuous, the most learned, the erudite, the perceptive, the meticulous, the accomplished", dating it in Rabīʿ al-Ākhir of the year 833.
