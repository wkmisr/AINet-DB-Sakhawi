translation:
  ja: アリー・ブン・ムハンマド・ブン・アビー・アル＝ファドル・ブン・アリー、アル＝アラー・ブン・ジャラール・イブン・アッ＝ラッダーディー、ハナフィー派、アル＝ムブタリー。少し前に先述した（曾祖父にあたる）父の祖父（アル＝アラー）の曾孫。父とともにアッ＝タキー・アッ＝シュムンニー、アル＝アラム・アル＝ブルキーニーらのもとで聴聞し、さらに私（サハーウィー）からも聴聞した。892年ラビーウ・アル＝アウワル月に30歳を超えたところで没した。神が彼に楽園をもって報いたまわんことを。
  en: ʿAlī b. Muḥammad b. Abī al-Faḍl b. ʿAlī, al-ʿAlāʾ b. Jalāl Ibn al-Raddādī, al-Ḥanafī al-Mubtalī; his father's grandfather was mentioned shortly before. Together with his father he heard from al-Taqī al-Shumunnī, al-ʿAlam al-Bulqīnī and others, and indeed he heard from me (al-Sakhāwī). He died in Rabīʿ I 892, having passed thirty; may God recompense him with Paradise.
