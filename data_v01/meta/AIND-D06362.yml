translation:
  ja: クトル・バク・アル＝フサーミー・アル＝マンジャキー、（主人は）シャームの副王マンジャク・アル＝ユースフィー。アッ＝ザーヒル・バルクークの治世の有力なアミールの一人となり、（8）02年にヤンブウで没した。アル＝マクリーズィーらが没年を記している。
  en: Quṭlū Bak al-Ḥusāmī al-Manjakī, (mamlūk of) Manjak al-Yūsufī, viceroy of Syria. He became one of the leading amirs of the reign of al-Ẓāhir Barqūq, until he died at al-Yanbūʿ in the year (8)02. Al-Maqrīzī and others recorded his death.
