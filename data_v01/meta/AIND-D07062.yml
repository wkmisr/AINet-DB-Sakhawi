translation:
  ja: ムハンマド・ブン・アフマド・アブー・アブドゥッラー・アル＝ジャバルティー。法学者にして学者で、カーディーのアフマド・ブン・アビー・バクル・アン＝ナーシリーについて法学を修め、ザビードの裁判においてカーディーのムワッファク・アッ＝ディーンの代理を務めた。人々は、彼がその（裁判の）ために座しているのだと知ると、その峻厳さのゆえに彼を避けたものだった。前述の師の死の前、（8）14年頃に没した。
  en: Muḥammad b. Aḥmad Abū ʿAbd Allāh al-Jabartī. He was a learned jurist who studied fiqh with the qāḍī Aḥmad b. Abī Bakr al-Nāshirī and deputized for the qāḍī Muwaffaq al-Dīn in the judicial affairs of Zabīd; when people learned that it was he who was sitting for that, they avoided him because of his harshness. He died before the death of his aforementioned shaykh, around the year (8)14.
