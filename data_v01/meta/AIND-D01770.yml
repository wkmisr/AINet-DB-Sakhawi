translation:
  ja: アフマド・アッ＝シハーブ・アル＝マグリビー・アッ＝サンハージー・アル＝マーリキー。彼は優れて有能な、諸学に通じたイマーム（碩学）で、アル＝アズハルなどで教授し、多くの学者が彼から益を得た。855年ラビーウ・アル＝アウワル月9日日曜日に死去した。アッラーの慈悲あれ。
  en: Aḥmad al-Shihāb al-Maghribī al-Ṣanhājī al-Mālikī. He was an excellent, accomplished, and versatile imam (leading scholar) who taught at al-Azhar and elsewhere, and scholars benefited greatly from him. He died on Sunday, the 9th of Rabīʿ al-Awwal in the year 855 H. May God have mercy on him.
