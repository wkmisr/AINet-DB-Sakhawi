translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・イーサー・ブン・マタル・ブン・アリー・ブン・ウスマーン。シャハーブ・アッ＝ディーン、アブー・アル＝カシム。ディヤー・アッ＝ディーン・アブー・イスハーク・ブン・ジャマール・アッ＝ディーン・アブー・アブドゥッラー・ブン・イマード・アッ＝ディーンの息子。イブン・ファハドは彼に言及し、彼（伝記対象者）が19年に彼ら（複数の学生）にイジャーザを与えたと述べたが、それ以上は言及していない。
  en: Aḥmad b. Ibrāhīm b. Muḥammad b. ʿĪsā b. Maṭar b. ʿAlī b. ʿUthmān, Shihāb al-Dīn Abū al-Qāsim, son of Ḍiyāʾ al-Dīn Abū Isḥāq b. Jamāl al-Dīn Abū ʿAbd Allāh b. ʿImād al-Dīn. Ibn Fahd mentioned him, stating that he (the subject) granted ijāza to them (unnamed students) in the year nineteen, without adding further details.
