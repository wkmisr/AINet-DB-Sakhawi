translation:
  ja: アブド・アッ＝ラティーフ・ブン・ムハンマド・ブン・シャー・ルフ・ブン・ティームール・レンク。父を殺してその後を襲ったが、ひと月も経たぬうちに叔父が彼に先んじて彼を殺した。それは854年のことで、父の項で示したとおりである。
  en: ʿAbd al-Laṭīf b. Muḥammad b. Shāh Rukh b. Tīmūrlank. He killed his father and took his place, but his uncle forestalled him before a month was complete and killed him; that was in the year 854, as I indicated in (the entry of) his father.
