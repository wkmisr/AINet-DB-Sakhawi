translation:
  ja: ウスマーン・ブン・フサイン・アル＝ジャズィーリー（ジームにファトハ、ついでザーイにカスラ、アル＝ジャズィーラに因む）、のちアル＝カーヒリー、アル＝ハンバリー。バイバルスィーヤのムアッズィンにしてその門前の仕立屋。後出のムハンマドの父。善良で、学問とその徒を愛し、人に親しみ、自らの務めに専念する人であった。私（サハーウィー）のもとで『ムスリム』の数講分を聴聞した。880年近くに、しばらく中風（半身不随）で臥した後に没した。60歳は超えていたと思う。
  en: ʿUthmān b. Ḥusayn al-Jazīrī (with fatḥa on the jīm and kasra on the zāy, after al-Jazīra), then al-Qāhirī, al-Ḥanbalī, the muezzin at al-Baybarsiyya and the tailor at its gate, the father of Muḥammad, who is mentioned below. He was a good man, fond of learning and its people, affable and attentive to his own affairs. He heard some sessions of Muslim from me (al-Sakhāwī). He died close to 880 after having been confined by paralysis for a period, and I think he had passed sixty.
