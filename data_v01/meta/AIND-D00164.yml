translation:
  ja: イブラーヒーム・ブン・アブドゥッラー・アッ＝ラッファー。我らがシャイフ（イブン・ハジャル）がその『アンバーウ』において述べるところによれば、彼はミスルにあるアムル・モスクに近いザウィーヤに居住しており、人々は彼に厚い信仰を寄せており、彼についての奇跡が伝えられている。彼はジュマーダー・アル＝ウーラー月804年に亡くなった。
  en: Ibrāhīm b. ʿAbd Allāh al-Rifāʾ. Our shaykh (Ibn Ḥajar) stated in his 『Inbāʾ』 that he was residing in a zāwiya in Miṣr near the Mosque of ʿAmr. People had great faith in him, and miracles were recounted about him. He died in Jumādā al-Ūlā in the year 804 AH.
