translation:
  ja: ムハンマド・ブン・アフマド・ブン・ユースフ・アッ＝シャムス・アル＝ガムリー（点付きのガイン）。アブー・アル＝バラカート・ダーウード・アッ＝タキー・ブン・ナスルッラーの父。アッ＝シハーブ・アッ＝ザーヒドに随従し、少しばかり学問に携わり、ジャマーリーヤが開設された当初に、そこで我らが師〔イブン・ハジャル〕のもとに〔席を得て〕入った。これはアル＝ジャラール・アル＝クムスィーが私に語ったことで、彼は彼の友であった。なお、後に高名なアル＝ワーリー、アッ＝シャムス・ムハンマド・ブン・ウマル・アル＝ガムリーが出てくるが、おそらく彼と混同されよう。
  en: Muḥammad b. Aḥmad b. Yūsuf al-Shams al-Ghamrī (with the dotted ghayn), the father of Abū al-Barakāt Dāwūd al-Taqī b. Naṣr Allāh. He kept the company of al-Shihāb al-Zāhid, studied a little, and was enrolled at al-Jamāliyya under our shaykh [Ibn Ḥajar] when it was first opened. Al-Jalāl al-Qumṣī, who was his companion, told me this. Al-Shams Muḥammad b. ʿUmar al-Ghamrī, the famous al-Wālī, will come below, and he may be confused with him.
