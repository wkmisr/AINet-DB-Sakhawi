translation:
  ja: ムハンマド・ブン・アブドゥッラー、アッ＝シャムス、アブー・アブドゥッラー、アル＝バアダーニーを出自とするマディーナの人。アル＝ミスキーンとして知られ、アル＝アウフィーとも呼ばれる。791年にマディーナで生まれ、そこで育ち、797年にイブン・スィッディークから『サヒーフ』をわずかな欠落を伴って聴聞した。私にイジャーザを授けた。858年に没した。
  en: Muḥammad b. ʿAbd Allāh, al-Shams Abū ʿAbd Allāh, of Baʿdānī origin, the Medinan; known as al-Miskīn and also called al-ʿAwfī. He was born in Medina in the year 791, grew up there, and heard the Ṣaḥīḥ from Ibn Ṣiddīq in the year 797 with minor omissions. He granted me an ijāza. He died in the year 858.
