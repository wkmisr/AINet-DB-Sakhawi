    ja: 原文「والد الناصري محمد سبط ناصر الدين ابن العطار أمه عائشة」の「سبط …」「أمه عائشة」は息子 محمد の属性（D07465「أمه عائشة ابنة الأمير ناصر الدين محمد بن العطار」、D13333「تزوجها سودون دقماق … واستولدها الأول ناصر الدين محمد」）。ناصر الدين ابن العطار は息子の母方祖父＝本項主の妻の父であり、本項主の祖父ではない。岳父関係は他項（D07465・D13333）による補完のため cert medium（統一規則23）。
- id: r3
  type: kin
  subtype: spouse
  active: m5
  passive: AIND-D03212
  cert: medium
  note:
    ja: 「أمه عائشة」は息子 محمد の母（本項主の母ではない）。عائشة＝#AIND-D13333（عائشة ابنة الأمير ناصر الدين محمد … بن العطار、「تزوجها سودون دقماق وطيبغا البدري الخاصكيين واستولدها الأول ناصر الدين محمد」）で、本項主の妻。婚姻は D13333 の記述による補完のため cert medium（統一規則23）。
