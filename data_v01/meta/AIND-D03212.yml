translation:
  ja: スードゥン・ドゥクマーク・アル＝ハースキー。アン＝ナースィリー・ムハンマドの父。このムハンマドはナースィル・アッ＝ディーン・イブン・アル＝アッタールの母方の孫で、その母はアーイシャである。彼は小作農（フェッラーヒーン）の一団に殺害された。
  en: Sūdūn Duqmāq al-Khāṣṣakī, the father of al-Nāṣirī Muḥammad, the maternal grandson of Nāṣir al-Dīn Ibn al-ʿAṭṭār, whose mother was ʿĀʾisha. He was killed by a group of his peasants.
