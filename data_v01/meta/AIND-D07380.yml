translation:
  ja: ムハンマド・ブン・ダーウード・アル＝バーズィリー・アル＝クルディー、のちにアル＝ハマウィー、シャーフィイー派。タブリーズへ旅してそこに約10年間滞在し、そこで学問に励んで卓越した。その後ハラブに来て、次いでアル＝クサイルに（赴き）、そこで説教（フトバ）を行い、結婚し、彼女（妻）をハマーに移して定住した。ハマーの教授（ムダッリス）、また理性諸学（アクリーヤート）における同地のシャイフとなり、法学（フィクフ）にも卓越していた。困窮の後に地位が上がり、娘をアル＝バーリズィー家に嫁がせた。彼は現在、895年の時点で存命であり、50歳を超えたと言われている。
  en: Muḥammad b. Dāwūd al-Bāzilī al-Kurdī, then al-Ḥamawī, the Shāfiʿī. He travelled to Tabrīz and stayed there for about ten years, studying there and excelling. Then he came to Aleppo, then to al-Quṣayr, where he preached (as khaṭīb) and married, and he moved her (his wife) to Ḥamāh and settled there. He became its teacher (mudarris) and its shaykh in the rational sciences, together with excellence in jurisprudence. He rose in standing after poverty and married his daughter into the house of al-Bārizī. He is at present alive, in the year 895 AH, and is said to have passed fifty.
