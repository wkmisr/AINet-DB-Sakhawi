translation:
  ja: ハムザ・ブン・アリー、アル＝イッズ・アル＝バヒスターウィー、アル＝ハラビー、のちにアル＝ディマシュキー、アル＝サーリヒー、ハナフィー派。ダマスクスの裁判代理官の一人であり、その中でも最も優れた者であったが、のちに裁判実務から身を引いた。容姿端麗で、自らの学派に精通していた。ラビー・アル＝アウワル月864年に没した。裁判代理官の中に彼に匹敵する後継者はいなかった。アッラーの慈悲あれ。イブン・アル＝ラブーディーが彼について言及している。
  en: Ḥamza b. ʿAlī, al-ʿIzz al-Bahistāwī, al-Ḥalabī, then al-Dimashqī, al-Ṣāliḥī, al-Ḥanafī. He was one of the deputies of judgment (nāʾib al-ḥukm) in Damascus, indeed the most prominent of them, but he later withdrew from judicial practice. He was of handsome appearance and well-versed in his school of law. He died in Rabīʿ al-Awwal in the year 864, leaving no equal among the deputies of judgment. May Allah have mercy on him. Ibn al-Labūdī mentioned him.
