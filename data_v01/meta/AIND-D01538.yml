translation:
  ja: アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムフリフ、アッ＝シハーブ・アブー・アッ＝ディヤーウ、説教師（アル＝ハティーブ）アッ＝シャムスの子。アル＝ハーリスィー・アン＝ナーブルスィー、後にアル＝マクディスィー・アル＝ハンバリー。イブン・アッ＝ルンマーフとして知られる。私（サハーウィー）から学んだ者の一人。
  en: Aḥmad b. Muḥammad b. Muḥammad b. Mufliḥ, al-Shihāb Abū al-Ḍiyāʾ, son of the preacher (al-khaṭīb) al-Shams; al-Ḥārisī al-Nābulusī, then al-Maqdisī al-Ḥanbalī, known as Ibn al-Rummāḥ. He was among those who took (knowledge) from me (al-Sakhāwī).
