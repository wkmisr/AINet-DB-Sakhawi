translation:
  ja: シャーヒーン・アッ＝サアディー・アッ＝タワーシー・アッ＝ラーラー。アル＝アシュラフ（・シャアバーン）とその後継者たちに仕え、アン＝ナースィル（・ファラジュ）の治世に立身し、バイバルスィーヤの管財職（ナザル）やその他の職に就いた。（8）08年に没した。我らがシャイフ（イブン・ハジャル）がその没年を記録しているが、私（サハーウィー）は彼が少し前に挙げたシャーヒーン・アル＝ハサニーと同一人物であり、二つの没年のいずれかが誤りであると考える。
  en: Shāhīn al-Saʿdī al-Ṭawāshī al-Lālā. He served al-Ashraf (Shaʿbān) and those after him, rose to prominence under al-Nāṣir (Faraj), and held the trusteeship (naẓar) of the Baybarsiyya and other posts. He died in the year [8]08. Our shaykh (Ibn Ḥajar) recorded his death, but I think he is the Shāhīn al-Ḥasanī mentioned shortly before, and that one of the two dates is wrong.
