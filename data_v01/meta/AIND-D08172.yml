translation:
  ja: ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・ムハンマド、アッ＝シャムス・ブン・アル＝イマード・アル＝ビルビースィー、後述の我らが友アッ＝シャムス・ムハンマドの父。善良で名門の出であった。（8）74年ジュマーダー・アル＝アーヒラ月にカイロの息子のもとで没し、サイード・アッ＝スアダーのハウシュ（墓域）に葬られた。神よ彼を憐れみ給え。
  en: Muḥammad b. ʿAlī b. Muḥammad b. Muḥammad, al-Shams b. al-ʿImād al-Bilbīsī, the father of our companion al-Shams Muḥammad, who will be mentioned. He was a good man of noble stock. He died at his son's (house) in Cairo in Jumādā al-Ākhira of the year [8]74 and was buried in the ḥawsh of Saʿīd al-Suʿadāʾ, may God have mercy on him.
