- text: '孫: #AIND-D04043 عبد الغفار بن الشمس محمد（収録済み、grandfather #AIND-D08172 で閉合）・#AIND-D09158 محمد بن محمد بن محمد بن علي … الشمس بن الشمس بن العماد البلبيسي（収録済み、853生）。「وكان خيرا أصيلا」は人物評（訳のみ）。'
