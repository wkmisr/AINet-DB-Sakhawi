translation:
  ja: イブラーヒーム・ブン・カースィム・ブン・サイード・ブン・ムハンマド・ブン・ムハンマド・アル＝ウクバーニー・アル＝マグレビ・アル＝マーリキー。次項に記述のあるムハンマドの兄弟。彼（ムハンマド）と彼らの父はティルムサーンのカーディー職を拝命した者の一人であった。ヒジュラ暦871年にペストで亡くなった。彼から学んだマグリブの人々の一部が、その日付を私に教えてくれた。イブン・アズムは彼の父をクンヤのアブー・アル＝カースィムと呼んだ。彼の祖父は、マグリブ・アル＝アクサーの王の手を接吻する慣習を最初に導入した人物である。
  en: Ibrāhīm b. Qāsim b. Saʿīd b. Muḥammad b. Muḥammad al-ʿUqbānī al-Maghribī al-Mālikī, brother of Muḥammad (mentioned below). He (Muḥammad) and their father were among those who held the qadi-ship of Tilimsān. He died of the plague in the year 871 AH. Some of those who studied under me from the Maghrib dated it for me. Ibn ʿAzm referred to his father by the kunyah Abū al-Qasim. His grandfather was the first to introduce the custom of kissing the hand of the kings of al-Maghrib al-Aqṣā.
