translation:
  ja: ムハンマド・ブン・サダカ、ファトフ・アッ＝ディーン・アル＝ムヌーフィー・アッ＝シャーフィイー。イブン・アティーヤとして知られる。我らがシャイフ（イブン・ハジャル）やその他の者の代理として、彼の郷里の裁判職（カダー）を務めた。アル＝イッズ・ブン・アブド・アッ＝サラームは彼を聡明で善良、経験豊かだと評していた。
  en: Muḥammad b. Ṣadaqa, Fatḥ al-Dīn al-Munūfī al-Shāfiʿī, known as Ibn ʿAṭiyya. He served as deputy for our shaykh (Ibn Ḥajar) and others in the judgeship of his home town, and al-ʿIzz b. ʿAbd al-Salām used to describe him as intelligent, good and experienced.
