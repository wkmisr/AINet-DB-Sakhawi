translation:
  ja: アフマド・ブン・アブー・バクル・ブン・アル＝フサイン・ブン・ウマル。クンヤはアブー・アル＝ナスルで、アル＝ザイン（＝ザイン・アッ＝ディーン・アル＝マラーギー）の息子。アル＝マラーギー、アル＝マダニー、シャーフィイー派。我らがシャイフ、アブー・アル＝ファトフ・ムハンマド（アル＝マラーギー）の兄弟であり、そのアブー・アル＝ファトフの方が年長であったと思われる。彼は父（アル＝ザイン・アル＝マラーギー）、アル＝アラム・スライマーン・ブン・アフマド・アッ＝サッカー、アル＝イラーキー、アル＝ハイサミー、イブン・ハーティムら多くの人物から（兄と共に）聴聞した。その一部はヒジュラ暦791年の出来事である。私（サハーウィー）の考えでは、彼の没年は本世紀（9世紀）中と思われるが、要確認である。
  en: Aḥmad b. Abī Bakr b. al-Ḥusayn b. ʿUmar, Abū al-Naṣr, b. al-Zayn al-Marāghī al-Madanī al-Shāfiʿī, was the brother of our shaykh Abū al-Fatḥ Muḥammad (al-Marāghī), who is presumed to be the elder. He heard, together with his brother, from his father (al-Zayn al-Marāghī), al-ʿAlam Sulaymān b. Aḥmad al-Saqqā, al-ʿIrāqī, al-Haythamī, Ibn Ḥātim, and others. Some of this occurred in the year 791 AH. In my opinion, his death occurred in this century, but this requires verification.
