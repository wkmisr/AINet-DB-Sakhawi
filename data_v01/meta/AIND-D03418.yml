translation:
  ja: Ṭarabāy al-Ashrafī Qāytbāy。彼の兄弟の Tanam が、896年にジッダの職務を終えた後に旅立つ際、彼を（ジッダの）代理に任命した。そこで彼はジッダに滞在し、次いでメッカに移り、翌年（897年）に彼らの後任が到着するまでそこに留まった。彼はクルアーンの朗誦に優れ、タワーフ（カアバ神殿の鼎巡）を巧みに行い、勇敢で侠気のある人物であった。
  en: Ṭarabāy al-Ashrafī Qāytbāy. His brother Tanam appointed him as deputy upon his departure after settling the affairs of Jeddah in the year 896 AH. Thus, he resided there (in Jeddah), and then in Mecca, until their replacement arrived in the following year (897 AH). He is among those who excel in recitation, perform the circumambulation (tawāf) beautifully, and behave with chivalry.
