translation:
  ja: ハムザ・ブン・アブドゥルガニー・ブン・ヤアクーブ。マムルーク登録書記の一人。父親の称号（ファフル）の縮小辞であるイブン・フハイラの名で知られる。後述のアブドゥッラザークの父親である。
  en: Ḥamza b. ʿAbd al-Ghanī b. Yaʿqūb, one of the scribes of the Mamluks (kātib al-mamālīk). He was known as Ibn Fukhayra, which is the diminutive of his father's title (al-Fakhr). He is the father of the below-mentioned ʿAbd al-Razzāq.
