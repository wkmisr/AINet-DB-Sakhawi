translation:
  ja: ハサン・ブン・アル＝ハンマーミー、バドル・アッ＝ディーン。アル＝ムフヤウィー・ブン・ジブリールの後任としてエルサレム（バイト・アル＝マクディス）のシャーフィイー派判事（カーディー）職に就いたが、多くの欠点とともに言及された。カイロに来た後、890年ジュマーダー・アッ＝サーニヤの末期に再びエルサレムに戻り、判事職に復帰した。
  en: Ḥasan b. al-Ḥamāmī, Badr al-Dīn. He held the office of Shāfiʿī judgeship in Jerusalem after al-Muḥyawī b. Jibrīl, though he was mentioned with much deficiency. He came to Cairo, then returned to Jerusalem at the end of Jumādā al-Thāniya in the year [8]90 to resume his judgeship.
