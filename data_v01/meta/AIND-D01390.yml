translation:
  ja: アフマド・ブン・ムハンマド・ブン・アブドゥルワッハーブ・ブン・アリー・ブン・ユースフ、アル＝シャハーブ（「輝ける星」のラカブを持つ）、判事ファトフッディーン・アブルファトフ・アル＝アンサーリー・アル＝ザランディー・アル＝マダニー・アル＝ハナフィー。サアドとサイードとアブドゥッラーとムハンマドの兄弟であり、彼とサイードは彼ら兄弟の中で最も優れていた。864年ラマダーン月に死亡し、男子の跡継ぎはいなかった。
  en: Aḥmad b. Muḥammad b. ʿAbd al-Wahhāb b. ʿAlī b. Yūsuf, al-Shihāb (a laqab meaning "shooting star"), son of the judge Fatḥ al-Dīn Abū al-Fatḥ al-Anṣārī al-Zarandī al-Madanī al-Ḥanafī. He was the brother of Saʿd, Saʿīd, ʿAbd Allāh, and Muḥammad, and he and Saʿīd were the most excellent of their brothers. He died in Ramadan of the year 864 H. He left no male offspring.
