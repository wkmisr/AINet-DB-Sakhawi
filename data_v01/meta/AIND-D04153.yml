translation:
  ja: アブドゥルカーディル・ブン・アッ＝シャムス・アリー・ブン・ムハンマド・ブン・アブドゥッラー・アル＝ハウラーニー・アッ＝リダーイー・アル＝ヤマーニー・アッ＝シャーフィイー。サラーハ家（バイト・サラーハ）の出身。彼は897年ズー・アル＝ヒッジャ月6日にマッカ（メッカ）で私（サハーウィー）と面会し、私が伝承する『アル＝ムサルサル（首尾一貫伝承）』を聴聞した後、両『サヒーフ』の一部および『アッ＝シファー』を私の前で朗読した。私は彼とその兄弟にイジャーザ（伝承認可）を授けた。
  en: ʿAbd al-Qādir b. al-Shams ʿAlī b. Muḥammad b. ʿAbd Allāh al-Khawlānī al-Riḍāʾī al-Yamānī al-Shāfiʿī. From the house of Ṣalāḥ. He met me on the 6th of Dhū al-Ḥijjah in the year 897 AH in Mecca, and read to me a portion of the two Ṣaḥīḥs and al-Shifāʾ after he had heard the musalsal [ḥadīth] from me, and I granted an ijāzah to him and to his brother.
