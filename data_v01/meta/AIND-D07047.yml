notes:
- text: '転送見出し（原文末尾「فيمن جده عمر」による）。転送先は #AIND-D06792「محمد بن أحمد بن عمر الشمس أبو عبد الله بن الشهاب أبي العباس القاهري السعودي الحنفي」（祖父 عمر・الشمس・السعودي・الحنفي が一致）。同名の #AIND-D06787「محمد بن أحمد بن عمر بن محمد بن عمر الشمس النحريري ثم القاهري الشافعي … ويعرف بالسعودي」はシャーフィイー派＝別人（D06792 本文にも両者の混同を戒める記述あり）。なお D06792 末尾「وسيأتي محمد بن أحمد بن محمد وأظنه هذا الصواب في جده عمر」により、祖父名 محمد の別見出し（#AIND-D06961 السعودي الحنفي）との同一人物の可能性が示唆されている（D07073 の転送先問題と共通）。'
