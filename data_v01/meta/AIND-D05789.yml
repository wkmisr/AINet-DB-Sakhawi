translation:
  ja: ウマル・ブン・アフマド・ブン・アブド・アッ＝ラフマーン・ブン・アリー・アッ＝ライミー・アル＝マッキー。父と祖父は前述、兄弟ムハンマドは後述。幼少のとき、（私の）3回目のマッカ隣住の間に私からいくつかのものを聴聞した。両親とともにマディーナを参詣した。
  en: ʿUmar b. Aḥmad b. ʿAbd al-Raḥmān b. ʿAlī al-Raymī al-Makkī; his father and grandfather were mentioned above, and his brother Muḥammad will be mentioned below. As a child he heard some things from me during the third mujāwara in Mecca, and he visited Medina with his parents.
