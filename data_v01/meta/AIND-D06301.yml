translation:
  ja: カーニム・クシャイル、アレクサンドリアの副官（ナーイブ）。881年に没した。彼の副官職への就任はカジュマースの後であった。彼のダワーダールに対する苦情が多くなり、ついに（ダワーダールの）召喚が書面で命じられたため、伝えられるところでは、（ダワーダールは）急いで首を吊ったという。
  en: Qānim Qushayr, deputy (nāʾib) of Alexandria. He died in the year 881. His appointment to the deputyship came after Qajmās. Complaints against his dawādār multiplied to the point that a summons for him was written, whereupon, as was said, he (the dawādār) hastened to hang himself.
