notes:
- text: '見出し末尾の「النحاس」は、本人の生業（銅細工師）とも、ダマスクスの商家「ابن النحاس」の家名とも読める。同家には #AIND-D05940「373 عمر بن محمد بن أبي بكر بن إسماعيل السراج بن الخواجا الشمس بن النحاس الدمشقي . ممن نبغ في التجارة وجاور بمكة مرارا بسببها … سنة إحدى وستين」とその父（既登録 TMP-P-001409「الخواجا الشمس محمد بن أبي بكر بن إسماعيل بن النحاس الدمشقي」、Note に「#AIND-D06635 … はナサブ相違」）がいて、マッカに出入りしたダマスクスの商人である点は本項主と合うが、ナサブ（محمد بن أحمد بن أبي بكر／محمد بن أبي بكر بن إسماعيل）が違う。原文からは決まらないので、persName full に見出しどおり残し、職（state）も家名（shuhrah）も立てていない（ISSUES §D172-6）。初版の visit event（مكة）は teacher relation 内の event と二重なので除去した。'
  lang: ja
  type: editorial
