translation:
  ja: ムハンマド・ブン・アブドゥッラー・アル＝ムクリー、タイッズのムフティーの一人。相続分割法と算術に通じ、それ（相続分割法）をアル＝ジャマール・ムハンマド・ブン・アビー・アル＝カースィム・アッ＝ディラースィーのもとで修めた者の一人。839年に没した。アル＝アフィーフが彼に言及している。
  en: Muḥammad b. ʿAbd Allāh al-Muqrī, one of the muftīs of Taʿizz. He was knowledgeable in the law of inheritance and arithmetic, and was among those who studied it (the law of inheritance) under al-Jamāl Muḥammad b. Abī al-Qāsim al-Ḍirāsī. He died in [8]39. Al-ʿAfīf mentioned him.
