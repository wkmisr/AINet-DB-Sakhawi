translation:
  ja: ヤシュバク・アン＝ナースィリー、〔ナースィル・〕ファラジュの〔マムルーク〕。主人の後しばらく諸アミールに仕え、次いでザーヒル・タタルが彼をスルタン家に戻してハーッサキーとし、次いでザーヒル・ジャクマクが十人長のアミール職を授け、次いでラアス・ナウバの一人とし、次いでマンスール〔・ウスマーン〕がタブルハーナのアミールとし、次いでアシュラフ・イーナールが第二ラアス・ナウバとした。859年サファル月に長患いの末、70歳近くで没した。放縦であったと言われる。神が彼を赦したまえ。
  en: Yashbak al-Nāṣirī, mamluk of (al-Nāṣir) Faraj. After his master he served the amirs for a time; then al-Ẓāhir Ṭaṭar returned him to the sultan's household and made him a khāṣṣakī; al-Ẓāhir Jaqmaq granted him an emirate of ten and then made him one of the ruʾūs al-nuwab; al-Manṣūr made him an amir of ṭablkhānāh; and al-Ashraf Īnāl made him second raʾs nawba, until he died in Ṣafar 859 after a long illness, nearing seventy. He was said to have been dissolute.
