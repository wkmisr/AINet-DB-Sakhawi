translation:
  ja: ファーリス。ダマスクスの城塞副官（城代）で、ロードス遠征に際してダマスクスから出陣した派遣部隊（サルハ）の司令官。アル＝フィシータルの戦いで額に負傷して正気を失い、そのまま衰弱し続けて、帰還の途上、海上で没した。それは847年ラジャブ月のことであった。
  en: Fāris, deputy of the citadel in Damascus and commander of the contingent (sarḥa) that set out from Damascus on the Rhodes expedition. He received a wound to his forehead at the battle of al-Fishītal that deprived him of his reason, and he remained debilitated by it until he died at sea on the return journey, in Rajab of the year 847.
