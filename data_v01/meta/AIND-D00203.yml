translation:
  ja: イブラーヒーム・ブン・アリー・アル＝バーリー・アッ＝ディマシュキー。証人。アル＝ジャウザ・モスクのイマーム。イブン・ウマイラから『マシュヤハト・アル＝ファフル』の第一巻を聴聞した。ダマスクスの公証人の一人であった。ヒジュラ暦811年ズルヒッジャに、50歳を超えて亡くなった。我らがシャイフ（イブン・ハジャル）は彼の伝記を『インバーウ・アル＝グムル』で言及した。
  en: Ibrāhīm b. ʿAlī al-Bārī al-Dimashqī, the witness and imām of Jawza Mosque. He heard the first part of Mashyakhat al-Fakhr from Ibn Umayla and was one of the upright witnesses in Damascus. He died in Dhū al-Ḥijja in the year 811 AH, being over fifty years old. Our shaykh (Ibn Ḥajar) mentioned him in his work 『Inbāʾ al-Ghumr』.
