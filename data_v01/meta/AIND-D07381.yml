translation:
  ja: ムハンマド・ブン・ダーウード・アル＝バドラーニー。その地方、すなわちアル＝マンズィラ、ミニヤト・バドラーンおよびその周辺のシャイフで、アフマドとアリーの父。ヒジュラ暦898年の巡礼期にマッカで私（サハーウィー）に会った者の一人で、二人（の息子）のうち年長の方が私のもとで読誦し、私は二人にイジャーザを与えた。彼らはいずれもイブン・ダーウードとして知られる。
  en: Muḥammad b. Dāwūd al-Badrānī, the shaykh of that district — al-Manzila, Minyat Badrān and their surroundings — and the father of Aḥmad and ʿAlī. He was one of those who met me (al-Sakhāwī) in Mecca during the pilgrimage season of the year 898 AH; the elder of the two [sons] read to me, and I granted both of them an ijāza. Each of them is known as Ibn Dāwūd.
