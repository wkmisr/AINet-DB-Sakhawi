notes:
- text: '通称は「ويدعى بشوربة」の بـ が前置詞なので شوربة（索引 #AIND-D11276「شوربة محمد بن تغرى برمش」で確認。初版の「بشوربة」を是正）。「الجندي」は軍人（兵士）を示す呼称でニスバとして保持（ID-Master に職登録なし）。「لا يذكر وإنما أثبته لبيتوتة」＝本来記すに値しないが家柄（بيتوتة）ゆえに立項した、との著者注記。関連項（relation は立てず note のみ、規則23）: 母 فرح（D13540）の娘「الشريفة فاطمة」＝#AIND-D13532「فاطمة ابنة الشريف الفخرى أم محمد بن جاجق ، وأمها فرح ابنة ناظر الجيش كريم الدين عبد الكريم」は本項主の（異父）姉妹、その子 #AIND-D07296 محمد بن جاجق は甥にあたる（D13532・D07296 は本項主を名指ししない）。'
