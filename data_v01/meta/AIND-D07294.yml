translation:
  ja: ムハンマド・ブン・タグリー・ビルミシュ、ナースィル・アッ＝ディーン、アル＝ジュンディー（軍人）、シュールバ（スープ）と呼ばれた。父はムアイヤド（シャイフ）のマムルークでハマーのハージブ（侍従）の一人、母はナーズィル・アル＝ジャイシュ（軍務監）のカリーム・アッ＝ディーン・アブド・アル＝カリームの娘ファラフ・ハートゥーンで、我らがシャイフ（イブン・ハジャル）の妻の姉妹である。彼は817年に生まれ、875年サファル月に没してバイバルスィーヤの墓域（ハウシュ）に葬られた。彼は自らに対してひどく放埒で、本来言及するに値しないが、私は家柄のゆえに彼を記した。彼が悔い改めていたことを願う。アッラーが彼と我々を赦し給うように。
  en: Muḥammad b. Taghrī Birmish, Nāṣir al-Dīn, al-Jundī (the soldier), called Shūrba. His father was a Muʾayyadī (mamlūk of al-Muʾayyad Shaykh), one of the chamberlains (ḥujjāb) of Ḥamāh, and his mother was Faraḥ Khātūn, daughter of the nāẓir al-jaysh Karīm al-Dīn ʿAbd al-Karīm and sister of our shaykh's (Ibn Ḥajar's) wife. He was born in 817. He died in Ṣafar 875 and was buried in the Ḥawsh al-Baybarsiyya. He was extremely profligate towards himself and would not deserve mention; I have recorded him only on account of his family. May he have repented; may God pardon him and us.
