translation:
  ja: ファラジュ・アブドゥッラー・アッ＝シャラービー・アル＝ハバシー・アル＝マッキー、商人。複数の家屋などを所有した。814年にアッ＝ザイン・アル＝マラーギーのもとで『サヒーフ』の読了（会）を聴聞した者の一人。847年にミナーに給水所（サビール）を建てたが完成しなかった。853年ラビーウ2月にマッカで没した。
  en: Faraj ʿAbd Allāh al-Sharābī al-Ḥabashī al-Makkī, the merchant, owner of houses and other property. He is one of those who heard the completion of al-Ṣaḥīḥ under al-Zayn al-Marāghī in the year 814. In 847 he built a public fountain (sabīl) at Minā which was not completed. He died in Mecca in Rabīʿ II 853.
