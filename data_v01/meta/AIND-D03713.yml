translation:
  ja: アブド・アッラフマーン・ブン・ウマル・ブン・イーサー・アッ＝サマンヌーディー。彼の父は後述される。彼の同郷人である我らの同伴者アル＝ジャラール・アッ＝サマンヌーディー・アル＝ミーカーティーが彼から（学問を）受け継ぎ、また彼（アブド・アッラフマーン）は父から（学問を）受け継いだ者の一人である。
  en: ʿAbd al-Raḥmān bin ʿUmar bin ʿĪsā al-Samannūdī, whose father is mentioned below. Our companion, his fellow countryman al-Jalāl al-Samannūdī al-Mīqātī, took (tradition) from him, and he (ʿAbd al-Raḥmān) is among those who took it from his father.
