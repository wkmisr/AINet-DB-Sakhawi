  ja: フダイル（縮小形）・ブン・アブド・アッ＝サラーム・ブン・アッ＝シャイフ・アビー・アル＝ファトフ・ムハンマド・ブン・ムハンマド・タキー・ブン・ムハンマド・ブン・ルーズバ・アル＝カーザルーニー・アル＝マダニー。イブン・タキーとして知られる。マディーナで私（サハーウィー）から聴聞した者の一人。
