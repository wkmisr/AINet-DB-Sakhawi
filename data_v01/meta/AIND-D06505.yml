notes:
- text: '転送見出し（原文末尾「وسمي المقريزي والده يحيى وسيأتي」による）。転送先は #AIND-D09520「محمد بن يحيى أو إبرهيم بن عبد الرحمن أبو الفضل بن أبي زكريا بن أبي محمد التلمساني المغربي المالكي ويعرف بابن الإمام وهو بكنيته أشهر . من بيت شهير ارتحل في سنة عشر للحج … ذكره المقريزي في عقوده هكذا」（未受領）。祖父名 عبد الرحمن・クンヤ أبو الفضل・通称 ابن الإمام・ニスバ・学派が一致し、父名の異説（يحيى／إبراهيم）と المقريزي の『عقود』への言及は相手側にある＝本項に固有の内容はない（規則66 (k) の例外に当たらない）。corpus 見出しで「ابن الإمام＋التلمساني」は D09520 のみ。'
  type: reference
translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アブド・アッ＝ラフマーン、アブー・アル＝ファドル・ブン・アル＝イマーム・アル＝マグリビー・アル＝マーリキー。アル＝マクリーズィーは彼の父をヤフヤーと呼んでおり、〔その名のもとに〕後述する。
  en: Muḥammad b. Ibrāhīm b. ʿAbd al-Raḥmān, Abū al-Faḍl b. al-Imām, al-Maghribī al-Mālikī. Al-Maqrīzī named his father Yaḥyā, and he will come below [under that name].
