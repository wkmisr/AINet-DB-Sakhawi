translation:
  ja: ムハンマド・ブン・ダーウード・ブン・ムハンマド・ブン・アビー・アル＝カースィム・アル＝ハカミー・アル＝ヤマーニー。彼の父は前述。父の後を継いでそのザーウィヤの運営を善良かつ恵み豊かに担い、現在も存命である。巡礼（ハッジ）と参詣（ズィヤーラ）を行った者の一人で、次項の人物がマッカその他で彼から学んだ。そして（その人物が）私（サハーウィー）に彼の立派な行状を語ってくれた。
  en: Muḥammad b. Dāwūd b. Muḥammad b. Abī al-Qāsim al-Ḥakamī al-Yamānī. His father was mentioned previously. He succeeded him in running his zāwiya, with goodness and blessing, and he is at present among the living. He was among those who performed the pilgrimage and the visitation, and the person mentioned after him studied under him in Mecca and elsewhere, and related to me (al-Sakhāwī) good accounts of him.
