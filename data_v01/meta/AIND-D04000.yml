translation:
  ja: アブドゥルアズィーズ・ブン・ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・アリー・ブン・アフマド、イッズ・アッ＝ディーン・アル＝マハッリー・アッ＝サマンヌーディー・アッ＝シャーフィイー。後述のアル＝ジャラール・ムハンマド・ブン・アフマドの従兄弟で、「アズィーズ」（無点のアイン、その間にヤーを挟む二つの点付きザーイ）として知られる。クルアーンと『ミンハージュ』（あるいはその大部分）を暗記し、従兄弟のもとで学び、父と同じくサマンヌードとその管区のカーディー職を務めた。
  en: ʿAbd al-ʿAzīz b. Muḥammad b. ʿAlī b. Muḥammad b. ʿAlī b. Aḥmad ʿIzz al-Dīn al-Maḥallī al-Samannūdī al-Shāfiʿī, the cousin of al-Jalāl Muḥammad b. Aḥmad, who is mentioned below, and known as ʿAzīz. He memorized the Qurʾān and the Minhāj, or most of it, studied under his cousin, and, like his father, held the judgeship of Samannūd and its district.
