notes:
- text: '「فيمن جده عبد القادر بن علي قريبا」＝転送見出し。転送先は #AIND-D04505（刊本第123項 عبد الله بن علي بن عبد الله بن علي بن محمد بن عبد السلام بن أبي المعالي البهاء الكازروني الأصل المكي رئيس المؤذنين بها … مات سنة ثمان〔808〕، ترجمه الفاسي、10項前＝「قريبا」に合致）。ただし D04505 の祖父名は「عبد الله بن علي」であり、本項の「عبد القادر بن علي」とは一致しない。corpus 全体で「عبد الله بن علي بن عبد القادر」の見出しは存在せず（عبد الله بن علي 部は D04504 شعيب → D04505/D04506 عبد الله → D04507 محمد の順で「عبد القادر」の位置に項がない）、「البهاء الكازروني」を名乗る عبد الله بن علي は D04505 のみ。同家の別項 #AIND-D03929「عبد السلام بن محمد بن أبي الخير محمد بن علي بن عبد الله بن علي ابن عبد السلام … الكازروني المكي」も祖先を عبد الله بن علي と綴る。よって刊本の「عبد القادر」は「عبد الله」の誤りと判断し、cert medium で D04505 を転送先とする（ISSUES §Da-1）。'
  type: reference
