translation:
  ja: ナースィル・ブン・ハリール・ブン・マスウード、ガルス〔・ッディーン〕・アル＝ミーカーティー。シャイフー・ハーンカーのシャーフィイー派スーフィーの一人で、そのマクタブの児童教師。およそ773年に生まれた。ビカーイーが彼の項を書き出した。
  en: Nāṣir b. Khalīl b. Masʿūd, al-Ghars al-Mīqātī, one of the Shāfiʿī Sufis of the khānqāh of Shaykhū and teacher of the children of its maktab. Born about 773. Al-Biqāʿī excerpted his entry.
