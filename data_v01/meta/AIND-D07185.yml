notes:
- text: '転送見出し（原文「فيمن جده محمد بن عثمان بن أحمد بن عمر」による）。転送先は #AIND-D07243「محمد بن أبي بكر بن محمد بن عثمان بن أحمد بن عمر بن سلامة البدر المارديني ثم الحلبي الحنفي عالم حلب」（758生、未受領）。同項に「ويختصر من نسبه فيقال ابن أبي بكر بن سلامة ومرة ابن أبي بكر بن محمد بن سلامة」とあり、本見出しの省略形ナサブと整合。同じ転送先を指す転送見出しに #AIND-D07241「محمد بن أبي بكر بن محمد بن سلامة . في ابن أبي بكر بن محمد بن عثمان …」がある。'
