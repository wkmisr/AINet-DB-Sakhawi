translation:
  ja: アリー・シャー・ブン・アル＝ハワージャー・アブド・アッ＝サラーム・ブン・ハサン、ジュルジャーン出自のアル＝バフリー・アッ＝シャーフィイー、マッカ寄留者。同母弟ムハンマドについては後述する。若者で、マッカで私（サハーウィー）から『ナワウィーの四十〔ハディース〕』などを聴聞し、少し学問に励んだ。理性的で、悪くない人物である。
  en: ʿAlī Shāh b. al-Khawājā ʿAbd al-Salām b. Ḥasan, of Jurjānī origin, al-Baḥrī al-Shāfiʿī, resident of Mecca; his full brother Muḥammad follows below. A young man who heard from me in Mecca the Forty [Ḥadīths] of al-Nawawī and other works, and studied a little; he is sensible and not bad.
