translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・アリー・ブン・ウクバ・アル＝ワジーフ・アル＝マッキー。聖モスクの技師（ハラムのエンジニア）。善良で信仰深い人物であり、多くの建築において人々に奉仕し、幾何学および建築技術に精通していた。長年にわたりそれを実務として行った後、引退し、富と不動産を得た。826年ズー・アル＝ヒッジャ月（12月）、ハイフ・バニー・シャディードにて、70歳で没した。アル＝ファースィーが『メッカ史』において述べている。
  en: ʿAbd al-Raḥmān b. Muḥammad b. ʿAlī b. ʿUqba al-Wajīh al-Makkī, the engineer of the Haram. He was a good and pious man, who frequently served people in construction, and was well-versed in engineering and architecture. He practiced this for a period of time, then left it and acquired wealth and real estate. He died in Dhū al-Ḥijja in the year 826 H at Khayf Banī Shadīd, having reached the age of seventy. Al-Fāsī mentioned this in his history of Mecca.
