translation:
  ja: ウスマーン・ブン・イーサー・ブン・ムーサー・ブン・アリー・ブン・クライシュ・アル＝ハーシミー・アル＝マッキー。アル＝マジュド・ブン・アビー・ッ＝サアーダートに身を寄せた者の一人で、代行ウムラを生業とし、農耕もしていた。878年シャアバーン月にインドのカールバルカ地方で没した。イブン・ファハドが彼の没年を記録している。
  en: ʿUthmān b. ʿĪsā b. Mūsā b. ʿAlī b. Quraysh al-Hāshimī al-Makkī. He was among those attached to al-Majd b. Abī al-Saʿādāt; he used to perform ʿumras on behalf of others for a living and to farm. He died in Shaʿbān 878 in the region of Kālbarqa in India. Ibn Fahd recorded his death date.
