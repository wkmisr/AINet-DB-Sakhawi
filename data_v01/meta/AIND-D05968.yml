translation:
  ja: ウマル・ブン・ムハンマド・ブン・ウマル・ブン・ムハンマド・ブン・マスウード、アル＝ウラービー、アル＝マッキー。父と祖父は後述。（8）80年サファル月に同地で没し、アル＝マアラーにある祖父の墓所に葬られた。
  en: ʿUmar b. Muḥammad b. ʿUmar b. Muḥammad b. Masʿūd al-ʿUrābī al-Makkī; his father and grandfather come below. He died there in Ṣafar (8)80 and was buried in his grandfather's tomb at al-Muʿallā.
