translation:
  ja: アハマド・ブン・イーナール、アミール・シハーブ・アル＝ディーン、ブン・アル＝アミール。スルターン・アッ＝ザーヒル（ジャクマク）の側近の一人。アッ＝ザーヒルが彼を、40人のマムルークを率いてヒジャーズのアラブ部族バリー（بلى）討伐に派遣した。その後帰還したが、彼に同行していた一団は釘打ちにされ、次いで（胴を）二つに切断された。これは843年のことである。
  en: Ahmad b. Inal, al-Amir Shihab al-Din, b. al-Amir. He was one of the intimates (khawāṣṣ) of al-Ẓāhir (Jaqmaq), who dispatched him with forty Mamluks to fight the Bali tribe of the Arabs of the Hijaz. He then returned; the group accompanying him were nailed and then cut in half (wussiṭū), in the year 843 H.
