notes:
- text: '「هو ابن عبد الله بن أحمد بن محمد ابن هاشم بن عبد الواحد . مضى」＝転送見出し。転送先は #AIND-D07752（刊本 163 番「محمد بن عبد الله بن أحمد بن محمد بن هاشم بن عبد الواحد بن أبي حامد ابن عشائر البدر بن التاج بن الشهاب بن الشرف بن الزين السلمي الحلبي الشافعي … ويعرف كسلفه بابن عشائر . ولد في المحرم سنة ستين وسبعمائة بحلب」）。指示ナサブ「عبد الله بن أحمد بن محمد بن هاشم بن عبد الواحد」が同項の見出しと完全一致し、同じ محمد بن عبد الله 部の直前（2項前）に位置する。父 عبد الله بن أحمد بن محمد … بن عشائر التاج الحلبي は #AIND-D04407。転送先は本バッチ外・`Individuals/` 未収録（受領時に相互確認）。'
  type: reference
translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・アシャーイル。彼はアブドゥッラー・ブン・アフマド・ブン・ムハンマド・ブン・ハーシム・ブン・アブド・アル＝ワーヒドの息子である。前述。
  en: Muḥammad b. ʿAbd Allāh b. ʿAshāʾir. He is the son of ʿAbd Allāh b. Aḥmad b. Muḥammad b. Hāshim b. ʿAbd al-Wāḥid. Mentioned above.
