translation:
  ja: アフマド・ブン・イスマーイール・ブン・ユー スフ・ブン・ウマル・ブン・アブドゥルアズィーズ・アル＝ハワーリー・アルバンダリー。ハワーラ族の長のひとりで、彼らの間ではアミール（ الأمير）と呼ばれたムニス（مونس）の兄弟である。ドゥワダール・アル＝カビールが彼（アフマド）を連れてきて、ジュマーダー・アル＝アーヒラ月883年に、生きたままズウェイラ門（باب زويلة）で仲間たちとともにその首を吊り下げて死に至らしめたため、人々はその光景に苦痛を感じた。
  en: Aḥmad b. Ismāʿīl b. Yūsuf b. ʿUmar b. ʿAbd al-ʿAzīz al-Hawārī al-Bandārī, brother of Mūnis (who will be mentioned later). He was one of the leaders of the Hawāra Arabs and was called "the Amīr" among them. The Great Dawādār brought him, and his head was hung at Bāb Zuwayla along with a group of people while they were alive until he died, in Jumādā al-Ākhira 883 H. People were distressed by witnessing this.
