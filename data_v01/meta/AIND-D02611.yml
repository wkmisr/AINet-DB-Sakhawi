translation:
  ja: ハサン・ブン・ウマル・ブン・ムハンマド・アル＝カルシャーニー。フサイン（双子の兄弟）および後述のムハンマドの兄弟。アフマド・アン＝ナフリー、アフマド・アッ＝サーイグ、アス＝サッラウィーらから（学問を）取得し、諸学に秀でた。チュニスのアル＝ジャジーラ・アル＝カブリーヤの判事（カーディー）職を、次いでバージャの判事職を務めた。彼の兄弟ムハンマドは、彼（ハサン）のおかげで集団判事（カダー・アル＝ジャマーア）職において安泰であったが、彼が没すると（実力が露呈して）その化けの皮が剥がれた。ヒジュラ暦873年に39歳で没した。
  en: Ḥasan b. ʿUmar b. Muḥammad al-Qalshānī, the brother of Ḥusayn (they were twins) and the forthcoming Muḥammad. He studied under the two Aḥmads (al-Nakhlī and al-Ṣāʾigh), al-Sallāwī, and others, distinguishing himself in various arts. He was appointed as the judge of al-Jazīra al-Qabliyya of Tunis, and then of Bāja. His brother Muḥammad was shielded by him in the office of chief judgeship (qāḍī al-jamāʿah), but when Ḥasan died, he was exposed. He died in the year 873 AH at the age of thirty-nine.
