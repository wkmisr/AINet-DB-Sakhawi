notes:
- text: '「في محمد بن عثمان」＝転送見出し。corpus 全体に「محمد بن عثمان الدنديلي」の本伝はなく、該当するのは #AIND-D04840「عثمان بن أحمد بن عثمان الفخر أبو عمرو الدنديلي القاهري الشافعي الشاهد ، وسمى شيخنا في تاريخه أباه محمدا وأورده في معجمه على الصواب」（741生）。本項の名「عثمان بن محمد」はイブン・ハジャルが『التاريخ』で用いた父名 محمد による呼称で、転送先の指示「في محمد بن عثمان」は「في ابن أحمد بن عثمان」の誤植と解される（§D97-3）。'
