translation:
  ja: アルナブガー・アル＝ユーニスィー・アン＝ナースィリー・ファラジュ アル＝アシュラフ・バルスバーイの治世にアミール・アシャラ（十人長）およびラアス・ナウバ（隊長）を務めた。 数年間、メッカにムカッダム（隊長）として滞在し、スルタン直属のマムルークたちを率いた。 その後、アル＝ザーヒル（ジャクマク）によってタブラハーナート（鼓手隊）の一員とされ、さらにアル＝アシュラフ・イーナールが即位すると、彼の任期は長く続かず、857年ラビーウ・ル＝アッワル月に死去した。
  en: Arnabughā al-Yūnisī al-Nāṣirī Faraj served as amīr ʿashara (commander of ten) and raʾs nawba during the reign of al-Ashraf Barsbāy. He then resided in Mecca for years, serving as muqaddam (commander) over the Sultanic Mamluks. Later, al-Ẓāhir (Jaqmaq) appointed him to the ṭablakhānāt (drum corps). When al-Ashraf Īnāl came to power, his tenure in this position was not long. He died in Rabīʿ al-Awwal in the year 857 H.
