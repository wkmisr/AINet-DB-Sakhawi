translation:
  ja: アブド・アル＝カーディル・ブン・アッ＝シャラフ・ムハンマド・ブン・ムハンマド・アッ＝タナーヒー（タナーフ出自。無点のター（開音）にヌーンが続く）、カイロの人、商人。彼とその父親はシュルブ（布）市場の商人であった。カイロでクルアーンを朗読し、私（サハーウィー）からハディースを聴聞した。また、巡礼（ハッジ）してマッカに留まった（ジャーワラ）。彼は父親よりも優れた（まともな）人物である。
  en: ʿAbd al-Qādir b. al-Sharaf Muḥammad b. Muḥammad, of al-Ṭanāḥī origin (the first letter is a vowelless ta' followed by a nun), of Cairo, the merchant. He and his father were merchants in Sūq al-Shurb. He recited the Qur'an and heard [hadith] from me in Cairo. He performed Hajj and stayed adjacent to the Sanctuary (jāwara). He is more upright than his father.
