translation:
  ja: アリー・ブン・アフマド・ブン・アリー・ブン・ユースフ・アル＝フスースィー。アッ＝ザイン・ジャアファル・アル＝ムクリの娘の夫。シャリーフ（預言者の後裔）として言及される人物で、その父はアル＝フスースのシャイフであった。890年より後に巡礼季の巡礼を行った者の一人で、我々の帰路の道中に私（サハーウィー）のもとへ足しげく通い、その後カイロでも私のもとへ通った。
  en: ʿAlī b. Aḥmad b. ʿAlī b. Yūsuf al-Khuṣūṣī, the husband of the daughter of al-Zayn Jaʿfar al-Muqriʾ. He is mentioned as a sharīf, and his father was the shaykh of al-Khuṣūṣ. He was among those who performed the pilgrimage after [8]90 for the season only; he used to frequent me (al-Sakhāwī) during our journey back, and afterwards he frequented me in Cairo.
