translation:
  ja: ハサン・フサーム・アッ＝ディーン。ズー・アル＝ヒッジャ月842年にカイロで没した。彼はエルサレムから来訪し、ナースィル・ファラジュの治世およびそれ以降に、ガザやエルサレムなどの複数の副知事職（ニヤーバ）を務めた。マクリーズィーがこのように述べており、私は、彼がエルサレムの監督官（ナーズィル）であり、イブン・ルスラーンの伝記中で言及されている、同地（エルサレム）のマドラサの創立者ではないかと考えている。
  en: Ḥasan Ḥusām al-Dīn. He died in Cairo in Dhu al-Hijjah, the year 842. He had come from Jerusalem and had held several deputy governorships in Gaza, Jerusalem, and elsewhere during the reign of al-Nasir Faraj and afterwards. Al-Maqrizi mentioned this, and I believe him to be the superintendent (nāẓir) of Jerusalem and the founder of the madrasa there, who is mentioned in the biography of Ibn Ruslan.
