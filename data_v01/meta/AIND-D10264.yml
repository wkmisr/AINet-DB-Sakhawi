notes:
- text: 'ابن البقري 家（コプト系書記、ニスバ索引 #AIND-D12193）。兄弟: #AIND-D02779「حمزة بن عبد الرزاق بن البقري أخو يحيى」（890年没）・#AIND-D06164「فرج بن عبد الرزاق سعد الدين … أخو يحيى وحمزة وأبي سعيد」・#AIND-D10991「أبو سعيد بن عبد الرزاق أمين الدين … أخو حمزة ويحيى」（いずれも相手側が本項主を名指し。D02779・D06164 は repo 収録済みで brother relation に #AIND-D10264）。本項原文は兄弟に触れず、父が TMP-P-001549 で共通なので relation は立てず note（規則23）。「وهو أسن الثلاثة」＝本項主と الشرف・المجد の三人のうち最年長。'
  lang: ja
  type: editorial
translation:
  ja: ヤフヤー・ブン・アブド・アッ＝ラッザーク、アラム・アッ＝ディーン・ブン・タージュ・アッ＝ディーン・ブン・アル＝バカリー。アル＝バカリーの二人の息子アッ＝シャラフとアル＝マジュドの従兄弟（父方おじの子）で、三人のうち最年長である。親族のもとで実務の訓練を積み、いくつかの部署で勤めたのち、従兄弟アッ＝シャラフの後に厩舎監督（ナザル・アル＝イスタブル）に就いた。
  en: Yaḥyā b. ʿAbd al-Razzāq, ʿAlam al-Dīn b. Tāj al-Dīn b. al-Baqarī, paternal cousin of al-Sharaf and al-Majd, the two sons of al-Baqarī, and the eldest of the three. He was trained in administrative work (mubāshara) by his relatives and served in various posts, until he was installed in the supervision of the stable (naẓar al-isṭabl) after his cousin al-Sharaf.
