translation:
  ja: アフマド・ブン・アブド・アル＝ダーイム・ブン・ウマル、ラカブはシハーブ、カーディー・ザイン・アル＝ディーン・アル＝マルサファーウィーの息子。ザイン・リドワーンは、彼がシャラフ・ブン・アル＝クワイイクから聴聞したと述べ、彼（伝主）が亡くなったことに言及したが、その死亡年月日は明記されなかった。
  en: Aḥmad b. ʿAbd al-Dāʾim b. ʿUmar, al-Shihāb, son of al-Qāḍī Zayn al-Dīn al-Marṣafāwī. Al-Zayn Riḍwān stated that he heard from al-Sharaf b. al-Kuwayk, and he indicated that he died but did not specify the date of his death.
