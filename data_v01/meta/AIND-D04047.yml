translation:
  ja: アブドゥルガッファール・ブン・ナフィース。ダスークのイブラーヒーム廟のナキーブたちの一人で、長命のシャイフ。855年ムハッラム月に没し、小カラーファの墓に葬られた。イブン・アル＝ムニールがその没年を記録している。
  en: ʿAbd al-Ghaffār b. Nafīs, a long-lived shaykh, one of the naqībs of the Ibrāhīmī shrine of Dasūq. He died in Muḥarram 855 AH and was buried in a tomb in al-Qarāfa al-Ṣughrā. Ibn al-Munīr recorded the date of his death.
