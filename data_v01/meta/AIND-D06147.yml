notes:
- text: '転送見出し（原文末尾「في عبد العزيز」による）。転送先は #AIND-D03964「عبد العزيز بن الفخر أبي بكر بن علي بن أبي البركات محمد القرشي المكي ابن أخي القاضي البرهان ويعرف كسلفه بابن ظهيرة ويلقب فائزا وهو بلقبه أشهر」（872年マッカ生、未受領）＝ラカブ「فائز」で知られる عبد العزيز 本人。兄弟 #AIND-D04695（عبد المعطي「شقيق عبد العزيز فايز الماضي」）・#AIND-D11133（أبو اليمن「أخو فايز الماضي」）、母 #AIND-D13894（「أم عبد العزيز المدعو فائزا ابن الخطيب أبي بكر بن علي بن ظهيرة حبشية」）、妻 #AIND-D13373（فاطمة ابنة البرهان「تزوجها ابن عمها فائز بن الفخر أبي بكر」）で整合。同じ人物へ向くラカブ部の見出し #AIND-D11319「فائز عبد العزيز بن أبي بكر بن علي」もある。'
  type: reference
