translation:
  ja: ムーサー・ブン・ムハンマド・ブン・ムーサー・ブン・アリー・ブン・ムハンマド・ブン・アリー・ブン・ハーシム、アル＝カマール、アッ＝ダジャーイー、アッ＝ザビーディー、同地（ザビード）のムフティー・ハディース学者・説教師。アッ＝シハーブ・アフマド・アン＝ナーシリーから法学を学び、アル＝マジュド・アル＝フィールーザーバーディーから多くを学んで、彼の前で主要ハディース集の多くを読み、その点で彼から益を得た。彼と同名のムーサー・アッ＝ザワーリーがこれを（私に）伝え、その著書『イエメンの善人たち（スラハー・アル＝ヤマン）』のアリー・ブン・ハーシムの伝記の中で彼の地位を高く評価している。彼はイエメンでイブン・アラビーに傾倒する者たちに対して立った最有力者の一人で、アル＝キルマーニーにイブン・アラビーの書を捨てさせる旨の立会証書つきで書かれた布告をもって、ザビードの金曜モスクで説教する者であった。アル＝アフダルがそう述べている。
  en: Mūsā b. Muḥammad b. Mūsā b. ʿAlī b. Muḥammad b. ʿAlī b. Hāshim, al-Kamāl al-Ḍujāʿī al-Zabīdī, its (Zabīd's) muftī, ḥadīth scholar and preacher. He took jurisprudence from al-Shihāb Aḥmad al-Nāshirī and studied much under al-Majd al-Fayrūzābādī, reading before him many of the principal ḥadīth collections (al-ummahāt) and benefiting from him in that. His namesake Mūsā al-Dhuwālī informed (me) of this and praised him highly in the biography of ʿAlī b. Hāshim in his book Ṣulaḥāʾ al-Yaman. He was one of the greatest opponents of the followers of Ibn ʿArabī in Yemen, so much so that he was the preacher in the congregational mosque of Zabīd who read the decree drawn up with testimony against al-Kirmānī, requiring him to abandon the books of Ibn ʿArabī. So said al-Ahdal.
