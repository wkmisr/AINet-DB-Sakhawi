translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・ムハンマド・ブン・アブドゥッラー・ブン・イブラーヒーム・ブン・ハンマード・ブン・ハラフ・アッ＝タミーミー・アッ＝トゥーニスィー・アル＝マグリビー・アル＝マーリキー、イブン・アル＝マフジューブとして知られる。818年にチュニスで生まれた。アル＝ビカーイーが名のみ挙げている。私（サハーウィー）が会った者の一人だと思う。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad b. Muḥammad b. ʿAbd Allāh b. Ibrāhīm b. Ḥammād b. Khalaf al-Tamīmī al-Tūnisī al-Maghribī al-Mālikī, known as Ibn al-Maḥjūb. He was born in the year 818 in Tunis. Al-Biqāʿī mentioned him without detail, and he is, I think, among those I met.
