notes:
- text: '転送見出し（原文「ويأتي فيمن جده محمد بن عمر بن عيسى」による）。転送先は #AIND-D08574「محمد بن علي بن محمد واختلف فيمن بعده فقيل عيسى بن عمر بن أبي بكر وقيل عمر بن عيسى بن محمد … الشمس السمنودي الأصل المصري الشافعي والد المحمدين البهاء والمحب الآتيين ويعرف بابن القطان حرفة أبيه وأخيه」（737年生、ابن القطان）。ニスバ索引 #AIND-D12646「ابن القطان الشمس محمد بن علي بن محمد بن عمر بن عيسى وابناه …」は複数人の合同索引なので target に使わない（規則11）。'
