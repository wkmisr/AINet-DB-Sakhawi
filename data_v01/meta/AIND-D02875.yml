notes:
- text: '「في أثناء قاسم بن أحمد بن أحمد ابن موسى وانه مات …」＝「قاسم … の項の中に（言及があり）、814年にカイロで没したこと（が記されている）」。転送動詞（مضى／يأتي／في ابن …）がなく、本項自身に没年・没地を記すので「له ذكر في X」型と同じく実項（REF 化しない。Waka 裁定 2026-09-08 の絶対基準）。相手側 #AIND-D06205 の本文「وكان له صديق يقال له خليل بن إبراهيم الخياط من أهل بلده فقال لما رأى جنازته وقد صلى عليه من حضر الجمعة : يا رب اجعلني مثله فمات في ليلة الجمعة المقبلة وصلي عليه كما صلي على صديقه」が本項主を名・父名・職・出身（بلده＝عنتاب）で名指しする。ISSUES §D154-5。'
  lang: ja
translation:
  ja: ハリール・ブン・イブラーヒーム、アル＝アンタービー、仕立屋（アル＝ハイヤート）。カースィム・ブン・アフマド・ブン・アフマド・イブン・ムーサーの項の中に（言及があり）、彼が814年にカイロで没したこと（が記されている）。
  en: Khalīl b. Ibrāhīm al-ʿAyntābī al-Khayyāṭ (the tailor). [He is mentioned] within the entry of Qāsim b. Aḥmad b. Aḥmad b. Mūsā, [where it is said] that he died in the year 814 in Cairo.
