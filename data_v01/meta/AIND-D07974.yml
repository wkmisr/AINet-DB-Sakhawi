translation:
  ja: ムハンマド・ブン・アルワーン、アル＝ジャマール、アル＝マウザイー、のちアル＝ジャバーイー、アル＝ヤマーニー、私の思うところではシャーフィイー派。一群の人々に法学を学んで頭角を現し、ついでアッ＝シャムス・ユースフ・アル＝ジャバーイー・アル＝ムクリーに旅先でも在地でも師事し、彼と親密になって、ヒスン・サビル管区のジュバー村で彼の代理としてしばらく裁判（カーディー職）を務めた。さらに法学の教授にも励み、ザビードの町にいくつかの職を持ち、聡明さと理解力と学問への熱意を備えていた。しかし裁判の職が彼の向上を妨げ、むしろ停滯し、ザビード（そこでの職務のため）とタイッズの間を往来し続け、887年にそこ（タイッズ）で没した。私から学んだある者がこれを私に伝えた。
  en: Muḥammad b. ʿAlwān al-Jamāl al-Mawzaʿī, then al-Jubāʾī, al-Yamānī, al-Shāfiʿī as I suppose. He studied jurisprudence under a number of teachers until he distinguished himself, then attached himself to al-Shams Yūsuf al-Jubāʾī al-Muqrī in travel and at home, became close to him, and deputized for him in the judgeship in the village of Jubā, in the district of Ḥiṣn Ṣabir, for a time. He also devoted himself to teaching fiqh and held posts in the city of Zabīd, with intelligence, understanding and eagerness for learning; but the judgeship kept him from advancing, indeed he stagnated, and he kept going back and forth between Zabīd, for his posts there, and Taʿizz, until he died there in the year 887. One of those who studied under me informed me of this.
