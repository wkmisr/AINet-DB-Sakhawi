translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・ムフリフ、アクマルッディーン・ブン・アッ＝シャラフ・ブン・アッ＝シャムス・アッ＝ディマシュキー・アッ＝サーリヒー・アル＝ハンバリー、前述のイブラーヒームの父。先祖と同じくイブン・ムフリフとして知られる。856年シャウワール月に没し、先祖たちの傍らのアッ＝ラウダに葬られた。葬儀は盛大であった。アッラーの慈悲あれ。アル＝ビカーイーは次の詩で彼を風刺した。 「人は言う、イブン・ムフリフは完全（アクマル）だと。われらは答える、然り——あらゆる事柄における欠陥において、彼はまこと適任である／ 虚偽と中傷と無知を彼は備えた。ゆえに彼はいかなる正しき者（ムスリフ）も是とせぬ人物なのだ」
  en: 'Muḥammad b. ʿAbd Allāh b. Muḥammad b. Mufliḥ, Akmal al-Dīn b. al-Sharaf b. al-Shams al-Dimashqī al-Ṣāliḥī al-Ḥanbalī, father of the aforementioned Ibrāhīm; known like his forebears as Ibn Mufliḥ. He died in Shawwāl [8]56 and was buried at al-Rawḍa beside his ancestors; his funeral was well attended. May God have mercy on him. Al-Biqāʿī lampooned him in these verses: "They said: Ibn Mufliḥ is ''most perfect'' (akmal). We said: yes indeed — in his deficiency in every matter he is well suited; / falsehood, slander and ignorance he has gathered, so he is one whom no righteous man (muṣliḥ) approves."'
