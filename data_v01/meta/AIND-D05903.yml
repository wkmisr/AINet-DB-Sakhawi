translation:
  ja: ウマル・ブン・アリー・ブン・ウスマーン、アッ＝ザイン・ブン・アル＝アラー、アル＝ハワーリー・アル＝マクディスィー・アッ＝シャーフィイー。父は前述。803年に生まれ、ハッカーリーヤ、バドリーヤ、ルウルウイーヤ（の職）およびサラーヒーヤの復習教師職（イアーダ）など、父のすべての職に就いた。874年ラビーウ・アル＝アウワル月20日水曜日に没した。
  en: ʿUmar b. ʿAlī b. ʿUthmān, al-Zayn b. al-ʿAlāʾ, al-Ḥawārī al-Maqdisī al-Shāfiʿī; his father was mentioned above. He was born in the year 803 and was installed in all of his father's posts, such as those at al-Hakkāriyya, al-Badriyya and al-Luʾluʾiyya, and the post of repetitor (iʿāda) at al-Ṣalāḥiyya. He died on Wednesday, 20 Rabīʿ al-Awwal 874.
