translation:
  ja: ムハンマド・ブン・サファルシャー、アル＝ハワージャ、アッ＝シャムス、アル＝アジャミー、マッカ居住。風采の良いシャイフで、タワーフ、〔クルアーンの〕誦読、読書——とりわけスーフィーの言説の——、貧者その他への厚遇など多くの崇拝行為で知られ、アブド・アル＝ムウティー・アル＝マグリビーに深く帰依する者の一人であった。881年ズー・アル＝ヒッジャ月7日の夜に没した。神が彼を憐れみたまえ。
  en: Muḥammad b. Safarshāh, al-Khawājā, al-Shams, al-ʿAjamī, resident of Mecca. He was a shaykh of fine appearance, remembered for much worship—circumambulation, recitation and reading, especially of the writings of the Sufis—and for his generosity to the poor and others; he was among those who held a good opinion (ḥusn iʿtiqād) of ʿAbd al-Muʿṭī al-Maghribī. He died on the night of 7 Dhū al-Ḥijja 881. May God have mercy on him.
