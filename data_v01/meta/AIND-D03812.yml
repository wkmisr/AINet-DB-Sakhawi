translation:
  ja: 我がシャイフ（師）たるバドル・アッディーン・マフムード・ブン・アフマド・アル＝アイニーの息子アブドゥッラフマーン。カイロを拠点とした（あるいはカイロ生まれ）。アブドゥッラヒーム（後述）の兄弟。別名は「クッラト・アル＝アイン（目に入れても痛くない愛児）」。ヒジュラ暦822年ラビーウ・アル＝アーヒル月（第4月）にペスト（疫病）により死去。彼の父（アル＝アイニー）がその没年を記録した。
  en: Abd al-Rahman, the son of our shaykh al-Badr Mahmud bin Ahmad al-Ayni, Cairene by origin. He was the brother of Abd al-Rahim, who is mentioned below. He was nicknamed Qurrat al-Ayn. He died of the plague in Rabi' al-Akhir in the year 822 AH, and his death was chronologized by his father.
