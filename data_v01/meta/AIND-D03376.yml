translation:
  ja: マッカに定住したアレッポ出身のサダカ。商人。886年ジュマーダー・アッ＝サーニヤ（第2ジュマーダー月）にジッダで急死し、マアラー墓地に運ばれて、イブン・サラーマの墓の近くにある自身の墓所に埋葬された。神が彼を赦されんことを。
  en: Sadaqa al-Halabi, a resident of Mecca and a merchant. He died suddenly in Jeddah in Jumada al-Thaniya, the year eighty-six (886 AH), and was carried to al-Mu'alla, where he was buried in his tomb near the tomb of Ibn Salama, may Allah forgive him.
