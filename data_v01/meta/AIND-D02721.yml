notes:
- text: حسين بن علي بن عبد الله الشرف الفارقي ثم الزبيدي أحد أعيان تجار اليمن . مضى فيمن جده أبو بكر بن سعادة → 実伝は「حسين بن علي بن أبي بكر بن سعادة شرف الدين الفارقي ثم الزبيدي اليماني أحد أعيان التجار」(AIND-D02712、#566)。本転送項の祖父名عبد اللهはD02712末尾の「(المقريزي) سمى جده عبد الله」という異伝に対応し、同一人であることを閉合的に示す。
