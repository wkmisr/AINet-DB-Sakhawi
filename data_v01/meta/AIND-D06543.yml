translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・ブン・イブラーヒーム・ブン・サーリフ、アル＝カマール・ブン・アル＝ブルハーン、アン＝ナイニー、のちアッ＝ディマシュキー、アル＝カーヒリー、アッ＝シャーフィイー。父は既出。イブン・アル＝カーディリーの名で知られる。クルアーンといくつかの書を暗記し、アル＝ジャウジャリーらのもとで少し学んだ。父は、彼が2歳目であった54年ムハッラム月5日に、ザーヒリーヤでの『ブハーリー』の読了に彼を出席させた。私には『アルフィーヤ』その他を読んだ。父の道は歩まなかった。
  en: Muḥammad b. Ibrāhīm b. Muḥammad b. Ibrāhīm b. Ṣāliḥ, al-Kamāl b. al-Burhān, al-Naynī, then al-Dimashqī, al-Qāhirī al-Shāfiʿī, whose father has been mentioned above; known as Ibn al-Qādirī. He memorized the Qurʾān and some books, and studied a little under al-Jawjarī and others. His father brought him, in his second year, on 5 Muḥarram of the year 54, to the completion (khatm) of al-Bukhārī at the Ẓāhiriyya. He read with me in the Alfiyya and other works. He did not follow his father's path.
