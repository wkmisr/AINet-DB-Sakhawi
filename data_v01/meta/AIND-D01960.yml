notes:
- text: 原文の転送指示「جد الذي قبله（前項の祖父）」が指す前項は D01959（إسماعيل بن علي بن إسماعيل النبتيتي، 931番）。D01959本文には「الآتي أبوه وجده（父も祖父も後述）」とあり、父は D05063（علي بن إسماعيل بن علي بن إسماعيل النبتيتي، والد إسماعيل الماضي）として立項されるが、祖父إسماعيل本人（＝本項）の独立した実伝記は al-Ḍawʾ 現存テキストに見当たらない。唯一近いD12230（ابن الجمال見出し）を精査した結果、これは「ابن الجمال...إسماعيل بن علي بن إسماعيل بن علي بن إسماعيل النبتيتي وأبوه وجده فيما أظن」という一族案内索引であり、孫D01959・父D05063・祖父D01960（本項）をまとめて「ابن الجمال」の呼称で束ねる相互参照にすぎず、祖父固有の実伝記ではない（「فيما أظن」も父祖の呼称への著者の留保を示す）。したがってD12230を本項の着地点（REF転送先）とはみなさず紐付けない。転送先となる祖父固有の本伝が現存テキストに存在しないため、REF処理（txt差し替え・LIMBO化）はせず本項を維持してD00952型でクローズ（2026-06-19 Waka確認済み、選択肢A確定）。
