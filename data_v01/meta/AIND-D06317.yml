translation:
  ja: クダイド（ハディードと同形）・アル＝カラムターイー、ハージブ（侍従）、前述のウマルの父、カイロの大アミールの一人。息子の項に彼への言及があり、アル＝カラクとアレクサンドリアの副官職（ニヤーバ）を歴任し、アル＝アシュラフ・シャアバーンの養育係（ラーラー）を務めたことなどが記されている。（8）01年ラビーウ第一月、無任所の身でエルサレムにて没した。
  en: Qudayd (on the pattern of ḥadīd) al-Qalamṭāy, the ḥājib, father of the aforementioned ʿUmar, one of the great amīrs in Cairo. He is mentioned in his son's entry, where it is noted that he held the deputyship of al-Karak and of Alexandria and served as lālā (tutor) to al-Ashraf Shaʿbān, among other things. He died in Jerusalem, out of office, in Rabīʿ I of the year [80]1.
