translation:
  ja: アブド・アッ＝ラヒーム・ブン・アフマド・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ザヒーラ・ブン・アフマド・ブン・アティーヤ・ブン・ザヒーラ・アル＝クラシー・アル＝ヤマニー、のちにアル＝マッキー。ヒジュラ暦834年イエメンに生まれ、同地で育ち、のち父とともにマッカに来て、アブー・アル＝ファトフ・アル＝マラーギーから聴聞し、一団の人々からイジャーザを得た。アル＝ブルハーン・イブン・ザヒーラとアブー・アル＝バラカート・アル＝ハイサミーのもとで法学（フィクフ）を学び、アル＝ムヒッブ・ブン・アビー・アッ＝サアーダートに常侍した。ムヒッブは2度目（のマッカ法官職）に就くと、彼をジッダで代理（ナーイブ）とした。ヒジュラ暦882年ラマダーン月、マッカで没した。
  en: Abd al-Rahim b. Ahmad b. Abi Bakr b. Abd Allah b. Zuhayra b. Ahmad b. Atiyya b. Zuhayra al-Qurashi al-Yamani, later al-Makki. He was born in Yemen in the year 834 AH, where he grew up, and then traveled to Mecca with his father. There, he heard from Abū al-Fatḥ al-Marāghī, and a group of scholars (jama'a) granted him ijazas. He studied jurisprudence (fiqh) under Burhan al-Din b. Zuhayra and Abu al-Barakat al-Haythami, and closely associated with al-Muhibb b. Abi al-Sa'adat, who appointed him as his deputy in Jeddah during his second term of office. He died in Mecca in Ramadan in the year 882 AH.
