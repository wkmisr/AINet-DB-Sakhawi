translation:
  ja: ムハンマド・ブン・アブド・アル＝カーディル・ブン・アブド・アッ＝ラフマーン、アブー・アル＝ガイス・ブン・ムヒー・アッ＝ディーン、アッ＝シャイバーニー、アル＝マッキー、ハナフィー派。既述のウマルの兄弟で、先人と同じくイブン・ズィブリクとして知られる。マッカで私（サハーウィー）から聴聞した者の一人。クルアーンといくつかの要約書を暗記し、姉妹の夫アブー・アッ＝ライス・イブン・アッ＝ディヤーに法学で師事し、彼らのカーディーの講義に出席した。
  en: Muḥammad b. ʿAbd al-Qādir b. ʿAbd al-Raḥmān, Abū al-Ghayth b. Muḥyī al-Dīn al-Shaybānī al-Makkī al-Ḥanafī, brother of the aforementioned ʿUmar, known like his forebears as Ibn Zibriq. He is among those who heard from me (al-Sakhāwī) in Mecca. He memorised the Qurʾān and some abridgements, studied jurisprudence assiduously under his sister's husband Abū al-Layth b. al-Ḍiyāʾ, and attended the lessons of their qāḍī.
