translation:
  ja: ムハンマド・ブン・アッ＝タキー・アビー・アル＝ファドル・アブドゥッラヒーム・ブン・アル＝ムヒッブ・ムハンマド・ブン・ムハンマド・ブン・アフマド、ムワッファク・アッ＝ディーン・イブン・アル＝アウジャーキー、シャーフィイー派。父は前述、祖父は後述。〔八百〕七十七年ズー・アル＝カアダ月に没し、アッ＝シャーフィイー廟の近くに埋葬された。二十歳を越えていた。すでに読誦し理解に達しており、両親はともに彼〔の死〕を大いに悲しんだ。神が彼らに楽園をもって償いたまいますように。
  en: Muḥammad b. al-Taqī Abī al-Faḍl ʿAbd al-Raḥīm b. al-Muḥibb Muḥammad b. Muḥammad b. Aḥmad, Muwaffaq al-Dīn b. al-Awjāqī al-Shāfiʿī; his father has been mentioned above and his grandfather will be mentioned below. He died in Dhū al-Qaʿda of the year [8]77 and was buried near the shrine (maqām) of al-Shāfiʿī, having passed the age of twenty. He had studied and attained understanding, and both of his parents grieved for him exceedingly; may God compensate them with Paradise.
