translation:
  ja: ムハンマド・ブン・アリー・ブン・アブドゥッラフマーン・ブン・アリー・ブン・ハーシム、アッ＝シャムス・アブー・アブドゥッラー・アッ＝タファフニー、のちアル＝カーヒリー、シャーフィイー派。ハナフィー派カーディーのアッ＝ザイン・アブドゥッラフマーン（既出）の兄弟。アッ＝タキー・ブン・ワキール・アッ＝スルターンが彼から学んだ者の一人で、彼（アッ＝タキー）は、本人（ムハンマド）が847年に没したと述べた。
  en: Muḥammad b. ʿAlī b. ʿAbd al-Raḥmān b. ʿAlī b. Hāshim, al-Shams Abū ʿAbd Allāh al-Tafahnī, then al-Qāhirī, al-Shāfiʿī, brother of the Ḥanafī judge al-Zayn ʿAbd al-Raḥmān, already mentioned. Al-Taqī b. Wakīl al-Sulṭān was among those who studied under him, and he said that he died in the year [8]47.
