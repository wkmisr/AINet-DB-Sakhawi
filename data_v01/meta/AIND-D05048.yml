notes:
- text: '「فيمن جده محمد بن سالم」＝転送見出し。転送先は #AIND-D05026（628 علي بن أحمد بن محمد بن سالم بن علي الموفق الزبيدي المكي الشافعي ابن أخي القاضي سراج الدين عبد اللطيف بن محمد بن سالم ويعرف بابن سالم、没818）。名 علي・父 أحمد・祖父 محمد بن سالم・ラカブ الموفق がすべて一致し一意。同じ転送先を指す同型見出しに D04969「علي بن أحمد بن سالم . يأتي فيمن جده محمد بن سالم بن علي」・D04994「علي بن أحمد بن علي بن سالم . يأتي فيمن جده محمد بن سالم بن علي」がある。'
