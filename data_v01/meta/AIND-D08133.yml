translation:
  ja: ムハンマド・ブン・アリー・ブン・ウスマーン・アッ＝ザビーディー・アル＝ムタイヤブ・アル＝ハナフィー。イエメンで法学の優秀さにおいて父の後を継ぎ、父の後、ザビードにおけるハナフィー派の首位は彼に帰した。その後、アッ＝シハーブ・アフマド・ブン・イブラーヒーム・アル＝マハーリビーのマハーリビーヤ（学院）で教授した。842年ラマダーン月にザビードで没した。
  en: Muḥammad b. ʿAlī b. ʿUthmān al-Zabīdī al-Muṭayyab al-Ḥanafī. He succeeded his father in Yemen in excellence in jurisprudence, and after him the leadership of the Ḥanafīs in Zabīd passed to him; then he taught in the Maḥālibiyya of al-Shihāb Aḥmad b. Ibrāhīm al-Maḥālibī. He died in Ramaḍān [8]42 in Zabīd.
