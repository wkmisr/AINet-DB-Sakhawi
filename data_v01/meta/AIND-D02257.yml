translation:
  ja: タニ・バク・アッ＝ジャルカズィー、シャルバハナー（飲料・薬室）の監督官。様々な宮廷職を歴任した後、ヒジュラ暦818年にハッジ（巡礼）の巡礼団指揮官（アミール・アル＝ハッジ）に任命された。翌819年の初頭に病弱な状態で帰還したが、間もなく同年のサファル月に逝去した。人々はその立派な治世を称賛した。我らがシャイフ（イブン・ハジャル）がその著書『インバー・アル＝ゴムル』においてこのように述べている。
  en: Tani Bak al-Jarkasi, the superintendent of the buttery (shadd al-sharabkhanah). He advanced through various offices of service until he was appointed as the commander of the Hajj pilgrimage (amir al-hajj) in the year 818 AH. He returned at the beginning of the following year (819 AH) in a weak condition and passed away shortly after in the month of Safar. The people praised his conduct. Our shaykh (Ibn Hajar) mentioned this in his chronicle, Inba' al-Ghumr.
