translation:
  ja: タンブガー・アッ＝トゥルキー・アッ＝ディマシュキー、イブン・アル＝カッワースのマウラー。ハッジャールから『ブハーリー』の一部を聴聞したが、彼が世に現れたのは死の直前になってからで、彼がハディースを伝えたとは聞いていない。しかし、我らの仲間の何人かが彼からイジャーザを受けており、彼はハッジャールから聴聞した最後の男性であると、我らがシャイフ（イブン・ハジャル）がその著『インバーウ（＝インバーウ・アル＝グムル）』で述べた。815年に亡くなった。
  en: Ṭanbughā al-Turkī al-Dimashqī, mawlā of Ibn al-Qawwās. He heard part of al-Bukhārī from al-Ḥajjār. He did not become prominent until shortly before his death, and we do not know that he transmitted (ḥadīth). However, some of our companions received an ijāza from him, as our shaykh (Ibn Ḥajar) stated in his 『Inbāʾ al-Ghumr』; he said that he was the last of the men to hear from al-Ḥajjār. He died in the year 815.
