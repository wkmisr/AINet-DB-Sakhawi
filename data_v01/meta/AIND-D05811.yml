notes:
- text: '転送見出し（原文末尾「سيأتي في عمر العدني ممن لم يسم أبوه」による）。転送先は #AIND-D06040（عمر العدني اليماني نزيل مكة ويعرف بالمسلي … وهو ابن أبي بكر بن أحمد、865年ラビーウ・アル＝アウワル月マッカ没）。同項末尾の「وهو ابن أبي بكر بن أحمد」が本見出しのナサブと一致する。同じ人物への転送見出しに #AIND-D05827「عمر بن أبي بكر المسلي . فيمن جده أحمد」（本見出しを経由して D06040 に至る）がある。'
