translation:
  ja: ウマル・ブン・アビー・バクル・ブン・アフマド・アル＝マスリー・アル＝ヤマーニー。崇敬を集めた人物の一人。父の名が挙げられていない者たちの中の「ウマル・アル＝アダニー」［の項］で後述する。
  en: ʿUmar b. Abī Bakr b. Aḥmad al-Maslī al-Yamānī, one of those held in veneration. He will come below under ʿUmar al-ʿAdanī, among those whose father is not named.
