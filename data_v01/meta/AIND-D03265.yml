translation:
  ja: シャーズ・バク、シリア総督（ナーイブ・アッ＝シャーム）カジュマースのダワーダール。889年サファル月、アル＝アシュラフ（カーイトバーイ）の軍とアリー・ダウラート（アラー・アッ＝ダウラ）との、アル＝アンダリーンと呼ばれる地での会戦で戦死した。
  en: Shādh Bak, dawādār of Qajmās, viceroy of Syria. He was killed in the pitched battle between the army of al-Ashraf (Qāytbāy) and ʿAlī Dawlāt (ʿAlāʾ al-Dawla) at a place called al-Andarīn, in Ṣafar 889.
