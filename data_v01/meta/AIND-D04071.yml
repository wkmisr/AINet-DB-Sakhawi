translation:
  ja: アブドゥルガニー・ブン・アビー・アル＝ファドル・ムハンマド・ブン・ムハンマド・ブン・イブラーヒーム・ブン・アフマド・アル＝ムルシディー・アル＝マッキー。父と祖父は後述。835年ズー・アル＝ヒッジャ月26日、日曜の夜に生まれた。『ムフタール』を暗記して提示（アルド）し、イブン・アイヤーシュのもとで聴聞した。897年の時点で存命である。
  en: ʿAbd al-Ghanī b. Abī al-Faḍl Muḥammad b. Muḥammad b. Ibrāhīm b. Aḥmad al-Murshidī al-Makkī; his father and grandfather are mentioned below. He was born on the night of Sunday, 26 Dhū al-Ḥijja 835. He memorized al-Mukhtār, presented it (ʿaraḍa), and heard (ḥadīth) from Ibn ʿAyyāsh. He was still alive in the year 897.
