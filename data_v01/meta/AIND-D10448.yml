translation:
  ja: ユースフ・ブン・アフマド・ブン・ユースフ、毛皮職人。我らの師（イブン・ハジャル）が『ムウジャム』で彼に言及し、こう述べている。「天分に恵まれた庶民で、ザジャルを巧みに詠む。私（イブン・ハジャル）に一篇を書き送ってきた。その冒頭は次のとおりである。（詩、省略）」。それは長く、校訂を要する。
  en: 'Yūsuf b. Aḥmad b. Yūsuf, the furrier. Our shaykh (Ibn Ḥajar) mentioned him in his Muʿjam and said: "A naturally gifted man of the common people who composes zajal well. He wrote to me a piece which begins: (verses omitted)". It is long and needs editing.'
