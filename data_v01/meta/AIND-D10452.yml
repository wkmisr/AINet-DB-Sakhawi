translation:
  ja: ユースフ・ブン・アフマド、アル＝アンダルスィー、アッ＝トゥーニスィー。ウマルとアフマドの両カルジャーニー、ムハンマド・ブン・アビー・アル＝カースィム・アル＝マシャッダーリーらに学び、神学（ウスール・アッ＝ディーン）に秀で、法学とその法源学、アラビア語学などにも通じた。現在、（8）90年に存命で、60歳を越えている。
  en: Yūsuf b. Aḥmad, al-Andalusī, al-Tūnisī. He studied under ʿUmar and Aḥmad, the two Qaljānīs, Muḥammad b. Abī al-Qāsim al-Mashaddālī and others; he excelled in the principles of religion and was versed in jurisprudence and its principles, Arabic and other subjects. He is alive now, in the year [8]90, having passed sixty.
