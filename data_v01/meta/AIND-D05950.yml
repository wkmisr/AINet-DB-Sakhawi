    ja: '「الآتي أبوه」。父は ID-Master 既登録の TMP-P-000752「محمد بن حسين بن حسن الفتحي」（Note「D05950(息子عمر)の父。本伝未特定=特定時に名寄せ」）に当たるため、校閲時の新規仮番号 TMP-P-NEW108-06（取り下げ） を取り下げて既登録番号を使用（集約時、内容検証B H-3）。父 محمد بن حسين بن حسن الفتحي المكي は祖父 #AIND-D02697（حسين بن حسن … الشيرازي الأصل المكي … ويعرف بالفتحي）の息子で、ニスバ索引 #AIND-D11894「الفتحي حسين بن حسن وبنوه محمد وأحمد وأبو البركات اسمعيل」に載るが、corpus の محمد 部に本伝の見出しを確認できず（hw.py「محمد بن الشيخ حسين」「محمد بن حسين الفتحي」該当なし）・ID-Master 未登録 → TMP-P-NEW108-06（取り下げ）（§D108-7）。叔父（父の兄弟）أحمد ＝ #AIND-D00687、أبو البركات إسماعيل（بركات）＝ #AIND-D10610／#AIND-D02182。'
