  note:
    ja: '「وسمع بها مع أبيه وعمه علي أنشأه الله صالحا」。校閲時は「叔父のアリー」と読んだが、「سمع … علي」の直後に人名が続かず祈願句が続くため、標準規則（人名が来ない「سمع على」は「عليّ＝私に」）により「父と叔父とともに私（サハーウィー）から聴聞した」と読み、叔父は名不詳（#NEEDID 維持、規則12）とする（集約時、内容検証B M-9）。ニスバ索引 #AIND-D11894 が挙げる الفتحي 家の息子（محمد・أحمد・أبو البركات إسماعيل）に علي はおらず、叔父 أحمد ＝ #AIND-D00687 は「وسمع علي」とサハーウィーの聴聞者で、891年生の本項主がマッカ滞在中（892〜894）のサハーウィーから幼児として聴聞した記事と整合する。初版の汚染番号 TMP-P-000530（D04287 の兄弟 علي 専用）を差し替え。'
