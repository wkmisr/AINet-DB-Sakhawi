translation:
  ja: ウマル・ブン・ムハンマド・ブン・アッ＝シャイフ・フサイン・ブン・ハサン、アル＝ファトヒー、アル＝マッキー。父については後述する。891年ズー・アル＝カアダ月にマッカで生まれ、そこで父および叔父とともに私から聴聞した。神が彼を敬虔な者に育てられるように。
  en: ʿUmar b. Muḥammad b. al-Shaykh Ḥusayn b. Ḥasan al-Fatḥī al-Makkī; his father is mentioned below. He was born in Dhū al-Qaʿda of the year 891 in Mecca, and heard from me there together with his father and his paternal uncle. May God raise him up righteous.
