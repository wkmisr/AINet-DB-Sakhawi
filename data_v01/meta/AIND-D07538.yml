translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・アフマド・ブン・ムハンマド・ブン・アフマド・ブン・アランダ、アル＝ワジーズィー・アル＝カーヒリー、糸・上質亜麻布（シャルブ）市場の仲買人（ダッラール）。その父と祖父は前述。マッカに幾度も滞在（ムジャーワラ）した者の一人。貧しく、クルアーンを朗誦し、サイード・アッ＝スアダーのスーフィーの一人であった。（八百）九十一年ズー・アル＝カアダ月にマディーナで没した。六十歳を越えていたと私は思う。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Aḥmad b. Muḥammad b. Aḥmad b. ʿAranda, al-Wajīzī al-Qāhirī, the broker (dallāl) at the market of yarn and sharb-linen. His father and grandfather have been mentioned above. He was among those who frequently sojourned (as a mujāwir) in Mecca; he was poor, recited the Qurʾān, and was one of the Sufis of Saʿīd al-Suʿadāʾ. He died in Medina in Dhū al-Qaʿda of the year (8)91, and I think he had passed sixty.
