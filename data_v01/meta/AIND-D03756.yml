translation:
  ja: アブドゥッラフマーン。著者の息子、アブドゥッラフマーン・ブン・ムハンマド・ブン・アブドゥッラフマーン・ブン・ムハンマド・ブン・アブー・バクル・ブン・ウスマーン・アッ＝サハーウィー（サハー出自、カイロの人）。ハジュリー暦875年のズー・アル＝ヒッジャ月に幼少期に没した。アッラーが彼と我らに天国を与えてくださいますように。
  en: ʿAbd al-Raḥmān, the son of the author [al-Sakhāwī]. His full name is ʿAbd al-Raḥmān b. Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. Abī Bakr b. ʿUthmān al-Sakhāwī [by origin], al-Qāhirī. He died in Dhū al-Ḥijja in the year 875 AH during his childhood. May Allah compensate him and us with Paradise.
