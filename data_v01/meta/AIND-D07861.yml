notes:
- text: '転送見出し（「فيمن جده محمد」型、REF 方式X）。転送先＝#AIND-D07839「محمد بن عبد الله بن محمد الشمس بن العمري أحد أعيان موقعي الدست ووالد ناصر الدين محمد الآتي ويعرف بابن كاتب السمسرة」（829没）。本見出し「محمد بن عبد الله الشمس بن الغمري」は「ラカブ＋بن＋家名」の形が D07839「الشمس بن العمري」と一致し、相違は غ/ع の点1つ（規則10）。同一人物への別の転送見出し #AIND-D07881「محمد بن عبد الله العمري … واسم جده محمد مضى」も D07839 を指す。corpus 自体がこの家系で ع/غ を書き違える例がある（#AIND-D07806「القرشي العدوي الغمري الحراري」は العمري 家）。集約で第1候補と第2候補を入れ替えた（内容A M、オーケストレーター決定6、§D144-3）。'
  type: reference
  target: AIND-D07839
- text: '第2候補: #AIND-D07845「محمد بن عبد الله بن محمد الغمري الخانكي مؤدب الأطفال بها … ويعرف بالخواص」（ニスバ الغمري が字どおり一致、祖父 محمد。ただしラカブ「الشمس」も「ابن الغمري」の形もない）。校閲では規則25 により字どおりの الغمري＝D07845 を target としたが、規則25 は「読み替えて別の ID を充てない」規則で、ここは候補2つのどちらを target にするかの選択なので原文の形により近い D07839 を採った（確認依頼）。corpus の محمد بن عبد الله بن محمد で الغمري／العمري を持つ項はこの2件のみ。'
  lang: ja
  type: editorial
