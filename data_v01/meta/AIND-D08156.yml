translation:
  ja: ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・アフマド・ブン・ハサン・ブン・アッ＝ザイン・ムハンマド・ブン・アル＝アミーン・ムハンマド・イブン・アル＝クトゥブ、アミーン・アッ＝ディーン・アル＝カスタッラーニー。（8）36年に一団の学者が彼にイジャーザを与えた。幼くして没したようである。
  en: Muḥammad b. ʿAlī b. Muḥammad b. Aḥmad b. Ḥasan b. al-Zayn Muḥammad b. al-Amīn Muḥammad ibn al-Quṭb, Amīn al-Dīn al-Qasṭallānī. A group (of scholars) granted him an ijāza in the year [8]36, and it seems that he died young.
