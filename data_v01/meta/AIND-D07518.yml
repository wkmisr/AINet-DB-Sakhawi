notes:
- text: '「في ابن عبد الماجد」＝転送見出し。転送先は #AIND-D07889（刊本 288 番「محمد بن عبد الأحد بن علي الشمس القاهري النحوي سبط ابن هشام ويعرف بالعجيمي وسمي العيني والده عبد الأحد … مات في عشري شعبان سنة اثنتين وعشرين」）。同項は corpus 上「محمد بن عبد الله」と「محمد بن عبد المجيد」の間＝「عبد الماجد」の配列位置にあり、本文「وسمي العيني والده عبد الأحد」（العيني は父を عبد الأحد と呼んだ）はその見出しが本来 عبد الماجد であることを示す。ニスバ索引 #AIND-D11838「العجيمي محمد بن عبد الماجد بن علي سبط ابن هشام」・#AIND-D11260「سبط ابن هشام محمد بن عبد المجيد بن علي العجيمي」も一致。corpus D07889 見出しの「عبد الأحد」は刊本／転記の異同とみられる（ISSUES §Dd-1）。'
