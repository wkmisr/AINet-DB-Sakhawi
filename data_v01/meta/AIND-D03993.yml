translation:
  ja: アブドゥルアズィーズ・ブン・アル＝ジャマール・ムハンマド・ブン・アッ＝ザイン・アブドゥルアズィーズ・ブン・アブドゥルワーヒド、アル＝イッズ・アル＝アンサーリー・アル＝マダニー。前述のハサン・ブン・ウマル・ブン・アブドゥルワーヒドの従兄弟で、イブン・ザイン・アッ＝ディーンとして知られる。マディーナで私（サハーウィー）から聴聞した者の一人。
  en: ʿAbd al-ʿAzīz b. al-Jamāl Muḥammad b. al-Zayn ʿAbd al-ʿAzīz b. ʿAbd al-Wāḥid, al-ʿIzz al-Anṣārī al-Madanī, the cousin of the aforementioned Ḥasan b. ʿUmar b. ʿAbd al-Wāḥid, known as Ibn Zayn al-Dīn. He was among those who heard from me in Medina.
