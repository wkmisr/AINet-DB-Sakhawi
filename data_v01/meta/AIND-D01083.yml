translation:
  ja: Aḥmad b. ʿAlī b. Muḥammad al-Khānkīは、後に記述されるAbū al-Khayr Muḥammadの兄弟であり、al-Nūr al-Rashīdīの孫にあたる。「al-Tājirの息子（Ibn al-Tājir）」として知られる。833年にハーンカーで生まれ育ち、クルアーンを学んだ。al-Nūr al-Bawshī、その後は故郷のカーディーであったal-Shams al-Wanāʾī、そしてMaḥmūd al-Hindīに師事した。また、その場所（ハーンカー）のスーフィー共同体の一員となった。貧しい生活を送り、善行の兆しがあった。私（サハーウィー）の許には、彼が息子を連れて現れ、その息子は私に『アル＝ミンハージュ』、『ジャムウ・アル＝ジャワーミウ』、そして『アル＝アルフィーヤ』を提示した。
  en: Aḥmad b. ʿAlī b. Muḥammad al-Khānkī was the brother of Abū al-Khayr Muḥammad (to be mentioned later) and the grandson of al-Nūr al-Rashīdī. He was known as Ibn al-Tājir. He was born and grew up in the Khānqāh in 833 H. He recited the Qurʾān and studied under al-Nūr al-Bawshī, then under the Qāḍī of his town, al-Shams al-Wanāʾī, and Maḥmūd al-Hindī. He settled into the Sufi community of the place and lived frugally, showing signs of goodness. He attended me (al-Sakhāwī) with his son, who presented to me al-Minhāj, Jamʿ al-Jawāmiʿ, and al-Alfiyya.
