translation:
  ja: ダマスカスのハージブであるジャクマク・アッ＝サファウィー。805年ムハッラム月に逮捕され、ガザに送られた。808年にナウルーズが（職務に）就任すると、彼をダマスカスに呼び戻し、ハージブ職に再任した。ナウルーズが敗れると、彼はその地（ダマスカス）で亡くなった。我らがシャイフ（イブン・ハジャル）は彼の『インバーウ』の中で彼に言及した。
  en: Jaqmaq al-Ṣafawī, the Ḥājib in Damascus. He was arrested in Muḥarram of the year 805 [Hijri], then sent to Gaza. When Nawrūz took office in 808 [Hijri], he brought him back to Damascus and reappointed him to the chamberlainship. When Nawrūz was defeated, he died there. Our shaykh (Ibn Ḥajar) mentioned him in his *Inbāʾ*.
