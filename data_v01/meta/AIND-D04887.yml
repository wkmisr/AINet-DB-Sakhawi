translation:
  ja: ウスマーン・アッ＝ドゥハイスィー・アル＝マグリビー。敬虔な学者であった。マッカに数年間隣留（ジャーワラ）し、（8）66年に同地で没した。私（サハーウィー）から学んだマグリブ人の一人が、その没年を私に伝えた。
  en: ʿUthmān al-Dukhaysī al-Maghribī. He was a righteous scholar. He sojourned (jāwara) in Mecca for some years and died there in (8)66. One of the Maghribīs who studied under me gave me the date of his death.
