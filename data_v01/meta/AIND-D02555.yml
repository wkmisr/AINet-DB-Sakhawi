translation:
  ja: ハサン・ブン・アブドゥルラフマーン・ブン・シュジャーウ、アル＝バドル・ブン・アッ＝ザイン、アル＝ムクリ。アル＝アクサー・モスクのイマームであるカリーム・アッ＝ディーン・アブドゥルカリーム・ブン・アビー・アル＝ワファーは、彼（ハサン）のもとでアル＝ファーティハ（開端章）とアル＝バカラ（雌牛章）を七大朗誦法に従って朗誦し、彼を『学識あるイマーム』と評したと述べた。
  en: al-Ḥasan b. ʿAbd al-Raḥmān b. Shujāʿ, al-Badr b. al-Zayn, al-Muqriʾ. The Imam of al-Aqṣā, Karīm al-Dīn ʿAbd al-Karīm b. Abī al-Wafā, said that he recited to him (al-Ḥasan) the Fātiḥa and al-Baqara according to the Seven Recitations, and described him as 'the learned Imam'.
