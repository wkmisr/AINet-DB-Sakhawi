translation:
  ja: アフマド・ブン・アリー・ブン・アフマド、シハーブ・アッ＝ディーン・アル＝バグダーディー・アッ＝シャーフィイー。イラクの巡礼団のカーディーを務め、イブン・アッ＝ドゥフナとして知られる。アッ＝ブルジュにしばらく投獄された後、私（サハーウィー）が彼にイジャーザを与えた後、釈放された。
  en: Aḥmad b. ʿAlī b. Aḥmad al-Shihāb al-Baghdādī al-Shāfiʿī, the judge of the Iraqi caravan, known as Ibn al-Dukhnah. He was imprisoned in al-Burj for a period, then released after I (al-Sakhāwī) granted him an ijāza.
