translation:
  ja: アハマド・ブン・アブドゥルカーフィー・ブン・アブドゥルワッハーブ・アル＝ビリーニー（al-Bilīnī）。我らがシャイフ（イブン・ハジャル）は自身の著書『インバーウ・ル＝グムル』において806年に彼を言及しているが、それはちょうど100年の間違いである。彼の死没年は706年であった。我らがシャイフは『ドゥラール・ル＝カーミナ』においては彼に言及していない。
  en: Aḥmad b. ʿAbd al-Kāfī b. ʿAbd al-Wahhāb al-Bilinī. Our shaykh (Ibn Ḥajar) mentioned him in the year 806 H in his 『Inbāʾ al-Ghumr』, but this was a mistake of exactly one hundred years, for his death was in the year 706 H. Our shaykh did not mention him in 『al-Durar al-Kāmina』.
