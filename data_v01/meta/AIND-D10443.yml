translation:
  ja: ユースフ・ブン・アフマド・ブン・ムハンマド、アル＝ジャマール、アル＝ムルターニー、スィジスターンの出、アル＝クジャラーティー、アル＝アフマダーバーディー、アル＝ハナフィー。849年サファル月にアフマダーバードで生まれた。文法・形態論などの初歩を他の者から学んだのち、同郷のニザーム・アッ＝ディーン（ガウス・アル＝ムルクの称号をもつ）から『シャルフ・アル＝マワーキフ』や『ラワーミウ』などの理性的諸学を学び、神学・論理学・星学・歴史などに秀でた。学生たちに理性的諸学を教えることに専心し、スルターン・マフムードは彼を諸国（王国全土）のヒスバ職に就け、彼は配下の者を代理に立てている。以上は、彼の学生で私（サハーウィー）からも学んだ複数の者が私に語ったことである。
  en: Yūsuf b. Aḥmad b. Muḥammad, al-Jamāl, al-Multānī, of Sijistānī origin, al-Kujarātī, al-Aḥmadābādī, al-Ḥanafī. He was born in Ṣafar of the year 849 in Aḥmadābād. After studying the elementary subjects, such as grammar and morphology, with others, he studied the rational sciences, such as Sharḥ al-Mawāqif and al-Lawāmiʿ, with his fellow townsman Niẓām al-Dīn, who bears the title Ghawth al-Mulk; he distinguished himself in theology, logic, astronomy, history and other fields. He devoted himself to teaching students the rational sciences, and Sultan Maḥmūd appointed him to the ḥisba throughout the realm, in which he appoints deputies under him. More than one of his students who also studied with me (al-Sakhāwī) told me this.
