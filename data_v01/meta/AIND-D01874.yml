translation:
  ja: アズバク・アッ＝ザーヒリー・バルクーク、通称アズバク・ハーッス・ハラジー。 彼の師に特別視され、彼の多大な悪行と扇動にもかかわらず、高位を与えられ、ムカッダム（上位アミール）の一人となった。しかし、彼は容姿が良く、勇敢で知られていた。彼はヒジュラ暦807年頃に殺害された。
  en: Azbak al-Ẓāhirī Barqūq, known as Azbak Khāṣṣ Kharajī. He was special to his master, who promoted him to become one of the muqaddams, despite his abundant evil and mischief. However, he was handsome and famous for his bravery. He was killed in approximately the year 807 H.
