translation:
  ja: アブドゥッラー・ブン・ウマル・ブン・ウスマーン、アブー・ムハンマド、アッ＝シャンマリー・アル＝ミルハーニー。アッ＝シハーブ・アフマド・イブン・アビー・バクル・アン＝ナーシリーのもとで法学を修め、タイッズのカーディー職に就いた。その後しばらくアデンに滞在し、（八百）二十年より前に没した。彼の墓はザビードのナーシリー家の墓地にある。
  en: ʿAbd Allāh b. ʿUmar b. ʿUthmān, Abū Muḥammad al-Shammarī al-Milḥānī. He studied jurisprudence under al-Shihāb Aḥmad b. Abī Bakr al-Nāshirī and held the judgeship of Taʿizz, then resided for a time in Aden. He died before the year [8]20 AH, and his grave is at the cemetery of the Nāshirīs in Zabīd.
