translation:
  ja: ユースフ・ブン・ルスラーン・ブン・ムハンマド・ダグシュ（無点のダール、次に点付きの二文字、「アブス」の型）、バフナサー出身のカイロの人。美貌の薔薇水商で、ガルス〔・ッディーン〕・ハリール・ブン・ハーッス・バクとその姻戚イーナールに、その庇護のもとで近づき、〔イーナールの〕昇進の前に巡礼した。イーナールがスルタンになると、彼は命令する側の人となって富を築き、巨大な邸宅を建て、スルタンの建築事業などに口を出し、さらに宝庫、飲料庫、スルタンの厨房の監督官となり、それらの証人職も兼ねた——証人職はムフリキーから受け継いだ。訴訟で頼られ、無学ながら名士に数えられた。867年ジュマーダー第1月に60歳近くで没し、バーブ・アル＝ジャディード外のクシュタムル廟に、カラークジャー・アル＝ハサニーの区画の隣に自ら建てた区画に葬られた。神が彼と我々を赦したまえ。
  en: Yūsuf b. Ruslān b. Muḥammad Daghsh (dāl, then ghayn and shīn, on the pattern of ʿAbs), of Bahnasā origin, Cairene. He was a handsome rose-water seller who won the favour of al-Ghars Khalīl b. Khāṣṣ Bak and his in-law Īnāl under the latter's protection, and made the pilgrimage before Īnāl's rise; when Īnāl became sultan he came to command and forbid, grew rich, built an enormous house, had a say in the royal buildings and more, and was supervisor of the treasury store, the beverage-house and the royal kitchen, together with their notaryship, which he had received from al-Muḥriqī. He was resorted to in lawsuits and counted among the notables despite his lack of learning. He died in Jumādā I 867, nearing sixty, and was buried in the mausoleum of Qushtamur outside Bāb al-Jadīd, next to the enclosure of Qarāqajā al-Ḥasanī, in an enclosure he had built for himself.
