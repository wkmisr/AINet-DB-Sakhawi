translation:
  ja: ムハンマド・ブン・アブドゥッラー、アッ＝サドル・ブン・アル＝ジャマール、アッ＝ルーミー・アル＝ハナフィー。我らがシャイフ（イブン・ハジャル）は『インバー』でこのように彼を記したが、正しくは（ムハンマド・）ブン・ムハンマド・ブン・アフマド・ブン・イスマーイールである。
  en: Muḥammad b. ʿAbd Allāh, al-Ṣadr b. al-Jamāl, al-Rūmī al-Ḥanafī. Thus our shaykh (Ibn Ḥajar) recorded him in his Inbāʾ; the correct form is (Muḥammad) b. Muḥammad b. Aḥmad b. Ismāʿīl.
