notes:
- text: '転送見出し（「صوابه …」型＝訂正転送、REF 方式X、先例 B139-143 D07838。立項連番 266 があっても REF（規則13））。転送先 #AIND-D08551「محمد بن محمد بن أحمد بن إسماعيل بن داود الصدر بن الشمس بن الشهاب الرومي القاهري الحنفي والد الصدر محمد الآتي ، وسمي شيخنا والده عبد الله وهو سهو بل عبد الله أخ لصاحب الترجمة … قال شيخنا في انبائه … مات سنة خمس وعشرين」（825没）。相手側本文の「وسمي شيخنا والده عبد الله وهو سهو」が本見出しの訂正と正確に対応。'
