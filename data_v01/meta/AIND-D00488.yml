translation:
  ja: アフマド・ブン・アフマド・ブン・ハサン・ブン・アリー・ブン・ムハンマド・ブン・アブド・アッラフマーン（尊称シャハーブ、イマーム・アル=アズライーの出自を持つカイロ人、彼の母はトルコ人で父の侍女であった）。およそ831年生まれ。クルアーンを暗記し、バーシティーヤのハンカーの会員となり、その傍らに家を建てた。そして私（＝サハーウィー）のもとでバルクーキーヤのマドラサなどで授業に出席し、実によい人物であった。
  en: Aḥmad b. Aḥmad b. Ḥasan b. ʿAlī b. Muḥammad b. ʿAbd al-Raḥmān, al-Shahāb, from the family of al-Imām al-Adhraʿī by origin, al-Qāhirī. His mother was a Turkish slave-girl of his father. He was born around 831 H. He memorized the Qurʾān, joined the Sufi community of al-Bāsiṭiyya and other places, and built a house for himself next to it. He attended my lessons (al-Sakhāwī's) at al-Barqūqiyya and other institutions, and he was an excellent man.
