translation:
  ja: ムハンナー・ブン・フサイン・ブン・アリー、アッ＝シャラフ、アル＝バグダーディー、文字学（ハルフ学）の学者の長老の一人。アル＝マクリーズィーは『ウクード』で「彼は数年にわたって私に随伴し、有益な知識を持っていた」と述べている。（8）10年頃に約80歳で没した。
  en: 'Muhannā b. Ḥusayn b. ʿAlī, al-Sharaf, al-Baghdādī, one of the senior masters of the scholars of the science of letters (ʿilm al-ḥarf). Al-Maqrīzī said in his ʿUqūd: "He kept my company for years, and he possessed useful pieces of knowledge." He died around the year [8]10, aged about eighty.'
