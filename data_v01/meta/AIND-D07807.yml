translation:
  ja: ムハンマド、アル＝ジャマール・ブン・アル＝アフィーフ、直前の者の兄弟。795年サファル月にマッカで生まれ、そこでアル＝ブルハーン・ブン・スィッディークから『サヒーフ・アル＝ブハーリー』を（一部欠落を伴って）聴聞した。イブン・アビー・アル＝バカー、イブン・アン＝ナースィフ、アル＝カマール・アッ＝ダミーリー、アル＝イラーキー、アル＝ハイサミーなど一群の人々が彼にイジャーザを与えた。商業に携わってイエメンとサワーキン島に赴き、841年サファル月の上旬にそこで没した。アン＝ナジュム・ウマル・ブン・ファハドがその『ムウジャム』とその続編で彼に言及している。
  en: Muḥammad, al-Jamāl b. al-ʿAfīf, brother of the preceding. He was born in Ṣafar of the year 795 in Mecca, and heard there from al-Burhān b. Ṣiddīq the Ṣaḥīḥ of al-Bukhārī with some gaps; a number of scholars granted him ijāza, such as Ibn Abī al-Baqāʾ, Ibn al-Nāṣiḥ, al-Kamāl al-Damīrī, al-ʿIrāqī and al-Haythamī. He went into trade to Yemen and the island of Sawākin, and died there in the first ten days of Ṣafar of the year 841. Al-Najm ʿUmar b. Fahd mentioned him in his Muʿjam and its supplement.
