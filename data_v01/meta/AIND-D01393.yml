translation:
  ja: アフマド・ブン・ムハンマド・ブン・ウスマーン・ブン・スライマーン（アッ＝シャハーブ、イブン・アル＝ムヒッブ）は、カルムを起源とし、カイロに住んだハナフィー派の人物で、イブラーヒームとムハンマドの兄弟である。彼は父と同様にイブン・アル＝アシュカルとして知られていた。父の代わりにハーンカー・アッ＝スィリヤーキウスィーヤのシャイフ職に就任したが、その後解任され、再任されたが、末弟にその職を譲った。彼は目立った行動をせず、浪費家であった。
  en: Aḥmad b. Muḥammad b. ʿUthmān b. Sulaymān (al-Shihāb, Ibn al-Muḥibb) was originally from Qarm, resided in Cairo, and was a Hanafi scholar. He was the brother of Ibrāhīm and Muḥammad, and like his father, was known as Ibn al-Ashqar. He assumed the shaykhdom of the Khānqāh al-Saryāqūsiyya in place of his father, was subsequently dismissed, then reinstated, but later relinquished the position to his younger brother. He was inconspicuous in his actions and extravagant.
