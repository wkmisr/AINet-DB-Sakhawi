    ar: مات في شوال سنة خمس وستين بطريق جدة وحمل إلى مكة فدفن ببيت عبد الكبير الحضرمي بسوق الليل بوصية منه ثم نقله الشيخ في تربته بالشبيكة
    ja: '865-10＝1461-07-19 開始、月精度 1461-07（h2g.py。初版 @when="1461" は年精度）。没地「طريق جدة」（ジッダへの道中）は固有地名でない相対表現なので、「خارج مكة」→gn:104515 の repo 慣行（D01681・D08085）に倣い ジッダ（TMP-L-00036）を参照させ原文句のまま置く（初版は #NEEDID）。遺体はマッカに運ばれ（搬送先 مكة は埋葬地の所在として下記に含まれる）、本人の遺言で سوق الليل（マッカの街区、ID-Master 未登録 → TMP-L-00403）にある عبد الكبير الحضرمي の家に葬られ、のち「الشيخ」（＝直前の عبد الكبير الحضرمي 本人、#AIND-D04238。869年没で865年当時は在世、彼自身の墓所は「دفن بباب الشبيكة في المكان المعروف به」）が自分の墓所 الشبيكة（TMP-L-00146）の تربة に移した＝改葬先を TMP-I-00277「تربة عبد الكبير الحضرمي بالشبيكة」とする（#AIND-D10196「دفن بتربة أبيه من باب شبيكة」・#AIND-D13645「دفنت عند أبيها بالشبيكة」・#AIND-D02193「دفن عند والده بالشبيكة」と同じ墓所）。初版の placeName「الشبيكة」（TMP-L-00146）はこの تربة に置換。【集約 2026-11-08】(1) 原文の地名 الشبيكة（ID-Master 既登録 TMP-L-00146）を placeName として戻し、墓所 TMP-I-00277 と併置した（規則22(2)・v13.43(c)、内容A M、オーケストレーター決定9）。(2) 搬送先 مكة（「وحمل إلى مكة」、gn:104515、type burial）を立てた（規則60(g)、先例 #AIND-D03123・#AIND-D10000。機械 L、決定12）。(3) 没地「طريق جدة」は جدة 本体ではない（原文の地を別の地に読み替えない、規則22(1)）ので ref TMP-L-00036
      を外し、原文句のみの placeName とした（内容A L。確認依頼）。'
