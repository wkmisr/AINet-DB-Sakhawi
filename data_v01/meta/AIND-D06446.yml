translation:
  ja: ムバーラク・ブン・クファイフ・ブン・フダイル・ブン・ドゥハイン（これらは縮小形で読む）、アル＝アドワーニー。865年シャウワール月にジッダへの道中で没し、マッカに運ばれて、本人の遺言によりスーク・アッ＝ライルにあるアブド・アル＝カビール・アル＝ハドラミーの家に葬られたが、のちシャイフ（アブド・アル＝カビール）が彼をアッ＝シャビーカにある自分の墓所に移した。
  en: Mubārak b. Qufayf b. Fuḍayl b. Dukhayn (all in the diminutive) al-ʿAdwānī. He died in Shawwāl 865 on the road to Jidda and was carried to Mecca, where, in accordance with his own bequest, he was buried in the house of ʿAbd al-Kabīr al-Ḥaḍramī in Sūq al-Layl; the Shaykh later transferred him to his own tomb in al-Shabīka.
