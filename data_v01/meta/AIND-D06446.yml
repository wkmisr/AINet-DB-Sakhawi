    ja: '規則3・12。父 قفيف بن فضيل بن دخين العدواني は corpus に本伝なし（hw.py「قفيف」該当は本項・兄弟 #AIND-D01171・姉妹 #AIND-D13556・索引 #AIND-D12649 のみ）、ID-Master 未登録（「قفيف」該当なし）。珍しい名（識別要素）で祖父・曾祖父名まで復元でき、本伝のある兄弟項 D01171「أحمد بن قفيف بن فضيل بن ذحير ثلاثتها بالتصغير العدواتي … ويعرف بأبيه」（刊本の綴り ذحير／العدواتي）・姉妹項 D13556「قندولة ابنة قفيف بن فضيل بن دخين … العدواني」と共有する父なので新規 TMP-P-001703 を発行。登録名は本項と D13556 の綴り（دخين・العدواني）に揃え、D01171 の異綴りは TSV Note に記す。初版は father relation なし。'
