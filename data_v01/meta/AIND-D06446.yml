  note:
    ja: '「فدفن ببيت عبد الكبير الحضرمي بسوق الليل بوصية منه ثم نقله الشيخ في تربته بالشبيكة」。本人の遺言で عبد الكبير الحضرمي の家に葬られ、のち الشيخ（＝عبد الكبير）が自分の墓所に改葬した＝師弟・帰依の関係が示唆されるが原文に明示の語（مريد 等）がないので subtype="other"（規則12・60(d)）。عبد الكبير الحضرمي ＝ #AIND-D04238「عبد الكبير بن عبد الله بن محمد بن أحمد بن علي بن أحمد بن محمد بن عبد الله أبو حميد الأنصاري … الحضرمي اليماني نزيل مكة ووالد يس الآتي … استوطن مكة وابتنى بها زاوية … مات وقد زاد على السبعين بمكة … سنة تسع وستين ودفن بباب الشبيكة في المكان المعروف به」（repo 未収録。#AIND-D04472 で maternal_uncle として使用済み）。名＋ニスバ＋マッカの الشبيكة の墓所（本項「تربته بالشبيكة」）の3点で閉合。初版の無効 subtype「host of initial burial」（#NEEDID）を置換。'
notes:
- text: '兄弟 #AIND-D01171「أحمد بن قفيف بن فضيل بن ذحير ثلاثتها بالتصغير العدواتي خال محمد بن بدير ويعرف بأبيه . قتلهما الشريف محمد بن بركات … سنة ثلاث وسبعين」・姉妹 #AIND-D13556「قندولة ابنة قفيف بن فضيل بن دخين ، بتصغير الثلائة ، العدواني امرأة بديد . ماتت في شوال سنة سبعين」・索引 #AIND-D12649「ابن قفيف أحمد ومبارك」。本項に兄弟姉妹の名指しはないため relation は立てない（規則23。父が #NEEDID なので cert medium で立てる余地はあるが、相手側も本項主を名指ししないので note に留める）。見出しの「بالتصغير فيها」＝ナサブの名（قفيف・فضيل・دخين）が縮小形で読まれることの注記。'
