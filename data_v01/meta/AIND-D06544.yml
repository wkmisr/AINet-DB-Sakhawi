translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・ムハンマド・イブラーヒーム、アル＝ジュザーミー、アル＝バランティーシー、アル＝マグリビー。アブドゥッラー・ムハンマドの父であるアブー・アル＝カースィム・ブン・ムハンマドの従兄弟（父方おじの子）で、この二人は後出。学問に従事し、読んだ者の一人。
  en: Muḥammad b. Ibrāhīm b. Muḥammad Ibrāhīm al-Judhāmī al-Barantīshī al-Maghribī, paternal cousin of Abū al-Qāsim b. Muḥammad, the father of ʿAbd Allāh Muḥammad, both of whom will come below. He was among those who studied and read.
