notes:
- text: '(1) 見出しの「والد عبد الله محمد الآتيين」は直前の أبو القسم بن محمد にかかる（規則63 (b)）: 「（أبو）عبد الله محمد の父である أبو القسم」。双数「الآتيين」＝後出の二人は أبو القسم（#AIND-D11085、クンヤ部）と その子 محمد（#AIND-D08474「محمد بن أبي القسم … الشمس أبو عبد الله … الجذامي البرنتيشي」、859年生）。同家の #AIND-D00166 の見出しが同じ言い回しを持つ:「إبراهيم بن عبد الملك بن إبراهيم الجذامي البرنتيشي … تاجر السلطان وابن عم أبي القاسم بن محمد بن إبراهيم والد صاحبنا أبي عبد الله محمد الآتي」。したがって本項主は誰かの父とは書かれていない（子の relation は立てない。ブリーフの「والد عبد الله ومحمد الآتيين」は原文にない「و」を補った読み）。(2) 見出しの「بن محمد إبراهيم」は刊本どおり（「بن」1つ欠か）。(3) #AIND-D00166（名は إبراهيم、商人、880年没）も「ابن عم أبي القاسم بن محمد」で、索引 #AIND-D11482 は「إبرهيم بن محمد بن إبرهيم تاجر السلطان وابن أخيه الشمس محمد بن أبي القسم」と書く＝この家のナサブの伝えは項ごとに揺れている。本項と D00166 は名が異なるので同一人物とはしない（ISSUES §D170-4）。'
