translation:
  ja: シャーヒーン・アッ＝シュジャーイー。ダマスクスの侍従職（ヒジューブィーヤ）を務め、シャーム（シリア）の巡礼隊とともに巡礼を行い、ダマスクス城塞の副官職（ニヤーバ）を務めた。844年シャウワール月に同地（ダマスクス）で没した。イブン・アッ＝ラブーディーもまた彼の没年を記録している。
  en: Shāhīn al-Shujāʿī. He held the chamberlainship (ḥujūbiyya) of Damascus, performed the pilgrimage with the Syrian caravan, and held the vicegerency of the citadel of Damascus. He died there in Shawwāl of the year 844. Ibn al-Lubūdī also recorded his death.
