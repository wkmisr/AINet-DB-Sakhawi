translation:
  ja: ウマル・アル＝バフラムシー・アル＝マハッリー・アル＝ガムリー。アブー・アブドゥッラー・アル＝ガムリーの古参の同伴者の一人。879年ズー・アル＝カアダ月に没した。100歳に迫るか、あるいはそれを超えており、我々は彼のために不在者の葬礼礼拝（サラート・アル＝ガーイブ）を行った。彼は常に浄め（タハーラ）と（クルアーンの）誦読を保ち、一晩でクルアーンを完誦していたと広く伝えられている。私の聞いたところでは、生涯一度も結婚しなかった。アッラーが彼と我々を憐れみたまわんことを。
  en: ʿUmar al-Bahramashī al-Maḥallī al-Ghamrī, one of the senior companions of Abū ʿAbd Allāh al-Ghamrī. He died in Dhū al-Qaʿda 879, having neared one hundred years of age or passed it, and we performed the absentee funeral prayer (ṣalāt al-ghāʾib) over him. He constantly maintained ritual purity and Qurʾān recitation, so that it was widely reported that he would complete the whole Qurʾān in a single night; as far as I was told, he never married. May God have mercy on him and on us.
