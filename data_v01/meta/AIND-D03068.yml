translation:
  ja: サバウ・イブン・ハッジャーン・イブン・ムハンマド・イブン・マスウード・アル＝ハサニー。ヤンブウのアミール（総督）。何度もその職に就き、ハジュ（巡礼）の月（ズー・アル＝ヒッジャ）のヒジュラ暦887年に没した。彼の死後、ヒジャーズの支配者の決定により、ダッラージュ・イブン・ムフリーが後任としてその職に就いた。
  en: Sabaʿ ibn Hajjān ibn Muḥammad ibn Masʿūd al-Ḥasanī, the emir of Yanbuʿ. He governed it time after time until he died in Dhu al-Hijjah, 887 AH. After him, Darrāj ibn Mufrī was established as governor by a decree from the ruler of al-Ḥijāz.
