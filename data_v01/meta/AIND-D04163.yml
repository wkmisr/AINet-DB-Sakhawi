translation:
  ja: アブドゥルカーディル・ブン・ウマル・ブン・ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・イブラーヒーム・ブン・ウマル・ブン・イブラーヒーム・アル＝ジャアバリー・アル＝ハリーリー。その父の伝記は後述される。ハブロン（アル＝ハリール）にて828年ズー・アル＝カアダの最後の10日間に生まれ、同地で育った。クルアーンを暗記し、幼少期に父とともに、イブン・アル＝ジャザリー、アッ＝タドムリー、アズィーマートのもとで、またアッ＝ザイン・アル＝バルシャキーのもとで『アッ＝シファー』の読了（聴聞）に出席した。その後、アッ＝タドムリーのもとでイブン・クライブの『マシヤハ』からの選集や、イブン・アブドゥルサラームの『ムンヤト・アル＝スール』を聴聞した。また、アル＝カバービーおよび我らがシャイフ（イブン・ハジャル）からイジャーザを与えられた。ハッジ（巡礼）を行い、シャーム（シリア）およびカイロに入り、889年に同地でわずかながらハディースを伝承した。
  en: ʿAbd al-Qādir b. ʿUmar b. Muḥammad b. ʿAlī b. Muḥammad b. Ibrāhīm b. ʿUmar b. Ibrāhīm al-Jaʿbarī al-Khalīlī, whose father is mentioned below. He was born in Hebron in the last ten days of Dhu al-Qaʿdah in the year 828 AH and grew up there. He memorized the Qurʾān and attended, in his youth alongside his father, the lectures of Ibn al-Jazarī, al-Tadmurī, and ʿAẓīmāt, as well as al-Zayn al-Burshukī for the completion of 『al-Shifāʾ』. He then heard from al-Tadmurī the selection from 『Mashyakhat Ibn Kulayb』 and 『Munyāt al-Sūl』 by Ibn ʿAbd al-Salām. He was granted an ijāza by al-Qabābī and our shaykh (Ibn Ḥajar). He performed the Ḥajj, entered Syria and Cairo, and transmitted a small amount of hadith there in the year 889 AH.
