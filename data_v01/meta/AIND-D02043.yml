translation:
  ja: アクブガー・アル＝ジュンディーは、ナーシル（スルタン）の小ダワーダール（副ダワーダール）を務めた法学者（ファキーフ）であった。 806年ジュマーダー・アル＝ウーラー月22日火曜日の夜に死去し、翌日埋葬された。 彼は多くの遺産を残したが、言い伝えによれば現金の金貨1万2千ディナールも含まれており、これをナーシルが受け取った。 彼は職務において評価されておらず、むしろ賄賂や汚職、公金横領、禁じられた行為に手を染めたことで知られていたと、アル＝アイニーが語っている。
  en: Aqbaghā al-Jundī, the faqīh and junior dawādār for al-Nāṣir. He died on the night of Tuesday, the 22nd of Jumādā al-Ūlā, in the year 806 H, and was buried the next morning. He left a substantial estate, including, it is said, twelve thousand gold dinars in cash, which al-Nāṣir subsequently seized. He was not commended in his official capacity; rather, he was known for bribery, corruption, embezzlement of funds, and engaging in forbidden acts, as reported by al-ʿAynī.
