translation:
  ja: ナースィル・ブン・ハリール・ブン・アフマド・ブン・スライマーン、アル＝アーディル・ブン・アル＝カーミル・ブン・アル＝アシュラフ・ブン・アル＝アーディル、アル＝アイユービー。（8）56年ラビーウ第一月に父を襲い、縛ったまま処刑した。これはその（父の）項で既に述べたとおりである。彼は城（アル＝ヒスン）を領し、約7か月続いた。ついで、彼の従兄弟で、殺された者の継子であるハサン・ブン・ウスマーンが彼を襲い、義憤から彼を殺した。そして殺された者の兄弟アフマドを呼び寄せた。アフマドは、このナースィルを恐れてタブリーズのスルターン・ジャーハーンシャーのもとに身を寄せていたのであり、こうして城を領した。これはハムザの部で既に述べたとおりである。
  en: Nāṣir b. Khalīl b. Aḥmad b. Sulaymān, al-ʿĀdil b. al-Kāmil b. al-Ashraf b. al-ʿĀdil, al-Ayyūbī. He fell upon his father and put him to death in captivity in Rabīʿ I of the year [8]56, as I have related in his (father’s) entry, and took possession of al-Ḥiṣn, where he lasted about seven months. Then his cousin and the stepson of the murdered man, Ḥasan b. ʿUthmān, fell upon him and killed him out of indignation, and sent for Aḥmad, the brother of the murdered man, who was at the time a refugee with Sultan Jāhānshāh in Tabrīz for fear of this Nāṣir; he then took possession of al-Ḥiṣn, as I have related under the letter hamza.
