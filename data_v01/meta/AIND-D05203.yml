translation:
  ja: アリー・ブン・アブド・アッ＝ラフマーン・ブン・サリーム、アスカラーン出自のアル＝ジャナーニー・アル＝アズハリー。前述のシャイフ・サリームの兄弟。彼は兄弟の少し前に没し、善良な人であった。我らがシャイフ（イブン・ハジャル）が『インバー』の840年の項の兄弟の伝記の中でそう述べ、「彼は80歳を超えていたと私は思う。アッラーが彼を憐れみたまえ」と言っている。
  en: 'ʿAlī b. ʿAbd al-Raḥmān b. Salīm, of ʿAsqalānī origin, al-Janānī al-Azharī, the brother of the Shaykh Salīm mentioned above. He died shortly before his brother and was a good man. Our shaykh (Ibn Ḥajar) said so in the biography of his brother under the year 840 in his Inbāʾ, adding: "I think he had passed eighty; may God have mercy on him."'
