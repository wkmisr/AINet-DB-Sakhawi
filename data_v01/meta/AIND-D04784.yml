translation:
  ja: アブドゥルワッハーブ・ブン・ウマル・ブン・ムハンマド、アッ＝タージュ、アッ＝ザルイー、のちにアル＝カーヒリー、ハナフィー派。我らが師（イブン・ハジャル）のナキーブであり、前出のイブラーヒームの兄弟。イブン・アル＝アシュカルと親密であり、思うに彼の仲介によって我らが師は彼を自身のナキーブ職に据えた。それどころか、アッ＝ザーヒル・ジャクマクも彼に好意を寄せていた。彼は貞潔で、信心深さに立ち返り、喜捨を好み、義人たちへの崇敬をもっていたが、鈍重なところがあった。思うに〔8〕50年頃、あるいはその少し後に没した。
  en: ʿAbd al-Wahhāb b. ʿUmar b. Muḥammad, al-Tāj al-Zurʿī, then al-Qāhirī, the Ḥanafī. He was the naqīb of our shaykh (Ibn Ḥajar) and the brother of Ibrāhīm, mentioned above. He was closely attached to Ibn al-Ashqar, and I think it was through his mediation that our shaykh installed him in his office of naqīb; indeed, al-Ẓāhir Jaqmaq was inclined towards him. He was chaste, with a leaning to piety, a desire for almsgiving and a belief in the righteous, though he was dull. He died, I think, around [8]50 or a little after.
