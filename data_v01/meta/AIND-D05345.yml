    ja: 「بن شيخ الخدام بالحرم المدني المحمدي الآتي」。父＝#AIND-D06302（立項番号694「قانم المحمدي الظاهر جقمق والد علي الماضي . ولد تقريبا سنة إحدى وثلاثين وثمانمائة واستقر في مشيخة الخدام بالحرم النبوي بعد موت إينال الإسحاقي … ولما كنت بالمدينة أخذ عني أشياء」、未受領）。「الآتي」⇄「والد علي الماضي」の相互参照・المحمدي・شيخ الخدام بالحرم النبوي が一致。ただし名は本項「قاسم」・父項「قانم」と刊本で1字異なる（規則25により本項は原文どおり قاسم を保持、綴りの不一致を記録 → ISSUES §D122-3）。初版の TMP-P-000811 は ID-Master 未登録の幻番号。
