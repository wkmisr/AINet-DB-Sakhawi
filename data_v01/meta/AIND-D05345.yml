translation:
  ja: アリー・ブン・カースィム、アル＝アラー、アブー・アル＝ハサン、マディーナのハラムの奉仕者長（シャイフ・アル＝フッダーム）アル＝ムハンマディー（後述する）の子。わずかに学問に従事した者の一人で、マディーナで私のもとに付き従い、ついには私に『シファー』を読み、私から諸々を聴聞した。
  en: ʿAlī b. Qāsim, al-ʿAlāʾ Abū al-Ḥasan, son of the chief of the servants (shaykh al-khuddām) of the Medinan Sanctuary, al-Muḥammadī, who will come below. He is among those who studied a little; he attended me assiduously in Medina until he read al-Shifāʾ to me and heard various things from me.
