translation:
  ja: ムハンマド・ブン・アフマド・ブン・アフマド・ブン・ムハンマド、アル＝ジャマール・ブン・アッ＝シハーブ・アル＝ブーニー。（8）40年の少し後にマッカで生まれ、父と同じくマッカの領主に仕えて、トルコ人のことやその他のことに当たりながら育ち、不動産などで財を成した。
  en: Muḥammad b. Aḥmad b. Aḥmad b. Muḥammad, al-Jamāl b. al-Shihāb al-Būnī. He was born shortly after [8]40 in Mecca and grew up, like his father, in the service of the lord of Mecca, in [the affairs of] the Turks and other matters, and he grew rich through real estate and other things.
