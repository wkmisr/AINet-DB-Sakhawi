translation:
  ja: ウマル・ブン・アリー・ブン・タールート・ブン・アブドゥッラー・ブン・スワイド、ルクヌッディーン・アン＝ナービティーのちアッ＝ディマシュキー、同地のバーディリーヤの管財人。軍人の装いをしていた。（80）6年ズー・ル＝ヒッジャ月に没した。我らがシャイフが『インバー』でそう述べている。
  en: ʿUmar b. ʿAlī b. Ṭālūt b. ʿAbd Allāh b. Suwayd, Rukn al-Dīn al-Nābitī then al-Dimashqī, nāẓir of the Bādiriyya there. He dressed in the garb of the soldiery. He died in Dhū al-Ḥijja (80)6; so said our shaykh in his Inbāʾ.
