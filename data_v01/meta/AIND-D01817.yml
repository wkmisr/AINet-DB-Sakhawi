translation:
  ja: ザーヒル・モスクの門に隣接して住んでいたアハマド・アッ＝サーミト（「ズワイバ」としても知られる）は、860年ズー・アル＝カアダ月16日（日）に死去し、そこ（カイロ）の道沿いのザウィヤに埋葬された。彼は敬虔な人物であった。アル＝ムニールが彼について言及している。
  en: Aḥmad al-Ṣāmit al-Mujāwir, known as Dhuwayba, resided by the gate of Jāmiʿ al-Ẓāhir. He died on Sunday, the 16th of Dhū al-Qaʿda, 860 AH, and was buried in a zawiya along the road there. He was a revered person. Al-Munīr mentioned him.
