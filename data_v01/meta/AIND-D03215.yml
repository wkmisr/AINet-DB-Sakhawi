translation:
  ja: スードゥーン・アッ＝スードゥーニー。10人長（アミール・アシャラ）、およびスルターンの厩舎長（アミール・アーフル）。ヒジュラ暦837年ラマダーン月に没した。善良で、その経歴は称賛されるものであった。アル＝アイニーが彼について言及している。
  en: Sūdūn al-Sūdūnī. An emir of ten (amīr ʿashara) and the Sultan's master of the stable (amīr ākhūr). He died in Ramaḍān in the year 837 AH. He was good and of praiseworthy conduct. Al-ʿAynī mentioned him.
