translation:
  ja: クムシュブガー。アレクサンドリアでシャリーアの判決により処刑されたアミール・アーフール（厩舎長）バフシュバーイのマムルーク。次いでスルターン直属マムルークの一人となり、ついに867年、アッ＝ザーヒル・フシュカダムへの献金によりアレッポ城塞の代官職（ニヤーバ）を得た。次いでアル＝ビーラの代官職に転じたが、ほどなく868年シャウワール月下旬に同地で没した。
  en: Kumushbughā, a mamlūk of the amīr ākhūr Bakhshbāy, who was executed by legal judgement in Alexandria. He then became one of the royal mamlūks, until he obtained the deputyship (niyāba) of the Citadel of Aleppo by a payment to al-Ẓāhir Khushqadam in the year 867. He was then transferred to the deputyship of al-Bīra, and before long he died there in late Shawwāl of the year 868.
