translation:
  ja: ムーサー・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラフマーン・ブン・イブラーヒーム、アッ＝シャラフ・ブン・アル＝ジャマール・ブン・ジャマーア、アル＝マクディスィー。イブラーヒームの同母兄弟で、カーディー・サアド・アッ＝ディーン・ブン・アッ＝ディーリーの外孫。諸書を暗記し、アル＝カマール・ブン・アビー・シャリーフらのもとで学問に従事した。幼い頃、我々とともに祖父らから聴聞した。優れ、教授し、信仰心と善良さと世俗からの隔たりを備えていた。巡礼を行い、説教職（ヒターバ）などの持分を持っていた。
  en: Mūsā b. ʿAbd Allāh b. Muḥammad b. ʿAbd al-Raḥmān b. Ibrāhīm, al-Sharaf b. al-Jamāl b. Jamāʿa al-Maqdisī, full brother of Ibrāhīm and maternal grandson of the qāḍī Saʿd al-Dīn b. al-Dīrī. He memorized books, studied under al-Kamāl b. Abī Sharīf and others, and, while still young, heard together with us from his grandfather and others. He excelled and taught, with piety, goodness and withdrawal (from people). He performed the pilgrimage, and he held a share in the office of preacher (khiṭāba) and other things.
