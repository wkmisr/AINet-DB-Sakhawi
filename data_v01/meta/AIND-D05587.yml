translation:
  ja: アリー・ブン・ムハンマド・ブン・ヤフヤー・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・アフマド・ブン・マフルーフ、アン＝ヌール・ブン・ザイン・アル＝アービディーン・ブン・アッ＝シャラフ、ムナー出自、カイロの人、シャーフィイー派。後述のムハンマドの兄弟で、二人の父と祖父も後述。アッ＝シハーブ・ブン・アッ＝シャトヌーフィーの娘の子。成長してクルアーンと『ミンハージュ』などを暗記し、一群の人々とともに私（サハーウィー）に提示（アルド）した。少し学問に励み、祖父の講義のいくつかに出席した。慎み深さ・親しみやすさ・快活さがあるが、極度の寡欲のために生活は困窮している。
  en: ʿAlī b. Muḥammad b. Yaḥyā b. Muḥammad b. Muḥammad b. Muḥammad b. Aḥmad b. Makhlūf, al-Nūr b. Zayn al-ʿĀbidīn b. al-Sharaf, of Munā origin, al-Qāhirī, al-Shāfiʿī, brother of Muḥammad (mentioned below), whose father and grandfather are also mentioned below, and daughter's son of al-Shihāb b. al-Shaṭnūfī. He grew up, memorized the Qurʾān, al-Minhāj and other works, presented them to me among the group, studied a little and attended some of his grandfather's lessons. He has modesty, affability and good spirit, but his circumstances have weakened through his excessive frugality.
