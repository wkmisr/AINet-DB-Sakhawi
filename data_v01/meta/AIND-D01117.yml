translation:
  ja: アハマド・ブン・ウマル・ブン・バドル、ラカブはアッ＝シハーブ、ニスバはアッ＝ディマシュキー。商人。メッカの居住者であり、後述するムハンマドという息子と、同じく後述する兄弟ムハンマドがいる。アル＝ジャアジャーウとして知られる。私（サハーウィー）からメッカで聴聞した者の一人である。
  en: Aḥmad b. ʿUmar b. Badr, al-Shihāb al-Dimashqī, the merchant. A resident of Mecca and father of Muḥammad, and brother of Muḥammad (mentioned below). He was known as al-Jaʿjāʿ. He was among those who heard from me (al-Sakhāwī) in Mecca.
