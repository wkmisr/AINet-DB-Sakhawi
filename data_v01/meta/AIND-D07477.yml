translation:
  ja: ムハンマド・ブン・シュウバ、バドル・アッ＝ディーン・アル＝ファーリスクーリー。その地域のシャイフ（長）にして実力者。同地の自宅の近くにマドラサを建て、アッ＝シハーブ・アル＝ビージューリーをその教授に据えた。彼には善行への傾きと貧者への愛があり、それは彼が置かれている（世俗の）立場にもかかわらずのことである。
  en: Muḥammad b. Shuʿba, Badr al-Dīn al-Fāriskūrī, the shaykh of that district and its man of authority. He built a madrasa there near his house and appointed al-Shihāb al-Bījūrī as its teacher. He has an inclination to good works and a love for the poor, despite the (worldly) position he is in.
