translation:
  ja: アブドゥルアズィーズ・ブン・ユースフ・ブン・アブドゥルアズィーズ、アル＝ハワージャ・アッ＝スルターニー、メッカ在住。恵まれた人物で、スワイカのシャイビー家街区にサビール（給水所）を持ち、その上の家と隣の家をそのためにワクフとした。844年ジュマーダー・アル＝アーヒラ月にメッカで没した。イブン・ファフドがその没年を記録している。
  en: ʿAbd al-ʿAzīz b. Yūsuf b. ʿAbd al-ʿAzīz, al-Khawājā al-Sulṭānī, resident of Mecca. He was a blessed man; he had a sabīl (public fountain) in the Shaybiyyīn quarter of al-Suwayqa, for which he endowed the house above it and an adjacent house. He died in Mecca in Jumādā II 844 AH. Ibn Fahd recorded the date of his death.
