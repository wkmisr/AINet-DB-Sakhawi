translation:
  ja: アリー・ブン・アフマド・ブン・ハリーファ、ヌール・アッ＝ディーン、アル＝アズハリー、ハナフィー派、アル＝アスマル（褐色の人）。自分の街区の公証人の一人。アズハルのイマームであるアン＝ヌールおよびアッ＝シハーブ・アッ＝サカンダリーからクルアーン読誦諸伝（キラーアート）を学び、（8）80年にアル＝バハー・アル＝マシュハディーのもとで『ヌフバ注釈』を読み、その教授を許可された者の一人。終始、公証人の仕事で生計を立て、晩年はワッラーキーン（書籍商街）の店に座ってそれを行った。（8）92年に没した。
  en: ʿAlī b. Aḥmad b. Khalīfa, Nūr al-Dīn, al-Azharī, the Ḥanafī, al-Asmar (the dark-complexioned), one of the notary-witnesses of his quarter. He was among those who studied the Qurʾānic readings (qirāʾāt) under al-Nūr, the imam of al-Azhar, and al-Shihāb al-Sakandarī, and he read the Sharḥ al-Nukhba with al-Bahāʾ al-Mashhadī in the year (8)80, who authorized him to teach it. He continued to earn his living as a notary-witness, and at the end of his life he sat for it in a shop in al-Warrāqīn. He died in the year (8)92.
