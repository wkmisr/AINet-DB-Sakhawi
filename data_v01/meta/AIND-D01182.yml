translation:
  ja: アフマド・ブン・ムハンマド・ブン・イブラーヒーム・ブン・ウスマーン・ブン・サイード、アッ＝サフィー、アブー・アル＝ラターイフ、ブン・アッ＝シャムス・アル＝ワズィール、マーリキー派。彼の父はマーリキー派で、彼自身は母方の祖父ヌール・アッ＝ディーン・アッ＝サドミースィー・アル＝ハナフィーゆえにハナフィー派であった。彼はヒジュラ暦890年ラビーウ・アル＝アウワル月に『アル＝アルバアイン・アン＝ナワウィーヤ』と『アル＝カンズ』を私（＝サハーウィー）に提示し、また『アル＝ムサルサル・ビ＝ル＝アウワリーヤ』を私から聴聞した。彼にはアル＝ムアイヤディーヤの宝物庫管理者（ハーズィン）であるアル＝ムヒッブ・アル＝カルイーが同伴していた。彼は賢明で機知に富む人物である。
  en: Aḥmad b. Muḥammad b. Ibrāhīm b. ʿUthmān b. Saʿīd al-Ṣafī Abū al-Laṭāʾif b. al-Shams al-Wazīr al-Mālikī. His father was a Mālikī, while he himself was a Ḥanafī on account of his maternal grandfather Nūr al-Dīn al-Sadmīsī al-Ḥanafī. In Rabīʿ al-Awwal in the year ninety (890 AH), he presented to me (al-Sakhāwī) al-Arbaʿīn al-Nawawiyya and al-Kanz, and he heard from me al-Musalsal bi-l-Awwaliyya. Al-Muḥibb al-Qalʿī, the treasurer (khāzin) of al-Muʾayyadiyya, was with him. He is intelligent and discerning.
