translation:
  ja: アブドゥルアズィーズ・ブン・ユースフ、アル＝イッズ・アル＝アンバービー・アッ＝シャーフィイー、ヒスバ（市場監督）の代理官。カーディーの代理も務め、ブーラークのハティーリー・モスクで説教（フトバ）を行い、そのワクフの管理に携わり、ブーラークなどに家々を建てたが、その職務や代理職において評判は良くなかった。872年シャウワール月6日金曜日に没し、翌日に埋葬された。神が彼と我らを赦したまえ。
  en: ʿAbd al-ʿAzīz b. Yūsuf, al-ʿIzz al-Anbābī al-Shāfiʿī, deputy of the ḥisba. He also served as deputy judge, preached at the Khaṭīrī Mosque in Būlāq and administered its endowments, and built houses in Būlāq and elsewhere; but he was not well regarded in his administrative and deputy posts. He died on Friday, 6 Shawwāl 872 AH, and was buried the next day. May God pardon him and us.
