translation:
  ja: ムハンマド・ブン・アル＝ハワージャー・アッ＝ザイン・アブドゥルカーディル・ブン・アル＝ブルハーン・イブラーヒーム・ブン・ハサン・アル＝マナーウィー・アル＝カーヒリー。その父と祖父は前述。先祖と同じく「イブン・ウライバ」として知られる。クルアーンその他を暗記した者の一人。私（サハーウィー）から『ムサルサル』などを聴聞し、同様にアッ＝シャーウィーからも聴聞した。父の〔没〕後に試練に遭い、父の友人たちは彼を憐れんだ。
  en: Muḥammad b. al-Khawājā al-Zayn ʿAbd al-Qādir b. al-Burhān Ibrāhīm b. Ḥasan al-Manāwī al-Qāhirī; his father and grandfather have been mentioned above. Like his forebears he is known as Ibn ʿUlayba. He was among those who memorised the Qurʾān and other works; he heard from me (al-Sakhāwī) al-Musalsal and other texts, and likewise heard from al-Shāwī. He suffered hardship after his father's [death], and his father's friends took pity on him.
