translation:
  ja: イブラーヒーム・ブン・アブドゥッラー・アル＝マグリビー・アル＝マダニー。アル＝ハッタブ（点のないハーʾの字で）としても知られる。我らがシャイフ（イブン・ハジャル）は彼の『アンバー』で、「彼は善良かつ廉直な生活を長くマディーナで送り、人々は彼を信仰していた。彼は802年に亡くなった」と述べた。
  en: Ibrāhīm b. ʿAbd Allāh al-Maghribī al-Madanī, also known as al-Ḥaṭṭāb (with the undotted ḥāʾ). Our shaykh (Ibn Ḥajar) stated in his *Anbāʾ* that "he resided in Medina for a long time, leading a good and upright life, and people had faith in him. He died in the year 802."
