  en: Al-Ṭayyib b. Ibrāhīm b. Abī Bakr b. Ibrāhīm al-ʿĀmirī al-Ḥaraḍī al-Yamānī. His father was mentioned previously. In the year 894 (1489), while I was in Mecca, his father requested an ijāza from me for him and for himself.
