translation:
  ja: アッファーン・ブン・ウスマーン・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ザヒーラ・ブン・アフマド・ブン・アティーヤ・ブン・ザヒーラ、アル＝クラシー、アル＝マッキー。父は前述。母はザビードの出身。アル＝ブルハーニー、およびそれより下位の者たちの講義に出席した者の一人。892年ズー・アル＝ヒッジャ月にカイロで没し、その訃報は翌年のラビーウ・アル＝アウワル月にマッカに届いた。
  en: ʿAffān b. ʿUthmān b. Abī Bakr b. ʿAbd Allāh b. Ẓahīra b. Aḥmad b. ʿAṭiyya b. Ẓahīra al-Qurashī al-Makkī. His father is mentioned above, and his mother was from Zabīd. He is among those who attended the lessons of al-Burhānī and of those below him. He died in Dhū al-Ḥijja of the year 892 in Cairo, and the news reached Mecca in Rabīʿ al-Awwal of the following year.
