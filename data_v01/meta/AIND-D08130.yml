notes:
- text: '転送見出し（原文「يأتي بعد واحد」による）。転送先は一つおいた次の項 #AIND-D08132「محمد بن علي بن عثمان بهاء الدين بن المصري بن التركماني خازن كتب النورية وغيرها بدمشق … مات في صفر سنة إحدى . أرخه شيخنا في إنبائه وقال في معجمه : محمد بن علي بن عثمان بن عبد الله التركماني ثم الدمشقي أجاز لي … والظاهر أنه هذا」（本項の見出し形がイブン・ハジャル『معجم』の形として引かれている）。'
