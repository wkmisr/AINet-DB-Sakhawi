translation:
  ja: ムハンマド・ブン・アフマド・アル＝バハー・アル＝マハッリー、相続法学者（ファラディー）、シャーフィイー派。父が説教師（ワーイズ）であったことからイブン・アル＝ワーイズとして知られる。優れたシャイフで、アブー・アル＝ジュードのもとで相続法を読み、それに秀でた。同様に法学にも携わり、イブン・アル＝イマードの韻文著作から多くを諳んじるようになった。善人であった。それゆえカーヤーティーは彼をマハッラの諸ワクフの管理職に据えたが、彼〔カーヤーティー〕の二人の息子とアル＝ワラウィー・アル＝バルキーニーが彼に働きかけ続け、ついに彼は例によってアウハド・アッ＝ディーン・ブン・アル＝ウジャイミーをもって彼を罷免した。これはバハーにとって辛いことで、カーヤーティーがカーディーである限りカイロに入らないと自らに課したほどであったが、〔カーヤーティーは〕およそ二か月しかもたずに没し、彼の誓いは解け、彼は繰り返しカイロに入った。あるとき私のもとを訪れていくつかのハディースについて尋ねたので、私は答えた。罷免の後に彼は夢を見たが、私はそれをカーヤーティーの伝記に記した。879年ズー・アル＝ヒッジャ月にマハッラで没した。私見では七十に近かった。
  en: Muḥammad b. Aḥmad al-Bahāʾ al-Maḥallī, the specialist in inheritance law (al-faraḍī), al-Shāfiʿī, known as Ibn al-Wāʿiẓ because his father was a preacher. A learned shaykh; he read the law of inheritance with Abū al-Jūd and distinguished himself in it, likewise occupied himself with jurisprudence, and came to have by heart a number of things from the versified works of Ibn al-ʿImād. He was a good man. For that reason al-Qāyātī installed him in the administration of the endowments of al-Maḥalla, but both of his [al-Qāyātī's] sons and al-Walawī al-Bulqīnī kept at him until he dismissed him in favour of Awḥad al-Dīn b. al-ʿUjaymī, as was his wont. This weighed on al-Bahāʾ so heavily that he bound himself not to enter Cairo as long as al-Qāyātī was qāḍī; but he [al-Qāyātī] lasted only about two months and died, his oath was dissolved, and he entered Cairo repeatedly. He once came to me to ask about some ḥadīths, and I answered him. After his dismissal he saw a dream, which I have recorded
    in the biography of al-Qāyātī. He died in Dhū al-Ḥijja of the year 879 in al-Maḥalla; I think he was nearly seventy.
