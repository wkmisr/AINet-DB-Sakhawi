translation:
  ja: アリー・ブン・ウスマーン、アブー・アル＝ハサン、アル＝ムタイヤブ。同時代におけるイエメンのハナフィー派の模範であり、後述するムハンマドの父。アル＝アシュラフ（イエメン・ラスール朝スルタン）により、ヒジュラ暦771年にザビードにおけるハナフィー派判事（カーディー）に任命され、同802年に没した。アル＝アフィーフィー・アン＝ナーシリーが彼について言及している。
  en: ʿAlī b. ʿUthmān, Abū al-Ḥasan, al-Muṭayyab. The exemplar of the Hanafis in Yemen in his time, and the father of Muḥammad, who is mentioned below. Al-Ashraf appointed him as the judge of his madhhab in Zabīd in the year 771 AH, and he died in the year 802 AH. Al-ʿAfīfī al-Nāshirī mentioned him.
