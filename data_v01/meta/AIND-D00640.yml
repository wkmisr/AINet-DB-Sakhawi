translation:
  ja: アフマド・ブン・ジャアファル・ブン・アル＝タージ・アブドゥルワッハーブ・アン＝ナーブルスィー・アル＝ハンバリーは、アル＝バドル・ブン・アブドゥルカーディルの孫である。彼は我らがシャイフ（サハーウィー）と、その母方の叔父アル＝カマールなどから学んだ者の一人である。
  en: Aḥmad b. Jaʿfar b. al-Tāj ʿAbd al-Wahhāb al-Nābulusī al-Ḥanbalī, the grandson of al-Badr b. ʿAbd al-Qādir. He was among those who acquired knowledge from our shaykh (al-Sakhāwī) and his maternal uncle al-Kamāl, among others.
