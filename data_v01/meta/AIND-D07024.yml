translation:
  ja: ムハンマド・ブン・アフマド・ブン・ユーヌス・アル＝ジャマール・アル＝マッキー、アル＝カラキーとして知られる。思慮深く善良で、男気と節操と良い品性を備えていた。ファースィーがその歴史書でそう述べ、また言う。「私はマッカで彼から祈願文を書き取った。彼が私に語ったところでは、それは敵から守る効き目があり、学問と実践においてイエメンのシャイフ〔である〕アフマド・ブン・アル＝ウジャイルから彼に伝わったものによるとのことで、朝と夕に三度唱える。それは、『神よ、母の産道の狭さから新生児を救い出す方よ、毒刺されの者をその激しい熱と毒から癒す方よ、その知によって万物に全能なる方よ、私はムハンマドとその御名にかけてあなたに願う、あらゆる不義の者の不義から私を守りたまえ』である」。〔80〕9年シャウワール月の下旬にカイロで没し、五十歳に達していたか、それに近かった。
  en: 'Muḥammad b. Aḥmad b. Yūnus al-Jamāl al-Makkī, known as al-Karakī. He was sensible and good, possessing manliness, probity and fine character. So said al-Fāsī in his history, and he said: "I wrote down from him in Mecca a supplication which, he told me, is effective against enemies, according to what had reached him from the shaykh of Yemen in learning and practice, Aḥmad b. al-ʿUjayl; it is said three times in the morning and in the evening, and it is: ''O God, O Deliverer of the newborn from the narrowness of its mother''s labour, O Healer of the stung from the severity of its fever and venom, O You who are capable of all things by Your knowledge, I ask You by Muḥammad and by his name to protect me from every wrongdoer in his wrongdoing.''" He died in the last ten days of Shawwāl of the year [80]9 in Cairo, having reached fifty or nearly so.'
