notes:
- text: '転送見出し（原文末尾「فيمن جده عبد الله」による）。転送先は #AIND-D06512「محمد بن إبراهيم بن عبد الله أو أبو بكر ووجدته بخطه ولعلها كنية عبد الله الشمس الشطنوفي ثم القاهري الشافعي والد أحمد الماضي」（750以後生・832没、未受領）＝祖父名 عبد الله／أبو بكر の両形を本文が説明する。同じ D06512 へ向く転送見出しに #AIND-D06586「محمد بن إبراهيم الشطنوفي . فيمن جده عبد الله」（本バッチ外）。子 #AIND-D01181「أحمد بن محمد بن إبراهيم بن أبي بكر وقيل عبد الله بدل أبي بكر … الشهاب بن الشمس الشطنوفي」。'
