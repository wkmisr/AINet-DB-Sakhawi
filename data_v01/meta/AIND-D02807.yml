translation:
  ja: ハーリド・ブン・スライマーン・ブン・ダーウード・ブン・イヤード（「イヤード」は下点二つのヤー）、アル＝マンハリー・アル＝アズハリー。後述するアブドゥッラフマーンの兄で、彼が年長であり、むしろ父の死後に弟を養育したのは彼である。ジャーミウ・アル＝アズハルのリワーク・イブン・ムアンマルに住み、善良で敬虔であった。弟よりずっと前に没した。
  en: Khālid b. Sulaymān b. Dāwūd b. ʿAyyād (with a yāʾ), al-Manhalī al-Azharī, brother of ʿAbd al-Raḥmān (mentioned below); he was the elder, indeed it was he who took charge of him after the death of their father. He resided in the Riwāq Ibn Muʿammar of the al-Azhar Mosque and was a good and righteous man. He died long before his brother.
