translation:
  ja: ムハンマド・ブン・ウバイド・アッラー・ブン・アワド・ブン・ムハンマド、アル＝アルダビーリー、アッ＝シルワーニー、アル＝カーヒリー、アル＝ハナフィー。父と兄弟のアブド・アッ＝ラフマーンは前述、二人の兄弟であるアル＝バドル・マフムードは後述。イブン・ウバイド・アッラーとして知られる。『アル＝マジュマウ』と『アル＝バディーウ』を暗記し、二人の兄弟のうち先の者の後にアル＝アイタミシーヤ、アル＝アブー・バクリーヤ、ウンム・アッ＝スルターン（学院）の教授職に就いた。（8）19年に没した。
  en: Muḥammad b. ʿUbayd Allāh b. ʿAwaḍ b. Muḥammad, al-Ardabīlī, al-Shirwānī, al-Qāhirī, al-Ḥanafī; his father and his brother ʿAbd al-Raḥmān have been mentioned above, and their brother al-Badr Maḥmūd comes below. He is known as Ibn ʿUbayd Allāh. He memorized al-Majmaʿ and al-Badīʿ, and held the teaching posts of al-Aytamishiyya, al-Abū Bakriyya and Umm al-Sulṭān after the first of his two brothers. He died in the year [8]19.
