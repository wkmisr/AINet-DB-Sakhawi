translation:
  ja: ムハンマド・ブン・アブドゥルガニー、ナースィル・アッ＝ディーン・アル＝カーヒリー、水運び人頭（ナキーブ・アッ＝スカート）。ワファー、アミール・ハーッジュ（アン＝ヌウマーンの朗誦者）、ユースフの父で、「シャフタルの甥（イブン・アヒー・シャフタル）」として知られる。叔父、すなわち父の同母兄弟であるアッ＝シャムス・ムハンマド・ブン・イブラーヒーム・ブン・バラカ（前述）の跡を継いで水運び人頭に就いた。892年に没し、その後は息子のワファーがその職に就いた。
  en: Muḥammad b. ʿAbd al-Ghanī, Nāṣir al-Dīn al-Qāhirī, head of the water-carriers (naqīb al-suqāt), father of Wafā, of Amīr Ḥājj the reciter at al-Nuʿmān, and of Yūsuf; known as Ibn Akhī Shaftar (the nephew of Shaftar). He was appointed head of the water-carriers after his uncle, his father's maternal brother, al-Shams Muḥammad b. Ibrāhīm b. Baraka, mentioned above. He died in the year 892, and his son Wafā succeeded him.
