translation:
  ja: アリー・ブン・アブドゥッラー・ブン・アブド・アルアズィーズ。アン＝ヌール、アブー・アルハサン。アッ＝ダミーリー、のちにアル＝カーヒリー。マーリキ派。バフラームの兄弟として知られる。彼はクルアーン朗誦学などに従事した。彼から朗誦学を学んだ者には、イブン・アル＝ジュンディー、アッ＝シャラフ・ムーサー・アッ＝ダリーリ、アッ＝シャムス・アル＝アスカラーニーがおり、アラビア語学を学んだ者にはアル＝グマーリーがいる。彼はアッ＝シャイフウーニヤで朗誦学を講じ、また朗誦を教えた。彼から学んだ者には、アッ＝ザイン・リドワーンがいる。
  en: ʿAlī b. ʿAbd Allāh b. ʿAbd al-ʿAzīz, al-Nūr, Abū al-Ḥasan, al-Damīrī, then al-Qāhirī, al-Mālikī. He is known as the brother of Bahrām. He occupied himself with the variant recitations (of the Qurʾān) and other subjects. Among those who took the variant recitations from him were Ibn al-Jundī, al-Sharaf Mūsā al-Ḍarīr, and al-Shams al-ʿAsqalānī, and al-Ghumārī took Arabic grammar from him. He taught the variant recitations at al-Shaykhūniyya, and al-Zayn Riḍwān took (recitations) from him.
