  summary:
    ar: محمد بن أحمد بن أبي الفتح بن إدريس الشمس الدمشقي
  cert: medium
  note:
    ja: '本項末尾「وينظر ففي الظن أنه عندي」＝サハーウィー自身の留保（「調べること。彼はすでに私の手元にあると思う」）。その相手は #AIND-D06799「69 محمد بن أحمد بن أبي الفتح بن ادريس بن شامة الشمس الدمشقي أخو العماد أبي بكر ويعرف بابن السراج . سمع على الحجار ومحمد بن حازم والبرزالي والشهاب أحمد ابن علي الجزري في آخرين ، وحدث سمع منه الفضلاء قال شيخنا في معجمه أجاز لي ومات قبل دخولي دمشق بيسير في رجب سنة اثنتين وقد قارب الثمانين ، وتبعه المقريزي في عقوده ، وهو عم محمد بن أبي بكر بن أحمد بن أبي الفتح الآتي .」（repo 未収録）。ラカブ・ニスバ・通称 ابن السراج・兄弟 العماد أبو بكر・師 الحجار・没年月（802年ラジャブ月）・المقريزي『عقود』のすべてが一致し、違いはナサブの順（إدريس بن أبي الفتح／أبي الفتح بن إدريس）だけ。本項に転送の語はない＝絶対基準により両項とも実項（二重立項）。cert は原文の語（ينظر・الظن）に合わせ medium（内容の一致からは high 相当、ISSUES §D172-1）。D06799 側の鏡像は同項の受領時。ブリーフに記載のなかった相手。【集約 2026-11-18】「وينظر」は確認の指示で確度の語ではなく、「ففي الظن」がサハーウィー自身の推定（ظن＝medium）なので medium を維持（オーケストレーター決定6、内容B §4。機械 L の low 案は不適用）。確認依頼。'
