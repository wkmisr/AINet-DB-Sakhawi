translation:
  ja: ムハンマド・ブン・アフマド・ブン・イドリース・ブン・アビー・アル＝ファトフ、アッ＝シャムス・アッ＝ディマシュキー、イブン・アッ＝サッラージュ、アル＝イマード・アブー・バクルの兄弟。アル＝ハッジャールのもとで『サヒーフ』を聴き、ハディースを伝えた。（80）2年ラジャブ月にダマスクスで没した。アル＝マクリーズィーが『ウクード』で彼に言及している。調べること。彼はすでに私の手元にあるように思う。
  en: Muḥammad b. Aḥmad b. Idrīs b. Abī al-Fatḥ, al-Shams al-Dimashqī, Ibn al-Sarrāj, brother of al-ʿImād Abū Bakr. He heard the Ṣaḥīḥ under al-Ḥajjār and transmitted ḥadīth. He died in Damascus in Rajab of the year [80]2. Al-Maqrīzī mentioned him in his ʿUqūd. This should be looked into, for I think he is [already] with me.
