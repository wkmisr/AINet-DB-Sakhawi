translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ザイン・アッ＝ディーン・ブン・イスハーク・ブン・ウスマーン、アル＝ハムダーニー、仕立屋（アル＝ハイヤート）──彼もその父も──、のちにマッカの聖域（ハラム）の従僕（ファッラーシュ）。885年サファル月にそこ（マッカ）で没した。イブン・ファハドがその没年月を記している。
  en: Muḥammad b. Abī Bakr b. Zayn al-Dīn b. Isḥāq b. ʿUthmān al-Hamdānī, the tailor (al-Khayyāṭ) — he and his father — and later farrāsh (attendant) at the Meccan Sanctuary. He died there (in Mecca) in Ṣafar 885. Ibn Fahd recorded his death date.
