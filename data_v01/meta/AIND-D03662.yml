translation:
  ja: アブドゥル・ラフマーン・ブン・アブドゥッラー・・ブン・アリー・ブン・ムーサー。ラカブはアル＝ワジーフ。父アブドゥッラーのラカブはアル＝アフィーフ、祖父アリーのラカブはアン＝ヌール。マッカの人。アル＝ムザウウィク（彩色師・装飾師）として知られる。
  en: ʿAbd al-Raḥmān b. ʿAbd Allāh b. ʿAlī b. Mūsā, al-Wajīh (his own laqab), son of al-ʿAfīf (his father ʿAbd Allāh), son of al-Nūr (his grandfather ʿAlī), the Meccan, known as al-Muzawwiq (the decorator/illuminator).
