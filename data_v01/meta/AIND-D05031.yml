translation:
  ja: アリー・ブン・アフマド・ブン・ムハンマド・ブン・アブド・アル＝ハック、アル＝アラー・ブン・アッ＝シハーブ、ガムル出自のカイロの人。父は既述、兄弟のムハンマドは後述。父と同じくイブン・アブド・アル＝ハックとして知られる。クルアーンを読誦し、私（サハーウィー）から聴聞した者の一人。商業で生計を立て、そのためにシャーム（シリア）などへ旅した。私の望むところでは彼に害はなく、兄弟よりも間違いなく善良である。
  en: ʿAlī b. Aḥmad b. Muḥammad b. ʿAbd al-Ḥaqq, al-ʿAlāʾ b. al-Shihāb, of Ghamr origin, al-Qāhirī; his father has been mentioned above and his brother Muḥammad follows. Like his father he is known as Ibn ʿAbd al-Ḥaqq. He was among those who recited the Qurʾān and heard from me (al-Sakhāwī). He earned his living by trade and travelled for it to Syria and elsewhere. There is no harm in him, as I hope; he is decidedly better than his brother.
