    ja: '「الكافوري نسبة لكافور مولى الولوى بن قاسم」＝本項主の帰属先（主人）は الولوي بن قاسم の مولى（解放奴隷・従属者）である宦官 كافور（規則51）。corpus の كافور 諸項（D06379 كافور الجمالي الطواشي أحد خدام المسجد النبوي・D06380〜D06382）はニスバが異なり同定不能 → TMP-P-001590（候補 D06379 は Note に）。初版は #NEEDID。كافور の主人は الولوي بن قاسم＝#AIND-D08447「محمد بن قاسم بن عبد الله بن عبد الرحمن … الولوي أبو اليمن … المحلي الشافعي ويعرف بابن قاسم」（マディーナの شيخ الخدام）。本項主の別称「القاسمي المحلاوي」はこの間接的な帰属（主人の主人）によるもので、本項主と الولوي の直接の主従は原文に書かれないため relation は立てない（規則14・26。校閲時の patron cert medium を削除＝集約 2026-10-26、内容A M-4、オーケストレーター決定5）。desc は相手の名のみ（規則31）。'
