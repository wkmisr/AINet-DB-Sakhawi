translation:
  ja: ハーリス・アブー・アッ＝サファー・アッ＝ルーミー・アル＝ヒンディー・アル＝カーフーリー——アル＝ワラウィー・ブン・カースィムの解放奴隷（マウラー）カーフールへの帰属名である——、本項主はアル＝カースィミー・アル＝マハッラーウィーとも呼ばれる、宦官（タワーシー）、預言者モスクの奉仕者の一人。私がそこ（マディーナ）に滞在した際に私のもとに出席した者の一人であり、それどころか私のもとで『ナワウィーの四十ハディース』と『ブルダ』を読誦し、私から『アル＝カウル・アル＝バディーウ』の大半やその他を聴聞した。私は彼にイジャーザを書き、その一部を『マディーナ史』に収録した。
  en: Khāliṣ Abū al-Ṣafāʾ al-Rūmī al-Hindī al-Kāfūrī — the attribution being to Kāfūr, the mawlā of al-Walawī b. Qāsim; the subject is also called al-Qāsimī al-Maḥallāwī — the eunuch (ṭawāshī), one of the servants of the Prophet's Mosque. He was among those who attended my sessions during my stay there, indeed he read to me al-Arbaʿīn of al-Nawawī and al-Burda, and heard from me most of al-Qawl al-Badīʿ and other things. I wrote him an ijāza, part of which I recorded in the History of Medina.
