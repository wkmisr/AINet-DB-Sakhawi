  note:
    ja: '父。見出しナサブ「قاسم بن أحمد بن محمد بن يعقوب الشرف بن الخواجا الشهاب الدمشقي」から復元。称号 الخواجا الشهاب・ダマスクス出身の商人という識別要素あり（規則3）。corpus に本伝なし（D01579 أحمد بن محمد بن يعقوب الشهاب الشيباني المكي はマッカのシャイバーニー家＝別人）。原文「وأبوه صهر ابن الشيخ علي المقري」＝父は「ابن الشيخ علي المقري」の婿（または姻戚）。候補 #AIND-D01036（أحمد بن علي الشهاب القمني المقرئ ويعرف بابن الشيخ علي）だが確証なし。父の姻戚関係であり本項主の relation ではないため立てない。'
