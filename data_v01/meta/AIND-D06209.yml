translation:
  ja: カースィム・ブン・アフマド・ブン・ムハンマド・ブン・ヤアクーブ、アッ＝シャラフ・ブン・アル＝ハワージャ・アッ＝シハーブ、アッ＝ディマシュキー、のちにアル＝カーヒリー、ハナフィー派。イブン・ハーシムとして知られる。バースィティーヤ市場の商人の一人で、その父はイブン・アッ＝シャイフ・アリー・アル＝ムクリーの婿（姻戚）であった。私から『ムサルサル』と『ブハーリー』のうちの三つのハディースを聴聞した。
  en: Qāsim b. Aḥmad b. Muḥammad b. Yaʿqūb, al-Sharaf b. al-Khawājā al-Shihāb, al-Dimashqī then al-Qāhirī, the Ḥanafī, known as Ibn Hāshim. One of the merchants of Sūq al-Bāsiṭiyya; his father was the son-in-law (ṣihr) of Ibn al-Shaykh ʿAlī al-Muqrī. He heard from me al-Musalsal and three ḥadīths from al-Bukhārī.
