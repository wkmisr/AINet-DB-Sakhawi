translation:
  ja: アリー・ブン・ムハンマド・ブン・アリー、父は秤量業者（アル＝カッバーニー）で、イブン・バハーとして知られる。しばらく衰弱したのち896年ラマダーン月に没した。神が彼を赦したまわんことを。スルターンは彼のジャワーリー（扶持）を、女奴隷との間の息子に与えたが、シャーフィイー派（大カーディー）は自らの監督下にある職についてはそれを認めず、私の聞くところでは、自分の一党である息子たちなどにそれを与えた。
  en: ʿAlī b. Muḥammad b. ʿAlī; his father was al-Qabbānī (the weigher), and he was known as Ibn Bahāʾ. He died in Ramaḍān 896 after a period of weakness, may God pardon him. The sultan granted his jawālī (stipends) to a son of his by a slave woman, but the Shāfiʿī (chief qāḍī) did not permit this in the posts under his supervision and instead gave them to his own people, his sons and the like, according to what reached me.
