translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー、アル＝ジャマール・ブン・アル＝ジャラール・ブン・アル＝クトゥブ・ブン・アル＝ジャラール・アル＝フサイニー・アッ＝タブリーズィー・アッ＝シャーフィイー、前述のアフマドの兄弟。彼の姉妹の息子であるアル＝アラー・ムハンマド・ブン・アッ＝サイイド・アフィーフッディーンが彼から学び、彼がアッ＝ザイン・アル＝ハワーフィーと握手（ムサーファハ）したことにもとづいて彼と握手したが、その伝承経路はこの種のものとしては成立しない。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh, al-Jamāl b. al-Jalāl b. al-Quṭb b. al-Jalāl al-Ḥusaynī al-Tabrīzī al-Shāfiʿī, brother of the aforementioned Aḥmad. His sister's son al-ʿAlāʾ Muḥammad b. al-Sayyid ʿAfīf al-Dīn studied under him and performed the handshake (muṣāfaḥa) with him on the basis of his handshake with al-Zayn al-Khawāfī, through a chain of transmission of a kind that cannot be established.
