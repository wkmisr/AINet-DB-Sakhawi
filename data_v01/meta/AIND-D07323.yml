notes:
- text: '転送見出し（原文の「في ابن محمد بن عبد الرحمن بن محمد」による）。転送先は #AIND-D08818（محمد بن محمد بن عبد الرحمن بن محمد بن أحمد بن خليف بن عيسى … المحب أبو المعالي … بن الرضي أبي حامد بن التقي بن الحافظ الجمال الانصاري الخزرجي المطري الاصل المدني الشافعي … ويعرف بالمطري、ラマダーン780年マディーナ生・シャアバーン856年マディーナ没、立項番号262）。閉合根拠: 父のクンヤ「أبو حامد」＝الرضي أبو حامد محمد بن عبد الرحمن المطري、指示ナサブ「محمد بن عبد الرحمن بن محمد」とニスバ المطري が一致するのは corpus の محمد بن محمد بن عبد الرحمن 群（D08817–D08826）中 D08818 のみ。'
