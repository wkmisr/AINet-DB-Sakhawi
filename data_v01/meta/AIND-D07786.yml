translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・アブド・アッ＝ラフマーン・ブン・ムハンマド・ブン・スルフ・ブン・イスマーイール、アル＝カマール・アブー・アル＝ファドル・ブン・アル＝ジャマール・ブン・ナースィル・アッ＝ディーン・アル＝キナーニー・アル＝マダニー、シャーフィイー派。アッ＝シハーブ・アル＝バイジューリーから法学と相続法を学んだ者の一人で、アブー・アル＝ファトフ・アル＝マラーギーらに聴聞した。エジプト、シリアなど、さらにはペルシア（アジャム）にも赴いた。彼は存命である。
  en: Muḥammad b. ʿAbd Allāh b. ʿAbd al-Raḥmān b. Muḥammad b. Ṣulḥ b. Ismāʿīl, al-Kamāl Abū al-Faḍl b. al-Jamāl b. Nāṣir al-Dīn al-Kinānī al-Madanī, the Shāfiʿī. He was among those who studied jurisprudence and the law of inheritance under al-Shihāb al-Bījūrī, and he heard from Abū al-Fatḥ al-Marāghī and others. He travelled to Egypt, Syria and elsewhere, even to Persia (al-ʿAjam). He is still alive.
