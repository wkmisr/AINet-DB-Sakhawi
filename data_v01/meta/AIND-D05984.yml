  note:
    ja: '見出しナサブ「ناصر الدين بن الشيخ شمس الدين」から復元（規則3）。ニスバ索引 #AIND-D11776「الشنشي … ناصر الدين عمر بن الشيخ شمس الدين محمد بن موسى بن عبد الله الحنفي وابنه خير الدين أبو الخير محمد」。corpus محمد 部に本伝なし・ID-Master 未登録 → TMP-P-001432。初版に父 relation なし。'
- id: r2
  type: kin
  subtype: son
  active: m10
  passive: AIND-D05984
  note:
    ja: '「والد خير الدين محمد الآتي」。息子 ＝ #AIND-D08369「محمد بن عمر بن محمد بن موسى بن محمد خير الدين أبو الجود بن ناصر الدين ابن الشمس أبي عبد الله بن أبي عمران بن الشمس أبي عبد الله الشنشي الأصل القاهري الحنفي الماضي أبوه وأحد النواب」（本項主を「الماضي أبوه」と名指し）。初版の #NEEDID を解消。'
- id: r3
  type: kin
  subtype: brother
  active: m11
  passive: AIND-D05984
  note:
    ja: 「وأخو الشمس محمد الذي أرخه شيخنا في سنة ثمان وتسعين وسبعمائة」。兄弟 ＝ الشمس محمد بن محمد بن موسى بن عبد الله الشنشي（798年没、イブン・ハジャル『إنباء الغمر』798年条に記載）。corpus محمد 部に本伝なし（#AIND-D06793 الشمس محمد بن أحمد بن عمر الشنشي الشافعي は778年生の別人）。ID-Master の TMP-P-000198「الشمس الشنشي」（Note 空欄・repo 未使用）はどの الشمس الشنشي か不明のため流用せず、TMP-P-001431 を発行（§D109-7）。初版の汚染番号 TMP-P-000063（登録実体＝汎用名 الشمس محمد）を差し替え。
