translation:
  ja: ウマル・ブン・ムハンマド・ブン・ムーサー・ブン・アブドゥッラー、ナースィル・アッ＝ディーン・ブン・アッ＝シャイフ・シャムス・アッ＝ディーン、アッ＝シャンシー、アル＝カーヒリー、アル＝ハナフィー。後述のハイル・アッ＝ディーン・ムハンマドの父で、我らの師（イブン・ハジャル）が798年（の条）に没年を記したアッ＝シャムス・ムハンマドの兄弟。775年に生まれ、（8）51年ラマダーン月に没した。
  en: ʿUmar b. Muḥammad b. Mūsā b. ʿAbd Allāh, Nāṣir al-Dīn b. al-Shaykh Shams al-Dīn al-Shanshī al-Qāhirī al-Ḥanafī, father of Khayr al-Dīn Muḥammad who comes below, and brother of al-Shams Muḥammad whose death our shaykh recorded under the year 798. He was born in 775 and died in Ramaḍān (8)51.
