translation:
  ja: 「イブン・アッ＝シュワイフ」（シーンとハーの点付き文字二つ、縮小形）と通称される、ハンバリー派のジャアファル・ブン・ムハンマド・ブン・ジャアファル・アル＝バアリー。795年にアッ＝ザイン・アブドゥッラフマーン・ブン・ムハンマド・ブン・アブドゥッラフマーン・ブン・アッ＝ザアブーブから『サヒーフ』をバアルベックで聴聞し、その後ハディースを伝えた。学識者たちが彼から聴聞した。私（サハーウィー）は旅の際に彼に会わなかったので、おそらくその前に亡くなったのだろう。
  en: Jaʿfar b. Muḥammad b. Jaʿfar al-Baʿlī al-Ḥanbalī, known as Ibn al-Shuwaykh (both shīn and khāʾ with diacritical points, in the diminutive form). In 795 H, he heard al-Ṣaḥīḥ from al-Zayn ʿAbd al-Raḥmān b. Muḥammad b. ʿAbd al-Raḥmān b. al-Zaʿbūb in Baʿlabakk. He then transmitted ḥadīth, and many virtuous scholars heard from him. Al-Sakhāwī did not meet him on his journey, so it is likely he died before it.
