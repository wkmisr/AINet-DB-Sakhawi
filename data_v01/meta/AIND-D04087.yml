translation:
  ja: アブドゥルファッターフ・ブン・アブドゥッラー・ブン・アビー・アル＝カースィム・アッ＝ラーミー（ザビード近郊のアッ＝ラーミーヤに因む）、アン＝ナーシリー、シャーフィイー派。カーディーのムハンマド・ブン・アブドゥッサラームのもとで学業に励んだ者の一人。マッカに来て897年に巡礼を行い、私（サハーウィー）から『ムサルサル』を聴聞し、私は彼のために（イジャーザを）書いた。ハムザ（アン＝ナーシリー）は彼を「最も優秀な学生の一人たる法学者で、敬虔・聡明・有徳・博識の人」と称賛した。
  en: ʿAbd al-Fattāḥ b. ʿAbd Allāh b. Abī al-Qāsim al-Lāmī (the nisba refers to al-Lāmiyya near Zabīd), al-Nāshirī, al-Shāfiʿī. He was among those who studied under the qāḍī Muḥammad b. ʿAbd al-Salām. He came to Mecca and performed the pilgrimage in the year 897, heard al-Musalsal from me, and I wrote (an ijāza) for him. Ḥamza (al-Nāshirī) praised him as a jurist, one of the best students, a righteous, intelligent, virtuous and knowledgeable man.
