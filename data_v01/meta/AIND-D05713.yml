translation:
  ja: アリー、アル＝アラー・アル＝カラキー・アル＝マーリキー。イブン・アル＝ミズワールとして知られる。（8）85年ジュマーダー・アル＝ウーラー月にカイロで急死した。かつてナーブルスのヒスバ（市場監督）職を務め、次いでアル＝ジャマール・ナーズィル・アル＝ハーッスの引き立てにより、彼の町（アル＝カラク）の法官職とその機密書記職を務めた。同様にガザの法官、次いでエルサレムの法官を何度も務めた。神が彼と我々を赦したまいますように。
  en: ʿAlī, al-ʿAlāʾ al-Karakī al-Mālikī, known as Ibn al-Mizwār. He died suddenly in Jumādā al-Ūlā (8)85 in Cairo. He had held the ḥisba (market inspectorate) of Nablus, then the judgeship of his home town (al-Karak) and its office of confidential secretary through the patronage of al-Jamāl, the nāẓir al-khāṣṣ. Likewise he held the judgeship of Gaza and then of Jerusalem more than once. May God forgive him and us.
