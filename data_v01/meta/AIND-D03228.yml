translation:
  ja: スードゥーン・アッ＝ザーヒリー・ジャクマク。アル＝アフラムとして知られる。彼（ジャクマク）の息子であるアル＝マンスール（ウスマーン）の治世に十人頭のアミールに任命されたが、その後、捕らえられて投獄され、後に釈放された。カイロに赴き、しばらくして再び十人頭のアミール職を授けられた。その後、アッ＝ザーヒル・フシュカダムの治世においてハーズィンダール（宝物官）となり、さらにタブルハーナー（四十人頭）のアミールとなった。そして、[ ]年に没した（※テキストは中途で途切れている）。
  en: Sūdūn al-Ẓāhirī Jaqmaq, known as al-Afram. He was appointed as an amir of ten during the reign of al-Manṣūr (ʿUthmān), the son of his master (Jaqmaq). Later, he fell from favor, was imprisoned, and then released. He arrived in Cairo, where after some time he was granted an emirate of ten. During the reign of al-Ẓāhir Khushqadam, he became a khāzindār (treasurer), and then rose to the rank of amir of tablkhānāh (forty). He died in [the text abruptly ends here].
