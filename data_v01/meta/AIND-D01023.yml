notes:
- text: 本項は同一人物の長形名による参照エントリ。実体は AIND-D01104（أحمد بن علي أبو العباس بن الرئيس أبي الحسن بن الشيخ القبايلي، マグリブ（モロッコ）の君主の宰相、803年に投獄・処刑、イブン・ハジャル『إنباء الغمر』に言及）。本文の「يأتي في أحمد ابن علي بدون زيادة」は、「أحمد بن علي の後に系譜の付加（زيادة）がつかない短形の見出しの項で後述する」という配列位置の指定で、実体項 D01104 を指す。ニスバは القبابلي / القبايلي の綴り異伝。
