  note:
    ja: '「ابن أخي الخواجا البدر حسن الطاهر الماضي」＝本項主は حسن の兄弟の子。伯父（叔父）＝corpus 本伝 #AIND-D02635「حسن بن محمد بن قاسم بن علي بن أحمد التاجر الكبير بدر الدين الصعدي اليمني نزيل مكة ووالد الجمال محمد وعلي الآتيين ويعرف بالطاهر بالمهملة … مات في جمادى الأولى سنة إحدى وسبعين بمكة」（未収録）。祖父以上のナサブ4代（محمد بن قاسم بن علي بن أحمد）＋ラカブ البدر＋通称 الطاهر＋「الماضي」で閉合（ブリーフ候補を本文で確認）。初版は subtype uncle・#NEEDID。「الخواجا」は伯父の称号（desc に入れない、規則31。本項主の state にしない）。'
notes:
- text: 'ニスバは刊本どおり「الصفدي」（TMP-N-00208）。伯父の項 #AIND-D02635 と同家の #AIND-D05120・#AIND-D10688 は「الصعدي」（イエメンのサアダ、D02635「ولد … بصعدة من اليمن」）であり、本項の「الصفدي」は ع／ف の点の揺れの可能性が高いが、規則25 により読み替えない。没地の記載なし。'
