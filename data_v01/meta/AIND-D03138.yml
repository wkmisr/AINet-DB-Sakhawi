  ja: スライマーン・ブン・アフマド・ブン・ムハンマド・ブン・カースィム・ブン・アリー・ブン・アフマド・アッ＝サファディー。前述のハワージャー・アル＝バドル・ハサン・アッ＝ターヒルの兄弟の子。（8）63年ズー・アル＝ヒッジャ月に没した。
  en: Sulaymān b. Aḥmad b. Muḥammad b. Qāsim b. ʿAlī b. Aḥmad al-Ṣafadī, son of the brother of the aforementioned Khawājā al-Badr Ḥasan al-Ṭāhir. He died in Dhū al-Ḥijja of the year [8]63.
