    ja: '規則3 (c'')。父 أحمد は伯父 #AIND-D02635（حسن بن محمد بن قاسم بن علي بن أحمد）の兄弟。corpus 見出しに「أحمد بن محمد بن قاسم」の本伝は #AIND-D01472（الطوخي ثم القاهري、別人）のみで、本人の本伝なし。父の兄弟の本伝は「共有」に当たらない（規則61 (d)）＝#NEEDID。初版は father relation なし。'
