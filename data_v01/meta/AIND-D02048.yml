translation:
  ja: アク・バラート・アッ＝ドゥマルダーシー・ドゥマルダーシュ・アル＝ムハンマディー。師の後に昇進し、ムアイヤドが彼を重用し、ハマーなどの副王（ナーイブ）に任じ、その後アターバク職に就かせ、さらにマラティヤの副王職に転任させた。おそらく830年代以降に同地で死去した。彼は勇敢さと優れた人柄で知られていた。
  en: Aq Balāṭ al-Dumarḍāshī Dumarḍāsh al-Muḥammadī. He was promoted after his master, and al-Muʾayyad favored him, appointing him as nāʾib (vice-regent) of Ḥamā and other places, then atābak. He was then transferred to the vice-regency of Malatya, and presumably died there after the 830s H. He was known for his courage and good conduct.
