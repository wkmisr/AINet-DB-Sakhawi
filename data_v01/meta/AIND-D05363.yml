translation:
  ja: アリー・ブン・ムハンマド・ブン・イブラーヒーム、アブー・アル＝ハサン・アル＝ハラビー、証人（シャーヒド）。アル＝ムヒッブ・ブン・アッ＝シフナが彼から聴聞した者の一人。祖父がイブラーヒーム・ブン・アブドゥッラーである者の項（＝945）で前述した。
  en: ʿAlī b. Muḥammad b. Ibrāhīm, Abū al-Ḥasan al-Ḥalabī, the witness (shāhid). Al-Muḥibb b. al-Shiḥna was among those who heard from him. He has been mentioned above among those whose grandfather is Ibrāhīm b. ʿAbd Allāh (= 945).
