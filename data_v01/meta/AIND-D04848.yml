translation:
  ja: ウスマーン・ブン・アビー・バクル、アル＝ファフル、アッ＝サンダビースィー、アル＝カーヒリー、アッ＝シャーフィイー。クルアーンを暗記し、アッ＝ザイン・ブン・アル＝カッサースのもとでそれをタジュウィード（整誦）し、ついでアル＝ハイサミーのもとで七読誦によりそれを読誦し、アッ＝シハーブ・アッ＝ザワーウィーと同席してアッ＝シハーブ・アッ＝サカンダリーのもとで読誦し、さらに彼のもとでその一部を十読誦により読誦した。生業に従事し、マッカその他へ旅し、870年近くにイエメンで没した。
  en: ʿUthmān b. Abī Bakr, al-Fakhr, al-Sandabīsī, al-Qāhirī, al-Shāfiʿī. He memorized the Qurʾān and perfected its recitation under al-Zayn b. al-Qaṣṣāṣ, then recited it according to the seven readings under al-Haythamī, and, as a companion of al-Shihāb al-Zawāwī, under al-Shihāb al-Sakandarī; indeed he recited part of it to him according to the ten readings. He earned his living, travelled to Mecca and elsewhere, and died in Yemen close to 870.
