translation:
  ja: アリー・ブン・ムハンマド・ブン・アリー・アッ＝タイヤーリー・アル＝カーヒリー。アル＝ムヒッブ・ブン・ナスルッラー・アル＝バグダーディー・アル＝ハンバリーの娘婿（その娘の夫）。敬虔で人々の崇敬を受ける物静かな人物で、我らがシャイフ（イブン・ハジャル）らのもとでハディースを聴聞し、そのうちにはアッ＝ザーヒリーヤでの『ブハーリー』の聴聞がある。諸職（の扶持）を得、富裕と目されていた。私（サハーウィー）が彼について最後に知るのは863年で、そのころ60歳に近かったと思われる。神の慈悲あれ。
  en: ʿAlī b. Muḥammad b. ʿAlī al-Ṭayyārī al-Qāhirī, son-in-law of al-Muḥibb b. Naṣr Allāh al-Baghdādī al-Ḥanbalī, husband of his daughter. A righteous, revered and quiet man, he heard ḥadīth from our shaykh (Ibn Ḥajar) and others; among what he heard was the Ṣaḥīḥ of al-Bukhārī at the Ẓāhiriyya. He held stipendiary posts and was reputed to be wealthy. The last I knew of him was in the year 863, when he was thought to be nearly sixty. May God have mercy on him.
