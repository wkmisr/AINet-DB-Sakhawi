translation:
  ja: アリー・ブン・アル＝アンバリー・アッ＝ディマシュキー。同地（ダマスクス）のスワイカ・サールージャーの西、アッ＝サーリヒーヤへ向かう（道の）果樹園の上にモスクを建て、小さいながらもそこに金曜説教を設けた。バルスバーイが同スワイカにその有名なジャーミウを建てると、彼のモスクの説教は廃止された。（8）42年ラビーウ・アル＝アウワル月朔日に没し、彼のモスクの向かいの墓地に葬られた。イブン・アル＝ラブーディーが彼に言及している。
  en: ʿAlī b. al-ʿAnbarī al-Dimashqī. He built there (in Damascus), to the west of Suwayqat Ṣārūjā, on the orchard on the way to al-Ṣāliḥiyya, a mosque, and despite its small size established a Friday sermon (khuṭba) in it. When Barsbāy built his famous congregational mosque in the said Suwayqa, the sermon in his mosque was discontinued. He died on the first of Rabīʿ al-Awwal (8)42 and was buried in the cemetery opposite his mosque. Ibn al-Labūdī mentioned him.
