translation:
  ja: アブドゥッラフマーン・アル＝ザルウィー・アル＝ハナフィー。ザイン・アッ＝ディーン・アル＝カーディー（判事）。850年以降に、アル＝カーディー・サアド・アッ＝ディーンのもとで法学原理の書『アッ＝タフキーク』を聴聞・学習した際、アッ＝サラーフ・アッ＝タラーブルスィーが彼に同伴した。アッ＝サラーフは、アブドゥッラフマーンについて、彼が法学者であり、自身の書物である『アル＝マジュマウ』の記憶・想起力に優れ、能書家（美筆）であったと述べている。
  en: ʿAbd al-Raḥmān al-Zarʿī al-Ḥanafī, Zayn al-Dīn al-Qāḍī. Al-Ṣalāḥ al-Ṭarābulusī accompanied him after 850 AH in learning what he read of al-Taḥqīq in legal theory (uṣūl) under al-Qāḍī Saʿd al-Dīn. Al-Ṣalāḥ remarked that he was a jurist who was exceptionally quick to recall from his book al-Majmaʿ, and that he possessed beautiful handwriting.
