translation:
  ja: ムハンマド・ブン・アブドゥッラティーフ・ブン・アル＝カマール・アビー・アル＝ファドル・ムハンマド・ブン・アブドゥッラフマーン・ブン・ムハンマド・イブン・ユースフ・ブン・アル＝ハサン・ブン・ムハンマド・ブン・マフムード、アッ＝シャムス・ブン・アッ＝シラージュ、アル＝アンサーリー・アッ＝ザランディー・アル＝マダニー・アッ＝シャーフィイー。ヒジュラ暦850年ズー・アル＝ヒッジャ月に生まれた。マディーナで私（サハーウィー）から聴聞し、さらに六書のいくつかの箇所を私に朗読した。ヒジュラ暦891年に没した。
  en: Muḥammad b. ʿAbd al-Laṭīf b. al-Kamāl Abī al-Faḍl Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. Yūsuf b. al-Ḥasan b. Muḥammad b. Maḥmūd, al-Shams b. al-Sirāj, al-Anṣārī al-Zarandī al-Madanī al-Shāfiʿī. He was born in Dhū al-Ḥijja 850. He heard from me (al-Sakhāwī) in Medina, and indeed read to me passages from the Six Books. He died in the year 891.
