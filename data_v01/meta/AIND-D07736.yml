  note:
    ja: '父＝#AIND-D04349（項番931 عبد اللطيف بن الكمال أبي الفضل محمد بن السراج عبد اللطيف بن محمد بن يوسف بن الحسن الأنصاري الزرندي المدني الشافعي والد الشمس محمد الآتي、794年生）。「والد الشمس محمد الآتي」が本項主に一致。※本項の見出しは祖父を「الكمال أبي الفضل محمد بن عبد الرحمن بن محمد بن يوسف」とするが、D04349 側は「الكمال أبي الفضل محمد بن السراج عبد اللطيف بن محمد بن يوسف」で曾祖父名が食い違う（عبد الرحمن／عبد اللطيف）。初版は #NEEDID。'
