translation:
  ja: バイダマル。エジプトの小ハージブ（アル＝ハージブ・アッ＝サギール）。槍術師範（ムアッリム・アッ＝ルムフ）であった。802年ラビーウ・アル＝アウワル月16日日曜日に、アイタミシュの乱で負った傷がもとで死去した。
  en: Baydamur, the junior chamberlain (al-ḥājib al-ṣaghīr) in Miṣr. He was a master of the lance (muʿallim al-rumḥ). He died on Sunday, 16 Rabīʿ al-Awwal 802, from a wound he sustained in the affair of Aytamish.
