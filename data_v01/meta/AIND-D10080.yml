translation:
  ja: ムーサー・ブン・カースィム・ブン・フサイン・アル＝マッキー。アッ＝ズワイドとして知られる。善良な人として語られ、アル＝ハッダなどマッカ管内の地に所有地を持っていた。（8）14年ムハッラム月に没し、アル＝ムアッラーに埋葬された。アル＝ファースィーが彼に言及している。
  en: Mūsā b. Qāsim b. Ḥusayn al-Makkī, known as al-Dhuwayd. He was spoken of favourably, and he owned property at al-Hadda and other places in the districts of Mecca. He died in Muḥarram of the year (8)14 and was buried at al-Muʿallā. Al-Fāsī mentioned him.
