translation:
  ja: アフマド・ブン・アリー・ブン・アビー・ラージフ・ムハンマド・ブン・イドリース。アブー・アル＝マカーリム。アル＝アブダリー、アル＝シャイビー、アル＝ハジャビー、アル＝マッキー。彼は高位の侍従の一人であった。808年（ヒジュラ暦）の初め、イエメン地方へ向かう途中で紅海に溺死した。アル＝ファースィーがマッカで彼に言及している。
  en: Aḥmad b. ʿAlī b. Abī Rājiḥ Muḥammad b. Idrīs, Abū al-Makārim al-ʿAbdarī al-Shaybī al-Ḥajabī al-Makkī. He was among the notables of the chamberlains. He died at the beginning of the year 808 AH, drowned in the Red Sea while heading to the lands of Yemen. al-Fāsī mentioned him in Mecca.
