translation:
  ja: ムハンマド・ブン・イブラーヒーム、アッ＝シャムス・アブー・アブドゥッラー・アル＝マクディスィー、のちアッ＝ディマシュキー・アッ＝サーリヒー・アル＝ハンバリー。アッ＝スィーリーとして知られる（無点字〔スィーン〕にカスラ、次に下点字〔ヤー〕、その後にラーム）。相続分割学・算術・遺言の分野でイマームであり、その分野で彼から益が得られ、イマームたちが彼に学び、さらには読みもした。この二つを彼から学んだ者の一人にアル＝アラー・アル＝マルダーウィーがいる。ディヤーイーヤの書庫係であった。私はサーリヒーヤで彼に会った。実によい人であった。およそ（8）60年近くに没した。
  en: Muḥammad b. Ibrāhīm, al-Shams Abū ʿAbd Allāh al-Maqdisī, then al-Dimashqī al-Ṣāliḥī al-Ḥanbalī, known as al-Sīlī (with kasra on the undotted letter [sīn], then a letter dotted below [yāʾ], followed by lām). He was an imām in the law of inheritance shares, arithmetic and bequests; people benefited from him in this, and the imāms learned from him and indeed read as well. Among those who learned the two from him was al-ʿAlāʾ al-Mardāwī. He was the keeper of the books of the Ḍiyāʾiyya. I met him in al-Ṣāliḥiyya, and what an excellent man he was. He died close to the year [8]60, approximately.
