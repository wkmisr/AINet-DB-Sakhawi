translation:
  ja: アリー・ブン・ムハンマド・ブン・アフマド・ブン・アブド・アル＝ムフスィン・ブン・ムハンマド、ヌール・アッ＝ディーン・アル＝キナーニー・アッ＝ザフターウィー・アル＝ミスリー・アッ＝シャーフィイー。前述のアフマドの兄弟。彼（アフマド）よりしばらく前に没した。アル＝ワリー・アル＝イラーキーは彼を学識と徳をもって評した。
  en: ʿAlī b. Muḥammad b. Aḥmad b. ʿAbd al-Muḥsin b. Muḥammad, Nūr al-Dīn al-Kinānī al-Zaftāwī al-Miṣrī al-Shāfiʿī, the brother of the aforementioned Aḥmad. He died some time before him. Al-Walī al-ʿIrāqī described him as possessing learning and merit.
