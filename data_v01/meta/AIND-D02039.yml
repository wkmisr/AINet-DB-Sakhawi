translation:
  ja: アクブガー・サイフ・アッ＝ディーン・アル＝アディーミー・アル＝ハラビー・アル＝ハナフィー。アル＝カマール・ウマル・イブン・アル＝アディームの若い従僕（ファター）。ヒジュラ暦780年頃に生まれ、ハラブでイブン・サディークから『アッ＝サヒーフ』の一部を聴聞し、ハディースを伝えた。学識者たちが彼から聴聞した。彼は敬虔で善良であり、善事に励み、知性があり穏やかで、主人からのワクフ（寄進）とイクターウ（知行）に満足していた。ヒジュラ暦840年頃に亡くなった。
  en: Aqbughā Sayf al-Dīn al-ʿAdīmī al-Ḥalabī al-Ḥanafī, servant (fatā) of al-Kamāl ʿUmar b. al-ʿAdīm. He was born around the year 780 H and heard some of al-Ṣaḥīḥ in Ḥalab (Aleppo) from Ibn Ṣiddīq, and he transmitted ḥadīth; learned individuals heard from him. He was pious, good, constant in good deeds, intelligent, calm, and content with endowments (awqāf) and iqṭāʿ from his master. He died around the year 840 H.
