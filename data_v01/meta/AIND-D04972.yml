translation:
  ja: アリー・ブン・アフマド・ブン・スライマーン・ブン・ウマル、アン＝ヌール、アブー・アル＝ハサン、ファース出自のアッ＝ダイルーティー、シャーフィイー派。『ミンハージュ』『ラフビーヤ』『文法のアルフィーヤ』『ムルハ』の各所を私（サハーウィー）に暗誦提示したうえ、『ブハーリー』の一部を私のもとで朗読し、それ以外のものも私から聴聞した。
  en: ʿAlī b. Aḥmad b. Sulaymān b. ʿUmar, al-Nūr Abū al-Ḥasan, of Fāsī origin, al-Dayrūṭī, the Shāfiʿī. He recited to me (al-Sakhāwī) from memory passages of al-Minhāj, al-Raḥbiyya, the Alfiyya on grammar and al-Mulḥa; moreover he read part of al-Bukhārī with me and heard other things from me.
