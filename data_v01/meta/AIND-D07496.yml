translation:
  ja: ムハンマド・ブン・スィッディーク・ブン・アリー・ブン・ウマル・ブン・ムハンマド・ブン・ザカリヤー、アッ＝シャムス・アル＝マッキー・アッ＝シャーフィイー、クルアーン読誦家（ムクリウ）。前述のアブー・アル＝ハサン・アリー・ブン・アーダム・アル＝ハビービーのもとで七読誦法によって（クルアーンを）読誦した。アン＝ヌール・アリー・ブン・ムハンマド・ブン・アフマド・ブン・アビー・バクル・アル＝ガヌーミーが［ヒジュラ暦8］32年に彼のもとでいくつかの伝承読誦法（リワーヤ）を読み、彼はガヌーミーにイジャーザを与えた。
  en: Muḥammad b. Ṣiddīq b. ʿAlī b. ʿUmar b. Muḥammad b. Zakariyyā, al-Shams al-Makkī al-Shāfiʿī, the Qurʾān-reader. He recited (the Qurʾān) according to the seven readings to Abū al-Ḥasan ʿAlī b. Ādam al-Ḥabībī, mentioned above. Al-Nūr ʿAlī b. Muḥammad b. Aḥmad b. Abī Bakr al-Ghanūmī read some of the transmissions (riwāyāt) to him in the year [8]32, and he granted him an ijāza.
