translation:
  ja: 359 アフマド・ブン・ムハンマド・ブン・アブドゥルラフマーン・ブン・ムハンマド・ブン・アフマド・ブン・アル＝タキー・スライマーン・ブン・ハムザ・アル＝サーリヒー・アル＝ハンバリー。彼の父は後述される。彼はイブン・ズライクとして知られる。彼が10歳の若さでティムール軍（アル＝ランキーヤ）によって捕らえられたため、彼の父は彼を悲しんで亡くなった（これも後述される）。アッラーが両者に楽園を与えられますように。
  en: 359 Aḥmad b. Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. Aḥmad b. al-Taqī Sulaymān b. Ḥamza al-Ṣāliḥī al-Ḥanbalī. His father will be mentioned later. He is known as Ibn Zurayq. He was captured by the army of Tīmūr (al-Lankiya) when he was a youth of about ten years old, and his father consequently died of grief over him, as will also be mentioned later. May Allah compensate them with Paradise.
