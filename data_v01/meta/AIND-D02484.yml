translation:
  ja: 遍歴の商人ハーミド・アル＝マグリビー。マッカのアル＝スワイカで、サイイド・ハサン・ブン・アジュラーンのワクフ財産から家を借りていた者の一人。881年シャウワールに同地で死去し、アル＝ムアッラーに埋葬された。
  en: Ḥāmid al-Maghribī, the traveling merchant. He was among those who rented a house in al-Suwayqa, Mecca, from the endowments of al-Sayyid Ḥasan b. ʿAjlān. He died there in Shawwāl of the year 881 and was buried in al-Muʿallā.
