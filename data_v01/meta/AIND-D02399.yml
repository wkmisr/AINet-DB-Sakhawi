translation:
  ja: ジャーニム。指揮官職（タクディマ）を与えられ、ガザ、ハマー、トリポリでナーイブ（副王・総督代理）を務めた。アル＝アイニーは「彼については悪事しか知られていない」と述べている。814年に死去した。我らがシャイフ（イブン・ハジャル）が彼に言及している。
  en: Jānim was granted a command (taqdima) and served as nāʾib in Gaza, Ḥamā, and Tripoli. Al-ʿAynī said, "Nothing but evil was known about him." He died in the year 814 AH. Our shaykh (Ibn Ḥajar) mentioned him.
