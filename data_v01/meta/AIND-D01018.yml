translation:
  ja: アハマド・ブン・アリー・ブン・ザカリヤー（号はシャハーブ）。アル＝ジャディーディー。シャハーブ・アハマド・アル＝マーディーの父。篤行と奇跡で知られ、人びとから篤く信じられていた。843年サファル月7日の夜に亡くなった。アッラーの慈悲あれ。
  en: Aḥmad b. ʿAlī b. Zakariyyā, known as al-Shihāb al-Jadīdī, father of al-Shihāb Aḥmad al-Māḍī. He was known for righteousness and miracles, and people had faith in him. He died on the night of the 7th of Ṣafar in the year 843 H. May God have mercy on him.
