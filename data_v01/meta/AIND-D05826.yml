translation:
  ja: ウマル・ブン・アビー・バクル・アッ＝サイダーウィー・アッ＝ディマシュキー・アッ＝シャーフィイー、イブン・アル＝ムバイイドとして知られる。有為で敬虔、物静かな若者。カイロにしばらく滞在し、幾人かの学者のもとで学び、私に『サヒーフ・ムスリム』を読誦し、またイブン・アル＝ジャザリーの『ヒダーヤ』に対する私の注釈を討究の形で読み、それを携えて行った。
  en: ʿUmar b. Abī Bakr al-Ṣaydāwī al-Dimashqī al-Shāfiʿī, known as Ibn al-Mubayyiḍ. A capable, pious and quiet young man. He stayed in Cairo for a short while, studied under some of the scholars, read Ṣaḥīḥ Muslim before me and, by way of study, my commentary on the Hidāya of Ibn al-Jazarī, and took it with him.
