translation:
  ja: シャイフーニーヤの召使いとその敷地の管理者であったハナフィー派のシャイフ、シャハーブ・アル＝ディーン・アフマド・イブン・イーナールは、ハナフィー派の高名な学者シャムス・ムハンマドの父であった。882年ラビー・アル＝アヒール月（ヒジュラ暦）に死去し、アブー・アル＝タイイブ・アル＝スユーティーが彼の職位に就いた。彼の息子は任命されなかったため、任命された者がより正確で有能であったにもかかわらず、多くの者にとってそれは残念なことであった。
  en: Aḥmad b. Īnāl, Shihāb al-Dīn, the Ḥanafī, who served as an attendant of al-Shaykhūniyya and its precinct, and was the father of one of the distinguished Ḥanafī scholars, al-Shams Muḥammad. He died in Rabīʿ al-Ākhir in the year 882 H. Abū al-Ṭayyib al-Suyūṭī was appointed in his place in service, and his son was not considered for the position. This was regrettable for many, even though the appointee was more precise and capable.
