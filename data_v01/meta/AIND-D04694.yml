translation:
  ja: アブドゥルムウティー・ブン・アフマド・ブン・アル＝ムヒッブ・アビー・アル＝フサイン、シーラーズ出自のマディーナの人。後述のムハンマドの兄弟で、イブン・アル＝ムヒッブとして知られる。マディーナで私（サハーウィー）から聴聞した一人。
  en: ʿAbd al-Muʿṭī b. Aḥmad b. al-Muḥibb Abī al-Ḥusayn, of Shīrāzī origin, the Medinan, brother of Muḥammad who will be mentioned below, and known as Ibn al-Muḥibb. He was among those who heard from me (al-Sakhāwī) in Medina.
