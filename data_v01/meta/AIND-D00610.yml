translation:
  ja: アフマド・ブン・アビー・バクル・ブン・ムハンマド・ブン・アビー・バクル・ブン・アリー・ブン・ムハンマド・ブン・アビー・バクル・アル＝ナーシリー。彼の父と祖父（後述）と共にハッジを行い、2年間メッカに滞在した。彼は（シャイフである）私（サハーウィー）の聴聞講義にも参加し、特に80年代（ヒジュラ暦880年代）後半の3度目のメッカ滞在中、その2年間私に師事した。
  en: Aḥmad b. Abī Bakr b. Muḥammad b. Abī Bakr b. ʿAlī b. Muḥammad b. Abī Bakr al-Nāshirī. His father and grandfather (forthcoming) performed Hajj with him and resided in Mecca for two years. He also accompanied me (al-Sakhāwī) in listening (to lectures) there during those two years, specifically during his third residency in Mecca after the eighties (880s AH).
