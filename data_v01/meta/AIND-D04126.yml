translation:
  ja: アブドゥル・カーディル・ブン・アブドゥッラフマーン・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ズハイラ・ブン・アフマド・イブン・アティーヤ・ブン・ズハイラ・アル＝クラシー・アル＝マッキー。前者のいとこ。ヒジュラ暦845年ラビー・アル＝アウワル月（第3月）に生まれ、母はアルマ・イブナト・アル＝ムヒッブ・ブン・ズハイラである。幼くして亡くなったが、アブー・アル＝ファトフ・アル＝マラーギーのもとで（学問の場に）連れていかれ出席した。神が彼に天国で報いんことを。
  en: ʿAbd al-Qādir b. ʿAbd al-Raḥmān b. Abī Bakr b. ʿAbd Allāh b. Ẓuhayra b. Aḥmad b. ʿAṭiyya b. Ẓuhayra al-Qurashī al-Makkī, the cousin of the preceding person. He was born in Rabīʿ al-Awwal in the year 845 AH. His mother was ʿAlmāʾ, the daughter of al-Muḥibb b. Ẓuhayra. He died young, after having been brought to attend the sessions of Abū al-Fatḥ al-Marāghī. May God compensate him with Paradise.
