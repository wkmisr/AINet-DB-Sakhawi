translation:
  ja: アリー・ブン・アフマド・ブン・アリー・ブン・スィナーン・ブン・ラージフ・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ウマル・ブン・マスウード、ヌール・アッ＝ディーン・アル＝ウマリー、隊長（カーイド）。（8）59年ラビーウ・アル＝アウワル月にイエメンの方面で没し、同地に埋葬された。イブン・ファハドがその没年月を記録している。
  en: ʿAlī b. Aḥmad b. ʿAlī b. Sinān b. Rājiḥ b. Muḥammad b. ʿAbd Allāh b. ʿUmar b. Masʿūd, Nūr al-Dīn al-ʿUmarī, the qāʾid. He died in Rabīʿ al-Awwal (8)59 in the direction of Yemen and was buried there. Ibn Fahd recorded his death.
