  note:
    ja: '#AIND-D04974（B99）「علي بن أحمد بن سنان القائد العمري المكي من القواد العمرة . مات بها في ربيع الأول سنة تسع وخمسين . أرخه ابن فهد」は同じ العمري القائد 家で、没年月（859年ラビーウ1月）と記録者（ابن فهد）が一致し、ナサブは1代（علي）の有無のみ異なる。没地は D04974「بها（مكة）」・本項「صوب اليمن ودفن به」で食い違う。転送指示がないため二重立項型として両項を実項のまま保持し、B99 側（§D99-5）と対になる逆方向の possible_identity（cert medium）を記録。同一人物なら父は本項の #AIND-D01022（D04974 側は #AIND-D00764 أحمد بن سنان を cert medium で充当）。Waka 裁定（2026-10-05、要判断_B99-103 ★1(b)）: 同一人物の可能性は高いが確定できないため、双方向 possible_identity cert medium のまま維持。'
