translation:
  ja: ハサン・ブン・アッ＝サイーディー。宰相やスルタンに代わって、ブハイラ地方（本文表記はアル＝ヒーラ）とその周辺地域で代言（交渉）していた人物。ヒジュラ暦888年ズー・アル＝カアダ月に没した。彼の遺品から、彼の身分や地位にはおよそ不釣り合いな、極めて多額の現金が発見されたため、息子やその他の者たちの意向は無視されて、その財産はスルタン朝廷のために没収（差し押さえ）された。
  en: 'Ḥasan b. al-Ṣaʿīdī. A person who used to speak on behalf of the vizier and the sultan in al-Buḥayra (corpus: "al-Ḥīra") and its environs. He died in Dhu al-Qaʿda, the year 888 AH. A very large amount of cash was found in his possession, which was completely disproportionate to his appearance and rank. Consequently, his wealth was confiscated for the sultanate, with no regard paid to his son or anyone else.'
