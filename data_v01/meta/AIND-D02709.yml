translation:
  ja: フサイン・アル＝アスガル・ブン・アティッヤ。前項の人物の同母弟。ヒジュラ暦850年シャアバーン月（1446年11月）にメッカで生まれた。多くの学者からイジャーザ（伝承認可）を授けられた。一時期マディーナに居住し、また困窮のためにカイロへもしばしば滞在した。シリアを訪れ、エルサレムなどを参詣した。ヒジュラ暦890年（1485年）近くになって音信が途絶え、フランク（ヨーロッパ人）の捕虜になったとも言われている。神が彼を救われんことを。
  en: Ḥusayn al-Aṣghar, the younger son of ʿAṭiyya, and the brother of the person in the preceding entry. He was born in Shaʿbān in the year 850 AH in Mecca. A group of scholars granted him ijāza. He resided for a time in Medina, and in Cairo at times due to poverty, and he also visited Syria and Jerusalem, among other places. News of him was cut off from us around the year 890 AH, and it is said that he was captured by the Franks. May God release him.
