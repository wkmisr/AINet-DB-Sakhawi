translation:
  ja: ユースフ・ブン・アフマド・ブン・ムハンマド・ブン・カマール・アッ＝ディーン、ジャマール・アッ＝ディーン・ブン・アッ＝シハーブ・ブン・アッ＝シャムス、アンディジャーンの出、アッ＝サマルカンディー、アル＝ハナフィー。アンディジャーンはフェルガナにある。825年にサマルカンドで生まれて育ち、多くの人々について諸学を学んだ。そのうち最も優れた者はマフムード・アル＝イルマーシャーニーとムハンマド・アル＝ブハーリーである。バグダードなど多くの土地を巡り、（8）95年に巡礼を行い、その翌年は寄留し、（8）97年の初めに旅立ってマディーナを参詣した。マッカでは『ムタワッスィト』と『タワーリウ』を講じた。（8）96年の末に私（サハーウィー）に会い、私のもとでブハーリーの「啓示の始まり」を読み、私は彼にイジャーザを与えた。
  en: Yūsuf b. Aḥmad b. Muḥammad b. Kamāl al-Dīn, Jamāl al-Dīn b. al-Shihāb b. al-Shams, of Andijān origin, al-Samarqandī, al-Ḥanafī; Andijān is in Farghāna. He was born in 825 in Samarqand and grew up; he studied the sciences under a number of people, the most eminent of whom were Maḥmūd al-ʿIlmāshānī and Muḥammad al-Bukhārī. He travelled through many lands, such as Baghdad, performed the pilgrimage in the year [8]95, stayed as a sojourner (jāwara) the following year, set out at the beginning of the year [8]97 and visited Medina. He taught al-Mutawassiṭ and al-Ṭawāliʿ in Mecca. He met me (al-Sakhāwī) at the end of the year [8]96 and read with me the "Beginning of Revelation" from al-Bukhārī, and I granted him an ijāza.
