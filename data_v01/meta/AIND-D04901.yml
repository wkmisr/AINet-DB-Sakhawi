translation:
  ja: アラファ・ブン・ハサン・アル＝ガムリー、のちアル＝ビルバイスィー、子どもたちのファキーフ（クルアーン教師）で、ファキーフの息子。イブラーヒーム・ブン・ユースフ・ブン・イブラーヒーム・アル＝ビルバイスィーは、その伝記にあるとおり、彼のもとでクルアーンを読んだ者の一人である。
  en: ʿArafa b. Ḥasan al-Ghamrī, then al-Bilbīsī, the faqīh (Qurʾān teacher) for children and son of a faqīh. Ibrāhīm b. Yūsuf b. Ibrāhīm al-Bilbīsī was among those who read the Qurʾān under him, as stated in his biography.
