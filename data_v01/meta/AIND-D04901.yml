    ja: '「ممن قرأ عليه القرآن إبراهيم بن يوسف بن إبراهيم البلبيسي كما في ترجمته」。学生 ＝ #AIND-D00350（إبراهيم بن يوسف بن إبراهيم بن أحمد بن يوسف بن أبي الفتح البرهان الفاقوسي ثم البلبيسي الشافعي الرفاعي、795頃生。本伝に「ثم انتقل إلى بلبيس … فأكمله بها على الفقيه عرفة بن الفقيه حسن العمري」と本項主を明記）。初版の #NEEDID を差し替え、原文にない field القراءات を除去。規則15: active ＝ 師（本項主）。'
