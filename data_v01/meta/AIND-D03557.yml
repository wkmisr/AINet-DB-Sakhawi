translation:
  ja: アブドゥッラフマーン・ブン・アフマド・ブン・フサイン・ブン・ムハンマド・ブン・アリー・アッ＝ターイフィー、のちにアル＝カーヒリー。その父は前述（の人物）。クルアーンを暗記してアッ＝ザイン・ジャアファルに朗誦し、法学をダーウード・アル＝キルターウィーおよびアッバース・アル＝マグリビーらに学んだ。彼は父親らとともに私のところ（サハーウィー）に頻繁に通った。
  en: Abd al-Rahman b. Ahmad b. Husayn b. Muhammad b. Ali al-Ta'ifi, later al-Qahiri, whose father was mentioned previously. He memorized the Qur'an and recited it under al-Zayn Ja'far, and studied fiqh under Da'ud al-Qiltawi and Abbas al-Maghribi, among others. He frequented me (al-Sakhawi) along with his father and others.
