translation:
  ja: アブドゥルラフマーン・ブン・ナースィルッディーン・ムハンマド・ブン・アワド・アッ＝ルハーウィー・アル＝マッキー。バーブ・アッ＝サラーム（極楽門）の薬種商。季節になるとジッダへ赴いていた人物の一人。おそらくヒジュラ暦879年のムハッラム月に同地（ジッダ）で没した。彼は腹のガス（脹満）を散じるためにアサフェティダ（アギ）を求めたが、誤ってアヘンをもたらされた。それをスープに入れて飲んだところ、それが彼の命取りとなった。遺体はメッカに運ばれ、アル＝ムアッラー墓地に埋葬された。
  en: ʿAbd al-Raḥmān b. Nāṣir al-Dīn Muḥammad b. ʿAwaḍ al-Ruhāwī al-Makkī, the apothecary at Bāb al-Salām. He was among those who used to go to Jeddah during its season, and he died there, presumably in Muharram of the year 879 AH. He had requested asafoetida to use for flatulence, but by mistake, opium was brought to him; he put it in broth and drank it, which caused his death. He was carried to Mecca and buried in its al-Muʿallā cemetery.
