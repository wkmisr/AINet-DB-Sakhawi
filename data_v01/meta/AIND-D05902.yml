translation:
  ja: ウマル・ブン・アリー・ブン・ウスマーン・ブン・ウマル、アッ＝シラージュ・ブン・アル＝アラー・ブン・アッ＝サイラフィー、アッ＝ディマシュキー・アッ＝シャーフィイー。ダマスクスのシャーフィイー派副法官の一人で、その俊秀の一人。父は前述。何度もカイロに来た者の一人で、イブン・アッ＝サイラフィーとして知られる。アッ＝タキー・ブン・カーディー・アジュルーンがアッ＝シャーミーヤ・アル＝バッラーニーヤ（の教授職）の三分の一を彼に譲ったので、同校で教授した。巡礼を行った。彼の師にはアル＝バドル・ブン・カーディー・シュフバがおり、父から学んだとしても不思議ではない。
  en: ʿUmar b. ʿAlī b. ʿUthmān b. ʿUmar, al-Sirāj b. al-ʿAlāʾ b. al-Ṣayrafī, al-Dimashqī al-Shāfiʿī, one of the Shāfiʿī deputy judges of Damascus and one of its distinguished men; his father was mentioned above. He was among those who came to Cairo more than once, and he was known as Ibn al-Ṣayrafī. He taught at al-Shāmiyya al-Barrāniyya because al-Taqī b. Qāḍī ʿAjlūn ceded to him a third of it, and he performed the pilgrimage. Among his teachers was al-Badr b. Qāḍī Shuhba, and it is not unlikely that he also studied with his father.
