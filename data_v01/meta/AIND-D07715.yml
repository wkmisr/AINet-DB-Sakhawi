translation:
  ja: ムハンマド・ブン・アブド・アル＝カーディル・ブン・マドヤン、アル＝アシュムーニー、アル＝カーヒリー、マーリク派。クルアーンその他を暗記し、法学をアン＝ヌール・アル＝ワッラークとアル＝ウラミーのもとで、アラビア語学をアッ＝タキー・アル＝ヒスニーのもとで学び、彼のもとで『アッ＝ラディー（の注釈）』を読んだ。アル＝ビカーイーのもとにも通い、同様に私（サハーウィー）のもとでも種々のものを読み、諸学において頭角を現した。巡礼を行い、アシュムーンに居住した。信仰は正しく、天性は純であった。もし学問を続けていたなら、さらに高みに達したであろう。
  en: Muḥammad b. ʿAbd al-Qādir b. Madyan, al-Ashmūnī, al-Qāhirī, the Mālikī. He memorized the Qurʾān and other works, studied jurisprudence under al-Nūr al-Warrāq and al-ʿUlamī, and Arabic under al-Taqī al-Ḥiṣnī, with whom he read in al-Raḍī('s commentary). He frequented al-Biqāʿī, and likewise read various things with me (al-Sakhāwī), and distinguished himself in the sciences. He performed the pilgrimage and settled in Ashmūn, with soundness of belief and purity of nature; had he persisted in study he would have risen further.
