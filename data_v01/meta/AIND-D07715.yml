notes:
- text: 「حفظ القرآن وغيره」＝クルアーン等を暗記。「وتميز في الفضائل … مع حسن العقيدة وصفاء الفطرة ، ولو لزم الاشتغال لارتقى」＝諸学で頭角を現し、信仰の正しさと純な天性を備える。学問を続けていればさらに高みに達したであろう（人物評）。
