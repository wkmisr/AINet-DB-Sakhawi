translation:
  ja: アブドゥルアズィーズ・ブン・アブドゥッラフマーン・ブン・アビー・バクル、イッズ・アッ＝ディーン、アル＝カーヒリー、ハナフィー派、アル＝ジャマルーンの向かいの織物師（ハイヤーク）で、その職業名で知られた。学問に励み、アッ＝ザイン・カースィム（・アル＝ハナフィー）から自らの読誦と他者の読誦によって学び、（最後には）アブー・アッ＝サアーダート・アル＝バルキーニーとアッ＝サラーフ・アル＝マキーニーのもとに落ち着いたが、アル＝ムナーウィーには嫌われた。しばらく病んだのち、874年ラマダーン月の下旬の初めに没した。50歳を超えていたと私（サハーウィー）は思う。神が彼を赦したまえ。
  en: ʿAbd al-ʿAzīz b. ʿAbd al-Raḥmān b. Abī Bakr ʿIzz al-Dīn al-Qāhirī al-Ḥanafī, the weaver (al-ḥayyāk) opposite al-Jamalūn, known by his trade. He pursued studies and took from al-Zayn Qāsim (al-Ḥanafī), through his own reading and that of others, and ended up with Abū al-Saʿādāt al-Bulqīnī and al-Ṣalāḥ al-Makīnī; but al-Munāwī detested him. He died in the first days of the last ten of Ramaḍān 874 AH after a period of illness; I think he had passed fifty. May God forgive him.
