translation:
  ja: アリー・ブン・ムハンマド・アル＝カマニー。本籍はバンハー。少し学問に携わり、アスラム・モスクでアッ＝ザイン・アブドゥルカーディル・ブン・シャアバーンらの同僚として公証人（シャハーダ）を務めて生計を立て、また写本（ナスフ）の筆耕も行った。さらに、兵舎（ティバーク）でマムルークたちに教育（コーラン朗誦など）を行い、前記のモスクで説教（フトバ）も行った。
  en: ʿAlī b. Muḥammad al-Qamanī, originally from Banhā. He studied briefly and earned his livelihood as a professional witness (shahāda) alongside al-Zayn ʿAbd al-Qādir b. Shaʿbān and others at the Mosque of Aslam. He also worked as a copyist (naskh), taught the Mamluks in their quarters (al-ṭibāq), and delivered sermons (khaṭaba) at the aforementioned mosque.
