translation:
  ja: サアド・ブン・ムハンマド・ブン・ユースフ・アル＝アスユーティー・アル＝カーヒリー・アッ＝シャーフィイー。後述のアブー・アル＝ハッジャージュの兄弟。学問に励み、アル＝カーヤートィーらから学んだ。ヒジュラ暦833年の疫病（ペスト）により死去した。
  en: Saʿd b. Muḥammad b. Yūsuf al-Asyūṭī al-Qāhirī al-Shāfiʿī, the brother of Abū al-Ḥajjāj who is mentioned below. He occupied himself with study and took knowledge from al-Qāyātī and others. He died of the plague in the year 833 AH.
