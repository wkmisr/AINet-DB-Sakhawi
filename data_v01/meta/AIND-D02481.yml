translation:
  ja: ハーズィム・ブン・アブドゥルカリーム・ブン・ムハンマド・アブー・ヌマイ・アル＝ハサニー・アル＝マッキー。 アシュラーフ（シャリーフ層）の名士であり、シャリーフのアフマドとアリー（アジュラーンの二人の息子）が彼と姻戚関係を結んだ。アフマドは彼の姉妹を娶り、アリーは彼の娘を娶ったため、彼の威勢は増した。ヒジュラ暦9世紀の初頭に亡くなった。アル＝ファーシーが彼に言及しており、810年（没）と言う者も（私は）見た。
  en: Ḥāzim b. ʿAbd al-Karīm b. Muḥammad Abū Numayy al-Ḥasanī al-Makkī was among the notables of the Ashraf. The two sharīfs, Aḥmad and ʿAlī, sons of ʿAjlān, intermarried with him; the former (Aḥmad) married his sister, and the latter (ʿAlī) married his daughter. His stature consequently increased. He died at the beginning of the 9th century AH. Al-Fāsī mentioned him, and I saw someone who said he died in the year 810 H.
