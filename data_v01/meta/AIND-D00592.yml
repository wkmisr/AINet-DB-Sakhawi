translation:
  ja: アフマド・イブン・アビー・バクル・イブン・タバージュワー・アル＝バアリー。パン屋（الخباز）は父、香料商（العطار）は本人であった。彼は790年（ヒジュラ暦）に故郷でムハンマド・イブン・アリー・アル＝ユーティニー、ムハンマド・イブン・ムハンマド・イブン・イブラーヒーム・アル＝フサイニー、そしてムハンマド・イブン・ムハンマド・イブン・アフマド・アル＝ジャルディーから『アル＝サヒーフ』を聴聞した。彼らは「アル＝ハッジャールが彼を代理人とした」と語った。彼はハディースを伝承し、我々の仲間の一部が彼から学んだ。私（＝サハーウィー）は（彼に）旅で会っていないが、彼はその旅の前に亡くなったようだ。
  en: Aḥmad b. Abī Bakr b. Ṭabājūwā al-Baʿlī; his father was a baker (al-khabbāz), he himself a perfumer (al-ʿaṭṭār). He heard in 790 H in his hometown from Muḥammad b. ʿAlī al-Yūtinī, Muḥammad b. Muḥammad b. Ibrāhīm al-Ḥusaynī, and Muḥammad b. Muḥammad b. Aḥmad al-Jardī (reciting) al-Ṣaḥīḥ. They said that al-Ḥajjār had deputized him. He transmitted (ḥadīth), and some of our companions took from him. I (al-Sakhāwī) did not meet him on the journey, and it seems he died before it.
