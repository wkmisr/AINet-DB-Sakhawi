translation:
  ja: アブド・アル＝カリーム・ブン・ムハンマド・ブン・ファルウ、アル＝アミーリーヤのシャイフで、アッ＝サルガトミシーヤのワクフ地ミニヤト・ハラフの借地人。父の存命中の895年ラマダーン月に没した。父より温和で、（父より）ましな人物であった。神が彼を赦したまいますように。
  en: ʿAbd al-Karīm b. Muḥammad b. Farw, shaykh of al-Amīriyya and lessee of Minyat Khalaf, the waqf of al-Ṣarghatmashiyya. He died during his father's lifetime in Ramaḍān of the year [8]95; he was gentler and better than his father. May God pardon him.
