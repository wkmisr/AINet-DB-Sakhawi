translation:
  ja: アーミル、あるいはムハンマドと呼ばれる。アル＝ムヒッブ・ムハンマドの子、アル＝ラディー・ムハンマドの子、アル＝ムヒッブ・ムハンマドの子、アル＝シハーブ・アフマドの子、アル＝ラディー・イブラーヒームの子、ムハンマドの子、イブラーヒームの子。シャリーフ・アッ＝ディーン、アブー・アッ＝サナー。アル＝タバリー、アル＝マッキー。マッカにて、857年ジュマーダー・アル＝ウーラーに、2歳に満たずに没した。
  en: ʿĀmir, also named Muḥammad, son of al-Muḥibb Muḥammad, son of al-Raḍī Muḥammad, son of al-Muḥibb Muḥammad, son of al-Shihāb Aḥmad, son of al-Raḍī Ibrāhīm, son of Muḥammad, son of Ibrāhīm. Sharīf al-Dīn Abū al-Thanāʾ al-Ṭabarī al-Makkī. He died in Mecca in Jumādā al-Ūlā 857 AH before completing two years of age.
