translation:
  ja: アブドゥルラフマーン・ブン・アブドゥルアズィーズ・ブン・アリー・ブン・アフマド・ブン・アブドゥルアズィーズ・アル＝ワジーフ・ブン・アル＝カーディー・イッズッディーン・アル＝ハーシミー・アル＝ウカイリー・アル＝ヌワイリー・アル＝マッキー・アル＝マーリキー。マッカでヒジュラ暦812年に生まれた。同地でアル＝マラーギー、イブン・アル＝ジャザリー、イブン・トゥールーブガーらから聴聞した。また、アーイシャ・ビント・イブン・アブドゥルハーディーやアブドゥルカーディル・アル＝アルマウィーらが彼にイジャーザを与えた。カイロ、次いでチュニスへと旅し、チュニスで学者たちに師事して学習を続け、ヒジュラ暦840年以降に亡くなるまで同地に留まった。イブン・ファハドが『アル＝ヌワイリーユーン』および『アル＝ナイル』において彼について言及している。
  en: ʿAbd al-Raḥmān b. ʿAbd al-ʿAzīz b. ʿAlī b. Aḥmad b. ʿAbd al-ʿAzīz al-Wajīh b. al-Qāḍī ʿIzz al-Dīn al-Hāshimī al-ʿUqaylī al-Nuwayrī al-Makkī al-Mālikī. He was born in Mecca in the year 812 AH. There, he heard from al-Marāghī, Ibn al-Jazarī, Ibn Ṭūlūbughā, and others. ʿĀʾisha bint Ibn ʿAbd al-Hādī, ʿAbd al-Qādir al-Armawī, and others granted him licenses (ijāza). He traveled to Cairo and then to Tunis, where he studied under a group of scholars and remained there until he died after 840 AH. He was mentioned by Ibn Fahd in 'al-Nuwayriyyīn' and 'al-Nayl'.
