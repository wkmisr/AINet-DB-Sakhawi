translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アフマド・ブン・アビー・アル＝ファトフ・ブン・イドリース・ブン・サラーマ、アミーン・アッ＝ディーンまたはシャムス・アッ＝ディーン、ハディース学者アル＝イマードまたはアル＝カマールの子、アッ＝ディマシュキー。その父は第8（世紀の部）で言及されている。イブン・アッ＝サッラージュとして知られ、前述のムハンマドの甥（兄弟の子）である。アブド・アッ＝ラヒーム・ブン・アビー・アル＝ヤサルやザイナブ・イブナ・アル＝ハッバーズほかから聴聞した。我らの師（イブン・ハジャル）はダマスクスで彼に会い、彼のもとで読誦した。803年のラマダーン月またはシャウワール月に没した。彼は師（イブン・ハジャル）の『ムウジャム』と『インバー』にあり、アル＝マクリーズィーも『ウクード』でそれに従った。彼から『アル＝フィルヤービーのムスナド』のまとまった一部を聴聞した者の一人に、アッ＝タキー・アブー・バクル・アル＝カルカシャンディーがいる。
  en: Muḥammad b. Abī Bakr b. Aḥmad b. Abī al-Fatḥ b. Idrīs b. Salāma, Amīn al-Dīn or Shams al-Dīn, son of the muḥaddith al-ʿImād or al-Kamāl, al-Dimashqī; his father is mentioned in the eighth (century). He was known as Ibn al-Sarrāj and was the nephew (brother's son) of Muḥammad, mentioned above. He heard from ʿAbd al-Raḥīm b. Abī al-Yasar and Zaynab bint al-Khabbāz, among others. Our shaykh met him in Damascus and read to him. He died in Ramaḍān or Shawwāl of the year [80]3. He is in his (our shaykh's) Muʿjam and his Inbāʾ, and al-Maqrīzī followed him in his ʿUqūd. Among those who heard from him a good portion of the Musnad of al-Firyābī was al-Taqī Abū Bakr al-Qalqashandī.
