translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・アブドゥッラー・アル＝バスリー、のちマッカの人（al-Baṣrī thumma al-Makkī）。「イブン・アル＝ムファッラド（ابن المفرد）」として知られる。〔ヒジュラ暦〕871年、二度目〔の滞在の折〕にマッカで、私（サハーウィー）のもとで聴聞した者の一人である。〔聴いたのは〕『アル＝カウル・アル＝バディーウ（al-Qawl al-Badīʿ）』の多くの部分、および私の『アマーリー（al-Amālī）』、その他である。
  en: Aḥmad b. Ibrāhīm b. ʿAbd Allāh al-Baṣrī, then al-Makkī (i.e., originally from Basra, later resident in Mecca). He is known as Ibn al-Mufarrad. He was among those who studied under me (samiʿa ʿalayya) at Mecca, during [his] second [stay/session] in the year 871 [AH], [hearing] a large portion of al-Qawl al-Badīʿ, as well as my al-Amālī, and other [works].
