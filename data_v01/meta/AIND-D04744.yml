translation:
  ja: アブドゥルワーヒド・ブン・アブドゥルワッハーブ・ブン・アル＝ムヒッブ・ムハンマド・ブン・アリー・ブン・ユースフ、アッ＝ザランディー・アル＝マダニー、ハナフィー派。既述のアブドゥッサラームの兄弟。（8）40年頃に生まれ、アル＝ジャマール・アル＝カーザルーニー、アブー・アル＝ファトフ・アル＝マラーギーとその兄弟アブー・アル＝ファラジュらに聴聞した。カイロに何度も来、ハラブ（アレッポ）などへ旅し、私（サハーウィー）のもとに頻繁に通った。
  en: ʿAbd al-Wāḥid b. ʿAbd al-Wahhāb b. al-Muḥibb Muḥammad b. ʿAlī b. Yūsuf, al-Zarandī al-Madanī al-Ḥanafī, brother of ʿAbd al-Salām mentioned above. He was born in about (8)40 and heard from al-Jamāl al-Kāzarūnī, Abū al-Fatḥ al-Marāghī and the latter's brother Abū al-Faraj, among others. He came to Cairo many times, travelled to Aleppo and elsewhere, and frequented me (al-Sakhāwī) often.
