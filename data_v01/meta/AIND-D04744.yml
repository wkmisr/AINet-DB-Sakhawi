    ja: '見出しナサブの父 ＝ #AIND-D04791「عبد الوهاب بن المحب محمد بن النور علي بن يوسف التاج الزرندي المدني الشافعي كأبيه أخو عمر ومحمد」（B95 担当分）。ナサブ4代（عبد الوهاب بن محمد بن علي بن يوسف）＋ニスバが完全一致し、他に同ナサブの عبد الوهاب は corpus にない。父の本伝は الشافعي كأبيه、本項主と兄 #AIND-D03925 は الحنفي で学派が食い違うが、兄弟 #AIND-D09949「معاذ … الشافعي كأبيه وجده … ولم يقتف طريق والده في التشفع من بنيه سواه」が、他の息子たちは父のシャーフィイー派を継がなかったと明言しており不一致は説明がつく。集約時に cert medium を除去（§D94-1 解決）。'
