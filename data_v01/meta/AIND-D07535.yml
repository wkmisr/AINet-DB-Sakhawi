translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・アフマド・ブン・アブドゥルワッハーブ、アッ＝シャムス・ムハンマド・ブン・アフマドの甥で、イブン・ウハイブとして知られる。（八百）九十四年にマッカで父が没した後、叔父とともにあってその後見下に置かれ、彼とともに私（サハーウィー）からいくつかのものを聴聞した。
  en: Muḥammad b. ʿAbd al-Raḥmān b. Aḥmad b. ʿAbd al-Wahhāb, nephew of al-Shams Muḥammad b. Aḥmad, known as Ibn Wuhayb. After his father's death in Mecca in the year (8)94 he was with his paternal uncle and under his guardianship, and together with him he heard some things from me (al-Sakhāwī).
