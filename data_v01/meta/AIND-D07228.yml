translation:
  ja: ムハンマド・ブン・アブー・バクル・ブン・アブー・アル＝ファトフ・ブン・ウマル・ブン・アリー・ブン・アフマド・ブン・ムハンマド、シュジャーウ・アッ＝ディーン、アブー・アブドゥッラー、イマーム・ナジーブ・アッ＝ディーン・アッ＝スィジズィー・アル＝ハナフィーの子、聖モスク（アル＝マスジド・アル＝ハラーム）のイマーム。（某世紀の）6年ラジャブ月に没した（原文は一の位のみ。世紀は不明、下記参照）。アブー・アル＝バカー・イブン・アッ＝ディヤーはそのように没年を記しているが、我らが同輩イブン・ファハドは彼の誤りであるとし、彼（本項主）の父は616年にアル＝アズラキーの『歴史』を伝承していると述べた。アッ＝タキー・アル＝ファースィーが彼の伝記を書いている。
  en: Muḥammad b. Abī Bakr b. Abī al-Fatḥ b. ʿUmar b. ʿAlī b. Aḥmad b. Muḥammad, Shujāʿ al-Dīn Abū ʿAbd Allāh, son of the imām Najīb al-Dīn al-Sijzī al-Ḥanafī, imām of the Sacred Mosque. He died in Rajab of the year [?]06 (the century is not stated; see below). So Abū al-Baqāʾ Ibn al-Ḍiyāʾ dated him, but our companion Ibn Fahd held him to be mistaken, saying that his father transmitted the Taʾrīkh of al-Azraqī in the year 616. Al-Taqī al-Fāsī wrote his biography.
