translation:
  ja: ムハンマド・ブン・アブド・アッラー・ブン・ムハンマド・ブン・アフマド、アッ＝シャムス・ブン・アル＝ジャマール・ブン・アッ＝ルーミー、アル＝カーヒリー、アル＝フサイニー、ハナフィー派。父と兄弟アフマドは前述。アル＝バドル・ブン・フィーシャーの娘を娶って姻戚となり、彼女との間に子をもうけた。イブン・アッ＝シフナの代理（裁判官）を務めたが、アル＝アムシャーティーは彼を代理に任ずることを拒んだ。彼はその職域で憎まれ、その流儀についての噂は広まっている。イブン・アッ＝サムハラーティーの遺産をめぐる事件が彼に起こり、そこでマーリク派の（カーディー）らに辱められたほか、他にも数々の事件があったが、彼はその習癖から離れない。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad b. Aḥmad, al-Shams b. al-Jamāl b. al-Rūmī, al-Qāhirī, al-Ḥusaynī, the Ḥanafī; his father and his brother Aḥmad have been mentioned above. He became son-in-law of al-Badr b. Fīshā by marrying his daughter and had children by her. He acted as deputy (judge) for Ibn al-Shiḥna, but al-Amshāṭī refused to appoint him as his deputy. He is hated in his line of work, and his conduct is notorious. An affair befell him concerning the estate of Ibn al-Samkharāṭī, in which the Mālikī (judge) and others humiliated him, besides several other affairs; yet he does not desist from his habit.
