translation:
  ja: ムーサー・ブン・ムハンマド・ブン・アビー・アル＝ファトフ・ムハンマド・ブン・アフマド・ブン・アビー・アブドゥッラー・ムハンマド・ブン・ムハンマド・ブン・アブドゥッラフマーン、アッ＝シャラフ、アル＝ハサニー、アル＝ファースィー、アル＝ハンバリー。インドのクルバルジャー地方に生まれ、（8）30年以降、10歳余でマッカに来た。アブー・アル＝ファトフ・アル＝マラーギーとアッ＝タキー・ブン・ファハドから聴聞し、多くの者が彼にイジャーザを与えた。マッカで叔父アブドゥッラティーフの代理としてカーディー職とイマーム職を代行し、（8）50年以降にマッカを出てインド地方へ向かった。
  en: Mūsā b. Muḥammad b. Abī al-Fatḥ Muḥammad b. Aḥmad b. Abī ʿAbd Allāh Muḥammad b. Muḥammad b. ʿAbd al-Raḥmān, al-Sharaf al-Ḥasanī al-Fāsī al-Ḥanbalī. He was born in the land of Kulbarjā in India and came to Mecca after (8)30, being over ten years old. He heard from Abū al-Fatḥ al-Marāghī and al-Taqī b. Fahd, and a group (of scholars) granted him ijāza. He acted as deputy for his paternal uncle ʿAbd al-Laṭīf in the judgeship and the imamate in Mecca, and he left Mecca after (8)50 for the land of India.
