notes:
- text: '転送見出し（原文末尾「يأتي فيه」＝「محمود（زائد）の項に見よ」による）。転送先は本項主自身の本伝ではなく**息子の本伝** #AIND-D09866「محمود بن محمد بن إسماعيل بن محمد بن عبد الله نجم الدين المدعو زائدا … ابن الشمس القلهاتي من أعمال هرموز الحجازي الشافعي」（858年生、収録済み）。D09866 本文に父の記述（「وكان أبوه صالحا تلاوة وعبادة وورعا ممن اشتغل بالقاهرة وغيرها وقطن مكة … حتى مات بمندوة في مستهل رجب سنة سبع وثمانين وقد زاحم الثمانين」＝本項主は887年ラジャブ月初めに مندوة で没）があり、本項主の属性はそこから補わない（規則23）。'
