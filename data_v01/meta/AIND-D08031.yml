translation:
  ja: ムハンマド・ブン・アリー・ブン・イドリース・ブン・アフマド・ブン・ムハンマド・ブン・ウマル・ブン・アリー・ブン・アビー・バクル・ブン・アブド・アッ＝ラフマーン・アル＝アラウィー・アッ＝タイッズィー・アッ＝ザビーディー・アッ＝シャーフィイー、後述するアブー・アッ＝ターヒル・ムハンマドの父。その子は彼から法学その他で益を得、彼から多くを聴聞した。彼はこの世紀の人であるが、私はその伝記を見ていない。
  en: Muḥammad b. ʿAlī b. Idrīs b. Aḥmad b. Muḥammad b. ʿUmar b. ʿAlī b. Abī Bakr b. ʿAbd al-Raḥmān al-ʿAlawī al-Taʿizzī al-Zabīdī al-Shāfiʿī, the father of Abū al-Ṭāhir Muḥammad, who will come below. His son benefited from him in jurisprudence and other subjects and heard much from him. He belongs to this century, but I have not seen a biography of him.
