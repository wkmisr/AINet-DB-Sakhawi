translation:
  ja: ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・ムハンマド・ブン・ハラフ・ブン・アリー、ナースィル・アッ＝ディーン・アル＝ムヌーフィー、のちアル＝カーヒリー、アル＝アズハリー、アッ＝シャーフィイー、アッ＝シャーズィリー、フザイファの姉妹の息子（イブン・ウフト・フザイファ）として知られる。クルアーンを暗記し、学問に携わり、イブン・ザグダーンに身を寄せて彼を尊崇した。私が息子のために読んだものの多くを、息子とともに聴いた者の一人で、穏やかで善良であった。それゆえ私は彼から（聞いた）夢の話をジャクマクの伝記に書き記した。
  en: Muḥammad b. ʿAlī b. Muḥammad b. Muḥammad b. Khalaf b. ʿAlī, Nāṣir al-Dīn al-Munūfī, then al-Qāhirī, al-Azharī, al-Shāfiʿī, al-Shādhilī, known as Ibn Ukht Ḥudhayfa (the sister's son of Ḥudhayfa). He memorized the Qurʾān, engaged in study, attached himself to Ibn Zaghdān and revered him. He was among those who heard, together with my son, much of what I read to him, with composure and goodness, so that I recorded from him a dream in the biography of Jaqmaq.
