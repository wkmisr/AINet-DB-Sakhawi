translation:
  ja: クバイシュ・ブン・ムザッファル・ブン・ムハンマド・ブン・ムバーラク、アル＝イサーミー・アル＝フマイディー、カーイド、アル＝マッキー。844年ムハッラム月にマッカの外で没し、運ばれてそこ（マッカ）に葬られた。イブン・ファハドがその没年を記している。
  en: Kubaysh b. Muẓaffar b. Muḥammad b. Mubārak al-ʿIṣāmī al-Ḥumayḍī, the qāʾid, al-Makkī. He died in Muḥarram of the year 844 outside Mecca, and was carried and buried there (in Mecca). Ibn Fahd recorded the date of his death.
