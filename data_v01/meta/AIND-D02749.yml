translation:
  ja: フサイン・ブン・ムハンマド・ブン・ナーフィウ・アル＝バドル・アル＝フザーイー・アル＝マッキー。アジャム地方（ペルシア）、インド、タハタ・アッ＝リーフ（「風の下の地」、東南アジア海域）に入り、世俗の財産の一部を獲得した。その一部を残して死去した。それはラビーウ・アル＝アウワル月885年にマッカでのことであった。
  en: Husayn b. Muhammad b. Nafi' al-Badr al-Khuza'i al-Makki. He entered the lands of the non-Arabs (Persia), India, and Southeast Asia (Taḥta al-Rīḥ), and acquired some worldly wealth. He died in Mecca in Rabi' al-Awwal in the year 885, leaving behind some of that wealth.
