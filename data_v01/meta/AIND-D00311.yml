translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・マフムード、ブルハーン・アル＝ディーン、アル＝ジーリー、シャーフィイー派。 学識ある人物で、メッカ巡礼を果たし、イエメンのザビードで彼の長（シャイフ）である法学者ユースフ・アル＝ムクリーに出会い、『サヒーフ』の「売買の書」の章まで彼に朗誦した。その後、897年にメッカで私（サハーウィー）と出会い、その翌年（898年）の初めに『売買の書』の冒頭を少し朗誦した。彼は朗誦の冒頭から長々と、ほとんど意味のない言葉を連ねて、朗誦量を増やそうとしたため、二つの方法を両立させることはできなかった。彼はメッカに滞在し続け、時折私（サハーウィー）の元を訪れていたが、私（サハーウィー）たちが出発する前のキャラバンで巡礼のため出発した。そこで彼に会うことはなかった。その後、彼がそこで（巡礼中に）亡くなり、アデンで不在者礼拝が捧げられたと聞いた。
  en: Ibrāhīm b. Muḥammad b. Maḥmūd al-Burhān al-Jīlī al-Shāfiʿī. He was a learned man who performed the Hajj and visited (Yemen), where he met his chief, the faqīh Yūsuf al-Muqrī, in Zabīd, Yemen. He read to him up to the Book of Sales (Kitāb al-Buyūʿ) from al-Ṣaḥīḥ. Then, in the year 897 H, he met me (al-Sakhāwī) in Mecca, and in the beginning of the following year (898 H), he read to me a small portion from the beginning of the Book of Sales. He aimed to recite extensively from the beginning of the reading, with prolix speech that mostly served no purpose, so it was not possible to combine the two methods. He continued to reside in Mecca, making excuses (for not leaving) and visiting me occasionally, until he departed for ziyāra (pilgrimage/visit) with the caravan that left before our (al-Sakhāwī's) own departure. We did not meet him there. Later, we heard that he died there (on his journey/in Mecca) and that a funeral prayer for the absent was performed for him in Aden.
