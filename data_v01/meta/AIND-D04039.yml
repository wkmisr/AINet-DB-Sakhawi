translation:
  ja: アブドゥルガッファール・ブン・スライマーン・ブン・ユースフ・ブン・アフマド・ブン・アブドゥルマリク・ブン・アブドゥルワーヒド・イブン・アッ＝シャイフ・マアーリー・アッ＝タルワーニー・アル＝カーヒリー・アル＝アズハリー。後述のアリーの兄弟。我らがシャイフ（イブン・ハジャル）から聴聞し、ザーヒリーヤで『ブハーリー』などを聴聞した者の一人。講義に少し出席し、諸々の禄を得て、城塞で法学者のナキーブを務め、幾度もハッジを行った。
  en: ʿAbd al-Ghaffār b. Sulaymān b. Yūsuf b. Aḥmad b. ʿAbd al-Malik b. ʿAbd al-Wāḥid b. al-Shaykh Maʿālī al-Tilwānī al-Qāhirī al-Azharī, brother of ʿAlī, who is mentioned below. He was among those who heard from our shaykh (Ibn Ḥajar), and heard al-Bukhārī at the Ẓāhiriyya and other things; he attended lessons a little, held stipends, served as naqīb of the jurists at the Citadel, and performed the Ḥajj more than once.
