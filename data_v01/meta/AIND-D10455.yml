translation:
  ja: ユースフ・ブン・バーバー・ブン・ウマル・ブン・マフムード・ブン・ルスタム、アル＝ジャマール、アル＝クドワーニー（カーフにダンマ、ついで点のないダール。クルドの一部族への帰属）、アル＝クルディー、アッ＝シャーフィイー。善良な人物で、マッカとマディーナで私（サハーウィー）に師事し、私からいくつかのものを理解（ディラーヤ）と伝承（リワーヤ）の両面で学んだ。私は彼にイジャーザを書き与え、その一部を『大（史）』に記した。現在、（8）99年、彼はマディーナにあって、大いなる徳を保ち、困窮に耐えており、毎年そこから巡礼に出ている。
  en: Yūsuf b. Bābā b. ʿUmar b. Maḥmūd b. Rustam, al-Jamāl, al-Kudwānī (with ḍamma on the kāf, then an undotted dāl; a nisba to a tribe of the Kurds), al-Kurdī, al-Shāfiʿī. A good man who attached himself to me (al-Sakhāwī) in Mecca and Medina and took from me a number of things, both by way of understanding (dirāya) and transmission (riwāya). I wrote an ijāza for him, part of which I specified in al-Kabīr. He is now, in the year [8]99, in Medina, in great goodness and enduring poverty, and he performs the pilgrimage from there every year.
