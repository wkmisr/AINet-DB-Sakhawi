translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・ジャアファル・ブン・アル＝ハリーリー・アッ＝ディマシュキー。766年ラマダーン月7日に生まれた。イブン・アビー・ウザイバは、彼がイブン・ウマイラから『アブー・ダーウード』『ティルミズィー』『ナサーイー』を聴聞し、850年より後まで生きたと主張した。
  en: Muḥammad b. Abī Bakr b. Jaʿfar b. al-Ḥarīrī al-Dimashqī. He was born on 7 Ramaḍān 766. Ibn Abī ʿUdhayba claimed that he heard Abū Dāwūd, al-Tirmidhī and al-Nasāʾī from Ibn Umayla, and that he lived until after [8]50.
