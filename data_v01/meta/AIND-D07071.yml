translation:
  ja: ムハンマド・ブン・アフマド・アッ＝ザフターウィー、カーディー・ナースィルッディーンの姉妹の息子で、その父は仲買人（ダッラール）であり、アッ＝サウル（牡牛）とあだ名される。母方の叔父の存命中、またその没後も、ハブス・アッ＝ラフバ（ラフバ監獄）に隣接する店に座した者の一人で、アル＝ヒジャーズィーヤのワクフを管掌していた。生年は推定で810年。896年、私は彼と存命のまま別れた。
  en: Muḥammad b. Aḥmad al-Zaftāwī, the sister's son of al-Qāḍī Nāṣir al-Dīn; his father was a broker (dallāl), and he is nicknamed al-Thawr (the Bull). He was among those who sat in the shop adjoining the prison of al-Raḥba during the lifetime of his maternal uncle and after him, and he used to administer the waqf of al-Ḥijāziyya. His birth was, presumably, in the year 810. I parted from him in the year 896 while he was still alive.
