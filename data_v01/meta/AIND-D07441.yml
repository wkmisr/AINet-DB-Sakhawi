- text: '転送見出し（「هو ابن عبد الرحمن بن عيسى بن سلطان نسب لجده」＝「هو X」型の転送指示）。転送先は #AIND-D07571「محمد بن عبد الرحمن بن عيسى بن سلطان الشمس أو ناصر الدين أبو الفيض الغزى ثم القاهري الشافعي الصوفي القادري الماضي أبوه ويعرف بابن سلطان」（760年以前生、未受領）。ナサブ・ニスバ القادري・通称 ابن سلطان が一致。父 عبد الرحمن بن عيسى بن سلطان＝#AIND-D03719（「والد الشمس محمد ابن سلطان الشهير الآتي」）。'
