translation:
  ja: アリー・ブン・ハリール・ブン・ラスラーン・アッ＝ラムラーウィー、のちアル＝マッキー、同地（マッカ）のバーブ・アッ＝サラームにおける薬種商（アッタール）で、同地の七分誦会（アスバーウ）の一つのシャイフ。アッ＝シハーブ・ブン・ラスラーンに学んだ。彼は敬虔なクルアーン読誦のシャイフであった。アブー・ハーミド・アル＝ムルシディーが彼からクルアーン読誦諸伝承（キラーアート）を学び、彼（本項主）はそれを（アブー・ハーミドの）父ウマル・アル＝ムルシディーから学んでいた。888年ラビーウ・アル＝アウワル月にマッカで没した。
  en: ʿAlī b. Khalīl b. Ruslān al-Ramlāwī, then al-Makkī, the druggist (ʿaṭṭār) there at Bāb al-Salām and shaykh of one of the Qurʾān-recitation sevenths (asbāʿ) there. He studied under al-Shihāb b. Ruslān. He was a righteous shaykh and Qurʾān reciter. Abū Ḥāmid al-Murshidī took the Qurʾānic readings (qirāʾāt) from him, and he (the subject) had taken them from his (Abū Ḥāmid's) father ʿUmar al-Murshidī. He died in Mecca in Rabīʿ al-Awwal of the year 888.
