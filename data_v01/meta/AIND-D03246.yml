translation:
  ja: スンジュブガ・アッ＝ザーヒリー・バルクーク、法学者。主君（バルクーク）の側近（ハースキーヤ）の一人であった。多くを学んだが、特に問題はなかったものの、愚鈍であった。ヒジュラ暦815年シャウワール（西暦1413年1月/2月）に没し、バルキッヤ門外の砂漠（サハラー）に埋葬された。アル＝アイニーが彼について言及している。
  en: Sūnjbughā al-Ẓāhirī Barqūq, the jurist. He was one of the personal guards (khāṣṣakiyya) of his master (Barqūq). He studied extensively; there was no harm in him, but he was dull-witted. He died in Shawwāl in the year 815 AH and was buried in the desert (al-Ṣaḥrāʾ) outside Bāb al-Barqiyya. Mentioned by al-ʿAynī.
