translation:
  ja: アーミナ・ビント・アル＝ハワージャー・アル＝バドル・ハサン・ブン・ムハンマド・アッ＝ターヒル。ジャマール・ムハンマド・ブン・マフディーが彼女を娶った。（8）68年シャアバーン月にマッカで、彼の妻のまま没した。イブン・ファハドがその没年を記している。
  en: Āmina, daughter of the khawājā al-Badr Ḥasan b. Muḥammad al-Ṭāhir. Al-Jamāl Muḥammad b. Mahdī married her, and she died while still his wife, in Shaʿbān of the year [8]68 in Mecca. Ibn Fahd recorded her death.
