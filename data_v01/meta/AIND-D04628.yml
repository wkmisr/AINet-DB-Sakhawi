translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・ムーサー・ブン・ムハンマド・ブン・ムーサー、アル＝マグリビー・アル＝アブドゥルワーディー、アル＝アブドゥースィーとして知られる。シャイフ・アブー・アル＝カースィムの甥（兄弟の子）。記憶（暗誦）の力量が広く、極西マグリブでファトワー発給職を、フェズのカラウィーイーン・モスクでイマーム職を務めた。私は彼を「アル＝ファースィー」と呼ぶ者を見たことがある。849年、マグリブの礼拝中に急死した。
  en: ʿAbd Allāh b. Muḥammad b. Mūsā b. Muḥammad b. Mūsā, al-Maghribī al-ʿAbd al-Wādī, known as al-ʿAbdūsī, the nephew (brother's son) of al-Shaykh Abū al-Qāsim. He had a wide capacity for memorization. He held the office of issuing fatwas in the Far Maghrib and the imamate at the Qarawiyyīn Mosque in Fez. I have seen someone who called him al-Fāsī. He died suddenly while in the sunset (maghrib) prayer in the year 849.
