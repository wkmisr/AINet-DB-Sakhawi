translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・スライマーン、アル＝イッズ・アル＝マハッリー、のちにアル＝カーヒリー、シャーフィイー派。代理判事（ナーイブ）の一人で、学問に励んでアル＝アラム・アル＝ブルキーニーに師事し、その法廷（バーブ）で署名書記（タウキーウ）の職務を行ったが、ハンバル派のアル＝バドル・アル＝バグダーディーが彼を差し止めた。彼はイブン・ハッジーの遺産に関してあることを（法的に）確定させ、アズバク・アッ＝ザーヒリーが彼に危害を加えようとしたため身を隠した。このことが、ヤフヤー・ブン・ハッジーが自分（ムハンマド）を代理に任じた者の法廷を離れてアル＝マナーウィーに接近する原因となった。
  en: Muḥammad b. ʿAbd Allāh b. Sulaymān, al-ʿIzz al-Maḥallī, then al-Qāhirī, the Shāfiʿī, one of the deputy judges. He was among those who studied and attached themselves to al-ʿAlam al-Bulqīnī, and he worked as a drafter of decrees (tawqīʿ) at his court, but al-Badr al-Baghdādī the Ḥanbalī stopped him. He established (in court) something concerning the estate of Ibn Ḥajjī, and Azbak al-Ẓāhirī nearly brought harm upon him, so he went into hiding. This was the reason why Yaḥyā b. Ḥajjī deserted the court of the judge who had appointed him (Muḥammad) as deputy and turned to al-Manāwī.
