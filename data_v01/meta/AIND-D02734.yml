translation:
  ja: フサイン・ブン・カバク、フサーム・アッ＝ディーン・アッ＝トゥルクマーニー。マラティヤを包囲した後、ヒジュラ暦821年ジュマーダー・アル＝ウーラー月にアルジンジャーン（エルズィンジャン）で殺害され、スルターンはその死を喜んだ。わがシャイフ（イブン・ハジャル）が〔『インバー』の〕諸事件（ハワーディス）の部で彼に言及している。別の者は、彼は勇敢な豪傑で、カバク家のトルクメン（アッ＝トゥルクマーン・アル＝カバキーヤ）のアミールであったと述べる。
  en: Ḥusayn b. Kabak, Ḥusām al-Dīn al-Turkumānī. He was killed in Jumādā al-Ūlā, in the year 821 AH, in Erzincan after besieging Malatya, and the Sultan was pleased with his death. Our shaykh (Ibn Ḥajar) mentioned him in the events section (al-ḥawādith). Others said he was a brave hero, the Emir of the Kabakiyya Turkmen.
