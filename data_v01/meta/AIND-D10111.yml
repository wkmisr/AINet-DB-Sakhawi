translation:
  ja: マイヤージュ・ブン・ムハンマド、先祖と同じくマグリブ人の巡礼隊の長（シャイフ）。敬虔さと名声をもって語られる者の一人。（8）59年ラビーウ第一月に没した。イブン・アズムがその没年を記しているが、別の箇所では（8）76年としており、それは誤りである。
  en: Mayyāj b. Muḥammad, shaykh of the caravan of the Maghribīs, like his forebears. He is one of those spoken of for piety and renown. He died in Rabīʿ I of the year [8]59. Ibn ʿAzm recorded his death; in another place he gave the year [8]76, which is an error.
