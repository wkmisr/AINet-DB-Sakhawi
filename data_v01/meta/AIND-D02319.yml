translation:
  ja: タナンム、法学者、ハナフィー派。イブン・クダイドから文法、形態論などを学んだ。またムッラー・シャイフからも学んだ。彼はクルアーン朗誦の指導者となり、多くのトルコ人や彼らの子弟などに益をもたらした。彼から学んだ者の中にヒドル・ブン・シャマーフがおり、私（サハーウィー）はこの人物についての情報を彼（ヒドル）から得た。
  en: Tanamm, the jurist, a Hanafi. He learned grammar, morphology, and other subjects from Ibn Qudayd, as well as from Mullā Shaykh. He became a leading teacher of Qur'an recitation, benefiting a group of Turks, their children, and others. Among those who learned from him was Khiḍr b. Shimāf, and from him (Khiḍr) I (al-Sakhāwī) obtained this information.
