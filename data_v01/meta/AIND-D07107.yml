translation:
  ja: ムハンマド・ブン・イスマーイール・ブン・アブドゥッラー・ブン・ウマル・ブン・アビー・バクル・ブン・アブド・アッ＝ラフマーン・ブン・アブドゥッラー、アブー・アブドゥッラー・アン＝ナーシリー。彼の叔父であるカーディー・アブー・アブドゥッラーは言った。「法学者で有徳・敬虔、心が清らかで、生計に恵まれていた」。（8）09年にアル＝カドラーで没した。アル＝アフィーフは付け加えて（言う）、彼にはその学徳と勉学の良さを示す多くの注記（ハワーシー）があり、叔父の代理としてシハームで裁判を担当し、善を命じ悪を禁じる人であった。
  en: 'Muḥammad b. Ismāʿīl b. ʿAbd Allāh b. ʿUmar b. Abī Bakr b. ʿAbd al-Raḥmān b. ʿAbd Allāh, Abū ʿAbd Allāh al-Nāshirī. His paternal uncle the qāḍī Abū ʿAbd Allāh said: he was a jurist, virtuous, righteous, pure of heart, and blessed in his livelihood. He died in al-Kadrāʾ in the year (8)09. Al-ʿAfīf added: he had many glosses (ḥawāshī) indicating his merit and the quality of his studies; he deputized for his uncle in judicial affairs in Sihām, and he was one who enjoined good and forbade evil.'
