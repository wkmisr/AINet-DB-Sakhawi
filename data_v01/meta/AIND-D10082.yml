    ja: 「عم أمير المؤمنين المتوكل العز عبد العزيز」＝本項主は現任カリフの叔父。甥＝#AIND-D04022「عبد العزيز بن يعقوب بن محمد بن أبي بكر بن سليمان … المتوكل على الله العز أبو العز بن الشرفي بن المتوكل على الله الهاشمي العباسي」（819生、カリフ 884–903）。甥のナサブ（بن يعقوب بن محمد بن أبي بكر＝المتوكل I の孫）と本項主（المتوكل I の子）で叔父・甥が閉合。初版の TMP-P-000831（ID-Master 登録「المتوكل العز عبد العزيز الخليفة」、D05664 で使用）は corpus 本伝 D04022 と同一人物＝名寄せ要（§D158-6）。「أمير المؤمنين」は甥の職＝本項主の state にしない。
