translation:
  ja: ムーサー・ブン・ムハンマド・ブン・アビー・バクル、アッ＝シャラフ・ブン・アル＝ムタワッキル・アラー・アッラー、アル＝ハーシミー、アル＝アッバースィー。信徒たちの長アル＝ムタワッキル・アル＝イッズ・アブドゥルアズィーズの叔父。（8）91年サファル月に約100歳で没した。知力が劣っていた。彼の伝記は『ワファヤート（没年録）』にある。
  en: Mūsā b. Muḥammad b. Abī Bakr, al-Sharaf b. al-Mutawakkil ʿalā Allāh al-Hāshimī al-ʿAbbāsī, paternal uncle of the Commander of the Faithful al-Mutawakkil al-ʿIzz ʿAbd al-ʿAzīz. He died in Ṣafar of the year (8)91, aged about one hundred. He was of deficient intellect. His biography is in al-Wafayāt.
