translation:
  ja: ムハンマド。直前の人物の兄弟で、バラカートと呼ばれ、その名でより知られている。私（サハーウィー）から聴聞した者の一人である。神が彼を両親への孝行に導きたまいますように。
  en: Muḥammad, the brother of the preceding one. He is called Barakāt, and is better known by that name. He is among those who heard from me (al-Sakhāwī). May God grant him success in dutifulness to his parents.
