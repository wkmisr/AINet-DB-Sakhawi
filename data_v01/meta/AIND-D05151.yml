translation:
  ja: アリー・ブン・ライハーン・アッ＝タアカリー。アブー・バクル・ブン・アブド・アル＝ガニー・アル＝ムルシディーの母方の叔父。インドにしばらく滞在した者の一人。878年ムハッラム月にマッカ（メッカ）で没した。イブン・ファハドも彼の没年を記録している。
  en: ʿAlī b. Rayḥān al-Taʿkarī, the maternal uncle of Abū Bakr b. ʿAbd al-Ghanī al-Murshidī. He was among those who resided in India for a period. He died in Mecca in Muḥarram of the year 878 AH. Ibn Fahd also recorded his death.
