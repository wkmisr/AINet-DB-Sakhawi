translation:
  ja: アフマド・ブン・ラスラーン・アッ＝サフティー・アル＝カーヒリー・アッ＝シャーフィイーは、法学の多くの部門を暗記し、議論し、問題を提起し、わずかながら理解するまで、勉学に励み熟達した者の一人である。彼はシャイフー・ハーンカーの大学生の一人であった。826年ラビーウ・アル＝アウワル月に亡くなったとき、60歳を終えていた。
  en: Aḥmad b. Raslān al-Safaṭī al-Qāhirī al-Shāfiʿī was one of those who strove and became skilled to the extent that he could recall many jurisprudential branches, debate, raise questions, and understand a little. He was one of the senior students at the Shaykhūniyya Khānqāh. He died in Rabīʿ al-Awwal in the year 826 H, having completed sixty years of age.
