translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・ユースフ、シーハーブッディーン（本名）。アレッポ出身、その後ダマスクスのサーリヒーヤに住み、そこで綿商を営んだ。ユースフ（後述）の兄弟。 アフマド・ブン・イブラーヒーム・ブン・ユーヌスから聞き取り、アブー・アムル・ブン・マンダの『フワーイド』の第一巻を伝承し、またアブドゥッラー・ブン・ハリーフ・アル＝ハラスタニーからティルミズィーの『シャマーイル』の一部を伝承した。ハディースを伝え、多数の知識人が彼から聞き取った。サーリヒーヤで綿商を営んでいた。死去。
  en: Aḥmad b. Ibrāhīm b. Yūsuf, Shihāb al-Dīn. Originally from Aleppo, he later resided in al-Ṣāliḥīya in Damascus, where he worked as a cotton merchant. He was the brother of Yūsuf (mentioned below). He received knowledge from Aḥmad b. Ibrāhīm b. Yūnus, transmitting the first volume of Abū ʿAmr b. Manda’s 『Fawāʾid』, and from ʿAbd Allāh b. Khalīl al-Ḥarastānī, transmitting part of al-Tirmidhī’s 『al-Shamāʾil』. He transmitted ḥadīth, and many scholars heard from him. He worked as a cotton merchant in al-Ṣāliḥīya. He passed away.
