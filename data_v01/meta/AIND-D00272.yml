translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・タイプガー・アル＝ガッズィー・アル＝ハナフィー。彼はアル＝カーフィヤージーから学んだ者の一人であり、彼ら（ハナフィー派）の著作から『アル＝マジュマア（集成）』を著した。ガザのカーディー職を数度務め、サファドのカーディー職も同様であった。その後、証人（シャーヒド）の職務に専念した。彼は現在生存している。
  en: Ibrāhīm b. Muḥammad b. Ṭaybughā al-Ghazzī al-Ḥanafī was among those who acquired knowledge from al-Kāfiyājī. He composed al-Majmaʿ from their works. He held the office of qāḍī in Ghazza more than once, and likewise in Ṣafad. After that, he confined himself to the role of a witness (shāhid). He is currently alive.
