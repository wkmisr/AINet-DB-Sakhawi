translation:
  ja: ウマル・ブン・アビー・バクル・ブン・ハリール、ビルバイス出身、シャーフィイー派、アル＝バターイニーとして知られる。崇敬を集めた人物の一人で、アル＝アシュラフ・カーイトバーイの時代まで生き長らえた者の一人。アッ＝ザーヒル・ジャクマクの時代、ダウラート・バーイは彼を篤く信じていた。
  en: ʿUmar b. Abī Bakr b. Khalīl, of Bilbays origin, Shāfiʿī, known as al-Baṭāyinī. One of those held in veneration, among those who lived on into the days of al-Ashraf Qāytbāy. Dawlāt Bāy, in the days of al-Ẓāhir Jaqmaq, had a firm belief in him.
