translation:
  ja: アハマド・ブン・イブラーヒーム・ブン・アハマド・ブン・ガナーイム、シャハーブッディーン。バアリー出身、マダニー出身、次いでカーヒリー出身。彼の父は既述であり、兄弟のアブー・アル＝ファトフは後述する。彼はイブン・アッラバクとしても知られており、これは彼の祖父、マディーナに来たアハマドのラカブである。まるでバアラルバクの短縮形であるかのようだ。790年、あるいはその少し前にマディーナで生まれた。アル＝ブルハーン・ブン・ファルフーン、イブン・サディーキ、アッ＝ザイン・アル＝マラーギー、アル＝アラム・スライマーン・アッ＝サッカーから、797年、およびその前後、さらには815年まで（ハディースを）聴聞した。父の死後カイロに転居し、そこに定住した。カイロの指導者たちと交流し、威厳において昇進し、高価な馬に乗った。850年以降に亡くなるまでカイロにとどまった。彼の弟で先述のアブー・アル＝ファトフが彼を相続した。
  en: Aḥmad b. Ibrāhīm b. Aḥmad b. Ghanāʾim, Shihāb al-Dīn, al-Baʿlī, al-Madanī, then al-Qāhirī. His father was mentioned above, and his brother Abū al-Fatḥ will be mentioned later. He was also known as Ibn ʿAllabak, which was a laqab for his grandfather Aḥmad who came to Medina, as if it were a shortened form of Baʿlabakk. He was born in 790 AH, or a little before, in Medina. He heard from al-Burhān b. Farḥūn, Ibn Ṣaddīq, al-Zayn al-Marāghī, and al-ʿAlam Sulaymān al-Saqqā in the year 797 AH, and before and after that, until the year 815 AH, in Medina. He moved to Cairo after his father's death and settled there. He associated with its leaders, rose in status, and rode fine horses. He remained there until he died, probably after the year 850 AH. His full brother Abū al-Fatḥ, who was mentioned earlier, inherited from him.
