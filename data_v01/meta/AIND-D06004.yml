translation:
  ja: ウマル・ブン・アビー・アル＝マアーリー・ブン・ムハンマド・アビー・アル＝マアーリー、法学者、タキー・アッ＝ディーン・アッ＝ザビーディー。後述のアブー・バクルの兄弟。770年頃に生まれた。優れた法学者で、気前がよく、品性にすぐれ、同席して心地よく、歴史や伝承を多く記憶していた。ハイスのカーディー職と、兄弟の後を受けてザビードのサイフィーヤの教授職を務めた。（8）39年に没した。
  en: ʿUmar b. Abī al-Maʿālī b. Muḥammad Abī al-Maʿālī, the jurist Taqī al-Dīn al-Zabīdī, brother of Abū Bakr, who follows. He was born around the year 770. He was an accomplished jurist, generous, of good character and pleasant company, who memorized much of the histories and reports. He held the judgeship of Ḥays and the professorship of al-Sayfiyya in Zabīd after his brother. He died in the year (8)39.
