translation:
  ja: ムハンマド・ブン・アフマド・アッ＝シャリーフ・アッ＝シャムス・アル＝フサイニー・アル＝クバイバーティー・アッ＝ディマシュキー、前述のイブラーヒームの父、カイロの寄留者。有力な商人の一人で、カイロにおいてシリア人たちの拠り所となり、彼らの庇護者となった者であり、それに加えて善良さ、晴れやかさ、クルアーンの読誦、学者と義人への敬慕、人への親しみがあった。アズハル・モスクのハイミイーンの近くにハーンを建て始めたが、その完成前、865年ズー・アル＝ヒッジャ月25日に没した。彼の息子は、父が自分に残したものを、何の益も得られないことに使い果たしてしまった。神が彼を憐れみたまえ。
  en: Muḥammad b. Aḥmad al-Sharīf al-Shams al-Ḥusaynī al-Qubaybātī al-Dimashqī, the father of Ibrāhīm, mentioned above, and a resident of Cairo. He was one of the notable merchants and among those who became in Cairo a point of reference for the Syrians and a refuge for them, together with goodness, a radiant countenance, recitation of the Qurʾān, a fondness for scholars and the righteous, and affability. He began building a khan near al-Khiyamiyyīn at the Azhar Mosque, but died before its completion, on 25 Dhū al-Ḥijja 865. His son squandered what he had left him on things from which he gained no benefit. May God have mercy on him.
