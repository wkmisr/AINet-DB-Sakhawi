translation:
  ja: スカンダリー派マーリキー法学者のアフマド・ブン・ムハンマド・アッ＝シハーブ・ブン・アル＝カッサース。我らがシャイフ（イブン・ハジャル）のもとで『アッ＝タルギーブ（・アル＝ムンズィリー）』などを朗誦（キラーア）した。朗誦が巧みで、有徳の人物であった。
  en: Aḥmad b. Muḥammad al-Shihāb b. al-Qaṣṣāṣ al-Sakandarī al-Mālikī. He recited al-Targhīb (of al-Mundhirī) and other works to our shaykh (Ibn Ḥajar). He had good recitation and was a virtuous person.
