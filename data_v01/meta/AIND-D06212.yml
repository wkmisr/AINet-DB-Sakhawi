notes:
- text: 「تخلف منهم بعده ولد مراهق」＝名不詳の思春期の息子が遺された（規則14、relation は立てない。初版の空 son relation を除去）。#AIND-D04115（عبد القادر بن حسن الصاني）に「أقرأ ولد قاسم بن بيبرس بن بقر سبط ابن البرقي لكون أبيه أقرأ أباه」＝この息子を教え、その父 حسن は本項主の父 بيبرس を教えたとある。「وذهب جهاز أمه وحليها بضميمته وأبيه」＝息子の母（妻）の嫁入り道具と装身具は、本項主とその父の（財産の）没収に併せて失われた。
  lang: ja
  type: editorial
translation:
  ja: カースィム・ブン・バイバルス・ブン・バカル。シャルキーヤ地方のアラブ諸族長（シャイフ・アル＝アラブ）のうち最も有力な者。アル＝アシュラフ・カーイトバーイが彼をしばらくブルジュに投獄し、ついで885年ジュマーダー第一月に絞首刑に処した。40歳に達しておらず、兄弟のうち最年少で、民衆は彼の死を悲しんだ。彼はアン＝ヌール・ブン・アル＝バルキーからその娘を娶らされ、彼女との間に子らをもうけており、そのうち思春期の息子一人が彼の死後に残された。その（息子の）母の嫁入り道具と装身具は、彼とその父の（財産の没収に）併せて失われた。
  en: Qāsim b. Baybars b. Baqar. The most eminent of the shaykhs of the Arabs (shuyūkh al-ʿArab) in al-Sharqiyya. Al-Ashraf Qāytbāy imprisoned him for a time in al-Burj and then had him hanged in Jumādā I 885; he had not completed forty years, was the youngest of his brothers, and the common people grieved for him. Al-Nūr b. al-Barqī had married his daughter to him, and he had children by her, of whom an adolescent son survived him; the boy's mother's trousseau and her jewellery were lost together with his (Qāsim's) and his father's (property).
