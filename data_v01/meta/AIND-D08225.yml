translation:
  ja: ムハンマド・ブン・アリー・ブン・ユースフ・アル＝バッザーズ、アブド・アッサラーム・アッ＝ザムザミーの娘の子で、母はウンム・アル＝アマーン。アブド・アル＝カビール・アル＝ハドラミーの弟子（ムリード）の一人であった。858年ジュマーダー・アル＝ウーラー月にマッカで没した。イブン・ファハドがその没年を記録している。
  en: Muḥammad b. ʿAlī b. Yūsuf al-Bazzāz, daughter's son of ʿAbd al-Salām al-Zamzamī; his mother was Umm al-Amān. He was one of the disciples (murīds) of ʿAbd al-Kabīr al-Ḥaḍramī. He died in Mecca in Jumādā al-Ūlā of the year 858. Ibn Fahd recorded his death.
