translation:
  ja: ムハンマド・ブン・スルターン・ブン・アフマド、アル＝カマール・アッ＝ディマシュキー。既述のイブラーヒームとアブー・バクルの兄弟。ダマスクスでハナフィー派の裁判の代理を務める者の一人で、私（サハーウィー）は彼の二人の息子、クトゥブ・アッ＝ディーン・ムハンマドとムヒー・アッ＝ディーン・アブド・アル＝カーディルにイジャーザを与えた。
  en: Muḥammad b. Sulṭān b. Aḥmad, al-Kamāl al-Dimashqī, brother of the aforementioned Ibrāhīm and Abū Bakr. He is among those who serve as deputy in the Ḥanafī judgeship in Damascus, and I (al-Sakhāwī) granted an ijāza to his two sons, Quṭb al-Dīn Muḥammad and Muḥyī al-Dīn ʿAbd al-Qādir.
