translation:
  ja: ムハンマド・ブン・アブドゥルワッハーブ・ブン・アフマド・ブン・ムハンマド、アッ＝シャムス・ブン・アッ＝タージュ、ハウワーラ族出自、カイロの人、のちヤンブウの人、シャーフィイー派。既述のカースィムの兄弟で、イブン・ズバーラとして知られる。従兄弟アッ＝シハーブ・アフマド・ブン・ムハンマド・ブン・アフマドの死後、866年にヤンブウのカーディー職に就いた。マディーナのカーディーであるファトフ・アッ＝ディーン・ブン・サーリフとその姉妹をめぐって姻戚となり（彼女を娶り）、彼女との間に子をもうけた。彼は873年に60歳を越えて同地で死ぬよう定められた。
  en: Muḥammad b. ʿAbd al-Wahhāb b. Aḥmad b. Muḥammad, al-Shams b. al-Tāj, of Hawwārī origin, the Cairene, then of Yanbuʿ, the Shāfiʿī, brother of the aforementioned Qāsim, known as Ibn Zubāla. He held the judgeship of Yanbuʿ after the death of his cousin al-Shihāb Aḥmad b. Muḥammad b. Aḥmad in the year 866, and became related by marriage to Fatḥ al-Dīn b. Ṣulḥ (Ṣāliḥ), judge of Medina, through the latter's sister, by whom he had children. It was decreed that he die there in the year 873, having passed sixty.
