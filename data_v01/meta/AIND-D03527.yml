translation:
  ja: アブドゥルハミード・アッ＝タラーブルスィー・アル＝マグリビー、のちにアル＝カーヒリー・アル＝マーリキー。シハーブ・イブン・タキーが彼のもとで法学を学んだ（タファッカハ）。また、アッ＝ザイン・イブン・アル＝アドミーが（暗誦を）提示した（アラダ）相手のなかに「アブドゥルハミード・イブン・アブドゥッラー・アル＝マーリキー」という名が見えるが、これは明らかに本人のことである。
  en: ʿAbd al-Ḥamīd al-Ṭarābulusī al-Maghribī, then al-Qāhirī al-Mālikī. Among those who studied jurisprudence (tafaqquh) under him was al-Shihāb b. Taqī. I have also seen among those who presented (ʿaraḍa) [memorized texts] to him the name of al-Zayn b. al-Adamī [presenting to] ʿAbd al-Ḥamīd b. ʿAbd Allāh al-Mālikī, and it is apparent that he is this person.
