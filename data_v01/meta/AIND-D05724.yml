translation:
  ja: アリー・ヌール・アッ＝ディーン・アル＝バンビー、のちアル＝カーヒリー、アル＝アズハリー、マーリク派、ハティーブ（説教師）。我らがシャイフ（イブン・ハジャル）は『インバー』で彼に言及し、こう述べた。「彼は品行が良く、気性が素直であった。私の代理としてアズハル・モスクで何度も説教を行い、人々は彼を喜んで受け入れた。」844年ズー・アル＝ヒッジャ月26日に没した。
  en: 'ʿAlī Nūr al-Dīn al-Banbī, then al-Qāhirī al-Azharī, the Mālikī, the preacher (khaṭīb). Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: "He was of good bearing and sound nature. He preached at the Azhar Mosque several times as my deputy, and the people were pleased with him." He died on the twenty-sixth of Dhū al-Ḥijja in the year 844.'
