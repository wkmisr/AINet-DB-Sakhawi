translation:
  ja: ムハンマド・ブン・アリー・ブン・フサイン・ブン・ムハンマド・ブン・シャルシーク、アッ＝シャムス・ブン・アン＝ヌール・ブン・アル＝イッズ・ブン・アッ＝シャムス・アル＝アクハル、アル＝ハサニー、アル＝カーディリー。後述のアッ＝シャラフ・ムーサーの父。840年サファル月4日にペストで没し、バーブ・アル＝カラーファの近くのアディー・ブン・ムサーフィルのザーウィヤに葬られた。アッラーが彼を憐れみたまうように。
  en: Muḥammad b. ʿAlī b. Ḥusayn b. Muḥammad b. Sharshīq, al-Shams b. al-Nūr b. al-ʿIzz b. al-Shams al-Akḥal, al-Ḥasanī al-Qādirī, father of al-Sharaf Mūsā, who follows. He died of the plague on 4 Ṣafar 840 and was buried in the zāwiya of ʿAdī b. Musāfir near Bāb al-Qarāfa; may God have mercy on him.
