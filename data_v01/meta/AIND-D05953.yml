translation:
  ja: ウマル・ブン・アン＝ナッジャール（大工）・ムハンマド・ブン・スライマーン、アル＝マッキー。マッカのシャーフィイー派（カーディー）に仕える者たちの一人であったが、その後（奉仕を）やめてその（カーディーの）息子に付き従った。彼には機敏さ、すばやさ、行動力がある。アリーという名の父方の叔父がいる。
  en: ʿUmar b. al-Najjār (the carpenter) Muḥammad b. Sulaymān al-Makkī. He was one of those who served the Shāfiʿī (qāḍī) of Mecca, then withdrew and attached himself to his (the qāḍī's) son. He has cleverness, quickness and energy. He has a paternal uncle named ʿAlī.
