translation:
  ja: アハマド・ブン・ウマル・ブン・アハマド、ラカブはシハーブ、クンヤはアブー・アル＝アッバース。元来ワースィト出身、ガムラおよびマハッラの出身でシャーフィイー派の法学者。シャムス・ムハンマドの弟（後述）。856年ラビーウ・アル＝アウワル月12日水曜日にマハッラで亡くなった。私（＝サハーウィー）は彼に度々会った。彼がアズハルで一定期間学問に励み、頭角を現したと聞いた。しかし、彼の兄は彼の行いを良く思わず、恐らく彼を見捨てたと思われる。アッラーが彼と我々を憐れんでくださるように。
  en: Aḥmad b. ʿUmar b. Aḥmad, al-Shihāb Abū al-ʿAbbās, originally from Wāsiṭ, then from al-Ghamra and al-Maḥalla, a Shāfiʿī. Brother of al-Shams Muḥammad (mentioned below). He died on Wednesday, the 12th of Rabīʿ al-Awwal in the year 856 H in al-Maḥalla. I (al-Sakhāwī) met him often. I heard that he engaged in study and resided at al-Azhar for a period, excelling in his fields. However, his brother did not approve of his conduct and perhaps abandoned him. May God have mercy on him and us.
