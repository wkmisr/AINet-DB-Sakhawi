translation:
  ja: フナーフィル・ブン・アキール・ブン・ウハイル・アル＝ハサニー。ヤンブーのアミール（統治者）。ハッジャーン・ブン・ムハンマド・ブン・マスウードの後、860年以降にヤンブーを統治した。その後、ハッジャーンの息子サブウによって退位させられたが、再び復位し、875年にサブウとの衝突（戦闘）の中で殺害されるまでその地位にあった。
  en: Khunāfir b. ʿAqīl b. Wubayr al-Ḥasanī, Emir of Yanbuʿ. He governed it after Hajjān b. Muḥammad b. Masʿūd after the year 860 AH. He was then deposed by Sabʿ b. Hajjān, but was later restored to power until he was killed in a clash against Sabʿ in the year 875 AH.
