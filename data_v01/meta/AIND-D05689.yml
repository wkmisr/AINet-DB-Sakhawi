translation:
  ja: アリ・ブン・ユースフ・ブン・ズィヤーン、アブー・ハッスーン・アル＝マグリビー。宰相。865年ラマダーン月8日に急死した。彼の死によってモロッコ（マグリブ）で内乱が勃発した。このことは、我々の仲間であるマグリブの何人かの徳高い人々から私に語られた。
  en: ʿAlī b. Yūsuf b. Zayyān Abū Ḥassūn al-Maghribī, the vizier. He died suddenly on the 8th of Ramaḍān, in the year 865 AH. With his death, tribulations (fitna) broke out in Morocco. This was related to me by some of our virtuous Moroccan companions.
