translation:
  ja: ムハンマド・ブン・アフマド・アッ＝シャムス・アル＝ハリーリー・アル＝アッカード（組紐職人）、ワッラーキーンの。アル＝ジュナイナの近くにあるイブン・マディヤンの名で知られるモスクの改修者であり、アル＝ハンバリーと渾名されていた。863年サファル月に没した。
  en: Muḥammad b. Aḥmad al-Shams al-Ḥarīrī al-ʿAqqād (the cord-maker) in al-Warrāqīn, the renovator of the mosque known as Ibn Madyan near al-Junayna; he was nicknamed al-Ḥanbalī. He died in Ṣafar 863.
