translation:
  ja: カーニム・アッ＝ザーヒル・ジャクマク（のマムルーク）、カーニム・ナブサー——チェルケス語の語——として知られる。十人隊アミールとなり、間もなくサワール討伐の遠征軍とともに出征して、873年にそこで戦死した。悪人の一人であった。
  en: Qānim (mamlūk of) al-Ẓāhir Jaqmaq, known as Qānim Nabṣā, a Circassian word. He became an amir of ten, and before long set out with the expeditionary force against Sawār and was killed there in the year 873. He was one of the wicked.
