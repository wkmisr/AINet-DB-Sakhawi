translation:
  ja: アブドゥルラフマーン・ブン・アブドゥルカリーム。ウルミーヤ（ウルミエ）を起源に持つダマスクス出身のハナフィー派。シハーブ・アル＝ハスバーニーから『マシーハ・アル＝ファフル選抜100ハディース』を聴聞し、これを伝承した。我らがシャイフ（イブン・ハジャル）の孫が、865年に彼からこれを取得した。
  en: ʿAbd al-Raḥmān b. ʿAbd al-Karīm, of Urmia origin, from Damascus, the Hanafi. He heard 'The Selected One Hundred from the Mashyakha of al-Fakhr' under al-Shihāb al-Ḥasbānī and transmitted it. The grandson of our shaykh (Ibn Ḥajar) studied it under him in the year 865 AH.
