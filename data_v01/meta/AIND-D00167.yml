translation:
  ja: イブラーヒーム・ブン・アブドゥルムハイミン。ファフルッディーン、カリューブ出身、その後カイロに住み、マンスーリー病院の会計官を務めた。アフマドおよび前述のシャラフ・ムハンマドの父。彼はアスターダール役人ジャマール殿下の側近の一人であったため、彼の死後、息子（たち）は（何らかの良くない事態に）直面した。
  en: Ibrāhīm b. ʿAbd al-Muhaymin, Fakhr al-Dīn, al-Qalyūbī, then al-Qāhirī, the treasurer at al-Bīmāristān al-Manṣūrī. Father of Aḥmad and al-Sharaf Muḥammad, who are mentioned [elsewhere]. He was one of the intimates of al-Jamāl al-Ustādār, and thus his son faced difficulties after his death.
