translation:
  ja: アハマド・ブン・ムハンマド・ブン・ハムザ・ブン・アブドゥッラー・ブン・アリー・ブン・ウマル・ブン・ハムザ、シャハーブ・アル＝ウマリー、ハーラーン出身、マディーナ在住。後述の『アブドゥルカーディル』の父であり、アル＝ハッジャールとしても知られる。彼（サハーウィー）からマディーナで聞いた一人。
  en: Aḥmad b. Muḥammad b. Ḥamza b. ʿAbd Allāh b. ʿAlī b. ʿUmar b. Ḥamza, al-Shihāb al-ʿUmarī, originally from Ḥarrān, resident of Medina. He was the father of ʿAbd al-Qādir (mentioned below) and was known as al-Ḥajjār. He was among those who heard from me (al-Sakhāwī) in Medina.
