translation:
  ja: アブドゥルガニー・ブン・シャーキル・ブン・マージド・ブン・アブドゥルワッハーブ・ブン・ヤアクーブ、アル＝ファフル・ブン・アル＝アラム・イブン・アル＝ジーアーン。直前の項の人物の祖父であり、シャーキルとその兄弟たちの父である。書記実務に秀で、軍務局書記（キターバト・アル＝ジャイシュ）などの職務に従事した。808年ジュマーダー・アル＝ウーラー月25日に没した。
  en: ʿAbd al-Ghanī b. Shākir b. Mājid b. ʿAbd al-Wahhāb b. Yaʿqūb, al-Fakhr b. al-ʿAlam Ibn al-Jīʿān. He was the grandfather of the preceding person and the father of Shākir and his brothers. He excelled in secretarial writing and served in various posts such as the army chancery (kitābat al-jaysh). He died on 25 Jumādā I 808 AH.
