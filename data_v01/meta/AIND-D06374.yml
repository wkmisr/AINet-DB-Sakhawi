translation:
  ja: クーマート・シャー・ブン・イスカンダル・ブン・カラー・ユースフ・ブン・カラー・ムハンマド、父については前述。841年、父がカルア・アン＝ナジャー（城塞）に包囲されている最中にこれを殺害し、そのことを叔父ジャハーンシャーに書き送った。
  en: Qūmāṭ Shāh b. Iskandar b. Qarā Yūsuf b. Qarā Muḥammad, whose father was mentioned above. He killed his father in the year 841 while the latter was besieged in the fortress of al-Najā, and sent word of it to his uncle Jahānshāh.
