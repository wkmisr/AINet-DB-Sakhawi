translation:
  ja: ムハンマド・ブン・アフマド・アル＝ムヒッブ・アル＝ハラビー、のちアッ＝ディマシュキー、書家（アル＝カーティブ）、イブン・アル＝マジュルーフとして知られる。イブン・アッ＝シャムス・アル＝ハラビーについて書を学び、書において抜きん出て、アル＝ムジャーヒディーヤその他で習字の教授にあたった。アブー・アル＝ファドル・イブン・アル＝イマームが彼から書き取った者の一人で、彼は言う、「付き合いやすく、容姿も身なりも良かったが、放埒であった」と。（8）60年代に、50歳を超えて没した。
  en: 'Muḥammad b. Aḥmad al-Muḥibb al-Ḥalabī, then al-Dimashqī, the scribe (al-Kātib), known as Ibn al-Majrūḥ. He studied penmanship under Ibn al-Shams al-Ḥalabī, excelled in writing, and devoted himself to teaching penmanship at al-Mujāhidiyya and elsewhere. He was among those from whom Abū al-Faḍl Ibn al-Imām wrote down; he said: he was sociable, of handsome appearance and dress, and dissolute. He died in the (eight hundred and) sixties, having passed fifty.'
