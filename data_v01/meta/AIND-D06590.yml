notes:
- text: '転送見出し（原文「فيمن جده عبد الله」による）。転送先は #AIND-D06513「890 محمد بن إبراهيم بن عبد الله الشمس الكردي الأصل ثم المقدسي ثم القاهري المكي الشافعي وسمى المقريز جده أحمد لا عبد الله . ولد سنة سبع وأربعين وسبعمائة ببيت المقدس … ومات بمكة في ذي القعدة سنة إحدى عشرة」（repo 未収録）。corpus 見出しで「محمد بن إبراهيم بن عبد الله」＋「الكردي」はこの1件（hwm.py）。同じ D06513 へ向く転送見出しに REF #AIND-D06484「محمد بن إبراهيم بن أحمد الكردي . يأتي فيمن جده عبد الله .」（repo 収録済み）と #AIND-D06523「محمد بن إبراهيم بن علي بن إبراهيم الكردي ثم المقدسي . مضى فيمن جده عبد الله .」（本バッチ B169）。次項 #AIND-D06591（الكردي ثم المكي、サハーウィーの聴講者）は別人で、本見出しの指す相手ではない。'
