translation:
  ja: イブラーヒーム・アッ＝シャーミー、商人。イブン・カンディールとして知られる。888年ラジャブ月7日にマッカで死去した。彼は遺産の中から公正な人々に100ディナールを遺贈し、さらに、彼が病弱であったにもかかわらず、人々を集めて、自身の収入から『サヒーフ・アル＝ブハーリー』を彼らに分け与え、それぞれに2ディナールを与えた。その後、息子が来て公正な人々と争い、彼らを告発したが、後に取りやめた。
  en: Ibrāhīm al-Shāmī, a merchant known as Ibn Qandīl, died in Mecca on the 7th of Rajab in the year 888 H. He had bequeathed one hundred dinars from his inheritance to the عدول (notaries/just people). Moreover, despite his weakness, he gathered a group and distributed 『Ṣaḥīḥ al-Bukhārī』 to them from his income, giving each two dinars. Subsequently, his son came and disputed with the عدول, accusing them, but later withdrew.
