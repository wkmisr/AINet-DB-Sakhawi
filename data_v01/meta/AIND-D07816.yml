translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー・ブン・アビー・アブドゥッラー・ムハンマド・ブン・アッ＝ラディー・ムハンマド・ブン・アビー・バクル・ブン・ハリール・アル＝クラシー・アル＝ウスマーニー・アル＝マッキー。834年シャウワール月にそこ（マッカ）で生まれ、アブー・アル＝ハイル・ブン・アブドゥルカウィーに師事し、バーブ・アッ＝サラームで証人（シャーヒド）として生計を立て、生計のためエジプトとシャームの地へ幾度も旅した。870年代の某年、シャームでペストにかかって没した。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh b. Abī ʿAbd Allāh Muḥammad b. al-Raḍī Muḥammad b. Abī Bakr b. Khalīl al-Qurashī al-ʿUthmānī al-Makkī. He was born there [in Mecca] in Shawwāl 834, attached himself to Abū al-Khayr b. ʿAbd al-Qawī, earned his living as a notary-witness at Bāb al-Salām, and travelled to the Egyptian and Syrian lands more than once for a livelihood. He died of the plague in Syria in [eight hundred and] seventy-odd.
