translation:
  ja: ムバーラク・ブン・ムハンマド・ブン・ウタイファ・ブン・アビー・ヌマイ・アル＝ハサニー・アル＝マッキー。容姿の整ったシャリーフ。797年、マッカの主サイイド・ハサン・ブン・アジュラーンとともにカイロへ赴いたが、二人とも捕縛された。その後ハサンは釈放されたが、彼はカイロで投獄されたままとなり、次いでアレクサンドリアへ移されて一団とともに投獄され、やがて釈放されたが、ほどなく［7］99年の末にカイロ郊外で没した。アル＝ファースィーが彼に言及している。
  en: Mubārak b. Muḥammad b. ʿUṭayfa b. Abī Numayy al-Ḥasanī al-Makkī, a sharīf of handsome appearance. In the year [7]97 he went to Cairo with al-Sayyid Ḥasan b. ʿAjlān, the lord of Mecca, and both were arrested; Ḥasan was then released, while he remained imprisoned in Cairo. He was then transferred to Alexandria and imprisoned there with a group until he was released, and not long afterwards he died at the end of the year [7]99 on the outskirts of Cairo. Al-Fāsī mentioned him.
