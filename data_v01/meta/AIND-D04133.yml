translation:
  ja: アブド・アル＝カーディル・ブン・アブド・アッ＝ラッザーク・ブン・アブド・アル＝カーディル・ブン・アブド・アル＝ハリーム・ブン・アブド・アッ＝ラッザーク・アッ＝シャラフ・アル＝アンサーリー・アッ＝サカンダリー・アル＝マーリキー。アレクサンドリアのカーディーであり、同地のシャイフ・アッ＝シュユーフ（修道道場長たちの長）。ヒジュラ暦760年シャウワール月にアレクサンドリアで生まれた。彼からアル＝ビカーイーが（学問を）得た。ヒジュラ暦844年ラジャブ月21日の金曜日に没した。
  en: ʿAbd al-Qādir b. ʿAbd al-Razzāq b. ʿAbd al-Qādir b. ʿAbd al-Ḥalīm b. ʿAbd al-Razzāq al-Sharaf al-Anṣārī al-Sakandarī al-Mālikī, the Qadi of Alexandria and its Shaykh al-Shuyukh. He was born there in Shawwal 760 AH. Al-Biqāʿī studied under him. He died on Friday, 21 Rajab 844 AH.
