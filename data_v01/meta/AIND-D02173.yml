translation:
  ja: バルスバーイ・アル＝ムアイヤディー〔・シャイフ〕（ムアイヤド・シャイフのマムルーク）。アシュラフ（バルスバーイ）期にハーッサキー（近侍）となり、次いで（時の）スルターンの時代にサーキー（酌人）となり、その後イーナール・アル＝カマーリー・アン＝ナースィリーの死後に十人長アミール位を授けられた。分別があり敬虔な人物であった。ヒジュラ暦856年ジュマーダー・アル＝ウーラー月に没した。
  en: Barsbāy al-Muʾayyadī [Shaykh] (mamluk of al-Muʾayyad Shaykh). He became a khāṣṣakī (royal mamluk) during the Ashrafiyya days, then a sāqī (cupbearer) during the days of the Sultan, and was subsequently granted an amirate of ten after the death of Īnāl al-Kamālī al-Nāṣirī. He was sensible and pious. He died in Jumādā al-Ūlā in the year 856 AH.
