translation:
  ja: ムハンマド・ブン・アブドゥルワッハーブ・ブン・アフマド・ブン・サーリフ・ブン・アフマド、アル＝ジャラール・アブー・アル＝ファトフ・ブン・アル＝イマーム・アル＝カーディー・アッ＝タージュ・アビー・ナスル・ブン・アル＝イマーム・アル＝カーディー・アッ＝シハーブ・アビー・アル＝アッバース・アッ＝ズフリー・アッ＝ディマシュキー・アッ＝サーリヒー・アッ＝シャーフィイー。その父は既述。800年に生まれ、アーイシャ・ビント・イブン・アブドゥルハーディーから『サヒーフ』などを聴聞し、他の者からも聴聞した。わずかに伝承し、ダマスクスでカーディー代理を務めた。867年ラジャブ月に同地で没し、ダマスクス城外のスーフィー墓地の先祖のそばに葬られた。神の慈悲あれ。
  en: Muḥammad b. ʿAbd al-Wahhāb b. Aḥmad b. Ṣulḥ (Ṣāliḥ) b. Aḥmad, al-Jalāl Abū al-Fatḥ b. al-Imām al-Qāḍī al-Tāj Abī Naṣr b. al-Imām al-Qāḍī al-Shihāb Abī al-ʿAbbās al-Zuhrī al-Dimashqī al-Ṣāliḥī al-Shāfiʿī. His father was mentioned above. He was born in the year 800, heard the Ṣaḥīḥ and other works from ʿĀʾisha bt. Ibn ʿAbd al-Hādī and from others, transmitted a little, and served as deputy judge in Damascus. He died there in Rajab of the year 867 and was buried beside his forefathers in the Ṣūfiyya cemetery outside Damascus, may God have mercy on him.
