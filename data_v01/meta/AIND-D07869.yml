translation:
  ja: ムハンマド・ブン・アブドゥッラー、ワリーユッディーン・アッ＝スンバーティー・アル＝カーヒリー・アル＝マーリキー。フサイリムと呼ばれた。高齢の老師で、締まりがなく、身なりはみすぼらしかった。自派のカーディーたちの代理を務め、バハラームらから学んだと主張していたが、信頼に値する人物ではない。881年ラビーウ・アル＝アウワル月の初め、またはその前月の末に没した。彼の父はイスラームに改宗した者（アスラミー）で、麻布（シュルブ）の商いで生計を立てていたが、のちに貧しくなって仲買人として働いたと言われる。真相はアッラーが最もよく知る。
  en: Muḥammad b. ʿAbd Allāh, Walī al-Dīn al-Sunbāṭī al-Qāhirī al-Mālikī, nicknamed Ḥuṣayrim. He was an aged shaykh, lax and of shabby appearance, who deputized for the judges of his school and claimed to have studied under Bahrām and others; he is not trustworthy. He died at the beginning of Rabīʿ I or at the end of the preceding month in the year 881. It is said that his father was a convert (aslamī) who earned his living by trading in fine linen (shurb), then became poor and worked as a broker; but God knows best.
