  note:
    ja: '規則3・37。父＝ #AIND-D09945「مطيرق بن منصور بن راجح بن محمد بن عبد الله بن عمر بن مسعود العمري المكي أحد أعيان القواد العمرة ووالد حصيرة . مات بها في جمادى الأولى سنة ست وخمسين . أرخه ابن فهد」（856没、未収録）。見出しナサブ6代（مطيرق بن منصور بن راجح بن محمد بن عبد الله بن عمر بن مسعود）とニスバ العمري が完全一致。D09945 が子として挙げる「حصيرة」は corpus で他に出現せず（grep「حصيرة」該当は D09945 のみ）、本項主 خضير との関係（別の子か、同一人の異綴りか）は不明＝note 留め。叔父（父の兄弟）#AIND-D02260 تبل・#AIND-D06062 عويد・#AIND-D09936 مشيعب（いずれも بن منصور بن راجح）、曾祖父 راجح＝TMP-P-001669（D10000 の父）は本項原文に名指しがないため relation を立てない。'
