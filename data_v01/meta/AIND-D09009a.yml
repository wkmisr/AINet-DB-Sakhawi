translation:
  ja: ムハンマド・ブン・ムハンマド・ブン・ウマイラ・アッ＝サイダーウィー、ダマスクス在住のスーフィーの一人。869年に約80歳で没した。バドリーはその『マジュムー』に彼の詩を書き留めた——「私が熱情をもって称えた馭者、彼が統率を極めたとき／私はシャリーアに彼を訴えに行った、すると彼は言った『政治（シヤーサ）で彼を取れ』と」。見事な書を書き、身なりと交際が良く、装いに気を配り、寛大で美点の多い人であった。
  en: 'Muḥammad b. Muḥammad b. ʿUmayra al-Ṣaydāwī, resident of Damascus and one of the Sufis. He died in 869 aged about eighty. Al-Badrī recorded in his Majmūʿ his verse: "A governor in whom I praised passion, when he became perfect in leadership; / I went to complain of him to the sharīʿa, and he said to me: take him by siyāsa." He wrote a beautiful hand, was well dressed and good company, elegant, generous and full of merits.'
