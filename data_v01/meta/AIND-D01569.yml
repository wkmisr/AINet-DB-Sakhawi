translation:
  ja: アフマド・ブン・ムハンマド・ブン・ムーサー・ブン・ムハンマド、ラカブはアッ＝シハーブ、出自はアル＝マグラーウィー、次いでアル＝アブシーヒー、そしてアル＝カーヒリー。後述されるアル＝バハーゥ・ムハンマドの父。サービキーヤなどの諸方面で（管理職を）務め、証言（シャハーダ）で生計を立てた。我らがシャイフ（イブン・ハジャル）に口述筆記（イムラーゥ）で密着して師事し、彼（シャイフ）の没後もしばらく生きて没した。あまり好ましい人物ではなかった。アッラーが彼を赦されんことを。
  en: Aḥmad b. Muḥammad b. Mūsā b. Muḥammad, al-Shihāb, of Maghrāwī origin, then al-Abshīhī, then al-Qāhirī. Father of al-Bahāʾ Muḥammad (mentioned later). He served (in administrative capacities) in various quarters such as al-Sābiqiyya and earned his living by testimony (al-shahāda). He kept close company with our shaykh (Ibn Ḥajar) in the dictation sessions (imlāʾ), and lived for some time after him until he died. He was not well-regarded; may God forgive him.
