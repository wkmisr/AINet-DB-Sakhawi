notes:
- text: '転送見出し（原文「مضى فيمن جده أحمد بن مخلوف」による）。転送先は #AIND-D06475「858 محمد بن إبراهيم بن أحمد بن مخلوف بن غالي … الشمس أو السعد أبو الفتح البرسيقي نسبة لبعض أعمال إسكندرية ثم القاهري الوزيري الحنفي ويعرف بالسمديسي … ولد في رابع عشر ربيع الأول سنة ثلاث وخمسين」（repo 未収録）。名・父名・祖父「أحمد بن مخلوف」・通称 السمديسي が一致。ニスバ索引 #AIND-D11731「السمديسي بفتحتين ثم مهملة مكسورة بعدها تحتانية ثم مهملة محمد بن إبرهيم بن أحمد بن مخلوف الحنفي شيخ الجانبكية والايتمشية .」も同人を挙げる。同じ D06475 へ向く転送見出しに #AIND-D08385「محمد بن عمر الشمس السمديسي ثم القاهري الحنفي نزيل باب الوزير صوابه محمد بن إبرهيم بن أحمد بن مخلوف مضى .」（repo 未収録）。'
  type: reference
