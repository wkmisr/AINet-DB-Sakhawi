translation:
  ja: カーンスーフ・アル＝アシュラフィー・バルスバーイ、アル＝ムサーリウ（格闘家）として知られる。ハーッサキーヤの一人で、力と格闘術において並ぶ者なく、勇敢で果断、姿形が良く体躯が整い、謙虚で法学者たちを愛した。856年ラビーウ・アル＝アウワル月、壮年の初めに没した。神が彼を赦したまわんことを。
  en: Qānṣūh al-Ashrafī Barsbāy, known as al-Muṣāriʿ (the wrestler). He was one of the khāṣṣakiyya, unrivalled in strength and in the art of wrestling, together with courage, boldness, a fine appearance, a perfect physique, humility and love for the jurists. He died in Rabīʿ I of the year 856 in his early maturity, may God pardon him.
