translation:
  ja: アブドゥルアズィーズ・ブン・アフマド・ブン・アフマド・ブン・イッズ・アッ＝ディーン・アル＝ガッズィー、のちにアル＝カーヒリー、朗誦家（ムクリウ）。成長してクルアーンを暗記し、諸マドラサの禄を得て、ジャマーリーヤのスッファなどで、またバイバルスィーヤの格子窓で朗誦した。多くを聴聞し、その中にはザーヒリーヤでの『ブハーリー』の読了（ハトム）も含まれる。穏やかで善良な人物であった。ヒジュラ暦891年ラジャブ月に没し、70歳に近かったと私（サハーウィー）は思う。
  en: ʿAbd al-ʿAzīz ibn Aḥmad ibn Aḥmad ibn ʿIzz al-Dīn al-Ghazzī, later al-Qāhirī, the Qurʾān reciter. He grew up, memorized the Qurʾān, obtained stipends in the madrasas, and recited at the ṣuffa of the Jamāliyya and elsewhere and at the window of the Baybarsiyya. He heard a great deal, including the completion (khatm) of al-Bukhārī at the Ẓāhiriyya. He was quiet and good. He died in Rajab 891 AH, and I think he was close to seventy.
