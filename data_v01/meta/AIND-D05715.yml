- text: '2人を束ねる索引型の見出し（「اثنان」型）。明示的な転送動詞（مضى／يأتي／في ابن…）がないため REF 化せず、repo 先例 #AIND-D00404「إبراهيم العجلوني اثنان …」（Waka 校閲済み）に倣い実伝由来要素を持たない項として保持する。参照先はいずれも corpus に本伝あり: (1) #AIND-D05439「علي بن محمد بن عبد الخالق بن أحمد بن أبي بكر … العلاء … المعري ثم الحلبي الشافعي الضرير ويعرف بابن الوردي」（771年生）、(2) #AIND-D05662「علي بن موسى بن عيسى بن عبد الله بن الوردي」（789年頃生・850年以前没）。本項目は人物 ID として relation に充当しない（規則11）。→ISSUES §D100-6。'
