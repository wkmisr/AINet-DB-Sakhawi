translation:
  ja: アミール・ザーフ・ブン・ムハンマド・ブン・シャー・アフマド・ブン・カラー・ユースフ。 彼はヒジュラ暦871年ズー・アル＝カアダ月にカイロのバーブ・アル＝ワズィールにある彼の住居で亡くなった。彼は30歳を超えていた。スルターンが彼の葬儀に参列した。彼が幼少の頃、父の側近は、バグダードの支配者である叔父のアスバハーン・ブン・カラー・ユースフから彼を守るため、アル＝ザーヒル・ジャクマクの時代に彼をイラクから連れてきた。彼は亡くなるまでアミールの子息たちの一人としてカイロで暮らしていた。
  en: Amīr Zāh b. Muḥammad b. Shāh Aḥmad b. Qarā Yūsuf. He died in Dhū al-Qaʿda of the year 871 AH at his residence in Bāb al-Wazīr, Cairo. He was over thirty years old. The Sultan attended his funeral prayer. In his youth, during the days of al-Ẓāhir Jaqmaq, his father's entourage brought him from Iraq for fear of his paternal uncle Aṣbahān b. Qarā Yūsuf, the ruler of Baghdad. He resided in Cairo like other sons of emirs until his death.
