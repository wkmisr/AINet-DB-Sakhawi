  note:
    ja: '父 إسماعيل بن علي بن الحسن … القلقشندي المقدسي。corpus に本伝なし（8世紀の人。hw.py「إسماعيل بن علي」＋「القلقشندي」の19件はいずれも子孫）。#AIND-D10816 の見出し「أبو بكر بن محمد بن إسماعيل بن علي بن الحسن بن علي بن إسماعيل بن علي ابن صالح بن سعيد … التقي بن الشمس بن التقي القلقشندي الأصل المقدسي」から、ラカブ التقي の同人（D00716・D09543 本文の「التقي إسماعيل القلقشندي」）と分かる。ID-Master の TMP-P-000176「التقي القلقشندي」は Note が空で、D10816（同じく「يعرف بالتقي القلقشندي」）との区別がつかないので使わず、新規仮番号（§D168-10）。B167 が #AIND-D10438「سبط التقي القلقشندي」の外祖父に発行した 取り下げた仮番号 B167-P02（候補＝この إسماعيل）と同一人物の可能性が高いが、そちらは呼称のみの同定なので番号は分け、集約時の共用を提案。初版は #NEEDID。'
