- text: '「فيمن جده محمد بن رجب」＝転送見出し。転送先は #AIND-D07585（刊本 8 番「محمد بن عبد الرحمن بن محمد بن رجب بن صلح الشمس الطوخي الشافعي والد أحمد الماضي ويعرف بابن رجب」）。「ابن رجب」の通称は祖父名 رجب を父位置に繰り上げた本見出しの形と一致し、ニスバ索引 #AIND-D11818「والشمس محمد بن عبد الرحمن بن محمد بن رجب وابنه الشهاب أحمد」・子 #AIND-D01350（أحمد بن محمد بن عبد الرحمن بن محمد بن رجب الشهاب الطوخي … ويعرف بابن رجب）とも整合。'
