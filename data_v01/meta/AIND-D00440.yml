translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・アブドゥッラー・アル＝クルディー・アッ＝サーリヒー・アル＝ハンバリー。イブン・マアトゥークという通称でも知られる。我らがシャイフ（イブン・ハジャル）は自身のムアジャムにおいて彼を言及し、彼の祖父をマアトゥークと記した。シャイフはまたこう語った。「私はアッ＝サーリヒーヤで彼に会ったので、アブー・ヌアイム著天国の記述（シファトゥ・ル＝ジャンナ）を彼に読誦した。それは彼がアリー・ブン・アビー・バクル・ブン・ヒスン・アル＝ハッラーニーから聴聞した書である。」シャイフはさらにこう述べた。「彼は803年のシャウワール月、ダマスクス包囲中に死去した。」シャイフはこれを、アブー・バクルについての伝記でも繰り返し記したが、彼の名は挙げず、祖父をやはりマアトゥークと記した。しかし、インバーウでは彼をアフマド、その祖父をアブドゥッラーと記し、イブン・マアトゥークとして知られていたと述べ、彼がイドゥル・フィトル（断食明けの祝祭）の後で死去したと述べた。彼はアル＝マクリーズィーのウクードでは、アブドゥッラーの名なしに（言及されている）。
  en: 'Aḥmad b. Ibrāhīm b. ʿAbd Allāh al-Kurdī al-Ṣāliḥī al-Ḥanbalī, known as Ibn Maʿtūq. Our shaykh (Ibn Ḥajar) mentioned him in his Muʿjam and named his grandfather Maʿtūq. He (Ibn Ḥajar) said: ''I met him in al-Ṣāliḥiyya, and I recited to him Abū Nuʿaym''s Ṣifat al-Janna (Description of Paradise), which he had heard from ʿAlī b. Abī Bakr b. Ḥiṣn al-Ḥarrānī.'' He (Ibn Ḥajar) also said: ''He died during the siege of Dimashq in Shawwāl of the year 803 H.'' He (Ibn Ḥajar) repeated this in his entry on Abū Bakr, but without naming him, and again named his grandfather Maʿtūq. However, in his Inbāʾ, he named him Aḥmad and his grandfather ʿAbd Allāh, and said he was known as Ibn Maʿtūq, and that he died after Eid al-Fiṭr. He is mentioned in al-Maqrīzī''s ʿUqūd without ʿAbd Allāh.'
