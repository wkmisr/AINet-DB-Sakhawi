translation:
  ja: シャイヒー・ブン・ムハンマド・ブン・アリー・アル＝ハワージャ・アッ＝タブリーズィー。彼は865年シャアバーン月にメッカで没した。イブン・ファハドが彼の没年を記録している。また、私は『メッカ史』において、彼の父の名がアフマド・ブン・アリーと記されているのを見た。アッ＝ダッバーグは、彼がメッカに居住したと述べている。
  en: Shaykhī b. Muḥammad b. ʿAlī al-Khawājā al-Tabrīzī. He died in Mecca in Shaʿbān, in the year 865. Ibn Fahd recorded his death date, and I saw in the 'History of Mecca' that his father was named Aḥmad b. ʿAlī. Al-Dabbāgh stated that he resided in Mecca.
