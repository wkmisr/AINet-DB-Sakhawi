translation:
  ja: ムーサー・ブン・シャーヒーン・アッ＝シュジャーイー。イブン・アッ＝タルジュマーン（通訳官の息子）として知られるが、それ（通訳官）が彼の父の職であったからである。（8）89年末にアミール・ハーッジ・ブン・アビー・アル＝ファラジュが罷免されたのを受けて軍のナキーブ職（ニカーバト・アル＝ジャイシュ）に就任し、その翌年のズー・アル＝ヒッジャ月に罷免された。
  en: Mūsā b. Shāhīn al-Shujāʿī, known as Ibn al-Tarjumān (son of the interpreter), because that was his father's office. He was appointed to the office of naqīb al-jaysh after the dismissal of Amīr Ḥājj b. Abī al-Faraj at the end of the year (8)89, and was then dismissed in Dhū al-Ḥijja of the following year.
