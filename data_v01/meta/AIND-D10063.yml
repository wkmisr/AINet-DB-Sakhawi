    ja: '「استقر في نقابة الجيش بعد صرف أمير حاج بن أبي الفرج في أواخر سنة تسع وثمانين」。前任者＝#AIND-D08839「محمد بن محمد بن عبد الغني بن أبي الفرج ناصر الدين المدعو أمير الحاج حفيد الفخر صاحب الفخرية . استقر في نقابة الجيش … فدام إلى أن صرف في ذي القعدة سنة تسع وثمانين بالشر في موسى بن شاهين الشجاعي بن الترجمان عن نقابة الجيش ، ثم لم يلبث أن أعيد لها」＝相手側が本項主を名指し、呼称 أمير الحاج・家名 بن أبي الفرج・職 نقابة الجيش・年 889 で閉合（規則57）。ニスバ索引 #AIND-D12596「ابن أبي الفرج … ناصر الدين محمد نقيب الجيش」も同人。'
