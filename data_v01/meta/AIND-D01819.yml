translation:
  ja: 886年シャウワール19日に死去したアシュラフィーヤ・バルスバーイの徴収人（ジャービー）、アフマド・アル＝ウクビー。（末尾の「ワ・イブン・ムハンマド・ブン・ユースフ」は、同じ通称を持つ別人アフマド・ブン・ムハンマド・ブン・ユースフ・アル＝ウクビー〔前出〕への参照と解される。）
  en: Aḥmad al-ʿUqbī, the revenue collector (jābī) of al-Ashrafiyya Barsbāy, died on the 19th of Shawwāl 886 H. (The closing phrase “wa-Ibn Muḥammad b. Yūsuf” is read as a cross-reference to the other Aḥmad al-ʿUqbī, i.e. Aḥmad b. Muḥammad b. Yūsuf al-ʿUqbī [AIND-D01581], not as the name of his father.)
