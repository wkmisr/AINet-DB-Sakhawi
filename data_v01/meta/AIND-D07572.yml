- text: '転送見出し（原文末尾の指示「مضى فيمن جده عبد العزيز بن محمد بن أحمد قريبا」による）。転送先は #AIND-D07555（刊本第750項 محمد بن عبد الرحمن بن عبد العزيز بن محمد بن أحمد بن عبد العزيز بن القسم بن عبد الرحمن علم الدين بن الرضي بن العز بن الشمس أبي الغيث بن الشهاب العقيلي النويري ثم المكي المالكي）。本見出しの「ابن أبي الغيث」は先祖（الشمس أبو الغيث）への帰属名。'
