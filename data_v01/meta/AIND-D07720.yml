translation:
  ja: ムハンマド・ブン・アブド・アル＝カーフィー・ブン・ムハンマド・ブン・イスマーイール・ブン・ウマル・ブン・マドヤン、アル＝マディーニー、アッ＝スラミー、アル＝ムナーウィー（ジーザ地方のムンヤト・アル＝カーイドにちなむ）、アル＝カーヒリー、シャーフィイー派。生まれはおよそ870年、カイロのミーダーン・アル＝ガッラにおいてであり、育った。
  en: Muḥammad b. ʿAbd al-Kāfī b. Muḥammad b. Ismāʿīl b. ʿUmar b. Madyan, al-Madīnī, al-Sulamī, al-Munāwī (after Minyat al-Qāʾid in the Giza district), al-Qāhirī, the Shāfiʿī. He was born approximately in the year 870 at Maydān al-Ghalla in Cairo, and grew up.
