translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・アリー・ブン・アフマド・ブン・アビー・バクル、アブー・アル＝ファトフ・アル＝アダミー・アル＝カーヒリー・アッ＝シャーフィイー。先述のアブドゥルバースィトの父。公証人業（シャハーダ）で生計を立て、諸々の職（ジハート）に任ぜられ、大いに富を蓄えて取引や出資（キラード）を行うほどであり、自身には吝嗇でありながら壮麗な邸宅を有した。880年を少し過ぎた頃に没した、と思われる。アッラーが彼を赦されますように。
  en: Muḥammad b. ʿAbd al-Raḥmān b. ʿAlī b. Aḥmad b. Abī Bakr, Abū al-Fatḥ al-Adamī al-Qāhirī al-Shāfiʿī, the father of ʿAbd al-Bāsiṭ mentioned previously. He earned his living as a notary witness (shahāda), was appointed to various posts (jihāt), and became exceedingly wealthy, to the extent that he traded and engaged in commenda partnerships (qirāḍ); he owned a magnificent house while being stingy towards himself. He died shortly after 880, presumably. May God forgive him.
