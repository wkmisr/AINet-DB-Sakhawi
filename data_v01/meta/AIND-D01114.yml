  ja: アハマド・ブン・ウマル・ブン・アハマド、ラカブはシハーブ、ニスバはアル＝ニムラーウィー、後にアル＝マハッリー。アル＝ガムリーの義理の息子で、イブン・アン＝ナッハールとしても知られた。わずかに学業に勤しみ、私（サハーウィー）から様々なことを聴聞した。
  en: Aḥmad b. ʿUmar b. Aḥmad, with the laqab Shihāb al-Dīn, of Nimrāwī and later Maḥallī nisbahs. He was the son-in-law of al-Ghamrī and known as Ibn al-Nakhkhāl. He applied himself to study for a short period and heard various things from me (al-Sakhāwī).
