translation:
  ja: アクバア・シャイターン・アラーウ・アッ＝ディーン・アッ＝ザーヒリーは、カイロのムフタシブ職（ヒスバ）と総督職（ワリー）に就き、一度ディーワーン監理職（シャッド・アッ＝ダワーウィーン）を兼任した。その後逮捕され、投獄された後にシャアバーン月6日の木曜日の夜に殺害された。彼は不正を働きながらも聡明であり、醜行や姦通を慎んだ。我らのシャイフ（イブン・ハジャル）は『インバーウ（＝インバーウ・アル＝グムル）』で、彼は職務に優れ、放縦が少なかったと述べた。
  en: Aqbaʿā Shīṭān ʿAlāʾ al-Dīn al-Ẓāhirī held the office of muḥtasib and governor of Cairo, and once combined both with the management of the dīwāns (shadd al-dawāwīn). He was later arrested, imprisoned, and then killed on the night of Thursday, the 6th of Shaʿbān, 821 H. He was intelligent, despite his injustice, and abstained from abominable acts and illicit sexual relations. Our shaykh (Ibn Ḥajar) said in his 『Inbāʾ al-Ghumr』 that he was good at administration and had little depravity.
