translation:
  ja: ムハンマド・ブン・ハリール・ブン・ヤアクーブ、バドル・アッディーン、説教師（ワーイズ）、アル＝ハーキム・モスクの住人。前述のアフマドの兄弟であり、私（サハーウィー）の兄弟の姻戚（義兄弟）である。クルアーンを読誦し、諸聖廟などでの説教に熱中した。世を避けて暮らしていたが、ヒジュラ暦892年シャウワール月にアル＝ハーキムの貯水槽で溺死した。アッラーが彼を赦されますように。
  en: Muḥammad b. Khalīl b. Yaʿqūb, Badr al-Dīn, the preacher (al-wāʿiẓ), resident of the Mosque of al-Ḥākim, brother of the aforementioned Aḥmad and brother-in-law of my (al-Sakhāwī's) brother. He recited the Qurʾān and was devoted to preaching at the shrines (al-mashāhid) and similar places. He lived withdrawn until he drowned in the cistern of al-Ḥākim in Shawwāl of the year 892 AH. May God pardon him.
