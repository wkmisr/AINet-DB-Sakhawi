translation:
  ja: ムハンマド・ブン・アリー・ブン・ハルド・ブン・アリー・ブン・ムーサー・ブン・アリー、アル＝バドル・アル＝クンバシー・アル＝ミスリー、マッカの寓居者で、バーブ・アッ＝サラームの証人（シャーヒド）。856年ズー・アル＝ヒッジャ月に、老耄したのちマッカで没した。
  en: Muḥammad b. ʿAlī b. Khald b. ʿAlī b. Mūsā b. ʿAlī, al-Badr al-Qunbashī al-Miṣrī, resident of Mecca and the notary-witness (shāhid) at Bāb al-Salām. He died in Mecca in Dhū al-Ḥijja 856, after having become senile.
