translation:
  ja: ウスマーン・ブン・アイユーブ・ブン・アフマド・ブン・アブドゥッラー・ブン・アッファーン・ブン・ラマダーン、ファイユーム出自、アル＝マッキー。その父はアッ＝サカティー（と呼ばれた）。847年サファル月に同地（マッカ）で没した。イブン・ファハドが彼の没年を記録している。
  en: ʿUthmān b. Ayyūb b. Aḥmad b. ʿAbd Allāh b. ʿAffān b. Ramaḍān, of Fayyūmī origin, al-Makkī; his father was al-Saqaṭī. He died there (in Mecca) in Safar 847. Ibn Fahd recorded his death date.
