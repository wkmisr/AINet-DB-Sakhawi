translation:
  ja: ハムザ・ブン・ジャール・アッラー・ブン・ハムザ・ブン・ラージフ・ブン・アビー・ヌマイ・アル＝ハサニー・アル＝マッキー。父の後を継いでアブー・ヌマイ家のシャリーフの長となり、その知性と寛大さで知られた。ヒジュラ暦816年のムハッラム月にマッカで没し、アル＝ムアッラー墓地に埋葬された。私の推測では40代後半（50歳の10年間の中）であった。これはアル＝ファースィーがマッカに関する著作の中で述べている。
  en: Ḥamza ibn Jār Allāh ibn Ḥamza ibn Rājiḥ ibn Abī Numayy al-Ḥasanī al-Makkī. He was the head of the sharifs of the Abū Numayy clan after his father, known for his intellect and generosity. He died in Muharram in the year 816 AH in Mecca, and was buried in al-Muʿallā. He was in his late forties, in my estimation. This was stated by al-Fāsī in his book on Mecca.
