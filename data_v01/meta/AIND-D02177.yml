translation:
  ja: バルウース・ブン・バスィール・アル＝ジュラシー。マディーナのラーフィダ（シーア）派フサイニ系アシュラーフ（高貴な家系）の一人。預言者の聖室に対して不敬を働き、そのランプなどを他の者たちと共に盗み出した。その結果、ヒジュラ暦861年、マディーナで絞首刑に処された。
  en: Barʿūth ibn Bathīr al-Jurashī, one of the Rafidite Husaynid nobles of Medina. He dared commit sacrilege against the Prophet's Chamber and stole some of its lamps along with others. Consequently, his end was that he was hanged in Medina in the year 861 AH.
