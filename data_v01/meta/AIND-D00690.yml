translation:
  ja: アフマド・ブン・フサイン・ブン・アリー・ブン・ムハンマド・ブン・アブドゥッラフマーン、アッ＝シハーブ、アル＝バドルの息子、アル＝アズライー、のちダマスカス住、シャーフィイー派。父は後出。本項は我らがシャイフ（イブン・ハジャル）の『ムウジャム』などによる。父と同じく「イブン・カーディー・アズリアート」として知られ、ダマスカスの代理判事（ナーイブ・アル＝フクム）であった。864年サファル月20日、日曜の夜に同地で死去し、翌日バーブ・トゥーマーの墓地に埋葬された。イブン・アッ＝ラブーディーが彼の没年を記録した。
  en: Aḥmad b. Ḥusayn b. ʿAlī b. Muḥammad b. ʿAbd al-Raḥmān al-Shihāb b. al-Badr al-Adhraʿī, then al-Dimashqī, al-Shāfiʿī. His father will be mentioned later. (This notice is drawn) from the muʿjam of our shaykh (Ibn Ḥajar) and other sources. He, like his father, was known as Ibn Qāḍī Adhruʿāt, the deputy judge (nāʾib al-ḥukm) in Damascus. He died there on the night of Sunday, the twentieth of Safar, in the year 864 H. He was buried the next day in the cemeteries of Bāb Tūmā. Ibn al-Labūdī recorded his death date.
