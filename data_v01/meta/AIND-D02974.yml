translation:
  ja: ダウラート・バーイ・アル＝アシュラフィー・バルスバーイ。十人アミールの一人。880年サファル月の末に急死した。通常通り出仕しようとしたところ、死んでいるのが発見された。スルタンが葬儀礼拝を執り行ったが、彼の悪行や醜行が取り沙汰されていたため、誰もその死を惜しまなかった。
  en: Dawlat Bay al-Ashrafi Barsbay, one of the amirs of tens. He died suddenly in late Safar, the year 880 AH. He went up to service as usual and was found dead. The Sultan performed the funeral prayer over him, and he was unmourned, as his bad deeds and evils were mentioned.
