translation:
  ja: アリー、ヌール・アッ＝ディーン・アブー・アル＝ハサン・アッ＝スナイキー、のちアル＝カーヒリー、アル＝アズハリー、アッ＝シャーフィイー。カイロに来てクルアーンを読み、アル＝マナーウィーらの講義に出席し、さらに同郷のアッ＝ザイン・ザカリーヤーと同伴して我らがシャイフ（イブン・ハジャル）から聴聞した。彼は（ザカリーヤーの）就任を見るまで生きたが、極度の貧困と盲目と隠棲にもかかわらず、彼から何の利益も得られなかった。（8）88年ラビーウ・アル＝アーヒル月9日の金曜の夜に没した。70歳近くであった。神の慈悲あれ。
  en: ʿAlī, Nūr al-Dīn Abū al-Ḥasan al-Sunaykī, then al-Qāhirī al-Azharī al-Shāfiʿī. He came to Cairo, read the Qurʾān and attended the lessons of al-Manāwī and others; moreover he heard from our shaykh (Ibn Ḥajar) as a companion of his fellow townsman al-Zayn Zakariyyā. He lived long enough to see the latter's appointment (to office), yet obtained nothing of substance from him, despite his extreme poverty, his blindness and his seclusion. He died on the eve of Friday, 9 Rabīʿ al-Ākhir (8)88, having nearly reached seventy. May God have mercy on him.
