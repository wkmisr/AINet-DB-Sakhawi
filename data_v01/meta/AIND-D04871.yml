translation:
  ja: ウスマーン・ブン・ムハンマド・ブン・アッ＝ザキー・アビー・バクル・ブン・アブドゥッラフマーン・アル＝ミスリー・アル＝カッバーニー・アル＝アッタール。アブー・バクルの子らイブラーヒーム、アフマド、アリー、ウマルの甥。商用で旅をする者の一人で、マッカで私（サハーウィー）から聴聞した。
  en: ʿUthmān b. Muḥammad b. al-Zakī Abī Bakr b. ʿAbd al-Raḥmān al-Miṣrī al-Qabbānī al-ʿAṭṭār, the nephew of Ibrāhīm, Aḥmad, ʿAlī and ʿUmar, the sons of Abū Bakr. He was among those who travel for trade, and he heard from me (al-Sakhāwī) in Mecca.
