notes:
- text: '見出しは「محمد الكمال أبو الفضل المطري أخو الذي قبله」。ナサブは直前項 #AIND-D09103（محمد بن محمد بن محمد بن عبد الرحمن … أبو الفتح بن المحب … المطري المدني الشافعي）と共通の父 #AIND-D08818 から補い、name_only は「محمد بن محمد بن عبد الرحمن」とした（祖父 عبد الرحمن は D08818 のナサブによる）。マズハブは家系（シャーフィイー派）から推定されるが原文に明記なし→未設定。'
  lang: ja
- text: 「وهو خاتمة الذكور من بيت المطري」— マトリー家最後の男子。
  lang: ja
translation:
  ja: ムハンマド、カマール〔・ッディーン〕・アブー・ル＝ファドル・アル＝マトリー。前項〔アブー・ル＝ファトフ〕の弟で、マーリク派カーディーのシャムス・ッディーン・アッ＝サハーウィーが娶ったウンム・クルスームの同母兄。二人の母はカーディー・アリー・アッ＝ザランディーの娘ハディージャ。父から『シャーフィイーのムスナド』の大部分を、タキー・イブン・ファフドほかから聴聞し、さらにアブー・ル＝ファラジュ・アル＝マラーギーのもとで読み、シハーブ・アル＝アブシーティーから法学とアラビア語学などを学び、父からアザーンを伝授された。866年ズー・ル＝ヒッジャ月21日の夜、巡礼からの帰路ムフリフで没し、遺体はマディーナに運ばれてバキーウに葬られた。40歳に達していなかった。彼はマトリー家最後の男子であった。神が彼を憐れみたまえ。娘ハディージャを残し、彼女は彼の死後ムヒッブ・イブン・アル＝カーディー・ハイル・ッディーン・アル＝マーリキーと結婚した。
  en: Muḥammad, al-Kamāl Abū al-Faḍl al-Maṭarī, brother of the preceding entry and full brother of Umm Kulthūm, whom the Mālikī judge Shams al-Dīn al-Sakhāwī married; their mother was Khadīja, daughter of the judge ʿAlī al-Zarandī. He heard most of the Musnad of al-Shāfiʿī from his father, and from al-Taqī Ibn Fahd and others; read to Abū al-Faraj al-Marāghī; took fiqh, Arabic and other subjects from al-Shihāb al-Abshīṭī; and received the call to prayer (adhān) from his father. He died on his return from the pilgrimage at Mufriḥ on the night of 21 Dhū al-Ḥijja 866, was brought to Medina and buried in al-Baqīʿ, not having reached forty. He was the last of the males of the Maṭarī house. He left a daughter, Khadīja, who after him married al-Muḥibb b. al-Qāḍī Khayr al-Dīn al-Mālikī.
