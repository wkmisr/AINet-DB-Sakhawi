translation:
  ja: アリー・ブン・ムハンマド・ブン・ガダンファル・ブン・ハスブッラー・ブン・ムファッリジュ・ブン・ウルフタ・ブン・マフムード・ブン・ムーサー、アッ＝シャリーフ・アル＝ハサニー・アル＝ウルフティー・アッ＝ザイディー、サルーアの領主。863年ラジャブ月にアル＝マッラで没し、マッカ管内のワーディー・マッルにある所領サルーアへ運ばれて、先祖のかたわらに葬られた。人々の崇敬を受ける人物であった。イブン・ファフドが彼に言及している。
  en: ʿAlī b. Muḥammad b. Ghaḍanfar b. Ḥasab Allāh b. Mufarrij b. ʿUrfuṭa b. Maḥmūd b. Mūsā, al-Sharīf al-Ḥasanī al-ʿUrfuṭī al-Zaydī, lord of Sarūʿa. He died in Rajab 863 at al-Marra and was carried to the estate of Sarūʿa in Wādī Marr, in the district of Mecca, where he was buried beside his forebears. He was revered (as a holy man). Ibn Fahd mentioned him.
