translation:
  ja: ジャンバク・アッ＝ザイニー・アル＝ムアイヤディー。 ムザッファル・アフマド（彼（ジャンバク）の師（保護者）の子息）の治世にハーッサキーとなり、アミール・アシャラ、次いでタブルハーナーとなったが、いずれもフシュカダムの時代であった。その後、ムジャッラドゥーン（遠征部隊）に加わってシャー・スワール討伐に赴いたが、病身となって帰還し、数ヶ月間床に伏した後、ヒジュラ暦874年ラジャブ月はじめに70歳近くで亡くなった。彼は賢明で穏やか、慎み深く、悪事とは無縁の人物であった。
  en: Jānbak al-Zaynī al-Muʾayyadī. He became a khāṣṣakī during the reign of al-Muẓaffar Aḥmad, son of his patron/master, and then became an amir of ten, and subsequently a ṭablkhānāh, both during the time of Khushqadam. Later, he traveled with the mujarradūn (expeditionary troops) against (Shāh) Suwār, from which campaign he returned ill. He was confined to bed for months and then died at the beginning of Rajab in 874 H, having nearly reached the age of seventy. He was a rational, calm, modest, and virtuous man.
