translation:
  ja: イーサー・ブン・ウスマーン・ブン・イーサー・ブン・ウスマーン・ブン・ムハンマド、アッ＝シャラフ・アル＝カーヒリー・アッ＝シャーフィイー。既述のアル＝ファフル・ムハンマド、アリー、アフマドの父で、イブン・ジャウシャンとして知られる。有徳の学者の一人で、教授し、読誦を教え、我らがシャイフ（イブン・ハジャル）に学んだ。（8）20年頃、あるいはその後に没した。アッラーが彼を憐れみたまわんことを。
  en: ʿĪsā b. ʿUthmān b. ʿĪsā b. ʿUthmān b. Muḥammad, al-Sharaf al-Qāhirī al-Shāfiʿī, father of the aforementioned al-Fakhr Muḥammad, ʿAlī and Aḥmad, known as Ibn Jawshan. He was one of the men of merit, among those who taught and gave instruction in recitation, and he studied under our shaykh (Ibn Ḥajar). He died around the year (8)20 or after it. May God have mercy on him.
