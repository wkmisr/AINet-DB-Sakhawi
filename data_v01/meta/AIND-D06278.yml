translation:
  ja: カーン・バルディー・アル＝アシュラフィー・カーイトバーイ、側近のハーズィンダール（宝庫係）の一人。897年のペスト流行の初期に没し、（主人は）そのことを悲しんだ。自身の墓廟に葬られた。伝えられるところでは、彼の遺産として約2万ディナールが見つかった。
  en: Qān Bardī al-Ashrafī Qāytbāy, one of the private khāzindārs (treasurers). He died at the beginning of the plague of the year 897, and (his master) grieved over it. He was buried in his own mausoleum, and, as was said, about twenty thousand dīnārs were found to belong to him.
