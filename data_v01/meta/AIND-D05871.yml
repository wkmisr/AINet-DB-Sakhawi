translation:
  ja: ウマル・ブン・アッ＝ザイン・アブド・アル＝アズィーズ・ブン・アブド・アル＝ワーヒド・ブン・ウマル・ブン・イヤーズ（ʿIyādh：ヤー、次いで点付きのザール）、アル＝アンサーリー、マグリブ系でマディーナ住のマーリキー派。前述のハサンの父。イブン・ザイン・アッ＝ディーンとして知られる。学識者を輩出した家の出である。学問に携わり、834年にアル＝ジャマール・アル＝カーザルーニーから、またアブー・アル＝ファトフ・アル＝マラーギーから聴聞した。858年またはその前年に没した。アッラーが彼に慈悲を垂れられんことを。
  en: ʿUmar b. al-Zayn ʿAbd al-ʿAzīz b. ʿAbd al-Wāḥid b. ʿUmar b. ʿIyādh (with yāʾ and then dotted dhāl), al-Anṣārī, of Maghribī origin, resident of Medina, Mālikī, the father of Ḥasan, mentioned previously, and known as Ibn Zayn al-Dīn, from a family of learned men. He studied and heard from al-Jamāl al-Kāzarūnī in the year 834 and from Abū al-Fatḥ al-Marāghī. He died in the year 858 or the year before. May God have mercy on him.
