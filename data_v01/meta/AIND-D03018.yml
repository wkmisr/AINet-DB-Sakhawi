translation:
  ja: ルマイサ・ブン・ムハンマド・ブン・アジュラーン・ブン・ルマイサ・ブン・アビー・ヌマイ・アル＝ハサニー・アル＝マッキー。彼はしばらくの間、マッカの首長（アミール）を務めたが、その統治（行状）が不評であったため解任された。その後、マッカから約8日間の距離にある場所で、バヌー・イブラーヒームらと交戦するために軍勢を率いて出陣することになった。そして837年ラジャブ月、東方の地における戦闘で戦死し、その地に埋葬された。
  en: Rumaytha b. Muḥammad b. ʿAjlān b. Rumaytha b. Abī Numayy al-Ḥasanī al-Makkī. He ruled as the emir of Mecca for a period, but because his conduct was not praised, he was deposed. He then set out with a detachment of soldiers to fight against the Banū Ibrāhīm (or others) at a distance of about eight days' journey from Mecca. He was killed in battle in Rajab 837 AH in the Eastern lands, and was buried there.
