    ja: 初版は4件すべてで person 位置に nisbah 番号 TMP-N-00496（=الطاوسي）を流用（カテゴリ不一致）。報告者「الطاوسي」＝AIND-D00900（أحمد بن عبد الله ... أبو الفتوح الطاوسي）と同定。決め手は D00900 本文が本項の主題を逐語で反復すること（「ولازم الثاني كثيرا في الكافيتين وشروحهما وشرح الشمسية في المنطق بل وبعض الكشاف」／「الثاني」＝الشهاب داود اللاري＝本項）。§D-1裁定(Waka 2026-08-18)で確定。なお初版の空 desc(type=field / ref=#TMP-S-00000)はID-Master未登録の幻番号のため4件とも破棄。
translation:
  ja: ダウード・シハーブ・アッ＝ディーン・アッ＝ラーリー。アッ＝ターウースィーは次のように語っている。「私は初期の段階で彼から、二つの『カーフィヤ』（『カーフィヤ』と『シャーフィヤ』）とその注釈書、クトゥブ・アッ＝ディーンによる『シャムスィヤ注釈』、および『カッシャーフ』の一部といった諸学問の入門書を学んだ。」彼は確かな学識を持つ学者たちから学問を修めた人物の一人であり、私（アッ＝ターウースィー）に何度もイジャーザ（学問の伝承許状）を与えてくれたが、その中には803年の数ヶ月の間に与えられたものもあった。
  en: 'Dāwūd Shihāb al-Dīn al-Lārī. Al-Ṭāwūsī said: "I learned from him in the beginning the introductory sciences, such as the two Kāfiyas and their commentaries, al-Quṭbī''s commentary on al-Shamsiyya, and some of al-Kashshāf, among other works." He was among those who studied under the verified scholars, and he granted me (al-Ṭāwūsī) an ijāza multiple times, including during the months of the year 803 AH.'
