translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラフマーン・ブン・イブラーヒーム、アル＝ムヒッブ・イブン・アル＝ブルハーン・イブン・アル＝ジャマール、アル＝マクディスィー、イブン・ジャマーア家。後述するイスマーイールとムハンマドの兄弟。彼は祖父とタキー・アル＝カルカシャンディーについて学び、聴聞した。相続法において傑出し、アル＝アクサー・モスクの説教者職の4分の1、サラヒーヤのマシヤハト・アッ＝タサウウフの半分などに就任した。彼はそこで私たち（サハーウィーの一行）と共に聴聞した者の一人である。889年ラマダーン月5日（土曜日の夜）に50歳を超えて亡くなった。
  en: Aḥmad b. Ibrāhīm b. ʿAbd Allāh b. Muḥammad b. ʿAbd al-Raḥmān b. Ibrāhīm al-Muḥibb Ibn al-Burhān Ibn al-Jamāl al-Maqdisī Ibn Jamāʿa, brother of Ismāʿīl and Muḥammad (forthcoming). He studied and heard (ḥadīth) from his grandfather and al-Taqī al-Qalqashandī. He excelled in inheritance law (al-farāʾiḍ) and was appointed to a quarter of the preaching office (khaṭāba) at al-Aqsa Mosque, half of the headship (mashyakhat al-taṣawwuf) at al-Ṣalāḥīya, and other positions. He was among those who heard (ḥadīth) with us (al-Sakhāwī) there. He died on the night of Saturday, the 5th of Ramadan in 889 AH, at an age exceeding fifty years.
