translation:
  ja: ウマル・ブン・アブド・アッ＝ラフマーン・ブン・アビー・バクル・ブン・アビー・バクル、アッ＝タキー・ブン・アル＝ワジーフ、アッ＝ザウカリー・アル＝ヤマーニー。アッ＝タキー・ブン・ファハドがその『ムウジャム』で彼に言及し、彼を「多芸なイマーム」、その父を「大学者（アッラーマ）」と評し、（没年などは）空欄のままにした。
  en: ʿUmar b. ʿAbd al-Raḥmān b. Abī Bakr b. Abī Bakr, al-Taqī b. al-Wajīh, al-Zawqarī al-Yamānī. Al-Taqī b. Fahd mentioned him in his Muʿjam, describing him as "the versatile imām" and his father as "the eminent scholar (al-ʿallāma)", and left the rest blank.
