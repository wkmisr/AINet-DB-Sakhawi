translation:
  ja: アブー・アッバース・アフマド・ブン・ムハンマド・ブン・ハサン・ブン・アリー・ブン・アブドゥッラヒーム・アル＝ラカーニー原産カイロ出身。マーリク学派の優れた学者の一人。両親は彼が青年期に達する直前、895年のラビーウッサーニー月に彼を亡くした。
