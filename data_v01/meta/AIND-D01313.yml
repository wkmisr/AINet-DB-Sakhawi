translation:
  ja: アブー・アッバース・アフマド・ブン・ムハンマド・ブン・ハサン・ブン・アリー・ブン・アブドゥッラヒーム・アル＝ラカーニー原産カイロ出身。マーリク学派の優れた学者の一人。両親は彼が青年期に達する直前、895年のラビーウッサーニー月に彼を亡くした。
  en: Abū al-ʿAbbās Aḥmad b. Muḥammad b. Ḥasan b. ʿAlī b. ʿAbd al-Raḥīm, originally from al-Laqānī and a resident of Cairo, was one of the eminent scholars of the Maliki school. His parents were bereaved of him (he died) when he was nearing adolescence in Rabīʿ al-Thānī of the year 895 AH.
