translation:
  ja: ヤフヤー・ブン・アッ＝シャイフ・アル＝アラー・アリー・ブン・ムハンマド・ブン・フサイン、ヒスン出自のアル＝カーヒリー、シャーフィイー派。父は既出。若者で、『ブハーリー』の冒頭の一部と『ウムダ』の全部を私（サハーウィー）に読み、アッ＝ディーミーらにも読んだ。少しは学んだと思う。父の諸職のことで奔走し、姉妹の夫アル＝ムフヤウィー・アン＝ナブラーウィーのことで、しばしば私のもとで不満を訴える。
  en: Yaḥyā b. al-Shaykh al-ʿAlāʾ ʿAlī b. Muḥammad b. Ḥusayn, of Ḥiṣnī origin, al-Qāhirī, the Shāfiʿī, whose father was mentioned earlier. A young man who read to me (al-Sakhāwī) a portion from the beginning of al-Bukhārī and the whole of the ʿUmda, and (read) to al-Daymī and others. I think he studied a little; he busied himself with his father's posts, and he often complains to me of his sister's husband, al-Muḥyawī al-Nabrāwī.
