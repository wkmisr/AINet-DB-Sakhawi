translation:
  ja: ウスマーン・ブン・アブドゥッラー、アル＝フィール（象）とラカブされる。エジプトで崇敬されていた者の一人。805年ジュマーダー・アル＝ウーラー月に没した。我らの師（イブン・ハジャル）が『インバー』でそう述べている。
  en: ʿUthmān b. ʿAbd Allāh, nicknamed al-Fīl (the Elephant), one of those who were held in veneration in Egypt. He died in Jumādā al-Ūlā 805. Our shaykh (Ibn Ḥajar) said so in his Inbāʾ.
