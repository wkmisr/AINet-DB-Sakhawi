translation:
  ja: タグリー・ビルディー・アッ＝ザーヒリー。スィーディー・サギール（小さなわが主人）として知られる。ハジュリー暦816年シャウワール月7日の月曜日の夜に殺害された。アル＝アイニーがこれを伝えている。彼は後述のクルクマスの兄弟であり、その伝記中にも彼への言及がある。タグリー・ビルディーはクルクマスよりも勇敢さと寛大さにおいて勝っていた。彼ら二人は、前述のドゥムルダーシュ・アル＝ムハンマディーの兄弟の息子たち（甥たち）である。
  en: Taghrī Birdī al-Ẓāhirī, also known as Sīdī Ṣaghīr. He was killed on the night of Monday, 7 Shawwāl 816 AH, according to al-ʿAynī. He is the brother of Qurqmās, who is mentioned below, and is referred to in that entry. Taghrī Birdī was greater than his brother in bravery and generosity, and both of them were the nephews (sons of the brother) of the aforementioned Demurdāsh al-Muḥammadī.
