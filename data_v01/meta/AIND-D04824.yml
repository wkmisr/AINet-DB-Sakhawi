translation:
  ja: ウバイド・アッ＝ディムヤーティー、アル＝ブルルスィーヤの夫、工房経営者（ムダウリブ）の一人。しばらくの間われわれの隣人であった（あるいは、われわれとともに〔マッカに〕ムジャーワラした）。〔8〕85年、巡礼からの帰途にクブール・アッ＝シュハダーで没した。
  en: 'ʿUbayd al-Dimyāṭī, husband of al-Burlusiyya and one of the mudawlibīn (workshop owners). He was our neighbour for a time (or: he resided [in Mecca] as a mujāwir together with us for a time). He died on his return from the ḥajj at Qubūr al-Shuhadāʾ in the year [8]85.'
