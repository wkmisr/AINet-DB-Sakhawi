translation:
  ja: フサイン・ブン・ウスマーン・アル＝ジャマール・アル＝ジャバルジールーウィー。ヒジュラ暦718年ラビー・アル＝アウワル月の朔日に生まれる。ヒジュラ暦827年にシーラーズにてアッ＝ターウースィーと会い、先達たちの一般的なイジャーザに彼を含めるようイジャーザを請われた。
  en: Ḥusayn b. ʿUthmān al-Jamāl al-Jabaljīlūy. Born on the first of Rabīʿ al-Awwal in the year 718 AH. Al-Ṭāwūsī met him in Shiraz in the year 827 AH and requested his ijāza to be included in the general ijāza of a group of predecessors.
