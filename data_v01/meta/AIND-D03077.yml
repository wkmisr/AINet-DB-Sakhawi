translation:
  ja: サアドゥッラー・アン＝ナートゥーリー、アブー・ハミード・アッ＝タクルーリー。敬虔な人物であり、アル＝ハーキム・モスクの門のそばに居住していた。856年アル＝ムハッラム月に没し、カーニム廟に埋葬された。イブン・アル＝ムニールがその没年を記録している。
  en: Saʿd Allāh al-Nātūlī, Abū Ḥamīd al-Takrūrī, the revered holy man who resided at the gate of al-Ḥākim Mosque. He died in al-Muharram, 856 AH, and was buried in the tomb of Qānim. His death was chronicled by Ibn al-Munīr.
