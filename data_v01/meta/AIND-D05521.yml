translation:
  ja: アリー・ブン・ムハンマド・ブン・ウマル・ブン・アリー・ブン・イブラーヒーム・アル＝マッキー、イブン・アル＝ワキールとして知られる。父はメッカの有力商人の一人で、現金・不動産の莫大な財産を遺したが、彼は成年に達すると不動産の大半を不相応な使途で失い、その後、母も没して不動産を遺したが、これも失った。806年頃に没し、アル＝マアラー（墓地）に葬られた。アル＝ファースィーが『マッカ史』で彼に言及している。
  en: ʿAlī b. Muḥammad b. ʿUmar b. ʿAlī b. Ibrāhīm al-Makkī, known as Ibn al-Wakīl. His father was one of the leading merchants of Mecca and left great wealth in cash and property; when ʿAlī came of age he squandered most of the property improperly, and when his mother later died leaving property as well, he squandered that too. He died around the year [80]6 and was buried at al-Muʿallā. Al-Fāsī mentioned him in (his history of) Mecca.
