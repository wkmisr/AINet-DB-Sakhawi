notes:
- text: 'ابن زائد 家（السنبسي、マッカ）: 兄弟 جار الله بن أحمد＝#AIND-D02331（838没）、الجمال محمد＝#AIND-D06636、عبد اللطيف＝#AIND-D04302、الزين عطية＝#AIND-D04906、姉妹 سعادة＝#AIND-D13226・عيناء＝#AIND-D13364、叔父 علي＝#AIND-D05100・عبد الله＝#AIND-D04436・سليمان＝#AIND-D03140、通称索引 #AIND-D12364。いずれも相手側が本項主を名指ししないため relation は立てず note（規則23。父が AIND なので共通の父から導出可）。#AIND-D13733「أم الحسين ابنة موسى بن زائد السنبسي المكي」（885没）はナサブ省略形のため本項主の娘と確定できない。初版の shuhrah「ابن الشهاب」は父のラカブ（「الشرف ابن الشهاب」）で通称ではないため除去。見出しの「محيى」を初版「محيي」から原文どおりに戻した。'
  lang: ja
  type: editorial
translation:
  ja: ムーサー・ブン・アフマド・ブン・ジャーラッラー・ブン・ザーイド・ブン・ヤフヤー・ブン・ムヒヤー・ブン・サーリム、アッ＝シャラフ・ブン・アッ＝シハーブ、アッ＝スンブスィー、イブン・ザーイドとして知られる。783年にマッカで生まれ、そこで育った。アン＝ナシャーワリー、イブン・ハーティム、アル＝マリージー、イブン・ファルフーン、イブン・スィッディーク、イブン・アル＝マイラク、アル＝マジュド・アル＝ルガウィー、アッ＝ダミーリーらが彼にイジャーザを与えた。彼は私（サハーウィー）にイジャーザを与えた。（8）62年ラジャブ月にマッカの外で没し、マッカへ運ばれて葬礼が行われ、アル＝マアラーに葬られた。
  en: Mūsā b. Aḥmad b. Jār Allāh b. Zāʾid b. Yaḥyā b. Muḥyā b. Sālim, al-Sharaf b. al-Shihāb, al-Sunbusī, known as Ibn Zāʾid. He was born in 783 in Mecca and grew up there. Al-Nashāwarī, Ibn Ḥātim, al-Malījī, Ibn Farḥūn, Ibn Ṣiddīq, Ibn al-Maylaq, al-Majd al-Lughawī, al-Damīrī and others granted him ijāza. He granted me (al-Sakhāwī) ijāza. He died in Rajab of the year [8]62 outside Mecca; he was carried to it, the funeral prayer was said over him, and he was buried at al-Muʿallā.
