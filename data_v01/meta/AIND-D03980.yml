translation:
  ja: アブドゥルアズィーズ・ブン・アリー・ブン・アブドゥルアズィーズ・ブン・アブドゥルカーフィー、アル＝ハワージャ・イッズ・アッ＝ディーン・アッ＝ダクーキー・アル＝マッキー。後述のアル＝ジャマール・ムハンマドの兄で、本項の人物の方が年長である。833年の疫病（ペスト）によりカイロで没した。これ以降、弟が名声と人望を得るようになった。
  en: ʿAbd al-ʿAzīz b. ʿAlī b. ʿAbd al-ʿAzīz b. ʿAbd al-Kāfī, al-Khawājā ʿIzz al-Dīn al-Daqūqī al-Makkī, the brother of al-Jamāl Muḥammad, who is mentioned below, and the elder of the two. He died in Cairo in the plague of the year 833 AH, after which his brother began to gain fame and acceptance.
