translation:
  ja: アブドゥルアズィーズ・ブン・ウスマーン・ブン・ムハンマド・ブン・アビー・ファーリス、アブー・アル＝ファワーリス、チュニスの君主の子で、アル＝マスウード・ムハンマドの兄弟（父と兄はいずれも後述）。本項の人物は二人のうちの年少者である。ベジャイアを統治し、880年より前（の時点）では存命であった。
  en: ʿAbd al-ʿAzīz b. ʿUthmān b. Muḥammad b. Abī Fāris, Abū al-Fawāris, son of the ruler of Tunis and brother of al-Masʿūd Muḥammad—both of whom are mentioned below—and the younger of the two. He governed Bijāya (Béjaïa) and was alive before the year [8]80.
