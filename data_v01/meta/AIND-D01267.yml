translation:
  ja: アフマド・ブン・ムハンマド・ブン・アフマド、通称アル＝シハーブ・アル＝アスナウィー、後にアル＝カーヒリー。アブド・アル＝カリームの兄弟であり、アル＝シャラフ・アル＝アンサーリーの母方の甥であり、また彼（アフマド）には姉妹がいた。846年またはその翌年（847年）に生まれ、クルアーンを暗記した。息子を母方の伯父アル＝シャラフ・アル＝アンサーリーの娘と結婚させ、商人として生計を立てた。
  en: Aḥmad b. Muḥammad b. Aḥmad, al-Shihāb al-Asnawī, then al-Qāhirī. He was the brother of ʿAbd al-Karīm, the maternal nephew of al-Sharaf al-Anṣārī, and had a sister. He was born in the year 846 H or the one after (847 H), memorized the Qur'an, married his son to the daughter of his maternal uncle al-Sharaf, and made a living through trade.
