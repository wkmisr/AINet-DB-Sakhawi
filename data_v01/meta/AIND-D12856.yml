translation:
  ja: アーミナ・ビント・イスマーイール・アル＝ハーズィン。「無名の女性たち」（ムブハマート）の部に出てくる。そこには、ワリー・ッディーン・アル＝アスユーティーやマッカのハティーブ、アブー・ル＝ファドルら何人かが彼女を娶ったことも記す。私は、彼女がスタイタと呼ばれる女性であると思う。もしそうであれば、彼女は（8）75年ジュマーダー第1月の半ば、金曜日に没している。
  en: Āmina, daughter of Ismāʿīl al-Khāzin. She will come among the unnamed women (al-mubhamāt), where it is also said that several men married her, among them al-Walawī al-Asyūṭī and Abū al-Faḍl, the khaṭīb of Mecca. I think she is the woman called Sutayta; if so, she died on Friday, in the middle of Jumādā I of the year [8]75.
