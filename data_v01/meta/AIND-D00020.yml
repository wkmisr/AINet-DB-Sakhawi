translation:
  ja: イブラーヒーム・ブン・アフマド・ブン・ハサン・ブン・アリー・ブン・ムハンマド・ブン・アブドゥッラフマーン・アル＝アズライー。元来アズラア出身で、イマーム・シハーブ・アッ＝ディーンの子孫の兄弟の一人であり、カマール・ムハンマドの同母兄弟である。彼はアズラアのザヒーリーヤ学院で『ブハーリー』の講義を聴聞し、軍事監督官のカマールと親密な関係にあった。彼とともにヒジュラ暦889年にハッジを行い、その翌年も（メッカに）滞在した。
  en: Ibrāhīm b. Aḥmad b. Ḥasan b. ʿAlī b. Muḥammad b. ʿAbd al-Raḥmān al-Adhraʿī, originally from Adhraʿ. He was one of the brothers from the family of Imam Shihāb al-Dīn and the full brother of al-Kamāl Muḥammad. He heard al-Bukhārī at al-Ẓāhiriyya (madrasa) in Adhraʿ and was closely associated with al-Kamāl Nāẓir al-Jaysh. He performed the Hajj with him in the year [8]89 (AH) and resided in Mecca the following year.
