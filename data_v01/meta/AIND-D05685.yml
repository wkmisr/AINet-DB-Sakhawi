translation:
  ja: アリー・ブン・ユースフ・ブン・イスマーイール・ブン・イブラーヒーム・ブン・アリー・ブン・グシュム・ブン・マフムード・ブン・ファハド・イブン・グシュム・ブン・アッターフ・ブン・マリク・ブン・グシュム、アル＝アラー、アル＝アーミリー、アル＝バアリー、アル＝ハナフィー。ヒジュラ暦761年ジュマーダー・アル＝ウーラー（第5月）にバアルベックで生まれた。同地で、アフマド・ブン・アブドゥルカリーム・アル＝バアリーから『サヒーフ・ムスリム』を聴聞した。これ（『サヒーフ・ムスリム』）は、ザイナブ・ビント・ウマル・ブン・キンディーがアル＝ムアイヤドから伝えたものである。また、アル＝ジャマール・ユースフ・ブン・ウマル・ブン・アフマド・ブン・アッ＝サッカーから、アブー・アル＝ファトフ・ムハンマド・ブン・アル＝ハーフィズ・アブドゥルガニーの著作『アル＝イサーバ・フィー・アッ＝ダアワート・アル＝ムスタジャーバ』を聴聞した。これについては、アブー・ハフス・ウマル・ブン・アブドゥルムンイム・ブン・ガディール・アル＝カッワースが、その著者から得た許可に基づき、彼に授権（イジャーザ）を与えていた。彼はハディースを伝承し、優れた学者たちが彼から聴聞した。没。
  en: ʿAlī b. Yūsuf b. Ismāʿīl b. Ibrāhīm b. ʿAlī b. Ghushm b. Maḥmūd b. Fahd b. Ghushm b. ʿAṭṭāf b. Malik b. Ghushm, al-ʿAlāʾ, al-ʿĀmirī, al-Baʿlī, al-Ḥanafī. He was born in Jumādā al-Ūlā, in the year 761 AH, in Baʿlabakk. He heard 'Ṣaḥīḥ Muslim' there from Aḥmad b. ʿAbd al-Karīm al-Baʿlī — which was transmitted to us by Zaynab bint ʿUmar b. Kindī from al-Muʾayyad. He also heard 'al-Iṣāba fī al-daʿawāt al-mustajāba' by Abū al-Fatḥ Muḥammad b. al-Ḥāfiẓ ʿAbd al-Ghanī from al-Jamāl Yūsuf b. ʿUmar b. Aḥmad b. al-Saqqā, via the authorization granted to him by Abū Ḥafṣ ʿUmar b. ʿAbd al-Munʿim b. Ghadīr al-Qawwās from its author. He transmitted hadith and prominent scholars heard from him. He died.
