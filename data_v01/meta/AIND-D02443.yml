translation:
  ja: ジャンマーズ・ブン・ヒバ・ブン・ジャンマーズ・ブン・マンスール・アル＝フサイニー。マディーナのアミール。812年、敵対者たちとの戦いで殺害された。マディーナの収入を接収して同地から退去していたが、猶予されることはなかった。サービト・ブン・ヌアイルとは異なり、スンナ派の人々への尊重と愛情を示していたにもかかわらず、である。
  en: Jammāz b. Hiba b. Jammāz b. Manṣūr al-Ḥusaynī, amir of Medina, was killed in a war between him and his enemies in the year 812 H. He had seized the revenues of Medina and withdrawn from it, but he was given no respite — even though, unlike Thābit b. Nuʿayr, he used to show honor and affection to the people of the Sunna.
