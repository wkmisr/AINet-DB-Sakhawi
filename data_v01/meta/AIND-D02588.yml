translation:
  ja: ハサン・ブン・アリー・ブン・ムハンマド・ブン・アブドゥルラフマーン・アル＝アズルイー、のちにアル＝サーリヒー。アズルアートのカーディー。イマームたるシハーブ・アフマドおよびアブドゥッラーの父であり、前述のフサインの兄弟。我らがシャイフ（イブン・ハジャル）から聴聞し、二人の間には親愛の情があった。それどころか、我らがシャイフ（イブン・ハジャル）は彼の詩を聴聞した。
  en: Ḥasan b. ʿAlī b. Muḥammad b. ʿAbd al-Raḥmān al-Adhruʿī, later al-Ṣāliḥī. The judge (qāḍī) of Adhruʿāt. He is the father of al-Shihāb Aḥmad, the Imam, and ʿAbd Allāh, and the brother of the aforementioned Ḥusayn. He heard from our shaykh (Ibn Ḥajar), and there was mutual affection between them; indeed, our shaykh heard some of his poetry.
