notes:
- text: 「قلت ومات بعد يسير فالله أعلم」＝850年のイジャーザ後まもなく没（年不明のため death 要素は立てない）。
  lang: ja
translation:
  ja: アリー・ブン・ムハンマド・ブン・アリー、アル＝アラー・アッ＝タルスースィー・アル＝ミッズィー。850年にイブラーヒーム・アル＝アジュルーニーが私（サハーウィー）のために彼からイジャーザを求めた。彼（イブラーヒーム）によれば、本人はイブン・ウマイラ、アッ＝ザイン・アル＝クラシー、イブン・ラジャブ（の講席）に出席したといい、また本人が「アッ＝ザイン・アル＝イラーキーが『ティルミズィー』の注釈で私の助力を求めて使いをよこした」と語るのを聞いたという。彼（イブラーヒーム）は言う、このアル＝アラーはアル＝ミッザのアル＝マルジャーニー・モスクの管財人（ナーズィル）であった。私（サハーウィー）は言う、彼はその後ほどなく没した。神がもっともよく知りたまう。
  en: 'ʿAlī b. Muḥammad b. ʿAlī, al-ʿAlāʾ al-Ṭarsūsī al-Mizzī. Ibrāhīm al-ʿAjlūnī obtained an ijāza from him on my behalf in the year 850, and said that he had attended (the sessions of) Ibn Umayla, al-Zayn al-Qurashī and Ibn Rajab, and that he heard him say: "al-Zayn al-ʿIrāqī sent to me seeking my help with the commentary on al-Tirmidhī." He (Ibrāhīm) said: this al-ʿAlāʾ was the supervisor (nāẓir) of the Marjānī Mosque at al-Mizza. I say: he died shortly afterwards, and God knows best.'
