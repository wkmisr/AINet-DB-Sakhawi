translation:
  ja: アフマド・アッ＝シハーブ・アル＝アッバーディー。アル＝アシュラフィーヤ（マドラサ）のスーフィーの一人。ヒジュラ暦891年ムハッラム月末に死去した。倹約家であったにもかかわらず、1000ディナール以上に達する遺産を残した。
  en: Aḥmad al-Shihāb al-ʿAbbādī. One of the Sufis of al-Ashrafiyya. He died in the last days of Muḥarram in the year 891 H. He left an estate amounting to a thousand dinars or more, despite his frugality.
