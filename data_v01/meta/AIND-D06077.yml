translation:
  ja: イーサー・ブン・アッバース・ブン・ウマル・アル＝マグリビー・アッ＝ティリムサーニー・アル＝ハーリディー、シャイフにして学識あり徳高く、謹厳で禁欲的な人物。（8）22年ジュマーダー・アル＝ウーラー月にマッカで没した。アル＝ジャマール・アル＝ムルシディーは言った、「彼のような道を歩む者で、謹厳さと敬神において彼に匹敵する者を私はほとんど見たことがない」と。イブン・ファハドが彼について記している。
  en: 'ʿĪsā b. ʿAbbās b. ʿUmar al-Maghribī al-Tilimsānī al-Khālidī, the shaykh, the learned, virtuous, scrupulous and ascetic. He died in Mecca in Jumādā al-Ūlā of the year (8)22. Al-Jamāl al-Murshidī said: "Rarely have I seen anyone of his way who was his equal in scrupulousness and piety." Ibn Fahd mentioned him.'
