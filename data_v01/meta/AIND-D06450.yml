translation:
  ja: ムバーラク・ブン・ワッハース・ブン・アリー・ブン・ユースフ・アル＝マッキー。アル＝ヤワースィファとして知られるカーイド（隊長）たちの名士の一人であった。サイイド・イナーン・ブン・ムガーミスのマッカ第2次統治期にそのもとで地位を得たが、晩年には為政者への奉仕から身を引いて禁欲と自足を表明し、［8］10年に没するまでそれを続けた。アル＝ファースィーも彼に言及している。
  en: Mubārak b. Wahhās b. ʿAlī b. Yūsuf al-Makkī. He was one of the notable qāʾids known as al-Yawāsifa, and attained standing with al-Sayyid ʿInān b. Mughāmis during the latter's second governorship of Mecca. Later in life he displayed renunciation of the service of the rulers and independence from them, and remained so until he died in the year [8]10. Al-Fāsī also mentioned him.
