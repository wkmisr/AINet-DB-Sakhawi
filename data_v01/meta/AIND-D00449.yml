translation:
  ja: アフマド・イブン・イブラーヒーム・イブン・マフムード・イブン・ハリール、シャイフ・ムワッファク・アッ＝ディーン・アブー・ザッル。ハーフィズであるアル＝ブルハーン・アブー・アル＝ワファー（＝スィブト・イブン・アル＝アジャミー）の息子。タラーブルス（シャーム）出身の家系で、ハラブ生まれ・ハラブ在住のシャーフィイー派。後述のアブー・バクルの父で、本人はクンヤでより知られる。 818AHサファル月9日金曜の夜にハラブで生まれ、そこで育った。クルアーンを暗記し、その朗誦を父から習得した。またアル＝ミンハージュ・アル＝ファルイーとアル＝ミンハージュ・アル＝アスリー、ハディースと文法に関する2つのアルフィーヤを父から学び、アラー・イブン・ハティーブ・アン＝ナーシリヤとその父の門下生の中でそれ以下の人々に提示した。また、二人のアラー（前述のイブン・ハティーブ・アン＝ナーシリヤと、アル＝アラー・イブン・マクトゥーム・アッ＝ラハビー）およびシャムス・アッ＝サラーミーからフィクフを学び、最後の人物からフィクフとアラビア語学で益を得た。その他、イブン・アル＝アアザーウィー、シャムス・アル＝マルティー、ザイン・アル＝ハラズィーらからもアラビア語学を学び、サダカからは韻律学を学んだ。ハディース学は父と我らがシャイフ（イブン・ハジャル）から聴聞し、彼らおよび故郷のシャイフたちや来訪者たちからも聴聞した。ハッジに向かう途中でシャーム（シリア）に入り、そこでイブン・ナーシル・アッ＝ディーン、イブン・アッ＝タッハーン、イブン・アル＝ファフル・アル＝ミスリー、アーイシャ・イブナト・イブン・アッ＝シャラーイヒーから聴聞したが、多くはなく、ほとんどの聴聞は父からであった。我らが友イブン・ファハドの求めにより、多くの人々が彼にイジャーザを与えた。 彼は若年期に文芸の諸分野に没頭し、そこで秀でて、韻文と散文で多くの著作をまとめたが、後に私に語ったところによると、それらの最後には破棄してしまったという。それらのうちには、 عروس الأفراح فيما يقال في الراح（酒について述べられた婚礼の宴）、عقد الدرر واللآل فيما يقال في السلسال（流れについて述べられた真珠と宝石の首飾り）、ستر الحال فيما قيل في الخال（頬のほくろについて述べられた状態の隠蔽）、الهلال
    المستنير في العذار المستدير（丸い頬ひげの輝く三日月）、البدر إذا استنار فيما قيل في العذار（頬ひげについて述べられた満月が輝くとき）などがある。また、彼はシャルト（法文書）にも精通し、イブン・ハティーブ・アン＝ナーシリヤの門前でトゥーキー（勅令）を記すほどに熟達したが、後にそれも手放した。ハディースとフィクフの研究に専念し、サヒーフ・アル＝ブハーリーの難解な部分や文法を独立させ、カルマーニー、ビルマーウィー、我らがシャイフ（イブン・ハジャル）らから要約した精緻な注釈書や、それよりも短い別の注釈書をまとめた。また、 التوضيح للأوهام الواقعة في الصحيح（サヒーフにおける誤謬の解明）、 مبهمات مسلم（ムスリムの難解語句）、 قرة العين في فضل الشيخين والصهرين والسبطين（二人のシャイフ、二人の婿、二人の孫の美徳における心の慰め）、未完のアル＝シファーとアル＝マサービーフの注釈、および歴史書（ ابن خطيب الناصريةの）への付録などがある。 彼は父の死後特に、二つのサヒーフとアル＝シファーを熱心に読み、その言語学、難解な語句、伝承者の校訂において卓越した。彼の知識から逸れるものは稀であった。我らがシャイフ（イブン・ハジャル）がハラブに滞在した際、彼はムワッファク・アッ＝ディーンに師事し、シャイフはその知性と機知に富んだ精神を喜び、彼を愛した。シャイフは彼の韻文について次のように書き記している。 %~% 瞳は眠たげに誘惑を秘めたままに %~% 細い茎はしなやかに、その身を揺らす %~% %~% 生ける水よ、香しき息吹よ %~% 我が喜びよ、そなたの青々とした頬ひげこそは希望 %~% 我らがシャイフはこの詩を次のように書き出した。「彼はムワリヤーの詩を好んで詠み、彼をイマーム・ムワッファク・アッ＝ディーンと称した。また別の時には、才能豊かな、博識で高貴な、そのクンヤに誠実な雄弁家であり、その同名を敬愛し、魂を捧げた人物であり、聡明さ、輝かしさ、そして喜悦において先人を凌駕する者である、と称した。アッラーがムスリムたちに彼の生存を享受させ、彼がハディースを教えることを許し、父がそうしたように彼にも益をもたらし、彼が望む現世と来世の善を授け給うことを願う。預言者ハディースの教授を許可するという彼の願いは達成され、その求めは実現した。我らがシャイフ、時代のハーフィズであるアブー・アル＝ファドルのアルフィーヤの注釈から彼が知っている、または学んだハディース学を朗誦すること、そして父のハーフィズ・ブルハーン・アッ＝ディーン（アッラーが彼を慈悲で覆い給わんことを）から得た知識、その他、読書や再学習で得たハディース学の諸分野を教えることを私は彼に許した。また、彼のもとで読誦されるハディースの意味に関するあらゆる書物を教え、彼自身が朗誦し、彼が聴聞したことについて知っていることを書き留めることを許可する。彼が預言者ハディースの集会において、私を良い祈りから忘れないことを願う」と。彼の言葉はここまでである。私はハラブで彼に会い、私の朗誦を聴聞し、私も彼の朗誦を聴聞した。さらに、以前に記したものとは別に、彼の詩を書き留めた。彼は私に対してさらに深い喜びを示し、言葉と書物で惜しみない賞賛を与えた。その後も彼の書簡は、愛情をもって絶えず私に届き、一部には私を「我らがシャイフ」と称する記述もあった。彼は高潔で勇敢、その地域で尊敬される人物であり、世俗から離れて質素に満足し、隠遁を好み、見知らぬ人々に謙虚で親しみやすく、寛大であった。想像力が豊かで、記憶力に優れ、特に記憶していることをすぐに思い出すことができた。父の蔵書を大切にし、他人に貸すことはほとんどなかった。故郷の人々がその蔵書への独占的な権利を妄想しないように、その機会を完全に断ち切っていた。時折、信頼できる人々にその書物を彼の前で披露することもあった。
    彼は父の門下生の一部からひどい嫌がらせを受け、不適切な言葉を浴びせられ、父の権利を尊重されなかった。しかし、それが彼の名声に影響を与えることはなかった。アル＝ビカーイーは、「彼は優れた記憶力と、言葉を美しく整え、洗練された方法で表現する強い能力を持ち、優れた知性と素早い応答、内なる思いを引き出す力があった。多くの難解な事柄や珍しいハディースについて議論した」と述べている。彼（アル＝ビカーイー）はまた、「私たち（ビカーイーと彼）の間には愛情と友情があった」とも述べている。彼はモワリヤーを詠むことに熱中し、そこで秀でて、多くの詩を彼（ビカーイー）に詠んで聞かせ、ビカーイーはその一部を引用している。別の箇所では、彼を「才能豊かな、多才な文人」と評している。彼はハディースの伝承と教授に尽力し、故郷の人々や訪れた多くの人々が彼から益を得た。父の存命中から古参の学者たちと共にイジャーザの求めに応じて署名するなど、積極的に活動した。 彼は884AHズー・アル＝カアダ月25日木曜に、軽度の錯乱状態に陥り人前から隠遁した後、死去し、父の隣に埋葬された。アル＝ビカーイーは、「彼は882AHの終わりに病気になったが、後に回復し、錯乱状態と失明を経験した。それは884AH半ばまで続いたが、その後回復し視力を取り戻した。そして死去した」と述べている。私は、「彼の後には、彼のような人物はいなかった。アッラーが彼と私を憐れみ給うように」と述べた。
  en: 'Aḥmad b. Ibrāhīm b. Maḥmūd b. Khalīl, the Shaykh Muwaffaq al-Dīn Abū Dharr, of Tripolitanian origin, then from Aleppo by birth and residence, a Shāfiʿī, father of Abū Bakr (mentioned later), and more famous by his kunya. He was born in Aleppo on the night of Friday, the ninth of Ṣafar, in the year 818 AH. He grew up there, memorized the Qurʾān, and perfected its recitation under his father. He studied al-Minhājayn al-Farʿī and al-Aṣlī, and the two Alfiyyas (of Ḥadīth and Naḥw) under his father. He presented his learning to al-ʿAlāʾ b. Khaṭīb al-Nāṣiriyya and those lesser than him among his father''s students. He studied fiqh under the two ʿAlāʾs — the aforementioned (Ibn Khaṭīb al-Nāṣiriyya) and Ibn Maktūm al-Raḥabī — and under al-Shams al-Salāmī, from whom he benefited in fiqh and Arabic. He also acquired Arabic from Ibn al-Aʿzāzī, al-Shams al-Malṭī, and al-Zayn al-Kharazī, among others, and prosody (al-ʿArūḍ) from Ṣadaqa. He learned ḥadīth sciences from his father and our shaykh
    (Ibn Ḥajar), and heard from them both and other shaykhs of his city and those who came to it. He entered Syria on his way to Hajj and heard there from Ibn Nāṣir al-Dīn, Ibn al-Ṭaḥḥān, Ibn al-Fakhr al-Miṣrī, and ʿĀʾisha bint Ibn al-Sharāʾiḥī, though he did not acquire much from them; most of his hearings were from his father. A group of scholars granted him ijāza at the request of our companion Ibn Fahd. In his youth, he engaged in literary arts, excelled in them, and compiled works in both poetry and prose, but he later destroyed them, as he told me at the end of his life. Among these works were ʿArūs al-Afrāḥ fīmā yuqāl fī al-Rāḥ (Bridal Feasts concerning what is said about Wine), ʿIqd al-Durar wa-l-Laʾāl fīmā yuqāl fī al-Silsāl (Necklace of Pearls and Jewels concerning what is said about Flowing Water), Sitr al-Ḥāl fīmā qīl fī al-Khāl (Covering the State concerning what is said about the Mole), al-Hilāl al-Mustanīr fī al-ʿAdhār al-Mustadīr (The Luminous Crescent concerning the Round
    Cheek-Whisker), and al-Badr idhā Istanār fīmā qīl fī al-ʿAdhār (The Full Moon when it Shines concerning the Cheek-Whisker). He also engaged in writing legal documents (shurūṭ) and excelled in them to the extent that he wrote decrees (tawqīʿ) at the gate of Ibn Khaṭīb al-Nāṣiriyya. However, he later abandoned this as well and devoted himself to the study of ḥadīth and fiqh. He isolated the ambiguous parts (mubhamāt) of al-Bukhārī, as well as its grammar (iʿrāb), and compiled a fine commentary on it, summarizing it from al-Kirmānī, al-Birmāwī, and our shaykh (Ibn Ḥajar), as well as another shorter commentary. He also authored al-Tawḍīḥ li-l-Awhām al-Wāqiʿa fī al-Ṣaḥīḥ, Mubhamāt Muslim, Qurrat al-ʿAyn fī Faḍl al-Shaykhayn wa-l-Ṣihrayn wa-l-Sibṭayn, an incomplete commentary on al-Shifāʾ and al-Maṣābīḥ, and an appendix to Taʾrīkh Ibn Khaṭīb al-Nāṣiriyya, among other works. He continuously recited the two Ṣaḥīḥs and al-Shifāʾ, especially after his father''s death, and became advanced in their
    linguistic aspects, ambiguous points, and the authentication of their narrators, with hardly anything escaping his knowledge. When our shaykh (Ibn Ḥajar) was in Aleppo, he frequented Muwaffaq al-Dīn, and our shaykh was greatly pleased with him and loved him for his intelligence and lighthearted spirit, to the extent that he wrote about him in poetry: %~% Her gaze is languid, captivating, with seductive drowsy eyes %~% A slender spear, fresh and graceful, sways her body %~% %~% Your saliva is the water of life, O fragrant breath %~% Your green cheek-beard is my adornment, and you are my hope %~% My shaykh prefaced his writing of this by saying: “He was fond of composing mawāliyā poetry, and he described him as the Imām Muwaffaq al-Dīn.” Another time, he described him as “the brilliant, versatile, original, and dazzling litterateur, whose kunya matched his sincerity in expression, the expert who conversed with his namesake and sacrificed his soul for him, the last who surpassed the first
    in insight, freshness, and delight. May Allah grant the Muslims enjoyment of his continued existence, and permit him to teach ḥadīth, and benefit through him as He benefited through his father, and grant him the best of this world and the hereafter as he desires regarding permission to teach prophetic ḥadīth. His wish has been fulfilled, and his request granted. I have permitted him to teach ḥadīth sciences that he knows and has learned from the commentary on al-Alfiyya by our shaykh, the ḥāfiẓ of the age Abū al-Faḍl (Ibn Ḥajar), and from the benefits he acquired from his father, the ḥāfiẓ Burhān al-Dīn (may Allah cover him with His mercy), and from other sources he acquired through reading and benefited from reviewing, as well as other sciences of ḥadīth beyond the aforementioned commentary. He is permitted to teach any book on the meanings of ḥadīth that is read before him, and to record what he learns from it when he reads it or hears it. I ask him not to forget me in his righteous
    supplications in the gatherings of prophetic ḥadīth.” This is the end of his statement. I met him in Aleppo, and he listened to my recitation, and I listened to his recitation. Indeed, I wrote down some of his poetry, other than what has been mentioned, which I recorded elsewhere. His appreciation for me increased, and he exaggerated his praise both verbally and in writing. His letters thereafter continuously reached me, driven by affection, and some contained the description of “our shaykh.” He was a good, noble, and respected person in his region, isolated from worldly people, content with little, fond of seclusion, very humble and friendly towards strangers, and generous to them. He was intensely imaginative, free from affectation, possessed of complete virtue, excessive intelligence, and excellent recall, especially of what he had memorized. He was keen to preserve his father''s books, rarely allowing anyone access to them. He completely cut off such access to everyone, so that some
    people of his town would not imagine special access to them. Sometimes, he would show them to trustworthy individuals in his presence. He suffered additional harm from some of his father''s students, who spoke inappropriately about him and did not respect his father''s legacy. However, this did not affect his standing. Al-Biqāʿī stated, “He possessed a great memory and a strong faculty for embellishing speech and delivering it in an elegant manner, along with sharp intellect, quick wit, and the ability to extract what was in his mind. He discussed many ambiguous matters and rare ḥadīth.” He also said, “There was affection and friendship between us.” He became engrossed in composing various poetic forms until he excelled in mawāliyā, reciting many of his compositions to me and quoting some. Elsewhere, he described him as “the brilliant and versatile litterateur.” He dedicated himself to transmitting and teaching ḥadīth, and many people from his city and those who visited benefited from
    him. He even wrote with older scholars in requests for ijāza during his father''s lifetime and thereafter. He died on Thursday, the twenty-fifth of Dhū al-Qaʿda, in the year 884 AH, after experiencing some mental confusion and seclusion from people, and was buried next to his father. Al-Biqāʿī said that he fell ill at the end of 882 AH, then recovered, but experienced mental confusion and lost his sight. This continued until mid-884 AH, after which he recovered his sight and then died. I (al-Sakhāwī) said, “No one like him remained after him there. May Allah have mercy on him and us.”'
