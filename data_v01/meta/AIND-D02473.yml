translation:
  ja: ジーラク、あるいはミーラク・アル＝カーシミー。名の頭にファーの字が付されることもある。大アミールの一人で、諸州の職を歴任し、その中にはガザ総督（ナーイブ）職もあった。821年ジュマーダー・アル＝ウーラー月にダマスカスで没した。我らがシャイフ（イブン・ハジャル）が『インバー・アル＝グムル』の中で彼に言及している。
  en: Jīrak, or Mīrak, al-Qāsimī — and sometimes a fāʾ is prefixed to the name. He was one of the great amirs, and moved through various governorships, among them the governorship (niyāba) of Gaza. He died in Damascus in Jumādā al-Ūlā of the year 821 H. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ al-Ghumr.
