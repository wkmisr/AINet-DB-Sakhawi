translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・ムハンマド・ブン・スライマーン・ブン・アター・ブン・ジャミール・ブン・ファドル・ブン・ハイル・ブン・アン＝ヌウマーン、アル＝ファフル・ブン・アル＝カマール・アル＝アンサーリー・アッ＝サカンダリー・アル＝マーリキー。エジプトのカーディー、アル＝ジャマール・アブドゥッラフマーンの甥（兄弟の子）で、父は前述。先祖と同じくイブン・ハイルとして知られる。768年ズー・アル＝ヒッジャ月に生まれ、840年ラジャブ月21日金曜日に没した。アル＝ビカーイーが名のみ挙げている。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad b. Muḥammad b. Sulaymān b. ʿAṭāʾ b. Jamīl b. Faḍl b. Khayr b. al-Nuʿmān, al-Fakhr b. al-Kamāl al-Anṣārī al-Sakandarī al-Mālikī, nephew of al-Jamāl ʿAbd al-Raḥmān, qāḍī of Egypt; his father was mentioned above. Like his forebears he was known as Ibn Khayr. He was born in Dhū al-Ḥijja 768 and died on Friday 21 Rajab [8]40. Al-Biqāʿī mentioned him without detail.
