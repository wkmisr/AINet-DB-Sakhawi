translation:
  ja: アリー・ブン・ムハンマド・ブン・サーリム・アル＝ハーミー、アル＝ガムリー（・モスク）のムアッズィン。「アサル・ナフル（蜂蜜）」として知られる。895年に私（サハーウィー）から聴聞した者の一人で、集団礼拝への熱意があった。
  en: ʿAlī b. Muḥammad b. Sālim al-Khāmī, the muezzin at al-Ghamrī (mosque), known as ʿAsal Naḥl ("honey of bees"). He was among those who heard from me (al-Sakhāwī) in the year 895, and he was keen on the congregational prayer.
