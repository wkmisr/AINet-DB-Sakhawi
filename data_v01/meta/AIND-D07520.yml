  en: Muḥammad b. ʿAbd al-Bāsiṭ b. Khalīl, of Damascene origin, al-Qāhirī. His father has been mentioned above, and his brother Abū Bakr will be mentioned below. He died of the plague in Ṣafar 853, aged roughly twenty.
