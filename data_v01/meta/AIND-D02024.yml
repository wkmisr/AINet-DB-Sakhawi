translation:
  ja: アクバーイ・アッ＝ザーヒリー・フシュカダム。アル＝アクナスとして知られる。ザイニー・アル＝ウスタダール（ザイン・ヤフヤー・イブン・アブドゥッラッザーク・アル＝クブティー、#AIND-D10263）のマムルークたちを殺害したため、ヒジュラ暦878年ズー・アル＝ヒッジャ月にラムラで（腰から切断する刑により）処刑された。スルタンは彼と彼の仲間からの千ディナールの血の賠償金の支払いを、彼の甚だしい悪行とムスリムへの害悪を理由に拒否した。
  en: 'Aqbāy al-Ẓāhirī Khushqadam, known as al-Aqnaṣ. He was executed (wusiṭa) in al-Ramla in Dhū al-Ḥijja of the year 878 H for killing the mamluks of al-Zaynī al-Ustādār (al-Zayn Yaḥyā b. ʿAbd al-Razzāq al-Qibṭī, #AIND-D10263). The Sultan did not accept from him and his companions the payment of a thousand dinars to those entitled to blood money, due to his great wickedness and the harm caused to Muslims by him.'
