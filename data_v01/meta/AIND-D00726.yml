translation:
  ja: アフマド・ブン・ダラーマ・アル＝ハワージャ、シャハーブ、アル＝バスリー、その後、アル＝ディマシュキー。 ダマスクスのサーリヒーヤにマドラサを創建した。ヒジュラ暦853年ムハッラム月18日に亡くなったが、その日の午後には葬られた。彼に神の慈悲があらんことを。
  en: Aḥmad b. Dalāma al-Khawājā, al-Shihāb, al-Baṣrī, then al-Dimashqī. He founded a madrasa in Ṣāliḥiyya, Dimashq. He died on the 18th of Muḥarram in the year 853 AH. He was buried after the afternoon prayer on the same day. May God have mercy on him.
