translation:
  ja: 228 アフマド・ブン・ムハンマド・ブン・アフマド・ブン・アル＝ジャマール・アブドゥッラー、アル＝ガムリー、そしてカイロ出身で、先祖同様にイブン・アル＝マッダーフとして知られるシャフィイー派の人物。クルアーンと書物を暗記し、私も含む多くのシャイフたちの前でそれらを提示し、また私から聴聞した。彼は賢明で聡明な人物で、896年まで成人していなかった。
  en: 228 Aḥmad b. Muḥammad b. Aḥmad b. al-Jamāl ʿAbd Allāh al-Ghamrī, then al-Qāhirī, al-Shāfiʿī, known like his ancestors as Ibn al-Maddāḥ. He memorized the Qur'an and presented books to me among a group of shaykhs, and he heard from me. He is astute and intelligent. As of the year 896 H, he had not yet reached adulthood.
