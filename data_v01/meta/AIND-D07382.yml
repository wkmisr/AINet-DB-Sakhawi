translation:
  ja: ムハンマド・ブン・アル＝アミール・ドゥクマーク、ナースィル・アッ＝ディーン。その父は前述。アル＝アシュラフ・バルスバーイは彼をハラブ（アレッポ）から呼び寄せたうえで、アル＝マルカブのナーイブ（副王）に任じ、タラーブルス（トリポリ）でタブルハーナのアミール職を授け、前述のとおり彼がその父〔ドゥクマーク〕の子であるがゆえに極めて厚遇した。彼はしばらくアル＝マルカブに留まったが、のちに解任され、カイロで十人隊のアミール職を授けられた。そして833年の疫病で没するまで同地に留まった。容姿端麗で、弓射の第一人者であった。
  en: Muḥammad b. al-Amīr Duqmāq, Nāṣir al-Dīn; his father has been mentioned above. Al-Ashraf Barsbāy appointed him nāʾib of al-Marqab and granted him an amirate of ṭablkhānāh in Tripoli after summoning him from Aleppo, and treated him with great honour because of his connection to his father, as mentioned earlier. He remained in al-Marqab for a time, then was dismissed and granted an amirate of ten in Cairo, where he stayed until he died in the plague of the year 833. He was handsome in appearance and a leading archer.
