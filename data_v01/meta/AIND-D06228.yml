translation:
  ja: カースィム・ブン・アル＝ハワージャ・シャイフ・アリー・ブン・ムハンマド・ブン・アブドゥルカリーム、アル＝キーラーニー。820年に預言者の町マディーナで生まれ、その年のうちにマッカへ移って定住した。852年にインド地方のカンバーヤへ旅立ったが、海上で行方不明となった。イブン・ファハドが彼に言及している。
  en: Qāsim b. al-Khawājā Shaykh ʿAlī b. Muḥammad b. ʿAbd al-Karīm al-Kīlānī. He was born in 820 in Medina and moved to Mecca in the course of that year, settling there. In 852 he travelled to Cambay (Kanbāya) in India and was lost at sea. Ibn Fahd mentioned him.
