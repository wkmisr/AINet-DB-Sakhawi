translation:
  ja: アブドゥルラフマーン・ブン・アブドゥルワッハーブ・ブン・アッ＝ザイン。ルッダ（リッダ）に出自を持ち、ガザを本拠とする。ガザの軍事監督官（ナージル・アル＝ジャイシュ）であり、むしろその最高実力者であった。先に言及されたサアド・アッ＝ディーン・イブラーヒームの兄弟であり、莫大な富を有する者として知られた。ガザにて、70歳を越えたところで突如、882年シャアバーン月末（最終日）の金曜日の夜に急死した。スルタンよりそこ（ガザ）に自身のためのマドラサ（学校）を建設するよう命じられていたが、その完成前に死去したため、先に言及された息子のイブラーヒームがその完成を引き受けた。
  en: Abd al-Rahman bin Abd al-Wahhab bin al-Zayn, of Lydda origin and Ghazza home, the inspector of the army (nazir al-jaysh) of Gaza, or rather its chief magnate, and the brother of the aforementioned Sa'd al-Din Ibrahim. He was known for his vast wealth. He died suddenly in Gaza after passing his seventies, on the night of Friday, at the end of Sha'ban in the year 882 AH, before completing the school (madrasa) which the Sultan had ordered him to build for him there. His aforementioned son, Ibrahim, undertook to complete it.
