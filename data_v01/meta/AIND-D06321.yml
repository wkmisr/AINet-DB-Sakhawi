translation:
  ja: カラー・タンバク。エジプト（ディヤール・ミスリーヤ）におけるタブラハーナのアミールの一人であり、ハージブ（侍従）の一人。813年シャウワール月に没した。ハッジ（巡礼）隊の指揮官に内定していたが、出発する前に没した。我らがシャイフ（イブン・ハジャル）が『インバー』において彼に言及しており、アル＝アイニーも言及している。
  en: Qarā Tanbak, one of the amirs of ṭablkhānāh and one of the chamberlains (ḥujjāb) in the Egyptian lands. He died in Shawwāl of the year 813. He had been designated as commander of the pilgrimage (amīr al-ḥajj), but died before setting out. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ, as did al-ʿAynī.
