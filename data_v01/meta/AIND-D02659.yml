translation:
  ja: ハサン・ブン・カルキーラ、バドル・アッディーン、アル＝フサイニー（フサイニーヤ地区の居住による）、ハナフィー派。アル＝バドル・アル＝アイニーに学び、彼のマドラサのイマームに任命された。またアル＝ジャマール・アブドゥッラー・ブン・アッ＝ルーミーのもとで読誦し、彼の没後にジャーミウ・アッ＝ザーヒルでのハナフィー派法学教授職に就いた。アル＝バルクーキーヤで代理として先導（イマーム）を務め、証人（公証人）として生計を立てた。アッ＝シャムス・ブン・ハリールが彼の娘と結婚したが、彼らの間にはいさかいがあった。860年頃に没した。
  en: Ḥasan b. Qalqīla, Badr al-Dīn, al-Ḥusaynī by residence, the Hanafi. He studied under al-Badr al-ʿAynī, who appointed him as the Imam of his madrasa. He also read under al-Jamāl ʿAbd Allāh b. al-Rūmī, and succeeded him in teaching Hanafi law at Jāmiʿ al-Ẓāhir. He served as a deputy Imam at al-Barqūqiyya, and earned his living as a notary witness. al-Shams b. Khalīl married his daughter, and there were disputes between them. He died around 860 AH.
