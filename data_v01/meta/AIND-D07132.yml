notes:
- text: '転送見出し（原文末尾「في ابن محمد بن علي بن إسماعيل」＝「محمد بن علي بن إسماعيل の息子（の見出し）に」）。転送先は #AIND-D07982「محمد بن علي بن أحمد بن إسمعيل أبو الفتح القاهري الأزهري الشافعي نزيل طيبة ويعرف بأبي الفتح بن إسمعيل وهو بكنيته أشهر وربما قيل له ابن الريس」（820年過ぎ生、未収録）。ナサブに أحمد が1段入るが（規則38）、同書の転送見出し #AIND-D08035「محمد بن علي بن إسمعيل أبو الفتح بن الريس . مضى فيمن جده أحمد بن إسمعيل قريبا」が「محمد بن علي بن إسمعيل أبو الفتح」＝D07982 であることを裏付ける。通称「أبو الفتح بن إسمعيل」とニスバ الأزهري が一致。corpus に他の該当見出しなし。'
