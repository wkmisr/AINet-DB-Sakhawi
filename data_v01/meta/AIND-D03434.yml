translation:
  ja: トゥーフ・アル＝ハーズィンダール・アッ＝ザーヒリー・バルクーク。彼はバルクークの（購入した）マムルークおよび近臣（ハースィキーヤ）の一人であった。その後、バルクークの息子の時代に昇進し、彼から大ハーズィンダール（大蔵相）に任命され、彼に言葉がよく通じたため、その国家の重臣の一人となった。ヒジュラ暦812年ジュマーダー・アル＝アーヒラ（第6月）の末にカイロで死去した。彼の優れた人柄、理知、そして勇敢さゆえに、その死は大いに惜しまれた。アル＝アイニーは次のように述べている。『ハーズィンダール（トゥーフ）はエジプト地方の将軍（ムカッダム）の一人であり、アミール・マジュリス（評議会アミール）であった。』
  en: 'Ṭūkh al-Khāzindār al-Ẓāhirī Barqūq. He was one of his (Barqūq''s) mamluks and private retinue (khāṣṣakiyya), then advanced during the reign of his son, who appointed him to the Grand Treasurership (al-Khāzindāriyya al-Kubrā). He became one of the prominent figures of his state due to his influential word with him. He died in Cairo at the end of Jumādā al-Ākhira in the year 812 AH, and was widely lamented for his good conduct, intellect, and bravery. Al-ʿAynī said: ''The Khāzindār was one of the commanders (muqaddimūn) in the Egyptian lands and Amīr Majlis.'''
