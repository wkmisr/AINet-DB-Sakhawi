translation:
  ja: アフマド・ブン・イブラーヒーム・ブン・イーサー・アッ＝シャハーブ・ブン・アル＝ブルハーン・アル＝クラシー。イブン・アル＝ブルハーンとして知られる。アル＝クサイルやダマスクスの支配下にある他の地のカーディー（裁判官）を務めた後、何度かサファドのカーディーを務め、ヒジュラ暦819年ラジャブ月13日の金曜日に同地で亡くなった。その時彼は80歳に近づいていた。イブン・カーディー・シュフバは言った。「彼の法学に関する知識は少なかった。彼はヒジュラ暦826年、ダマスクスでの裁判の席に私のもとへ出頭したが、私自身それ（法学知識の乏しさ）を彼に見て取った」。他の者が付け加えたことには、彼は多くの人から学んだ。彼の父もまたカーディーであった。
  en: 'Aḥmad b. Ibrāhīm b. ʿĪsā al-Shihāb b. al-Burhān al-Qurashī, known as Ibn al-Burhān. He served as qāḍī (judge) of al-Quṣayr and other places in the province of Damascus, then as qāḍī of Ṣafad several times. He died there on Friday, the 13th of Rajab, in the year 819 H, having approached eighty years of age. Ibn Qāḍī Shuhba said: "His knowledge of fiqh was meager. He attended my judicial session in Damascus in the year 826 H, and I observed this from him." Others added that he heard from many people. His father was also a qāḍī.'
