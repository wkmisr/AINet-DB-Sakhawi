translation:
  ja: サラーフ・ブン・ムハンマド・ブン・アリー・アル＝ハサニー・アッ＝ザイディー・アッ＝ターイー・アッ＝サアディー。サナアの支配者。我らがシャイフ（イブン・ハジャル）の『インバー・アル＝ゴムル』の840年頃の出来事に彼に関する言及がある。また、私は別の箇所に自筆で『サラーフ・ブン・アリー・ブン・ムハンマド・ブン・アビル＝カースィム・アッ＝ザイディー』と書かれているのを見た。アッ＝ナースィル・サラーフ・アッ＝ディーン・ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・アリー・サナア支配者の死後、ザイド派はサラーフをサナアの支配者とすることに合意し、彼に『アル＝マフディー』のラカブ（尊称）を授けた。それは840年の初めのことであった。
  en: 'Ṣalāḥ b. Muḥammad b. ʿAlī al-Ḥasanī al-Zaydī al-Ṭāʾī al-Ṣaʿdī, the ruler of Sanaa. He is mentioned shortly after the year 840 AH in the historical events of our shaykh''s (Ibn Ḥajar) 『Inbāʾ al-Ghumr』. I read in my own handwriting in another place: ''Ṣalāḥ b. ʿAlī b. Muḥammad b. Abī al-Qāsim al-Zaydī.'' The Zaydīs united around him to rule Sanaa after the death of al-Nāṣir Ṣalāḥ al-Dīn Muḥammad b. ʿAlī b. Muḥammad b. ʿAlī b. Muḥammad b. ʿAlī, the ruler of Sanaa, and they gave him the title of al-Mahdī. This occurred in the early part of the year 840 AH.'
