translation:
  ja: アブドゥルアズィーム・ブン・ディルハム・ワ・ニスフ。工房（ダワーリーブ）などで財を築いたコプトの資産家の一人。度重なる侮辱を受けたのち、879年ラビーウ・アル＝アウワル月に没した。男系相続人（アースィブ）がいたにもかかわらず、その貯蔵品や不動産は差し押さえられた。
  en: ʿAbd al-ʿAẓīm b. Dirham wa-Niṣf, one of the wealthy Copts who made their money from workshops (dawālīb) and the like. He died in Rabīʿ I 879 AH after being humiliated time and again, and his stores and properties were sequestered despite the presence of an agnatic heir.
