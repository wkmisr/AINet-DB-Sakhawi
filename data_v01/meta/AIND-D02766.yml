translation:
  ja: フサイン・アル＝ムキッル。イブン・アル＝ジャザリーから学んだ。クラーアート（クルアーン朗誦学）、ナフウ（文法学）、サルフ（形態論）に関する著作を執筆した。850年を少し過ぎた頃に没した。彼から学んだ者の一部が私（サハーウィー）にそのように語った。
  en: Ḥusayn al-Mukill. He studied under Ibn al-Jazarī and composed works on al-Qirāʾāt (Qur'anic recitations), al-Naḥw (grammar), and al-Ṣarf (morphology). He died shortly after 850 AH, as was told to me by some of those who studied under him.
