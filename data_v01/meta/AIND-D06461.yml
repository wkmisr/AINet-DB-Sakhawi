translation:
  ja: ムフスィン・アル＝ファトヒー（アブー・アル＝ファトフ・アル＝ムヌーフィーの従者）、のちアル＝アシュラフィー・カーイトバーイ（アル＝アシュラフ・カーイトバーイの従者）、宦官、アル＝ハバシー。彼はスンブルの後任として財庫官（ハーズィン）に任じられた。
  en: Muḥsin al-Fatḥī [of] Abū al-Fatḥ al-Munūfī, then al-Ashrafī [of al-Ashraf] Qāytbāy, the eunuch, al-Ḥabashī. He was appointed treasurer (khāzin) in place of Sunbul.
