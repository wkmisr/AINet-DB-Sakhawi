- id: r4
  type: social
  subtype: predecessor
  active: AIND-D06461#p3
  passive: AIND-D06461
  quote: null
  note:
    ja: '「استقر به خازنا عوض سنبل」＝前任者（規則29、predecessor）。候補 #AIND-D03188「سنبل الأشرفي الطواشي ويقال له سنبل الصغير للتمييز عن آخر أكبر منه . كان خازندار أستاذه ومن المبجلين المقربين ممن حج في خدمة خوند ثم غضب عليه لبعض الأسباب وسلمه لشيخ عرب هوارة وسندت بالهند وسواكن وغيرهما كعدن وهرموز بعد」（B159 で校閲中）: 名＋職（خازندار／خازن）＋主人ニスバ الأشرفي が合い、主人の怒りで更迭された経緯が「عوض سنبل」と整合する。しかし同本文が「同名でより年長の別の سنبل」の存在を明記し、D03188 の主人「الأشرفي」も قايتباي と確定しない（B159 ISSUES §D159-9 は patron を #NEEDID とした）ため、規則26・61(f) により #NEEDID のまま候補を本注と ISSUES §D161-6 に記す。初版も #NEEDID。【集約 2026-11-08】候補の補足（内容B の §D161-6 解決案、原文で確認）: 第2候補「البدر محمد بن العز محمد」の子の項 #AIND-D10539「يوسف بن محمد بن محمد الجمال بن البدر أبي الفتح المنوفي … الماضي أبوه كاتب المماليك ويعرف بابن أبي الفتح المنوفي」がある（父の本伝の見出しは未特定）。第1候補 D11039 には転送見出し #AIND-D01035「أحمد بن علي بن علي بن عيسى فتح الدين أبو الفتح المنوفي … يأتي في الكنى」もある。候補が2人であることは変わらず #NEEDID を維持（規則26・61(c)、自己裁定）。'
