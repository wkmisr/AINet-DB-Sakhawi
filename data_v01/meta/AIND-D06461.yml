    ja: '主人ニスバ「الفتحي أبي الفتح المنوفي」＝最初の主人（規則51、patron）。「أبو الفتح المنوفي」はサハーウィーの同時代に2人いる: (1) #AIND-D11039「أبو الفتح المنوفي هو أحمد بن علي بن علي بن عيسى القلعي الشافعي … ناب في القضاء بل سافر قاضي المحمل غير مرة … مات في جمادى الثانية سنة تسع وثمانين」（クンヤ索引で第一に挙がる人物）、(2) クンヤ索引の転送見出し「أبو الفتح المنوفي آخر نائب جدة هو البدر محمد بن العز محمد」（corpus 122735行、AIND 番号なし。886〜894年頃ジッダの صرف を担った官人、47104行）。いずれも الأشرف قايتباي の治世に在世し、宦官の前主人としてどちらもありうるので同定せず #NEEDID（規則26・61(c)）、候補は本注と ISSUES に。初版の desc「أبو الفتح」を原文の呼称に。'
