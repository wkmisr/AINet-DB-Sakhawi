translation:
  ja: アリー・ブン・ムハンマド・ブン・トゥアイマ、シャイフ・ヌール・アッ＝ディーン・アル＝ジャッラーヒー・アル＝カーヒリー。祖父に帰して（イブン・トゥアイマと）呼ばれることもある。アル＝ワリー・アル＝イラーキーに師事してその『アマーリー』などを聴いた者の一人であり、同じく我らがシャイフ（イブン・ハジャル）にも師事し、彼から聴いたものの中にはその『ムタバーイナート』がある。両者とも彼をシャイフと認めた。それどころか、アル＝ジャラール・アル＝クムスィーが私（サハーウィー）に語ったところでは、彼はイヤードの『シファー』を暗記していたという。
  en: ʿAlī b. Muḥammad b. Ṭuʿayma, the shaykh Nūr al-Dīn al-Jarrāḥī al-Qāhirī; he is sometimes attributed to his grandfather (as Ibn Ṭuʿayma). He was among those who attended closely upon al-Walī al-ʿIrāqī in his Amālī and elsewhere, and likewise attended closely upon our shaykh (Ibn Ḥajar), among what he heard from him being his Mutabāyināt; each of the two recognized him as a shaykh. Indeed, as al-Jalāl al-Qumṣī told me (al-Sakhāwī), he knew by heart the Shifāʾ of ʿIyāḍ.
