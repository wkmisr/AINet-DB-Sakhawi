translation:
  ja: バイバルス・アッ＝タウィール・アッ＝ザーヒリー・ジャクマク。アル＝アシュラフ・カーイトバーイの治世にしばらくマッカのバーシュ（守備隊長）を務め、帰還後に〔カーイトバーイによって〕昇進させられた。893年ムハッラム月9日に死去した。悪くない人物であった。
  en: Baybars al-Ṭawīl al-Ẓāhirī Jaqmaq, who served for a time as bāsh of Mecca in the Ashrafī days of Qāytbāy, who then promoted him after his return. He died on 9 Muḥarram 893, and he was not a bad man.
