translation:
  ja: トゥーガーン・シャイフ・アル＝アフマディー。メッカのマスジド・アル＝ハラームの監督職およびメッカのアル＝ラーキズの司令官職を一時務めた。彼は愚鈍で知識もなかったが、法学を学び法学者たちと競い合った。彼は、文字の書かれた敷物の粗末な扱いとそれらに対する敬意の欠如に関して、アッ＝サイイド・アッ＝サムフーディーに反論する著作を（他人の助けを借りて）著し、これに対して多くの人々が彼のために賛同の書評を寄せた。ハジュリー暦881年ズー・アル＝ヒッジャ月にカイロで没した。
  en: Ṭūghān Shaykh al-Aḥmadī. He served as the superintendent of the Holy Mosque of Mecca and the commander of al-Rākiz in Mecca for a period of time. He studied jurisprudence and rivaled the jurists despite his dullness and lack of knowledge. He produced a work, in which he was assisted by others, refuting al-Sayyid al-Samhūdī regarding the degradation of carpets with writing on them and their lack of respect, on which a group of scholars wrote approvals for him. He died in Cairo in Dhu al-Ḥijjah in the year 881.
