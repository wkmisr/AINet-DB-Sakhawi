translation:
  ja: アリー・ブン・ムハンマド・アル＝ムハージリー・アル＝ムクリー。私は、彼がヒジュラ暦828年にアリー・ブン・ムーサーがその息子アミーン・アッ＝ディーン・ムハンマドに下した諸朗誦法（キラーアート）のイジャーザ（授権状）に証人として立ち会い、その証言を詩の形式で書き残しているのを見た。その詩には次のようにあった。「神が私と、聴衆と、去りゆきし過去の罪からアミーンと言う者を赦したまわんことを」
  en: 'ʿAlī b. Muḥammad al-Muhājirī al-Muqrī. I saw him witnessing the ijāza (authorization) granted by ʿAlī b. Mūsā to his son Amīn al-Dīn Muḥammad in the variant readings (al-qirāʾāt) in the year 828 AH. He wrote his witnessing in verse, which included: ''And may God forgive me, the listeners, and whoever says Amen, for the sins that have passed and gone.'''
