  ja: アリー・ブン・ムハンマド・ブン・ファドル、ヌール・アッ＝ディーン、アッ＝スニィキー、のちにアッ＝カーヒリー、アッ＝アズハリー、アッ＝シャーフィイー、アル＝ムスリミー。我らがシャイフ（イブン・ハジャル）から聴聞し、アッ＝ザーヒリーヤ（マドラサ）において『サヒーフ・アル＝ブハーリー』を聴聞した者の一人である。
  en: ʿAlī b. Muḥammad b. Faḍl, Nūr al-Dīn, al-Sunaykī, later al-Qāhirī, al-Azharī, al-Shāfiʿī, al-Muslimī. He is among those who heard from our shaykh (Ibn Ḥajar) and heard al-Bukhārī at al-Ẓāhiriyya.
