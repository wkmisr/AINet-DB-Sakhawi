translation:
  ja: ディーユート出身のシャーフィイー派法学者であるアハマド・ブン・アル＝ザイン・アブドゥルラフマーンで、ウバイドとしても知られ、イブン・アビー・アル＝ムナイイフとも呼ばれた。彼はカイロで私（＝サハーウィー）から様々なことを学んだ。
  en: Aḥmad b. al-Zayn ʿAbd al-Raḥmān, known as ʿUbayd, b. ʿAlī b. Aḥmad b. ʿAlī b. Aḥmad b. Yūsuf b. Ibrāhīm al-Dayrūṭī al-Shāfiʿī, and also known as Ibn Abī al-Munayyiḥ. He acquired various things from me (al-Sakhāwī) in Cairo.
