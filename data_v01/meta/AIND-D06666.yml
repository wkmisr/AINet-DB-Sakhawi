translation:
  ja: ムハンマド・ブン・アフマド・ブン・サーリム・ブン・ハサン、アル＝ジャマール、カーディーのシハーブ・アッ＝ディーン・アル＝ジュッディーの子。イブン・アビー・アル＝ウユーンとして知られる。父は、自分はラビーア・アル＝ファラスの出であると語っていた。彼自身はアッ＝ザイン・アル＝マラーギーから『サヒーフ』を聴聞した。（8）75年ラジャブ月にマッカで没した。イブン・ファハドが彼に言及している。
  en: Muḥammad b. Aḥmad b. Sālim b. Ḥasan, al-Jamāl, son of the qāḍī Shihāb al-Dīn al-Juddī, known as Ibn Abī al-ʿUyūn. His father used to say that he was of Rabīʿat al-Faras. He himself heard the Ṣaḥīḥ from al-Zayn al-Marāghī. He died in Mecca in Rajab of the year [8]75. Ibn Fahd mentioned him.
