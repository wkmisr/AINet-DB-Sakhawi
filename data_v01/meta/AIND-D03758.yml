translation:
  ja: アブドゥル・ラフマーン・ブン・ムハンマド・ブン・アブドゥル・ラフマーン・ブン・ムハンマド・ブン・ムハンマド・ブン・アブドゥル・ラフマーン・ブン・アブドゥル・カーディル。ムリージュ（マリージュ）を自らの出自とするカイロの人。後述するムハンマドおよび彼らの父親の兄弟。アズハル（モスク）のワクフ管理に従事し、証言（公証実務）によって生計を立てた。私は彼を、ヒジュラ暦889年にカイロで見かけた。
  en: ʿAbd al-Raḥmān b. Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. Muḥammad b. ʿAbd al-Raḥmān b. ʿAbd al-Qādir, of Malījī origin, of Cairo. He is the brother of Muḥammad, who is mentioned below, as well as their father. He supervised the waqfs of al-Azhar and earned a living through notary testimony (shahāda). I saw him in Cairo in the year 889 AH.
