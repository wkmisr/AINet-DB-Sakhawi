  note:
    ja: '兄弟 عبد الله ＝ #AIND-D04606（項番221「عبد الله بن محمد بن عمر بن أبي بكر بن عبد الوهاب بن علي بن نزار العفيف الطفاري」、ナサブ完全一致）。D04606 本文（イブン・ハジャル『إنباء الغمر』からの引用）に「فانهزم عبد الله وأخوه أحمد فأما أحمد فانقطع خبره」とあり、ظفار の支配者一族が علي بن عمر بن كثير に敗れた際に兄弟ともに逃れ、本項主はその後消息を絶ったと伝える。本項のニスバ الطفاوي は原文どおり保持（D04606 側は الطفاري。いずれも ظفار＝Ẓafār に由来する綴り揺れ）。'
