translation:
  ja: ムハンマド・ブン・バクトゥムル、ナースィル・アッ＝ディーン・アル＝クバイバーティー・アル＝ハナフィー、前述のアリーの父。790年頃に生まれ、クルアーンを暗記し、シャイフーニーヤの講義に出席し、そのスーフィーの一人であった。礼拝・読誦・善行の務めとともに、過度の潔癖（ワスワース）で知られ、そのまま875年ジュマーダー・アル＝ウーラーに没した。シャイフーニーヤの浄め水で、そのハーンカーにおいて湯灌されるよう遺言した。神が彼を憐れみたまえ。
  en: Muḥammad b. Baktamur, Nāṣir al-Dīn al-Qubaybātī al-Ḥanafī, the father of ʿAlī, mentioned above. He was born in about the year 790, memorized the Qurʾān, attended the lessons of al-Shaykhūniyya and was one of its Sufis. He was known for excessive scrupulosity (waswās) together with worship, recitation and pious duties, until he died in Jumādā al-Ūlā 875. He directed that he be washed with the purifying water of al-Shaykhūniyya in the khānqāh. May God have mercy on him.
