translation:
  ja: ハサン・ブン・アフマド・アン＝ヌワイリー・アッ＝タラーブルシー・アル＝ハナフィー。 847年ズー・アル＝カアダ月にアッ＝サラーフ・アッ＝タラーブルシーが彼に『シャーティビーヤ』を暗誦提示し、また彼（アッ＝サラーフ）は、彼（本項の人物）がその町でハナフィー派のカーディーであったと述べた。
  en: Al-Ḥasan b. Aḥmad al-Nuwayrī al-Ṭarābulusī al-Ḥanafī. Al-Ṣalāḥ al-Ṭarābulusī presented al-Shāṭibiyya to him in Dhū al-Qaʿda in the year 847 H. It was stated that he was the qāḍī of the Ḥanafī school in his city.
