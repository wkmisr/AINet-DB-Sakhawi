translation:
  ja: ハイル・ベク。アミール。ガザの代理官（ナーイブ）を務め、タクディマ（軍司令官職）を与えられた。814年に殺害された。我らがシャイフ（イブン・ハジャル）がその著書『インバー・アル＝グムル』において彼を記録している。
  en: Khayr Bak. An amīr who served as the deputy governor (nāʾib) of Gaza and was granted a military command (taqdima). He was killed in the year 814 AH. Our shaykh (Ibn Ḥajar) chronicled him in his historical work, Inbāʾ al-Ghumr.
