  note:
    ja: '父 علي بن أحمد：本伝のある兄弟 #AIND-D03313 と共有する父で、D03313 本文「وكان كل من أبيه وأخيه يتعانى وضع القبان」により秤（قبان）製作者と分かる（識別要素あり）。corpus に本伝なし・ID-Master 未登録 → 新規 TMP-P-001582（規則3）。【集約 2026-10-26（機械[25]、オーケストレーター決定9）】候補 #AIND-D05042「علي بن أحمد بن مفتاح بن فطيس القباني والد أبي بكر ومحمد . مات في شعبان سنة أربع وستين بساحل جدة وحمل فدفن بالمعلاة」を原文で確認した。名・父名・القباني と「والد … ومحمد」は合うが、(1) 子に本項主の兄 شعبان（D03313）を挙げず أبو بكر（#AIND-D10745「أبو بكر بن علي بن أحمد بن مفتاح معلم القبانيين بجدة ويعرف بابن فطيس كسلفه」）を挙げる、(2) 家名「بن مفتاح بن فطيس」と居所（ジッダ・マッカ）が本項主・D03313 の「المغربي الزواوي الأصل القاهري … بالجودرية」と合わない。規則37 の閉合を満たさないので別の秤職人の家とみて TMP-P-001582 を維持する。'
  phrase: علي بن أحمد الزواوي القباني
