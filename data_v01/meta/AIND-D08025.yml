  note:
    ja: 「أخو شعبان الماضي . له ذكر فيه」＝#AIND-D03313「شعبان بن علي بن أحمد المغربي الزواوي الأصل القاهري القباني ، ويعرف بالزواوي ولد سنة عشرين وثمانمائة تقريبا … وصار شيخ الجماعة … وكان أخوه محمد إذ ذاك معلما فعز ذلك عليه ورافع فيه بحيث أحضر في الحديد ، وكان ابتداء سعده فإنه استقر حينئذ وصرف أخوه وذلك قريب الخمسين … مات في مستهل سنة خمس وتسعين」（未受領）。D03313 側は本項主を「أخوه محمد」として名指しし、850年頃に親方（معلم）の地位を本項主から引き継いだと記す。
