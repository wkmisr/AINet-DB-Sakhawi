translation:
  ja: アズドマル・ミン・マフムード・シャー・アッ＝ザーヒリー・ジャクマク、ハーズィンダール（宝庫係）。ムカッダム（指揮官）の一人であり、アミール・ヤシュバク・アル＝ファキーフの娘婿である。「アル＝ムサルタン」と呼ばれた。890年にハッジの指揮官（アミール・アル＝ハッジ）を務め、895年には遠征軍（ムジャッラドゥーン）とともに出征した。その後、ある地方にナーイブ（代官）として派遣された。やや吝嗇ではあったが、良い人物として語られている。
  en: Azdumar min Maḥmūd Shāh al-Ẓāhirī Jaqmaq, al-Khāzindār. He was one of the Muqaddams (commanders) and the son-in-law of Amir Yashbak al-Faqīh. He was also called al-Muṣaraṭan. In the year 890 AH, he was appointed Amir al-Hajj, and in the year 895 AH, he went out with the campaigners (al-Mujarradīn). Later, he was sent as a deputy (nāʾib) to several regions. He is remembered favorably, though with some parsimony.
