translation:
  ja: バクラミシュ・ブン・アブドゥッラー・アッ＝サイフィー（主君イナール・バーイ・カジマース）。802年にアリー・アル＝ガマーリー（D02209の師）から『（サヒーフ・）アル＝ブハーリー』の一部を聴聞し、我らがシャイフ、アッ＝シャイフ・リドワーン（D03005）の同輩（ラフィーク）としてその一部を伝えた。アッ＝タキー・アル＝カルカシャンディー（D10816）や、アル＝ビカーイー（D00207）をはじめとする人々が、彼ら二人（バクラミシュとアリー・アル＝ガマーリー）から聴聞した。
  en: Baklamish b. ʿAbd Allāh al-Sayfī (mamlūk of Īnāl Bāy Qijmās). He heard part of Ṣaḥīḥ al-Bukhārī from ʿAlī al-Ghamārī in 802 H and transmitted some of it as a companion to our shaykh al-Shaykh Riḍwān. al-Taqī al-Qalqashandī and others, such as al-Biqāʿī, heard from both of them.
