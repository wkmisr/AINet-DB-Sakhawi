translation:
  ja: アフマド・ブン・ユースフ・ブン・アブド・アル＝カリーム。ラカブは「アッ＝シハーブ」。「イブン・カーティブ・ジャカム」として知られる、ハーッス（特別財務）の監督官（ナーズィル・アル＝ハーッス）。アル＝カマール・ブン・アル＝バーリズィーの母方の孫（サブト）であり、軍監督官（ナーズィル・アル＝ジャイシュ）アル＝カマール・ムハンマドの兄弟でもある。クルアーンなどを読誦した。しばらくの間ジャワーリー（非ムスリムの人頭税）の監督職に就き、また軍監督官職にも、兄弟の後に一度、兄弟の息子の後に一度、就任した。ハッジには複数回赴いた。その性格は概して禁欲的で寡黙・内向的であった。
  en: Aḥmad b. Yūsuf b. ʿAbd al-Karīm, al-Shihāb by laqab, son of al-Jamāl, known as Ibn Kātib Jakam, supervisor of the privy funds (nāẓir al-khāṣṣ). He was the maternal grandson (sibṭ) of al-Kamāl b. al-Bārizī and the brother of al-Kamāl Muḥammad, the supervisor of the army. He recited the Qurʾān and other texts. He held the supervisorship of the jawālī (poll-tax) for a time, and likewise served as supervisor of the army once after his brother, and again after his brother's son. He performed the Hajj more than once. He was generally austere, reticent, and withdrawn.
