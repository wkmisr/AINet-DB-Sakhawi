translation:
  ja: 131 アフマド・ブン・アリー。ニスバはシャハーブ・アル＝フバイスィー、そのニスバの由来はミイナ・フバイス。後にカイロ出身、マーリク法学派、アズハル学院出身、マディーナ出身となる。その父は木工職人であった。彼はクルアーンと『アル＝リサーラ』、『アルフィーヤ・アン＝ナフワ』、バフラームによる『アッシュ・シャーミル』の一部を暗記し、ワッラーク、アッ＝サンフーリーン、アン＝ヌール・ブン・アッ＝タンシー、アル＝バドル・ブン・ムハッリタについて法学を学び、法学やアラビア語学、二つの原理（信仰原理と法学原理）、相続法などを修めた。そして彼は公証人（証言者）として生計を立て、アズハル学院などで学生たちに教え、落ち着きと美徳のある良い人物であった。
  en: 131 Aḥmad b. ʿAlī, al-Shihāb al-Ḥubayshī, whose nisba derives from Mīna Ḥubaysh, then al-Qāhirī al-Mālikī al-Azharī, then al-Madīnī. His father was a carpenter. He memorized the Qurʾān, al-Risāla, Alfiyyat al-Naḥw, and a portion of al-Shāmil by Bahrām. He studied fiqh under al-Warrāq, al-Sanhūrī, al-Nūr b. al-Tansī, and al-Badr b. Mukhalliṭa, and he engaged in it (fiqh), Arabic language, the two fundamental principles (uṣūl al-dīn and uṣūl al-fiqh), and inheritance law, among other things. He earned his livelihood through witnessing (as a notary), and he taught students at al-Azhar and elsewhere. He was a good man, known for his tranquility and virtue.
