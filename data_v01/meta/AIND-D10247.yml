    ja: '二重立項。第11巻の無名項 #AIND-D12832「أخو سوار بن سليمان بن دلغادر التركماني كان أحدب ممن علق في الكلاليب بباب زويلة مع أخيه ولم يلبث أن اجتاز به الدوادار فتوسل إليه … فشفع فيه وتسلمه الوالي وأخذ في مداواته رجاء أن يعيش فما تم يومه حتى مات وذلك بعد أخيه بيوم في يوم الثلاثاء تاسع عشر ربيع الأول سنة سبع وسبعين」（未収録）は、続柄（سوار の兄弟）・処刑の場所と方法（باب زويلة の鉤吊り）・「兄の一日後」・没年月日・曜日がすべて本項と一致＝同一人物。両項とも転送指示がないので実項のまま（絶対基準）。cert high は先例 #AIND-D08133⇄#AIND-D08233 に倣う（ISSUES §D165-1）。鏡像は D12832 受領時に立てる。'
