translation:
  ja: ヤフヤー・クール・ブン・スライマーン・ブン・ドゥルガーディル・アッ＝トゥルクマーニー。既出のスワールの兄弟。兄弟とともにバーブ・ズワイラで鉤に吊るされた者の一人で、兄弟の一日後、（8）77年ラビーウ第一月19日火曜日に没した。
  en: Yaḥyā Kūr b. Sulaymān b. Dulghādir al-Turkumānī, brother of Sawār, mentioned earlier. He was among those hung on the hooks with his brother at Bāb Zuwayla, until he died a day after him, on Tuesday 19 Rabīʿ I of the year [8]77.
