translation:
  ja: アリー・ブン・アブド・アル＝カーディル・ブン・アビー・アル＝バラカート・ブン・アリー、アブー・アル＝バラカート・ブン・ムヒー・アッ＝ディーン・アル＝ウカイリー・アン＝ヌワイリー・アル＝マッキー・アル＝ハナフィー。法学・法源学・アラビア語学を少し学んだ者の一人で、その大半は外来の学者たちのもとでのことであった。マッカで私（サハーウィー）から聴聞した。愚かさにおいては父に及ばない。
  en: ʿAlī b. ʿAbd al-Qādir b. Abī al-Barakāt b. ʿAlī, Abū al-Barakāt b. Muḥyī al-Dīn al-ʿUqaylī al-Nuwayrī al-Makkī al-Ḥanafī. He was among those who studied jurisprudence, its principles and Arabic a little, most of that under foreign scholars; he heard from me in Mecca, and he is less foolish than his father.
