    ja: '父 = #AIND-D04189（عبد القادر بن محمد بن علي بن أحمد بن عبد العزيز محيي الدين بن الكمال أبي البركات العقيلي النويري المكي الحنفي、生829）。本項の「بن أبي البركات بن علي」は祖父 محمد بن علي のクンヤ形、「بن محيي الدين」は父のラカブで一致。相手側末尾「وفيهم من شاركه في الحمق」は本項「وهو دون أبيه في الحمق」と呼応。兄弟 = #AIND-D07713（أبو البركات محمد … الماضي أبوه）。'
