translation:
  ja: アブド・アッ＝ラティーフ・ブン・アブド・アル＝ワッハーブ・ブン・アフィーフ・ブン・ワヒーバ・ブン・ユーハンナー、タキー・アッ＝ディーン・アル＝マルキー（マルキー）・アル＝アスラミー、医師（アル＝ハキーム）。アル＝アシュラフ・バルスバーイがその死の直前に胴斬りに処したアッ＝シャムス・アブー・アル＝バラカート・ブン・アフィーフの甥で、医術および眼科の長の一人であり、カワーリフとあだ名された。没した（没年不記載）。
  en: ʿAbd al-Laṭīf b. ʿAbd al-Wahhāb b. ʿAfīf b. Wuhayba b. Yūḥannā, Taqī al-Dīn al-Malakī al-Aslamī, the physician; nephew of al-Shams Abū al-Barakāt b. ʿAfīf, whom al-Ashraf Barsbāy had cut in two shortly before his (Barsbāy's) death; one of the heads of medicine and ophthalmology, nicknamed Qawāliḥ. He died (no date given).
