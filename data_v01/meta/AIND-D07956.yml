translation:
  ja: ムハンマド・ブン・ウスマーン・ブン・ムハンマド、アッ＝スラミー、アッ＝スワイディー、のちアッ＝ディマシュキー。イブン・アッ＝シールジーから『ジュズウ・アル＝アンサーリー』を、またアリー・ブン・ムーサー・アッ＝サファディー、アッ＝タキー・イブン・ラーフィウほか一群の人々から聴聞した。アル＝ブルキーニーがダマスクスのカーディー職にあった時期に法廷の署名官（ムワッキウ）を務め、その点で同輩に抜きん出た。イブン・ヒッジーは言う、「彼は証人資格の正しい、精確な人で、証書（シュルート）に通じ、当時その点で並ぶ者がなく、筆跡も美しく校訂も確かだった」。彼は少しばかり伝承した。（8）15年ラビーウ1月に没した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: 'Muḥammad b. ʿUthmān b. Muḥammad, al-Sulamī, al-Suwaydī, then al-Dimashqī. He heard the Juzʾ al-Anṣārī from Ibn al-Shīrajī, and heard from ʿAlī b. Mūsā al-Ṣafadī, al-Taqī Ibn Rāfiʿ and a group of others. He served as court signatory (muwaqqiʿ) during al-Bulqīnī''s tenure of the judgeship of Damascus and surpassed his peers in that. Ibn Ḥijjī said: "He was of sound probity and precise, expert in legal instruments, unique in that in his time, together with a fine hand and accurate collation." He transmitted a little. He died in Rabīʿ I of the year [8]15. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.'
