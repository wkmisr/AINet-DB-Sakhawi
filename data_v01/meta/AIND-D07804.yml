notes:
- text: '転送見出し（原文末尾「يأتي في الكنى」による）。転送先はクンヤ部の #AIND-D11112「أبو النجا بن البقري أحد الكتبة هو فيما قاله لي محمد بن المجد عبد الله بن فتح الدير المكيني وإنما قيل له ابن البقري لأن جدته أم أبيه تزوجت بتاج الدين ابن البقري … وكتب صاحب الترجمة بجدة مع ابن رمضان وغيره」（未受領。名・父名・職「أحد الكتبة」が一致）。D11112 ではニスバが「المكيني」（本見出しにはない）と記される。'
