translation:
  ja: フサイン・アル＝アアザーリー・アル＝ビスターミー。以前言及されたアフマドの父。イブン・アル＝アトアーニーに同行（師事）した。ヒジュラ暦825年にメッカで亡くなり、シャイフ・ウマル・アル＝ウラービーの隣、アル＝ムアッラー墓地に埋葬された。
  en: Ḥusayn al-Aʿzārī al-Bisṭāmī, the father of the aforementioned Aḥmad. He accompanied Ibn al-Aṭʿānī. He died in Mecca in the year 825 and was buried in al-Muʿallā cemetery next to Shaykh ʿUmar al-ʿUrābī.
