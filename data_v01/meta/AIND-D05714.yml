translation:
  ja: アリー、アル＝アラー・ブン・ムフリフ・アッ＝ディマシュキー・アル＝ハンバリー、同地（ダマスクス）の法官。善良で清廉、人々に受け入れられていた。ティムールが彼の背に施した焼灼の後遺症により、（80）3年シャアバーン月にダマスクスの村の一つディーマース村で没した。アル＝アイニーがそう述べている。私（サハーウィー）は言う、彼は……の子である（原文はここで途切れている）。
  en: 'ʿAlī, al-ʿAlāʾ b. Mufliḥ al-Dimashqī al-Ḥanbalī, its (Damascus''s) judge. He was good, upright and well accepted among the people. He died in the village of Daymās, one of the villages of Damascus, in Shaʿbān (80)3, from the effects of a cauterization that Timur (Tamerlane) had inflicted on his back; so said al-ʿAynī. I (al-Sakhāwī) say: he is the son of ... (the text breaks off here).'
