translation:
  ja: アフマド・アッ＝シハーブ・アッ＝ディマシュキー・アル＝マーリキー・イブン・アン＝ナッハース。放蕩者（فساق）の一人で、マーリキー派カーディーが（自らの）無能さと（周囲の）圧力ゆえに、彼に任命を強要した者へ300ディナールを支払う形で、彼を代理（ナーイブ）に任じた。その後、彼は罷免された。893年、ジールーン門（バーブ・ジールーン）で落馬して突然死し、その場で息絶えた。
  en: Aḥmad al-Shihāb al-Dimashqī al-Mālikī b. al-Naḥḥās. He was one of the dissolute persons (fussāq) whom the Mālikī judge appointed as his deputy — out of the judge's incapacity and under pressure — in exchange for 300 dinars paid to the one who imposed it upon him. Then he was dismissed. He died suddenly after falling from his horse at Bāb Jīrūn in the year 893 H, expiring on the spot.
