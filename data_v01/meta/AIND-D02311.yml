translation:
  ja: タンバク・アン＝ナーシリーは十人長の一人であり、ナウバ長であった。アル＝バフラワーン、アル＝ムサーリウとして知られる。836年シャウワールにアーミドで死亡した。
  en: Tanbak al-Nāṣirī was one of the emirs of tens (amīr ʿashara) and a head of a nawba unit (raʾs nawba). He was known as al-Bahlawān and al-Muṣāriʿ. He died in Āmid in Shawwāl of the year 836 AH.
