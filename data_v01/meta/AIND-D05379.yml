translation:
  ja: アリー・ブン・アビー・ジャアファル・ムハンマド・ブン・アフマド・ブン・ウマル・ブン・ムハンマド・ブン・ウスマーン・アル＝ハラビー。父は後述。イブン・アビー・ジャアファルとして知られる。クルアーンと諸書を暗記し、少し学問に携わり、聴聞したが大成せず、むしろ一族の名声を損ない、カーディー代理を務めた。893年シャウワール月にハマーで没し、同地に埋葬された。50歳を超えていた。
  en: ʿAlī b. Abī Jaʿfar Muḥammad b. Aḥmad b. ʿUmar b. Muḥammad b. ʿUthmān al-Ḥalabī; his father follows; known as Ibn Abī Jaʿfar. He was among those who memorized the Qurʾān and some books, studied a little and heard (ḥadīth), but he did not excel; rather he squandered the prestige of their house, and served as deputy judge. He died in Shawwāl of the year 893 in Ḥamā and was buried there, having passed fifty.
