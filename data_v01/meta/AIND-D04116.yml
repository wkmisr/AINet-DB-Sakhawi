translation:
  ja: アブドゥルカーディル・ブン・ハサン・ブン・アリー・アル＝ガムリー、のちにアル＝カーヒリー、アル＝バハーニキー、別名イブン・ファックーサ。彼には何人かの息子がいた。ジャラール・アッ＝ディーン・ムハンマドとザイン・アル＝アービディーン・ムハンマドは同じ母親から生まれ、シハーブ・アッ＝ディーン・アフマド、アブー・アル＝ファトフ・ムハンマド、アブー・アル＝ハサン・アリーの3人は別の母親から生まれた。長男（ジャラール・アッ＝ディーン）はシャーフィイー派で、三男（シハーブ・アッ＝ディーン）も同様である。次男（ザイン・アル＝アービディーン）はハンバル派を志しており、四男（アブー・アル＝ファトフ）はハナフィー派で『クドゥーリー』を学んでいる。末っ子（アブー・アル＝ハサン）はマーリキ派を志している。
  en: 'ʿAbd al-Qādir b. Ḥasan b. ʿAlī al-Ghamrī, later al-Qāhirī, al-Bakhāniqī, known as Ibn Faqqūsa. He had several sons: Jalāl al-Dīn Muḥammad and Zayn al-ʿĀbidīn Muḥammad, who were from one mother; and Shihāb al-Dīn Aḥmad, Abū al-Fatḥ Muḥammad, and Abū al-Ḥasan ʿAlī, who were from another mother. The first (Jalāl al-Dīn) is Shāfiʿī, as is the third (Shihāb al-Dīn). The second (Zayn al-ʿĀbidīn) intends to be Ḥanbalī. The fourth (Abū al-Fatḥ) is Ḥanafī and reads al-Qudūrī. The last one (Abū al-Ḥasan) intends to be Mālikī.'
