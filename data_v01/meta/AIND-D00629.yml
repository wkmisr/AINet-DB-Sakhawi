translation:
  ja: アブー・アル＝アッバース・アハマド・ブン・アビー・バクル・アル＝マッキー・アッ＝ザイライーは、博識な法学者である。彼はアル＝シハーブ・アハマド・ブン・アビー・バクル・アン＝ナーシリのもとで法学を学び、相続法と算術に秀でた。彼は836年または837年に亡くなった。アル＝アフィーフが彼について言及している。
  en: Aḥmad b. Abī Bakr, Abū al-ʿAbbās al-Makkī al-Zaylaʿī, the learned jurist. He studied fiqh under al-Shihāb Aḥmad b. Abī Bakr al-Nāshirī and excelled in inheritance law and arithmetic. He died in the year 836 or 837 AH. Al-ʿAfīf mentioned him.
