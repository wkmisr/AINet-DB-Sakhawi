translation:
  ja: ウマル・ブン・ムハンマド・ブン・アリー、アッ＝シラージュ、アル＝ヒムヤリー、アッ＝ダンダリー。我らの師（イブン・ハジャル）はその『ムウジャム』で彼に言及して言う。「学問に従事し、アル＝イッズ・ブン・ジャマーアらから聴聞し、多くを自筆で書写した。私は我らの師イブン・アル＝ムラッキンの講席で彼に会い、彼は私にイジャーザを与えた。私の思うところでは（80）4年に没した」。アル＝マクリーズィーもその『ウクード』で彼に言及し、高齢で没したと述べている。
  en: 'ʿUmar b. Muḥammad b. ʿAlī, al-Sirāj al-Ḥimyarī al-Dandarī. Our shaykh (Ibn Ḥajar) mentioned him in his Muʿjam and said: "He occupied himself with learning, heard from al-ʿIzz b. Jamāʿa and others, and wrote much in his own hand. I met him at the session of our shaykh Ibn al-Mulaqqin and he gave me an ijāza. He died, as I reckon, in the year (80)4." Al-Maqrīzī mentioned him in his ʿUqūd and said that he died at an advanced age.'
