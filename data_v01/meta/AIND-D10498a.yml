translation:
  ja: ユースフ・ブン・アッ＝シャイフ・アリー・ブン・サーリム・アル＝ガッズィー、サンジャル・アル＝ジャーウリー・モスクの説教師。フサイン・アル＝ファトヒーが844年にガッザで彼に会い、同モスクでその説教を聴いた後、彼からそれを書き取った。
  en: Yūsuf b. al-Shaykh ʿAlī b. Sālim al-Ghazzī, preacher of the mosque of Sanjar al-Jāwulī. Ḥusayn al-Fatḥī met him in Gaza in 844, heard his sermon in that mosque and then wrote it down from him.
