translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・ムーサー・ブン・ムハンマド・アッ＝ダワーリー・アル＝ヤマーニー。父は前世紀（の部）に記載されている。法学者で、裁判職における行状は称賛され、性格は善良であった。アル＝ハズラジーが父の伝記のなかで彼に言及している。今世紀の初頭に没したと私は思う。
  en: ʿAbd Allāh b. Muḥammad b. Mūsā b. Muḥammad al-Dawālī al-Yamānī, whose father is mentioned in the previous century. He was a jurist, of praiseworthy conduct in his judgeship and of good character. Al-Khazrajī mentioned him in the biography of his father. I think he died in the early years of this century.
