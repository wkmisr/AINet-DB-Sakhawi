translation:
  ja: アフマド・ブン・アリー・アル＝ファイラーリー・アル＝マグフリビー。彼は父と同様に学識ある敬虔な人物であった。メッカ巡礼を行い、カイロで人々と面会した。860年に死去。この情報は一部のマグリブ人から私に伝えられた。
  en: Ahmad b. ʿAli al-Faylali al-Maghribi. He was, like his father, a learned and righteous man. He performed the Hajj and met a group in Cairo. He died in the year 860 H. Some North Africans informed me of this.
