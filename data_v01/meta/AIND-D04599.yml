translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・アブドゥルワッハーブ、アル＝ガッズィー・アッ＝シャーフィイー。父・祖父と同じく同地（ガザ）の大モスクのハティーブ（説教師）で、イブン・サイフとして知られる。カイロで私（サハーウィー）から聴聞した者の一人。
  en: ʿAbd Allāh b. Muḥammad b. ʿAbd al-Wahhāb, al-Ghazzī al-Shāfiʿī, preacher (khaṭīb) at its (Gaza's) Great Mosque, like his father and grandfather; he is known as Ibn Sayf. He was among those who heard from me (al-Sakhāwī) in Cairo.
