    ja: '「دخل القاهرة غير مرة وحضر دروس البرهاني وولده وأخيه」。البرهاني は通称のみ。ID-Master の TMP-P-001331「البرهاني」（出現 D04910: マッカ出身で892年カイロ没の عفان بن ظهيرة が「ممن حضر في درس البرهاني」——本項と同じくマッカ人のカイロでの聴講）と同一文脈のため同番号を充てる。候補 #AIND-D00196（البرهان بن ظهيرة）等への同定は保留（規則26）。【集約】「القاهرة」は「دخل」の目的語であり「حضر」の場所句ではないため、3本の relation 内 event の placeName القاهرة を除去（規則22。内容検証B M-2）。同型句 D00236「حضر دروسهم مع دروس البرهاني وأخيه وابنه」・D01406「كالبرهاني بن ظهيرة وولده」・D01509「حضر دروس قاضيها البرهاني」はいずれもマッカの البرهان بن ظهيرة の講義を指し、本項主もマッカ人なので、講義地をカイロとする根拠はない（候補 D00196 の傍証、§D103-5）。初版のニスバ番号 TMP-N-00215 の person 位置流用を是正。'
