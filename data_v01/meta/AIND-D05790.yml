translation:
  ja: ウマル・ブン・アフマド・ブン・アブド・アッ＝ラフマーン・ブン・アル＝ジャマール・アル＝ミスリー・アル＝マッキー。（8）51年にマッカで生まれ、クルアーンと『ミンハージュ』を暗記した。何度もカイロに入り、アル＝ブルハーニーとその息子および兄弟の講義に出席し、私から聴聞した。
  en: ʿUmar b. Aḥmad b. ʿAbd al-Raḥmān b. al-Jamāl al-Miṣrī al-Makkī. He was born in the year (8)51 in Mecca and memorised the Qurʾān and the Minhāj. He entered Cairo more than once, attended the lessons of al-Burhānī, his son and his brother, and heard from me.
