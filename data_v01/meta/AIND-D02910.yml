translation:
  ja: ハリール・ブン・イーサー・ブン・アブドゥッラー・ハイル・アッディーン・アル＝クドゥシー、ハナフィー派。後に記されるムハンマドの父であり、エルサレムのカーディー（判事）であった。彼の息子やその他の人々が彼から学問を得た。ヒジュラ暦801年に毒殺され、彼の後にムワッファク・アッディーン・アル＝アジャミーがエルサレムのカーディー職に就いた。
  en: Khalīl b. ʿĪsā b. ʿAbd Allāh Khayr al-Dīn al-Qudsī al-Ḥanafī, the father of Muḥammad (who is mentioned below) and the judge of Jerusalem. His son and others studied under him. He died of poisoning in the year 801 AH, and was succeeded in the judgeship of Jerusalem by Muwaffaq al-Dīn al-ʿAjamī.
