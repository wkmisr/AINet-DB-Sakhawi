translation:
  ja: ムハンマド・ブン・アリー・ブン・イーサー、アッ＝シャムス・アル＝バグダーディー、のちアル＝カーヒリー、アル＝ハンバリー。ムワッファク・アッ＝ディーン・ブン・アル＝ムヒッブ・ブン・ナスルッラーの姻戚で、アル＝ムワッファクは彼の姉妹の夫であった。善良な人で、アル＝カラースンクリーヤに住み、アル＝ムヒッブ・ブン・アル＝アシュカルの家で（クルアーンを）教えていた。彼はイブラーヒーム・アッ＝シャヌワイヒーの二人の娘ザイナブとズライハーの同母の兄弟である。思うに（8）50年代に没した。立派な人であった。
  en: Muḥammad b. ʿAlī b. ʿĪsā, al-Shams al-Baghdādī, then al-Qāhirī, al-Ḥanbalī, the in-law of Muwaffaq al-Dīn b. al-Muḥibb b. Naṣr Allāh—al-Muwaffaq was the husband of his sister. He was a good man who lived in al-Qarāsunqurīya and taught (the Qurʾān) in the house of al-Muḥibb b. al-Ashqar; he is the brother, on their mother's side, of Zaynab and Zulaykhā, the two daughters of Ibrāhīm al-Shanwayhī. He died, I think, in the [8]50s. What a fine man he was.
