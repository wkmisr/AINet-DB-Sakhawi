notes:
- text: '母: 姉妹 D13063 の本文「وأمهما هي عائشة ابنة عبد الرحمن ابن امام البيرسية الرجل الصالح الياس العجمى」により本項主の母も同人とみられるが、他項のみの情報のため note に留める（規則23）。異父姉妹 زينب・زليخا の父 البرهان إبراهيم بن محمد بن أحمد الشنويهي＝#AIND-D00254（「إبراهيم بن محمد بن أحمد البرهان الشنويهي القاهري الشافعي … بالقراسنقرية」、本項主には触れない）は、原文では姉妹を特定する名として出るだけで、本項主の母の前夫か後夫かも原文から決まらない＝relation を立てない。【集約 2026-11-03】校閲時の relation subtype other（「継父」、cert medium）を除去しここに記す（内容A M、オーケストレーター決定9）。「وكان خيرا」「ونعم الرجل」は人物評（訳のみ）。初版の residence event القاهرة はニスバ由来＝除去（規則22(1)）。'
