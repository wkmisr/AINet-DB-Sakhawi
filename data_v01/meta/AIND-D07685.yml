notes:
- text: '同定補記: #AIND-D04017（عبد العزيز بن محمود الطوسي ثم الهروي）本文に「مولانا زاده محمد بن عبد العزيز بن سيف الدين الأبهري الأصل الهروي الشافعي المتوجه لاقراء مذهبه … وأفاد أنه ممن أخذ عن شيخنا حين قدومه على الظاهر جقمق مع قضاة شاه رخ」とあり、名・父名・ニスバ・「أخذ عن شيخنا」が本項と一致する。本項主はシャー・ルフの使節（カーディーたち）とともにカイロに来てイブン・ハジャルに学んだヘラートの学者と考えられるが、本項の原文にはその記載がないため属性化していない。'
