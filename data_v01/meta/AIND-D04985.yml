translation:
  ja: アリー・ブン・アフマド・ブン・アブドゥルワーヒド、ヌール・アッ＝ディーン、アル＝アッカーム（荷積み人）。マクリーズィーは『ウクード』で彼に言及し、多くの詩を暗記していたと述べ、（8）39年の巡礼からの帰途に彼が語ったものから次の詩を引いている。「彼の頬の上に水と火を見た、その間を蟻が群がって進むのを。そこで私は言った、同位者なき我が主に栄光あれ――水と火のあいだに蟻を行かせるとは。」
  en: 'ʿAlī b. Aḥmad b. ʿAbd al-Wāḥid, Nūr al-Dīn al-ʿAkkām (the camel-loader). Al-Maqrīzī mentioned him in his ʿUqūd and said that he had memorised much poetry, and quoted from him, among what he related to him on the way back from the pilgrimage of the year (8)39: "I saw water and fire upon his cheek, with ants crowding and moving between them; so I said: Glory to my Lord, who has no partner — the ants travel between the water and the fire."'
