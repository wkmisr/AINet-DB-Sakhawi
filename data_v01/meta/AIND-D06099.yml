  note:
    ja: '「جود عليه القرآن ابن أخيه عضد الدين عبد الرحمن」＝甥が本項主のもとでクルアーンを美誦した（師＝本項主 active、規則15。初版は passive が #NEEDID で向きが逆）。عضد الدين عبد الرحمن ＝ #AIND-D03822（عبد الرحمن بن يحيى بن يوسف بن محمد بن عيسى عضد الدين بن نظام الدين بن سيف الدين … الصيرامي الأصل القاهري الحنفي、813年生・880年没）。同項に「وجود القرآن عند ابن عمه عيسى بن الشيخ محمود」と本項主を名指しで裏付けあり。method は先例「جوده | القراءة」（TMP-S-00025）に合わせる。原文にない field（القراءات）を除去。'
