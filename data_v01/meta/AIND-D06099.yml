translation:
  ja: イーサー・ブン・アッ＝シャイフ・マフムード・ブン・ユースフ・ブン・ムハンマド・ブン・イーサー・アッ＝サイラーミー、のちアル＝カーヒリー、ハナフィー派。後述のアン＝ニザーム・ヤフヤーの兄弟。甥のアドゥド・アッ＝ディーン・アブド・アッ＝ラフマーンが彼のもとでクルアーンを美誦（タジュウィード）し、彼を称賛した。
  en: ʿĪsā b. al-Shaykh Maḥmūd b. Yūsuf b. Muḥammad b. ʿĪsā al-Ṣayrāmī, then al-Qāhirī, the Ḥanafī, brother of al-Niẓām Yaḥyā, who comes below. His brother's son ʿAḍud al-Dīn ʿAbd al-Raḥmān recited the Qurʾān with tajwīd under him, and praised him.
