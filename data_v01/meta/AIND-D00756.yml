translation:
  ja: アフマド・b・スライマーン・b・アブドゥッラフマーン・b・アル＝イッズ・ムハンマド・b・アット＝タキー・スライマーン・b・ハムザ・b・アフマド・b・ウマル・b・アビー・ウマル、アル＝マクディスィー、のちアッ＝サーリヒー、ハンバリー派。後述のアブドゥッラフマーンの兄弟。わが師〔イブン・ハジャル〕が自著の人名録（
  en: Aḥmad b. Sulaymān b. ʿAbd al-Raḥmān b. al-ʿIzz Muḥammad b. al-Taqī Sulaymān b. Ḥamza b. Aḥmad b. ʿUmar b. Abī ʿUmar al-Maqdisī, then al-Ṣāliḥī, the Ḥanbalī — brother of ʿAbd al-Raḥmān (treated below). Our shaykh (Ibn Ḥajar) mentions him in his Muʿjam and said that he (read annahu, not annahā) granted him an ijāza in the istidʿāʾ of al-Ṣarkhadī in the year 802, and left [the entry] blank for him.
