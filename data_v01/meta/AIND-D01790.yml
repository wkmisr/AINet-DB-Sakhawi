translation:
  ja: アフマド・ブン・アル＝ムウミニー。庶民の間でその神的牽引（ジャズブ）ゆえに語り伝えられ、そのために崇敬された人物である。彼は870年ラビーウ・アル＝アウワル月12日木曜日に亡くなり、シャイフ・ハルド・アル＝ハッジャージーの廟の近く、カウスーン・モスクの南に埋葬された。アル＝ムニールが彼を年代記に記した。
  en: Aḥmad b. al-Muʾminī, one who was remembered among the common people for his spiritual attraction (jadhb) and was venerated for that reason. He died on Thursday, the twelfth of Rabīʿ al-Awwal in the year seventy (870 H) and was buried near the tomb of Shaykh Khald al-Ḥajjājī, south of Jāmiʿ Qawṣūn. al-Munīr chronicled him.
