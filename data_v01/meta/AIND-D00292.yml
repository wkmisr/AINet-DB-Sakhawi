translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・アブー・アル＝カースィム・ブン・ムハンマド・ブン・アリー・ブン・ムハンマド・バルヒューズ・アル＝マッキー。クルアーンを暗記した人々のうちの一人であり、父の存命中に育った。880年サファル月に死去。アッラーが彼に楽園を報償として与え給うた。
  en: Ibrāhīm b. Muḥammad b. Abī al-Qāsim b. Muḥammad b. ʿAlī b. Muḥammad Barḥūs al-Makkī. He was among those who memorized the Qurʾān and grew up during his father's lifetime. He died in Ṣafar 880. May God compensate him with Paradise.
