translation:
  ja: アリ・ブン・ユースフ・ブン・ハスブ・アッラー・アル＝バッザーズ。823年にイブン・アル＝ジャザリーの下で、彼の著作『ナシュル』の完読を聴聞した。848年ズー・アル＝ヒッジャ月にマッカで死去した。イブン・ファハドがその死を記録している。
  en: Ali b. Yusuf b. Hasb Allah al-Bazzaz. He heard the conclusion of the recitation of al-Nashr under Ibn al-Jazari in the year 823 AH, and died in Mecca in Dhu al-Hijjah, 848 AH. His death was recorded by Ibn Fahd.
