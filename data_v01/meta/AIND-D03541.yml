translation:
  ja: アブドゥル・ラフマーン・ブン・イブラーヒーム・ブン・イスマーイール・ブン・アブドゥッラー・ブン・アブドゥル・ラフマーン・ブン・ウマル・ブン・アリー・ワジーハ・アッ＝ディーン・ブン・アル＝ブルハーン・アル＝アラウィー・アル＝ヤマニー・アッ＝シャーフィイー。先に言及されたアン＝ナフィース・スライマーン・ブン・イブラーヒーム・ブン・ウマールの親族であり、彼の祖父ウマルにおいて血統が交わる。彼はマッカで私（サハーウィー）に会い、ブハーリーの『スラースィッヤート』（三伝ハディース集）を私の前で朗読し、私の発音から『ムサルサル』などを聴聞した。
  en: ʿAbd al-Raḥmān b. Ibrāhīm b. Ismāʿīl b. ʿAbd Allāh b. ʿAbd al-Raḥmān b. ʿUmar b. ʿAlī Wajīh al-Dīn b. al-Burhān al-ʿAlawī al-Yamanī al-Shāfiʿī. A relative of the aforementioned al-Nafīs Sulaymān b. Ibrāhīm b. ʿUmar, with whom he shares a common lineage through his grandfather ʿUmar. He met me in Mecca, where he read to me the 'Thulāthiyyāt' of al-Bukhārī and heard from my dictation the 'al-Musalsal' and other works.
