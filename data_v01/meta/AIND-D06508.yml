  note:
    ja: '「الماضي أبوه」。父＝corpus 本伝 #AIND-D00150「إبراهيم بن عبد الغني بن إبراهيم أمين الدين بن مجدالدين القبطي المصري ويعرف بابن الهيصم . ولد تقريبا في أوائل القرن بالقاهرة …（ناظر الدولة・الوزارة）… مات في ليلة الجمعة مستهل ربيع الآخر وقيل في يوم الأحد ثامن عشر صفر سنة تسع وخمسين」（未収録）。名・ナサブ2代・ラカブ أمين الدين・家名 ابن الهيصم・「الماضي」で閉合（ブリーフ候補を本文で確認。cert なし、規則37）。初版は幻番号 TMP-P-000000。'
  phrase: أمين الدين إبراهيم بن عبد الغني بن إبراهيم بن الهيصم
notes:
- text: 'コプト系官僚の家 ابن الهيصم。祖父 #AIND-D04050（المجد عبد الغني بن إبراهيم、「والد الأمين إبراهيم」）、大おじ #AIND-D03895（التاج عبد الرزاق）。本項は父のみを指す。ニスバ（القبطي المصري）・没地は本項に記載がない＝補わない（規則23）。'
