translation:
  ja: サーリム・アッ＝ザワーウィー・アル＝マグリビー・アル＝マーリキー。ダマスカスのマーリキー派法官（カーディー）。ハジュラ暦873年サファル月に、ダマスカスのシュラービシーヤ・マドラサにて死去。モスク（ウマイヤ・モスク）で葬儀礼拝が行われ、アル＝ヒミヤリーヤ墓地に埋葬された。アッラーの慈悲あれ。前に出たサーリム・イブン・イブラーヒーム（の項）を参照せよ。
  en: Sālim al-Zawāwī al-Maghribī al-Mālikī, their Qadi in Damascus. He died there in Safar, the year 873, at al-Sharābishiyya Madrasa. The funeral prayer was performed over him at the congregational mosque, and he was buried in al-Ḥimyarīya cemetery, may Allah have mercy on him. See Salim b. Ibrahim, aforementioned.
