notes:
- text: '同家（チュニス起源の البكري المرجاني 家、マッカ。الأنصاري الذروي の النجم المرجاني 家 D12012 とは別家）: 叔父（父の兄弟）＝#AIND-D03769「عبد الرحمن بن محمد بن عبد الملك بن الشيخ أبي محمد عبد الله … الزين أبو الفرج القرشي البكري المرجاني الأصل المكي المالكي」（837没）、姉妹＝#AIND-D13712「أم الحسين سعادة ابنة عبد الملك بن محمد بن عبد الملك بن عبد الله …」（842没）、祖父 محمد بن عبد الملك بن أبي محمد（الجمال）は #AIND-D13121（زينب）の父。いずれも相手側が本項主を名指ししないため relation は立てず note に留める（規則23）。'
