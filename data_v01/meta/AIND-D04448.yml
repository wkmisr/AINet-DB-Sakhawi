translation:
  ja: アブドゥッラー・ブン・スライマーン・ブン・アブドゥッラー・ブン・ハルズ・アッラー。アル＝ジャマール、アル＝アジャーリー、のちにアル＝マクディスィー、マーリキー派。イブン・サハーラとして知られる。我らがシャイフ（イブン・ハジャル）は次のように述べている。「私は彼にアル＝ラムラで会い、彼から『アル＝アンサーリーのジュズウ』の末尾にある『イブン・マースィーのファワーイド』を聴聞した。それは彼がアル＝マイドゥーミーのもとでこれに列席（フドゥール）し、かつ彼からイジャーザを得ていたことによる。私とともにこれを聴聞した者の中には、私の従兄弟のシャアバーンがいた」。彼は800年台の数年（803〜809年）に没した。
  en: 'ʿAbd Allāh b. Sulaymān b. ʿAbd Allāh b. Ḥarz Allāh, al-Jamāl, al-Ājārī, then al-Maqdisī, al-Mālikī, known as Ibn Saḥāra. Our shaykh (Ibn Ḥajar) said: "I met him at al-Ramla and heard from him the Fawāʾid Ibn Māsī, from the end of the Juzʾ of al-Anṣārī, on the strength of his having attended (ḥuḍūr) its reading before al-Maydūmī and of his ijāza from him. Among those who heard it together with me was my paternal cousin Shaʿbān." He died in one of the ''odd'' years of the eight hundreds (803–809 AH).'
