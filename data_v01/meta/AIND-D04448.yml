  note:
    ar: وممن سمعها معه ابن عمه شعبان
    ja: '「ابن عمه شعبان」の「عمه」は直前の一人称話者イブン・ハジャルを指し、被伝者の従兄弟ではない。corpus では「الزين شعبان ابن عم شيخنا」の形が反復して現れ（L6064・L16621・L29724・L80969・L96016・L107380 ほか）、その本伝が #AIND-D03319（شعبان بن محمد بن محمد بن محمد بن محمد بن علي بن محمود بن أحمد المكثر الزين أبو الطيب ... الكناني العسقلاني ... ويعرف كسلفه بابن حجر وهو حفيد عم شيخنا، 780年シャアバーン生・859年ラマダーン没）。同項に「ثم استصحبه إلى الشام أيضا فسمع معه بسرياقوس وقطيا وغزة ونابلس والرملة وبيت المقدس ...」とあり、イブン・ハジャルに同行してアル＝ラムラで聴聞した事実が本項と一致する。したがって شعبان は被伝者の（イブン・ハジャルと並ぶ）聴聞者＝student。初版は被伝者の cousin（active=#NEEDID）としていたが是正。'
