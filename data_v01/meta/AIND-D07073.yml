notes:
- text: '転送見出し（原文「فيمن جده عمر ... ومحمد」による。転送先が2つ）。第1の転送先は #AIND-D06792「محمد بن أحمد بن عمر الشمس أبو عبد الله بن الشهاب أبي العباس القاهري السعودي الحنفي」（祖父 عمر・ハナフィー派。同名の #AIND-D06787 محمد بن أحمد بن عمر … النحريري الشافعي ويعرف بالسعودي はシャーフィイー派＝該当しない）。第2の転送先「ومحمد」は #AIND-D06961「محمد بن أحمد بن محمد الشمس المصري السعودي الحنفي ويعرف بابن الشيخ البئر」（#AIND-D06947 محمد بن أحمد بن محمد البدر … السعودي はマーリク派＝除外）。同じ D06792 へ向く転送見出しに REF #AIND-D07047「محمد بن أحمد الشمس السعودي الحنفي . فيمن جده عمر」（B116）がある。'
