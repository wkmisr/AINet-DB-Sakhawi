translation:
  ja: ムハンマド・ブン・フールシード、ジャマール・アッディーン・ブン・シャムス――「シャムス」はペルシア語の「フールシード」の意味（太陽）である――、シルワーン出身、アッ＝サカンバーイティー、マッカ在住。若者である。私（サハーウィー）のもとで『ナワウィーの四十ハディース』の一部を読誦し、その聴聞を完了し、そのほかのものも聴聞した。
  en: Muḥammad b. Khūrshīd, Jamāl al-Dīn b. Shams — "Shams" being the meaning of Khūrshīd in Persian — of Shirwān origin, al-Sakanbāyitī, resident of Mecca. A young man. He read part of al-Arbaʿūn al-Nawawiyya to me (al-Sakhāwī), completed hearing it, and heard other things besides.
