translation:
  ja: アリー・ブン・ムハンマド・ブン・ムファッダル、アブー・アル＝ハサン・アル＝ムスリミー、のちにアル＝カーヒリー、シャーフィイー派。我らがシャイフ（イブン・ハジャル）らのもとで聴聞し、巡礼を行い、カーディー代理を務め、バーブ・アル＝カンタラの内側、御者たちの停留所にあるアブー・アッ＝スウードのザーウィヤに住んだ。それが彼の管財下にあったからである。アミールたちの幾人かと交わり、とりわけラアス・ナウバト・アン＝ヌウワーブのアズバク・アル＝ハーズィンダールとは、アル＝クーラーニーの後のサイード・アッ＝スアダーのシャイフ職について彼のために口を利いてもらうほどであった。彼は自らのはなはだしい欠陥にもかかわらず、それより上の地位を望んだ。女性たち（妻）由来の財産で富裕と噂される。
  en: ʿAlī b. Muḥammad b. Mufaḍḍal, Abū al-Ḥasan al-Muslimī, then al-Qāhirī, al-Shāfiʿī. He heard from our shaykh (Ibn Ḥajar) and others, performed the pilgrimage, served as deputy qāḍī, and lived in the Zāwiya of Abū al-Suʿūd at the muleteers' station inside Bāb al-Qanṭara, since it was under his supervision. He mixed with several amirs, especially Azbak al-Khāzindār, raʾs nawbat al-nuwwāb, to the point that the latter spoke on his behalf for the shaykhship of Saʿīd al-Suʿadāʾ after al-Kūrānī; and he aspired to even higher posts despite his great deficiency. He is said to be wealthy through (his) women.
