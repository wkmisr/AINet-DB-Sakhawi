translation:
  ja: ムハンマド・ブン・アブド・アッラー・ブン・ウマル・ブン・アブド・アッラー・ブン・ウマル・ブン・マスウード、アル＝カーイド、アル＝ウマリー、アル＝マッキー。（マッカの）隊長たち（クウワード）のうちウマラ一族の名士の一人で、816年ジュマーダー・アル＝アーヒラ月末にサイイド・ルマイサ・ブン・ムハンマド・ブン・アジュラーンにマッカ襲撃を敢行するよう促した者の一人であった。824年末または825年初に没し、50歳に達したか、おそらくそれに近かった。アル＝ファースィーが（その）マッカ（史）で彼に言及している。
  en: Muḥammad b. ʿAbd Allāh b. ʿUmar b. ʿAbd Allāh b. ʿUmar b. Masʿūd, al-Qāʾid, al-ʿUmarī, al-Makkī. He was one of the notables of the qāʾids of the ʿUmara (clan), and among those who emboldened the Sayyid Rumaytha b. Muḥammad b. ʿAjlān to attack Mecca at the end of Jumādā al-Ākhira of the year 816. He died at the end of the year 824 or the beginning of 825, having reached fifty or, as is thought, nearly so. Al-Fāsī mentioned him in (his history of) Mecca.
