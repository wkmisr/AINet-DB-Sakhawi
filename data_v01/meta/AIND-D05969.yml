translation:
  ja: ウマル・ブン・ムハンマド・ブン・ウマル、アッ＝ザイン、アブー・ハフス、アッ＝ディマシュキー、アッ＝シャーフィイー、アッ＝サブアの寄留者、イブン・アル＝ハルダフーシーとして知られる。778年に生まれ、アッ＝シハーブ・アフマド・ブン・アリー・ブン・ヤフヤー・アル＝フサイニーとイブン・スィッディークのもとで『ムスナド・アッ＝ダーリミー』を聴聞し、アブドゥッラー・ブン・ハリール・アル＝ハラスターニーとアブー・ハフス・ウマル・アル＝バーリスィーのもとでも聴聞した。伝承を行い、学識ある人々が彼から聴聞した。（8）40年サファル月12日土曜日に没し、その日のうちにバーブ・トゥーマー墓地に葬られた。神が彼に慈悲を垂れたまわんことを。
  en: ʿUmar b. Muḥammad b. ʿUmar, al-Zayn Abū Ḥafṣ al-Dimashqī al-Shāfiʿī, resident of al-Sabʿa, known as Ibn al-Khardafūshī. He was born in the year 778. He heard the Musnad of al-Dārimī from al-Shihāb Aḥmad b. ʿAlī b. Yaḥyā al-Ḥusaynī and Ibn Ṣiddīq, and heard from ʿAbd Allāh b. Khalīl al-Ḥarastānī and Abū Ḥafṣ ʿUmar al-Bālisī. He transmitted ḥadīth, and learned men heard from him. He died on Saturday 12 Ṣafar (8)40 and was buried the same day in the cemetery of Bāb Tūmā; may God have mercy on him.
