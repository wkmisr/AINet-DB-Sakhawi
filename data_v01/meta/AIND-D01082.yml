translation:
  ja: アハマド・ブン・アッ＝シャイフ・アリー・ブン・ナーシルッディーン・ブン・ムハンマド・アル＝バアリー・アル＝アッタール。彼と彼の父はアッタールであった。バアールベクに生まれ、そこで育ち、アッ＝ザイン・アブドゥッラフマーン・ブン・アッ＝ザアブーブから『サヒーフ』を聴聞した。私（＝サハーウィー）はアッ＝ハッジャールで、バアールベクで彼に出会い、『アッ＝サラースィヤート』を彼に読み聞かせたが、彼は素晴らしい人物であった。彼は…で亡くなった。
  en: Aḥmad b. al-Shaykh ʿAlī b. Nāṣir al-Dīn b. Muḥammad al-Baʿlī al-ʿAṭṭār. He and his father were perfumers. He was born and grew up in Baʿlabakk. He listened to al-Ṣaḥīḥ from al-Zayn ʿAbd al-Raḥmān b. al-Zaʿbūb. I (al-Sakhāwī), al-Ḥajjār, met him there (in Baʿlabakk) and read to him al-Thalāthiyāt; he was an excellent man. He died in...
