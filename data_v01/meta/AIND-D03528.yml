translation:
  ja: アブドゥルハミード。エジプト（カイロ）のアル＝ジャーミウ・アル＝ジャディード（新モスク）のスーフィー・シャイフ職（指導者）を務め、828年サファル月に死去した。アル＝マクリーズィーがその著作『ウクード（ドゥラル・アル＝ウクード・アル＝ファリーダ）』においてこのように彼について言及している。
  en: Abd al-Hamid. A man who held the position of shaykh of the Sufis at al-Jami' al-Jadid (the New Mosque) in Egypt (Cairo) until his death in Safar, 828 AH. Al-Maqrizi mentioned him thus in his work al-'Uqud.
