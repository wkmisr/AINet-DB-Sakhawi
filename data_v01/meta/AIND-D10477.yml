translation:
  ja: ユースフ・ブン・アブド・アッラー、アッ＝ディヤー・ブン・アル＝ジャマール、アル＝ハラウィー、バー・ユースフとして知られる。アッ＝ターウースィーが822年にヘラート郊外の彼の自宅で彼に会った。彼はアッ＝ターウースィーに、自分の年齢は300年を7年越えていると語った。アッ＝ターウースィーはその裏づけとして、彼の町の長老たちの何人もが「我々は幼いころから今の姿のままの彼を見てきたし、我々の父たちも同じことを我々に語った」と言ったことを挙げている。そのときアッ＝ターウースィーは、全般的イジャーザによって彼のもとで何がしかを読んだ。神こそが最もよく知り給う。
  en: 'Yūsuf b. ʿAbd Allāh, al-Ḍiyāʾ b. al-Jamāl, al-Harawī, known as Bā Yūsuf. Al-Ṭāwūsī met him in the year 822 at his house in the outskirts of Herat, and he told him that his age had exceeded three hundred years by seven years. Al-Ṭāwūsī adduced in support of this that a number of the elders of his town said: "We have seen him since our childhood in his present appearance, and our fathers told us the same." On that occasion al-Ṭāwūsī read something with him on the strength of the general ijāza. God knows best.'
