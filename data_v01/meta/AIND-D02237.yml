translation:
  ja: バイバガー・アル＝ムザッファリー・アッ＝トゥルキー。アッ＝ザーヒル〔・バルクーク〕のマムルークの一人で、アン＝ナーシルの治世（ダウラ）にアミールとなり、アタベク職（アターベキーヤ）を務めた。何度も投獄され、失脚（ナクバ）も経験したが、気骨のある人物であった。833年ジュマーダー・アル＝アーヒラ月6日、水曜日の夜に死去した。我らがシャイフ（イブン・ハジャル）が『インバーウ』の中で彼に言及している。
  en: Baybaghā al-Muẓaffarī al-Turkī. He was one of the mamluks of al-Ẓāhir [Barqūq], became an amir in the reign (dawla) of al-Nāṣir, and held the office of atābak. He was imprisoned several times and suffered disgrace, but he was a strong-willed man. He died on the night of Wednesday, 6 Jumādā al-Ākhira 833. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
