  note:
    ja: '「رأيته أجاز خليل بن إبراهيم الدمياطي في سنة تسع وخمسين وثمانمائة وقال أنه قرأ عليه عقيدة الإسلام من قواعد العقائد من الأحياء」＝伝主が師（イジャーザ授与、弟子が伝主に読誦）。弟子＝الغرس أبو الجود خليل بن إبراهيم بن عبد الرحمن … الدمياطي القاهري الشافعي（#AIND-D02873、生836。本伝に「وحفظ عقيدتي الاسلام للغزالي واليافعي」とあり本件と整合）。859年＝1454年12月22日〜1455年12月10日。bibl＝ガザーリー『إحياء علوم الدين』（TMP-T-00148）の「قواعد العقائد」中の「عقيدة الإسلام」章。初版は同一弟子を #NEEDID の2 relation に分け、field を الفقه とし、@when にヒジュラ年を書いていた。'
