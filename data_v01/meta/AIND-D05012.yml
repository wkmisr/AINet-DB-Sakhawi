translation:
  ja: アリー・ブン・アフマド・ブン・アリー・アル＝マハッリー——アル＝マハッラ・アル＝クブラーに属するマハッラト・アリーへのニスバ——、シャーフィイー派、イブン・アル＝クライトとして知られる。私（サハーウィー）は、彼が859年にハリール・ブン・イブラーヒーム・アッ＝ディムヤーティーにイジャーザを与えるのを見た。彼（ハリール）は、『イフヤー（・ウルーム・アッ＝ディーン）』の「カワーイド・アル＝アカーイド」から「アキーダト・アル＝イスラーム」を彼（伝主）に読誦したと述べていた。
  en: ʿAlī b. Aḥmad b. ʿAlī al-Maḥallī — a nisba to Maḥallat ʿAlī, which belongs to al-Maḥalla al-Kubrā — al-Shāfiʿī, known as Ibn al-Qurayṭ. I (al-Sakhāwī) saw him grant an ijāza to Khalīl b. Ibrāhīm al-Dimyāṭī in the year 859, and he (Khalīl) stated that he had read to him ʿAqīdat al-Islām from the Qawāʿid al-ʿaqāʾid of the Iḥyāʾ.
