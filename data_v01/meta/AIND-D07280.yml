  note:
    ja: 「وينظر محمد بن أبي بكر بن الصيرفي الماضي」＝#AIND-D07271「محمد بن أبي بكر المسند شمس الدين الدمشقي بن الصيرفي البزار قريب الحافظ ابن ناصر الدين … مات بدمشق … سنة اثنتين وستين … ذكره ابن اللبودي … وينظر محمد بن أبي بكر المنبجي」（未収録）。双方に転送指示はなく「ينظر」の相互照会（同一人物か要検討）のため、二重立項型として両項を実項のまま保持し possible_identity cert low（ينظر＝low）。D07271 側にも本項への「ينظر」あり（鏡像は D07271 受領時に）。
