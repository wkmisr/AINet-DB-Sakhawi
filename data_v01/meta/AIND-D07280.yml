translation:
  ja: ムハンマド・ブン・アブー・バクル・アル＝マンビジー。アル＝イマード・アブー・バクル・ブン・ムハンマド・ブン・アビー・ガーニム・アル＝ハッバール・アッ＝サーイグから一つのジュズウ（ハディース集の一部）を聴聞し、それを伝承した。イブン・ファハドらが彼に会った。前出のムハンマド・ブン・アブー・バクル・ブン・アッ＝サイラフィーを参照（同一人物か検討を要する）。
  en: Muḥammad b. Abī Bakr al-Manbijī. He heard a juzʾ from al-ʿImād Abū Bakr b. Muḥammad b. Abī Ghānim al-Ḥabbāl al-Ṣāʾigh and transmitted it. Ibn Fahd and others met him. Muḥammad b. Abī Bakr b. al-Ṣayrafī, mentioned above, should be compared.
