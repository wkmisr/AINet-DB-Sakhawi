  note:
    ja: '「وحدث به لقيه ابن فهد وغيره」＝本項主がこの جزء を伝承し、ابن فهد らが彼に会った（本項主＝師、規則15）。ابن فهد は没年不明のため規則43により التقي بن فهد #AIND-D09211・cert low（repo 先例 D07445「لقيه ابن فهد」の student relation（要判断_B88 §D-b3 で D05979 cert medium に変更）。【集約 2026-10-25】校閲時の「D06228「لقيه ابن فهد」」は誤引用（D06228 は「ذكره ابن فهد」の Pattern A）を訂正、規則42）。'
