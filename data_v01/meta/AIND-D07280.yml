    ja: '「سمع من العماد أبي بكر بن محمد بن أبي غانم الحبال الصائغ جزءا وحدث به」。師 العماد أبو بكر بن محمد بن أبي غانم الحبال الصائغ は8世紀のハディース伝承者（D10755「سمع من المحب الصامت والعماد أبي بكر بن محمد بن الحبال」にも師として出現）。corpus に本伝なし・ID-Master 未登録 → TMP-P-001571。同家＝#AIND-D01482「أحمد بن محمد بن محمد بن أحمد بن أبي غانم … السكندري … ويعرف بابن الحبال وبابن الصائغ」・索引 #AIND-D12246。書名は「جزء」（不特定）のため ref なし。'
