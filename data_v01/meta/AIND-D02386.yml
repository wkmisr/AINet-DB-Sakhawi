translation:
  ja: ジャンバク。ダマスクスの軍指揮官（ムカッダム）の一人で、同地のスルターン付ダワーダール。出自はハラブ総督タグリー・バルミシュ・アッ＝トゥルクマーニーの解放奴隷であり、無知であるにもかかわらず神秘的認識（イルファーン）を自称していた。873年、スワール（シャー・スワール）に対する遠征（タジュリーダ）で戦死した。
  en: Jānbak. He was one of the muqaddams in Damascus and the sultan's dawādār there. His origin was among the freedmen of Taghrī Barmish al-Turkumānī, the nāʾib of Ḥalab. He claimed ʿirfān (gnosis) despite his ignorance. He was killed in the expedition against (Shāh) Suwār in the year 873.
