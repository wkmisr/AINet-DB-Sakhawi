translation:
  ja: ナースィル・ブン・ムハンマド、ナースィル・アッ＝ディーン、アル＝ビスターミー。アブド・アッラー・アル＝ビスターミーの弟子の一人。カイロに住みつき、（8）33年に疫病でそこに没した。わが師（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Nāṣir b. Muḥammad, Nāṣir al-Dīn, al-Bisṭāmī. He was one of the disciples of ʿAbd Allāh al-Bisṭāmī. He settled in Cairo and died there in the plague in the year [8]33. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
