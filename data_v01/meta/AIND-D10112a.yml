translation:
  ja: マイラブ・ブン・アリー・ブン・ムバーラク・ブン・ルマイサ・ブン・アビー・ヌマイイ・アル＝ハサニー。839年ラジャブ月26日金曜の夜にフライスで没し、マッカに運ばれてハジューンの母方叔父の墓の近くに葬られた。母はサアダーナ・ビント・アジュラーン・ブン・ルマイサ。イブン・ファフドが没年を記録した。
  en: Maylab b. ʿAlī b. Mubārak b. Rumaytha b. Abī Numayy al-Ḥasanī. He died at Khulayṣ on the night of Friday 26 Rajab 839 and was carried to Mecca and buried at al-Ḥajūn near the grave of his maternal uncle. His mother was Saʿdāna bt. ʿAjlān b. Rumaytha. Ibn Fahd recorded his death.
