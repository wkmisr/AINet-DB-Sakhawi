translation:
  ja: アブドゥッラッザーク・ブン・カリーム・アッ＝ディーン・アブドゥルカリーム・ブン・アブドゥルガニー・ブン・ヤアクーブ。イブン・フハイラ（点付きの خ、縮小形。アブドゥルガニーがファフル・アッ＝ディーンというラカブを持っていたため、人々がそれを縮小形にした）として知られる。マムルーク登録書記（クッターブ・アル＝ママーリーク）の一人であり、後述するアブー・アル＝ハイル・ムハンマド・ブン・ヤフヤー・ブン・アブドゥルガニーの従兄弟である。ヒジュラ暦874年ラビーウ・アル＝アウワル月中旬の金曜日に没した。
  en: 'ʿAbd al-Razzāq b. Karīm al-Dīn ʿAbd al-Karīm b. ʿAbd al-Ghanī b. Yaʿqūb, known as Ibn Fukhayra (with the dotted khāʾ, in diminutive form: ʿAbd al-Ghanī bore the laqab Fakhr al-Dīn, which people turned into a diminutive). He was one of the clerks of the Mamluks (kuttāb al-mamālīk) and the cousin of Abū al-Khayr Muḥammad b. Yaḥyā b. ʿAbd al-Ghanī, who is mentioned later. He died on Friday, in mid-Rabīʿ I 874 AH.'
