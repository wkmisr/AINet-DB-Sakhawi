translation:
  ja: ムハンマド・ブン・アリー・ブン・アター、アミーン・アッ＝ディーン・アッ＝ディマシュキー。優れて卓越し、スーフィズムと理性諸学に通じていた。アサディーヤ（学院）で教授し、カーディーたちのもとで判決文書を作成しており、祖父アッ＝サーヒブ・シハーブ・アッ＝ディーン・ブン・タキー・アッ＝ディーンのワクフの監督は彼に属した。801年ズー・アル＝ヒッジャ月に没した。我らがシャイフ（イブン・ハジャル）が『インバー』にその没年を記している。
  en: Muḥammad b. ʿAlī b. ʿAṭāʾ, Amīn al-Dīn al-Dimashqī. He was excellent and accomplished, versed in Sufism and the rational sciences; he taught at the Asadiyya, drew up court records for the judges, and the supervision of the waqf of his grandfather al-Ṣāḥib Shihāb al-Dīn b. Taqī al-Dīn belonged to him. He died in Dhū al-Ḥijja [80]1; our shaykh dated him in his Inbāʾ.
