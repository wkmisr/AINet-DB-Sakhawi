translation:
  ja: シャーヒーン・カスカー。その意味は「背の低い者」である。ハーッサキーヤ（親衛マムルーク）の一員であったが、アン＝ナースィル（・ファラジュ）が彼を少しずつ引き上げ、ついには軍司令官（ムカッダム）の一人となった。（その）ほどなく810年ズー・アル＝カアダ月に没し、ハウシュ・アッ＝ザーヒル（バルクーク廟域）に葬られた。我らがシャイフ（イブン・ハジャル）が『インバー（・アル＝グムル）』で彼に言及しており、アル＝アイニーも同様で、彼は善いことでは知られなかったと述べている。
  en: Shāhīn Qaṣqā, which means "the short one". He was one of the khāṣṣakiyya, and al-Nāṣir (Faraj) advanced him step by step until he became one of the commanders (muqaddams). He died shortly afterwards, in Dhū al-Qaʿda of the year [8]10, and was buried in Ḥawsh al-Ẓāhir. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ, as did al-ʿAynī, who said that he was not known for any good.
