notes:
- text: '転送見出し（原文「فيمن جده عبيد قريبا」による）。「محمد بن علي بن عبيد」の見出しは corpus に2件: #AIND-D08128「محمد بن علي بن عبيد بن محمد الشمس أبو عبد الله وأبو الخير بن نور الدين القاهري الصوفي الشافعي بواب سعيد السعداء وابن بوابها ويعرف بابن الشيخ على المخبزي」（809生・856没）と #AIND-D08129「محمد بن علي بن عبيد أبو عبد الله الصنهاحي التونسي المقرئ المؤدب」（868没）。本項の見出し「محمد بن علي بن عبد الله」と祖父名の形（عبد الله／عبيد）以外に決め手がなく、直後（قريبا）の第1候補 D08128 を target とし、第2候補 D08129 を editorial note に記す（ISSUES §D150-1）。'
