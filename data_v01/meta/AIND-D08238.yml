notes:
- text: '転送見出し（原文末尾「فيمن جده محمد بن أحمد بن محمد」による）。転送先は #AIND-D08157「محمد بن علي بن محمد بن أحمد بن محمد بن محمد بن ممدود الشمس بن العلاء بن ناصر الدين الغزي الأصل الشارنقاشي ثم القاهري الأزهري الشافعي ويعرف بالشارنقاشي … ولد سنة خمسين وثمانمائة」（祖父ナサブ محمد بن أحمد بن محمد・ラカブ الشمس・ニスバ الشارنقاشي が一致）。ニスバ索引 #AIND-D11755 は使わない。'
