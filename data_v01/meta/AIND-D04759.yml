  ja: アブドゥルワッハーブ・ブン・アフマド・アッ＝ディマシュキー、フジュラーの説教師（ハティーブ）。（8）73年に、数人の子弟の名を載せたイジャーザ申請書（イスティドアー）に書き付けた。彼の経歴について私は何も知らない。
  en: ʿAbd al-Wahhāb b. Aḥmad al-Dimashqī, preacher (khaṭīb) of Ḥujrāʾ. He wrote (an ijāza) on a petition (istidʿāʾ) listing some children in (8)73, and I know nothing of his circumstances.
