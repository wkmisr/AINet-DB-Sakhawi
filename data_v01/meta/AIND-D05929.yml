translation:
  ja: ウマル・ブン・ムハンマド・ブン・イブラーヒーム・ブン・アリー、アッ＝シラージュ・ブン・アル＝カマール、アル＝アビヤーリー・アッ＝サカンダリー、盲目の法学者。745年にアリー・ブン・アブド・アル＝ワッハーブ・イブン・アル＝フラートから、五つのハディースを含む『アムル・ブン・ズラーラのジュズ』の抜粋を、イブン・アル＝ブーリーから（一部欠落のある）『ティルミズィーのジャーミウ』を、アル＝ファフル・ムハンマド・ブン・ムハンマド・ブン・スライマーン・ブン・ハイルから『ムハーミリーのドゥアー』を、ほかの人々からも聴聞した。ハディースを伝え、イブン・ムーサーやアル＝ムワッファク・アル＝アッビーなど優れた学者たちが彼から聴聞した。（8）15年に我らがシャイフの息子、イブン・ファハド——彼はその『ムウジャム』で彼に言及している——ほかにイジャーザを与えた。
  en: ʿUmar b. Muḥammad b. Ibrāhīm b. ʿAlī, al-Sirāj b. al-Kamāl, al-Abyārī al-Sakandarī, the blind jurist. In the year 745 he heard from ʿAlī b. ʿAbd al-Wahhāb Ibn al-Furāt a selection from the Juzʾ of ʿAmr b. Zurāra comprising five ḥadīths, from Ibn al-Būrī the Jāmiʿ of al-Tirmidhī (with a lacuna), and from al-Fakhr Muḥammad b. Muḥammad b. Sulaymān b. Khayr the Duʿāʾ of al-Muḥāmilī, among others. He transmitted ḥadīth, and learned men such as Ibn Mūsā and al-Muwaffaq al-Ubbī heard from him. In the year (8)15 he granted ijāza to the son of our shaykh, to Ibn Fahd, who mentioned him in his Muʿjam, and to others.
