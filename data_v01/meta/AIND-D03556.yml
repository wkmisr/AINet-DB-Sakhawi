translation:
  ja: アブドゥル・ラフマーン・ブン・アフマド・ブン・ハサン・ブン・アッ＝シュフナ・アル＝バアリー。ヒジュラ暦783年にバールベックで生まれ、同地で育った。彼はアッ＝ザイン・アブドゥル・ラフマーン・ブン・アッ＝ザウブーブ（アッ＝ハッジャールからの伝承による）から『サヒーフ（・アル＝ブハーリー）』を聴聞した。ハディースを伝承し、学生たちが彼から聴聞した。私が［ハディースを求めて］旅に出る前に亡くなったと思われる。
  en: ʿAbd al-Raḥmān b. Aḥmad b. Ḥasan b. al-Shuḥna al-Baʿlī. He was born in Ba'labakk in the year 783 AH and grew up there. He heard the Sahih [al-Bukhari] from al-Zayn ʿAbd al-Raḥmān b. al-Zaʿbūb, on the authority of al-Ḥajjār. He transmitted hadith and students heard from him. He passed away, I believe, before I set out on my travels.
