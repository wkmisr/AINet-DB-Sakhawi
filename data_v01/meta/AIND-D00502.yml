translation:
  ja: バハーウッディーン・アフマド・ブン・アリー・ブン・ムハンマド・ブン・スライマーン・アル＝アンサーリー・アッ＝タターイー（出自）の息子アフマド。父（の伝記）は後述される。868年ジュマーダー・アル＝アーヒラ月28日水曜日、メッカで没した。イブン・ファハドがその（没年を）記録している。父の没後に生まれ、その名にちなんで命名されたようである。
  en: Ahmad b. Bahāʾ al-Dīn Aḥmad b. ʿAlī b. Muḥammad b. Sulaymān al-Anṣārī al-Tatāʾī al-Aṣl. His father is mentioned later. He died on Wednesday, the 28th of Jumādā al-Ākhira in 868 AH in Mecca. Ibn Fahd recorded his death date. It seems he was born after his father and named after him.
