translation:
  ja: カースィム・ブン・ムハンマド・ブン・ムスリム・ブン・マフルーフ・アッ＝タルージー・アル＝アスル・アッ＝サカンダリー（タルージャ出身で、アレクサンドリアの人）。イブン・アル＝ムラッキンに『アッ＝シファー』を聴聞した。我らがシャイフ（イブン・ハジャル）は『ムウジャム』で彼に言及して言う。「アブー・ハーミド・イブン・アッ＝ディヤーのイスティドアー（イジャーザ請求状）において私の子供たちにイジャーザを授与した。すなわち（8）17年のことである」。（イブン・ハジャルは）言う。「彼は（ハディースを）伝えていた」。そして（それ以上は）空白のままにした。
  en: 'Qāsim b. Muḥammad b. Muslim b. Makhlūf al-Tarūjī al-Aṣl al-Sakandarī (of Tarūja origin, from Alexandria). He heard al-Shifāʾ from Ibn al-Mulaqqin. Our shaykh (Ibn Ḥajar) mentioned him in his Muʿjam and said: "He granted an ijāza, in the petition (istidʿāʾ) of Abū Ḥāmid Ibn al-Ḍiyāʾ, to my children, that is, in the year [8]17." He said: "He used to transmit [hadith]," and left the rest blank.'
