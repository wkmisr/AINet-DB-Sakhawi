translation:
  ja: アフマド・ブン・ヤルバガー、シャハーブ・アッ＝ディーン、アル＝ウマリー、アル＝ハーサキー、アル＝ハサニー。「サーヒブ・アル＝キース（財布の主）」と呼ばれ、アッ＝ザーヒル・バルクークのウスターズ（師傅）であった。王朝内で重んじられ、その時代のエジプトの有力な軍事指揮官（ムカッダム）の一人であり、のち評議会のアミール（アミール・マジュリス）となった。その後シャーム（シリア）へ追放され、トリポリで職を失って過ごした。その末路は、802年シャアバーン月4日にアイタマシュとともに斬殺されたことであり、その時彼は40歳を超え、70歳に近づいていた。我らがシャイフ（イブン・ハジャル）は『インバーウ（・アル＝グムル）』において彼に触れていない。
  en: Aḥmad b. Yalbaghā, Shihāb al-Dīn, al-ʿUmarī, al-Khāṣṣakī, al-Ḥasanī, known as Ṣāḥib al-Kīs (Master of the Purse) and ustādh (master/tutor) of al-Ẓāhir Barqūq. He was highly esteemed in the state, one of the muqaddams (commanders) in Egypt in his day, then an amīr majlis (amir of the council). He was later exiled to Syria and resided unemployed in Tripoli. His end came when he was slaughtered together with Aytamish on the 4th of Shaʿbān in the year 802 H. At that time he was over forty and close to seventy. Our shaykh (Ibn Ḥajar) omitted him from his Inbāʾ (al-Ghumr).
