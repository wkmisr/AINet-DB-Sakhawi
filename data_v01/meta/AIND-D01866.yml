translation:
  ja: アルナブガー・アッ＝ザーヒリー・バルクーク。 アミール・アシャラ（十人長）を務めた。その師（バルクーク）の存命中の801年ズー・アル＝カアダ月15日日曜日に死去した。アル＝アイニーは彼の没年を記録し、アルナブガー・アル＝ハーフィズィーというニスバで彼を記した。我らがシャイフ（イブン・ハジャル）は、死亡または処刑されたアミールたちの項で、彼をアルナブガーという名でのみ言及した。
  en: Arnabughā al-Ẓāhirī Barqūq served as an amīr ʿashara. He died during the lifetime of his master on Sunday, the 15th of Dhū al-Qaʿda, in the year 801 AH. Al-ʿAynī recorded his death date and gave his nisba as Arnabughā al-Ḥāfiẓī. Our shaykh (Ibn Ḥajar) confined his mention to the name Arnabughā among those amirs who died or were executed.
