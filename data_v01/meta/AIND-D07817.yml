translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ユースフ、ファトフッディーン・ブン・アル＝ジャマール・ブン・アル＝ムヒッブ・ブン・アル＝ジャマール・ブン・ヒシャーム・アル＝アンサーリー・アル＝カーヒリー・アル＝ハンバリー。父は前述、祖父は後述。成長してクルアーンを暗記し、アル＝バドル・アル＝マーリダーニーのもとで相続法（ファラーイド）などを学び、彼から（教授の）許可を得た。また、アル＝アラー・アル＝バグダーディー・アッ＝ディマシュキーがカイロにいたとき彼に少し読誦し、カーディーの講義に出席した。諸施設の職禄を得、アッ＝ザイニーヤで説教師（ハティーブ）を務め、証人（シャーヒド）として生計を立てた。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh b. Yūsuf, Fatḥ al-Dīn b. al-Jamāl b. al-Muḥibb b. al-Jamāl b. Hishām al-Anṣārī al-Qāhirī al-Ḥanbalī; his father was mentioned above and his grandfather will come below. He grew up, memorized the Qurʾān, studied the law of inheritance and other subjects under al-Badr al-Māridānī, who authorized him; he likewise read a little under al-ʿAlāʾ al-Baghdādī al-Dimashqī when the latter was in Cairo, and attended the lessons of the qāḍī. He obtained stipendiary posts in endowed institutions, preached at al-Zayniyya, and earned his living as a notary-witness.
