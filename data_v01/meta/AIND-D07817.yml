  note:
    ja: '「الماضي أبوه」＝ #AIND-D04594（عبد الله بن محمد بن عبد الله بن يوسف بن عبد الله بن أحمد بن عبد الله بن هشام الجمال أبو محمد بن المحب بن الجمال أبي محمد القاهري الحنبلي ويعرف بابن هشام、790年以降生）。ナサブ一致（規則37）。初版の汚染番号 #TMP-P-000490 を置換。ニスバ索引 #AIND-D12798「ابن هشام … وابن أولهما الجمال عبد الله وابناه المحب محمد وفتح الدين محمد」で本項主と兄弟 المحب محمد が確認できるが、兄弟は本項で名指しされないため relation は立てない（規則23）。'
