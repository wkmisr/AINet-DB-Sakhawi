translation:
  ja: ドゥラート・バーイ・アル＝アシュラフィー。ハンマームとして知られる。昇進を重ねてアル＝ザーヒル・タムルブガーの時代に10人長を兼ねる第二ラアス・ナウバ（近侍隊長）に就任し、次いでシャード・アル＝シャルブ・ハーナハ（飲料監督官）を務め、アレクサンドリアの副王（総督）に任命された。同地において883年ラジャブ月に死去した。彼の後任の総督にはイーナール・アル＝アシュラフィー・カーイトバーイが就任した。
  en: Dawlāt Bāy al-Ashrafī, known as Ḥammām. He rose through the ranks until he was appointed as the Second Ra's Nawba over a command of ten during the reign of al-Ẓāhir Tamurbughā, then served as the Shādd al-Sharb-khānāh (supervisor of the buttery), and was appointed as the governor of Alexandria, where he died in Rajab, year 883. He was succeeded in the governorship by Īnāl al-Ashrafī Qāytbāy.
