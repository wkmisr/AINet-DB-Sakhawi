translation:
  ja: アハマド・ブン・イブラーヒーム・ブン・スライマーン、シャハーブ・アッ＝ディーン、アッカーリー、その後タラーブルスィー、シャーフィイー派。祖父がアラム・アッ＝ディーンというラカブを持ったことから、イブン・アル＝アラムとして知られる。故郷でアル＝ブルキーニーらに法学を学び、その後ダマスカスに入り、そこでアル＝イマード・アル＝ハスバーニーについて学んだ。アル＝サドル・アル＝ヤースーフイーとともにハラブへ旅し、770年に、彼（ヤースーフィー）の朗読によって、二人のカマール（アル＝カマール・ムハンマド・ブン・ナスルッラー・イブン・アン＝ナッハースとアル＝カマール・イブン・ハビーブ）およびアフマド・ブン・カトルーらから聴聞した。アッカール（ʿAkkār）のカーディー職に任じられ、美徳を備えていた。証言で生計を立てていた。アラー・ブン・ハティーブ・アン＝ナースィリーは語る、「彼にはタラーブルスで会ったが、彼は有徳な人物であった」。タラーブルスで808年サファル月に死去。彼がハディースを伝えたとは知らない。我らがシャイフ（イブン・ハジャル）は彼のことをインバー・アル＝ガムルで言及している。
  en: Aḥmad b. Ibrāhīm b. Sulaymān, Shihāb al-Dīn al-ʿAkkārī, then al-Ṭarābulusī, Shāfiʿī. He was known as Ibn al-ʿAlam because his grandfather was given the laqab ʿAlam al-Dīn. He studied fiqh in his hometown (ʿAkkār) under al-Bulqīnī and others. He then entered Damascus and studied there under al-ʿImād al-Ḥasbānī. He traveled with al-Ṣadr al-Yāsūfī to Aleppo, where, through his (al-Yāsūfī’s) recitation, he heard in the year 770 H from the two Kamāls — Muḥammad b. Naṣr Allāh b. Aḥmad Ibn al-Naḥḥās and (al-Kamāl) Ibn Ḥabīb — and from Aḥmad b. Qaṭlū and others. He was appointed qāḍī of ʿAkkār, possessed virtue, and earned a living through giving testimony. Al-ʿAlāʾ b. Khaṭīb al-Nāṣiriyya said, "I met him in Tripoli, and he was a virtuous man." He died in Tripoli in Ṣafar of the year 808 H. I do not know that he transmitted ḥadīth. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ al-Ghumr.
