translation:
  ja: ウバイド、アブドゥルガニーとも呼ばれる、軍務書記アル＝ファフル・イブン・アル＝ジーアーンの子。私は、我らが師（イブン・ハジャル）の初期の『アマーリー』を聴聞した者たちのなかに、アル＝ファフル・ブン・…の筆跡でこのように書かれているのを見た。思うに、彼が「〜とも呼ばれる」と述べたのは誤りで、むしろ彼はアブドゥルワッハーブ・ブン・アル＝ファフル・ブン・アブドゥルガニーである。
  en: ʿUbayd, also called ʿAbd al-Ghanī, son of the army scribe al-Fakhr Ibn al-Jīʿān. Thus I saw it written in the hand of al-Fakhr b. … among those who heard from our shaykh (Ibn Ḥajar) in his early Amālī; I think he erred in saying "also called", and that he is rather ʿAbd al-Wahhāb b. al-Fakhr b. ʿAbd al-Ghanī.
