translation:
  ja: ウマル・ブン・ムハンマド・アッ＝シラージュ・アブー・ハフス・アン＝ヌワイリー・アッ＝シャーフィイー。諸書を暗記し、二人のジャマール、すなわちイブン・ハティーブ・アル＝マンスーリーヤとアッ＝タイマーニーから学んだ。多くの問題を収めた簡約書を編んだ。父の後にタラーブルス（トリポリ）のカーディー職に就き、その職務ぶりは良好で問題なかった。（8）33年ジュマーダー・アル＝アーヒラ月に同地でペストにかかって没した。50歳に近かった。我らがシャイフ（イブン・ハジャル）の『インバー』には、父の名なしに簡略に載っている。
  en: ʿUmar b. Muḥammad al-Sirāj Abū Ḥafṣ al-Nuwayrī al-Shāfiʿī. He memorized books and studied under the two Jamāls, Ibn Khaṭīb al-Manṣūriyya and al-Ṭaymānī, and compiled an abridgement containing many questions. He held the judgeship of Tripoli after his father, and his conduct of the office was good and unobjectionable. He died there of the plague in Jumādā al-Ākhira of the year (8)33, when he was close to fifty. He appears in our shaykh's Inbāʾ, briefly and without his father's name.
