translation:
  ja: ハリル・ブン・アル＝ワズィール・ジャマール・アッ＝ディーン・ブン・ビシャーラ・アッ＝ディマシュキー。彼は聡明で歴史を好む若者であり、歴史（年代記）を編纂し、出来事を記録・整理して、優れた事柄について議論（学術的対話）を交わしたが、享楽にもふけった。壮年に達する前の815年に没した。我らがシャイフ（イブン・ハジャル）がその年代記（『インバー・アル＝グムル』）で彼について言及している。
  en: Khalīl ibn al-Wazīr Jamāl al-Dīn ibn Bishāra al-Dimashqī. He was a clever and intelligent youth who loved history, compiled a chronicle, recorded and organized historical events, and engaged in pleasant scholarly discussions, though he was also inclined to pleasure. He died in the year 815 before reaching maturity. Our shaykh (Ibn Ḥajar) mentioned him in his chronicle (Inbāʾ al-Ghumr).
