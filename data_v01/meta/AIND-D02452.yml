translation:
  ja: ジャウバーン・アッ＝ザーヒル・バルクーク・アル＝ムアッリム。その主人（ウスターズ＝アッ＝ザーヒル・バルクーク）の時代に王室マムルーク（ハーッサキー）かつ槍術教師であった。トルコ系の生まれで、心根の純良な人物であった。その時代における槍術教育の頂点は彼に帰し、ムアイヤド期、次いでアシュラフ・バルスバーイ期には、その道の者たちの間の裁定者となるほどであった。老齢に達した後も、その教育における力量を保ち続けた。ヒジュラ暦830年代に没した。
  en: Jawbān al-Ẓāhir Barqūq al-Muʿallim. He was a khāṣṣakī and spear instructor in the days of his master (al-Ẓāhir Barqūq). Turkish by origin and sound of heart, he attained the leadership in spear instruction in his time, such that he acted as arbiter among its practitioners in the Muʾayyadī and then the Ashrafī (Barsbāy) days. He maintained his strength in teaching even after his old age. He died in a year in the (8)30s AH.
