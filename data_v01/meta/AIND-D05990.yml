translation:
  ja: ウマル・ブン・ムハンマド・アッ＝ザイン・アル＝ヒムスィー、のちアッ＝ディマシュキー・アッ＝シャーフィイー。自派（シャーフィイー派）におけるダマスクスの優れた人々の一人で、『ラウダ』の多くを諳んじ、信仰心と善性を備えていた。生計は自ら動かす絹の織機によっていた。（8）03年シャウワール月に没した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼を挙げている。
  en: ʿUmar b. Muḥammad al-Zayn al-Ḥimṣī, then al-Dimashqī, al-Shāfiʿī. One of the distinguished men of Damascus in his school, among those who had much of al-Rawḍa at their command, together with piety and goodness; he earned his living from silk looms that he worked himself. He died in Shawwāl of the year (8)03. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
