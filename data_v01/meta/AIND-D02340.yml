translation:
  ja: ジャーンバーイ・アシュラフィー・カーイトバーイ。彼は（スルタン・カーイトバーイの）姉妹の息子であり、また（軍の）十人長の一人であった。彼はアレクサンドリア総督カーイム・クシールのイクター（封土）を引き継いだが、間もなく881年に疫病で（一説には刺されて）死んだ。
  en: Jānbāy al-Ashrafī Qāytbāy. He was the son of his (Sultan Qaytbay's) sister and one of the 'Officers of Ten'. He took over the iqṭāʿ of Qāʾim Qushayr, the nāʾib of Alexandria, and soon afterwards died — plague-stricken (or possibly stabbed) — in the year 881.
