translation:
  ja: アブド・アル＝カリーム・ブン・ムハンマド・ブン・アブド・アッラー・ブン・ムハンマド・ブン・ムーサー・アッ＝ダミーリー・アル＝マッキー、薬種商（アッタール）。優れた人々の一人で、優しさと善良さを備えていた。876年シャアバーン月末日にマッカで没した。イブン・ファフドがその没年を記録し、さらに「ムハンマド・ブン・ムハンマド・ブン・ムーサー・ブン・イーサー・ブン・アブド・アッラーの息子」の項で彼を重ねて挙げているが、正しくは彼の祖父はムハンマド・ブン・アブド・アッラー・ブン・ムーサー・ブン・イーサーである。
  en: ʿAbd al-Karīm b. Muḥammad b. ʿAbd Allāh b. Muḥammad b. Mūsā al-Damīrī al-Makkī, the druggist, one of the good men, possessed of gentleness and goodness. He died in Mecca at the end of Shaʿbān of the year 876. Ibn Fahd recorded his death and repeated him under "son of Muḥammad b. Muḥammad b. Mūsā b. ʿĪsā b. ʿAbd Allāh", but the correct form is that his grandfather was Muḥammad b. ʿAbd Allāh b. Mūsā b. ʿĪsā.
