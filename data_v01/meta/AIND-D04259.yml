translation:
  ja: アブド・アル＝カリーム・ブン・アブド・アル＝ジャッバール・ブン・イブラーヒーム・ブン・カルシャーン・アッ＝タブリーズィー。イブン・ファフド（アン＝ナジュム）はその父（アッ＝タキー）の『ムウジャム』で、彼が831年ズー・アル＝ヒッジャ月に自分は74歳であると述べたと記している。また（アッ＝タキーは）「彼にはタフスィール（クルアーン注釈）があり、私はそのうちの一部を彼に読んだ」と述べている。
  en: 'ʿAbd al-Karīm b. ʿAbd al-Jabbār b. Ibrāhīm b. Karshān al-Tabrīzī. Ibn Fahd (al-Najm) said in his father''s Muʿjam that he stated in Dhū al-Ḥijja of the year 831 that he was seventy-four years old; and he (al-Taqī) said: "He has a Tafsīr, part of which I read to him."'
