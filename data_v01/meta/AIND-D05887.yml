translation:
  ja: ウマル・ブン・アブドゥッラー・アル＝ウラビー・アッ＝シャーフィイー。熱心に学問に励み、ウマイヤ・モスクにこもって少年たちにクルアーンと『アッ＝タンビーフ』を教え、彼らに解説したので、多くの人々が彼から益を得た。静かで、人付き合いを避ける人であった。（80）3年ラマダーン月に没した。我らがシャイフが『インバー』で彼について記している。
  en: ʿUmar b. ʿAbd Allāh al-ʿUlabī al-Shāfiʿī. He studied a great deal and secluded himself in the Umayyad Mosque, teaching the youths the Qurʾān and al-Tanbīh and explaining them to them, so that a number of people benefited from him; he was quiet and withdrawn. He died in Ramaḍān (80)3. Our shaykh mentioned him in his Inbāʾ.
