translation:
  ja: ルル・サアド・アッ＝ディーン。アッ＝サイイド・アル＝ジュルジャーニーの門弟のうち随一の人物。サイード・アッ＝スアダー（ハーンカー）のシャイフであるアル＝アラー・アル＝キルマーニーとサラーム・アッラーが彼から学んだ。
  en: Lur Saʿd al-Dīn, the foremost of the students of al-Sayyid al-Jurjānī. Among those who studied under him were al-ʿAlāʾ al-Kirmānī, shaykh of Saʿīd al-Suʿadāʾ, and Salām Allāh.
