- text: '本項主の名は #AIND-D03121 によれば「سعد الدين محمد المدعو لر」（لر は山地の部族名による呼称）。他項の情報なので persName には加えず note に留める（規則23）。#AIND-D05716 は本項主を「من طلبة التفتازاني」とし、本項の「تلامذة السيد الجرجاني」と師の記述が異なる（両立しうる）。'
