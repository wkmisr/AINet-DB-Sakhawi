  ja: タンム・アル＝ムハンマディー。アブー・バクル・ブン・サルガーイの妻の父で、バーシティーヤの商人であった。私（サハーウィー）の許に幾度か訪れ、892年に『ムサルサル』や『ブハーリー』の一部を私から聴聞した。
  en: Tanam al-Muḥammadī, father of the wife of Abū Bakr b. Ṣalghāy, and a merchant of al-Bāsṭiyya. He visited me several times and heard from me al-Musalsal and part of al-Bukhārī in the year 892 H.
