translation:
  ja: アフマド・ブン・ウマル・ブン・ムハンマド・ブン・アブー・バクル・ブン・ムハンマド・シハーブ・アッ＝ディーン・ブン・アル＝ムヒッブ・ブン・アッ＝シャムス・アル＝フスースィー、後にアル＝カーヒリーでシャーフィイー派法学者。後に記すアシール・アッ＝ディーン・ムハンマドの兄弟である。我らがシャイフ（イブン・ハジャル）の口述集から多くを聴聞し、証人職で生計を立て、その職務において秀でたが、彼の兄弟よりは遅れて世に出た。
  en: Aḥmad b. ʿUmar b. Muḥammad b. Abī Bakr b. Muḥammad Shihāb al-Dīn b. al-Muḥibb b. al-Shams al-Khuṣūṣī, then al-Qāhirī, the Shāfiʿī. He was the brother of Athīr al-Dīn Muḥammad, who will be mentioned later. He heard much from our shaykh (Ibn Ḥajar) from his dictations, earned his living through notarization (shahāda), excelled in it, but came after his brother.
