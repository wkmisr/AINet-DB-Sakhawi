translation:
  ja: アリー・ブン・アブド・アッ＝サラーム・ブン・アッ＝シャイフ・アフマド・ブン・アリー・ブン・サイイドゥフム・アン＝ナフリーリー・アッ＝シャーフィイー・アッ＝リファーイー。イブン・ヒムスィース（ḥ は点なしで母音 a、二つの ṣ は点なしで最初のものは母音 i）として知られる。801年にナフラーリーヤで生まれた。854年の末に同地で没したと思われる。
  en: ʿAlī b. ʿAbd al-Salām b. al-Shaykh Aḥmad b. ʿAlī b. Sayyidihim al-Naḥrīrī al-Shāfiʿī al-Rifāʿī, known as Ibn Ḥimṣīṣ (with undotted ḥ vocalised a, and two undotted ṣ, the first vocalised i). He was born in the year 801 at al-Naḥrāriyya, and died there, presumably, at the end of the year 854.
