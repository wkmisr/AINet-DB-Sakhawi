translation:
  ja: ムハンマド・ブン・アブドゥルガニー・ブン・アブドゥッラッザーク、ナースィル・アッ＝ディーン・イブン・アル＝ファフル・イブン・アビー・アル＝ファラジュ。前述のアフマドの兄弟で、その双子である。ディムヤート（ダミエッタ）のナーイブ職に就いて一年間在任した。彼と兄弟の名を冠した搾油所（マアサラ）がある。ハッジを行い、ムジャーワラ（聖地滞在）をした。853年頃にカイロで没した。
  en: Muḥammad b. ʿAbd al-Ghanī b. ʿAbd al-Razzāq, Nāṣir al-Dīn b. al-Fakhr b. Abī al-Faraj, brother of the aforementioned Aḥmad and his twin. He held the deputy governorship of Damietta and remained in it for a year. A press (maʿṣara) is named after him and his brother. He performed the pilgrimage and stayed as a mujāwir. He died in Cairo in about the year 853.
