translation:
  ja: アブド・アッ＝ラティーフ・ブン・アブド・アル＝カーディル・ブン・アリー・ブン・ザーイド・アル＝マッキー。後述のアブー・サアドの兄弟。マッカで私（サハーウィー）から聴聞した者の一人で、クルアーンと諸書を暗記して提示（暗誦）し、マディーナを参詣した。祝福された人物である。
  en: ʿAbd al-Laṭīf b. ʿAbd al-Qādir b. ʿAlī b. Zāyid al-Makkī, brother of Abū Saʿd (mentioned below). He was among those who heard from me in Mecca; he memorized the Qurʾān and books which he recited (for examination), and visited Medina. He is a blessed man.
