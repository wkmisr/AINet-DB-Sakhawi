translation:
  ja: ハミース・ジルバーシュ・アル＝ハサニー。メッカの司令官アッ＝サイイド・ハサン・ブン・アジュラーンの解放奴隷（マウラー）。ハジュリー暦849年ラマダーン月にメッカ郊外で死去し、メッカに運ばれてアル＝ムアッラー墓地に埋葬された。イブン・ファハドが彼の死去を記録している。
  en: Khamīs Jirbāsh al-Ḥasanī, the client (mawla) of al-Sayyid Ḥasan b. ʿAjlān, the commander of Mecca. He died outside Mecca in Ramaḍān 849 AH, and was carried to Mecca where he was buried in al-Muʿallā. His death was recorded by Ibn Fahd.
