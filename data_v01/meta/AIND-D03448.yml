translation:
  ja: トゥールー・ブン・アリー・バーシャー・アッ＝ザーヒリー・バルクーク。彼はバルクークの側近マムルーク（ハーッサキーヤ）の有力者であり、その後、アミール（司令官）に昇進した。続いてガザの代理官（ナーイブ）、さらにアレクサンドリアの代理官を務め、その後、千人隊長（ムカッダム）の一人となった。さらにシャイフおよびジャカムと同盟を結んでシリアに留まり、808年ラマダーン月までそこにとどまった。その後、サファドの代理官に任命されたが、同年のズー・アル＝ヒッジャ月にハマーとホムスの間で起きた戦闘で戦死した。彼は、少し前に記述のあったアミール・アーホール（厩舎長）のトゥーガーン（直前に既出）の主人（ウスターズ）である。
  en: Tūlū b. ʿAlī Bāshā al-Ẓāhirī Barqūq. He was one of the elites of the royal mamluks (khāṣṣakiyya) of al-Ẓāhir Barqūq and was promoted to amir after him. He then governed Gaza, then Alexandria, and became one of the commanders of a thousand (muqaddamūn). He joined with Shaykh and Jakam, staying in Syria until Ramadan of the year 808 AH, when he was appointed governor of Safad until he was killed in a battle between Hama and Homs in Dhu al-Hijjah of that year. He was the master of Tūghān Amīr Ākhūr, who was mentioned recently.
