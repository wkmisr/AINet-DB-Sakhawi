  ja: スライマーン・ブン・アリー・ブン・スライマーン・ブン・ワフバーン・アル＝マダニー。（8）50年にアッ＝タージ・アブドゥルワッハーブ・ブン・ムハンマド・ブン・スルフのもとで『ムワッタァ』を読み、それ以前の（8）47年ラマダーン月にはアッ＝シハーブ・アフマド・ブン・ムハンマド・アッ＝スバイビーのもとで『シファー』を読んだ。
  en: Sulaymān b. ʿAlī b. Sulaymān b. Wahbān al-Madanī. He read the Muwaṭṭaʾ under al-Tāj ʿAbd al-Wahhāb b. Muḥammad b. Ṣulḥ in the year [8]50, and before that the Shifāʾ under al-Shihāb Aḥmad b. Muḥammad al-Ṣubaybī in Ramaḍān of the year [8]47.
