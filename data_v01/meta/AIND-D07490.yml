translation:
  ja: ムハンマド・ブン・サダカ・ブン・サーリフ・アル＝マタリー・アル＝カーヒリー。バルキーニー家の一党の一人で、アッ＝シャムス・アル＝マタリーとして知られる。［ヒジュラ暦］808年シャアバーン月に生まれた。説教の集会やハディースの講会に列席し、いくつかの店で布商（バッザーズ）として生計を立て、サイード・アッ＝スアダー（ハーンカー）などに（給費生として）籍を置いた。彼については（芳しくない）取り沙汰がある。［8］92年ラビーウ・アッ＝サーニー月22日の夜に没した。神が彼を赦したまわんことを。
  en: Muḥammad b. Ṣadaqa b. Ṣāliḥ al-Maṭarī al-Qāhirī, one of the retinue of the Bulqīnī household, known as al-Shams al-Maṭarī. He was born in Shaʿbān of the year 808. He attended preaching sessions and ḥadīth assemblies, earned his living as a cloth-merchant in some shops, and was enrolled in Saʿīd al-Suʿadāʾ and elsewhere; there is (unfavourable) talk about him. He died on the night of the 22nd of Rabīʿ al-Thānī of the year [8]92, may God pardon him.
