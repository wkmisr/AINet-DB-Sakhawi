translation:
  ja: ムーサー・ブン・スライマーン・ブン・アブドゥルカリーム、アッ＝シャラフ、アッ＝シャーミー、のちアル＝カーヒリー、アッ＝シャーフィイー、アル＝クトゥビー（書籍商）。イブン・アブドゥルカリームとして知られる。『アッ＝シャーティビーヤ』を暗記によってアッ＝シャムス・アル＝アスカラーニーの前で読み、彼のもとで七読誦法によって朗誦した。書籍（の売買）で生計を立て、その分野で非常に卓越していた。（8）37年シャウワール月に没した。彼から学んだ者の中にイブン・ファハドがおり、彼の伝記を書いている。
  en: Mūsā b. Sulaymān b. ʿAbd al-Karīm, al-Sharaf al-Shāmī, then al-Qāhirī, al-Shāfiʿī, al-Kutubī (the bookseller), known as Ibn ʿAbd al-Karīm. He read al-Shāṭibiyya from memory before al-Shams al-ʿAsqalānī and recited (the Qurʾān) to him according to the seven readings. He made his living in the book trade and excelled greatly in it. He died in Shawwāl of the year (8)37. Among those who studied under him was Ibn Fahd, who wrote his biography.
