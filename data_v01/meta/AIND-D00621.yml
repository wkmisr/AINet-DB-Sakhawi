translation:
  ja: アフマド・ブン・アビー・バクル・ブン・マフムード・ブン・ムハンマド・アッ=ダマンフーリー・アル=カーヒリー。父と共にアッ=サラーフ・アッ=ザフターウィー、アル=ハッラーウィー、アッ=スワイダーウィー、アル=アブナースィー、アル=グマーリー、イブン・アッ=シャイハ、アル=マラーギーから『ブハーリー』の修了を聴聞した。アル=ビカーイーが彼に言及しているが、私（＝サハーウィー）は彼に会っていない。
  en: Aḥmad b. Abī Bakr b. Maḥmūd b. Muḥammad al-Damanhūrī al-Qāhirī. He heard the completion of al-Bukhārī's work with his father from al-Ṣalāḥ al-Zaftāwī, al-Ḥalāwī, al-Suwaydāwī, al-Abnāsī, al-Ghumārī, Ibn al-Shaykha, and al-Marāghī. Al-Biqāʿī mentioned him, but I (al-Sakhāwī) did not meet him.
