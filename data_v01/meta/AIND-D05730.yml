translation:
  ja: アリー・ヌール・アッ＝ディーン・アン＝ナフヤーウィー・アル＝カーヒリー、説教師（ワーイズ）、アル＝ジャマーリーヤのスーフィーの一人。875年ラジャブ月に没した。物静かで悪くない人物で、優れた説教師の一人であった。アブドゥルカーディル・アル＝ファーフーリーが彼の娘と結婚して娘婿となり、彼女は彼（娘婿）の病苦に耐えた。
  en: ʿAlī Nūr al-Dīn al-Nahyāwī al-Qāhirī, the preacher (wāʿiẓ), one of the Sufis of al-Jamāliyya. He died in Rajab of the year 875. He was quiet and unobjectionable, one of the best preachers. ʿAbd al-Qādir al-Fākhūrī became his son-in-law by marrying his daughter, and she bore his (ʿAbd al-Qādir's) affliction with patience.
