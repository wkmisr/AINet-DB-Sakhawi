translation:
  ja: アフマド・ブン・ヤフヤー・ブン・アビー・アブドゥッラー・ムハンマド・ブン・アフマド。シャリーフ、カーディー・アル＝ジャマーア、アブー・アル＝アッバース・アル＝ハサニー・アル＝ティルムサーニー・アル＝マグリビー・アル＝マーリキー。アル＝クーンジー著『アル＝ジュマル』の注釈者の孫。彼からアブー・アブドゥッラー・ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・アリー・ブン・アル＝アズラクが学んだが、彼は長生きした者の一人であり、896年には生存していた。
  en: Aḥmad b. Yaḥyā b. Abī ʿAbd Allāh Muḥammad b. Aḥmad, al-Sharīf, Qāḍī al-Jamāʿa, Abū al-ʿAbbās al-Ḥasanī al-Tilimsānī al-Maghribī al-Mālikī. Grandson of the commentator on al-Jumal by al-Khūnajī. Abū ʿAbd Allāh Muḥammad b. ʿAlī b. Muḥammad b. ʿAlī b. al-Azraq took knowledge from him, and it is said that he was among those who lived long; he was alive in 896 H.
