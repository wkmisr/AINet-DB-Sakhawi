notes:
- text: 'خضر الكردي — Mentioned in the biographical entry of Khiḍr al-Kurdī. Identified with AIND-D02854 (خضر الكردي الشافعي نزيل الشامية البرانية), whose own entry mutually references him: "وربما كان يتجاذب مع ضياء نزيل الشامية أيضا" (he would sometimes quarrel with Ḍiyāʾ, also a resident of al-Shāmiyya).'
  type: cross-reference
translation:
  ja: ディヤー・ブン・ムハンマド・アル＝ハーリー・アル＝ハウラーニー・アッ＝シャーフィイー、通称アル＝アウラジュ（跛者）。ヒジュラ暦865年にアン＝ヌービーのイジャーザ（授権状）に証人として署名した。ダマスカスのシャーミーヤ・アル＝バッラーニーヤ・マドラサに居住して法学（フィクフ）を教え、異邦人、特にヒジャーズ地方からの人々を厚くもてなしたと伝えられる。ヒジュラ暦896年ムハッラム月（1491年11月）に死去。キドル・アル＝クルディーの伝記にも彼に関する言及がある。
  en: Ḍiyāʾ b. Muḥammad al-Ḥārī al-Ḥawrānī al-Shāfiʿī, known as al-Aʿraj (the lame). He witnessed the ijāza of al-Nūbī in the year 865 AH. It reached me that he used to reside in al-Shāmiyya al-Barrāniyya Madrasa in Damascus, teaching jurisprudence (fiqh) and showing hospitality to strangers, especially those from the Hijaz. He died in Muharram, 896 AH. He is also mentioned in the biography of Khiḍr al-Kurdī.
