translation:
  ja: アフマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド、アル＝ムヒッブ・アル＝クラシー・アッ＝ズバイリー・アン＝ヌワイリー・アル＝ミスリー。ヒジュラ暦七六九年ズー・アル＝ヒッジャ月一九日火曜日に生まれた。アッ＝タキー・ブン・ハーティムから聴聞したと伝えられる。イブン・ファフドが自著の『ムアジャム』で彼に言及しているが、それ以上は記していない。（ヒジュラ暦）八三四年に、いくつかの要請に応じてイジャーザを与えた。
  en: Aḥmad b. Muḥammad b. Muḥammad b. Muḥammad, al-Muḥibb al-Qurashī al-Zubayrī al-Nuwayrī al-Miṣrī. He was born on Tuesday, the 19th of Dhū al-Ḥijja in the year 769 H. He is reported to have heard from al-Taqī b. Ḥātim. Ibn Fahd mentioned him in his muʿjam without adding more. In 834 H he granted ijāza in response to some requests.
