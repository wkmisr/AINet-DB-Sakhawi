translation:
  ja: ファーリス・アル＝バクタムリー、（主人は）バクタムル・アッ＝サアディー。イーナールにそのアミール時代から仕え、彼がスルタンになると小ダワーダールの一人に任じられた。その後（イーナールの治世の）後に試練（失脚）に遭い、自宅に籠っていたが、やがてアル＝アシュラフ・カーイトバーイが彼を十人長アミールに任じた。その後スワールへの遠征に出て、そこで殺された。伝えられるところでは、礼節と品格の点で悪くない人物であった。神よ彼を憐れみたまえ。
  en: Fāris al-Baktamarī, (mamlūk of) Baktamur al-Saʿdī. He served Īnāl during his amirate, and when the latter became sultan he made him one of the junior dawādārs. Afterwards he suffered a disgrace and kept to his house, until al-Ashraf Qāytbāy made him an amir of ten; then he went out on the expedition against Suwār and was killed there. He was, it is said, not bad in manners and decorum. May God have mercy on him.
