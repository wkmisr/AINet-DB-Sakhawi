translation:
  ja: アリー・ブン・ムハンマド、ヌール・アッ＝ディーン・アル＝ミーカーティー（時刻係）・アル＝ムナッジム（占星術師）、イブン・アッ＝シャーヒドとして知られる。天文表（ズィージュ）の解読と暦の作成において第一人者となり、砂占いなどにも通じ、店でそれを生業として名を知られ、有力者たちの寵を得た。晩年にはアッ＝ザーヒル・バルクークのもとで声望が上がり、彼は本項主を近づけて自らのマドラサに住まわせた。801年ムハッラム月に没した。我らがシャイフ（イブン・ハジャル）は『インバー』と『ムウジャム』で彼に言及し、「彼には何度も会った」と述べている。またマクリーズィーも『ウクード』で言及している。
  en: ʿAlī b. Muḥammad, Nūr al-Dīn al-Mīqātī (the timekeeper) al-Munajjim (the astrologer), known as Ibn al-Shāhid. He became the foremost authority in solving astronomical tables (zīj) and writing almanacs, with knowledge of geomancy and other things; he earned his living by this in a shop, became famous and won favour with the great. Latterly his standing rose with al-Ẓāhir Barqūq, who brought him close and lodged him in his madrasa. He died in Muḥarram 801. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and his Muʿjam, saying "I met him several times"; and al-Maqrīzī (mentioned him) in his ʿUqūd.
