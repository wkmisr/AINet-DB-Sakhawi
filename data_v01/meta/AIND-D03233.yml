translation:
  ja: スードゥン・アル＝ラッカーシー・アクブガー。最初［の主人アクブガー］ののち、アミール・シャイフに仕えた。シャイフがスルターンに即位すると彼をアミールに任命し、次いでタカッディマ（千人隊長）に昇進させた。タタール（タタル）が執政の時に彼を逮捕して投獄したが、のちにアル＝アシュラフ（バルスバーイ）が彼を釈放し、トリポリのタブルハーナー（四十人隊長）の禄を与えた。彼は830年頃に没するまでそこに留まった。彼は有力者の一人ではなかった。
  en: Sūdūn al-Lakkāshī, [mamlūk of] Aqbughā. After him [his first master Aqbughā], he attached himself to Amir Shaykh. When Shaykh became sultan, he appointed him as an amir, then promoted him to the rank of Taqdima (commander of a thousand). Ṭaṭar arrested and imprisoned him during his administration, until al-Ashraf [Barsbāy] released him and granted him a Tablkhānāh (command of forty) in Tripoli. He resided there until his death around the year 830 AH. He was not among the prominent notables.
