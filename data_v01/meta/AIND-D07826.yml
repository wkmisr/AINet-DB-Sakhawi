translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・イーサー・ブン・ムハンマド、アッ＝シャムス・ブン・アル＝ジャマール・アル＝アウフィー・アル＝カーヒリー・アッ＝シャーフィイー。前述のアフマドの兄弟で、二人の父も前述、息子のアブー・アン＝ナジャー・ムハンマドは後述。先祖と同じくイブン・アッ＝ザイトゥーニーとして知られる。ジャーミウ・アッ＝タワーシーで説教師（ハティーブ）を務め、証人（シャーヒド）として生計を立てた。物静かな人であった。870年に没した。アッラーの慈悲あれ。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad b. ʿĪsā b. Muḥammad, al-Shams b. al-Jamāl al-ʿAwfī al-Qāhirī al-Shāfiʿī, brother of the aforementioned Aḥmad—their father was mentioned above too—and father of Abū al-Najā Muḥammad, who will come below; known like his forebears as Ibn al-Zaytūnī. He preached at the Jāmiʿ al-Ṭawāshī and earned his living as a notary-witness, and was a quiet man. He died in the year [8]70; may God have mercy on him.
