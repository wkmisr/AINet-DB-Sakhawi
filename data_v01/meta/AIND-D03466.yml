translation:
  ja: アーミル・アル＝ハイフィー。867年ズー・アル＝カアダ月の末日に没。イブン・ファハドが『ザイル（続編）』で彼について言及している。彼は話し相手（ナディーム）であり、詩の朗詠者（ムンシド）でもあり、時に詩を作ることもあった。没する前に言葉が不自由になった。アフマド・ブン・サアド・アル＝ハイフィーは既に前述されており、おそらく彼の兄弟であろう。
  en: ʿĀmir al-Khayfī. He died at the end of Dhu al-Qaʿdah in the year 867 AH. Ibn Fahd mentioned him in his supplement (al-Dhayl). He was a companion (nadīm), a reciter of poetry (munshid), and occasionally composed verses. He lost the ability to speak before his death. Aḥmad b. Saʿd al-Khayfī was mentioned earlier; he is perhaps his brother.
