  en: Yūsuf b. Abī al-Ṭayyib, al-Qunshī, al-Makkī. The cloth merchant (bazzāz) was his father; he himself was the perfumer-druggist (ʿaṭṭār). He died in Mecca in al-Muḥarram of the year [8]93.
