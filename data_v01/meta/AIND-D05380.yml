  ja: アリー・ブン・ムハンマド・ブン・アフマド・ブン・ウマル、ヌール・アッ＝ディーン・ブン・アッ＝タージュ・ブン・アッ＝シハーブ・ブン・アッ＝ザーヒド、法学者アッ＝サウーディーの外孫。母はハディージャで、法学者（アッ＝サウーディー）の娘アーイシャの娘である。
  en: ʿAlī b. Muḥammad b. Aḥmad b. ʿUmar, Nūr al-Dīn b. al-Tāj b. al-Shihāb b. al-Zāhid, the daughter's-line descendant (sibṭ) of the jurist al-Saʿūdī; his mother is Khadīja, daughter of ʿĀʾisha, daughter of the jurist.
