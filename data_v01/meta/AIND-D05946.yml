translation:
  ja: ウマル・ブン・ムハンマド・ブン・タグリブ・ブン・アリー・ブン・マフムード、アッ＝ザイン・アブー・ハフス、アッ＝ズフリー・アル＝カイマリー・アル＝ビーリー・アル＝ハラビー、シャーフィイー派、医師（アル＝ハキーム）。文学に携わった者の一人で、韻律学に関するカスィーダを詠んだ。アル＝イッズ・ブン・ファハドが（8）71年に彼から次の詩句を書き取った。「私は人の子（少年）を愛し、我が家に女の姿がちらつくのを見たいとは思わない／なぜなら、望めば彼とは別れられるが、女はヌーフの寿命（のあいだ）私から離れないから」。その他、私が別の箇所に収めたものもある。彼はその後に没した。
  en: 'ʿUmar b. Muḥammad b. Taghlib b. ʿAlī b. Maḥmūd, al-Zayn Abū Ḥafṣ al-Zuhrī al-Qaymarī al-Bīrī al-Ḥalabī, the Shāfiʿī, the physician (al-ḥakīm). He was among those who engaged in literature, and composed a qaṣīda on the science of prosody. Al-ʿIzz b. Fahd wrote down from him, in the year (8)71, his verses: "I love a son of men (a youth), and do not wish to see a woman appearing in my dwelling; / for if I wish I can part from him, whereas she would not leave me for the lifetime of Noah." (He also composed) other things that I have placed elsewhere. He died after that.'
