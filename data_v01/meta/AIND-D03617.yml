translation:
  ja: アブドゥルラフマーン・ブン・アブー・バクル・アル＝ハンバリー。彼は、ヒジュラ暦855年付けの私のエジプトの（イジャーザ）要請書（イスティドアー）の一部にイジャーザを自筆した。彼は一つ前の人物と同一人物であるかのようである。彼の詩に以下がある：「私の涙は激しい炎と焦がれる思いから溢れ出た / 愛の激情の火の熱さと私の思いから / 私の心の炎は私の涙を流させた / 火から水が溢れ出るのを驚くがよい」
  en: 'ʿAbd al-Raḥmān b. Abī Bakr al-Ḥanbalī. He wrote an ijāza in his own hand on some of my Egyptian requests (istidʿāʾs) dated the year 855 AH. It is as if he is the same person as the previous entry. Among his poetry: ''My tears overflowed from the flame and burning / And the heat of the fire of love and my thoughts / The fires of my heart made my tears flow / So marvel at the flood of water from the fire.'''
