translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・ハリール・ブン・バクトゥート・ブン・バイラム・ブン・バクトゥート、クルド系を本貫とするアル＝カーヒリー・アル＝フサイニー、ハンバリー派のアッ＝シャムス・ブン・バイラムの父。彼は私に、778年ラマダーン月に生まれたこと、クルアーンと『クドゥーリー』の一部を暗記したこと、相続法（ファラーイド）を少しかじったこと、アミーン・アル＝フクム（法廷財産管理官）のイブン・アッ＝ザリーフの姉妹の娘と結婚して現在も存命の娘をもうけたことを語った。866年に没した。
  en: ʿAbd Allāh b. Muḥammad b. Khalīl b. Baktūt b. Bayram b. Baktūt, of Kurdish origin, al-Qāhirī, al-Ḥusaynī, father of al-Shams b. Bayram al-Ḥanbalī. He told me that he was born in Ramaḍān 778, that he memorised the Qurʾān and part of al-Qudūrī, that he had some acquaintance with the law of inheritance (farāʾiḍ), and that he married the daughter of the sister of Ibn al-Ẓarīf, the amīn al-ḥukm, by whom he had his daughter, who is still living. He died in the year 866.
