translation:
  ja: ジャーニバク・アン＝ナウルーズィー（同名の別人に続けて「同じく」）。アル＝ザーヒル・ジャクマクは彼を十人長に任じ、その後スィフユーンの副官（ナーイブ）に任じた。彼はその職を罷免され、カイロへ向かう途上、854年ラジャブ月にアリーシュの自宅で亡くなった。彼は勇敢で大胆な人物であった。神が彼を憐れむよう。
  en: Jānibak al-Nawrūzī, likewise (following another of the same name). Al-Ẓāhir Jaqmaq appointed him amir of ten, and then made him nāʾib of Ṣahyūn. He died at his residence in al-ʿArīsh, while on his way to Cairo after having been dismissed from that post, in Rajab 854 AH. He was a courageous and daring man, may God have mercy on him.
