translation:
  ja: マハール・ブン・ファイルーズ・シャー・ブン・ムハンマド・タム・ブン・バハム・タム・ブン・ジュルド・ブン・シャー・ブン・トゥグルク・イブン・タバク・シャー、サイフ・アッ＝ディーン・ブン・クトゥブ・アッ＝ディーン、ホルムズ島とバフライン（バーレーン）の君主。父を殺して王権を独占し、その地位は大きく、その威勢は盛んとなった。彼の時代にホルムズは世界の港（バンダル）となり、インド諸国の船やザイラク（？）が中国の地から来航し、ホラーサーンやサマルカンドなどの商人がそこを目指した。こうして彼の国庫は満ち、その治世は称えられ、その国は栄えた。アル＝マクリーズィーが『ウクード』で彼について詳しく述べているが、没年は記していない。
  en: 'Mahār b. Fīrūz Shāh b. Muḥammad Tam b. Baham Tam b. Jurd b. Shāh b. Ṭughluq ibn Ṭabaq Shāh, Sayf al-Dīn b. Quṭb al-Dīn, lord of the island of Hurmuz and of al-Baḥrayn. He killed his father and seized sole rule; his standing grew great and his power became splendid. In his days Hurmuz became the port (bandar) of the world: ships of the kingdoms of India and the "Zīrak" from the lands of China came to it, and merchants of Khurāsān, Samarqand and elsewhere sought it out, so his treasuries were filled, his conduct was praised and his lands flourished. Al-Maqrīzī mentioned him at length in his ʿUqūd but did not record his death.'
