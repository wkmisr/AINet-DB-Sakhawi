translation:
  ja: イブラーヒーム・ブン・ムハンマド・アル＝アルダビーリー、次いでアッ＝シャマーヒー、シャーフィイー派。 865年の初め、カイロにハッジのために到着した際、彼は約60歳であった。彼は数ヶ月滞在し、信仰心と謙虚さを伴う彼の完全な学識が明らかになった。少し彼から読聞された後、ハッジを行い、シリアのキャラバンと共に帰国した。その後、彼は故郷に戻り、そこでファトワー発布とクルアーン朗誦教授のために訪ねられる人物となり、その地で功績を残した。最後に彼の消息が知られたのは877年のことである。
  en: Ibrāhīm b. Muḥammad al-Ardabīlī, then al-Shmākhī, a Shāfiʿī scholar. He arrived in Cairo for Hajj in early 865 H, being approximately sixty years old. He stayed for several months, and his complete excellence, combined with piety and humility, became evident. A little was read to him (i.e., he received instruction), then he performed the Hajj and returned with the Syrian caravan. He then went back to his homelands, where he was sought for issuing fatwas and teaching Qurʾān recitation, and he had achievements there. The last mention of him was in 877 H.
