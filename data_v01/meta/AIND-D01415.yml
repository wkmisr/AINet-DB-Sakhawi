translation:
  ja: アハマド・ブン・ムハンマド・ブン・アリー・ブン・サーリム・アル＝ワラウィー・アブー・アル＝ハイル・ブン・アル＝ムヒッブ・アッ＝ディマシュキー・アッ＝シャーフィイー。彼の父と祖父については後述する。彼と彼らは「イブン・サーリム」としても知られている。 ヒジュラ暦882年ジュマーダー・アル＝ウーラーの初めにダマスカスで生まれた。クルアーンと『アル＝ミンハージュ』と『ジャムウ・アル＝ジャワーミウ』と『アル＝アルフィーヤ』を暗記し、クルアーンで礼拝を導いた。そして『アル＝ミンハージュ』をシャーミーヤ・アル＝バッラーニーヤで提示した。
  en: Aḥmad b. Muḥammad b. ʿAlī b. Sālim al-Walawī Abū al-Khayr b. al-Muḥibb al-Dimashqī al-Shāfiʿī. His father and grandfather will be mentioned below, and he is known like them as Ibn Sālim. He was born at the beginning of Jumādā al-Ūlā in 882 H in Dimashq. He memorized the Qurʾān, led prayers with it, and memorized 『al-Minhāj』, 『Jamʿ al-Jawāmiʿ』, and 『al-Alfīya』. He presented the first of these works (al-Minhāj) at al-Shāmiyya al-Barrāniyya.
