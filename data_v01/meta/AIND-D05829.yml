notes:
- text: '転送見出し（原文末尾「مضى في أحمد بن حسين بن رسلان」による）。転送先は #AIND-D00688（أحمد بن حسين بن حسن بن علي بن يوسف بن علي بن أرسلان الشهاب أبو العباس الرملي الشافعي نزيل بيت المقدس ويعرف بابن رسلان、844年没）。人物同一の転送ではなく、本項主（ابن رسلان と同時代のエルサレム近辺の聖者）に関する言葉が ابن رسلان の項に引かれている＝「言及先への転送」型。D00688 本文では「وسئل عنه عمر بن حديم العجلوني الزاهد الولي حين قدم القدس أهو من الأولياء فقال …」と、父名が「حديم」と綴られる（本見出しは「حاتم」。綴り揺れを記録、名寄せはしない）。本項は独立の本伝を持たないため REF とする。'
