translation:
  ja: ウマル・ブン・ハーティム・アル＝アジュルーニー、修行者にして聖者。彼には、その徳と偉大さを示すものに数えられる言葉がある。アフマド・ブン・フサイン・ブン・ラスラーン［の項］で前述した。
  en: ʿUmar b. Ḥātim al-ʿAjlūnī, the ascetic, the saint. He has a saying that counts among his merits and his greatness. It was given above under Aḥmad b. Ḥusayn b. Raslān.
