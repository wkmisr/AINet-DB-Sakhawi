translation:
  ja: スライマーン、アラム・アッディーン・ブン・バラービフ。イブン・アブドゥルハックが私に語ったところでは、彼はマーリク派で、医学に秀でていたため、（イブン・アブドゥルハックの）父と共同で（医師の）長職に就いた。彼（スライマーン）は彼（父）の姉妹を娶っており、彼（父）より先に、810年頃に没した。
  en: Sulaymān ʿAlam al-Dīn b. Barābikh. Ibn ʿAbd al-Ḥaqq told me that he was Mālikī in madhhab and one of those who excelled in medicine, so that he held the headship [of the physicians] jointly with my [i.e. Ibn ʿAbd al-Ḥaqq's] father; he was married to his [the father's] sister, and he died before him, around the year [8]10.
