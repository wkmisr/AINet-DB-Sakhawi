notes:
- text: '転送見出し（原文末尾「مضى فيمن جده علي بن محمد قريبا」による）。転送先は #AIND-D07425「محمد بن سعيد بن علي بن محمد بن كبن بفتح الكاف ثم موحدة مشددة وآخره نون ابن عمر بن علي بن إسحاق … الجمال القرشي الطبري الأصل اليماني العدني الشافعي القاضي … ويعرف بابن كبن」（776年生、未受領）。ナサブ「محمد بن سعيد بن علي بن محمد」・ラカブ الجمال・通称 ابن كبن が一致。'
