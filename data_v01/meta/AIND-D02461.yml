translation:
  ja: ジャウハル・アッ＝シャムシー・ブン・アッ＝ザマン・アル＝ハバシー。（主人のシャムスィー・イブン・アッ＝ザマンは）彼を大変よく育て、彼は商売に秀でてその仲間うちの名士の一人となり、メッカにいくつかの邸宅を建てた。私（サハーウィー）はマディーナからメッカへ戻る際に彼と同道し、その知性・礼節・奉仕ぶり・善行への意欲を好ましく思ったのである。
  en: Jawhar al-Shamsī [of] Ibn al-Zaman, al-Ḥabashī. [His master] raised him excellently, and he excelled in trade, became one of the notables among them, and built several houses in Mecca. I accompanied him on my return from Medina to Mecca, and I found his intellect, manners, service, and inclination to good praiseworthy.
