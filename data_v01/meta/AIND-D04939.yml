translation:
  ja: アリー・ブン・イブラーヒーム・ブン・ムハンマド・ブン・サイード・ブン・ウバイドゥッラー、アッ＝サイイド・ガラーウッディーン、アル＝フサイニー、ビカーウ出身で、アッ＝ディマシュキー、アッ＝サーリヒー、ハナフィー派。ダマスクスのアッ＝ライハーニーヤのイマームで、前述のイブラーヒームの父。学者たちの集会に出席していた者の一人。892年ズー・アル＝ヒッジャ月の最初の十日間に、80歳に満たずして没した。
  en: ʿAlī b. Ibrāhīm b. Muḥammad b. Saʿīd b. ʿUbayd Allāh, al-Sayyid Ghalāʾ al-Dīn al-Ḥusaynī, of Biqāʿī origin, al-Dimashqī al-Ṣāliḥī al-Ḥanafī, imām of al-Rayḥāniyya in Damascus and father of the aforementioned Ibrāhīm. He is among those who used to attend the gatherings of the scholars. He died in the first ten days of Dhū al-Ḥijja of the year 892, before completing eighty years.
