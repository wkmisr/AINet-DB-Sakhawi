translation:
  ja: アハマド・ブン・アブドゥッラー。アル＝ブーティーグィー出身、後にカイロ出身、シャーフィイー派のシャイフ。我らがシャイフ（イブン・ハジャル）は『アンバー』で述べた：「彼は法学を学び、習熟した。そして彼は『ミンハージュ』を暗記していた。彼は（証言者としての）生計を立てた後、信心深さからそれを辞めた。827年に亡くなった。」
  en: 'Aḥmad b. ʿAbd Allāh, al-Shihāb, from al-Būtīj, then al-Qāhirī, Shāfiʿī. Our shaykh (Ibn Ḥajar) said in *al-Anbāʾ*: ''He studied fiqh and excelled. He could recall *al-Minhāj* by heart. After earning his livelihood through giving testimony, he left it due to piety (wārāʿan). He died in 827 AH.'''
