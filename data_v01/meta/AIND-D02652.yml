translation:
  ja: ハサン・ブン・ヤフヤー・アル＝ビール・アル＝ハッジャーリー。ファスの東方約4ファルサハ（約24キロメートル）に位置するビイル・アル＝ハッジャール（石の井戸）の出身。高潔な学者であった。ヒジュラ暦872年に没した。我らのマグリブの同僚の一人が彼について私に教えてくれた。
  en: Ḥasan b. Yaḥyā al-Bīr al-Ḥajjārī, so named after Bi'r al-Ḥajjār which is about four parasangs east of Fès. He was a righteous scholar. He died in the year 872 AH. Some of our Maghribi companions informed me of him.
