translation:
  ja: アブドゥッラヒーム・ブン・アブドゥルワッハーブ、法学者、ザイン・アッ＝ディーン、アル＝タンティダーイー。タンティダー（Tantidā）にあるアフマド・アル＝バダウィー廟（アル＝マカーム・アル＝アフマディー）の代理職（ハリーファ）を務めた。ハジュリー暦868年サファル月に現地で没した。イブン・アル＝ムニールがその没年を記録している。
  en: ʿAbd al-Raḥīm b. ʿAbd al-Wahhāb, the jurist, Zayn al-Dīn, al-Ṭantidāʾī. He was the deputy of the al-Maqām al-Aḥmadī (shrine of Aḥmad al-Badawī) in Tantidā. He died there in Safar, 868 AH. His death was recorded by Ibn al-Munīr.
