translation:
  ja: アフマド・ブン・カースィム・ブン・アフマド・ブン・アブド・アル＝ハミード、アッ＝タミーミー、アッ＝トゥーニスィー（チュニス出身）、マーリキー派。「イブン・アーシル」として知られる。スルタンは、彼の師アル＝カラサーニーの後任として、彼を自身（スルタン）の廟のシャイフ職に就任させた。
  en: Aḥmad b. Qāsim b. Aḥmad b. ʿAbd al-Ḥamīd al-Tamīmī al-Tūnisī al-Mālikī, known as Ibn ʿĀshir. The Sultan installed him in the shaykhship of his (the Sultan's) mausoleum, in succession to his (Aḥmad's) shaykh al-Qalaṣānī.
