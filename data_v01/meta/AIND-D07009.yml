translation:
  ja: ムハンマド・ブン・アフマド・ブン・ナスルッラー・ブン・アフマド・ブン・ムハンマド・ブン・ウマル、ムワッファクッディーン・ブン・アル＝ムヒッブ、バグダード出自、ハンバリー派、ユースフの兄弟で、こちらが年長。成長してクルアーンなどを暗記し、父から学び、さらに父とともにアッ＝シャラフ・ブン・アル＝クワイクから、我らがシャイフ（イブン・ハジャル）の朗読で『ムスリム』を聴聞した。同じくその後、〔8〕45年サファル月に、アル＝バドル・アル＝バグダーディー・アル＝ハンバリーの同席のもと、イブン・ナーズィル・アッ＝サーヒバ、イブン・バルダス、イブン・アッ＝タッハーンから聴聞した。アッ＝シャムス・ムハンマド・ブン・アリー・ブン・イーサー・アル＝バグダーディーの姉妹を娶って彼と姻戚となった。商業に従事し、〔8〕54年かその頃には存命であったが、その後アレクサンドリアで没した。
  en: Muḥammad b. Aḥmad b. Naṣr Allāh b. Aḥmad b. Muḥammad b. ʿUmar, Muwaffaq al-Dīn b. al-Muḥibb, of Baghdadi origin, the Ḥanbalī, brother of Yūsuf and the elder of the two. He grew up, memorized the Qurʾān and other works, and studied under his father; indeed he heard together with him Ṣaḥīḥ Muslim from al-Sharaf b. al-Kuwayk, with our shaykh (Ibn Ḥajar) as reader. Likewise he afterwards heard from Ibn Nāẓir al-Ṣāḥiba, Ibn Bardas, and Ibn al-Ṭaḥḥān in the presence of al-Badr al-Baghdādī al-Ḥanbalī in Ṣafar [8]45. He became related by marriage to al-Shams Muḥammad b. ʿAlī b. ʿĪsā al-Baghdādī by marrying his sister. He engaged in trade, and was alive in the year [8]54 or thereabouts; then he died in Alexandria.
