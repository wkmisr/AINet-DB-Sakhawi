translation:
  ja: ハムザ・ブン・アブー・バクル・ブン・アフマド・ブン・ムハンマド・ブン・ウマル・サリー・アッ＝ディーン・ブン・アッ＝タキー・アル＝アサディー・アッ＝ディマシュキー・アッ＝シャーフィイー。彼の父と兄弟は後述される。先祖と同様にイブン・カーディー・シュフバとして知られる。父などから（学問を）取得し、マスルーリーヤ・マドラサやムジャーヒディーヤ・マドラサなどで教授職を務めた。860年ラマダーン月に没し、バブ・アッ＝サギール墓地の先祖の傍らに埋葬された。神が彼と我らを慈しまんことを。
  en: Ḥamza b. Abī Bakr b. Aḥmad b. Muḥammad b. ʿUmar Sarī al-Dīn b. al-Taqī al-Asadī al-Dimashqī al-Shāfiʿī. His father and brother are mentioned below. Like his ancestors, he was known as Ibn Qāḍī Shuhba. He studied under his father and others, and taught at al-Masrūriyya and al-Mujāhidiyya Madrasas, among others. He died in Ramaḍān in the year 860 AH and was buried in al-Bāb al-Ṣaghīr cemetery next to his ancestors.
