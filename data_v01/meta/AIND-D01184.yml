translation:
  ja: アフマド・ブン・ムハンマド・アッ＝タイイブ・ブン・イブラーヒーム・ブン・ムハンマド・ブン・イーサー・ブン・ムタイル・アル＝ハカミー・アル＝ヤマニー。彼は父方の叔父アフマドやアル＝アズラクらのもとで法学を修めた。父の死後およそ3年で死去した。アル＝アハダルがそう述べている。
  en: Aḥmad b. Muḥammad al-Ṭayyib b. Ibrāhīm b. Muḥammad b. ʿĪsā b. Muṭayr al-Ḥakamī al-Yamānī. He studied jurisprudence with his paternal uncle Aḥmad, and al-Azraq, among others. He died approximately three years after his father, as stated by al-Ahdal.
