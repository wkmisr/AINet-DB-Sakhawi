  note:
    ja: '「أخو الفخر أحمد الماضي」＝فخر الدين أبو إسحاق أحمد بن أحمد بن علي بن أبي بكر بن أيوب … بن درباس المازاني الكردي القاهري الحنبلي المحدث「ويعرف بابن درباس」（#AIND-D00500、没817）。同伝に「وزاد بعضهم بين أبيه وعلي محمد」＝父 أحمد と علي の間に محمد を挿む異伝があり、本項主のナサブ（علي بن أحمد بن محمد بن علي）と一致。転送見出し REF D00515（أحمد بن أحمد بن محمد بن علي بن أبي بكر بن أيوب بن درباس → D00500）も同じ。初版は #NEEDID。'
