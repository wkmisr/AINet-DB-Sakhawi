  en: ʿAlī b. Aḥmad b. Muḥammad b. ʿAlī al-Khaṭīb, Abū al-Ḥasan b. Dirbās, brother of al-Fakhr Aḥmad, mentioned above. He was among those who heard from our shaykh (Ibn Ḥajar) and others.
