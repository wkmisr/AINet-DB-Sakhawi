  note:
    ja: '父 ＝ #AIND-D01414「أحمد بن محمد بن علي بن درباس شهاب الدين بن علاء الدين المصري . ذكره البقاعي في شيوخه」。見出しナサブ「علي بن أحمد بن محمد بن علي … بن درباس」と完全一致（原文に関係記述はなく見出しナサブによる補填＝規約5 ②、Waka 裁定 2026-09-15 §D-9）。兄弟 الفخر أحمد（#AIND-D00500）とも整合。'
translation:
