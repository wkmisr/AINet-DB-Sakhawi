translation:
  ja: イーナール・バーイ、法学者（アル＝ファキーフ）、アル＝ハサニー、アッ＝ザーヒリー・バルクーク。第二のハージブであり、ハージブ・マイサラ（左翼のハージブ）とも呼ばれた。私（サハーウィー）は別の箇所で自筆により、彼が第二のラアス・ナウバであったと記しており、どちらか一方は誤りである。アッ＝サラーフ・アッ＝タラーブルスィーが（クルアーン）朗誦を学ぶために彼のもとへ通っていた（すなわち本人が師、タラーブルスィーが弟子）。895年に（第一の）アミール職に就き、893年の事件で指を負傷したが、問題はなかった。
  en: Īnāl Bāy, the jurist (al-faqīh), al-Ḥasanī, al-Ẓāhirī Barqūq, the second Ḥājib. He was also called Ḥājib Maysara (ḥājib of the left). I (al-Sakhāwī) saw in my own handwriting elsewhere that he was the second Raʾs Nawba, and one of the two is mistaken. Al-Ṣalāḥ al-Ṭarābulusī used to frequent him to recite to him (i.e. the headword taught him recitation). He was made amir (first) in 895 H, and his finger was injured in the incident of 893 H, but he was fine.
