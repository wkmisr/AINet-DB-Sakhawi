translation:
  ja: ユースフ・ブン・アビー・アル＝ユスル・アフマド・ブン・アブド・アッラー・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・アブド・アル＝カーディル・ブン・アブド・アル＝ハーリク、アッ＝ディマシュキー、アッ＝シャーフィイー、イブン・アッ＝サーイグ。その父は既出。我らの師（イブン・ハジャル）が『インバー』で彼に言及し、こう述べている。「体は重いが気性は軽やかで、冗談が多く、談論に巧みであった。ダマーイーヤの教授職とナースィリー・リバートの監督職に就いた」。（8）14年ムハッラム月に没した。
  en: 'Yūsuf b. Abī al-Yusr Aḥmad b. ʿAbd Allāh b. Muḥammad b. Muḥammad b. Muḥammad b. ʿAbd al-Qādir b. ʿAbd al-Khāliq, al-Dimashqī, al-Shāfiʿī, Ibn al-Ṣāʾigh, whose father has been mentioned above. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said: "He was heavy of body, light of spirit, much given to jesting and good in scholarly conversation. He held the teaching post of al-Dimāʿiyya and the supervision of al-Ribāṭ al-Nāṣirī." He died in al-Muḥarram of the year [8]14.'
