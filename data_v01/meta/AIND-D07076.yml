translation:
  ja: ムハンマド・ブン・アフマド・アッ＝トゥーヒー。833年、アッ＝ザイン・ターヒルがアブー・アブドゥルカーディルに与えたイジャーザに彼が証人として署名しているのを私は見た。私の思うに、彼は祖父がムハンマド・ブン・ムハンマド・ブン・ウスマーン・ブン・ムーサーである者たち（の部）で前述したワリーユッディーンである。
  en: Muḥammad b. Aḥmad al-Ṭūkhī. I saw that he had signed as a witness on al-Zayn Ṭāhir's ijāza to Abū ʿAbd al-Qādir in the year 833, and I think he is Walī al-Dīn, mentioned above among those whose grandfather is Muḥammad b. Muḥammad b. ʿUthmān b. Mūsā.
