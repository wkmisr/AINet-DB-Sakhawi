translation:
  ja: アスラーン・ブン・スライマーン・ブン・ナースィル・アッ＝ディーン・ムハンマド・ブン・ドゥルガーディル、アミール・サイフ・アッ＝ディーン、通称マリク・アスラーン。アトリーシー派の副官 (ナーイブ) であった。マムルークたちの中で王権に対して逸脱・反抗した一人であり、大きな威勢と指導力、財力を得た。870年ラビーウ・アル＝アウワル月の金曜礼拝の時に、身元不明のフェダーイー (刺客) によって殺害された。その際、フェダーイーも直ちに殺害された。彼の剣はカイロに運ばれ、彼の代わりに弟のシャー・バドゥウが任命された。
  en: Aṣlān b. Sulaymān b. Nāṣir al-Dīn Muḥammad b. Dulghādir, Amīr Sayf al-Dīn, known as Malik Aṣlān, was the nāʾib (deputy) of the Atlisiyyīn. He was one of those who transgressed against the rulers and acquired great influence, leadership, and wealth. He was killed by an unknown fidāwī (assassin) at the time of Friday prayer in Rabīʿ al-Awwal 870 H. The fidāwī was killed immediately. His sword was brought to Cairo, and his brother Shāh Baḍʿ was appointed in his place.
