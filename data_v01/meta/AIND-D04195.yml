translation:
  ja: アブドゥルカーディル・ブン・ナースィル・アッディーン・ムハンマド・ブン・アワド・アッ＝ラハーウィー・アル＝マッキー。バジーラ地方などに交易のために頻繁に往来し、人々からその点で信頼されていた人物。ヒジュラ暦884年にバジーラ地方で没し、同地に埋葬された。イブン・ファハドが彼の没年を記録している。
  en: Abd al-Qadir b. Nasir al-Din Muhammad b. Awad al-Rahawi al-Makki. He was among those who frequently traveled for trade to Bajila and other places, and people trusted him in that regard. He died in the year 884 AH in the land of Bajila and was buried there. His death was recorded by Ibn Fahd.
