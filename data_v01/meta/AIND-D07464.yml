translation:
  ja: ムハンマド・ブン・スンクル、タグリー・ビルディー・アル＝カーディリーの姉妹の子。母方の叔父が彼の世話をし、私（サハーウィー）の息子と共に何がしかを聴聞させた。そして没した。
  en: Muḥammad b. Sunqur, the sister's son of Taghrī Birdī al-Qādirī. His maternal uncle took care of him and had him hear something together with my (al-Sakhāwī's) son. And he died.
