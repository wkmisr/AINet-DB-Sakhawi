translation:
  ja: ムハンマド・ブン・アブドゥルアズィーズ・ブン・アブドゥルワーヒド・ブン・イヤーズ（イヤーズは下点のヤーで綴る）、唯一無二のイマーム、カマール・アッ＝ディーン・アル＝アンサーリー・アル＝マダニー・アル＝マーリキー。前述のフサインの父。820年に義父アン＝ヌール・アリー・アル＝マハッリーから聴聞し、837年にはイジャーザ（伝承許可）において彼から書き取った。それどころか845年には、ある者たちが彼に（暗誦を）提示した。彼はその後に没した。彼は……〔原文はここで途切れる〕。
  en: Muḥammad b. ʿAbd al-ʿAzīz b. ʿAbd al-Wāḥid b. ʿIyādh (spelled with a yāʾ), the peerless imam, Kamāl al-Dīn al-Anṣārī al-Madanī al-Mālikī, father of the aforementioned Ḥusayn. He heard from his father-in-law al-Nūr ʿAlī al-Maḥallī in the year 820, and wrote from him in an ijāza in the year 837; moreover, some people presented [their recitation] to him in the year 845. He died after that. He was ... [the text breaks off here].
