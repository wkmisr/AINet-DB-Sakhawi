translation:
  ja: ハイダル・ブン・ユーヌス。イブン・アル＝アスカリーとして知られる。勇敢な騎士の一人。彼はすでに老齢に達し、職を退いた（無職の）状態で、801年シャウワール月にダマスカスで没した。アル＝アシュラフ・シャウバーンのためにシンジャールの総督職（アミール職）を務めた。我らがシャイフ（イブン・ハジャル）がその歴史書（『インバー・アル＝グムル』）でそう述べている。
  en: Ḥaydar b. Yūnus, known as Ibn al-ʿAskarī. He was one of the brave knights. He died out of office in Damascus in Shawwāl, the year 801 H, having reached an advanced age. He had held the governorship of Sinjār for al-Ashraf Shaʿbān. Our shaykh (Ibn Ḥajar) mentioned him in his history (Inbāʾ al-Ghumr).
