translation:
  ja: バイサク・アル＝ヤシュバキー。ヤシュバク・アッ＝シャアバーニーの（マムルーク）。スルターンによって5人長、次いで10人長に任命され、次いでサファド城塞副知事となり、その後ふたたび10人長に戻った。さらにドミヤート副知事、次いでダマスクス城塞副知事となり、同地で853年シャアバーン月に没した。謙虚で善良、かつ勇敢な人物であった。
  en: Baysaq al-Yashbaki, the mamluk of Yashbak al-Sha'bani. The Sultan appointed him as a commander of five, then ten, then as the deputy of the Citadel of Safad, after which he returned to the command of ten. He then became the deputy of Damietta, and subsequently the deputy of the Citadel of Damascus, where he died in Sha'ban, the year 853. He was humble, good, and brave.
