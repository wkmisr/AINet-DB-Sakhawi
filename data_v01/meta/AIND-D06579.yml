translation:
  ja: ムハンマド・ブン・イブラーヒーム、サフィー・アッディーン・アル＝カッサール・アル＝マルワスティー。霊的開示（ムカーシャファート）の持ち主の一人であった。アッ＝ターウースィーが（8）33年にマザール（「参詣所」の意とも読める）で彼に会い、そのとき彼は117歳であった。そこで彼にイジャーザを求めた。
  en: 'Muḥammad b. Ibrāhīm, Ṣafī al-Dīn al-Qaṣṣār al-Marwastī. He was one of those endowed with spiritual unveilings (mukāshafāt). Al-Ṭāwūsī met him in the year [8]33 at Mazār (or: at a shrine, mazār), when he was a hundred and seventeen years old, and asked him for an ijāza.'
