translation:
  ja: アフマド・ブン・サーリム・ブン・ハサン・アル＝イスハーキー。ニスバはアル＝ガルビーヤ地方のイスハーク村。850年以前に生まれた。証人として生計を立て、写本をした。わずかながら学問にも励んだ。私（＝サハーウィー）と出会い、私から多少学んだ。
  en: Aḥmad b. Sālim b. Ḥasan al-Isḥāqī, whose nisbah is to Maḥallat Isḥāq in al-Gharbiyya. He was born before 850 H and earned his living as a witness, and copied manuscripts. He also engaged in some study. He met me (al-Sakhāwī) and learned a little from me.
