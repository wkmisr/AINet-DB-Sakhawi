translation:
  ja: ハリール・ブン・イスマーイール・ブン・ウマル、アル＝アムリーティー、のちアル＝カーヒリー、シャーフィイー派、証人（シャーヒド）、後述のアッ＝シャムス・ムハンマドの兄弟。証人業で生計を立て、その道で抜きん出て、書も巧みであったが堅実さには欠け、礼節と慎みを備えていた。巡礼を行い、そこでアッ＝タキー・ブン・ファハドから聴聞した。
  en: Khalīl b. Ismāʿīl b. ʿUmar al-ʿAmrīṭī, then al-Qāhirī, the Shāfiʿī, the notary-witness (shāhid), brother of al-Shams Muḥammad who follows. He earned his living as a notary and excelled in it, with fine handwriting, though he was not solid; he had good manners and modesty. He performed the pilgrimage and heard there from al-Taqī b. Fahd.
