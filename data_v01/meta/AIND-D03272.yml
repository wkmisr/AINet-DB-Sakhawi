translation:
  ja: シャー・ルフ・アル＝カーン、ムイーン・アッ＝ディーン、スルターン、ティムールの子。東方の王であり、マー・ワラー・アン＝ナフル、ホラーサーン、ホラズム、ペルシア・イラク（イラーク・アル＝アジャム）、マーザンダラーン、インドのデリー王国、キルマーン、アゼルバイジャンのスルターン。アル＝マクリーズィーが『ウクード』において彼について詳しく言及している。
  en: Shāh Rukh al-Qān Muʿīn al-Dīn, Sultan, son of Tīmūr. King of the East, and Sultan of Transoxiana, Khurāsān, Khwārazm, ʿIrāq al-ʿAjam, Māzandarān, the kingdom of Delhi in India, Kirmān, and Azerbaijan. Al-Maqrīzī mentioned him at length in his ʿUqūd.
