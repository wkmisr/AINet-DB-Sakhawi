translation:
  ja: クトルブガー・アッ＝ザイン・アッ＝トゥルキー、ハナフィー派のムフティーで、彼ら（ハナフィー派）の長老の一人。（8）03年にカイロで没した。我らがシャイフ（イブン・ハジャル）もその没年を記しており、アル＝マクリーズィーは「ジュマーダー第1月の半ば」と付け加えている。
  en: 'Quṭlūbughā al-Zayn al-Turkī, the Ḥanafī muftī, one of their shaykhs. He died in Cairo in the year [8]03. Our shaykh (Ibn Ḥajar) also recorded his death date, and al-Maqrīzī added: in the middle of Jumādā I.'
