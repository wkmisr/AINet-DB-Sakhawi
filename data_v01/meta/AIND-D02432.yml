translation:
  ja: ジャカム・アル＝ヌーリー・アル＝ムアイヤディー、カルカスィーズとして知られる。アル＝ムアイヤドによって解放され、スルターン直属マムルーク軍の一員として過ごした。その後、アル＝ザーヒル・ジャクマクは彼をハーッサキー（スルターン側近の親衛マムルーク）に、次いでサーキー（酌人）に任じたが、その職から解任して一般兵士（アジュナード）の一員とした。さらにその後、アル＝アシュラフ・イーナールは彼を十人長に、次いでラアス・ナウバの一人とした。その後、彼は遠征部隊（ムジャッラドゥーン）とともに出征した者の一人となり、その帰路、861年シャウワール月にガッザで死去した。
  en: Jakam al-Nūrī al-Muʾayyadī, known as Qalqasīz. He was freed by al-Muʾayyad and remained among the sultan's Mamluks. Then, al-Ẓāhir Jaqmaq appointed him as a khāṣṣakī (sultan's bodyguard), then as a sāqī (cup-bearer), but later dismissed him from these positions and made him one of the common soldiers (ajnād). After that, al-Ashraf Īnāl appointed him as an amīr ʿashara (commander of ten), then as one of the raʾs al-nuwab (head of a guard unit). He later went out with the detached troops (al-mujarradūn) and died on his return in Ghazza in Shawwāl of the year 861 AH.
