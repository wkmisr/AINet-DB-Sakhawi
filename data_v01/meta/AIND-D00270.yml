translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・スライマーン・ブン・アウーン・アル＝タイビー・アッ＝ディマシュキー・アル＝ハナフィーで、イブン・アウーンとしても知られる人物。何度かカイロに赴き、私（＝サハーウィー）に『ブハーリー』の一部と、私がその完読のために開いた、彼が筆写した後の集会を朗読した。また、私から口述筆記をし、私からイブン・アル＝ハサンの『アル＝アーサール』を朗読し、『シャルフ・マアーニー・アル＝アーサール』などを私から聴聞した。彼は素晴らしい人物であった。
  en: Ibrāhīm b. Muḥammad b. Sulaymān b. ʿAwn al-Ṭaybī al-Dimashqī al-Ḥanafī, also known as Ibn ʿAwn. He came to Cairo several times and read to me parts of al-Bukhārī, and the session I held for its completion after he had written it. Likewise, he wrote from me during the dictations (al-āmālī). Then he read al-Āthār by Ibn al-Ḥasan to me, and he heard Sharḥ Maʿānī al-Āthār and other things from me. He was an excellent man.
