translation:
  ja: イーサー・ブン・ムハンマド・ブン・ムハンマド、アブー・アッ＝ルーフ・アル＝ハッジャージー・アッ＝スーフィー。727年ジュマーダー・アル＝アーヒラ月13日に生まれた。穏やかで洒脱な人物として知られていた。（80）5年に没した。我らがシャイフ（イブン・ハジャル）がその『インバー』で彼について記している。
  en: ʿĪsā b. Muḥammad b. Muḥammad, Abū al-Rūḥ al-Ḥajjājī al-Ṣūfī. He was born on 13 Jumādā al-Ākhira of the year 727. He was gentle and witty, and known for that. He died in the year (80)5. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
