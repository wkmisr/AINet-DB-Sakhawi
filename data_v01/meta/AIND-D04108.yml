translation:
  ja: アブドゥル・カーディル・ブン・アフマド・ブン・ヤアクーブ・ブン・アフマド・ブン・アブドゥル・ムンイム・ブン・アフマド・アッ＝ザイン・イブン・アッ＝シハーブ。アトフィーハを起源とし、カイロに住む。アッ＝ザイン・アル＝イラーキーの外孫であり、アル＝ムヒッブ・ムハンマドおよびアブドゥル・ラヒームの同母兄弟。父と同様にイブン・ヤアクーブ（ヤアクーブの子）として知られる。両親の庇護のもとで育ち、ハッジ（メッカ巡礼）を行い、我らがシャイフ（イブン・ハジャル）らからハディースを聴聞し、複数の人々からイジャーザを授かった。諸々の官職や金員を支給されたが、独自の生き方を貫き、時にはその原因となった行いによって非難されることもあったため、生存と地位の面で二人の兄弟に後れをとった。
  en: ʿAbd al-Qādir b. Aḥmad b. Yaʿqūb b. Aḥmad b. ʿAbd al-Munʿim b. Aḥmad, al-Zayn b. al-Shihāb. He was of Aṭfīḥī origin, resided in Cairo, and was the maternal grandson of al-Zayn al-ʿIrāqī, and the full brother of al-Muḥibb Muḥammad and ʿAbd al-Raḥīm. Like his father, he was known as Ibn Yaʿqūb. He was raised under the care of his parents, performed the Hajj, and heard Hadith from our shaykh (Ibn Ḥajar) and others, and received ijazas from a group of scholars. He held stipendiary posts, but fell behind his two brothers in longevity and status due to his peculiar lifestyle and behaviors occasionally attributed to him.
