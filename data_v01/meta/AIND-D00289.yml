translation:
  ja: イブラーヒーム・ブン・ムハンマド・ブン・ウマル・ブン・アブドゥルアズィーズ・ブン・ウマル、クンヤはアブー・アッ＝タウフィーク。イブン・アッ＝シャムス。エジプト人、カイロ人。彼の父は後に述べられる。彼は父のようにイブン・アル＝ムファッダルとして知られていた。幼い頃に父とともに私（サハーウィー）の許に来て出席し、多くの者からイジャーザを与えられた後、亡くなった。
  en: Ibrāhīm b. Muḥammad b. ʿUmar b. ʿAbd al-ʿAzīz b. ʿUmar, Abū al-Tawfīq b. al-Shams, al-Miṣrī al-Qāhirī. His father is mentioned later. He was known, like his father, as Ibn al-Mufaḍḍal. As a child, he attended with his father under me (al-Sakhāwī) and received ijāza from a group of people, then died.
