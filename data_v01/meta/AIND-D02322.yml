    ja: 'サハーウィー自身の二重立項。本項末尾「وأظنه الماضي قريبا」で少し前の項＝ #AIND-D02315（項番183「تنم سيف الدين الحسني الظاهري برقوق … ولاه نيابة دمشق … فانكسر تنم … وحبس تنم بها ثم توفي مقتولا بها في رجب أو شعبان سنة اثنتين」、ダマスカス総督、802年ナースィル・ファラジュに反乱し敗北・獄死）と同一と推定している。サハーウィーの語は أظنه（本来 cert medium）だが、外部史料により同一人物と確定済み（伊藤同定 2026-08-11: Ibn Taghrībirdī, al-Nujūm al-zāhira, xiii, 16-17; al-Manhal al-ṣāfī, iv, 168-174; Ibn Qāḍī Shuhba, Taʾrīkh, iv, 123-124; C. Onimus, "Prosopographie," 757）→ cert high。二重立項規約（2026-09-08 Waka 裁定）により両項とも実項として保持し、正本の選定は ID-Master 側で行う。本項固有の情報は異名「تنبك」（Tānī Bak 表記の史料は未見＝伊藤）。'
