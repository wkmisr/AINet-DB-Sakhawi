  type: cultural
  quote: 'قال : صافحني أبو الحسن على الحطاب وعمر مائة وثمانين صافحني أبو عبد الله الصقلي صافحني أبو عبد الله معمر وكان عمره أربعمائة سنة صافحني النبي صلى الله عليه وسلم انتهى . وهو شيء لا يعتمده الحفاظ الإثبات'
  cert: low
  note:
    ja: '預言者に遡る مصافحة（握手）の連鎖の主張。話者は本項主の父（「أباه صافحه قال : صافحني …」）で、連鎖の各人（أبو الحسن علي الحطاب・أبو عبد الله الصقلي・أبو عبد الله معمر・預言者）は父より上位の伝承者であり本項主の直接の関係相手ではない。サハーウィー自身が「لا يعتمده الحفاظ الإثبات」と退けているため cert low。初版はこの連鎖を本項主の teacher relation 4件（#NEEDID×3・wd:Q9458＝預言者ムハンマド）として立てていたが、原文上の相手ではないので relation を除去し event に統合（brief「要照合wd」対応。wd:Q9458 は本項では使用しない）。'
translation:
  ja: ムハンマド・ブン・アブドゥッラフマーン・ブン・ユースフ、アル＝カマール・アブー・アル＝バラカート・イブン・アビー・ザイド・アル＝ハサニー・アル＝マスカナースィー・アッ＝サカンダリー。〔八百〕十七年に我らがシャイフ（イブン・ハジャル）の息子その他にイジャーザを与えた。アル＝マクリーズィーは『ウクード』において彼の没年を〔八百〕二十二年とし、彼が「父が自分と握手（ムサーファハ）した」と語ったと述べている。〔父は〕言った、「アブー・アル＝ハサン・アリー・アル＝ハッターブが私と握手した――その齢は百八十であった――〔彼は言った、〕アブー・アブドゥッラー・アッ＝スィキッリーが私と握手した、〔彼は言った、〕アブー・アブドゥッラー・ムアンマルが私と握手した――その齢は四百年であった――〔彼は言った、〕預言者（神の祝福と平安あれ）が私と握手した」と。以上。これは信頼できる確固たるハーフィズたちが拠り所とするものではない。
  en: 'Muḥammad b. ʿAbd al-Raḥmān b. Yūsuf, al-Kamāl Abū al-Barakāt b. Abī Zayd al-Ḥasanī al-Maskanāsī al-Sakandarī. He granted an ijāza to the son of our shaykh (Ibn Ḥajar) and others in the year [8]17. Al-Maqrīzī dated him (his death) in his ʿUqūd to the year [8]22, and said that he (the subject) mentioned that his father had shaken his hand; [the father] said: "Abū al-Ḥasan ʿAlī al-Ḥaṭṭāb shook my hand — and he was one hundred and eighty years old; [he said:] Abū ʿAbd Allāh al-Ṣiqillī shook my hand; [he said:] Abū ʿAbd Allāh Muʿammar shook my hand — and his age was four hundred years; [he said:] the Prophet (God bless him and grant him peace) shook my hand." End of quotation. This is something the reliable and trustworthy ḥadīth masters do not rely upon.'
