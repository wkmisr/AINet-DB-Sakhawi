translation:
  ja: 881年、al-Basīlīを名乗るアサド・ブン・al-Basīlī、後にal-Qāhirīとなった彼は、何度もハッジを行い、メッカに長期滞在し、商売を営んだ飲料商人（ʾashrāb）の一人である。彼は友好的な態度を見せたが、ほとんどの親族と縁を切ることはなかった。彼とal-Zayn Zakarīyāの妻の間には血縁があったと私は思う。アッラーが彼を正しく導かれんことを。
  en: Asad b. al-Basīlī, then al-Qāhirī, was one of the drink merchants who performed Hajj many times, resided in Mecca for an extended period (jāwara), and engaged in trade. He showed affection but did not abandon most of his relatives. I believe there was a kinship between him and the wife of al-Zayn Zakarīyā. May God rectify him.
