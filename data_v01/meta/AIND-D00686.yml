translation:
  ja: アハマド・ブン・フサイン・ブン・ハサン・ブン・アリー・ブン・ユーサフ・ブン・アリー・ブン・アルスラーン、ハムザ付きの表記で、彼自身の手書きにあるように、イブン・アビー・バクル・アッ＝ディマシュキー・アル＝ハティーブ。彼はヒジュラ暦799年に生まれ、ヒジュラ暦773年に自筆でいくつかの請願書を書いた。私は彼の身の上を知らない。
  en: Aḥmad b. Ḥusayn b. Ḥasan b. ʿAlī b. Yūsuf b. ʿAlī b. Arslān (with hamza, as in his own handwriting), Ibn Abī Bakr al-Dimashqī al-Khaṭīb. He was born in the year 799 H and wrote some petitions in his own hand in the year 773 H. I do not know his circumstances.
