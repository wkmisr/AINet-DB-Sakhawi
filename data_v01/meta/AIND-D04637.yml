translation:
  ja: アブドゥッラー・ブン・ムハンマド、アル＝ジャマール・アル＝マーリディーニー、タマンナウとして知られる。我らの師（イブン・ハジャル）は『インバー』で言う。「富裕な者たちの子で、莫大な財産を相続したが、それを善行に費やし、その後困窮して、嘆願書によって物乞いをするようになり、時にそのことについて二行詩を詠んだ。有力者たちと交際していた。アル＝イッズ・アル＝マウスィリーが彼について詠んだ詩がある。」806年ラマダーン月にダマスカスで没した。
  en: 'ʿAbd Allāh b. Muḥammad, al-Jamāl al-Māridīnī, known as Tamannuʿ. Our shaykh (Ibn Ḥajar) said in al-Inbāʾ: "He was one of the sons of the wealthy and inherited abundant property, which he spent on charitable works; then he became poor and took to begging with written petitions, sometimes composing a couplet on the matter. He used to keep company with the notables, and al-ʿIzz al-Mawṣilī has verses about him." He died in Ramaḍān of the year 806 in Damascus.'
