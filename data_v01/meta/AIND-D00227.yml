translation:
  ja: ホワイトブリッジのマドラサ所有者である有名な商人イブラーヒーム・ブン・ムバーラクシャー・アル＝アスアルディー。彼は多くの富を持ち、寛大で施しを惜しまなかった。彼の親族であるフワーシャ・アッ＝シャムス・ブン・アル＝マズラクとは対照的である。この人物は826年のラジャブ月にペストで亡くなり、60歳には達していなかった。イブン・アル＝マズラクは彼よりずっと長く生きた。我らがシャイフは自身の『アンバー』で述べた。
  en: Ibrāhīm b. Mubārakshāh al-Asʿardī, al-Khawāja, the famous merchant and owner of the madrasa at al-Jīsr al-Abyaḍ. He possessed great wealth, was generous in giving, and spent profusely, unlike his relative, al-Khawāja al-Shams b. al-Mazlaq. The subject died of plague in Rajab in the year 826 AH, not having completed sixty years. Ibn al-Mazlaq lived a long time after him. Our shaykh (Ibn Ḥajar) mentioned this in his Anbāʾ.
