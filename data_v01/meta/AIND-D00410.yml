translation:
  ja: イブラーヒーム・アル＝マグリビー、「アル＝ハーッジ（巡礼者）」の名で知られる。彼がその呼称に腹を立てていたために、かえってそれが彼の通称となった。七つの読誦法（al-sabʿ）の朗誦者の一人で、ミーマウン・イマーム・アル＝ファッハールに師事して読誦を学び、誠実さと善良さを備えていた。867年（ヒジュラ暦）に没した。われわれの仲間であるマグリブ出身の者が私に伝えてくれた情報である。
  en: Ibrāhīm al-Maghribī, known as al-Ḥājj. Because he used to get angry at this epithet, it became his sobriquet. He was one of the reciters of the Seven Readings (al-sabʿ), having studied recitation under Maymūn Imām al-Fakhkhār, and he possessed integrity (ṣalāḥ) and goodness (khayr). He died in the year 867 AH. One of our Maghribī companions provided me with this information.
