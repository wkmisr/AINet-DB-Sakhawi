translation:
  ja: アブドゥルアズィーズ・ブン・ムハンマド・ブン・ムハンマド・ブン・アフマド・ブン・アブドゥルアズィーズ、ブン・アル＝ムヒッブ・ブン・アル＝バドル、イブン・アル＝アマーナ。父と祖父は後述され、同名の叔父やその他の叔父たちは前述されている。幼くして（カイロの）旧ザーヒリーヤで『ブハーリー』（の聴聞）に同席させられた。長じてハッジを行い、公証人（シャハーダ）で生計を立てたが、身持ちを慎まず、（証言に）堅実さもなかった。ときに職禄付きの講義に出席することもあり、バルクーキーヤで私（サハーウィー）のもとにも出席した。
  en: ʿAbd al-ʿAzīz b. Muḥammad b. Muḥammad b. Aḥmad b. ʿAbd al-ʿAzīz b. al-Muḥibb b. al-Badr, Ibn al-Amāna. His father and grandfather are mentioned below, and his namesake and his other paternal uncles above. As a child he was brought to hear al-Bukhārī at the old Ẓāhiriyya. When he grew up he performed the Ḥajj and earned his living as a notary-witness, but was neither scrupulous nor reliable. He sometimes attended the stipendiary lessons, and even attended my lessons at the Barqūqiyya.
