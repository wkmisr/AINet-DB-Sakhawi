translation:
  ja: ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・ワッハース、アッ＝シャリーフ・アル＝ハサニー・アル＝ハラディー・アル＝ヤマーニー・アッ＝シャーフィイー。894年ズー・アル＝ヒッジャ月にマッカで私と会い、その聖域で私から『ムサルサル』を聴聞した者の一人。善良な人々の一人である。
  en: Muḥammad b. ʿAbd Allāh b. Muḥammad b. Wahhās, al-Sharīf al-Ḥasanī al-Ḥaraḍī al-Yamānī al-Shāfiʿī. He was among those who met me in Mecca in Dhū al-Ḥijja [8]94 and heard the Musalsal from me in its sanctuary. He is one of the good people.
