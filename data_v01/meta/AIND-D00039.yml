translation:
  ja: イブラーヒーム・ブン・アフマド・ブン・ムハンマド・ブン・アフマド・ブン・アビー・ウリアーン・アッ＝トゥーニスィー。彼の郷里における書記長。880年ラマダーン月2日（日曜日）の夜マグリブ礼拝直後にマッカで没し、シーカ・ラー・ラウマド墓地に埋葬された。イブン・アズムが彼の伝記を記録した。
  en: Ibrāhīm b. Aḥmad b. Muḥammad b. Aḥmad b. Abī ʿUryān al-Tūnisī. He was the shaykh of scribes in his region/country. He died in Makka shortly after the Maghrib prayer on Sunday night, the 2nd of Ramaḍān in the year 880 H, and was buried in Maqbarat Shīka Lā Lawmad. Ibn ʿAzm recorded his biography/date.
