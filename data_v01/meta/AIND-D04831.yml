translation:
  ja: ウスマーン・ブン・イブラーヒーム・ブン・アリー・ブン・ハッサーン・ブン・アブドゥルバーキー、アル＝ファフル、マグリブ出自、アル＝ムナーウィー（ミンヤト・アル＝ジャマルに因む）、のちアン＝ナブティーティー、アル＝カーヒリー、アッ＝シャーフィイー。私（サハーウィー）に『ティルミズィー』冒頭の一部を読誦し、『ブハーリー』の数講分を私に解説（朗読）した。同様にアッ＝ディーミーにも読誦した。
  en: ʿUthmān b. Ibrāhīm b. ʿAlī b. Ḥassān b. ʿAbd al-Bāqī, al-Fakhr, of Maghribī origin, al-Munāwī (after Minyat al-Jamal), then al-Nabtītī, al-Qāhirī, al-Shāfiʿī. He read to me (al-Sakhāwī) a portion from the beginning of al-Tirmidhī and expounded (read) to me some sessions of al-Bukhārī. Likewise he read to al-Daymī.
