translation:
  ja: アズバク・アッ＝サムサマーニー・アル＝ムアイヤディー。スルタンとなる前のムアイヤドによって購入され、後にハーサキーとなり、アシュラフ・イーナールの時代には五人長（アミール・ハムサ）となった。アル＝ジャウンへ遠征隊と共に赴き、帰還した際に病を患い、861年ズー・アル＝ヒッジャ月にカイロで死去した。享年80歳前後。
  en: Azbak al-Samsamānī al-Muʾayyadī was bought by al-Muʾayyad before his sultanate, then became a khāṣṣakī, and during the days of al-Ashraf Īnāl, he became an amir of five. He travelled with the detached troops to al-Jawna and returned sick, dying in Cairo in Dhū al-Ḥijja 861 H, at around eighty years of age.
