    ja: '見出しナサブから（規則3）。corpus の「أحمد بن حسن … الصندفائي」見出しなし、ID-Master 未登録。汎用名のため #NEEDID。【集約 2026-10-19】父の候補＝本項主の読誦の師 #AIND-D00672「أحمد بن حسن شهاب الدين المحلى الشافعي المقرئ ويعرف بابن جليدة تصغير جلدة وهي شهرة خاله … وأم بجامع الغمري بالمحلة وأقرأ ولده」（874年マッカ没）。一致点: 名・父名（أحمد بن حسن）、ラカブ الشهاب（＝本項主の見出し「قاسم بن أحمد」の父）、ニスバ المحلي、学派 الشافعي、職 المقرئ、「وأقرأ ولده」（息子に読誦を教えた）と本項「تلا على الشهاب بن جليدة」が対応。相違点: サハーウィーは本項で「على أبيه」と書かず通称で呼ぶ、本項主の通称は ابن سوملك（ابن جليدة は D00672 の母方の叔父に由来する本人の通称で息子に継がれなくても矛盾しない）、D00672 にニスバ الصندفائي がない。断定できないため father は #NEEDID のまま（規則26）、同定は要判断 ★4（機械[25]・内容B L）。'
