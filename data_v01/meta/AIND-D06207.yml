translation:
  ja: カースィム・ブン・アフマド・ブン・ハサン、アッ＝ザイン・アッ＝サンダファーイー・アル＝マハッリー・アッ＝シャーフィイー、クルアーン読誦教師（ムクリ）。イブン・スーマラクとして知られる。クルアーン、『シャーティビーヤ』、マーリキー派の『リサーラ』を暗記した者の一人で、その後（学派を）転じて、『ミンハージュ』（法学）、『ジャムウ・アル＝ジャワーミウ』、文法の『アルフィーヤ』、『ムルハ』などを暗記し、学問に励んだ。アッ＝シハーブ・イブン・ジュライダ、次いでジャアファル・アッ＝サンフーリーのもとで読誦し、読誦学（キラーアート）に秀で、アル＝マハッラで読誦を教えた。
  en: Qāsim b. Aḥmad b. Ḥasan, al-Zayn al-Ṣandafāʾī al-Maḥallī al-Shāfiʿī, the Qurʾān reciter (muqriʾ), known as Ibn Sūmalak. He was among those who memorised the Qurʾān, the Shāṭibiyya and the Mālikī Risāla; then he changed (school) and memorised the Minhāj on positive law, Jamʿ al-Jawāmiʿ, the Alfiyya on grammar, the Mulḥa and other works, and applied himself to study. He recited under al-Shihāb Ibn Julayda and then Jaʿfar al-Sanhūrī, distinguished himself in the Qurʾānic readings (qirāʾāt), and taught recitation in al-Maḥalla.
