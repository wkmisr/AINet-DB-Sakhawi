translation:
  ja: ムハンマド・ブン・アフマド・アッ＝シャムス・アル＝カッバーニー、イブン・バハーとして知られ、あの落ちぶれた者（アル＝ムドビル）アリーの父。クルアーンその他を暗記し、少しばかり学問に携わった。きわめて容姿端麗で、アッ＝ザイン・カースィム・アル＝ハナフィーと（私の）父が実直さのうえで交際した者の一人であった。その後、バーブ・アル＝フトゥーフで大秤による秤量を生業とすること、および商業と取引に向かった。何度もマッカへ旅して隣住（ジワール）し、アブド・アル＝ガニー・アル＝カリユービーの姉妹であるアッ＝シハーブ・イブン・ハブタの母と結婚し、集団礼拝と（クルアーン）読誦の継続、施しと善行への熱意、義人への敬愛を保ちつつ、富を築いた。880年ラジャブ月に没した。神が彼を憐れみたまえ。
  en: Muḥammad b. Aḥmad al-Shams al-Qabbānī, known as Ibn Bahāʾ, the father of ʿAlī, that ill-starred fellow (al-mudbir). He memorized the Qurʾān and other texts and studied a little. He was of striking beauty and was one of those whose company al-Zayn Qāsim al-Ḥanafī and my father kept in uprightness. He then turned to earning his living by weighing with the steelyard (qabbān) at Bāb al-Futūḥ, and by trade and commercial dealings. He travelled to Mecca more than once and sojourned there, and he married the mother of al-Shihāb Ibn Khabṭa, the sister of ʿAbd al-Ghanī al-Qalyūbī. He grew wealthy while keeping up congregational prayer and recitation, his eagerness for alms and good works, and his love of the righteous. He died in Rajab 880. May God have mercy on him.
