translation:
  ja: ムハンマド・ブン・ザイン・ブン・アブドゥッラー、アッ＝シャムス・ブン・アッ＝ザイン、アル＝ミルサーウィー出身で、アッ＝タッバーニー・アル＝カーヒリー、外科医、イブン・アッ＝リーフィーとして知られる。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及し、こう述べた。彼は外科の学に従事し、古くにエジプトの地へ移ってタッバーナに住み、その技術において頭角を現して、ついにその長（リヤーサ）の職に就いた。842年に、高齢に達した後に没した。彼は百歳を超えたと主張したが、状況の証拠はそれが不可能であることを示している。彼の髭の毛には黒い部分が多かったのである。
  en: Muḥammad b. Zayn b. ʿAbd Allāh, al-Shams b. al-Zayn, of Marsāwī origin, al-Tabbānī al-Qāhirī, the surgeon, known as Ibn al-Rīfī. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ and said that he occupied himself with the science of surgery, moved to the Egyptian lands long ago and settled in al-Tabbāna, and advanced in his craft to the point that he was established in the headship (of the surgeons). He died in the year [8]42 after reaching an advanced age; he claimed to have passed a hundred, but the circumstances indicate that this was impossible, for there was much black in the hair of his beard.
