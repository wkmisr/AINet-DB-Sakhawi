translation:
  ja: アハマド・イブン・ドゥライブ・イブン・フルドゥ（シャハーブ、アブー・アルガワーイル、アルハサニー）はジャザーンの支配者であり、その支配者の息子であった。アルサイイド・ムハンマド・イブン・バラカートに882年に包囲された。『アルハワーディス』に記載されている。
  en: Aḥmad ibn Durayb ibn Khuld (al-Shihāb Abū al-Ghawāyir al-Ḥasanī) was the ruler of Jāzān and the son of its ruler. He was besieged by al-Sayyid Muḥammad ibn Barakāt in the year 882 H, as recorded in al-Ḥawādith.
