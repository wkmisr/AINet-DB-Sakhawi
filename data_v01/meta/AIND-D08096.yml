translation:
  ja: ムハンマド・ブン・アリー・ブン・アーディル、ナースィル・アッ＝ディーン・アル＝ワファーイー・アル＝ハナフィー。アブー・アル＝ファウズ・イブン・アル＝バリーディーとして知られる。ヤシュバク・アル＝ファキーフの集会で、私にアッ＝ディムヤーティーの『預言者伝』を読誦した。私の見るところ、まずまずの理解力があった。
  en: Muḥammad b. ʿAlī b. ʿĀdil, Nāṣir al-Dīn al-Wafāʾī al-Ḥanafī, known as Abū al-Fawz Ibn al-Barīdī. He read to me al-Dimyāṭī's Sīra of the Prophet at the assembly of Yashbak al-Faqīh. He had a tolerable understanding, as far as I could see.
