translation:
  ja: カラージャー・アッ＝ザーヒリー・ジャクマク。ナーズィル・アル＝ハース（特別財務長官）のアル＝ジャマーリーに仕えた者の一人で、アル＝ジャマーリーは彼をアッ＝トゥールのシャード（監督官）に任じた。蓄財し、横暴に振る舞い、言及に値する人物ではない。891年ムハッラム月12日、水曜の夜に没した。
  en: Qarājā al-Ẓāhirī Jaqmaq. He was one of those in the service of al-Jamālī, the nāẓir al-khāṣṣ, who made him shādd (superintendent) of al-Ṭūr. He amassed wealth and acted oppressively, and is not among those worth mentioning. He died on the night of Wednesday, the 12th of Muḥarram, in the year 891.
