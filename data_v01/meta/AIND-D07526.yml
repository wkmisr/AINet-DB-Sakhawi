translation:
  ja: ムハンマド・ブン・アブドゥルハーリク・ブン・ラマダーン・ブン・ムルヒフ・アッ＝ディムヤーティー。イブン・アル＝クワイクのもとでアブー・アッ＝タイイブ・イブン・アル＝バドラーニーの同学であった。アッ＝ザイン・リドワーンは彼を「伝承を受けるべき人々」の中に記載している。840年より前に没したようである。
  en: Muḥammad b. ʿAbd al-Khāliq b. Ramaḍān b. Murhif al-Dimyāṭī, companion of Abū al-Ṭayyib b. al-Badrānī in study under Ibn al-Kuwayk. Al-Zayn Riḍwān recorded him among those from whom transmission may be received. He seems to have died before 840.
