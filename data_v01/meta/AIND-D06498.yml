notes:
- text: '転送見出し（原文末尾「يأتي فيمن جده محمد بن علي」による）。転送先は #AIND-D06552「محمد بن إبراهيم بن محمد بن علي الشمس بن الظهير بن المطهر على ما يحرر الجزري الدمشقي」（803没・60歳、未受領）＝ナサブ（祖父 محمد بن علي）・الظهير／المطهر の両形と「على ما يحرر」・الجزري الدمشقي が一致。同じ D06552 へ向く転送見出しがもう一つある: #AIND-D06565「محمد بن إبراهيم بن المطهر . فيمن جده محمد بن علي على ما يحرر」（本バッチ外）。「على ما يحرر」は الظهير／المظهر のどちらが正しいかを要確認とするサハーウィー自身の注記で、「アル＝ジャザリーの校訂」ではない（初版訳を是正）。'
