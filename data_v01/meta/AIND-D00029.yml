translation:
  ja: イブラーヒーム・ブン・アフマド・ブン・アブドゥッラティーフ・ブン・ナジュム・ブン・アブドゥルムウティー・アル＝ビルマーウィー。アル＝ファフル・ウスマーンとその兄弟の父。我らがシャイフ（イブン・ハジャル）がその息子の伝記で述べたように、彼がその息子の死より10年前に没したとあるため、その死はヒジュラ暦806年となる。
  en: Ibrāhīm b. Aḥmad b. ʿAbd al-Laṭīf b. Najm b. ʿAbd al-Muʿṭī al-Birmāwī, father of al-Fakhr ʿUthmān and his brothers. He died, as our shaykh (Ibn Ḥajar) stated in his son’s biography, ten years before his son’s death, which would make his death in the year 806 AH.
