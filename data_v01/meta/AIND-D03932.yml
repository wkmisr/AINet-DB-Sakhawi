translation:
  ja: アブドゥッサラーム・ブン・ムハンマド・ブン・ムハンマド・ブン・ムハンマド・ブン・ヤフヤー、アル＝イマーム・イッズ・アッ＝ディーン・アル＝ハシャビー・アル＝マダニー。アン＝ヌール・アル＝マハッリー・スィブト・アッ＝ズバイルのもとで、820年にアル＝カラーイーの『アル＝イクティファー』を聴聞し、アッ＝ザイン・アブー・バクル・アル＝マラーギーのもとでも聴聞した。また、アル＝マラーギーの著作『タフキーク・アン＝ヌスラ・ビ＝タルヒース・マアーリム・ダール・アル＝ヒジュラ』を書写し、816年ジュマーダー・アッ＝サーニヤ月に書き終え、著者がそれをワクフ（寄進）するのに立ち会って証人となった。
  en: ʿAbd al-Salām b. Muḥammad b. Muḥammad b. Muḥammad b. Yaḥyā, al-Imām ʿIzz al-Dīn al-Khashabī al-Madanī. He heard al-Kalāʿī's al-Iktifāʾ from al-Nūr al-Maḥallī sibṭ al-Zubayr in the year 820 AH, and also heard from al-Zayn Abū Bakr al-Marāghī. He copied al-Marāghī's work Taḥqīq al-nuṣra bi-talkhīṣ maʿālim dār al-hijra, completing it in Jumādā II 816 AH, and witnessed the author's endowment (waqf) of it.
