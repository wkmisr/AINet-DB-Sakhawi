translation:
  ja: アティーヤ・ブン・アブドゥルハイイ・アル＝カイユーム・ブン・アビー・バクル・ブン・アブドゥッラー・ブン・ザヒーラ・ブン・アフマド・ブン・アティーヤ・ブン・ザヒーラ、アル＝クラシー、アル＝マッキー、ハンバリー派。前述のアル＝ムヒッブ・アフマドの兄弟で、母はザビードの出身。839年に生まれた。863年にカイロで、ウンム・ハーニウ・アル＝フーリーニーヤおよび彼女とともに（聴聞の場に）連れて来られた者たちのもとで『ブハーリー』の読了（ハトム）を聴聞した者の一人である。
  en: ʿAṭiyya b. ʿAbd al-Ḥayy al-Qayyūm b. Abī Bakr b. ʿAbd Allāh b. Ẓahīra b. Aḥmad b. ʿAṭiyya b. Ẓahīra al-Qurashī al-Makkī al-Ḥanbalī, brother of the aforementioned al-Muḥibb Aḥmad; his mother was from Zabīd. He was born in the year 839. He is among those who heard the completion (khatm) of al-Bukhārī's Ṣaḥīḥ in Cairo in the year 863 from Umm Hāniʾ al-Hūrīniyya and those who were brought to attend with her.
