translation:
  ja: クナイド・ブン・ミスカール、アル＝カーイド、アル＝ハサニー。マッカの副王サイイド・ハサン・ブン・アジュラーンの解放奴隷で、マスウードとイナーンの父。865年ラジャブ月に同地（マッカ）で没した。イブン・ファハドが没年を記している。
  en: Qunayd b. Mithqāl, al-Qāʾid, al-Ḥasanī, freedman (mawlā) of al-Sayyid Ḥasan b. ʿAjlān, viceroy of Mecca, and father of Masʿūd and ʿInān. He died there (in Mecca) in Rajab 865. Ibn Fahd recorded his death.
