  note:
    ja: '見出しナサブより（規則37）。父＝corpus 本伝 #AIND-D00190「إبراهيم بن علي بن عمر بن حسن بن حسين محب الدين وبرهان الدين أبو الوفاء بن النور التلواني الأصل القاهري الشافعي نزيل جامع الأقمر ويعرف كأبيه بالتلواني . ولد في سنة اثنتي عشرة وثمانمائة بالقاهرة … مات في سنة سبع وتسعين」（未収録）。ナサブ5代＋「التلواني الأصل القاهري」が一致し、母の項 #AIND-D12932「تزوجها البرهان إبراهيم بن النور التلواني واستولدها يوسف ومحمد」・兄弟の項 #AIND-D10428「والماضي أبوه وجده」で閉合（ブリーフ候補を本文で確認。cert なし）。初版は father relation なし。'
- id: r2
  type: personal
  subtype: mother
  active: AIND-D12932
  passive: AIND-D06528
  quote: جان خاتون ابنة ابن الحاجب
  note:
    ja: '「أمهما جان خاتون ابنة ابن الحاجب」。母＝女性部 #AIND-D12932「جان خاتون ابنة الركن عمر بن الناصري محمد بن الجمال عبد الله بن كتمر الحاجب … تزوجها البرهان إبراهيم بن النور التلواني واستولدها يوسف ومحمد وثالثة كانت زوجا لبعض أمراء العشرات … وماتت في جمادى الأولى سنة اثنتين وتسعين」（未収録）。名・「ابن الحاجب」・夫・子2人の名で閉合（ブリーフ候補を本文で確認。本項に明記＝cert なし）。初版は #NEEDID。'
- id: r3
  type: personal
  subtype: brother
  active: AIND-D10428
  passive: AIND-D06528
  quote: يوسف
  note:
    ja: '「شقيق يوسف الآتي」＝同父同母の兄弟。يوسف＝#AIND-D10428「يوسف بن إبرهيم بن علي بن عمر بن حسن التلواني الأصل القاهري الأقمري سبط ابن الحاجب ، أمه جان خاتون ابنة عمر بن محمد بن الجمالي عبد الله بن بكتمر الحاجب … والماضي أبوه وجده ، ممن سمع ختم البخاري في الظاهرية」（未収録）。ナサブ・ニスバ・母の名・「الآتي」で閉合（ブリーフ候補を本文で確認）。初版は #NEEDID。'
notes:
- text: '生没年・事績の記載なし。同母の姉妹 #AIND-D13071「زينب ابنة إبراهيم بن علي بن عمر بن حسن التلواني شقيقة محمد ويوسف ، أمهم جان خاتون ابنة ابن الحاجب المذكورين」（女性部）は本項主を名指しするが、本項は姉妹に触れない。父が AIND で共通なので relation は立てず note に留める（規則23、ブリーフの指示どおり）。祖父 #AIND-D05299（النور علي بن عمر بن حسن بن حسين … التلواني）。「ابن الحاجب」＝母の父祖 بكتمر الحاجب の家（D10428「ابنة عمر بن محمد بن الجمالي عبد الله بن بكتمر الحاجب」）。初版の residence event（القاهرة、ニスバ由来）を除去（規則22(1)・(6)）。persName full に限定語「الأصل」を復元（規則66 (e)）。'
  lang: ja
  type: editorial
translation:
  ja: ムハンマド・ブン・イブラーヒーム・ブン・アリー・ブン・ウマル・ブン・ハサン・ブン・フサイン、タルワーナ出身の家系でカイロの人。後述するユースフの同父同母の兄弟で、二人の母はイブン・アル＝ハージブの娘ジャーン・ハートゥーンである。
  en: Muḥammad b. Ibrāhīm b. ʿAlī b. ʿUmar b. Ḥasan b. Ḥusayn, of Talwānī origin, the Cairene, full brother of Yūsuf, who will come below; their mother was Jān Khātūn, daughter of Ibn al-Ḥājib.
