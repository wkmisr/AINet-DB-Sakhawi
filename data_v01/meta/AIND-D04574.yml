translation:
  ja: アブドゥッラー・ブン・ムハンマド・ブン・スライマーン、アル＝ジャマール・アッ＝ディムヤーティー、のちにアッ＝サフラーウィー。後述のウマルの父。ナースィル・アッ＝ディーン・アッ＝タブナーウィーに師事（同伴）し、（8）51年に我らがシャイフ（イブン・ハジャル）のもとで朗誦し、アッ＝シャムス・アル＝ハッジャーリーから相続法と算術を学んだ。頭角を現し、学生たちに教授した。彼のもとで朗誦した者のひとりにアッ＝シャラフ・ヤフヤー・アッ＝ドゥマイスィーがおり、彼（アッ＝ドゥマイスィー）は彼を称賛した。没した……〔没年月の記載なし〕。
  en: ʿAbd Allāh b. Muḥammad b. Sulaymān, al-Jamāl al-Dimyāṭī, later al-Ṣaḥrāwī, the father of ʿUmar, who is mentioned below. He kept the company of Nāṣir al-Dīn al-Ṭabnāwī, read under our shaykh (Ibn Ḥajar) in (8)51, and studied the law of inheritance and arithmetic under al-Shams al-Ḥajjārī. He distinguished himself and taught students; among those who read under him was al-Sharaf Yaḥyā al-Dumaysī, who praised him. He died … [the date is left blank].
