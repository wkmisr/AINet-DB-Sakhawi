translation:
  ja: アブドゥッラー・ブン・スライマーン、アル＝ジャマール・アル＝マハッリー。判決書記官（ムワッキウ・アル＝フクム）の一人であり、それどころかカイロの一部の地区や近郊で短期間、裁判代理官（ナーイブ）を務めた。838年ラジャブ月に没した。我らがシャイフ（イブン・ハジャル）がその没年を記録している。
  en: ʿAbd Allāh b. Sulaymān, al-Jamāl al-Maḥallī. One of the clerks who countersigned judgements (muwaqqiʿī al-ḥukm); indeed he acted briefly as deputy (nāʾib) in some districts and outlying areas of Cairo. He died in Rajab of the year 838. Our shaykh (Ibn Ḥajar) recorded his death-date.
