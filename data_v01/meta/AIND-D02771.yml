translation:
  ja: ハムザ・ブン・アッ＝サーヒブ・サアド・アッ＝ディーン・イブラーヒーム・ブン・バラカ・アル＝バシーリー。彼の父（の伝記）は前に出ている。874年ズル・カアルダ月（第11月）に、身を隠している状態で亡くなった。様々な時期に食糧庫監督職（ナザル・アル＝アハラーウ）、相続財産監督職（ナーズィル・アル＝マワーリース）、および国家財務監督職（ナザル・アッ＝ダウラ）を歴任し、イブン・アン＝ナッカーシュと婚姻関係を結んだ（その娘を妻とした）。
  en: Ḥamza, son of al-Ṣāḥib Saʿd al-Dīn Ibrāhīm, son of Baraka, al-Bashīrī. His father's biography has been mentioned previously. He died in Dhu al-Qaʿda 874 while in hiding. At various times, he had held the offices of controller of granaries (naẓar al-ahrāʾ), controller of inheritances (nāẓir al-mawārīth), and controller of state affairs (naẓar al-dawla), and he contracted a marriage alliance with Ibn al-Naqqāsh.
