translation:
  ja: アブド・アル＝カリーム・ブン・アフマド・ブン・ハサン・ブン・アリー・ブン・ムハンマド・ブン・アブド・アッ＝ラフマーン、カリーム・アッ＝ディーン、イマーム・アッ＝シハーブ・アル＝アズライーの子。アズリアート出身の家系で、カイロの人。母は父のハバシャ（エチオピア）人女奴隷であった。
  en: ʿAbd al-Karīm b. Aḥmad b. Ḥasan b. ʿAlī b. Muḥammad b. ʿAbd al-Raḥmān, Karīm al-Dīn, son of the Imām al-Shihāb al-Adhraʿī, of Adhriʿāt origin, the Cairene. His mother was an Abyssinian slave-girl of his father.
