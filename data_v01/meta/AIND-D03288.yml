translation:
  ja: シャーヒーン・アッ＝シュジャーイー。エルサレムの副王職（ニヤーバ）およびダマスクスにおけるスルターンのダワーダール職を務めた。837年ズー・アル＝カアダ月19日に没した。イブン・アッ＝ラブーディーがその没年を記録している。
  en: Shāhīn al-Shujāʿī. He held the vicegerency (niyāba) of Jerusalem and the office of the sultan's dawādār in Damascus. He died on the nineteenth of Dhū al-Qaʿda of the year 837. Ibn al-Lubūdī recorded his death.
