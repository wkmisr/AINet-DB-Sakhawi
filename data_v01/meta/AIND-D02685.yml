translation:
  ja: フサイン・ブン・アブー・アル＝マカーリム・アフマド・ブン・アリー・ブン・アブー・ラージフ・ムハンマド・ブン・イドリース、バドル・アッ＝ディーン・アル＝アブダリー・アッ＝シャイビー・アル＝ハジャビー・アル＝マーリキー・アッ＝シャーフィイー。『アル＝バハジャ』を暗記し、アラビア語学と詩に熱心に携わり、詩作、聡明さ、優れた書筆を有した。生計を立てるためにイエメンとエジプトに入ったが、サファル月827年にカイロで生涯を終えた。私に届いたところによれば、彼は21歳であった。アル＝ファースィーがメッカに関する著作で彼について言及している。
  en: Ḥusayn b. Abī al-Makārim Aḥmad b. ʿAlī b. Abī Rājiḥ Muḥammad b. Idrīs, Badr al-Dīn al-ʿAbdarī al-Shaybī al-Ḥajabī al-Mālikī al-Shāfiʿī. He memorized 『al-Bahja』 and applied himself to the study of Arabic and poetry; he possessed poetic talent, intelligence, and excellent handwriting. He entered Yemen and Egypt to seek a livelihood, but met his end in Cairo in Ṣafar, the year 827, at the age of twenty-one according to what reached me (al-Sakhāwī). Al-Fāsī mentioned him in [his history of] Mecca.
