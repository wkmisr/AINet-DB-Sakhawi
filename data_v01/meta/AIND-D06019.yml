translation:
  ja: ウマル・ザイン・アッ＝ディーン・アッ＝ディマシュキー・アル＝ハンバリー、使者たちのナキーブ（ナキーブ・アッ＝ルスル）にしてハンバル派カーディーたちの従僕（ハーディム）。アル＝バドリーが自身の『マジュムーウ』に彼の言葉として次の句を書き留めている。 「まことにイドリースは愛しき者、我らは長きにわたり彼に親しんできた。我らは彼にあって対立するものを下げ（抑え）、彼を高き所へと引き上げた。」
  en: 'ʿUmar Zayn al-Dīn al-Dimashqī al-Ḥanbalī, naqīb al-rusul (chief of the court messengers) and servant (khādim) of the Hanbali judges. Al-Badrī recorded in his Majmūʿ the following verses as his: "Indeed Idrīs is a beloved whom we have long been accustomed to; we lowered (kept down) what opposed him and raised him in station."'
