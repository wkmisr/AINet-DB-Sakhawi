translation:
  ja: ムーサー・ブン・ムハンマド・ブン・ムーサー・アッ＝サフミー、アミール、イエメン地方のハリー・イブン・ヤアクーブの領主。869年ラビーウ第2月に同地で没した。諸国の名家出身の名士に数えられ、その祖父はシャリーフ・ハサン・ブン・アジュラーンと交戦した者である。
  en: Mūsā b. Muḥammad b. Mūsā al-Sahmī, the amir, lord of Ḥalī Ibn Yaʿqūb in Yemen. He died there in Rabīʿ II 869. He was counted among the notables of established houses in the kingdoms; his grandfather had battles with the Sharīf Ḥasan b. ʿAjlān.
