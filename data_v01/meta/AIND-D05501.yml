translation:
  ja: アリー・ブン・ムハンマド・ブン・アリー、アッ＝ザイン・アル＝アンサーリー・アッ＝ザランディー・アル＝マダニー・アル＝ハナフィー。774年に生まれ、アル＝ジャラール・アル＝フジャンディーから諸学を修め、アル＝ジャマール・アル＝アミユーティーのもとで聴聞し、ハディースを伝え、教授した。819年ズー・アル＝ヒッジャ月26日に没した。私（サハーウィー）は言う、少し前に先述した者と併せて検討されるべきである。
  en: 'ʿAlī b. Muḥammad b. ʿAlī, al-Zayn al-Anṣārī al-Zarandī al-Madanī al-Ḥanafī. He was born in 774, took the various sciences from al-Jalāl al-Khujandī, heard from al-Jamāl al-Amyūṭī, transmitted ḥadīth and taught. He died on 26 Dhū al-Ḥijja 819. I say: he should be examined together with the one mentioned shortly before.'
