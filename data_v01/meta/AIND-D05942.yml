translation:
  ja: ウマル・ブン・ムハンマド・アビー・バクル・ブン・アリー・ブン・ユースフ、アル＝アンサーリー、ザルワ出自、アル＝マッキー、アッ＝ザビーディー。イブン・アル＝ジャマール・アル＝ミスリーとして知られ、アッ＝シュジャーウ（勇者）とあだ名された。学問には少し、商業には（本格的に）携わり、そのために諸国に旅し、そこからマッカに繰り返し戻り、一度ならず巡礼した。そのうちの一度は没年のことである。写本を筆写しており、その筆跡は悪くなかった。たまたま彼が財産の一部をある旅人たちに預けたところ、その者が溺れ（て財産が失われ）たため、彼の悲嘆は甚だしく、そのために病み、ついに（8）23年ズー・アル＝ヒッジャ月にマッカで没し、アル＝マアラート（墓地）に葬られた。30代、あるいは40歳に達していた。アル＝ファースィーが彼に言及している。
  en: ʿUmar b. Muḥammad Abī Bakr b. ʿAlī b. Yūsuf al-Anṣārī, of Dharwa origin, al-Makkī al-Zabīdī, known as Ibn al-Jamāl al-Miṣrī and nicknamed al-Shujāʿ (the Brave). He attended a little to learning and (more) to trade, on account of which he travelled to various lands, returning repeatedly from them to Mecca and performing the pilgrimage more than once, including in the year of his death. He used to copy books, and his handwriting was not bad. It happened that he entrusted some of his worldly goods to certain travellers, who drowned; his grief was great and he fell ill because of it until he died in Dhū al-Ḥijja of the year (8)23 in Mecca, and was buried in al-Maʿlāt. He was in his thirties, or had reached forty. Al-Fāsī mentioned him.
