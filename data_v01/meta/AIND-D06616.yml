translation:
  ja: ムハンマド・ブン・アフマド・ブン・イスマーイール・ブン・アフマド、アッ＝シャラフ・アル＝バドマースィー・アル＝ミスリー。マッカに来て10年ほどそこに滞在し、そこでイブン・スィッディークから聴き、証書の作成で生計を立てたが、その点で誉められなかった。（80）8年ズー・アル＝ヒッジャ月にそこで没し、思うに40歳を過ぎていた。自分はアッ＝スィッディーク（神が彼を嘉したまわんことを）の子孫であると称していた。アル＝ファースィーが『マッカ〔史〕』で彼に言及している。
  en: Muḥammad b. Aḥmad b. Ismāʿīl b. Aḥmad, al-Sharaf al-Badmāṣī al-Miṣrī. He came to Mecca and stayed there about ten years; he heard there from Ibn Ṣiddīq and earned his living by [drawing up] legal documents, for which he was not praised. He died there in Dhū al-Ḥijja of the year [80]8, having passed forty, as is thought. He used to say that he was of the progeny of al-Ṣiddīq, may God be pleased with him. Al-Fāsī mentioned him in [his history of] Mecca.
