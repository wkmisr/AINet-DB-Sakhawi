translation:
  ja: ムハンマド・ブン・アブドゥッラー・アッ＝タナスィー——ティレムサーン管区のタナスに由来する——、マグリブ人、マーリク派。893年に、彼が健在でティレムサーンに住み、60歳を越え、学識で指折りの人物であると私に伝わった。著作がある。それどころか、一部のラーフィダ派の説のとおり、アブー・ターリブのイスラーム（への帰依）について一巻を著したとも言われている。
  en: Muḥammad b. ʿAbd Allāh al-Tanasī — the nisba refers to Tanas, in the district of Tilimsān — the Maghribī, the Mālikī. It reached me in [8]93 that he was alive, residing in Tilimsān, past sixty, and pointed to for his learning; he has written works. It was even said that he composed a fascicle on the Islam of Abū Ṭālib, in accordance with the doctrine of some of the Rāfiḍa.
