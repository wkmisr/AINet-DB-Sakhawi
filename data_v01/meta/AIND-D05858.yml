translation:
  ja: ウマル・ブン・アブド・アッ＝ラフマーン・ブン・アフマド・アル＝ムクラーニー・アル＝ヤマーニー・アッ＝シャーフィイー。前述のアブド・アッ＝サマドの父。その（息子の）項に彼への言及があり、彼がアル＝アフダルのもとで学び（読誦し）、法学者であったこと、888年に76歳で没したことが記されている。
  en: ʿUmar b. ʿAbd al-Raḥmān b. Aḥmad al-Muqrānī al-Yamānī al-Shāfiʿī, the father of ʿAbd al-Ṣamad, mentioned previously. He is mentioned in his son's entry, where it is stated that he read under al-Ahdal, that he was a jurist, and that he died in the year 888 at the age of seventy-six.
