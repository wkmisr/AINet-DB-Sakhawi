translation:
  ja: ムハンマド・ブン・アブドゥッラティーフ・アル＝ブルルスィー・アッ＝サカンダリー。前述のアリーの兄弟。商人の一人で、ヒジュラ暦881年シャウワール月にアレクサンドリア郊外のアッ＝ラムルで没し、海門（バーブ・アル＝バフル）の外のアル＝ジャズィーラに運ばれてシャイフ・アリー・アル＝マワーズィーニーの傍らに埋葬された。非常に裕福で、善良さ、気概、目的達成のために惜しみなく施す寛大さ、そして端正な容姿を兼ね備えていた。交易のためマッカやその他の地へ旅した。彼は善行のための諸方面にワクフを持ち、その一つがアル＝マンスール・ブン・アッ＝ザーヒル・ジャクマクの邸宅である。それはハリール・ブン・アン＝ナースィルの後に彼の手に渡ったもので、ハリールがダミエッタへ移った際に彼から買い取り、のちにワクフとした。神が彼を憐れみたまわんことを。
  en: 'Muḥammad b. ʿAbd al-Laṭīf al-Burullusī al-Sakandarī, brother of the aforementioned ʿAlī. One of the merchants, he died in Shawwāl 881 at al-Raml outside Alexandria and was carried to al-Jazīra outside Bāb al-Baḥr, where he was buried beside Shaykh ʿAlī al-Mawāzīnī. He was very wealthy, with goodness, strength of character, generosity in spending to attain his aims, and a handsome appearance. He travelled for trade to Mecca and elsewhere, and he had endowments (awqāf) for pious purposes, among them the house of al-Manṣūr b. al-Ẓāhir Jaqmaq, which came to him after Khalīl b. al-Nāṣir: he bought it from him when Khalīl moved to Damietta and then made it a waqf. May God have mercy on him.'
