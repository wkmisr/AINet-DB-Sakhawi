translation:
  ja: アリー・ブン・シャムス・アッ＝ディーン・ムハンマド・ブン・アフマド、バスラ出自のアル＝マッキー。イブン・アル＝アクワースィーとして知られ、祖父の名はアフマド・ブン・アリー。カイロなどにしばしば往来した者の一人で、少し学問に携わり、礼拝時刻学（ミーカート）に秀で、マッカなどで私（サハーウィー）に師事した。没（空白）。
  en: ʿAlī b. Shams al-Dīn Muḥammad b. Aḥmad, of Baṣran origin, al-Makkī, known as Ibn al-Aqwāsī; his grandfather's name is Aḥmad b. ʿAlī. He was among those who frequented Cairo and elsewhere often; he studied a little, distinguished himself in timekeeping (mīqāt), and attended me closely in Mecca and elsewhere. He died (blank).
