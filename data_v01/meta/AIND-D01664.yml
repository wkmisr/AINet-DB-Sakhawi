translation:
  ja: アハマド・ブン・アッ＝シャリーフ・ムーサー・ブン・アブドゥッラフマーン・ブン・アブドゥンナースィル・アッ＝シャトヌーフィー・アル＝カーヒリー。彼の父については後述される。 『マシュヤハト・サーリフ・アル＝アズナウィー』とアブー・アル＝カースィム・ブン・アサーキル著『ファダーイル・ライラト・ニースフ・シャアバーン』をアル＝ハーウィーから聴聞し、一部の学生が彼（アハマド）から学んだ。
  en: Aḥmad b. al-Sharīf Mūsā b. ʿAbd al-Raḥmān b. ʿAbd al-Nāṣir al-Shaṭnūfī al-Qāhirī, whose father will be mentioned later. He heard `Mashyakhat Ṣāliḥ al-Isnawī` and `Faḍāʾil laylat niṣf Shaʿbān` by Abū al-Qāsim b. ʿAsākir from al-Ḥāwī. Some students acquired knowledge from him (Aḥmad).
