translation:
  ja: アブドゥルワーヒド・ブン・ハサン・ブン・ムハンマド、アッ＝タイイビー、のちアル＝カーヒリー、アル＝アズハリー、シャーフィイー派。後述のムハンマドの同父母の兄弟。学業に励み、ザカリヤーに師事し、その門下の古参の一人である。（8）98年にはマッカに滞留（ムジャーワラ）しており、バーブ・アッ＝サラームで証人（シャーヒド）として着座している。それ（証人業）はカイロでの彼の生業である。
  en: ʿAbd al-Wāḥid b. Ḥasan b. Muḥammad, al-Ṭayyibī, then al-Qāhirī, al-Azharī, al-Shāfiʿī, full brother of Muḥammad who will be mentioned below. He pursued his studies and attached himself to Zakariyyā, being one of the senior members of his circle. In (8)98 he was residing as a mujāwir in Mecca, sitting as a notary witness (shāhid) at Bāb al-Salām, which is his trade in Cairo.
