translation:
  ja: イーサー・ブン・アッラール・アル＝マスムーディー・アル＝マグリビー・アル＝マーリキー、カラウィイーン大ジャーミウのイマーム。イブン・アラファの『ムフタサル』に対する注記（タアリーカ）がある。禁欲的で謹厳な人物であり、カーディー職に就いた。（8）20年頃に没した。我々のマグリブ人の同輩の一人が私にこのことを伝えてくれた。
  en: ʿĪsā b. ʿAllāl al-Maṣmūdī al-Maghribī al-Mālikī, imam of the Great Mosque of al-Qarawiyyīn. He has a set of glosses (taʿlīqa) on the Mukhtaṣar of Ibn ʿArafa. He was ascetic and scrupulous, and held the office of judge. He died around the year (8)20. One of our Maghribi companions informed me of this.
