translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・アフマド、ワジーフル・ディーン、アブー・ムハンマド・アル＝アルシャーニー。アデンののち、タイズのカーディー（法官）を務めた。ヒジュラ暦837年に没した。彼ののちには、その兄弟のアブー・バクルがタイズのカーディー職に就任したが、間もなく839年にペストで没した。その後に法学者アブドゥルワリー・ブン・ムハンマド・アル＝ワフズィーが、一度は辞退したものの就任し、彼もまた急逝した。最終的にその甥である法学者ムハンマド・ブン・ダーウード・アル＝ワフズィーが就任し、その優れた施政から多くの称賛を集めた。
  en: ʿAbd al-Raḥmān b. Muḥammad b. Aḥmad, Wajīh al-Dīn, Abū Muḥammad al-ʿArshānī. He served as the Qadi of Aden and later of Taʿizz. He died in the year 837 AH. After him, his brother Abū Bakr was appointed as the Qadi of Taʿizz, but he soon died of the plague in the year 839 AH. He was succeeded by the jurist (faqīh) ʿAbd al-Walī b. Muḥammad al-Waḥẓī, who accepted the post after some reluctance but also passed away shortly thereafter. Finally, his nephew, the jurist Muḥammad b. Dāwūd al-Waḥẓī, assumed the office, earned a good reputation, and was highly praised.
