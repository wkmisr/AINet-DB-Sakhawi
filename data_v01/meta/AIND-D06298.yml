translation:
  ja: カーニム・アッ＝ダヒーシャ・アル＝アシュラフィー・カーイトバーイ。兄弟のジャーニムが第二ダワーダール職に任命された際（彼（ジャーニム）はアレッポにいた）、その職を代理した者の一人。間もなく、シリア諸州へその代官たちへの勅令を携えて派遣され、兄弟とともに出頭することとなったが、圧政と横暴を働いた。そこで、シャウワール月、…年に没した（年は欠）。
  en: Qānim al-Dahīsha al-Ashrafī Qāytbāy. He was among those who deputised for his brother Jānim in the second dawādāriyya when it was assigned to him while he (Jānim) was in Aleppo. Before long he was designated to go to the Syrian provinces with decrees for their governors, and to present himself together with his brother; but he acted oppressively and tyrannically. He died there in Shawwāl of the year [missing].
