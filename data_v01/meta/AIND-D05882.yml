translation:
  ja: ウマル・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アフマド・ブン・カースィム・ブン・アブドゥッラフマーン・ブン・アビー・バクル、アッ＝シラージュ・イブン・アル＝アフィーフ・ブン・カーディー・ル＝クダート・アッ＝タキー、アル＝クラシー・アル＝ウマリー、ハラーリーの出自で、アル＝マッキー。（8）50年ラビーウ・アル＝アウワル月に、インドのクルバルジャ地方のダウラト・アーバードで没した。アッラーが彼を慈しまれますように。
  en: ʿUmar b. ʿAbd Allāh b. Muḥammad b. Aḥmad b. Qāsim b. ʿAbd al-Raḥmān b. Abī Bakr, al-Sirāj Ibn al-ʿAfīf b. Qāḍī al-Quḍāt al-Taqī, al-Qurashī al-ʿUmarī, of Ḥarārī origin, al-Makkī. He died in Rabīʿ I (8)50 at Dawlatābād in the land of Kulbarja (Gulbarga) in India, may God have mercy on him.
