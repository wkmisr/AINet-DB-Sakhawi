  note:
    ja: '父 ＝ #AIND-D04556「عبد الله بن محمد بن أحمد بن قاسم بن عبد الرحمن بن أبي بكر العفيف أبو محمد بن التقي أبي اليمن بن الشهاب العمري الحرازي المكي」（816年マッカ没）。ナサブ6代とラカブ العفيف が一致。同じ父を持つ #AIND-D07806「محمد بن عبد الله بن محمد بن أحمد بن قاسم … التقي أبو الفضل بن العفيف بن التقي … الحراري المالكي」（810年にインドの كلبرجة で没）は本項主の兄弟とみられるが、どちらの原文にも兄弟関係の明記がないため relation は立てない（規則23）。ニスバの綴り الحراري／الحرازي は刊本の揺れ（ID-Master では TMP-N-00626 الحراري・TMP-N-00325 الحرازي が別登録）。'
