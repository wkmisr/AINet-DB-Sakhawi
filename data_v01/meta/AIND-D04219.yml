translation:
  ja: アブドゥル＝カーディル・アッ＝ザイン・アッ＝ディーミー、のちにアッ＝アズハリー。『アル＝ミンハージュ・アル＝アスリー』およびアル＝マハッリーによる『ジャムウ・アル＝ジャワームウ註釈』を、数年にわたり交互に読誦（キラーア）および聴聞（サマウ）の形で、アル＝カマール・イブン・アビー・シャリーフから学び、それら二つの講読（イクラーウ）の許可（イジャーザ）を彼から得た。
  en: Abd al-Qadir al-Zayn al-Daymi, then al-Azhari. He studied 'al-Minhaj al-Asli' and al-Mahalli's commentary on 'Jam' al-Jawami' under al-Kamal b. Abi Sharif through reading and listening alternately over several years, and was authorized by him to teach both of them.
