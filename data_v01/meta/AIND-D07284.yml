translation:
  ja: ムハンマド・ブン・バハードゥル・アル＝マスウーディー・アッ＝サラーヒー・アッ＝ディマシュキー。721年に生まれ、アル＝ハッジャールから『ジュズウ・アビー・アル＝ジャフム』などを聴聞し、伝承した。我らがシャイフ（イブン・ハジャル）らが彼から聴聞し、（イブン・ハジャルは）「（8）03年の大事件（アル＝カーイナ・アル＝ウズマー）の中で没した」と述べ、アル＝マクリーズィーも『ウクード』でこれに従った。
  en: 'Muḥammad b. Bahādur al-Masʿūdī al-Ṣalāḥī al-Dimashqī. He was born in 721 and heard the Juzʾ of Abū al-Jahm and other works from al-Ḥajjār; he transmitted, and our shaykh (Ibn Ḥajar) and others heard from him. He (Ibn Ḥajar) said: "He died in the Great Catastrophe (al-kāʾina al-ʿuẓmā) in the year (8)03," and al-Maqrīzī followed him in his ʿUqūd.'
