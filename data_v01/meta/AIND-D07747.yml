    ja: 'サハーウィー自身の二重立項。クンヤの部 #AIND-D10629（項番23「أبو البقاء بن الزين . هو ابن عبد الله بن أحمد بن حسن بن الزين … القسطلاني المكي وأمه خديجة … سمع … علي بن مسعود بن عبد المعطي وأبي حامد المطري وابن سلامة والجمال بن ظهيرة … وأجاز له … عائشة ابنة ابن عبد الهادي … مات بها بالطاعون سنة ثلاث وثلاثين ودفن بتربة سعيد السعداء」）と同一人物（師・没年・埋葬地が完全一致）→ cert high。本項は実伝を伴う項であり、「وسيأتي في الكنى」は B74-78 §D-1 の Waka 裁定（#AIND-D02182「واسمه إسماعيل وسيأتي في الكنى」）の先例に倣い転送見出しとは扱わず両項とも実項として保持（ISSUES §Dg-2）。'
translation:
  ja: ムハンマド、アブー・アル＝バカー。前二者の兄弟。アッ＝ザイン・アル＝マラーギー、アリー・ブン・マスウード・ブン・アブド・アル＝ムウティー、アブー・ハーミド・アル＝マタリー、イブン・サラーマ、アル＝ジャマール・ブン・ザヒーラらから聴聞し、アーイシャ・ビント・イブン・アブド・アル＝ハーディーやアッ＝シャラフ・ブン・アル＝クワイクらが彼にイジャーザを授けた。ヒジュラ暦833年にカイロでペストにより没し、サイード・アッ＝スアダーの墓域に葬られた。クンヤの部で再び後述する。
  en: Muḥammad, Abū al-Baqāʾ, brother of the two preceding. He heard from al-Zayn al-Marāghī, ʿAlī b. Masʿūd b. ʿAbd al-Muʿṭī, Abū Ḥāmid al-Maṭarī, Ibn Salāma, al-Jamāl b. Ẓahīra and others, and ʿĀʾisha bint Ibn ʿAbd al-Hādī, al-Sharaf b. al-Kuwayk and others granted him ijāza. He died of the plague in the year 833 in Cairo and was buried in the Turba of Saʿīd al-Suʿadāʾ. He will be mentioned again under the kunyas.
