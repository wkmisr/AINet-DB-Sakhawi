translation:
  ja: アフマド・ブン・ハサン・ブン・アリー・ブン・ムハンマド・アッ＝シハーブ・ブン・アル＝バドル・アッ＝タルハーウィー（タルハー出身の、カイロ在住者）。その父の伝記は後述する。彼はクルアーンを暗記し、書物を著し、提示し、父の授業に出席し、さらに私（サハーウィー）から聴聞した。父は彼をフトバーの講演者アリー・ブン・アブドゥルハックの娘と結婚させた。
  en: Aḥmad b. Ḥasan b. ʿAlī b. Muḥammad al-Shihāb b. al-Badr al-Ṭalkhāwī, originally from al-Ṭalkhā, residing in Cairo. His father's biography will be mentioned later. He memorized the Qurʾān, wrote books, presented (his learning), attended his father's lessons, and also heard from me (al-Sakhāwī). His father married him to the daughter of al-Khaṭīb ʿAlī b. ʿAbd al-Ḥaqq.
