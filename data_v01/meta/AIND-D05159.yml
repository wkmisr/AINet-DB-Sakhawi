translation:
  ja: アリー・ブン・アビー・サアド・ブン・ムハンマド・ブン・アビー・サアド・アッ＝シャリーフ・アル＝ヒッリー・アン＝ナマウィー。844年ラビーウ第2月11日の金曜の夜に没し、マッカ（メッカ）に運ばれてそのマアラー墓地に埋葬された。イブン・ファハドも彼の没年を記録している。
  en: ʿAlī b. Abī Saʿd b. Muḥammad b. Abī Saʿd al-Sharīf al-Ḥillī al-Namawī. He died on the eve of Friday, the 11th of Rabīʿ al-Ākhir of the year 844 AH, and was carried to Mecca, where he was buried in its al-Muʿallā cemetery. Ibn Fahd also recorded his death.
