translation:
  ja: アクバディー・アル＝カジュマースィー・カジュマース。アッ＝ザーヒル・バルクークの父方の従兄弟である。転々としたのちアシュラフィー朝の時代に金銭をもってガザの副官（ナーイブ）職に就いたが、短期間務めただけであった。841年シャウワール月中旬、あるいはズー・アル＝カアダ月に、ガザ郊外で疫病から身を守ろうとして滞在していた野営地で亡くなった。彼は80代であった。アル＝マクリーズィーは、「神はその死によって、彼の専横と貪欲から（人々を）解放された」と述べた。
  en: 'Aqbadī al-Qajmāsī Qajmās, a paternal cousin of al-Ẓāhir Barqūq. He moved around until he became a nāʾib (deputy) in Ghazza during the Ashrafī period, taking the position for money. He administered it for a short while and died in the middle ten days of Shawwāl, or, it is said, Dhū al-Qaʿda, of the year 841 H, in his camp outside Ghazza where he had sought refuge from the plague. He was in his eighties. Al-Maqrīzī said: "And God relieved (people) by his death from his tyranny and greed."'
