translation:
  ja: アフマド・ブン・ムハンマド・ブン・ウマル、法学者にして碩学、文法学者アッ＝シハーブ・アル＝ハージル。父その他に学び、アラビア語学に秀でて人々を益した。彼に学んだ者にはアッ＝シハーブ・アフマド・ブン・アリー・アン＝ナーシリーがおり、彼は優れた書体で多くを書写し、名を成した。彼（本人）は本世紀（ヒジュラ暦九世紀）の初めに亡くなり、その死によって財産は散逸した。
  en: Aḥmad b. Muḥammad b. ʿUmar, the jurist, the erudite scholar, the grammarian al-Shihāb al-Ḥājir. He studied under his father and others, excelled in Arabic, and benefited people thereby. Among those who studied under him was al-Shihāb Aḥmad b. ʿAlī al-Nāshirī, who wrote much in a fine hand and rose to prominence. He (the subject) died at the beginning of this (9th Hijri) century, and his wealth was dispersed upon his death.
