translation:
  ja: アリー・ブン・ウマル・ブン・ムハンマド、ヌール・アッ＝ディーン・ブン・アル＝バーニヤースィー・アッ＝ディマシュキー。シャイフ・アブド・アッ＝ラフマーン・ブン・ダーウードの娘の子で、祖父のザーウィヤのシャイフ。我らの友シャイフ・カースィム・アル＝ハバシーの後にそこ（の職）に就いたが、それどころか彼の存命中に彼と争った。もし彼（本項主）が彼（カースィム）の適格性を知っていたなら、争いを仕掛けはしなかったであろう。彼の生年は840年代である。
  en: ʿAlī b. ʿUmar b. Muḥammad, Nūr al-Dīn b. al-Bānyāsī al-Dimashqī, the daughter's son of al-Shaykh ʿAbd al-Raḥmān b. Dāwūd and shaykh of his grandfather's zāwiya. He was installed in it after our companion al-Shaykh Qāsim al-Ḥabashī; indeed he had contended with him for it during his lifetime, and had he known his (Qāsim's) competence he would not have turned to contention. His birth was in the forties (of the ninth century).
