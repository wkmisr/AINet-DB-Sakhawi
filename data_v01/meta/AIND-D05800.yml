translation:
  ja: ウマル・ブン・アフマド・ブン・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・ウマル・ブン・リドワーン・アッ＝ディマシュキー・アル＝ハリーリー・アッ＝シャーフィイー。父は前述。父がムハンマド・ブン・ウマル・アッ＝サラーウィーの娘の子であることから、父と同じくアッ＝サラーウィーとして知られる。アル＝ビカーイーは彼をイブン・ムズヒルの従者（ハーディム）と評し、（8）40年頃かそれ以前にカイロにいたとするが、それ以上のことは何も述べていない。
  en: ʿUmar b. Aḥmad b. Muḥammad b. Aḥmad b. Muḥammad b. ʿUmar b. Riḍwān al-Dimashqī al-Ḥarīrī al-Shāfiʿī; his father was mentioned above. Like his father he is known as al-Salāwī, because his father was the daughter's son of Muḥammad b. ʿUmar al-Salāwī. Al-Biqāʿī described him as a servant of Ibn Muzhir and said that he was in Cairo before the (eight hundred and) forties or thereabouts, but mentioned nothing further about him.
