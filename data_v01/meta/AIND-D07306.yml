translation:
  ja: ムハンマド・ブン・ジャアファル・ブン・アリー・ブン・アブドゥッラー・ブン・ターヒル・ブン・ハーシム・ブン・アラブシャー・ブン・ナースィル・ブン・ザイド、アッ＝サイイド・シャムス・アッ＝ディーン・アブー・アブドゥッラー・ブン・アル＝ジャラール・ブン・アッ＝タージュ・ブン・アスィール・アル＝ハサニー、ジュルジャーン出自、シーラーズ生まれでシーラーズ在住、ハナフィー派。彼の父は高名なウスターズ、アッ＝サイイド・アッ＝シャリーフ・アル＝ジュルジャーニーの娘の子である。886年にマッカで私に会い、私のもとでアル＝ブハーリー［のサヒーフ］の一部を読誦し、私からまたは私のもとで諸々を聴聞した。私は彼に壮大なイジャーザを書き与えた。彼は威望ある有徳の首長で、トルコ人に近い。
  en: Muḥammad b. Jaʿfar b. ʿAlī b. ʿAbd Allāh b. Ṭāhir b. Hāshim b. ʿArabshāh b. Nāṣir b. Zayd, al-Sayyid Shams al-Dīn Abū ʿAbd Allāh b. al-Jalāl b. al-Tāj b. Aṣīl al-Ḥasanī, of Jurjānī origin, born and residing in Shiraz, the Ḥanafī. His father was the daughter's son of the famous master al-Sayyid al-Sharīf al-Jurjānī. He met me in Mecca in the year 886, read part of al-Bukhārī under me, heard various things from me and under me, and I wrote him a grand ijāza. He is a dignified, virtuous leader, closer to the Turks.
