translation:
  ja: アリー・ブン・アブドゥッラティーフ・ブン・ムハンマド・ブン・アリー・ブン・サーリム、ザビード出身、マーリキー派。ザビードで生まれ育ち、私の推測ではナシャーウリーらからハディースを聴聞した。父の死後は手元に財産が乏しく苦労した。812年ラビー・アル＝アウワル月、30歳前後でマッカにて没した。アル＝ファースィーも彼について言及している。
  en: ʿAlī b. ʿAbd al-Laṭīf b. Muḥammad b. ʿAlī b. Sālim, of Zabīdī origin, the Mālikī. He was born and grew up there (Zabīd), and I believe he heard (hadith) from al-Nashāwurī and others. He struggled after his father's death due to his lack of means. He died in Mecca in Rabīʿ al-Awwal in the year 812 AH at about thirty years of age. Al-Fāsī also mentioned him.
