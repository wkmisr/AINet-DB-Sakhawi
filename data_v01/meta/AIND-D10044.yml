translation:
  ja: ムーサー・ブン・アフマド・ブン・イーサー・アル＝ハラーミー（ハーとラーは無点）。ハリーのアミール。兄弟ドゥライブの後にその統治権を独占したが、ハサン・ブン・アジュラーンによってそこから追放され、のち再びそこへ戻り、819年に没するまで（在位した）。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Mūsā b. Aḥmad b. ʿĪsā al-Ḥarāmī (with undotted ḥāʾ and rāʾ), amīr of Ḥalī. He became sole holder of its emirate after his brother Durayb; then Ḥasan b. ʿAjlān expelled him from it; then he returned to it until he died in the year 819. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
