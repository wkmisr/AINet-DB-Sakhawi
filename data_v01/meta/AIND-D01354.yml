translation:
  ja: アハマド・ブン・ムハンマド・ブン・アブドゥルラフマーン・アッ＝サトゥーヒー・アル＝ムニール。アフマディーヤ教団のシャイフの一人。口述筆記などで一定期間私（＝サハーウィー）に師事し、また私に『ブハーリー』を読誦し、私が開催したその完読の会にも参加し、彼らの流儀で祝福を得ようと努めた。
  en: Aḥmad b. Muḥammad b. ʿAbd al-Raḥmān al-Saṭūḥī al-Munīr. He was one of the shaykhs of the Aḥmadiyya order. He accompanied me (al-Sakhāwī) for a period during dictation and other studies. He also read to me from al-Bukhārī and attended the completion session I held for it, seeking blessings according to their tradition.
