translation:
  ja: カーフール・アル＝ヒンディー・アッ＝タワーシー（宦官）、ジャムダーリーヤ隊のラアス・ナウバ。サーキーを務めた。854年ムハッラム月に没し、彼の解放者であるホンド・ハージャル——アターバク・マンカリー・ブガー・アッ＝シャムシーの娘で、アッ＝ザーヒル・バルクークの妻——の墓廟に葬られた。
  en: Kāfūr al-Hindī al-Ṭawāshī (the eunuch), raʾs nawbat al-jamdāriyya. He had been a cupbearer (sāqī). He died in Muḥarram 854 and was buried in the turba of his manumitter Khwand Hājar, daughter of the atābak Mankalī Bughā al-Shamsī and wife of al-Ẓāhir Barqūq.
