translation:
  ja: アブドゥルラフマーン・ブン・ムーサー・ブン・イブラーヒーム。アッ＝ザイン・ブン・アッ＝シャラフ・ブン・アル＝ブルハーン。後述するムハンマドの兄弟であり、彼ら二人の父親（もまた同家系）である。イブン・アル＝ブルハーンとして知られる。理知的な人物であり、メッカの人々のいくつかの事柄を代弁していた。891年のラビー・アル＝アウワルまたはラビー・アッ＝サーニー（ラビーウ・アウワルまたはラビーウ・サーニー）に没した。
  en: ʿAbd al-Raḥmān b. Mūsā b. Ibrāhīm, al-Zayn b. al-Sharaf b. al-Burhān. He is the brother of Muḥammad, who is mentioned below, and [also has an entry for] their father. He was known as Ibn al-Burhān. He was sensible and spoke on behalf of some of the Meccans' affairs. He died in one of the two Rabīʿ months in the year 891 AH.
