translation:
  ja: アリー・ブン・ムハンマド・ブン・ウマル、アル＝ムワッファク、アブー・アル＝ハサン・アッ＝シャルアビー・アル＝ヤマーニー、シャーフィイー派。アッ＝ザラーティーティーとイブン・アル＝ジャザリーのもとで七読誦法を朗誦した。後述のアブー・バクル・ブン・イブラーヒーム・アル＝バグラーイー・アル＝ハラーリー・アル＝ヤマーニーが彼のもとで朗誦した。
  en: ʿAlī b. Muḥammad b. ʿUmar, al-Muwaffaq Abū al-Ḥasan al-Sharʿabī al-Yamānī al-Shāfiʿī. He recited the Seven Readings under al-Zarātītī and Ibn al-Jazarī. Abū Bakr b. Ibrāhīm al-Baghlāʾī al-Ḥarārī al-Yamānī, mentioned below, recited under him.
