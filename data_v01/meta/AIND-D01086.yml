translation:
  ja: アブー・アッバース・アハマド・ブン・アリー・ブン・マンスール。アル＝ヒムヤリー、アル＝ビジャーイー、またアル＝アージュッルーミーヤ註解者。彼からカイロで学んだ者にはアル＝ブルハーン・アル＝ラッカーニーがいる。837年に死去。イブン・アズムが彼のことを記している。
  en: Aḥmad b. ʿAlī b. Manṣūr al-Ḥimyarī al-Bijāʾī, commentator of al-Jurrūmīya. Among those who studied under him in Cairo was al-Burhān al-Laqqānī. He died in the year 837. Ibn ʿAzm recorded his biography.
