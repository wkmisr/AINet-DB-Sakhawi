translation:
  ja: この人物は、フサイニー家出身で、マディーナのアミールを務めたタービット・ブン・ヌアイル・ブン・マンスール・ブン・ジャンマーズ・ブン・シャイハである。ヒジュラ暦789年にアミール職に就いたが、ジャンマーズに代えられて解任された。その後、ジャンマーズの罷免を受けて復職した。ヒジュラ暦811年に死去した。アル＝マクリーズィーは著書『ウクード』で彼の伝記を長く記している。
  en: This is Thābit b. Nuʿayr b. Manṣūr b. Jammāz b. Shaykha al-Ḥusaynī, the amir of Medina. He was appointed to the office in 789 AH but was removed in favor of Jammāz. He was then reinstated after Jammāz's removal. He died in 811 AH. al-Maqrīzī devoted a lengthy biography to him in his work 『ʿUqūd』.
