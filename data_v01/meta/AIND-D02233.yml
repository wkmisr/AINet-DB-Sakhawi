translation:
  ja: バイバルス・アル＝アシュラフィー・イーナール。主君［アル＝アシュラフ・イーナール］およびその息子アル＝ムアイヤドの諸領地の管理を担当した。その後、王（マリク）はナーナク・アル＝アシュラフィー・イーナールの代わりに彼へ十人長アミール位を与えた。897年にハッジを行い、巡礼団とともに帰還した。
  en: Baybars al-Ashrafī Īnāl. He supervised the administrative and fiscal domains of his master [al-Ashraf Īnāl] and his master's son, al-Muʾayyad. Then, the Sultan granted him an emirate of ten, replacing Nānaq al-Ashrafī Īnāl. He performed the Hajj pilgrimage in the year 897 AH and returned with the caravan.
