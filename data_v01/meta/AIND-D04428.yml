translation:
  ja: アブドゥッラー・ブン・アビー・バクル・ブン・ハラド・ブン・ムーサー・ブン・ザフラ（ザにファトハ）、アル＝ヒムスィー・アル＝ハンバリー。既述のアブドゥッラフマーン・ブン・ムハンマドの従兄弟（イブン・アンム）。784年頃ヒムスに生まれ、同地でイブラーヒーム・ブン・フィルアウンから『サヒーフ』の末尾の一部分を聴聞し、のちにそれを伝授した。アン＝ナジュム・ブン・ファハドが彼にそれを朗誦した。私（サハーウィー）がヒムスに入る前に――少し前か、ずっと前かはわからないが――没した。
  en: ʿAbd Allāh b. Abī Bakr b. Khalad b. Mūsā b. Zahra (with fatḥa), al-Ḥimṣī al-Ḥanbalī. He was the paternal cousin of ʿAbd al-Raḥmān b. Muḥammad, mentioned earlier. He was born approximately in the year 784 AH at Ḥimṣ, and heard there from Ibrāhīm b. Firʿawn a portion from the end of the Ṣaḥīḥ, which he then transmitted; al-Najm b. Fahd read it back to him. He died before my entry into Ḥimṣ, whether shortly or long before.
