  ja: アフマド。アッ＝ザイン・アル＝ウスターダールの兄弟。（本項が立てられたのは）彼が854年ラマダーン月にアル＝マハッラで殺されたためである。がっしりした体格で、肌は緑がかった色をし、中背で、身を持ち崩した人であった。
  en: Aḥmad, brother of al-Zayn al-Ustādār — recorded here because he was killed in al-Maḥalla in Ramaḍān of the year 854 H. He was stout-bodied, green-complexioned, of medium height, and dissolute.
