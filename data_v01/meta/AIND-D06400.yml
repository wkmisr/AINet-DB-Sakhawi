translation:
  ja: カスバーイ・アル＝ムアイヤディー。アシュラフ・バルスバーイ治世の末期にアミールとなり、次いで彼（バルスバーイ）は彼を城塞（カルアト・アル＝ジャバル）副官に任じたが、それは地位を高めるためではなく、肥満のため身動きができず、肥満ゆえに馬上に身を保つこともできなかったからである。次いで彼をアレクサンドリア副官に任じ、彼はそこで長く日を重ねて没した。
  en: Kasbāy al-Muʾayyadī. He became an amir at the end of the reign of al-Ashraf Barsbāy, who then appointed him deputy of the Citadel of the Mountain (Qalʿat al-Jabal), not to raise his rank but because of his obesity and his inability to move, so that he could not keep his seat on a horse because of his corpulence. He then appointed him deputy of Alexandria, where his days were prolonged, and he died.
