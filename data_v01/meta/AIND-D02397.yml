translation:
  ja: ジャーニム。ダワーダール・ヤシュバク（イブン・マフディー）の母方の従兄弟（イブン・ハーラ）であり、大通りに面したクースーン・モスクの門の向かいにあるマドラサの主（サーヒブ）であった。そのマドラサには説教壇（フトバ）があり、ヤース・アル＝ビルビースィーが、またその主（ジャーニム）との親密な間柄から、アル＝ムザッファリー・マフムード・アル＝アムシャーティーが説教を行った。彼はダワーダールの一人であり、さらに十人長（アミール・アシャラ）に上り、上エジプト（サイード）のカシュフ（監督官）を務めた。乱暴を働き、財を成したため、君主は彼から多額を没収した。伝えられるところでは、彼は親族（ヤシュバク）との結び付き（を云々されること）を嫌っていたという。また、いくつもの遠征（タジュリーダ）に従軍した。私（サハーウィー）の考えでは、彼はシャーム（シリア）のあるアミールに属した後、アル＝アシュラフ・バルスバーイのマムルーク（アシュラフィーヤ）となった者である。
  en: Jānim, the son of the maternal aunt of Yashbak al-Dawādār, and the owner (ṣāḥib) of the madrasa opposite the gate of Jāmiʿ Qūṣūn on the street. In it there is a khuṭba, which was delivered by Yās al-Bilbaysī and — on account of his special connection with its owner — by al-Muẓaffarī Maḥmūd al-Amshāṭī. Jānim was one of the dawādārs; indeed he rose to be an amir of ten and took charge of the kashf of al-Ṣaʿīd (Upper Egypt). He committed acts of violence and amassed wealth to the extent that the ruler seized a large sum from him. It was said that he disliked his association with his relative. He traveled on several military expeditions, and I (al-Sakhāwī) think he was one of the Ashrafiyya (mamluks) of Barsbāy, after having belonged to one of the amirs of al-Shām.
