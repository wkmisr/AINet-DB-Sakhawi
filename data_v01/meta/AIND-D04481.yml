translation:
  ja: アブドゥッラー・ブン・アブドゥッラー・ブン・ムハンマド・ブン・アブドゥッラー・ブン・ムハンマド・ブン・マアバド、ダマース出身で、アル＝マナーウィー、のちにアル＝カーヒリー。彼の父は後出する。クルアーンを暗記し、わずかに学問に携わった。父と同じく子供たちに読誦を教えるために座を設け、いくつかの場所で説教を行い、さらにはそのうちの幾つかではラマダーン月に『（サヒーフ・）アル＝ブハーリー』を読誦した。諸職禄に任じられ、巡礼を行い、時に私（サハーウィー）のもとに出席することもあった。
  en: ʿAbd Allāh b. ʿAbd Allāh b. Muḥammad b. ʿAbd Allāh b. Muḥammad b. Maʿbad, of Damāṣ origin, al-Manāwī, then al-Qāhirī; his father is mentioned below. He memorized the Qurʾān and studied a little. Like his father, he sat to teach children recitation, preached in several places, and indeed recited al-Bukhārī during Ramaḍān in some of them. He was appointed to various stipendiary posts, performed the pilgrimage, and sometimes attended my sessions.
