translation:
  ja: アリー・ブン・ウマル・ブン・ムハンマド・ブン・アフマド・ブン・ムハンマド・ブン・マフムード、アン＝ヌール・ブン・アッ＝サラージュ・ブン・アル＝ジャマール・アル＝カーザルーニー・アル＝マダニー・アッ＝シャーフィイー。彼の父と祖父は後述する。彼は父が没する半年前にマディーナで生まれ、そこで育ち、マディーナで私のもとに付き従って諸々を聴聞した。
  en: ʿAlī b. ʿUmar b. Muḥammad b. Aḥmad b. Muḥammad b. Maḥmūd, al-Nūr b. al-Sirāj b. al-Jamāl al-Kāzarūnī al-Madanī al-Shāfiʿī. His father and grandfather will come below. He was born in Medina half a year before his father's death and grew up there, and he attended me assiduously in hearing various things in Medina.
