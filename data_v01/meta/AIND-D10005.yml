translation:
  ja: マムジク・アン＝ナウルーズィー、ナウルーズ・アル＝ハーフィズィーに帰属するニスバ。境遇は転々と変わり、ついにアッ＝ザーヒル・ジャクマクが彼を十人長とし、次いで城塞の代官職（ニヤーバト・アル＝カルア）に任じた。彼は844年ジュマーダー第二月末日またはラジャブ月朔日に没するまでその職にあった。善良で信仰篤く、物静かな人物であった。彼の後、代官職にはタグリー・ビルミシュ・アル＝ファキーフが就いた。なお、彼を「カジャク」と呼ぶのは誤りである。
  en: Mamjiq al-Nawrūzī, a nisba referring to Nawrūz al-Ḥāfiẓī. His circumstances shifted until al-Ẓāhir Jaqmaq made him an amīr of ten and then appointed him deputy (nāʾib) of the Citadel, in which he continued until he died on the last day of Jumādā II or the first of Rajab 844. He was good, religious and quiet. After him Taghrī Birmish al-Faqīh was installed in the deputyship. Calling him Qajaq is an error.
