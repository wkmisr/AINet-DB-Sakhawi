translation:
  ja: イブラヒーム・アル＝ガンナム。カイロのフサイニーヤ地区に住む人物で、エリートにも庶民にも信奉され、敬虔さで知られていた。彼はあそこで齢を重ね、木曜日、ラビーウ・ル＝アーヒル月1日、ヒジュラ暦870年に亡くなった。アル＝シャラフ・アル＝マナーウィーがフサイニーヤのカーン・アッ＝サビール近くのアンワル・モスクの門で大勢の人々とともに彼に葬儀の礼拝を捧げ、彼の遺体は自宅に戻され、生前に彼があそこに用意していた墓に埋葬された。私（＝サハーウィー）は彼がヤギを追い、その乳を売っているのを見た者の一人である。神が彼を憐れみ、その恩寵で我らを益してくださった。私は言う。『彼の敬虔さには疑いの余地がない。私は数えきれないほど彼を見た。彼の住居が私の居住区の近くにあったためだ。彼は私に深い愛情を抱き、常に私を歓迎してくれた。そのため、私が会うたびに、彼は満面の笑顔で私に祈りを捧げ、私との会話を楽しみ、微笑んだ。』彼の恩寵と祝福は私に戻ってきて、彼の祈りは私に益をもたらした。私はよく彼とともにアンワル・モスクで金曜礼拝を行い、彼の祈りを願い、彼の姿を見ることができたことに感謝して、彼と一緒に座るのを喜んだ。彼は「時代の主（サーヒブ・アル＝ワクト）」であると言われていた。イブラヒーム・アル＝マトブーリー師は、フサイニーヤ郊外に滞在した際、彼の伝記に先に記されているように、彼（アル＝ガンナム）に会っていた。私は彼が世俗の人々の元へ頻繁に出向くことも、誰かから何かを受け取ることも知らなかった。彼は謙虚で無口であった。一度、イード・アル＝アドハーの礼拝後、私が彼の傍らで困り事を抱えていた際、彼は私に親切にしてくれた。私は、それを実行できない理由を説明して彼に謝罪すると、彼は私の言い訳を受け入れ、『私にとってあなたの安寧が、その件で質問した者やそれに類する者よりも優先される』と言った。また彼は、私が会うたびに私の父を哀れんだり、時には私を称賛したりしたので、私はそれを喜んだ。神が彼を憐れみ、彼の祝福を私に再度授けてくださった。そして神のみが最もよく知る。
  en: 'Ibrāhīm al-Ghannām, a man from the al-Ḥusayniyya quarter of Cairo, revered by both elites and common people, and renowned for his piety. He died there, having lived a long life, on Thursday, the first of Rabīʿ al-Ākhir in the year 870 (AH). Al-Sharaf al-Manāwī led the funeral prayer for him at the gate of al-Anwar Mosque near Khān al-Sabīl in al-Ḥusayniyya with a large congregation. They returned with his body to his home, and he was buried in a grave he had prepared for himself there during his lifetime. I (al-Sakhāwī) was among those who saw him herding goats and selling their milk. May God have mercy on him and benefit us with his blessings. I said: ''There is no doubt about his piety. I saw him countless times because his residence was near my own dwelling place. He held great affection for me and welcomed me, such that whenever I met him, he would promptly pray for me with utmost cheerfulness, enjoying conversation with me and smiling.'' His blessings and bounties reverted to
    me, and his prayers benefited me. I would often perform Friday prayers with him at al-Anwar Mosque and enjoyed sitting with him, desiring his prayers and seizing the opportunity of seeing him. It was said that he was a ''master of the time'' (ṣāḥib al-waqt), such that Shaykh Ibrāhīm al-Matbūlī, upon his arrival in the outskirts of al-Ḥusayniyya, met with him, as previously mentioned in his biography. I never knew him to frequent the company of worldly people or to accept anything from anyone. He was humble and silent. Once, after I performed the Eid al-Adha prayer beside him, he showed me kindness regarding a certain matter (qaḍiyya). When I apologized to him, explaining what prevented me from carrying it out, he accepted my excuse and said: ''Your comfort is more important to me than the one who inquired about it or similar matters.'' He would also pray for my father (al-Sakhāwī''s father) when I met him, and sometimes he would praise me, which pleased me. May God have mercy on him
    and renew his blessings upon me. And God Almighty knows best.'
