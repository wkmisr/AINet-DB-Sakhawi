translation:
  ja: ムハンナー・ブン・アビー・バクル・ブン・イブラーヒーム・ブン・ユースフ、アッ＝ザイン、バグダード出自、アッ＝ドゥナイスィリー、のちアル＝ミスリー、ハナフィー派。733年ラビーウ・アル＝アウワル月にミスルで生まれ、アッ＝タージュ・ムハンマド・ブン・アフマド・ブン・ウマル・ブン・アン＝ヌウマーン・アル＝アンサーリーから、その（アッ＝タージュの）父の祖父ムハンマド・ブン・ムーサーの著『ミスバーフ・アッ＝ザラーム』を聴聞し、アル＝ジャマール・アル＝アミユーティーからイブン・サイイド・アン＝ナースの『スィーラ』の一部を聴聞した。（ハディースを）伝え、学生たちが彼から聴聞した。アル＝ファースィーは彼に言及してこう述べている。「マッカの寄留者で、同地のリバート・アル＝フーズィーのシャイフ。マッカに約40年あるいはそれ以上滞留（ジャーワラ）した。善良で、貧者の一団に施しをなし、リバート・アル＝フーズィーで数年貧者に奉仕したのち、そのシャイフ職を約30年務め、それによって人々に知られた」。（8）20年ラビーウ・アル＝アウワル月末に、70代か、あるいはそれを過ぎた年齢で没した。アッ＝タキー・ブン・ファハドが彼を『ムウジャム』に収めている。
  en: 'Muhannā b. Abī Bakr b. Ibrāhīm b. Yūsuf, al-Zayn, of Baghdādī origin, al-Dunaysirī, then al-Miṣrī, the Ḥanafī. He was born in Rabīʿ I 733 in Miṣr. He heard from al-Tāj Muḥammad b. Aḥmad b. ʿUmar b. al-Nuʿmān al-Anṣārī the Miṣbāḥ al-ẓalām of the latter''s father''s grandfather Muḥammad b. Mūsā, and from al-Jamāl al-Amyūṭī a portion of the Sīra of Ibn Sayyid al-Nās. He transmitted (ḥadīth), and students heard from him. Al-Fāsī mentioned him, saying: "A resident of Mecca and shaykh of Ribāṭ al-Khūzī there; he sojourned (jāwara) in Mecca for about forty years or more. There was goodness in him and beneficence toward a group of the poor; he served the poor at Ribāṭ al-Khūzī for years, then held its shaykhship for about thirty years and became known for that among the people." He died at the end of Rabīʿ I of the year [8]20, being in his seventies or past them. Al-Taqī b. Fahd included him in his Muʿjam.'
