    ja: '「زوج الشيخ نور الدين الزيادي أم أولاده」。候補＝#AIND-D05050「علي بن أحمد الزيادي بالتشديد نسبة لمحلة زياد بالغربية ، وهو والد محمد وأحمد وعزيزة وأحد صوفية سعيد السعداء . مات سنة ثمان وأربعين」（子 #AIND-D08015・#AIND-D00994・#AIND-D13349）。ニスバは一致し、名 علي とラカブ نور الدين の組み合わせも通例だが、D05050 と子3人の本伝にラカブも母の名も出ない＝閉合はニスバ1点のみ（規則57 の下限未満）→ 既存番号を充てず仮番号（規則12・26、§D168-7）。「أم أولاده」の子は無名＝relation を立てない。初版は #NEEDID。'
