translation:
  ja: アブドゥッラッザーク・ブン・ヤフヤー、タージュ・アッ＝ディーン、アル＝マクスィー、ハナフィー派、写字生（ナースィフ）。タージュ・アッ＝ディーンの名で知られる。公証人（シャーヒド）の職で生計を立て、その分野で頭角を現した。賃金を得て数多くの書写を行い、書写は速かったが出来はよくなかった。ただし寛大で穏和な人柄であった。ハッジを行い、幾度もメッカに滞在（ムジャーワラ）した。長い病ののち、ヒジュラ暦886年ラマダーン月にカイロで没した。50歳を超えていたと私（サハーウィー）は思う。神の慈悲と赦しがあるように。
  en: ʿAbd al-Razzāq b. Yaḥyā Tāj al-Dīn al-Maqsī al-Ḥanafī, the copyist, known as Tāj al-Dīn. He earned his living as a notary (shahāda) and excelled in it. He copied a great deal for wages; he was a rapid copyist, though the result was not of high quality, and he was generous and mild. He performed the Ḥajj and stayed in Mecca (mujāwara) more than once. He died in Cairo in Ramaḍān 886 AH after a long illness, and I think he had passed fifty. May God have mercy on him and forgive him.
