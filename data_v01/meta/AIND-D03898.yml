translation:
  ja: アブドゥッラザーク・ブン・ハサン・アッ＝ダンジーヒー、のちにアル＝カーヒリー。シャーフィイー派。サイード・アッ＝スアダー・ハーンカーのスーフィーの一人であり、その義人の一人。クルアーンと『ミンハージュ』を暗記し、アブー・アル＝アドル・アル＝バルキーニーの講義に付き従い、他の者からも学んだ。また、マンスーブ書体で書写を行った。給水所（ムザンマラ）でスーフィーたちに水を供する役を務め、その後、年老いてもますます善行に向かい、896年ラマダーン月に70数歳で亡くなった。アッラーの慈悲あれ。
  en: ʿAbd al-Razzāq b. Ḥasan al-Danjīhī, later al-Qāhirī, al-Shāfiʿī. He was one of the Sufis and righteous men of Khānqāh Saʿīd al-Suʿadāʾ. He memorized the Qurʾān and al-Minhāj, closely attended the lectures of Abū al-ʿAdl al-Bulqīnī, and studied under others. He wrote in the elegant al-mansūb script and was appointed to serve water to the Sufis at the muzammala (water station). Later in life he grew ever more devoted to good works, until he died in Ramaḍān 896 AH, in his seventies. May God have mercy on him.
