translation:
  ja: ウマル・ブン・イブラーヒーム・ブン・アル＝カウワース・アッ＝ディマシュキー・アッ＝スッカリー・アル＝アービル（夢解釈者）。夢の解釈に長け、ジャーミウ（金曜モスク）の椅子に座っていた。ハディースを熱心に求め、読誦し、聴聞した。厠にいるときに急死し、翌日まで誰も気づかなかった。それは（80）1年ズー・アル＝カアダ月のことである。我らがシャイフ（イブン・ハジャル）が『インバー』でそう述べている。
  en: ʿUmar b. Ibrāhīm b. al-Qawwās al-Dimashqī al-Sukkarī al-ʿĀbir (the dream-interpreter). He was skilled in the interpretation of dreams and used to sit on a chair in the congregational mosque. He sought ḥadīth extensively, read and heard. He died suddenly while in the privy, and they did not notice him until the following day; that was in Dhū al-Qaʿda of the year (80)1. Our shaykh (Ibn Ḥajar) said so in his Inbāʾ.
