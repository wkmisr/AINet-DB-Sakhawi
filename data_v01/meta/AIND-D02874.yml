translation:
  ja: ハリール・ブン・イブラーヒーム・ブン・アリー、アル＝マーラキー、アル＝カーヒリー。後述の、聖者たちの墓の参詣案内人（ムザウウィル）アッ＝シャムス・ムハンマドの父。869年ジュマーダー・アッ＝サーニヤ月に没した。敬虔な一般人であった。彼の息子が没年を記している。
  en: Khalīl b. Ibrāhīm b. ʿAlī al-Mālaqī al-Qāhirī, father of al-Shams Muḥammad, the guide to the tombs of the righteous (al-muzawwir), who follows. He died in Jumādā II of the year 869; he was a pious layman. His son recorded his death.
