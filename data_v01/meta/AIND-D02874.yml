  note:
    ja: '「والد الشمس محمد المزور لقبور الصالحين الآتي」。子＝ ابن المنير المزور。根拠: (1) ニスバ索引 #AIND-D12770「ابن المنير محمد بن خليل بن إبرهيم بن علي」が本項見出しナサブ（خليل بن إبراهيم بن علي）と一致、(2) corpus 61873 行（#AIND-D05649 の末尾）「أخذ عنه بعض من لا يحسن كابن المنير المزور」が ابن المنير を المزور と呼ぶ、(3) 本項末尾「أرخه ابنه」＝この子が没年を記録する人物であり、repo で「أرخه المنير／ابن المنير」として27件以上 Pattern A 参照される ID-Master 既登録 TMP-P-000342「المنير | ابن المنير」（カイロのザーウィヤ・シャイフや معتقدين の没年記録者）と役割が一致。よって TMP-P-000342 を充てる（ナサブ・通称・職の3点、規則57）。「الآتي」が指す محمد بن خليل بن إبراهيم بن علي المالقي の本伝は corpus の محمد بن خليل 見出し（hw.py 29件）に無い（欠落）。同ナサブの別索引 #AIND-D12769「ابن المنمنم محمد بن خليل بن إبرهيم بن علي وابنه التقي محمد」（الحراني、#AIND-D08774 の父＝TMP-P-000931）との関係は ISSUES。【集約 2026-11-05】子＝ニスバ索引 #AIND-D12770「ابن المنير محمد بن خليل بن إبرهيم بن علي .」（単独人物の索引見出し、規則11）でナサブ4代＋家名 ابن المنير が閉合する。この子を #AIND-D12770 で表し TMP-P-000342 を D12770 に名寄せする案（内容A L）と、TMP-P-000342 の実体をこの子に確定する案（校閲 §D154-4）を ★1-2 に並べた（決定16）。裁定まで TMP-P-000342 のまま。 / 裁定
      2026-11-05 ★1-2: 子＝#AIND-D12770（ニスバ索引「ابن المنير محمد بن خليل بن إبرهيم بن علي」。本項見出しナサブと4代一致）。TMP-P-000342 は裸の「المنير」の用例に限って残す。'
