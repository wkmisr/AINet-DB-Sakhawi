translation:
  ja: ムハンマド・ブン・ハサン・ブン・アリー・ブン・アブド・アッラフマーン、アッ＝シャムス、アル＝カーヒリー、アッ＝スーフィー、シャーフィイー派。「イブン・アル＝ウスターズ」として知られるが、これは彼の父がクルクマース・アッ＝シャアバーニーのウスターダール（家政長官）であったことによる。ヒジュラ暦826年に生まれ、成長し……。何人かの行政実務官（ムバーシル）のもとで書記を務めた。895年に私（サハーウィー）のもとで『シーラ（預言者伝）』の一部を聴聞し、翌年（896年）に『ダラーイル』の一部を聴聞した。息子を亡くしたが、耐え忍んだ。
  en: Muḥammad b. Ḥasan b. ʿAlī b. ʿAbd al-Raḥmān, al-Shams, al-Qāhirī, al-Ṣūfī, the Shāfiʿī, known as Ibn al-Ustādh because his father had been the ustādār (majordomo) of Qurqumās al-Shaʿbānī. He was born in the year 826 AH and grew up ... He worked as a scribe under some administrators (mubāshirūn). He heard part of the Sīra from me (al-Sakhāwī) in the year 895 AH, then part of the Dalāʾil in the following year. He lost a son and bore it with patience.
