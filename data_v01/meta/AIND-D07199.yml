translation:
  ja: ムハンマド・ブン・アビー・バクル・ブン・アブドゥルカリーム、アッ＝シャムス・アル＝マクディスィー、同地（聖地）の薬種商（アッタール）。縮小形でイブン・クライムとして知られる。アッ＝サドル・アル＝マイドゥーミーから、アル＝フサイニー編の同人の『マシュヤハ（師名録）』——その冒頭は『ムサルサル』である——を聴聞し、伝承した。学者たち（フダラー）が彼から聴聞した。我らが師（イブン・ハジャル）は『ムウジャム』で言う。「彼はアクサー・モスクの昇天のドーム（クッバト・アル＝ミウラージュ）の奉仕者（ハーディム）で、（8）21年に私の子らにイジャーザを授けた」。アル＝マクリーズィーは『ウクード』で彼に言及し、730年より後にガザで生まれ、一般人（アーンミー）であったが語り口は誠実であった、と述べている。（8）21年に没した——彼（マクリーズィー）はそう言っている。
  en: 'Muḥammad b. Abī Bakr b. ʿAbd al-Karīm, al-Shams al-Maqdisī, the druggist (al-ʿaṭṭār) there, known as Ibn Kurayyim in the diminutive. He heard from al-Ṣadr al-Maydūmī the latter''s Mashyakha compiled (takhrīj) by al-Ḥusaynī, the first item of which is al-Musalsal, and he transmitted; the learned heard from him. Our shaykh (Ibn Ḥajar) said in his Muʿjam: "He was the custodian (khādim) of the Dome of the Ascension (Qubbat al-Miʿrāj) in the Aqṣā Mosque; he granted an ijāza to my children in the year (8)21." Al-Maqrīzī mentioned him in his ʿUqūd and said that he was born in Gaza after 730, and that he was a commoner (ʿāmmī) of truthful speech. He died in the year (8)21 — so he (al-Maqrīzī) said.'
