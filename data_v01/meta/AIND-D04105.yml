translation:
  ja: アブドゥルカーディル・ブン・アハマド・ブン・ムハンマド・アッ＝サンダリー。カイロを拠点とするアズハル派の学者で、その父（アハマド）については先述した。彼は40歳を過ぎたばかりの時、880年シャウバーン月16日の金曜日に急死した。砂漠から砂を運ぶために、トラーブという人物とともに向かったところ、砂が二人の上に崩れ落ちて窒息死したのである。翌日、アズハル・モスクにおいて二人のための葬儀礼拝が執り行われた。彼の父親は、多額の債務を抱えて苦境にあったにもかかわらず、息子の突然の死に深く悲しんだ。アッラーが彼ら二人に楽園をもって報いんことを。
  en: ʿAbd al-Qādir ibn Aḥmad ibn Muḥammad al-Ṣandalī, of Cairo origin and affiliated with al-Azhar, whose father was mentioned previously. He died suddenly on Friday, the 16th of Shaʿbān, in the year 880 AH, having just passed forty years of age. He had gone with a person named Turāb to fetch sand from the desert, and it collapsed upon them both, causing their deaths. The funeral prayer was held for them the next day at al-Azhar Mosque. His father grieved deeply for him, despite already being in distress due to the heavy burden of debts he carried. May Allah compensate them both with Paradise.
