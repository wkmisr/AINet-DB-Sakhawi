    ja: '「غريم السفطي في الحمام」＝浴場（をめぐる争い）での السفطي の対立相手（先例 D04164「غريم البقاعي」→ rival）。السفطي は裸のニスバのみで、corpus に同ニスバの人物多数（854 年当時の著名人は الولوي محمد بن أحمد بن يوسف بن حجاج السفطي＝#AIND-D07014、シャーフィイー派大カーディー、854 没）だが本文に同定根拠がない → #NEEDID（規則12・26）。初版のカテゴリ不一致 TMP-N-00193（ニスバ番号）を置換。候補は ISSUES §D129-2。【集約 2026-10-25】#AIND-D07014 に cert medium で同定（規則26 例外2）: corpus で修飾語のない「السفطي」は約60例のほぼすべてが同人（「ناب في القضاء عن السفطي」「بعد صرف السفطي واختفائه」「حين عزل السفطي عن القضاء」等、D00112・D00491・D00540・D01025・D03583・D03729）を指し、他の السفطي は「يحيى السفطي」「الصدر السفطي」「البرهان السفطي」と名・ラカブで区別される。年代（D07014 は854年ズー・アル＝ヒッジャ没、本項主は854年初頭に没）も整合。浴場の件は D07014 本文に記載なし。'
