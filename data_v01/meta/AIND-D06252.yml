translation:
  ja: カースィム・アッ＝ザイン・アル＝ムウズィー、上エジプト（アル＝ワジュフ・アル＝キブリー）のカーシフで、浴場（の件）におけるアッ＝サファティーの敵対者。854年の初めに、一日だけ病んだのち、カイロに埋葬されるためラクダに載せて運び込まれた。惜しまれることのない人物であった。
  en: Qāsim al-Zayn al-Muʾdhī, the kāshif of Upper Egypt (al-Wajh al-Qiblī) and the adversary of al-Safṭī in (the matter of) the bathhouse. At the beginning of the year 854 he was brought, carried on a camel, to be buried in Cairo, after having been ill for only a single day. He was not mourned.
