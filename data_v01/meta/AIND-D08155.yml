translation:
  ja: ムハンマド・ブン・アリー・ブン・ムハンマド・ブン・イブラーヒーム・ブン・ウマル・ブン・イブラーヒーム・アル＝ジャアバリー・アル＝ハリーリー、既述のムハンマドとウマルの父。756年にハリール（ヘブロン）で生まれ、叔父ウマルからヒルカ（スーフィーの衣）を授かった。ウマルはそれを母方の叔父アリー・ブン・ウマル・ブン・アルシュから、彼はその父から授かっており、それはアリー・アル＝バッカーに連なる。ハリールのシャイフ職を務めた。（8）41年に没した。
  en: Muḥammad b. ʿAlī b. Muḥammad b. Ibrāhīm b. ʿUmar b. Ibrāhīm al-Jaʿbarī al-Khalīlī, the father of the aforementioned Muḥammad and ʿUmar. He was born in the year 756 in Hebron (al-Khalīl) and was invested with the (Sufi) khirqa by his paternal uncle ʿUmar, who had been invested with it by his maternal uncle ʿAlī b. ʿUmar b. Arash, who had it from his father, and it goes back to ʿAlī al-Bakkāʾ. He held the shaykhship of Hebron. He died in the year [8]41.
