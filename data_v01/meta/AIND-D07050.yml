translation:
  ja: ムハンマド・ブン・アフマド・ファトフ・アッ＝ディーン・アン＝ナッアース（無点の二字とヌーン）・アル＝マーリキー、判決署名官の一人。能書で証書類に通じ、アル＝バースィティーヤの説教職に就き、アブー・アル＝ファトフ・イブン・ワファーに帰依した。837年に没し、アッ＝ザイニー・アブド・アル＝バースィトの指示により、彼のシャイフが、アル＝ハンバリー（ハンバル派カーディー）その他の名士の臨席のもと、葬礼の礼拝を導くために進み出た。我らの師（イブン・ハジャル）が『インバー』に彼の没年を記した。
  en: Muḥammad b. Aḥmad Fatḥ al-Dīn al-Naʿʿās (with two undotted letters and a nūn) al-Mālikī, one of the court signatories (muwaqqiʿī al-ḥukm). He had a fine hand and was knowledgeable in legal documents; he held the office of preacher at al-Bāsiṭiyya and attached himself to Abū al-Fatḥ Ibn Wafāʾ. He died in the year 837, and his shaykh stepped forward to lead the prayer over him at the direction of al-Zaynī ʿAbd al-Bāsiṭ, in the presence of the Ḥanbalī (judge) and other notables. Our shaykh (Ibn Ḥajar) recorded his death in his Inbāʾ.
