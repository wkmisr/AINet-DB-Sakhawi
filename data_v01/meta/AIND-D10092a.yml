translation:
  ja: ムーサー・ブン・ザイン・アル＝アービディーン・ムハンマド・ブン・ムーサー・ブン・ムハンマド・ブン・アリー・ブン・ハサン・アル＝カーディリー、父と祖父は前出。父は彼を私の父とともに一団〔の師〕から聴聞させた。864年のペストで彼〔兄弟〕とともに幼くして没した。神が二人と我々に楽園を報いたまえ。
  en: Mūsā b. Zayn al-ʿĀbidīn Muḥammad b. Mūsā b. Muḥammad b. ʿAlī b. Ḥasan al-Qādirī, whose father and grandfather have been mentioned. His father had him hear, together with my father, from a group of shaykhs. He died with him in the plague of 864, both still young.
