translation:
  ja: アフマド・ブン・ムハンマド・ブン・ウマル・アル＝バルシューミー・アル＝カーヒリー。 ハディースを聴聞し、ṭibāq（聴聞証書）を書いた。そして時には、イブン・アッ＝シャイハや他のムスニド（伝承者）たちのために、必要に応じて請願書（istidʿāʾ）などを代筆した。
  en: Aḥmad b. Muḥammad b. ʿUmar al-Barshūmī al-Qāhirī. He heard ḥadīth and wrote transcription certificates (ṭibāq). At times he also wrote petitions (istidʿāʾ) and the like on behalf of Ibn al-Shaykha and other musnids (traditionists), as need required.
