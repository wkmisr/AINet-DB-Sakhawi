    ja: '父 الشرف ＝ #AIND-D10815「196 أبو بكر بن محمد بن إسحق بن إبرهيم بن عبد الرحمن الشرف بن التاج السلمي المناوي الشافعي … ناب في الحكم … وخطب بالجامع الحاكمي … مات في جمادى الآخرة سنة تسع」。本項のナサブ「أبي بكر بن محمد بن إبراهيم」は إسحق を一代省いた形で、兄弟項 D03857「عبد الرحيم بن أبي بكر بن محمد بن إبراهيم الجمال أبو المكارم بن الشرف ابن التاج السلمي المناوي」と完全に同型。ブリーフ既知の الشرف المناوي ＝ #AIND-D10313（يحيى بن محمد … الشرف أبو زكريا … المناوي）は別人（ナサブ不一致）であり本項には当てない。'
