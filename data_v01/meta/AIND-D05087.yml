translation:
  ja: アリー・ブン・アブー・バクル・ブン・ムハンマド・ブン・イブラーヒーム、ヌール・アッ＝ディーン・ブン・アッ＝シャラフ・アル＝マナーウィー・アル＝カーヒリー・アッ＝シャーフィイー、アル＝アスワド。前述のアブドゥッラヒームの兄弟。裁判代理官を務め、説教（フトバ）を行った。声はしわがれており、徳に欠ける人物であった。死去したが、我らがシャイフ（イブン・ハジャル）の外孫が彼にイジャーザを求めたことがあり、なぜ求めたのか私にはわからない。
  en: ʿAlī b. Abī Bakr b. Muḥammad b. Ibrāhīm, Nūr al-Dīn b. al-Sharaf al-Manāwī al-Qāhirī al-Shāfiʿī, al-Aswad. The brother of the aforementioned ʿAbd al-Raḥīm. He served as a deputy judge and preached. He had a hoarse voice and was devoid of merit. He died; the grandson of our shaykh (Ibn Ḥajar) had requested an ijāza from him, and I do not know why.
