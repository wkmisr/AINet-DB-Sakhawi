translation:
  ja: アハマド・ブン・ムハンマド・ブン・ハサブッラー・アル＝クラーシー・アル＝マッキー。イブン・アッ＝ザイームとしても知られる。父は彼が幼い頃に亡くなり、兄弟が彼の財産を横領し、失われた。その後、彼は少額の現金で補償されたが、それも使い果たし、仕立て屋として生計を立てる必要が生じた。その後、809年のジュマーダー・アル＝アーヒラ半ばにマッカで急逝し、アル＝ムアッラーに埋葬された。享年30歳余り。これはアル＝ファースィーが『マッカ史』で述べたことである。
  en: Aḥmad b. Muḥammad b. Ḥasab Allāh al-Qurashī al-Makkī, also known as Ibn al-Zaʿīm. His father died when he was young, and his brother seized his inheritance, which was lost. He was then compensated with a small amount of cash, which he also squandered, and he became in need to earn a living by tailoring. His life was cut short by death in the middle of Jumādā al-Ākhira in the year 809 in Mecca, and he was buried in al-Muʿallā, at the age of around thirty or more. This was stated by al-Fāsī in his work on Mecca.
