translation:
  ja: アリー・ブン・カルクマース・ブン・ハリーマ・アル＝マッキー、その（マッカの）ワーリー。892年ラビーウ第1月に没し、数か月後にアリー・アル＝カッターンがワーリー職で彼の後を継いだ。二人とも取るに足りない者である。
  en: ʿAlī b. Qaraqmās b. Ḥalīma al-Makkī, its (Mecca's) governor (wālī). He died in Rabīʿ I of the year 892, and some months later ʿAlī al-Qaṭṭān succeeded him in the governorship. Both of them are insignificant.
