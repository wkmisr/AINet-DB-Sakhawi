translation:
  ja: ムハンマド・ブン・バルドバク・アル＝アシュラフィー・イーナール、前述のアル＝アシュラフ（イーナール）の娘の子で、母はバドリーヤ。歴史書の閲読に熱心な者の一人で、彼のもとには異郷の者たちが集まっていた。妻であるダウラート・バーイ・アル＝ムアイヤディーの娘とは、争いといがみ合いの末に別れたが、別れを望む気持ちは彼女の方が強かった。898年ジュマーダー・アル＝ウーラー月の初日に、ナザル（監督職）が彼から取り上げられて母方の従兄弟に与えられた後、急死した。彼は評判の良い人ではなかった。
  en: Muḥammad b. Bardbak al-Ashrafī Īnāl, daughter's son of the aforementioned al-Ashraf (Īnāl); his mother was Badriyya. He was one of those who devoted themselves to reading history, and he had strangers who gathered around him. He separated from his wife, the daughter of Dawlāt Bāy al-Muʾayyadī, after quarrelling and mutual vexation, her wish for the separation being the stronger. He died suddenly on the first of Jumādā I 898, after the naẓar (supervisorship) had been taken from him and given to his maternal cousin; and he was not well spoken of.
