translation:
  ja: アブドゥルアズィーズ・ブン・ムハンマド・ブン・アブドゥッラフマーン・ブン・ムハンマド・ブン・アリー・ブン・アフマド、アル＝イッズ・ブン・アッ＝シャムス・ブン・アル＝クワイク。父と叔父のカースィムは後述される。830年頃にカイロで生まれ、そこで育ってクルアーンなどを暗記し、イブン・アサドのクッターブ（初等学校）で私（サハーウィー）としばらく机を並べた。その後、おそらく一時期織物業に携わり、次いで署名書記（タウキーウ）の職に就いてその一員となった。時には詩も詠む。
  en: ʿAbd al-ʿAzīz b. Muḥammad b. ʿAbd al-Raḥmān b. Muḥammad b. ʿAlī b. Aḥmad, al-ʿIzz b. al-Shams b. al-Kuwayk; his father and his paternal uncle Qāsim are mentioned below. He was born around 830 AH in Cairo and grew up there, memorized the Qurʾān and other texts, and was briefly my companion in the kuttāb of Ibn Asad. He then, I think, practised weaving for a time, then took up the tawqīʿ (secretarial signing) and became one of its clerks. He sometimes composes poetry.
