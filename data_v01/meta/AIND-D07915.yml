translation:
  ja: ムハンマド・ブン・アブドゥルワッハーブ・ブン・アブドゥッラー・アッ＝ズバイリー・アル＝バンハーウィー・アッ＝シャーフィイー。彼の自筆で私が読んだところでは744年に生まれた。我らがシャイフ（イブン・ハジャル）は『ムウジャム』で彼に言及し、次のように述べた。「彼はアル＝バヤーニーとイブン・アル＝カーリーほかから聴聞し、前者から聴いたものにはアル＝バイハキーの『墓中の預言者たちの生命についての一部』がある。法学に携わり、裁判の代理を務めた。穏やかで善良だが、いささか迂闊なところのある人物であった。私の息子ムハンマドの（イジャーザ）請願書にイジャーザを与えた。彼が伝承したことは私の知るところではない。」820年ラビーウ・アル＝アウワル月に没した。アル＝マクリーズィーは『ウクード』でこれ（イブン・ハジャルの記述）に従った。
  en: Muḥammad b. ʿAbd al-Wahhāb b. ʿAbd Allāh al-Zubayrī al-Banhāwī al-Shāfiʿī. He was born, as I read in his own hand, in the year 744. Our shaykh (Ibn Ḥajar) mentioned him in his Muʿjam, saying that he heard from al-Bayānī, Ibn al-Qārī and others, and that among what he heard from the first of them was al-Bayhaqī's Juzʾ Ḥayāt al-anbiyāʾ fī qubūrihim; he occupied himself with fiqh and served as deputy judge; he was a quiet, good man with some heedlessness in him; "he granted ijāza in the petition of my son Muḥammad, and I do not know that he transmitted." He died in Rabīʿ al-Awwal of the year 820, and al-Maqrīzī followed him (Ibn Ḥajar) in his ʿUqūd.
