translation:
  ja: アリー・ブン・アフマド・ブン・アリー・ブン・アブド・アル＝ムギース、ヌール・アッ＝ディーン・アン＝ナシャルティー・アル＝カーヒリー・アル＝フサイニー・アッ＝シャーフィイー。前述のアッ＝シハーブ・アフマドの父。クルアーンを読んでこれに習熟し、それによって子弟を教育した。多くの美点と敬虔さを備えていた。彼のもとで（クルアーンを）読んだ者には、彼の息子とアル＝アラー・アッ＝タズマンティーがいる。没した……（原文は途切れている）。
  en: ʿAlī b. Aḥmad b. ʿAlī b. ʿAbd al-Mughīth, Nūr al-Dīn al-Nashartī al-Qāhirī al-Ḥusaynī al-Shāfiʿī, the father of al-Shihāb Aḥmad, who was mentioned above. He read the Qurʾān, mastered it, and taught children with it, with much merit and righteousness. Among those who read under him were his son and al-ʿAlāʾ al-Tazmantī. He died ... (the text breaks off).
