translation:
  ja: アブド・アル＝ガニー・ブン・アリー・アル＝ファーリキー・アル＝ムダービギー。シャーフィイー派のクルアーン朗誦家。アッ＝タージュ・ブン・タムリーヤ、次いでアッ＝シャムス・アル＝アフスィーから諸朗誦法を学んだ。皮革なめし工場（ムダービグ）で働き、次いでサウク・アル＝ハージブ市場で、さらにウスフール小市場の店舗で公証人（シャーヒド）として生計を立て、また（クルアーンを）教えた。891年ラジャブ月に没した。私は彼をたびたび見かけた。それどころか、彼がアッ＝ザイン・アブド・アル＝ガニー・アル＝ハイサミーのイジャーザ（授権状）に証人として署名し、彼を『我らがシャイフ』と表現しているのを見た。これは儀礼的なものかもしれないが、彼がその人物のもとで朗誦（勉強）した可能性もある。
  en: ʿAbd al-Ghanī b. ʿAlī al-Fāriqī al-Madābighī, the Shāfiʿī Qur'ān reciter. He studied the variant Qur'ānic recitations under al-Tāj b. Tamurīya, and then al-Shams al-ʿAfṣī. He earned his living by working in tanneries, then in Sūq al-Ḥājib, and later as a notary witness in a shop in Suwayqat ʿUṣfūr, and he also taught. He died in Rajab, year 891 AH. I saw him frequently; in fact, I saw him witness an ijāza for al-Zayn ʿAbd al-Ghanī al-Haythamī, whom he described as 'our shaykh,' perhaps out of politeness, although it is possible he had read (studied) under him.
