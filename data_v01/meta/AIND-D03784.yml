translation:
  ja: アブドゥルラフマーン・ブン・アル＝ジャマール・ムハンマド・ブン・イーサー・ブン・ムハンマド・ブン・アブドゥッラー・アッ＝サラーミー・アッ＝ターイフィー。その父の伝記は後述される。父に先立つこと数日前、ターイフとその周辺地域で発生した疫病により、843年シャアバーン月中旬（11日〜20日）に死去した。イブン・ファハドが彼の没年を記録している。
  en: ʿAbd al-Raḥmān b. al-Jamāl Muḥammad b. ʿĪsā b. Muḥammad b. ʿAbd Allāh al-Salāmī al-Ṭāʾifī, whose father's biography is mentioned below. He died a few days before his father during a plague that struck al-Ta'if and its vicinities, in the middle ten days of Sha'ban, 843 AH. His death was recorded by Ibn Fahd.
