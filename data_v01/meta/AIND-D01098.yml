translation:
  ja: 130. アフマド・ブン・アリー・アッ＝ザフーリー。イブン・サーバという通称で知られた。マムルークに肉を運ぶ業者たちの長であった。アブー・アルファウズ・ブン・ザイン・アッ＝ディーンが彼の娘と結婚し、彼の娘婿となった。90歳近くで没した。
  en: 130. Aḥmad b. ʿAlī al-Zafūrī, known as Ibn Sāba. He was a leader among the purveyors who carried meat for the Mamluks. Abū al-Fawz b. Zayn al-Dīn became his son-in-law by marrying his daughter. He died close to ninety years old.
