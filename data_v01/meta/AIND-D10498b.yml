translation:
  ja: ユースフ・ブン・アリー・ブン・ウバイド・アッ＝サンターウィー、のちカイロ、アズハルの人、シャーフィイー派。クルアーンなどを暗記し、ザワーウィー、ザカリヤーらのもとで学び、さらに後者〔ザカリヤー〕とともに我らの師〔イブン・ハジャル〕からの聴聞に同行し、同様にザーヒリーヤでの『ブハーリー』読了会を聴聞した。善良で表裏のない人で、巡礼し、アクブガーウィーヤでイマームを務め、サイード・アッ＝スアダーの〔スーフィー職に〕就いた。とりわけ引退後は困窮を嘗め、衰弱と身体の病苦が続き、ついには失明したが、その友〔ザカリヤー〕はカーディー在任中に取り立てて言うほどのことを何もしてやらなかった。おそらく895年に70余歳で没した。
  en: Yūsuf b. ʿAlī b. ʿUbayd al-Santāwī, then Cairene, of al-Azhar, Shāfiʿī. He memorised the Qurʾān and other texts, studied with al-Zawāwī, Zakariyyā and others, and accompanied the latter in hearing from our shaykh (Ibn Ḥajar); he also attended the completion of al-Bukhārī at the Ẓāhiriyya. He was a good, single-hearted man who performed the pilgrimage, served as imam at the Aqbughāwiyya and held a post at Saʿīd al-Suʿadāʾ. He suffered poverty, especially after his retirement, with continuing weakness and bodily affliction, and went blind; his friend did nothing worth mentioning for him during his judgeship. He died, probably, in 895, aged seventy-odd.
