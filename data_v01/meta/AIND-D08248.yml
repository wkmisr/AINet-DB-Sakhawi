translation:
  ja: ムハンマド・ブン・アリー、アッ＝シャムス・アル＝カフルスースィー、説教師（ハティーブ）。我らがシャイフ（イブン・ハジャル）は『ムウジャム』で言った：クルアーンを暗記し、写字に携わった。信頼できる善良な人であったが、晩年に失明した。（8）07年ラマダーン月に没した。
  en: 'Muḥammad b. ʿAlī al-Shams al-Kafrsūsī, the preacher (khaṭīb). Our shaykh (Ibn Ḥajar) said in his Muʿjam: he memorized the Qurʾān and occupied himself with copying; he was trustworthy and good, and lost his sight late in life. He died in Ramaḍān of the year [80]7.'
