translation:
  ja: アブドゥルムジーブ・ブン・アフマド・ブン・ムハンマド・ブン・アブドゥッラフマーン。スィーディー・アフマド・アル＝バダウィーの奉仕者の一人であったアブドゥルムジーブの娘方の孫で、アル＝クライディーとして知られる。（8）62年サファル月にマカーム（廟）のシャイフ職に就いたが、ほどなく（8）64年ラビーウ・アル＝アーヒル月に若くして没した。
  en: ʿAbd al-Mujīb b. Aḥmad b. Muḥammad b. ʿAbd al-Raḥmān, daughter's son of ʿAbd al-Mujīb, one of the servants of Sīdī Aḥmad al-Badawī, and known as al-Kuraydī. He was appointed to the shaykhship of the shrine (al-maqām) in Ṣafar (8)62, but did not remain long and died young in Rabīʿ al-Ākhir (8)64.
