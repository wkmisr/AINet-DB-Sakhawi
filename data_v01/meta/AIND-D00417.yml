translation:
  ja: アハマド・ブン・アク・バラス（シン・ムフマラで終わり、もしかしたらサードに替わるかもしれない）。バルグハク・ブン・カンジャク・ブン・ナール・クムスの息子で、ムスナド・シハブ・アル＝ディーン・アル＝フワリズミ、カンジーの出自でダマスクス人、アル＝サリヒ。我らがシャイフ（イブン・ハジャル）がその目録中の「アブー・バクル・ブン・アビー・アル＝ハイサムのファワーイド」において、彼のニスバを一字ずつ区切って「ك ن ج ك ى（カンジャキー）」と正書していたのを私は見た。彼は723年に生まれた。イシャク・ブン・ヤヒヤ・アル＝アミディ、ムハンマド・ブン・アブド・アッラー・ブン・アル＝ムヒブ、ザイナブ・イブン・アル＝カマルらから聴聞し、727年にはアル＝クタニ、アル＝ダブシ、ワジーハ、イブン・アル＝カンマフ、アル＝ミジ、アル＝バルザリ、イブラヒム・ブン・ムハンマド・アル＝ワニ、その他多くのエジプトやシャム出身の人物からイジャーザを与えられた。一団の人々が彼からの伝達を我々に行った。その中にはアッ＝ザイン・シャアバーンとその従兄弟（ابن عمه）、我らがシャイフ（イブン・ハジャル）がいる（※係り受けは要検討）。シャイフは彼が善良な性格の善人であったと述べている。また、我らがシャイフたちの中ではアル＝イズ・アブド・アル＝サラム・アル＝クドシも彼から聴聞し、アル＝マクリーズィーは『ウクード』で彼に言及している。彼は（8）03年に死去した。彼の祖父については、アル＝クトゥブ・アル＝ハラビーが『ターリーフ・ミスル』で言及しており、祖父はアブド・アッ＝ダーイムから聴聞し、709年にエジプトで死去した。
  en: Aḥmad b. Āqbaras (ending with a dotted sin, which sometimes becomes a ṣād), son of Balghāq b. Kanjak b. Nār Qumas, al-Musnad Shihāb al-Dīn al-Khwārazmī, originally al-Kanjī, al-Dimashqī al-Ṣāliḥī. Our shaykh (Ibn Ḥajar) noted in the 'Fawāʾid of Abū Bakr b. Abī al-Haytham' from his index that he truncated the letters of his nisba and vocalized it as Kanjakī. He was born in the year 723 H. He heard from Isḥāq b. Yaḥyá al-Āmidī, Muḥammad b. ʿAbd Allāh b. al-Muḥibb, Zaynab bint al-Kamāl, among others. In the year 727 H, he received ijāza from al-Khatanī, al-Dabbūsī, Wajīha, Ibn al-Qammāḥ, al-Mizzī, al-Barzālī, Ibrāhīm b. Muḥammad al-Wānī, and others from among the Egyptians and Damascenes. A group transmitted from him, including al-Zayn Shaʿbān and his paternal cousin, our shaykh (Ibn Ḥajar). He (our shaykh) said that he (Aḥmad) was of good character and benevolent. Al-ʿIzz ʿAbd al-Salām al-Qudsī also heard from him among our shaykhs, and al-Maqrīzī mentioned him in his ʿUqūd. He died
    in the year [8]03. As for his grandfather, al-Quṭb al-Ḥalabī mentioned him in his Taʾrīkh Miṣr, noting that he heard from ʿAbd al-Dāʾim and died in Egypt in the year 709.
