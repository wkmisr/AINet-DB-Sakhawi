translation:
  ja: ヤフヤー・ブン・アブド・アル＝アズィーズ・アッ＝ティリムスィーニー・アル＝マグリビー。敬虔と善行で知られる家の出で、そこには彼らのザーウィヤがある。（8）74年の末、巡礼からの帰途、アル＝ジャディーダで渇きのために没し、アフマド・アル＝カラウィーの隣に葬られた。神が二人を憐れみたまわんことを。これは、我々の同輩のマグリブ人の一人が私に教えてくれたことである。
  en: Yaḥyā b. ʿAbd al-ʿAzīz al-Tilimsīnī al-Maghribī, of a house known for righteousness and goodness, who have a zāwiya there. He died at al-Jadīda on his way back from the pilgrimage, at the end of the year [8]74, of thirst, and was buried next to Aḥmad al-Qarawī, may God have mercy on them both. One of our Maghribī companions informed me of this.
