translation:
  ja: アフマド・ブン・アビー・バクル・ブン・アフマド・ブン・アッ＝タキー・スライマーン・ブン・ハムザ・ブン・アフマド・ブン・ウマル・ブン・アッ＝シャイフ・アビー・ウマル・アル＝マクディスィー・アル＝ハンバリー。アブー・ムハンマド・ブン・アル＝カイイムから、アブー・アル＝カースィム・アル＝マンビジーのハディースの一部を聴聞した。これはアル＝ファフルがマフムード・ブン・アフマドを通じて（アブー・ムハンマドから）イジャーザを得たものである。我らがシャイフ（イブン・ハジャル）が自著『ムウジャム』で彼に言及し、「彼は私にイジャーザを与えた」と述べ、没年は空白のままにした。
  en: Aḥmad b. Abī Bakr b. Aḥmad b. al-Taqī Sulaymān b. Ḥamza b. Aḥmad b. ʿUmar b. al-Shaykh Abī ʿUmar al-Maqdisī al-Ḥanbalī. He heard a part of the ḥadīth of Abū al-Qāsim al-Manbijī from Abū Muḥammad b. al-Qayyim, which al-Fakhr received from Maḥmūd b. Aḥmad on his (Abū Muḥammad's) behalf. Our shaykh (Ibn Ḥajar) mentioned him in his lexicon and stated that he granted him ijāza, leaving his death date blank.
