translation:
  ja: アブー・アッバース・アハマド・ブン・アブドゥルカーディル・ブン・アブドゥルワッハーブ・アル＝クラシー。この人物の父については後述する。 882年ドゥー・アル＝カアダの初めに生まれ、成長した。私（＝サハーウィー）は、彼に少しばかり私自身(عليّ)から、またアル＝ファトヒーから聴聞させ、それ以前にはアン＝ナシャーウィー、アッ＝リダー、アル＝アウジャーキー、アブー・アッ＝スウード・アル＝ガラーキー、その後アブドゥルガニー・アル＝バサーティーから聴講させた。また、一団の学者(جماعة)が彼にイジャーザを与えた。
  en: Aḥmad b. ʿAbd al-Qādir b. ʿAbd al-Wahhāb al-Qurashī, whose father will be mentioned later. He was born at the beginning of Dhū al-Qaʿda in the year 882 H. He grew up, and I (al-Sakhāwī) had him hear a little from me myself (ʿalayya) and likewise from al-Fatḥī. Before that, I had him attend sessions with al-Nashāwī, al-Riḍā, al-Awjāqī, and Abū al-Suʿūd al-Gharāqī, then with ʿAbd al-Ghanī al-Basāṭī. A group (of scholars) granted him ijāza.
