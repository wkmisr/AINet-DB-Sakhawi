translation:
  ja: ウマル・ブン・アフマド・ブン・ザイド・アッ＝シラージュ・アル＝ジャッラーイー・アッ＝ディマシュキー・アル＝ハンバリー。後述するアブー・バクル・ブン・ザイドの甥。（8）86年にマッカで私と会い、『ブハーリー』などの読誦と諸々の聴聞において私に師事した。それ以前にも叔父とともに隣住（ムジャーワラ）しており、叔父の読み上げによってムスニドのナジュム・ウマル・ブン・ファハドから聴聞していた。
  en: ʿUmar b. Aḥmad b. Zayd al-Sirāj al-Jarrāʿī al-Dimashqī al-Ḥanbalī, the nephew of Abū Bakr b. Zayd (mentioned below). He met me in Mecca in the year (8)86 and attended me closely in the reading of al-Bukhārī and other works and in hearing various things. Before that he had already resided as a mujāwir together with his uncle and, through the latter's recitation, heard from the musnid al-Najm ʿUmar b. Fahd.
