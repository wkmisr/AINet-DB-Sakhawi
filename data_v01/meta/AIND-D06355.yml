translation:
  ja: クトルブガー・ハッジー・アル＝バーンクースィー、アッ＝ザーヒル・タタルの舅。アル＝アシュラフ・バルスバーイの時代にしばらくワクフ監督職（ナザル・アル＝アウカーフ）を務め、極めて峻烈に執務したが、のちに態度が和らぎ、やがて罷免された。837年サファル月25日の土曜に没した。我らがシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Quṭlūbughā Ḥājjī al-Bānqūsī, father-in-law of al-Ẓāhir Ṭaṭar. He held the supervision of the endowments (naẓar al-awqāf) for a period in the days of al-Ashraf Barsbāy; he administered it with great severity, then his temper softened, and then he was dismissed. He died on Saturday, the 25th of Ṣafar of the year 837. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
