translation:
  ja: アフマド・アッ＝シハーブ・アル＝マダニー。アン＝ナッシャールとしても知られる。カイロにたびたび出入りし、そこに滞在することが多かった。878年、ジッダ副総督とともに帰路につく途中、ヤンブーで殺害されたが、悼まれることはなかった。
  en: Aḥmad al-Shihāb al-Madanī, also known as al-Nashshār. He frequented Cairo and often resided there. In the year 878 H he was killed at Yanbuʿ while returning with the deputy of Jidda, and his death was not mourned.
