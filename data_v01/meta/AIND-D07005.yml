translation:
  ja: ムハンマド・ブン・アフマド・ブン・マイズ、アッ＝シャムス・アル＝マクディスィー、スーフィー、商人。〔8〕96年サファル月17日、ダマスクスからの帰途にラムラで没し、エルサレムに運ばれてマーミッラーに埋葬された。その葬儀は盛大であった。彼はアル＝ジャマール・ブン・ジャマーアから聴聞した者の一人で、カーディーのサアドゥッディーン・ブン・アッ＝ディーリー、アッ＝シャリーフ・アン＝ナッサーバ、アッ＝シハーブ・アッ＝サカンダリー・アル＝ムクリー、そしてイブン・ジャマーアの娘サーラが彼にイジャーザを与えた。彼は礼拝に熱心で、アクサー・モスクでの集団礼拝を欠かさなかった。神が彼に慈悲を垂れたまわんことを。
  en: Muḥammad b. Aḥmad b. Mayz, al-Shams al-Maqdisī, the Sufi, the merchant. He died on 17 Ṣafar [8]96 in al-Ramla while returning from Damascus; he was carried to Jerusalem and buried in Māmillā, and his funeral was well attended. He was among those who heard from al-Jamāl b. Jamāʿa, and al-Qāḍī Saʿd al-Dīn b. al-Dīrī, al-Sharīf al-Nassāba, al-Shihāb al-Sakandarī the Qurʾān reciter, and Sāra the daughter of Ibn Jamāʿa granted him ijāza. He was much given to worship and constant in attending congregational prayer at al-Masjid al-Aqṣā. May God have mercy on him.
