translation:
  ja: ムハンマド・ブン・タイブガー、アッ＝シャムス・アル＝カーヒリー・アル＝ハナフィー。学問に励み、アッ＝ザイン・カースィム・アル＝ハナフィーに師事して離れなかった。私（サハーウィー）のもとで『アル＝カウル・アル＝バディーウ』と『イルティヤーフ・アル＝アクバード』、そのほかの私の著作やその他の書を読んだ。それ以前には、我らがシャイフ（イブン・ハジャル）、アル＝バドル・アル＝アイニーおよび一群の人々から聴聞していた。自筆で多くを書写した。生涯、公証人（シャハーダ）として生計を立て、アミール・フサインの橋（カンタラ）の近くに家を建て、彼と相棒はその門口に座っているのが常であったが、その証言業務において傑出しても正確でもなかった。［ヒジュラ暦8］84年に没した。神が彼を憐れみ、赦したまわんことを。
  en: Muḥammad b. Ṭaybughā, al-Shams al-Qāhirī al-Ḥanafī. He devoted himself to study and kept close company with al-Zayn Qāsim al-Ḥanafī. He read to me al-Qawl al-badīʿ and Irtiyāḥ al-akbād and other works of mine, as well as other works; before that he had heard from our shaykh (Ibn Ḥajar), al-Badr al-ʿAynī and a group of others, and he copied a great deal in his own hand. He earned his living by notarial witnessing all his life, built a house near Qanṭarat Amīr Ḥusayn, and he and his companion used to sit at its door; but he was neither outstanding nor accurate in his attestations. He died in the year [8]84, may God have mercy on him and pardon him.
