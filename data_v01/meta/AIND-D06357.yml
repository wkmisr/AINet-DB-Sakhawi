translation:
  ja: クトルブガー・アル＝アラー・アッ＝タナミー、（主人は）シャームの副王タナム・アル＝ハサニー。アル＝ムアイヤドは、彼がタナムの死後にその娘の夫であったことから彼を引き立て、ついにはムカッダム（千人隊アミール）とし、次いで822年シャウワール月にサファドの副知事職を与えた。彼はタタルのもとに参上するまでその職にとどまり、タタルは彼に留任の名誉衣を授けた。その後罷免され、ダマスクスで無任のまま過ごし、826年ラビーウ・アル＝アウワル月に同地で没した。
  en: Quṭlūbughā al-ʿAlāʾ al-Tanamī, (mamlūk of) Tanam al-Ḥasanī, viceroy of Syria. Al-Muʾayyad promoted him, because he had been the husband of Tanam's daughter after the latter's death, until he made him a muqaddam (commander of a thousand), and then gave him the deputy governorship of Ṣafad in Shawwāl 822. He remained in it until he presented himself before Ṭaṭar, who bestowed on him a robe of honour confirming him in the post. He was then dismissed and lived in Damascus without office until he died there in Rabīʿ al-Awwal 826.
