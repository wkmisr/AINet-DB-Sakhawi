translation:
  ja: ライハーン・アル＝アダニー。アッ＝ルマイディーとして知られる。裕福で礼拝に熱心であり、善性と信仰心を持っていた。何度もマッカを往復し、そこに没するまで連続して3年間ほど隣住（ジャーワラ）した。810年ズー・アル＝ヒッジャ月にマッカで没し、アル＝ムアッラー墓地に埋葬された。アル＝ファースィーがマッカに関する著作で彼について言及している。
  en: Rayḥān al-ʿAdanī, known as al-Rumaydī. He was wealthy and devout, possessing goodness and piety. He frequented Mecca more than once, and performed jawarah (extended stay) there for about three years continuously until his death. He died in Dhu al-Hijjah, in the year 810 AH, in Mecca and was buried in al-Muʿallā. Al-Fāsī mentioned him in his work on Mecca.
