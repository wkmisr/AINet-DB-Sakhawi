translation:
  ja: ザイナブ・ビント・アル＝ジャラール・アブド・アッ＝ラフマーン・ブン・アッ＝スィラージュ・ウマル・ブン・ルスラーン・ブン・ナスィール〔・アル＝ブルキーニー〕。母は父方がトルコ系の女性。820年より前、817年とも言われる年に生まれ、叔父〔バドル〕の孫ワリー〔・ッディーン〕・アフマド・ブン・アッ＝タキー・ムハンマド・ブン・アル＝バドル・ムハンマド・ブン・アッ＝スィラージュが彼女を娶り、次いでアフマド・アッダード・アル＝ガナム（羊数え人）が娶った。最初の夫からは寵愛と栄誉を受けたが、その恩恵を大切にしなかったため、彼の後には大した幸運に恵まれなかった。巡礼してマッカに滞在し、シリアに入り、ハイル・ッディーン・アブー・ル＝ハイル・イブン・アル＝ビサーティーと結婚して過度の愛情を注いだが、彼は反対の態度であった。同様にアッバーディーとイブラーヒーム・アル＝アジュルーニーも彼女を娶ったが、いずれも早々に離別した。幾度も巡礼した。今は老いて弱り、視力が衰え、祖父の学院に籠っているが、いっそう清らかで軽やかに、善と善人を慕っている。896年ラビーウ第1月の半ばに没し、ハーキム・モスクで葬礼が営まれた後、ブルキーニー学院の姉妹ハディージャのそばに葬られた。神が彼女と我々を憐れみたまえ。
  en: Zaynab, daughter of al-Jalāl ʿAbd al-Raḥmān b. al-Sirāj ʿUmar b. Ruslān b. Naṣīr (al-Bulqīnī); her mother was Turkish on her father's side. Born before 820, it is said in 817, she was married to her uncle's grandson al-Walawī Aḥmad b. al-Taqī Muḥammad b. al-Badr Muḥammad b. al-Sirāj, and to Aḥmad the sheep-counter. From the first she enjoyed favour and honour, but she did not cherish that blessing and gained nothing much after him. She performed the pilgrimage and resided in Mecca, entered Syria, married Khayr al-Dīn Abū al-Khayr Ibn al-Bisāṭī, whom she loved excessively while he was the opposite with her; likewise al-ʿAbbādī and Ibrāhīm al-ʿAjlūnī married her, and each soon parted from her. She made the pilgrimage more than once. Now she has grown old and frail, her sight weak, secluded in her grandfather's madrasa, with ever more purity, lightness and love of goodness and its people. She died in mid-Rabīʿ I 896; prayers were said over her at the mosque of al-Ḥākim, and she was buried
    beside her sister Khadīja in the Bulqīniyya madrasa.
