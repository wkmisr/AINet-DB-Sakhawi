translation:
  ja: レイハーン・アル＝ハバシー・アル＝タアクリー。アル＝ジャマール・ムハンマド・ブン・ウマル・ブン・マスウード・アル＝タアクリー（アリー、およびムハンマド・ブン・ハサン・アッ＝サーイグの妻ザイナブ、そしてアブー・バクル・ブン・アブドゥルガニー・アル＝ムルシディーらの母であるウム・ハーニーの父）の解放奴隷。ダール・アル＝ハフラに一邸、またハッラーズィーン（革職人街）のシハーブ・カーワーン邸の向かいに一邸の家を所有していた。ヒジュラ暦826年にマッカで没した。
  en: Rayḥān al-Ḥabashī al-Taʿkarī. He was the freed slave (ʿatīq) of al-Jamāl Muḥammad b. ʿUmar b. Masʿūd al-Taʿkarī, who was the father of ʿAlī, Zaynab (the wife of Muḥammad b. Ḥasan al-Ṣāʾigh), and Umm Hānī (the mother of Abū Bakr b. ʿAbd al-Ghanī al-Murshidī and others). Rayḥān owned a house in Dār al-Khafrah and another facing the house of al-Shihāb Qāwān in al-Kharrāzīn. He died in Mecca in the year 826 AH.
