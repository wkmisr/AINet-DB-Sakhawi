translation:
  ja: アブジャドは、「マジズーブ」の男であった。彼はバイタル・マクディスからマッカへ、アル＝ザイン・アブド・アル＝カーディル・アル＝ナワウィ・アル＝マクディスィーの同伴のもと、頻繁に移動し、彼の配慮から恩恵を受けた。私は彼がいつ亡くなったか知らない。
  en: Abjad was a majdhūb man. He frequently traveled from Bayt al-Maqdis to Mecca in the company of al-Zayn ʿAbd al-Qādir al-Nawawī al-Maqdisī, and he benefited from his attention. I do not know when he died.
