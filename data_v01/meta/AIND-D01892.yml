translation:
  ja: アズダマル・アル＝ナーシリー。このニスバは彼を連れて来た奴隷商（ジャーリブ）のナーシル・アッ＝ディーンに由来する。アッ＝ザーヒリー・バルクーク（バルクークのマムルーク）。カイロの指揮官（ムカッダム）および騎士の一人。824年に消息を絶った。
  en: Azdāmir al-Nāṣirī — the nisba derives from his importer (jālib) Nāṣir al-Dīn — al-Ẓāhirī Barqūq (mamluk of al-Ẓāhir Barqūq). He was one of the *muqaddams* and knights of Cairo. He disappeared in the year 824 AH.
