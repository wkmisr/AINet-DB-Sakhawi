translation:
  ja: ムハンマド・ブン・サラーマ・アル＝ハナフィー。イブン・スィッディークとイブン・ザヒーラから聴聞した。彼は既述のイブン・アビー・バクル・ブン・ムハンマド・ブン・ウスマーン・ブン・アフマド・ブン・ウマル・ブン・サラーマ〔その人〕であり、遠祖〔サラーマ〕にちなんで呼ばれているようである。
  en: Muḥammad b. Salāma al-Ḥanafī. He heard from Ibn Ṣiddīq and Ibn Ẓahīra. He seems to be Ibn Abī Bakr b. Muḥammad b. ʿUthmān b. Aḥmad b. ʿUmar b. Salāma, mentioned above, being named after his remote ancestor.
