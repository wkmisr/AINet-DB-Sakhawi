  ja: ムハンマド・ブン・アル＝ハワージャー・イブラーヒーム・ブン・ムバーラクシャー・ブン・アブドゥッラー・アル＝アスアルディー・アッ＝ディマシュキー。世紀の初め、あるいはその前の世紀の末に生まれた。51年の初めにダマスクスで没した。アル＝ビカーイーが、それだけを述べた。
  en: Muḥammad b. al-Khawājā Ibrāhīm b. Mubārakshāh b. ʿAbd Allāh al-Asʿardī al-Dimashqī. He was born at the beginning of the century or at the end of the one before it, and died at the beginning of the year 51 in Damascus. Al-Biqāʿī said this, without anything further.
