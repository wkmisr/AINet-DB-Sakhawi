translation:
  ja: アリー・ブン・ムハンマド・ブン・アビー・バクル、ヌール・アッ＝ディーン、アブー・アル＝ハサン・アル＝ハーンキー、クッラー（クルアーン朗誦家）、シャーフィイー派、盲目。イブン・キシュタークとして知られる。アッ＝ザイン・ジャアファル・アッ＝サンフーリーから諸読誦（キラーアート）を修めた者の一人で、私（サハーウィー）のもとに足繁く通い、聴聞した。
  en: ʿAlī b. Muḥammad b. Abī Bakr, Nūr al-Dīn Abū al-Ḥasan al-Khānkī, the Qurʾān reciter, Shāfiʿī, blind, known as Ibn Qishtāq. He was among those who took the Qurʾānic readings (qirāʾāt) from al-Zayn Jaʿfar al-Sanhūrī, and he frequented me (al-Sakhāwī) and heard from me.
