translation:
  ja: ファウワーズ・ブン・アキール・ブン・ムバーラク・ブン・ルマイサ・ブン・アビー・ヌマイイ・アル＝ハサニー・アル＝マッキー。（8）20年ラマダーン月に、従兄弟たちやその他のシャリーフやカーイド（隊長）たちとともにマッカを襲撃した者の一人で、その日に殺された。おそらく20代であった。ワーディー・ナフラのアル＝ムバーラク村の人々に対してしばしば横暴をはたらき、負担を課していた。アル＝ファースィーが彼に言及している。
  en: Fawwāz b. ʿAqīl b. Mubārak b. Rumaytha b. Abī Numayy al-Ḥasanī al-Makkī. He was among those who raided Mecca together with his cousins and other sharīfs and commanders (quwwād) in Ramaḍān of the year [8]20, and he was killed on that day, being, it is thought, in his twenties. He frequently tyrannised the people of the village of al-Mubārak in Wādī Nakhla and imposed burdens on them. Al-Fāsī mentioned him.
