translation:
  ja: アブド・アッ＝ラティーフ・ブン・アフマド・ブン・ジャール・アッラー・ブン・ザーイド・アッ＝スンブスィー・アル＝マッキー。前述のアブド・アル＝アズィーズの父。アッ＝ザイン・ブン・アビー・バクル・アル＝マラーギーに『アル＝ムサルサル』と両『サヒーフ』の結講（ハトム）を読んだ。インドやイエメンなどの国々へ商用で旅した者の一人。864年シャウワール月に、インドのカンバーヤ管区のフーカで没した。
  en: ʿAbd al-Laṭīf b. Aḥmad b. Jār Allāh b. Zāʾid al-Sunbusī al-Makkī, father of ʿAbd al-ʿAzīz mentioned above. He read to al-Zayn b. Abī Bakr al-Marāghī al-Musalsal and the concluding sessions of the two Ṣaḥīḥs. He was among those who travelled for trade to lands such as India and Yemen. He died in Shawwāl of the year 864 at Fūqa, in the district of Cambay (Kanbāya) in India.
