translation:
  ja: ジャッシャール・ブン・カースィム。バヌー・アビー・ヌマイ（アル=ハサニー・アル=マッキー）の出身。アシュラーフの有力者の一人であり、勇敢であった。アダーヒルの日にカビーシュとの一騎打ちに進み出て、カビーシュが（彼の）馬の脚を斬った。811年ズー・アル=ヒッジャ月にメッカで没し、アル=ムアッラーに葬られた。アル=ファースィーが『メッカ史』で彼に言及している。
  en: 'Jashshār b. Qāsim, of the Banū Abī Numayy, al-Ḥasanī al-Makkī. He was among the prominent ashrāf and courageous: he rushed forward to duel Kabīsh on the day of Adākhir, and Kabīsh hamstrung his horse. He died in Dhū al-Ḥijja 811 H in Mecca and was buried at al-Muʿallā. Al-Fāsī mentioned him in his history of Mecca.'
