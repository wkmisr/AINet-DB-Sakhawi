translation:
  ja: アフマド・アッ＝シハーブ・アル＝ハラビー、後にアッ＝ディマシュキー。ダマスカスの（ウマイヤ）モスクの首席ムアッズィン（ライース・アル＝ムアッズィニーン）。859年ジュマーダー・アル＝ウーラー月5日に同地で急死した。天文学（イルム・アル＝ハイア）に卓越しており、ダマスカスには彼に匹敵する者が残らなかった。彼の後任として、その首席職にシャムス・アッ＝ディーン・アル＝ヒムスィーが就いた。
  en: Aḥmad al-Shihāb al-Ḥalabī, then al-Dimashqī, chief muezzin of its (Damascus's) mosque. He died there suddenly on the 5th of Jumādā al-Ūlā in the year 859 H. He had a profound command of astronomy, and no one comparable to him was left in Damascus in that field. Shams al-Dīn al-Ḥimṣī succeeded him in the leadership.
