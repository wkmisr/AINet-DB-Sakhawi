translation:
  ja: アブドゥルラフマーン・ブン・ムハンマド・ブン・アリー・アッ＝ザイン・アッ＝サルウィー・アル＝マディーニー・アッ＝シャーフィイー。私（サハーウィー）のもとで『ヌフバ（・アル＝フィクル）』とその注釈書を朗読した者の一人であり、少しの間勉学に励んで理解を深め、善良さと誠実さをもって児童の教育に携わった。視力が衰え、ついには失明した。彼はサイード・アッ＝スアダー・ハーンカーのスーフィーの一人である。
  en: Abd al-Rahman bin Muhammad bin Ali al-Zayn al-Sarwi al-Madini al-Shafi'i. He was among those who read to me (al-Sakhawi) 'Nukhbat al-Fikr' and its commentary. He studied for a short while, understood well, and undertook the education of children with goodness and righteousness. His vision weakened, and he eventually became blind. He was one of the Sufis of Sa'id al-Su'ada.
