translation:
  ja: ターヒル・アル＝ファキーフ。ウースマーン・ブン・アブー・バクル・ブン・ウマル・アル＝ナーシリーの子孫。祝福された人物で、集団礼拝を欠かさず、善行を積み、自らの手で稼いで生計を立てていた。ヒジュラ暦840年にザビードで没した。
  en: Ṭāhir al-Faqīh, from the descendants of ʿUthmān ibn Abī Bakr ibn ʿUmar al-Nāshirī. A blessed man, regular in congregational prayers, pursuing good deeds, and eating from the work of his own hand. He died in the year 840 AH in Zabīd.
