translation:
  ja: ムハンマド・ブン・アフマド・ブン・ハワージャー、アル＝ハマウィー、のちアル＝ミスリー、仕立屋。アル＝ヒラーティーの継子で、彼に聴聞した。伝承を行ない、アッ＝タキー・アル＝ファースィーと私たちの師（イブン・ハジャル）が彼から聴聞した。師はその『ムウジャム』で彼に言及し、ほかの人々も言及している。私の考えでは（80）7年に没した。
  en: Muḥammad b. Aḥmad b. Khawājā, al-Ḥamawī then al-Miṣrī, the tailor, stepson of al-Khilāṭī, from whom he heard. He transmitted; al-Taqī al-Fāsī and our shaykh (Ibn Ḥajar) heard from him, and the latter mentioned him in his Muʿjam, as did others. He died in the year [80]7, as I reckon.
