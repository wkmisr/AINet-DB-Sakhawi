translation:
  ja: アリー・ブン・ムハンマド・ブン・アブド・アッ＝ラフマーン、ヌール・アッ＝ディーン・アッ＝サフラジュティー・アル＝カーヒリー・アッ＝シャーフィイー。我らがシャイフ（イブン・ハジャル）は『インバー』で言う。「841年シャウワール月に70歳ほどで没した。善行で知られ、古参のシャーフィイー派の一人で、証人業（シャハーダ）で生計を立てた者の一人であった。神よ彼を憐れみたまえ」。
  en: 'ʿAlī b. Muḥammad b. ʿAbd al-Raḥmān, Nūr al-Dīn al-Ṣahrajtī al-Qāhirī al-Shāfiʿī. Our shaykh (Ibn Ḥajar) said in his Inbāʾ: "He died in Shawwāl of the year 841, aged about seventy. He was known for goodness, one of the old-guard Shāfiʿīs, and among those who earned their living as a professional witness (shahāda). May God have mercy on him."'
