translation:
  ja: カーンバーイ・アル＝ハサニー・アッ＝ザーヒリー、十人隊アミールの一人でカイロのワーリー。彼はアル＝アシュラフ・イーナールの解放奴隷の一人であった。ワーリー職を最悪の仕方で執行し、873年ラマダーン月にペストで没した。
  en: Qānbāy al-Ḥasanī al-Ẓāhirī, one of the amīrs of ten and wālī of Cairo. He was one of the freedmen of al-Ashraf Īnāl. He exercised the office of wālī in the worst possible manner, and died of the plague in Ramaḍān of the year 873.
