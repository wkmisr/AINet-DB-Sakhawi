translation:
  ja: アブドゥッラー・ブン・アブドゥルカーディル・ブン・アブドゥルカーディル・アッ＝タラーブルスィー、イブン・アル＝ハッバールとして知られる。ヒジュラ暦775年頃にタラーブルス（トリポリ）で生まれ、ムハンマド・ブン・アリー・アル＝ユーニーニー、シャリーフのムハンマド・ブン・ムハンマド・ブン・イブラーヒーム・アル＝フサイニー、ムハンマド・ブン・ムハンマド・ブン・アフマド・アル＝ジャルディーから『サヒーフ』を聴聞した。彼らはいずれもアル＝ハッジャールから聴聞によって伝えていた。彼は（ハディースを）伝え、優れた学者たちが彼から聴聞した。850年頃に没した。
  en: ʿAbd Allāh b. ʿAbd al-Qādir b. ʿAbd al-Qādir al-Ṭarābulusī, known as Ibn al-Ḥabbāl. He was born approximately in the year 775 in Tripoli and heard the Ṣaḥīḥ from Muḥammad b. ʿAlī al-Yūnīnī, the Sharīf Muḥammad b. Muḥammad b. Ibrāhīm al-Ḥusaynī, and Muḥammad b. Muḥammad b. Aḥmad al-Jardī, all of them transmitting it by audition from al-Ḥajjār. He transmitted ḥadīth, and the eminent scholars heard from him. He died close to the year 850.
