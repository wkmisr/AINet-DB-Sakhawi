translation:
  ja: スードゥン・アル＝バルダバキー・アッ＝ザーヒリー・バルクーク。彼（バルクーク）の年少のマムルークの一人。アル＝ムアイヤド・シャイフの没後に十人隊長（アミール・アシャラ）に任じられた。その後、アッ＝ザーヒル・ジャクマクによってドミヤートの副王（ナーイブ）に任命され、そこに留まり850年に没した。忌むべき行為や淫らな行いからは身を慎んでいたが、国事においては怠惰であった。
  en: Sūdūn al-Bardabakī al-Ẓāhirī Barqūq. He was one of the junior mamluks of al-Ẓāhir Barqūq. He was promoted to amir of ten after the death of al-Muʾayyad Shaykh, and was later appointed as the vicegerent (nāʾib) of Damietta by al-Ẓāhir Jaqmaq, remaining in this post until his death in 850 AH. He was chaste, avoiding abominations and illicit relations, but was negligent in state affairs.
