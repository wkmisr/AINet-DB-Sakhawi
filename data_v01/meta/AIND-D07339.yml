translation:
  ja: ムハンマド・ブン・ハサン・ブン・アビー・バクル・ブン・マンスール、アッ＝シャムス・アル＝ファーリキー・アッ＝サッラーウィー。薬種商アッ＝シャムス・アッ＝サマルカンディーの継子。その（継父の）ティムールのもとでの威望により、この伝記の主も動乱（フィトナ）の時期に威望を得た。だが（ティムールが／彼が）ダマスクスを去ると、捕らえられ懲罰を受け、803年ラジャブ月に死に至った。我らのシャイフ（イブン・ハジャル）が『インバー』で彼に言及している。
  en: Muḥammad b. Ḥasan b. Abī Bakr b. Manṣūr, al-Shams al-Fāriqī al-Sallāwī, the stepson of al-Shams al-Samarqandī the druggist (al-ʿAṭṭār). Owing to the latter's standing with Timur, the subject of this entry also acquired standing in the days of the turmoil (fitna); but when he (Timur, or the subject) departed from Damascus, he was seized and punished until he died, in Rajab 803. Our shaykh (Ibn Ḥajar) mentioned him in his Inbāʾ.
